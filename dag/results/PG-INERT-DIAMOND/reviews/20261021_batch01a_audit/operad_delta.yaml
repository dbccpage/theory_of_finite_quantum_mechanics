counterexamples:
- id: same_inscription_different_structure
  statement: Histories [supply <>] and [supply <>, admit d, admit s] have the same supply subsequence;
    the first has no coproduct structure, the second has it (tokens d, s classified Difference, Structure).
  scope: Instance (Fin 3), Lean inscription_does_not_determine_coproduct.
- id: coproduct_without_inscription
  statement: The history [admit d, admit s] reaches coproduct structure with no supply of <>; the rooted
    replay of the Rust construction refuses it (MissingLiteralRoot).
  scope: Instance (Fin 3), Lean coproduct_without_inscription.
- id: semantic_supply_moves_state
  kind: semantic_near_miss
  rationale: Claim a history of mentions alone leaves the empty state; here all but one nonempty supply-only
    history is said to move it (inertness is the L1 rule).
  rejected_by: check_candidate
- id: semantic_inscription_implies_coproduct
  kind: semantic_near_miss
  rationale: Claim every history that inscribes <> reaches coproduct structure, i.e. read the inscription
    as the root Real_0 = Difference + Structure.
  rejected_by: check_candidate
- id: semantic_coproduct_requires_inscription
  kind: semantic_near_miss
  rationale: Claim coproduct structure needs a supply of <>; the unrooted model reaches it by admitting
    two channel data alone (the Rust replay then refuses such a history for lacking the root event).
  rejected_by: check_candidate
- id: semantic_root_admission_gives_coproduct
  kind: semantic_near_miss
  rationale: Claim admitting <> itself already yields both channels; one admitted token carries one class.
  rejected_by: check_candidate
- id: semantic_mention_count_matters
  kind: semantic_near_miss
  rationale: Claim an extra leading mention of <> changes the outcome for many histories; under the model
    rule it changes none.
  rejected_by: check_candidate
- id: semantic_inertness_is_spelling
  kind: semantic_near_miss
  rationale: Claim a leading mention of <> is inert under every step rule because of how it is spelled;
    under the rival rule (supply admits) it changes the outcome.
  rejected_by: check_candidate
- id: semantic_rooted_replay_accepts_everything
  kind: semantic_near_miss
  rationale: 'Ignore the requirement that the first event be the supply of <>: count every unrefused history
    as rooted.'
  rejected_by: check_candidate
- id: semantic_readmission_duplicates
  kind: semantic_near_miss
  rationale: Count states as if re-admission of an admitted datum duplicated it (law L6 chooses designation),
    inflating the reachable states.
  rejected_by: check_candidate
- id: semantic_root_supply_invisible_to_rooted
  kind: semantic_near_miss
  rationale: Claim the leading supply of <> is invisible to the rooted outcome; omitting it turns an accepted
    history into a refusal (MissingLiteralRoot), so it is an admission precondition, not inert.
  rejected_by: check_candidate
- id: semantic_rooted_gate_is_vacuous
  kind: semantic_near_miss
  rationale: Claim every history accepted by the unrooted model is accepted by the rooted replay; the
    rooted gate refuses all histories not beginning with the supply of <>, including the empty one.
  rejected_by: check_candidate
- id: semantic_later_supply_changes_rooted_outcome
  kind: semantic_near_miss
  rationale: Claim that supplies after the root can change the rooted outcome; only the first supply is
    a precondition, later ones are inert.
