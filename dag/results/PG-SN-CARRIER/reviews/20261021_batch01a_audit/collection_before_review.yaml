      education SnCarrier is described as corrected in Pre-Genesis §10 but as defective in the 001_sn_mssn
      ledger (WDP-P001-019).
    source_scope_review: 'Read SnCarrier.lean (sha256 357376de..., byte-identical to the education copy,
      so the two sources named in the DAG are the same bytes), SnTheorems.lean, SnOffImage.lean and SnCarrierDischarge.lean,
      and compiled the pinned files: old_image_base reports propext, Classical.choice, Quot.sound under
      Lean 4.35.0, so the recorded Classical.choice assumption is confirmed for the source proof, while
      the re-proof here needs propext only. The ledger disagreement WDP-P001-019 resolves as follows:
      the pinned SnCarrier is the restricted model (lift only on the five base shapes), the defects named
      in SnCarrierDischarge are witnessed on a definition local to that file (unconstrainedSectionLift)
      and on a separate inductive (UnrepairedCarrier), so both statements are about different objects.
      The advertised cardinalities are a declared table (carrierCard, docstring: declared, not source-derived),
      related to the lift by no theorem; the node bottleneck is therefore correct that they are not established,
      and this node shows that they differ from the cardinality the model has. SnSyntax.lean (sha256 fe6292be056e3e853a77f2f0553491cad6255a6edbf8cdfca6e98e3d277575e0)
      was read from the external checkout to match the restatement clause by clause (Glyph, tokens, InnerBody,
      SnPresentation) but is not among the run inputs; it is a source for the restated types only. The
      custody successor mssn_functor_bridge.rs (sha256 b2f52637..., header-only change) was read: it holds
      string metadata only and no mathematical declaration, and is not used. The sealed batch 20261020T000351Z_prompts_132_151
      was not modified.'
