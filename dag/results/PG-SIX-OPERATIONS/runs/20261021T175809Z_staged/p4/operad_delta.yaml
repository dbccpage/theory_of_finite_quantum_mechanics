checked_compositions:
- outer_operation: retain
  input_slot: 0
  inner_operation: admit
  colour_match: HostState
  hypothesis_match: Host state = (mentioned, supplied, designated, admitted, retained, outputs); one item
    per operation; Retain and Operate act only on admitted items. This is a declared definitional model,
    not the Genesis event semantics.
  licensing_relations:
  - non_admit_ops_preserve_admitted
  - admit_changes_iff_new_item
  evidence_status: Kernel and native (retain after admit succeeds)
failed_compositions:
- composition: retain(supply(s, t), t)
  reason: Retain acts only on admitted items; a supplied but unadmitted item is refused, so retention
    does not follow from supply (Reading L).
- composition: operate(designate(s, t), t)
  reason: Designation does not admit; Operate on a merely designated item is refused.
counterexamples:
- id: supply_is_admit_collapses_readings
  statement: If Supply also admits, readings L and F reach the same admitted state; with six operations
    they differ by one Admit.
  scope: Kernel theorems for every token (two-machine comparison); native reading records.
- id: counter_model_overcounts
  statement: The source counter increments at every Admit; admitting the same item twice gives a set of
    size 1.
  scope: Instance (repeated_admit_does_not_grow_set).
- id: designate_is_retain
  statement: With Designate also retaining, two admitted designations leave both retained, while six operations
    leave none retained and one designated.
  scope: Instance with items 0, 1.
- id: semantic_admit_including_supply_collapses
  kind: semantic_near_miss
  rationale: Claim the readings also collapse when Admit additionally supplies; admitting a token that
    was supplied or not still separates the readings, because Reading L never admits.
  rejected_by: check_candidate
- id: semantic_operate_admission_not_visible
  kind: semantic_near_miss
  rationale: Claim a model in which Operate also admits leaves the admitted component alone; the admitted
    set then contains the operated item.
  rejected_by: check_candidate
- id: semantic_designate_equals_admit
  kind: semantic_near_miss
  rationale: Declare Designate and Admit indistinguishable; they write different components (designated
    versus admitted).
  rejected_by: check_candidate
- id: semantic_supply_also_admits
  kind: semantic_near_miss
  rationale: 'Read delivery of a payload as adoption: supply would then write the admitted component,
    the conflation the six-operation list forbids.'
  rejected_by: check_candidate
- id: semantic_readings_collapse_in_six_ops
  kind: semantic_near_miss
  rationale: Claim Readings L and F end in the same admitted state even when Supply and Admit are kept
    distinct; they differ by exactly one Admit.
  rejected_by: check_candidate
- id: semantic_repeated_admit_counts_as_change
  kind: semantic_near_miss
  rationale: 'Take the source counter model (every Admit increments) for the set model: re-admitting an
    already admitted item changes nothing in the set.'
  rejected_by: check_candidate
- id: semantic_designate_retain_conflation_admits
  kind: semantic_near_miss
  rationale: Claim that merging designation with retention touches the admitted component; it only turns
    an overwritable designation into a permanent retained item.
  rejected_by: check_candidate
- id: semantic_retain_needs_no_admission
  kind: semantic_near_miss
  rationale: Let Retain succeed on an item that was never admitted; retaining preserves an ADMITTED object.
  rejected_by: check_candidate
- id: semantic_operate_writes_admitted
  kind: semantic_near_miss
  rationale: Let Operate write the admitted component; its result stays in outputs until an explicit Admit.
  rejected_by: check_candidate
- id: semantic_retain_equals_operate
  kind: semantic_near_miss
  rationale: Declare Retain and Operate indistinguishable; they differ once an item is admitted (retained
    versus outputs).
  rejected_by: check_candidate
- id: semantic_mention_equals_supply
  kind: semantic_near_miss
  rationale: Declare Mention and Supply indistinguishable; they write different components (mentioned
    versus supplied).
  rejected_by: check_candidate
- id: semantic_admission_never_changes_state
  kind: semantic_near_miss
  rationale: Claim no trace from the empty state changes the admitted set although every trace with an
    Admit does.
  rejected_by: check_candidate
