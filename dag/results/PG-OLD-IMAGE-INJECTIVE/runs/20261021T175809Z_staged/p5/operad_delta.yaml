checked_compositions:
- outer_operation: typed_recovery
  input_slot: 0
  inner_operation: lift
  colour_match: NewTerm
  hypothesis_match: 'Types A, B, E (finite only for the counting relations), a lift u : A -> B and r :
    B -> A + E with r(u a) = inl a for every a; nothing is assumed off the image of u.'
  licensing_relations:
  - old_image_law
  - old_image_law_implies_injective
  - law_count
  evidence_status: Kernel and native
failed_compositions:
- composition: lift o typed_recovery as a map B -> B
  reason: 'Not a map: the refusal summand of A + E has no image under u (source paper, section 10); a
    partial composite exists only on the non-refused part.'
- composition: old_image applied to typed_recovery to conclude refusal
  reason: The law constrains r only on the image of u; off the image r is free, so refusal does not follow
    (kernel off_image_not_implied_general).
counterexamples:
- id: off_image_accepts
  statement: 'u : Fin 1 -> Fin 2 constant 0; r = (0 -> inl 0, 1 -> inr ()) and r2 = constant inl 0 both
    obey the law; r2 accepts the off-image point 1.'
  scope: Instance; kernel off_image_not_implied_instance.
- id: observations_unconstrained
  statement: 'identity lift on Fin 2 with q = 0 and q2 = val: law holds, q2 after u != q.'
  scope: Instance; kernel observation_not_implied_instance.
- id: obstruction_persists
  statement: 'identity lift on Fin 1 with the constant-true predicate: law holds, the obstruction persists
    at 0 and at u 0.'
  scope: Instance with a constant predicate; kernel repair_not_implied_instance.
- id: semantic_law_forces_off_image_refusal
  kind: semantic_near_miss
  rationale: Claim every law-satisfying recovery of the (2,3) census refuses the off-image point; 12 of
    the 18 do not, which is off_image_not_implied.
  rejected_by: check_candidate
- id: semantic_law_without_injectivity
  kind: semantic_near_miss
  rationale: Report a law pair with a non-injective lift in the (2,2) census; the injectivity theorem
    excludes it.
  rejected_by: check_candidate
- id: semantic_law_forces_observation_preservation
  kind: semantic_near_miss
  rationale: Claim every observation pair is preserved by a law lift; only q = q-prime-after-u pairs are
    (8 of 32 at (2,2,2)).
  rejected_by: check_candidate
- id: semantic_law_repairs_obstructions
  kind: semantic_near_miss
  rationale: Claim an old obstruction never persists through a law lift; it persists in 7 of the 16 obstruction
    pairs per law pair at (2,2,2).
  rejected_by: check_candidate
- id: semantic_recovery_exists_for_larger_source
  kind: semantic_near_miss
  rationale: Claim a typed recovery exists from three old terms into two lifted points; injectivity (pigeonhole)
    forbids it.
  rejected_by: check_candidate
- id: semantic_recovery_unique_per_lift
  kind: semantic_near_miss
  rationale: Claim the recovery is determined by the lift (one law pair per injective lift); the off-image
    values are free so there are 18 law pairs over 6 lifts at (2,3).
  rejected_by: check_candidate
- id: semantic_law_counts_all_functions
  kind: semantic_near_miss
  rationale: Claim every pair satisfies the law in the (1,2) census; only the pairs recovering the lifted
    point do.
  rejected_by: check_candidate
- id: semantic_law_count_ignores_refusal_summand
  kind: semantic_near_miss
  rationale: Count the recoveries as a^(b-a) per lift (12 at (2,3)) forgetting that the refusal summand
    is also a value off the image; there are 18.
  rejected_by: check_candidate
- id: semantic_law_forces_surjective_lift
  kind: semantic_near_miss
  rationale: Claim no recovery exists for a non-onto lift (law = 0 at (2,3)); every injective lift has
    one, and the 6 lifts give 18 recoveries.
  rejected_by: check_candidate
- id: semantic_empty_source_observation_failure
  kind: semantic_near_miss
  rationale: Claim observation preservation can fail for an empty source (8 of 8 are preserved at (0,3,2));
    this is why observation_not_implied_general needs a nonempty A.
  rejected_by: check_candidate
- id: semantic_surjective_lift_has_nonrefusing_recovery
  kind: semantic_near_miss
  rationale: Claim a law-satisfying recovery of a bijective lift accepts an off-image point; a bijection
    has no off-image point and its recovery is unique (6 pairs at (3,3)).
  rejected_by: check_candidate
