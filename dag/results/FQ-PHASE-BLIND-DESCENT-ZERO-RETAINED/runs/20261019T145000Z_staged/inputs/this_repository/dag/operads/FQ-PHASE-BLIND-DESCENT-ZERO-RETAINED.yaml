target:
  source_statement: A matrix A descends through the phase-blind population report iff every row has at most one
    nonzero entry, provided the quotient retains the zero vector as a distinct output; without the retained zero
    point the claim is false on projective space (A = [[1,1],[1,1]]).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
  - sector basis and quadratic readout (assumption)
  source_bottleneck: General-n 2-sparse probe separation ((a+b)^2 - (a-b)^2 = 4ab != 0), 1-sparse phase-blind
    invariance, and projective-zero counterexample mechanized in DerivationDagQMClosure.lean.
