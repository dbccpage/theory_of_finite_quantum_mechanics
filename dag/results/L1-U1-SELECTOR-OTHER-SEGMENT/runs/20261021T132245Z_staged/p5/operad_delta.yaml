- id: semantic_valuation_exponent_off_by_one
  kind: semantic_near_miss
  rationale: For (7/25, 24/25) the denominator of 2x is 25 = 5^2, so the valuation of 2 Re z^k is -2k,
    not -k.
  rejected_by: check_candidate
- id: semantic_unit_i_has_infinite_order
  kind: semantic_near_miss
  rationale: Report the point (0,1) = i as non-torsion; it is a fourth root of unity.
  rejected_by: check_candidate
- id: semantic_identity_read_as_minus_one
  kind: semantic_near_miss
  rationale: The point with x = 1 is the identity (order 1); order 2 belongs to x = -1.
  rejected_by: check_candidate
- id: semantic_search_bound_read_as_order
  kind: semantic_near_miss
  rationale: The order search stops at 12; a point with no power equal to 1 up to the bound has order
    recorded as 0, not 12.
  rejected_by: check_candidate
- id: semantic_non_unit_point_flagged_as_mu4
  kind: semantic_near_miss
  rationale: Flag the point (5/13, 12/13) as one of the four unit points; its order is infinite.
  rejected_by: check_candidate
- id: semantic_integral_twice_x_for_a_cayley_point
  kind: semantic_near_miss
  rationale: 2x = 10/13 is not an integer; claiming integrality would put the point in the finite list
    and erase the p-adic witness.
  rejected_by: check_candidate
- id: semantic_all_cayley_points_have_infinite_order
  kind: semantic_near_miss
  rationale: Generalise "(3/5,4/5) has infinite order" to every Cayley point; (0,1), (1,0), (1,1), (-1,1)
    give (1,0), (-1,0), i and -i, so four Cayley points lie in mu_4.
  rejected_by: check_candidate
- id: semantic_cayley_map_misses_minus_one
  kind: semantic_near_miss
  rationale: Claim the Cayley map misses (-1, 0); n = 0, m != 0 gives (-1, 0), so the map is onto the
    circle.
  rejected_by: check_candidate
- id: semantic_finite_field_circle_has_only_mu4
  kind: semantic_near_miss
  rationale: Read the torsion-is-mu_4 result as a statement about every finite carrier; the unit circle
    over F_7 has 8 points and is cyclic of order 8, so orders beyond 4 occur there.
  rejected_by: check_candidate
open_obligations:
- Derivation or failure of the selection of C and U(1) (owned by the QM_028 / QM_062 segment).
- 'Kernel proof of the unit circle over F_p and Z/n (finite carriers proper): cyclic of order p - (-1/p);
  torsion over Q(i, sqrt 2) and Q(zeta_3) (larger finite phase groups).'
- The split-complex rival hyperbola x^2 - y^2 = 1 (torsion {+-1}) and the H011 rival_excluded flag.
- Completion, continuity and compactness of the phase group.
