    a list-sum additivity; the general non-derivability is established only for the unweighted equal-mass
    n-cycle model with Gamma2 modelled as the holonomy, and the weighted form declared in the window definition
    may select a unique weight vector (native rows only, not a kernel theorem).
  historical_target_status: Original target retained verbatim as source history; the corrected narrow
    scope governs this run.
scope_refinements:
  historical_source_assumptions_are_not_the_full_work_unit_contract: true
  work_unit_admitted_hypotheses:
  - Edge cochains on the n-cycle with unweighted L1 form; the class of c in C^1/im d0 is its holonomy
    S = sum c; sectors are blocks of consecutive edges; sector weights are sums of |r_i| over a block.
  - The rotation symmetry is a declared extra input.
  boundary: Finite carriers, declared operations/readouts and actual native bounds are supplied assumptions,
    even when the historical source assumption list is empty.
