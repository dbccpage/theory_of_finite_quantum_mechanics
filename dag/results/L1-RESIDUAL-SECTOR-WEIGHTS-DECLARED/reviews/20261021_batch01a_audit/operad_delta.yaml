counterexamples:
- id: c4_two_minimizers
  statement: 'On the 4-cycle the cochains (1,0,1,0) and (0,1,0,1) (holonomy 2) have the minimizers (2,0,0,0),
    (0,2,0,0), (1,1,0,0), ... : 10 in all, with 3 different (sector A, sector B) weight vectors for blocks
    {0,1},{2,3}.'
  scope: Instance of minimizers_not_unique; native records 1 and 2.
- id: c4_orbit_sum_not_minimizer
  statement: The source orbit sum (1,1,1,1) of (1,0,1,0) and (0,1,0,1) has total 4 but Phi1 = 2; the canonical
    symmetric point is (1/2,1/2,1/2,1/2).
  scope: Instance; kernel c4_orbit_sum_not_minimizer.
- id: semantic_unique_minimizer_from_one_witness
  kind: semantic_near_miss
  rationale: Read the single C4 witness (1,0,1,0)->(2,0,0,0) as "the" minimizer; the minimizer set is
    a simplex with 10 points.
  rejected_by: check_candidate
- id: semantic_orbit_sum_as_symmetric_point
  kind: semantic_near_miss
  rationale: The source orbit SUM (1,1,1,1) has total 4 while Phi1 = 2; the canonical symmetric point
    is the orbit average (1/2 each).
  rejected_by: check_candidate
- id: semantic_rounded_symmetric_point_integral
  kind: semantic_near_miss
  rationale: Round the symmetric selector 1/6 to an integer cochain; the cyclically invariant minimizer
    is integral only when n divides the holonomy.
  rejected_by: check_candidate
- id: semantic_zero_mass_accepted
  kind: semantic_near_miss
  rationale: Accept holonomy 0 as a valid weight vector; the minimizer is the zero residual and the declared
    total M = 0 is refused.
  rejected_by: check_candidate
- id: semantic_one_edge_still_nonunique
  kind: semantic_near_miss
  rationale: Claim non-uniqueness for a 1-cycle; the class has a single point there, so the hypothesis
    n >= 2 cannot be dropped.
  rejected_by: check_candidate
- id: semantic_single_sector_weight_varies
  kind: semantic_near_miss
  rationale: Claim the weight of a single sector (all edges) varies; it equals Phi1 for every minimizer,
    so only a split into two or more sectors is undetermined.
  rejected_by: check_candidate
- id: semantic_raw_l1_read_as_phi1
  kind: semantic_near_miss
  rationale: Phi1 is the minimum of the L1 form over the class c - d0 h, not the raw L1 form of the representative
    c (off by the gauge).
  rejected_by: check_candidate
- id: semantic_negative_class_with_positive_minimizers
  kind: semantic_near_miss
  rationale: For holonomy -3 the minimizers are the nonpositive cochains; sign convention swapped.
  rejected_by: check_candidate
- id: semantic_holonomy_as_absolute_value
  kind: semantic_near_miss
  rationale: Gamma2 is the signed holonomy; replacing it by |S| loses the orientation of the class.
  rejected_by: check_candidate
- id: semantic_minimizers_counted_by_sector_vectors
  kind: semantic_near_miss
  rationale: Count minimizers by their distinct sector-weight vectors (3) instead of by residual cochains
    (10).
  rejected_by: check_candidate
- id: semantic_weighted_l1_treated_as_unweighted
  kind: semantic_near_miss
  rationale: With unequal declared edge masses (1,2,3,4) the minimizer is the single point (2,0,0,0) on
    the minimal-mass edge; the equal-mass non-uniqueness table does not carry over.
  rejected_by: check_candidate
- id: semantic_gamma2_as_sum_of_squares_constant_on_minimizers
  kind: semantic_near_miss
  rationale: 'If Gamma2 were the sum of squares of the weights it is 2 for (1,1,0,0) but 4 for (2,0,0,0):
    the minimizers do not share it, so the two readings of Gamma2 give different fibers.'
  rejected_by: check_candidate
- id: semantic_cycle_rank_two_single_holonomy
  kind: semantic_near_miss
  rationale: For two disjoint cycles with holonomies 2 and -1 the total holonomy is 1 but Phi1 = 3; one
    holonomy no longer determines the class or Phi1.
  rejected_by: check_candidate
- id: semantic_determined_but_not_unique_read_as_free
  kind: semantic_near_miss
  rationale: With masses (2,2,1,1) both minimal edges lie in the second sector, so the sector weights
    (0,3) are determined although the minimizer is not unique.
  rejected_by: check_candidate
