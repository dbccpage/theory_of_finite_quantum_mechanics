  source_statement: 'Admitted root of the programme: Real_0 = PrimitiveDifference ⊔ Structure, a typed coproduct
    of two independently posited channels; the coproduct asserts no reduction of either channel to the other and
    no origin of either. Carrier-Structure precedes a primitive difference; residual-Structure (Q^1 = C^1/im d0)
    is what the difference produces; the ladder is a definability order and mints no authority.'
