target:
  source_statement: 'Twenty-five finite-map controls QM-207..QM-231 (phase fiber, readout, context parity,
    frame function, clock tower, Symanzik/BPHZ, Dirac Ward-Takahashi, vacuum polarization, Kravchuk/hydrogen,
    Page-Wootters/Tsirelson/Wigner, electroweak, QCD beta0, Regge, Conf_2 spin-statistics, Dirac-Coulomb/helium,
    tree-level QED, PPN, GHZ/Mermin, Chern parity) each compute an exact finite invariant over Q or Q(zeta_N)
    and name the completion step and residual import in its own row. They are on main (PR #1132 merged,
    5c6706eba; QM-226..231 added by bfa800fe2, 3c3042143, 0c3532f3b). Each row lists what is NOT derived
    (e.g. non-triviality of tau, second measurement context, Gleason positivity closure, Stone strong
    continuity, Feynman-parameter measure, UV subtraction).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - each row s5.2 "Residual import" column (assumption)
  - completion to R/C, Stone, period integrals (lift)
  source_bottleneck: All finite rational/integer control theorems for QM-207..231 are mechanized; continuum
    completions in QM-207..211 remain priced as explicit imports.
