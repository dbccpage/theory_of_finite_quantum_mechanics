    original_target: 'Twenty-five finite-map controls QM-207..QM-231 (phase fiber, readout, context parity,
      frame function, clock tower, Symanzik/BPHZ, Dirac Ward-Takahashi, vacuum polarization, Kravchuk/hydrogen,
      Page-Wootters/Tsirelson/Wigner, electroweak, QCD beta0, Regge, Conf_2 spin-statistics, Dirac-Coulomb/helium,
      tree-level QED, PPN, GHZ/Mermin, Chern parity) each compute an exact finite invariant over Q or
      Q(zeta_N) and name the completion step and residual import in its own row. They are on main (PR
      #1132 merged, 5c6706eba; QM-226..231 added by bfa800fe2, 3c3042143, 0c3532f3b). Each row lists what
      is NOT derived (e.g. non-triviality of tau, second measurement context, Gleason positivity closure,
      Stone strong continuity, Feynman-parameter measure, UV subtraction).'
    source_scope_review: 'The target bundles25 distinct finite-map rows, while its linked paper emphasizes
      a smaller import-control facade. This staged work unit selects the explicitly bound helium Kellner
      polynomial only: E(z)=z²-27z/8. Completing its square proves its exact minimum at27/16 with value
      -729/256 and the supplied virial polynomial control. The Coulomb integral coefficients and variational
      ansatz are imports, not re-derived measurements or a solved helium spectrum.'
    admitted_assumptions:
    - each row s5.2 "Residual import" column (assumption)
    - completion to R/C, Stone, period integrals (lift)
