  statement: 'X empty, Y = Unit, Z empty: s is constant on fibres vacuously yet Factors fails (factors_iff_fails_without_nonempty).'
  scope: Boundary of factoring_iff_fibre_constant.
- id: semantic_empty_task_codomain_factors
  kind: semantic_near_miss
  rationale: 'Read "fibre-constant iff factors" as unconditional: with empty X and empty Z the fibre condition
    is vacuous but no g : Y -> Z exists.'
  rejected_by: check_candidate
- id: semantic_barrier_has_an_exception
  kind: semantic_near_miss
  rationale: Claim one task that separates a collapsed pair nevertheless factors through the profile.
  rejected_by: check_candidate
- id: semantic_one_bit_always_suffices
  kind: semantic_near_miss
  rationale: Claim an added binary tag always recovers the task; four task values inside one fibre need
    four tag values.
  rejected_by: check_candidate
- id: semantic_added_tag_never_helps
  kind: semantic_near_miss
  rationale: 'Read "no function of the quotient separates" as "nothing separates": claim the separated
    pairs need no added tag at all (alphabet size 0).'
  rejected_by: check_candidate
- id: semantic_factorisation_unique
  kind: semantic_near_miss
  rationale: Count one factor per factoring pair; the factor is unique only on the image of the profile
    (history_factor_unique), free elsewhere.
  rejected_by: check_candidate
- id: semantic_profile_task_roles_swapped
  kind: semantic_near_miss
  rationale: Swap the roles of profile and task codomains in the factor count (mz ** n * my ** mz instead
    of my ** n * mz ** my).
  rejected_by: check_candidate
- id: semantic_injective_profile_still_collapses
  kind: semantic_near_miss
  rationale: Count the injective profiles on a two-point carrier as having collapsed separated pairs.
  rejected_by: check_candidate
- id: semantic_alphabet_is_global_distinct_count
  kind: semantic_near_miss
  rationale: Read the least tag alphabet as the number of distinct task values overall; it is the largest
    number inside one fibre, which is smaller whenever the values are spread over several fibres.
  rejected_by: check_candidate
- id: semantic_alphabet_is_fibre_size
  kind: semantic_near_miss
  rationale: Read the least tag alphabet as the size of the largest fibre; points of a fibre with the
    same task value share one tag value.
  rejected_by: check_candidate
- id: semantic_alphabet_needs_one_more_value
  kind: semantic_near_miss
  rationale: 'Off by one: claim the tag needs one more value than the largest number of distinct task
    values in a fibre.'
  rejected_by: check_candidate
