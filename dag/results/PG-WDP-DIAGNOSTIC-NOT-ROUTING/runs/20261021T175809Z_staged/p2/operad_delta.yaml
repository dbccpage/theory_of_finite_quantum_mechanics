- composition: routing_of_pfp_terminal(diagnostic_run_tag(ExactClass))
  reason: 'Fails: the tag "ExactRepair" is not a PfpTerminal, so terminal_routing.json gives the exact
    class no route; reading it as CheckPassed is a modelling choice not made here.'
- composition: residual_class read as the diagnostic class
  reason: ResidualClass has a fourth value Refused and Open covers statuses with no diagnostic at all
    (NoPacket, VerifierDisabled), so it is not the 3-valued diagnostic class.
- composition: certificate_eligibility as authority
  reason: 'Eligibility is necessary only: certified needs a descent witness and an authority-bearing terminal,
    neither supplied by the class.'
- composition: terminal_from_fiber into RequiresLift, BudgetUnknown or Refused
  reason: None of the 640 inputs (and no input over any counts, by the kernel theorem) yields these three
    terminals.
counterexamples:
- id: open_residual_four_routes
  statement: The Open residual class routes to Repair, BudgetUnknown, RequiresLift and Refusal, so the
    residual class does not determine the terminal.
  scope: Source tables for the 21 statuses
- id: refusal_two_residuals
  statement: Refusal comes from ParseRefused (residual Refused) and NoPacket (residual Open), so the terminal
    does not determine the residual class.
  scope: Source tables for the 21 statuses
- id: closed_class_two_routes
  statement: 'If ClosedResidual is identified with ResidualClass.ClosedSurvivor (not asserted), run.rs
    routes it to RequiresLift while the TerminalStatus table routes ClosedSurvivor to NoRule: the two
    source tables disagree.'
