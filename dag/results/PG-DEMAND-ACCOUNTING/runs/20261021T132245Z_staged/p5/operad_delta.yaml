checked_compositions:
- outer_operation: register_count
  input_slot: 0
  inner_operation: register_birth
  colour_match: ActiveRegister
  hypothesis_match: Finite registers; the next register is (W minus D) union B; D subset of W; births
    disjoint from W minus D (not from W or D).
  licensing_relations:
  - demand_accounting_identity
  - exact_next_cardinality
  evidence_status: Kernel and native
- outer_operation: register_birth
  input_slot: 0
  inner_operation: register_discharge
  colour_match: SurvivorRegister
  hypothesis_match: Finite registers; the next register is (W minus D) union B; D subset of W; births
    disjoint from W minus D (not from W or D).
  licensing_relations:
  - demand_accounting_identity
  evidence_status: Kernel and native
failed_compositions:
- composition: register_count o register_birth o register_discharge read as count_step(count W, count
    D, count B) without hypotheses
  reason: Equal only when |D minus W| = |(W minus D) cap B| (formula_iff); native counts show it fails
    for every triple violating exactly one hypothesis.
- composition: 'count_step inverted: recover (d, b) from a count sequence'
  reason: 'Not a function: a step s to s admits s + 1 splits when s2 = s (kernel split_not_determined;
    native decompositions).'
counterexamples:
- id: subset_violated
  statement: 'W={0}, D={1}, B={}: |next|=1 but |W|-|D|+|B|=0.'
  scope: Instance; kernel fails_without_subset.
- id: overlap
  statement: 'W={0,1}, D={0}, B={1}: |next|=1 but |W|-|D|+|B|=2.'
  scope: Instance; kernel fails_without_disjoint.
- id: natural_truncation
  statement: 'W={0}, D={0,1}, B={}: truncated N identity gives 0 and |next|=0, though D is not inside
    W; the integer identity gives -1.'
  scope: Instance; kernel nat_truncation_masks_subset_violation.
- id: list_overlap
  statement: 'Lists [0,1], discharge 0, births [1]: length identity holds (2=2-1+1) but the register [1,1]
    is not duplicate-free.'
  scope: Instance; kernel list_overlap_not_nodup.
- id: semantic_subset_hypothesis_dropped
  kind: semantic_near_miss
  rationale: Claim the integer identity s-d+b also holds for every triple with D not inside W (u=3); it
    holds for none of them.
  rejected_by: check_candidate
- id: semantic_disjointness_hypothesis_dropped
  kind: semantic_near_miss
  rationale: Claim the identity holds for every triple whose births overlap the survivors (u=3); it holds
    for none of them.
  rejected_by: check_candidate
- id: semantic_natural_subtraction_detects_violation
  kind: semantic_near_miss
  rationale: Claim the truncated natural-number identity never holds when D is not inside W; truncation
    makes it hold for 152 of the 218 such triples at u=3.
  rejected_by: check_candidate
- id: semantic_accidental_agreement_denied
  kind: semantic_near_miss
  rationale: Claim the identity cannot hold when both hypotheses fail (u=4); an excess of D outside W
    can cancel an overlap exactly.
  rejected_by: check_candidate
- id: semantic_births_on_discharged_read_as_violation
  kind: semantic_near_miss
  rationale: Take disjointness against W or D instead of W minus D, so births coinciding with discharged
    elements count as a violation (4^3 instead of 5^3 admissible triples at u=3); the source hypothesis
    ranges over the survivors only.
  rejected_by: check_candidate
- id: semantic_survivor_sequence_read_as_law
  kind: semantic_near_miss
  rationale: Claim the displayed survivor sequence (0,1,1,1,0,1,1) leaves no freedom in the discharged/born
    split; three of its six steps admit two splits.
  rejected_by: check_candidate
- id: semantic_split_forced_by_counts
  kind: semantic_near_miss
  rationale: Claim exactly one (d,b) split per step of the displayed sequence, so the counts determine
    the accounting.
  rejected_by: check_candidate
- id: semantic_list_length_identity_needs_disjointness
  kind: semantic_near_miss
  rationale: 'Multiset/list register: claim the length identity fails when births overlap the survivors;
    the list register counts multiplicity so the identity holds for all 196 triples at (2,2).'
  rejected_by: check_candidate
- id: semantic_duplicate_free_register_without_disjointness
  kind: semantic_near_miss
  rationale: Claim a duplicate-free register can result from overlapping births; for duplicate-free inputs
    the register is duplicate-free exactly when the births avoid the survivors.
  rejected_by: check_candidate
