failed_compositions:
- composition: exhibited_cut built from two marks and a pointed relation without the law
  reason: Relatedness does not give distinctness (self-loop) and distinctness does not give relatedness
    (empty relation); the law field is not produced by pointed_relation (kernel pointed_relation_independence,
    native quadrants).
- composition: exhibited_cut on a subsingleton carrier
  reason: Needs two distinct endpoints; none exist (kernel no_cut_on_subsingleton, native 0 cuts at n=0,1).
counterexamples:
- id: self_loop_one_point
  statement: The total relation on one point relates the point to itself, so relatedness does not imply
    distinctness and the instance has no law.
  scope: n = 1, native related_equal = 1.
- id: empty_relation_two_points
  statement: The empty relation on two points leaves distinct points unrelated; it is a law without instance.
  scope: n = 2.
- id: semantic_relatedness_implies_distinctness
  kind: semantic_near_miss
  rationale: 'Read the third pointed-relation clause without its irreflexivity hypothesis: no self-loop
    on the one-point carrier.'
  rejected_by: check_candidate
- id: semantic_distinctness_implies_relatedness
  kind: semantic_near_miss
  rationale: Claim two distinct marked points are always related; the empty relation on two points is
    the counterexample.
  rejected_by: check_candidate
- id: semantic_cut_on_a_subsingleton
  kind: semantic_near_miss
  rationale: Allow an exhibited cut on a one-point carrier; the law and the instance cannot both hold
    there.
  rejected_by: check_candidate
- id: semantic_law_requires_an_instance
  kind: semantic_near_miss
  rationale: Claim the empty relation is not law-bearing because it exhibits nothing; the law alone holds
    on any carrier.
  rejected_by: check_candidate
- id: semantic_instance_forces_the_law
  kind: semantic_near_miss
  rationale: Claim every relation with an exhibited pair is irreflexive; the total relation on one point
    is the counterexample.
  rejected_by: check_candidate
- id: semantic_identification_preserves_the_law
  kind: semantic_near_miss
  rationale: Claim some map identifying two related points still carries the relation into an irreflexive
    target.
  rejected_by: check_candidate
- id: semantic_separation_does_not_suffice
  kind: semantic_near_miss
  rationale: Claim a map separating all related pairs can still fail to have a law-bearing target; the
    inequality relation is such a target.
  rejected_by: check_candidate
