checked_compositions:
- outer_operation: image_test
  input_slot: 1
  inner_operation: section_lift
  colour_match: Presentation
  hypothesis_match: 'A section s : S -> Y and a retraction r : Y -> S + {refusal} with r(s x) = inl x
    (old-image law) and soundness (r y = inl x implies s x = y); or the pinned S(n) model with its five
    base shapes over an abstract glyph alphabet. Same stage in both. Fixed contexts must agree across
    both operations. Formal universal refined-carrier closure is unpaid.'
  licensing_relations:
  - nonDescent_iff_off_image
  evidence_status: Kernel and native
- outer_operation: retraction_down_map
  input_slot: 1
  inner_operation: section_lift
  colour_match: Presentation
  hypothesis_match: 'A section s : S -> Y and a retraction r : Y -> S + {refusal} with r(s x) = inl x
    (old-image law) and soundness (r y = inl x implies s x = y); or the pinned S(n) model with its five
