failed_compositions:
- composition: retraction_down_map(m, section_lift(n, b)) with m different from n
  reason: 'Refused: the stage test is exact (retraction_stage_strict); the composite is the refusal, not
    a recovery.'
- composition: section_lift composed with the retraction as a map on all presentations
  reason: 'Not a map: the refusal summand has no image under the section; it is defined only where r accepts,
    and then it is the identity (roundtrip_iff_in_image).'
- composition: refusal read off the old-image law alone
  reason: The lax retraction obeys the law and refuses nothing (lax_never_refuses); soundness of the specific
    retraction is what refuses.
counterexamples:
- id: lax_retraction
  statement: r(y) = inl 0 for all y on Fin 1 -> Fin 2 obeys the law but accepts the off-image point 1;
    the S(n) version accepts every refused point as the ground presentation.
  scope: Instance and construction; kernel lax_retraction_obeys_law_but_accepts_off_image, lax_breaks_refusal_characterisation.
- id: three_glyph_body
  statement: lift at stage 2 with the three-glyph body (true, false, true) is refused by r_2 although
    it has the right stage and the lift head.
  scope: Instance over Bool glyphs; kernel instance_refusals.
- id: circular_toy
  statement: in the source toy witness off-image is defined as failure of s(r y) = y, so refusal by the
    round trip is true by definition there.
  scope: Reading of the fixed witness in derivation_dag_witnesses.rs; the non-circular statement is nonDescent_iff_off_image.
- id: semantic_old_image_law_implies_refusal
  kind: semantic_near_miss
  rationale: Claim that a retraction obeying the old-image law already refuses every off-image point (lax
    violations 0); the lax retraction obeys the law and refuses none of the 185 off-image points.
  rejected_by: check_candidate
- id: semantic_refusal_misses_a_off_image_point
  kind: semantic_near_miss
  rationale: Report one disagreement between refusal and off-image-ness for the pinned retraction; the
    characterisation has no exception on the universe.
  rejected_by: check_candidate
- id: semantic_wrong_stage_lift_accepted
  kind: semantic_near_miss
  rationale: Claim one section image at another stage is accepted by r_n; the stage test is exact (15
    of 15 per other stage are refused at g = 2).
  rejected_by: check_candidate
- id: semantic_long_body_accepted
  kind: semantic_near_miss
  rationale: Claim a three-or-more-glyph body at the right stage is accepted; only bodies of the five
    shapes are accepted.
  rejected_by: check_candidate
- id: semantic_roundtrip_holds_everywhere
  kind: semantic_near_miss
  rationale: Claim s(r(p)) = p for every presentation of the one-glyph universe; it fails on every refused
    point (37 of 42).
  rejected_by: check_candidate
- id: semantic_single_stage_universe_hides_stage_test
  kind: semantic_near_miss
  rationale: Report stage-mismatch refusals in a universe that has a single stage; there is no other stage
    to mismatch.
  rejected_by: check_candidate
- id: semantic_lax_retraction_breaks_the_law
  kind: semantic_near_miss
  rationale: Claim the lax retraction that accepts everything fails the old-image law; it obeys the law
    exactly, which is why the law cannot be the refusal.
  rejected_by: check_candidate
- id: semantic_payload_confuses_shapes
  kind: semantic_near_miss
  rationale: Report one wrong payload (for example a retained pair read back as a simplex cut); accepted_only_from_section
    fixes the payload as the base presentation, and the universe has none wrong.
  rejected_by: check_candidate
- id: semantic_accepted_beyond_the_image
  kind: semantic_near_miss
  rationale: Claim a retraction term r_n<..> or the refusal token is accepted by r_n, so more outcomes
    are accepted than there are section images (16 instead of 15 at g = 2).
  rejected_by: check_candidate
- id: semantic_section_lift_not_injective
  kind: semantic_near_miss
  rationale: Claim two base presentations lift to the same term (image smaller than Base, 14 of 15); the
    lift is injective.
  rejected_by: check_candidate
- id: semantic_toy_with_zero_multiplier
  kind: semantic_near_miss
  rationale: A toy section with multiplier 0 has no total left inverse y // 0 and is not one of the public
    cases.
  rejected_by: check_candidate
- id: semantic_total_retraction_accepts_everything
  kind: semantic_near_miss
  rationale: Claim the toy witness (section 2x, retraction y // 2) leaves nothing to refuse; the round
    trip s(r(y)) = y refuses the 3 odd points of 6.
  rejected_by: check_candidate
- id: semantic_identity_section_has_off_image_points
  kind: semantic_near_miss
  rationale: Claim the identity section (multiplier 1) has an off-image point to refuse; a surjective
    section has none.
  rejected_by: check_candidate
