  source_statement: For Hermitian trace-zero edge defects the polar of (1/2)||.||_1 is the observable
    class modulo scalar identity with norm lambda_max - lambda_min. On K_{2,3} with D_k = 3E_kk - I the
    trace-zero repair value is 6 (zero repair plus witnesses D_k/3) and the all-Hermitian value is 9/2.
