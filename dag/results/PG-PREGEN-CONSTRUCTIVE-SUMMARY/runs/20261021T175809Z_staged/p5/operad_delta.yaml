  hypothesis_match: A complete listing (every history listed) and global fiber constancy; the factor is
    then built from recon with Option.get inside the construction, not by plugging recon into the Listing
    slot.
  licensing_relations:
  - recon_of_fiber_constant
  - recon_refuses_unreported
  evidence_status: Kernel (listed_factor_exists) and native (complete_triples, complete_mismatch)
- outer_operation: first_match_recon
  input_slot: 0
  inner_operation: listing
  colour_match: Listing
  hypothesis_match: Any listing, including repeats allowed.
  licensing_relations:
  - recon_unique_on_listed_reports
  evidence_status: Kernel (recon_unique) and native (exhaustive over all listings of length <= ell); the
    native checker additionally reduces a listing to its first-occurrence sequence, an algorithmic reduction
    checked only by agreement with the producer, not a Lean lemma
failed_compositions:
- composition: image_factor_from_listing(first_match_recon(...)) as a graft
  reason: 'Colour mismatch: the factor construction takes a Listing in its first slot and recon outputs
    OptionAnswer; recon is used inside the construction (listed_factor_exists), not as a grafted argument.'
- composition: first_match_recon applied to an unlisted history
  reason: Refused (none) when its report is unreported, and wrong when a listed history shares its report
    but not its answer (kernel recon_wrong_off_list; native unlisted_wrong counts).
- composition: first_match_recon without decidable equality of reports
  reason: The search needs a Boolean test of report equality; the classical instance restores the statement
    but the kernel then reports Classical.choice.
counterexamples:
- id: list_zero_only
  statement: 'Histories 0,1,2 with report h mod 2, answer h, listing [0]: fiber constant on the listing,
    recon(report 2) = some 0, but answer 2 = 2.'
  scope: Instance of recon_wrong_off_list (Lean instance_wrong_off_list).
- id: partial_false_positive
  statement: A listing missing a history can be fiber constant while the answer is not globally fiber
    constant (native partial_false_positive counts, e.g. 840 of 2560 triples for p=3, ell=3, v=2, s=2).
  scope: Native instances.
- id: semantic_first_match_always_right
  kind: semantic_near_miss
  rationale: 'Drop the fiber-constancy hypothesis: claim first-match reconstruction returns every listed
    answer for every triple.'
  rejected_by: check_candidate
- id: semantic_partial_listing_implies_global
  kind: semantic_near_miss
  rationale: Claim fiber constancy on an incomplete listing already gives global fiber constancy; unlisted
    histories can still disagree.
  rejected_by: check_candidate
- id: semantic_off_listing_never_wrong
  kind: semantic_near_miss
  rationale: Claim that when reconstruction answers for an unlisted history it is right; an unlisted history
    of a listed report may have another answer.
  rejected_by: check_candidate
- id: semantic_repeats_ignored
  kind: semantic_near_miss
  rationale: Count only duplicate-free listings (16) instead of all 40 lists of length at most 3; repeats
    are allowed listings.
  rejected_by: check_candidate
- id: semantic_off_listing_never_refused
  kind: semantic_near_miss
  rationale: Claim the reconstruction never refuses for an unlisted history; an unlisted history with
    an unreported report is refused with none.
  rejected_by: check_candidate
- id: semantic_criterion_fails_on_one_triple
  kind: semantic_near_miss
  rationale: Claim one triple is correctly reconstructed without being listed-fiber-constant; the listed
    criterion is an iff.
  rejected_by: check_candidate
- id: semantic_complete_listing_disagrees
  kind: semantic_near_miss
  rationale: Claim a complete listing can disagree with the global criterion of node 163; completeness
    makes the two coincide.
  rejected_by: check_candidate
- id: semantic_full_length_listing_is_complete
  kind: semantic_near_miss
  rationale: Treat every listing of length 3 over 3 histories as complete (1728 triples); with repeats
    allowed only the 6 permutations are complete (384), which is the completeness hypothesis of listed_factor_exists.
  rejected_by: check_candidate
open_obligations:
- Report types without decidable equality (choice-free substitute or unavoidability).
- Unconditional factorization for an arbitrary history type (node PG-HISTORY-REPORT-CRITERION).
- Any probability, measurement or physical reading of reports.
