checked_compositions:
- outer_operation: extend_off_image
  input_slot: 0
  inner_operation: factor_through_image
  colour_match: FactorMap -> ExtensionSet
  hypothesis_match: An extension needs a value at every unreported point; none is forced.
  licensing_relations:
  - off_image_extension_not_unique
  - factor_unique_on_image
  evidence_status: Kernel and native
failed_compositions:
- composition: fiber_selector for an arbitrary report without the choice axiom
  reason: 'Not composable in this development: the selector is a hypothesis or Classical.choice. No unprovability
    result is proved here; whether a choice-free selector exists for an arbitrary history type is the
    next obligation.'
- composition: extend_off_image with a unique result when the report is not surjective
  reason: Fails whenever an unreported point exists and the answer type has two elements (kernel off_image_not_unique;
    native nonunique counts).
- composition: factor_through_image (slot 0) o fiber_selector
  reason: 'Colour mismatch: the outer slot takes ReportMap but the inner operation outputs Selector; composing
    needs a coercion or a partial-map convention that this presentation does not contain, so it is not
    a checked graft.'
  original_entry:
    outer_operation: factor_through_image
    input_slot: 0
    inner_operation: fiber_selector
    colour_match: Selector -> FactorMap
    hypothesis_match: The factor is built as g v = answer (selector v); fiber constancy transports the
      selector to every history.
    licensing_relations:
    - fiber_constant_implies_factors
    evidence_status: Kernel and native
counterexamples:
- id: h_mod_2_answer_h
  statement: 'Three histories 0,1,2 with report h mod 2 and answer h: histories 0 and 2 share report 0
    with answers 0 and 2, so the answer is not fiber constant and does not factor.'
  scope: Instance of not_factors_of_split (Lean instance_split).
- id: two_extensions_same_factor
  statement: 'h=1, v=2, s=2: the question 0 over one history reporting 0 factors uniquely through the
    image {0}, but has two extensions to V={0,1}.'
  scope: Instance of off_image_not_unique; native row 1 2 2 has nonunique count 4 of 4 factoring pairs.
- id: semantic_every_question_factors
  kind: semantic_near_miss
  rationale: 'Drop the fiber-constancy hypothesis: claim every question over three histories factors through
    the image of a report.'
  rejected_by: check_candidate
- id: semantic_only_injective_reports_factor
  kind: semantic_near_miss
  rationale: 'Confuse factoring through the image with the report being injective: only 6 injective reports,
    48 pairs.'
  rejected_by: check_candidate
- id: semantic_extension_unique_off_image
  kind: semantic_near_miss
  rationale: Read uniqueness on the image as uniqueness of the extension to all reports; unreported points
    leave s^(v-k) free values.
  rejected_by: check_candidate
- id: semantic_surjective_report_still_has_freedom
  kind: semantic_near_miss
  rationale: Claim off-image non-uniqueness also when the report is surjective, where there is no off-image
    point.
  rejected_by: check_candidate
- id: semantic_image_confused_with_codomain
  kind: semantic_near_miss
  rationale: Count every report as having full image, ignoring that the image of a report can be smaller
    than the codomain.
  rejected_by: check_candidate
- id: semantic_criterion_fails_on_one_pair
  kind: semantic_near_miss
  rationale: Claim one question over two histories factors without being fiber constant (or conversely);
    the criterion is an iff.
  rejected_by: check_candidate
- id: semantic_two_factors_on_the_image
  kind: semantic_near_miss
  rationale: Claim a question has two distinct factorizations through the image; uniqueness on the image
    is a theorem.
  rejected_by: check_candidate
- id: semantic_empty_histories_do_not_factor
  kind: semantic_near_miss
  rationale: Treat the empty history set as a refusal case; the empty question factors through the empty
    image, vacuously.
  rejected_by: check_candidate
- id: semantic_coarser_kernel_than_the_report
  kind: semantic_near_miss
  rationale: 'Count answers constant on the fibers of the constant report (a coarser equivalence than
    the own kernel of each report): 27 reports times 2 answers, instead of the own fibers of each report.'
  rejected_by: check_candidate
- id: semantic_empty_answers_extend_uniquely
  kind: semantic_near_miss
  rationale: Claim the empty question over the empty history set extends to the two-element report type
    in one way; with no answer values there are none (s^v = 0), although it factors through the empty
    image.
  rejected_by: check_candidate
open_obligations:
- Choice-freedom (or independence) of constancy => factoring for an arbitrary history type.
- Listed-history constructive version (node PG-PREGEN-CONSTRUCTIVE-SUMMARY).
- Any structure on histories, reports or answers; probability, measurement or physical reading of reports.
