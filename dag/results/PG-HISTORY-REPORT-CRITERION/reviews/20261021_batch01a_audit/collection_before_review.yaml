  - id: ImageType
    meaning: Subtype of reports actually reported
  - id: QuestionMap
    meaning: Function from histories to answers
  - id: ReportMap
    meaning: Function from histories to reports
  - id: Selector
    meaning: Function choosing a history in each fiber of the image
  - id: Verdict
    meaning: Proposition (constant on fibers or not)
