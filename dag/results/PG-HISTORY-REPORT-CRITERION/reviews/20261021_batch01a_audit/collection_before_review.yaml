    original_target: A question over histories factors through the report image iff it is constant on
      report fibers, and the factorization is unique on the image. The mpr direction (arbitrary report
      images) uses Classical.choice; a constructive listed-history version is not established.
    source_scope_review: 'The source declares the criterion for arbitrary types (Paper.lean history_report_criterion,
      history_factor_unique) and its variants (ProposalAdmissionBridge, Descent with surjectivity, Paper001
      descent). The source statement is general and correct; its mpr direction uses Classical.choose exactly
      to select a representative of each fiber. This node re-derives the criterion, isolates the selector
      as a hypothesis (axiom-free) and records the kernel axiom report of each direction, adds the off-image
      non-uniqueness and surjective uniqueness boundary, and checks all report/question function pairs
      on 16 finite triples. The constructive listed version is the sibling node 166. The Rust FactorizationCertificate
      (code/rust/src/category_theory/finite_report_query.rs line 151, flagged for re-review after upstream
      restoration) was re-read: on enumerated carriers it stores the realized image, a decoder and an
      explicit representative map (the selector as data) next to a Collision alternative, a finite certificate
      of the same dichotomy, not the general theorem.'
    admitted_assumptions:
    - 'Classical.choice (assumption: in Paper.lean, per its header comment)'
