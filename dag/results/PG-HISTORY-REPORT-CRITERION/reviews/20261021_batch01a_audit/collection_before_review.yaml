    fibers, uniquely on the image; the direction constancy => factoring is proved from a selector of fiber
    representatives (a hypothesis, axiom-free) and, for an arbitrary report, with Classical.choice; necessity
    of a selector or of choice is not shown; verified exhaustively on 16 small function-space triples.
