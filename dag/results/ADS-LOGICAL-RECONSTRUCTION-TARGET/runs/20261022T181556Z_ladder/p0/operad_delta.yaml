- Lean skeletons for the three restated lemmas were not written; the cited theorems are existing but I
  did not verify their full statements beyond the signatures given.
- The identification of the finite statement with bulk operator reconstruction in AdS/CFT remains an imported
  picture and is not formalized.
- No generator for the logical coset classes was grounded beyond supportedIn5 and mulPauli.
- The numeric claim N_triples is not an actual count of triples supporting classes; it is a binomial count
  and is not tied to the target.
