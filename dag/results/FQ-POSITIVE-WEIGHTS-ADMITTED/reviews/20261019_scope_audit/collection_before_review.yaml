scope_notes:
- The convex Bell argument takes nonnegative weights and a declared total mass. Strict positivity is stronger
  than required; zero weights are valid. Distinct normalized positive preparations on the same two-label
  carrier demonstrate nonuniqueness of supplied preparation data, not a universal metatheorem about all
  distinctions. Signed normalized weights give score6; unnormalized positive weights give score4 at mass2
  and obey only the scaled bound.
