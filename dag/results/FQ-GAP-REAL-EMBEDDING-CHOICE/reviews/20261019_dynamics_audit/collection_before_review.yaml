      scope: Exact quadratic-field Gram/conjugate coefficients, a mixed signature control and real-root
        inequalities are checked; the fake 9/4 root is explicitly rejected.
      unpaid_target: Formalize the coefficient-to-real embedding homomorphisms, full Gram PSD and cyclotomic
