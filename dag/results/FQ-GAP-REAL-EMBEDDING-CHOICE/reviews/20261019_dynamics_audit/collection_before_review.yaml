  source_statement: Positivity of a mixed-state witness depends on the real embedding of Q(zeta_n)^+ (phi(n)/2
    embeddings; 16 at n=120). Pure-state Gram matrices are totally positive in dimension 2 (pure_state_totally_positive_2d),
    but the mixed witness diag(sqrt5-2, 3-sqrt5) at conductor 5 is PSD under one embedding and indefinite
    under another. Choice of embedding is an external declaration.
