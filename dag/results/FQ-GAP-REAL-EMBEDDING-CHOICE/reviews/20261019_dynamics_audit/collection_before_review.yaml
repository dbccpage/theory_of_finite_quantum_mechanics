    original_target: Positivity of a mixed-state witness depends on the real embedding of Q(zeta_n)^+
      (phi(n)/2 embeddings; 16 at n=120). Pure-state Gram matrices are totally positive in dimension 2
      (pure_state_totally_positive_2d), but the mixed witness diag(sqrt5-2, 3-sqrt5) at conductor 5 is
      PSD under one embedding and indefinite under another. Choice of embedding is an external declaration.
    source_scope_review: Source evalAtS=4a+b*s at s=±9 gives an effective sqrt5 value ±9/4, whose square
      differs from5 by1/16. It is not a real field embedding. New exact coefficients use Q(sqrt5), an
      actual conditional real root s>0,s²=5, and isolating interval(2,3). Pure rank-one Gram forms remain
      PSD under either root choice; mixed diag(s-2,3-s) is positive at the positive root and fails at
      the conjugate. Totient arithmetic gives phi(120)=32 and half32=16, without claiming a proved cyclotomic
      field identification.
    admitted_assumptions: []
