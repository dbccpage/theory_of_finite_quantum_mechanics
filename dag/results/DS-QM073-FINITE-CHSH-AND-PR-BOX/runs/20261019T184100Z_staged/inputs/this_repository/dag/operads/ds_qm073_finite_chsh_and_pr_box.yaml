  source_statement: Bare joint tables are always separable (P8-C3); under a single global joint table the finite
    CHSH bound is 2; the PR box reaches 4 and has no joint table. The load-bearing hypothesis is the existence
    of one global joint table. Tsirelson ceiling is not derived (P8-C8 OPEN).
