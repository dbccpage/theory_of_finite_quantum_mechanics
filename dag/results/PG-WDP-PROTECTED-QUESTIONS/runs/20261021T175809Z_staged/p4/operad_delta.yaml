- id: semantic_empty_declaration_selects
  kind: semantic_near_miss
  rationale: Claims the empty declaration selects a point on a 3-point set, the exact statement no_fully_invariant_point
    refutes.
  rejected_by: check_candidate
- id: semantic_complement_singleton_ignored
  kind: semantic_near_miss
  rationale: On two points the complement of a declared point is a single point and is invariant too;
    dropping it reads the n>=3 pattern into n=2.
  rejected_by: check_candidate
- id: semantic_rigidification_price
  kind: semantic_near_miss
  rationale: Confuses the price of selecting one point (one declared point) with the price of trivialising
    the symmetry group (n-1 declared points).
  rejected_by: check_candidate
- id: semantic_non_minimal_marked_minimal
  kind: semantic_near_miss
  rationale: Marks a two-point declaration as inclusion-minimal although each of its singletons already
    selects.
  rejected_by: check_candidate
- id: semantic_one_point_pays_a_declaration
  kind: semantic_near_miss
  rationale: Applies the at-least-two-points theorem at n=1, where the empty declaration selects the only
    point for free.
  rejected_by: check_candidate
- id: semantic_empty_carrier_selects
  kind: semantic_near_miss
  rationale: Claims a selected point on an empty carrier; the vacuous-universal reading of invariance
