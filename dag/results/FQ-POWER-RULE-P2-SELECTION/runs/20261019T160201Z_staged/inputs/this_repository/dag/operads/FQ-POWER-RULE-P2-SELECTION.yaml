target:
  source_statement: Within the declared positive-power family P_p(i) = |c_i|^p / sum_j |c_j|^p on two rational
    orthonormal contexts sharing a ray (psi = (1,1,0), (3,4,5) rotation), context-independence holds iff (3/5)^p
    + (4/5)^p = 1, whose unique positive solution is p = 2. Classifies the power family; not a Gleason theorem.
    Sorkin I3 does not select p (vanishes at p=1 and p=2).
