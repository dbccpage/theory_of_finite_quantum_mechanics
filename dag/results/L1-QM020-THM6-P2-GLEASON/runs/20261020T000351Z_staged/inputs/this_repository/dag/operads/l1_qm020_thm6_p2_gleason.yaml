    complex linear Hilbert representation, phase-blind positive descent map, orthogonal additivity, reversible
    lifted dynamics by linear isometries, interference as bilinear cross terms, projection-measure / frame-function
    structure. For dim >= 3 Gleason gives Tr(rho Pi); dim 2 needs a POVM variant. This is the Born-uniqueness
    firewall.'
