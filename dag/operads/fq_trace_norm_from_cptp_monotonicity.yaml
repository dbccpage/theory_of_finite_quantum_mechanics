  source_bottleneck: No Lean statement of the uniqueness-up-to-scale theorem found; TraceZeroDuality.lean item
    3 states only that c||.||_1 is monotone for every c > 0. Rust certifies trace norms of given Hermitian matrices
    over Q(i), not the theorem.
