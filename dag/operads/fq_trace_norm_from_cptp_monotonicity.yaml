  source_statement: 'If norms N_n on Herm_0(n,C) satisfy N_m(Phi(X)) <= N_n(X) for every CPTP map Phi : M_n(C)
    -> M_m(C), then there is one c > 0 with N_n = c ||.||_1 on every nonzero space. Holds on the full stated channel
    and matrix domain; not a selection of that domain from primitive difference.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
