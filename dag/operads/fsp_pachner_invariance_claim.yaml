target:
  source_statement: 'Claimed: a discrete topological partition function on 4D triangulations is invariant
    under the 1-5, 2-4 and 3-3 Pachner moves; the source names no state-sum model, and the Regge action
    itself is not Pachner invariant.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Narrowed algebraic checks only. Five-integer face-vector translations preserve the
    displayed linear functionals; solving two rational linear equations characterizes invariant count
    weights. In Lean no simplicial complex, move admissibility, topology, or flat-connection extension
    count is constructed. The independent checker performs additional finite simplex-set examples, not
    a general refinement proof. normalizedFlatGaugeSum declares inverse-G cancellation for delta 0 and
    1 and returns zero otherwise; no gauge-bundle counting theorem is established. The Regge shift and
    WDW mass are supplied scalar formulas, not geometric action differences or constraint solutions. The
    stated face-count trajectories and arithmetic remain exact. Status is unchanged. The original physical
    or operational bridge remains open.
  source_refs:
  - dag/derivations/26_fsp/tfq_1214_fsp_pachner_invariance_claim.md
  - papers/core/fsp/theory_of_finite_fsp.md
