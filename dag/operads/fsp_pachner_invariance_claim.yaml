target:
  source_statement: For every finite group G, the untwisted flat-connection count on the canonical 4D
    1-5, 2-4 and 3-3 Pachner pairs, divided by |G| to the number of interior vertices, agrees for every
    fixed flat common boundary. The normalized total counts also agree for every finite compatible exterior
    family represented by dependent pairs, with the same outside-vertex count.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - supplied finite group G and group axioms
  - untwisted flat-connection counting model with one factor |G| per interior vertex
  - canonical 4D Pachner facet pairs and finite compatible exterior configurations represented by dependent
    pairs
  source_bottleneck: 'Construct flat fillings by group potentials and boundary triangle cancellation;
    count them with interior-vertex normalization and sum over the declared exterior family. Remaining
    scope: The supplied finite group, untwisted flat-connection model, canonical local complexes and compatible
    finite exterior interface are explicit. No general triangulation/gluing-equivalence or PL-homeomorphism
    library is formalized; no Regge, twisted/Crane-Yetter, fermion-sign or continuum conclusion follows.
    Human review remains pending. Historical unnamed partition-function claim remains unsupported.'
