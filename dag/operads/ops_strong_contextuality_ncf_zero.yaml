target:
  source_statement: 'Proposition B3(3). Write G(e) for the set of g in E(M) with e_C(g restricted to C)
    > 0 for every context C. Then e is strongly contextual (G(e) is empty) if and only if NCF(e) = 0:
    if lambda_g > 0 is feasible then e_C(g|C) >= lambda_g > 0 for every C, so g is in G(e); conversely
    g in G(e) makes lambda = (min over C of e_C(g|C)) delta_g feasible with positive weight. Instance
    recomputed exactly: the PR box on the Bell scenario (contexts ab, ab'', a''b, a''b'', each uniform
    on the two outcome pairs with parity 0, 0, 0, 1) has |G| = 0 and NCF 0. The four parity constraints
    x_a + x_b = 0, x_a + x_b'' = 0, x_a'' + x_b = 0 and x_a'' + x_b'' = 1 sum to 0 = 1 modulo 2, so none
    of the 16 assignments satisfies all.'
