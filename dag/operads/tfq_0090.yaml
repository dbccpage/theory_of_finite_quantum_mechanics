target:
  source_statement: 'PO-035 starts from a zero-container complex of comparisons and refuses an ambient
    continuum as a primitive. Its README marks master rows REQUIRES_CORRECTION: the light-cone story still
    owes a scaling gap, and the Regge row still owes a split between cochain curvature and metric deficit.
    What is finite is the comparison network and its holonomy words. What is not discharged is lattice-spacing
    descent and the claim that a hinge deficit equals curvature of a smooth manifold. That identification
    stays GAP. A finite complex is not quantum gravity. Narrowed in Lean 4 and an independent Python verifier
    to three exact algebraic components and scope fences over Q: (1) on the 4-vertex tetrahedral comparison
    2-complex K_4^(2), exactness d_1(d_0 phi) = 0, gauge invariance d_1(omega + d_0 phi) = d_1(omega),
    linear amplitude scaling, and the discrete Bianchi identity F012 - F013 + F023 - F123 = 0; (2) the
    OBL-R03 split between cochain curvature and Regge metric deficit showing that uniform edge-length
    rescaling leaves equilateral Regge deficits invariant while cochain curvature scales linearly, a flat
    6-equilateral-triangle hinge admits arbitrary nonzero cochain curvature, a pure-gauge 1-cochain on the
    equilateral tetrahedron has zero cochain curvature but positive Regge deficit fullTurn / 2 per vertex,
    and the global Gauss-Bonnet sum 2 * fullTurn != 0 contrasts with the zero Bianchi cycle sum; and (3) the
    OBL-R01 continuum light-cone scaling and lattice-anisotropy fence showing that ax = c_target * at
    reproduces any nonzero light-cone speed c_target, varying ax in {1/2, 2/3, 1} flips the causal
    character of (N_t, N_x) = (2, 3), and (3, 4) vs (5, 0) share Euclidean squared radius 25 while
    requiring distinct Manhattan step counts 7 != 5.'
