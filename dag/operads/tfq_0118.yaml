target:
  source_statement: 'Package 007 separates finite evidence from open continuum obligations. Its README
    says a pillar counts as a checked row only when the claim ledger marks it finite_checked or
    mechanized and axiom-audited. Five obligations stay open: polynomial density, metric completion,
    semantic normal forms, general chain maps, and a specific interacting theory. What is finite is
    cyclic inclusion and separating character sums inside a declared budget. What is not discharged is
    that interacting theory and the continuum limit, which remains GAP. A fixed-size enclosure is not
    smooth spacetime. Narrowed in Lean 4 and an independent Python verifier to three exact
    finite/algebraic components and scope fences: (1) injective dyadic cyclic inclusion
    dyadicInclude : Fin N -> Fin (2 * N) (x -> 2 * x), modular-addition homomorphism, and
    non-surjectivity (odd residues missed at every finite level); (2) point-separating dual character
    sums on Z/4Z over Q[i] (charPointProjector4 x y = (4, 0) iff x = y else (0, 0), and separation of
    every distinct pair x != y); and (3) the discretization-defect fence for f(t) = t^2 showing that
    the left Riemann defect 1/3 - S_N(t^2) = (3 * N - 1) / (6 * N^2) > 0 is strictly positive for all
    finite budgets N >= 1, together with the quartic interacting EOM superposition defect
    3 * g * a * b * (a + b) showing that linear superposition at a = b = 1 holds iff g = 0.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
  declared_assumptions:
  - polynomial density and metric completion cdx2.haar_continuous_density (open)
  - specific interacting quantum field theory cdx2.interacting_qft (open)
  source_bottleneck: 'Open rows include cdx2.interacting_qft and cdx2.haar_continuous_density. Continuum
    limit stays GAP.'
