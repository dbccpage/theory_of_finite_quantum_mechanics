target:
  source_statement: 'Rung six (pull request 259) takes Z-4, succession of accepted rounds through the
    element count, under three readings of a round: EVERY event, every ADMITTING event (not a supply)
    and every CHANGING event (the regime differs after it). In Lean, under CHANGING the count of any replayed
    history is the element count of the regime reached less the base''s, so it is a function of base and
    regime, and counted from the empty regime a function of the regime alone; for every history CHANGING
    is at most ADMITTING, which is at most EVERY. Countermodels: EVERY and ADMITTING are not functions
    of base and regime, and CHANGING is not a function of the regime alone across bases (the Lean reading
    regime R2L is reached from the empty regime with count three and from itself with count zero).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondSuccession.Count.changes_counted at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
