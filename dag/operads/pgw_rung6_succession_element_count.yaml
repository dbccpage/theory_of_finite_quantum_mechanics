    elaborated in this checkout (assumption)
  - Lean declaration SecondSuccession.Readings.changing_not_of_regime at dbccpage/19L57G1@85a83ae7c, not
    elaborated in this checkout (assumption)
  source_bottleneck: The readings are of histories of the sealed step, not of an engine's run; class-level
    succession was OPEN at this rung and is closed for clean bases only by rung eight, and within continuation
    attempt two's runs one state is reached in five rounds and in six.
