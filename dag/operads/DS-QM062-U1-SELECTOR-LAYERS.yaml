  source_statement: A nontrivial invariant phase forces a conjugation (L1); within the declared Frobenius comparison
    class R/C/H, R-signed and H are excluded (L2); J^2=-I with S^2=+I gives the complex product on {aI+bJ} and
    Z[i] embeds (L3). The conditional forcing of C needs continuity of reversible dynamics and field uniqueness
    (QM-062-C8..C10). OB-U1 sharpened, not discharged.
