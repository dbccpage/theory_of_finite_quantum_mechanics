target:
  source_statement: 'Suppose an external task requires <a> and <ab> to differ while the current regime
    has <a> ≈ₙ <ab>. Every operation f on the quotient S_n/≈ₙ gives f([<a>]) = f([<ab>]), so no operation
    on the current quotient answers the task on every input, and a refinement adding at least one observation
    o with o(<a>) ≠ o(<ab>) is forced; the analysis gives this as an argument with proof. The lift is
    not unique: under a supplied string decoder, ''payload has more than one position'' and ''payload
    contains b'' both separate <a> from <ab> but disagree on <aa> (true and false), and full inscription
    identity also separates the pair while carrying more than one bit. A canonical tower therefore needs
    a declared minimality or initiality policy, such as fewest new predicates, minimum description length,
    maximal preservation of old equivalences, a free or initial completion, or retention of every tied
    minimum branch.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Supplied string decoder for the payloads of <a>, <ab> and <aa>, used only by the non-uniqueness example
    (assumption)
  source_bottleneck: The Lean declarations cover the quotient barrier; the non-uniqueness of the lift
    rests on the two-predicate example, and no selection policy, fixed ladder of quotients or minimal
    multiplicity lift is derived.
  source_refs:
  - dag/derivations/01_pregenesis/tfq_0425_forced_separation_lift_not_unique.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_genesis_19l57g1/paper.md:118-133
  - omega_engine_education/documentation/000_oepregen/sources/analysis_derivation_v1.md:283-305
  - omega_engine_education/documentation/000_oepregen/03_results_and_arguments.md:81-88
