target:
  source_statement: Rovelli and Smolin (1995, arXiv:gr-qc/9505006, Phys. Rev. D 52, 5743) construct an
    independent basis of states in both the loop representation (Section 3 pp. 12-16) and the SU(2) connection
    representation (Section 4 pp. 17-24) that solves the SU(2) Mandelstam identities (Section 2 eq. (21)
    and conditions i-ii p. 12), labelled by imbedded graphs whose edges carry SU(2) representations (twice-spins
    p_l) and whose higher-valence vertices carry virtual trivalent trees/intertwiners (Appendix A pp.
    36-38), and show in Section 6 (pp. 26-29) that these spin-network states are orthonormal with respect
    to the Ashtekar-Lewandowski Haar measure. This node records the paper as published.
