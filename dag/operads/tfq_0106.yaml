    an external lattice-volume calibration. What is finite is that floating residual on a default valency
    list. What is not discharged is the physical cosmological constant, which stays GAP, and the Einstein
    equation. A few hinges are not a measured Lambda and not quantum gravity. Narrowed in Lean 4 and an
    independent Python verifier to three exact rational algebraic components and scope fences over Q:
    (1) exact rational replay of CosmologicalCoupling::effective_scalar_curvature and evaluate_action in
    code/rust/src/general_relativity/cosmological_constant.rs; (2) the external cell-volume calibration
    underdetermination fence showing that H / V_cell scales as s^-4 under 4D length rescaling and can match
    any nonzero target Lambda_target by choosing V_cell = H / Lambda_target; and (3) the 1-scalar vs.
    10-component 4D symmetric Einstein tensor fence showing that anisotropic profiles (Lambda + delta,
    Lambda - delta, Lambda, Lambda) have vanishing scalar mean residual while violating the componentwise
    Einstein equation with squared residual 2 * delta^2 > 0.'
