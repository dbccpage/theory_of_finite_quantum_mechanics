target:
  source_statement: On Z[i]-valued report vectors the phase-blind weight |c_q|^2 is nonnegative and real; a global
    phase and (in the Lean example) a relative phase lie inside one phase-blind fiber; two vectors are zero-related
    under the phase-blind difference iff phasePD_zeroRel_iff. Fiber enumeration uses a declared finite unit group.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
  - Gaussian-integer/rational amplitude vectors (assumption)
  - quadratic readout |.|^2 (assumption)
  - finite phase group for fiber enumeration (assumption)
  source_bottleneck: Readout |c|^2 and amplitude vectors are declared; the fiber is a property of that readout,
    not derived from a bare difference.
