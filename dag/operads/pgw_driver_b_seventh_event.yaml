target:
  source_statement: Driver B, a lift that needs a new sealed Event kind, is retained as OPEN (AE-DRIVER-B-OPEN)
    and is successor research S3. The Alpha harness has exactly the six sealed Event kinds (Supply, AdmitDatum,
    AdmitForm, AdmitInst, AdmitRuleAll, Impose), and append_sealed_event refuses a seventh constructor
    (SeventhEventError), so no lift beyond the six kinds can be admitted through the slice.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Open. The refusal of label 6 is the bound k < 6 in this model, not a theorem that
    six kinds suffice, and the bound k < 7 accepts 6. The Alpha harness, SeventhEventError, a seal amendment,
    and a factorization of every lift through the six kinds stay open.
  source_refs:
  - dag/derivations/02_genesis/tfq_0503_driver_b_seventh_event.md
  - atlas/papers/finite_obstruction_calculus/genesis/docs/sources/closeout.txt:70-71
