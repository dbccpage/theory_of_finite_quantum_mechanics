target:
  source_statement: Tetron wording in the crate outruns the diagnostic fence and must not be promoted.
    src/tetron.rs says a tetron is a 2-cell, one superconducting island with four Majorana zero modes,
    and it assigns C0 to modes, C1 to parity channels, and C2 to islands. src/lib.rs, which owns the crate
    fence, says the playground does not claim physical Majorana modes. The obligation is to keep the tetron
    array inside the GF(2) schedule and to withhold any hardware reading. Noise modules noise_mc.rs and
    pauli_noise.rs are present in the source list; their sweeps are not an authority terminal either.
  statement_status: source_claim_to_scope_check_not_accepted_result
