  source_statement: The counts are 4 modes, 4 channels and 1 island. Then 4 - 4 + 1 = 1. With those counts,
    (4 - 1) - (4 - 1) = 0. Also (1 + 1) mod 2 = 0, 4 * 2 = 8 and 8 mod 2 = 0. The mode count 4 is not
    2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The 1-by-1 disk cell arithmetic above is the narrowed statement. A superconducting
    device, a physical Majorana zero mode, noise sweeps as an authority terminal, the GF(2) matrix rank
    of any larger grid, and the crate fence in lib.rs stay outside this statement. Do not promote tetron.rs
    physical wording past the GF(2) diagnostic fence in lib.rs.
