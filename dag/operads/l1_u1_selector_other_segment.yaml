presentation:
  status: scoped_stage_result_reviewed
  scope: 'Inside the unit Gaussian rationals the only phases of finite order are the four elements of
    mu_4; the rational circle points outside mu_4 are exactly those with 2x not an integer and they have
    infinite order (kernel instance: (3/5, 4/5)), so a finite phase group inside the Gaussian rationals
    has order dividing 4, whereas the unit circle over a finite field F_p is a different finite carrier
    with p -+ 1 elements (native table, not a kernel statement).'
  colours:
  - id: Bool
    meaning: Scoped semantic carrier with the declared hypotheses.
  - id: CayleyParameter
    meaning: Pair (m, n) of rationals, not both zero
  - id: CirclePoint
    meaning: Pair (x, y) of rationals with x^2 + y^2 = 1
  - id: Exponent
    meaning: Natural number k
  - id: OrderOrInfinite
    meaning: Smallest n > 0 with z^n = 1, or infinite
  - id: Prime
    meaning: Smallest prime dividing den(2x), 0 if 2x is an integer
  - id: SelectorPack
    meaning: Four hand-set Boolean flags
  generators:
  - id: cayley_point
    source_declarations:
    - 'lean4/DerivationDagQMClosure.lean::fq_u1_selector_split_real_zero_divisors_and_cayley_unit_circle
      (line 959): GENERAL in t : Int for the Pythagorean identity (1-t^2)^2 + (2t)^2 = (1+t^2)^2, plus
      fixed conjuncts (1*1-1*1 = 0, 1+1 = 2); this node extends to Rat parameters and surjectivity'
    ordered_inputs:
    - CayleyParameter
    output: CirclePoint
    semantic_predicate: ((n^2-m^2)/(n^2+m^2), 2mn/(n^2+m^2)) has norm 1; every point except (-1,0) arises.
    hypotheses:
    - Points of the unit circle x^2 + y^2 = 1 with rational coordinates (the unit Gaussian rationals)
      under complex multiplication; a phase group is a subgroup; finite means every element has finite
      order.
    arity: 1
    carrier: CayleyParameter
    coefficient_ring: Exact integers and rationals
