scope_notes:
- 'The node is a pointer ("Referenced only ... owned by another segment"), so it cannot be discharged
  here. The local sources are U1SelectorBoundary (a four-Boolean SelectorPack, its AND, a record with
  rival_excluded := false and rfl: bookkeeping), quarter_turn_outside_sign_subgroup (Fin 4 by decide),
  ds_qm062_u1_selector_layers_and_ring_iso (fixed 2 x 2 integers), the Int Cayley identity in fq_u1_selector_split_real_zero_divisors_and_cayley_unit_circle
  (general in t but only an identity) and ds_qm062_and_l1_u1_selector_frob_exclusions_and_gaussian_ring_injectivity
  (fixed plus 1 x 1 additivity/injectivity). The external complex_structure_selector.rs only checks the
  pairing factor sigma(u)u. What a finite carrier can and cannot select is made exact in one place: the
  torsion of the unit Gaussian rationals is mu_4, proved for every rational circle point with an integer-sequence
  argument, with the Cayley map covering the whole circle. This is a no-go for finite carriers inside
  Q(i), not a statement that C or U(1) cannot be selected by other means.'
- The node is a pointer, not a theorem. This result is only the torsion no-go for finite phase groups
  inside the unit Gaussian rationals (torsion = mu_4); it neither derives nor refutes the selection of
