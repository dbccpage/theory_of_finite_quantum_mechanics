target:
  source_statement: qcd_beta0(3, n_f) is the rational 11 - (2/3)*n_f. The Rust report and Lean qcd_beta0_asymptotic_freedom_window
    record the split 4*C_A + (-1/3)*C_A = 11, the values 11, 9, 23/3, 7, and 1/3 at n_f = 0, 3, 5, 6,
    and 16, and the value -1/3 at n_f = 17. The research map says this supports those rational identities
    inside the declared finite model. The same map says it does not support a continuum mass-gap claim,
    a weak-coupling limit, Monte Carlo spectroscopy, or higher-loop MSbar matching. The positive window
    is a finite arithmetic control. It does not say what a running coupling does in a continuum theory.
