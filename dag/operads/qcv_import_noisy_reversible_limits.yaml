target:
  source_statement: Aharonov, Ben-Or, Impagliazzo and Nisan (1996) show that noisy reversible or quantum
    computation with no supply of fresh low-entropy bits cannot preserve its input beyond a short depth;
    the result is cited, not re-proved or imported as a proof here.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - ABIN limitation theorem for noisy reversible computation without a fresh supply
  source_bottleneck: The Aharonov, Ben-Or, Impagliazzo and Nisan limitation for noisy reversible or quantum
    computation with no fresh low-entropy supply stays a citation under that paper's own noise and depth
    hypotheses. These four integer pairs are not that theorem. They are not a trace norm, not a depolarizing
    channel, and not an independent per-qubit noise model. The history-distance product for global depolarizing
    noise stays on the noisy-history record.
  source_refs:
  - dag/derivations/29_computation/tfq_1321_qcv_import_noisy_reversible_limits.md
  - dag/research/quantum_computation_self_obstruction.md
