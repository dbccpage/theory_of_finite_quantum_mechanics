target:
  source_statement: 'Without the external continuation policy the closed system saturates: under the declared
    round shape a closed run from an empty requirement store makes at most n(n-1)/2 rounds (Lean closedRun_round_bound_from_empty,
    2 * rounds ≤ n * (n - 1)), and at the fixpoint any further requirement needs a fresh datum (external
    supply) or a new requirement kind (external goal) (genesis_source §9 item 6). With external supply
    the runs grow in width, not in kind: the sealed mu2 trees record 53 (reading L) and 83 (reading F)
    innovation edges (fresh form plus instance), which the education audit reads as unary forms with 0
    binary (finite computation to the requested depth of 15 transition steps). In the reflective composite
    reflState n demand never dries: for n ≥ 3 the distinct data 1 and 2 have equal depth-one profiles
    (Lean Generator.generation_never_dries). Within the declared local finite-alphabet class (one radius
    d, one colour bound k independent of chain length) every strategy fires and none clears (Lean G1Class.g1_class_exclusion),
    while the clearing members perPairFreshMark (recurring import) and valued (one-time identity-grade
    rule) lie outside the finite declaration. The education audit names the pattern ''endogenous demands,
    exogenous payments''.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Declared round shape of a closed run: a fresh imposed target and a response admitting no fresh datum
    (assumption)'
  - Declared local finite-alphabet strategy class LocalStrategy d with FiniteDeclaration k (assumption)
  source_bottleneck: 'Class-relative and carrier-relative: g1_class_exclusion speaks only of finite-alphabet
    local strategies on the reflective chain, the one-time valued rule clears with no recurring import
    (clears_does_not_imply_not_fires), and the unary-only innovation count is a bounded computation, not
    a theorem about longer runs.'
