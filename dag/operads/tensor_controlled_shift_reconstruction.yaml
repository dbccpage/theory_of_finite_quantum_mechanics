target:
  source_statement: For arbitrary finite n<=m with m nonzero (the smaller subsystem is the control), supplied
    local complex QM, independent bilinear preparation/testing, local tomography, positive product tests,
    finite-sum state closure, and calibrated local-unitary and reversible controlled-shift preservation
    force the represented state cone to be PSD(nm). Tomographic coordinates, Schmidt reachability, cone
    equality and trace normalization are verified in Lean.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - local complex QM and spectral theory
  - independent preparation, testing and convex composition
  - local tomography
  - all local unitary operations
  - coherently calibrated reversible controlled shift
  - effect and finite-test saturation for full measurement availability
  source_bottleneck: Lean constructs complete rectangular Schmidt bases, local unitaries and one modular
    controlled shift, then checks the operational state cone. TFQ-0414--TFQ-0416 check the generated effect
    cone, binary interval and finite POVMs with explicit effect and finite-test saturation premises. Calibration
    and operational preservation remain supplied; primitive difference has not supplied these hypotheses.
  source_refs:
  - dag/derivations/27_tensor_composition/tfq_0412_tensor_controlled_shift_reconstruction.md
  - code/python/src/qm/tensor_composition.py
  - code/python/tests/test_tensor_composition.py
