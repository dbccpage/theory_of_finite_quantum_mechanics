    and authorizer ids. If continuation_refused is set, the conjunction fails. Lean continuationAllowed
    copies that conjunction, and a false authorization bit yields false. Rust prime_algorithm_2 is the
    runtime face of the same control law. Another carrier step is allowed only when this predicate holds.
    AuthorityEffect stays None.
