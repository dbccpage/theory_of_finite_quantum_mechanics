target:
  source_statement: 'If chain maps i: C -> D and r: D -> C satisfy r∘i = id, then induced homology map
    is injective, so extending a complex cannot kill an old class. Instances: two isolated points and
    a triangle with attached face have no such retraction onto the smaller complex where the class would
    be killed.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Chain complex over a declared coefficient ring (assumption)
  source_bottleneck: Statement is about declared finite complexes; it supplies the 'growth does not repair'
    direction used by WDP-CH04-N02.
