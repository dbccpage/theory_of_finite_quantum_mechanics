presentation:
  status: scoped_stage_result_reviewed
  scope: 'For chain maps i: C -> D and r: D -> C over a ring with r . i = id on the middle module and
    r commuting with the boundary, the induced map on homology is injective, so an extension admitting
    such an r cannot kill an old class; the two-points and triangle-with-face extensions kill a class
    (kernel, in the modelled degree fragment, and native) and admit no linear chain retraction (kernel,
    same fragment).'
  colours:
  - id: ChainMap
    meaning: Linear maps in the three degrees commuting with bd and d
  - id: Complex
    meaning: U --bd--> M --d--> L with d . bd = 0
  - id: HomologyMap
    meaning: Induced map on cycles modulo boundaries
  - id: LinearSystem
    meaning: Equations on the unknown entries of r over Q
  - id: Module
    meaning: R-module in one degree
  - id: Retraction
    meaning: Chain map r with r . i = id
  generators:
  - id: chain_complex_fragment
    source_declarations:
    - atlas/papers/finite_obstruction_calculus/pregenesis_to_minimal_symbol_systems/lean4/Paper.lean::ChainFragment
      (line 102; structure with explicit sub on the middle type)
    - atlas/papers/finite_obstruction_calculus/pregenesis_to_minimal_symbol_systems/lean4/Homology.lean::Complex
      (line 31; three groups, boundary, differential, square_zero)
    ordered_inputs:
    - Module
    - Module
    - Module
    output: Complex
    semantic_predicate: U --bd--> M --d--> L with d . bd = 0 (one degree).
    hypotheses:
    - 'Coefficients form a declared ring R (Lean: any ring; native: the rationals); chain complexes are
      free and finite in the native tables; r is a chain map with r . i = id.'
    arity: 3
    carrier: Module
    coefficient_ring: Exact integers and rationals
