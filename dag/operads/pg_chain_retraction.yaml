    original_target: 'If chain maps i: C -> D and r: D -> C satisfy r∘i = id, then induced homology map
      is injective, so extending a complex cannot kill an old class. Instances: two isolated points and
      a triangle with attached face have no such retraction onto the smaller complex where the class would
      be killed.'
    source_scope_review: 'Read Paper.lean (sha b0f6365df8; fragments with explicit sub, chain_retraction_cannot_kill
      line 147), Homology.lean (sha 13d8de1400; hand-built image quotient over Lean-core Grind groups,
      induced_homology_injective line 210) and Paper001.lean (sha b90693440d; ChainRetraction 453, homology_kernel_trivial
      460, homology_injective_of_chain_retraction 468, two_point_retraction_impossible 477, triangle_retraction_impossible
      491). The general theorems are correct. The two named non-example theorems take the pointwise instances
      of the section law and chain condition as hypotheses and derive -1 = 0 or 1 = 0; they are correct
      but do not themselves derive those facts from a chain retraction. Mine: re-proved the injectivity
      for Mathlib modules over any ring (only r . i = id and bd-commutation used), modelled both named
      cases as concrete degree fragments with the killed class in Hom and derived non-existence of a linear
      chain retraction from the general theorem, and tabulated 13 complexes over Q. The converse is false
      over Z (multiplication by 2); over Q it holds on every listed case and on 2448 enumerated subcomplexes,
      recorded as an observation only.'
    admitted_assumptions:
    - Chain complex over a declared coefficient ring (assumption)
    - 'Coefficients form a declared ring R (Lean: any ring; native: the rationals); chain complexes are
