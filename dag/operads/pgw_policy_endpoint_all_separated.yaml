target:
  source_statement: 'Call a regime a policy terminal when no unseparated admitted pair i < j has a valid
    response. The companion theorem policy_terminal_separates shows that a well-formed policy terminal
    whose imposed requirements are all separated separates every admitted pair: an unresolved pair would
    have the fresh-mark response of mark_progress, contradicting terminality. Together with the round
    bound, an unguarded maximal run of the declared closure policy cannot continue indefinitely and cannot
    stop on an unresolved pair for lack of a response.'
