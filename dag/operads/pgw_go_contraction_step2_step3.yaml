target:
  source_statement: 'The contraction family strikes changes from the base seed. The second derivation
    strikes removal and keeps identification, adding a term and adding an assertion (Lean Step3); every
    change comes with a carrying map q, the identity for an addition and a merge for an identification,
    sending terms to terms, each asserted xry to an asserted q(x) r q(y) and the names to the names, and
    carrying maps compose along every sequence (Step3.carries, Reach3.carries). The third derivation also
    strikes identification (Lean Step2, two kinds): Step2.toStep3 embeds each of its changes as a second-seed
    change and Reach2.toReach3 each sequence, so the earlier one-change and sequence theorems restrict
    to it, and its containment of a state in its outcome is a carrying map with the identity.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lean names run opposite to the derivation numbers (Step3 is the second seed's
    three-kind step, Step2 the third seed's two-kind step); the embedding is a restriction, and no carrying
    map exists under the base seed, where a removal un-asserts.
