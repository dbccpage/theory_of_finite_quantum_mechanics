target:
  source_statement: The graph with vertices {0,1,2,3} and edges e0=(0,1), e1=(0,2), e2=(1,3), e3=(2,3),
    e4=(1,2) has exactly eight connected 3-edge subsets among its ten 3-edge subsets. For weights 2, 3,
    5, 7, 11 on those edges in that order, the sum of the products of the two omitted weights over those
    eight subsets is 247, and the same sum with every weight 1 is 8. A rational interval around a 1-to-4-loop
    QED anomalous-moment series stays open.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 1-to-4-loop QED coefficients of a_e
  - fine-structure constant value
  source_bottleneck: The edges and the weights are supplied. These eight subsets are one graph, not a
    theorem for every graph. The QED loop coefficients, the fine-structure constant, and continuum Feynman-parameter
    integrals stay open.
