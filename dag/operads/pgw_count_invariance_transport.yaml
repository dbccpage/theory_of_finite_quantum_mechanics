target:
  source_statement: 'Observational collapse is invariant under a renaming of datum indices with forms
    fixed: the renamed regime collapses the renamed pair exactly when the original regime collapses the
    original pair (collapsed_rename). For any caller-supplied candidate pair list with deciders that track
    collapse, the collapsed-pair counts before and after renaming agree (collapsedCount_rename). Collapse
    also transports across a full two-bijection regime isomorphism (collapsed_transport) and under the
    combined datum-and-form action (collapsed_renameDataForm). Requirements never enter collapse, so the
    renaming action leaves them alone.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The count transport acts on datum indices with forms fixed and takes the pair list
    and decider as parameters; token renaming is inexpressible in the token-erased Lean model, and the
    executable count and the identification of the mapped list with the engine's pair enumeration stay
    computational.
