target:
  source_statement: 'Imported construction, audited against Engle, Livine, Pereira and Rovelli (2008,
    arXiv:0711.0146, Section III eqs. (18)-(22), (27)-(30) pp. 6-9 and Section IV eqs. (24)-(25) p. 8)
    and Freidel and Krasnov (2008, arXiv:0708.1595, Section II.C Lemmas 2.1-2.4 pp. 10-12 and Section
    V eqs. (80)-(91) pp. 24-27): for a four-simplex with ten triangle spins k_ab and five tetrahedral
    SU(2) intertwiners i_a, the Euclidean EPRL vertex amplitude embeds each SU(2) representation k into
    Spin(4) = SU(2)_+ x SU(2)_- at j^+- = |1 +- gamma| k / 2 (so k = j^+ + j^- for 0 < gamma < 1 and k
    = j^+ - j^- for gamma > 1, eqs. (18)-(20)) and contracts the resulting boosters with the Spin(4) 15j
    symbol (eqs. (29)-(30)), while the Lorentzian vertex embeds k into the SL(2,C) unitary principal series
    at (n, rho) = (2k, 2 gamma k) in EPRL''s integer-n convention (eq. (24) p. 8, often written (j, gamma
    j) when indexing by half-integer spin j = n/2 = k). It requires continuum Lie-group representations,
    the boundary Hilbert space of spin networks and sums over spins whose convergence and continuum limit
    are open research questions. The repository has finite cyclotomic amplitudes (TFQ-0198) that it refuses
    to identify with a continuum spin foam.'
  statement_status: source_claim_to_scope_check_not_accepted_result
