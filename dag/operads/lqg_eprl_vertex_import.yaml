target:
  source_statement: For rational gamma and rational k, the imported Euclidean labels are j+ = |1 + gamma|
    k / 2 and j- = |1 - gamma| k / 2. When 0 < gamma < 1 they equal (1 + gamma) k / 2 and (1 - gamma)
    k / 2, their sum is k, and their difference is gamma k. When gamma > 1 they equal (1 + gamma) k /
    2 and (gamma - 1) k / 2, their difference is k, and their sum is gamma k. At gamma = 1/2 and k = 2
    the labels are 3/2 and 1/2, the sum is 2, and the difference is 1, which is not 2. At gamma = 3 and
    k = 2 the labels are 4 and 2, the difference is 2, and the sum is 6, which is not 2. At gamma = 1
    and k = 2 the labels are 2 and 0, and both the sum and the difference equal 2. The imported Lorentzian
    pair is (n, rho) = (2 k, 2 gamma k), with rho = gamma n = 2 gamma (n / 2). At gamma = 1/2 and k =
    2 this pair is (4, 2), the index j = n / 2 equals 2, and gamma j equals 1, so rho = 2 gamma j rather
    than gamma j. The number of unordered pairs among five indices is 10. A Spin(4) 15j contraction, booster
    factors, a continuum Lie-group representation, a spin-network boundary space, a sum over spins, a
    continuum limit, a semiclassical limit, and a cosmological constant stay imported and are not constructed.
    The finite cyclotomic amplitudes named by TFQ-0198 are not identified with an EPRL-FK vertex.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - SU(2) and Spin(4) representation theory (assumption)
  - simplicity constraints and Immirzi parameter (assumption)
  source_bottleneck: The checked identities are rational arithmetic for the imported labels j+ = |1 +
    gamma| k / 2 and j- = |1 - gamma| k / 2, the pair (n, rho) = (2 k, 2 gamma k), and the count of 10
    unordered pairs among five indices. They are not a Spin(4) 15j symbol, not a booster contraction,
    and not a continuum, semiclassical, or cosmological-constant limit. No source maps the finite cyclotomic
    amplitudes to the EPRL-FK amplitude.
