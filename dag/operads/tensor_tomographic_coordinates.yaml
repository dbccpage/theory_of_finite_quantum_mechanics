    reconstruction, injectivity, surjectivity, uniqueness, and process calibration. Local complex QM and
    the operational bilinear/tomography premises remain supplied. The displayed positive projector-basis
    formula and SEP/BP commentary are prose corollaries, not additional Lean claims.
