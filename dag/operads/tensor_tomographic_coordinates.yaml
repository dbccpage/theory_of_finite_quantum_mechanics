  source_statement: Independent bilinear preparations and tests with trace-factorized product probabilities
    and local tomography construct a unique real linear equivalence with joint Hermitian matrices for
    arbitrary finite local complex dimensions. The equivalence preserves products and all product tests;
    the deterministic product test is trace. The joint state cone is not assumed.
