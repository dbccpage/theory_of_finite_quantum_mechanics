    (assumption)
  source_bottleneck: 'No requirement-kind grammar is derived: the stake is a declared input, its invariance
    for E3, E4 and E6 is OPEN, and the Desc and KindDesc families are guard and event-kind toggles, not
    requirement-kind families.'
