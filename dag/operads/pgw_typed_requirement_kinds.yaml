target:
  source_statement: 'Declared here as the requirement kinds a challenge import may introduce beyond the
    sealed one, an ordered pair of admitted data to be separated (a regime with n data has n(n-1)/2 such
    pairs, allPairs_length). The second derivation''s declared stake is the typed extension it ran: a
    label apart, same or free on every ordered pair of datum indices, free on the diagonal, declared once;
    a pair is honoured when apart pairs are separable and same pairs collapsed, so its two demand kinds
    are a held apart pair that is collapsed and a held same pair that is separable. In rung two''s menu
    of nine rules E4 alone generates both demand kinds (continuation §4), and stake invariance for E3,
    E4 and E6 is OPEN at target-regime transport replay, with no Lean statement about any menu rule (G-3
    asks for the other five rules in Lean and E6''s invariance). The education audit cites the Desc 64-toggle
    and KindDesc 1024-member families; in the sealed Lean these count guard toggles (Constitution.allDescs_length)
    and event-kind enable bits (ControllerCategory.allKinds_length), not requirement kinds.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared stake of the second derivation, an input declared once (continuation.txt §3 definition 7)
    (assumption)
  source_bottleneck: 'No requirement-kind grammar is derived: the stake is a declared input, its invariance
    for E3, E4 and E6 is OPEN, and the Desc and KindDesc families are guard and event-kind toggles, not
    requirement-kind families.'
