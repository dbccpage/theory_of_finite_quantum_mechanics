target:
  source_statement: 'In Lean (LggrFiniteResults), take a length n > 0 and edge parities b : Nat -> Bool.
    Let holonomy b k be the exclusive or of b 0, ..., b (k-1), and call g a section when, for every i
    < n, the exclusive or of g i and g ((i+1) mod n) equals b i. Then (section_exists_iff_holonomy_zero)
    a section exists if and only if holonomy b n = false. Further (no_joint_measure_when_holonomy_one),
    if holonomy b n = true then no finitely supported natural-weight measure on assignments Nat -> Bool
    with positive total mass has, for every i < n, zero pushforward weight on every pair of values (g
    i, g ((i+1) mod n)) whose exclusive or differs from b i. These are the clause "G(e) is nonempty iff
    the holonomy h is 0" and the clause "holonomy 1 forbids a positive-mass joint measure with parity-supported
    marginals" of Proposition B6. Not in Lean: the arc-cover clause, the noncontextual-fraction clause
    and the Cech-cohomology reading.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lean statement is the narrowed one above; no Lean statement mentions a nerve,
    a cohomology class or the noncontextual fraction. Independently replayed with Lean 4.35.0; the source-bound
    axiom receipt is dag/research/foc035_observer_presheaf_lean_replay.json.
