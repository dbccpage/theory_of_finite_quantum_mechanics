target:
  source_statement: toric_code.rs builds a rectangular CSS code on periodic_square_complex, with a budget
    of 256 plaquettes. It computes star and plaquette stabilizers, logical operators, distance, ground-state
    degeneracy, endpoint defects of e and m strings, and the sign of an e loop around an m string. The
    header says no Hamiltonian gap and no threshold is asserted. That refusal is local to this topological
    code. It is not the QCD gap in the Creutz discussion, and the Z2 anyon strings are not color-electric
    flux on the su(3)_c graph. A Kitaev-Preskill entropy of one bit, where the test records it, remains
    a stabilizer calculation.
