target:
  source_statement: 'MssnObstructionDetector.lean defines a Boolean active-obstruction predicate obstP
    on a passage state with witness pairs, protected pairs and an optional list of observation columns,
    and shows that it equals the conjunction of four gates: retained, protected, observation declared,
    and declared observation not separating the pair (obstP_factors, obst_of_gates). On the triangle a→b→c→a
    it shows that the cycle circulation vanishes on every integer coboundary d₀g (cycle_circulation_coboundary_vanishes),
    that x = (1,0,0) has circulation 1 (circulation_flux_obstruction), and that no integer potential g
    has d₀g = (1,0,0) (no_scalar_potential_for_unit_flux). candidateLiftCondition is a necessary condition
    on supplied metadata, not an implementation of the lift laws or an authorization decision.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Supplied observation columns in PState, not a checked partition or the full Genesis passage state
    (assumption)
  source_bottleneck: The circulation results are relative to the displayed d₀ over ℤ; candidateLiftCondition
    consumes a supplied Boolean and verifies neither that an edit resolves an obstruction nor that it
    is authorized, and the Rust audit returns the circulation value without a potential search.
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0534_mssn_circulation_obstruction.md
