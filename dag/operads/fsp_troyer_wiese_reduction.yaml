target:
  source_statement: 'Troyer-Wiese (2005): the NP-complete decision whether a 3D +-J Ising spin glass has
    ground energy below a threshold reduces in polynomial time to estimating the thermal energy of the
    frustrated quantum model -sum J_ij sigma^x_i sigma^x_j at beta J >= N ln 2 + ln(12N); a deterministic
    polynomial estimator for that family would give P = NP, a randomized one NP subset of BPP.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Troyer and Wiese, PRL 94, 170201 (2005), cond-mat/0408370, equations (10)-(11) and footnote 9
  - NP-completeness of the 3D Ising spin-glass ground-state decision problem (Barahona)
  source_bottleneck: This is a worst-case statement about a model family under a precision promise; it
    is not formalized here, is not a reduction to the Hubbard model, and does not make any fixed finite
    system or every fermionic Hamiltonian intractable.
