- kind: theorem
  name: gleason_real
  line: 1510
  signature_excerpt: |-
    theorem gleason_real {f : (Fin 3 → ℝ) → ℝ} {W : ℝ} (hf : IsFrameFunction f W)
        (hc : ContinuousOn f {v | v ≠ 0}) :
        ∃ p q r : Fin 3 → ℝ, IsOrthonormal p q r ∧ ∃ M α m : ℝ, ∀ v : Fin 3 → ℝ, v ≠ 0 →
          f v = (M * dot3 v p ^ 2 + α * dot3 v q ^ 2 + m * dot3 v r ^ 2) / dot3 v v
  source: lean4/GleasonRealSphere.lean
