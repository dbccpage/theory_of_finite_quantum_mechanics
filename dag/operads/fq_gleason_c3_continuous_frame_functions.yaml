- kind: theorem
  name: gleason_complex
  line: 525
  signature_excerpt: |-
    theorem gleason_complex {F : (Fin 3 → ℂ) → ℝ} {W : ℝ} (hF : IsFrameFunctionC F W)
        (hc : ContinuousOn F {v | v ≠ 0}) :
        ∃ p q r : Fin 3 → ℂ, IsOrthonormalC p q r ∧ ∃ M α m : ℝ,
          ∀ v : Fin 3 → ℂ, v ≠ 0 →
            F v = (M * normSq (dotC p v) + α * normSq (dotC q v) + m * normSq (dotC r v)) / nsq v
  source: lean4/GleasonComplexSphere.lean
  repository: this_repository
  source_sha256: 72f3eaf6b95f5efaaca94bf90fb639b6849659b869c74ae6df03b3c912743ccc
