target:
  source_statement: 'For F : C^3 -> R and W : R, assume GleasonComplex.IsFrameFunctionC F W (complex nonzero-scalar
    invariance and weight W on each nonzero orthogonal triple) and ContinuousOn F {v | v != 0}. Then there
    is a complex orthonormal frame p,q,r and real coefficients M,alpha,m with F(v) = (M |<p,v>|^2 + alpha
    |<q,v>|^2 + m |<r,v>|^2)/||v||^2 for every nonzero v. Signed functions are allowed.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
