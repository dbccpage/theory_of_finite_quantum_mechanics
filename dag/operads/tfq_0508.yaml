target:
  source_statement: 'When a packet family declares a cochain representation C⁰ → C¹ → C² with maps d₀
    and d₁, the discrepancy of a candidate 1-cochain c is measured by the boundary defect Φ₁ = ‖[c]‖ in
    C¹/im d₀ (the quotient infimum of ‖c − d₀a‖ over 0-cochains a), the cycle defect Γ₂ = ‖d₁c‖ in C²,
    and the total residual Ξ = Φ₁ + Γ₂; a candidate is accepted exactly when Ξ = 0 over the declared observer.
    Because d₁d₀ = 0, Φ₁ = 0 forces Γ₂ = 0, so Ξ = 0 exactly when Φ₁ = 0. Worked example: on the oriented
    triangle 0 → 1 → 2 → 0 with one declared face, c = (1, 1, 1) gives Φ₁ = 3 and Γ₂ = 3, so Ξ = 6, while
    c = (1, 1, −2) = d₀(0, 1, 2) gives Φ₁ = Γ₂ = Ξ = 0.'
