target:
  source_statement: 'Root P, the evaluation layer: with V a finite-dimensional real space of defects,
    A a finite-dimensional space of repairs, d: A → V a linear repair map, δ ∈ V an exhibited defect and
    J a declared seminorm or cost, the quotient defect is Φ_J([δ]) = inf_{α ∈ A} J(δ − dα), where [δ]
    is the coset of δ modulo im d. The expression is not primitive: it imports a linear carrier, a repair
    map and a cost, each declared rather than derived. Root P presupposes Root W, the admitted cut with
    its witnessed irreflexive relation, as carrier and never substitutes for it. This infimum over repairs
    is the quantity WDP later writes Φ₁.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared defect space V, repair space A, linear repair map d and cost J (assumption)
  source_bottleneck: A declared construction, not a theorem; it derives none of the carrier, repair map
    or cost from the admitted cut, and Φ_J([δ]) equals J(δ) or ‖d₀δ‖₁ only where that value is shown to
    be the infimum.
