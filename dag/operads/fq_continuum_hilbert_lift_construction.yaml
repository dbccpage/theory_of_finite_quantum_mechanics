target:
  source_statement: 'With the scalar field k in {R, C} and the l2 uniformity supplied as named hypotheses:
    the exact finite carriers Fin n -> Q form a tower under zero padding whose directed union N ->0 Q
    is exhausted by the finite stages; the Hausdorff completion of N ->0 k is a complete inner product
    space into which the exact carrier embeds inner-product-preservingly, injectively and padding-compatibly
    (lift, liftFin); a sequence of exact vectors is Cauchy in the lift exactly when it is rational-l2-Cauchy,
    and every such sequence converges; over R the exact carrier is dense, continuous maps out of the lift
    are determined on exact vectors, and the lift is strictly larger than the carrier; over C the Gaussian-rational
    pairs a + ib are dense with the exact inner-product identity; the completion of the exact carrier
    under its intrinsic rational uniformity (the infimum of the rational sqdist-ball filters) is uniformly
    isomorphic to the real lift; the lift is linearly isometric to l2(N, k) with exact vectors as their
    coordinate sequences; every Q-linear map of the exact carrier with a rational quadratic bound C lifts
    uniquely to a continuous linear operator of norm at most sqrt(C) (the shift lifts to an isometry),
    and the Q-linear coordinate-sum functional admits no continuous extension.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - scalar field R or C, i.e. the completion of Q or of Q(i) (assumption)
  - l2 uniformity on the exact carrier (assumption; harmonic_separates_uniformities shows that l1 is a
    different choice)
  source_bottleneck: Both hypotheses are supplied; their selection from finite-theory primitives is the
    content of FQ-GAP-CONTINUUM-HILBERT-LIFT. Dynamics and generators are not lifted (FQ-GAP-STONE-CONTINUOUS-TIME);
    the bound C on an exact operator is a hypothesis.
  source_refs:
