target:
  source_statement: For a finite group G with a unitary representation, a finite periodic spatial lattice
    with edge set E and finite real beta, construct the temporal-gauge Wilson transfer matrix on functions
    on G^E and prove strict entrywise positivity and gauge equivariance. Its Perron eigenvalue lambda_0
    is positive and simple, its normalized Perron vector is gauge invariant, and the non-Perron spectral-radius
    ratio q in the gauge-invariant sector satisfies 0 <= q < 1. Set q = 0 when that sector has no non-Perron
    eigenvalues. For q > 0 the logarithmic gap -log(q) is positive; q = 0 represents an infinite spectral
    decay rate, not a finite logarithm.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Construct the transfer matrix and its gauge action, prove the required positivity
    and equivariance, and apply Perron-Frobenius in Lean. Handle zero subleading eigenvalues and the one-dimensional
    physical sector explicitly. Correlation-decay bounds require the relevant self-adjointness or operator
    estimates. No bound uniform in volume or lattice spacing, or continuum Yang-Mills mass gap, follows
    from the finite-volume statement.
