target:
  source_statement: At mu = i mu_I with real mu_I, gamma5 D(i mu_I) gamma5 = D(i mu_I)^dagger, so det
    D(i mu_I) is real; nonnegativity needs two degenerate flavors (or a staggered operator m + K with
    K anti-Hermitian, m > 0), and Z(mu_I) has Roberge-Weiss periodicity 2 pi T / 3.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - imaginary chemical potential and Roberge-Weiss periodicity (literature)
  source_bottleneck: 'Analytic continuation from imaginary to real mu is an extrapolation, not a sign-free
    route to real mu; not established in this checkout. CampaignFspImaginaryMuRealDet covers arbitrary
    finite bipartite transport blocks at unit fugacity: staggered adjoint symmetry, determinant reality,
    two-flavor nonnegativity and positive-mass staggered positivity. Its centerSum_periodic concerns a
    declared finite center-orbit sum only; it supplies no QCD measure, spin-taste reconstruction, phase
    transition or analytic-continuation theorem. The full node remains imported.'
