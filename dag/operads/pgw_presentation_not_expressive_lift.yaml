target:
  source_statement: 'Write P for the presented inscriptions and O for the internal observations. Supplying
    <a> after <> changes P from {<>} to {<a>} and leaves O_1 = O_0 = ∅, so no new internal distinction
    is available. With q : P → N sending an inscription to the distinctions the regime has, x ≠ y in P
    can hold while q(x) = q(y) in N, so a new presentation does not imply a new internal class, and in
    the other direction q(x) = q(y) does not imply x = y. Under the opaque convention <a> is a new presentation
    state in the same internal class as <>; the statement holds under that convention only.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Opaque identity convention: a state is what the regime can tell apart, so internal identity is the
    quotient by ≈ₙ (assumption)'
  source_bottleneck: 'Under the exact-inscription convention <a> is a new state; the statement concerns
    discriminating power, not meaning, since a regime can gain a syntactic distinction such as empty versus
    nonempty payload without assigning a a referent. Reviewed in PR 185: lean4/PregenesisPresentationLift.lean
    checks a two-inscription model (Inscription = {nil, markA}, convention comparison, P0 = {nil} against
    P1 = {nil, markA}) in which the distinction map q is the constant empty map by definition and the
    exact-inscription convention is defined as equality, so O_0 = O_1 = empty, the non-injectivity of
    q and the statement that the collapse holds under the opaque convention only are properties of those
    definitions. Not proved: an observation family O_n and q derived from it, supplying <a> as an operation
    that leaves O unchanged, P changing to {<a>} as the statement words it (the model has P1 = {<>, <a>}),
    the link between q and the Genesis regime model of the module, and the opaque identity convention
    itself, which stays an import.'
  source_refs:
  - dag/derivations/01_pregenesis/tfq_0422_presentation_not_expressive_lift.md
  - omega_engine_education/documentation/000_oepregen/sources/analysis_derivation_v1.md:110-135
  - omega_engine_education/documentation/000_oepregen/sources/analysis_derivation_v1.md:925-975
  - omega_engine_education/documentation/000_oepregen/03_results_and_arguments.md:29-43
