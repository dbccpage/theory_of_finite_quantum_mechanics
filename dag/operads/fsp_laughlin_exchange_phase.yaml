target:
  source_statement: 'Arovas-Schrieffer-Wilczek: adiabatic exchange of two quasiholes in the nu = 1/m Laughlin
    state gives statistical phase theta = pi/m.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Laughlin nu = 1/m state and quasihole Berry phase (literature)
  source_bottleneck: Narrowed algebraic checks only. Jastrow exchange identities hold in commutative rings.
    A supplied 2x2 integer companion matrix and its square satisfy cyclotomic identities and fail involution
    tests. The quasihole polynomial is symmetric. The matrix model is not identified with a physical Berry
    holonomy, and symmetry alone does not derive a Berry phase or its physical origin. Status is unchanged.
    The original physical or operational bridge remains open.
