target:
  source_statement: Let D₂ have carrier {0, 1} and the single edge 0 → 1. For any relation R with a supplied
    witness R(a, b), the map f(0) = a, f(1) = b preserves the edge, and every map sending 0 to a and 1
    to b equals it, so f is the unique endpoint-preserving map from D₂ (D2_initial_pointed). Under irreflexivity
    this map is injective, because the endpoints of an irreflexive witnessed edge differ (irrefl_witness_ne).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'This represents the chosen witness only: the map need not describe every edge of
    R or preserve non-edges, needs no reverse edge or composition law, and does not force irreflexivity
    from opaque marks.'
