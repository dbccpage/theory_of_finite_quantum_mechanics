target:
  source_statement: 'In Lean (LggrFiniteResults), a finitely supported measure with natural-number weights
    is a list of (value, weight) pairs, and pushforward along f maps each value by f and keeps its weight.
    Then: push of the identity is the identity (push_id); push along g after f equals push along the composite
    (push_comp); total mass is unchanged (mass_push); and the weight at b of push f p equals the mass
    of the entries of p whose image is b (weightAt_push). The note reads marginalisation of a context
    distribution as such a pushforward along the restriction map, so these are the identity and composition
    laws of the functor from the opposite of the context poset to probability vectors (Lemma B2). That
    reading is not a Lean statement. Not covered: rational weights, normalisation to probability vectors,
    the context poset, and the Rust types. The ledger row states the same narrowing.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lean statement is the narrowed one above. The functor over rational probability
    vectors is proved in prose in the note (Lemma B2) and its instances on the PR box and the noisy PR
    boxes are recomputed by the independent check, which does not test the Lean statement. Independently
    replayed with Lean 4.35.0; the source-bound axiom receipt is dag/research/foc035_observer_presheaf_lean_replay.json.
  source_refs:
