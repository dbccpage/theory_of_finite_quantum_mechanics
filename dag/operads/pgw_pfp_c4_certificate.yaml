target:
  source_statement: On the supplied oriented 4-cycle with vertices 0 to 3, edges 01, 12, 23, 03 in that
    order, one declared face 01+12+23−03 and c = (2, −3, 5, 7), the potential a = (0, 2, −1, 4) gives
    d₀a = (2, −3, 5, 4) and residual r = (0, 0, 0, 3) with L1 norm 3, an upper bound. The dual w = (−1,
    −1, −1, 1) is feasible (max |wᵢ| = 1 and d₀ᵀw = 0 at all four vertices) with w·c = 3, so every potential
    leaves L1 cost at least 3 and φ₁ = 3. The face row d₁ = (1, 1, 1, −1) satisfies d₁d₀ = 0 and d₁c =
    −3, so γ₂ = 3. The fixture c4_public_input.json carries this complex, and test_native_certificate_positive_and_decisive_mutations
    checks the certificate through the native Rust checker, rejects a +1 change to each answer field and
    accepts a constant shift of the potential; it passed in the recorded receipt of 2026-10-19 (2 passed,
    0 failed).
