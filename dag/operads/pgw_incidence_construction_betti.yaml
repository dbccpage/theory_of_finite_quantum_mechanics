target:
  source_statement: Starting from the literal supply of <>, the WDP construction records Supply(<>) without
    admitting it, then supplies and admits <a>, <ab> and <c>, forms of arities 1, 2 and 3, three unary
    vertex instances and the edges 01, 12 and 02. Under an explicitly chosen incidence interpretation
    (a datum's admission index is a vertex, an arity-k form carries (k−1)-dimensional simplices, an instance
    lists its increasing vertex indices, and every vertex and face needs its own instance) the cycle has
    rational Betti numbers (1, 1), and admitting the single instance 012 gives (1, 0, 0). The education
    Lean module establishes these Betti numbers from explicit integer kernels and images of the boundary
    matrices (cycle_rational_betti, filled_rational_betti) and that its incidence reading returns the
    cycle and filled simplex lists (cycle_incidence_eq, filled_incidence_eq). For a general face-closed
    family K, that the construction's interpretation is exactly K rests on a written argument.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared incidence interpretation of admitted forms and instances as simplices, incidence_construction.txt
    (assumption)
  source_bottleneck: The interpretation is a construction choice, not extracted from the spelling of <>;
    the general construction result is a written argument, the Lean covers the worked three-vertex complex
    only, and no Lean refinement of the Rust implementation is claimed.
  source_refs:
  - dag/derivations/02_genesis/tfq_0460_incidence_construction_betti.md
