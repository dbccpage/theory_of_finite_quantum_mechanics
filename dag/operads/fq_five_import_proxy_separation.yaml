target:
  source_statement: 'The five finite diagnostic proxy predicates (AdmitsImport in FiniteQM.lean: phase
    fiber, quadratic readout, context parity, frame function, clock tower) are pairwise separated by countermodels
    (5x5 matrix); explicit Born-vs-quartic divergence on psi=(3/5,4/5,0,0) and a 3-ray-vs-PSD gap are
    witnessed. Separation of proxy predicates is not independence of the physical imports.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - finite proxy predicates chosen by the authors (assumption)
  source_bottleneck: Quadratic geometry and Born pairing overlap; no independence theorem exists; bipartite
    composition and entangled preparation are load-bearing but absent from the five-item cascade.
