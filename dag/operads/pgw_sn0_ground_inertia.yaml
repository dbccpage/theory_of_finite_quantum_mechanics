target:
  source_statement: 'S(0) supplies the literal <> as one opaque token: one presentation-token slot and
    two ASCII bytes, and neither count is the number of admitted data. In the sealed Genesis model nothing
    is derivable at genesis (genesis_underivable) and a bare supply leaves every regime unchanged (supply_no_op).
    The sealed Challenge 0 computation records admitted data empty in reading L and the single opaque
    datum in reading F, with no internal observables in either reading. The local S(n) Lean model has
    carrierCard 0 = 0 beside the two-character wire form of the ground token (ground_presentation_vs_carrier),
    and Carrier 0 has no inhabitant (ground_carrier_empty).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared S(n) example carrier table carrierCard in SnCarrier.lean, chosen and not derived from 19L57G1
    (assumption)
  source_bottleneck: Zero admitted data is the reading-L and initial-regime statement; in reading F the
    inscription <> is the single admitted datum after its admission event, so the education phrase does
    not cover reading F. ground_carrier_empty concerns the declared example carrier, not a source replay.
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0511_sn0_ground_inertia.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_genesis_19l57g1/docs/sources/genesis_source.txt:218-221
  - omega_engine_education/documentation/002_oesn/levels/level_00_ground.md:19-22
  - omega_engine_education/documentation/002_oesn/sn.md:44-45
  paper_refs: []
