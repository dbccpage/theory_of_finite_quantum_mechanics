target:
  source_statement: 'WDP-CH06-D01 defines a constitutive succession packet 𝔖 = (S, ⇝, ≺, π): ⇝ an exhibited
    immediate-transition relation, ≺ a declared or proved strict partial order containing ⇝, and π the
    assumptions under which that containment and order hold, so it is visible whether the order is primitive,
    generated by acyclic reachability, or inferred from records. WDP-CH06-P01: nonempty reachability on
    a finite directed graph is a strict partial order exactly when the graph is acyclic, since a directed
    cycle through x gives x ≺ x. WDP-CH06-O01, now a finite proposition: a declared finite labelled transition
    system with exact reports admits greatest strong bisimilarity and its minimal bounded quotient, its
    raw directed relation has a strict transitive edge extension exactly when acyclic, and no nonempty
    strict order can be chosen invariantly from a fully symmetric carrier, so directional order data must
    be declared. Lean Succession.lean separates constitutive order from immediate succession on the chain
    α ⇝ β ⇝ γ: α precedes γ, but γ does not immediately succeed α.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared immediate-transition relation and assumption record π (assumption)
  source_bottleneck: Execution order, record order, constitutive order, coordinate time and duration stay
    distinct; Lean gives transitivity, irreflexivity under M3 and the Chain3 separation, not the P01 equivalence
    for arbitrary finite graphs, and a finite acyclic relation is not spacetime or experienced time.
