    original_target: The graph equation i*hbar dpsi_v/dt = sum_w H_vw psi_w with Hermitian H conserves
      sum |psi_v|^2. The equation is posited from a Hermitian H; the quantity called L1 mass is the L2
      norm squared. Not a derivation of the equation from the finite transport layer.
    source_scope_review: An admitted Hermitian 2×2 H gives derivative -iHψ/hbar. The universal cleared
      rate identity is zero; the rate concerns sum of squared moduli, not the L1 amplitude norm. Forward
      Euler generally changes this mass by dt² times derivative mass. Instantaneous conservation must
      not be advertised as exact discrete-step unitarity.
