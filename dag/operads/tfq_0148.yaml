target:
  source_statement: Covers entropy.rs, exact_entropy.rs, quantum_relative_entropy.rs, and majorization.rs.
    entropy.rs says its population-face entropies are Shannon quantities of the diagonal, equal to operator
    entropies only for computational-basis diagonal states, and it refuses an irrational spectrum for
    the exact logarithm. The other files take a declared rational spectrum, the Umegaki face, and majorization
    by exact partial sums. A Python replay and a Lean 4 declaration would still have to match the diagonal-versus-operator
    split and that refusal.
