target:
  source_statement: Construct and verify a complete d+1 MUB family for the stated prime-power carrier,
    explicitly handling finite-field arithmetic, character sums and normalization.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'The characteristic-two family is dimension 2 only. For odd characteristic the construction
    is now general: for every finite field F with 2 ≠ 0, every commutative domain R with a star ring structure,
    and every nontrivial additive character ψ : F → R with star (ψ t) = ψ (−t), the q+1 bases indexed
    by Option F (the standard basis and x ↦ ψ(a x² + b x)) are pairwise orthogonal within a basis, have
    nonzero norms, and satisfy |⟨u, v⟩|² · q = ‖u‖² ‖v‖² across bases, with q+1 = card (Option F) (mub_family,
    card_bases). The vectors are left unnormalised, so normalisation is the statement about norms, not
    a division. What remains: a complete family for characteristic two beyond dimension 2 (which needs
    the Galois-ring or symplectic-spread construction, not quadratic phases), the instantiation of ψ over
    the concrete complex or cyclotomic carrier the node names (ψ is a parameter here), and the dimension-six
    question, which this node does not address.'
  source_refs:
  - dag/derivations/25_mub/tfq_0403_mub_prime_power_construction.md
  - papers/core/mub6/README.md
