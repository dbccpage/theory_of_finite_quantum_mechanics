target:
  source_statement: Package a unique continuous extension of a uniformly ray-continuous nonnegative rational
    frame function on Q(i)^3 to all complex rays, represented by the embedded tomography matrix with Hermitian
    symmetry, trace one and complex positive semidefiniteness. Also prove the general converse instance
    IsUniformlyRayContinuous (quadRay rho). This target retains uniform continuity; it is not the pointwise-to-uniform
    problem.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - uniform ray continuity
  - nonnegativity
  - complex completion and rational density
  source_bottleneck: 'Formalize the matrix embedding, PSD by density, equality and uniqueness of the continuous
    extension, and a quantitative modulus for quadRay. Rational-valued data reconstruct only Gaussian-rational
    coefficients: covering arbitrary complex density matrices needs real-valued data or a separate approximation
    theorem. Higher dimensions require compatible three-dimensional gluing; infinite dimensions additionally
    need suitable normality/countable additivity and control of trace in limits.'
  source_refs:
  - dag/research/pr500_review/review.md
  - lean4/GleasonGaussianBridge.lean
  - lean4/BornGaussianTomographyReduction.lean
