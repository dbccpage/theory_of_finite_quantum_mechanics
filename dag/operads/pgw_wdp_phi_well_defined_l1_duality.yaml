target:
  source_statement: 'WDP-CH04-P01: Φ_J([δ]) = inf_f J(δ − d₀f) is independent of the representative, because
    δ'' = δ + d₀g turns the infimum into one over h = f − g, a bijection of C⁰. WDP-CH04-P02 (conditional):
    when the repair space is finite-dimensional over ℝ or ℂ and J is a norm, the infimum is attained after
    quotienting ker d₀; the hypotheses cannot be dropped silently for seminorms or infinite carriers.
    WDP-CH04-C01 (conditional): with positive weights w, Φ_{1,w}([δ]) = max{⟨y, δ⟩ : d₀*y = 0, |y_e| ≤
    w_e}, an imported finite-dimensional convex-duality result (REF-MATH-005, Rockafellar, Convex Analysis)
    specialized to the declared weighted graph complex. In code, finite_quotient_l1 minimizes over an
    explicit candidate list, and exact_quotient_l1 solves the weighted ℓ¹ programme over Fraction and
    reports a value only after an independent certificate check.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Finite-dimensional convex (linear-programming) strong duality, REF-MATH-005 Rockafellar Convex Analysis,
    specialized to the declared weighted graph complex (assumption)
  - 'Attainment hypothesis: repair space finite-dimensional over R or C and J a norm, not a seminorm (assumption)'
  source_bottleneck: 'Standing text is the integer triangle coboundary: linearity, residual identity under
    a vertex shift, and minimum absolute residual sum 2 for delta = (1, 1, 0) and for each integer coboundary
    shift of that one triple. Representative independence for a general cost, attainment on a real or
    complex repair space, weighted duality on an arbitrary complex, rational repairs, and a general coefficient
    field stay open. The weak direction of the duality is not imported (WDP-CH04-P07, TFQ-0348, Lean dual_certificate_lower_bound),
    and C01 is not shown for arbitrary coefficient spaces.'
  source_refs:
