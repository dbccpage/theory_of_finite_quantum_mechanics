target:
  source_statement: 'Chapter 10 replaces one observer tuple by four declared layers joined by typed adapters:
    presentation (X, P, q, C), memory (a retention packet), evaluator (D, A, d, J, Γ, T) and policy, with
    policy not authority; the quotient evaluator computes Φ_O([δ]) = inf_α J(δ − dα), and a terminalizer
    may return Accept, Reject or Undetermined against observer-profile data. For source adapters, a partial
    operation descends along onto sort maps iff its output, including undefinedness, is constant on each
    input fibre after the output map, and a relation descends iff its truth value is fibre-constant. WDP-CH10-D06:
    a quotient observer is a linear report map R: C¹ → F^k with Rd₀ = 0, entering only as a presentation
    report and as the induced cost Φ_O(y) = inf{Φ₁(r) : O(r) = y} on im R, with memory, policy and authority
    refused. WDP-CH10-P01: Φ_O(O q) ≤ Φ₁(q), so no observer reports positive obstruction for an exact
    class; WDP-CH10-P02 orders a declared observer family by kernel inclusion (identity finest, zero coarsest);
    WDP-CH10-P03: a report map into a finite grammar G exposes at most |G| visible classes, so more than
    |G| core classes collide.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared presentation, memory, evaluator and policy packets with typed adapters (assumption)
  source_bottleneck: Evaluation is not perception or proposal and policy is not authority; Lean observer_passivity_of_infimum
    takes the fibrewise lower bound as hypothesis and leaves the core-identification clause unformalized,
    while declared_family_order and grammar_resolution_bound cover P02 and P03 at their finite scope.
  source_refs:
