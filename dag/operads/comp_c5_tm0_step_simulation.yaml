target:
  source_statement: For a Mathlib TM0 machine encoded on configuration words lend, left cells, q, a, right
    cells, rend, a machine step from a represented configuration is matched by a rewrite step to a word
    representing the next configuration, and every rewrite step of a represented word is the machine step;
    a word represents at most one configuration.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Mathlib Turing.TM0.Machine, step, Reaches, Tape, ListBlank
  source_bottleneck: Machines in the TM0 form only (one write or one move per transition); representations
    allow blank padding at the far ends; the end rules write a fresh blank, the only place where words
    grow.
  source_refs:
  - dag/derivations/29_computation/tfq_1299_comp_c5_tm0_step_simulation.md
  - dag/research/genesis_to_universal_computation.md
  - lean4/GenesisCompTM.lean
  paper_refs:
