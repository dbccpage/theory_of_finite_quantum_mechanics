target:
  source_statement: The spinless p-wave Kitaev chain H = -sum(t c_j^dag c_{j+1} + Delta c_j c_{j+1} +
    h.c.) - mu sum(c_j^dag c_j - 1/2), its BdG spectrum, the phase region |mu| < 2t with Delta nonzero,
    and the sweet-spot form H = -i t sum gamma_{2j} gamma_{2j+1} with free edge modes gamma_1, gamma_{2L}
    are imported models.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Kitaev 2001 chain Hamiltonian and topological phase table
  source_bottleneck: The fermion Hamiltonian, the BdG spectrum, the phase region as a physical claim,
    and a wire without disorder or trivial subgap states stay imported. The index split and the two integer
    comparisons are one finite reading of the sweet-spot labels and the stated bound. They do not select
    a topological phase.
