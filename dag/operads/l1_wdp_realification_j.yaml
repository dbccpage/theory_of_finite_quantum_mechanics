    original_target: R(A) = [[P,-Q],[Q,P]] is an injective real-linear multiplicative representation of
      complex matrices with J^2 = -I and Tr_R R(A) = 2 Re Tr_C A (Thm 1). A real matrix is in the image
      iff it commutes with J (Thm 2). States are sigma = R(rho)/2. J is declared.
    source_scope_review: 'The node is a DEFINITION whose bottleneck says Lean for Theorems 1 and 2 was
      not looked for. The local source ds_qm062_u1_selector_layers_and_ring_iso is a fixed 2 x 2 integer
      instance (J, S, K, Z1, Z2 and one product), ds_qm062_and_l1_u1_selector_frob_exclusions_and_gaussian_ring_injectivity
      is general in four integers but only for 1 x 1 Gaussian integers, and the paper anchor l1_observer_h1_h5_cochain_flatness_and_wdp_window_mass_realification
      is an excluded aggregate (its only structural conjunct is the trivial iff (b = -c and a = d) <->
      (b + c = 0 and a - d = 0)). The theorems are therefore proved afresh for general finite index types
      in Lean (Theorem 1 pieces and Theorem 2), the trace qualification (A = 1 + i) is a kernel instance,
      and J is shown to be a declaration: a different square root of -I exists and carves out a different
      commutant.'
