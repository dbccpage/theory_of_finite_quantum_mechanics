    kind: semantic_near_miss
    rationale: diag(1,0,0,0) is a positive trace-one real matrix but does not commute with J_2, hence
      is no R(A).
    rejected_by: check_candidate
  - id: semantic_conjugation_counted_as_complex_linear
    kind: semantic_near_miss
    rationale: 'diag(1,-1) implements complex conjugation: it anticommutes with J, so it is not R of a
      complex matrix.'
    rejected_by: check_candidate
  - id: semantic_rectangular_ok_declared_noncommuting
    kind: semantic_near_miss
    rationale: For a 2 x 4 doubled operator the test is J_1 M = M J_2 between different carriers; the
      square-only "commutes with J" is the wrong test.
    rejected_by: check_candidate
  - id: semantic_any_square_root_of_minus_one_is_J
    kind: semantic_near_miss
    rationale: 'The integer matrix [[1,-1],[2,-1]] squares to -I but is neither J nor commutes with J:
      J is declared, not forced by J^2 = -I.'
    rejected_by: check_candidate
  - id: semantic_j_is_the_only_square_root_of_minus_one
    kind: semantic_near_miss
    rationale: Only +-J commute with J, but J^2 = -I has 26 integer solutions in the box [-5,5]; reading
      J as unique hides the declaration.
    rejected_by: check_candidate
  - id: semantic_symmetric_real_matrix_is_hermitian_image
    kind: semantic_near_miss
    rationale: 'Symmetry alone does not put a real matrix in the image: diag(1,2,3,4) is symmetric but
      does not commute with J_2.'
    rejected_by: check_candidate
  - id: semantic_odd_dimension_has_a_J
    kind: semantic_near_miss
    rationale: A complex structure needs even real dimension; a 3 x 3 real matrix has no J_n to commute
      with.
    rejected_by: check_candidate
