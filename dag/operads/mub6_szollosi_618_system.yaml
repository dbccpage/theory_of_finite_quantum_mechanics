target:
  source_statement: For the Szollosi two-circulant family with both additional bases arbitrary, quartet
    existence (at some and at each fixed admissible parameter) is equivalent to a real solution of 618
    rational equations of degree at most two in 440 variables, and every solution lies in the box of radius
    1 for phase and raw-basis coordinates and 3 for cross-product coordinates.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Emptiness over all admissible parameters and all third bases (no_quartet_iff_all_varieties_empty)
    is open; the system covers quartets containing a family member only.
