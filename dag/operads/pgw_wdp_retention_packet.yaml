target:
  source_statement: 'A difference at one exhibition does not by itself remain available at another; a
    retention packet R = (M, u, r, ≈) with memory carrier M, update u: M × I → M, report r: M → O and
    declared recognition comparison ≈ is a definition, not a derivation. Five finite countermodels CM1–CM5
    separate the components in their instances (a static carrier, a blind readout, a coarse report, a
    tolerant comparison, a lossy reset). WDP-CH03-O01, now a finite proposition: for a finite nonempty
    carrier with total labelled deterministic updates and exact readouts or a validated report equivalence,
    descending partition refinement computes the greatest report-respecting update congruence, its minimal
    quotient and behavioural classification without a global chronology. WDP-CH03-O02: typed retention
    extensions on fixed finite M, I, O form the product M^{I×M} × O^M × P(O×O), with quotient and literal-readout
    descent under separate conditions.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared finite carrier, total labelled deterministic update, report map and validated report comparison
    (assumption)
  source_bottleneck: The O prefix on CH03-O01 and CH03-O02 is historical; Lean coverage is partial (BehavioralQuotient.lean
    gives the greatest invariant relation and quotient laws, not finite termination of refinement), and
    nothing here derives retention from a bare set or concerns physical memory.
