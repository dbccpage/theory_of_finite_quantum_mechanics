target:
  source_statement: For a finite gauge group G, a nontrivial irreducible unitary representation R and
    dimension d >= 2, there are explicit beta_0 > 0, K and sigma > 0 depending on G, R and d such that
    for 0 <= beta < beta_0 the Wilson-action expectation of the R-character of every rectangular Wilson
    loop C on a finite periodic lattice much larger than C satisfies |<W_R(C)>| <= K exp(-sigma Area(C)),
    with Area(C) the minimal spanning area.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Prove the bound by a convergent strong-coupling (cluster) expansion in the style
    of Osterwalder-Seiler (1978), with explicit constants. The bound would replace the declared area-law
    formula of TFQ-0024 by a derived inequality at strong coupling; it says nothing about weak coupling
    or the continuum.
  source_refs:
