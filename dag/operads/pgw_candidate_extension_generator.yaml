target:
  source_statement: 'Declared here as the map from an unresolved residual, a demand given as source node,
    target pair, measure and bounds, to a legal proposal space, in the Alpha harness''s three phases.
    Propose: a Proposal is Supply-shaped and no offering is ever executed. Evaluate: evaluate enumerates
    the sealed min_responses, groups them by canonical key and returns an EvalResult that is evidence
    only and is recomputed on the admission path. License: an authorization is bound to the source history
    digest, the target, the measure and the bounds, reuse with any field changed is refused, and uniqueness
    is not authorization (M3, M4). Endogenous demand generation stays OPEN (AE-DEMAND-OPEN): the generator
    answers a host-supplied demand and chooses none.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Alpha harness trust boundary of closeout §7: the host builds each License with make_license and the
    host''s call is the authorization (assumption)'
  source_bottleneck: The generator ranges over the sealed candidate space within declared bounds, where
    'minimum' and 'iso class' are relative to those bounds; the passage system's extensionProposals is
    a separate carrier with no checked bridge to the harness (S7).
