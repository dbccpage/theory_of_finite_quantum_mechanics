target:
  source_statement: 'Let S be a theory in classical first-order logic with a primitive recursive coding
    of its syntax. Write code(psi) for the code of a sentence psi and num(n) for the numeral of a natural
    number n. Assume (i) consistency: there is no sentence psi such that S derives both psi and the negation
    of psi. Assume (ii) a primitive recursive relation Proof such that psi is a theorem of S exactly when
    Proof(p, code(psi)) holds for some natural number p, and Proof is represented at standard numerals:
    for all natural numbers p and s, S derives the sentence expressing Proof(num(p), num(s)) when the
    relation holds and derives its negation when the relation fails. Assume (iii) that S derives every
    true Delta_0 sentence of this coding; that the substitution function subst, sending the code of a
    formula with one free variable and a number n to the code of the sentence obtained by substituting
    num(n) for that variable, is represented in S; that the primitive recursive function neg on codes,
    with neg(code(psi)) equal to code(the negation of psi), is represented in S; and that for each standard
    natural number n, S derives both that every w with w < num(n) equals one of num(0), ..., num(n-1),
    and that every w satisfies w < num(n) or w = num(n) or num(n) < w. Then there is a sentence phi such
    that S derives neither phi nor the negation of phi. The diagonal lemma from representation of subst
    supplies, for the negation of the Rosser formula RosserProv(v) given by existence of a u such that
    Proof(u, v) and such that Proof(w, neg(v)) fails for every w < u, a sentence phi such that S derives
    the biconditional of phi and the negation of RosserProv(num(code(phi))). If S derives phi, a standard
    derivation code p, clause (i), numeral-wise representation of Proof, and the schema that every number
    below num(p) equals one of num(0), ..., num(p-1), yield a derivation of RosserProv(num(code(phi)))
    and then of the negation of phi. If S derives the negation of phi, a least standard derivation code
    q of that negation, numeral-wise representation of Proof, the same bounded schema at q, and the schema
    that every number is below num(q), equal to num(q), or above num(q), yield a derivation of the negation
    of RosserProv(num(code(phi))) and then of phi. Either case contradicts (i). Separately, drop (i) and
    (ii) and keep (iii): if a formula Tr(x) is such that S derives the biconditional of Tr(num(code(psi)))
    and psi for every sentence psi, the same diagonal lemma applied to the negation of Tr supplies a sentence
    lambda for which those biconditionals yield a derivation of both lambda and its negation, so S is
    inconsistent. Both conclusions use only the hypotheses just stated and classical first-order logic.'
