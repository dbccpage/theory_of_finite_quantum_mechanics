- kind: theorem
  name: finite_gauss_matrix_algebra
  line: 350
  signature_excerpt: "theorem finite_gauss_matrix_algebra {Q : Type} [DecidableEq Q]\n    (E : Enum Q)\
    \ :\n    (∀ (T : LinearEnd Q gaussPack) (v : Vec GaussInt Q) (x : Q),\n      T.map v x = applyMat\
    \ gaussPack E (matOf T) v x) ∧\n      (∀ (A : Mat GaussInt Q) (i j : Q),\n        matOf (endOfMat\
    \ gaussPack E A) i j = A i j) ∧\n      (∀ (A B : Mat GaussInt Q) (v : Vec GaussInt Q) (i : Q),\n \
    \       applyMat gaussPack E (mmul gaussPack E A B) v i =\n          applyMat gaussPack E A (applyMat\
    \ gaussPack E B v) i) ∧\n      (∀ (A : Mat GaussInt Q) (u v : Vec GaussInt Q),\n        sesq gaussPack\
    \ E (applyMat gaussPack E A u) v =\n          sesq gaussPack E u\n            (applyMat gaussPack\
    \ E (adj gaussPack A) v)) ∧\n      (∀ (T : LinearEnd Q gaussPack) (A : Mat GaussInt Q),\n        (∀\
    \ v x, T.map v x = applyMat gaussPack E A v x) →\n          ∀ i j, matOf T i j = A i j)"
  source: lean4/HilbertWalkGleasonFin.lean
