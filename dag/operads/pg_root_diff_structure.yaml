  - id: Real0
    meaning: Coproduct of the two channels
  - id: Real0Map
    meaning: Map out of the coproduct
  - id: StructureMap
    meaning: Map from the structure channel to a target
  - id: StructurePayload
    meaning: Payload of the structure channel
