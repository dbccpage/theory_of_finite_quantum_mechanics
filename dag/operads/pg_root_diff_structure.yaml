presentation:
  status: scoped_stage_result_reviewed
  scope: 'The typed coproduct of two payload types (same two-constructor shape as OntologyBasic.Real0)
    is a categorical coproduct that supplies no map between the channels and no element of either channel:
    a map out of it that is the identity on one channel exists exactly when that channel is nonempty or
    the other is empty (so bare existence of such a map is not a reduction theorem for inhabited channels),
    and the two nonemptiness conditions are independent of the construction and of each other.'
