scope_notes:
- 'Mined OntologyBasic.lean (sha256 7ba6024a matches): PrimitiveDifference (line 12, a record Source/Target/delta),
  Structure (line 19, a record with Carrier and five Props) and Real0 (line 27, an inductive with one
  constructor per record type). Real0 is a tagged union of the two record types; its coproduct properties
  are kernel facts about any such inductive and the file proves none of them. The bound bridge theorem
  pg_root_coproduct_inert_diamond_and_six_operation_separation (DerivationDagQMClosure.lean line 1111,
  sha256 c9ad9c23) is a conjunction of integer identities, (0:Nat) != 1 and a Fin 6 index coding: it contains
  no coproduct statement, so it is vacuous for this node. The Rust types primitive_difference.rs
  (external, sha256 matches) defines a zero-difference relation with factors_through, a different notion
  of primitive difference from OntologyBasic.PrimitiveDifference; neither contains the claims about precedence
  of the carrier or the definability ladder. This node is an ADMITTED primitive: the Lean module proves
  the coproduct property for arbitrary payload types and the neutrality of the construction about the
  two posits, and does not turn either posit into a theorem.'
- The coproduct statement "no reduction of either channel to the other and no origin of either" is supported
  only as neutrality of the typed coproduct construction; the precedence and definability clauses are
  not addressed and the posits remain admitted.
