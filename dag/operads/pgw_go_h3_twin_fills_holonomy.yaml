target:
  source_statement: Climbing round H3 is two fills on the H2 carrier. In the twenty-fourth derivation
    a fifth change fills one term, and a filled term x balances exactly when its loop excess e(x,x) is
    zero, the same in every state of a result and every writing (balances_iff); a result is told from
    the one asserting nothing exactly when some filled term's loop excess is non-zero (told_iff). In the
    twenty-fifth a filled triple (x,y,z) balances when the sum around e(x,y) + e(y,z) + e(z,x) is zero,
    which the sameness keeps; a result is told exactly when some filled triple does not balance (nothing_balanced,
    told_iff), with three terms it is blind exactly when the sum around 0,1,2 is zero and the two-way
    sums add up to zero (blind_three_iff), and with every loop and two-way sum zero the triples through
    one term decide (cone_decides). A scratch rank computation of the sums around filled triples modulo
    raising gives 2 of 7 dimensions at three terms, 7 of 13 at four and 16 of 21 at five, only the loops
    unseen from five terms.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - H2 sameness of the twenty-third derivation (Same3) as the carrier of both fills (assumption)
  source_bottleneck: The ranks come from research/twentyfifth/scratch_rank.py, which labels itself scratch
    and not evidence; the general rank criterion C(n − 1, 2), the four-term blind converse and the counts
    are ledger row O2, proved in the paper and checked by computation up to five terms, with no Lean statement.
  source_refs:
  - dag/derivations/02_genesis/tfq_0485_go_h3_twin_fills_holonomy.md
  - atlas/papers/finite_obstruction_calculus/genesis_ongoing/paper/twentyfourth/claim_ledger.md:63
  - atlas/papers/finite_obstruction_calculus/genesis_ongoing/paper/twentyfifth/claim_ledger.md:68
  - atlas/papers/finite_obstruction_calculus/genesis_ongoing/research/twentyfifth/reading_the_seed.md:104-107
  paper_refs: []
  source_claim_label: PROVED_LEAN
  label_rule: Historical status is a source annotation. Check the exact theorem scope and remaining imports
    before reusing a result.
  unavailable_paper_refs: []
  paper_source_pins: []
