target:
  source_statement: 'WDP-CH04-P03: in a window with d₁d₀ = 0, κ¹([h]) = d₁h is well defined on Q¹ because
    d₁(h + d₀α) = d₁h + d₁d₀α = d₁h, and 0 → H¹ → Q¹ → im d₁ → 0 is exact with H¹ = ker κ¹; closedness
    of a class does not depend on the representative, so H¹ is the usual Z¹/B¹ of the window. The sequence
    is an extension: in finite dimension it splits, but a splitting Q¹ ≅ H¹ ⊕ im d₁ requires a chosen
    section and is not canonical. Lean kappa_exact_sequence, with kappa_well_defined and kappa_mk, establishes
    on the literal quotient Quot (Repair d₀), for an additive d₁ with d₁ ∘ d₀ = 0, that the inclusion
    of H¹ is injective, its image is the kernel of κ, a class has zero charge exactly when every representative
    is closed, and κ maps onto the image of d₁; these three declarations use no axioms.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared window with additive d₁ and a d₁d₀ = 0 certificate (assumption)
  source_bottleneck: 'The Lean statement is narrower than the row: set-level exactness on the literal
    quotient, without additive structure on Q¹, additivity of κ¹ or the splitting remark; it takes the
    window as declared and is not a Genesis derivation of it (TFQ-0344).'
