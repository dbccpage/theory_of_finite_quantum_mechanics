target:
  source_statement: 'Lemma A2. Let O'' leave one of K, Adm, norm, Term undeclared, and require that an
    evaluation''s receipt for a claim agree across every admissible completion of the undeclared component.
    Then no evaluation of O'' meets that requirement: for each of the four components there are two admissible
    completions, agreeing elsewhere, whose receipts for one claim differ. Witnesses on the PR box (Bell
    scenario, parity targets 0, 0, 0, 1): K, the Bell cover gives defect 2 and the acyclic sub-cover {ab,
    ab''} gives defect 0; Adm, the noncontextual polytope gives 2 and the no-signalling polytope gives
    0, because the PR box is no-signalling; norm, the l1 norm gives 2 and twice the l1 norm gives 4; Term,
    with defect 2 and empty global support the rule of the note gives OpenObstruction and the rule "defect
    below 3 gives ExactRepair" gives ExactRepair. The lemma does not say that no function from claims
    to receipts exists; any one completion defines a function. The layer has no row, because Definition
    A1 fixes it to diagnostic.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'The norm and Term rows are arithmetic on the defect 2, not receipts of a configurable
    evaluator: the Rust evaluator implements one norm and one terminal rule. The second receipt of the
    Adm row is proved, not computed by the Rust code. Not formalised in Lean.'
