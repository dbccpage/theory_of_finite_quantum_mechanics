target:
  source_statement: Let Exp send each history to an export and let Vbar send each export to a verdict.
    Define V(H) as Vbar applied to Exp(H). If sigma is a function on histories and Exp(sigma(H)) equals
    Exp(H) for each history H, then V(sigma(H)) equals V(H) for each history H. One such export is the
    length of a list of natural numbers. The map that sends 0 to 1, sends 1 to 0, and sends each other
    natural number to itself leaves that length unchanged, so a verdict of the length is unchanged.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Hypotheses (i) NS-14 and (ii) CL-13 are cited, not re-run. Their Lean sources are
    not in this repository. The standing slice is the composition step: an export unchanged by sigma yields
    an unchanged verdict of that export, including list length under the map that swaps 0 with 1. Injectivity
    of sigma, a defect value, and whether a drop is a repair or a reinterpretation stay outside this slice.
    WDP-CH14 has no node in this graph. The unconditional form without an export hypothesis is node OPS-REFUTED-AXIS3-WIDE.'
