target:
  source_statement: 'Axis 3 of WDP-CH14-T01 under three hypotheses. (i) NS-14: an injective renaming sigma
    of presentation tokens commutes with the transition step and with full-history replay. (ii) CL-13
    (passage_charge_const): a quantity conserved by internal transitions is constant on reachable states
    and equals its genesis value. (iii) The verdict V reads a history only through a declared export Exp,
    so V = Vbar o Exp, with Exp(sigma(H)) = Exp(H) for every injective renaming sigma; this is the identical-accessible-exports
    premise of Proposition 3.1 of the Argon synthesis. Then V(sigma(H)) = V(H), because V(sigma(H)) =
    Vbar(Exp(sigma(H))) = Vbar(Exp(H)) = V(H). Without (iii) the statement is false (node OPS-REFUTED-AXIS3-WIDE).
    A drop in the internal defect Delta_O stays computable and renaming-invariant; whether a drop is a
    repair or a reinterpretation is a question about the grounding map of the tokens, which no export-reading
    verdict decides.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Hypotheses (i) NS-14 and (ii) CL-13 are cited, not re-run. Their Lean sources are
    not in this repository. The checked slice is the composition step: an export unchanged by sigma yields
    an unchanged verdict of that export, including list length under the map that swaps 0 with 1. Injectivity
    of sigma, a defect value, and whether a drop is a repair or a reinterpretation stay outside this slice.
    WDP-CH14 has no node in this graph. The unconditional form without an export hypothesis is node OPS-REFUTED-AXIS3-WIDE.'
