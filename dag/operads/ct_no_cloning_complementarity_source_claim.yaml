target:
  source_statement: 'Deutsch and Marletto (2015, arXiv:1405.5563, Sections 8.1-8.7 pp. 20-25) derive within
    their postulate system (Principles I-IX) that in any superinformation medium: (i) the union X union
    Y of two subsidiary information observables is not distinguishable (Section 8.1 p. 20); (ii) no observable
    has refinements of both X and Y (complementarity, Section 8.2 p. 21); (iii) X union Y is not clonable
    (Section 8.3 p. 22); and (iv) composite superinformation media can hold locally inaccessible information
    (entanglement, Section 8.7 pp. 24-25). This node records those source claims; the finite qubit target
    of this stage checks only the linear-algebraic cloning statement for the six Pauli eigenstates over
    Q(i).'
