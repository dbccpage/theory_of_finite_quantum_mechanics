target:
  source_statement: For any carrier with weights in N and signs +-1, an involution tau with w(tau c) =
    w(c) and sign(tau c) = -sign(c) has no fixed point and each pair satisfies w(c) sign(c) + w(tau c)
    sign(tau c) = 0; zero signed sum does not require such a pairing (+2, -1, -1), and a cancelling doublet
    can carry a nonzero observable numerator.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - supplied weight-preserving sign-reversing involution
  source_bottleneck: Summing pairs to get sum_c w(c) sign(c) = 0 on a finite set is a prose orbit-partition
    step (manuscript Section 4.2), not mechanized; observable numerators need A o tau = A; the involution
    is sufficient, not necessary (INV-INVOL-CANC).
  source_refs:
  - dag/derivations/26_fsp/tfq_1193_fsp_involution_pair_cancellation.md
  - papers/core/fsp/the_problem_of_the_fermion_sign.md
  - papers/core/fsp/theory_of_finite_fsp.md
