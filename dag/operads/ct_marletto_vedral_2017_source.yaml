target:
  source_statement: Marletto and Vedral (2017, arXiv:1707.06036, pp. 1-4, Fig. 1) argue within constructor
    theory that if a mediator M locally couples two quantum systems Q1 and Q2 (via Q1 <-> M <-> Q2 with
    no direct Q1-Q2 coupling) and generates entanglement from a product state, then M must carry at least
    two incompatible observables (a superinformation medium), and propose testing gravitationally induced
    phases between two interferometric masses; Bose et al. (2017, arXiv:1707.06050, pp. 1-5, eqs. (1)-(8))
    independently propose a spin-correlation entanglement witness W = |(sigma_x^(1) tensor sigma_z^(2))
    + (sigma_y^(1) tensor sigma_y^(2))| > 1 (eq. (8) p. 4) for two Stern-Gerlach interferometers interacting
    through Newtonian gravity phases delta phi_+- and delta phi_-+ (eqs. (2)-(4) p. 2). This node records
    both papers; no experiment is claimed to have been performed.
