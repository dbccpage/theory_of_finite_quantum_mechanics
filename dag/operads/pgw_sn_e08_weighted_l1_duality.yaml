target:
  source_statement: 'Example E08 takes finite rational cochain spaces, d₀: C⁰ → C¹ and positive rational
    weights ω_e, and states that the minimum over g of Σ_e ω_e |c_e − (d₀g)_e| equals the maximum of cᵀy
    subject to d₀ᵀy = 0 and |y_e| ≤ ω_e, as finite linear-programming duality for the stated feasible
    bounded problem. Matching primal and dual feasible values certify optimality. An ℓ¹ minimizer need
    not be unique and is not in general the ℓ² harmonic residual. The page separately defines a categorical
    adjunction by functors, unit, counit and triangle identities, and says these maps are not the matrix
    pair d₀, d₀ᵀ.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: E08 is a declared mathematical construction that grammar cases do not verify; AdjunctionCochain
    implements only x ↦ (x,0) and first-coordinate projection, and no adjunction is claimed until objects,
    functors, naturality and triangle laws are supplied.
  source_refs:
