    theorem farkas :
        ∀ (n m : ℕ) (A : Fin m → Fin n → K) (b : Fin m → K),
          (∃ x : Fin n → K, ∀ i : Fin m, ∑ j : Fin n, A i j * x j ≤ b i) ∨
            (∃ u : Fin m → K,
              (∀ i, 0 ≤ u i) ∧
              (∀ j : Fin n, ∑ i : Fin m, u i * A i j = 0) ∧
              (∑ i : Fin m, u i * b i < 0))
      | 0, m, A, b => by
          classical
          by_cases hb : ∀ i : Fin m, 0 ≤ b i
          · refine Or.inl ⟨Fin.elim0, ?_⟩
            intro i
            simpa using hb i
          · push Not at hb
            rcases hb with ⟨z, hbz⟩
