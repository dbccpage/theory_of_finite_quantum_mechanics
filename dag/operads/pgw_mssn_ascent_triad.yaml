target:
  source_statement: 'MSS-N separates three evidence states: declared successor ≠ candidate lift ≠ licensed
    lift. A declared successor is a research obligation stated by an atlas row; a candidate lift is submitted
    data, a proposed pair of maps with repair witnesses; a licensed lift has exhausted repairs, a minimized
    extension, a verified retraction and a passing host replay. Every atlas row is a declared successor
    specification, and its successor rationale stays unproved until an accepted lift record is attested.'
