target:
  source_statement: S(6) recovers the old image exactly, but transporting a protected answer F across
    the lift u requires a target counterpart F′ with F′∘u = F, and preserving future operations requires
    the corresponding commuting transition equations. In Lean 4, OldImageLaw u r yields canonical retraction-induced
    transport retractionTransport r F d satisfying F′∘u = F (retraction_transport_law) and canonical transition
    lifts (canonical_transition_lift_commutes), including for SnCarrier (snCarrier_answer_transport, snCarrier_canonical_transition_square)
    and the integer S6Descent slice model (s6Descent_answer_transport, s6Descent_canonical_transition_square),
    while k-step commuting squares preserve transported answers (commuting_square_preserves_transported_answer).
    Off the image, F′ has |Q|^(|B|−|A|) counterparts (transport_counterpart_card, transport_off_image_underdetermined),
    unconstrained target transitions violate preservation (snCarrier_transition_counterexample, s6Descent_transition_counterexample),
    and the old-image identity alone establishes neither a logical conservative extension off the image
    (not_conservative_extension_off_image), nor an adjunction (old_image_not_right_inverse, old_image_not_left_galois_adjunction),
    nor resolution of an unrelated demand (unrelated_demand_not_resolved_by_lift, snCarrier_s6_demand_active).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The canonical retraction-induced transport, counterpart count, k-step commuting-square
    preservation, SnCarrier and integer S6Descent instances, and non-implication countermodels are checked
    in Lean 4; the node remains OPEN because arbitrary future target transitions require case-by-case
    commuting-square verification, the external Python S6Descent class in 002_oesn/code/sn_core.py is
    outside this checkout, and the exercise value s₆ = 1 records an issued descent-checking obligation,
    not a forced survivor.
