target:
  source_statement: 'WDP-CH07-D01: a finite duration gauge is a path system with an additive edge valuation
    λ: E → M into a commutative monoid, D_λ(p) = Σ_j λ(e_j); positivity, Archimedean structure, units
    and real values are extra hypotheses, and WDP-CH07-P01 gives D_λ(pq) = D_λ(p) + D_λ(q) whenever pq
    is defined. Section 7.2 keeps four statuses apart: exact (a displayed t with d₀t = λ), closed nonexact
    (d₁λ = 0 for a declared d₁ while a period or dual certificate shows λ ∉ im d₀), active closure failure
    (d₁λ ≠ 0 on an exhibited 2-cell) and exactness undetermined. WDP-CH07-P02: if λ = d₀t, every directed
    path from a to b has duration t(b) − t(a). The converse needs more than weak connectedness: a base
    vertex reaching every vertex with path-independent sums, or vanishing periods under signed walks;
    the difference of two path sums with common endpoints is a period witness, and a nonzero period refutes
    exactness.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Commutative additive monoid of durations, and an abelian group where exactness is asked (assumption)
  source_bottleneck: Duration is a declared magnitude, not physical or continuum time; the four-status
    classification carries no ledger row, Lean mechanizes P01 and P02 (duration_append, exact_duration_path_independent),
    and Python duration_sum fixes M = ℚ with strict positivity, narrower than D01.
  source_refs:
