target:
  source_statement: For four MZMs under a Lindblad braiding model with gap Delta, length L/xi and poisoning
    rate Gamma_qp > 0, the trace-norm transfer defect obeys Delta_transfer(T) <= min(1, C_LZ (hbar/(Delta
    T))^2 + (Delta/hbar) e^{-L/xi} T + 1 - e^{-Gamma_qp T}) for T >> hbar/Delta, and that envelope has
    a positive minimum.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lindblad derivation, the four-mode braiding model, the exponential poisoning
    term, the Landau-Zener square, and a positive lower bound on the physical transfer defect stay open.
    Older Nat positivity facts in MajoranaCore do not state this envelope. A positive envelope value stays
    separate from a positive transfer defect.
