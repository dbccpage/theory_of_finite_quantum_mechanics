target:
  source_statement: For four MZMs under a Lindblad braiding model with gap Delta, length L/xi and poisoning
    rate Gamma_qp > 0, the trace-norm transfer defect obeys Delta_transfer(T) <= min(1, C_LZ (hbar/(Delta
    T))^2 + (Delta/hbar) e^{-L/xi} T + 1 - e^{-Gamma_qp T}) for T >> hbar/Delta, and that envelope has
    a positive minimum.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lindblad master equation with poisoning and dephasing channels
  - Landau-Zener leakage asymptotics
  source_bottleneck: Derive the envelope from the Lindblad equation; a positive physical lower bound on
    Delta_transfer needs an independent argument, as the source notes.
