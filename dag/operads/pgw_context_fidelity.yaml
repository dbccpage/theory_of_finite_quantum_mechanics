target:
  source_statement: 'A trace that starts from a declared context s′ and takes steps valid relative to
    s′ need not be valid relative to the actual replayed state s ≠ s′: ValidTrace(τ | s′) does not imply
    ValidTrace(τ | s). Trial 2''s Result 15 is the example, with internally consistent reasoning from
    the stale premise s′ = {<>} after Prompt 12 had designated <a> as current. A sound execution contract
    therefore accepts a context binding C(s′) only when s′ = Replay(H). The analysis calls this a clean
    theorem target and gives no proof. The Prompt 17 contrast fits it: a truncated window answered Verified
    and the full replay Retracted, each right for the history it received, which the appended analysis
    calls an information boundary rather than a reasoning failure.'
