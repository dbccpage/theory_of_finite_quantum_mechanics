  source_statement: 'The claimed dichotomy (each finite quantum system either admits a certified sign-eliminating
    involution found in polynomial time or is an NP-hard sign obstruction) fails as stated: NP-hardness
    is a property of input families, the free triangle has no equal-weight involution in its declared
    basis yet is solved by one-body diagonalization, and zero signed mass need not come from an involution.'
