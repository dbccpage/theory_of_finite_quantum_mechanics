  source_statement: 'On the declared bipartite carrier with A0=Z, A1=X, B0=(Z+X)/sqrt2, B1=(Z-X)/sqrt2 and |Phi+>,
    the CHSH operator satisfies two exact SOS inequalities and attains 2sqrt2; the witness lives in the real field
    Q(sqrt2) and is static, so complex U(1) phase and continuous time are not needed. Lean: unit-norm-squared-4
    vectors over Z[sqrt2] with scaled CHSH sum 8.'
