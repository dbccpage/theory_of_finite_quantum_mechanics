      - - '-1'
      scope: Two exact Q(sqrt2) SOS matrix certificates and Bell-density expectation2sqrt2 are reproduced
        independently. Universal rational four-coordinate scaled SOS inequalities and attainment ratio
        are kernel checked for this fixed operator.
      unpaid_target: Formalize the concrete Q(sqrt2)-matrix to real quadratic-form transport before claiming
        a full Lean operator certificate; arbitrary observables, tensor selection and quantum probability
        are not derived.
    original_target: 'On the declared bipartite carrier with A0=Z, A1=X, B0=(Z+X)/sqrt2, B1=(Z-X)/sqrt2
      and |Phi+>, the CHSH operator satisfies two exact SOS inequalities and attains 2sqrt2; the witness
      lives in the real field Q(sqrt2) and is static, so complex U(1) phase and continuous time are not
      needed. Lean: unit-norm-squared-4 vectors over Z[sqrt2] with scaled CHSH sum 8.'
    source_scope_review: Use the actual fixed real bipartite Pauli carrier. C=sqrt2*(Z⊗Z+X⊗X). Both 2sqrt2*I∓C
      equal (S0²+S1²)/sqrt2 for S0=Z⊗I∓I⊗Z and S1=X⊗I∓I⊗X. Native Q(sqrt2) coefficient matrices are checked
      entrywise, including self-adjoint factors and rational Bell density expectation2sqrt2. Fresh Lean
      proves both fixed quadratic SOS identities and bounds on Rat^4 plus the unnormalized Bell-vector
      ratio4/2. The concrete matrix-to-quadratic/real transport is separately unpaid; the old attainment-only
      theorem is not called a universal operator bound.
    admitted_assumptions:
    - bipartite tensor carrier (assumption)
    - entangled state (assumption)
    - trace/Born pairing (assumption)
