target:
  source_statement: GenesisIncidence.lean reads the declared incidence complex on vertices 0, 1, 2 with
    signed boundary maps on the edge basis (01, 02, 12), the admitted face 012 entering as the column
    (1, −1, 1), and establishes that the boundary of that face has zero boundary (boundary_boundary_filled).
    The WDP window instead uses coboundaries with the simplicial edge order (01, 12, 02), d₀f = (f₁ −
    f₀, f₂ − f₁, f₂ − f₀) and d₁x = x₀₁ + x₁₂ − x₀₂ (Obstruction.lean), while the cyclic presentation
    (01, 12, 20) negates the reversed component. The monograph states that every window quantity is invariant
    once the cochain is transported with its edges, but no declared map takes the GenesisIncidence chains,
    with their edge order and boundary convention, to the WDP cochain window.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Open. One triangle is transported. The reorder, the transpose identity, the sign
    for edge 20, the charge 2, and the residual lower bound 2 are checked. A transport for every window
    quantity, a derivation of the WDP window from Genesis admission, and the external orientation test
    stay open.
  source_refs:
  - dag/derivations/06_wdp/tfq_0543_wdp_incidence_orientation_transport.md
  - lean4/Imported/WitnessedDifferenceProgramme/GenesisIncidence.lean:19-23
