target:
  source_statement: Interval evidence is a third kind and is not yet a governance
    scalar. MeasurementValue::Interval stores lower and upper BigDecimal bounds, and
    MeasurementError::IntervalRequiresPolicy is the refusal when an interval is asked
    to decide. BigDecimal::from_f64_unchecked builds a decimal from an f64 with a
    fixed scale, which is not an exact rational. affine_calibration.rs, finite_response.rs,
    and finite_chain_clock.rs add further interval clocks and calibrations. The obligation
    is to keep interval evidence pending a policy decision and to stop that unchecked
    f64 constructor from authorizing a bound.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Keep interval measurement evidence distinct, and do not let an
    f64-built decimal authorize a bound.
