target:
  source_statement: 'In a supplied complex model with one coordinate at each of two sites, the balance
    map T sends the ordinary tensor coefficients (rr, ri, ir, ii) to (rr − ii, ri + ir), so for m = n
    = 1 its rows are (1,0,0,−1) and (0,1,1,0). With u = Tᵗ/2 and r = T, r u = I₂ while u r = P = TᵗT/2
    is a rank-2 idempotent, and the vector (1,0,0,1) lies in ker T, so P ≠ I₄. The exact kernel of T is
    the complex balancing relation. The reading guide uses this as a representation quotient: it names
    the declared questions that survive and the information quotiented away, and it supplies no native
    S(n) obstruction.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared complex scalars and tensor coordinates of the WDP realification supplement (assumption)
  source_bottleneck: Lean states integer coefficient laws (balance after section is doubling, and the
    kernel test rr = ii, ri = −ir); division by 2 and positivity are written separately. A lawful representation
    of the selected quantum composite gives neither a new native S(n) obstruction nor permission to advance
    beyond S(6).
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0521_sn_representation_quotient.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_witnessed_difference_programme/docs/complex_tensor_balancing.md:16-21
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_witnessed_difference_programme/docs/complex_tensor_balancing.md:28-31
  - omega_engine_education/documentation/002_oesn/reading_guide.md:69-74
