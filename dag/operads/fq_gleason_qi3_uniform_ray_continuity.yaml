target:
  source_statement: 'Let f : GVec -> Q be a signed frame function on Q(i)^3 (IsFrameFunction f: f(u) +
    f(v) + f(w) = 1 for every triple of nonzero pairwise orthogonal vectors; no sign condition). Suppose
    f is uniformly continuous on rays (IsUniformlyRayContinuous f): for every rational epsilon > 0 there
    is a rational delta > 0 such that |f(u) - f(v)| < epsilon whenever u, v are nonzero and raySinSq u
    v = 1 - |<u,v>|^2/(<u,u><v,v>) < delta, where raySinSq is a squared ray distance (phase and scale
    invariant) whose square root is the corresponding metric on rays. Then f(v) = quadRay (tomographyForm
    f) v = <v, rho v>/<v, v> for every nonzero v, with rho the Hermitian trace-one matrix reconstructed
    from the nine tomography rays. The nonnegative version (IsNonnegFrameFunction f) is the special case
    of a nonnegative f.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'uniform continuity of f on rays (IsUniformlyRayContinuous f): declared input, not derived'
  source_bottleneck: The result is conditional on the declared hypothesis IsUniformlyRayContinuous f.
    Whether Archimedean continuity at every nonzero rational vector (IsArchimedeanContinuousEverywhere,
    the pointwise notion used by the existing BornGaussianTomographyReduction results) implies it for
    frame functions is FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM (OPEN); until that is settled the pointwise
    targets remain unresolved. A finite instrument's resolution at one tolerance supplies one (epsilon,
    delta) pair, not the for-all-epsilon-exists-delta guarantee. This node changes no status of FQ-GLEASON-QI3-FRAME-FUNCTIONS
    or FQ-GAP-BORN-UNIQUENESS-GLEASON.
  source_refs:
  - lean4/GleasonGaussianBridge.lean
  - lean4/GleasonComplexSphere.lean
  - lean4/GleasonRealSphere.lean
  - lean4/BornGaussianParallelogramRigidity.lean
