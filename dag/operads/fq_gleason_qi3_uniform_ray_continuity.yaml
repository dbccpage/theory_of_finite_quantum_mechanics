target:
  source_statement: 'Let f : GVec -> Q be a signed frame function on Q(i)^3 (IsFrameFunction f: f(u) +
    f(v) + f(w) = 1 for every triple of nonzero pairwise orthogonal vectors; no sign condition). Suppose
    f is uniformly continuous on rays (IsUniformlyRayContinuous f): for every rational epsilon > 0 there
    is a rational delta > 0 such that |f(u) - f(v)| < epsilon whenever u, v are nonzero and raySinSq u
    v = 1 - |<u,v>|^2/(<u,u><v,v>) < delta, where raySinSq is a squared ray distance (phase and scale
    invariant) whose square root is the corresponding metric on rays. Then f(v) = quadRay (tomographyForm
    f) v = <v, rho v>/<v, v> for every nonzero v, with rho the Hermitian trace-one matrix reconstructed
    from the nine tomography rays. The nonnegative version (IsNonnegFrameFunction f) is the special case
    of a nonnegative f.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Q(i)^3 with its standard Hermitian form and the normalized orthogonal-frame identity (signed values
    permitted)
  - 'uniform continuity of f on rays (IsUniformlyRayContinuous f): declared input, not derived'
  - real/complex completeness and compactness in the continuous-C^3 proof backend; no Born pairing, dynamics
    or tensor axiom is an input
  source_bottleneck: Uniform ray continuity remains a declared hypothesis. Pointwise-to-uniform for rational
    frame functions is TFQ-1057, with signed and nonnegative cases separate. A finite instrument at one
    tolerance supplies only one epsilon-delta pair. General uniform continuity of quadRay and the packaged
    unique complex PSD trace-one extension are kernel-checked in FQ-BORN-QI3-CONTINUUM-COMPLETION, which
    is CONDITIONAL on the same declared input. TFQ-1055 asks about unrestricted frame functions and its
    unrestricted assertion is REFUTED; TFQ-0307 remains CONDITIONAL.
