target:
  source_statement: 'The pass from L1 weights to a finite Hilbert carrier imports structure the finite
    papers do not derive: a square-root field, a complex field, U(1) phases, an inner product, orthogonal
    additivity, Haar-independent phases, and linear isometric dynamics. QM_020 states that it does not
    derive quantum mechanics. QM_122 recovers matrices over the Gaussian integers and leaves ordinary
    matrix algebras over the complex numbers unrecovered. Python, Rust, and Lean 4 must name each import
    and keep it imported. A finite matrix calculation is not a discharge of the import list. Narrowed in
    Lean 4 and an independent Python verifier to three exact finite/algebraic components and non-discharge
    fences: (1) Gaussian-integer 2x2 matrix algebra recovery (QM_122 Pauli involutions and commutator
    sigmaX * sigmaY = i * sigmaZ, norm multiplicativity) and QM_122 / QM_020 C_4 cochain syndromes
    (gauss_int_norm_multiplicative, qm122_pauli_gaussian_integer_commutators_and_squares,
    qm122_and_qm020_cochain_syndrome_and_shadow_replay); (2) non-recovery of the square-root field
    ((2p + 1)^2 != 2q^2), complex division (unnormalized Hadamard squares to 2 * sigmaI != sigmaI with
    2 * sigmaI non-invertible in M_2(Z[i])), and continuous U(1) phases (only 4 units in Z[i] vs.
    Pythagorean (3/5, 4/5) in Q[i]); and (3) L1 norm violation of the Jordan-von Neumann parallelogram
    law (8 != 4), orthogonal-additivity cross-term and sign-phase averaging, L1 stochastic vs. L2
    isometric norm contraction, and the 7-field HilbertLiftImportLedger truth-table fence.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
