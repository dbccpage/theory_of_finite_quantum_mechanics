target:
  source_statement: 'Formalized finite statement. For each admissible 6-tuple of spins, take lengths l
    = j + 1/2 and compute the Cayley-Menger determinant CM(l_e^2) = 288 V^2 exactly in the rationals.
    Checked in Lean 4 across all 10,825 admissible 6-tuples with twice-spins at most 8: 9,854 lie in the
    classically allowed region (CM > 0, where a Euclidean tetrahedron exists), 0 have CM = 0, and 971
    lie in the classically forbidden region (CM < 0), together with exact rational values of the squared
    6j symbol on allowed and forbidden witnesses. The comparison of magnitudes with the asymptotic formula
    is numerical and imported, and is not part of the target.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 across all 10,825 admissible 6-tuples with 2j<=8. The asymptotic
    comparison with the Ponzano-Regge cosine/decay formulas is imported and outside this finite classification.
