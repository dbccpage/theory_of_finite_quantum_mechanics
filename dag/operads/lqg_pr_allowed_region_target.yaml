  source_statement: 'Finite statement to formalize. For each admissible 6-tuple of spins, take lengths
    l = j + 1/2 and compute the Cayley-Menger determinant exactly in the rationals; 288 V^2 equals the
    determinant of the bordered 5x5 matrix of squared distances. Tuples with V^2 > 0 lie in the allowed
    region (a Euclidean tetrahedron exists) where the imported asymptotics predict oscillation; tuples
    with V^2 < 0 lie in the forbidden region where it predicts decay. Target: the exact classification
    for twice-spins at most 8 together with the exact value of the squared 6j symbol in each case. The
    comparison of magnitudes with the asymptotic formula is numerical and imported, and is not part of
    the target.'
