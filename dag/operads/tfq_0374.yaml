target:
  source_statement: Ledger row WDP-P001-009 says language restriction, partial word recovery, and total
    erasure have different types, with no Ext calculation. Pre-Genesis paper.md section 11.2 is the heading.
    Opened preservation.py defines recover_word, erase_word, and decimal_decode as separate functions,
    which does not by itself record that they differ on a new letter. The finite statement still required
    is a single finite witness, one new letter, on which the three contracts disagree, kept distinct from
    free-monoid size. WordRecovery.lean is listed in the package and was not opened, so its declarations
    stay unchecked here. Narrowed in Lean 4 to one old letter a and one new letter fresh. The witness
    word is [a, fresh], and it contains fresh once. Language restriction of the sample [[a, fresh], [a]]
    returns [[a]], a list of words. Partial recovery of the witness returns none, an optional word. Total
    erasure of the witness returns [a], a word. On the old word [a], recovery returns the word and erasure
    returns the word. Recovery of the witness is not the erased word, and erasure is not the witness word.
    The witness word is absent from the restricted sample. No Ext group is defined in this file. Free-monoid
    size is not restated. The atlas files preservation.py and WordRecovery.lean stay unchecked. AuthorityEffect
    is None.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'The atlas files preservation.py and WordRecovery.lean stay unchecked. The finite
    witness in this file is the word [a, fresh]: restriction returns [[a]], recovery returns none, and
    erasure returns [a]. No Ext group is defined here, and free-monoid size is not restated.'
  source_refs:
  - dag/derivations/01_pregenesis/tfq_0374_three_recovery_contracts.md
  paper_refs:
