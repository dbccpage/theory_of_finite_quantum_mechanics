target:
  source_statement: 'After the finite carrier, the required dynamics are finite: an instrument or
    measurement update, a path sum on a finite graph, a unitary or Hamiltonian shadow on a finite matrix,
    and a channel that is either exact or explicitly imported. The derivation note leaves the step from
    stochastic kernels to completely positive maps as a gap. Python, Rust, and Lean 4 must each state the
    finite map and the hypothesis it uses. A numerical CPTP check at a fixed tolerance is a diagnostic.
    It does not authorize the exact channel. Narrowed in Lean 4 and an independent Python verifier to
    three exact rational components and non-equivalence fences over Q: (1) finite projective measurement
    instruments (outcome projections proj0, proj1 and projective dephasingChannel) trace additivity and
    idempotence, plus 2-branch finite diamond graph path-sum destructive/constructive interference
    (finite_instrument_trace_preservation_and_idempotence, diamond_path_sum_interference_identities);
    (2) rational Cayley unitary norm conservation (1 - t^2)^2 + (2t)^2 = (1 + t^2)^2 vs. first-order
    Euler generator norm inflation (1 + t^2) - 1 = t^2 > 0 (and 4 at t = 2), plus replay of the
    FINITE_QM_DYNAMICS C_4 cochain syndromes; and (3) the stochastic-to-CP gap witness (2x2 matrix
    transpose preserves trace, determinant, and diagonal stochastic states yet yields negative determinant
    -1 and negative quadratic form -2 on the 2-qubit Bell partial transpose swap block), the numerical
    CPTP tolerance false-green fences for trace drift 1 + eps / 2 and negative Choi eigenvalue -eps / 2,
    and the exact rational 2-Kraus bit-flip channel trace identity.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
