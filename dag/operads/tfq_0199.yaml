target:
  source_statement: Other gravity files are scaffolds or a different 2D calculus and
    must not be folded into the rational 4D proxy. src/holonomy.rs is a best-effort
    scaffold whose Holonomy struct stores only a degree and a string label. src/regge_calculus.rs
    is finite 2D Regge, with action a sum of vertex deficits, and it says it is not
    continuum GR and not 3+1 dihedral Regge. src/discrete_spacetime.rs is the combinatorial
    carrier via omega_homology::simplicial. The obligation is to withhold those labels
    and the 2D deficit sum from the exact_regge proxy. FiniteQFTAndGravity.lean keeps
    pi and square roots out of its identities.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Do not treat the GR holonomy scaffold or the 2D Regge sum as
    the exact rational 4D gravity shadow.
