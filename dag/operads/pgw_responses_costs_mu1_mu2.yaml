target:
  source_statement: A response (delta) is an ordered finite list of NewDatum, NewForm(arity), NewInst(form,
    args) and NewRuleAll(form) items applied in order; an instance may name a form added earlier in the
    same list, and the reverse order is an ill-formed admission. The declared costs are mu1 = item count
    and mu2 = (item count, sum of new-form arities) compared lexicographically, where the sum counts every
    NewForm item, including distinct forms of equal arity. A valid response to Separate(i, j) applies,
    separates the target, and keeps every previously imposed requirement separated, because requirements
    are persistent constraints.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared item grammar and cost measures mu1 and mu2, genesis_source.txt sections 3.6-3.7 (assumption)
  source_bottleneck: Both measures and the item grammar are declared, not derived; bundling a form and
    an instance into one primitive would change every cost, and the enumerator's canonical item order
    makes a delta a multiset only up to that convention.
  source_refs:
