target:
  source_statement: On a 4D triangulation with squared edge lengths, the deficit angle at a hinge h is
    epsilon_h = 2 pi - sum of dihedral angles at h and the Regge action is S = sum_h A_h epsilon_h; its
    convergence to the Einstein-Hilbert action under refinement is a literature result imported here.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Regge calculus (Regge 1961; Cheeger-Mueller-Schrader convergence)
  source_bottleneck: Narrowed algebraic checks only. The declared rational Heron polynomial is symmetric
    and has the displayed evaluations; a supplied rational dot product is bilinear and an additive four-step
    telescoping sum is zero. Schlaefli cancellation is an explicit hypothesis, not derived geometry. The
    face vector and its interpretation as a sphere are supplied. No edge-length geometry, noncommutative
    Bianchi identity, continuum refinement theorem or actual Lorentzian exponential is constructed. The
    -I matrix and w-w identity do not identify a gravitational phase or resolve fermion signs. Status
    is unchanged. The original physical or operational bridge remains open.
  source_refs:
