- kind: theorem
  name: area_linearity
  line: 25
  signature_excerpt: |-
    theorem area_linearity (hinges : Finset ι) (area other deficit : ι → R) (a b : R) :
        action hinges (fun h => a * area h + b * other h) deficit =
          a * action hinges area deficit + b * action hinges other deficit
