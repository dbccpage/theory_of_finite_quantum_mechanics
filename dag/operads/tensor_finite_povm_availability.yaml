target:
  source_statement: For any finite outcome type, sound available tests correspond to positive Hermitian
    families summing to I. Conversely every such POVM is available under both EffectSaturated and the
    separate FiniteTestSaturated premise. The end-to-end quantum_measurements theorem invokes quantum_state_cone
    and returns the generated cone, binary interval and finite-POVM equivalence.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - state-cone conclusion of quantum_state_cone
  - sound available effects and finite tests
  - EffectSaturated
  - FiniteTestSaturated
  source_bottleneck: FiniteTestSaturated requires jointly implementing each finite family of available
    effects summing to the deterministic unit. It is distinct from individual effect saturation. No availability
    or classification of instruments or channels is asserted.
