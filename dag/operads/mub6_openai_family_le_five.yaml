target:
  source_statement: 'Every family of pairwise mutually unbiased orthonormal bases of C^6 has at most five
    members (N(6) <= 5): OpenAI''s Lean theorem OAI.MUB6.family_size_le_five (github.com/openai/math,
    commit 1581d4cbdd69a0faf34b2089614fe2a814316a6a, Apache-2.0), via the exact mixed-moment Gram certificate
    no_seven_mutually_unbiased_bases and Weiner''s completion six_extend_to_seven.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - OpenAI, Lean OAI.MUB6.family_size_le_five and OAI.MUB6.fourier_and_family_bound, github.com/openai/math
    lean/OAI/Analysis/MutuallyUnbiased (commit 1581d4cbdd69a0faf34b2089614fe2a814316a6a, Apache-2.0);
    companion paper Exact Fourier certificates for complex Hadamard matrices of order six (2026-09-24)
  source_bottleneck: 'External and not built here: the upstream proof (3381 Lean files, about 205 MB,
    Lean 4.34.1 and its own Mathlib commit) is neither vendored nor replayed. lean4/MubOpenAIBridge.lean
    states the repository-type consequence conditionally on OpenAIFamilyBound and its build is pending.
    OpenAI N(6)=3 is recorded as external context only: a binary64 seed-cover, Stage A/B/C and clique-search
    pipeline whose code and run archive are unreleased (verification/ returns 404) and whose Lean tree
    does not formalize it; it is not imported. MUB6-NO-QUARTET-D6 and MUB6-MAX-MUB-SIX-EQUALS-THREE stay
    OPEN.'
