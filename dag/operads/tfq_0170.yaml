target:
  source_statement: Majorization, Markov chains, and stochastic maps are exact controls on the rational
    simplex, still without float authority. src/lib.rs assigns majorization.rs to the majorization preorder,
    thermal ladders, Nielsen criterion, and T-transform chains; markov_chain.rs to classes, recurrence,
    period, stationary laws, absorption, and exact mixing; stochastic_map.rs to row-stochastic kernels,
    Bayesian inversion, and the Dobrushin coefficient. The obligation is to treat those constructions
    as finite kernel algebra over BigRational. They do not select a quantum channel, a CPTP class, or
    a continuous-time generator.
