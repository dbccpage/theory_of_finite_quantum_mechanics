target:
  source_statement: Narrowed in Lean 4 to the carrier {0, 1}. The directed slots are e(0,0), e(1,1), e(0,1)
    and e(1,0). The coboundary of vertex values (g0, g1) is (0, 0, g0 - g1, g1 - g0). The unbalanced mark
    (0, 1, 0) has diagnostic e(0,1) + e(1,0) + e(0,0). That diagnostic is 0 on every coboundary and is
    unchanged when a coboundary is added. If a nonzero integer b scales an integer slot difference onto
    a coboundary, the difference is already the integer coboundary of (0, -d01). The table (1, 0, 0, -1)
    has diagnostic 0 and is not a coboundary. The table (0, 1, 0, 0) has diagnostic 0 and is not a coboundary.
    The one-arc table (0, 0, 1, 0) has diagnostic 1. The two-way table (0, 0, 1, 1) has arc sum 2 and
    arc difference 0. A general carrier, an arbitrary marked family, the degree-1 window of TFQ-0004,
    a continuous norm, and carrier-changing term operations stay open.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Fixed carrier and declared marked triples F from the chosen Genesis Ongoing source contexts (assumption)
  source_bottleneck: Open. One two-vertex carrier is checked. The coboundary cancellation, the denominator
    reflection, the two kernel witnesses, the one-arc diagnostic, and the two-way sum are checked. A general
    carrier, an arbitrary marked family, the window of TFQ-0004, a continuous norm, and carrier-changing
    term operations stay open.
  source_refs:
  - dag/derivations/06_wdp/tfq_0555_wdp_bridge_ongoing_to_window.md
