target:
  source_statement: 'GEN-WDP-07, a conditional theorem in the bridge register, fixes a carrier and marked
    triples F, keeps the full directed integer table e(x, y) = M_r(x, y) − M_s(x, y) including loops and
    independent reverse arcs, treats raising as e ↦ e + d₀g with (d₀g)(x, y) = g(x) − g(y), and uses the
    marked diagnostic D_F(e)(x, y, z) = e(x, y) + e(y, z) + e(z, x). Cancellation gives D_F d₀ = 0, so
    D_F(e + d₀g) = D_F e even for unbalanced triples, and rationalizing reflects integer repair equality.
    This is a repair quotient with descending reports, not automatically cohomology: C¹/im d₀ differs
    from ker D_F/im d₀, a filled mark may be unbalanced, triangle reports miss loops and two-way defects,
    and antisymmetric simplicial coordinates need e(x, x) = 0 and e(x, y) + e(y, x) = 0. Term addition
    and identification can fail to respect the quotient (source 23:D4), so carrier-changing operations
    need new congruence proofs.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
