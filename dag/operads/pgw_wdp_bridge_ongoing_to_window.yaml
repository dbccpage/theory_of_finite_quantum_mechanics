  source_bottleneck: 'Proposed, not derived: the bridge does not produce the window of TFQ-0004 from Genesis
    admission (TFQ-0344), integer change costs are not identified with a continuous norm, and dynamic
    carrier changes belong to GEN-WDP-O02 and O03.'
