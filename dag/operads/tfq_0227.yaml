target:
  source_statement: The pipeline runtime is a continuation host that refuses to mint authority. runtime.rs
    keeps a domain-separated content hash, separates producer and evaluator identities, and emits only
    AuthorityEffect None. Its header says completion there is evidence for a later sealed-witness process,
    not that process itself. Prime 002 remains the predicate for whether another carrier step is requested.
    A finite quantum derivation may be scheduled so the bytes move, while the statement stays the one
    named, or not yet named, by the language triple. Scheduling is custody of execution order, not a new
    finite relation.
