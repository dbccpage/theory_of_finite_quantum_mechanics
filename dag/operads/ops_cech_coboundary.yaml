target:
  source_statement: 'Proposition B5. Let N be the nerve of the maximal-context cover and take cochains
    valued in the presheaf U -> Q^E(U), with (delta0 alpha)_(C,C'') the restriction of alpha_C to the
    overlap minus the restriction of alpha_C'', and delta1 the alternating sum of restrictions on triples.
    Then delta1 delta0 = 0; for an empirical model e read as a 0-cochain, delta0 e = 0 if and only if
    e is no-signalling; and Phi_1([omega]) = min over alpha of the l1 norm of (omega - delta0 alpha) is
    unchanged by omega -> omega - delta0 beta. Instances recomputed exactly: the Bell nerve has four edges
    (a 4-cycle) and no triple, so delta1 delta0 = 0 is vacuous there; on the cover {0,1}, {0,2}, {0,3}
    (one nerve triple, overlap {0}) delta1 delta0 alpha = 0 for a non-constant alpha while a 1-cochain
    supported on one pair has delta1 beta = [1, 0]; delta0 e = 0 for the PR box and is nonzero at the
    pair (0,1) for a model whose a-marginal differs between the contexts ab and ab''; the unit cochain
    (1, 1) on the first edge of the Bell nerve has Phi_1 = 2, by the value 2 at alpha = 0 and a dual witness
    of sup norm 1 that annihilates delta0, and Phi_1 is again 2 after adding delta0 of a coboundary.'
  statement_status: source_claim_to_scope_check_not_accepted_result
