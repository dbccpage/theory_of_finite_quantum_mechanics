target:
  source_statement: Narrowed to the Lean model in B2SemidirectDressing.lean. Invertible upper-triangular
    2x2 matrices over Q are modelled as triples (d1, b, d2) with product (d1 d1', d1 b' + b d2', d2 d2').
    Each invertible x equals torusProj x times unipotentPart x, with torusProj x diagonal and unipotentPart
    x unit upper-triangular, the factorization is unique, and the unit upper-triangular matrices are closed
    under conjugation by invertible ones. On the graph with vertices 0 to 3, edges (0,1), (1,2), (0,2),
    (2,3), (1,3) and tree edges (0,1), (0,2), (2,3), take any assignment of one invertible matrix to each
    edge. The explicit stage-one dressing u_N(v) = (1, -b/d2, 1), read off the tree transport T(v) of
    the vertex v, leaves the tree edges diagonal and preserves torusProj on all five edges. Stage-two
    dressing by the inverse of the diagonal part of T(v) turns the stage-one connection into U_full(e)
    = T(target e)^-1 U_e T(source e) on all five edges. For any commutative ring R and any 1-cochain A
    as a function R to R to R, bA(u,v,w) = -A(u,w) and (A cup A)(u,v,w) = A(u,v) A(v,w) are defined, and
    K = bA + A cup A satisfies b(bA) = 0, the identity bK + A cup K - K cup A = 0, and gauge covariance.
    Lean does not identify the triple model with the QM-213 map, does not show u_N is a conjugate of the
    tree unipotent, does not identify U_full with tree_gauge_indexed.residual, has no poset P_5, and has
    no non-commutative coefficients in the curvature statements. The Lean module records that the natural
    numbers 2 and 3 differ and does not prove a color-transport statement. checks/independent/tfq-0016.py
    searches FiniteQM.lean for the substrings qm213, two_stage, and borel and does not find them.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Not proved in Lean: that the triple model is the QM-213 map; that u_N is a conjugate
    of the tree unipotent; that U_full is tree_gauge_indexed.residual; the curvature statements on the
    extended diamond poset P_5 and with non-commutative (matrix) coefficients, which checks/independent/tfq-0016.py
    tests with SymPy only; any color-transport statement.'
  source_refs:
