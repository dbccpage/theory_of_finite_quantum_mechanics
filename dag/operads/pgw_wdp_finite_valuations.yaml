target:
  source_statement: 'WDP-CH08-D01: finite families A and B are congruent relative to a comparison family
    K when a matching preserving K is exhibited, a bijective correspondence with no primitive number object
    that still presupposes the exhibited families, so plurality itself is not derived from one cut. With
    a declared mass m: W → ℝ≥0, μ(A) = Σ_{w∈A} m(w) is finitely additive by construction, and on a declared
    finite partition with μ(W) > 0 the values p(A_i) = μ(A_i)/μ(W) are nonnegative and sum to 1 (WDP-CH08-P01).
    WDP-CH08-O01: a nonnegative additive valuation on a finite Boolean algebra has unique atom masses
    and pushforwards, and witness-level masses extending it are unique exactly when every nonsingleton
    atom has mass zero. WDP-CH08-C01 (conditional): an aggregator with a continuous associative composition
    law with identity 0, singleton values ct with c > 0 and replica extensivity has composition x + y
    and value c Σ_e a_e. WDP-CH09-P01: |z_i|^q / Σ_j |z_j|^q is a probability vector for every q > 0,
    and distinct exponents give distinct vectors when two nonzero magnitudes differ, so normalization
    does not select q = 2.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared mass on a finite witness family and a declared finite partition with positive total mass
    (assumption)
  - 'For C01: continuity, associativity and replica extensivity of the aggregation law (assumption)'
  source_bottleneck: A normalized finite valuation is not a frequency, propensity, degree of belief or
    countably additive measure; Lean Probability.sum_normalizedMultiplicity covers natural multiplicities
    only, and the monograph's C01 argument uses no Aczél representation theorem, superseding the education
    page's import reading.
