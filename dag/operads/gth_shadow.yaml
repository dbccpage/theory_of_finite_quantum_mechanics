target:
  source_statement: 'No construction turns PGW-GO-ADMISSION-GATE into a finite semi-simplicial set or
    a finite globular set. That gate keeps a two-valued admission record with a reached result: reaching
    leaves not-admitted, and admission is not one of the four kinds of change. A finite semi-simplicial
    set of dimension at most N is finite sets X_0, ..., X_N and face maps d_i from X_n to X_{n-1} such
    that d_i composed with d_j equals d_{j-1} composed with d_i whenever i < j. It carries no degeneracy
    maps. A finite globular set is finite sets with source and target maps s, t from X_{n+1} to X_n such
    that s composed with s equals s composed with t, and t composed with t equals t composed with s. Neither
    family is defined from the admission record.'
