  source_statement: Born uniqueness of the quadratic form needs imported Hilbert space, projection lattices
    and Gleason-type assumptions, with dimension n >= 3; Gleason frame additivity at n >= 3 is verified
    only over orthogonal frames of specific finite ray sets. The three-label cardinality surrogate (3
    <= |Q|) is false on Bool; the unit-effect contract already has two disagreeing pairings.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Gleason theorem for d >= 3 (assumption)
  - projection lattice (assumption)
  - Hilbert space (assumption)
  source_bottleneck: Finite rational frame obstructions (Cabello 18-9, d=2 plane, and d=3 rotated frame
    eliminating the quartic rival) are mechanized; continuum Gleason frame additivity on S^{n-1} remains
    an external import.
