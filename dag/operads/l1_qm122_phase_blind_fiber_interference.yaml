    original_target: Phase-blind readout gives the same weights for amplitude vectors (1,1) and (1,-1);
      the phase fiber over a weight vector is nontrivial; mixing sectors in the fiber separates states
      that the readout identifies, so interference does not descend through the phase-blind quotient.
    source_scope_review: The source declares only two witnesses (psi1, psi2) and a Bool-indexed readout;
      the claim "the phase fiber over a weight vector is nontrivial" and "mixing separates fibers" is
      general. Mine the actual declarations phaseBlind, mix, readout, no_descent_through_fiber, then prove
      the general Z[i] statements and compute fibers by exact enumeration. The weight vector must have
      both entries positive and realizable (sum of two squares) for the fiber to be nontrivial; the zero-weight
      sector is the exact boundary where descent holds.
