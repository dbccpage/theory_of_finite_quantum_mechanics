target:
  source_statement: 'Let H be the possible histories, σ(h) the state that history h produces and π(h)
    the part of h an auditor sees, for example only the last turn. If π(h₁) = π(h₂) but σ(h₁) ≠ σ(h₂),
    no auditor A that sees only π reports σ(h) for every h, because A(π(h₁)) = A(π(h₂)) would give σ(h₁)
    = σ(h₂). The trial failures motivate the theorem: the blind auditor flagged the licensed words ''We''
    (Trial 1) and ''rule'' (Trial 2) as imports, so an audit needs two levels; in Trial 2, Prompt 14''s
    false attribution was answered without objection, so claim provenance is a check separate from claim
    correctness, Result 15 lost the state, saying the regime contains only <> after <a> had been supplied;
    and the two-level auditor, shown only that turn, answered None. State certification therefore needs
    replay information that separates the relevant histories, and on a declared finite population a summary
    on which σ is constant per fiber of the view can stand in for the raw history.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'The trial contrasts motivate the theorem and do not instantiate it: the truncated
    window and the full replay received different inputs, so they are not a checked pair with equal auditor
    views; raw history retention is a provenance policy, and task-sufficient reconstruction is the mathematical
    requirement.'
  source_refs:
  - dag/derivations/01_pregenesis/tfq_0426_replay_necessity.md
  - omega_engine_education/documentation/000_oepregen/sources/analysis_derivation_v1.md:1009-1047
  - omega_engine_education/documentation/000_oepregen/03_results_and_arguments.md:100-106
  - omega_engine_education/documentation/000_oepregen/02_trial_record.md:101-111
