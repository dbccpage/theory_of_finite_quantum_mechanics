target:
  source_statement: 'Under calibration, a nonzero observation and descent of an admitted operation family,
    irreducibility of that family on the global state space forces injectivity of the observation (Schur-type;
    tomography_of_irreducible, calibrated_tomography). The existence of such a family is equivalent to
    local tomography, so this re-expresses rather than derives local tomography. Converse (OperationalFilterFamily):
    for a calibrated observation, irreducibility of the lifted coordinate (product-test) resets, and descent
    of all visibly normalized global resets, are each equivalent to local tomography (product_resets_irreducible_iff,
    global_reset_descent_iff_tomography). Under explicit closure rules (sequential admission, generating
    cone, preparability of all normalized states, bounded globally separating admitted effects) test-then-prepare
    resets are constructed as a positive, subnormalized, irreducible family (normalized_reset_family);
    this construction does not discharge the descent premise non-circularly. With the same-family dimension
    law K(d,n) = n + d binom(n,2), d > 0, local tomography selects d = 2 (OperationalFieldSelection.selected_parameter).
    The classical doubled-pair control satisfies calibration, factorization and descent yet violates irreducibility
    and tomography. Narrowest claim of the filter-family run: Under explicit closure rules (sequential
    admission, generating cone, preparability of all normalized states, bounded globally separating admitted
    effects), test-then-prepare resets form a positive, subnormalized, irreducible family. For a calibrated
    observation, irreducibility of the lifted coordinate resets, and descent of all visibly normalized
    global resets, are each equivalent to local tomography. So resets cannot non-circularly discharge
    the descent-plus-irreducibility premise of OperationalTomography.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - local tomography (equivalent to the existence of an irreducible operation family that descends through
    the observation)
  - field-linear state and effect spaces (not derived from primitive difference)
  - independent dual product-frame calibration and factorization
  - same-family dimension law and positive parameter (for the selection bridge)
  source_bottleneck: 'Under calibration, a nonzero observation and descent of an admitted operation family,
    irreducibility of that family on the global state space forces injectivity (Schur-type). The existence
    of such a family is equivalent to local tomography, so this re-expresses rather than derives local
    tomography. A noncircular operational principle excluding hidden sectors is open; general tensor-cone
    uniqueness and operational classification remain open (FQ-GAP-TENSOR-UNIQUENESS). Does not support:
    A derivation of local tomography from primitive difference or from weaker operational premises; a
    noncircular principle excluding hidden sectors; tensor-cone uniqueness; physical availability of the
    constructed resets in any particular operational theory.'
