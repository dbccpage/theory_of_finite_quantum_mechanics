target:
  source_statement: 'su_n.rs stores a generalized Gell-Mann family on a declared label space C^N for N
    from 2 through 8. Diagonal scales are irrational, so each generator is kept as sqrt(r_a) times an
    exact matrix M_a over Q(i), and the checked identities are rational: trace pairing 2 delta_ab and
    a Jacobi identity after the common square-root factor is removed. The file states that the label space
    is a separate declaration and is not built from a graph. For N=3 the generator count is eight, which
    is the algebra shadow used by the color control, not a finite group SU(3).'
