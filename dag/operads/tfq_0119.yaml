  source_statement: 'circle_haar.lean imports a normalized Haar measure and states an injective cyclic
    inclusion. Its header says the dyadic direct limit is not asserted to equal the completed circle.
    The package README treats those as different objects. What is finite is the cyclic inclusion and the
    character identity the ledger can mark mechanized. What is not discharged is metric completion for
    every continuous observable, Pontryagin completion classification, and the continuum limit. A circle
    integral is not the Einstein equation and not quantum gravity. Narrowed in Lean 4 and an independent
    Python verifier to three exact rational components and non-equivalence fences over Q: (1) dyadic
    direct-system single-step and multi-step transition invariance for dyadicRatVal k m = m / 2^k, and
    unit total mass (2^k) * (1 / 2^k) = 1 of the level-k uniform Haar partition; (2) constructive proof
    that (2^k) % 3 != 0 and 3 * m != 2^k for all k, m : Nat, so the rational 3-torsion circle point 1/3
    is never equal to any dyadic fraction m / 2^k and is omitted from the uncompleted dyadic direct
    limit; and (3) the uncompleted dyadic Cauchy sequence dyadicOneThirdApprox n = (4^n - 1) / (3 * 4^n)
    whose residual 1 / (3 * 4^n) contracts by 1/4 per step yet remains strictly positive at every finite
    stage n.'
