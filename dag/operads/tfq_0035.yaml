target:
  source_statement: abj_colour_factor returns N_c/3, so the values at three colors and one color are 1
    and 1/3, and the squared ratio of those factors is 9. Lean abj_factor_closed and abj_rate_ratio record
    that rational layer. pion_two_photon_rate_ev then multiplies imported intervals for the pion mass,
    alpha, and a decay-constant band, using a rational enclosure for pi. The rate interval is not an output
    of the color-matrix control. A float reading of the eV band cannot authorize the finite Casimir or
    Fierz statement. The obligation is to quote S(N_c)=N_c/3 as color-factor arithmetic and to leave the
    rate band outside that claim.
