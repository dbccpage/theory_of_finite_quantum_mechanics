target:
  source_statement: 'WDP-CH04-P04: in a window with d₁d₀ = 0 and a norm J meeting the norm hypothesis,
    every class [h] ∈ Q¹ has exactly one of ExactClass ([h] = 0), ClosedResidual ([h] ≠ 0 and Γ₂ = 0)
    or ActiveClosureFailure (Γ₂ > 0); Φ₁ = 0 exactly on ExactClass, and every active class has Φ₁ > 0.
    WDP-CH04-P05: Φ₁, Γ₂ ≥ 0, Γ₂ = 0 iff [h] ∈ H¹, Γ₂ ≤ ‖d₁‖_{J→1}Φ₁ (repair invariance of d₁h, then the
    infimum), no constant c > 0 gives Γ₂ ≥ cΦ₁ when H¹ ≠ 0, and Γ₂ is a norm on Q¹/H¹. WDP-CH04-P06: if
    Φ₁ > 0 then 0 ≤ R_cl ≤ ‖d₁‖_{J→1}, and the normalized ratio is undefined (0/0) when d₁ = 0. The norm
    hypothesis (ℝ, ℂ, or ℚ with J restricted from a norm on the real extension) is needed: J(x) = |x₀₁
    + √2 x₁₂ + √3 x₀₂| is a norm on ℚ³, yet on the filled triangle with δ = (1, 1, 0) its repair values
    accumulate at 0, so Φ₁ = 0 while Γ₂ = 2.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Norm hypothesis: F = R or C, or F = Q with J the restriction of a norm on the real extension (assumption)'
  source_bottleneck: P04–P06 are written proofs; Lean covers item 4 of P05 (closure_charge_le_opnorm_mul_phi,
    with the greatest-lower-bound half of the infimum as hypothesis) and P06 for ℚ-valued costs only (closure_ratio_signature),
    and the exhaustive trichotomy test on three small complexes is a finite check.
