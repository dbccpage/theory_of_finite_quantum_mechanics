target:
  source_statement: For N CAR modes, gamma_{2j-1} = c_j + c_j^dagger and gamma_{2j} = -i(c_j - c_j^dagger)
    are self-adjoint with {gamma_a, gamma_b} = 2 delta_ab, generate the Clifford algebra on 2N generators,
    and P = prod_j (-i gamma_{2j-1} gamma_{2j}) is the fermion parity (-1)^N_op.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Majorana operator decomposition of CAR modes (standard literature result)
  - fermion parity superselection (physical postulate)
  source_bottleneck: Standard algebra imported, not derived here; the trunk mechanizes only the two-generator
    case (DS-QM212-MAJORANA-PROBLEM). Parity superselection is a physical postulate, not a consequence
    of the algebra. MajoranaCliffordParity supplies CAR-conditional self-adjointness, anticommutators,
    equality of generated complex subalgebras, occupation projections, the signed local parity identity
    and ordered parity action on supplied common occupation eigenvectors. A formal one-mode positive trace-one
    density matrix need not commute with parity. The all-mode abstract Clifford identification, source
    CAR/Fock refinement and occupation-basis completeness remain outside these witnesses; no physical
    superselection law is inferred.
