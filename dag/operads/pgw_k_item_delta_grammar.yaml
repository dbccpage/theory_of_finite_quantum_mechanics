target:
  source_statement: 'The sealed candidate space is enumerated to cost two (at most two items, arity at
    most two), with pruning lemmas certified against the unpruned space: unreferenced fresh data and forms
    never matter, an instance-only delta changes the target pair''s profiles only if an instance mentions
    a target datum, and a delta holding a uniform-rule item is never a minimum valid response (rule_item_never_minimal).
    The second derivation''s rung one enumerated three-item deltas (min_responses_three) under a node
    guard, but no k-item delta grammar with pruning lemmas proved beyond cost two exists, and the distance
    bound of two is not known to be the grammar''s (S-4). The education audit lists k-item delta grammars
    with pruning lemmas as a missing prerequisite of the S(n) bridge. Narrowed in Lean 4 to one empty
    base with two data and arity one. Over a 10-atom universe, the well-formed admissions of one item
    are a fresh datum and one unary form, and the well-formed admissions of two items are datum-then-datum,
    datum-then-form, form-then-datum, form-then-form, form-then-rule, form-then-instance of argument 0,
    and form-then-instance of argument 1. That census has 9 well-formed deltas, and 7 of them leave the
    two target profile bits equal. The two form-then-instance deltas leave those bits unequal. The form-then-rule
    delta sets both bits true. Extending the argument-0 instance by the uniform rule makes a 3-item delta
    whose bits are equal, while the 2-item prefix has unequal bits. A fresh datum, then a form, then an
    instance of argument 2, keeps both target bits false and records that fresh argument. Arity two, a
    grammar for 3 or more items, and the sealed cost-two minimum on the full unpruned space stay open.
    The mention file and the rule-bridge file are not rechecked. AuthorityEffect is None.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Open: the cost-two minimum (CL-3-MIN-TWO) is relative to the sealed grammar and
    bounds, and nothing here establishes a k-item minimum or a bound on response size. This file checks
    one empty base with two data and arity one: 9 well-formed deltas of at most two items, 2 of them with
    unequal target bits. The 3-item rule extension equalizes those bits, and an instance of argument 2
    keeps them false. Arity two, a grammar for 3 or more items, and the sealed cost-two minimum stay open.'
  source_refs:
