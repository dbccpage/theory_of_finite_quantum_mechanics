target:
  source_statement: The MUB(6) claim firewall refuses a global solution bit even when a float is handed
    in. src/native/mub6_firewall.rs stores the line stated region only; mints no authority, with
    AUTHORITY_EFFECT None. src/native/mub6_claim_gate.rs builds a StatedRegionSeal whose mub6_equals_3,
    mub6_at_most_3, global_solution, and verified_certificate fields are documented as always false, and
    certificate_from_exact_only discards its f64 argument. The obligation is to accept only the exact
    EnclosedTriple certificate from that call.
