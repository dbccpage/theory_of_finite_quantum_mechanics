target:
  source_statement: The sealed manuscript declares two levels. The metatheory holds presentation tokens
    (strings), event sequences, indices, finite data structures and arithmetic; the object language holds
    only what a regime admits. Token glyphs, component counts, order, concatenation, multiplicity, substring
    structure, matching and string equality live in the metatheory unless an admitted judgment internalizes
    a distinction. Presentation identity (token equality) is metatheory only, internal identity is the
    datum index, and no semantic interpretation is ever assigned.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared two-level metatheory/object-language split of genesis_source.txt section 2 (assumption)
  source_bottleneck: 'A declared split, not a theorem: the Lean model has no tokens by construction, so
    token-blindness is structural there and is checked in Python and Rust by renaming tests; admission
    order is visible to the token-aware metatheory and erased at the object level.'
  source_refs:
  - dag/derivations/02_genesis/tfq_0430_metatheory_object_language_split.md
