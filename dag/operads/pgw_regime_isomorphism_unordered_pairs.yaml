target:
  source_statement: A regime isomorphism is a pair of bijections on datum and form indices that preserves
    form arities, ordered instance arguments, uniform-rule membership and the separation requirements
    read as unordered pairs; mapped requirement endpoints are sorted before comparison, and presentation
    tokens are erased first. Because requirements are unordered, exchanging the endpoints of a requirement
    can identify two responses; a relation preserving directed requirements would be a different convention.
    The Lean structure Iso states these fields over the admitted index ranges, and sortPair is shown to
    equal (min, max) and to be symmetric.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared isomorphism convention with unordered requirement pairs, genesis_source.txt section 3.8 (assumption)
  source_bottleneck: 'The convention is declared: Iso is a membership relation, so it also identifies
    list representations such as [p] and [p, p], and an isomorphism preserving directed requirements would
    give different tie classes.'
