target:
  source_statement: 'Given the corrected state, the full replay answered that the task of making <a> and
    <ab> internally distinguishable cannot be evaluated until <ab> is brought into the regime. The first
    addition can supply <ab> as data or write it into a rule pattern; the two are equally minimal and
    neither is uniquely forced. After Prompt 19 admitted <ab> beside <a> with no comparison, counting
    or matching, nothing in the regime reacts to them differently, so admission alone distinguishes nothing
    and no unique continuation is dictated. The requirement recorded is an order: the regime must admit
    inscriptions, retain them across turns and replay the current state before a separation task on them
    can be posed.'
