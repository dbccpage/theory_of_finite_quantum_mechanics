    doubling counts, or the topological anyon models close that shelf. The gap to continuum QCD stays
    open. This node does not say that continuum QCD has been derived. Narrowed in Lean 4, Rust, and an
    independent Python verifier to three exact finite/algebraic components and non-equivalence fences:
    (1) exact rational summary of finite QCD controls (beta_0 = 7, strong-coupling tension 17/18, 16 torus
    corners with 15 lifted doublers) and finite cyclic character cardinality L^d vs parked Pontryagin
    dual Hom(Z, U(1)) (finite_qcd_control_exact_rational_summary,
    finite_cyclic_dual_order_equals_lattice_period); (2) F002.S001 open bridge audit (bookCount = 0,
    GAP-F002-S001-001 open, Pontryagin dual parked without bridge theorem) and proof that finite controls
    do not derive continuum QCD while F002.S001 is open (f002_s001_empty_book_list_and_open_bridge_gap,
    pontryagin_dual_of_free_z_requires_unpaid_continuum_circle_fence,
    finite_qcd_controls_do_not_discharge_continuum_qcd_exit_fence); and (3) explicit breakdown and
    non-equivalence fences for beta_0, strong-coupling tension at beta >= 18, Wilson corner counts, and
    topological anyon catalog models (one_loop_beta0_polynomial_not_nonperturbative_continuum_mass_gap_fence,
    strong_coupling_plaquette_ratio_breaks_down_in_weak_coupling_continuum_limit_fence,
    wilson_torus_doubler_count_not_continuum_chiral_fermion_measure_fence,
    topological_anyon_catalog_not_continuum_su3_confining_vacuum_fence,
