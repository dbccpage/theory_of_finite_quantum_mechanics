target:
  source_statement: 'Finite statement, checked in Lean 4 in the following narrowed form. The Wigner 6j
    symbol with twice-spins at most 6 is S sqrt(P), where S is Racah''s single-sum factor, computed with
    exact integer factorials, and P is the product of four rational triangle factors; Lean defines the
    rational square W^2 = S^2 P (sixJSquaredRat) in this way. Checks: (i) the signed Racah factor S is
    invariant under the four generators of the 24 tetrahedral symmetries (the column swaps 12 and 23 and
    the double row flips on columns 12 and 23) for all 3,418 admissible 6-tuples with twice-spins at most
    6 (the invariance of P under the symmetries is evident, since they permute its four triangle factors,
    but is not part of the Lean check); (ii) the orthogonality relation sum over x of (x+1)(y+1) {a b
    x; c d y}{a b x; c d y''} = delta(y,y'') in twice-spin labels, for the 1,928 admissible tuples (a,b,c,d,y,y'')
    whose labels and whose intermediate twice-spin x all lie at or below 6; (iii) the Biedenharn-Elliott
    (pentagon) identity for all 814 admissible 9-tuples with twice-spins at most 3, and for four explicit
    instances with twice-spins up to 6 (all labels 2; labels 3 with p=q=r=2; (a,b,c,d,e,f,p,q,r) = (4,2,3,3,2,4,3,3,2);
    and (6,0,6,0,6,0,6,6,6)). Exact arithmetic in the rationals with one square root per symbol.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Not proved in Lean: the Biedenharn-Elliott identity exhaustively for twice-spins
    4 to 6 (four instances only); orthogonality for tuples whose intermediate range exceeds twice-spin
    6; invariance of P, W^2 and the signed symbol under the symmetry generators, and invariance under
    the whole group (the closure of the tuple set under the generators is not stated). Exact enumeration
    with big integers. The classical 6j is not the q-deformed 6j at level 2 recorded in TFQ-0105; the
    q to 1 limit is not part of the target.'
