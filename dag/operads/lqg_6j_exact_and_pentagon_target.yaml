target:
  source_statement: 'Finite statement to formalize. For the Wigner 6j symbol with all twice-spins at most
    6, the square is a rational number given by Racah''s single-sum formula with exact integer factorials,
    and the symbol is the signed square root. Checks: (i) invariance under the 24 tetrahedral symmetries;
    (ii) orthogonality sum over x of (2x+1)(2y+1) {a b x; c d y}{a b x; c d y''} = delta(y,y''); (iii)
    the Biedenharn-Elliott (pentagon) identity for all admissible labels in the range. Exact arithmetic
    in the rationals and one square root per symbol.'
