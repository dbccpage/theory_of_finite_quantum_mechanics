target:
  source_statement: Finite valuations that accompany a quantum derivation stay on exact rationals. finite_valuation.rs
    uses Rational values, rejects a negative mass or a nonzero mass on the empty event. It separates this
    unnormalized layer from a nonempty probability carrier, so an empty carrier is representable without
    being presented as a density. ExactOperator and the kernel Exact type remain the neighboring rational
    hosts. A NumPy probability on the quantum shelf is not a substitute valuation. The runtime stores
    the rational map beside the finite statement and does not normalize it by a float division.
