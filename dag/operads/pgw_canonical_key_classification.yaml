target:
  source_statement: 'If a representative map C lies in each regime''s isomorphism orbit and is constant
    on orbits, then C(R) = C(S) exactly when R ≅ S, and an injective serialization of the representatives
    gives the same criterion for keys (key_classification, conditional on both hypotheses). Companion
    results remove those hypotheses for the concrete search: equal sorted five-field tuples after relabeling
    by supplied bijections imply isomorphism (serializedRelabel_sound), and the length-prefixed unsigned
    64-bit wire encoding is injective on words below 2^64 (portableBytes_injective). Exhaustive search
    over all datum and form permutations attains a least structural key (canonicalKey_attained), and for
    well-formed regimes with duplicate-free collections the keys, and under the word bounds their byte
    encodings, are equal exactly when the regimes are isomorphic (canonicalKey_classification, canonicalBytes_classification).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The abstract key_classification needs an in-orbit, orbit-invariant choice; the concrete
    search results assume no orbit oracle but cover the Lean search only, and refinement of the optimized
    Python and Rust programs remains a separate engineering obligation, checked by finite agreement on
    1,436 labelled regimes.
  source_refs:
  - dag/derivations/02_genesis/tfq_0459_canonical_key_classification.md
  - atlas/papers/finite_obstruction_calculus/genesis/paper.md:484-492
  - atlas/papers/finite_obstruction_calculus/genesis/paper.md:508-521
