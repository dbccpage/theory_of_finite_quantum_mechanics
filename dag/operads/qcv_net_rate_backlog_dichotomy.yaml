target:
  source_statement: In the QCV-Q1 model with q0 >= 0, the backlog is bounded iff lam <= (1-g)*mu; for
    g >= 1 and lam > 0 no mu >= 0 bounds it; for g < 1 and mu = kappa*r, with kappa > 0, it is bounded
    iff r >= lam/((1-g)*kappa); with r = 0 and lam > 0 it equals q0 + t*lam.
