target:
  source_statement: Continuation attempt two decides the FORCED column of all twelve rows of the definability
    census over the declared engine class at its bounds (rounds zero to fifteen, both readings), each
    NOT FORCED verdict naming a first failing engine and a path of its run. The element count and irreversibility
    are FORCED, at the bounds by computation and beyond them by the every-history theorems, every cycle
    of every run being made of switch edges; two-ness is FORCED over the 64 LIVE engines, every path holding
    two before any bound or guard node. Every other row (the observational class count, succession, duration,
    adjacency, reach, symmetry, branching, exhaustion and recurrence) is NOT FORCED with an executable
    countermodel; one state of one run is reached in five rounds and in six, so succession and duration
    are not functions of the state.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared engine class of continuation attempt one, 144 members, run from both sealed readings (assumption)
  - Declared policy of how the runs read the DEFINABLE and USEFUL REALIZATION columns (SD-R-14) (assumption)
  source_bottleneck: Verdicts other than the element count, irreversibility and two-ness over the LIVE
    members are computations at fifteen rounds and a guard of 250; whether the four streamless E4 carriers
    continue past the bounds is OPEN (H-1), and two is not shown to be the floor of declared inputs.
  source_refs:
