target:
  source_statement: WDP-CH02-D01 defines a residual-locus witness as a typed locus L with evidence that
    the residual's component at L is nonzero under the declared test; the locus is a witness to a proposition,
    not a memory, observer, agent or apparatus. Section 2.2 replaces the one word witness by seven typed
    roles, ResidualLocusWitness, RetentionWitness, RepairWitness, ContextWitness, DualCertificateWitness,
    DescentReceipt and CounterexampleWitness, written Witness_k[P](x, e) with the proposition P and kind
    k in the type. WDP-CH02-P01 states that in the nominal typed interface no role tag coerces to another
    unless an explicit adapter and its hypotheses are declared. On the oriented triangle the circulation
    functional ℓ vanishes on im d₀ and gives ℓ(1,1,1) = 3, a dual certificate that observes, retains and
    decides nothing.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: A syntactic fence, not the 42 directed semantic non-implications between roles; the
    executable check (adapt_quotient and adapt_operational refusing MISSING_ADAPTER or ADAPTER_MISMATCH)
    covers observer representations and does not enumerate the seven tags.
