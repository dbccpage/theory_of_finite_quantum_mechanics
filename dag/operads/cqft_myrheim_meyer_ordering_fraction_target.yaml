target:
  source_statement: 'Finite statement to formalize. The ordering fraction of a finite causal set is the
    exact rational r = 2R/(n(n-1)), with R the number of strictly related pairs (CausalSet.ordering_fraction).
    The expected ordering fraction of a sprinkling into a d-dimensional Minkowski interval is f(d) = (3/2)
    d! (d/2)! / (3d/2)!, with f(2)=1/2, f(3)=8/35 and f(4)=1/10; the Myrheim-Meyer estimator inverts f.
    Targets: (i) the n x n grid with the componentwise product order has r = (n+3)/(2(n+1)); n=2 gives
    5/6, the value for the diamond C2 of CausalOrder.lean (5 related pairs of 6), and the limit 1/2 equals
    f(2); this is an observation about a lattice, not an instance of the sprinkling theorem. (ii) An exact
    rational dimension decision: for a rational r in (0,1], which of d=1,2,3,4 has f(d) nearest, with
    ties reported. (iii) The Hasse diagram (covering relation) is the unique transitive reduction; its
    link count and the Mobius values of C1 and C2 agree with the table entries of CausalOrder.lean.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Everything is rational arithmetic on named finite posets. The dimension estimator
    is a heuristic for sprinklings; the finite estimate on a small poset carries no manifold statement.
