target:
  source_statement: For d0 in Q^{m x n} and W = im d0, N_W(x) = x - sum_i x_{p_i} r_i (nonzero RREF rows
    r_i of d0^T with pivots p_i) is sound, idempotent and complete for x ~ y iff x - y in W, and is independent
    of the generating matrix; Lean checks the three laws for the fixed integral image span(1, 2) in Z^2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - fixed rational coboundary matrix d0 and coordinate order
  source_bottleneck: N_W is not an l1 minimizer (span(1,2), x = (1,0) gives norm 2 versus 1); the quotient
    norm is a separate exact linear program with a refusal budget (NF-003). A valid YAML contract or routing
    label is not a normalizer.
