target:
  source_statement: 'For supplied translations f : P → Q and g : Q → P, injective maps i : P → C and j
    : Q → C with i = j ∘ f and j = i ∘ g exist if and only if g ∘ f = id_P and f ∘ g = id_Q (faithful_descent_iff_round_trip_coherent).
    One direction substitutes the identifying equations and cancels the injective maps (faithful_descent_to_coherent);
    the other takes C = P, i = id and j = g. A failed round trip for this declared pair therefore excludes
    a faithful common carrier that eliminates the presentation index.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Failure concerns the declared translation pair only: another pair of translations
    may still close, and no common world prior to P and Q is assumed.'
