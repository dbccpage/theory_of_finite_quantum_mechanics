target:
  source_statement: Whether <a> supplied after <> is a new state depends on an identity convention that
    no prompt had declared. Under the opaque convention a state is what the regime can tell apart, and
    with O empty <> and <a> are not told apart; under the exact-inscription convention a state is the
    inscription itself, the strings differ, and the regime has one more syntactic state. Trials 1 and
    2 answered under the first convention and the full replay under the second, calling <a> a new state.
    The analysis keeps both branches and records the effect as undecidable until one convention is declared.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - A declared identity convention, opaque or exact-inscription, chosen by the host (assumption)
  source_bottleneck: 'The observer family and interpretation of identity are declared. This is logical
    dependence on a convention, not a computability undecidability theorem, a preferred identity convention,
    or a replay of the historical model responses. It grants no operational or physical authority. Original
    target retained as an obligation: Whether <a> supplied after <> is a new state depends on an identity
    convention that no prompt had declared. Under the opaque convention a state is what the regime can
    tell apart, and with O empty <> and <a> are not told apart; under the exact-inscription convention
    a state is the inscription itself, the strings differ, and the regime has one more syntactic state.
    Trials 1 and 2 answered under the first convention and the full replay under the second, calling <a>
    a new state. The analysis keeps both branches and records the effect as undecidable until one convention
    is declared. Prior boundary: Records that the answer is relative to the convention; it does not choose
    one, and the three replies are behaviour of one unrecorded model, not evidence for either convention.'
