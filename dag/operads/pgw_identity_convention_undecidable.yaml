target:
  source_statement: Whether <a> supplied after <> is a new state depends on an identity convention that
    no prompt had declared. Under the opaque convention a state is what the regime can tell apart, and
    with O empty <> and <a> are not told apart; under the exact-inscription convention a state is the
    inscription itself, the strings differ, and the regime has one more syntactic state. Trials 1 and
    2 answered under the first convention and the full replay under the second, calling <a> a new state.
    The analysis keeps both branches and records the effect as undecidable until one convention is declared.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - A declared identity convention, opaque or exact-inscription, chosen by the host (assumption)
  source_bottleneck: 'Records that the answer is relative to the convention; it does not choose one, and
    the three replies are behaviour of one unrecorded model, not evidence for either convention. Narrowed
    in lean4/CampaignPgwIdentityConventionUndecidable.lean and checks/independent/pgw-identity-convention-undecidable.py:
    models observation-family regimes PreGenesisRegime alpha beta with supplyInscription preserving obs
    (O_1 = O_0) and enlarging presented.card by +1, links obsProfile equality to PreMssn.Observation.SameProfile
    and genesisUnaryProfile equality to GenesisComputation.Collapsed, checks the Prompt 12 branch split
    (false with delta = 0 under opaqueConv vs true with delta = +1 under exactInscription, and undecidableWithoutConvention
    false true when no convention is declared), establishes agreement on profile-injective regimes, and
    keeps the host-declared identity convention as an explicit import (status remains CONDITIONAL).'
