target:
  source_statement: 'Paper 009 README title is 026_microsoft_majorana_problem: Majorana Parity Obstruction
    Calculus & Topological Computing Apparatus. That README says Lean gaussian_elimination_cubic_bound
    is Nat.le_refl of n times n times n, and that enum rfl declarations are not measured tetron homology.
    The F004 register calls the program a Majorana realization-packet gap and says noise sweeps are a
    separate program. The obligation is to withhold a tetron-homology reading from those reflexivity declarations.
    majorana_evaluator.py is a companion control, not a closure of that gap.'
