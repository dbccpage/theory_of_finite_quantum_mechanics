    original_target: 'The frame polytope {f in R^18 : f >= 0, Af = 1} of the Cabello configuration has
      exactly 146 half-integral extreme valuations; none has a PSD real-symmetric representative H_f (26
      have smallest eigenvalue -1/2; 120 have smallest eigenvalue > -1/4).'
    source_scope_review: The source census lemma checks 9 tetrads, degree two and 2+72+72=146, without
      an enumeration or PSD proof. The pinned FrameSystem actually exposes vertices/is_vertex/state_of
      and exact inertia; prior symbol_not_found annotations are source-scan limitations. We use the actual
      H054 rays/tetrads and two independent exhaustive basis methods, not the arithmetic label.
    admitted_assumptions:
    - real-symmetric operator representative H_f (assumption)
