target:
  source_statement: For rational Bloch vectors, noisy steps r -> (1-p)*R*r with rational rotations R (R^T
    R = 1) give sqDist(run r, run s) = (product of (1-p(i))^2)*sqDist(r, s), at most ((1-p)^2)^t*sqDist(r,
    s) when every p(i) in [p,1]; and (v.sigma)^2 = (v.v)*1 over the complex numbers, so the difference
    of two qubit states has both singular values |r-s|/2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - trace norm of a Hermitian matrix is the sum of absolute eigenvalues (cited)
  source_bottleneck: The identification of the qubit trace norm with the Bloch distance uses the cited
    eigenvalue fact; Python and Rust replays are exact on declared instances only.
  source_refs:
