  source_statement: For k marks, a finite rule list and a length bound L, ReachB is decided by an explicit
    closure of at most card(wordsLE L) rounds (decideReachB_iff); the configuration space has exactly
    1 + k + ... + k^L words (card_wordsLE); Step on a finite rule list is decidable (mem_succList).
  statement_status: source_claim_to_scope_check_not_accepted_result
