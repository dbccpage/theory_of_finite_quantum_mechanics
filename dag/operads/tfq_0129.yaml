target:
  source_statement: Covers quantum_state.rs, bell_state.rs, ghz_state.rs, w_state.rs, and mass_phase_embedding.rs.
    quantum_state.rs takes a pure state to be a nonzero Q(i) ray, not a normalized vector, so transition
    ratios, expectations, and the projector stay in Q. The f64 face is diagnostic only. Born weights use
    the declared squared-modulus rule. The Bell, GHZ, and W files name those finite entangled vectors,
    and mass_phase_embedding.rs embeds declared L1 masses and phases as a unit L2 vector. A Python replay
    and a Lean 4 declaration would still have to match the scale-invariant ray ratios and that diagnostic
    split.
