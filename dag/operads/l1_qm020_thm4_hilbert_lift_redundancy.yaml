    original_target: Given a supplied lift c with |c_i|^2 = w_i (for example c_i = sqrt(w_i) e^{i theta_i}),
      |c_i|^2 / sum |c|^2 = w_i / sum w. So the Born-form probability of the lift equals the l1 normalization,
      and the lift is redundant for probability. Existence of the lift requires square roots (not available
      over Q in general) and a complex structure.
