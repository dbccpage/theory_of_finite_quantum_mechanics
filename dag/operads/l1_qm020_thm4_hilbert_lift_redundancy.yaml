target:
  source_statement: Given a supplied lift c with |c_i|^2 = w_i (for example c_i = sqrt(w_i) e^{i theta_i}),
    |c_i|^2 / sum |c|^2 = w_i / sum w. So the Born-form probability of the lift equals the l1 normalization,
    and the lift is redundant for probability. Existence of the lift requires square roots (not available
    over Q in general) and a complex structure.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'square root field: lift'
  - 'complex scalars with modulus: lift'
  - 'unit phases: lift'
  source_bottleneck: No Lean theorem for |c|^2 normalization over C found; BornNormalization.lean treats
    discrete 2x2 density / POVM. Rust exact_amplitudes returns None unless every p_j is a rational square.
  source_refs:
