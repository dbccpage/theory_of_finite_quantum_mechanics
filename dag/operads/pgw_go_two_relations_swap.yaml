target:
  source_statement: 'The eighth derivation adds a second relation s beside r, and the ninth combines two
    relations with an empty beginning: a state has terms and a multiplicity table per relation. The two
    relations interact through the terms alone: an assertion of one leaves the other part as it is, a
    term or an identification acts on both, and a sequence projects to a sequence on either part. The
    seventh derivation''s one-relation states embed with nothing in s (proj_ofR9_false, proj_ofR9_true),
    and the exchange of the two relations is an involution (swap9_swap) and a symmetry of the results,
    the cost and reachability (ledger D16, with Reach9.swap and reach9_swap).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: proj_ofR9_false and proj_ofR9_true hold by rfl, so the embedding statements are definitional;
    the exchange symmetry is stated for the ninth seed's states, and later seeds that change the sameness
    re-prove it for their own (22:D10).
