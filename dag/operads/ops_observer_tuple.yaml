target:
  source_statement: 'Definition A1 of the source note. Fix a finite set M of measurements with finite
    outcome sets and a cover C of M by maximal contexts, and write E(U) for the set of outcome assignments
    on U. An observer tuple is O = (K, Adm, norm, Term, L). K = (M, C, E). Adm is the convex hull conv(A)
    of the vectors (delta_g restricted to C) over all contexts C, for g in E(M). The norm is the l1 norm
    on the stacked context distributions. Term maps the defect and the claim to a status: defect 0 gives
    ExactRepair, defect above 0 with a support-level global section gives ClosedResidual, and otherwise
    OpenObstruction. L is the diagnostic layer. The defect of a claim e = (e_C), one distribution per
    context, is Delta_O(e) = min over p in Adm of the l1 norm of (e - p). The five components are a projection
    of the four packets of WDP chapter 10 (presentation, memory, evaluator, policy) and of the chapter
    15 grade. The monograph defines no five-tuple of its own; the ledger row records a search for "5-tuple"
    that returned nothing.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: A reading of WDP-CH10-D01 to D04, not a derivation. WDP chapter 15 has no node in
    this graph, so the layer component has no repository node to attach to. No source relates the L1 observer
    axioms H1 to H5 to this five-component tuple.
