target:
  source_statement: 'A Genesis-style context (a slot tuple with holes, one datum plugged into every hole)
    has exactly one hole iff it is ofSplit u v for a unique pair of letter lists, and plugging d gives
    u ++ d :: v; so the one-hole contexts of arity a are the word contexts (u,v) with |u| + |v| = a -
    1.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Genesis plugs one datum into every hole while a word rule plugs a word into one hole,
    which is the wider operation; the sealed regime contexts with forms and rules are not modelled.
