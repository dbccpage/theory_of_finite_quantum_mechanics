target:
  source_statement: 'In Lean, maxGlobal is 2^20 and equals 1048576, and maxLp is 2^22 and equals 4194304.
    Then 2^64 > maxGlobal, 2^21 = 2097152, and 2^21 > maxGlobal. Also 10 * 2 = 20, 2^10 = 1024, 20 * 1024
    = 20480, 2^10 < maxGlobal, and 20 * 1024 < maxLp. Not in this statement: a zero duality gap, a dual
    inequality, tamper or shape rejection, a rebuilt linear programme, a singleton census, and any Rust
    refusal.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lean statement is the narrowed ceiling arithmetic above. The Rust receipt replay,
    tamper rejection, shape check, zero-gap dual certificate, PR box, noisy boxes, and the functions verify_noncontextual_fraction
    and verify_l1_defect_receipt are not run here. The in-repo module uses omega_solvers, an external
    crate that is not a workspace member.
