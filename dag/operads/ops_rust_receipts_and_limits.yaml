target:
  source_statement: 'As the ledger states them for the Rust module empirical_presheaf. (B15) The l1 defect
    receipt has zero duality gap: <phi*, e> + y0 equals the defect, with the sup norm of phi* at most
    1 and A^T phi* + y0 <= 0, and replay rejects tampering and shape errors. (B17) verify_noncontextual_fraction
    and verify_l1_defect_receipt rebuild the linear programme, verify the embedded solution as its certificate,
    and bind primal, dual and value to the receipt''s part, functional and fraction; the pivot trace is
    not bound. (B16) Every global and local section count is a checked fold against MAX_GLOBAL_ASSIGNMENTS
    = 2^20 returning EnumerationLimit, and dense allocations are bounded by MAX_LP_ENTRIES = 2^22 returning
    LpSizeLimit, with nothing of either size allocated or enumerated before the refusal: 64 binary singletons
    have 2^64 assignments and one context of 21 binary measurements has 2^21 sections, both above 2^20,
    while ten binary singletons give a 20 x 1024 incidence inside both ceilings. (B9, shape) The whole
    declared cochain is shape-checked before any incidence is read. Recomputed here: the ceiling arithmetic,
    and a zero-gap primal and dual pair for the PR box and the noisy boxes in the independent script''s
    own solver, which does not test the Rust verifiers.'
