target:
  source_statement: Under mu1 in reading L the minimum corrective augmentation is not unique. The unary
    mark deltaU0 and the binary link deltaBL are both valid two-item responses to Challenge 3 on R2L,
    no response of at most one item is valid, and their results U0 and BL are non-isomorphic because form
    arity is an isomorphism invariant (mu1_minimum_not_unique, U0_not_iso_BL). The theorem is stated over
    R2L only.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared item grammar, measure mu1 and the implemented isomorphism relation (assumption)
  source_bottleneck: 'Reading L only: reading-F non-uniqueness is the bounded engine enumeration of five
    classes (TFQ-0442), and under mu2 the minimum is unique up to isomorphism (TFQ-0382).'
