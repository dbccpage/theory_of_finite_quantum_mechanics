target:
  source_statement: The residual U(1)_Y covariance u(e^{i alpha/2} Phi) = u(Phi) diag(e^{-i alpha/2},
    e^{i alpha/2}), the dressed gauge field with derivative term, and the reading as an electroweak model
    without spontaneous symmetry breaking are not established by the finite artifacts.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - continuum gauge fields W_mu and derivatives
  - U(1)_Y phases outside Q(i)
  source_bottleneck: The normalized residual law is recorded when z lies in Q(i), the squared modulus
    of z is 1, and a rational s with s*s equal to the doublet squared norm is supplied. Continuum gauge
    fields W_mu, derivatives, phases outside Q(i), and the Elitzur or symmetry-breaking reading stay open.
