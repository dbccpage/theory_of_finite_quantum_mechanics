target:
  source_statement: 'Continuation attempt one (pull request 267), authorized by the author after the original
    twelve attempts, takes Challenge 3, the engine: a generator (one of the nine stake rules, read in
    a plain or flipped mode), a responder (one sealed measure and one of rung one''s two validity members,
    answering a demand by every tied minimum), a continuation (a subset of growth and switch fired only
    at a demand-free state, the empty subset named HALT) and the sealed replay extended by the switch
    marker. The class has 144 members, 108 of them without HALT, with capability counts from six to ten,
    so no member is one declaration. Probed to depth two from both readings (288 probes), 64 members are
    LIVE and 16 TWO-KINDED; a count-minimal and inclusion-minimal member exists in every declared subclass,
    none of the minima is unique up to probe-isomorphism, and no member is initial under inclusions of
    declarations. No engine is run forward.'
