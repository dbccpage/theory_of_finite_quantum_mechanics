- kind: theorem
  name: lorentz_boost_preserves_minkowski_and_det_one
  line: 346
  signature_excerpt: |-
    theorem lorentz_boost_preserves_minkowski_and_det_one (beta : Rat)
        (hd : 1 - beta ^ 2 ≠ 0) :
        Mat2Rat.det (lorentzBoost2 beta) = 1 ∧
        Mat2Rat.mul (lorentzBoost2 beta) (lorentzBoost2 (-beta)) = Mat2Rat.id ∧
        Mat2Rat.mul (lorentzBoost2 (-beta)) (lorentzBoost2 beta) = Mat2Rat.id ∧
        Mat2Rat.mul (Mat2Rat.mul (Mat2Rat.transpose (lorentzBoost2 beta)) minkowskiEta2)
                    (lorentzBoost2 beta) = minkowskiEta2
  source: lean4/RaveraDfmFiniteToContinuum.lean
  repository: this_repository
  source_sha256: 70687535990869370ddb6ec8b17a080e48992047692f26fbb478703b631c1cdf
