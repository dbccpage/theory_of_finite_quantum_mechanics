target:
  source_statement: S(4) applies a supplied pair-separation closure policy. The sealed source derives
    no object-language endogenous demand generator; under the declared policy, which reads admitted structure
    and automorphism orbits and issues one requirement per orbit, the fixed finite datum set reaches the
    all-pairs-separated fixpoint, and a closed run from an empty requirement store makes at most n(n−1)/2
    rounds (closedRun_round_bound_from_empty). At that terminal state the active separation-demand set
    is empty, so W₄ = ∅ and s₄ = 0, while the retained history H₄ stays nonempty. A complete graph K_m
    records the separated pairs of m data; for m ≥ 1 it is connected with cycle-space dimension m(m−1)/2
    − m + 1.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared pair-separation closure policy of the sealed Genesis account, token-blind and isomorphism-equivariant
    (assumption)
  source_bottleneck: Neither supply nor a stage number selects the policy, and there is no claim that
    the carrier has four data or that exactly five receipts were issued, so dual_ledger_independence_at_stage_4
    (s₄ = 0, |H₄| = 5) is a table identity; K_m edges need not be admitted binary relations, and S4Orbit
    counts complete-graph edges without orbit search.
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0516_sn4_policy_closure_cycle_space.md
  - atlas/papers/finite_obstruction_calculus/genesis/docs/sources/genesis_source.txt:531-537
  - external:sha256:2e70889e739a5d0f329fc639a8a0a4b2e80e6a83d5232a9f2e92ae029c31fcca:24-27
