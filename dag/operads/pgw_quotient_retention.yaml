target:
  source_statement: Let fine and coarse be equivalence relations on one set with every fine identification
    also a coarse one. The map [x]_fine ↦ [x]_coarse is well defined and surjective (collapseMap_surjective),
    injective exactly when every coarse identification also holds finely (collapseMap_injective_iff_reverse_refinement),
    and successive such maps compose without choosing representatives (collapseMap_compose). If a former
    identification fails in the finer relation, two distinct fine classes remain over one coarse class
    (failed_identification_retains_two_classes).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'A theorem about supplied equivalence relations: no class is manufactured and no
    new primitive is inferred, and which identifications a later stage must retain is a declared task.'
