target:
  source_statement: density_matrix.rs accepts an exact density over Gaussian rationals only when it is
    Hermitian, positive semidefinite by an exact test, and of trace one, and it separates that operator
    from the population shadow of its diagonal. The finite obligation is that split. The shadow of a pure
    projector and the shadow of a classical mixture can agree while the coherences differ, and the module
    says those coherences are reported rather than dropped. quantum_state.rs keeps unnormalized rays and
    applies a declared squared-modulus rule for computational-basis weights.
