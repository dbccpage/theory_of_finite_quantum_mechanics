target:
  source_statement: 'Narrowed boundary, status left OPEN: on the 3 by 3 lattice, 3*3 = 9 vertices and
    3*2+3*2 = 12 edges. The spanning-tree count 9-1 = 8 and the cycle count 12-9+1 = 4. The strong-coupling
    denominator 2*3*3 = 18, and 2 = 1*2 together with 18 = 9*2, so the reduced ratio is 1/9. For all natural
    numbers r and t, the area-law exponents satisfy (r+1)*(t+1)+r*t = (r+1)*t+r*(t+1)+1, and the perimeter-law
    exponents satisfy 2*((r+1)+(t+1))+2*(r+t) = 2*((r+1)+t)+2*(r+(t+1)), using the side shift (r+1)+t
    = r+(t+1). The four pairs with sides in {2, 3} are instances. The cleared one-loop numerators 33-2*n
    equal 33, 27, 23, 21, 1, and -1 at n = 0, 3, 5, 6, 16, and 17. For n from 0 through 16 they are 33,
    31, 29, 27, 25, 23, 21, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1. The cleared two-loop numerator at n = 16
    equals -302, and -1*302 equals -302. The finite-map note contains a sentence that withholds a continuum
    mass-gap claim and withholds non-perturbative confinement in the continuum limit at weak coupling.
    The shelf path omega_engine_atlas/coda_atlas/F002_continuum/S001_continuum_finite_shadow_bridge/shelf.yaml
    is absent from this tree, and no file in this tree is named named_adjoining.yaml. Status stays OPEN.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The identities in the statement are the strong-coupling boundary. The finite-map
    sentence withholds a continuum mass-gap claim and a weak-coupling spacing limit. The shelf README
    sentence and the Pontryagin adjoining sentence stay unchecked because those files are absent. A Monte
    Carlo string tension and a vanishing-spacing limit stay open. Status stays OPEN.
