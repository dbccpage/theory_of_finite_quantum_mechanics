target:
  source_statement: 'Imported formula, as the source states it at leading order in Newton''s constant:
    S(A) = Area(minimal surface anchored on the boundary of A) / (4 G). It presupposes the von Neumann
    entropy of a boundary reduced state on a continuum Hilbert space and the area of a surface in a bulk
    geometry. The repository has an exact von Neumann entropy dichotomy for algebraic spectra and an exact
    rational Regge area proxy that is not the Einstein-Hilbert action; neither is a minimal-surface area
    in a bulk geometry. Narrowed in Lean 4 and an independent Python verifier to three exact algebraic
    shadows and scope fences: (1) over Q, substituting the regulated AdS_3 geodesic length 2 R_AdS * logFactor
    into rtLeadingEntropy(area, G_N) = area / (4 G_N) reproduces the 2D CFT Calabrese-Cardy coefficient
    (c / 3) * logFactor under the Brown-Henneaux relation c = 3 R_AdS / (2 G_N^(3)) and eliminates both
    bulk couplings in S_A / c = logFactor / 3, while submodular surface pasting yields Strong Subadditivity
    S(ABC) + S(B) <= S(AB) + S(BC) and all 380 proper contiguous boundary intervals of the 20-qubit 6-pentagon
    HaPPY patch satisfy complement symmetry A <-> A^c; (2) under BakerCitedInput (EntropyDichotomy.lean),
    no mixed algebraic spectrum can have natural-log von Neumann entropy equal to a rational RT ratio
    area / (4 G_N), equality holds at G_N > 0 iff the state is pure and area = 0, and stabilizer bit counts
    require dividing by log 2; and (3) on the orthogonal_pentatope chart of TFQ-0100, the 6 right-triangle
    hinges have Cayley-Menger squared area 1/4 and the 4 equilateral-triangle hinges have squared area 3/4
    (total 9/2) with no rational linear area A in Q satisfying A^2 = 3/4, the flat-chart Regge proxy (kappa = 0)
    vanishes identically whereas all 380 HaPPY intervals satisfy 1 <= S(A) <= mincut(A), and under length
    rescaling L -> lam * L the Regge proxy scales as lam^4 against lam^2 for 2-surface area and lam^0 for
    bond counts.'
