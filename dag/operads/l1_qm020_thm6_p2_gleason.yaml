target:
  source_statement: 'Born-quadratic uniqueness holds only under imported assumptions: finite additive
    weights, complex linear Hilbert representation, phase-blind positive descent map, orthogonal additivity,
    reversible lifted dynamics by linear isometries, interference as bilinear cross terms, projection-measure
    / frame-function structure. For dim >= 3 Gleason gives Tr(rho Pi); dim 2 needs a POVM variant. This
    is the Born-uniqueness firewall.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Gleason theorem: assumption'
  - 'complex Hilbert space of dim >= 3: assumption'
  - 'orthogonal additivity / frame functions: assumption'
  - 'reversible linear isometric dynamics: assumption'
  source_bottleneck: Gleason is cited, not proved here. GleasonTheorem.lean states it is NOT a proof of
    Gleason's theorem. native/src/campaigns/born_gleason.rs exists under 006_finite_qm (accept dim3 /
    refuse dim2 / refuse real scalars per ledger; test names not checked).
