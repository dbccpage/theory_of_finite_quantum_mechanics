target:
  source_statement: Finite Weyl-Heisenberg operators are an exact shadow and include an explicit refusal
    of a characteristic-zero CCR. src/heisenberg.rs sets X and Z on a finite clock, with tau squared equal
    to omega, and says a finite characteristic-zero CCR is refused by its nonzero exact trace, whether
    or not the finite Weyl relation holds. Even dimension needs a declared 2d-th root; reducing labels
    modulo d would drop a sign. weyl_operators.rs and pauli_symplectic.rs sit in the same crate. The obligation
    is to keep that finite relation from being cited as a CCR on a completed real line.
