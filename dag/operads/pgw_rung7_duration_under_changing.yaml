target:
  source_statement: 'Rung seven (pull request 260) takes W-1, duration under CHANGING: a growth is a changing
    round that adds a datum, a rest round a changing round that does not, and the duration vector counts
    rest rounds between successive growths. In Lean the growths and rest rounds of any replayed history
    are functions of base and regime, so the number of segments and their sum are definable, and the data
    that instances and requirements name bound later segments from below. Countermodels: no segment is
    a function of position, base and regime, and no duration between the first two growths is a function
    of the regime, even over histories from the empty regime. On the rectangle the vectors reached at
    every regime are exactly the envelope, and the envelope is not a class invariant.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondDuration.Rounds.growths_counted at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
  - Lean declaration SecondDuration.Gaps.gap_not_from_genesis at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
  source_bottleneck: Each duration between growths is not definable from the state; attainment of the
    envelope beyond the four-event rectangle (V-1) and the multiset of envelopes of a class (V-3) are
    OPEN.
