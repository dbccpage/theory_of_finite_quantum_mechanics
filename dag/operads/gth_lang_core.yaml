    only through an admission event or impose, and with supply external (PG-GEN-REGIME-EVENTS); and the
    two boxed laws that S(n+1) may contain only structure forced by an unresolved obstruction at S(n),
    and that a realization has no authority to extend S(n) (PGW-SN-TWO-BOXED-LAWS). No syntax, no typing
    judgement and no deep embedding is given. Alphabet declarations of the MSS-N grammar are not a primitive
    derived from those three nodes.'
