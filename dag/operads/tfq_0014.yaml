target:
  source_statement: 'finite_groupoid_algebra.rs linearizes a ValidatedFiniteGroupoid as convolution over
    Q(i). The module states that the associated complex C*-algebra is a mathematical extension, not a
    native finite computation. gauge_cochain_complex.rs is a different object: an exact complex on packets
    in M_2(Q(i)), with d0 sending anti-Hermitian generators to commutators on effects and states. Neither
    file is a Hopf gauge theory, and neither file stores SU(3) link variables. The obligation is to keep
    the groupoid convolution and the qubit packet complex from being cited as the color connection used
    later in the QCD control. Narrowed in Lean 4 and an independent Python verifier to three exact
    finite/algebraic components and non-equivalence fences: (1) 2-object pair groupoid convolution
    associativity, two-sided unit e00 + e11, orthogonal object idempotents e00 * e11 = 0, and the
    (2p+1)^2 != 2q^2 parity obstruction for the C*-norm sqrt(2) completion
    (pair_groupoid_convolution_associative, pair_groupoid_unit_and_orthogonal_object_idempotents,
    groupoid_cstar_norm_requires_sqrt_extension_fence); (2) M_2(Z[i]) qubit packet commutator coboundary
    d0(Omega)(X) = [Omega, X] tracelessness, scalar kernel, Leibniz derivation rule, and Jacobi identity
    (packet_d0_commutator_trace_zero, packet_d0_scalar_kernel_and_leibniz_derivation,
    packet_d0_jacobi_identity); and (3) non-equivalence fences separating groupoid convolution and the
    M_2 packet complex from each other (I2 * I2 = I2 != 0 = [I2, I2]), from Hopf gauge modules, and from
    SU(3) color links (matrix entries 4 != 9, Lie dimension 3 != 8, fundamental Casimir 3/4 != 4/3, and
    Lie derivation vs. multiplicative link law).'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
