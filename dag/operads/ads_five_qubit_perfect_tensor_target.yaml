target:
  source_statement: 'Finite statement to formalize. The [[5,1,3]] code of Laflamme, Miquel, Paz and Zurek
    has stabilizer generators XZZXI, IXZZX, XIXZZ, ZXIXZ and logical operators XXXXX and ZZZZZ. Its Choi
    state is the six-qubit stabilizer state with generators g tensor I (four of them), XXXXX tensor X
    and ZZZZZ tensor Z. Claim: this state is a perfect tensor, that is, every bipartition with at most
    three legs on one side has a maximally mixed marginal, equivalently every non-identity element of
    its 64-element stabilizer group has weight at least 4. Expected weight distribution: 1 element of
    weight 0, 45 of weight 4, 18 of weight 6 (the hexacode six-qubit state); all twenty 3|3 bipartitions
    have entropy 3 bits; the minimum weight of a nontrivial logical operator is 3.'
