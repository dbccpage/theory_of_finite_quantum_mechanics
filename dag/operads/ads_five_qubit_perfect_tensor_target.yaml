target:
  source_statement: 'Formalized finite statement. The [[5,1,3]] code of Laflamme, Miquel, Paz and Zurek
    has stabilizer generators XZZXI, IXZZX, XIXZZ, ZXIXZ and logical operators XXXXX and ZZZZZ. Its Choi
    state is the six-qubit stabilizer state with generators g tensor I (four of them), XXXXX tensor X
    and ZZZZZ tensor Z. Checked in Lean 4 on Pauli operators modulo phase (GF(2) symplectic vectors):
    the six generators pairwise commute and generate a group of 64 distinct elements, with weight distribution
    1 element of weight 0, 45 of weight 4 and 18 of weight 6 (the hexacode six-qubit state), so every
    non-identity element has weight at least 4, which is the perfect-tensor condition (every bipartition
    with at most three legs on one side has a maximally mixed marginal); for all twenty 3|3 bipartitions
    the stabilizer subgroup supported on one side is trivial, so the entropy is 3 bits by the stabilizer
    formula S(A) = |A| - log2 |G_A|; and in the five-qubit code the normalizer of the 16-element stabilizer
    has order 64 and its 48 elements outside the stabilizer (the nontrivial logical operators, modulo
    phase) have minimum weight 3. The reading of weights and local stabilizer subgroups as marginals and
    entropies is the standard stabilizer-formalism dictionary and is not formalised on density matrices.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 by exhaustive GF(2) symplectic enumeration over the 64-element
    stabilizer group, the 20 bipartitions and the 1024-element five-qubit Pauli group. A finite stabilizer
    enumeration is not a statement about AdS/CFT.
