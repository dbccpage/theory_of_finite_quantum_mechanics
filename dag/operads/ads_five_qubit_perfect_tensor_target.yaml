target:
  source_statement: 'Formalized finite statement. The [[5,1,3]] code of Laflamme, Miquel, Paz and Zurek
    has stabilizer generators XZZXI, IXZZX, XIXZZ, ZXIXZ and logical operators XXXXX and ZZZZZ. Its Choi
    state is the six-qubit stabilizer state with generators g tensor I (four of them), XXXXX tensor X
    and ZZZZZ tensor Z. Checked in Lean 4: this state is a perfect tensor; its 64-element stabilizer group
    has weight distribution 1 element of weight 0, 45 of weight 4, and 18 of weight 6 (the hexacode six-qubit
    state); all twenty 3|3 bipartitions have projective stabilizer rank 3 (entropy 3 bits); and the 192
    nontrivial logical operators in the normalizer outside the stabilizer have minimum weight 3.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 by exhaustive GF(2) symplectic enumeration over the 64-element
    stabilizer group and the 20 bipartitions. A finite stabilizer enumeration is not a statement about
    AdS/CFT.
