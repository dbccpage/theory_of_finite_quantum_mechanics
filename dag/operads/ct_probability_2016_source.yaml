target:
  source_statement: Marletto (2016, arXiv:1507.03287) formulates unpredictability in superinformation
    media via the non-existence of an X-predictor constructor (Section 4 pp. 21-22), defines X-indistinguishability
    equivalence classes and X-partitions of unity [f(z)_x] through the limiting ensemble fraction constructor
    D_x^(N) under conditions E1-E2 (Section 5 pp. 23-29), and shows that in a decision-supporting superinformation
    theory (conditions T1-T2 and R1-R4, Table 1 p. 32) a player automaton Gamma satisfying decision axioms
    A1-A2 (Section 6.2 pp. 35-36) values an X-game of chance G_X(y) by the additive expectation V{G_X(y)}
    = sum_{x in X} f(y)_x x (Section 7 eqs. (16), (18), (20) pp. 41-47). This node records the paper's
    results.
  statement_status: source_claim_to_scope_check_not_accepted_result
