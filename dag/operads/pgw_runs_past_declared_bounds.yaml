target:
  source_statement: 'Challenge 4 was run to declared bounds only (fifteen rounds, a node guard of 250
    per run, growth below four data, two items): 11,266 nodes stopped at the guard and 368 at the bound,
    and 116 runs are not closed. Attempt two''s leftovers H-2 to H-9 remain: the 970 refused same demands
    (H-2), the twenty-eight merges rung two''s observable budget refused (H-3), the 482 regimes above
    the brute-force key limit (H-4), a distance on adjacency (H-5), a reading of carrying forward that
    admits switch (H-6), the forty-four closed runs with switch cycles UNDECIDED under ONE VALUE PER NODE
    (H-7), why E1 and E5 share one run under mu2 (H-8), and five data (H-9). Whether the augmentation
    sequence is unbounded is unresolved in the sealed paper (question 7): with the external continuation
    policy every requested depth tried was reached and every supplied demand has a response (mark_progress),
    and no unboundedness claim is made.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Open; every FORCED verdict other than the element count, irreversibility and two-ness
    over the LIVE members is a computation at the declared bounds. Narrowed in Lean 4 to five records
    on that line: (15, 250, 3, 2) is inside, and one extra round, one extra node, data 4, or three items
    is outside. The census of stopped runs, leftovers H-2 to H-9, and whether the augmentation sequence
    is unbounded stay open.'
