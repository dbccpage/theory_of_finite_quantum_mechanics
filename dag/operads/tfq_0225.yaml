target:
  source_statement: 'A certifier catalog row does not discharge the claim it indexes. mathematical_claim.rs
    documents one registry and stores AuthorityEffect: None on every record. A row may list a Lean locus,
    target crates, and a harness name supplied by an author. certificate_boundary.rs marks the boundary
    around those records and is not a promotion switch. F003.S001 says a catalog scaffold is not a theorem
    and that crate-local interfaces do not own admission. Citing a row copies an index. It leaves the
    language triple and the gap register unchanged.'
