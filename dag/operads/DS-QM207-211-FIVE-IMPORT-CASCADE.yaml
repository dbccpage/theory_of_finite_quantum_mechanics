  source_statement: 'QM over C^n is presented as added fiber structure over L1, separated by five imports: U(1)
    phase fiber and involution (207), quadratic L2 readout (208), non-commutative algebra B(H) (209), Born rule
    postulate with Gleason-type uniqueness (210), continuous unitary dynamics (211). The 207-211 papers only state
    that each import is needed; the proofs I read are absence arguments (QM211 Thm 1.1 is a one-paragraph prose
    argument), not derivations of any import.'
