target:
  source_statement: 'Source record: lattice gauge theories whose gauge group is a finite subgroup of SU(2)
    or SU(3) follow the Lie-group theory at small beta and undergo a freezing transition at larger beta
    (Petcher-Weingarten 1980 for subgroups of SU(2); Bhanot-Rebbi 1981 for the 1080-element subgroup of
    SU(3)).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Fence: a fixed finite gauge group is not a route to the asymptotically free continuum
    limit, which needs beta to go to infinity; a finite route must enlarge the group, or pass to a quantum-group
    truncation, together with the lattice. The cited results are numerical; no rigorous freezing theorem
    is recorded here.'
  source_refs:
  - papers/drafts/finite_lattice_gauge_theory_yang_mills_qcd.md
  - external:D. Petcher, D. H. Weingarten, Phys. Rev. D 22 (1980) 2465
