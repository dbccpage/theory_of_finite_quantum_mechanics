target:
  source_statement: 'WDP-CH01-P01: within a fixed comparison family K, a failed declared sameness comparison
    Same_K(p, q) = 0 exhibits that the two compared presentations are not interchangeable under that comparison.
    The statement is local: it does not say the presentations differ under every comparison, does not
    make the failure intrinsic to the tokens, and supplies no order. A failed comparison is a residual
    at the level of predicates; encoding it as p − q is a stronger step that presupposes subtraction,
    scalars and a zero.'
