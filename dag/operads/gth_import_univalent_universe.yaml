target:
  source_statement: 'Assumed, and not derived from Genesis admission or from any finite model: a univalent
    universe in the sense of the Homotopy Type Theory book (The Univalent Foundations Program, Institute
    for Advanced Study, 2013), a type U together with a map from the identity type Id_U(A, B) to the type
    of equivalences between A and B that is itself an equivalence. Such a universe is not a finite set
    and is not a finite semi-simplicial set of bounded dimension. A finite model of a fragment with identity
    types, were one later defined, would be only an approximation of this assumption: the assumption is
    an infinite object, and the finite model would not contain it.'
