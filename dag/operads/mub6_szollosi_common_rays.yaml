target:
  source_statement: For a raw 6x6 complex Hadamard H, H completes to a raw quartet iff two bases of common
    rays of I and H are raw-unbiased to each other; in particular, if no two common rays z, w have |<z,w>|^2
    = 6, then H has no raw quartet.
