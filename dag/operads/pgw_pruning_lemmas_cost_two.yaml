target:
  source_statement: 'A separation witness never inhabits a uniformly ruled form, so shrinking the final
    rule set preserves every separation (separable_of_subrules). With the item-level bridge applyDelta_dropRules,
    a delta containing a uniform-rule item is never minimal: dropping its rule items leaves a valid, strictly
    shorter delta with the same new-form arity sum (rule_item_never_minimal). The mention lemma shows
    that appending instances that mention neither datum of a pair leaves that pair''s collapse unchanged
    (collapsed_append_unmentioning), and under the well-formedness conjuncts a fresh unreferenced datum
    or form leaves the collapse of every existing pair unchanged (collapsed_fresh_datum, collapsed_fresh_form).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The three irrelevance inputs and the rule bridge are theorems, but the enclosing
    claim that the pruned cost-2 enumeration contains every minimum (CL-PRUNE-STRUCTURAL) stays a bounded
    theorem on computational evidence over the declared grammar slice.
