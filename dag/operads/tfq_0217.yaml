target:
  source_statement: A replay digest does not widen the finite statement it covers. SHA-256 of a proposal,
    a run-folder manifest, or a prime receipt shows byte agreement with an earlier record. It does not
    add a carrier, erase a loss-ledger entry, or turn a Lean hypothesis into an independent conclusion.
    The Q ledger appends descent results in memory, which is a log of what was recorded, not a new finite
    relation. If the payload still holds a float trace, the hash preserves that trace and does not make
    it an exact rational. Replay travels with the statement; it is not a substitute for the three-language
    name.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Treat a digest as byte agreement only, not as an added carrier or relation.
