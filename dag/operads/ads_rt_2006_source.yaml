target:
  source_statement: Ryu and Takayanagi (2006, arXiv:hep-th/0603001, Section 1 eq. (1.5) p. 2) propose
    that the entanglement entropy S_A of a spatial subregion A in a (d+1)-dimensional CFT dual to static
    AdS_{d+2} is given by S_A = Area(gamma_A) / (4 G_N^(d+2)), where gamma_A is the static minimal bulk
    d-surface anchored on partial A, and check in Section 2 (eqs. (2.1), (2.5)-(2.6) p. 3) that in AdS_3/CFT_2
    the geodesic length reproduces S_A = (c/3) log((L/(pi a)) sin(pi l / L)) under the Brown-Henneaux
    relation c = 3R / (2 G_N^(3)). This node records the proposal as published.
