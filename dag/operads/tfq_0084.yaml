  source_statement: A finite gravity shadow is relational point coincidence, a Regge deficit on a finite
    simplicial complex, a spin-foam or area-spectrum control, and the kinematical shadows named in the
    quantum-foundations notes. The exact rational proxy that sums squared areas times deficits is not
    the Einstein-Hilbert action. The float script l1_regge.py is not that proxy. The three languages must
    say which finite identity they check. A certificate on a small complex is not quantum gravity, and
    it is not a derivation of the Einstein equation.
