scope_notes:
- The external source ListedHistorySummary.lean (named by the operad bindings, outside this repository;
  the line numbers cited from it are taken from that external file and are not verified by any gate) is
  general (arbitrary types, DecidableEq reports, explicit List); it calls itself a proposal. The existing
  Rust witness verify_pregenesis_constructive_summary_witness checks one fixed four-pair listing and one
  split listing, an instance, not the general statement. This node re-proves the criterion by structural
  recursion instead of List.find? lemmas, adds recon_wrong_off_list, a classical-instance variant that
  records where Classical.choice enters, and checks exhaustively all listings, reports and answers on
  15 small tuples. It is the constructive companion of PG-HISTORY-REPORT-CRITERION and does not repeat
  that node.
