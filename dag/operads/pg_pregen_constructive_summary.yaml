    original_target: 'Constructive (no Classical.choice) Pre-Genesis summary/history theorem for explicitly
      listed histories: choice-free first-match reconstruction recon satisfies recon_of_fiberConstant
      and fiberConstant_of_recon in ListedHistorySummary.lean.'
    source_scope_review: The external source ListedHistorySummary.lean (named by the operad bindings,
      outside this repository; the line numbers cited from it are taken from that external file and are
      not verified by any gate) is general (arbitrary types, DecidableEq reports, explicit List); it calls
      itself a proposal. The existing Rust witness verify_pregenesis_constructive_summary_witness checks
      one fixed four-pair listing and one split listing, an instance, not the general statement. This
