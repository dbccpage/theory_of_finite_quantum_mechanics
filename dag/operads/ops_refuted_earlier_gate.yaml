target:
  source_statement: Two earlier designs of the Python gate failed. (N1) The count rule "the number of
    principals is below the number of identifiers" missed the case evaluator_also_proposer (identical
    bindings) and the case (id-A/p1, id-B/p1, id-A/p2), where two identifiers share a principal and a
    third principal exists; for both, the principals and the identifiers are 2 in number, so the rule
    does not fire. It was replaced by a pairwise check. (N8) A non-string key in a packet mapping reached
    the string join in _reject_unknown and escaped evaluate_mapping as a TypeError; it is now a MALFORMED_PACKET
    refusal at every level. The counts are recomputed by the independent check; the earlier code is not
    in this repository.
