    def transport (U : E → G) : {a b : V} → Walk src dst a b → G
      | _, _, .nil _ => 1
      | _, _, .edge e => U e
      | _, _, .reverse p => (transport U p)⁻¹
      | _, _, .append p q => transport U q * transport U p

