target:
  source_statement: A finite graph dressing theorem leaves smooth-field existence, patching, topology,
    locality and continuum dynamics as separate obligations.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Finite witness, not a continuum theorem: on the supplied rooted tree root-p-a, root-b
    with chord a-b, the dressed chord is U(root-b)^{-1} U(a-b) U(p-a) U(root-p). Outer labels 2 and 5
    with the other three labels trivial give dressed chords 2 and 5, while every edge incident to {a,
    b} is unchanged. A refinement family, compatibility maps, a topology and a convergence theorem are
    still required before transporting finite identities to smooth gauge theory. Smooth-field existence,
    continuum patching and continuum dynamics stay open.'
  source_refs:
