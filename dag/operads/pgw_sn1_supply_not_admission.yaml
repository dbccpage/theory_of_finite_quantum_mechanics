target:
  source_statement: S(1) supplies <a>. Supply(<a>) alone leaves the admitted regime unchanged (supply_no_op),
    and AdmitDatum(<a>) is a separate event that may create one admitted datum. The sealed source records
    that whether <a> is admitted at Challenge 1 is underdetermined, and that the two sub-readings converge
    at Challenge 2 because admission deduplicates on presentation identity. With no admitted instances
    every pair of data is observationally collapsed, even with uniform rules present (collapsed_of_no_insts).
    The ledger value s₁ = 1 is chosen for the exercise that issues the demand obs_unconsumed_mark and
    is not inferred from singleton cardinality.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
