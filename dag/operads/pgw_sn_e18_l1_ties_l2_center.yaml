target:
  source_statement: 'Example E18 keeps the unfilled triangle with x = (1,0,0) and I(x) = 1, so every residual
    r = x − d₀g has I(r) = 1. Under ℓ¹ the bound ‖r‖₁ ≥ |I(r)| = 1 is attained by r = (1,0,0) and by ties
    such as (1/2,1/2,0), with dual certificate y = (1,1,1) satisfying d₀ᵀy = 0, ‖y‖∞ ≤ 1 and xᵀy = 1.
    Under ℓ² over ℚ, Σ(r_i − 1/3)² = ‖r‖₂² − 1/3 ≥ 0 gives the unique minimizer h = (1/3,1/3,1/3) with
    squared norm 1/3, from g = (0,2/3,1/3) with x = d₀g + h and d₀ᵀh = 0. Both optimal representatives
    keep I = 1: optimization selects a representative and does not remove the obstruction.'
