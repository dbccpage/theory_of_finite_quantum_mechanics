target:
  source_statement: 'No endogenous demand generator exists in the Alpha harness (AE-DEMAND-OPEN, OB-1,
    successor research S2): a demand is a target pair (i, j) with 0 ≤ i < j < n_data supplied by the host
    together with the measure and the declared bounds, nothing in the harness chooses a next demand, and
    the collapsed pairs left after an admission are returned as observations, not demands (leftover_as_demand
    refuses). The sealed derivation''s pair-separation closure policy is declared metatheory, not a harness
    function, and the sealed result is that no object-language endogenous demand generator was derived.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: A declared policy and object-language SEEK extension now computes fresh targets from
    source contexts and records source impose events. This is a narrowed extension, not a derivation of
    the policy from frozen observations or a refinement of Alpha search/licensing. Requests do not satisfy
    demands; unbounded continuation remains open.
  source_refs:
  - dag/derivations/02_genesis/tfq_0504_endogenous_demand_ob1.md
  - atlas/papers/finite_obstruction_calculus/genesis/docs/sources/genesis_source.txt:531-537
