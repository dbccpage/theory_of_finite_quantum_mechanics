target:
  source_statement: For a fixed triple T of complex 6x6 matrices and a candidate U in 72 real coordinates,
    each MU residual equals tr(P_{T_a,i} P_{U,j}) - 1/6, and the real zero set of the 108 MU and 72 orthonormality
    residuals is empty iff no U has U* U = I and |<T_a,i, U_j>|^2 = 1/6 for all a, i, j.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Emptiness is not established for any MU triple or uniformly over a family; a complete
    seven-basis family would make the variety of its first three bases nonempty (family_triple_variety_nonempty).
