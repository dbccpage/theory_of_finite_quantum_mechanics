target:
  source_statement: 'On labels {0, 1, 2} the level-2 admissibility predicate (each label at most 2, the
    three triangle inequalities, even sum, and sum at most 4) accepts exactly 10 ordered triples: (0,0,0),
    (0,1,1), (0,2,2), (1,0,1), (1,1,0), (1,1,2), (1,2,1), (2,0,2), (2,1,1), (2,2,0). The witness (0,0,1)
    is excluded. The same label set has 3^6 = 729 six-tuples and 3^9 = 19683 nine-tuples. In Q(sqrt 2)
    the quantum dimensions d_0 = 1, d_1 = sqrt(2), d_2 = 1 satisfy d_1^2 - d_0 = d_2 and d_1 d_2 - d_1
    = 0. The positive rationals 3, 729 and 19683 are pairwise distinct, and 1 is a positive rational distinct
    from all three, so these finite counts do not select a unique positive rational scale. A continuum
    limit, a semiclassical limit and a physical cosmological constant stay undischarged. The exact 6j
    table, the area spectrum and the pentagon identity on all 19683 nine-tuples are not re-checked here.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The census and the two dimension identities do not discharge a continuum limit, a
    semiclassical limit, or a physical cosmological constant. No sequence of triangulations and no Einstein
    equation is constructed. Routes FRO-R-LQG-CONTINUUM-LIMIT-GAP and FRO-R-BACK-LQG-LIMIT-TO-TFQ0105
    stay GAP_NO_DERIVATION. The broader audit sentence, that no source read for this change derives a
    limit, is not discharged in full.
