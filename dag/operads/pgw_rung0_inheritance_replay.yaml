  source_statement: 'Rung zero of the second derivation (pull request 130) answers Challenge 0 at stated
    scope: the sealed challenge reports and both sealed closed baselines regenerate exactly (reading L,
    4 nodes, 3 terminal; reading F, 20 nodes, 16 terminal). The sealed grammar has six event kinds, of
    which only the supply preserves the state, and the two remaining declared inputs are named: the stake
    and the stream. Inertia is a finite computation from both readings: up to eight supplies leave the
    regime unchanged, and growth to five data under the all-free stake admits no form, raises no demand
    and leaves every state totally collapsed. The only Lean evidence cited is the sealed supply_no_op.'
