target:
  source_statement: 'anyon_model.rs wraps a ribbon category after braided validation and a dimension check.
    Its SU(2)_k constructor uses the shared Racah gauge in omega_fusion_categories::su2_level, with a
    bounded pentagon and hexagon replay. That file warns the gauge is generally not orthonormal, so the
    F matrices must not be advertised as unitary in the ordinary inner product. Labels a=0..k are twice
    a spin, which is an SU(2) level family. There is no su3_level.rs beside su2_level.rs. An SU(2)_k anyon
    model is not the three-color matrix algebra, and its quantum dimensions are not C_F or C_A. Narrowed
    in Lean 4, Rust (su2_level.rs), and an independent Python verifier to three exact finite/algebraic
    components and non-equivalence fences: (1) SU(2)_k (k = 1..6) simple-object counts k + 1, cyclotomic
    root orders 8*(k + 2), central charges 3k/(k + 2), and level-3 Fibonacci subring fusion 2 tensor 2 =
    0 oplus 2 (su2_level_rank_and_root_order_bounds, su2_level_central_charge_and_level3_fibonacci_subring);
    (2) exact Q(phi) (phi^2 = 1 + phi) verification that the level-3 q-Racah associator F^[2,2,2,2] is
    not Euclidean orthonormal (F^T F != I) while satisfying weighted metric unitarity F^T G F = G with
    G = diag(phi, 1 + phi) and det(F) = -1 (qphi_golden_ratio_identities,
    racah_level3_fibonacci_f_matrix_not_euclidean_orthonormal,
    racah_level3_fibonacci_f_matrix_weighted_metric_unitarity); and (3) non-equivalence fences separating
    SU(2)_k quantum dimensions and rank-1 self-dual labels from SU(3)_c Casimirs (C_F = 4/3, C_A = 3),
    SU(3)_k rank-2 Dynkin weights (count (k + 1)(k + 2)/2 > k + 1), and absent su3_level.rs
    (su2_level_quantum_dimensions_not_su3_casimirs_fence,
    su2_weight_lattice_rank1_not_su3_rank2_color_fusion_fence,
    su2_vs_su3_level_simple_object_count_separation, su2_level_budget_and_field_refusal_predicates,
    tfq0044_su2_level_scope_ledger_fence).'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
  declared_assumptions:
  - SU(3)_k fusion category implementation su3_level.rs (absent, left open)
