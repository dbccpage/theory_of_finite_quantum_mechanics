target:
  source_statement: 'For the pinned education SnCarrier model, SnOffImage.lean compiles the domain restriction
    of the S(6) retraction law: retractionDownMap n p = accepted q implies p = sectionLift n b and q =
    b.toPresentation for some base presentation b (accepted_only_from_section), refusal holds exactly
    off the section image (nonDescent_iff_off_image), the witness b is unique (sectionLift_injective),
    a lift at stage m ≠ n is refused by r_n (retraction_stage_strict), and image membership is a Bool
    test computed from the syntax (inImage_iff). With old_image_base this gives a left inverse on the
    image and refusal off it. The accompanying note is a proposal with AuthorityEffect None and records
    a Lean 4.34.0 build whose six axiom lines stay within propext and Quot.sound.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Pinned education SnCarrier model: BasePresentation, sectionLift and retractionDownMap in 002_oesn/lean4/SnCarrier.lean
    (assumption)'
  source_bottleneck: 'A proposal only: ledger row WDP-P001-019 is untouched and TFQ-0372 is not discharged
    by this record; the corrected cardinality theorem, OB-1, carrierCard, the wire grammar, the Python
    codec and any stage beyond the five base shapes are outside its scope, and S6Descent checks the separate
    integer example u(x) = (x,0).'
  source_refs:
