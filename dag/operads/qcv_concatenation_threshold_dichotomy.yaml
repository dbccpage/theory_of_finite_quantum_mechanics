target:
  source_statement: 'For the recurrence p(k+1) = c*p(k)^2 over Q, c*p(k) = (c*p(0))^(2^k); for c > 0 and
    p(0) >= 0: if c*p(0) < 1 then p(k) tends to zero with c*p(k) <= (c*p(0))^(k+1) and, for c*p(0) <=
    1/2, p(k) <= (1/2)^(2^k)/c; if c*p(0) = 1 then p(k) = 1/c for all k; if c*p(0) > 1 then p(k) diverges;
    so p(k) tends to zero iff p(0) < 1/c.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The recurrence is the hypothesis; no noise model is shown to obey it and no constant
    c is computed for any code.
