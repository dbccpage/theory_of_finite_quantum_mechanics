target:
  source_statement: 'Almheiri, Dong and Harlow (2015, arXiv:1411.7041) resolve the radial-commutativity
    puzzle of bulk local operators by formulating the low-energy bulk Hilbert space as a code subspace
    H_code inside the boundary CFT Hilbert space: a bulk operator phi(x) in the causal wedge (or entanglement
    wedge, Section 3.4) of a boundary subregion A can be reconstructed as an operator O_A supported on
    A that acts identically to phi(x) on H_code (Section 3.1 eq. (3.3) p. 11, equivalent to [O, E_a P
    E_b^dagger] = 0 on the erasure errors of A^c in Section 3.2 eqs. (3.10), (3.15) pp. 13-15, illustrated
    by the three-qutrit code in Section 2.2 eq. (2.4) p. 8). This node records the paper as published.'
