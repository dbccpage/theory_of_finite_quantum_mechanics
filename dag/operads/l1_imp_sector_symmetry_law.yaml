target:
  source_statement: 'Transitive sector symmetry of the quadratic readout: relabelling sectors by any permutation
    in a set whose generated group acts transitively does not change the readout. This is the second law
    under which the inner product is selected up to scale; it is supplied, not derived from primitive
    difference, and sectors with distinguished labels would break it (then the diagonal is constant only
    on orbits).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'transitive sector symmetry of the readout: assumption'
  source_bottleneck: 'No finite-theory primitive forces readout invariance under sector relabelling; H006
    supplies the permutation envelope only. Deriving the law, or recording which sector labels are distinguished,
    is item 1 of the run next steps. The campaign module CampaignL1SectorSymmetry does not weaken the
    law: it takes invariance under a permutation set S as a hypothesis and shows that a symmetric, sector-additive
    readout has a diagonal that is constant on each orbit of the group generated by S (diag_const_on_orbit),
    with diag(1,2) on two sectors and diag(1,1,2) on three sectors as countermodels to a scalar form when
    S is not transitive. Transitivity of S is still the supplied law.'
  source_refs:
  - dag/results/L1-IMP-HILBERT-INNER-PRODUCT/runs/20261021T013500Z_sector_form/README.md
  - dag/results/L1-IMP-HILBERT-INNER-PRODUCT/runs/20261021T013500Z_sector_form/review.md
