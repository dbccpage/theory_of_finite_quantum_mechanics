    rejected_by: check_candidate
  - id: semantic_edgeless_needs_a_bit
    kind: semantic_near_miss
    rationale: Claim a tag bit is needed when there is no conflict at all; zero bits suffice.
    rejected_by: check_candidate
  - id: semantic_dense_bipartite_is_not_bipartite
    kind: semantic_near_miss
    rationale: Read the dense complete bipartite graph K33 as non-2-colourable because it has many edges;
      density is not an odd cycle.
    rejected_by: check_candidate
  - id: semantic_triangle_one_bit
    kind: semantic_near_miss
    rationale: The source shows a Bool triangle cannot be 2-coloured only as a fixed instance; claiming
      one bit separates a 3-clique reads the supplied-tag theorem as if one tag always settles many conflicts.
    rejected_by: check_candidate
  - id: semantic_odd_cycle_one_bit
    kind: semantic_near_miss
    rationale: 'A 5-cycle has no triangle yet is not 2-colourable: forgetting the odd-cycle obstruction
      beyond cliques.'
    rejected_by: check_candidate
  - id: semantic_fibre_of_three_one_bit
    kind: semantic_near_miss
    rationale: A collapsed fibre of size 3 cannot be separated by one binary tag; the single-pair theorem
      does not give it.
    rejected_by: check_candidate
  - id: semantic_tag_is_unique
    kind: semantic_near_miss
    rationale: 'Treat the supplied tag as determined by the conflict: a proper tag and its complement
      are two distinct tags, so the choice is not forced.'
    rejected_by: check_candidate
  - id: semantic_components_ignored
    kind: semantic_near_miss
    rationale: 'Count proper tags as if the graph were connected: each connected component can be flipped
      independently.'
    rejected_by: check_candidate
  - id: semantic_refinement_merges_old
    kind: semantic_near_miss
    rationale: Claim a refinement can merge reports the old report distinguished; the old report is retained
      as a projection so it cannot.
    rejected_by: check_candidate
  - id: semantic_bits_equal_colours
    kind: semantic_near_miss
    rationale: Confuse the number of tag values (chi) with the number of bits (ceil log2 chi).
    rejected_by: check_candidate
  - id: semantic_isomorphism_classes_for_labelled
    kind: semantic_near_miss
    rationale: Report unlabelled graph counts for the labelled enumeration of all graphs on four vertices.
    rejected_by: check_candidate
  - id: semantic_degree_bound_as_colouring
    kind: semantic_near_miss
    rationale: Treat K4 as 2-colourable from a degree argument; a complete graph on 4 vertices needs 4
      tag values, i.e. 2 bits.
    rejected_by: check_candidate
