presentation:
  status: scoped_stage_result_reviewed
  scope: For a report q and a conflict relation C inside its collapse, SOME b-bit tag resolves all conflicts
    iff C has a proper 2^b-colouring (refine_separates_many); a GIVEN tag resolves C iff it is proper
    (resolves_iff_proper). The source refine_separates is the forward direction for one pair; refine_separates_iff
    is the one-pair equivalence on collapsed pairs.
  colours:
  - id: BitCount
    meaning: Least number of tag bits resolving C
  - id: ConflictRelation
    meaning: Relation C on the carrier whose pairs must be separated
  - id: RefinedReport
    meaning: Pair report a |-> (q a, t a)
  - id: Report
    meaning: Function q from the carrier to observations
  - id: Tag
    meaning: Supplied function t from the carrier to tag values (Bool, Fin b -> Bool, Fin k)
  - id: Verdict
    meaning: 'Boolean: tag is proper for C'
