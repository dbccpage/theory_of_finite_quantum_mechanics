target:
  source_statement: For all natural numbers a and b, if a is at least 1 and b is at least 1, then a +
    b is not 1. The pair (1, 1) sums to 2, and 2 is not 1. The empty mass 0 is not 1. In the rationals,
    1/2 + 1/2 = 1, the pair (1, 1) is not the pair (1/2, 1/2), and 1 + 1 is not 1. If a + b is positive,
    then a/(a + b) + b/(a + b) = 1. An unnormalized Boolean valuation on a general carrier, the Rust module
    contracts, and a ban on standing in for a unit-sum law stay outside this finite case.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Positive natural masses on two coordinates are separated from the unit sum, and
    dividing by a positive total returns a rational unit sum. The obligation to keep an unnormalized valuation
    from standing in for a law that sums to one, including the Rust files and an empty carrier refused
    by Fin n, remains open. AuthorityEffect: None.'
