target:
  source_statement: Unnormalized mass is a different carrier from the probability
    simplex. src/finite_valuation.rs states exact nonnegative Boolean valuations with
    no normalization requirement, and it admits an empty carrier that FinN refuses.
    src/lib.rs also declares signed_representation.rs, local_deterministic.rs, and
    marginal_compatibility.rs; those three bodies were not opened, so only the module
    declarations are in scope. The obligation is to keep an unnormalized valuation
    from standing in for a law that sums to one. H001ProbabilitySimplex.lean says
    its scaled integer grid is not the ordinary rational simplex.
