target:
  source_statement: 'Finite statement to formalize. Let H be the n-qubit space, A a set of sites, A(A)
    the matrices on A, and Omega a unit vector over Q(i). Then A(A)Omega equals H if and only if the reduced
    state of Omega on the complement of A has full rank 2^|A^c|, if and only if Omega is separating for
    A(A^c). Reason: with Schmidt rank r across A and its complement, A(A)Omega equals H_A tensor the range
    of the complementary marginal, of dimension 2^|A| r. Exact instances: a product vector is cyclic only
    for A equal to all sites; the three-qubit GHZ vector is not cyclic for any single site and is cyclic
    for every pair of sites; the three-qubit W vector is not cyclic for any single site and is cyclic
    for every pair. The finite statement is a rank condition on entanglement, in contrast to the continuum
    property, which holds for every bounded open region.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Statement and instances are exact rank computations over Q(i). A Lean proof of the
    equivalence for general n is open. The relation to the continuum theorem is an analogy: finite dimension
    has no translation group or spectrum condition.'
