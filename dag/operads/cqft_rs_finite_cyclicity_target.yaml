target:
  source_statement: 'Formalized finite statement. Let H = V_A tensor V_{A^c} be a bipartite finite space,
    A(A) the matrices on A acting as identity on A^c, and Omega a state vector with amplitude matrix M.
    Then A(A)Omega spans H if and only if the columns of M are linearly independent (full rank dim V_{A^c}
    on the complement), which implies Omega is separating for A(A^c). Exact instances over Q: a 3-qubit
    product vector is not cyclic for any single site or pair of sites; the three-qubit GHZ and W vectors
    are not cyclic for any single site and have invertible 2x2 reduced blocks for every pair of sites.
    The finite statement is a rank condition on entanglement, in contrast to the continuum property, which
    holds for every bounded open region.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Checked in Lean 4 for bipartite finite spaces and on the 3-qubit product, GHZ and
    W states. The relation to the continuum Reeh-Schlieder theorem is an analogy: finite dimension has
    no continuous translation group or spectrum condition.'
  source_refs:
