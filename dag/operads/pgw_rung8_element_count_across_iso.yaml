target:
  source_statement: Rung eight (pull request 262) takes Z-1, the element count across the sealed isomorphism.
    In Lean every inhabitant of the isomorphism keeps the numbers of data and forms with no hypothesis,
    and two clean regimes (well-formed, no list holding an entry twice) that it relates have all five
    component counts equal; six exhibited pairs show neither hypothesis can be dropped for instances,
    rules or requirements. Every event keeps cleanness and the empty and both Lean reading regimes are
    clean; from a clean base no class left is reached again, a class revisited is the very regime reached
    by unchanging events, so recurrence is only a stutter, and the counts of a history are functions of
    the class it reaches. Across two bases the class does not carry the count.
