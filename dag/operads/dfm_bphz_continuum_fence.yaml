target:
  source_statement: Algebraic cancellation of nested and overlapping UV boundary poles for actual Feynman-parametric
    integrands, and its use before continuum integration, is not established by the finite artifacts.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
