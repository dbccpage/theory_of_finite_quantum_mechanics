target:
  source_statement: 'GEN-WDP-03: with actual cases X, a declared evaluation report E: X → Reports and
    a protected admission or permission decision A: X → Decisions, a decoder on the actual image of E
    exists exactly when E(x) = E(y) implies A(x) = A(y); necessity applies the decoder to equal reports,
    sufficiency assigns each occupied report the decision of any representative, and equal reports with
    unequal decisions forbid every decoder and every report-only postprocessor. GEN-WDP-06 records that
    event multisets can lose final state, final states can lose occurrence counts, and fresh hashes can
    bind false receipts. This is the fibre criterion of the S(n)/MSS-N hand-off (TFQ-0338) and of WDP
    adapter descent (TFQ-0553), so a protected question passes from the realized report to a WDP observer
    exactly when it is constant on the fibres of the declared report.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared report map from the S(n)/MSS-N realized report image to the WDP observer presentation, with
    the protected decision on the actual cases (assumption)
  source_bottleneck: Conditional on the declared report and protected question; the criterion derives
    no evaluator, grantor or permission, and a successful evaluation alone does not determine authorization
    (GEN-WDP-04).
