target:
  source_statement: 'Atlas row MSS-8 specifies exact primal-dual ℓ¹ cochain cuts over ℚ: the primal Φ₁(c)
    = min over g of ‖c − d₀g‖_{1,ω}, the dual max ⟨c, y⟩ subject to d₀ᵀy = 0 and |y_e| ≤ ω_e, certified
    when primal and dual masses agree, and a zero-gap string without dual feasibility is refused. Row
    MSS-18 specifies the rational ℓ² Hodge split c = d_{k−1}p + h + d_k* q with d_k* = M_k⁻¹ d_kᵀ M_{k+1}
    for symmetric positive-definite rational weights, unique in its three components while the potentials
    p and q need not be. Both rows are specified with lift status unlicensed, and their evaluators ConcentricDispatcher
    and HodgeProjector are proposed labels.'
