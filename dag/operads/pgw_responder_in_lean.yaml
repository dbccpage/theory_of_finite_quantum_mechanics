target:
  source_statement: 'Narrowed boundary, status left OPEN: in one declared shadow, a demand is read only
    for the collapsed kind with the uniform-rule flag false. Of the four flag pairs, the read count is
    1. The copied mark, a form of arity 1 followed by argument list [0], and the copied link, a form of
    arity 2 followed by [0, 1], each have length 2. Item-count cost mu1 is 2 for both, so the two lists
    tie at cost 2. The pair cost mu2 is (2, 1) for the mark and (2, 2) for the link, and (2, 1) precedes
    (2, 2) because the item counts are equal and 1 < 2. Both lists lie inside the shadow bound of length
    at most 2 and new-form arity sum at most 2 with no rule item. A two-item list that contains a rule
    item lies outside that bound. One three-item list has length 3 and lies outside the length bound 2.
    This shadow does not state the sealed responder, and the node status stays OPEN.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The shadow reads one declared flag table and compares two copied lists. It does not
    state a minimum, a cost, or a tie of the sealed responder in the second derivation's packages (S-3).
    It does not refuse a regime that holds a uniform rule (S-1), and it does not read or refuse a same
    pair that is separable (S-2). The length bound 2 is not identified with the grammar (S-4). Attempt
    one's G-4 and attempt two's H-1 stay open. Status stays OPEN.
