target:
  source_statement: 'Continuation attempt two (pull request 269) takes Challenge 4 and runs every one
    of the 144 engines forward from both sealed readings to declared bounds (two items, growth below four
    data, fifteen rounds, a node guard of 250 per run): 288 runs, 25,932 nodes, 69,490 edges and 43,846
    merges, every node and edge replayed and quotiented by the implemented isomorphism. In the local Lean
    package SecondRun/Run.lean, for every history of sealed events and switch markers from any engine
    state, the element count never falls (ereplay_elems_le), a history leaving it unchanged leaves the
    regime unchanged, no further history reaches a regime once left (no_return), and on a history returning
    to its starting state every state part of the way holds the starting regime (cycle_regime_const).
    A pair collapsed with a common third datum is not separable in that regime (not_separable_through),
    the shape of all 772 refused apart demands of the runs.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Sealed kernel slice reconstructed verbatim in SecondRun/Kernel.lean from Derivation/Basic.lean and
    Derivation/Inertia.lean (assumption)
  - 'Engine event grammar: a sealed event, or a switch marker that keeps the regime and flips the mode
    (assumption)'
  source_bottleneck: 'The Lean speaks of histories, not of the Python runs: that each run edge is such
    a history is read, not proved; the responder and generators are not reconstructed in Lean, not_separable_through
    is about one regime, and the run counts hold at the declared bounds only.'
  source_refs:
  - dag/derivations/02_genesis/tfq_0475_c2_run_forward_every_history.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_genesis_19l57g1/docs/sources/continuation.txt:262
