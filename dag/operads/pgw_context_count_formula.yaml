target:
  source_statement: 'For a regime with n admitted data, a form of arity a has (n+1)^a − n^a well-formed
    contexts: each slot is a hole or one of n data, less the n^a hole-free tuples, so |Ctx(R)| = Σ_f ((n+1)^{a_f}
    − n^{a_f}), with distinct form identifiers kept disjoint even when their arities coincide. The companion
    Lean module establishes the per-form count for the recursive word enumeration (contextWords_length),
    characterizes its members as exactly the well-formed words of that length containing a hole (contextWords_mem),
    and shows the enumeration has no repetitions (contextWords_nodup). The standalone replay checks the
    formula against the frozen Python enumeration in 35 cases (n from 0 to 4, arity 1 to 7), and Python
    and Rust enumerate the contexts independently.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The Lean statement is a companion result for the slot words of one form; the sum
    over forms is the written corollary of ledger row WDP-P000-015, which attributes it to no compiled
    source theorem, and large arities make profile enumeration expensive.
  source_refs:
  - dag/derivations/02_genesis/tfq_0436_context_count_formula.md
  - atlas/papers/finite_obstruction_calculus/genesis/paper.md:258-261
  - atlas/papers/finite_obstruction_calculus/genesis/code/fixtures/historical_claim_ledger.md:26
  - atlas/papers/finite_obstruction_calculus/genesis/paper.md:603-604
  paper_refs: []
