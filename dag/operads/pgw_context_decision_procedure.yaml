target:
  source_statement: A finite Genesis context decision procedure in the existing Regime enumerates every
    admitted form with all arity-matched slot tuples containing a hole, including multiple holes and uniform
    all-tuples rule coverage. Collapse and separability are decidable; returned witnesses distinguish,
    and no witness is equivalent to collapse. Computed profiles coincide exactly for collapsed data, their
    finite image cardinality equals the cardinality of the observational quotient, holding two is equivalent
    to at least two classes, and form exhaustion is decidable. First-count existence, Y-2 history-level
    uniformity necessity and external implementation refinement remain open.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The finite context, class-count, holding-two and exhaustion clauses have local Lean
    evidence for arbitrary finite regimes in the declared slot/all-tuples-rule language. The bundled node
    remains OPEN for first-count existence, Y-2 necessity and the external Python/Rust refinement; the
    earlier unary-only mirror is not used as a full context decider.
  source_refs:
  - dag/derivations/02_genesis/tfq_0497_context_decision_procedure.md
