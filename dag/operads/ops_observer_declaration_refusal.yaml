    Bell scenario "support presheaf over the maximal-context cover {0,2}|{0,3}|{1,2}|{1,3} with arities
    2,2,2,2"); the other four components must equal the constants for the noncontextual polytope, the
    l1 norm, the terminal rule and the diagnostic layer. A supported tuple yields a receipt with authority_effect
    None, the terminal token and the typed profile. The refusal is a policy invariant by construction;
    the note does not derive it from Lemma A2.'
