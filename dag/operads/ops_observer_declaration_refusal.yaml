  source_statement: 'As the note states it for the Rust evaluator evaluate_l1_claim (Policy A2'' and the
    profile binding): before any arithmetic it refuses an undeclared, empty or whitespace component with
    UndeclaredObserverComponent(name), and a component the evaluator does not implement with UnsupportedObserverComponent
