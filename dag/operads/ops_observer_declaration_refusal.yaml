target:
  source_statement: A five-field draft on one Bell label is classified by comparing each field with a
    fixed text, and the comparison does not read a defect. The kernel text is "support presheaf over the
    maximal-context cover {0,2}|{0,3}|{1,2}|{1,3} with arities 2,2,2,2". The admissibility text is "noncontextual
    polytope conv(A)". The norm text is "L1". The terminal text is "defect = 0 -> ExactRepair; defect
    > 0 and a support-level global section exists -> ClosedResidual; defect > 0 and none exists -> OpenObstruction".
    The layer text is "WDP-CH10-D01 diagnostic". Take a draft that already carries these five texts. Replacing
    one field by a missing value, the empty string, or one space yields the undeclared class of that field.
    Replacing one field by a text other than the empty string, one space, and that field's accepted text
    yields the unsupported class of that field and keeps the declared text. The draft of the five accepted
    texts is the accepted class, and the authority text of that class is "None".
