target:
  source_statement: 'With the external continuation policy enabled, isomorphism-quotiented branch DAGs
    were exported for both readings and both measures within the declared bounds. Under mu2 there is no
    guard cutoff: the quotient tree to the requested 15 transition steps is finite and enumerated in full,
    963 nodes for L and 1847 for F, conditional on the orbit policy losing no child classes, and its leaves
    are round-cut, carrying 10 or 11 separation responses in L and 10, 11 or 12 in F. Under mu1 the 1200-node
    pre-expansion guard cuts first at depth 6 (L) and 5 (F), leaving exact exported frontiers of 927 and
    886 guard-cut nodes. Counted over accepted edges (L mu1, L mu2, F mu1, F mu2), the recurring roles
    are supply (195/111/233/413), discrimination by one new instance (1047/858/1001/1458), innovation
    by a fresh form plus instance (8/53/10/83) and double discrimination (6, F mu2 only); the auxiliary-witness
    shape never appears among accepted minima.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Declared resource bounds: at most 2 items, concrete arity at most 2, 15 transition steps, pre-expansion
    node guards 1200 (mu1) and 3000 (mu2) (assumption)'
  source_bottleneck: Reaching the requested depth is not unboundedness and no unboundedness claim is made;
    mu2 completeness is conditional on CL-TREE-MU2-COMPLETE, the mu1 trees are guard-bounded, and behaviour
    past the exported depths is unresolved.
