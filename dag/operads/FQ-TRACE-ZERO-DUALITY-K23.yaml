target:
  source_statement: For Hermitian trace-zero edge defects the polar of (1/2)||.||_1 is the observable class modulo
    scalar identity with norm lambda_max - lambda_min. On K_{2,3} with D_k = 3E_kk - I the trace-zero repair value
    is 6 (zero repair plus witnesses D_k/3) and the all-Hermitian value is 9/2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
  - Hermitian trace-zero defects on a declared graph (assumption)
  source_bottleneck: 'GAP-F001-S000-001: Lean DualWitness is a candidate mirror, not a duality certificate for
    QM_080 Theorems 5-6; the K_{2,3} certificates are exact computations in Rust/Python, no Lean theorem for them.
    Zenodo 20550459 carries a wrong centered trace-zero dual awaiting erratum.'
