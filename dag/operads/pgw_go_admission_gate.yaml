  source_statement: 'The fifteenth derivation keeps the ninth''s states and changes and adds one given
    sentence: a result is reached, whether it is admitted is not given by the reaching, and the admission
    of every result is recorded. Under the chosen reading C-A1 admission is a two-valued record kept with
    the result: reaching leaves not-admitted, and every reached result can be admitted by a record that
    is not one of the four kinds of change. The Lean statements reaching_does_not_admit and reaching_ne_admitted
    hold by definition (reaching = .notAdmitted, and the two records differ), and admission is neither
    an assertion of r or s nor a third multiplicity.'
