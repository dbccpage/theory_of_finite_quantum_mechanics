target:
  source_statement: 'Declared here as the test a residual must pass before it counts as an active obstruction:
    obstP = retainedP ∧ protectedP ∧ declaredP ∧ zeroDeclP, that is, the pair is retained in the witness
    store, carries a protected demand, an observation is declared, and the declared observation does not
    separate the pair. In the sealed passage system this is an identity of Bool-valued functions at every
    state and pair (PrimitivePassage.obstP_factors), with sufficiency obst_of_gates and necessity gates_of_obst;
    the source calls the factorization near-definitional, gives the four-way reading content through the
    four gate_*_independent theorems, and refutes joint freedom of the gates (obs_gates_not_both_false).
    zeroDeclP answers true before any observation by a declared convention that never makes anything obstructed
    (obst_requires_observation). The education module MssnObstructionDetector restates the factorization
    over supplied observation columns.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Necessity is relative to this predicate, not to any notion of obstruction, and the
    decomposition is not claimed unique; the education archive's label apnf does not match the current
    nf.derivation.apnf.yaml, which is the apartness normal form.
