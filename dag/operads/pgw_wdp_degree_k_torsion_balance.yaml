  source_statement: 'WDP-CH05-P03: on a finite oriented simplicial complex δ^{k+1}δ^k = 0 for every k,
    since each k-face of a (k+2)-simplex arises by deleting two vertices in either order with opposite
    signs; each triple (C^{k−1}, C^k, C^{k+1}) with a norm meeting the §4.8 hypothesis is then a window
    with κ^k well defined on Q^k, 0 → H^k → Q^k → im δ^k → 0 exact, and Γ_{k+1} ≤ ‖δ^k‖_{J→1}Φ_k. WDP-CH05-P06:
    the six-vertex, fifteen-edge, ten-triangle triangulation of RP² has rank_ℚ δ¹ = 10 and rank_{F₂} δ¹
    = 9, so H²(K; ℚ) = 0 while H²(K; F₂) ≅ F₂; the single-triangle indicator is exact over ℚ (Φ₂ = 0)
    with only non-integral rational repairs. WDP-CH05-P04: on every finite oriented graph Σ_v (d₀*x)(v)
    = 0, so d₀*x = ρ needs Σ_v ρ(v) = 0 (necessary, not sufficient, and with no closedness or boundary
    condition); a functional invariant under A ↦ A + d₀λ descends uniquely to Q¹, so the pairing with
    a 1-cycle is invariant; and δ²δ¹ = 0 on complexes with 3-simplices.'
