target:
  source_statement: Example E12 takes the oriented triangle a→b→c→a with C₀ = C₁ = ℤ³, coboundary d₀ and
    supplied edge record x = (1,0,0). On the open path a→b→c the potential g = (0,1,1) realizes the first
    two records but predicts −1 on ca. The circulation I(x) = x_ab + x_bc + x_ca vanishes on every d₀g
    and I(x) = 1, so no integer or rational potential realizes all three records; conversely I(x) = 0
    gives the potential (0, x_ab, x_ab + x_bc), so im d₀ = ker I and C¹/im d₀ ≅ ℤ. The combined paper
    states the same criterion over ℤ, and Cochain.lean establishes it as triangle_repair_invariant and
    triangle_repair_exact_iff.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared oriented incidence of the triangle graph adapter, not the intrinsic meaning of <ab> (assumption)
  source_bottleneck: Lean covers the criterion over ℤ; the rational case is the same written argument.
    With edge evidence fixed the result is a certificate, not a repair, changing one entry is a separately
    priced response, and the example is not a Genesis stage.
