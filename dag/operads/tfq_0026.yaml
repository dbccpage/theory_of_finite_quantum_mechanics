target:
  source_statement: 'lattice_dirac_doubling.rs declares a Euclidean Clifford family, a period N at least
    3, and a rational Wilson coefficient r. The naive operator is the symmetric difference with gamma_mu,
    and its symbol i sum gamma_mu sin k_mu vanishes at corners k in {0, pi}^d. For even N and periodic
    boundaries, naive_species_count is 2^d before spin multiplicity. The file states that these counts
    are computed on declared lattices and that no continuum limit is taken. Carrier dimension above 128
    is refused. No matching Python use case was found under 006_finite_qm/python, and FiniteQM.lean has
    no lattice Dirac theorem. Narrowed in Lean 4 and an independent Python verifier to four exact
    finite/algebraic components and non-equivalence fences: (1) Euclidean Clifford algebra generators
    gamma1, gamma2, gamma5 over Z[i] satisfying gamma_a^2 = I_2 and {gamma_a, gamma_b} = 0
    (euclidean_clifford_anticommutator_relations); (2) 1D symmetric difference zero-velocity modes at
    k in {0, pi}, even-vs-odd period periodicity on an N-cycle, and 2^d naive species count (2, 4, 8,
    16 for d = 1..4) on even-N periodic lattices
    (naive_symmetric_difference_vanishes_at_zero_and_pi_modes, even_vs_odd_period_pi_mode_periodicity,
    naive_species_count_values_1d_to_4d); (3) rational Wilson corner mass shift m + 2*r*c lifting all
    c >= 1 doubler corners for r > 0 and the MAX_CARRIER_DIMENSION = 128 admission guard
    (wilson_term_lifts_nonzero_pi_corners, wilson_critical_mass_selects_corner_shell,
    carrier_dimension_admission_guard_128); and (4) explicit chiral symmetry breaking {w I_2, gamma5}
    != 0 for w != 0 and no-continuum-limit scope fences
    (wilson_scalar_mass_breaks_gamma5_anticommutativity_fence, finite_brillouin_grid_cardinality_fence,
    tfq0026_tri_language_replay_scope_ledger_fence).'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
