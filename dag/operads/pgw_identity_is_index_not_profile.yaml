target:
  source_statement: Internal identity in the model is the datum index, never the profile (CL-IDENTITY-NOT-PROFILE).
    In reading F the first-round mu2 minimum admits one unary form with an instance marking datum 1; its
    only context is that form with one hole, so data 0 and 2 keep distinct indices with identical empty
    profiles while datum 1 is separated from both. A valid response separates the challenged pair by profiles,
    and other distinct data may stay observationally equivalent. The earlier sentence that from Challenge
    3 round 1 onward each datum's internal identity is exactly its profile is false in the model and was
    withdrawn on 2026-09-08.
