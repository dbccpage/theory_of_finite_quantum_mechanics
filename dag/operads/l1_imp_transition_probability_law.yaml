target:
  source_statement: 'Imported dynamical law: the evolution of rays preserves the Born probability of every
    transported rank-one effect in every state; conditional on this law the dynamics is a linear or conjugate-linear
    similarity. Campaign hypothesis map on Q(i)^n: a supplied linear lift with finite orthogonality calibration
    and a nonzero anchor preserves transition probabilities; fixed-frame statistics for all basis, real
    pair and imaginary pair probes in every nonzero state, together with nonvanishing, also suffice and
    fix every ray. On Q(i)^2, reversible ray dynamics can preserve norms, basis and real pair statistics,
    report-swap covariance and orthogonality while changing a transition probability from 9/10 to 1/10.
    A reversible linear subspace-lattice automorphism changes another probability from 1/2 to 1/5. The
    dynamical law remains supplied, not derived from primitive difference.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'transition-probability (Born rank-one readout) preservation by the ray dynamics: assumption'
  - 'For the conditional linear route: LinearLift, OrthogonalCalibration and NonzeroAnchor.'
  - 'For the fixed-frame route: Nonvanishing and TomographicStatistics; these force each ray to be fixed.'
  source_bottleneck: 'The sufficient packages add explicit structure: a Gaussian-rational linear lift
    plus finite zero-probability calibration, or nonvanishing plus all-state fixed-frame tomographic statistics.
    Neither package is a derivation from primitive difference or a strictly weaker replacement for the
    full law. Static Born readout, reversibility, report-swap covariance, norms, basis and real pair statistics
    and orthogonality are jointly insufficient in dimension two. Subspace order preservation without orthocomplement
    preservation is also insufficient. Arbitrary ray bijections in higher dimensions under orthogonality
    alone, affine positive-effect automorphisms and evolving measurement-frame covariance are not classified
    here.'
  source_refs:
