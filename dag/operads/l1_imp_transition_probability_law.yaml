target:
  source_statement: 'Transition-probability preservation of the ray dynamics: the evolution of rays of
    the lift preserves the Born probability of every rank-one effect in every state. Under this law the
    dynamics is a linear or conjugate-linear similarity (L1-IMP-LINEAR-ISOMETRIC-DYNAMICS); without it,
    any bijection of rays is admissible. Supplied, not derived from primitive difference.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'transition-probability (Born rank-one readout) preservation by the ray dynamics: assumption'
  source_bottleneck: No finite-theory primitive forces the ray dynamics to preserve the Born readout of
    rank-one effects; deriving it (for instance from report relabelling invariance and the Born rule on
    the lift) is item 1 of the run next steps.
