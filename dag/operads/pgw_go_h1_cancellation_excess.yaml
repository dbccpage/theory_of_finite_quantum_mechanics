target:
  source_statement: 'Climbing round H1, installed as the twenty-second derivation, replaces one sameness
    sentence of the ninth seed: two results are the same when they differ only in how their terms are
    written, or only by an xry and an xsy asserted together. Two states are then one result exactly when
    they have equally many terms and, after one rewriting, the same excess e = M_r − M_s at every ordered
    pair (gen_iff_same, same_iff_excess), and each result has one plain state up to writing, asserting
    no pair in both relations (plain_reduced). The fewest changes to a result is Φ(G) = n + Σ|e(x,y)|,
    the plain state''s size, and a shortest sequence is additions only through plain states (fewest_changes).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Chosen reading C-J1: one more xry and xsy on one pair, x = y allowed, sameness the equivalence generated
    with rewriting (assumption)'
  source_bottleneck: For the chosen reading C-J1 only (the unchosen C-J2 and C-J3 give 29 and 1081 results
    against 673 at two terms and eight rounds); here an addition can undo an addition, so the ninth's
    no-return for additions does not survive the new sameness.
  source_refs:
  - dag/derivations/02_genesis/tfq_0483_go_h1_cancellation_excess.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/001_genesis_ongoing_h3v7n5qf/paper/twentysecond/claim_ledger.md:50
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/001_genesis_ongoing_h3v7n5qf/paper/twentysecond/claim_ledger.md:53
