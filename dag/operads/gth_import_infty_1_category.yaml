target:
  source_statement: 'Assumed, and not derived: an (infinity,1)-category in the sense of a quasicategory,
    a simplicial set in which every inner horn has a filler. Joyal, Journal of Pure and Applied Algebra
    175 (2002) 207-222, isolates that inner-horn condition and its relation to Kan complexes. Boardman
    and Vogt, Lecture Notes in Mathematics 347 (1973), introduced the weak Kan complexes of which this
    is the later name. Lurie, Higher Topos Theory, arXiv:math/0608040, develops the theory. An (infinity,1)-category
    is not a finite semi-simplicial set. A finite inner-horn condition on a finite complex, were one stated,
    would be only an approximation of this assumption.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - (infinity,1)-category as a quasicategory (assumption; not finite; finite inner-horn data would be
    only an approximation)
  source_bottleneck: The assumption is an (infinity,1)-category (inner horn fillers). It is not finite,
    it is not derived, and a finite inner-horn condition is only an approximation.
