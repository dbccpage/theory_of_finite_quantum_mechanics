target:
  source_statement: For the 3-site spinless triangle, t = 1, U = 0, two fermions, beta = 2 and three Euler
    slices, the occupation-basis expansion has 27 paths, 6 negative of weight 8/27 and positive weights
    in {4/9, 1}, so no equal-weight pairing exists there; in the one-body eigenbasis H is diagonal with
    E in {-1, -1, 2} and Z = 2e^2 + e^-4.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Frustration alone does not imply disjoint weight spectra or hardness (ledger GIN-C4,
    INV-DISJOINT-SPEC); the general Lean lemma covers only the step from disjoint spectra to no weight-preserving
    sign-reversing involution.
  source_refs:
