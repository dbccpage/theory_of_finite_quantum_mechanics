target:
  source_statement: Let a finite shadow be a finite semi-simplicial set or a finite globular set as in
    GTH-SHADOW. Its set of path components, pi_0, is the quotient of the 0-cells by the equivalence relation
    generated by finite 1-zigzags. Its finite fundamental groupoid has the 0-cells as objects and, as
    morphisms, equivalence classes of finite 1-paths, the equivalence being the one generated by the 2-cells
    when 2-cells are part of the shadow. A finite n-type presentation keeps cells and face data through
    dimension n and stops there. None of these quotients or presentations is constructed, because no shadow
    is constructed from the admission gate.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: pi_0, the finite fundamental groupoid and a finite n-type presentation stay undefined
    while GTH-SHADOW has no construction.
