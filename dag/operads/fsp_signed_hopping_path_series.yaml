  source_statement: For a finite self-adjoint H with H_xx = V_x, H_xy = -a_xy (-1)^{eps_xy} (a_xy > 0,
    eps symmetric), beta >= 0 and E* >= max V_x, Z = e^{-beta E*} sum_m beta^m/m! sum over closed length-m
    configuration paths of prod K_{x_{j+1} x_j} with K = E* I - H, and each nonzero closed term has sign
    (-1)^{sum of eps along the path}.
