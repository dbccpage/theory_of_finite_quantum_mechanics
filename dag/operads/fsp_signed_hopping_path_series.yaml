  source_bottleneck: The sign of a closed term is a property of the supplied magnitudes, parities and
    representation; vertex sign gauges remove all negative entries exactly when every configuration cycle
    is even (FSP-SWITCHING-NORMAL-FORM). Trotter slicing and its error are separate.
