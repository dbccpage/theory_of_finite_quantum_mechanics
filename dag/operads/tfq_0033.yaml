target:
  source_statement: 'The antitriplet factor -2/3 is a two-index diquark channel, stored as antitriplet_diquark_casimir.
    A baryon color singlet would need a third tensor factor and an alternating contraction on three color
    indices. No such epsilon contraction is defined in the QCD control, in su_n.rs, or in the weighted
    generator list. The sextet factor +1/3 is likewise a two-quark channel. The obligation is to build
    that three-factor contraction explicitly, or to keep baryon language off this node. The diquark signs
    are a computational control of Casimir arithmetic only. Narrowed in Lean 4 and an independent Python
    verifier to three exact finite/algebraic components and non-equivalence fences: (1) two-quark SU(3)
    diquark Casimir arithmetic (-2/3 antitriplet and +1/3 sextet), 3 x 3 = 3 + 6 dimension decomposition,
    weighted trace cancellation 3*(-2/3) + 6*(1/3) = 0, half-strength rule -2/3 = (1/2)*(-4/3), and
    3-quark 27 = 1 + 8 + 8 + 10 decomposition (su3_qq_diquark_casimir_channels,
    diquark_to_qqbar_singlet_half_strength_rule, su3_three_quark_dimension_decomposition); (2) explicit
    3-index Levi-Civita tensor eps3 and alternating baryon color-singlet contraction
    baryonEpsilonContract u v w = det3Color u v w with norm 6, 2-index delta contraction, and Pauli
    color exclusion (levi_civita_3d_antisymmetry_and_six_nonzero_permutations,
    levi_civita_contracted_square_and_norm_six, three_index_epsilon_contraction_equals_det3,
    baryon_contraction_vanishes_on_identical_color_states); and (3) pairwise baryon singlet Casimir sum
    3*(-2/3) = -2 and non-equivalence fences separating 2-index diquarks (dim 3, C_2 = 4/3 != 0) from
    3-index baryon singlets (dim 1, C_2 = 0) (baryon_singlet_total_pairwise_casimir_equals_minus_two,
    two_index_diquark_not_three_index_baryon_singlet_fence, tfq0033_baryon_contraction_scope_ledger_fence).'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
