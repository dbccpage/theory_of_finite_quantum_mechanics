target:
  source_statement: Finite admission chain on three candidates. Candidate 0 has no predecessor. Candidate
    1 names candidate 0 as its predecessor. Candidate 2 names candidate 1 as its predecessor. For every
    base assignment of boolean bits, admission of candidate 0 equals the base bit at candidate 0, admission
    of candidate 1 equals the disjunction of the base bit at candidate 1 with admission of candidate 0,
    and admission of candidate 2 equals the disjunction of the base bit at candidate 2 with admission
    of candidate 1. The base assignment that is false at each candidate admits none of the three. The
    base assignment that is true at candidate 0 and false at candidate 1 and at candidate 2 admits all
    three. The Genesis theorem collapsed_of_no_insts stays imported by name and is not re-run. The chain
    says nothing about other shapes of admission.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Genesis theorem collapsed_of_no_insts: with no base instance no rule instance is admitted (assumption;
    cited by name, not re-run)'
  source_bottleneck: Cited by name, not re-run. WDP-CH14 has no node in this graph; the closest node is
    the admission gate PGW-GO-ADMISSION-GATE, and no source relates the two. The finite chain is a separate
    checked case and does not re-run collapsed_of_no_insts.
