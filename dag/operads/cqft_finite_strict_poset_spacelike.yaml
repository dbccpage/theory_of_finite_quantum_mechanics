target:
  source_statement: 'lean4/CausalOrder.lean defines FiniteStrictPoset n (an irreflexive transitive relation
    on Fin n) and spacelike separation (x differs from y and neither precedes the other). It establishes
    spacelike_symm and spacelike_irrefl; on the named examples C1 (0<1, 0<2) and C2 (the four-element
    diamond) it establishes c1_spacelike_1_2, c2_causal_0_3, order_independence_witness (C1 and its dual
    differ) and the table entries c1_mu_spacelike_vanishes and c2_mu_top_bottom (value 1). Scope: three
    decided examples, no general causal-set theory. The theorem named incomparability_not_transitive_c1
    states only that e1 and e2 are spacelike in both orders and that e1 is not spacelike to itself; it
    does not exhibit a failure of transitivity of spacelike separation. The table c2_mu is checked entry
    by entry; the Lean file does not state the Mobius recursion for it.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The theorem name incomparability_not_transitive_c1 overstates its statement. A genuine
    non-transitive example (the four-element N poset) is part of the finite net target of this stage.
