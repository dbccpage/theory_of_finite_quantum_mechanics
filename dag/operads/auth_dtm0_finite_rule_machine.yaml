target:
  source_statement: A machine is a designated halt state with an ordered finite rule list over natural-number
    states, the symbols blank and marked, and the moves left, right and stay; a step returns halted exactly
    when the state is the halt state, stuck when no rule matches, and otherwise applies the first matching
    rule; execute iterates at most the given fuel and returns halted, stuck or fuel exhausted with the
    last configuration.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - tape as a function from the integers to symbols, which includes tapes of infinite support
  - natural-number state labels without a finiteness bound
  - first-match lookup as the determinism convention
  source_bottleneck: Relate the model to Mathlib Turing.TM0 by restricting initial tapes to finite support,
    splitting write-and-move rules into two steps and merging halted with stuck, then prove step simulation;
    no universality, extensional property or reduction is established here.
  source_refs:
  - dag/derivations/29_computation/tfq_1330_auth_dtm0_finite_rule_machine.md
