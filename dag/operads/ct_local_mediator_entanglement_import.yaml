target:
  source_statement: 'Imported inference, audited against Marletto-Vedral (2017, arXiv:1707.06036, pp.
    2-3) and Bose et al. (2017, arXiv:1707.06050, pp. 1-2): if two quantum systems Q1 and Q2 start in
    a separable state, interact only locally through a mediating system M (Q1 <-> M and M <-> Q2, with
    no direct Q1-Q2 interaction, Principle I locality), and end in an entangled state of Q1 + Q2, then
    M cannot be a classical medium (in Marletto-Vedral, M must have at least two disjoint incompatible
    observables whose union is not an information variable; in Bose et al., any mediator modeled by local
    operations and classical communication cannot create entanglement). The repository has no gravity
    model; TFQ-0084 is a finite shadow only.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - locality of the mediated interaction (assumption)
  - information-theoretic definition of a classical mediator (assumption)
  source_bottleneck: 'The inference (arXiv:1707.06036 pp. 2-3; arXiv:1707.06050 pp. 1-2) remains an assumption
    of this branch. CampaignCtMediatorEntanglement.lean states only a finite shadow: a single linear local
    map A (x) B applied to one pure bipartite state does not raise the rank of its coefficient matrix
    (any finite dimension over any field), and for two qubits over Q(i) it does not carry the product
    state (1,1,1,1)/2 to (1,1,1,u)/2 with u=(3+4i)/5, whose squared concurrence is 1/5. Not stated: mixed
    states, local channels with ancillas, mixtures of branches, classical communication (LOCC), a mediating
    system M, the definition of a classical medium, or any gravity model.'
  source_refs:
  - dag/derivations/30_constructor_theory/tfq_2013_ct_local_mediator_entanglement_import.md
  - dag/derivations/independent/ct-local-mediator-entanglement-import.md
