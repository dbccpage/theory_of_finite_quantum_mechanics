      scope: The real power equation (3/5)^p+(4/5)^p=1 iff p=2 is kernel checked. Integer p=1..8 reproduce
        actual shared-ray context weights; mixed-sign p=1 supplies a retained counterexample to unrestricted
        Sorkin vanishing.
      unpaid_target: The power-law family, real exponentiation and the real orthonormal contexts are admitted;
        formal transport of the concrete context normalization to the Real.rpow equation remains a separate
        bridge. No unrestricted readout uniqueness or Gleason theorem follows.
    original_target: Within the declared positive-power family P_p(i) = |c_i|^p / sum_j |c_j|^p on two
      rational orthonormal contexts sharing a ray (psi = (1,1,0), (3,4,5) rotation), context-independence
      holds iff (3/5)^p + (4/5)^p = 1, whose unique positive solution is p = 2. Classifies the power family;
      not a Gleason theorem. Sorkin I3 does not select p (vanishes at p=1 and p=2).
    source_scope_review: 'The old even-exponent theorem 2=2^k is not the declared real (3/5,4/5) power
      equation. A new Real.rpow theorem proves that equation iff p=2 on the admitted real-power domain.
      Native integer powers use psi=(1,1,0) and bases sharing e1, with the other two basis vectors rotated
      by the exact (3,4,5) triangle. The original claim about p=1 Sorkin vanishing needs a sign restriction:
      |t| gives I3(1,1,-1)=2, while I3(1,1,1)=0. No general Gleason theorem or primitive selection is
      supplied.'
    admitted_assumptions:
    - power-law family of rules (assumption)
    - declared real orthonormal contexts (assumption)
