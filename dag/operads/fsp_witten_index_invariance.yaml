target:
  source_statement: For every natural-number energy list P, every integer weight function w with w(0)=1,
    and all zero-mode multiplicities b and f, the difference of weighted sums over b zeros followed by
    P and f zeros followed by P equals b-f. It is independent of w. A zero difference does not imply absence
    of zero modes.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - exact supercharge with H = {Q, Q^dagger} on a finite graded space (assumption)
  source_bottleneck: 'Pairing is supplied by the shared spectral list; this does not derive that pairing
    from an arbitrary supercharge, spectral decomposition on a Hilbert space, the analytic exponential
    trace, or the ground-energy theorem. The full imported Witten-index statement remains open here. Original
    target retained as an obligation: On a finite-dimensional graded Hilbert space with an exact supercharge
    Q and H = {Q, Q^dagger}, positive-energy levels pair bosons with fermions, so W = Tr[(-1)^F exp(-beta
    H)] = n_B(E=0) - n_F(E=0) for every beta, and unbroken supersymmetry has ground energy 0. Prior boundary:
    Standard result imported; it presupposes an exact lattice supercharge, which FSP-DERIV-040 leaves
    open, and gives no sign-free sampling of Z itself.'
  source_refs:
  - dag/derivations/26_fsp/tfq_1206_fsp_witten_index_invariance.md
  - papers/core/fsp/theory_of_finite_fsp.md
  - papers/core/fsp/lean4/regge_wdw_core.lean
  - dag/derivations/independent/fsp-witten-index-invariance.md
  - dag/research/campaign_fsp-witten-index-invariance_lean_replay.json
  paper_refs:
