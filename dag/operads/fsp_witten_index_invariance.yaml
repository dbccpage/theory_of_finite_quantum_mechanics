target:
  source_statement: On a finite-dimensional graded Hilbert space with an exact supercharge Q and H = {Q,
    Q^dagger}, positive-energy levels pair bosons with fermions, so W = Tr[(-1)^F exp(-beta H)] = n_B(E=0)
    - n_F(E=0) for every beta, and unbroken supersymmetry has ground energy 0.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - exact supercharge with H = {Q, Q^dagger} on a finite graded space (assumption)
  source_bottleneck: Narrowed algebraic checks only. For arbitrary finite rectangular matrix blocks over
    a commutative ring, positive-power block traces agree and the graded supertrace vanishes. The cubic
    polynomial follows. The paired-list model explicitly subtracts each weight from itself; it does not
    derive spectral pairing. B is independent of A and is not proved to be its adjoint. Zero-mode counts
    are supplied; the rectangular vector may be zero at a=b=0. There is no analytic exponential, ground-state
    existence proof, or sign-free sampler. Status is unchanged. The original physical or operational bridge
    remains open.
  source_refs:
  - dag/derivations/26_fsp/tfq_1206_fsp_witten_index_invariance.md
  - papers/core/fsp/theory_of_finite_fsp.md
