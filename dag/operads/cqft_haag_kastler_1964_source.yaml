target:
  source_statement: Haag and Kastler (1964) formulate quantum field theory through a net that assigns
    to bounded spacetime regions the algebras of observables localized there, with the standard structural
    requirements later grouped as isotony (larger regions have larger algebras), locality (algebras of
    spacelike separated regions commute) and Poincare covariance, and with states as positive functionals.
    This node records the framework; the paper's own list of postulates is not reproduced.
