target:
  source_statement: 'Claimed: in BF theory on finite cell complexes, the Postnikov class in H^3(G, A)
    governs cancellation of higher 2-group sign anomalies on knotted worldsheets; no BF model, linking
    computation or cancellation identity exists in this checkout.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Narrowed algebraic checks only. Explicit low-degree simplicial coboundaries on Fin
    5 compose to zero and preserve the displayed curvatures under exact shifts. The ZMod 2 product cocycle
    is not any displayed 2-coboundary, as detected by the explicit three-term functional. Two supplied
    integer involutions have commutator -I. Crossed-module identity formulas reduce to reflexivity and
    do not construct an arbitrary crossed module. There is no identification with Wang-Levin braiding,
    a path integral, or a unique physical cancellation mechanism. Status is unchanged. The original physical
    or operational bridge remains open.
