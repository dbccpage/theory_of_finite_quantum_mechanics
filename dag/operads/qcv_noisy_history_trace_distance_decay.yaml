target:
  source_statement: For complex matrices of any size d and the variational trace norm tn(X) = sup over
    unitaries U of |tr(UX)|, the global depolarizing channel satisfies tn(Delta_p(rho) - Delta_p(sigma))
    = (1-p)*tn(rho - sigma) for equal-trace rho, sigma and p <= 1; along any history of unitaries V(i)
    with depolarizing rates p(i) in [0,1], tn(run rho - run sigma) = (product of (1-p(i)))*tn(rho - sigma),
    which is at most (1-p)^t*tn(rho - sigma) when every p(i) >= p, and (1-p)^t <= 1/(1+p*t).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - variational trace norm equals the Schatten-1 norm (Ky Fan, cited)
  - global depolarizing noise at a declared rate after every step
  source_bottleneck: The trace norm is the variational form, whose equality with the sum of singular values
    is cited; the noise is global depolarizing with a declared rate per step, not independent per-qubit
    noise, and the statement is about histories without fresh resets.
  source_refs:
  - dag/derivations/29_computation/tfq_1322_qcv_noisy_history_trace_distance_decay.md
  - dag/research/quantum_computation_self_obstruction.md
  - dag/research/quantum_computation_self_obstruction_axioms.txt
