target:
  source_statement: qcd_beta0_wilson_confinement_control.rs, QM-221, builds eight weighted generators
    in M_3(Q(i)). The first seven are half the usual off-diagonal and Cartan patterns with weight 1, and
    T-tilde_8 is (1/2) diag(1,1,-2) with weight 1/3, avoiding a bare sqrt(3) in the matrix entries. The
    Rust report asks each generator to be Hermitian and traceless, the weighted trace pairing to equal
    (1/2) delta_ab on all 64 pairs, and the Jacobi sum to vanish on all 512 ordered triples. Python su3_weighted_generators
    repeats that arithmetic with fractions. This is a finite matrix control. It does not define a lattice
    link in SU(3).
  statement_status: source_claim_to_scope_check_not_accepted_result
