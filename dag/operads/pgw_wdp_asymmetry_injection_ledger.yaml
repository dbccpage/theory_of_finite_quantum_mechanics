target:
  source_statement: 'For any proposed selection the injection ledger records the first input that breaks
    the relevant symmetry: a named element or base point, an orientation, an order or clock, a measure
    or weighting, a boundary condition, a representation, an observer profile, a stochastic device with
    its distribution, or a physical law outside the root package. WDP-CH03-D01 defines the asymmetry-price
    frontier, relative to a specified implementation class and dependency preorder, as the family of inclusion-minimal
    declared input sets whose removal restores a symmetry that moves the output; a scalar price needs
    a stated cost function, and frontier elements may tie or be incomparable. In the declare-then-assert
    search, a refinement can leave a single class made of two responses exchanged by the swap of the data,
    so choosing one is a further declared input recorded in the ledger.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared implementation class and dependency preorder for the frontier (assumption)
  source_bottleneck: 'Definition only: no uniqueness or global-minimality theorem holds for the frontier
    in general; it rests on the nonselection row WDP-CH03-P01 (TFQ-0340), and the declare-then-assert
    separation row CH03-P03 takes no Lean credit.'
