target:
  source_statement: 'S(2) retains opaque wholes: reading L admits (<a>, <ab>) and reading F admits (<>,
    <a>, <ab>). R2L_collapsed and R2F_collapsed show that every pair of admitted data stays observationally
    collapsed before distinguishing instances are admitted, so two externally different inscriptions remain
    internally indistinguishable, and the source does not decompose <ab> into a and b. A collapsed pair
    by itself is not an active obstruction; it becomes one only when a supplied question or separation
    requirement demands different answers. The later flat grammar sn.ebnf parses <ab> as a pair of glyphs,
    which is a new interpretation with its own parser.'
