    original_target: A finite cochain window (C0,C1,C2,d0,d1) with d1 d0 = 0 has quotient Q1 = C1/im(d0).
      Phi1([x]) is the quotient seminorm (min over potentials of the weighted l1 norm of x - d0 h). Gamma2
      is the l1 norm of d1 applied to a minimizer, and R_cl = Gamma2/Phi1. Missing or ill-typed window
      data gives a typed NoRule refusal. Gamma2 here is a norm; QM_020 uses 'Gamma' for a set of residual
      sectors.
