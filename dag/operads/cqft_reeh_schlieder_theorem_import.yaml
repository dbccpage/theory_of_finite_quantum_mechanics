target:
  source_statement: 'Imported property: in a net of local algebras on Minkowski space with a translation
    action whose generators have positive spectrum (spectrum condition) and a vacuum vector, the vacuum
    is cyclic for every local algebra, and under further hypotheses separating for the algebra of a region
    with spacelike complement. The proof uses analytic continuation of translations, hence a continuous
    translation group and its generator (Stone''s theorem) on an infinite-dimensional Hilbert space. Both
    are open nodes of the repository. Narrowed in Lean 4 and an independent Python verifier to three exact
    finite/algebraic components and non-equivalence fences: (1) over any semiring R and for any dimensions
    dA, dB (even when dA < dB), if Fin dA is inhabited then CyclicForA Omega implies SeparatingForAc Omega
    via matrix associativity (X * Omega) * Y = X * (Omega * Y), so any nonzero right-kernel vector or
    identically zero column precludes cyclicity even when dA < dB; (2) discharging the open finite items
    of TFQ-2107, none of |000>, |GHZ_3>, or |W_3> is cyclic on any single site (s in {0, 1, 2}), |000> has
    neither a left inverse nor cyclicity on any pair of sites while |GHZ_3> and |W_3> are both cyclic and
    separating on every pair of sites, all three states have full complementary rank 1 and are cyclic on
    the full 3-site algebra, and across the 4-qubit 2+2 bipartition neither |0000> nor |GHZ_4> is cyclic
    whereas the 2-Bell-pair cluster state has full complementary rank 4 and is both cyclic and separating;
    and (3) on a finite N-site ring, cyclicShift N aliases with period N, translation-invariant constant
    vectors have zero discrete momentum difference, and the translation-invariant 3-qubit product vacuum
    |000> fails cyclicity on every proper subsystem.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
