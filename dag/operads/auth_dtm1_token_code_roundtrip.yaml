target:
  source_statement: For every finite-rule machine, decoding the token list that encodes it (the halt-state
    token followed by five-token frames of state, scanned tag, next state, written tag and move tag) returns
    that machine, and the all-consuming decoder returns none on the empty list, a truncated frame, an
    invalid symbol tag and an invalid move tag in the four named fixtures.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: No converse (encoding after decoding), no source-byte format, no configuration or
    input encoding and no agreement between parsed code and execution is established; the token alphabet
    is the natural numbers, so passing to the two-symbol tape alphabet needs a prefix-code argument, since
    free monoids on alphabets of different sizes are not isomorphic.
  source_refs:
  - dag/derivations/29_computation/tfq_1332_auth_dtm1_token_code_roundtrip.md
  - papers/foundations/authorization_incompleteness/authorization_incompleteness_theory_claim_ledger.md
