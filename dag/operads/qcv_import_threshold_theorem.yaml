target:
  source_statement: The integer map t sends each integer n to 2*n*n. It sends 0 to 0, 1 to 2, 2 to 8 and
    8 to 128, and three applications of t starting at 1 yield 128. The scale products 2*0 and 2*1 equal
    0 and 2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - threshold theorems for concatenated codes under their stated noise models
  source_bottleneck: The fault-tolerance threshold theorems of Shor, Aharonov and Ben-Or, Kitaev, Knill,
    Laflamme and Zurek, and Aliferis, Gottesman and Preskill stay cited under each theorem's own noise,
    locality and overhead hypotheses. This integer orbit does not state those theorems, supplies no noise
    model, and identifies no code constant. The rational concatenation recurrence and its dichotomy stay
    on the concatenation-threshold record.
  source_refs:
  - dag/derivations/29_computation/tfq_1318_qcv_import_threshold_theorem.md
  - dag/research/quantum_computation_self_obstruction.md
