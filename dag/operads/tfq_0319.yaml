target:
  source_statement: 'F000 floor.yaml admits finite sets, typed distinction steps, combinatorial coboundaries,
    and finite witness functionals, with AuthorityEffect None. Shelf F000.S000 and book EA:000.000.000
    chapter 01 pin sealed-derivation-v1 (3100c4e) as a mechanical receipt. The book README states this
    volume is not a completed Genesis-to-FOC derivation. proposed_gaps.yaml row S000-GAP-GENESIS-TO-PD,
    prior id GAP-F000-S000-001, still asks for a certified term map into the PrimitiveDifference carrier
    or the candidate Lean mirror. A green Lake build is not correspondence. Narrowed in Lean 4 to a two-mark
    carrier and a separate seven-nibble receipt. The four functions from Fin 2 to Fin 2 are stored as
    map00, map01, map10 and map11. Each has self-coboundary 0 at both marks. Their coboundaries on the
    ordered pair (0, 1) are 0, 1, 1 and 0. The receipt with nibbles 3, 1, 0, 0, 12, 4, 14 and green bit
    true stores the prefix 3100c4e named above. Pairing that one receipt with each of the four map indices
    gives four records. Those four records are pairwise distinct, and the green bit stays true on each.
    Pairing 0 and pairing 1 keep one receipt and carry edge coboundaries 0 and 1. This finite model keeps
    the receipt and the carrier unjoined: the green bit does not select the edge coboundary. The certified
    term map from sealed-derivation-v1, the absent atlas modules, and row S000-GAP-GENESIS-TO-PD stay
    open. AuthorityEffect is None.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The certified term map from sealed-derivation-v1 into the PrimitiveDifference carrier
    remains unsupplied. Four pairings of one seven-nibble receipt with map indices on a two-mark carrier
    are a finite unjoined model. S000-GAP-GENESIS-TO-PD and the absent atlas modules stay open.
  source_refs:
  - dag/derivations/03_finite_obstruction/tfq_0319_supply_a_certified_term_map_from_sealed_derivation_v1_into_the_primitivedifference_carrier_or.md
