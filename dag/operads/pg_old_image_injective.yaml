scope_notes:
- 'No operation candidate was recovered, so the declarations were mined by hand: Paper.lean line 54 (old_image_injective,
  a general theorem over arbitrary types A B E) and Paper001.lean lines 103 (E = Unit), 111, 128, 138.
  The injectivity theorem is general and non-vacuous. The three negative-boundary theorems are fixed Fin
  instances (off_image_not_implied: u constant 0 and r constant inl 0 on Fin 1 -> Fin 2; observation_not_implied:
  identity on Fin 2; repair_not_implied: the constant-true predicate on Fin 1), and repair_not_implied
  states only that a constant-true predicate stays true, so it defines no repair. This node proves the
  general forms of the first two boundaries, a converse and an exact count, keeps the repair statement
  at the weak persistence reading, and enumerates all (u, r) pairs for small finite sets to see that the
  claim could fail on them.'
- The injectivity statement is general; off-image rejection and observation preservation are shown not
