presentation:
  status: scoped_stage_result_reviewed
  scope: 'A recovery r : B -> A + Unit obeying r(u a) = inl a exists exactly when u is injective. For
    an injective lift it is determined only on the image: there are (|A|+1)^(|B|-|A|) of them, exactly
    one of which refuses every off-image point; when |A| >= 1 and |B| > |A| the others accept some off-image
    point as an old term, and for |B| = |A| or |A| = 0 the recovery is unique. The law fixes neither observations
    nor obstruction predicates (persistence through the identity lift only).'
  colours:
  - id: ImageTest
    meaning: Membership in the range of u
  - id: NewTerm
    meaning: Element of the lifted set B
  - id: OldTerm
    meaning: Element of the old set A
  - id: OldTermOrRefusal
    meaning: Element of A + E (E = Unit is the refusal)
  generators:
  - id: lift
    source_declarations:
    - 'omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_pre_genesis_to_mssn/lean4/Paper.lean::old_image_injective
      (line 54) binder u : A -> B (function-valued premise, no definition)'
    - 'omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/001_sn_mssn/lean4/Paper001.lean::old_image_injective
      (line 103) binder u : A -> B'
    ordered_inputs:
    - OldTerm
    output: NewTerm
    semantic_predicate: 'An arbitrary function u : A -> B; injectivity is a consequence of the law, not
      an assumption.'
    hypotheses:
    - 'Types A, B, E (finite only for the counting relations), a lift u : A -> B and r : B -> A + E with
      r(u a) = inl a for every a; nothing is assumed off the image of u.'
    arity: 1
    carrier: OldTerm
    coefficient_ring: Exact integers and rationals
