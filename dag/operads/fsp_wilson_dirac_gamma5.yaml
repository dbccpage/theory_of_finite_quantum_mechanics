target:
  source_statement: The Wilson-Dirac operator satisfies gamma5 D_W gamma5 = D_W^dagger, so its nonreal
    eigenvalues come in conjugate pairs and det D_W is real; for two degenerate flavors det(D_W)^2 >=
    0.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Wilson-Dirac lattice fermion operator with r = 1 (standard lattice QCD)
  source_bottleneck: A single-flavor det D_W can be negative; the JSONL claim that det D_W is nonnegative
    is only the two-flavor square. The gamma5 adjoint, reality of det D_W, and the two-flavor square for
    this operator are not Lean theorems in this checkout. Euclidean Clifford data in dimensions 2 and
    4 are checked in Lean. An exact check on one periodic 2x2 lattice, mass -1, U(1), finds det = -3.
