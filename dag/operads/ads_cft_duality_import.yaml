target:
  source_statement: 'Imported as an assumption, not as a result of this repository: a continuum quantum
    gravity theory on an asymptotically anti-de Sitter spacetime has the same generating functional and
    observables as a conformal field theory on its boundary. Narrowed to its exact finite/rational algebraic
    shadows: (1) over Q, the GKPW scalar mass-dimension quadratic gkpwMassSq(d, Delta) = Delta(Delta -
    d) = mSq satisfies the shadow involution Delta |-> d - Delta, (2 Delta - d)^2 = d^2 + 4 Delta(Delta
    - d), and the Breitenlohner-Freedman lower bound -(d^2)/4 <= Delta(Delta - d) with double root Delta
    = d/2 at saturation and no rational root strictly below -(d^2)/4; (2) in ''t Hooft double-line counting
    with lambda = g_YM^2 N and Euler characteristic chi = V - E + F = 2 - 2g, the ribbon weight satisfies
    (g_YM^2)^(E - V) N^F * N^(E - V) = lambda^(E - V) N^F, suppressing the genus-1 torus vacuum graph
    (V=2, E=3, F=1) relative to the planar dipole (V=2, E=3, F=3) by N^2; and (3) for any finite isometric
    bulk-to-boundary encoding V^T V = I_b, the pushforward iota_V(O_bulk) = V O_bulk V^T and pullback
    pi_V(O_bdry) = V^T O_bdry V satisfy pi_V(iota_V(O_bulk)) = O_bulk, iota_V(A) iota_V(C) = iota_V(A
    C), and <V psi, O_bdry(V psi)> = <psi, pi_V(O_bdry) psi>, whereas for b = 1 < B = 2 (V = [[1],[0]])
    V V^T != I_2 and the nonzero boundary operator O_perp = [[0,0],[0,1]] pulls back to 0 and has no bulk
    preimage.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - continuum quantum field theory and gravity (assumption)
  - large-N limit (assumption)
  source_bottleneck: The continuum partition-function equality Z_grav[phi_0] = Z_CFT[phi_0], the full
    AdS_5 x S^5 / N=4 SYM Hilbert space isomorphism, and the continuum inputs FQ-GAP-CONTINUUM-HILBERT-LIFT
    and TFQ-0085 remain unconstructed; at b < B a finite isometric encoding V^T V = I_b has non-surjective
    pushforward iota_V and a nontrivial boundary kernel of pi_V.
