target:
  source_statement: 'Open question: whether the exact rational Regge proxy of TFQ-0100 (squared hinge
    areas weighted by a holonomy defect, which is not the Einstein-Hilbert action) can supply the area
    term of a finite minimal-surface statement. The imported formula uses the area of a minimal surface
    in a bulk geometry; the HaPPY patch measures a bond count (one bit per bond). Matching the two needs
    a dictionary from geometry to network that no source supplies. Narrowed in Lean 4 and an independent
    Python verifier to three exact non-equivalence fences: (1) on the 20-qubit 6-pentagon HaPPY {5,4}
    patch (6 tensors, 5 internal bonds, 20 boundary legs), across all 380 proper nonempty contiguous
    boundary intervals the minimal bond cut intervalMincut takes values {1, 2, 3, 4, 5} with exact
    multiplicities (50, 90, 110, 100, 30), whereas the 4D orthogonal_pentatope simplex of TFQ-0100 has
    6 right-triangle hinges of squared area 1/4 and 4 equilateral-triangle hinges of squared area 3/4
    (240 Kuhn pentatopes on closed_s4_cube_boundary) and no single rational constant alpha maps both
    hinge classes to unit bond weight 1; (2) subdividing a planar surface of linear area A into m
    equal sub-hinges preserves the linear area sum m * (A / m) = A for all m != 0 but reduces the
    squared-area sum to m * (A / m)^2 = A^2 / m with strictly positive defect ((m - 1) / m) * A^2 > 0
    for all m > 1 and A != 0; and (3) the TFQ-0100 rational Regge proxy scales linearly with bulk
    holonomy defect kappa ((9/2) * kappa on orthogonal_pentatope, vanishing at kappa = 0 as in
    ReggePachnerWdw flat_vertex_wdw_closure), whereas intervalMincut 2 len varies across (1, 2, 3, 4, 5)
    at len in {1, 2, 3, 4, 8} (with intervalMincut 0 4 = 1) as a function of the boundary subregion on a fixed background.'
  statement_status: narrowed_non_equivalence_fences_verified_lean4
