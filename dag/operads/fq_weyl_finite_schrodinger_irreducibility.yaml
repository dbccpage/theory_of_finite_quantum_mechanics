    original_target: For odd prime dimension the clock and shift matrices have scalar commutant (clock_shift_commutant_scalar)
      and the Schrodinger representation is irreducible by full Weyl operator reconstruction; Weyl commutator
      X^a Z^b X^-a Z^-b = omega^{-ab} I over Q(zeta_d). Finite and exact; no statement for infinite dimension.
    source_scope_review: The source commutant theorem assumes distinct clock eigenvalues and diagonal
      shift equality; it does not construct a primitive root or prove a representation-classification
      theorem. This stage constructs all nine actual Weyl matrices at d=3 in Q[w]/(w²+w+1), their Hilbert-Schmidt
      Gram matrix, rational-matrix Fourier coefficients, reconstruction, and the ordered commutator. Scalar
      commutant remains the literal supplied-hypothesis kernel statement.
