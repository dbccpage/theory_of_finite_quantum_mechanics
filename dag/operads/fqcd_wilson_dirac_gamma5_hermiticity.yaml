target:
  source_statement: On a finite periodic hypercubic lattice in dimension 2 or 4 with arbitrary unitary
    link matrices U_mu(x), Hermitian Euclidean gamma matrices and gamma5 anticommuting with each gamma_mu,
    the Wilson-Dirac operator D_W = m + sum_mu [gamma_mu (nabla_mu + nabla*_mu)/2 - (r/2) nabla*_mu nabla_mu]
    with real m and r satisfies gamma5 D_W gamma5 = D_W^dagger.
