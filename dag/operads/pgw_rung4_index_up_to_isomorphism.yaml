target:
  source_statement: 'Rung four (pull request 255) takes leftover X-3, the first-demand index up to the
    sealed isomorphism. In Lean separability and honour transport across the isomorphism, a label-preserving
    isomorphism carries a demand, and under a uniform stake (one label on every distinct pair) carrying
    a demand is class-invariant and class-matched histories have one first count; renaming supply tokens
    moves no first count. Under the three index readers parity, chain and residueThree the index escapes:
    isomorphic regimes of three or four data differ in carrying a demand, and class-matched histories
    of eight and eleven events have first counts eight or eleven against none. On the rectangle (2316
    regimes in 402 classes, automorphism counts one to 240) the first count is constant on every trajectory
    class inside four events, which the Lean witnesses show is the bound''s doing.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondIso.Transport.hasDemand_iff_of_uniform at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
  - Lean declaration SecondIso.Trajectory.first_demand_matched_of_uniform at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - Lean declaration SecondIso.Countermodel.first_count_not_trajectory_invariant at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  source_bottleneck: Necessity of uniformity (Y-2) and the shortest class-matched witnesses (Y-1) are
    OPEN; the countermodel checks are proved sound with no converse, and the four-event rectangle hides
    the non-constancy that the longer Lean witnesses exhibit.
