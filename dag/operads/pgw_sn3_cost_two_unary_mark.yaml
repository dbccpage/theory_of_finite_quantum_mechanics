target:
  source_statement: 'S(3) requires the admitted opaque data <a> and <ab> to be separated, starting from
    a form-less, instance-less regime and counting each admitted item once. No response of at most one
    item separates the pair (cost1_insufficient_general), and one new unary form with one instance at
    a demanded endpoint does, so the minimum item count is 2 in both readings. Under item count the minima
    tie: at max_items 2 and max_arity 2 reading L has 6 valid deltas in 3 classes (unary mark, binary
    link, binary self-loop) and reading F has 10 in 5, and in reading L the tie class over all arities
    is countably infinite. Under the lexicographic cost mu2 = (items, new-form arity sum) the unique minimum
    up to source isomorphism is the unary mark (2,1), in reading L (mu2_unique) and reading F (mu2_unique_F).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared response grammar NewDatum, NewForm, NewInst, NewRuleAll and the costs mu1 and mu2 of the
    sealed Genesis account (assumption)
  source_bottleneck: 'The mu2 minimizer is a unary mark, not a binary edge: a binary link is one of the
    tied mu1 responses and an edge reading is an additional interpretation. S3Separation.cost_floor in
    sn_core.py is a fixture parameter, and testing that it equals 2 does not reprove minimality; the cost
    belongs to this item grammar only.'
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0514_sn3_cost_two_unary_mark.md
