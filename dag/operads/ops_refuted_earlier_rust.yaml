target:
  source_statement: 'At head 0a0502646 of the source repository the following were wrong. (N4) Scenario::section_count
    multiplied arities without a check, and the limit was compared afterwards: 64 binary singletons (2^64
    assignments) wrapped to 0 in a release build, so global_support returned an empty support and is_strongly_contextual
    returned true. (N5) ObserverDraft::declare accepted empty and whitespace strings, and the five strings
    were free text copied into the receipt: a norm "L2", a terminal "always OpenObstruction" and a layer
    "authoritative" each yielded the l1 value, ExactRepair and authority None. (N6) Proposition A2 claimed
    that no claim-to-receipt function exists, carried a layer row whose second completion was not an observer,
    and said the refusal test dropped five components when it dropped two; and verify_noncontextual_fraction
    read only lp.value from the embedded solution. (N7) delta0 checked only the number of entries, delta1
    and flatten1 ignored extraneous keys and pairs outside every triple, and the only delta1 delta0 =
    0 test ran on the Bell nerve, which has no triple. Recomputed here: 2^64 is 0 modulo 2^64.'
