target:
  source_statement: 'Assumed from Abramsky and Brandenburger (New Journal of Physics 13 (2011) 113036,
    arXiv:1102.0264), as the note cites it and does not prove it: an empirical model is no-signalling
    if and only if it has a signed global section, a function d on E(M) with values in Q, sum 1 and the
    given marginals. Instance recomputed exactly: the PR box, which is no-signalling, has a signed global
    section found by exact linear algebra, with sum 1, all 16 marginal equations satisfied and at least
    one negative entry.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
