    theorem excess_raise (G : St) (x u v : Nat) (hu : u < G.n) (hv : v < G.n) :
        excess (raise G x) u v =
          excess G u v + (if u = x then (1 : Int) else 0) - (if v = x then (1 : Int) else 0)
