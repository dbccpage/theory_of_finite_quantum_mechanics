target:
  source_statement: 'Climbing round H2, installed as the twenty-third derivation, adds raising to the
    sameness: raising a term x adds xry and ysx once for every other term y, and results differing only
    by raising terms are the same. Raising moves the excess by [u = x] − [v = x], so the generated sameness
    is equally many terms and excesses differing by a gauge g(x) − g(y) after one rewriting (excess_raise,
    gen3_iff_same3). Loops e(x,x), two-way sums e(x,y) + e(y,x) and sums around three terms are kept by
    the sameness (Same3.loop, Same3.twoWay, Same3.around), and a state is the result asserting nothing
    exactly when all of them are zero (same3_nothing_iff). Adding or removing an assertion respects the
    sameness, but adding a term does only with one term and identifying only with at most three, so the
    twenty-second''s independence of a change from the state fails (addTerm_not_respected, step_of_same3_fails).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Chosen reading C-H1: terms raised any number of times each, sameness generated by the three clauses
    (assumption)'
  - 'Chosen reading C-X: a change of a result is a change performed on one of its states (assumption)'
  source_bottleneck: The ledger keeps C-X as the chosen reading and records that the twenty-second's 22:D2
    fails here, where the education page calls this a failure of C-X; raising lives in the sameness clause,
    not in a fifth change, and closed walks longer than three terms are a research-note reading, not a
    ledger row.
  source_refs:
  - dag/derivations/02_genesis/tfq_0484_go_h2_state_raising_gauge.md
  - atlas/papers/finite_obstruction_calculus/genesis_ongoing/paper/twentythird/claim_ledger.md:52
