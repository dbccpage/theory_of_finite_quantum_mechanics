target:
  source_statement: In the set of integer pairs (a, b) with product (a, b)*(c, d) = (a*c - b*d, a*d +
    b*c + b*d) and conjugate (a + b, -b), w = (0, 1) satisfies w*w = w - (1, 0), w*w*w = (-1, 0) and the
    sixth power of w is (1, 0). On 6 by 6 matrices over those pairs, shift X has a 1 at each (j+1 mod
    6, j) and clock Z is diagonal with entry w^j. Then Z X = w X Z, while X Z and w Z X differ. For p,
    q, r, s from 0 through 5, the trace of the conjugate-transpose of X^p Z^q times X^r Z^s is (6, 0)
    when (p, q) = (r, s) and (0, 0) otherwise.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Complex exponential and its identification with the integer pair w (not constructed in this checkout)
  source_bottleneck: 'This record is the 6 by 6 integer-pair table above. It does not construct a complex
    exponential, does not identify w with exp(2 pi i / 6), and does not count mutually unbiased bases.
    The source commutation X Z = w Z X is the opposite clock convention. AuthorityEffect: None.'
