target:
  source_statement: Finite spin-foam recoupling is a shadow amplitude, not continuum gravity. src/spin_foam.rs
    computes SU(2)_2 tetrahedral recoupling at q = exp(i pi/4) with labels 0, 1, 2 in Q(sqrt(2)), and
    its fence says no continuum admission. DiscreteSpinfoamAmplitudes.lean states tetrahedral amplitudes
    in Z[zeta_12] and excludes a continuous SU(2) or SL(2, C) and a continuous Haar measure. FourSimplexSpinfoamS4.lean
    stays in Z[zeta_12] for a 10j vertex. The obligation is to keep these cyclotomic amplitudes from being
    cited as a triangulation-invariant continuum spin foam.
