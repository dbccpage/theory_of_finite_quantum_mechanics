target:
  source_statement: 'Rung three (pull request 239) takes leftover L-2, the first-demand index over an
    arbitrary run: a first count is a prefix length at which a demand stands with no shorter prefix carrying
    one. In Lean the first count is unique with no decidability hypothesis, every event preserves well-formedness,
    a successor first count never consumes a demand-inert event last, and from the empty base no count
    below two is a first count. Existence is proved only given a decision for a demand at a regime (X-1,
    OPEN). Countermodels: the first count is not a function of the reached regime (two datum admissions,
    and a supply followed by the same two, give counts two and three under the all-apart stake), and a
    demand can cease.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondIndex.Index.first_demand_unique at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
  - Lean declaration SecondIndex.Index.first_demand_exists_when_a_demand_is_decidable at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - Lean declaration SecondIndex.Countermodel.index_is_not_a_function_of_the_reached_regime at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - Declared two-sided stake of rung two track one (assumption)
  source_bottleneck: Existence of a first count waits on a decision procedure over contexts (X-1), which
    no rung built; the rectangle results (577, 3928 and 14293 sequences) stop at four events, and nothing
    here concerns a run driven by a responder (I-X PENDING).
  source_refs:
