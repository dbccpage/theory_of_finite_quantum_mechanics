target:
  source_statement: Existence witness. On the Bell scenario let e = (1/2)(delta_g1 + delta_g2) with g1
    = (a, a', b, b') = (0,0,0,0) and g2 = (1,0,0,1). Then NCF(e) = 1 and G(e) has 2 elements. Over the
    arc cover {a, a', b}, {a', b, b'}, which omits the context {a, b'}, there are 4 matching families;
    2 of them have exactly one gluing in S(M) and 2 have none. So a noncontextual model can have matching
    families without a global extension on a cover that omits a context.
