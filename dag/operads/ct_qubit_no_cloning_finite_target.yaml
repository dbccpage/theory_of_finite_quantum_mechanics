target:
  source_statement: Finite statement over Q(i), checked in Lean 4 in the following narrowed form. Take
    the qubit with the six Pauli eigenstates as rays. (a) The explicit measure-and-prepare maps cloneZ,
    cloneX and cloneY (rho to the mixture of the two basis clones with weights Tr(P rho)) send each of
    |0>,|1>; |+>,|->; |+i>,|-i> to its own clone rho tensor rho; cloneZ is shown trace-preserving. (b)
    The exact relation |0><0|+|1><1| = |+><+|+|-><-| holds in Herm(2), and the difference of the two clone
    sums has entry -1/2 on |00><11| and |11><00|, so no additive map (hence no linear map) clones all
    four of |0>,|1>,|+>,|->. (c) The exact squared overlaps of the six states are 1 (equal), 0 (antipodal)
    or 1/2 (otherwise); for a rational x in [0,1], x <= x^2 forces x in {0,1}; and an exhaustive count
    over the 64 subsets of the six states shows that exactly 10 subsets are pairwise equal-or-orthogonal
    (the empty set, 6 singletons and 3 antipodal pairs) and that the maximal such subsets are the three
    antipodal pairs. In Lean "cloneable subset" in (c) is defined as pairwise equal-or-orthogonal.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Not proved in Lean: complete positivity of cloneZ, cloneX and cloneY, and trace
    preservation of cloneX and cloneY (only cloneZ is shown trace-preserving); that completely positive
    trace-preserving maps cannot decrease fidelity (x <= x^2 is a hypothesis of the arithmetic lemma,
    not derived); and the equivalence of the semantic notion "some CPTP map clones every state of the
    subset" with "pairwise equal or orthogonal" in either direction (the Lean classification takes the
    latter as the definition of cloneable). The link to the imported definition of a superinformation
    medium is a reading of definitions.'
