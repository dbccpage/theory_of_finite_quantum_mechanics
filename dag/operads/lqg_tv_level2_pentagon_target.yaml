target:
  source_statement: Finite statement to formalize. At q = exp(i pi/4) with spin labels 0, 1/2, 1 (twice-spin
    0, 1, 2), the data of spin_foam.rs live in Q(sqrt 2) and those of H023 and H024 in Z[zeta_12]. Check
    exactly the quantum Biedenharn-Elliott (pentagon) identity and the orthogonality relation of the quantum
    6j symbols for all admissible labels. This is the algebraic content of invariance under the Pachner
    2-3 move for the Turaev-Viro sum. The repository's fence (TFQ-0105) refuses an admission of triangulation
    invariance; this target would discharge only the identity on those labels, not invariance of a state
    sum on a triangulated manifold.
