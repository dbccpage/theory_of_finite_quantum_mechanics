target:
  source_statement: 'Finite statement, checked in Lean 4 for a transcribed table. At q = exp(i pi/4) with
    spin labels 0, 1/2, 1 (twice-spin 0, 1, 2), the normalized recoupling symbol isingF(a,b,c,d,e,f) is
    entered in Lean as an explicit case table over Q(sqrt 2) (values 0, +-1, +-sqrt(2)/2, transcribed
    from ising_f in code/rust/src/general_relativity/spin_foam.rs). On that table Lean checks in exact
    arithmetic over Q(sqrt 2): the quantum dimensions (1, sqrt 2, 1) with d_1^2 - d_0 = d_2 and d_1 d_2
    - d_1 = 0 (truncation); exactly 36 nonzero entries among the 729 label 6-tuples; the orthogonality
    relation sum over f of isingF(a,b,c,d,e,f) isingF(a,b,c,d,e'',f) = delta(e,e'') for all admissible
    labels; and the pentagon identity sum over r of isingF(a,b,c,q,p,r) isingF(a,r,d,e,q,s) isingF(b,c,d,s,r,t)
    = isingF(p,c,d,e,q,t) isingF(a,b,t,e,p,s) across all 3^9 = 19,683 label assignments in {0,1,2}^9 (both
    sides zero unless the six boundary triads are admissible). The repository''s fence (TFQ-0105) refuses
    an admission of triangulation invariance; this target discharges only the identity on those labels,
    not invariance of a state sum on a triangulated manifold.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Not proved in Lean: that the transcribed table equals the quantum 6j symbol at q
    = exp(i pi/4), neither derived from the q-Racah sum nor linked to the Rust function (the module imports
    H023 and H024 but uses nothing from them); the Z[zeta_12] data of H023 and H024; the dimension-weighted
    Turaev-Viro form of the identity (the checks are on the unitary-normalized F-symbols). The step from
    the local identity to invariance on a triangulation is not part of the target.'
