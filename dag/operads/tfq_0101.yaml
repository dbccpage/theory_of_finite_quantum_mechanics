target:
  source_statement: einstein_hilbert_action.rs is an f64 face. Its fence says it is not the exact proxy,
    the sum of squared area times kappa. The stand-in follows a two-dimensional vertex sum of deficit
    with hinge volume one, and a legacy constructor may store a degree as a float. The continuum integral
    of scalar curvature against volume density is not this file. What is finite, at best, is a floating
    scalar on a named Regge value. What is not discharged is the Einstein-Hilbert action, the Einstein
    equation, and a continuum limit. Equating this float with the rational proxy is refused. A small complex
    is not quantum gravity.
