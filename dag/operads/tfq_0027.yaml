target:
  source_statement: 'wilson_species_count in the same file counts corners where the rational expression
    mass + 2*r*(number of pi components) is zero, with no trigonometric approximation. The header states
    that the Wilson term vanishes only at k=0 and anticommutes with no chirality matrix gamma_*. zero_mode_count
    is the kernel dimension s*N^d minus exact rank over Q(i) for a dense operator that must fit under
    MAX_CARRIER_DIMENSION. Even-N antiperiodic twists return zero species. IntegralRefinementC3C6.lean
    covers charge doubling on a three-cycle refined to six vertices. That file is not a stand-in for this
    lattice Dirac obstruction. Narrowed in Lean 4 and an independent Python verifier to four exact
    finite/algebraic components and non-equivalence fences: (1) exact rational wilsonSpeciesCount4D
    selecting binomial shells 1, 4, 6, 4, 1 at m = -2*r*c with zero trigonometric approximation, and
    Wilson shift 2*r*c vanishing at r > 0 iff c = 0 (wilson_species_count_shell_selection,
    wilson_term_vanishes_only_at_origin_corner); (2) non-anticommutation of any non-zero scalar Wilson
    term w * I_2 with gamma1, gamma2, and gamma5 over Z[i]
    (wilson_scalar_term_anticommutes_with_no_gamma_generator); (3) dense operator kernel dimension
    zero_mode_count = s*N^d - rank under MAX_CARRIER_DIMENSION = 128 and zero corner species for even-N
    antiperiodic twists (zero_mode_count_rank_nullity_formula,
    antiperiodic_twist_excludes_zero_and_pi_corners, even_n_periodic_vs_antiperiodic_species_contrast,
    max_carrier_dimension_128_dense_operator_fence); and (4) non-equivalence fence separating
    IntegralRefinementC3C6.lean (1D C3 -> C6 scalar Z-cochain charge refinement) from the 2^d lattice
    Dirac doubling obstruction (c3_to_c6_naive_duplication_vs_block_last_refinement,
    c3_c6_charge_refinement_not_lattice_dirac_obstruction_fence, tfq0027_scope_and_citation_fence).'
