target:
  source_statement: 'The tenth derivation records a leftover with each change in a side ledger and keeps
    the ninth''s state model; the sixteenth admits the recorded leftover back into the state. The feedback
    does not terminate: remove-then-admit is a two-change cycle at every state with an assertion, and
    a term added and identified away is one at every state with a term, while the ninth''s add-then-remove
    is not a cycle. In Lean, if Reach16 s t n holds from a well-formed state with a term then Reach16
    s t (2k + n) holds for every k (Reach16.unbounded), and ara reaches itself in 2k changes by removing
    and admitting for every k (admit_remove_unbounded), so the lengths of sequences reaching a result
    are unbounded.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Unbounded lengths of sequences reaching a result, not an unbounded set of results;
    the fewest changes to a result stays its potential (ledger D3), and nothing here is a claim about
    time or physical recurrence.
