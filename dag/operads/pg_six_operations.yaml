      they differ by one Admit.
    scope: Kernel theorems for every token (two-machine comparison); native reading records.
  - id: counter_model_overcounts
    statement: The source counter increments at every Admit; admitting the same item twice gives a set
      of size 1.
    scope: Instance (repeated_admit_does_not_grow_set).
  - id: designate_is_retain
    statement: With Designate also retaining, two admitted designations leave both retained, while six
      operations leave none retained and one designated.
    scope: Instance with items 0, 1.
