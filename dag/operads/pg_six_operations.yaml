  scope: By construction of its six state components, only Admit writes the admitted component of the
    six-operation state machine, and it changes it iff the item is new; the Reading L / Reading F pair
    has different admitted states in this machine and the same admitted state in the machine in which
    Supply also admits (a two-machine comparison for every token).
