  - id: semantic_supply_also_admits
    kind: semantic_near_miss
    rationale: 'Read delivery of a payload as adoption: supply would then write the admitted component,
      the conflation the six-operation list forbids.'
    rejected_by: check_candidate
  - id: semantic_readings_collapse_in_six_ops
    kind: semantic_near_miss
    rationale: Claim Readings L and F end in the same admitted state even when Supply and Admit are kept
      distinct; they differ by exactly one Admit.
    rejected_by: check_candidate
  - id: semantic_repeated_admit_counts_as_change
    kind: semantic_near_miss
    rationale: 'Take the source counter model (every Admit increments) for the set model: re-admitting
      an already admitted item changes nothing in the set.'
    rejected_by: check_candidate
  - id: semantic_designate_retain_conflation_admits
