    original_target: Mention, Supply, Designate, Admit, Retain, Operate are kept as six distinct operations;
      only Admit changes admitted state. Conflating them (supply with admission, designation with retention)
      is the source of the Reading L / Reading F split in Genesis.
    source_scope_review: Mined PreGenOp (line 750), applyPreGenOp (line 759) and pg_six_operations_and_primdiff_admission_gate
      (line 764) of DerivationDagQMClosure.lean (sha256 c9ad9c23 matches the pin). The first conjunct
      is a general statement but about a Nat COUNTER that every Admit increments; the second conjunct
      is a Fin 4 tautology that has nothing to do with the six operations; the theorem pg_root_coproduct_inert_diamond_and_six_operation_separation
      (line 1111) encodes Admit as Fin 6 index 3 by arithmetic and is vacuous as an operations statement.
      The paper statement (Pre-Genesis paper.md section 3, TFQ-0363) states definitional separation only,
      and the prompt names an external Genesis theorem supply_no_op (Inertia.lean, read but neither bound
      nor pinned here) as the one theorem about supply. This node replaces the counter by an admitted
      FINSET inside a six-component state, proves the frame/iff statements in general, and enumerates
      all traces natively. PG-INERT-DIAMOND is cross-referenced only.
