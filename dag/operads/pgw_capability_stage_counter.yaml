target:
  source_statement: 'Declared here as the stage index n of S(n): it counts licensed stage changes, each
    consuming one recorded challenge import (TFQ-0488), and not rounds or events. The second derivation''s
    census motivates the choice: succession of accepted rounds is NOT FORCED under EVERY and CHANGING
    because one state is reached in five rounds and in six (SD-CF-3), so a round count is not a function
    of the state, while under the CHANGING reading (an accepted round after which the regime differs)
    the count is definable from base and regime, and from the regime alone when counted from the empty
    regime. In Lean, along any history of sealed events and switch markers the element count never falls,
    and a step or history that changes the regime raises it (estep_elems_lt_of_ne, ereplay_elems_lt_of_ne).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Stage index counting licensed stage changes, a construction declared by this programme (assumption)
  source_bottleneck: 'A declared counter, not a derived invariant: no theorem makes a stage count a function
    of the state under EVERY or ADMITTING, and the education audit''s link to nf.derivation.lsnf names
    a skeletal filtration form, not a stage counter.'
