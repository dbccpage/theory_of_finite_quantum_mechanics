  source_statement: 'Imported asymptotic form, as commonly stated: for large spins, with l = j + 1/2 the
    edge lengths, V the volume of the Euclidean tetrahedron with those lengths and theta its dihedral
    angles, the 6j symbol behaves like (12 pi V)^(-1/2) cos(sum over edges of (j + 1/2) theta + pi/4)
    when the tetrahedron exists, and decays exponentially when it does not. The phase is the Regge action
    of the tetrahedron. The wording and the hypotheses are those of the sources and are not audited here.'
