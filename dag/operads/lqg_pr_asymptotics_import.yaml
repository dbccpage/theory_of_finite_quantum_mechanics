target:
  source_statement: 'Imported asymptotic form, audited against Roberts (1999, arXiv:math-ph/9812013, Theorem
    1 eq. (2) p. 22 and Section 6.1 eqs. (12)-(13) p. 61): for large spins with edge lengths l_r = j_r
    + 1/2 = (a_r + 1)/2 (where a_r = 2 j_r), when the six lengths bound a non-degenerate Euclidean tetrahedron
    of positive volume V > 0 and exterior dihedral angles theta_r, the 6j symbol behaves asymptotically
    as (12 pi V)^{-1/2} cos(sum_{r=1}^6 (j_r + 1/2) theta_r + pi/4) (equivalently sqrt(2 / (3 pi V(a)))
    cos(sum_{r=1}^6 (a_r + 1) theta_r / 2 + pi/4) where V(a) = 8 V is the volume for side lengths a_r
    = 2 j_r), and decays exponentially when the Cayley-Menger squared volume is negative (Lorentzian tetrahedron,
    Section 6.2 p. 62). The phase is the Regge action of the tetrahedron.'
