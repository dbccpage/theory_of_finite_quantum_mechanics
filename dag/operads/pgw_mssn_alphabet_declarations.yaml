target:
  source_statement: 'The MSS-N alphabet Γ38 is 26 lowercase letters, 10 digits and the two marks < and
    >; the grammar''s word production uses Σ36, the letters and digits, and raw_glyphs treats < and >
    as ordinary marks, so balanced pairing is not an axiom there. A model must declare eight things separately:
    terminal spellings, tokenization, grammar, public start, layout, identity policy, annotation decoding
    and manipulation rules. Three relations that share notation stay apart: an encoded relation E ⊆ V
    × V, a rewrite relation, and an observation map q: V → O.'
