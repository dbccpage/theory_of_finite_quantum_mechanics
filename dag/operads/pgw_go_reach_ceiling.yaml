target:
  source_statement: 'In the base genesis-ongoing seed (terms a and b, arb asserted, xrx forbidden; the
    changes are identification, removal, adding a term and adding an assertion), ledger row D9 says every
    finite legal state with at least one term, names anywhere, is a result under either beginning. The
    Lean edit path reach_by_edits reaches a legal well-formed goal that contains the start''s terms and
    keeps its names, by removing what the goal does not assert, adding the missing terms and adding the
    missing assertions, in that many changes; givenA_to_oneTerm and givenB_to_oneTerm reach the one-term
    result in two and three changes. Row N5 is the expressive ceiling that follows from D9: no statement
    about the asserting that holds in one finite legal state and fails in another follows from the seed.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
