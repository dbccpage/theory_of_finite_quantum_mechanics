target:
  source_statement: 'At Challenge 2 both <a> and <ab> are supplied and retained, so reading L admits (<a>,
    <ab>) and reading F admits (<>, <a>, <ab>). In both readings every admitted pair is observationally
    collapsed (R2L_collapsed, R2F_collapsed): two externally distinct inscriptions remain internally indistinguishable.
    The countermodel admission_without_expressive_increase admits a fresh datum, a real state change,
    while the pair stays collapsed, a counterexample to the claim that a new external inscription necessarily
    increases internal expressive power. The recorded Challenge 0-3 histories replay exactly to the Challenge
    3 regimes R2L and R2F (historyL_replays, historyF_replays).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Admission changed only the metatheoretic datum count and the replayable history;
    glyph identity, component count, order and substring structure stay internally unavailable, and the
    readings stay unselected (TFQ-0380).
