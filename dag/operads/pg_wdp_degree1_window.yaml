presentation:
  status: scoped_stage_result_reviewed
  scope: 'For modules over a field (the graph windows tensored with Q), kappa1 exists on Q1 = C1/im d0
    exactly when d1 d0 = 0 (kernel); for graph windows with positive weights the weighted-L1 cost is the
    IsPhi defect of a nonnegative definite J, so Phi1 = 0 iff the class is zero (kernel); on the 17 tabulated
    integer windows Phi1 is the weighted-L1 minimum over rational potentials with a verified primal potential
    and dual vector; each (Phi1, Gamma2) pair has exactly one class: ExactClass iff Phi1 = 0, ClosedResidual
    iff Phi1 > 0 and Gamma2 = 0, ActiveClosureFailure iff both are positive (the Lean diag theorems state
    phi != 0, equivalent for Phi1 >= 0).'
