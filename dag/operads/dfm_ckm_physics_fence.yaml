target:
  source_statement: For every rational n, (n - 1)^2 - n(n - 1)/2 = (n - 1)(n - 2)/2 and (n - 1)(n - 2)/2
    + (n - 1) = n(n - 1)/2. At n = 1, 2, 3, 4 the polynomial (n - 1)^2 has values 0, 1, 4, 9 and (n -
    1)(n - 2)/2 has values 0, 0, 1, 3; they agree at n = 1 and differ at n = 2, 3, 4. At n = 3 the three
    values are 4, 3, and 1. The quartet of four ones in Q(i) has imaginary part 0, and the quartet with
    second factor i has imaginary part 1, so the CP value 1 matches only the second. Derivation of a mixing
    matrix from Yukawa couplings, a unitarity identification of these counts, and measured CP values stay
    unproved.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Yukawa couplings and mass-basis diagonalization
  - measured CKM parameters
  source_bottleneck: Yukawa couplings, mass-basis diagonalization, a unitarity identification of the counting
    polynomials, and measured CKM values stay open. The general nonzero-label table classification uses
    supplied commutative-group rescalings; its restriction to physical unitary mixing matrices is not
    established.
  source_refs:
