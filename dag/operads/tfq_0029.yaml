target:
  source_statement: qcd_beta1(3, n_f) is recorded as 102 - (38/3)*n_f. At n_f=16 the Rust control and
    Lean qcd_beta1_and_banks_zaks_fixed_point record beta0=1/3, beta1=-302/3, and the ratio -beta0/beta1
    = 1/302. Python qcd_beta1 repeats the same rational expression. This is a ratio of two loop coefficients
    inside the finite control. It is not an infrared fixed-point statement about a continuum gauge theory,
    and the 12-decimal running enclosure in Part D is not an input to the ratio. A float approximation
    of 1/302 cannot authorize the rational identity, which is already exact over Q.
