    original_target: Rust-side axiom list for primitive difference (A1-A10) and a GenesisAdmissionKernel
      whose admit_difference admits an ordered pair under a token; also the Phi1/Gamma2/R_cl triad signature
      type. This is an implementation of the admitted floor, not a derivation of it.
    source_scope_review: 'Read primitive_axiomatics.rs (sha256 c1ae6edb matches the pin): the enum PrimitiveDifferenceAxiom
      (line 24) has ten names and no predicate; the kernel (line 38) enforces A1 and carrier membership
      and stores the token; EvaluationPreorder (line 69), the cochain tests (lines 285-350) and TriadSignature::r_cl
      (line 159) realise A3, A5 and the triad rule on fixed instances. The other bound source, DerivationDagQMClosure.lean::pg_six_operations_and_primdiff_admission_gate
      (line 764, sha256 c9ad9c23), contains `(x != y and 0 < 2) iff x.val != y.val` on Fin 4, a tautology
      that is not about the kernel or the axioms; it is vacuous for this node. The paper pin tfq_0394
      records the list as underived and says the enum and test_primitive_difference.py were not opened.
      An external copy of the Rust file (different bytes, sha256 e39ae75e) carries one-line doc glosses
      for A1-A10; they were used only as readings for A4, A6, A7, A9 and are not pinned. Result: a transcription
      of the checkable parts into decidable predicates with explicit statuses, general Lean theorems for
      the kernel and the cochain facts, and exhaustive native tables on carriers of up to three points.'
