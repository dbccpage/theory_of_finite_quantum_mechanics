presentation:
  status: scoped_stage_result_reviewed
  scope: In a small product model (carriers of at most three points, at most one triangular face, A10
    a free flag), the transcribed axioms A1, A4, A5 and A10 are jointly satisfiable and A1, A4, A10 are
    each violable alone from one point and A5 (together with A7) from three points; A3 holds because a
    reflexive-transitive closure is a preorder; A7 is A5 under the reading of A7 as d1 vanishing on im
    d0; the kernel enforces only A1 and carrier membership (the token is stored, never checked); and the
    transcribed R_cl rule refuses exactly on the exact-but-not-closed cell that d1 o d0 = 0 empties, a
    branch the source cannot reach because it rejects d1 o d0 != 0 at construction. This is evidence about
    a transcription of the list, not a derivation of it.
  colours:
  - id: EdgeCochain
    meaning: Integer function on the present directed edges
  - id: FaceCochain
    meaning: Integer function on faces
  - id: Gamma2
    meaning: Non-negative closure defect
  - id: Kernel
    meaning: Carrier set with the list of admitted (a, b, token) triples
  - id: KernelResult
    meaning: Updated kernel or the error a1 / carrier
  - id: MaybeRatio
    meaning: Rational or refusal
  - id: Name
    meaning: Carrier item name
  - id: Phi1
    meaning: Non-negative quotient L1 distance
  - id: Potential
    meaning: Integer function on vertices
  - id: Preorder
    meaning: Reflexive transitive relation
  - id: Relation
    meaning: Set of ordered pairs on the carrier
  - id: Token
    meaning: Opaque witness token (never inspected)
  - id: TriadClass
    meaning: exact / closed-not-exact / rupture / exact-not-closed
