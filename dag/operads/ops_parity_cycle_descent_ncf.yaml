target:
  source_statement: For n = 3, 4, 5 and every one of the 2^n parity-target vectors t on the n-cycle of
    binary measurements (contexts {m_i, m_(i+1 mod n)}, each distribution uniform on the two pairs with
    x_i xor x_(i+1) = t_i), let h be the exclusive or of the t_i. Then |G| is 2 if h = 0 and 0 if h =
    1; the arc cover {m_0, ..., m_(n-2)}, {m_1, ..., m_(n-1)} has exactly 2 matching families, both with
    one gluing if h = 0 and both without a gluing if h = 1; and NCF is 1 if h = 0 and 0 if h = 1. That
    is 8 + 16 + 32 = 56 cases.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Finite cases n = 3, 4, 5 only. The two clauses proved in Lean for every n are in
    node OPS-PARITY-HOLONOMY-LEAN; the arc-cover and NCF clauses for general n are not claimed.
