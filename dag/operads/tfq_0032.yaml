target:
  source_statement: 'The meson-side output of QM-221 is the pair of channel coefficients -4/3 and +1/6
    on a quark-antiquark color decomposition. The Rust fields singlet_channel_casimir and octet_channel_potential_factor
    store those rationals. There is no finite Hilbert space of spatial meson orbitals, no relative wavefunction,
    and no mass operator in qcd_beta0_wilson_confinement_control.rs. Calling the attractive sign a meson
    composite would add structure the control does not build. The obligation is a separate finite composite,
    with a declared carrier and a color contraction, before a meson label is used as more than a channel
    name. Narrowed in Lean 4 and an independent Python verifier to three exact finite/algebraic components
    and non-equivalence fences: (1) exact rational SU(N)/SU(3) quark-antiquark channel Casimir factors
    (-4/3 singlet and +1/6 octet), 3 x 3 = 1 + 8 dimension decomposition, weighted trace cancellation
    1*(-4/3) + 8*(1/6) = 0, and SU(2) vs. SU(3) channel contrast (suN_qqbar_casimir_channel_formulas,
    su3_qqbar_dimension_and_weighted_trace_sum_zero,
    singlet_attractive_vs_octet_repulsive_sign_dichotomy, su2_vs_su3_qqbar_casimir_channel_contrast);
    (2) explicit 3x3 color-trace contraction qqbarColorTrace and singlet/octet projectors singletProj,
    octetProj with idempotence, tracelessness, and orthogonality
    (color_contraction_projector_idempotence_and_orthogonality); and (3) declared finite 36 * L^d meson
    composite carrier accounting and fences showing that channel Casimir rationals do not supply a
    spatial orbital wavefunction, radial mass operator, or spin-hyperfine splitting
    (finite_meson_composite_carrier_dimension,
    meson_mass_operator_requires_spatial_kinetic_and_potential_terms_fence,
    channel_casimir_ratio_not_spatial_wavefunction_fence,
    pseudoscalar_vs_vector_hyperfine_splitting_requires_spin_operator_fence,
    tfq0032_meson_channel_scope_ledger_fence).'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
  declared_assumptions:
  - continuum bound-state Bethe-Salpeter / QCD Hamiltonian (excluded)
  source_bottleneck: Build a finite meson carrier or keep meson language at the channel-name layer.
