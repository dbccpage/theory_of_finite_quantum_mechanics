target:
  source_statement: Finite QCD here means a finite non-abelian gauge datum, a Wilson loop on a finite
    complex, a beta0-style finite control, and an explicit gap where confinement in a continuum theory
    is not identified with that control. Lattice Dirac doubling is an obstruction to record, not a nuisance
    to hide. Python, Rust, and Lean 4 must separate an exact rational certificate from a float benchmark.
    A float benchmark cannot authorize the finite statement. Continuum QCD remains an open interface on
    F002.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Carry a finite color, Wilson, and beta0 control without calling it continuum confinement.
