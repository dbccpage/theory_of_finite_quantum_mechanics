target:
  source_statement: 'For the Trotter auxiliary-field Hubbard determinants, the spin-determinant product
    d_up d_down is nonnegative under the stated pairing relations (half-filled bipartite: d_down = d_up/det
    P_up with det P_up > 0; attractive spin-balanced: equal spin determinants with a nonnegative field
    prefactor), and two exact fields, mask 15721 on the four-site ring at z=2 and mask 1281 on the triangle
    at z=1, have d_up > 0 > d_down, so the product is not nonnegative for every field.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - stated Hubbard model and protected symmetry hypotheses
  source_bottleneck: 'Not stated in Lean: (1) that the half-filled bipartite relation d_down = d_up/det
    P_up with det P_up > 0 and the attractive spin-balanced relation d_up = d_down follow from the Trotter
    transfer matrices, since the Lean theorems take the first as a hypothesis and the second as the form
    C d^2; (2) that the stored rational pairs for masks 15721 and 1281 are det(I+P_sigma) of the ring
    and triangle matrices; (3) any statement that positivity fails on all or generic fields outside the
    protections. Lean states the arithmetic consequences and the sign of two stored products. The pairing
    relations are checked exactly only on 256 ring fields and 64 triangle fields at two slices, and the
    two witnesses by checks/independent/fsp-hubbard-protected-representations.py.'
  source_refs:
  - dag/derivations/26_fsp/tfq_0408_fsp_hubbard_protected_representations.md
  - dag/derivations/independent/fsp-hubbard-protected-representations.md
  - papers/core/fsp/README.md
