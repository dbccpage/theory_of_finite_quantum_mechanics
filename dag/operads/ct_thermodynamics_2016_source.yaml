target:
  source_statement: 'Marletto (2016, v5 2017, arXiv:1608.02625) defines work media as substrates with
    at least three equally-spaced energy attributes admitting an adjacent-pair swap on two replicas (so
    work variables are information variables by Principle VII, Section 5 pp. 27-31), states the First
    Law as interoperability of work media (Law I, eq. (4) p. 32), and defines adiabatic possibility {x
    -> y} as possibility with side-effects on work variables only (Section 5.3 p. 33). Section 6 (pp.
    34-42) defines heat media, Principle IX (interoperability of heat media, p. 38), the Second Law (Law
    II, p. 39: existence of heat attributes h1, h2 with {h1 -> h2} adiabatically possible and {h2 -> h1}
    not adiabatically possible), an entropy function via the adiabatic ''is-like'' relation (pp. 39-41),
    and the Zeroth Law (Law X, p. 42), deriving Kelvin''s statement in Section 7 (pp. 42-44). This node
    records the paper''s results.'
