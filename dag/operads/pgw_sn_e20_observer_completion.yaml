target:
  source_statement: 'Example E20 works over V = ℚ³ with B = im d₀ = ker I. For linear Q: V → W with K
    = ker Q, the induced map V/B → W/Q(B) has kernel (B + K)/B ≅ K/(K ∩ B), so quotient observation is
    injective exactly when K ⊆ B. The defective observer Q_bad(x) = x₁ hides z = (0,1,0), which has Q_bad(z)
    = 0 and I(z) = 1. Adding the coordinate I(x) gives Q_complete(x) = (x₁, I(x)) with kernel {(0,t,−t)}
    ⊆ B; the hidden part K/(K ∩ B) has dimension 1 while ker Q_bad has dimension 2, so one added linear
    functional is necessary and sufficient, and the first projection recovers x₁.'
  statement_status: source_claim_to_scope_check_not_accepted_result
