target:
  source_statement: Probability is additive over orthogonal sectors and defined on projections / frames.
    This couples the l1 additivity of sectors to Hilbert-space orthogonality. Under frame additivity the
    quartic rival dies (H013FrameAdditivity), and without it two effect rules share the unit total and
    disagree (H013SameContract).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
