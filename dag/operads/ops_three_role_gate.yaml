  source_statement: 'ThreeRoleGate(scope, admitted_roots) reads a packet (claim_id, scope, proposer, evaluator,
    authorizer, observer, authority_root, policy); each role binding is (identifier, principal) and the
    observer is the five-component declaration. Run here (code/python/tests/test_three_role_gate.py, 15
    tests, 33 subtests, with a fixture of 17 cases): every fixture case yields its recorded verdict and
    reasons; every RefusalReason is reached by some fixture case; every verdict carries authority_effect
    None and GateVerdict refuses any other value; a missing field, an empty identifier, an unknown field
    or policy, a non-string value, and a missing or blank observer component are typed refusals, never
    a default; two identifiers on one principal give SHARED_PRINCIPAL, including the case (id-A/p1, id-B/p1,
    id-A/p2) that a count rule misses; a non-string mapping key at the top level, in a role binding or
    in the observer is a MALFORMED_PACKET refusal and is never coerced to a string; a self_attested_permitted
    policy gives SELF_ATTESTED, never ADMITTED_FOR_AUTHORIZATION.'
