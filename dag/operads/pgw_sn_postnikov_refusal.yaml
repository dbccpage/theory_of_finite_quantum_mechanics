target:
  source_statement: The construction index n of S(n) is distinct from Postnikov depth j. For j ≥ 0 the
    Postnikov truncations of a fixed space preserve π₀, so an empty space followed by a point cannot be
    two truncations of one space. If a topological realization ρ is supplied, its tower at fixed n is
    written P_j(ρ(S(n))) with its own hypotheses, and growth across n stays a separate construction that
    needs its own maps and preservation proofs. The combined paper lists S(n) is automatically a Postnikov
    tower among withdrawn inferences, and ledger row WDP-P001-017 withdraws automatic Postnikov structure.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - A topological realization ρ of S(n) with preservation maps, which the source does not supply (assumption)
  source_bottleneck: This refuses the identification of S(n) with a Postnikov tower; it constructs no
    realization ρ and no Postnikov tower of one, and the withdrawn WDP-P001-017 row is not reactivated.
