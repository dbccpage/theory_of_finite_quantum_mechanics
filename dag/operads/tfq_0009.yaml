target:
  source_statement: 'A finite gauge step is a cochain of group-valued or Hopf-valued data on a finite
    complex, together with holonomy around finite loops and a coboundary that plays the role of curvature.
    omega_holonomy is a zero-float discrete holonomy library and is a control, not this derivation. The
    three languages must share one finite complex, one coefficient object, and one holonomy identity.
    U(1) and a non-abelian color shadow fork after this node. Neither fork is continuum Yang-Mills theory.
    Narrowed in Lean 4 and an independent Python verifier to four exact finite/algebraic components and
    non-equivalence fences: (1) shared finite square plaquette boundary exactness (d_1 o d_2 = 0) and
    adjacent plaquette shared-edge cancellation (chain_boundary_squared_zero_on_plaquette,
    shared_edge_cancellation_two_plaquettes); (2) abelian cochain connection, coboundary curvature
    exactness (d_1 o d_0 = 0), gauge invariance, and the discrete Bianchi identity (d_2 o d_1 = 0) on
    the 6-face, 12-edge 3-cube complex (abelian_cochain_coboundary_squared_zero,
    abelian_curvature_gauge_invariant, abelian_bianchi_identity_cube); (3) non-abelian 2x2 matrix link
    holonomy conjugation H(U^g) = g0 H(U) g0^-1, Wilson loop cyclic trace gauge invariance, and the
    abelian vs. non-abelian SL(2, Z) shear commutator fork (nonabelian_holonomy_conjugation_identity,
    nonabelian_wilson_loop_trace_gauge_invariant, abelian_vs_nonabelian_fork_commutator_witness); and
    (4) the no-continuum-Yang-Mills fence separating finite N^E cochain cardinality and metric-free
    combinatorial curvature from metric-weighted Yang-Mills actions.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
