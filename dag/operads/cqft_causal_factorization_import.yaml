target:
  source_statement: 'Imported property, audited and corrected against Epstein and Glaser (1973, Section
    1.1 condition (C.A.) pp. 214-215, Section 2.1 condition (Caus. 1) eq. (9) p. 218, Section 2.2 eq.
    (30) p. 223) and Brunetti and Fredenhagen (2000, arXiv:math-ph/9903028, Section 1 eq. (2) p. 4 and
    Section 3 Condition P3 p. 15): the scattering operator satisfies V(g, h1+h2) = S(g)^{-1} S(g+h1+h2)
    = V(g, h1) V(g, h2) (and at g=0, S(g1+g2) = S(g1) S(g2)) whenever supp h1 does not intersect the causal
    past of supp h2, written supp h1 cap (supp h2 + V^-) = empty (which includes spacelike separation
    as well as causal future separation, not only supp h1 inside the causal future of supp h2). Equivalently
    at each order n, the time-ordered operator-valued distributions factorize as T(P union Q) = T(P) T(Q)
    whenever {x_i : i in P} cap ({x_j : j in Q} + V^-) = empty (eq. (30) p. 223; Condition P3 p. 15),
    and renormalization reduces to extending time-ordered products across the total diagonal. The repository
    has neither operator-valued distributions nor a continuum Minkowski causal cone. Narrowed in Lean 4
    and an independent Python verifier to three exact finite/algebraic components and non-equivalence
    fences: (1) over any group G and additive coupling carrier A, the relative Bogoliubov operator
    bogoliubovV S g h = (S g)^{-1} * S(g + h) satisfies V(g, 0) = 1, the unconditional telescoping cocycle
    law V(g, h1) * V(g + h1, h2) = V(g, h1 + h2), and the equivalence V(g, h1 + h2) = V(g, h1) * V(g, h2)
    <-> V(g + h1, h2) = V(g, h2), while on the diamond poset C2 the Epstein-Glaser separation predicate
    noInCausalPast C2 holds symmetrically for spacelike ([d1], [d2]) and one-way for future-before-past
    ([d1, d2, d3], [d0]); (2) on the 4-element N poset (0 < 2, 1 < 2, 1 < 3), all 5 linear extensions
    extN0..extN4 are connected by chains of adjacent spacelike swaps (SpacelikeSwapChain posetN) and have
    identical ordered products for every spacelike-commuting monoid assignment (discharging the finite-poset
    connectivity question of TFQ-2110), while anticommuting Pauli operators X, Z on (n0, n3) flip the
    sign between extN3 and extN4; and (3) coincident pairs (x, x) on a FiniteStrictPoset are never
    spacelike separated, the 4D Epstein-Glaser polynomial counterterm dimension binom(omega + 4, 4) equals
    (1, 5, 15, 35, 70) for omega = 0..4, and off-diagonal factorization (x != y) leaves coincident-diagonal
    contact counterterms c unconstrained.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
