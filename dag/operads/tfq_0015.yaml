target:
  source_statement: hierarchical_nonabelian_dfm_finite_map.md, QM-213, separates an artificial Borel connection
    from a substantial one on a 4-vertex punctured diamond. Artificial data U_e = h(t)h(s)^{-1} has face
    and cycle holonomy I_2, and a single-valued vertex dressing neutralizes every edge. Substantial data
    keeps the triangular face flat while the punctured cycle carries a Borel matrix with trace 5/2 and
    determinant 1, so a dressing supported on a spanning tree is required. evaluate_qm213_nonabelian_dfm_control
    and run_qm213_nonabelian_dfm_control replay that split. The structure group in the map is B_2(Q),
    not SU(3).
