target:
  source_statement: 'For a supplied irreflexive relation R, R(a,b) implies a ≠ b, since a = b would turn
    the witness into R(a,a); so the support of an asserted pair has exactly two elements, |{a,b}| = 2.
    This counts endpoints, not witnesses: single_oriented_witness_consistent builds a model with one forward
    witness and no reverse witness, so endpoints are 2 while witnesses can be 1. For the pointed two-element
    directed graph D₂ = ({0,1}, 0→1), each asserted pair (a,b) receives exactly one point-preserving map
    with f(0) = a and f(1) = b, and that map preserves the edge (D2_initial_pointed).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Irreflexivity and orientation of R as declared inputs, not consequences of <> (assumption)
  source_bottleneck: D₂ is initial only among pointed structures with an asserted pair; the combined paper
    says this does not make D₂ initial in an unspecified category of all systems. The sn-wire grammar
    accepts <a->a>, so irreflexivity is checked by verify_wir and not by parsing.
  source_refs:
  - dag/derivations/05_mssn_sn/tfq_0515_sn_endpoint_lemma.md
  - omega_engine_atlas/coda_atlas/F004_papers/001_finite_obstruction_calculus/000_pre_genesis_to_mssn/paper.md:302-307
  - omega_engine_education/documentation/002_oesn/sn.md:58-66
  - omega_engine_education/documentation/002_oesn/reading_guide.md:32-35
