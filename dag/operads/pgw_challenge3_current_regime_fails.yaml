target:
  source_statement: 'Challenge 3 requires <a> and <ab> to be internally separable in the declared sense
    of positive derivability. Instantiating R2L_collapsed and R2F_collapsed, the current regime fails
    this: no witness context exists. The quotient barrier then applies: every function out of a quotient
    by a relation is constant on related elements (quotient_barrier, quot_barrier), and on the collapse
    classes of R2L any operation takes equal values on data 0 and 1 (barrier_R2L). An operation defined
    only on the current abstraction therefore cannot recover the required distinction, and a response
    has to change the regime.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The barrier concerns operations defined on the given quotient; it puts no bound on
    what an admitted augmentation of the regime can separate, which is the subject of the cost results
    (TFQ-0381).
