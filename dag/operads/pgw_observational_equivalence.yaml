target:
  source_statement: 'Relative to the family O_n of internal observations available at stage n, x ≈ₙ y
    holds exactly when o(x) = o(y) for every o in O_n, with equality taken in each observation''s codomain.
    If O_n is empty, every pair is equivalent vacuously, so with no observations <a> ≈ₙ <ab>. This is
    regime-relative equivalence: it does not make the strings equal and does not install an equality operator
    inside the regime.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - A declared carrier of inscriptions and a declared family O_n of observations on it (assumption)
  source_bottleneck: The relation depends on the declared O_n and compares observation values in the metatheory;
    it is not literal string equality and does not say which observations a regime should have.
