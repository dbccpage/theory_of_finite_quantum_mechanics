  source_statement: 'Relative to the family O_n of internal observations available at stage n, x ≈ₙ y
    holds exactly when o(x) = o(y) for every o in O_n, with equality taken in each observation''s codomain.
    If O_n is empty, every pair is equivalent vacuously, so with no observations <a> ≈ₙ <ab>. This is
    regime-relative equivalence: it does not make the strings equal and does not install an equality operator
    inside the regime.'
