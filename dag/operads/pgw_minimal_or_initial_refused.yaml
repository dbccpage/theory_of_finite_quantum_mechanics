target:
  source_statement: 'Question 10 asks whether the final process is minimal or initial among a defined
    class of finite processes satisfying the same challenges. The sealed answer is that the claim is refused
    and tagged unresolved: no such initiality or minimality property was established. What is established
    is narrower: determinism of the artifacts across the exercised runs and platforms is a finite computation
    (byte-identical artifacts are repeated-run agreement, not an engine theorem), completeness of enumerations
    within declared bounds is a bounded theorem under its ledger conditions, and the per-stage minimality
    and uniqueness results are theorems with their stated scopes. An earlier wording, what is proved:
    determinism of the engine, was corrected on 2026-09-08.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: An explicit clock-closed observed-process class now has a proved initiality obstruction,
    including the actual source-regime supply self-loop, and a reachable/reduced finite-model minimum-state
    criterion. These supplementary results do not certify the full Alpha engine, its class membership,
    or minimum program/declaration cost; the historical refusal remains accurate.
  source_refs:
  - dag/derivations/02_genesis/tfq_0453_minimal_or_initial_refused.md
