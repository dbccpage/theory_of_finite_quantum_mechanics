  source_statement: On the fixed carrier of two halting presentations that differ only in the scanned
    cell (blank or marked), a control-only report does not determine the supplied content contract, an
    unread report does not determine it either, one read token admits two supplied semantic adapters,
    and one halt outcome admits two supplied terminal policies.
