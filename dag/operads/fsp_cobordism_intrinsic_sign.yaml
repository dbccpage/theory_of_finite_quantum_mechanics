target:
  source_statement: 'Claimed: a 4D boundary fermion theory with nontrivial invariant exp(2 pi i eta) in
    Omega_5^Spin(B Z2) has an unremovable sign problem curable only by a 5D bulk; no computation of the
    bordism group, eta invariant or sign obstruction exists in this checkout.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Narrowed algebraic checks only. The integer spectral-sign function is odd; the declared
    2x2 block has determinant m^2-s; two four-entry sign sums are 2 and -2. The exact supplied ZMod 2
    formula is a3*arf+w1*sigmaDiv16, not n1+arf*c2+n2*w2. The Ward lemma concerns two nonnegative integer
    weights under the supplied equation w0+w1=-(w0+w1); it does not derive that equation from an anomaly
    or quantify over a configuration involution. P*H*P=2*D and equality of H/D traces/determinants do
    not assert trace preservation for P*H*P. Arithmetic in ZMod 16 computes no Pin bordism group. No manifold,
    AHSS, mapping-torus Dirac construction, anomaly classification, or bulk-boundary no-go theorem is
    formalized. Status is unchanged. The original physical or operational bridge remains open.
  source_refs:
