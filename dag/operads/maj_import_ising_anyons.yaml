target:
  source_statement: The Ising model {1, sigma, psi} with sigma x sigma = 1 + psi, sigma x psi = sigma,
    psi x psi = 1 and the R, F data R = e^{-i pi/8} diag(1, i), F = (1/sqrt2)[[1,1],[1,-1]] on the four-sigma
    fusion space are imported; Ising braiding alone yields only Clifford operations, classically simulable
    by Gottesman-Knill, so magic-state inputs are required for a complete gate set.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Ising anyon fusion, F and R data (Nayak et al. 2008)
  - Clifford-only braiding and Gottesman-Knill simulability
