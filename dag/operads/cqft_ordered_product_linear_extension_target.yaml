target:
  source_statement: 'Finite statement to formalize. For a FiniteStrictPoset P and matrices A_x (x in P)
    on a common finite space, the ordered product along a linear extension (a listing of P in which x<y
    puts x before y) is the same for every linear extension whenever A_x and A_y commute for all spacelike
    pairs x,y, because any two linear extensions differ by swaps of adjacent spacelike elements. Exact
    checks: all linear extensions of the diamond C2 (two of them) and of the N poset, with Pauli matrices;
    and the sign flip when two spacelike elements carry anticommuting Pauli matrices. This is the finite
    counterpart of causal factorization. The distribution extension and the ultraviolet content of the
    Epstein-Glaser construction have no finite counterpart.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The elementary swap lemma needs a Lean proof for general n. The relation to Epstein-Glaser
    is an analogy.
