target:
  source_statement: 'Formalized finite statement. For a FiniteStrictPoset P and elements A_x (x in P)
    in a monoid, the ordered product along a linear extension (a listing of P in which x<y puts x before
    y) is preserved under any chain of adjacent spacelike swaps whenever A_x and A_y commute for all spacelike
    pairs x,y. Exact checks: all linear extensions of the diamond C2 (two of them) and of the N poset
    (five of them), connectedness of the two C2 extensions by an adjacent spacelike swap, and the sign
    flip on 2x2 Pauli matrices when two spacelike elements carry anticommuting matrices X and Z. The distribution
    extension and the ultraviolet content of the Epstein-Glaser construction have no finite counterpart.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Checked in Lean 4 for general adjacent spacelike swap chains and on the C2 and N
    posets. The relation to Epstein-Glaser causal factorization is an analogy: distribution splitting
    and renormalization have no finite counterpart here.'
  source_refs:
