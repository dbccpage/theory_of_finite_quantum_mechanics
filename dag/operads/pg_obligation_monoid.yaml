  the pin). The source Lean ObligationMonoid is a Nat triple with componentwise add; traceObligation_append
  is a correct general list-append lemma. declare_then_assert_cost_floor is the arithmetic fact that two
  counters >= 1 sum to >= 2: its hypothesis ValidFreshAssertionTrace does not order declare before assert.
