presentation:
  status: scoped_stage_result_reviewed
  scope: Obligation counters under pointwise sum are the free commutative monoid on the ids (cancellative,
    not a group); the re-declared copy of the source four-event three-counter trace is a homomorphism
    from event lists with total cost equal to length; in the abstract unbounded k-id model every successful
    generate/discharge run from the empty ledger keeps discharged within generated and a discharge succeeds
    exactly when it fits the outstanding count; Genesis events and S(n) maps being morphisms remains unproved.
  colours:
  - id: Count
    meaning: Natural number, u64 in the Rust source
  - id: EventList
    meaning: List of GenesisEvent
  - id: GenesisEvent
    meaning: One of declareTerm, assertDiff, removeDiff, identifyTerms
  - id: Ledger
    meaning: Pair (generated, discharged) of vectors
  - id: LedgerOrError
    meaning: Ledger, NeverGenerated, OverDischarge or CountOverflow
  - id: ObligationId
    meaning: Index i in Fin k
  - id: ObligationVector
    meaning: Counter vector Fin k -> Nat (multiset)
  - id: Unit
    meaning: One-point colour used for the nullary operation empty
