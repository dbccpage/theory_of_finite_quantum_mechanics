  proves the monoid facts, the free-monoid property, the declared-event trace homomorphism and the ledger
  rule, and does not prove the Genesis/S(n) morphism claim, as TFQ-0342 requires. Found: the monoid is
  cancellative and not a group (not a failure of cancellation as one might fear), the saturating alternative
  fails cancellation, the event table loses order and identifies two events.'
