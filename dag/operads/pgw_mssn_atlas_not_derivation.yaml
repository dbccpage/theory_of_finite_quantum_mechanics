    that the target was met. Coverage C(N) counts specified rows, and licensed depth D(k) is the length
    of an unbroken chain of machine-checked lift records. No licensed lift exists, so D = 0, and 100 rows
    give C(100) coverage without showing that row 0 generated row 100.'
