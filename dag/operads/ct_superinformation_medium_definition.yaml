target:
  source_statement: 'Imported definition, audited and corrected against Deutsch and Marletto (2015, arXiv:1405.5563,
    Section 6 pp. 14-18 and Section 7 p. 20): an information observable is an information variable X whose
    attributes satisfy double-complement closure x = u_x under distinguishability (Section 6, Principle
    VIII p. 16); a superinformation medium is an information medium with at least two information observables
    X and Y that contain only mutually disjoint attributes and whose union X union Y is not an information
    observable (Section 7 p. 20). Sections 8.1 and 8.3 (pp. 20-22) show under Principles III, IV, VI,
    VII, VIII and IX that X union Y is neither distinguishable nor clonable. The repository neither adopts
    this definition as a primitive nor claims that its finite carriers satisfy Principles I-IX.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - superinformation medium (assumption)
  source_bottleneck: The definition (Section 7 p. 20) is an assumption of this branch. Whether the repository's
    declared finite quantum interface meets its finite cloning shadow is the content of CT-QUBIT-NO-CLONING-FINITE-TARGET,
    which is open.
