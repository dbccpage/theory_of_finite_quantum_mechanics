target:
  source_statement: 'Formalized finite statement. For the [[5,1,3]] code, each of the ten 3-qubit subsets
    T of physical qubits supports a representative of each nontrivial logical class (the classes of XXXXX,
    ZZZZZ and YYYYY), and no 2-qubit subset supports any nontrivial logical operator. Equivalent statement
    also checked in Lean 4: all 105 nontrivial Pauli errors of weight at most 2 either anticommute with
    a stabilizer generator or belong to the stabilizer, so erasure of any two qubits is correctable. This
    is the smallest exact instance of the subregion-reconstruction picture of bulk operators.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 over the 64-element stabilizer group, all 10 triples, all 10 pairs,
    and all 105 two-qubit Pauli errors. The identification with bulk operator reconstruction in AdS/CFT
    is the imported picture of the source.
