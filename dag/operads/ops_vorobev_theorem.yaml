target:
  source_statement: 'Assumed from Vorob''ev (Theory of Probability and its Applications 7 (1962) 147-163,
    doi:10.1137/1107014), as the note states it: if the hypergraph (M, C) is GYO-acyclic (it reduces to
    nothing by removing ears and absorbed vertices, equivalently it has a join tree), then every no-signalling
    model has a global section given on a join tree T by d(g) = (product over C of e_C(g|C)) / (product
    over the edges (C, C'') of T of e_(C intersect C'')(g|C intersect C'')), with 0/0 = 0. The note gives
    an induction sketch, not a full proof. The converse (for every non-acyclic hypergraph some no-signalling
    family has no global section) is not implemented; the PR box on the 4-cycle is one instance.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Vorob''ev: a GYO-acyclic cover glues every no-signalling model by the join-tree product formula (assumption;
    cited)'
  source_bottleneck: Cited theorem with a proof sketch in the note only. Not formalised in Lean.
