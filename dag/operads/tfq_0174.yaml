target:
  source_statement: The connection Laplacian and the gauge-quotient modules extend the same discrete holonomy
    control. src/laplacian.rs defines Delta_U as D minus A_U and states a zero-float law, with GaussianRational
    and BigRational among its imports. src/lib.rs also declares gauge_fixing.rs, gauge_quotient.rs, signed_transport.rs,
    and functional_graph.rs. The obligation is to treat the Laplacian spectrum and any gauge fixing as
    exact linear algebra on the finite complex. A perturbation certificate in that file is not a licence
    to replace the exact matrix by a float diagonal.
