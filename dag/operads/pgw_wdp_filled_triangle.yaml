target:
  source_statement: 'WDP-CH04-P08: on vertices {0, 1, 2}, edges (01, 12, 02) and one 2-simplex, with d₀f
    = (f₁ − f₀, f₂ − f₁, f₂ − f₀) and d₁x = x₀₁ + x₁₂ − x₀₂, the field δ = (1, 1, 0) over ℚ with unit
    weights has d₁d₀ = 0, Φ₁ = 2 attained at f = (0, 1, 0) (residual (0, 2, 0)) and certified by the circulation
    y = (1, 1, −1), Γ₂ = |1 + 1 − 0| = 2, ‖d₁‖_{1→1} = 1 and R_cl = 1, which saturates the closure-ratio
    bound; the class is ActiveClosureFailure. Without the 2-simplex, C² = 0 and the cyclic field (1, 1,
    1) has Φ₁ = 3 (certificate y = (1, 1, 1)) and Γ₂ = 0, a ClosedResidual; filling the triangle converts
    that closed residual into closure charge without changing Φ₁. Orthogonal projection of δ onto ker
    d₁ subtracts (2/3, 2/3, −2/3) ∈ im d₁*, which meets im d₀ only in 0, so it is not a repair and Φ₁
    of the original class stays 2.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Unit weights on the declared filled triangle over Q (assumption)
  source_bottleneck: Lean filled_triangle_signature covers the filled-triangle numbers over ℚ, including
    that 1 is the least operator constant; the hollow comparison and the projection remark are prose with
    Python checks, and the certificate fixes the value Φ₁ = 2, not one repair.
