    original_target: 'Over Gaussian-integer 3x3 coordinate matrices the displayed P0, P1 are idempotent,
      Lambda1..3 are trace zero with [L1,L2]=2i L3 (cyclic), so trace zero holds while the commutator
      is nonzero: a finite local-green global-red witness. Representation choice is matrix form.'
    source_scope_review: Actual 3×3 Gaussian Pauli blocks are retained, with all cyclic commutators and
      projector squares. Scaling each lambda by r changes the factor to 2ir times the scaled third lambda.
      Zero individual traces do not mean commuting matrices. The Lean diagonal scalar identity is narrower
      than the full native matrix certificate.
