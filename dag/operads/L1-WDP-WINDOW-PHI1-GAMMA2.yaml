target:
  source_statement: A finite cochain window (C0,C1,C2,d0,d1) with d1 d0 = 0 has quotient Q1 = C1/im(d0). Phi1([x])
    is the quotient seminorm (min over potentials of the weighted l1 norm of x - d0 h). Gamma2 is the l1 norm
    of d1 applied to a minimizer, and R_cl = Gamma2/Phi1. Missing or ill-typed window data gives a typed NoRule
    refusal. Gamma2 here is a norm; QM_020 uses 'Gamma' for a set of residual sectors.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
  - 'weighted l1 norm on C1 (declared, see L1-OBSERVER-AXIOMS-H1-H5): assumption'
  source_bottleneck: The weighted l1 form of the norm is declared in the window definition, not derived from MSS-0
    or Difference. Upstream window construction is in the WDP fragment.
