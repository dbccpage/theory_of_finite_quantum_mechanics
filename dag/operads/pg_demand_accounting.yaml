presentation:
  status: scoped_stage_result_reviewed
  scope: For finite sets, |(W minus D) union B| = |W| - |D| + |B| holds when D is inside W and the births
    avoid W minus D (births may coincide with discharged elements), it fails whenever exactly one of the
    two hypotheses is violated; when both are violated it holds if and only if |D minus W| = |(W minus
    D) cap B| (exact cancellation); and it imposes no constraint on a sequence of counts.
  colours:
  - id: ActiveRegister
    meaning: Finite set W of active demands
  - id: BirthSet
    meaning: Finite set B of births
  - id: Count
    meaning: Natural number cardinality
  - id: DischargedSet
    meaning: Finite set D of discharged demands
  - id: SurvivorRegister
    meaning: W minus D
  generators:
