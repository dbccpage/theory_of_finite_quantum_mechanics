      count is s_next = s - d + b. Hypotheses (discharged subset, disjoint births) are required.
    source_scope_review: Read Paper.lean line 82 (a general List A theorem with a Bool predicate; no disjointness,
      the length identity is a filter partition), Paper001.lean line 86 (List Nat with Nodup, subset and
      disjointness; the disjointness hypothesis ranges over removeAll W D, i.e. births must avoid the
      survivors, not W or D, and only the Nodup conjunct uses it) and SnCarrier.activeObstructions (the
      displayed sequence is a table). The source proofs are general but over lists; this node proves the
      Finset-cardinality statement, characterises exactly when it holds, and enumerates all triples over
      universes up to five elements. The statement is not vacuous in the sources, but the DAG wording
      that both hypotheses are required is exact only for set cardinality and for the Nodup conjunct,
      not for the list length.
