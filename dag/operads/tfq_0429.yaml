target:
  source_statement: For Prompt 15 the full replay offered four extensions that would separate <a> from
    <ab> (declarative distinctness, conditional deletion, insertion and substitution), with no new glyphs
    and no counting, and said none was unique. Prompt 18 then defined a one-step extension as one that
    adds exactly one primitive capability, and the reply refused all four as one-step; the failure-mode
    chapter records that each needed several undeclared capabilities, such as branching, matching and
    rewriting. The refusal ties to the spine of relations that the Trial 2 failures had pulled apart,
    mention → supply → designation → admission → retention → internal operation, and the analysis that
    draws it adds that not every arrow has yet been defined. In the declared two-flag admission model
    of Paper000.lean no single act (datum, form or instance) separates from the empty state, while form
    then instance does.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Count the capabilities an extension adds against the six-operation spine, refuse
    to label it one-step when it adds more than one, and leave the undefined arrows of the spine undefined.
  source_refs:
  - dag/derivations/01_pregenesis/tfq_0429_bundled_extension_refused.md
