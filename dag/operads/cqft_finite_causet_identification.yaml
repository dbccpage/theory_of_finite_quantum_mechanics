target:
  source_statement: Reading of definitions. A causal set in the sense of the source is a locally finite
    partially ordered set; in the strict-order form its relation is irreflexive and transitive, and local
    finiteness is automatic on a finite set. This is the structure FiniteStrictPoset n of lean4/CausalOrder.lean.
    The Python class CausalSet in code/python/src/general_relativity/causal_set.py builds a poset from
    relations, takes the transitive closure and refuses cycles. The identification involves no sprinkling,
    no embedding in a Lorentzian manifold and no dynamics.
