target:
  source_statement: 'Rung two track one (pull request 136) extends the reconstructed sealed grammar by
    a declared two-sided stake: a label apart, same or free on every ordered pair of datum indices, free
    on the diagonal, declared once, with a demand a held labelled pair the regime does not honour. A demand
    comes from a declared label only, at the level of a definition: the free stake carries no demand at
    any regime and a supply changes no demand. Supply, imposition and, at a well-formed regime, form admission
    are demand-inert, and from a well-formed base every run of inert events carries exactly the base''s
    demands, so from a demand-free base no demand is first under such a run. Growth generates an apart
    demand where no instance is admitted, and a same demand only under a separability hypothesis the rung
    did not discharge.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondNoFirst.NoFirst.no_first_demand at dbccpage/19L57G1@85a83ae7c, not elaborated
    in this checkout (assumption)
  - Lean declaration SecondNoFirst.Run.no_demand_is_first_under_an_inert_run at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - Lean declaration SecondNoFirst.Propagate.growth_generates_apart_of_no_insts at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - 'Declared two-sided stake: apart, same or free on each ordered datum pair (assumption)'
  source_bottleneck: The names no_first_demand and grammar_carries_no_stake are wider than their statements,
    which are definitional assemblies with no run, first-occurrence or causal-source conclusion; the represented
    state is not bridged to the sealed regime (L-1), and a sentence giving the first demand of every run
    one source was withdrawn against a two-admission counterexample.
