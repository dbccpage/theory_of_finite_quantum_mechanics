    original_target: 'S(n) off-image refusal closing the domain-restriction half of WDP-P001-019: off-image
      points fail s(r(y)) = y and are refused by SnOffImage.nonDescent_iff_off_image.'
    source_scope_review: 'No operation candidate was recovered, so the declarations were mined by hand
      from SnOffImage.lean (sha256 746372dc..., matches the pin) and SnCarrier.lean: accepted_only_from_section
      (line 75), nonDescent_iff_off_image (line 127), sectionLift_injective (line 151), retraction_stage_strict
      (line 174), inImage_iff (line 191). They are general theorems for the pinned 36-glyph model, not
      vacuous; the compiled file reports propext and Quot.sound for several of them although its docstring
      says "stays within propext" (a minor docstring overclaim; this node re-proves them for every alphabet
      with propext only). The external prompt file named in the collection (prompts/fable_theorems_2026-10-17/05_sn_off_image_refusal.md)
      is not present in the checked-out source repository and was not read. The Rust witness verify_sn_off_image_refusal_witness
      is a fixed toy (section 2x, retraction y / 2 on {0..5}) that defines off-image as failure of the
      round trip; it does not exercise the S(n) syntax, so it gives refusal by definition. This node proves
      the non-circular statement (refusal iff no section image, using the soundness of the specific retraction),
      shows that the old-image law alone does not give refusal, and executes the pinned functions on explicit
      universes.'
    admitted_assumptions:
    - 'A section s : S -> Y and a retraction r : Y -> S + {refusal} with r(s x) = inl x (old-image law)
      and soundness (r y = inl x implies s x = y); or the pinned S(n) model with its five base shapes
      over an abstract glyph alphabet.'
    historical_source_assumptions: []
    work_unit_admitted_hypotheses:
