presentation:
  status: scoped_stage_result_reviewed
  scope: For a restatement over an arbitrary glyph alphabet of the pinned S(n) section and retraction
    (five base shapes at a given stage), the retraction refuses exactly the presentations that are not
    section images at that stage, and the restated pair is a section/retraction pair (law and soundness)
    in the abstract sense, where refusal is the failure of the round trip s(r(p)) = p; this rests on the
    soundness of the specific retraction (accepted_only_from_section), because the old-image law alone
    is satisfied by a retraction that refuses nothing.
