target:
  source_statement: finite_group.rs builds a FiniteGroup from a full multiplication table or from an associative
    operation, then checks closure, a two-sided identity, and inverses. Hand-written tables also face
    an associativity check, while from_operation inherits associativity from the operation. Character
    tables are lifted to Z[zeta_e] by Dixon reduction modulo a prime, and orthogonality is checked in
    that ring, not in floating point. Those cyclotomic values can label a declared finite gauge group.
    They do not by themselves name three color charges or a plaquette holonomy.
  statement_status: source_claim_to_scope_check_not_accepted_result
