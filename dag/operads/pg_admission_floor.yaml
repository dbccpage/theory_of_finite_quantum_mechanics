      of them for arbitrary carriers and added: cut existence iff two distinct points, the exact converse
      of identification_breaks_law, and law-from-distinctness independence on every nontrivial carrier.
      The law is supplied: the node (as the DAG bottleneck says) does not derive it from <> or Real_0
      and neither does this bundle.'
