      no cut exists on a subsingleton carrier, and identifying the endpoints breaks the law; instance-without-law
      and law-without-instance each allow a singleton. A pointed relation does not decide distinctness
      in either direction (pointed_relation_independence).
    source_scope_review: 'Read PrimitiveAdmissionFloor.lean (sha df9d149bbd06, Core Lean, no Mathlib)
      and PointedRelation.lean (sha 2d36b5427b54): the cut theorems are general and correct (apartness,
      subsingleton refusal, identification) but the instance/law singleton theorems are stated only on
      Unit, and pointed_relation_independence is over Type u with the third clause needing irreflexivity.
