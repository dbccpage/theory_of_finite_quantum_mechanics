target:
  source_statement: For an exhibited cut (two distinct endpoints under a law), the endpoints are apart,
    no cut exists on a subsingleton carrier, and identifying the endpoints breaks the law; instance-without-law
    and law-without-instance each allow a singleton. A pointed relation does not decide distinctness in
    either direction (pointed_relation_independence).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
