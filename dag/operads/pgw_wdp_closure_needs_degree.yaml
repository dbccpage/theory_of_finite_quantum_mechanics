target:
  source_statement: 'Given d₁: C¹ → C² from a finite 2-cell structure, the closure diagnostic Γ(δ) = J₂(d₁δ)
    descends to Q¹ exactly when d₁d₀ = 0 on the admissible repairs if J₂ is a norm (for a seminorm, exactly
    when im(d₁d₀) ⊆ ker J₂): necessity by comparing a repair with the zero representative, sufficiency
    by linearity. Otherwise K = d₁d₀ is itself a typed curvature or composition defect, calling Q¹ cohomology
    while K ≠ 0 is an error, and none of the window results of §§4.8–4.11 applies. WDP-CH04-D01 makes
    the d₁d₀ = 0 certificate part of the degree-1 window: automatic on the simplicial nerve route, verified
    for any hand-declared pair; degree_one_window multiplies the exact matrices and refuses a nonzero
    product with CERTIFICATE_MISMATCH.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared d₁ from a finite 2-cell structure and closure norm J₂ (assumption)
  source_bottleneck: A typing rule for the window; it does not select which d₁ to declare, and a zero
    K does not derive the window from Genesis admission (TFQ-0344).
