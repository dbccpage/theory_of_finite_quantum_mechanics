  scope: For weighted-L1 graph windows with attained minima, restricting to a sub-window whose d0, cochain
    and weights are the restrictions (weights at most the restrictions of the big weights) never raises
    Phi1, and attaching 2-cells with d1 d0 = 0 leaves Phi1 unchanged and cannot lower Gamma2; in the native
    table, deleting cells, lowering weights and changing the cochain strictly lowered Phi1 (kernel instances
    exist only for raised weights and a changed d0).
