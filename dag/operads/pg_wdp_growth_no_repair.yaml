    original_target: Restricting to a subcomplex never raises Phi1; attaching 2-simplices leaves Phi1
      unchanged while possibly raising Gamma2; growth of the complex does not repair a quotient residual
      (a decrease needs deleting cells, changing weights or a different admitted structure).
    source_scope_review: 'The source claims are PROVED_LEAN, but wdp_growth_subcomplex_monotone is the
      monotonicity of a List Nat sum under appending, and wdp_two_simplex_attachment_preserves_phi1 is
      rfl because attachTwoSimplex updates only the triangle list; neither involves the minimum over potentials
      that defines Phi1. The Rust witness uses hard-coded constants. The real content is proved here:
      restriction monotonicity of the attained weighted-L1 minimum under hypotheses the source does not
      state (d0 compatibility, h restricted, weights not raised, minima attained), with kernel counterexamples
      when a hypothesis is dropped, the definitional invariance of Phi1 under attachment, the additive
      rise of the representative norm and gamma2_repair (equal to the source Gamma2 at the minimal residual
      when d1 d0 = 0). The necessity wording of the source (a decrease requires deleted cells, changed
      weights or changed values) is the contrapositive of phi_growth_not_lower for the modelled structure.
      Source external hashes match the pins (Obstruction.lean, derivation_dag_witnesses.rs, DerivationDagQMClosure.lean);
      the paper pin tfq_0346 is a CRLF-era hash.'
    admitted_assumptions:
    - Graph windows with weighted-L1 norm J (positive integer weights), integer d1 rows and cochain; restriction
      keeps a set of edges with their cochain values, weights not increased, and the 2-cells supported
      inside; attachment adds rows with d1 d0 = 0.
    historical_source_assumptions: []
    work_unit_admitted_hypotheses:
    - Graph windows with weighted-L1 norm J (positive integer weights), integer d1 rows and cochain; restriction
      keeps a set of edges with their cochain values, weights not increased, and the 2-cells supported
      inside; attachment adds rows with d1 d0 = 0.
