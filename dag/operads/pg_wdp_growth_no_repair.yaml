scope_notes:
- 'The source claims are PROVED_LEAN, but wdp_growth_subcomplex_monotone is the monotonicity of a List
  Nat sum under appending, and wdp_two_simplex_attachment_preserves_phi1 is rfl because attachTwoSimplex
  updates only the triangle list; neither involves the minimum over potentials that defines Phi1. The
  Rust witness uses hard-coded constants. The real content is proved here: restriction monotonicity of
  the attained weighted-L1 minimum under hypotheses the source does not state (d0 compatibility, h restricted,
  weights not raised, minima attained), with kernel counterexamples when a hypothesis is dropped, the
  definitional invariance of Phi1 under attachment, the additive rise of the representative norm and gamma2_repair
  (equal to the source Gamma2 at the minimal residual when d1 d0 = 0). The necessity wording of the source
  (a decrease requires deleted cells, changed weights or changed values) is the contrapositive of phi_growth_not_lower
  for the modelled structure. Source external hashes match the pins (Obstruction.lean, derivation_dag_witnesses.rs,
  DerivationDagQMClosure.lean); the paper pin tfq_0346 is a CRLF-era hash.'
- Restriction monotonicity of Phi1 holds for a weighted-L1 norm with the sub d0, cochain and weights the
  restrictions (weights not raised); the source Lean theorems prove only a List Nat sum bound and an rfl,
  and the statement fails for re-normalised weights or a norm not monotone under coordinate deletion.
