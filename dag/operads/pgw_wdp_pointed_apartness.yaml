target:
  source_statement: 'WDP-CH01-P02: for a pointed relation (X, R, a, b) on a finite carrier, R(a,b) does
    not imply a ≠ b (one-point carrier with R = {(a,a)} and b = a), a ≠ b does not imply R(a,b) (the empty
    relation on two points), and R(a,b) with R irreflexive implies a ≠ b, since a = b would give R(a,a).
    Irreflexivity is therefore a declared ingredient of the admitted package, not a consequence of relatedness,
    and a carrier hosting an irreflexive related pair has at least two elements; PrimDiff.lean states
    the same endpoint fact for an irreflexive witness. The Python census over every pointed relation on
    carriers of size 1 to 3 counts 4674 relations, 2337 with R(a,b), 196 with R(a,b) and R irreflexive,
    3104 with a ≠ b, and none with R irreflexive, R(a,b) and a = b.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared irreflexivity law on the relation R (assumption)
  source_bottleneck: Lean pointed_relation_independence_fin gives the Fin 1 and Fin 2 countermodels and
    the irreflexive implication over every type; the census stops at size 3, and neither the relation
    nor the irreflexivity law is derived from <>.
