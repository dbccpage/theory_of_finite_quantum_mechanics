target:
  source_statement: 'Finite statement over Q(i), checked in Lean 4 for (a) to (c); (d) is not proved.
    For u in Q(i) (the Lean proofs of (a) and (b) do not use |u|=1), the two-qubit vector psi_u = (1,1,1,u)/2
    has coefficient matrix M_u = [[1,1],[1,u]]/2 of determinant (u-1)/4. (a) psi_u is a product vector
    if and only if u=1. (b) The squared concurrence, defined as 4|det M|^2, equals |u-1|^2/4 for M_u;
    for u=(3+4i)/5, where |u|=1, it equals 1/5. (c) For all 2x2 matrices A and B over Q(i), det(A M B^T)
    = det(A) det(M) det(B), so det M = 0 implies det(A M B^T) = 0: local operations cannot raise a product
    vector to Schmidt rank 2; and diag(1,1,1,u) applied to the product vector (1,1,1,1)/2 gives psi_u.
    The physical inference from such entanglement to a non-classical mediator is imported, not part of
    this target.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Statement (d), an exact separating functional on the 4x4 density matrix relative
    to the product family in the form of DS-QM071, is not proved. The Lean module defines schmidtWitnessExpectation(M)
    = |det M|^2, a quadratic function of the amplitude matrix that vanishes on product vectors and is
    positive on psi_u for u != 1; that is a restatement of (a), not a linear functional on density matrices,
    and it is not shown to vanish on mixtures of product states or tied to DS-QM071. The rank inequality
    rank(A M B^T) <= rank(M) for general rank is stated only through the 2x2 determinant identity (preservation
    of det M = 0). No physical claim is attached.
  source_refs:
