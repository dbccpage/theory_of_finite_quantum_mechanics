target:
  source_statement: Finite statement to formalize over Q(i). For u in Q(i) with |u|=1, the two-qubit vector
    psi_u = (1,1,1,u)/2 has coefficient matrix M_u = [[1,1],[1,u]]/2 of determinant (u-1)/4. (a) psi_u
    is a product vector if and only if u=1. (b) The squared concurrence is 4|det M_u|^2 = |u-1|^2/4; for
    u=(3+4i)/5 it equals 1/5. (c) For all 2x2 matrices A and B over Q(i), rank(A M B^T) <= rank(M), so
    local operations cannot raise the Schmidt rank of a product vector, while diag(1,1,1,u) applied to
    the product vector (1,1,1,1)/2 gives psi_u. (d) For u != 1 an exact separating functional on the 4x4
    density matrix exists relative to the product family, in the form of DS-QM071. The physical inference
    from such entanglement to a non-classical mediator is imported, not part of this target.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Statements (a) to (c) are exact determinant and rank facts. Statement (d) needs the
    witness construction of DS-QM071 specialized to this family. No physical claim is attached.
