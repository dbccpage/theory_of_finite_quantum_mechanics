target:
  source_statement: 'Imported vocabulary, audited against Deutsch (2013, Section 1.1 eqs. (1)-(2) pp.
    2-4) and Deutsch-Marletto (2015, Section 2 pp. 6-8): a task is a set of ordered input/output attribute
    pairs of a substrate; a constructor causes the transformation and retains its ability to do so again;
    a task is possible when the laws of nature impose no limit short of perfection on how accurately it
    can be performed and how well a constructor can retain its ability to perform it again, and not possible
    otherwise; Principle I (Section 2 p. 8) states that the state of a composite substrate S1 + S2 is
    the pair of states on S1 and S2 and a construction on S1 changes only the S1 state. The repository
    uses none of this vocabulary as a primitive.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - task / constructor / possible-task vocabulary (assumption)
  source_bottleneck: Taking the possible and not-possible partition of tasks as primitive is a different
    foundational choice from the repository's admitted primitive PG-ROOT-DIFF-STRUCTURE and its replayed
    refusal predicates. No source derives either from the other.
