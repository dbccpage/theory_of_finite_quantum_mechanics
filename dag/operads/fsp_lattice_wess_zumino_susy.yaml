  source_statement: 'Claimed: a finite-lattice 2D N=1 Wess-Zumino model with supercharges obeying {Q_a,
    Q_b} = 2 delta_ab H, H >= 0 and exact boson-fermion pairing of nonzero levels; no such lattice construction
    exists in this checkout, and lattice discretizations generally keep at most a subalgebra exact.'
  statement_status: source_claim_to_scope_check_not_accepted_result
