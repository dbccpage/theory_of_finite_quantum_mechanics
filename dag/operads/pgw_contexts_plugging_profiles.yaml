target:
  source_statement: A context is an admitted form with a slot tuple of its arity in which every filled
    slot names an admitted datum and at least one slot is a hole; plugging a datum fills every hole with
    that same datum. Derivability is membership in the admitted instances or coverage by a uniform all-tuples
    rule, and no other inference exists. The profile of a datum is the set of well-formed contexts whose
    plugging is derivable. Two data are collapsed when their profiles are equal and separable when some
    well-formed context is derivable for one and not the other; that is the declared sense used for every
    separation requirement.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Declared derivability: admitted-instance membership or a uniform all-tuples rule, with no other inference
    (assumption)'
  source_bottleneck: 'These are declared definitions: separability means a difference in positive derivability
    only, and an imposed requirement records a demand for separation without making it hold.'
