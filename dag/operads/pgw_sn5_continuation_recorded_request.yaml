target:
  source_statement: After a selected closure procedure reaches its target, continuation needs a stated
    next input or policy. The sealed source declares its external continuation policy, supply and admission
    of one fresh opaque token at the closure fixpoint, as explicit metatheory and not a derived transition,
    and the closeout lists endogenous demand generation (OB-1) as successor research. A continuation request
    may name a fresh token, a new protected question or a new response class, and is recorded before a
    response is selected. The local ledger labels one such request obs_continuation_gap, giving s₅ = 1
    for the exercise.
