  source_statement: Narrowed boundary, status left OPEN. The declared bound record is rounds 15, node
    guard 250, data ceiling 4, item bound 2, input count 2, engine count 4, and reading count 2. The input
    count equals the item bound. One is strictly below the input count. The guard is strictly above the
    round count. The engine count is not the reading count. The data counts strictly below 4, taken from
    the candidates 0, 1, 2, 3, and 4, are 0, 1, 2, and 3. There are 4 such counts. The ceiling itself
    is not strictly below 4.
