target:
  source_statement: No floor proof exists for the count of declared inputs (D10, H-1); the count stays
    two. Continuation attempt two found, at its declared bounds (fifteen rounds, a node guard of 250 per
    run, growth below four data, two items) and under its literal reading of carrying forward, four engines
    that carry the grammar forward declaring the stake and not the stream (SD-R-11), and calls this neither
    a floor proof nor a reduction outside those bounds. The completion-gate clause admits two readings
    of these bounded one-input carriers and was frozen as NOT_ESTABLISHED; whether the four carry forward
    past the bounds is OPEN (H-1, which needs the responder in Lean). Narrowed in Lean 4 to two named
    inputs, stake and stream, and four carriers that each declare the stake and not the stream. The named
    list has length 2. Each of the four carriers has declared count 1, and 1 is below 2. The reading that
    every one of these four has count at least 2 is false. The reading that one of them has count 1 is
    true. The declared numerals are 15 rounds, a node guard of 250, a data bound of 4, and an item bound
    of 2. A carrier that declares neither input has count 0 and is not one of the four. These four carriers
    are not a floor for every later carrier, and the attempt-two search is not replayed. AuthorityEffect
    is None.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Open; the bounded one-input carriers are a computation at declared bounds, and the
    clause''s other reading was left to the author, who approved the freeze without a separate ruling.
    This file checks four carriers on the two names stake and stream: each declares the stake only, so
    the count is 1, below 2. The numerals 15, 250, 4, and 2 are recorded and are not a search. A floor
    for every carrier, a reduction past these four, and the attempt-two replay stay open.'
  source_refs:
