    count. They do not show that four engines carry the grammar forward, and they do not decide the other
    reading of the completion gate. Whether the four carry forward past the bounds stays open (H-1, SD-R-11).
    A reduction below two that holds past the bounds of attempt two stays open. The completion-gate clause
    was frozen as NOT_ESTABLISHED. Status stays OPEN.
