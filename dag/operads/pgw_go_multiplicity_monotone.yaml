target:
  source_statement: 'The fourth derivation counts assertions: a state has terms, a multiplicity per ordered
    pair and the names, arb is asserted once to begin with, and every change adds one term or raises one
    multiplicity by one, taking nothing away. Every change leaves its state contained in its outcome and
    containment composes, so along every sequence Reach4 s t n each multiplicity is the same or higher
    (Reach4.mult_le), at the pair writing arb as well (Reach4.arb_mult_le); terms, assertions and names
    persist and an obstruction is never cleared. A counted containment gives a containment of the supports,
    so the third derivation''s conclusions survive on the supports.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - 'Reading C1'': asserted means multiplicity at least one, with support and indicator maps to the earlier
    model (assumption)'
  source_bottleneck: Monotone for the fourth seed's additions only; the fifth derivation restores the
    four kinds of change on counted assertions, so this monotonicity is not claimed there, and a multiplicity
    can rise above one (arb_twice).
  source_refs:
