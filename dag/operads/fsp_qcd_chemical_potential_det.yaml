target:
  source_statement: For lattice Dirac operators with chemical potential, gamma5 D(mu) gamma5 = D(-mu*)^dagger,
    hence det D(mu)^* = det D(-mu*); for real mu != 0 this relates D(mu) to D(-mu) only and det D(mu)
    is in general complex.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - lattice QCD with staggered quarks at chemical potential (standard)
  source_bottleneck: Standard continuum/thermodynamic QCD chemical-potential sign-problem framework imported;
    lean4/CampaignFspQcdChemicalPotentialDet.lean establishes the exact gamma_5-chemical-potential determinant
    conjugation identity (det D(mu))* = det D(-mu*), reality at mu = 0 and purely imaginary mu = i mu_I,
    the Hasenfratz-Karsch and Kogut-Susskind staggered operator identities, the explicit SU(3) clock link
    U = diag(i,i,-1) with Im Tr(U) = 2 != 0, the 6x6 chiral SU(3) determinant witness det D_SU3(2) = 63/8
    - 27i and det D_SU3(1/2) = 63/8 + 27i, and the diagonal SU(2) reality contrast, while checks/independent/fsp-qcd-chemical-potential-det.py
    checks 1D and 2D staggered SU(3) vs SU(2) lattices.
  source_refs:
  - dag/derivations/26_fsp/tfq_1201_fsp_qcd_chemical_potential_det.md
  - papers/core/fsp/theory_of_finite_fsp.md
  - dag/derivations/independent/fsp-qcd-chemical-potential-det.md
