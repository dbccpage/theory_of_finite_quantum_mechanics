target:
  source_statement: Raw least-pair selection is not isomorphism-equivariant. On the regression regime
    (four data, one unary form, instances on data 2 and 3) both the regime and its renaming by the double
    transposition 0↔2, 1↔3 collapse the pair (0, 1), yet the renaming carries (0, 1) to (2, 3) (least_pair_selection_not_congruent);
    that the two same-index choices give non-isomorphic children is a computational test. The repair branches
    once per automorphism orbit of collapsed pairs. Under datum renamings with forms fixed, the selection-free
    transition relation over every collapsed pair and every valid response transports (transStep_rename_fwd,
    transStep_image_total), and valid-response counts over caller-supplied candidate lists transport (validCount_rename).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The congruence is relation-level with forms fixed; conversion to equal canonical-key
    class sets, form-bijection transport and minimum-family transport stay computational with CL-ISO-SOUND,
    and no exported run reached a state with more than one orbit.
