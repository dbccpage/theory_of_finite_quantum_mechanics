target:
  source_statement: After Challenge 3 the challenge source is a pair of declared policies. The pair-separation
    closure policy reissues the admitted separation requirement pattern on collapsed pairs, one challenge
    branch per automorphism orbit of collapsed pairs, or nothing at the fixpoint where every pair is separated;
    it reads only profile equality and automorphism structure, supplies no data and imports no new goal
    kind. At that fixpoint the external continuation policy supplies and admits one fresh opaque token,
    and runs with this policy disabled are the closed-system baseline. Round 1 of every tree answers the
    externally imposed Challenge 3 requirement, and later separation rounds answer the closure policy.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared pair-separation closure policy and external continuation policy, genesis_source.txt sections
    3.9-3.10 (assumption)
  source_bottleneck: A collapsed pair is not an active obstruction by itself; the declared policy makes
    it one, its orbit-representative selection is also declared, and choosing it among conceivable policies
    is a declared-metatheory judgment, not a derived transition.
