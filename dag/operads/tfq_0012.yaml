target:
  source_statement: 'quaternion_gauge_shadow.rs presents Q8 as eight matrices over Q(i), embedded by
    omega_lie_theory::su2_matrix, and treats that finite subgroup of SU(2) as a non-abelian gauge shadow.
    finite_group.rs can hold a Cayley table for the same shadow, but the table is not an SU(3) color
    connection. A file search under omega_lie_theory/src and omega_quantum_physics/src found no
    Hopf-algebra module, so Hopf gauge data remains an open obligation next to this shadow.
    AuthorityEffect on the quaternion module is None. F001.S000 coordinates finite carriers and does not
    supply color links. Narrowed in Lean 4 and an independent Python verifier to three exact
    finite/algebraic components and non-equivalence fences: (1) Q8 quaternion group Cayley table
    associativity, two-sided identity/inverses, Hamilton relations i^2 = j^2 = k^2 = ijk = -1,
    non-commutativity ij = k != -k = ji, and the Q8 class equation 1 + 1 + 2 + 2 + 2 = 8 with irrep
    degree sum 1^2 + 1^2 + 1^2 + 1^2 + 2^2 = 8 (q8_group_associativity_unit_and_inverses,
    q8_nonabelian_hamilton_relations_and_class_equation); (2) faithful 2x2 Gaussian-integer SU(2) matrix
    embedding q8ToMat2GI homomorphism, injectivity, unit determinant 1 + 0i, and conjugation-invariant
    character trace in {-2, 0, 2} (q8_mat2gi_embedding_homomorphism,
    q8_mat2gi_embedding_injective_and_unit_det, q8_plaquette_holonomy_conjugation_and_trace_invariance,
    q8_wilson_plaquette_character_discrete_spectrum_fence); and (3) non-equivalence fences against SU(3)
    color connections (fundamental dimension 2 != 3, Lie algebra dimension 3 != 8, Lagrange center
    obstruction 8 % 3 != 0, max irrep degree 2 < 3) and unbuilt Hopf gauge modules.'
  statement_status: narrowed_finite_counterpart_and_fences_verified_lean4
