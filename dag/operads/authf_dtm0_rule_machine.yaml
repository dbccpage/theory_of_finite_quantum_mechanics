target:
  source_statement: A DTM0 machine is a designated halt state with a finite, left-biased list of rows
    (state, scanned symbol, next state, written symbol, move) over the two-symbol alphabet blank and marked;
    a configuration is a state, an integer head and a total tape Int to symbol; execute runs at most the
    stated fuel and returns halted, stuck or fuelExhausted.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - two-symbol alphabet fixed
  - rule-list order as the operational semantics
  - fuel as an externally supplied bound
  source_bottleneck: The definition carries no input encoding, no unbounded-run semantics, no halting
    predicate and no comparison with Mathlib Turing.TM0; fuel exhaustion is a bounded-evaluator result
    and not non-halting.
