target:
  source_statement: With link phases U_ij = exp(i A_ij) on ordered vertex pairs and oriented closed-path
    products U_p over a finite plaquette family, the Wilson action S = beta_g sum_p (1 - Re U_p) is invariant
    under local U(1) gauge transformations and is nonnegative for beta_g >= 0.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Lean: FermionSignU1WilsonAction.fsp_u1_wilson_action states gauge invariance (for
    every g: V -> U(1) and for every angle shift A_ij -> A_ij + theta_i - theta_j) and nonnegativity for
    beta_g >= 0, for any vertex type and any finite family of closed paths; the periodic hypercubic lattice
    (ZMod L)^d is one instance. beta_g >= 0 is required: one self-link plaquette with phase -1 and beta_g
    = -1 gives S = -2. Links are functions of ordered vertex pairs, so for L <= 2 the two parallel links
    between neighbours are identified. No fermion-sign consequence, continuum limit, reflection positivity,
    transfer matrix or non-abelian action is claimed. Audited PROVED_LEAN applies only to the narrowed
    DAG statement; the source record FSP-DERIV-032 claims strict positivity and a Haar-measure bound,
    neither established here.'
  source_refs:
  - dag/derivations/26_fsp/tfq_1196_fsp_u1_wilson_action.md
  - papers/core/fsp/theory_of_finite_fsp.md
  - dag/derivations/independent/fsp-u1-wilson-action.md
  paper_refs:
