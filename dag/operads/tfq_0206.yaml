target:
  source_statement: A float computation cannot authorize. The kernel names approximate as the only sanctioned
    lossy read of an Exact value and returns None when the value does not fit in a finite f64. That function
    is a named loss, not a second carrier. On the quantum shelf, density_matrix.py takes a NumPy array
    and a tolerance and returns a Python float, so those results stay diagnostic. Level18 records a zero-float
    law whose gap is an integer difference of scaled objectives. The prime runtime may keep a float trace
    in a side log. It must not copy that float into the carrier or treat a tolerance match as the finite
    statement.
