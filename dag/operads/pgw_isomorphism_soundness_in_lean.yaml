target:
  source_statement: Narrowed in Lean 4 to colorings of two data. A coloring is a pair of bits. The swap
    exchanges the two bits and is an involution. The serialization reads a bit as 0 or 1. The key is the
    lexicographic minimum of a coloring and its swap. The four keys are (0, 0), (0, 1), (0, 1), and (1,
    1). Equal keys hold exactly when one coloring is the other or its swap. Two colorings share the key
    (0, 1). The two constant colorings are fixed by the swap and have different keys.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Open; the run trees are quotiented by the implemented isomorphism, whose soundness
    is computational at the regimes cross-checked. Narrowed in Lean 4 to colorings of two data, where
    equal keys hold exactly when one coloring is the other or its swap. The implemented key, the regimes
    past the brute-force limit, and the orbit comparison stay open.
