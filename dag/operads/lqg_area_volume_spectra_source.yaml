target:
  source_statement: Rovelli and Smolin (1995, Nucl. Phys. B 442, 593) report that area and volume operators
    of loop quantum gravity have discrete spectra; Ashtekar and Lewandowski (1997, Class. Quantum Grav.
    14, A55) treat area operators. The area eigenvalues are commonly quoted as a sum over punctures of
    a constant times the square root of j(j+1), the constant depending on conventions and on the Immirzi
    parameter. This node records the papers; the exact constant is not asserted.
  statement_status: source_claim_to_scope_check_not_accepted_result
