  source_statement: The constructed dual representation identifies functionals satisfying 0<=e(x)<=u(x)
    on the state cone with Hermitian matrices 0<=E<=I. Homogeneous bounds are equivalent to probabilities
    in [0,1] on all trace-one PSD states. Soundness plus explicit EffectSaturated identifies the available
    binary effects with this full interval.
