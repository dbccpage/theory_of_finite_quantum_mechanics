target:
  source_statement: For any finite alphabet, the letter-by-letter fixed-width binary code of width clog
    2 |alphabet| + 1 is an injective monoid homomorphism on words with the explicit decoder decodeWord
    (decode_encode), and the same holds with the two separated marks as the target alphabet.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: A code is not an isomorphism of free monoids; no claim that a machine over the coded
    alphabet simulates a machine over the original (Mathlib TM1to1 is not used).
