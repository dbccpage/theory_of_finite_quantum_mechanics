  name: decodeFuel
  line: 978
  signature_excerpt: |-
    def decodeFuel (k : ℕ) : ℕ → List Bool → List α
      | 0, _ => []
      | n + 1, l =>
          if l.isEmpty then []
          else match dec1 (l.take k) with
            | some a => a :: decodeFuel k n (l.drop k)
            | none => []

    /-- Decode a binary word. -/
    def decodeWord (l : List Bool) : List α
