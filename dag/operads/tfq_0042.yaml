target:
  source_statement: ravera_dfm_finite_to_continuum.rs evaluates evaluate_su3_spanning_tree_vs_landau_gribov_control
    on CarrierGraph::diamond with five explicit block links over Q(i), checks a non-abelian commutator,
    and dresses every spanning tree, and it counts diagonal Klein-four copies. Lean su3_diagonal_klein_four_landau_gribov_copies
    and spanning_tree_dfm_eliminates_gribov_copies treat the copy count 4^3=64 and a tree identity for
    rational, not matrix, link variables. No Python twin of this function was found under 006_finite_qm/python.
    The module title uses continuum language; that title is not a bridge theorem.
  statement_status: source_claim_to_scope_check_not_accepted_result
