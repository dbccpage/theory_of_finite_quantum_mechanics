  - id: semantic_discharged_can_still_move
    kind: semantic_near_miss
    rationale: Claims a fully discharged ledger can still be upgraded, mixing the progress order with
      a status above discharged.
    rejected_by: check_candidate
  - id: semantic_node_reading_is_end_to_end
    kind: semantic_near_miss
    rationale: Moves the node-reading marker from the all-control-only vector to the all-discharged vector,
      overstating what the register says.
    rejected_by: check_candidate
  - id: semantic_register_literal_reading
    kind: semantic_near_miss
    rationale: Moves the node-reading marker to 00000 (every obligation literally OPEN, no scoped control
      counted), the alternative reading of the register wording.
    rejected_by: check_candidate
  - id: semantic_two_missing_one_update_completes
    kind: semantic_near_miss
    rationale: With two obligations still undischarged, claims a single monotone update already completes
      the ledger.
    rejected_by: check_candidate
  - id: semantic_all_discharged_not_end_to_end
    kind: semantic_near_miss
    rationale: Marks the all-discharged ledger as not end-to-end, breaking the definition in the other
      direction.
    rejected_by: check_candidate
  - id: semantic_prefix_flag_reversed
    kind: semantic_near_miss
    rationale: Marks a discharged-prefix ledger (O01..O03 discharged) as violating the programme order.
    rejected_by: check_candidate
  - id: semantic_no_control_at_all_passes
    kind: semantic_near_miss
    rationale: Counts the all-open ledger as having a passing control on every obligation.
    rejected_by: check_candidate
