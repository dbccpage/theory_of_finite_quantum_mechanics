    original_target: 'Five open bridge obligations: O01 carrier/signature/law/challenge-generation floor;
      O02 source transition/admission systems to the WDP bridge by preservation/reflection maps; O03 dynamic
      carrier transport and higher fillers; O04 effect/probability, scalar and Hilbert choices; O05 governance
      refinement. Scoped CONTROL items are done; the end-to-end claims are not.'
    source_scope_review: 'Read the 12 operation candidates and 5 relation candidates in DerivationDagQMClosure.lean
      and the real ledger text (genesis_bridge_register.md rows O01..O05, the completion audit worklist,
      programme section 6). The source theorem pg_wdp_genesis_bridge_o01_o05_observer_completion_and_diamond_curl
      is mostly fixed-number arithmetic: its Boolean AND of five free flags is the conjunction (vacuous
      with respect to the obligations), its leave-one-out conjunct is decide on `decide (j ≠ k)`, and
      its sqrt(2) check is bounded (q<=4, p<=6). genesis_to_wdp_bridge_preserves_and_reflects is a general
      but one-line Bool.or lemma and the map forgets orientation. declare_then_assert_cost_floor is a
      general omega lemma about event-trace costs and does not move any ledger status. The register labels
      each of O01..O05 literally OPEN (rows 87-91) and never says "control-only"; the ledger is modelled
      with statuses open / control-only / discharged, an invented vocabulary, the end-to-end predicate
      and the programme order are modelling choices and are labelled as such. No obligation is discharged
      or dischargeable by this node.'
    admitted_assumptions:
    - 'Ledger model: five obligations O01..O05, statuses open / control-only / discharged; end-to-end
      is DEFINED as all five discharged; the programme order O01<..<O05 is our mapping of the derivation
      order of the programme document, not a stated prerequisite relation.'
