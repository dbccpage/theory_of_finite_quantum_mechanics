target:
  source_statement: Covers phase_estimation.rs. The header states discrete quantum phase estimation over
    exact cyclotomic fields and dyadic rationals. When theta equals k over 2 to the m, the eigenvalue
    lies in Q(zeta of 2 to the m). For m in 1, 2, 3 the register vector and the unnormalized inverse Fourier
    matrix are built in Q(zeta_24), and the geometric sum cancels so the measurement weight on the matching
    outcome is the rational 1. A Python replay and a Lean 4 declaration would still have to match that
    cancellation identity and the restriction to those three register lengths.
