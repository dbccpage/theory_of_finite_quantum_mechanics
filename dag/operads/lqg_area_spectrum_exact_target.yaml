target:
  source_statement: 'Finite statement to formalize. With the dimensionless area a = sum over punctures
    of sqrt(j(j+1)) for spins j in {1/2, 1, 3/2, 2, ..., 3}, each term is an exact algebraic number: sqrt(3)/2,
    sqrt(2), sqrt(15)/2, sqrt(6), sqrt(35)/2, sqrt(12)=2 sqrt(3) for j=1/2, 1, 3/2, 2, 5/2, 3. Square
    roots of distinct squarefree positive integers are linearly independent over Q, so two multisets of
    punctures have equal area if and only if the sums agree after reducing each root to squarefree form.
    Targets: (i) the table of exact levels for at most four punctures with j<=3; (ii) the degeneracies,
    which arise from non-squarefree radicands and from the equality criterion, for example one puncture
    of spin 3 has the same area as four punctures of spin 1/2 (2 sqrt(3) = 4 x sqrt(3)/2); (iii) the smallest
    nonzero level is sqrt(3)/2.'
