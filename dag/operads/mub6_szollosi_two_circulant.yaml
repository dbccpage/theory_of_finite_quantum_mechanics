target:
  source_statement: For unit phase triples a, b with a0 a2* + a1 a0* + a2 a1* + b0 b2* + b1 b0* + b2 b1*
    = 0, the block matrix [[A, B], [B*, -A*]] of circulants has H H* = 6I and H/sqrt 6 is unitary with
    squared entry moduli 1/6; alpha is in both phase-sum images x + y + conj(xy) and -alpha iff some real
    solution of the six parameter equations has first phase sum alpha.
