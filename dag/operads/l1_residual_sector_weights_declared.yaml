  by decide; the orbit SUM has twice Phi1) and sector_weights_sum_to_phi1 (additivity of a list sum on
  append). None of them defines the minimum over a class, so "Phi1" there is the L1 of a given residual.
  The general claim is therefore proved afresh: on the n-cycle the class is the holonomy, Phi1 = |S|,
  the minimizers are a signed simplex, two minimizers with equal (Phi1, Gamma2) differ in sector weights,
  and the symmetric average is an extra declared selector (integral only when n divides S). Weighted L1
  forms are not treated.'
