    original_target: 'Sectors are residual sectors with declared finite nonnegative masses mu(s), total
      M > 0. The carrier is the weight vector w. No derivation of w from the Phi1 / Gamma2 residual is
      given in the sources read: w is an input to QM_003, QM_012 and QM_020.'
    source_scope_review: 'The source declarations are l1_residual_sector_weights_minimizer_nonuniqueness_and_dihedral_selector
      (fixed rA=(1,1,0,0), rB=(0,0,1,1), plus a conjunct that is true for any w0,w1 and uses neither),
      even_cycle_sector_weights_require_selector (two fixed C4 vectors by decide), l1_even_cycle_symmetry_orbit_canonical_sector_weights
      (fixed vectors by decide; the orbit SUM has twice Phi1) and sector_weights_sum_to_phi1 (additivity
      of a list sum on append). None of them defines the minimum over a class, so "Phi1" there is the
      L1 of a given residual. The general claim is therefore proved afresh: on the n-cycle the class is
      the holonomy, Phi1 = |S|, the minimizers are a signed simplex, two minimizers with equal (Phi1,
      Gamma2) differ in sector weights, and the symmetric average is an extra declared selector (integral
      only when n divides S). Weighted L1 forms are not treated.'
    admitted_assumptions:
    - Edge cochains on the n-cycle with unweighted L1 form; the class of c in C^1/im d0 is its holonomy
      S = sum c; sectors are blocks of consecutive edges; sector weights are sums of |r_i| over a block.
    - The rotation symmetry is a declared extra input.
    historical_source_assumptions: []
    work_unit_admitted_hypotheses:
    - Edge cochains on the n-cycle with unweighted L1 form; the class of c in C^1/im d0 is its holonomy
      S = sum c; sectors are blocks of consecutive edges; sector weights are sums of |r_i| over a block.
    - The rotation symmetry is a declared extra input.
