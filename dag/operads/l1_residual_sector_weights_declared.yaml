- 'The source declarations are l1_residual_sector_weights_minimizer_nonuniqueness_and_dihedral_selector
  (fixed rA=(1,1,0,0), rB=(0,0,1,1), plus a conjunct that is true for any w0,w1 and uses neither), even_cycle_sector_weights_require_selector
