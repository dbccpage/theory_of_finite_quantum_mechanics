      semantic_predicate: l1 r = sum |r_i|.
    - catalog_id: class_holonomy
      inputs:
      - EdgeCochain
      output: SignedWeight
      semantic_predicate: hol c = sum c; two cochains are in one class iff their holonomies agree (class_iff).
    - catalog_id: phi1_quotient_min
      inputs:
      - EdgeCochain
      output: Weight
      semantic_predicate: Phi1 c = min over h of l1 (c - d0 h) = |hol c| (phi1_attained_and_lower_bound).
    - catalog_id: minimizer_set
      inputs:
      - EdgeCochain
      output: ResidualSet
      semantic_predicate: 'All r in the class of c with l1 r = Phi1 c: sum = S, entries of the sign of
        S (minimizer_iff).'
    - catalog_id: sector_weights
      inputs:
      - Residual
      - SectorSizes
      output: SectorWeightVector
      semantic_predicate: Block sums of |r_i|; they add up to l1 r.
    - catalog_id: symmetric_average
      inputs:
      - EdgeCochain
      output: Residual
      semantic_predicate: The rotation-invariant minimizer, constant |S|/n (symmetric_selector); integral
        iff n divides S.
    composition_plan: *id002
    tree:
    - sector_weights(minimizer_set(c), sizes)
    - minimizer_set(phi1_quotient_min(c))
