presentation:
  status: scoped_stage_result_reviewed
  scope: For the n-cycle with the unweighted L1 form, the set of minimizing residuals is the scaled simplex
    of sign-definite cochains with sum S (minimizer_iff); the sector weights are its block sums, which
    are not a function of (Phi1, Gamma2 = holonomy) for n >= 2, S != 0 and at least two sectors (sector_weights_not_determined),
    because (Phi1, Gamma2) determine only the signed holonomy S (hence Phi1 = |S| and the sign pattern);
    any single choice, including the cyclically symmetric average S/n, is an extra declaration, and with
    unequal declared masses the minimizer concentrates on the minimal-mass edges (native rows) so the
    masses themselves are the declared input.
  colours:
  - id: EdgeCochain
    meaning: Integer or rational edge cochain on the n-cycle
  - id: Residual
    meaning: One minimizing residual cochain
  - id: ResidualSet
    meaning: Finite set of minimizing residuals
  - id: SectorSizes
    meaning: Block sizes of consecutive edges
  - id: SectorWeightVector
    meaning: Vector of block sums of |r_i|
  - id: SignedWeight
