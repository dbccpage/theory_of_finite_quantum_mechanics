target:
  source_statement: On any well-formed regime whose imposed requirements are all separated, for any two
    distinct admitted data i and j, the two-item delta of one fresh unary form and one instance of it
    at datum j is a valid response to Separate(i, j) and keeps every imposed requirement separated (mark_progress).
    Derivability of instances of the old forms is unchanged by this extension, so old witnesses survive
    (derivable_extend). The standalone replay checks fresh-mark preservation for 3,996 targets across
    1,436 regimes, and no terminal_no_response node occurs in any exported run.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: This is response existence for a supplied demand only; it does not establish autonomous
    demand generation or an unbounded tower, and the preserved conjunct ranges over the requirement store,
    not over all separable pairs.
