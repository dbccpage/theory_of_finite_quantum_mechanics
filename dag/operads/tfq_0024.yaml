target:
  source_statement: creutz_ratio_area_law and creutz_ratio_perimeter_law in the Rust QCD control, and
    wilson_area_law, wilson_perimeter_law, and creutz_ratio in the Python twin, compare two closed formulae.
    With W_area = beta_tilde to the power R*T and W_perim = beta_tilde to the power 2*(R+T), the multiplicative
    Creutz ratio equals beta_tilde in the first case and 1 in the second. At beta_tilde=1/9 the map records
    1/9 against 1 for rectangles with R and T in {2,3}. Lean wilson_creutz_ratio_area_vs_perimeter checks
    the same cancellation for b nonzero. The comparison is algebraic. It is not a Monte Carlo estimate
    of a Wilson loop.
