target:
  source_statement: quaternion_gauge_shadow.rs says each listed Q8 element lies in SU(2) by the special-unitary
    check, and it says explicitly that Q8 is a finite subgroup of SU(2), not SU(2) itself. su2.rs holds
    quaternions, the adjoint cover, spinor norms, and binary polyhedral groups. Those constructions give
    a finite non-abelian shadow with a two-dimensional carrier. They do not provide the three diagonal
    color labels used by the weighted Gell-Mann family. Promoting Q8 flux operators to a stand-in for
    su(3)_c would skip the separate generator control. The obligation is to keep this SU(2) shadow on
    the gauge side of the cut.
