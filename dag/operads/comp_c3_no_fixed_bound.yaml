target:
  source_statement: On lists of the one letter 0, with no rewrite step, reachability is equality. The
    length bound is 1. The word (0) has length 1 and reaches itself. The empty word has length 0, so it
    is inside the bound, and (0) does not reach it. The word (0, 0) has length 2, so it is outside the
    bound, and (0) does not reach it.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Standing text is one letter, no rewrite step, and length bound 1: (0) reaches itself,
    misses the empty word, and (0, 0) has length 2. A computable map from an input to a start word, one
    bound containing every halting start word, and a clash with normal-form reachability stay open. The
    older citations reachB_iff and nfReach_not_computable do not discharge this slice.'
