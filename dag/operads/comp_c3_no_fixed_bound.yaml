target:
  source_statement: If the map from an input to its start word were computable and one length bound witnessed
    every halting start word inside the bound, normal-form reachability would be decidable, contradicting
    nfReach_not_computable.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'The checked slice is one letter, no rewrite step, and length bound 1: (0) reaches
    itself, misses the empty word, and (0, 0) has length 2. A computable map from an input to a start
    word, one bound containing every halting start word, and a clash with normal-form reachability stay
    open. The older citations reachB_iff and nfReach_not_computable do not discharge this slice.'
  source_refs:
