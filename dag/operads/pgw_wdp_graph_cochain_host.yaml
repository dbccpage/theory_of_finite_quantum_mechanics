target:
  source_statement: 'On a finite oriented graph G = (V, E) with a normed coefficient space A, the host
    sets C⁰ = A^V, C¹ = A^E and (d₀f)(u, v) = f(v) − f(u); an edge field δ is exact when δ = d₀f. Q¹ =
    C¹/im d₀ records edge fields modulo vertex-potential repair, relative to the declared graph, coefficient
    space and repair map, and it is not the first cohomology group unless a next differential d₁ is supplied
    with d₁d₀ = 0. Worked cases: on the path 0 → 1 → 2, δ = (2, 3) = d₀(0, 2, 5) is exact; on the hollow
    cyclic triangle (01, 12, 20) every repair of δ = (1, 1, 1) still sums to 3, a quotient obstruction
    that is not contextuality without a measurement cover and an empirical model.'
