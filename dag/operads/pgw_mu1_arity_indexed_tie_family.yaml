target:
  source_statement: For every arity k ≥ 1 the k-ary mark, one k-ary form and one instance (1, ..., 1),
    is a valid two-item response to Challenge 3 on R2L (deltaK_valid, deltaK_length), since the all-hole
    context separates the two required data. Distinct arities give non-isomorphic results because an isomorphism
    preserves form arity (markK_pairwise_noniso), so the mu1 tie class in reading L is countably infinite.
    A concrete enumeration is therefore complete only relative to an arity bound, and the arity-at-most-two
    census is one slice of this family.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared item grammar, measure mu1 and the implemented isomorphism relation (assumption)
  source_bottleneck: 'Stated over R2L only: no reading-F analogue of the k-ary family is formalized, and
    the family leaves the mu2 minimum (2, 1) unique up to isomorphism.'
