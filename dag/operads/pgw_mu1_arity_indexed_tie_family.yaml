  source_statement: For every arity k ≥ 1 the k-ary mark, one k-ary form and one instance (1, ..., 1),
    is a valid two-item response to Challenge 3 on R2L (deltaK_valid, deltaK_length), since the all-hole
    context separates the two required data. Distinct arities give non-isomorphic results because an isomorphism
    preserves form arity (markK_pairwise_noniso), so the mu1 tie class in reading L is countably infinite.
