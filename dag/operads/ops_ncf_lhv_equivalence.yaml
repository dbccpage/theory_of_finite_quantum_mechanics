target:
  source_statement: 'Proposition B3(1). For an empirical model e = (e_C) on a finite scenario, let A be
    the matrix whose column g, for g in E(M), is the stacked vector of the point masses of g restricted
    to each context, and let NCF(e) = max of the sum of lambda_g over lambda >= 0 with A lambda <= e.
    Then these are equivalent: e has a global section (a probability vector d on E(M) with marginal e_C
    on every context C); e lies in conv(A); NCF(e) = 1. This is the local-hidden-variable condition. Instances
    recomputed exactly: the mixture (1/2)(delta_g1 + delta_g2), with g1 = (0,0,0,0) and g2 = (1,0,0,1)
    on (a, a'', b, b''), has NCF 1; the noisy PR box (1 - lam) PR + lam U at lam = 1/2 has NCF 1 and a
    distribution as a global section.'
