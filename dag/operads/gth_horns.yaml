target:
  source_statement: The horn Lambda^k[n] is the union of all faces of the standard n-simplex except the
    face opposite vertex k. The horn is inner when 0 < k < n and outer when k = 0 or k = n. A Kan condition
    asks for a filler of every horn. A quasicategory asks for a filler of every inner horn, in the sense
    of Joyal, Journal of Pure and Applied Algebra 175 (2002) 207-222. Which of these fillers a finite
    object derived from Genesis admission would have is open. No filler is exhibited and no counterexample
    is exhibited, because no such finite object is constructed.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Which horns would have fillers is open. There is no object of which a filler or a
    missing filler could be shown.
