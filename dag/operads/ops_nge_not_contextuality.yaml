target:
  source_statement: 'Consequence of nodes OPS-MAXIMAL-COVER-DESCENT and OPS-ARC-COVER-NGE-WITNESS. A descent
    outcome NoGlobalExtension on a matching family is a statement about the chosen cover, not about the
    model: on the maximal cover it never occurs, and on the arc cover above it occurs for a model with
    NCF 1. Strong contextuality is G(e) empty, reported as NCF 0 with a Bell functional as the replayable
    witness. So the note''s local-green-global-red event (a matching family over a cover of M whose descent
    outcome is NoGlobalExtension) is evidence that the cover''s local checks do not reach the global object,
    and not evidence that no global object exists.'
