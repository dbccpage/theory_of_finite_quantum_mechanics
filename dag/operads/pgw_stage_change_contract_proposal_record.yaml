target:
  source_statement: 'The sealed GraphGenesis.ProposalRecord s is a represented growth proposal at state
    s whose fields are exactly: a block proved to be a member of the complete family upFamily s (branch-local,
    with no canonicality or uniqueness claim); an embedding and a retraction with retract (embed x) =
    x for every represented position x < s.occ.length; freshness of every token the block admits; preservation
    of every old asserted, retained and protected pair and of every pair the declared observation separates,
    transported along embed; a new pair equal to (parentPos, freshPos) with the parent represented and
    the fresh position the next one; and a declared cost : Nat. It has no license, execution or activation
    field: on a halted state its block replays to the same state (proposal_confers_no_execution), and
    upProposal inhabits the record with the identity embedding on a store-bounded live state. The education
    audit reads this record as the stage-change contract for S(n).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The record is one sufficient schema with no minimality or initiality property, it
    confers no authority, and its cost is a Nat-valued declared resource demand, not the exact rational
    cost accounting the education audit describes.
