target:
  source_statement: 'Rung ten (pull request 265) takes X-6 for adjacency, reach, branching and exhaustion
    through the sealed responder: the demand is a collapsed pair, a response is a minimum of the sealed
    candidate space of at most two items and arity two under mu1 or mu2, and the responder refuses a regime
    holding a uniform rule. Adjacency, reach and branching are useful realizations at two declared capabilities,
    and exhaustion is definable: in Lean a form is exhausted exactly when it does not distinguish, exhaustion
    is carried by the isomorphism, and for a well-formed base a pair a history moves is mentioned by an
    instance admission of the history or the history holds a rule admission. On the rectangle 3110 demands
    are answered with none refused within two items, reach is at most three and finite adjacency distance
    at most two, and the measure changes the adjacency graph and the tie counts.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Lean declaration SecondResponse.Exhaust.exhausted_iff_not_distinguishes at dbccpage/19L57G1@85a83ae7c,
    not elaborated in this checkout (assumption)
  - Lean declaration SecondResponse.Move.moved_pairs_meet_mentions at dbccpage/19L57G1@85a83ae7c, not
    elaborated in this checkout (assumption)
  - Sealed responder under mu1 or mu2 at two items and arity two, priced as two declared capabilities
    (assumption)
  source_bottleneck: No Lean statement is about a minimum, a cost or a tie (S-3); response_collapses_a_pair
    is about one instance admission, not a sealed-responder minimum; the distance bound of two is not
    known to be the grammar's (S-4), and branching is finite computation only.
