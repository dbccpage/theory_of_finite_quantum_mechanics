target:
  source_statement: 'lean4/NoSignallingCore.lean establishes, for natural-number-valued tables of the
    product form P x y a b = PA x a * PB y b in which each PB y sums to 1 over a listed outcome set, that
    the marginal on the first party does not depend on the second party''s setting (product_noSignalling,
    marginalA_product), and that the table sig, in which the first outcome equals the second setting,
    has a setting-dependent marginal, so NoSignallingBA fails (sig_signals). Scope: product tables over
    the naturals with outcome lists; no quantum states, no commuting local observables, no relation to
    the posets of CausalOrder.lean.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The quantum statement that commuting local measurements at spacelike separated points
    give setting-independent marginals is not stated in this file.
