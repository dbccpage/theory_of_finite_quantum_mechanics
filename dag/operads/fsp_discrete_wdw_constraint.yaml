target:
  source_statement: 'Claimed: a discrete Wheeler-DeWitt operator H_perp on spatial triangulations is nonnegative
    and acts as a projection on diffeomorphism-invariant states; no such operator is constructed here,
    and the DeWitt supermetric of the continuum constraint is indefinite.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'This is a declared finite-dimensional integer model; its set of integer triples
    is infinite. It constructs no discrete Wheeler-DeWitt operator, triangulation dynamics, diffeomorphism
    action, physical state space or continuum limit. Its counterexample concerns an inference from symmetry
    and a nonzero kernel to positivity or idempotence, not a specified gravitational model. Original target
    retained as an obligation: Claimed: a discrete Wheeler-DeWitt operator H_perp on spatial triangulations
    is nonnegative and acts as a projection on diffeomorphism-invariant states; no such operator is constructed
    here, and the DeWitt supermetric of the continuum constraint is indefinite. Prior boundary: Construct
    H_perp on a declared finite state space and determine its spectrum; the manuscript separates the constraint
    H_perp Psi = 0 from thermal Hamiltonians (Section 2.5).'
