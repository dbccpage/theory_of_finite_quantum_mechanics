target:
  source_statement: 'Claimed: a discrete Wheeler-DeWitt operator H_perp on spatial triangulations is nonnegative
    and acts as a projection on diffeomorphism-invariant states; no such operator is constructed here,
    and the DeWitt supermetric of the continuum constraint is indefinite.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Narrowed algebraic checks only. Rational residuals obey elementary norm bounds, and
    a zero-edge/sign-vertex witness has the displayed norm bound and objective equality. No incidence
    operator, transpose annihilation proposition, optimizer API, or general strong-duality theorem is
    constructed. A rank-one quadratic form, two supplied 2x2 projectors and a swap constraint have the
    stated identities. The thermal values 8 and 5 are second-order polynomial traces, not Gibbs exponential
    traces. The indefinite rational two-variable form is supplied and not derived from continuum DeWitt
    geometry; no physical Wheeler-DeWitt projector or fermion-sign mechanism follows. Status is unchanged.
    The original physical or operational bridge remains open.
