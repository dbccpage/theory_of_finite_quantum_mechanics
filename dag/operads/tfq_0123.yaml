  source_statement: 'TransportCell.lean adds loss ledgers valued in the natural numbers and checks
    associativity of that addition. The atlas Python twin uses floating values and tests one exactly
    representable triple. GAP-F002-S000-002 says the two arms are different carriers and that neither
    witnesses the other. GAP-F002-S000-001 leaves an 11-dimensional supergravity triangulation unbuilt.
    What is finite is either the natural-number sum or the float instance, not both as one object. What
    is not discharged is transport into a smooth frame and the continuum limit. The ledger is not the
    Einstein equation. Narrowed in Lean 4 and an independent Python verifier to three exact
    finite/algebraic components and non-equivalence fences: (1) Natural-number transport cell monoid
    associativity, unit laws, loss monotonicity, and zero-loss characterization (nat_transport_cell_assoc,
    nat_transport_cell_unit_laws, nat_transport_loss_monotonicity_and_zero_iff); (2) the GAP-F002-S000-002
    carrier mismatch showing that sub-ulp floating/dyadic absorption associates on the sub-unit triple
    (1/2, 1/4, 1/8) but breaks associativity on (1, 1/16, 1/16) (1 != 9/8), and that 1 in Nat has no half
    so no additive homomorphism Q -> Nat preserves 1; and (3) the GAP-F002-S000-001 11D supergravity
    simplex face-count skeleton (C(12, k+1) with 4095 total faces and hinge dimension 9 != 2), SO(2)
    frame rotation blindness of scalar loss ledgers, and 66-component 11D Ricci trace underdetermination.'
