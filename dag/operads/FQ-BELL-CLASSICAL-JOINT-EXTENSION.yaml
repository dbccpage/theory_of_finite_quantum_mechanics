target:
  source_statement: If four binary response variables A0,A1,B0,B1 in {-1,+1} share one positive normalized
    joint law then every deterministic assignment has S in {-2,2} and |S| <= 2 by convexity. By Fine,
    existence of the common joint law matches satisfaction of the CHSH family under compatibility assumptions;
    physical conclusions additionally need locality and setting independence.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - positive normalized joint law (assumption)
  - locality and setting independence for physical reading (assumption)
  source_bottleneck: Both the 16 deterministic assignments in {-2, 2} and the inductive convexity step
    over arbitrary non-negative weight lists are mechanized in DerivationDagQMClosure.lean.
  source_refs:
