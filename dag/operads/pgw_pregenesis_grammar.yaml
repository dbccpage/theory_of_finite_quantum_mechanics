target:
  source_statement: 'The Pre-Genesis host grammar declares the inscription alphabet {<, >, a, b} and three
    public starts: ground_token (exactly <>), inscription (one balanced, non-nested bracketed inscription)
    and pre_genesis_regime (zero or more inscriptions between braces, where {} is host list notation and
    not the empty word). It keeps four states apart: absent input, the empty word, the literal token <>
    and the ground carrier that S(0) adopts. It has no event productions: the first event, supply(<>),
    is the Genesis boundary, and parsing a word admits no carrier, transition or observational operation.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared host grammar pre_genesis.ebnf, a later host notation not tested by the model trials (assumption)
  source_bottleneck: A grammar verdict is a syntax check of host notation; it assigns no semantics to
    <> and does not decide whether an inscription is admitted.
