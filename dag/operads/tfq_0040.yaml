target:
  source_statement: The tri-language obligation is uneven. Rust, Python, and Lean agree on the rational
    QM-221 matrix, beta0, beta1, and Creutz identities, with Lean covering scalar Fierz identities rather
    than the 81-entry loop. QM-213 has Rust and Python but no Lean twin in FiniteQM.lean. Lattice Dirac
    doubling has Rust only. The Gribov diamond has Rust and a Lean rational shadow, and no Python twin
    was found under the finite_qm use cases. Hopf gauge data, su3_level.rs, and a three-quark color contraction
    are absent. F002.S001 stays an open bridge. A float print cannot authorize any exact identity listed
    here.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Close the missing Python or Lean twins before treating a control as tri-language,
    and keep F002.S001 open.
