target:
  source_statement: 'Imported principle (Deutsch-Marletto Principle III): the composite of two information
    media is an information medium whose information variable is the Cartesian product of the component
    information variables, and information can be copied from one medium to another. This gives Cartesian
    product of attribute sets at the level of information variables, not yet the complex Hilbert tensor
    product of quantum state spaces. Narrowed in Lean 4 and an independent Python verifier to exact finite/algebraic
    components and non-selection fences: (1) on ZMod n, cnotClone n (x, y) = (x, x + y) and cnotUnclone
    n (x, y) = (x, y - x) are two-sided inverses so cnotClone n is a bijection that clones every x from
    blank 0 and is an involution for n = 2; (2) Fin 1 has 1 permutation and no distinct attributes whereas
    Fin (n + 2) has distinct attributes 0 != 1 swapped by Equiv.swap 0 1, and any injective encoding separates
    distinct attributes after cloning; (3) for composite media ZMod n1 x ZMod n2, componentwise cloning
    compositeClone n1 n2 is bijective with blank (0, 0), |Fin d1 x Fin d2| = d1 * d2, and cross-medium
    copy composed with any target permutation pi realizes (x1, pi x1); and (4) Principle III does not
    discharge FQ-GAP-TENSOR-UNIQUENESS because 2-qubit CNOT maps the superposition (1, 0, 1, 0) to the
    entangled Bell state (1, 0, 0, 1) with Schmidt determinant 1 != 0, the 4-element attribute set Fin
    2 x Fin 2 is shared by four distinct composite state-space dimensions (classical simplex 3 < real
    local product 9 < real quantum symmetric 10 < complex Hermitian 16), and the quantum PSD cone and
    Partially-Transposed (PT) cone agree on all classical diagonal matrices over {0, 1}^2 and all product
    vectors while differing on the Bell witness evaluated on the singlet vector.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - information medium and interoperability principle (assumption)
  source_bottleneck: Narrowed algebraic checks only. Modular-addition maps have explicit inverses; finite-set
    cardinalities multiply; supplied integer CNOT/Bell/partial-transpose models obey the displayed polynomial
    identities. ZMod 0 is infinite, so the arbitrary-n theorem is algebraic rather than an exclusively
    finite-carrier theorem. The dimension functions are declared formulas, not constructed state spaces;
    normalized and unnormalized dimensions must not be conflated. The integer quadratic-form example does
    not construct two full physical cone theories satisfying all constructor axioms. Status is unchanged.
    The original physical or operational bridge remains open.
