target:
  source_statement: 'Imported principles, audited and corrected against Deutsch and Marletto (2015, arXiv:1405.5563,
    Sections 3-6 pp. 9-12): a computation variable is a set S of at least two possible attributes for
    which all permutation tasks are possible with side-effects (Section 3 p. 9); a variable S is clonable
    if the cloning task R_S(x0) = union_{x in S} {(x, x0) -> (x, x)} is possible with side-effects for
    some preparable blank attribute x0 (Section 4 eq. (3) p. 10); an information variable is a clonable
    computation variable, and an information medium is a substrate with at least one information variable
    (Section 4 p. 10). Distinguishability is defined afterward in Section 5 (eq. (4) p. 11) by mapping
    into an information variable, avoiding circularity, and every information variable is then shown to
    be distinguishable. Principle III (interoperability, Section 6 p. 12) states that the composite S1
    + S2 of two substrates with information variables S1 and S2 is an information medium with information
    variable S1 x S2.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - information medium and interoperability principle (assumption)
  source_bottleneck: The interoperability principle (Principle III, Section 6 p. 12) constrains composite
    information variables to include S1 x S2 in the source's framework. It is not shown to select the
    Hilbert tensor product, local tomography or any positive cone, so it does not discharge FQ-GAP-TENSOR-UNIQUENESS.
