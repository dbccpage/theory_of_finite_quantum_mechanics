target:
  source_statement: 'Kitaev (2006): in the four-Majorana representation of the honeycomb model, the plaquette
    fluxes W_p commute with H and with each other, and in each flux sector H is quadratic in the c Majoranas
    with a static Z2 gauge field (after projection to the physical subspace).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Kitaev honeycomb spin model and its Majorana representation (Kitaev 2006)
  source_bottleneck: Narrowed algebraic checks only. Explicit integer matrices obey Clifford identities;
    one anticommutation hypothesis gives bond factorization; a six-factor commutative-ring flux is gauge
    invariant; a product of all supplied involutions squared equals one; and a 4x4 skew matrix has determinant
    equal to the squared explicit Pfaffian polynomial. No cellular surface incidence map is built, so
    the product-square lemma is not a theorem about all plaquettes on closed tori. The independent diagonal
    parity matrix is not identified with the supplied Majorana gauge operator. No physical Hilbert-space
    projection or thermal partition function is constructed. Status is unchanged. The original physical
    or operational bridge remains open.
