    operators, physical gauge projection, global flux-sector sum or sign-free sampling theorem is constructed.
    Original target retained as an obligation: Kitaev (2006): in the four-Majorana representation of the
    honeycomb model, the plaquette fluxes W_p commute with H and with each other, and in each flux sector
    H is quadratic in the c Majoranas with a static Z2 gauge field (after projection to the physical subspace).
    Prior boundary: A sign-free sampling claim for this representation is not made or checked here; the
    gauge projection and flux-sector sum must be kept explicit.'
