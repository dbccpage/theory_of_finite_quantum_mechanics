target:
  source_statement: 'Let f : GVec -> Q be a frame function on Q(i)^3 (IsFrameFunction f). Decide whether
    Archimedean continuity of f at every nonzero vector (IsArchimedeanContinuousEverywhere f: pointwise
    epsilon-delta continuity in the Euclidean squared distance distSqVec) implies uniform continuity on
    rays (IsUniformlyRayContinuous f: one rational delta per rational epsilon in the squared ray distance
    raySinSq). State separately the signed version (all frame functions) and the nonnegative version (IsNonnegFrameFunction
    f) needed by the original targets; the signed version implies the nonnegative one.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'For arbitrary functions on a dense non-compact domain the implication fails (h(q)
    = 1 for q > sqrt(2)/2 and 0 otherwise, on Q intersected with [0,1], is continuous at every point of
    its domain and not uniformly continuous; a topological illustration only, not a frame function). Known:
    a zero-weight residual supported in a cap of angular radius below 45 degrees vanishes on the cap,
    assuming each ray of the cap completes to an admissible rational orthogonal frame, so that particular
    localized construction is ruled out; the valuation-defined residuals s3, s7, sp are nowhere Archimedean
    continuous and are not candidates. Not known: whether a counterexample must be global, whether one
    exists at all, or an epsilon-free rigidity argument that fixes a pole. A positive answer would make
    FQ-GLEASON-QI3-UNIFORM-RAY-CONTINUITY apply to every pointwise-continuous frame function; a negative
    answer would be a pointwise-continuous non-quadratic frame function. Neither the unsuccessful attempts
    nor the conditional theorem settle the pointwise targets.'
