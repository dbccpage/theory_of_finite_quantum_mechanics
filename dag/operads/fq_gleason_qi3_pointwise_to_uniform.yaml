target:
  source_statement: 'Let f : GVec -> Q be a frame function on Q(i)^3 (IsFrameFunction f). Decide whether
    Archimedean continuity of f at every nonzero vector (IsArchimedeanContinuousEverywhere f: pointwise
    epsilon-delta continuity in the Euclidean squared distance distSqVec) implies uniform continuity on
    rays (IsUniformlyRayContinuous f: one rational delta per rational epsilon in the squared ray distance
    raySinSq). State separately the signed version (all frame functions) and the nonnegative version (IsNonnegFrameFunction
    f) needed for probability-valued Born reconstruction; the signed version implies the nonnegative one.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Prove pointwise-to-uniform for signed or, first, nonnegative rational frame functions,
    or give a counterexample satisfying the full frame identity and continuity everywhere. Nonnegative
    functions are bounded by frame completion; boundedness for the general signed pointwise case is not
    supplied. Existing selective-oscillation theorems exclude the cited nonzero finite valuation combinations
    by discontinuity at tomo_e1 under their stated hypotheses; they do not certify nowhere continuity
    of every sp. The small-cap argument rules out only that support construction. Suggested research:
    fixed-ray oscillation propagation or exact finite frame certificates with coefficients uniformly bounded
    as auxiliary rays approach fixed tomography anchors. Neither finite search failure nor arbitrary-chain
    approximation settles this node.'
  source_refs:
  - dag/research/pointwise_vs_uniform_note.md
