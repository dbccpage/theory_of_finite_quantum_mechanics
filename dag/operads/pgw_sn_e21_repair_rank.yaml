target:
  source_statement: Example E21 takes vertices a, b, c, d and edges (ab, bc, ac, cd, da), so the 1-cycle
    space has dimension 5 − rank ∂₁ = 5 − 3 = 2, with z₁ = (1,1,−1,0,0) for triangle abc and z₂ = (0,0,1,1,1)
    for triangle acd. Adjoining two faces with boundaries z₁ and z₂ gives rank ∂₂ = 2, ∂₁∂₂ = 0 and H₁
    = 0. Adjoining two free degree-two generators with the same boundary z₁ gives rank ∂₂ = 1 and dim
    H₁ = 1, so the receipt count is 2 while the repair rank is 1. Transport from orientation ca to the
    common basis edge ac needs e_ca = −e_ac, and a wrong sign gives ∂₁z ≠ 0.
