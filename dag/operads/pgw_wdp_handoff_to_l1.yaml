  source_statement: 'WDP hands onward a declared, certified degree-1 window: Φ₁([h]) = Φ_J([h]), the quotient
    infimum over repairs, certified for weighted ℓ¹ over ℚ by a matching repair and bounded circulation;
    Γ₂([h]) = ‖d₁h‖₁; the diagnostic trichotomy; and the observer discipline that a protected question
    passes through a report only when constant on its fibres. The 007 Local-Green/Global-Red series refuses
    the case in which every local check passes and the global check fails, and its Symbol Game integration
    sets the global verdict to 0 when Φ₁ > 0 or Γ₂ > 0, but it writes Φ₁(h) = ‖d₀h‖₁ (boundary leakage),
    which is not WDP''s quotient infimum. The 007 lesson states that no automatic identification with
    the PFP quantities phi1 or gamma2 is supplied, so an adapter from WDP''s quotient Φ₁ and Γ₂ to the
    LGGR global evaluator is owed. The DAG''s next stage is L1_EMERGENCE (TFQ-0005 declared L1 sector
    weights, TFQ-0349).'
