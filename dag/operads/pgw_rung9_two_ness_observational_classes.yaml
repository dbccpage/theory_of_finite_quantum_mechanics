    in this checkout (assumption)
  - Lean declaration SecondProfile.Carry.separable_iso at dbccpage/19L57G1@85a83ae7c, not elaborated in
    this checkout (assumption)
  source_bottleneck: separable_iso and collapsed_iso are stated forward only, the reverse being their
    application to the exchanged structure, which is not stated as a theorem; the class count as a number
    waits on a decision for collapse (X-1) and is a finite computation on the rectangle.
