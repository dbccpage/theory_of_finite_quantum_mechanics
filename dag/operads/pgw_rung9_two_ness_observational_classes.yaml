target:
  source_statement: 'Rung nine (pull request 264) takes X-6 for two-ness and observational classes: a
    regime holds two when some two admitted data are separable, and a representative list holds pairwise
    separable admitted data with every admitted datum collapsed with an entry. In Lean separability, collapse,
    holding two and representative lists are carried by the isomorphism with no hypothesis, collapse is
    reflexive, symmetric and transitive, and holding two needs two data, a form and an instance, so its
    first stage is four events from the empty regime and two from each Lean reading regime, both attained.
    Supply, datum, form and requirement admissions keep separable pairs, while an instance or a rule admission
    can end holding two. That two representative lists of one regime have one length, the class count
    as a number, is OPEN in Lean (T-1).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
