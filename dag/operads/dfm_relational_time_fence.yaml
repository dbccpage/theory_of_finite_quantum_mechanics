target:
  source_statement: For U = [[0, -1], [1, 0]] over Q, U^2 = -I, U^4 = I, and U^T U = I. For each t in
    {0, 1, 2, 3}, (U^{t+1})^T U U^t = I. For psi = (3/5, 4/5), psi·psi = 1 and (U^t)^T (U^t psi) = psi
    for each such t, while the first components of U psi and of U^2 psi differ from 3/5. A continuous-time
    reading, a Stone generator, and a Wheeler-DeWitt constraint stay unproved. For a supplied group-valued
    schedule, cumulative transport transforms by inverse terminal frame and initial frame, and a periodic
    frame cancels all edges iff total transport is identity. Normalized cycle blocks are identity on interior
    edges and total transport on the closing edge. A checked positive-period constructor returns a closure
    certificate or a distinct zero-period/nonclosure error. Supplied group actions admit an invertible
    change of history coordinates preserving the evolution law.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - continuous time and Stone generator
  - Hamiltonian constraint of a physical theory
  - group-valued schedule and group action
  source_bottleneck: The group, links, action, step and vector are supplied. General finite-cycle transport
    and its closure criterion are established for these inputs; deriving them from primitive difference,
    continuous time, a one-parameter unitary group and a Hamiltonian constraint stay open.
