target:
  source_statement: For U = [[0, -1], [1, 0]] over Q, U^2 = -I, U^4 = I, and U^T U = I. For each t in
    {0, 1, 2, 3}, (U^{t+1})^T U U^t = I. For psi = (3/5, 4/5), psi·psi = 1 and (U^t)^T (U^t psi) = psi
    for each such t, while the first components of U psi and of U^2 psi differ from 3/5. A continuous-time
    reading, a Stone generator, and a Wheeler-DeWitt constraint stay unproved.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - continuous time and Stone generator
  - Hamiltonian constraint of a physical theory
  source_bottleneck: The step and the vector are supplied. These four blocks are one witness, not a theorem
    for every period. Continuous time, a one-parameter unitary group, and a Hamiltonian constraint stay
    open.
