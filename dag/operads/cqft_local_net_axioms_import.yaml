target:
  source_statement: 'Imported structure: a spacetime with a causal order, and a family of unital star-algebras
    A(O) indexed by regions O with isotony (O1 inside O2 gives A(O1) inside A(O2)) and commutation of
    A(O1) and A(O2) when O1 and O2 are spacelike separated. The repository has finite strict posets (lean4/CausalOrder.lean)
    and finite matrix algebras, but no net over regions of a continuum and no Minkowski light cone; DS-QM033-064-074-083-QHELD-CONTINUUM
    records the light-cone causality as an external L2 lift.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - spacetime with causal order (assumption)
  - net of local algebras with isotony and locality (assumption)
  source_bottleneck: The counts and products are one supplied four-point order and four supplied integer
    matrices. They are not a net indexed by continuum regions and not a Minkowski light cone. The Haag-Kastler
    import and the external light-cone lift named by DS-QM033-064-074-083-QHELD-CONTINUUM stay open. CausalOrder.lean
    is not a premise of a continuum theorem in this record.
