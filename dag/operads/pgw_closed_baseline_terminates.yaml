target:
  source_statement: 'With the external continuation policy disabled, the closed-system baselines are small:
    reading L has 4 nodes and 3 terminal branches, reading F has 20 nodes and 16 terminal branches, and
    both have zero guard-cut, round-cut and open branches. Every maximal branch ends at the all-pairs-separated
    fixpoint within the pair bound, using 1 round in L (bound 1) and 3 in F (bound 3), and the termination
    flag is computed over all maximal branches rather than from one terminal node. Under the declared
    round shape a closed run from an empty requirement store makes at most n(n−1)/2 rounds (closedRun_round_bound_from_empty).'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Declared resource bounds of genesis_source.txt section 1 with the external continuation policy disabled
    (assumption)
  source_bottleneck: 'A bounded theorem: termination of every maximal branch is computed within the declared
    bounds, and that each exported round has the declared shape (one fresh imposition, no fresh-datum
    item) stays computational.'
