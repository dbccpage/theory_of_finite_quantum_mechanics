  source_statement: A matrix A descends through the phase-blind population report iff every row has at
    most one nonzero entry, provided the quotient retains the zero vector as a distinct output; without
    the retained zero point the claim is false on projective space (A = [[1,1],[1,1]]).
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - sector basis and quadratic readout (assumption)
