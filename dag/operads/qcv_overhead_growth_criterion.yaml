node_id: QCV-OVERHEAD-GROWTH-CRITERION
authority_effect: None
collection_status: source_candidates_collected_semantic_mining_open
target:
  source_statement: For p(k+1) = c(k)*p(k)^2 with c(k) >= 0, p(k) = p(0)^(2^k)*amp(k) with amp(0) = 1,
    amp(k+1) = c(k)*amp(k)^2, and some p(0) > 0 has p(k) tending to zero iff some M > 0 has amp(k) <=
    M^(2^k) for all k; the criterion holds for c(k) <= C, for c(k) <= A*B^(k+1) with A, B >= 1, for c(k)
    = (k+1)^2, and for c(k) <= a*b^N(k) with block size N(k+1) <= s*N(k), s < 2; it fails for c(k) >=
    a*b^(2^k) with a > 0, b > 1, and for c(k) >= a*b^N(k) with 2^k <= N(k), b > 1, where no positive p(0)
    has p(k) tending to zero.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The families are exact illustrations of the criterion, not claims that any physical
    overhead has such a form; correlated-noise strength as an exponential of block size is a declared
    toy.
  source_refs:
