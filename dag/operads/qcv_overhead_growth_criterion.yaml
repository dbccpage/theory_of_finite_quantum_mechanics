  signature_excerpt: |-
    def concv (c : ℕ → ℚ) (p : ℚ) : ℕ → ℚ
      | 0 => p
      | k + 1 => c k * (concv c p k) ^ 2

    /-- The overhead amplification `amp c`: `amp 0 = 1`, `amp (k + 1) = c k * amp k ^ 2`, equal to the
    product of `c j ^ (2 ^ (k - 1 - j))` over `j < k`. -/
    def amp (c : ℕ → ℚ) : ℕ → ℚ
      | 0 => 1
      | k + 1 => c k * (amp c k) ^ 2

    theorem concv_eq_amp (c : ℕ → ℚ) (p : ℚ) (k : ℕ) : concv c p k = p ^ (2 ^ k) * amp c k
  source: lean4/QcConcatenation.lean
