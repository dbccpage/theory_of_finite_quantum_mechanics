target:
  source_statement: For the Tao matrix S6 and each of the 20 balanced sign vectors g (three +1, three
    -1), |sum_j prod_r S_rj^{g_r}|^2 = 9, computed over the integer Eisenstein table and over C with w
    = -1/2 + i sqrt 3/2.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'This is a finite evaluation for one matrix; without Conjecture 2 for arbitrary MU
    triples it gives no nonextension statement, and the source wording as an l1 operator norm does not
    match the computed quantity. Relation to OpenAI: its Fourier-vanishing theorem exempts exactly the
    Tao class, and the repository phase table equals OpenAI taoExponent after the index involution (3
    5) (exhaustive search; lean4/MubOpenAIBridge.lean tao_phase_bridge, build pending), so this evaluation
    concerns the exceptional matrix. It is not an obstruction to extension.'
