target:
  source_statement: For 3 by 3 integer matrices, let B have rows (1, 1, 0), (0, 1, 1) and (0, 0, 1), let
    E be the identity, and let C have rows (0, 1, 0), (0, 0, 1) and (1, 0, 0). The matrix with rows (1,
    -1, 1), (0, 1, -1) and (0, 0, 1) is a two-sided inverse of B. The matrix D with rows (1, -1, 0), (-1,
    1, -1) and (-1, 0, 0) equals the negative of C times the transpose of E times the transpose of that
    inverse, and C times the transpose of E plus D times the transpose of B is the zero matrix. The same
    sum with the zero matrix in place of D is not the zero matrix.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Cardenes Wuttig and Tindall, finite-corner classification of CHM(6), arXiv:2608.18053v2, external
    Lean pin 57b03025
  source_bottleneck: 'This record is that one integer block identity. It does not classify complex Hadamard
    matrices, does not list retained finite corners, and does not equate quartet existence with completion
    of an external reconstruction. The complex adjoint is not identified with this integer transpose.
    Exclusion over every retained reconstruction stays open. AuthorityEffect: None.'
