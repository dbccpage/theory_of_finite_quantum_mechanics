target:
  source_statement: QM-221 projects one-gluon exchange onto four rational channel factors at N_c=3. The
    color-singlet quark-antiquark factor is -C_F=-4/3, the color-octet factor is 1/6, the symmetric sextet
    diquark factor is 1/3, and the antisymmetric antitriplet diquark factor is -2/3. Lean suNSingletChannelCoeff,
    suNOctetChannelCoeff, suNSextetChannelCoeff, and suNAntitripletChannelCoeff record those signs over
    Rat. The Rust report stores the same four strings. These are quadratic Casimir arithmetic on a three-dimensional
    matrix carrier. They are not meson or baryon wavefunctions, and they do not state a binding energy.
