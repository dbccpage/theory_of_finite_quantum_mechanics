target:
  source_statement: Two readings of the K5 torsion must stay apart. The opening of pauli_spin_statistics_graph_finite_map.md
    states rank_Q of the square boundary as 7 and the rational 2-complex Betti number as 14. The Rust
    test and the Lean literals use rational Betti number 6 and F2 Betti number 7, hence torsion rank 1.
    Lean also says whether the exchange loop represents that torsion class is not established. A Python
    comment in analyze_conf2_graph speaks as if the torsion forces the exchange loop to have order 2.
    The rank mismatch and the representative question are an open gap beside the certificate.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Reconcile the map's K5 ranks with the Rust certificate and leave the exchange-loop
    representative unresolved.
