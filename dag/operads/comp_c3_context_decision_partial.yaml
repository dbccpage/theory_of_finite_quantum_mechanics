  signature_excerpt: |-
    theorem unarySep_iff (r : Regime) (i j : Nat) :
        UnarySep r i j ↔ ∃ f ∈ List.range r.forms.length, r.forms.getD f 0 = 1 ∧
          ((f, [i]) ∈ r.insts ∧ (f, [j]) ∉ r.insts ∨ (f, [j]) ∈ r.insts ∧ (f, [i]) ∉ r.insts)
  source: lean4/GenesisComputation.lean
