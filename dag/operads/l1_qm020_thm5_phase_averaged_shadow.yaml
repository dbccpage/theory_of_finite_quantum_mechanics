target:
  source_statement: Under a chosen Hilbert lift with independent Haar-uniform phases, E |<u, psi(theta)>|^2 =
    sum |u_gamma|^2 w_gamma. Worked replay w=(2,1,1) gives 37/16. Rust replaces Haar by a declared finite phase
    group (decided for n <= 3). The paper says it must not be upgraded without full Hilbert and Haar discharge.
  statement_status: source_claim_to_scope_check_not_accepted_result
