target:
  source_statement: 'Chapter 21 names, for each result family, the small countermodel that would refute
    it: quotient well-definedness fails if a representative change alters the value, cohomology language
    fails if d₁d₀ ≠ 0, a weighted-ℓ¹ Φ₁ is uncertified without a matching repair and bounded circulation,
    the signature bound fails on a class with Γ₂ > ‖d₁‖_{J→1}Φ₁, a coefficient-free claim fails on RP²,
    projection onto ker d₁ is not a repair, and growth cannot lower Φ₁. Its §21.8 records the nineteen
    registered open targets as resolved at finite or conditional scope, while the enlarged source-derivation
    obligations (Appendix L) and analytic and physical-model obligations (Appendix M) remain open. Chapter
    22 restates a trunk (admitted cut, typed witnesses, symmetry, cochains, succession, duration, finite
    probability), an observer/measurement waist with authority outside the chain, and three branches,
    and sorts ambition into four tiers, with Tier 4, unique selection of continuous spacetime, ℂ, U(1),
    Gleason frame uniqueness or the Born rule from primitive difference, explicitly refused. WDP-CH22-C01
    concludes that every transition from residual to retention, order, magnitude, probability, observer,
    observation, measurement, history or quantum-capable representation is exposed as a typed construction
    with a visible assumption cost.'
