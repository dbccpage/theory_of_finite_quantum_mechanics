  source_statement: 'Axis 2. Let eval_n be the evaluator of a process on carrier K_n. The statement "eval_n
    is sound" relates eval_n to a standard of correctness for K_n; that standard is not an element of
    K_n, so the statement is a sentence of a carrier K_(n+1), and the output PASS of eval_n on it has
    no standing at K_(n+1) (ENC-0195, AuthorityEffect None). The level statement holds by construction
    of the carrier hierarchy. Imported: the strengthening by Tarski''s undefinability theorem, which applies
    only when K_n interprets enough arithmetic, and the Genesis identifiers ENC-0118 and ENC-0195, cited
    by name.'
