target:
  source_statement: Let V = Q(i)^3 with the standard Hermitian form. Decide whether every function f from
    the nonzero vectors of V to Q with f(u) + f(v) + f(w) = 1 for every orthogonal triple of nonzero vectors
    has the form f(v) = <v, rho v>/<v, v> for a Hermitian trace-one 3 x 3 matrix rho over Q(i), or exhibit
    one that does not; state separately the signed, nonnegative and {0,1}-valued variants, and whether
    the non-quadratic Q^3 frame function extends to Q(i)^3.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: The {0,1}-valued variant is excluded by a finite real-ray obstruction. The specific
    exotic Q^3 frame function has no signed extension, by an exact finite linear certificate. Nine-ray
    Hermitian tomography reconstruction, operator-space ray projector duality and nine-ray spanning of
    HermForm3, non-unit orthogonal frame sums, zero-vector normalization, the signed and bounded nonnegative
    residual-reduction equivalences, the (1+i)-adic norm-parity characterization on primitive Gaussian-integer
    vectors, the explicit global {-1, 0, +1}-valued 3-adic and 7-adic zero-weight residuals s3 and s7
    and {0, 1/3, 2/3}-valued nonnegative non-quadratic frame functions exoticQi3 = (1 + s3) / 3 and exoticQi7
    = (1 + s7) / 3 (settling both signed and nonnegative quadratic rigidity on Q(i)^3 in the negative),
    their dual Kronecker-delta evaluation on (witness_111, witness_p7) and 2D linear independence (combResidual37),
    and Section 9 elimination theorems (selective cross-prime archimedean discontinuity at tomo_e1, joint
    Q(i, sqrt(3))^3 and Q(i, sqrt(7))^3 even-valuation frame obstruction, and operator-space projector
    linearity quadratic_rigidity_iff_factorsThroughRayProjLinear / factorsThroughRayProjLinear_combResidual37_iff)
    are formalized in lean4/BornGaussianTomographyReduction.lean. Uniform prime-indexed formalization
    of s_p for all inert primes p == 3 (mod 4) without projector linearity and closure of FQ-GAP-BORN-UNIQUENESS-GLEASON
    remain open.
