    original_target: For an l1 residual v with mass M(v) > 0, psi(v)_i = sgn(v_i) sqrt(|v_i| / M(v)) gives
      the rank-one real projector rho(v) = psi psi^T, a real L2 lift. The alignment statistic Xi = (1/2)
      ||rho(h*) - rho(phi*)||_tr is strictly below 1 by complementary slackness. Xi depends on coordinate
      order and is undefined at zero residual. It does not derive QM.
