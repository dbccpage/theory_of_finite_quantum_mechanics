      needs positive dual capacity on the active residual (or another nonzero-overlap hypothesis). This
      is an explicit ceiling on the terse target wording, not a refutation of a source theorem with positive
      weights. Output layout: [0]undefined else1,masses2,rho4,sigma4,overlap,Xi²,saturated,positive_active_capacity,strict'
