target:
  source_statement: For an l1 residual v with mass M(v) > 0, psi(v)_i = sgn(v_i) sqrt(|v_i| / M(v)) gives the
    rank-one real projector rho(v) = psi psi^T, a real L2 lift. The alignment statistic Xi = (1/2) ||rho(h*) -
    rho(phi*)||_tr is strictly below 1 by complementary slackness. Xi depends on coordinate order and is undefined
    at zero residual. It does not derive QM.
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: &id001
  - 'real square roots (real field): lift'
  - 'trace norm on real symmetric matrices: lift'
  source_bottleneck: Prose proofs of the strict bound are not in Lean. Rust xi.rs uses f64 (XiResult::value returns
    f64), so it is numeric evidence only. Lean symbols in Xi.lean not individually grepped.
