target:
  source_statement: 'Formalized finite statement. For a FiniteStrictPoset P on n points put one qubit
    at each point; for a subset O of P let A(O) be the matrices on the qubits in O, acting as identity
    elsewhere. (a) Isotony: O1 inside O2 gives A(O1) inside A(O2). (b) Locality: if every point of O1
    is spacelike to every point of O2, then O1 and O2 are disjoint and A(O1) and A(O2) commute. (c) The
    spacelike relation is symmetric and irreflexive and not transitive: on the four-element N poset 0<2,
    1<2, 1<3, points 0 and 1 are spacelike, 0 and 3 are spacelike, and 1<3 are related. Statements (a)
    and (b) hold for tensor-product nets; the content of Haag-Kastler locality (commutation forced by
    causal separation of dynamics) is absent because this net has no dynamics.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 for finite poset tensor-product nets and the 4-element N poset.
    Dynamics, a time-slice property and Poincare covariance are not modelled, so the statement is the
    finite shadow of two axioms and nothing more.
