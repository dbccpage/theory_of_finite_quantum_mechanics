target:
  source_statement: 'Finite statement, checked in Lean 4 for site-factorized operators. For a FiniteStrictPoset
    P on n points put one qubit (a single-site monoid M) at each point; an operator A : Fin n -> M is
    localized in a subset O of P when it is the identity outside O, so the Lean "algebra" of O is the
    set of elementary tensor operators localized in O, not the full matrix algebra on the qubits in O.
    (a) Isotony: O1 inside O2 and A localized in O1 imply A localized in O2. (b) Locality: if every point
    of O1 is spacelike to every point of O2, then O1 and O2 are disjoint and operators localized in O1
    and in O2 commute under the sitewise product. (c) The spacelike relation of CausalOrder.lean is symmetric
    (spacelike_symm) and irreflexive (spacelike_irrefl) and not transitive: on the four-element N poset
    0<2, 1<2, 1<3, points 1 and 0 are spacelike, 0 and 3 are spacelike, and 1<3 are related. The content
    of Haag-Kastler locality (commutation forced by causal separation of dynamics) is absent because this
    net has no dynamics.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: 'Not proved in Lean: the statements for the full local matrix algebras A(O) (linear
    spans of elementary tensors, for example 2^|O| x 2^|O| matrices): that commutation of elementary tensors
    extends by bilinearity to the algebras and that A(O1) is a subalgebra of A(O2) as matrix algebras;
    the single-site monoid M is generic and is not instantiated at 2x2 matrices. The net is kinematical:
    dynamics, a time-slice property and covariance are not modelled, so the statement is the finite shadow
    of two axioms and nothing more.'
  source_refs:
