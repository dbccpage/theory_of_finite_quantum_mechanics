target:
  source_statement: 'Target: on a finite slab lattice the chiral variation of the boundary fermion determinant
    cancels the bulk Chern-Simons variation. Not established in this checkout. One tested candidate does
    not realize it, as expected: on open Wilson slabs with U(1) links, the gauge change acts on the Wilson
    matrix by a diagonal similarity, so the full, interior, boundary Schur and fixed site-matched chiral-block
    determinants are gauge invariant by construction, while a lifted cup-product CS term whose coefficient
    is not derived from the fermions changes by 1/32. This is a fixed-basis truncation of a vector-like
    regulator, not an obstruction to lattice inflow.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions:
  - Callan-Harvey continuum anomaly inflow (literature)
  source_bottleneck: Construct a regulated chiral boundary determinant whose projector, basis or measure
    depends on the gauge field (domain-wall or overlap/Ginsparg-Wilson type), derive from the same fermions
    the bulk Chern-Simons term they induce, and show that the two gauge variations cancel. The fixed-basis
    Wilson-slab test cannot register an anomaly, because site-matched fixed bases give similarity-invariant
    determinants; its bare lifted CS candidate is neither induced by the fermions nor well defined on
    U(1) links (an integer lift of the same links changes it by 1/8). The continuum Callan-Harvey mechanism
    remains a literature import.
  source_refs:
  - dag/derivations/26_fsp/tfq_1199_fsp_lattice_anomaly_inflow.md
  - papers/core/fsp/theory_of_finite_fsp.md
  - papers/core/fsp/the_problem_of_the_fermion_sign.md
  - papers/core/fsp/the_problem_of_the_fermion_sign_claim_ledger.md
  paper_refs:
  - dag/derivations/26_fsp/tfq_1199_fsp_lattice_anomaly_inflow.md
