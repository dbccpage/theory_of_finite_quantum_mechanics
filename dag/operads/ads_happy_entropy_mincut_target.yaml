target:
  source_statement: 'Finite statement to formalize. Contract six copies of the perfect tensor of the previous
    target on the {5,4} pentagon tiling: one central tensor and its five edge-neighbours. The edge-neighbours
    are not adjacent to each other, so the patch has 20 dangling boundary legs (4 per outer tensor) and
    6 bulk legs. Fix every bulk leg in the logical zero state. For every contiguous interval A of boundary
    legs, compute the entropy S(A) in bits by GF(2) rank and compare it with the minimal number of bonds
    cut by a curve separating A from its complement, listing the intervals with equality. The source states
    that the Ryu-Takayanagi formula holds exactly in many cases (regions whose minimal cut is a greedy
    geodesic), not for every region; the target is to determine which intervals satisfy it on this patch.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Exact GF(2) linear algebra on a 26-qubit stabilizer state. The bond-count cut is
    graph min-cut. The correspondence to a surface area is the imported formula and is not part of the
    target.
