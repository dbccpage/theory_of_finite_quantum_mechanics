target:
  source_statement: 'Formalized finite statement. Contract six copies of the six-leg perfect tensor on
    the {5,4} pentagon tiling: one central tensor and its five edge-neighbours, with 20 dangling boundary
    legs (4 per outer tensor) and 6 bulk legs fixed in the logical zero state. Checked in Lean 4: the
    induced 20-qubit boundary stabilizer has 20 pairwise-commuting generators of full GF(2) rank 20; across
    all 380 proper contiguous boundary intervals A (20 lengths from 1 to 19 at 20 starting positions),
    the binary entropy S(A) equals the minimal bond-cut count of the planar dual graph on all 380 intervals.'
  statement_status: source_claim_to_scope_check_not_accepted_result
  declared_assumptions: []
  source_bottleneck: Checked in Lean 4 by exact GF(2) rank elimination and dual-graph min-cut across all
    380 proper contiguous boundary intervals of the 6-tensor pentagon patch. The correspondence to a continuum
    minimal-surface area is imported and not part of this target.
