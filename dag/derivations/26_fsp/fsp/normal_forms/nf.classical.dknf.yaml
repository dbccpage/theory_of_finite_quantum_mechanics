schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.dknf
  name: Domain-Key Normal Form
  short_name: DKNF
  version: v0
  theory_status: established
  contract_status: active
  verification_status: executable
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: general integrity constraint not logically implied by domain constraints and key constraints
    alone
  preserves_invariant: all relvar constraints are logical consequences of declared domains and candidate
    keys
  protected_skeleton:
  - domains
  - candidate_keys
  - domain_constraints
  - key_constraints
  erased_structure: []
  non_claims:
  - orthogonal constraint normal form (does not strictly linearly follow 6NF)
  - general DKNF reachability is undecidable for arbitrary predicates
  - does not certify runtime repair without cochain substrate
  - does not imply authorization
declarations_required:
- heading
- domains
- candidate_keys
- general_constraints
- domain_constraints
- key_constraints
- relation_predicate
evidence_required: []
validation_criteria:
- every declared constraint is logically deducible from domain constraints and candidate key constraints
  alone
- constraints requiring inter-attribute or table-wide predicates outside domains/keys terminalize as constraint
  refactoring obligations
proof_obligations:
- id: dknf.fagin_ultimate_normal_form
  status: theorem_shaped
  ref: https://research.ibm.com/publications/a-normal-form-for-relational-databases-that-is-based-on-domains-and-keys
  statement: A relvar in DKNF is free of all general insertion/deletion/update anomalies that can be prevented
    by domain and key constraints
terminal_routes:
- Accept
- RejectNonDomainKeyConstraint
- RequireConstraintRefactoring
terminal_route_map:
  Accept: Preserve
  RejectNonDomainKeyConstraint: Reject
  RequireConstraintRefactoring: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: discount rule requires inter-attribute validation not expressible as domain or key constraints
  diagnosis: non-domain-key constraint violating DKNF
  terminal: RejectNonDomainKeyConstraint
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- https://research.ibm.com/publications/a-normal-form-for-relational-databases-that-is-based-on-domains-and-keys
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
