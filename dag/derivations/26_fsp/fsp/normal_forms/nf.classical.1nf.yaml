schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.1nf
  name: Atomic Domain First Normal Form
  short_name: 1NF
  version: v0
  theory_status: established
  contract_status: active
  verification_status: absent
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: hidden nested structure / repeated groups / non-atomic attribute domains
  preserves_invariant: relation body is a set of tuples over atomic domains with declared candidate keys
  protected_skeleton:
  - heading
  - domains
  - tuple_atomicity
  - candidate_keys
  erased_structure: []
  non_claims:
  - does not certify runtime repair
  - does not imply authorization
  - does not resolve functional dependency or join dependency anomalies
declarations_required:
- heading
- domains
- candidate_keys
- relation_predicate
evidence_required: []
validation_criteria:
- every attribute value belongs to declared atomic domain
- no column encodes repeated values or multi-attribute structures (e.g. unparsed CSV, nested lists) without
  explicit domain contract
- tuple identity derives from declared candidate key, not physical row position
proof_obligations:
- id: 1nf.set_semantics_and_domain_admissibility
  status: theorem_shaped
  ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  statement: Every 1NF relvar is a true mathematical relation with distinct tuples and atomic domain values
terminal_routes:
- Accept
- RejectNestedCarrier
- RejectUntypedRepeatedGroup
terminal_route_map:
  Accept: Preserve
  RejectNestedCarrier: Reject
  RejectUntypedRepeatedGroup: Reject
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: invoice line items stored as CSV in one column
  diagnosis: non-atomic carrier violating 1NF
  terminal: RejectNestedCarrier
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
- ./normal_form_contract_schema.yaml
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
