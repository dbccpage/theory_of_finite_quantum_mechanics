schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.eknf
  name: Elementary Key Normal Form
  short_name: EKNF
  version: v0
  theory_status: established
  contract_status: draft
  verification_status: absent
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: elementary key dependency anomaly where an elementary non-key determinant violates
    BCNF without elementary key attribute defense
  preserves_invariant: for every elementary functional dependency X -> A, either X is a superkey or A
    is an elementary-key attribute (an attribute belonging to an elementary key, where an elementary key
    is a key appearing as the determinant of an elementary FD)
  protected_skeleton:
  - candidate_keys
  - functional_dependencies
  - elementary_functional_dependencies
  - elementary_keys
  - elementary_key_attributes
  erased_structure: []
  non_claims:
  - does not replace full BCNF (allows elementary-key attribute defense)
  - elementary key attributes are strictly narrower than general prime attributes (a prime attribute belonging
    only to non-elementary keys does not qualify)
  - does not guarantee runtime repair without explicit cochain substrate
  - does not imply authorization
declarations_required:
- heading
- candidate_keys
- functional_dependencies
- elementary_functional_dependencies: X -> A where A not in X and for no proper subset Y subset X does
    Y -> A hold
- elementary_keys: minimal candidate keys that appear as the determinant of some elementary functional
    dependency
- elementary_key_attributes: attributes belonging to at least one elementary key
- relation_predicate
evidence_required: []
validation_criteria:
- for every elementary functional dependency X -> A, either X is a superkey or A is an elementary-key
  attribute
- elementary FD violations terminalize as decomposition requirements
proof_obligations:
- id: eknf.subsumption_of_3nf
  status: theorem_shaped
  ref: https://dl.acm.org/doi/pdf/10.1145/319732.319749
  statement: Every relvar in EKNF is in 3NF, and every relvar in BCNF is in EKNF
terminal_routes:
- Accept
- RejectElementaryKeyAnomaly
- RequireDependencyPreservingDecomposition
terminal_route_map:
  Accept: Preserve
  RejectElementaryKeyAnomaly: Reject
  RequireDependencyPreservingDecomposition: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: elementary functional dependency X -> A has non-superkey determinant X and non-elementary key
    attribute A
  diagnosis: elementary key anomaly violating EKNF condition
  terminal: RejectElementaryKeyAnomaly
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- https://dl.acm.org/doi/pdf/10.1145/319732.319749
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
