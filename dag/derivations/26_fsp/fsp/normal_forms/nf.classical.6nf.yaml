schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.6nf
  name: Sixth Normal Form
  short_name: 6NF
  version: v0
  theory_status: established
  contract_status: active
  verification_status: executable
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: non-trivial join dependency on decomposed projections
  preserves_invariant: relvar satisfies no non-trivial join dependency (all join dependencies are trivial)
  protected_skeleton:
  - candidate_keys
  - irreducible_attributes
  - trivial_join_dependencies
  erased_structure: []
  non_claims:
  - does not imply practical performance optimality for wide OLTP tables
  - does not require every production schema to decompose to 6NF
  - does not certify runtime repair without cochain substrate
  - does not imply authorization
declarations_required:
- heading
- candidate_keys
- join_dependencies: asserted that all JDs are trivial
- relation_predicate
evidence_required: []
validation_criteria:
- relvar satisfies no non-trivial join dependency (every join dependency satisfied by the relvar is trivial)
- relvar consists of a candidate key and at most one non-key attribute (or purely key attributes)
- non-trivial join dependencies terminalize as irreducible decomposition obligations
proof_obligations:
- id: 6nf.trivial_jd_characterization
  status: theorem_shaped
  ref: https://en.wikipedia.org/wiki/Sixth_normal_form
  statement: A relvar R is in 6NF iff every non-trivial join dependency on R is trivial (R cannot be decomposed
    non-loss into multiple proper projections)
terminal_routes:
- Accept
- RejectNonTrivialJoinDependency
- RequireIrreducibleFactDecomposition
terminal_route_map:
  Accept: Preserve
  RejectNonTrivialJoinDependency: Reject
  RequireIrreducibleFactDecomposition: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: relvar contains candidate key and two non-key attributes that can be nonloss decomposed into
    two separate 6NF relvars
  diagnosis: presence of non-trivial join dependency violating 6NF
  terminal: RequireIrreducibleFactDecomposition
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
