schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.5nf
  name: Project-Join Normal Form / Fifth Normal Form
  short_name: 5NF
  version: v0
  theory_status: established
  contract_status: active
  verification_status: absent
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: non-key-implied join dependency anomalies / cyclic join anomalies
  preserves_invariant: every non-trivial join dependency *(R_1, ..., R_n) that holds on the relvar is
    implied by its candidate keys (every component R_i is a superkey)
  protected_skeleton:
  - candidate_keys
  - join_dependencies
  - superkeys
  - projections
  erased_structure: []
  non_claims:
  - does not imply practical performance benefit
  - does not certify runtime repair without cochain substrate
  - does not imply authorization
  - distinguishes between boundary query shell (Shell2) and topological fill (Fill2) in higher structures
declarations_required:
- heading
- candidate_keys
- explicitly_declared_join_dependencies: '*(R_1, R_2, ..., R_n)'
- relation_predicate
evidence_required: []
validation_criteria:
- every explicitly declared non-trivial join dependency *(R_1, ..., R_n) is implied by candidate keys
  (each component R_i contains a candidate key)
- non-key join dependencies require projection-join decomposition
- decompositions preserve the declared predicate under lossless join
proof_obligations:
- id: 5nf.fagin_project_join_theorem
  status: theorem_shaped
  ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  statement: In 5NF/PJNF, every join dependency is implied by candidate keys, eliminating all redundancy
    constructible by projection and join
terminal_routes:
- Accept
- RejectNonKeyJoinDependency
- RequireProjectionJoinDecomposition
terminal_route_map:
  Accept: Preserve
  RejectNonKeyJoinDependency: Reject
  RequireProjectionJoinDecomposition: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: supplier-part-project ternary facts are constrained by a cyclic 3-way join dependency where
    no component is a candidate key
  diagnosis: non-key join dependency violating 5NF
  terminal: RejectNonKeyJoinDependency
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
- ./normal_form_contract_schema.yaml
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
