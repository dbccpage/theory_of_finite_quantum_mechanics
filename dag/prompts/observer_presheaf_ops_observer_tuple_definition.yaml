node_id: OPS-OBSERVER-TUPLE
research_stage: OBSERVER_PRESHEAF
authority_effect: None
workflow: ../pfp/workflow.yaml
mode: ../pfp/mode.yaml
stage_contracts: ../pfp/stage_contracts.yaml
default_stage: P0_MINE_OPERAD
