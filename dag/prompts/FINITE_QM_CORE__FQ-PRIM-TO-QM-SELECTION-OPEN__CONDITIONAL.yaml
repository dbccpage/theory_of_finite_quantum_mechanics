operad_slots:
  slot_m1_layer0_ambient_carrier:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M1_CARRIER_AND_NORMAL_FORM_MINING
    algebraic_ring: Z (exact state-parameter dimension counting across diagonal, rebit, and qubit)
    ambient_carrier: 7-stage relational operad chain (D_2, D_3, D_2xD_3, D_3^2, D_3^3) and d=3 state manifolds
    normal_form_contracts:
    - nf.cochain.dhnf
    - nf.epistemic.authority
    observer_budget: B_O = 100 (exact integer accounting, zero float tolerance)
    p_star_cochain_syndrome:
      carrier_graph: C_4(V=4, E=4, F=1) with gauge root v_0 = 0
      spanning_tree_edges:
      - edge:
        - 0
        - 1
        du: 100
      - edge:
        - 1
        - 2
        du: -300
      - edge:
        - 2
        - 3
        du: 350
      chord_edge:
        edge:
        - 0
        - 3
        measured_omega: -50
      coboundary_law: v_b - v_a = du_e on tree; chord_potential = v_3 - v_0; gamma_2 = |measured_omega - chord_potential|
  slot_m2_layer1_forward_morphisms:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M2_OPERAD_MORPHISMS_AND_GRAFTING_TREE_MINING
    operad_family_id: OP-FQ-PRIM-TO-QM-PARAMETER-GAP
    incoming_routes:
    - FQ-R-GAP-PRIM-TO-SELECTION
    outgoing_routes: []
    source_colours:
    - CochainCarrierC4
    - FiniteShadowSpan
    - CountermodelSpan
    - ImportBoundaryList
    target_colour: TypedDerivationCertificate
    operators:
    - id: op_stage1_p_star_syndrome
      signature: (CochainCarrierC4) -> PStarSyndromeReceipt
      arity: 1
      rule: Integrate tree coboundaries v_1, v_2, v_3 from v_0=0, evaluate chord_potential = v_3 - v_0, and compute
        holonomy_gamma2 = |measured_omega - chord_potential|.
    - id: op_finite_shadow_witness
      signature: (FiniteShadowSpan) -> ExactIntegerShadowWitness
      arity: 1
      rule: 'Evaluate exact finite shadow identity: d3_parameter_hierarchy: diag_params(3-1=2) + rebit_params(3*4/2-1=5)
        + qubit_params(3^2-1=8) == 15 -> 2 + 5 + 8 == 15.'
    - id: op_countermodel_separation
      signature: (CountermodelSpan) -> ExactCountermodelWitness
      arity: 1
      rule: 'Evaluate exact finite countermodel/obstruction: d3_qubit_minus_diagonal_parameter_gap: (3^2 - 1) -
        (3 - 1) == 6 unfixed coherence parameters -> 8 - 2 == 6.'
    - id: op_import_boundary_certificate
      signature: (PStarSyndromeReceipt, ExactIntegerShadowWitness, ExactCountermodelWitness, ImportBoundaryList)
        -> TypedDerivationCertificate
      arity: 4
      rule: Bind unpaid_import_count, refuse unconditional promotion (unconditional_promotion_refused = true), and
        attach Lean 4 and Rust anchors.
    planar_grafting_sequence:
    - op_stage1_p_star_syndrome -> slot_0(op_import_boundary_certificate)
    - op_finite_shadow_witness -> slot_1(op_import_boundary_certificate)
    - op_countermodel_separation -> slot_2(op_import_boundary_certificate)
    - ImportBoundaryList -> slot_3(op_import_boundary_certificate)
  slot_m3_layer2_ideals_and_annihilators:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M3_CONGRUENCE_IDEALS_AND_DECOY_ANTIBODIES_MINING
    concrete_spans:
      node_statement: 'Primitive difference does not select the declared quantum model or readout. Direct packet-walk
        execution is an integration result: the complexes, Cayley parameter, cyclotomic weights, detector and squared-amplitude
        readout were supplied independently of the computed difference value.'
      node_bottleneck: Finite D2, D3, D2xD3, D3^2, and D3^3 projectors and the state-manifold dimension gap d-1
        < d^2-1 are mechanized without free parameters; full continuum M_n(C) and Gleason n>=3 remain explicit external
        imports.
      imported_assumptions:
      - all of FQ-DECLARED-QUANTUM-INTERFACE (assumption)
      finite_shadow_lhs_expr: 2 + 5 + 8
      countermodel_lhs_expr: 8 - 2
      raw_candidate_rival_int: 37
      coboundary_gauge_shift_int: 24
      sign_double_count_int: 7
    congruence_ideals:
    - 'IDEAL_ZERO_FLOAT_TOLERANCE: All output numbers must be exact integers (no floats).'
    - 'IDEAL_AUTHORITY_EFFECT_NONE: authority_effect == ''None'' and firewall_status == ''stated region only; mints
      no authority.'''
    - 'IDEAL_COCHAIN_D1D0_ZERO: cochain_d1_d0_exact_zero == true on the P* C_4 complex.'
    - 'IDEAL_QUOTIENT_COBOUNDARY_ANNIHILATION: Both coboundary_gauge_shift G_cob and boundary sign_double_count
      S_decoy lie in Congruence Ideal I and must be subtracted from R_raw.'
    - 'IDEAL_NON_PROMOTION_FENCE: Node status is CONDITIONAL; under SPK-001 (stated region only; mints no authority),
      unconditional_promotion_refused MUST be true even when status is PROVED_LEAN, DEFINITION, or ADMITTED_PRIMITIVE.'
    annihilator_antibodies:
    - antibody_id: AB_RAW_RIVAL_DECOY_TRAP
      target_decoy: Reporting unquotiented R_raw=37 or partially quotiented R_raw - G_cob=13 instead of 8 - 2 ==
        6
      refutation_witness: 'NullTree: Congruence Ideal I annihilates both G_cob=24 and S_decoy=7, leaving 6.'
    - antibody_id: AB_FALSE_UNCONDITIONAL_PROMOTION
      target_decoy: Setting unconditional_promotion_refused = false because DAG status is CONDITIONAL
      refutation_witness: 'NullTree: SPK-001 firewall refuses unconditional authority/continuum promotion for all
        DAG statuses.'
    - antibody_id: AB_CONTINUUM_FLOAT_DRIFT
      target_decoy: Emitting floating-point approximations instead of exact integer invariants
      refutation_witness: 'NullTree: G0_STRICT_TYPED_JSON_SCHEMA rejects non-integer scalars.'
  slot_m4_tri_language_witness_anchors:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M4_TRI_LANGUAGE_EXACT_WITNESS_MINING
    finite_shadow_equation: 'd3_parameter_hierarchy: diag_params(3-1=2) + rebit_params(3*4/2-1=5) + qubit_params(3^2-1=8)
      == 15'
    finite_shadow_lhs: 2 + 5 + 8
    finite_shadow_rhs: '15'
    finite_shadow_expected_int: 15
    countermodel_equation: 'd3_qubit_minus_diagonal_parameter_gap: (3^2 - 1) - (3 - 1) == 6 unfixed coherence parameters'
    countermodel_lhs: 8 - 2
    countermodel_rhs: '6'
    countermodel_expected_int: 6
    unpaid_import_count_expected: 1
    lean4_theorem_anchor: lean4/quantum_mechanics/DerivationDagQMClosure.lean::QuantumMechanics.DerivationDagQMClosure.conditional_route_bridges_pg_l1_fq_ds_sixteen_route_closure
    rust_witness_anchor: omega_engine/crates_rs/omega_symbol_game/src/derivation_dag_witnesses.rs::verify_tranche15_gap_nonderivation_countermodels_and_conditional_route_bridges_witness
    paper_refs:
    - papers/derivations/10_finite_qm_core/TFQ-0007_finite_quantum_mechanics_core_on_an_admitted_carrier.md
    - papers/derivations/08_l1_to_l2/TFQ-0287_cohomology_admission_does_not_select_hilbert_space.md
