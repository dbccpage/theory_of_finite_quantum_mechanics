    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M3_CONGRUENCE_IDEALS_AND_DECOY_ANTIBODIES_MINING
    concrete_spans:
      node_statement: Hilbert tensor product as the unique way to combine systems. On Bool x Bool a bilinear integer-homogeneous
        Kronecker-normalized map equals the pointwise product; a weaker same-host combining interface has a rival
        (dump-the-right-report map).
