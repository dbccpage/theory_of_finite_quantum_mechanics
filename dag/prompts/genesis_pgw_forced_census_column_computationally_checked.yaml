node_id: PGW-FORCED-CENSUS-COLUMN
research_stage: GENESIS
authority_effect: None
workflow: ../pfp/workflow.yaml
mode: ../pfp/mode.yaml
stage_contracts: ../pfp/stage_contracts.yaml
default_stage: P0_MINE_OPERAD
operad_record: ../operads/pgw_forced_census_column.yaml
