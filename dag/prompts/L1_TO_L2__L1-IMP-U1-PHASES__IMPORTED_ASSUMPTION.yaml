      spanning_tree_edges:
      - edge:
        - 0
        - 1
        du: 330
      - edge:
        - 1
        - 2
        du: -990
      - edge:
        - 2
        - 3
        du: 1155
      chord_edge:
        edge:
        - 0
        - 3
        measured_omega: -165
      coboundary_law: v_b - v_a = du_e on tree; chord_potential = v_3 - v_0; gamma_2 = |measured_omega - chord_potential|
  slot_m2_layer1_forward_morphisms:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M2_OPERAD_MORPHISMS_AND_GRAFTING_TREE_MINING
    operad_family_id: OP-L1-U1-PHASE-GROUP-H011
    incoming_routes:
    - L1-R-U1-GAP
    outgoing_routes:
    - L1-R-THM3
    - L1-R-THM4
    - L1-R-PHASE-BLIND-INTERFERENCE
    - L1-R-CIRCLE-BOUNDARY
    - L1-R-HAAR-GAP
    - X-R-IMPORTS-TO-DECLARED-INTERFACE
    source_colours:
    - CochainCarrierC4
    - FiniteShadowSpan
    - CountermodelSpan
    - ImportBoundaryList
    target_colour: TypedDerivationCertificate
    operators:
    - id: op_stage1_p_star_syndrome
      signature: (CochainCarrierC4) -> PStarSyndromeReceipt
      arity: 1
      rule: Integrate tree coboundaries v_1, v_2, v_3 from v_0=0, evaluate chord_potential = v_3 - v_0, and compute
        holonomy_gamma2 = |measured_omega - chord_potential|.
    - id: op_finite_shadow_witness
      signature: (FiniteShadowSpan) -> ExactIntegerShadowWitness
      arity: 1
      rule: 'Evaluate exact finite shadow identity: gaussian_phase_order_4: i^4 = 1 and |{1, i, -1, -i}| == 4 ->
        2 + 2 == 4.'
    - id: op_countermodel_separation
      signature: (CountermodelSpan) -> ExactCountermodelWitness
      arity: 1
      rule: 'Evaluate exact finite countermodel/obstruction: sign_group_exponent_two_bound: (-1)^2 == 1 and |{+1,-1}|
        == 2 (sign group suffices for binary destructive interference) -> 1 + 1 == 2.'
    - id: op_import_boundary_certificate
      signature: (PStarSyndromeReceipt, ExactIntegerShadowWitness, ExactCountermodelWitness, ImportBoundaryList)
        -> TypedDerivationCertificate
      arity: 4
      rule: Bind unpaid_import_count, refuse unconditional promotion (unconditional_promotion_refused = true), and
        attach Lean 4 and Rust anchors.
    planar_grafting_sequence:
    - op_stage1_p_star_syndrome -> slot_0(op_import_boundary_certificate)
    - op_finite_shadow_witness -> slot_1(op_import_boundary_certificate)
    - op_countermodel_separation -> slot_2(op_import_boundary_certificate)
    - ImportBoundaryList -> slot_3(op_import_boundary_certificate)
  slot_m3_layer2_ideals_and_annihilators:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M3_CONGRUENCE_IDEALS_AND_DECOY_ANTIBODIES_MINING
    concrete_spans:
      node_statement: U(1) phases (unit complex numbers) act on sector amplitudes. QM_122 shows a sign carrier suffices
        for some finite tasks and that excluding it needs an extra non-exponent-two condition. The selector for
        C / U(1) belongs to QM_028 / QM_062 (another segment).
      node_bottleneck: See L1-U1-SELECTOR-OTHER-SEGMENT.
      imported_assumptions:
      - 'circle group U(1): assumption'
      finite_shadow_lhs_expr: 2 + 2
      countermodel_lhs_expr: 1 + 1
      raw_candidate_rival_int: 53
      coboundary_gauge_shift_int: 45
      sign_double_count_int: 6
    congruence_ideals:
    - 'IDEAL_ZERO_FLOAT_TOLERANCE: All output numbers must be exact integers (no floats).'
    - 'IDEAL_AUTHORITY_EFFECT_NONE: authority_effect == ''None'' and firewall_status == ''stated region only; mints
      no authority.'''
    - 'IDEAL_COCHAIN_D1D0_ZERO: cochain_d1_d0_exact_zero == true on the P* C_4 complex.'
    - 'IDEAL_QUOTIENT_COBOUNDARY_ANNIHILATION: Both coboundary_gauge_shift G_cob and boundary sign_double_count
      S_decoy lie in Congruence Ideal I and must be subtracted from R_raw.'
    - 'IDEAL_NON_PROMOTION_FENCE: Node status is IMPORTED_ASSUMPTION; under SPK-001 (stated region only; mints no
      authority), unconditional_promotion_refused MUST be true even when status is PROVED_LEAN, DEFINITION, or ADMITTED_PRIMITIVE.'
    annihilator_antibodies:
    - antibody_id: AB_RAW_RIVAL_DECOY_TRAP
      target_decoy: Reporting unquotiented R_raw=53 or partially quotiented R_raw - G_cob=8 instead of 1 + 1 ==
        2
      refutation_witness: 'NullTree: Congruence Ideal I annihilates both G_cob=45 and S_decoy=6, leaving 2.'
    - antibody_id: AB_FALSE_UNCONDITIONAL_PROMOTION
      target_decoy: Setting unconditional_promotion_refused = false because DAG status is IMPORTED_ASSUMPTION
      refutation_witness: 'NullTree: SPK-001 firewall refuses unconditional authority/continuum promotion for all
        DAG statuses.'
    - antibody_id: AB_CONTINUUM_FLOAT_DRIFT
      target_decoy: Emitting floating-point approximations instead of exact integer invariants
      refutation_witness: 'NullTree: G0_STRICT_TYPED_JSON_SCHEMA rejects non-integer scalars.'
  slot_m4_tri_language_witness_anchors:
    mining_status: FILLED_BY_4MISSION_MINER
    mission_id: M4_TRI_LANGUAGE_EXACT_WITNESS_MINING
    finite_shadow_equation: 'gaussian_phase_order_4: i^4 = 1 and |{1, i, -1, -i}| == 4'
    finite_shadow_lhs: 2 + 2
    finite_shadow_rhs: '4'
    finite_shadow_expected_int: 4
    countermodel_equation: 'sign_group_exponent_two_bound: (-1)^2 == 1 and |{+1,-1}| == 2 (sign group suffices for
      binary destructive interference)'
    countermodel_lhs: 1 + 1
    countermodel_rhs: '2'
    countermodel_expected_int: 2
    unpaid_import_count_expected: 1
    lean4_theorem_anchor: lean4/quantum_mechanics/DerivationDagQMClosure.lean::QuantumMechanics.DerivationDagQMClosure.l1_gap_u1_inner_product_orthogonal_additivity_and_isometric_dynamics_countermodels
    rust_witness_anchor: omega_engine/crates_rs/omega_symbol_game/src/derivation_dag_witnesses.rs::verify_tranche15_gap_nonderivation_countermodels_and_conditional_route_bridges_witness
    paper_refs:
    - papers/derivations/08_l1_to_l2/TFQ-0294_circle_phases_as_an_imported_unit_group.md
