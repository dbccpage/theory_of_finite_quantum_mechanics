# Table of contents for this repository: where each body of work lives and why.
#
# A book is a folder (or one file) that holds a coherent piece of work. Books may
# nest: a tier folder is its own book and also sits inside the whole-DAG book.
# File counts are not stored here; the catalog checker computes them from git.
#
# This catalog uses paths within this repository. Path validation does not
# certify publication safety or the claims made in the referenced material.
catalog:
  schema: omega-library-catalog/1
  repo: theory_of_finite_quantum_mechanics
  title: Theory of Finite Quantum Mechanics
  authority_effect: None
  nonclaims:
  - A book entry records where a body of work lives. It is not a proof, a status, or an admission.
  - Node statuses in dag/derivation_dag.json govern; nothing here changes or restates them.
  - Lifecycle labels describe editorial organization, not proof completion or byte integrity.

shelves:
