[project]
name = "theory_of_finite_quantum_mechanics"
version = "0.1.0"
description = "A Constructive Mathematical Derivation of Quantum Mechanics from Pure Discrete Distinctions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
scoring = [
    "lizard>=1.17",
    "jsonschema>=4.18",
    "mypy>=1.13",
    "radon>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["code/python", "code/python/src"]
testpaths = ["code/python/tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]