# lean4/: the Lake package of the theory (Lean and Mathlib v4.35.0). Every .lean file here is a governed source
# (governance/policy.json population lean4/**/*.lean). AuthorityEffect: None; a module is evidence only through
# a replay receipt in evidence/lean_receipts.
schema: repo-type/1
file_for: lean4

classes:
  - class: LeanFolder
    path: lean4
    summary: The Lake package FiniteQuantum - flat PascalCase modules with contract-score companions, two namespace folders, and the imported modules under Imported/ with the manifests that bind them to their originals.
    role: proof
    counts: {now: 1818, target: 1691}
    attributes:
      - {name: readme, match: README.md, leaf: FolderReadme, required: true, now: 1, target: 1, note: "describes another repository's layout; story S04 rewrites it"}
      - {name: lakefile, match: lakefile.lean, leaf: LakeFile, required: true, now: 1, target: 1, note: "194 lean_lib targets, 1,052 roots; lines 986 and 1016 name the missing folder atlas/papers (story S16)"}
      - {name: lake_manifest, match: lake-manifest.json, leaf: LakeManifest, required: true, now: 1, target: 1}
      - {name: toolchain, match: lean-toolchain, leaf: LeanToolchainPin, required: true, now: 1, target: 1}
      - {name: attributes, match: .gitattributes, leaf: GitAttributes, required: true, now: 1, target: 1, note: "seals the bytes of the Prompt*Scope modules"}
      - {name: renames, match: RENAMES.json, leaf: RenameLedger, required: true, now: 1, target: 1, note: "upper-case name kept as a named exception: governance/baseline.json reasons cite it"}
      - {name: provenance_note, match: provenance.md, leaf: MarkdownNote, required: true, now: 1, target: 1}
      - {name: imported, class: ImportedLeanModules, required: true}
    collections:
      - {name: companions, match: "**/*.contract.score.yaml", leaf: ContractScoreCompanion, now: 753, target: 752}
      - {name: doc_companions, match: "**/*.doc.yaml", leaf: DocCompanion, now: 123, target: 123, note: "no tool reads them (owner question Q7)"}
      - {name: modules, match: "{*.lean,AuthIncompleteness/*.lean,FQCD/*.lean}", leaf: LeanModule, now: 791, target: 791}
      - {name: mutation_harness, match: "{test_majorana_boundary.py,majorana_claim_oracle.py}", leaf: LeanMutationHarness, now: 2, target: 2, note: "reads _DIR/'MajoranaCore.lean'; stays beside the module it mutates"}
      - {name: reading_guides, match: "qm_*.md", leaf: LeanReadingGuide, now: 140, target: 16, note: "UNSURE: 16 Lean texts saved as .md that dag/derivations prose names; the other 124 go in story S04"}
    invariants:
      - {id: lean4.every_module_built, statement: "every module is a root of, or imported by a root of, some lean_lib in lakefile.lean", holds_now: false, checked_by: unchecked, note: "49 modules are built by no target; 40 of them are the sealed Prompt*Scope modules"}
      - {id: lean4.srcdirs_resolve, statement: "every srcDir in lakefile.lean names an existing folder", holds_now: false, checked_by: unchecked, note: "lakefile.lean:986 and :1016 point to atlas/papers/finite_obstruction_calculus/... which does not exist; story S16"}
      - {id: lean4.ci_targets_build, statement: "the nine targets of lean-gleason.yml build with only propext, Classical.choice and Quot.sound", holds_now: unknown, checked_by: ".github/workflows/lean-gleason.yml:109"}
      - {id: lean4.no_admissions, statement: "no added Lean line carries sorry, admit, native_decide, unsafe or an axiom declaration", holds_now: true, checked_by: "scripts/auto/anti_pattern_lint.py --changed-since origin/main (CI overclaim.yml, blocking)"}
    relations:
      - {kind: builds, to: LeanFolder, via: "lakefile.lean lean_lib roots"}

  - class: ImportedLeanModules
    path: lean4/Imported
    summary: Modules imported from the paper deposits with their import lines rewritten into the Imported namespace; the two manifests record each module's original sha256.
    role: proof
    counts: {now: 319, target: 317}
    attributes:
      - {name: import_manifest, match: import_manifest.json, leaf: ImportManifest, required: true, now: 1, target: 1}
      - {name: import_manifest_programmes, match: import_manifest_programmes.json, leaf: ImportManifest, required: true, now: 1, target: 1}
    collections:
      - {name: modules, match: "**/*.lean", leaf: LeanModule, authored: "imported:lean4/Imported/import_manifest.json and import_manifest_programmes.json (namespace rewrites of an original)", now: 315, target: 315}
    invariants:
      - {id: imported.originals_bound, statement: "for every Imported module the manifest's original_sha256 is the sha256 of a tracked file, or the manifest says the original is outside the repository", holds_now: false, checked_by: unchecked, note: "checked during this review - 229 of 315 originals are tracked byte-for-byte (223 under atlas/finite_obstruction_calculus), 86 are not in the repository"}
      - {id: imported.repo_sha_current, statement: "every module's current sha256 equals the manifest's repo_sha256, or the change is recorded", holds_now: false, checked_by: unchecked, note: "30 of 315 modules have changed since the import"}
    relations:
      - {kind: derives_from, to: AtlasFolder, via: "import_manifest.json original_sha256 (229 originals tracked)"}

leaf_types:
  - {name: LakeFile, format: lean, naming: lower, schema: "Lake DSL", companions: policy, authored: hand}
  - {name: LakeManifest, format: json, naming: toolchain, schema: none, companions: none, authored: "generated:lake update"}
  - {name: RenameLedger, format: json, naming: exception, schema: none, companions: none, authored: hand}
  - {name: LeanMutationHarness, format: py, naming: lower, schema: "pytest module", companions: none, authored: hand}
  - {name: LeanReadingGuide, format: md, naming: lower, schema: none, companions: none, authored: hand}
  - {name: ImportManifest, format: json, naming: lower, schema: "{files: [{original_sha256, repo_path, repo_sha256, module, imports}]}", companions: none, authored: hand}
