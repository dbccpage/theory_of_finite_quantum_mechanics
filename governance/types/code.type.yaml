# code/: the executable half of the theory. Every .rs and .py file under code/ is a governed source
# (governance/policy.json populations) and carries a .contract.score.yaml companion. AuthorityEffect: None.
schema: repo-type/1
file_for: code

classes:
  - class: CodeFolder
    path: code
    summary: Reference implementations in Python and exact rational certifiers in Rust, with their tests and the scoring campaign's quality records; every source carries a contract-score companion.
    role: check
    counts: {now: 2, target: 2}
    attributes:
      - {name: python, class: PythonTree, required: true}
      - {name: rust, class: RustWorkspace, required: true}
      - {name: deposit_paths, match: deposit_paths.py, leaf: PythonModule, required: true, now: 1, target: 1, note: "the root verify_deposit.py binds this file first (verify_deposit.py:31-35) and lists it as a required deposit file (line 84)"}
      - {name: deposit_paths_companion, match: deposit_paths.contract.score.yaml, leaf: ContractScoreCompanion, required: true, now: 1, target: 1}
    invariants:
      - {id: code.companion_per_source, statement: "every .rs and .py file under code/ has its companion named by governance/policy.json companion.naming", holds_now: true, checked_by: "governance-check --root . check (CI governance.yml, on main and on changed files in pull requests)"}
      - {id: code.population_agrees, statement: "the Rust and the Python implementation of the governed population list the same files", holds_now: true, checked_by: "governance.yml step 'Rust and Python agree on the governed population'"}
    relations:
      - {kind: consumes, to: VendorFolder, via: "code/rust/Cargo.toml path dependencies on vendor/engine (14 direct, lines 49-62)"}

  - class: PythonTree
    path: code/python
    summary: Python packages under src/ (25 packages, imported by the tests), the scoring operations, and the root pytest suite (pyproject.toml testpaths = code/python/tests).
    role: check
    counts: {now: 1802, target: 1800}
    collections:
      - {name: readmes, match: "**/README.md", leaf: FolderReadme, now: 3, target: 3}
      - {name: companions, match: "**/*.contract.score.yaml", leaf: ContractScoreCompanion, now: 862, target: 861}
      - {name: doc_companions, match: "**/*.doc.yaml", leaf: DocCompanion, now: 73, target: 73}
      - {name: root_tests, match: "tests/**/*.py", leaf: PythonTest, now: 284, target: 284, note: "collected by the root pytest config; no workflow runs them today (owner question Q11)"}
      - {name: in_package_tests, match: "src/**/{test_*.py,conftest.py}", leaf: PythonTest, now: 132, target: 132, note: "outside testpaths; dag/evidence/evidence_map.json cites them by explicit pytest command"}
      - {name: modules, match: "{src,operations}/**/*.py", leaf: PythonModule, now: 406, target: 406}
      - {name: sql, match: "src/**/*.sql", leaf: SqlSchema, now: 19, target: 19}
      - {name: fixtures, match: "src/**/*.json", leaf: DataFixture, now: 18, target: 18}
      - {name: notes, match: "src/**/*.md", leaf: MarkdownNote, now: 4, target: 4}

  - class: RustWorkspace
    path: code/rust
    summary: One Cargo workspace (root crate plus 20 member crates under src/) of exact rational certifiers, its integration tests, and the quality records of the scoring campaign.
    role: check
    counts: {now: 3220, target: 3188}
    attributes:
      - {name: manifest, match: Cargo.toml, leaf: CargoManifest, required: true, now: 1, target: 1}
      - {name: lock, match: Cargo.lock, leaf: CargoLock, required: true, now: 1, target: 1}
      - {name: build_hook, match: build.rs, leaf: BuildHook, required: true, now: 1, target: 1}
      - {name: quality, class: RustQualityRecords, required: true}
    collections:
      - {name: companions, match: "**/*.contract.score.yaml", leaf: ContractScoreCompanion, now: 1426, target: 1412}
      - {name: doc_companions, match: "**/*.doc.yaml", leaf: DocCompanion, now: 72, target: 72}
      - {name: crate_manifests, match: "src/**/{Cargo.toml,Cargo.lock,clippy.toml}", leaf: CargoManifest, now: 23, target: 22}
      - {name: crate_build_hooks, match: "src/**/build.rs", leaf: BuildHook, authored: "imported:governance/policy.json pinned_boilerplate (byte copies of governance/hook/build.rs)", now: 19, target: 19}
      - {name: unwired_sources, match: "src/{wdp/derivation_controls/**,wdp/bin/**,wdp/mod.rs,mub/bin/**,mub/native/**}", leaf: UnwiredRustSource, now: 299, target: 299, note: "UNSURE: no manifest target or mod declaration reaches them; story S15 wires or deletes each family after a compile check"}
      - {name: rust_sources, match: "src/**/*.rs", leaf: RustSource, now: 1000, target: 986}
      - {name: rust_data, match: "src/**/*.json", leaf: DataFixture, now: 48, target: 48, note: "read with include_str! relative to the source file"}
      - {name: source_extras, match: "src/**/*.{py,md}", leaf: MarkdownNote, now: 3, target: 3}
      - {name: unwired_tests, match: "tests/mub/**/*.rs", leaf: UnwiredRustSource, now: 50, target: 50, note: "UNSURE: no [[test]] entry and no tests/mub/main.rs; only fixture_receipts.rs is wired, by #[path] from quality/fixture_register"}
      - {name: test_artifacts, match: "tests/**/*.{json,md}", leaf: TestArtifact, authored: "generated:the MUB(6) runs", now: 241, target: 241}
      - {name: integration_tests, match: "tests/*.rs", leaf: RustTest, now: 33, target: 33, note: "cargo integration tests; no workflow builds this workspace (owner question Q11)"}
    invariants:
      - {id: rust.every_source_reachable, statement: "every .rs file under src/ and tests/ is reached from a manifest target, a mod declaration or a #[path] attribute", holds_now: false, checked_by: unchecked, note: "533 files are not (reviewer 2, r2/reach.py); story S15"}
      - {id: rust.builds, statement: "cargo test --workspace --locked passes from code/rust", holds_now: unknown, checked_by: unchecked, note: "no CI job builds the workspace; only the governance crate is built (governance.yml:60,63)"}

  - class: RustQualityRecords
    path: code/rust/quality
    summary: The scoring campaign's per-module quality packages - assessments, candidate sources, Lean rank proofs, runners and replay tools that the companions and evidence/quality receipts cite.
    role: evidence
    counts: {now: 1126, target: 975}
    collections:
      - {name: readmes, match: "**/README.md", leaf: FolderReadme, now: 6, target: 5}
      - {name: companions, match: "**/*.contract.score.yaml", leaf: ContractScoreCompanion, now: 245, target: 172}
      - {name: cargo_files, match: "**/{Cargo.toml,Cargo.lock}", leaf: CargoManifest, now: 4, target: 4, note: "fixture_register and category_homology/rust_metrics declare their own workspaces"}
      - {name: lean_rank_proofs, match: "category_homology/**/*.lean", leaf: QualityLeanProof, now: 66, target: 66, note: "outside lean4/ and outside every lakefile root; checked by category_homology/run_rank_proof.py"}
      - {name: tools, match: "**/*.{py,ps1}", leaf: QualityTool, now: 132, target: 126, note: "scalar_port_faults.py stays in S13: six kept modules import it (l4a_six/mutations.py:205 and five fault-recipe modules)"}
      - {name: candidate_sources, match: "**/*.rs", leaf: QualityCandidateSource, now: 113, target: 46}
      - {name: assessments, match: "**/*.json", leaf: AssessmentRecord, now: 560, target: 556}

leaf_types:
  - {name: SqlSchema, format: sql, naming: lower, schema: none, companions: none, authored: hand}
  - {name: DataFixture, format: json, naming: lower, schema: none, companions: none, authored: hand}
  - {name: BuildHook, format: rs, naming: lower, schema: "byte copy of governance/hook/build.rs", companions: policy, authored: "imported:governance/policy.json pinned_boilerplate"}
  - {name: UnwiredRustSource, format: rs, naming: lower, schema: none, companions: policy, authored: hand}
  - {name: TestArtifact, format: "json or md", naming: lower, schema: none, companions: none, authored: hand}
  - {name: RustTest, format: rs, naming: lower, schema: "cargo integration test", companions: policy, authored: hand}
  - {name: QualityLeanProof, format: lean, naming: lean_module or lower, schema: none, companions: policy, authored: hand}
  - {name: QualityTool, format: "py or ps1", naming: lower, schema: none, companions: policy, authored: hand}
  - {name: QualityCandidateSource, format: rs, naming: lower, schema: none, companions: policy, authored: hand}
  - {name: AssessmentRecord, format: json, naming: lower, schema: none, companions: none, authored: hand}
