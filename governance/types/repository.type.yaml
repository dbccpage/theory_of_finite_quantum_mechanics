      - {id: repo.no_archive_folders, statement: "no folder is named archive, archives, old, legacy, superseded, backup, source_archive or retired*, and no folder keeps superseded copies", holds_now: false, checked_by: "scripts/check_repo_types.py (S01)", note: "after S10 renames the last DAG-cited file out of source_archive/, the target tree has none"}
      - {id: repo.byte_duplicates_declared, statement: "two tracked files share a blob only when a derives_from relation or an allow entry of the owning class names the pair", holds_now: false, checked_by: "scripts/check_repo_types.py --report duplicates (S01)", note: "deposit boilerplate (LICENSE, lean-toolchain, empty files) is the main allowed group"}
      - {id: repo.library_paths_resolve, statement: "every path and entry point in library.yaml exists", holds_now: false, checked_by: "scripts/check_repo_types.py (S01)", note: "15 of its 153 paths are missing at the merged tip and 18 more go in S08 and S11; S03, S08 and S11 repoint them"}
