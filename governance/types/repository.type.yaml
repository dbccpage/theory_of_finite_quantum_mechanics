      - {name: normal_forms, class: NormalFormsFolder, required: true}
      - {name: papers, class: PapersFolder, required: true}
      - {name: scripts, class: ScriptsFolder, required: true}
      - {name: vendor, class: VendorFolder, required: true}
      - {name: tool_config, class: ToolConfigFolders, required: true}
