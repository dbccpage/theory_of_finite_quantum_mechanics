# The repository typed as one object: the root class, the meta-schema every type file in this folder follows,
# the naming and public-text rules and the leaf types that several folders share.
#
# AuthorityEffect: None. These files say where each tracked file lives and what kind of file it is. They change
# no DAG node, status or statement, and they are not evidence for any claim.
#
# `now` counts tracked files at the merged tip (341d2e3dc plus this branch); `target` counts them after every story of
# governance/types/repository_typing_epic.md. The checker reports count drift and does not fail on it.
schema: repo-type/1
file_for: "."

meta:
  files: "governance/types/repository.type.yaml (this file) and one <folder>.type.yaml per top-level folder; no other file in this folder is a type file"
  ownership: >-
    A class claims folders with exactly one of `path` (one folder), `paths` (several) or `path_glob` (every
    top-level folder whose name matches and that no `path` or `paths` claims; each such folder is one instance).
    A tracked file belongs to the class that claims its longest folder prefix, compared segment by segment; the
    root class (path ".") owns every other file. Two classes may not claim the same folder.
  matching: >-
    A file is matched against the members of its owning class in order, first the attributes that carry `match`,
    then the collections; the first match wins. `match` is a glob relative to the claimed folder the file lies in.
    `*` matches any characters except `/` (a leading dot included), `?` one such character, `[...]` one character
    of the set, `**` as a whole segment any number of segments (so `a/**` is everything below `a`, and `**` alone is
    everything), and `{a,b}` one of the comma-separated choices; matching is case-sensitive. A pattern without
    these characters is an exact path.
  subclasses: "an attribute that carries `class` (and no `match` or path) says that the named class is part of this one; the class's own `path`, `paths` or `path_glob` says where it lives"
  catch_all: >-
    A member whose match is `**`, or whose leaf has `format: any`, is a catch-all. It must say `catch_all: true`
    and have an `authored` value that starts with `imported:`. Hand-maintained trees therefore have none, and a new
    kind of file there is UNTYPED until a member names it.
  errors:
    UNTYPED: a tracked file that no member of its owning class matches
    DEAD: a member that matches no file (a member shadowed by earlier members included), or a leaf type that types no file
    MISSING: a required `match` attribute that matches no file, or a required `class` attribute whose class owns no file
    UNKNOWN: a member, attribute or relation that names a leaf type or class no type file defines
    CLAIM: two classes claim one folder, or two type files define the same class or leaf name
    FORM: a field missing or outside the grammar below
    NAMING: a file or folder name outside its naming rule (report)
    PUBLIC_TEXT: a hit of the public_text rule (report)
  class_fields: "class; path | paths | path_glob; summary; role; counts {now, target} (the files it owns directly); attributes; collections; invariants; relations; totals (root only)"
  member_fields: "name, match, leaf, now, target; optional authored (default hand), required (attributes only), catch_all, note"
  leaf_fields: "name, format, naming, schema, companions, authored"
  invariant_fields: "id, statement, holds_now (true | false | unknown), checked_by (a command, or unchecked), optional note"
  roles: [source, proof, check, evidence, record, document, tooling, config, vendored, generated]
  authored: "starts with `hand`, `generated:<command that rebuilds it>` or `imported:<ledger that binds its bytes>`; anything after the first clause is a note"
  naming: "one or more names of naming_rules joined by ' or '"
  companions: "none | policy (governance/policy.json decides) | review_ledger (checks/review_ledger pins source and companion) | convention (a .contract.score.yaml kept outside the governed populations)"
  relation_kinds:
    cites: a field or line in the source class names a path in the target class
    imports: code in the source class loads modules of the target class
    builds: a manifest in the source class compiles files of the target class
    checks: a test, validator or CI job in the source class verifies files of the target class
    generates: a command in the source class writes files of the target class
    renders: a generator turns the source class into pages of the target class
    consumes: the source class reads data of the target class at run time
    derives_from: files of the source class are recorded copies of files of the target class, bound by a ledger
  changes: "what the epic removes, moves or renames is listed once, in the appendix of the epic; the type files describe the target tree"

# Each rule file of the repository is either subsumed by these types or referenced by them; none is restated.
sources_of_truth:
  - {file: rules/rules.yaml, relation: subsumed, note: "rule_1 is naming_rules; rule_2 (a three-file companion set) contradicts governance/policy.json and the tree and is dropped; rule_3 is invariant repo.qm_atlas_gate; story S03 deletes the file"}
  - {file: library.yaml, relation: referenced, note: "the table of contents (shelves of books) in its own catalog schema; a library checker in a private sibling repository reads it as this repository's catalog, so it stays at the root and is not copied here; invariant repo.library_paths_resolve checks it"}
  - {file: governance/policy.json, relation: referenced, note: "the companion regime (suffix, populations, floor, exclusions, pinned build.rs); leaf types say `companions: policy` and never restate it"}
  - {file: governance/baseline.json, relation: referenced, note: "the grandfather list; stories that delete governed sources shrink it with `governance-check baseline --write`"}

# A file name is accepted when it satisfies a rule its leaf type names or one of the universal rules readme,
# toolchain and deposit_boilerplate. A folder name is accepted when it satisfies lower, lean_namespace_folder, dag_id
# or utc_stamp. The rules imported and exception are reported, not enforced.
naming_rules:
  lower: {pattern: "^[._]*[a-z0-9][a-z0-9_.+-]*$", note: "the default (rules.yaml rule_1, widened to the leading dots and underscores of tool files and to the hyphen and plus that names already use)"}
  readme: {pattern: "^README([._-][A-Za-z0-9_.-]+)?$", note: "README files may carry capitals"}
  lean_module: {pattern: "^[A-Z][A-Za-z0-9_]*\\.lean$", note: "Lean module files are PascalCase (toolchain)"}
  lean_named: {pattern: "^[A-Z][A-Za-z0-9_]*(\\.lean)?\\.[a-z.]+$", note: "a companion or note named after a Lean module keeps the module name; the suffix is lower case"}
  lean_namespace_folder: {pattern: "^[A-Z][A-Za-z0-9_]*$", note: "a folder that is a Lean namespace (lean4/Imported/GenesisDerivation, ...)"}
  toolchain: {pattern: "^(Cargo\\.toml|Cargo\\.lock|lean-toolchain|lake-manifest\\.json|LICENSE([-.][A-Za-z0-9]+)?)$", note: "names fixed by Cargo, elan, Lake and licence convention"}
  deposit_boilerplate: {pattern: "^(MANIFEST\\.sha256|SHA256SUMS|CITATION\\.cff)$", note: "deposit conventions read by verify_deposit.py, regen_sha256sums.py and citation tooling"}
  dag_id: {pattern: "^[A-Z0-9][A-Z0-9_-]*(\\.md)?$", note: "a page or folder named by a DAG node or stage id keeps the id's case (docs/evidence/nodes, docs/evidence/stages, evidence/results/<ID>)"}
  utc_stamp: {pattern: "^[0-9]{8}T[0-9]{6}Z.*$", note: "run folders named by a UTC time stamp"}
  root_document: {pattern: "^(CONTRIBUTING|REVIEWING|SCORING)\\.md$", note: "front-page documents at the root; SCORING.md is the rubric that governance/policy.json `rubric` names"}
  tool_convention: {pattern: "^((AP|HP)_[A-Z0-9]+_[0-9]{3}_[a-z0-9_]+\\.md|SKILL\\.md|PROPOSED_SKILLS\\.md|FUNDING\\.yml|ISSUE_TEMPLATE)$", note: "names required by the pattern-card lint (scripts/auto/anti_pattern_lint.py CARD_NAME), the skill loader and GitHub"}
  imported: {pattern: ".*", note: "bytes and names bound by a provenance ledger (atlas/PROVENANCE.json, education/IMPORT_PROVENANCE.json, vendor/engine/README.md); reported until the ledger is re-pinned"}
  exception: {paths: [docs/QM_PROBLEM_AND_PROOF_ATLAS.md, lean4/RENAMES.json], note: "a file passes this rule only if its path is listed: scripts/verify_qm_atlas_loc.py:15,53 reads the first at that path, governance/baseline.json reasons cite the second; reported, not enforced"}

public_text:
