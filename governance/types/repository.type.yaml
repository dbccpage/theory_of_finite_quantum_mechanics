      - {kind: checks, to: CodeFolder, via: ".github/workflows/governance.yml (governance-check, contract_scores.py, score_scope_contracts.py)"}
      - {kind: checks, to: LeanFolder, via: ".github/workflows/governance.yml and lean-gleason.yml"}
      - {kind: checks, to: ChecksFolder, via: ".github/workflows/reviewed-checkers.yml"}
      - {kind: renders, to: Repository, via: "scripts/build_readme_facts.py --write rewrites the facts block of README.md"}
      - {kind: renders, to: DocsFolder, via: ".github/workflows/status.yml (scripts/build_status.py, Jekyll build of docs/)"}

