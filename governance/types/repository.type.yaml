    No tracked file names a private project or product brand or an AI model or vendor, and none uses the three
    banned words. The text of a file is its path and, when its first 8,000 bytes hold no NUL byte, its content; path
    and content are scanned separately. Insert a space between a lower-case letter or digit and a following
    upper-case letter, lower-case everything, and replace every run of characters that are not ASCII letters by one
    space. A hit is a word, or two adjacent words joined by one space, whose SHA-256 (UTF-8, hex) is in the lists
    below, either as written or with one trailing "s" removed. The term list itself is not written in the public tree.
