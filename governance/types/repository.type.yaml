      - {id: repo.no_dead_types, statement: "every member and every leaf type has at least one instance", holds_now: false, checked_by: "scripts/check_repo_types.py (S01)", note: "26 dead at the S01 commit: members and leaf types that receive files in later stories"}
      - {id: repo.top_level_closed, statement: "the root holds exactly the 13 folders and the 15 files that the attributes and collections name, plus the three dot folders", holds_now: false, checked_by: "scripts/check_repo_types.py (S01)", note: "16 non-dot folders and 18 root files at the merged tip"}
