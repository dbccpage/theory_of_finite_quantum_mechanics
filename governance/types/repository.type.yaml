      - {id: repo.readme_facts_current, statement: "the README facts block equals what scripts/build_readme_facts.py computes", holds_now: false, checked_by: "python -I -X utf8 scripts/build_readme_facts.py --check (no CI job; dag/tests/test_readme_facts.py)", note: "prints 'README facts are stale' at 88fa973cc; S02 regenerates the block"}
