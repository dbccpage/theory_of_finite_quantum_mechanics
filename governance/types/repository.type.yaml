      - {name: git_ignore, match: .gitignore, leaf: GitIgnore, required: true, now: 1, target: 1}
      - {name: traceability_matrix, match: traceability_matrix.md, leaf: TraceabilityMatrix, required: false, now: 1, target: 1, note: "UNSURE: docs/ or the DAG reading note may absorb it"}
