  - class: Repository
    path: "."
    summary: The theory of finite quantum mechanics as one typed tree, from the derivation graph and its Lean proofs to the code, checks and evidence behind each node status, with the tooling that governs them.
    role: source
    counts: {now: 518, target: 15}
    totals: {files_now: 24350, files_target: 21986, mb_now: 688.4, mb_target: 647.2, top_level_folders_now: 16, top_level_folders_target: 13}
    attributes:
      - {name: atlas, class: AtlasFolder, required: true}
      - {name: checks, class: ChecksFolder, required: true}
      - {name: code, class: CodeFolder, required: true}
      - {name: dag, class: DagFolder, required: true}
      - {name: docs, class: DocsFolder, required: true}
      - {name: education, class: EducationFolder, required: true}
      - {name: evidence, class: EvidenceFolder, required: true}
      - {name: governance, class: GovernanceFolder, required: true}
