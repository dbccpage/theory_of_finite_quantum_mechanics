# Build the existing governance sources directly, without copying the crate.
[package]
name = "governance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false

[workspace]

[lib]
name = "governance"
path = "../code/rust/src/governance/src/lib.rs"

[[bin]]
name = "governance-check"
path = "../code/rust/src/governance/src/bin/governance-check.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
