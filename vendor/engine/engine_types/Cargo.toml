[package]
autotests = false
name = "engine_types"
version.workspace = true
edition = "2021"
description = "Shared IDs, hashes, errors, and DTOs for the omega_engine workspace"
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
num-traits = "0.2"
engine_policy = { path = "../engine_policy" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
engine_functional = { path = "../engine_functional" }
engine_kernel = { path = "../engine_kernel" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }

[features]
default = []
linalg = []

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_types`.

[[test]]
name = "authority_run_composition"
path = "../tests/engine_types/authority_run_composition.rs"

[[test]]
name = "python_alnum_parity"
path = "../tests/engine_types/python_alnum_parity.rs"

[[test]]
name = "python_case_parity"
path = "../tests/engine_types/python_case_parity.rs"

[[test]]
name = "python_repr_parity"
path = "../tests/engine_types/python_repr_parity.rs"

[[test]]
name = "python_unicode_parity"
path = "../tests/engine_types/python_unicode_parity.rs"

[[test]]
name = "refinement_tower_receipts"
path = "../tests/engine_types/refinement_tower_receipts.rs"
