[package]
autotests = false
name = "engine_solvers"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Canonical solver/certifier set for the engine"

[dependencies]
engine_category_theory = { path = "../engine_category_theory" }
engine_policy = { path = "../engine_policy" }

engine_types = { path = "../engine_types" }
linear_algebra = { path = "../linear_algebra" }
engine_homology = { path = "../engine_homology" }
engine_functional = { path = "../engine_functional" }
engine_kernel = { path = "../engine_kernel" }
engine_combinatorics = { path = "../engine_combinatorics" }
engine_holonomy = { path = "../engine_holonomy" }
engine_number_theory = { path = "../engine_number_theory" }
engine_homotopy_type_theory = { path = "../engine_homotopy_type_theory" }
# hodge_global_evaluator implements engine_epk::v2::GlobalEvaluatorReplay in the lib
# target. engine_epk must never depend on engine_solvers (that WOULD cycle).
engine_epk = { path = "../engine_local_green_global_red_lggr" }
nalgebra = "0.33"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
blake3 = "1.5"
num-complex = { version = "0.4.6", features = ["serde"] }
sprs = "0.11"
rand_distr = "0.4"
hex = "0.4"

[dev-dependencies]
engine_replay = { path = "../engine_replay" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

