[package]
autotests = false
name = "engine_measurement"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
engine_kernel = { path = "../engine_kernel" }
# Numerical types
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Internal dependencies
engine_types = { path = "../engine_types" }

[dev-dependencies]
serde_json = "1.0"

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_measurement`.


[[test]]
name = "finite_response"
path = "../tests/engine_measurement/finite_response.rs"

[[test]]
name = "raw_evidence_boundary"
path = "../tests/engine_measurement/raw_evidence_boundary.rs"
