[package]
autotests = false
name = "engine_certifiers"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
engine_kernel = { path = "../engine_kernel" }
engine_policy = { path = "../engine_policy" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
nalgebra = "0.33"
engine_contracts = { path = "../engine_contracts" }
engine_functional = { path = "../engine_functional" }
engine_types = { path = "../engine_types" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_certifiers`.

[[test]]
name = "negative_tests"
path = "../tests/engine_certifiers/negative_tests.rs"

[[test]]
name = "paper_claim_traceability"
path = "../tests/engine_certifiers/paper_claim_traceability.rs"

[[test]]
name = "phi1_conformance"
path = "../tests/engine_certifiers/phi1_conformance.rs"

[[test]]
name = "phi1_form_lean_parity"
path = "../tests/engine_certifiers/phi1_form_lean_parity.rs"
