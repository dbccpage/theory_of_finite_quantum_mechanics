[package]
autoexamples = false
autotests = false
name = "engine_runtime"
version.workspace = true
edition = "2021"
description = "Computation engines for omega_core: quantum systems, operator algebras, and prompt processing"
authors = ["Engine contributors"]
license.workspace = true

[features]
default = []
paper070-test-clock = []
# Opt-in: compile engine_invariants checks into release builds (always on under debug_assertions).
strict_invariants = []
# NOTE: prompt_intake_engine was removed from this crate's dependency graph.
# It pulled archive omega_prompt_packets → pipelines → engine_epk, which cycles
# if engine_epk depends on engine_runtime for epk_engine. Re-home prompt intake
# under a host/application edge later — not under engines math.

[dependencies]
engine_functional = { path = "../engine_functional" }
constants = { path = "../constants" }
linear_algebra = { path = "../linear_algebra" }
engine_types = { path = "../engine_types", features = ["linalg"] }
engine_homology = { path = "../engine_homology" }
engine_wdp = { path = "../engine_wdp" }
engine_policy = { path = "../engine_policy" }
sha2 = "0.10"


nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2"
rayon = "1.8"

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_runtime`.

[[test]]
name = "multipath_iterator"
path = "../tests/engine_runtime/multipath_iterator.rs"

[[test]]
name = "semantic_geometry_1024_test"
path = "../tests/engine_runtime/semantic_geometry_1024_test.rs"

[[test]]
name = "prompt_density"
path = "../tests/engine_runtime/prompt_density.rs"

[[test]]
name = "su2_holonomy_multipath"
path = "../tests/engine_runtime/su2_holonomy_multipath.rs"

[[test]]
name = "test_dda_orbit_state_solver"
path = "../tests/engine_runtime/test_dda_orbit_state_solver.rs"

[[test]]
name = "test_eqcm_deliberation_engine"
path = "../tests/engine_runtime/test_eqcm_deliberation_engine.rs"

[[test]]
name = "test_reasoning_density_full"
path = "../tests/engine_runtime/test_reasoning_density_full.rs"

[[test]]
name = "test_uhlmann_fidelity_integration"
path = "../tests/engine_runtime/test_uhlmann_fidelity_integration.rs"
# Example programs remain package-owned source under `src/examples`.
[[example]]
name = "benchmarks"
path = "src/examples/benchmarks.rs"

[[example]]
name = "replays"
path = "src/examples/replays.rs"
