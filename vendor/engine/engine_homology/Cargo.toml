[package]
autotests = false
name = "engine_homology"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
engine_number_theory = { path = "../engine_number_theory" }
linear_algebra = { path = "../linear_algebra" }
engine_homotopy_type_theory = { path = "../engine_homotopy_type_theory" }
engine_functional = { path = "../engine_functional" }

num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
blake3 = "1.8"
hex = "0.4"
nalgebra = "0.33"
sha2 = "0.10"

[dev-dependencies]
engine_contracts = { path = "../engine_contracts" }
# Independent GF(2) lattice complexes (surface_grid) that the square lattices are compared with.
engine_majorana = { path = "../engine_majorana" }

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_homology`.

