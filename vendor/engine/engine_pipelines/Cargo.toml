[package]
autotests = false
name = "engine_pipelines"
version.workspace = true
edition = "2021"
description = "Composer for the Pi_S^# authority pipeline: o_K Kleisli composition over the refusal monad, the five-stage terminalizer, the GTLANF idempotent normalizer (ADR-107-001), and the omega_certifier_loop diagnostic improver (Sprint omega_certifier_loop, 2026-06-21)"
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
engine_policy = { path = "../engine_policy" }
engine_types = { path = "../engine_types" }
engine_homotopy_type_theory = { path = "../engine_homotopy_type_theory" }
engine_functional = { path = "../engine_functional" }
engine_wdp = { path = "../engine_wdp" }
engine_certifiers = { path = "../engine_certifiers" }
engine_epk = { path = "../engine_local_green_global_red_lggr" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
blake3 = "1.5"
thiserror = "2"

[dev-dependencies]
serde_yaml = "0.9"
proptest = "1.5"

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_pipelines`.

[[test]]
name = "coda_gtlanf_parity"
path = "../tests/engine_pipelines/coda_gtlanf_parity.rs"

[[test]]
name = "exact_rewrite_scheduler"
path = "../tests/engine_pipelines/exact_rewrite_scheduler.rs"

[[test]]
name = "finite_lambda_adapter"
path = "../tests/engine_pipelines/finite_lambda_adapter.rs"

[[test]]
name = "loop_step_terminalize"
path = "../tests/engine_pipelines/loop_step_terminalize.rs"

[[test]]
name = "pipeline_runtime"
path = "../tests/engine_pipelines/pipeline_runtime.rs"
