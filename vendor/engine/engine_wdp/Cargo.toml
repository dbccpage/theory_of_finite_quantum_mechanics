[package]
autoexamples = false
autotests = false
name = "engine_wdp"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Witnessed Difference Programme foundational mathematics: Finite Obstruction Calculus, exact rational dual-certified cochains, Moore behavioral quotients, presheaves, and connections to HoTT, Homology, Higher Categories, and Quantum Mechanics."

[dependencies]
engine_wire_primitives = { path = "../engine_wire_primitives" }
engine_policy = { path = "../engine_policy" }
engine_types = { path = "../engine_types" }
engine_certifiers = { path = "../engine_certifiers" }
nalgebra = "0.33"
engine_epk = { path = "../engine_local_green_global_red_lggr" }
engine_measurement = { path = "../engine_measurement" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
blake3 = "1.8"
sha2 = "0.10"
hex = "0.4"
engine_homotopy_type_theory = { path = "../engine_homotopy_type_theory" }
engine_functional = { path = "../engine_functional" }
engine_homology = { path = "../engine_homology" }
linear_algebra = { path = "../linear_algebra" }
engine_holonomy = { path = "../engine_holonomy" }
engine_kernel = { path = "../engine_kernel" }
engine_combinatorics = { path = "../engine_combinatorics" }
engine_quantum_physics = { path = "../engine_quantum_physics" }
engine_finite_probability = { path = "../engine_finite_probability" }
engine_number_theory = { path = "../engine_number_theory" }
engine_solvers = { path = "../engine_solvers" }

engine_category_theory = { path = "../engine_category_theory" }
engine_general_relativity = { path = "../engine_general_relativity" }
engine_replay = { path = "../engine_replay" }

[dev-dependencies]
engine_homology = { path = "../engine_homology" }
engine_majorana = { path = "../engine_majorana" }
serde_yaml = "0.9"

