[package]
autotests = false
name = "engine_contracts"
version.workspace = true
edition = "2021"
description = "Law/contract traits and generated bindings for the omega_engine workspace"
authors = ["Engine contributors"]
license.workspace = true
# Build-time contract gate: validates the v1 corpus firewall/identity before compiling.
build = "build.rs"

[dependencies]
syn = { version = "2.0.119", features = ["full"] }
engine_types = { path = "../engine_types" }
# NOTE (SG-LAYER-001 / PO-LAYER): engine_contracts MUST NOT depend on
# engine_replay. Contracts are governance law; replay is verification machinery.
# Shared trace vocabulary (TraceArtifact, VoidTrace) lives in the foundation
# crate engine_types::trace_artifact. Re-adding an engine_replay edge here
# re-inverts the layer order and must be refused.
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.10"
blake3 = { version = "1.8.3", features = ["serde"] }
erased-serde = "0.4"
thiserror = "2"

[build-dependencies]
syn = { version = "2.0.119", features = ["full"] }
engine_types = { path = "../engine_types" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"


[dev-dependencies]
num-rational = "0.4"
num-bigint = "0.4"
linear_algebra = { path = "../linear_algebra" }
engine_solvers = { path = "../engine_solvers" }
engine_policy = { path = "../engine_policy" }
engine_kernel = { path = "../engine_kernel" }
engine_functional = { path = "../engine_functional" }
# Parse declared module items; comments/strings are not Rust bindings.
# This already-locked parser is used offline, not installed as a tool.
syn = { version = "2.0.119", features = ["full"] }

[[bin]]
name = "contract_binding_audit"
path = "src/contract_binding_audit.rs"

[[bin]]
name = "validate_architecture"
path = "src/validate_architecture.rs"

