[package]
autotests = false
name = "engine_epk"
version.workspace = true
edition = "2021"
description = "Evaluated Path Kernels (LGGR I, II, III, IV, V, and VI: exact path composition, completion reflection, soundness check, Gram probing, and detector adequacy)."
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
blake3 = "1.8"
engine_policy = { path = "../engine_policy" }
engine_holonomy = { path = "../engine_holonomy" }
engine_homology = { path = "../engine_homology" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
engine_types = { path = "../engine_types" }
engine_functional = { path = "../engine_functional" }
engine_replay = { path = "../engine_replay" }
linear_algebra = { package = "linear_algebra", path = "../linear_algebra" }

[dev-dependencies]
engine_kernel = { path = "../engine_kernel" }

