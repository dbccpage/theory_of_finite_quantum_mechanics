[package]
autotests = false
name = "engine_prompt_evolution"
version.workspace = true
edition = "2021"
description = "Anti-skill pharmacy: typed detector operations over candidate packets, with detection separated from repair"
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_prompt_evolution`.

