[package]
autotests = false
name = "engine_symbol_host_runtime"
version.workspace = true
edition = "2021"
description = "symbol host round loop: candidate packets, host round records, frontier state, and exact domain adapters"
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
linear_algebra = { path = "../linear_algebra" }
engine_kernel = { path = "../engine_kernel" }
engine_operad_theory = { path = "../engine_operad_theory" }
engine_prompt_evolution = { path = "../engine_prompt_evolution" }
engine_wdp = { path = "../engine_wdp" }
engine_functional = { path = "../engine_functional" }
engine_quantum_physics = { path = "../engine_quantum_physics" }
engine_homology = { path = "../engine_homology" }
engine_holonomy = { path = "../engine_holonomy" }
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ryu = "1.0"
blake3 = "1.8"
serde_yaml = "0.9"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "symgam"
path = "src/main.rs"

