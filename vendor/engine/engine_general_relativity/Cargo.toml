[package]
autotests = false
name = "engine_general_relativity"
version.workspace = true
edition = "2021"
description = "Domain dual-face GR: finite Regge calculus on engine_homology simplicial complexes (AuthorityEffect None)"
license.workspace = true

[dependencies]
engine_homology = { path = "../engine_homology" }
engine_holonomy = { path = "../engine_holonomy" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"
engine_number_theory = { path = "../engine_number_theory" }
linear_algebra = { path = "../linear_algebra" }
engine_lie_theory = { path = "../engine_lie_theory" }

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_general_relativity`.

[[test]]
name = "certified_dihedral"
path = "../tests/engine_general_relativity/certified_dihedral.rs"

[[test]]
name = "finite_physics"
path = "../tests/engine_general_relativity/finite_physics.rs"

[[test]]
name = "metric_hinge_transport"
path = "../tests/engine_general_relativity/metric_hinge_transport.rs"

[[test]]
name = "review_regressions"
path = "../tests/engine_general_relativity/review_regressions.rs"

[[test]]
name = "test_dec_input_bounds"
path = "../tests/engine_general_relativity/test_dec_input_bounds.rs"

[[test]]
name = "test_regge_4d"
path = "../tests/engine_general_relativity/test_regge_4d.rs"

[[test]]
name = "test_regge_calculus_foundations"
path = "../tests/engine_general_relativity/test_regge_calculus_foundations.rs"

[[test]]
name = "test_regge_deficit_holonomy"
path = "../tests/engine_general_relativity/test_regge_deficit_holonomy.rs"
