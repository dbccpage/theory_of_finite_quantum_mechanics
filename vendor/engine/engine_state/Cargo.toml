[package]
autotests = false
name = "engine_state"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
linear_algebra = { path = "../linear_algebra" }
engine_homology = { path = "../engine_homology" }
engine_types = { path = "../engine_types" }
engine_contracts = { path = "../engine_contracts" }
engine_wdp = { path = "../engine_wdp" }
engine_lifts = { path = "../engine_lifts" }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
thiserror = "2"

