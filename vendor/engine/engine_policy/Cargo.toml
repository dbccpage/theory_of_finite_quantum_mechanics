[package]
autotests = false
name = "engine_policy"
version.workspace = true
edition = "2021"
description = "Layer 6: admissibility evaluation and ActionLicense minting for the engine execution waist"
authors = ["Engine contributors"]
license.workspace = true

[dependencies]
num-rational = "0.4"
num-traits = "0.2"
engine_kernel = { path = "../engine_kernel" }
engine_functional = { path = "../engine_functional" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
serde_yaml = "0.9"
num-bigint = "0.4"
engine_contracts = { path = "../engine_contracts" }
tempfile = "3"

[[bin]]
name = "policy_manifest_gate"
path = "src/bin/policy_manifest_gate.rs"

# Shared integration-test targets. Sources and fixtures live in `../tests/engine_policy`.

[[test]]
name = "conformance_gamma2_trichotomy"
path = "../tests/engine_policy/conformance_gamma2_trichotomy.rs"

[[test]]
name = "conformance_pl012_descent_dsl"
path = "../tests/engine_policy/conformance_pl012_descent_dsl.rs"

[[test]]
name = "licensing_boundary_holes"
path = "../tests/engine_policy/licensing_boundary_holes.rs"

[[test]]
name = "local_ci_gate_eval"
path = "../tests/engine_policy/local_ci_gate_eval.rs"

[[test]]
name = "custody_manifest_falsification"
path = "tests/custody_manifest_falsification.rs"
