      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_parity_observable_algebra_and_sector_splitting", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C9"
    name: "Pfaffian Positivity Scope"
    statement: "Local Pfaffian non-negativity under declared time-reversal/particle-hole symmetries does not solve the generic NP-hard fermion sign problem."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["pfaffian_topological_sign"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["pfaffian_z2_invariant", "compute_skew_pfaffian"]
      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_pfaffian_z2_topological_invariant", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C10"
    name: "Observer Projection Quarantine"
    statement: "Continuous device baths, continuum BdG spectra, and vendor marketing are external observer projections; they do not populate F2 receipts or mint authority."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["detector_inadequate_when_kernel_nontrivial"]
      axioms: []
    code_evidence:
