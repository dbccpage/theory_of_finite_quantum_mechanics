  - id: "MAJ-C17"
    name: "Norm Equivalence on Binary Carriers"
    statement: "For any v in {0, 1}^n, ||v||_p^p = wt(v) for all p >= 1; l1 and l2 minimizations coincide identically over F2, refuting purported norm separation claims."
    claim_type: "Theorem"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["f2_weight_l1_l2_coincide"]
      axioms: []
    code_evidence:
