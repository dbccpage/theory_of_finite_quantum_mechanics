      tests: ["code/tests/unit/test_open_system_transfer_bounds.py::test_multiterminal_cross_junction_transfer_bounds_and_disorder", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

