paper_id: "026_microsoft_majorana_problem"
title: "The Majorana Problem: Finite Parity Schedules, Ising Algebra, and What Hardware Claims Do Not Discharge"
authority_effect: "None"
date: "2026-09-19"

claims:
  - id: "MAJ-C1"
    name: "The Microsoft Majorana Problem"
    statement: "The realization packet gap between continuous laboratory hardware narratives (InAs-Al nanowires, ZBAs, capacitance shifts) and discrete algebraic verification schedules (F2 homology, Ising matrices)."
    claim_type: "Definition"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["transfer_gap_strictly_positive", "detector_inadequate_when_kernel_nontrivial"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["DetectorAdequacyAudit.audit_syndrome_readout", "DetectorAdequacyAudit.audit_homology_readout"]
      tests: ["code/tests/integration/test_tetron_surface_codes.py::test_detector_adequacy_syndrome_vs_homology", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C2"
    name: "F2 Residual Trichotomy"
    statement: "For any cochain complex C0 -> C1 -> C2 over F2 with d1 d0 = 0, every w in C1 is exclusively Exact, ClosedResidual, or OpenObstruction."
    claim_type: "Theorem"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["coboundary_is_cocycle", "exact_not_open", "exact_not_closed_residual", "closed_residual_not_open", "trichotomy_pairwise_disjoint"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["classify_residual"]
      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_residual_trichotomy_classification", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C3"
    name: "Polynomial-Time Decidability"
    statement: "Lean declaration gaussian_elimination_cubic_bound proves gaussian_elimination_ops n <= n * n * n by Nat.le_refl, and gaussian_elimination_ops n is defined as n * n * n. That declaration does not exhibit Gaussian elimination and does not decide the F2 trichotomy."
    claim_type: "Theorem"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["gaussian_elimination_cubic_bound"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["GF2Matrix.rank", "GF2Matrix.solve"]
      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_gf2_matrix_rank_and_solve"]

  - id: "MAJ-C4"
    name: "Nilpotency Refusal"
    statement: "If d1 o d0 != 0 mod 2, evaluation is strictly refused (RepresentationInvalid); no homology labels are emitted."
    claim_type: "Proposition"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["coboundary_is_cocycle", "nilpotency_refusal_sound"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["F2CochainComplex.is_nilpotent", "classify_residual"]
      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_cochain_nilpotency_and_refusal", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C5"
    name: "Surface Toy Scope Fence"
    statement: "Multi-plaquette surface code models are diagnostic shadows for software schedules, not physical threshold certificates or fault-tolerance proofs. Lean surface_code_error_detection_bound is the identity err_weight < code_distance -> err_weight < code_distance. The fence is this sentence."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["surface_code_error_detection_bound"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["build_tetron_carrier"]
      tests: ["code/tests/integration/test_tetron_surface_codes.py::test_tetron_homology_dimensions", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C6"
    name: "Kitaev Chain Import"
    statement: "The 1D Kitaev wire Hamiltonian, BdG spectrum, and topological phase bounds are standard imported models, not theorems derived by discrete algebra."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["mzm_boundary_decoupling", "disjoint_majorana_pair_commute"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["KitaevSweetSpotChain"]
      tests: ["code/tests/integration/test_tetron_surface_codes.py::test_kitaev_sweet_spot_boundary_isolation", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C7"
    name: "Ising Anyon Algebraic Bounds"
    statement: "Fusion rules sigma x sigma = 1 + psi and specialized Q(zeta16) braid matrices check software consistency, but do not prove physical anyon braiding or universal TQC."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["ising_quantum_dim_squared"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
      functions: ["IsingFusionAlgebra.verify_quantum_dimensions", "IsingFusionAlgebra.verify_yang_baxter_braid"]
      tests: ["code/tests/unit/test_gf2_trichotomy.py::test_ising_fusion_and_braid_relations", "code/tests/e2e/test_majorana_problem_e2e.py::test_monograph_claims_e2e_verification_walk"]

  - id: "MAJ-C8"
    name: "Parity Observable Isolation"
    statement: "Z2 parity operator algebra commuting with an effective Hamiltonian is an algebraic consistency property, not experimental proof of quantum capacitance or topological protection."
    claim_type: "ScopeFence"
    lean4_formalization:
      module: "MajoranaCore"
      theorems: ["parity_eigenvalues"]
      axioms: []
    code_evidence:
      module: "majorana_evaluator"
