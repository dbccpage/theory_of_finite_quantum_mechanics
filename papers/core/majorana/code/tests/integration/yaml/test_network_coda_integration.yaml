test_suite: test_network_coda_integration
category: integration_test
description: Integration test specifications for network cochains, higher simplices, and gauge fixing.

tests:
  - test_name: test_integration_net_01_incidence_and_gauge_fix
    route: anomalon.coda.network_residual.build_incidence, residual_after_gauge_fix
    input:
      edges: [[0, 1], [1, 2], [2, 0]]
      num_nodes: 3
      weights: [1, 1, 1]
    expected_output:
      incidence_shape: [3, 3]
      residual_type: number (int/float/Fraction)

  - test_name: test_integration_net_02_face_boundary_curl
    route: anomalon.coda.network_residual.build_face_boundary, curl
    input:
      edges: [[0, 1], [1, 2], [2, 0]]
      faces: [[0, 1, 2]]
      weights: [1, 2, 3]
    expected_output:
      boundary_shape: [3, 1]
      curl_length: 1

  - test_name: test_integration_net_03_tetrahedron_boundary_sum
    route: anomalon.coda.network_residual.build_tetrahedron_boundary, tetrahedral_boundary_sum
    input:
      edges: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]]
      faces: [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]]
      tetrahedra: [[0, 1, 2, 3]]
    expected_output:
      boundary_shape: [4, 1]
      tetrahedral_boundary_sum_non_null: true

  - test_name: test_integration_net_04_4simplex_5simplex_boundary_chain
    route: anomalon.coda.network_residual.four_simplex_boundary_sum, five_simplex_boundary_sum
    input:
      edges: [[0, 1], [0, 2], [1, 2]]
      num_nodes: 3
    expected_output:
      s4_sum_non_null: true
      s5_sum_non_null: true

  - test_name: test_integration_net_05_6simplex_boundary_chain
    route: anomalon.coda.network_residual.six_simplex_boundary_sum
    input:
      edges: [[0, 1], [1, 2], [2, 0]]
      num_nodes: 3
    expected_output:
      s6_sum_non_null: true

  - test_name: test_integration_net_06_multicycle_l1_joint_optimization
    route: anomalon.coda.network_residual.multi_cycle_l1_joint
    input:
      edges: [[0, 1], [1, 2], [2, 0], [2, 3], [3, 0]]
      weights: [1, 0, 1, 2, 1]
    expected_output:
      joint_residual_non_null: true

  - test_name: test_integration_net_07_cochain_adapter_boundary_lift
    route: anomalon.coda.network_residual.gradient
    input:
      edges: [[0, 1], [1, 2], [2, 0]]
      node_potentials: [1, 2, 4]
    expected_output:
      gradient_length: 3

  - test_name: test_integration_net_08_cochain_presentation_hodge_duality
    route: anomalon.coda.cochain_presentation
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_net_09_graph_coloring_cohomology_bridge
    route: anomalon.coda.graph_coloring_cohomology
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_net_10_genus_2_surface_hodge_integration
    route: anomalon.coda.genus_2_surface_hodge_benchmark
    input:
      module_load: true
    expected_output:
      has_name_attribute: true


