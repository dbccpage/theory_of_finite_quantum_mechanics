  - id: "MUB6-C40"
    name: "Szöllősi Common-Ray Reduction"
    statement: "For a raw complex Hadamard H, H lies in a quartet with I iff two orthonormal bases of common rays of I and H are mutually unbiased; so if no two common rays are unbiased, H is in no quartet. Owner build of 2026-10-15 recorded lake exit 0 and axioms propext, Classical.choice, Quot.sound; the source digest is unchanged on main; not rebuilt on 2026-10-16."
    claim_type: "FormalLeanTheorem"
    lean4:
      module: "SzollosiCommonRays"
      theorems:
        - "quartet_iff_ray_bases"
        - "no_quartet_of_no_unbiased_ray_pair"
    code_evidence:
      artifacts:
        - "research/five_derivations_20261015/execution_receipt.json"

