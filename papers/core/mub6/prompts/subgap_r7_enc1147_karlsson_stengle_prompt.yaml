user_prompt: |
  ========================================================================================
  TASK SPECIFICATION: SUBGAP R7 (ENC-1147)
  AUTHENTIC CONSTRUCTION & MACHINE CHECK OF AN EXACT RATIONAL STENGLE POSITIVSTELLENSATZ
  CERTIFICATE OVER Q FOR THE KARLSSON BOUNDARY LOCUS (z=0 SINGULAR DIȚĂ SLICE)
  ========================================================================================

  EPISTEMIC FIREWALL MANDATE:
  "stated region only; mints no authority."
  AuthorityEffect: None.

  1. PROBLEM CONTEXT & GOVERNING EQUATIONS
  -----------------------------------------
  In the MUB(6) global research program, Premise G1 (Moduli Variety Exhaustion) requires
  establishing that the 50-real-variable algebraic variety H_6 of dephased 6x6 Complex
  Hadamard Matrices contains no uncatalogued components outside the 5 known continuous
  and sporadic families:
    - F_6: Fourier matrix (confluent affine basepoint, defect 4)
    - D_6(alpha, beta): Diță 2-parameter affine family
    - S_6: Chernyavsky-Tao isolated matrix (defect 0)
    - B_6(theta): Szöllősi 1-parameter non-affine family (deltoid cusps, Haagerup H_6)
    - K_6^(3)(x, y, z): Karlsson 3-parameter continuous manifold connecting D_6 and B_6

  Subgap R7 (ENC-1147: Full 6x6 CHM exhaustion) focuses on the boundary degeneration of
  the Karlsson manifold. As the parameter z -> 0, the 3-parameter Karlsson manifold
  degenerates onto its 2D boundary locus: the singular Diță slice {z = 0}.

  Along this boundary locus:
  1. The 3x3 corner submatrix determinant vanishes identically: P_corner(H) = 0.
  2. The dephased entry coordinates satisfy the Segre quadric relation:
       f_segre(a, b, c, d) = (a - 1)(d - 1) - (b - 1)(c - 1) = 0
     where a, b, c, d in Q represent the real parts of the four non-trivial phase entries
     of the 2x2 corner block in dephased coordinates.
  3. The unimodularity of these entries imposes the circle ideal generators:
       f_a = a^2 - 1 = 0
       f_b = b^2 - 1 = 0
       f_c = c^2 - 1 = 0
       f_d = d^2 - 1 = 0
       f_circ = f_a + f_b + f_c + f_d = a^2 + b^2 + c^2 + d^2 - 4 = 0
  4. The catalogued points on this slice are the discrete locked Diță seeds (Y2 (x) Q1 and
     Y2 (x) Q2) and the boundary of the 2D periodic collar. Outside an eps_0-neighborhood
     of this catalog (where eps_0^2 = 1/1000 in exact rational arithmetic), any hypothetical
     detached component must lie in the exterior separation region:
       g_sep(a, b, c, d) >= eps_0^2

  2. MATHEMATICAL OBJECTIVE: STENGLE POSITIVSTELLENSATZ REFUTATION
  ---------------------------------------------------------------
  Your primary mathematical objective is to construct and mechanically verify an explicit,
  exact rational Stengle Positivstellensatz infeasibility certificate over Q[a, b, c, d]
  proving that the semialgebraic set:
    S_exterior = { (a, b, c, d) in R^4 :
                   f_segre = 0,
                   f_a = 0, f_b = 0, f_c = 0, f_d = 0,
                   g_sep(a, b, c, d) >= eps_0^2 }
  is completely empty (S_exterior = empty_set), thereby establishing that the Karlsson
  boundary locus admits no fourth mutually unbiased basis across the exterior separation
  region.

  The certificate must take the exact algebraic form:
    -1 = h_segre * f_segre + sum_{k in {a, b, c, d}} h_k * f_k + sigma_0 + sigma_1 * g_sep
  where:
    - sigma_0 in Sigma^2 Q[a, b, c, d] is an explicit sum of squares of polynomials with rational coefficients.
    - sigma_1 in Q_{>0} is a strictly positive rational constant (hence a trivial square).
    - h_segre, h_a, h_b, h_c, h_d in Q[a, b, c, d] are exact rational multiplier polynomials.
    - g_sep(a, b, c, d) = f_sep(a, b, c, d) - eps_0^2 is the semialgebraic boundary guard,
      with f_sep = (1 - eps_0^2) * sigma_0 + f_circ.

  3. REQUIRED TECHNICAL DELIVERABLES
  -----------------------------------
  You must execute and report the following four distinct deliverables:

  DELIVERABLE 1: ALGEBRAIC DERIVATION & MULTIPLIER SPECIFICATION
    (a) Provide the explicit formula for sigma_0, proving that it is identically a sum of
        squares (e.g., sigma_0 = (1/4)*f_segre^2 + (1/4)*f_circ^2 >= 0).
    (b) Provide the explicit rational formulas for h_segre and h_k (k in {a,b,c,d}) in terms
        of f_segre, f_circ, and eps_0.
    (c) Show step-by-step the exact symbolic cancellation demonstrating that:
          RHS = h_segre * f_segre + sum_k h_k * f_k + sigma_0 + sigma_1 * g_sep
        reduces identically to the constant polynomial -1 in Q[a, b, c, d].

  DELIVERABLE 2: EXHAUSTIVE GRID VANISHING MACHINE CHECK
    (a) Because (RHS + 1) has degree at most 4 in each variable a, b, c, d, the polynomial
        is identically zero if and only if it vanishes on the Cartesian product grid
        G = {0, 1, 2, 3, 4}^4 (5^4 = 625 evaluation points).
    (b) Formulate the exact decision procedure (zero float, exact Fraction) that audits:
        - sigma_0(p) >= 0 and sigma_1 >= 0 at every grid point p in G.
        - RHS(p) == -1 at every grid point p in G.
    (c) Report the typed verification receipt matching schema 'omega.mub6.r7_singular_segre_sos.v1',
        confirming 'polynomial_identity_holds: true' and 'zero_float_verified: true'.

  DELIVERABLE 3: LEAN 4 FORMAL MECHANIZATION BLUEPRINT
    (a) Provide the exact Lean 4 theorem declaration and reflection tactic code for:
          theorem karlsson_boundary_stengle_identity_holds (eps : Rat) (h_eps : eps > 0) :
            singular_segre_identity eps = -1 := by rfl
    (b) Outline the bridge theorem linking this algebraic certificate to the ZeroRel variety
        formalization in `lean4/gluing/ZeroRelVariety.lean` and `ModuliReduction.lean`:
          theorem no_fourth_basis_karlsson_boundary_exterior :
            forall (H : Matrix (Fin 6) (Fin 6) Complex),
              IsKarlssonBoundarySlice H ->
              g_sep_eval H >= eps_0^2 ->
              IsEmptyRealZeroRelVariety (MU_Triple_Of H)
    (c) Confirm that this mechanization requires ZERO custom user axioms and depends only
        on standard Lean 4 core logic: [propext, Classical.choice, Quot.sound].

  DELIVERABLE 4: FOUR-PART CLAIM HYGIENE ENVELOPE
    Provide the rigorous, non-promotional epistemic evaluation:
    1. What it supports: The precise semialgebraic region refutation certified by this identity.
    2. What it does not support: Why this does NOT prove MUB(6)=3, does NOT prove MUB(6)<=3,
       and does NOT resolve the interior volume z in (0, 1/1000] without the Lipschitz collar bridge.
    3. The narrowest defensible claim: The exact mathematical theorem warranted by this receipt.
    4. The next test needed: The immediate computational or formal check required to advance the proof.

  4. EXECUTION CONSTRAINTS
  ------------------------
  - Strict zero-float enforcement: No float, cmath, double, or numerical tolerance.
  - Strict claim hygiene: Zero forbidden promotional verbs.
  - The response must strictly adhere to the declared response_schema.

