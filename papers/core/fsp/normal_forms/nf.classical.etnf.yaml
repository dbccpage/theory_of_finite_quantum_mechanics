schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.etnf
  name: Essential Tuple Normal Form
  short_name: ETNF
  version: v0
  theory_status: established
  contract_status: draft
  verification_status: absent
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: redundant tuples in legal instances created by join dependencies where no component
    is a superkey
  preserves_invariant: relvar is in BCNF and some component of every explicitly declared non-trivial join
    dependency is a superkey, ensuring every tuple in every legal instance is an essential tuple
  protected_skeleton:
  - candidate_keys
  - functional_dependencies
  - join_dependencies
  - essential_tuples
  erased_structure: []
  non_claims:
  - does not replace full 5NF/PJNF (which requires every component of non-trivial JDs to be a superkey)
  - ETNF requires at least one (some) component of each explicitly declared non-trivial JD to be a superkey,
    not all components
  - does not certify runtime repair without cochain substrate
  - does not imply authorization
declarations_required:
- heading
- candidate_keys
- functional_dependencies
- explicitly_declared_join_dependencies: '*(R_1, R_2, ..., R_n)'
- relation_predicate
evidence_required: []
validation_criteria:
- relvar satisfies BCNF (every determinant of a non-trivial FD is a superkey)
- for every explicitly declared non-trivial join dependency *(R_1, ..., R_n), at least one component R_i
  is a superkey
- non-essential tuple redundancy terminalizes as join dependency decomposition requirement
proof_obligations:
- id: etnf.between_4nf_and_5nf
  status: theorem_shaped
  ref: https://research.ibm.com/publications/a-normal-form-for-preventing-redundant-tuples-in-relational-databases
  statement: Every relvar in 5NF is in ETNF, and every relvar in ETNF is in 4NF (and in BCNF)
terminal_routes:
- Accept
- RejectNonEssentialTupleRedundancy
- RequireJoinDependencyDecomposition
terminal_route_map:
  Accept: Preserve
  RejectNonEssentialTupleRedundancy: Reject
  RequireJoinDependencyDecomposition: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: relvar in BCNF contains redundant tuples constructible from sub-projections because an explicitly
    declared non-trivial JD lacks any superkey component
  diagnosis: essential tuple redundancy violating ETNF
  terminal: RejectNonEssentialTupleRedundancy
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- https://research.ibm.com/publications/a-normal-form-for-preventing-redundant-tuples-in-relational-databases
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
