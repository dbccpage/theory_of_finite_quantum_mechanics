schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.classical.4nf
  name: Multivalued Dependency Fourth Normal Form
  short_name: 4NF
  version: v0
  theory_status: established
  contract_status: active
  verification_status: absent
  family: shape
classification:
  hierarchy_level: normal_form
  subject_kind:
  - relvar
  data_posture: at_rest
  mathematical_posture: operational
purpose:
  excludes_anomaly: non-trivial multivalued dependency with non-superkey determinant
  preserves_invariant: independent multivalued facts are separated into independent relvars, eliminating
    tuple-combinatorial cross-product redundancy
  protected_skeleton:
  - candidate_keys
  - superkeys
  - multivalued_dependencies
  erased_structure: []
  non_claims:
  - does not resolve all join dependencies (see ETNF, 5NF, 6NF)
  - does not certify runtime repair without cochain substrate
  - does not imply authorization
declarations_required:
- heading
- candidate_keys
- superkeys
- multivalued_dependencies
- relation_predicate
evidence_required: []
validation_criteria:
- for every non-trivial multivalued dependency X ->-> Y (where Y is not a subset of X and X union Y does
  not equal the full heading), X is a superkey
- independent multivalued facts are decomposed into separate relvars with lossless reconstruction
proof_obligations:
- id: 4nf.fagin_multivalued_dependency_theorem
  status: theorem_shaped
  ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  statement: In 4NF, every non-trivial multivalued dependency is determined by a superkey, eliminating
    independent MVD Cartesian product anomalies
terminal_routes:
- Accept
- RejectMultivaluedDependency
- RequireDecomposition
terminal_route_map:
  Accept: Preserve
  RejectMultivaluedDependency: Reject
  RequireDecomposition: Decompose
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: employee skills and employee languages are stored in one relvar, creating all pairwise cross-product
    combinations
  diagnosis: independent multivalued dependencies share a non-superkey determinant
  terminal: RejectMultivaluedDependency
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
  section: 2.1 Classical Relational Normal Forms
references:
- coda_all_universe/1_the_tower/normal_forms/contracts/_book_09_full_normal_form_atlas.md
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_0_relvar_relation_table_and_boundary_relvar.md
- ./normal_form_contract_schema.yaml
normalization:
  kind: admissibility_predicate
  claim_scope: Relational admissibility predicate relative to declared dependencies; no unique representative
    or normalizing algorithm is certified here.
  evidence: ../docs/normal_form_audit.md
