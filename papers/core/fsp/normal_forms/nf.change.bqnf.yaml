schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: normal_form_contract
identity:
  id: nf.change.bqnf
  name: Boundary-Quotient Normal Form
  short_name: BQNF
  version: v0
  theory_status: proposed
  contract_status: draft
  verification_status: absent
  family: change
classification:
  hierarchy_level: normal_form
  subject_kind:
  - boundary_relvar
  - observer_relvar
  - query_shape
  data_posture: in_motion
  mathematical_posture: operational
purpose:
  excludes_anomaly: silent under-invalidation / uncertified local repair during incremental maintenance
  preserves_invariant: runtime incremental repair preserves declared query semantics on admitted additive
    SPJA operator fragment
  protected_skeleton:
  - boundary_fingerprint
  - c0_repair_potentials
  - c1_defects
  - d0_repair_image
  - d1_closure
  erased_structure: []
  non_claims:
  - does not authorize policy use (billing, safety automation)
  - does not prove transport of compiled shapes (see CODA-MUR)
  - does not guarantee global multi-master replica consistency
  - exactness applies strictly to declared additive monoids (SUM, COUNT, AVG) with linear maintenance
    policies; non-commutative or non-invertible aggregations (e.g. MIN, MAX under deletions) require full
    recomputation
declarations_required:
- boundary_fingerprint:
    relations: []
    attributes: []
    predicates: []
    groups: []
    aggregates: []
    policies: []
- delta_program
- admitted_spja_fragment:
    operators:
    - select
    - project
    - join
    - aggregate
    admitted_aggregates:
    - SUM
    - COUNT
    - AVG
- quotient_space: Q1 = C1 / im(d0)
- repair_image: im(d0)
- terminal_routes
evidence_required:
- cdc_operation_kind:
  - INSERT
  - UPDATE
  - DELETE
- old_row: required for UPDATE and DELETE; tagged absent for INSERT
- new_row: required for INSERT and UPDATE; tagged absent for DELETE
- changed_attributes: list of modified attribute tokens
- predicate_membership_before_after
- group_key_before_after
- policy_context
validation_criteria:
- boundary is declared before runtime
- boundary intersection is computed for each write event
- delta is computable from available evidence when intersection is nonempty
- d1 . d0 == 0 holds whenever d1 closure operator is declared
- defect maps to computable obstruction class in Q1 (and in H1 if d1 is declared)
- repair allowed only when obstruction_class == "[0]" equivalently omega = d0(alpha)
- nonzero unknown or missing-evidence obstruction terminalizes loudly
proof_obligations:
- id: bqnf.boundary_exactness
  status: theorem_shaped
  ref: coda_all_universe/1_the_tower/normal_forms/contracts/_paper_a_bqnf_incremental_repair.md
  section: '6.1'
- id: bqnf.boundary_repair_soundness
  status: theorem_shaped
  ref: coda_all_universe/1_the_tower/normal_forms/contracts/_paper_a_bqnf_incremental_repair.md
  section: '6.2'
terminal_routes:
- Preserve
- Repair
- Invalidate
- Recompute
- Serialize
- Lift
- Unsupported
- ConservativeInvalidate
- Escalate
- ClosureFailure
- Residual
terminal_route_map:
  Preserve: Preserve
  Repair: Repair
  Invalidate: Invalidate
  Recompute: Recompute
  Serialize: Serialize
  Lift: Lift
  Unsupported: Unsupported
  ConservativeInvalidate: ConservativeInvalidate
  Escalate: Escalate
  ClosureFailure: ClosureFailure
  Residual: Escalate
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: cache patched after CDC missing status before/after
  diagnosis: delta not computable clause 2
  terminal: Invalidate
- symptom: aggregate wrong after update
  diagnosis: repair without omega = d0 alpha
  terminal: Invalidate
- symptom: MIN MAX wrong after delete of extremum row
  diagnosis: no admissible alpha in C0 for non-invertible aggregate
  terminal: Unsupported
- symptom: parallel group moves lose updates
  diagnosis: defects do not commute
  terminal: Serialize
examples:
- ref: coda_all_universe/1_the_tower/normal_forms/contracts/_paper_a_bqnf_incremental_repair.md
  section: 3. Running example
references:
- coda_all_universe/1_the_tower/normal_forms/contracts/_paper_a_bqnf_incremental_repair.md
- ./normal_form_contract_schema.yaml
normalization:
  kind: operational_contract
  claim_scope: Operational evidence contract; no canonical representative, idempotence, or equivalence
    completeness is established by its route predicates.
  evidence: ../docs/normal_form_audit.md
