- id: GIN-C1
  name: Mode Posting List Query Efficiency
  statement: A query over k modes uses k posting-list operations, with cost depending on their cardinalities
    and output size. Explicit path enumeration can be exponential in lattice size.
  claim_type: ImplementationBound
  code_evidence:
    module: MockFermionGinIndex
    functions:
    - MockFermionGinIndex.query_by_modes
    tests:
    - code/tests/test_fermion_gin_index.py::test_gin_posting_index_creation_and_fast_lookup
  withdrawal_or_scope_correction:
    date: '2026-09-22'
    previous_statement: Inverted mode posting lists index fermionic configurations such that spectator-preserving
      mode queries resolve in O(k) set intersections.
- id: GIN-C2
