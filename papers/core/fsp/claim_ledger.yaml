    two-particle free triangle at beta=2 and three Euler slices is such a fixture; frustration alone does
    not imply disjoint spectra or hardness.
  claim_type: ConditionalTheoremAndFixture
  code_evidence:
    module: HamiltonianGinBridge
    functions:
    - HamiltonianGinBridge.audit_sign_resolution
    tests:
