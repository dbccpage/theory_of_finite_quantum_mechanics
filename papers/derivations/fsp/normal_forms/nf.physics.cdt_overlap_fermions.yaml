  id: nf.physics.cdt_overlap_fermions
  name: 4D CDT Ginsparg-Wilson & Overlap Dirac Operator Normal Form
  short_name: CDT-OVERLAP-NF
  version: v0
  theory_status: proposed
  contract_status: active
  verification_status: executable
  family: physics
classification:
  hierarchy_level: form
  subject_kind:
  - ginsparg_wilson_relation
  - overlap_dirac_operator
  - luescher_chiral_symmetry
  - atiyah_singer_index_theorem
  - doubler_decoupling
  - causal_dynamical_triangulations
  data_posture: in_motion
  mathematical_posture: operational
  domain_posture: spectral_sign_function_and_overlap_fermions
purpose:
  excludes_anomaly: un-isolated fermion doublers, broken Ginsparg-Wilson relation, violated Lüscher chiral
    invariance, non-integer index traces, and long-range non-local couplings caused by closing spectral
    gaps
  preserves_invariant: exact Ginsparg-Wilson algebraic relation {D, gamma_5} = a D gamma_5 D, Lüscher
    chiral action invariance |delta S| <= 1e-12, single Dirac pole doubler decoupling, integer topological
    index, and formal classification of singular geometries under GinspargWilsonLocalityObstruction
  protected_skeleton:
  - simplicial_complex_geometry
  - wilson_dirac_operator
  - hermitian_hamiltonian_spectral_decomposition
  - neuberger_overlap_dirac_operator
  - luescher_exact_chiral_symmetry
  - lattice_index_theorem
  erased_structure:
  - continuous_spacetime_spinors
  - unphysical_fermion_doublers_at_brillouin_zone_edges
  non_claims:
  - does not claim uniform exponential localization on dynamically degenerate triangulations without a
    positive lower bound on the Wilson spectral gap
  - does not claim absence of exceptional zero-mode crossings during topology-preserving Pachner transitions
declarations_required:
- wilson_operator: discrete Wilson-Dirac operator D_w = D_naive + W on simplicial complex
- hermitian_hamiltonian: H_w = gamma_5 (D_w - m_0) with spectral decomposition
- overlap_operator: Neuberger operator D_ov = (1/a)(I + gamma_5 sgn(H_w))
- gw_relation: anticommutator defect D_ov gamma_5 + gamma_5 D_ov - a D_ov gamma_5 D_ov = 0
- luescher_symmetry: exact chiral transformation delta psi = gamma_5 (I - a D_ov) psi
- topological_index: lattice index (1/2) Tr(gamma_5 a D_ov) = n_+ - n_-
validation_criteria:
- gw_relation_exact: '||D_ov gamma_5 + gamma_5 D_ov - a D_ov gamma_5 D_ov||_inf <= 1e-12'
- luescher_invariance_exact: '|delta S_fermion| <= 1e-12 under Lüscher chiral transformations'
- doubler_mass_gap_positive: doubler modes acquire mass of order 1/a, separating from the physical Dirac
    mode
- index_integer_valued: '|Index - round(Index)| <= 1e-12'
- gapped_regular_complex: spectral gap lambda_min(H_w) > 0 and exponential localization length xi < inf
    routing to ExactChiralOverlapPreserved
- gapless_singular_complex: closing spectral gap lambda_min(H_w) < 1e-6 routing to GinspargWilsonLocalityObstruction
terminal_routes:
- ExactChiralOverlapPreserved
- GinspargWilsonLocalityObstruction
- GinspargWilsonRelationBreach
- ChiralInvarianceViolation
terminal_route_map:
  ExactChiralOverlapPreserved: Escalate
  GinspargWilsonLocalityObstruction: Escalate
  GinspargWilsonRelationBreach: Escalate
  ChiralInvarianceViolation: Escalate
