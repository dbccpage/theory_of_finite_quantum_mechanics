schema_version: smplx.nf.contract.v0
contract_kind: form_contract
identity:
  id: nf.physics.cdt_fermion_sign
  name: 4D CDT Fermionic Grassmann Path Integrals & BQNF Sign Normal Form
  short_name: CDT-FSIGN-NF
  version: v0
  theory_status: proposed
  contract_status: active
  verification_status: executable
  family: physics
classification:
  hierarchy_level: form
  subject_kind:
  - fermionic_matter_fields
  - grassmann_path_integrals
  - fermion_determinant_sign_problem
  - boundary_quotient_normal_form
  - cochain_involution_witness
  - causal_dynamical_triangulations
  data_posture: in_motion
  mathematical_posture: operational
  domain_posture: discrete_dirac_operator_and_bqnf_involution
purpose:
  excludes_anomaly: un-isolated sign problem divergences, unverified determinant sign flips, unbounded
    fermion sign fluctuations, and conflation of statistical sign cancellation with topological pairing
    invariants
  preserves_invariant: For the declared finite model, Berezin Gaussian integration yields det(D); a supplied
    exact opposite-sign equal-weight involution cancels its active rows. No general quotient-distance
    bound on average sign is established.
  protected_skeleton:
  - simplicial_complex_geometry
  - discrete_dirac_operator
  - grassmann_determinant_signs
  - bqnf_cochain_involution_witness
  - banach_quotient_norm_bounds
  - fermionic_partition_functions
  erased_structure:
  - continuous_spinor_manifolds
  - infinite_dimensional_grassmann_algebras
  non_claims:
  - does not claim polynomial-time solution of generic NP-hard fermion sign problems on arbitrary non-bipartite
    4D triangulations
  - does not claim absence of exponential sign decay in chiral or magnetically frustrated simplicial geometries
    without global parity or reflection symmetries
declarations_required:
- dirac_operator: "anti-Hermitian discrete or K\xE4hler-Dirac operator D[T] on simplicial complex"
- grassmann_path_integral: Berezin integral over Grassmann variables yielding det(D[T])
- fermion_sign: sign of real part of determinant sgn(Re(det(D))) in {-1, 1}
- bqnf_involution_witness: pairing involution Xi satisfying involutive, fixed-point-free, sign-reversing,
    and weight-preserving conditions
- banach_quotient_norm: Phi_1 = inf_alpha ||c_1 - d_0 alpha||_1 bounding average sign <Sign>
validation_criteria:
- dirac_antihermitian: discrete Dirac operator satisfies D^dagger = -D or (gamma^5 D)^dagger = gamma^5
    D
- grassmann_scaling_verified: Grassmann path integral evaluates to det(D[T]) with exact Berezin scaling
- exact_involution_certified: for bipartite/reflection-symmetric complexes, involution Xi achieves exact
    pair-wise cancellation w(i)*s(i) + w(Xi(i))*s(Xi(i)) = 0
- obstruction_registered: ensembles with Phi_1 > 0 and decaying <Sign> ~ exp(-beta V_4 Delta f) are routed
    to OpenSignObstruction
terminal_routes:
- ExactCancellation
- OpenSignObstruction
- InvalidInvolutionWitness
- DivergentSignDecay
terminal_route_map:
  ExactCancellation: Preserve
  OpenSignObstruction: Escalate
  InvalidInvolutionWitness: Refuse
  DivergentSignDecay: Escalate
normalization:
  kind: operational_contract
  claim_scope: Operational evidence contract; no canonical representative, idempotence, or equivalence
    completeness is established by its route predicates.
  evidence: ../docs/normal_form_audit.md
  withdrawal: The former verified label was unsupported as certification of normalization laws. Executable
    means local diagnostic code exists, not that its physical assumptions or exactness are proved.
  legacy_claim_boundary: Named physics identities and tolerance-based routes below are model declarations
    or numerical diagnostics, not certified normal-form laws or general physical theorems.
  withdrawn_claims:
  - The proposed bound average_sign >= 1 - Phi_1 / norm(c1) is false without a model-specific bridge;
    d0=identity and signs=(+1,-1) with equal magnitudes gives Phi_1=0 and average_sign=0.
  - Taking sign(Re(det(D))) does not represent a complex determinant phase; restrict the sign formulation
    to real determinants.
route_predicates:
  exact_involution: ExactCancellation
  bounded_obstruction: OpenSignObstruction
  invalid_witness: InvalidInvolutionWitness
  divergent_decay: DivergentSignDecay
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  loss_ledger_trigger_id: null
  verifier_required: false
authorization:
  authorized_by: null
  certified_implies_authorized: false
