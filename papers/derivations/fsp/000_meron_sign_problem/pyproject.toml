[project]
name = "meron-sign-problem"
version = "0.1.0"
description = "A Lexically Filtered Meron-Cluster Benchmark: Exact Ground Truth, Mechanized Cancellation Lemmas, and a Pilot That Exposes Answer Leakage"
authors = [{ name = "Jeremy H. Carroll" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
bench = [
    "requests",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "code"
files = ["code"]
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "code"}
