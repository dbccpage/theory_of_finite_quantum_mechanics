schema_version: 1
problem_id: UQM-20
title: Nondegenerate perturbation theory in two levels
problem_file: problem_sets/problems/undergraduate_qm_25.yaml
conventions:
  arithmetic: q/qr construct exact rational numbers; G is the existing Gaussian-rational scalar.
  outputs: All executable output values are exact rational strings. Symbolic pi, roots, exponentials and
    integrals are explained in the derivation; they are not rationalized.
  runtime: Run the collection verifier from the repository root; it executes these exact YAML code blocks.
    Rust blocks are modules in the generated runner, with crate::scalars linked to the existing source
    file.
analytic_answer:
  perturbative: E_low=1-lambda^2/2+O(lambda^4); E_high=3+lambda^2/2+O(lambda^4); |low> proportional to
    |1>-(lambda/2)|2>+O(lambda^2)
  exact: E=2 plus or minus sqrt(1+lambda^2)
  fixture: Second-order values 7/8 and 25/8; exact values 2 plus or minus sqrt(5)/2; characteristic residual
    1/64 at either approximate energy.
derivation:
- step: 1
  explanation: Write H=H0+lambda V with H0=diag(1,3) and V off-diagonal ones. The first-order shifts V_nn
    vanish. The second-order lower shift is lambda^2 |V21|^2/(1-3)=-lambda^2/2; the upper shift has the
    opposite denominator.
- step: 2
  explanation: The first-order lower eigenvector correction is lambda V21/(1-3)|2>=-(lambda/2)|2>. Its
    norm differs from one at second order, so an expression truncated at first order should not be claimed
    exactly normalized.
- step: 3
  explanation: The characteristic equation is (1-E)(3-E)-lambda^2=0, equivalently (E-2)^2=1+lambda^2.
    This yields the exact spectrum. Expanding sqrt(1+lambda^2)=1+lambda^2/2-lambda^4/8+... explains the
    perturbative coefficients and next omitted order.
- step: 4
  explanation: At lambda=1/2 the second-order shifts are minus and plus 1/8. The approximate energies
    sum to four, as does the exact trace. This trace agreement alone cannot establish that either energy
    is exact.
- step: 5
  explanation: 'Insert 7/8 into the exact characteristic polynomial: (1/8)(17/8)-1/4=1/64. The nonzero
    residual is useful evidence of the approximation boundary. The same residual occurs at 25/8.'
- step: 6
  explanation: A small residual is not by itself a rigorous eigenvalue error bound without additional
    spectral information. Here the exact two-level formula supplies a direct comparison; a larger problem
    would need a separate bound.
solutions:
  python:
    existing_sources:
    - path: code/python/src/linear_algebra/scalars.py
      symbols:
      - q
      - GaussianRational
    walkthrough:
    - Compute the two shifts from lambda squared and the gap.
    - Substitute the lower approximation into the exact characteristic equation.
    - Keep the nonzero residual in the output rather than treating it as a test failure.
    code: |
      from src.linear_algebra.scalars import q, GaussianRational as G
      def solve():
          lam=q(1,2); low=1-lam*lam/2; high=3+lam*lam/2
          residual=(1-low)*(3-low)-lam*lam
          return {"low_second_order":str(low),"high_second_order":str(high),"trace":str(low+high),
                  "characteristic_residual":str(residual),"first_order_mixing":str(-lam/2)}
  rust:
    existing_sources:
    - path: code/rust/src/linear_algebra/scalars.rs
      symbols:
      - q
      - qr
      - GaussianRational
    walkthrough:
    - Use one lambda value for the perturbative formulas and exact polynomial.
    - Serialize the first-order eigenvector coefficient separately.
    - A matching handwritten nonzero residual confirms the intended approximation.
    code: |
      use crate::scalars::{q, qr, GaussianRational as G, Semiring, Ring, Field, Involution};
      use serde_json::{json, Value};
      pub fn solve() -> Value {
          let lam=qr(1,2).unwrap(); let low=q(1)-&lam*&lam/q(2); let high=q(3)+&lam*&lam/q(2);
          let residual=(q(1)-&low)*(q(3)-&low)-&lam*&lam;
          json!({"low_second_order":low.to_string(),"high_second_order":high.to_string(),"trace":(&low+&high).to_string(),
              "characteristic_residual":residual.to_string(),"first_order_mixing":(-&lam/q(2)).to_string()})
      }
verification:
  expected_outputs:
    low_second_order: 7/8
    high_second_order: 25/8
    trace: '4'
    characteristic_residual: 1/64
    first_order_mixing: -1/4
  computational_scope: Exact evaluation of a second-order approximation and its nonzero exact polynomial
    residual.
  not_established:
  - No general perturbation convergence theorem or rigorous remainder bound is executed.
  procedure: Both solve functions are executed independently and compared with the handwritten expected
    outputs and with each other. See results/undergraduate_qm_25/verification.json for the actual run.
lean4:
  status: existing_theorem_referenced
  references:
  - path: lean4/FiniteQM.lean
    symbol: rayleigh_schrodinger_perturbation_and_degenerate_stark_splitting
    scope: The fixed gap, second-order shifts 7/8 and 25/8 and trace identity; not a proof of convergence
      or of the exact square-root spectrum.
  boundary: The cited statement supports only the scope written above. The verification report records
    compilation separately from the analytic solution.
common_pitfalls:
- The lower energy shifts downward because E1-E2 is negative.
- A conserved trace does not make the approximate eigenvalues exact.
improvement_target:
  gap: Residual-to-error certification is absent from the generic perturbation workflow.
  acceptance_criterion: Add spectral-gap-aware bounds and keep them distinct from perturbation order.
