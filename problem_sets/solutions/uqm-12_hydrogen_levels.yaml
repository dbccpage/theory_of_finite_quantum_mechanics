schema_version: 1
problem_id: UQM-12
title: Hydrogen levels, quantum numbers and Lyman alpha
problem_file: problem_sets/problems/undergraduate_qm_25.yaml
conventions:
  arithmetic: q/qr construct exact rational numbers; G is the existing Gaussian-rational scalar.
  outputs: All executable output values are exact rational strings. Symbolic pi, roots, exponentials and
    integrals are explained in the derivation; they are not rationalized.
  runtime: Run the collection verifier from the repository root; it executes these exact YAML code blocks.
    Rust blocks are modules in the generated runner, with crate::scalars linked to the existing source
    file.
analytic_answer:
  energy: E_n=-E_H/(2n^2)
  n3: l=0,1,2 with m=-l,...,l; spatial degeneracy 1+3+5=9
  photon: Delta E=3E_H/8; nu=3E_H/(8h); wavelength=8hc/(3E_H)
derivation:
- step: 1
  explanation: Separate psi=R(r)Y_lm(theta,phi) and set u=rR. The radial equation is -(hbar^2/(2mu))u
    double-prime+[hbar^2 l(l+1)/(2mu r^2)-e^2/(4pi epsilon0 r)]u=E u.
- step: 2
  explanation: For E<0 let kappa=sqrt(-2mu E)/hbar. The asymptotic factors are u=r^(l+1) exp(-kappa r)
    times a power series. The regular confluent-hypergeometric solution avoids exponential growth at infinity
    only when that series terminates.
- step: 3
  explanation: Termination requires 1/(kappa a0)=n_r+l+1=n, with n_r a nonnegative integer. Substituting
    kappa=1/(n a0) into E=-hbar^2 kappa^2/(2mu) gives -E_H/(2n^2). This is the continuum analytic step
    behind the familiar formula.
- step: 4
  explanation: For fixed n, l ranges from zero to n-1 and each l has 2l+1 magnetic values. Summing gives
    n^2 spatial states. At n=3 they form one s, three p and five d states. Spin would double this count
    in the present approximation but has been excluded.
- step: 5
  explanation: A transition from n=2 to n=1 releases E2-E1=(-1/8)-(-1/2)=3/8 Hartree. Energy conservation
    gives h nu=Delta E, or equivalently hbar omega=Delta E. The distinction between nu and omega accounts
    for a factor 2pi.
- step: 6
  explanation: The code evaluates rational level formulas and counts labels. It does not solve the Coulomb
    differential equation or certify spectroscopic precision. Reduced mass and omitted corrections must
    be restored before comparison with experimental wavelengths.
solutions:
  python:
    existing_sources:
    - path: code/python/src/linear_algebra/scalars.py
      symbols:
      - q
      - GaussianRational
    walkthrough:
    - Evaluate -1/(2n^2) using q with explicit denominators.
    - Enumerate each permitted pair (l,m) instead of assuming its count.
    - Subtract initial minus final energy to obtain a positive photon energy.
    code: |
      from src.linear_algebra.scalars import q, GaussianRational as G
      def solve():
          e1=-q(1,2); e2=-q(1,2*2*2); e3=-q(1,2*3*3)
          labels=[(l,m) for l in range(3) for m in range(-l,l+1)]
          return {"E1_over_Hartree":str(e1),"E2_over_Hartree":str(e2),"E3_over_Hartree":str(e3),
                  "photon_over_Hartree":str(e2-e1),"n3_spatial_degeneracy":str(q(len(labels)))}
  rust:
    existing_sources:
    - path: code/rust/src/linear_algebra/scalars.rs
      symbols:
      - q
      - qr
      - GaussianRational
    walkthrough:
    - Use negative exact fractions for bound-state energies.
    - Sum the dimensions 2l+1 for the spatial degeneracy.
    - Report the same dimensionless quantities, without introducing uncertain physical constants.
    code: |
      use crate::scalars::{q, qr, GaussianRational as G, Semiring, Ring, Field, Involution};
      use serde_json::{json, Value};
      pub fn solve() -> Value {
          let e1=-qr(1,2).unwrap(); let e2=-qr(1,8).unwrap(); let e3=-qr(1,18).unwrap();
          let count:i64=(0_i64..3).map(|l|2*l+1).sum();
          json!({"E1_over_Hartree":e1.to_string(),"E2_over_Hartree":e2.to_string(),"E3_over_Hartree":e3.to_string(),
              "photon_over_Hartree":(&e2-&e1).to_string(),"n3_spatial_degeneracy":q(count).to_string()})
      }
verification:
  expected_outputs:
    E1_over_Hartree: -1/2
    E2_over_Hartree: -1/8
    E3_over_Hartree: -1/18
    photon_over_Hartree: 3/8
    n3_spatial_degeneracy: '9'
  computational_scope: Exact Coulomb energy coefficients and finite quantum-number counting conditional
    on the radial quantization formula.
  not_established:
  - No Coulomb radial solver, special-function termination proof or measured line prediction is implemented
    here.
  procedure: Both solve functions are executed independently and compared with the handwritten expected
    outputs and with each other. See results/undergraduate_qm_25/verification.json for the actual run.
lean4:
  status: not_formalized_for_this_problem
  references: []
  boundary: No existing Lean theorem is claimed to prove this complete derivation. Exact execution is
    a calculation, not a proof of the continuum assumptions.
common_pitfalls:
- A Hartree is twice the magnitude of the hydrogen ground energy in these units.
- Count spin only when the problem includes it.
improvement_target:
  gap: The general Coulomb spectrum is an analytic input to the calculation.
  acceptance_criterion: Add a verified recurrence and polynomial-termination certificate before claiming
    a radial equation solver.
