schema_version: 1
problem_id: UQM-06
title: Reflection and transmission at a potential step
problem_file: problem_sets/problems/undergraduate_qm_25.yaml
conventions:
  arithmetic: q/qr construct exact rational numbers; G is the existing Gaussian-rational scalar.
  outputs: All executable output values are exact rational strings. Symbolic pi, roots, exponentials and
    integrals are explained in the derivation; they are not rationalized.
  runtime: Run the collection verifier from the repository root; it executes these exact YAML code blocks.
    Rust blocks are modules in the generated runner, with crate::scalars linked to the existing source
    file.
analytic_answer:
  amplitudes: r=(kL-kR)/(kL+kR)=1/3; t=2kL/(kL+kR)=4/3
  currents: R=|r|^2=1/9; T=(kR/kL)|t|^2=8/9; R+T=1
derivation:
- step: 1
  explanation: Write psiL=exp(i kL x)+r exp(-i kL x) and psiR=t exp(i kR x). Matching at zero gives 1+r=t
    and kL(1-r)=kR t after cancelling the common i.
- step: 2
  explanation: Eliminate t to obtain r=(kL-kR)/(kL+kR), then t=1+r. The coefficients are real for this
    above-step case. For the specified ratio they are 1/3 and 4/3.
- step: 3
  explanation: A plane wave A exp(i kx) carries current hbar k |A|^2/m. The reflected current is negative;
    R is its magnitude divided by the positive incident current.
- step: 4
  explanation: The transmitted group velocity differs from the incident velocity. Therefore T=(kR/kL)|t|^2,
    which is (1/2)*(16/9)=8/9. An amplitude greater than one creates no excess probability current.
- step: 5
  explanation: The identity (kL-kR)^2+4kL kR=(kL+kR)^2 proves R+T=1. The code also checks both boundary
    equations, providing more information than checking a sum of probabilities alone.
solutions:
  python:
    existing_sources:
    - path: code/python/src/linear_algebra/scalars.py
      symbols:
      - q
      - GaussianRational
    walkthrough:
    - Compute amplitudes first and retain them for boundary residuals.
    - Multiply the transmission modulus by kr/kl.
    - Return both matching residuals and the flux sum.
    code: |
      from src.linear_algebra.scalars import q, GaussianRational as G
      def solve():
          kl,kr=q(2),q(1)
          r=(kl-kr)/(kl+kr); t=2*kl/(kl+kr)
          R=r*r; T=kr/kl*t*t
          return {"r":str(r),"t":str(t),"R":str(R),"T":str(T),"flux":str(R+T),
                  "value_residual":str(1+r-t),"derivative_residual":str(kl*(1-r)-kr*t)}
  rust:
    existing_sources:
    - path: code/rust/src/linear_algebra/scalars.rs
      symbols:
      - q
      - qr
      - GaussianRational
    walkthrough:
    - Construct wave numbers in the same arbitrary k_star units.
    - Use borrowed Q values to evaluate the exact algebra without conversion.
    - The zero residuals and unit flux are independently named outputs.
    code: |
      use crate::scalars::{q, qr, GaussianRational as G, Semiring, Ring, Field, Involution};
      use serde_json::{json, Value};
      pub fn solve() -> Value {
          let kl=q(2); let kr=q(1); let r=(&kl-&kr)/(&kl+&kr); let t=q(2)*&kl/(&kl+&kr);
          let refl=&r*&r; let trans=&kr/&kl*&t*&t;
          json!({"r":r.to_string(),"t":t.to_string(),"R":refl.to_string(),"T":trans.to_string(),
              "flux":(&refl+&trans).to_string(),"value_residual":(q(1)+&r-&t).to_string(),
              "derivative_residual":(&kl*(q(1)-&r)-&kr*&t).to_string()})
      }
verification:
  expected_outputs:
    r: 1/3
    t: 4/3
    R: 1/9
    T: 8/9
    flux: '1'
    value_residual: '0'
    derivative_residual: '0'
  computational_scope: Exact boundary matching and current conservation for the specified wave-number
    ratio.
  not_established:
  - The plane-wave model and current formula are analytic inputs; no spatial differential equation is
    solved numerically.
  procedure: Both solve functions are executed independently and compared with the handwritten expected
    outputs and with each other. See results/undergraduate_qm_25/verification.json for the actual run.
lean4:
  status: not_formalized_for_this_problem
  references: []
  boundary: No existing Lean theorem is claimed to prove this complete derivation. Exact execution is
    a calculation, not a proof of the continuum assumptions.
common_pitfalls:
- T is not |t|^2 when wave numbers differ.
- Use the magnitude of the reflected current when reporting R.
improvement_target:
  gap: The reusable scattering surface should expose velocity normalization explicitly.
  acceptance_criterion: Generalize this example only with tests covering unequal wave numbers and evanescent
    channels.
