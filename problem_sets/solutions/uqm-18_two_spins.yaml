schema_version: 1
problem_id: UQM-18
title: Addition of two spin-1/2 particles and exchange
problem_file: problem_sets/problems/undergraduate_qm_25.yaml
conventions:
  arithmetic: q/qr construct exact rational numbers; G is the existing Gaussian-rational scalar.
  outputs: All executable output values are exact rational strings. Symbolic pi, roots, exponentials and
    integrals are explained in the derivation; they are not rationalized.
  runtime: Run the collection verifier from the repository root; it executes these exact YAML code blocks.
    Rust blocks are modules in the generated runner, with crate::scalars linked to the existing source
    file.
analytic_answer:
  singlet: '|0,0>=(|up down>-|down up>)/sqrt(2), E=-3J/4'
  triplet: '|1,1>=|up up>, |1,0>=(|up down>+|down up>)/sqrt(2), |1,-1>=|down down>, E=J/4'
  projector: P_s=I/4-S1 dot S2/hbar^2; trace(P_s)=1; P_t=I-P_s, trace(P_t)=3
derivation:
- step: 1
  explanation: The maximal-m state |up up> has total S=1. Applying total lowering produces the symmetric
    m=0 combination and then |down down>. The orthogonal antisymmetric m=0 combination is annihilated
    by total raising and lowering, identifying S=0.
- step: 2
  explanation: Expand (S1+S2)^2=S1^2+S2^2+2 S1 dot S2. Each constituent has S_i^2=3hbar^2/4. Thus the
    dimensionless dot product is [S(S+1)-3/2]/2.
- step: 3
  explanation: For S=0 this is -3/4 and for S=1 it is +1/4. Multiplication by J gives the energies. Positive
    J favors the singlet; negative J favors the triplet.
- step: 4
  explanation: 'An affine polynomial in the dot product that equals one on the singlet and zero on the
    triplet is P_s=I/4-S1 dot S2/hbar^2. In the product basis only its middle 2 by 2 block is nonzero:
    [[1/2,-1/2],[-1/2,1/2]].'
- step: 5
  explanation: Squaring this block reproduces it, and the trace is one. The complementary projector has
    trace three and annihilates the singlet. This is a finite-dimensional decomposition; particle-exchange
    symmetry of an entire physical state also depends on its spatial factor.
solutions:
  python:
    existing_sources:
    - path: code/python/src/linear_algebra/scalars.py
      symbols:
      - q
      - GaussianRational
    - path: code/python/src/linear_algebra/matrix.py
      symbols:
      - ExactMatrix
    walkthrough:
    - Construct the full singlet projector and square it with ExactMatrix.
    - Compute energies from the Casimir expression.
    - Read projector dimensions from the trace after checking idempotence.
    code: |
      from src.linear_algebra.scalars import q, GaussianRational as G
      from src.linear_algebra.matrix import ExactMatrix
      def solve():
          ps=ExactMatrix.from_rows([[0,0,0,0],[0,q(1,2),q(-1,2),0],[0,q(-1,2),q(1,2),0],[0,0,0,0]])
          defect=ps*ps-ps
          residual=sum(defect.get(i,j)**2 for i in range(4) for j in range(4))
          ds=(q(0)-q(3,2))/2; dt=(q(2)-q(3,2))/2
          tr=sum(ps.get(i,i) for i in range(4))
          return {"singlet_E_over_J":str(ds),"triplet_E_over_J":str(dt),"singlet_trace":str(tr),
                  "triplet_trace":str(4-tr),"idempotence_residual":str(residual)}
  rust:
    existing_sources:
    - path: code/rust/src/linear_algebra/scalars.rs
      symbols:
      - q
      - qr
      - GaussianRational
    walkthrough:
    - Exploit the only nonzero 2 by 2 block while retaining both diagonal and off-diagonal defects.
    - Compute the Casimir expressions using exact fractions.
    - Check complementary dimensions sum to four.
    code: |
      use crate::scalars::{q, qr, GaussianRational as G, Semiring, Ring, Field, Involution};
      use serde_json::{json, Value};
      pub fn solve() -> Value {
          let a=qr(1,2).unwrap(); let b=-&a;
          let d0=&a*&a+&b*&b-&a; let d1=&a*&b+&b*&a-&b;
          let residual=q(2)*&d0*&d0+q(2)*&d1*&d1; let tr=q(2)*&a;
          json!({"singlet_E_over_J":((q(0)-qr(3,2).unwrap())/q(2)).to_string(),
              "triplet_E_over_J":((q(2)-qr(3,2).unwrap())/q(2)).to_string(),"singlet_trace":tr.to_string(),
              "triplet_trace":(q(4)-&tr).to_string(),"idempotence_residual":residual.to_string()})
      }
verification:
  expected_outputs:
    singlet_E_over_J: -3/4
    triplet_E_over_J: 1/4
    singlet_trace: '1'
    triplet_trace: '3'
    idempotence_residual: '0'
  computational_scope: Exact projector idempotence, trace and exchange energies conditional on the angular-momentum
    Casimir identity.
  not_established:
  - The representation-theoretic derivation of all addition coefficients is explained analytically.
  procedure: Both solve functions are executed independently and compared with the handwritten expected
    outputs and with each other. See results/undergraduate_qm_25/verification.json for the actual run.
lean4:
  status: existing_theorem_referenced
  references:
  - path: lean4/FiniteQM.lean
    symbol: spin_half_pair_clebsch_gordan_singlet_triplet_casimir
    scope: Fixed singlet/triplet Casimir values and projector eigenvalue arithmetic; not a general Clebsch-Gordan
      construction.
  boundary: The cited statement supports only the scope written above. The verification report records
    compilation separately from the analytic solution.
common_pitfalls:
- A singlet is antisymmetric in spin, not necessarily in the complete spatial-spin state.
- The sign of J determines which energy is lower.
improvement_target:
  gap: A general Clebsch-Gordan interface would need exact square-root coefficients.
  acceptance_criterion: Verify orthonormality and intertwining of total-spin operators for each admitted
    representation.
