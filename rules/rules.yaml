schema_version: "1.0.0"
title: "Repository Governance and File Layout Rules"
authority_effect: "None"

rules:
  - id: "rule_1"
    name: "File Naming Conventions"
    description: "All repository file names must use lowercase snake_case."
    case_convention: "snake_case"
    casing: "lowercase"
    allowed_characters: "a-z0-9_."
    exceptions:
      - pattern: "README.md"
        rationale: "Standard repository overview document."
      - pattern: "PROJECT.md"
        rationale: "Standard project roadmap and architecture overview."
      - pattern: "SCORING.md"
        rationale: "Canonical multi-language code evaluation and invariant scoring rubric."
      - pattern: "LICENSE*"
        rationale: "Standard legal and licensing notices (e.g., LICENSE, LICENSE-MIT)."
      - pattern: "*.lean"
        convention: "PascalCase"
        rationale: "Lean 4 source files must follow the Lean 4 compiler PascalCase naming convention."
      - pattern: "lean4/b/**"
        rationale: "Lean 4 Lake build artifacts derived from module names."
      - pattern: "Cargo.toml"
        rationale: "Cargo package manifest mandated by Rust toolchain."
      - pattern: "Cargo.lock"
        rationale: "Cargo lockfile mandated by Rust toolchain."
      - pattern: "lean-toolchain"
        rationale: "Lean toolchain pin file mandated by elan."
      - pattern: "lake-manifest.json"
        rationale: "Lean Lake manifest mandated by Lake package manager."

  - id: "rule_2"
    name: "Code File Companion Triad"
    description: "Every code file (including test files) must have three companion YAML files residing adjacent to it in the same directory."
    companion_triad:
      - suffix: ".score.yaml"
        naming: "<file_name>.score.yaml"
        purpose: "Evaluation score from review adhering to SCORING.md rubric (L1-L5 capability level and E to A+ engineering grade across five sovereign gates)."
      - suffix: ".contract.yaml"
        naming: "<file_name>.contract.yaml"
        purpose: "Formal specification declaring the file's contract URN, symbols, owned invariants, boundaries, and dependencies."
      - suffix: ".doc.yaml"
        naming: "<file_name>.doc.yaml"
        purpose: "Structured architectural explanation of the file's purpose, design rationale, and operational context to prevent in-source LLM comment bloat."
