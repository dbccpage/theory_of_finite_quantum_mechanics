resolver = "2"
[package]
name = "tfqm_homology_linear_audit"
version = "0.0.0"
edition = "2021"
[lib]
name = "theory_of_finite_qm"
[dependencies]
tfqm_homotopy_type_theory = { path = "src/homotopy_type_theory" }
