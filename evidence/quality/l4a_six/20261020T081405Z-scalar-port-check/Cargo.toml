serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
blake3 = "1.5"
hex = "0.4"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
linear_algebra = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_linear_algebra" }
omega_homology = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_homology" }
[profile.dev]
debug = 0
[profile.test]
debug = 0
[profile.release]
