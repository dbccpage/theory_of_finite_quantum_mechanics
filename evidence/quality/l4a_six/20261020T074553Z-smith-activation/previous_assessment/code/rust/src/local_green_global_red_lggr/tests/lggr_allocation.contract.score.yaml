    "reviewed_specification": {
      "status": "allocation_observer_individual_gate_review",
      "profile": "Exact",
      "purpose": "Calibrate a thread-local maximum-single-allocation observer and challenge LGGR rejection before oversized QD output or unnecessary Q(Dv) output allocation. Measurements are finite allocation requests, not peak live memory or runtime bounds.",
      "capability_assessment": {
        "source_sha256": "ef3a397de97df6c8e7a906b8b9ecbdb2975ff7e308eb55c3e05263a7c42ea842",
        "level": "L4",
        "basis": "A concrete regression harness with a calibrated System allocator observer, per-thread isolation, unwind-safe arming/disarming and public-boundary assertions exercises two distinct allocation-order invariants. Positive controls use the actual allocation mechanisms, with bounded fixtures and no intentional OOM or allocator failure."
      },
      "symbol_contracts": {
        "ARMED/MAX_SINGLE/observe/ProbeAllocator/ALLOCATOR": "Constant thread-local cells isolate observations to the measured test thread. While armed, record the maximum requested allocation/reallocation byte size; try_with tolerates TLS teardown. No formatting, assertion or heap request occurs in observe. The global allocator forwards unchanged valid pointer/layout contracts to System. Every unsafe block documents its forwarding safety preconditions.",
        "measure/Disarm::drop": "Initialize/reset observation before arming, create a local RAII disarm guard, execute one closure and disarm before returning its result and maximum. Unwind drops the guard and prevents a leaking armed interval. Construction, assertions and result drops occur outside measured calls. Concurrent test threads cannot alter this thread-local counter.",
        "witness_verifier_refuses_an_oversized_product_profile": "D is 1x65, Q is 65x1 and witness length 65; input cell counts fit while the declared product has 4225 cells. Expect exactly BudgetUnknown{cells:4225,limit:4096}, independently of the candidate witness.",
        "oversize_output_refuses_before_the_old_dense_allocation": "A bounded Q*D positive control creates a 65x65 output and proves the observer sees a request larger than the admitted 4096 BigRational cells. The public decision call must return the specific BudgetUnknown before that allocation request. This observes request order, not an OOM or aggregate-memory theorem.",
        "zero_image_refusal_precedes_observation_vector_allocation": "D is the 1x1 zero matrix, witness is one, Q is 4096x1 zero. All profile/domain gates admit these inputs. A direct checked Q*0-vector positive control observes the 4096-cell result layout. The public witness verifier must return false with maximum request strictly smaller, proving its zero-image early refusal precedes Q(Dv) allocation."
      },
      "requirement_symbol_map": {
        "isolated measured allocator forwarding": [
          "ARMED",
          "MAX_SINGLE",
          "observe",
          "ProbeAllocator::alloc",
          "ProbeAllocator::alloc_zeroed",
          "ProbeAllocator::realloc",
          "ProbeAllocator::dealloc",
          "ALLOCATOR"
        ],
        "resource and unwind lifecycle": [
          "measure",
          "Disarm",
          "Disarm::drop"
        ],
        "typed profile and output-order assertions": [
          "witness_verifier_refuses_an_oversized_product_profile",
          "oversize_output_refuses_before_the_old_dense_allocation"
        ],
        "zero-image early-refusal calibration": [
          "zero_image_refusal_precedes_observation_vector_allocation"
        ]
      },
      "verification_challenges": {
        "LG02-product-preflight": {
          "source": "code/rust/src/local_green_global_red_lggr/lggr_v.rs",
          "claim": "The output-profile/allocation controls must detect deletion of declared QD product admission."
        },
        "LG06-witness-nonzero": {
          "source": "code/rust/src/local_green_global_red_lggr/lggr_v.rs",
          "claim": "The zero-image control must detect deletion of refusal before Q(Dv), even though the final Boolean remains false."
        }
      },
      "consumer_review": [
        "Cargo auto-discovers this separate integration binary for the local LGGR package. Its System global allocator is confined to this test binary and does not replace the production library allocator.",
        "The public LGGR APIs and pinned matrix provider are invoked with bounded canonical zero/one fixtures. The legacy multiplication positive control intentionally exercises the old output allocation mechanism; it is not an admitted production recommendation.",
        "Mutation evidence is explicitly shared with the production faults it calibrates under SCORING.md 3.4. The two fault IDs are counted once in campaign totals and remain failures/survivors when their actual outcomes say so. No mutation of the test source is pretended."
      ],
      "proof_arguments": [
        "Constant TLS cells and exclusive current-thread observation prevent cross-test interference. The observer performs only infallible Cell operations and usize max selection. System receives the original allocation contracts unchanged; there is no fabricated pointer, layout rewrite, recursion-inducing observer allocation or forced allocator failure.",
        "The RAII guard is live before invoking a measured closure and drops on both return and Rust unwind. All assertions and result disposal occur after disarming. An assertion failure is an intentional Rust test-harness failure, not an unhandled production input path.",
        "Fixed canonical Q fixtures establish all scalar domains. Declared dimensions yield 65*65=4225 and 4096 output cells, and compiled BigRational layouts give finite representable byte thresholds. Positive controls establish that the observed allocation mechanism crosses each threshold. The negative checks therefore challenge real output-order boundaries, while making no claim about unrelated allocations, peak memory or another thread/platform."
      ],
      "independent_challenge": "Bounded legacy QD and checked Q(Dv) positive controls observe the exact large-output mechanisms. Specific typed profile refusal and strictly smaller maximum request on zero-image refusal distinguish allocation order from a final Boolean. The previously surviving LG06 fault is retained historically and caught by this stronger control in separate staged and current integrated evidence.",
      "engineering_assessment": {
        "source_sha256": "ef3a397de97df6c8e7a906b8b9ecbdb2975ff7e308eb55c3e05263a7c42ea842",
        "gates": {
          "G1": {
            "grade": "A",
            "basis": "Source SHA, complete test/observer symbol and claim maps, explicit two-fault composition links, source/dependency-pinned Cargo receipts and finite measurement scope bind the regression harness. No production allocator replacement or global memory claim is made."
          },
          "G2": {
            "grade": "A",
            "basis": "Zero/one rational fixtures, exact dimension products, typed expected errors and compiler-bound element layouts give the intended profile and request thresholds. Maximum-single-request measurement is kept separate from live/process memory. Per-thread positive controls independently verify observation of actual output mechanisms."
          },
          "G3": {
            "grade": "A",
            "basis": "All unsafe allocator calls delegate unchanged valid GlobalAlloc contracts to System with explicit SAFETY comments. The observer neither allocates nor panics; TLS failure is tolerated and arming is cleared through RAII on unwind. Fixed fixtures are bounded, assertion failures belong to the test harness, and no intentional OOM/faulting allocator is used. Rust/std/System, the pinned provider and test runtime are the explicit trust boundary."
          },
          "G4": {
            "grade": "A",
            "basis": "Conditional on both explicitly linked LG02/LG06 challenges being present, R>=0.95 and successful untouched/restored LGGR package baselines. Real bounded positive controls, typed rejection and observed allocation order address the previous Boolean-only blind spot. Historical survival is never reclassified, and shared faults are counted once."
          },
          "G5": {
            "grade": "A",
            "basis": "Explicit observer/helper functions must meet A source metrics; each forwarding method has one responsibility. Test inputs and positive-control output buffers are necessary fixtures/calibration mechanisms and constructed outside observation. No test-controlled recursive allocator path or redundant inner-loop observer allocation exists. Legacy multiplication overhead is deliberately exercised by the bounded positive control. Costs scale with the stated finite fixtures; no benchmark, peak-space or cross-platform guarantee is inferred."
          }
        }
      },
      "scope_limits": [
        "Only maximum single requested allocation size on the measured thread is observed; realloc requests do not establish live-memory totals. Positive controls establish these concrete layouts in the pinned execution environment."
      ],
