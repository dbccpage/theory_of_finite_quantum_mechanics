    "reviewed_specification": {
      "status": "semantic_specification_defined_replay_required",
      "purpose": "Decide rank(QD) = rank(D) over exact rationals and return a separating witness when the ranks differ.",
      "preconditions": [
        "D is m by n and Q is p by m; scalar arithmetic and row reduction are supplied by the pinned external linear-algebra provider.",
        "The checked matrix provider must maintain its row-major shape/storage invariant. Raw report structs remain untrusted data."
      ],
      "required_admission_order": [
        "Refuse any zero input dimension as EmptyMatrix.",
        "Refuse either input cell count above 4096 as BudgetUnknown.",
        "Refuse q.cols != d.rows as DimensionMismatch.",
        "Refuse q.rows*d.cols above 4096 before allocating the declared product.",
        "Admit canonical rationals in D then Q: denominators positive and numerator/denominator already reduced. Return typed InvalidRational for any raw invalid candidate."
      ],
      "symbol_contracts": {
        "check_soundness": {
          "postcondition": "For admitted matrices, sound iff rank(QD) equals rank(D). Unsound reports carry v with Dv != 0 and Q(Dv) = 0. authority_effect is None.",
          "witness_production": "Reuse QD's RREF and consider one free-column basis candidate at a time in ascending column order."
        },
        "verify_unsoundness_witness": {
          "postcondition": "Apply the same matrix admission before checking candidate length. Return false for incorrect length, then admit canonical witness coefficients or return InvalidRational. Return false when Dv = 0; otherwise return whether Q(Dv) = 0.",
          "allocation_policy": "Use bounded matrix-vector products, without constructing QD."
        }
      },
      "resource_boundary": "4096 is a per-matrix element and declared product-shape ceiling. It does not bound rational bit sizes, aggregate allocation, process memory, parsing cost or elapsed time.",
      "independent_challenge": "Direct integer minors and direct Dv/QDv equations on a finite 2x3/1x2 grid; thread-local allocation observer for a 65x65 declared product."
    }
  },
