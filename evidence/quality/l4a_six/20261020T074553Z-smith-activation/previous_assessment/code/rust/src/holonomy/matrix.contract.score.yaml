omain admission, construction/deserialization paths, panic freedom and dependency trust require individual review.\",\n    \"Complete source-to-spec bidirectional symbol coverage and dependency implementation audit.\",\n    \"Exact elimination correctness currently has an invariant argument and finite independent challenges; no machine-checked proof or per-result elimination certificate is emitted.\",\n    \"Complete full-file failure-mode/operational audit, including diagnostic formatting costs, before assigning all five engineering gates.\"\n  ],\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064257Z/receipt.json\",\n      \"sha256\": \"51613b0c9b9841f5bd58f732f04af13ab7e0b423d6fcfd00b5bba0d8104c6579\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064257Z/source_manifest.json\",\n      \"sha256\": \"684a70128a9b855d38641d5caf8ff06dbbed219ecf7ddaf745207a42584425ae\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/records.py\",\n      \"sha256\": \"5e91b9742dd0c6bdd78fe5a0d957ebd0ec982accaa10634c35349413a6077a68\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/specs.json\",\n      \"sha256\": \"06dc10da559e38474966c2d318615204284210a7fd2b412c91b1f2bdf91a98e3\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064416Z-native-scalar-control/receipt.json\",\n      \"sha256\": \"0766aa9b99debe1358f6d8875fd7f375f0f81919491614eec1a640b2839bfa51\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064257Z/metrics.json\",\n      \"sha256\": \"4a56a75becd2862da73b9876563e490bf570e9dee24a4816667cec6684dffcb1\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064307Z-mutations/receipt.json\",\n      \"sha256\": \"f33e08380b111005a6d5a9897fae4c86ba2b18b7c39bdc3e4d8ee49232cc0e11\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T064307Z-mutations/mutations.json\",\n      \"sha256\": \"0a6dac1623a7edf2f6a369b765e755221a0f9bdc232349ac2d202d4c9b7676dc\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"status\": \"admitted_exact_matrix_api_reviewed_full_five_gate_assessment_pending\",\n    \"capability_assessment\": {\n      \"source_sha256\": \"e55a990ca19c05f84805c871435b4c69d63aa468f1aa1c03e79645af9ed2ad1d\",\n      \"level\": \"L4\",\n      \"basis\": \"Individual source review: a production-grain exact matrix API with immutable admitted storage, a sealed Q/Q(i) domain, checked construction/decoding/indexing and failure-atomic setters, fallible elimination, bounded workspace admission, independent finite arithmetic oracles and compile-fail abstraction controls. This capability classification is independent of the incomplete G1-G5 engineering assessment.\"\n    },\n    \"purpose\": \"Provide private dense row-major matrices over canonical arbitrary-precision Q and the single Gaussian extension Q(i), with checked public admission/access and fallible exact elimination.\",\n    \"domain_invariants\": [\n      \"ExactScalar is sealed to BigRational and GaussianRational<BigRational>. RationalComponent is separately sealed to BigRational; bounded Rational64 and iterated Gaussian extensions cannot implement the admitted field.\",\n      \"Every admitted rational has positive denominator and already reduced numerator/denominator. Gaussian components are private and admitted through new or the same checked decoder; zero, one and closed arithmetic preserve this domain.\",\n      \"Matrix rows, cols and data are private. Checked rows*cols equals data.len(); all stored coefficients are admitted. Immutable slices and shape accessors do not permit mutation.\",\n      \"ScalarRef has a private immutable reference. try_new validates external scalars; get_scalar borrows admitted storage. Public borrowed arithmetic accepts only these tokens, avoiding repeated validation or input clones in matrix inner loops.\"\n    ],\n    \"symbol_contracts\": {\n      \"try_new/try_new_with_limits/from_vec/Deserialize\": {\n        \"postcondition\": \"Return a matrix exactly matching the supplied shape and canonical scalar values, or a typed count/cell/length/work/domain refusal. Matrix decoding rejects unknown fields and delegates to try_new.\",\n        \"order\": \"checked product, per-matrix max_cells, storage length, max_operations admission visits, then scalar validation. from_vec additionally checks max_dimension before this sequence.\",\n        \"parsing_boundary\": \"Serde may allocate candidate input storage before matrix admission. This API does not claim a bounded JSON parser.\"\n      },\n      \"try_zero/try_identity/identity\": {\n        \"postcondition\": \"Construct the requested dense zero or square identity matrix. Checked cell/work admission precedes fallible Vec reservation. identity additionally checks max_dimension.\"\n      },\n      \"get/get_scalar/set\": {\n        \"postcondition\": \"Coordinates outside the admitted shape return MatrixIndexOutOfBounds, including usize::MAX. set checks the index then scalar domain before its sole write; every refusal preserves the original matrix. No public mutable element reference is exposed.\"\n      },\n      \"matmul/matmul_with_limits\": {\n        \"postcondition\": \"For A(m,k), B(k,n), return C(m,n) with C_rc = sum_j A_rj B_jc. Refuse incompatible dimensions before allocation; admit both input cell counts, output cell count, and checked 2*m*n*k scalar-operation count.\",\n        \"complexity\": \"O(m*n*k) field operations, O(m*n) output cells; zero-area outputs return without enumerating huge dimension metadata. _with_limits additionally admits result dimensions.\"\n      },\n      \"determinant/rank/inverse and _with_limits variants\": {\n        \"postcondition\": \"Pivoted exact row elimination computes determinant with row-swap sign, rectangular rank, or square inverse. determinant(0x0)=1, rank(empty storage)=0, inverse(0x0)=0x0. Singular inverse returns SingularMatrix; nonsquare determinant/inverse return DimensionMismatch.\",\n        \"invariant_argument\": \"Row swaps and subtracting a scaled pivot row preserve row space; nonzero pivot scaling is invertible. Determinant accumulates pre-elimination pivots and swap parity. Gauss-Jordan on [A|I] yields [I|A^-1]. Private indexing is restricted to admitted row/column ranges; rank never exceeds rows or min(rows,cols).\",\n        \"resource_policy\": \"determinant/rank reserve one admitted input copy; inverse admits n*(2n) workspace before allocation, then moves the right block into output. Conservative elimination work is 3*rows*cols*min(rows,cols)+min(rows,cols), using augmented cols for inverse.\"\n      },\n      \"transpose/conjugate_transpose/trace/is_symmetric/is_hermitian\": {\n        \"postcondition\": \"Transpose swaps coordinates; conjugate transpose additionally conjugates entries. Trace sums the diagonal only for square matrices. Symmetry/Hermiticity return false for nonsquare matrices; Hermiticity includes real diagonal validation by conjugation equality.\",\n        \"cost\": \"O(rows*cols) traversal for transpose/predicates and O(rows) for trace; transpose outputs are cell/work admitted, with constant-time zero-area metadata handling.\"\n      },\n      \"GaussianRational new/try_div/Div/exact_inv\": {\n        \"postcondition\": \"Construction refuses noncanonical raw rational components. norm_sq(a+bi)=a*a+b*b. Inversion is (a-bi)/(a*a+b*b); division by zero returns ZeroDivision. Div returns Result rather than panicking. The real component bound excludes zero-divisor iterated extensions.\"\n      },\n      \"sha256_digest\": {\n        \"postcondition\": \"Hash the existing Matrix:rowsxcols: prefix followed by Display(entry) and semicolon for each row-major entry. This is a version-sensitive diagnostic format, not an authority or serialization certificate.\",\n        \"open_cost_review\": \"Per-entry formatting allocations still require review before complete G5 A.\"\n      }\n    },\n    \"consumer_review\": [\n      \"Local connection, curvature, gauge_fixing and laplacian consumers use shape accessors and typed get/set. Connection field storage and graph/laplacian public metadata still require their own full invariant review.\",\n      \"code/rust/src/lib.rs reexports tfqm_holonomy. Compatibility holonomy/mod.rs remains a separate uncompiled entry in the scoped baseline.\",\n      \"wdp, general_relativity and local_green_global_red_lggr declare omega_holonomy from the external the_symbol_game checkout. Their similarly named matrix types are distinct from this local tfqm_holonomy implementation.\"\n    ],\n    \"api_changes\": [\n      \"Matrix dimensions/storage and Gaussian components are private; callers use rows/cols/as_slice, real/imag and checked set.\",\n      \"get, rank, Gaussian new and Gaussian division now return Result. Rational64 and external scalar implementations are deliberately excluded. Dependent Laplacian kernel/gap queries return Result.\"\n    ],\n    \"independent_challenge\": \"81 rational 2x2 matrices with integer determinants/adjugates, 6561 integer matrix products, 6561 complex 2x2 matrices using integer-pair determinants/adjugates, 729 rectangular matrices using all 2x2 minors, 49 Gaussian norms/inverses, raw/domain/index/wire/budget controls and compile-fail privacy/domain tests.\",\n    \"trust_boundary\": \"Pinned Rust/num-bigint/num-rational/serde/sha2 and resource allocator implementations are runtime dependencies. Element/scalar-operation budgets do not bound BigInt bit lengths, allocator-internal failures, aggregate process memory, serialization cost or wall-clock time. max_memory_bytes is not an enforced matrix byte budget.\",\n    \"open_obligations\": [\n      \"Complete source-to-spec bidirectional symbol coverage and dependency implementation audit.\",\n      \"Exact elimination correctness currently has an invariant argument and finite independent challenges; no machine-checked proof or per-result elimination certificate is emitted.\",\n      \"Complete full-file failure-mode/operational audit, including diagnostic formatting costs, before assigning all five engineering gates.\"\n    ],\n    \"engineering_assessment\": {\n      \"source_sha256\": \"e55a990ca19c05f84805c871435b4c69d63aa468f1aa1c03e79645af9ed2ad1d\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": null,\n          \"basis\": \"Complete bidirectional exported-symbol/spec and downstream dependency audit remains open; content digests and a substantial source review alone do not complete G1 A.\"\n        },\n        \"G2\": {\n          \"grade\": null,\n          \"basis\": \"The admitted Q/Q(i) domain, exact elimination invariant argument and independent finite oracles are documented, but full result/proof/certificate alignment still requires a separate complete semantic judgement.\"\n        },\n        \"G3\": {\n          \"grade\": null,\n          \"basis\": \"Storage, constructor, decoder, indexing, domain and allocation gates have substantive evidence, while complete failure-mode and transitive-runtime-trust review remains open.\"\n        },\n        \"G4\": {\n          \"grade\": \"A\",\n          \"basis\": \"Independent integer determinant/adjugate, integer-pair complex and rectangular-minor oracles challenge exact arithmetic and elimination without using the implementation as the expectation. Boundary tests cover raw rationals, checked wire/index/setters, inclusive cell/work limits, empty/extreme metadata, sealed extension and private storage/borrow tokens. Eighteen designated critical semantic/API mutations cover these boundaries; A is conditional on current R>=0.95 and successful untouched/restored package baselines. Remaining outcomes are disclosed; this is a verification-gate judgement only, not a general theorem or a whole-file score.\"\n        },\n        \"G5\": {\n          \"grade\": null,\n          \"basis\": \"Explicit functions meet the A metric band, but formatting/digest and complete operational allocation costs still need review. Metric eligibility alone does not assign A.\"\n        }\n      }\n    }\n  }\n}\n",
