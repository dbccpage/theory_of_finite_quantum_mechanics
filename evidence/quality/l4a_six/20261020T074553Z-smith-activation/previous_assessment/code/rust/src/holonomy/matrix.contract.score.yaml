      "purpose": "Provide private dense row-major matrices over canonical arbitrary-precision Q and the single Gaussian extension Q(i), with checked public admission/access and fallible exact elimination.",
      "domain_invariants": [
        "ExactScalar is sealed to BigRational and GaussianRational<BigRational>. RationalComponent is separately sealed to BigRational; bounded Rational64 and iterated Gaussian extensions cannot implement the admitted field.",
        "Every admitted rational has positive denominator and already reduced numerator/denominator. Gaussian components are private and admitted through new or the same checked decoder; zero, one and closed arithmetic preserve this domain.",
        "Matrix rows, cols and data are private. Checked rows*cols equals data.len(); all stored coefficients are admitted. Immutable slices and shape accessors do not permit mutation.",
        "ScalarRef has a private immutable reference. try_new validates external scalars; get_scalar borrows admitted storage. Public borrowed arithmetic accepts only these tokens, avoiding repeated validation or input clones in matrix inner loops."
      ],
      "symbol_contracts": {
        "try_new/try_new_with_limits/from_vec/Deserialize": {
          "postcondition": "Return a matrix exactly matching the supplied shape and canonical scalar values, or a typed count/cell/length/work/domain refusal. Matrix decoding rejects unknown fields and delegates to try_new.",
          "order": "checked product, per-matrix max_cells, storage length, max_operations admission visits, then scalar validation. from_vec additionally checks max_dimension before this sequence.",
          "parsing_boundary": "Serde may allocate candidate input storage before matrix admission. This API does not claim a bounded JSON parser."
        },
        "try_zero/try_identity/identity": {
          "postcondition": "Construct the requested dense zero or square identity matrix. Checked cell/work admission precedes fallible Vec reservation. identity additionally checks max_dimension."
        },
        "get/get_scalar/set": {
          "postcondition": "Coordinates outside the admitted shape return MatrixIndexOutOfBounds, including usize::MAX. set checks the index then scalar domain before its sole write; every refusal preserves the original matrix. No public mutable element reference is exposed."
        },
        "matmul/matmul_with_limits": {
          "postcondition": "For A(m,k), B(k,n), return C(m,n) with C_rc = sum_j A_rj B_jc. Refuse incompatible dimensions before allocation; admit both input cell counts, output cell count, and checked 2*m*n*k scalar-operation count.",
          "complexity": "O(m*n*k) field operations, O(m*n) output cells; zero-area outputs return without enumerating huge dimension metadata. _with_limits additionally admits result dimensions."
        },
        "determinant/rank/inverse and _with_limits variants": {
          "postcondition": "Pivoted exact row elimination computes determinant with row-swap sign, rectangular rank, or square inverse. determinant(0x0)=1, rank(empty storage)=0, inverse(0x0)=0x0. Singular inverse returns SingularMatrix; nonsquare determinant/inverse return DimensionMismatch.",
          "invariant_argument": "Row swaps and subtracting a scaled pivot row preserve row space; nonzero pivot scaling is invertible. Determinant accumulates pre-elimination pivots and swap parity. Gauss-Jordan on [A|I] yields [I|A^-1]. Private indexing is restricted to admitted row/column ranges; rank never exceeds rows or min(rows,cols).",
          "resource_policy": "determinant/rank reserve one admitted input copy; inverse admits n*(2n) workspace before allocation, then moves the right block into output. Conservative elimination work is 3*rows*cols*min(rows,cols)+min(rows,cols), using augmented cols for inverse."
        },
        "transpose/conjugate_transpose/trace/is_symmetric/is_hermitian": {
          "postcondition": "Transpose swaps coordinates; conjugate transpose additionally conjugates entries. Trace sums the diagonal only for square matrices. Symmetry/Hermiticity return false for nonsquare matrices; Hermiticity includes real diagonal validation by conjugation equality.",
          "cost": "O(rows*cols) traversal for transpose/predicates and O(rows) for trace; transpose outputs are cell/work admitted, with constant-time zero-area metadata handling."
        },
        "GaussianRational new/try_div/Div/exact_inv": {
          "postcondition": "Construction refuses noncanonical raw rational components. norm_sq(a+bi)=a*a+b*b. Inversion is (a-bi)/(a*a+b*b); division by zero returns ZeroDivision. Div returns Result rather than panicking. The real component bound excludes zero-divisor iterated extensions."
        },
