ons. Its unstable sort does not specify which error wins among equal-row entries containing multiple defects.\",\n        \"mul_vec\": \"Require input length cols before admitting rows output elements. Default output limit 4096; explicit inclusive override. Fallible reservation precedes zero initialization. Borrowed exact integer products accumulate into admitted row indices.\",\n        \"dense_conversion\": \"to_dense checks rows*cols and output budget before fallible allocation; from_dense checks 2*cols+nnz for overflow and storage admission before counters, column descriptors and entries. The two cols terms account for counters and descriptors; nonzeros are cloned once into pre-reserved columns.\",\n        \"empty_shapes\": \"Zero-area dense storage is preserved without enumerating huge row metadata. Zero-row sparse storage still requires column descriptors and counters; that metadata is included in admission.\",\n        \"errors\": \"ColumnCountMismatch, ShapeOverflow, StorageCountOverflow and wrapped MatrixError allocation-limit/reservation failures. Failed operations return no partial output and do not mutate inputs.\",\n        \"api_change\": \"from_dense now returns Result. The three preexisting Rust callers were adapted; two added challenge callers also handle Result. Consumers outside this repository require the same migration.\",\n        \"challenge\": \"729 three-by-two matrices over {-1,0,1}, each multiplied by 25 independently enumerated integer vectors using direct i64 dot-product oracles; dense roundtrips; inclusive storage/vector/matrix budgets and usize::MAX empty-metadata/capacity refusals.\",\n        \"resource_boundary\": \"Element counts are not byte limits or bounds on BigInt allocation, total process memory or elapsed time.\"\n      },\n      \"SmithDiagonal/SmithNormalForm\": \"Positive divisibility-ordered invariant factors are admitted by SmithDiagonal::new_checked, including the empty rank-zero list. SmithNormalForm exposes immutable D/U/V and diagonal views; only the checked producer constructs that result.\",\n      \"from_rational64_integer_matrix/from_bigrational_integer_matrix\": \"Refuse denominator zero or nonintegral coefficients with row/column NonIntegerEntry. Accept unreduced or negative-denominator representations of defined integers. Widen Rational64 numerator/denominator into BigInt before remainder/division, so bounded signed division cannot overflow. Preserve matrix shape and use checked provider output construction.\",\n      \"sparse_column_gcd_heuristic\": \"Copy admitted sparse columns, repeatedly remove the first nonempty column using swap_remove, append its positive coefficient gcd, and delete its pivot rows from remaining columns. The returned warning explicitly denies that these values are certified Smith invariants; they are not used as a Smith certificate.\",\n      \"verify_smith_identity/borrowed_integer_product\": \"Replay UAV=D using local borrowed BigInt dot products. Each product checks dimensions and uses provider fallible output reservation before callbacks. get_ref borrows entries; no per-dot-product operand clones are introduced. Zero-area products execute no callbacks.\"\n    },\n    \"differential_evidence\": \"Historical 20261020T012738Z-differential compared 746 then-current Smith results, including D/U/V or typed errors, with the sealed pre-refactor body. One workspace refusal was excluded from unsafe legacy allocation replay. This receipt remains bound to its original source snapshot; it is not presented as a current whole-file differential replay after the sparse repair.\",\n    \"open_obligations\": [\n      \"Final identity replay now borrows operands. Continue G5 review of pivot magnitude scans, workspace-output copies and the heuristic gcd routine, which currently computes unused Bezout coefficients.\",\n      \"Add separately designated conversion/extreme and sparse heuristic-process challenges before G4 A. The heuristic remains uncertified as a Smith computation.\",\n      \"Complete the transitive failure/dependency and consumer audit. No machine-checked general Smith correctness or global allocator guarantee is asserted.\"\n    ],\n    \"consumer_review\": [\n      \"The local root module publicly exposes smith_form. SparseColMatrix::from_dense currently has five Rust call sites in this file: three adapted preexisting tests and two added admission/oracle challenge tests.\",\n      \"homology/errors.rs wraps this local SmithError as a typed source. holonomy/gauge_fixing.rs instead imports linear_algebra::smith_normal_form from the external provider; that is a distinct implementation and does not provide composition evidence for this local producer.\"\n    ],\n    \"engineering_assessment\": {\n      \"source_sha256\": \"8068c5d04b5a0737193fe55637fc00e5e321797399d62b350c8fda51dbbc18a1\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"B\",\n          \"basis\": \"Source-bound public contracts distinguish dense certified output, rational-to-integer conversion, admitted sparse storage and the explicitly uncertified gcd heuristic. Local and external similarly named consumers are distinguished. Full transitive dependency and consumer review remains open.\"\n        },\n        \"G2\": {\n          \"grade\": \"A\",\n          \"basis\": \"Successful dense output follows exact integer elementary transforms with unimodular pair matrices, maintained U/V tracking, positive/divisibility-ordered factors and replayed UAV=D. The invariant argument in this specification explains bounds, nonzero divisors and earlier-pivot preservation. Rational conversion widens before division and rejects undefined/fractional inputs. Sparse arithmetic is exact integer arithmetic on sorted unique nonzero rows; the heuristic promises its explicit row-removal process only, with a noncertification warning.\"\n        },\n        \"G3\": {\n          \"grade\": \"B\",\n          \"basis\": \"Private dense/sparse storage preserves shape/index invariants. Checked aggregate workspace/storage counts, inclusive limits and fallible reservations precede dense allocation. Pivot iteration refusal occurs before the next pass and extended Euclid is iterative. Inputs are immutable and no partial result escapes a typed refusal. BigInt and allocator internals remain pinned runtime trust; no global memory or crash-freedom theorem is claimed.\"\n        },\n        \"G4\": {\n          \"grade\": \"B\",\n          \"basis\": \"Independent determinantal-divisor/unimodularity and signed Bezout oracles, 18225 sparse matrix-vector products against direct integer dot-product oracles, dense roundtrips, exact inclusive budgets and huge metadata/capacity controls support the declared paths. Fourteen designated dense/sparse semantic mutations must meet current R>=0.85 and untouched/restored baseline requirements. A still needs stronger separately designated conversion/extreme and heuristic-process challenges; total mutation counts alone do not establish it.\"\n        },\n        \"G5\": {\n          \"grade\": \"B\",\n          \"basis\": \"All explicit source functions meet A metric ceilings, and final identity replay now uses borrowed BigInt products. G5 remains B pending removal/review of pivot-scan magnitude copies, workspace-output copies and unnecessary Bezout coefficients in the heuristic gcd loop. Sparse row/pair updates borrow operands; dimension counts do not bound BigInt growth or global process allocation/time.\"\n        }\n      }\n    }\n  }\n}\n",
