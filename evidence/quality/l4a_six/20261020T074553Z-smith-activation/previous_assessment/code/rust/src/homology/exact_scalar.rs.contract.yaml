      "admit_coefficients/admit_matrix/admit_shaped_matrix": "Short-circuit denominator<=0 before GCD; require gcd(numerator,denominator)=1, including 0/1. Admission has no mutation. A shape mismatch is diagnosed before coefficient scanning in admit_shaped_matrix. admit_matrix preserves the legacy Result<()> adapter by discarding the admitted borrow.",
      "ZeroProductLimits/cells/product_work/product_admission": "Inclusive defaults: 4096 cells per input, 4096 logical product cells, 1000000 scalar operations. Check left/right cell counts, compatible dimensions, logical output cells and checked 2*rows*cols*inner work before canonicality scans and arithmetic. All count overflow/refusal is typed MatrixError translated by HomologicalError. Logical output cells are charged despite no output matrix. Zero outputs are multiplied before potentially huge inner metadata, preserving 0*k=0.",
      "admit_zero_product/admit_zero_product_with_limits/AdmittedMatrix::zero_product/dot_product": "After resource/shape admission, require canonical tokens for both inputs, even when a side is zero. For nonempty dimensions compute each exact dot product borrowing operands and retain only its accumulator; return the caller-supplied typed violation on the first nonzero entry. Zero row/column/inner dimensions succeed without dense loops after the declared profile is admitted. No provider matrix multiplication, full output buffer or unverified scalar callback is used."
