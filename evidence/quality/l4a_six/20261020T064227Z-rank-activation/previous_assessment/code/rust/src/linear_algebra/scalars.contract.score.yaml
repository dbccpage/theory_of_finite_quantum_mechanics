fn\",\n      \"name\": \"new\",\n      \"line\": 73,\n      \"declaration_line\": \"pub fn new(real: Q, imag: Q) -> Result<Self, RationalConstructionError> {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"real\",\n      \"line\": 79,\n      \"declaration_line\": \"pub fn real(&self) -> &Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"imag\",\n      \"line\": 83,\n      \"declaration_line\": \"pub fn imag(&self) -> &Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"from_integers\",\n      \"line\": 87,\n      \"declaration_line\": \"pub fn from_integers(r: i64, i: i64) -> Self {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"norm_sq\",\n      \"line\": 94,\n      \"declaration_line\": \"pub fn norm_sq(&self) -> Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_bigint\",\n      \"line\": 177,\n      \"declaration_line\": \"pub fn hash_bigint(hasher: &mut blake3::Hasher, value: &BigInt) {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_rational\",\n      \"line\": 186,\n      \"declaration_line\": \"pub fn hash_rational(\"\n    }\n  ],\n  \"declaration_index_scope\": \"Lexical line index only; signatures may span lines, include test/cfg items and omit macros/reexports.\",\n  \"requirements\": [\n    {\n      \"id\": \"G1\",\n      \"requirement\": \"Bind this source digest, declared symbols, actual claims, dependencies and consumer boundaries.\"\n    },\n    {\n      \"id\": \"G2\",\n      \"requirement\": \"Admit all public input domains; preserve exact arithmetic and declared algebraic laws on each successful path.\"\n    },\n    {\n      \"id\": \"G3\",\n      \"requirement\": \"Enumerate typed refusals and preserve state/invariants on every failure; justify all indexing and scalar preconditions.\"\n    },\n    {\n      \"id\": \"G4\",\n      \"requirement\": \"Challenge each declared critical failure class using an independent basis; retain all six mutation outcomes and require R >= 0.95 for A.\"\n    },\n    {\n      \"id\": \"G5\",\n      \"requirement\": \"Meet CCN <= 10, cognitive upper bound <= 15 and nesting <= 3; audit allocations and operational bounds separately.\"\n    }\n  ],\n  \"admission_policy\": \"Records with public fields or Deserialize are untrusted candidates until the specific validator admits them; a validator's name is not proof of completeness.\",\n  \"resource_boundary\": \"No process-OOM, bit-complexity, timeout or global memory guarantee is inferred from element/work counters.\",\n  \"authority_ceiling\": \"Runtime finite checks only. No formal theorem, physical derivation or authority promotion is certified.\",\n  \"open_obligations\": [\n    \"Complete source-to-requirement and downstream consumer review is outstanding.\",\n    \"Domain admission, construction/deserialization paths, panic freedom and dependency trust require individual review.\",\n    \"Fresh baseline execution alone does not establish independent challenge or mutation adequacy.\",\n    \"The public Semiring/ExactRing re-export still binds to the pinned provider i64 implementation. Exact unchanged trait/impl source items, compiled with the pinned Rust compiler and overflow checks enabled, admit i64 as ExactRing and panic on MAX+1. Alias, Cargo-path and provider-module bindings are checked. This is an executable source-grounded counterexample, not a fresh direct invocation of the whole root package.\"\n  ],\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T060838Z/receipt.json\",\n      \"sha256\": \"596bf86ef053be10c83b2139f70e3c71367c41343b09fe5a50798c92cbdd5194\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T060838Z/source_manifest.json\",\n      \"sha256\": \"30a432233c4ae6b9af1d8acc1558f27407c78c36684bdf5e7992e41641b77cb3\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/records.py\",\n      \"sha256\": \"5e91b9742dd0c6bdd78fe5a0d957ebd0ec982accaa10634c35349413a6077a68\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/specs.json\",\n      \"sha256\": \"906c2d4cc67bbf47a8854a5b2d770e42aba6355d4817928fad3442eeef56a17b\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T062544Z-native-scalar-control/receipt.json\",\n      \"sha256\": \"f9825a920d2496b206efb2822fabee8b165df573f6c91b6ccc6c9fa740a3a28e\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T060838Z/metrics.json\",\n      \"sha256\": \"ea429ecf09930cac81b7b5b73611ab9325745ed50ce84808a1973d1b2e06a092\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T061219Z-mutations/receipt.json\",\n      \"sha256\": \"dc1742a2cd04d70da49b7c642bc8c421a3e7d52583400a4e6cca2e246c2db238\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T061219Z-mutations/mutations.json\",\n      \"sha256\": \"91b289a1be59565c0f1ec82ca9abcc4cd39cbf680db2d1e201ff95d15bc8abc7\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T062544Z-native-scalar-control/findings.json\",\n      \"sha256\": \"ebb04f873c160c30a7b0003966dfc53b9589f1af71673a35ba3a0e8e8c9bceef\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"status\": \"canonical_gaussian_and_hash_failure_reviewed_provider_boundary_pending\",\n    \"purpose\": \"Provide checked canonical arbitrary-precision rational construction, immutable Q(i) field operations, and normalized rational digest frames; reexport scalar traits from the pinned external provider.\",\n    \"domain_invariants\": [\n      \"Q remains the BigRational type alias. Its public new_raw path can produce invalid candidates; aliasing Q is not evidence that a raw candidate is admitted.\",\n      \"GaussianRational has private Q real/imag components. new validates a positive denominator and an already reduced numerator/denominator in each component. from_integers, zero, one and closed field operations preserve this domain.\",\n      \"GaussianWire denies unknown fields and requires both components. BigRational's upstream decoder may normalize a finite rational before Gaussian admission; direct new rejects noncanonical raw values.\",\n      \"There is no generic Gaussian component parameter, so neither bounded Rational64 storage nor an iterated extension with zero divisors can enter Q(i).\"\n    ],\n    \"symbol_contracts\": {\n      \"qr\": {\n        \"input_domain\": \"Two signed i64 integers, including MIN and MAX.\",\n        \"postcondition\": \"Return Err(ZeroDenominator) exactly when d = 0; otherwise return the normalized mathematical rational n/d with a positive denominator.\",\n        \"bounds_argument\": \"Convert to arbitrary-precision integers before denominator normalization, so MIN/-1 does not overflow signed machine storage.\",\n        \"api_change\": \"qr now returns Result<Q, RationalConstructionError>. Existing local fixture callers explicitly unwrap their nonzero literal denominators.\",\n        \"scope_limit\": \"The Q alias and reexported provider traits still require a complete dependency/domain review.\"\n      },\n      \"validate_rational/GaussianRational::new\": {\n        \"postcondition\": \"ZeroDenominator for denominator zero; NegativeDenominator for a negative denominator; NonReduced for other noncanonical numerator/denominator pairs; otherwise admit the unchanged value. new checks real before imag and exposes only immutable component accessors.\"\n      },\n      \"GaussianRational arithmetic and Involution\": {\n        \"postcondition\": \"add, mul, neg, inherited sub and conjugate compute the Q(i) operations. norm_sq(a+bi)=a^2+b^2. try_inv returns None exactly for zero; otherwise it returns (a-bi)/(a^2+b^2). Inherited try_div returns None exactly for a zero divisor argument.\",\n        \"invariant_argument\": \"Canonical Q is a field. a^2+b^2=0 iff a=b=0 over Q, so the explicit zero check precedes both divisions. No operation can expose a mutable component or forge a denominator.\",\n        \"bounds\": \"Arbitrary-precision integer arithmetic avoids machine-integer overflow. No bit-length, global allocator, process-memory or wall-clock guarantee is made.\"\n      },\n      \"hash_bigint\": {\n        \"postcondition\": \"Append an eight-byte little-endian u64 byte length, then the minimal signed two's-complement little-endian integer bytes supplied by num-bigint. A compile-time assertion rejects pointer widths above 64 before any usize-to-u64 hash framing conversion can truncate.\",\n        \"independent_challenge\": \"Literal signed byte frames at -129, -128, -1, 0, 127 and 128.\"\n      },\n      \"hash_rational\": {\n        \"postcondition\": \"Refuse denominator zero before changing the caller's hasher. Otherwise normalize the finite rational and hash the normalized numerator and denominator using hash_bigint. Negative or unreduced finite raw fractions are deliberately accepted here, unlike Gaussian construction.\",\n        \"composition\": \"Homology rational matrix/vector/weight/graded-vector/legacy digests propagate the typed error. Carrier wire serialization reports typed hash failure via serde rather than discarding it. Immutable boundary/coboundary maps return their constructor-bound cached digest.\",\n        \"independent_challenge\": \"Failure-atomic hasher test, literal -1/2 framing, positive/negative unreduced equivalents, malformed digest propagation at every public rational digest boundary, and a literal matrix-tag/shape/entry frame.\"\n      }\n    },\n    \"api_changes\": [\n      \"GaussianRational::new returns Result; real/imag are private and exposed by immutable getters. The QM density consumer uses getters and its integer fixture uses from_integers.\",\n      \"hash_rational and the raw homology rational digest APIs are fallible. Carrier manifests and graded-vector hash queries propagate Result. Existing valid digest tags and byte frames remain unchanged.\"\n    ],\n    \"resolved_counterexample\": \"The historical receipt 20261020T003510Z-defect-controls reproduced Gaussian construction of denominator-zero input followed by an inversion panic. The current constructor refuses that candidate before any field operation; finite regression and privacy controls are bound in the new assessment receipts.\",\n    \"open_obligations\": [\n      \"The provider unconditionally implements ExactRing for i64 and Semiring::add/mul using machine operators. The reexported marker therefore admits overflow-capable arithmetic; complete the provider boundary repair rather than treating the Gaussian fix as whole-file exactness.\",\n      \"Complete the provider trait implementation/domain audit. Public reexports do not turn raw BigRational candidates into admitted values.\",\n      \"Complete the full five-gate source/spec/dependency and operational assessment; finite field grids do not constitute a universal formal proof.\"\n    ],\n    \"corrective_privacy_replay\": {\n      \"comparison\": {\n        \"path\": \"evidence/quality/l4a_six/20261020T012607Z/privacy_replay_comparison.json\",\n        \"sha256\": \"8483b0ba8aaecb2a48ecfd7b17122bcd9b7c0bd5e013591cc8d8d92470acd2dd\"\n      },\n      \"scope\": \"Corrective doc-target replay is separate from the primary 72-candidate accounting; the primary survivor is retained.\"\n    }\n  }\n}\n",
