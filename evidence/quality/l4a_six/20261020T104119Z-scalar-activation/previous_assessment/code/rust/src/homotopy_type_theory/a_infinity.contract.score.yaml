ociativity before exposing immutable tables and bounded evaluations.\",\n    \"open_obligations\": [],\n    \"scope_limits\": [\n      \"Strict subset only: m0=0, m1=d of degree +1, m2 of degree 0, mn=0 for n>=3. No arbitrary higher operations, morphism composition, Massey products, formality or general higher-coherence decision is claimed.\"\n    ],\n    \"capability_assessment\": {\n      \"source_sha256\": \"a7c12aaaff4f333bc12b335cd90ec4a8b346224ab6741f9273dafd3245dd0df8\",\n      \"level\": \"L4\",\n      \"basis\": \"An executable finite algebra admission and query API replaces the wholly disabled generic stub. Prime/canonical-coefficient and complete algebra-law admission, private immutable carriers and borrowed operation views, typed domain/shape/degree/identity failures, checked table/work/arity budgets and fallible output allocation provide the production boundary. This is the strict finite subset, not an arbitrary higher-algebra engine.\"\n    },\n    \"symbol_contracts\": {\n      \"PrimeField::try_new/modulus/sum/product/negative/difference\": \"Admit precisely the prime u16 moduli using trial division through floor(sqrt(p)); refuse 0, 1 and composites before remainder operations. Private arithmetic receives only residues a,b<p. Sum/difference use u32, product uses u64; intermediate bounds are below 2p and p^2 respectively. Remainders are canonical u16. Negative is zero or p-a. Divisor squares are bounded by 256^2 in u32.\",\n      \"StrictAInfinity::try_new/admit_tables/check_coefficients/check_structure\": \"Move owned degree/differential/product vectors into a private immutable carrier only after modulus, checked n^2+n^3 cell/work and shape admission and canonical coefficients. Differential is row-major d[input*n+output]; product is m[(left*n+right)*n+output]. Validate nonzero coefficient grading and every basis instance of d^2, signed Leibniz and associativity before success. No unverified callback, decoder or public field can bypass admission.\",\n      \"check_grading/check_d_degree/check_product_degrees/check_product_degree\": \"Nonzero d_ij requires degree(j)=degree(i)+1; nonzero m_ijk requires degree(k)=degree(i)+degree(j). Degree additions are checked i32. Zero coefficients impose no unnecessary degree arithmetic. Grading is cohomological.\",\n      \"check_d_squared/d_squared_coefficient\": \"For each input i and output o, require sum_j d(i,j)d(j,o)=0 in F_p. A nonzero residue returns DifferentialSquared with its basis witness.\",\n      \"check_leibniz/check_leibniz_row/leibniz_coefficient\": \"For each left a, right b and output o require sum_j m(a,b,j)d(j,o)-sum_j d(a,j)m(j,b,o)-(-1)^degree(a)sum_j d(b,j)m(a,j,o)=0. Signed parity uses rem_euclid(2), including negative degrees. Return a typed Leibniz witness on failure.\",\n      \"check_associativity/check_associative_row/associator_coefficient\": \"For every first a, second b, third c and output o, require sum_j m(a,b,j)m(j,c,o)-sum_j m(b,c,j)m(a,j,o)=0, with a typed Associativity witness on nonzero residue.\",\n      \"StrictAInfinity::field/dimension/degrees/differential_table/product_table/d/m/check_basis\": \"Read-only access preserves the admitted carrier. Private dense indexing is bounded by checked table lengths and basis loops. check_basis refuses index>=dimension; zero-dimensional carriers expose no valid basis index.\",\n      \"StrictAInfinity::basis_operation/Operation::algebra/dimension/coefficient/is_zero\": \"Validate query arity and every basis index even for a higher zero operation. Return a lifetime-bound borrowed row for arity one/two, or None as the exact zero row for arity zero/at least three. coefficient refuses out-of-basis output indices. No allocation or higher-operation callback is involved. is_zero scans at most n stored coefficients.\",\n      \"StrictAInfinity::evaluate/admit_evaluation/evaluate_d/evaluate_product/evaluate_product_coefficient\": \"Before output allocation, admit arity, n output cells and conservative field-operation work, then every input length n and coefficient<p, even for higher zero operations. Return multilinear d or m2 coordinates for arities one/two and the n-vector zero otherwise. Inputs are immutable borrows. The owned output is the only new buffer and is published only on success.\",\n      \"AlgebraLimits/AlgebraError/add/mul/admit/shape/identity_work/evaluation_work/zero_buffer\": \"Inclusive defaults: n^2+n^3 coefficient cells<=4096, conservative field operations<=1000000, query arity<=64. Constructor work is 5n^3+7n^4+4n^5; d evaluation 2n^2, product evaluation 3n^3, other arities zero field arithmetic. Integer count operations are checked. These field-operation counts do not include input/coefficient/degree scans, allocator internals, parsing or total process time/memory. zero_buffer reserves n u16 cells fallibly once before resize; AllocationFailed is typed.\"\n    },\n    \"requirement_symbol_map\": {\n      \"admitted exact coefficient field\": [\n        \"PrimeField\",\n        \"PrimeField::try_new\",\n        \"PrimeField::modulus\",\n        \"PrimeField::sum\",\n        \"PrimeField::product\",\n        \"PrimeField::negative\",\n        \"PrimeField::difference\",\n        \"check_coefficients\"\n      ],\n      \"immutable complete algebra law admission\": [\n        \"StrictAInfinity\",\n        \"StrictAInfinity::try_new\",\n        \"StrictAInfinity::check_structure\",\n        \"StrictAInfinity::check_grading\",\n        \"StrictAInfinity::check_d_degree\",\n        \"StrictAInfinity::check_product_degrees\",\n        \"StrictAInfinity::check_product_degree\",\n        \"StrictAInfinity::check_d_squared\",\n        \"StrictAInfinity::d_squared_coefficient\",\n        \"StrictAInfinity::check_leibniz\",\n        \"StrictAInfinity::check_leibniz_row\",\n        \"StrictAInfinity::leibniz_coefficient\",\n        \"StrictAInfinity::check_associativity\",\n        \"StrictAInfinity::check_associative_row\",\n        \"StrictAInfinity::associator_coefficient\",\n        \"StrictAInfinity::field\",\n        \"StrictAInfinity::dimension\",\n        \"StrictAInfinity::degrees\",\n        \"StrictAInfinity::differential_table\",\n        \"StrictAInfinity::product_table\",\n        \"StrictAInfinity::d\",\n        \"StrictAInfinity::m\"\n      ],\n      \"public bounded operation evaluation\": [\n        \"StrictAInfinity::basis_operation\",\n        \"StrictAInfinity::check_basis\",\n        \"StrictAInfinity::evaluate\",\n        \"StrictAInfinity::admit_evaluation\",\n        \"StrictAInfinity::evaluate_d\",\n        \"StrictAInfinity::evaluate_product\",\n        \"StrictAInfinity::evaluate_product_coefficient\",\n        \"Operation\",\n        \"Operation::algebra\",\n        \"Operation::dimension\",\n        \"Operation::coefficient\",\n        \"Operation::is_zero\"\n      ],\n      \"resource and failure lifecycle\": [\n        \"AlgebraLimits\",\n        \"AlgebraError\",\n        \"add\",\n        \"mul\",\n        \"admit\",\n        \"shape\",\n        \"admit_tables\",\n        \"identity_work\",\n        \"evaluation_work\",\n        \"zero_buffer\"\n      ]\n    },\n    \"consumer_review\": [\n      \"The local lib.rs and compatibility mod.rs expose this module. Repository Rust search found legacy algebra/morphism/formality symbols only inside the formerly wholly disabled source. No runnable legacy API compatibility is claimed.\",\n      \"The main Rust library reexports the local package. Current scoped evidence compiles the same local package in the audit workspace, including integration observers. It does not imply a fresh full main-workspace build.\",\n      \"The implementation uses Rust core/std only and forbids unsafe code. There is no external field implementation, dynamic dispatch, mutable global carrier, or unadmitted algebra callback.\"\n    ],\n    \"proof_arguments\": [\n      \"A u16 prime p is nonzero. Canonical residues are closed under the widened arithmetic/remainder operations, with maximum product below 2^32 and sum/difference below 2^17. No native overflow or division by zero is reachable in private field operations. Trial division is complete for composites and its counter/square fit u32.\",\n      \"Checked n^2 and n^3 table sizes and owned vector lengths prove every private dense index fits usize and its table. All basis iterators and public index gates stay below n. The zero-dimensional case executes no dense lookup. Degree arithmetic is checked exactly where a nonzero coefficient imposes a constraint.\",\n      \"Admission exhausts every basis instance of the three multilinear laws. Linearity extends them to all vectors. With m0=0,m1=d,m2=product and all higher operations zero, the cohomological Stasheff identities are d^2, graded Leibniz and associativity for n=1,2,3. At n>=4 each nested term contains an operation other than m1/m2 and vanishes. This argument establishes only this strict subset.\",\n      \"An Operation borrows its immutable source algebra for its entire lifetime, so it cannot mix tables or outlive the carrier. Public coefficient and basis checks exclude forged lookups in safe Rust. Query shape/domain/resource preflight precedes the single output reservation. try_reserve_exact maps capacity/allocation refusal to a typed error and all later pushes are within reserved length. Errors mutate no input and publish no partial carrier/output.\"\n    ],\n    \"independent_challenge\": \"All 65536 u16 moduli against an independent sieve; wide-u128 field arithmetic controls; separate d^2/Leibniz/associativity and grading counterexamples; signed contractible DGA coordinate formulas over primes 2,3,5; all 256 binary two-dimensional product tables checked against all-vector associativity and evaluation; machine/count/degree and inclusive cell/work/arity boundaries; input coefficient/shape refusals for nonzero and higher-zero operations; empty carriers; three privacy compile-fail examples plus a positive public API example; four allocation observations including a positive layout control.\",\n    \"engineering_assessment\": {\n      \"source_sha256\": \"a7c12aaaff4f333bc12b335cd90ec4a8b346224ab6741f9273dafd3245dd0df8\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"A\",\n          \"basis\": \"Source SHA, complete requirement-symbol and invariant maps, selected Exact profile, public consumer review and source/dependency-pinned execution receipts bind the strict finite claim. Original disabled bytes and staged source are sealed; no general higher-operation, formality or legacy runtime claim is imported.\"\n        },\n        \"G2\": {\n          \"grade\": \"A\",\n          \"basis\": \"Private admitted prime/coefficient/table/grading carriers and exhaustive basis-law checks mirror the specification. The source arguments establish exact widened modular arithmetic, multilinear law extension, the strict Stasheff reduction and bounded query results. All unrepresentable counts/degrees and invalid domains are typed refusals.\"\n        },\n        \"G3\": {\n          \"grade\": \"A\",\n          \"basis\": \"The complete source argument covers modulus, indexing, arithmetic, lifetime and allocation paths. Immutable inputs and private fields prevent bypass; preflight precedes fallible output allocation and errors drop unpublished local state. Rust core/std, compiler and allocator behavior are explicit trust assumptions; no machine-checked crash freedom or process-OOM guarantee is claimed.\"\n        },\n        \"G4\": {\n          \"grade\": \"A\",\n          \"basis\": \"Conditional on current integrated R>=0.95 with successful untouched and restored package baselines for 30 designated algebra/allocation faults. Independent full-domain modulus and binary-product oracles, signed coordinate controls, typed negative cases, machine/resource boundaries, compiler privacy challenges and allocation-order observations cover the declared failure classes. The staged standalone trial is separate evidence and cannot substitute for this integration.\"\n        },\n        \"G5\": {\n          \"grade\": \"A\",\n          \"basis\": \"Production functions must meet measured A ceilings without opaque source macros. Dense admission is O(n^5+n^3) fixed-width work and borrows/moves each input table; queries cost O(k*n+n^2) for d, O(k*n+n^3) for product and O(k*n+n) for zero operations, including preflight/output initialization. Borrowed basis queries use O(k) checks and no output allocation. All traversal is iterative with no inner heap copies; one fallible n-cell output is necessary. Explicit coefficient-cell, arity and conservative field-operation limits scope local work, not process memory, parsing or wall-clock time.\"\n        }\n      }\n    },\n    \"origin_review\": \"Authored for this task as a strict finite replacement. Original disabled bytes, preselection of Exact, and byte-equal staged/integrated digests are sealed in evidence/quality/l4a_six/20261020T060838Z-algebra-activation. Standalone trial evidence is retained separately in 20261020T054149Z-a-infinity-trial.\"\n  }\n}\n",
