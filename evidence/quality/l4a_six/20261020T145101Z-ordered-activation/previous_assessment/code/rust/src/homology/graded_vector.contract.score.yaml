\"\n  ],\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074554Z/receipt.json\",\n      \"sha256\": \"2a8a7c24316de85ce0c26f04e751fb6ff1ec0ee635defde5c01d76eab3f3fdfd\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074554Z/source_manifest.json\",\n      \"sha256\": \"4d8a488592e2c9166b812ac1188b34baeb4d97de07590f31bf5f006bad071626\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/records.py\",\n      \"sha256\": \"5e91b9742dd0c6bdd78fe5a0d957ebd0ec982accaa10634c35349413a6077a68\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/specs.json\",\n      \"sha256\": \"8d5f25afe4e999b3a92c835b2910d2b81e6bd991b47abbe3ee2a204f1f363a09\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074614Z-native-scalar-control/receipt.json\",\n      \"sha256\": \"f4b0d811fa8b495e9d8dbaee917da40fafa40de1996e86507b41a0328c3893e6\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T082506Z-native-matrix-control/receipt.json\",\n      \"sha256\": \"50929dba2aa4dc19355007d832fada1a05aa29bcbd6add0efacf88cad84c95c4\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074554Z/metrics.json\",\n      \"sha256\": \"a297bf450b9c7f0504e2fc3f3dc6589663d94a5e73dc2d5d6c03079645b97030\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074603Z-mutations/receipt.json\",\n      \"sha256\": \"b8e3ee1012907d0af4afb185e289b04285bb317fc18886bbe9abf44da861fd08\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074603Z-mutations/mutations.json\",\n      \"sha256\": \"00fa693c6f05422ed8b6be92780f5970691494e31b82ecaa20985a6a1e370860\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"status\": \"sealed_graded_coordinate_api_reviewed_A_challenges_pending\",\n    \"capability_assessment\": {\n      \"source_sha256\": \"12164956e8fc5aa2a9f89e5a45273dade52c0afbec9698edf16920802e775021\",\n      \"level\": \"L4\",\n      \"basis\": \"Individual source review: a shared chain/cochain coordinate API with sealed semantic kinds, checked canonical-Q construction and wire admission, typed degree/basis/dimension compatibility, fallible zero-vector reservation, immutable external access and context-bound hashing. This is the concrete lifecycle and abstraction envelope delivered by this file; it does not confer capability on its separate alias files or award engineering A.\"\n    },\n    \"purpose\": \"Represent finite canonical-Q coordinate vectors within one sealed chain/cochain kind, degree and graded basis family; arithmetic refuses incompatible contexts.\",\n    \"symbol_contracts\": {\n      \"VectorKind/ChainKind/CochainKind\": \"Only the two locally sealed kinds are admitted; their hash domain tags differ. A GradedVector<ChainKind> cannot be passed to a function requiring GradedVector<CochainKind>.\",\n      \"new/TryFrom<VectorWire>/Deserialize\": \"Admit every coefficient through exact_scalar::admit_coefficients before storage. BasisId decoding separately rejects whitespace-only names; wire fields are exact and unknown fields are refused. Candidate parsing may allocate before this admission.\",\n      \"zero\": \"Fallibly reserve exactly dim coefficient slots before zero initialization. A capacity refusal returns ResourceLimit and no vector. This is not a global byte/OOM or BigInt-allocation guarantee.\",\n      \"degree/basis_id/coefficients/dimension/is_zero\": \"Return read-only external views or exact predicates; homology-internal pub(super) fields remain within the audited local trust boundary.\",\n      \"check_compatible/add/sub\": \"Require equal degree, basis family and coefficient length in that order before borrowed pointwise arithmetic. Both operands and their labels remain unchanged on refusal. The shared generic kind enforces the remaining context at compile time.\",\n      \"scalar_mul\": \"Admit the supplied scalar, multiply canonical Q coordinates exactly, then re-admit the output through new. The second admission currently repeats canonicalization work on a closed arithmetic result.\",\n      \"hash\": \"Bind kind tag, signed degree, basis name and coefficients through the versioned graded hash frame. This is a diagnostic cryptographic digest, not an authority or hash-injectivity proof.\"\n    },\n    \"consumer_review\": [\n      \"chain.rs and cochain.rs expose distinct aliases of this shared implementation. Their tests verify pointwise arithmetic and dimension/degree failures.\",\n      \"Boundary/coboundary maps use immutable coordinates and return the target degree with the same graded basis family. Their provider has fallible output reservation; current MAX-by-zero probes did not reproduce the suspected capacity panic. Output-budget and redundant-clone obligations remain separately scoped.\",\n      \"l5a_challenges.rs checks basis/degree/kind hash separation, mismatched-context arithmetic, raw invalid rationals, invalid external scalars and impossible zero-vector capacity.\"\n    ],\n    \"open_obligations\": [\n      \"Add designated semantic mutations for compatibility, wire/domain admission and hash-kind binding before G4 A.\",\n      \"Exercise vector-specific malformed wire cases and compile-fail cross-kind/seal cases explicitly.\",\n      \"Complete transitive hashing/serialization cost review and remove redundant canonical output admission before G5 A.\"\n    ],\n    \"engineering_assessment\": {\n      \"source_sha256\": \"12164956e8fc5aa2a9f89e5a45273dade52c0afbec9698edf16920802e775021\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"B\",\n          \"basis\": \"Source-bound contracts map every explicit public operation, wire admission, runtime dependencies and current consumers. Full cross-file compatibility/serialization review remains open.\"\n        },\n        \"G2\": {\n          \"grade\": \"A\",\n          \"basis\": \"Public construction and decoding enforce canonical Q; arithmetic admits contexts and scalar input before exact borrowed Q operations. The sealed kind rejects unadmitted extensions, and successful closed arithmetic preserves coefficient and context invariants.\"\n        },\n        \"G3\": {\n          \"grade\": \"C\",\n          \"basis\": \"Expected domain/context/capacity failures use typed errors and preserve inputs. External access is immutable; standard BigInt, serde and allocator behavior remain in the runtime trust boundary. Full failure-mode proof is not complete.\"\n        },\n        \"G4\": {\n          \"grade\": null,\n          \"basis\": \"Package and independent adversarial controls exist, but this file has no current designated semantic mutation campaign and its wire/type boundaries need focused challenges.\"\n        },\n        \"G5\": {\n          \"grade\": \"B\",\n          \"basis\": \"Explicit functions meet A structural ceilings and traverse finite coordinates linearly, excluding rational bit costs. scalar_mul redundantly re-admits already closed arithmetic output, while hash framing/serde allocation costs remain to be fully audited.\"\n        }\n      }\n    }\n  }\n}\n",
