    "symbol_contracts": {
      "Arrow/FiniteCategory::try_new/admit_category_input/category_work": "Objects are 0..objects and arrows 0..m. identities has exactly objects entries. composition has m*m row-major cells, with [f*m+g] meaning g after f. Checked table-cell and conservative check-work admission precede law scans. Check endpoint domains, identity endpoint roles, all composition entries, both units and all composable associativity triples, in that order. Constructor consumes untrusted vectors and publishes immutable evidence only after all checks pass.",
      "check_endpoints/check_object/check_identities/check_compositions/check_composition": "Every arrow endpoint is an admitted object. Identity(object) is an in-range endomorphism of that object. A table cell is Some exactly when target(f)=source(g); its result is an in-range arrow from source(f) to target(g). Noncomposable cells must be None. Thus table indexing and every successful returned arrow are justified by the complete admitted shape/domain.",
      "check_units/check_associativity/check_associative_pair": "For every arrow f, f after id_source and id_target after f equal f. For every composable triple f,g,h, h after (g after f) equals (h after g) after f. Endpoint closure ensures both sides are defined. Finite iteration checks all instances; no sample replaces a required table instance.",
      "object_count/arrows/arrow/identity/compose/hom": "Expose immutable category data or checked lookups. compose validates both arrow IDs and their composability before indexing. hom validates source/target object IDs and returns a borrowed iterator of all matching indexed arrows, with no result-vector allocation.",
      "QuasiCategory::from_category/category/simplex/check_path": "A QuasiCategory is constructed only from admitted category evidence. simplex requires a valid start object and in-range composable arrow path under the stored edge limit. Copy path edges only after checking all domains and adjacency. This constructs the category nerve by composable strings; no mutable verification flag exists.",
      "NerveSimplex::dimension/start/edges/category/vertex": "Private path data is bound by lifetime to its immutable admitted category. A d-simplex has d edges and d+1 vertices. Vertex zero is start; vertex i>0 is target(edge[i-1]). Out-of-range vertex requests return a specific typed error.",
      "NerveSimplex::face/face_edges": "A zero-simplex has no face in this nonaugmented nerve. For d>=1 accept 0..=d: face zero drops the first edge and advances start; face d drops the last edge; an inner face composes adjacent edges in the declared order. Allocate exactly d-1 output edges fallibly. Private index ranges follow 0<=face<=d and admitted path invariants.",
      "NerveSimplex::degeneracy/edge_buffer/copy_edges": "Accept vertex 0..=d, check d+1 edge count and its inclusive stored limit before allocation, then insert that vertex object identity. Output paths preserve endpoints/composability by the checked unit laws. Every copied path reserves its exact final length once; source/category borrows remain immutable on success and error.",
      "CategoryLimits/CategoryError/add/mul/admit/shape": "Inclusive defaults: 4096 composition cells, 1000000 conservative check operations and 4096 edges per simplex. The category check bound is 2*objects+8*m+4*m*m+5*m*m*m lookup/loop units, computed with checked usize arithmetic. It bounds the declared finite scans, not allocator internals or elapsed time. Input vector allocation/parsing is outside constructor admission."
