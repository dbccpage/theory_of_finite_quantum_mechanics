      "basis": "Executable production-grain finite-category nerve API replaces the entirely disabled always-true verification stub: immutable admitted tables, complete finite law checking, operation admission, typed object/arrow/path errors, lifetime-bound simplices, fallible face/degeneracy storage and independent categorical challenges. The domain is nerves of admitted finite categories, not a general inner-Kan decision procedure."
