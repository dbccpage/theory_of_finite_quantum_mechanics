      "consumer_review": [
        "The local tfqm_homotopy_type_theory lib.rs and compatibility mod.rs declare this module. Repository Rust search found no existing calls to the formerly disabled API; no runnable legacy API is claimed compatible.",
        "The main Rust library publicly reexports the local package. The source-pinned audit workspace uses that local package and dedicated integration tests; its passing tests do not imply a fresh full main-workspace build.",
        "Dependencies are Rust core/std under the pinned compiler and allocator runtime. This module introduces no external algebra provider or mutable global state."
      ],
      "proof_arguments": [
        "Prefix validation starts with exactly one pending root. Popping one slot and pushing precisely the token arity preserves the frontier invariant. An exhausted frontier before tokens end is a trailing root; a missing future-node deficit is an incomplete tree. Every accepted token therefore has one uniquely determined tree position/depth.",
        "Shift changes only variable labels, preserving grammar and depth metadata. Checked arithmetic and changed>=active-cutoff preserve the admitted variable domain without capture.",
        "Substitution replaces each target leaf by one complete prefix tree. Input bound variables are below index+d and remain unchanged. Decrementing a larger variable cannot cross depth d. Replacement variables below their local depth stay bound locally; the other variables are lifted by d and cannot be captured. Exact output counts prove all private vector pushes fit reserved buffers.",
        "Every production traversal is iterative. Allocated buffers and immutable inputs are disjoint; an error publishes no Term and drops partial local storage. Scalar integer additions/products are checked, or bounded by admitted vector lengths and occurrence counts."
      ],
      "independent_challenge": "80 independently constructed finite trees: 19200 substitutions against a separate recursive structural oracle; 1200 positive/negative shifts against separate recursive/index-arithmetic oracles; every operator arity/binder role; literal capture/context-removal cases; signed-machine extremes, Unicode byte counts, exact inclusive work/token/name/depth refusals, immutable input checks and depth-1024 traversal. Compile-fail privacy and positive public examples accompany dedicated allocation observations with positive controls.",
