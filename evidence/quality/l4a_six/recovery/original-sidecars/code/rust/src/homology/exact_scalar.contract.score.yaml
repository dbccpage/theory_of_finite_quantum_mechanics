sion boundary serves rank, chain and cochain consumers: lifetime-bound canonical matrix views, exact framed digests, typed shape/domain/resource failures, configurable cell/work admission before scalar work, zero-area/zero-inner shortcuts and independent finite product/custody challenges. This is an executable bounded service, not a re-export or nominal marker.\",\n      \"level\": \"L4\",\n      \"source_sha256\": \"bf744580ce249ab32faa25589fd8ef53302ddda56dc826060cfb84de1c11fd85\"\n    },\n    \"consumer_review\": [\n      \"The homology module keeps this adapter private. Existing chain/cochain/carrier admission uses the Result<()> wrappers; bounded zero-product verification replaces provider multiplication without publishing a product. Default input/output/work limits are now explicit and can refuse formerly larger workloads.\",\n      \"Rank producer/checker carry the admitted token to exact matrix binding, eliminating duplicate canonical normalization. Its public APIs remain separately challenged.\",\n      \"Dependencies are pinned BasicMatrix storage/access, canonical BigRational and BigInt/GCD arithmetic, BLAKE3 and signed integer byte serialization, under the pinned Rust/std/allocator runtime. No generic field extension or arbitrary callback is admitted.\"\n    ],\n    \"engineering_assessment\": {\n      \"gates\": {\n        \"G1\": {\n          \"basis\": \"Source SHA, concrete private consumer and requirement/symbol maps, invariant arguments and pinned execution/dependency receipts mirror this complete finite Exact contract. Original helper bytes are sealed on activation. No whole-workspace or hash-injectivity claim is made.\",\n          \"grade\": \"A\"\n        },\n        \"G2\": {\n          \"basis\": \"The runtime canonical gate and lifetime-bound token enforce the Q domain, direct canonical digest frame and exact borrowed dot-product identity. Shape/count/work arithmetic is checked; zero dimensions and raw coefficients are admitted/refused accor