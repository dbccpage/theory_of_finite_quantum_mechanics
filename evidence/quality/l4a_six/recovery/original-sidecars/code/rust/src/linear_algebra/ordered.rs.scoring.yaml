    "gates": {
      "G1": {
        "basis": "Source-pinned contracts map every public family to ordered-field or fixed-field assumptions, typed failure, LDL recurrence, count admission and real root consumers. No theorem prover, universal field-law validation or total scalar arithmetic is advertised. Historical overflow controls remain attached to the replaced public-count representation.",
        "grade": "A"
      },
      "G2": {
        "basis": "Canonical Q sign reads the admitted numerator. Checked sign queries enforce {-1,0,1} and sign-zero consistency. Inertia counts the congruence diagonal under Sylvester's law and explicit lawful-field assumptions. Private count construction checks the total sum, so every partial sum fits usize. LDL subtracts each completed L D L* coupling, divides only a positive pivot, and stops on negative or obstructed zero pivots. Back substitution transforms the Schur witness to the original coordinates; the zero-column coefficient gives the literal form -1. Independent principal-minor and direct quadratic-form oracles challenge these identities.",
        "grade": "A"
      },
      "G3": {
        "basis": "Expected domain, shape, symmetry, fixed-field, inverse and resource refusals propagate typed Results without mutating borrowed inputs. Count getters cannot overflow after checked admission; internal sign counts are bounded by the finite diagonal length. Private LDL indexing follows admitted n-by-n grids, columns and rows strictly below n, and equal-length pivots/witness vectors. Work arithmetic is checked before workspace construction; reservations are fallible. Lawful custom callbacks and standard arbitrary-precision allocations remain explicit trust assumptions.",
        "grade": "A"
      },
      "G4": {
        "basis": "Requires current untouched/restored package baselines and R>=0.95 for all OD01-OD16 plus the existing ordered admission challenges. Independent u128 triples test count overflow; all 729 ternary symmetric 3-by-3 forms use seven literal principal minors and a separate direct quadratic form. Existing Hermitian, quadratic extension, reconstruction, false-sign, invalid-rational, empty and inclusive-budget cases are retained. Privacy uses an external compile-fail target, not module-internal access.",
        "grade": "A"
      },
      "G5": {
        "basis": "Semantic LDL phases have calibrated A complexity ceilings. The largest charged grid is n^2 scalar slots and LDL charges 2n^3+n^2 arithmetic work; inertia delegates the separately documented congruence budget. Counts and zero-size loops are bounded by admitted finite dimensions. Pivots move into the result; witness buffers have length n. Limits do not bound coefficient bit growth, validation, clones, total process memory or elapsed time. Default convenience wrappers explicitly use the unlimited policy; callers requiring admission select the with_limits APIs.",
        "grade": "A"
      }
