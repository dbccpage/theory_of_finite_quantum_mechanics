del and compiler-boundary challenges support actual production capability.\",\n      \"level\": \"L4\",\n      \"source_sha256\": \"7b4a42bcb7d78985463307a9474ee9cb2878afa6862380f176268589346ed4d9\"\n    },\n    \"consumer_review\": [\n      \"qm/campaigns/gleason.rs now reads negative() after the deliberate public-field API migration. The root module's scalar and matrix consumers require a fresh original-root composition receipt.\",\n      \"Congruence constructs its own diagonal/transform using invertible swaps, shears and elimination; forged public from_certificate objects are not accepted by the inertia API. Matrix, scalar and involution failure propagation were inspected at this boundary.\"\n    ],\n    \"domain_invariants\": [\n      \"OrderedExactField and HermitianOrdered are extensible obligations. Finite law samples cannot prove closure, total ordering or positive norms for arbitrary implementations.\",\n      \"Inertia::try_new admits representable nonnegative counts; it does not certify their relationship to an arbitrary matrix. Internal count_signs derives counts from an algorithmic diagonal.\",\n      \"Ldlt has private storage. Successful completion represents A=L D L* with nonnegative diagonal; stopped results carry the disclosed negative witness and do not claim complete reconstruction.\"\n    ],\n    \"engineering_assessment\": {\n      \"gates\": {\n        \"G1\": {\n          \"basis\": \"Source-pinned contracts map every public family to ordered-field or fixed-field assumptions, typed failure, LDL recurrence, count admission and real root consumers. No theorem prover, universal field-law validation or total scalar arithmetic is advertised. Historical overflow controls remain attached to the replaced public-count representation.\",\n          \"grade\": \"A\"\n        },\n        \"G2\": {\n          \"basis\": \"Canonical Q sign reads the admitted numerator. Checked sign queries enforce {-1,0,1} and sign-zero consistency. Inertia counts the congruence diagonal under Sylvester's law and explicit lawful-field assumptions. Private count construction checks the total sum, so every partial sum fits usize. LDL subtracts each completed L D L* coupling, divides only a positive pivot, and stops on negative or obstructed zero pivots. Back substitution transforms the Schur witness to the original coordinates; the zero-column coefficient gives the literal form -1. Independent principal-minor and direct quadratic-form oracles challenge these identities.\",\n          \"grade\": \"A\"\n        },\n        \"G3\": {\n          \"basis\": \"Expected domain, shape, symmetry, fixed-field, inverse and resource refusals propagate typed Results without mutating borrowed inputs. Count getters cannot overflow after checked admission; internal sign counts are bounded by the finite diagonal length. Private LDL indexing follows admitted n-by-n grids, columns and rows strictly below n, and equal-length pivots/witness vectors. Work arithmetic is checked before workspace construction; reservations are fallible. Lawful custom callbacks and standard arbitrary-precision allocations remain explicit trust assumptions.\",\n          \"grade\": \"A\"\n        },\n        \"G4\": {\n          \"basis\": \"Requires current untouched/restored package baselines and R>=0.95 for all OD01-OD16 plus the existing ordered admission challenges. Independent u128 triples test count overflow; all 729 ternary symmetric 3-by-3 forms use seven literal principal minors and a separate direct quadratic form. Existing Hermitian, quadratic extension, reconstruction, false-sign, invalid-rational, empty and inclusive-budget cases are retained. Privacy uses an external compile-fail target, not module-internal access.\",\n          \"grade\": \"A\"\n        },\n        \"G5\": {\n          \"basis\": \"Semantic LDL phases have calibrated A complexity ceilings. The largest charged grid is n^2 scalar slots and LDL charges 2n^3+n^2 arithmetic work; inertia delegates the separately documented congruence budget. Counts and zero-size loops are bounded by admitted finite dimensions. Pivots move into the result; witness buffers have length n. Limits do not bound coefficient bit growth, validation, clones, total process memory or elapsed time. Default convenience wrappers explicitly use the unlimited policy; callers requiring admission select the with_limits APIs.\",\n          \"grade\": \"A\"\n        }\n      },\n      \"source_sha256\": \"7b4a42bcb7d78985463307a9474ee9cb2878afa6862380f176268589346ed4d9\"\n    },\n    \"open_obligations\": [],\n    \"origin_and_staged_evidence\": [\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T145101Z-ordered-activation/activation.json\",\n        \"sha256\": \"489764161c6a25ebcfc3ceab7c66f44e2a7a2778a0f48f50b4440fb5ad3b1795\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T144403Z-ordered-trial/receipt.json\",\n        \"sha256\": \"d95ec1b45c95f93736c5e5d3bf005c4dafd724a7c6119a042f86b4e27586f002\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T110958Z-inertia-control/receipt.json\",\n        \"sha256\": \"32df5c9e1ee74934e85c6571c177d959689786bb0576ce6a130bb43622a1613e\"\n      }\n    ],\n    \"profile\": \"Exact\",\n    \"purpose\": \"Admit finite inertia counts and compute exact symmetric/Hermitian inertia, quadratic forms and LDL factorizations with replayable negative witnesses.\",\n    \"requirement_symbol_map\": {\n      \"checked exact order\": [\n        \"OrderedExactField\",\n        \"HermitianOrdered\",\n        \"checked_sign\",\n        \"checked_fixed_sign\",\n        \"validated_sign\"\n      ],\n      \"exact inertia and definiteness\": [\n        \"inertia_with_limits\",\n        \"hermitian_inertia_with_limits\",\n        \"is_positive_semidefinite\",\n        \"is_positive_definite\",\n        \"hermitian_is_positive_semidefinite\",\n        \"hermitian_is_positive_definite\"\n      ],\n      \"forms and factorization witnesses\": [\n        \"quadratic_form\",\n        \"hermitian_form\",\n        \"Ldlt\",\n        \"LdltOutcome\",\n        \"ldlt_with_limits\",\n        \"hermitian_ldl_with_limits\",\n        \"LdlWorkspace\",\n        \"solve_unit_lower_adjoint\",\n        \"zero_pivot_coefficient\"\n      ],\n      \"representable immutable counts\": [\n        \"Inertia\",\n        \"Inertia::try_new\",\n        \"InertiaCountError\",\n        \"count_signs\"\n      ]\n    },\n    \"scope_limits\": [\n      \"No formal proof of arbitrary field implementations or compiler/allocator crash freedom.\",\n      \"Operation limits count declared scalar work and grid slots, not arbitrary-precision bytes or deadlines.\"\n    ],\n    \"status\": \"individual_ordered_review_requires_current_integrated_evidence\",\n    \"symbol_contracts\": {\n      \"Inertia::try_new/rank/dimension/getters\": \"Check the total with checked_add before constructing private immutable counts. Overflow is DimensionOverflow. Admitted rank and dimension are exact; zero-dimensional definiteness follows the vacuous mathematical convention.\",\n      \"LDL APIs/LdlWorkspace\": \"No pivoting. Preserve completed-column LDL* recurrences. Positive pivots update the column; a negative pivot supplies a direct negative direction; an obstructed zero pivot supplies form -1. Completion iff PSD is conditional on the declared field/order laws.\",\n      \"Ldlt reconstruction\": \"Reconstruct from private L and D using fallible checked matrix operations. Equality with the input is asserted only for completed factorizations.\",\n      \"inertia/definiteness wrappers\": \"Require admitted square symmetric/Hermitian input, delegate congruence under the selected limits and count checked signs. No untrusted supplied certificate enters this path.\",\n      \"ordered/fixed-field signs\": \"Admit canonical coefficients; distinguish undefined or nonfixed queries from valid zero. Reject out-of-range or inconsistent signs. 