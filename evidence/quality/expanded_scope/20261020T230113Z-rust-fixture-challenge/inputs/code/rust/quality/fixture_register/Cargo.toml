[package]
name = "tfqm_fixture_register_review"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
