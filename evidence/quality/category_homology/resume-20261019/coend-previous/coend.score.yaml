  description: "Coends \u2014 Spec Section 14.  A coend \u222b^c F(c,c) is the universal quotient of diagonal contributions by dinaturality. It is the categorical analog of integration.  For a bifunctor F : C^op \u00d7 C \u2192 Set, the coend is computed by: 1. Collecting all F(c,c) contributions (one per object c). 2. Quotienting by dinaturality: for each f: c \u2192 c', the left-action F(f, id)(x) is identified with the right-action F(id, f)(x).  Coends appear in: profunctor composition, Kan extensions, tensor products."
