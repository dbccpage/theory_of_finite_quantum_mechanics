      "For rank r in 1..32, r cubed<=32768, so table sizes and flattened indices are bounded before construction. The new guard itself is allocation-free and reaches every convenience path before its allocations. Caller-provided names, multiplicity vectors and arrays already exist and are outside this constructor-owned allocation claim.",
