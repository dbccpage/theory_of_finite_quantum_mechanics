    "status": "boundary_reviewed",
    "formal_specification": {
      "profile": "Exact",
      "domain": "Any finite slice of raw Ratio<i64> values and raw Ratio<i64> total. Every used denominator must be nonzero. Negative entries and cancellation remain admitted; acceptance concerns only the aggregate, not physical simple-object dimensions.",
      "behavior": [
        "Reject a zero total denominator before constructing a rational. Lift signed numerator and denominator separately to BigInt and normalize exactly in BigRational.",
        "Reject a nonpositive exact total. Otherwise accumulate each ratio in BigRational, rejecting any zero entry denominator before its rational construction.",
        "Return true exactly for a well-formed list whose exact sum equals the strictly positive total. No i64 arithmetic is used to combine values, and no saturation or floating-point rounding occurs.",
        "The public signature and boolean refusal style are preserved. Individual negative entries may participate in a positive sum; no per-entry physical dimension validation is claimed."
      ]
    },
    "operations": {
      "verify_fusion_global_dimension": {
        "obligation": "Exact rational aggregate equals the strictly positive total, with every used denominator nonzero; preserve signed cancellation, refuse malformed inputs, use arbitrary-precision arithmetic."
      }
    },
    "invariants": [
      "A nonzero signed i64 denominator/numerator pair embeds exactly into arbitrary integers then into their normalized rational quotient, including i64::MIN and negative denominators. By induction over the list, each successful sum prefix equals its mathematical rational sum; large cancellation cannot overflow fixed-width storage.",
      "The sum predicate has finite O(N) rational additions, but operand bit lengths grow with the rational input; no constant memory/time or whole-fusion-law guarantee is claimed. Compiler, num_bigint/num_rational, allocator and external path dependencies remain TCB."
    ],
    "failure_paths": {
      "aggregate": "Return false for malformed used denominators, nonpositive total or unequal exact sum; caller inputs remain borrowed/unchanged."
    },
    "trust_boundary": "Source arithmetic/admission arguments plus scoped native and Lean model checks; compiler, exact arithmetic libraries, standard allocator and external path dependencies remain TCB. No full Rust refinement or allocator theorem.",
    "assurance_limits": [
      "Only six fusion-ring admission paths have a partial source contract; all other ring operations, laws, spectral algorithms, provider costs and mutation adequacy remain pending.",
      "The two aggregate helpers are pure rational predicates and remain L1 capability. Their complete five-gate assessment and critical mutation evidence are not yet available.",
      "There are six remaining above-A ring functions, including nested dual/associativity/reciprocity loops, spectral assembly, Verlinde checks and SU2 generation. Structural maxima remain CCN 15, cognitive 17 and nesting 5; no L4A score is emitted.",
      "Allocation instrumentation is confined to appended test fixtures and one native test thread. No production global allocator change or formal machine allocation proof is claimed."
    ],
