      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/modular.rs\",\n    \"sha256\": \"aba2ed0e56a32a0fd6017e9084666e4673c4448a6a96d21f9a160d5f11539cda\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"partial_source_review\",\n  \"formal_specification\": \"Exact finite balancing/modular checks and rational-root/second-indicator/genus computations on admitted ribbon inputs.\",\n  \"operations\": {\n    \"ModularData::from_ribbon\": {\n      \"line\": 49,\n      \"signature\": \"pub fn from_ribbon(ribbon: &RibbonFusionCategory<K>) -> Result<Self, FusionError>\",\n      \"obligation\": \"Compute exact S_ab=(theta_a theta_b)^-1 sum_c N(a,b*,c)d_c theta_c from admitted ribbon data, then clone owned inputs and retain D^2 and p+. This constructor alone does not verify modularity.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::ribbon_s_matrix\": {\n      \"line\": 61,\n      \"signature\": \"fn ribbon_s_matrix(\\n        ring: &FusionRing,\\n        dimensions: &[K],\\n        twists: &[K],\\n    ) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Private aligned ring/dimension/twist vectors from an admitted ribbon value: cache inverse twists, d*theta and dual labels, then fill the n-by-n balancing matrix; propagate checked inversion, label and matrix errors.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::add_multiple\": {\n      \"line\": 85,\n      \"signature\": \"fn add_multiple(total: K, value: &K, multiplicity: u64) -> Result<K, FusionError>\",\n      \"obligation\": \"Compute total+m*value: zero moves total, one adds without scalar embedding, larger m must fit i64 before exact embedding or returns Overflow.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::fusion_sum\": {\n      \"line\": 100,\n      \"signature\": \"fn fusion_sum(ring: &FusionRing, a: usize, b: usize, values: &[K]) -> Result<K, FusionError>\",\n      \"obligation\": \"Private admitted labels and values length=ring.rank: sum_c N(a,b,c)*values[c] using checked multiplicity conversion.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verified\": {\n      \"line\": 108,\n      \"signature\": \"pub fn verified(ribbon: &RibbonFusionCategory<K>) -> Result<Self, FusionError>\",\n      \"obligation\": \"Build through from_ribbon and call verify before returning; the same public type also has an unchecked-with-respect-to-modularity constructor, so it is not a sealed certificate type.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::rank\": {\n      \"line\": 114,\n      \"signature\": \"pub fn rank(&self) -> usize\",\n      \"obligation\": \"Borrow the ring rank established by ring admission, at most32.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::ring\": {\n      \"line\": 118,\n      \"signature\": \"pub fn ring(&self) -> &FusionRing\",\n      \"obligation\": \"Borrow the immutable admitted ring; no mutable access is granted.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::dimensions\": {\n      \"line\": 122,\n      \"signature\": \"pub fn dimensions(&self) -> &[K]\",\n      \"obligation\": \"Borrow the retained immutable dimension vector aligned with ring labels.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::twists\": {\n      \"line\": 126,\n      \"signature\": \"pub fn twists(&self) -> &[K]\",\n      \"obligation\": \"Borrow the retained immutable twist vector aligned with ring labels.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::s_tilde\": {\n      \"line\": 130,\n      \"signature\": \"pub fn s_tilde(&self) -> &BasicMatrix<K>\",\n      \"obligation\": \"Borrow the retained immutable square balancing matrix.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::d_squared\": {\n      \"line\": 134,\n      \"signature\": \"pub fn d_squared(&self) -> &K\",\n      \"obligation\": \"Borrow the exact sum of squared ribbon dimensions.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::p_plus\": {\n      \"line\": 138,\n      \"signature\": \"pub fn p_plus(&self) -> &K\",\n      \"obligation\": \"Borrow the exact positive Gauss sum supplied by ribbon data; no independent positivity assertion.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::topological_entanglement_entropy_dimension_squared\": {\n      \"line\": 142,\n      \"signature\": \"pub fn topological_entanglement_entropy_dimension_squared(&self) -> &K\",\n      \"obligation\": \"Return the raw D^2 field element only; this method computes no logarithm or physical entropy.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::t_matrix\": {\n      \"line\": 146,\n      \"signature\": \"pub fn t_matrix(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Return a fresh diagonal matrix of twists, propagating matrix allocation/domain errors.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::charge_conjugation\": {\n      \"line\": 150,\n      \"signature\": \"pub fn charge_conjugation(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Return the exact zero-one charge conjugation matrix C_ab=[dual(a)=b].\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::scaled_charge_conjugation\": {\n      \"line\": 154,\n      \"signature\": \"fn scaled_charge_conjugation(&self, scale: &K) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Private admitted ring: directly construct scale*C without an unscaled intermediate; propagate label/matrix errors.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::scaled_identity\": {\n      \"line\": 165,\n      \"signature\": \"fn scaled_identity(&self, scale: &K) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Construct scale times the rank-dimensional identity directly; propagate matrix errors.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::first_difference\": {\n      \"line\": 171,\n      \"signature\": \"fn first_difference(\\n        left: &BasicMatrix<K>,\\n        right: &BasicMatrix<K>,\\n    ) -> Result<Option<(usize, usize)>, FusionError>\",\n      \"obligation\": \"Require equal shapes; then return the first unequal entry in row-major order, or None for equal matrices.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify\": {\n      \"line\": 192,\n      \"signature\": \"pub fn verify(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Refuse in fixed order: zero D^2, asymmetry, deficient rank, S^2!=D^2 C, SS^dagger!=D^2 I, (ST)^3!=p+S^2, first Verlinde defect. Success establishes these checks only.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::require_equal\": {\n      \"line\": 204,\n      \"signature\": \"fn require_equal(\\n        left: &BasicMatrix<K>,\\n        right: &BasicMatrix<K>,\\n        defect: impl FnOnce(usize, usize) -> ModularDefect,\\n    ) -> Result<(), FusionError>\",\n      \"obligation\": \"Use first_difference and map the first unequal coordinate to the supplied typed modular defect; propagate shape errors.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_symmetry\": {\n      \"line\": 215,\n      \"signature\": \"fn verify_symmetry(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Scan the strict upper triangle in lexicographic order, refusing the first asymmetric pair.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_nondegenerate\": {\n      \"line\": 226,\n      \"signature\": \"fn verify_nondegenerate(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Compute exact provider rank and refuse rank<size, carrying actual and expected ranks.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_square\": {\n      \"line\": 237,\n      \"signature\": \"fn verify_square(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Compute the actual matrix square and compare to D^2 C; return the square for reuse after equality succeeds.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_unitarity\": {\n      \"line\": 247,\n      \"signature\": \"fn verify_unitarity(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Compute S times its actual conjugate transpose and compare to D^2 I; no plain-transpose substitution.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::st_matrix\": {\n      \"line\": 258,\n      \"signature\": \"fn st_matrix(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Construct (ST)_ab=S_ab*theta_b by column scaling without a dense diagonal multiplication.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_relation\": {\n      \"line\": 265,\n      \"signature\": \"fn verify_relation(&self, squared: &BasicMatrix<K>) -> Result<(), FusionError>\",\n      \"obligation\": \"Form (ST)^3 using two actual matrix products and compare row-major to p+ times the supplied S^2.\",\n      \"status\": \"partial_review_no_gate_award\"\n    },\n    \"ModularData::verify_verlinde\": {\n      \"line\": 273,\n      \"signature\": \"fn verify_verlinde(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Delegate the bounded full defect computation to the admitted ring provider and report its first triple; do not claim a category realization theorem.\",\n      \"status\": \"partial_review_no_