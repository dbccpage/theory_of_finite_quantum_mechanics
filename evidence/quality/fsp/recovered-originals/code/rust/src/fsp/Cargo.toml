[package]
name = "tfqm_fsp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sovereign exact rational algebraic certifiers for the Fermion Sign Problem (FSP)"

[lib]
name = "tfqm_fsp"
path = "lib.rs"

[dependencies]
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
overflow-checks = true
