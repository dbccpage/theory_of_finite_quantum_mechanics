# Executable finite witnesses; AuthorityEffect: None.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessed-difference-programme"
version = "2.4.5"
description = "Bounded executable witnesses for the Witnessed Difference Programme"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
contract = ["pydantic>=2.13.5,<3"]
dev = [
  "pydantic>=2.13.5,<3",
  "coverage[toml]>=7.6",
  "hypothesis>=6.100",
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=2.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "sympy>=1.13",
]

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["native_wdp", "original_genesis_observer"]

[tool.setuptools.packages.find]
where = ["code"]
include = [
  "witnessed_difference*",
  "observer_completion*",
  "generative_history*",
  "additive_tensor*",
  "dagger_pairing*",
  "hermitianization*",
  "state_effect_readout*",
  "process_composition*",
  "paper_contract*",
  "finite_observation*",
  "calibrated_recovery*",
  "joint_recovery*",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["code"]
testpaths = [
  "code/unit_tests",
  "code/tests",
]
markers = [
  "monorepo: needs the surrounding monorepo (engine native owner or sibling trees); deselected by verify_deposit.py",
]
addopts = [
  "-n", "8",
  "--dist", "worksteal",
  "--strict-config",
  "--strict-markers",
  "--cov=witnessed_difference",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=json:manifests/coverage.json",
  "--cov-fail-under=95",
  "-p", "no:cacheprovider",
]

[tool.coverage.run]
branch = true
source = ["witnessed_difference"]
data_file = "manifests/.coverage"

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
exclude = "(unit_tests|tests)"
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["paper_contract"]
