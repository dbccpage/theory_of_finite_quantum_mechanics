[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-a"
version = "0.1.0"
description = "CODA-A: Residuals of Projections, Kernels, and Cokernels — The Anomalon as a Typed Leftover"
readme = "README.md"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Jeremy H. Carroll" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
replay = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
    "notebook>=7",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.setuptools]
py-modules = ["coda_a_core", "cochain_presentation", "generate_figures"]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sympy.*",
    "matplotlib.*",
    "numpy.*"
]
ignore_missing_imports = true

