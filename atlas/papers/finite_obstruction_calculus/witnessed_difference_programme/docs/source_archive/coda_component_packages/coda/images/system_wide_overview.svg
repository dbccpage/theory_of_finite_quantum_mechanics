      <rect x="12" y="10" width="75" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#10b981" font-size="11">Layer 2</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-FOC: Finite Obstruction Calculus (Quotients, Dual Witnesses, Coherence)</text>
      <text x="100" y="44" class="text-main" font-size="11">Quotient norms Phi_1, Gamma_2 (T1), dual witnesses (T2), trichotomy classifier (T3), transport (T5)</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">FOC_sharp</text>
