    <line x1="430" y1="552" x2="430" y2="560" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 1: CODA-GTLA -->
    <g transform="translate(0, 560)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.2"/>
