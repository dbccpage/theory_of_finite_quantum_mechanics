  <!-- Right Sidebar: Authority Firewall & Protocol Enforcement -->
  <g transform="translate(920, 102)">
    <!-- Firewall Box -->
    <rect x="0" y="0" width="240" height="380" rx="8" class="card-warn"/>
    <text x="16" y="26" class="text-bold" fill="#f43f5e" font-size="13">AUTHORITY FIREWALL</text>
    <line x1="16" y1="34" x2="224" y2="34" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
    
    <text x="16" y="54" class="text-bold" fill="#fda4af" font-size="11">RULE: Evidence != Authority</text>
    <text x="16" y="70" class="text-main" font-size="10">Obstruction evidence in</text>
    <text x="16" y="85" class="text-code" font-size="11" fill="#fca5a5">[delta_b] in Q^1_b</text>
    <text x="16" y="100" class="text-main" font-size="10">NEVER implies authorization:</text>
    <text x="16" y="117" class="text-code" font-size="11" fill="#f43f5e">[delta_b] -/-&gt; Auth_L(x;q)</text>
    
    <rect x="16" y="130" width="208" height="58" rx="4" fill="#261019" stroke="#e11d48" stroke-width="1"/>
    <text x="24" y="148" class="text-bold" fill="#f43f5e" font-size="11">AuthorityEffect: None</text>
    <text x="24" y="164" class="text-main" font-size="10">Zero self-minting permission.</text>
    <text x="24" y="177" class="text-main" font-size="10">Standing requires FDA grant.</text>
    
    <text x="16" y="206" class="text-bold" fill="#cbd5e1" font-size="11">Terminal Outcomes:</text>
    <text x="24" y="224" class="text-code" fill="#10b981">T_auth: Authorized (FDA)</text>
    <text x="24" y="242" class="text-code" fill="#f59e0b">T_res: Residual (A / FOC)</text>
    <text x="24" y="260" class="text-code" fill="#f43f5e">F_term: Refusal (OR / GTLA)</text>
    
    <text x="16" y="284" class="text-muted" font-size="10">Partitions strictly disjoint (T8):</text>
    <text x="24" y="300" class="text-code" font-size="10" fill="#cbd5e1">auth_disjoint_anomalon</text>
    <text x="24" y="316" class="text-code" font-size="10" fill="#cbd5e1">auth_disjoint_refused</text>
    <text x="24" y="332" class="text-code" font-size="10" fill="#cbd5e1">anomalon_disjoint_refused</text>
    <text x="16" y="354" class="text-muted" font-size="10">Leftover is not standing (GTLA-T7).</text>
    <text x="16" y="368" class="text-muted" font-size="10">Empty sieve is refusal (GTLA-T6).</text>
  </g>

  <!-- Genesis Demarcation Box -->
