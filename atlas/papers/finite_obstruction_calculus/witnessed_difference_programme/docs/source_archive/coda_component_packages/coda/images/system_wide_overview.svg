    <text x="16" y="54" class="text-bold" fill="#93c5fd" font-size="11">dbccpage/19L57G1</text>
    <text x="16" y="70" class="text-code" font-size="11">tag: sealed-derivation-v1</text>
    <text x="16" y="86" class="text-code" font-size="10">commit: 3100c4e (2026-08-17)</text>
    
    <rect x="16" y="100" width="208" height="52" rx="4" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
    <text x="24" y="118" class="text-bold" fill="#7dd3fc" font-size="10">Blind Derivation Firewall</text>
    <text x="24" y="133" class="text-main" font-size="9">Zero copying of derivation internals.</text>
    <text x="24" y="145" class="text-main" font-size="9">Cite the tag; do not import.</text>
    
    <text x="16" y="172" class="text-muted" font-size="10">Mechanical stopping conditions:</text>
    <text x="24" y="188" class="text-code" font-size="10">435 tests · 99.10% line</text>
    <text x="24" y="202" class="text-code" font-size="10">56 Lean sources · 1314 axioms</text>
    <text x="16" y="222" class="text-muted" font-size="9">Receipt about commands, not verdict.</text>
  </g>

  <!-- Bottom Global Summary -->
  <g transform="translate(40, 880)">
    <rect x="0" y="0" width="1120" height="115" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#60a5fa">Canonical Nine-Layer Authority Architecture (CODA):</text>
    <text x="20" y="46" class="text-main" font-size="10.5">· Layers: GTLA (Overarching) -&gt; FOC (Quotients) -&gt; FDA (Standing) -&gt; MUR (Transport) -&gt; OR (Sieve) -&gt; CS/CS-Q (Shadows) -&gt; Q (Continuum) -&gt; A (Leftovers).</text>
    <text x="20" y="64" class="text-main" font-size="10.5">· Discipline: Leftover is not standing (GTLA-T7). Proposal is not decision (FDA). Commuting square is not target standing (MUR). Midpoint is not enclosed number (Q).</text>
    <text x="20" y="82" class="text-main">· Claim Hygiene: Narrow defensible claims only; no hype verbs; exact rational arithmetic; all outcomes formally typed.</text>
    <text x="20" y="100" class="text-code" fill="#f87171">Universal Mandate across all 9 research papers: AuthorityEffect: None.</text>
  </g>
</svg>