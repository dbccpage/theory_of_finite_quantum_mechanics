      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">GTLA_eval</text>
    </g>

    <line x1="430" y1="622" x2="430" y2="630" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Root: Foundations -->
    <g transform="translate(0, 630)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#34d399" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#34d399" font-size="11">Root</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">Foundations &amp; Primitives: Root W (Witnessed Non-Identification) vs Root P</text>
      <text x="100" y="44" class="text-main" font-size="11">Root W (witnessed relation K, d=(a,b,w) with a!=b) vs Root P (primer delta, zero equivalence relation)</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">Root_W</text>
    </g>
