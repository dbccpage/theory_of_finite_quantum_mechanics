    <line x1="430" y1="412" x2="430" y2="420" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 3: CODA-FDA -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#60a5fa" fill-opacity="0.2"/>
