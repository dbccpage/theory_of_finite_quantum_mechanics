      <rect x="12" y="10" width="75" height="22" rx="4" fill="#a855f7" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#a855f7" font-size="11">Layer 5</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-OR: Omniversal Re-Presentation (Obstruction Sieve &amp; Anti-Consensus)</text>
      <text x="100" y="44" class="text-main" font-size="11">Span gluing b=b' (OR-T1), 4 square diagnoses (OR-D2), empty support sieve refusal (OR-T5), anti-consensus doctrine</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">R_OR</text>
    </g>

    <line x1="430" y1="342" x2="430" y2="350" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 4: CODA-MUR -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#818cf8" fill-opacity="0.2"/>
