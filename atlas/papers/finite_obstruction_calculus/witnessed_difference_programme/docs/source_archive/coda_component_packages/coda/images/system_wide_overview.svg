  <text x="40" y="52" class="title">CODA: System-Wide Architectural Overview</text>
  <text x="40" y="75" class="subtitle">Nine-Layer Canonical Architecture, Functors, Data Flows, and Master Normal Form</text>
  <rect x="980" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1070" y="52" text-anchor="middle" class="text-code">CODA-GTLA · SYS-001</text>
  <text x="1070" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Master Normal Form Equation Banner -->
  <g transform="translate(40, 102)">
    <rect x="0" y="0" width="860" height="46" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="29" class="text-bold" font-size="12" fill="#c7d2fe">Master Normal Form:</text>
    <text x="165" y="29" class="text-code" font-size="11" fill="#38bdf8">&#928;^&#9839; = &#964;^&#9839; &#8728;_k FOC^&#9839; &#8728;_k D^&#9839; &#8728;_k &#961;^&#9839; &#8728;_k R^&#9839;</text>
    <text x="845" y="29" text-anchor="end" class="text-muted" font-size="10">[Inward Factorization]</text>
  </g>

  <!-- Left Stack: 9 Layers + Root -->
  <g transform="translate(40, 158)">

    <!-- Layer 9: CODA-A -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#f43f5e" font-size="11">Layer 9</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-A: Residuals of Projections, Kernels, and Cokernels</text>
      <text x="100" y="44" class="text-main" font-size="11">Residual x-Cx in ker C, leftover classes in V/im(C) (A-T6), unique quotient factor (A-T7), Anomalon survivor</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">tau_sharp</text>
    </g>

    <line x1="430" y1="62" x2="430" y2="70" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 8: CODA-Q -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#fbbf24" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#fbbf24" font-size="11">Layer 8</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-Q: The Continuum (Completion and Enclosure)</text>
      <text x="100" y="44" class="text-main" font-size="11">Metric completion dense isometry (Q-T1, Q-T2), uniform extension (Q-T3), rational midpoint enclosure (Q-T4, Q-T5)</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">Q_ext</text>
    </g>

    <line x1="430" y1="132" x2="430" y2="140" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 7: CODA-CS-Q -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#f59e0b" font-size="11">Layer 7</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-CS-Q: Finite Profile Factorization and Sampling Limits</text>
      <text x="100" y="44" class="text-main" font-size="11">Exact on image (CSQ-T1), 2*eps collision bound (CSQ-T2), Lipschitz access (CSQ-T3), endpoint sampling limit (CSQ-T4)</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">CSQ_bridge</text>
    </g>

    <line x1="430" y1="202" x2="430" y2="210" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Layer 6: CODA-CS -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="860" height="62" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="22" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="49" y="25" text-anchor="middle" class="text-bold" fill="#38bdf8" font-size="11">Layer 6</text>
      <text x="100" y="25" class="text-bold" font-size="13" fill="#f8fafc">CODA-CS: The Continuum Shadow (Finite Descending Re-Presentations)</text>
      <text x="100" y="44" class="text-main" font-size="11">Refinement preserves descent (CS-T1), family observation equality (CS-T2), 4 dots 2 shadows collision (CS-T3, CS-T4)</text>
      <rect x="740" y="16" width="105" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="792" y="33" text-anchor="middle" class="text-code" font-size="11">rho_CS</text>
    </g>

    <line x1="430" y1="272" x2="430" y2="280" class="flow-line" marker-end="url(#arrow)"/>

