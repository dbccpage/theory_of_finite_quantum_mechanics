[project]
name = "before-the-first-mark"
version = "1.0.0"
description = "Finite admission, observation, minimal responses, and reproducible mechanization"
requires-python = ">=3.10"
authors = [{name = "Jeremy H. Carroll"}]
license = "PolyForm-Noncommercial-1.0.0"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13", "nbclient>=0.10", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 110
target-version = "py310"
# Frozen upstream bytes are checked against their pin, not rewritten for lint.
extend-exclude = ["code/derivation"]
