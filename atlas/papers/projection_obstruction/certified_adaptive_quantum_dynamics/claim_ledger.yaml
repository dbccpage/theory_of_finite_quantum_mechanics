paper_id: certified_adaptive_quantum_dynamics
title: Certified Adaptive Quantum Dynamics from Projection Residuals
authority_effect: None
date: '2026-10-11'
version: 1.0.1
review_scope: Conditional classical bounds; sampled numerical estimates; abstract discrete Lean statements.
  Fresh pinned Lean 4.34.0 build and 11 selected axiom reports; no numerical certificate.
claims:
- id: PO033-C1
  name: Conditional actual-defect observable bound
  claim_type: Classical theorem
  status: Classical derivation; numerical implementation uncertified
  statement: For finite-dimensional CPTP propagation and an absolutely continuous Hermitian density trajectory,
    observable error is at most ||O||_inf times initial trace-norm mismatch plus the integral of the actual
    dynamical defect. Edge rates substitute only when their embedded sum dominates that defect.
  manuscript_section: 3.1-3.2
  assumptions:
  - CPTP propagator; actual derivative defect
  - Matching initial states to omit the mismatch term
  - Ideal cluster-product projected equations for the local decomposition
  lean4_formalization:
    module: CAQD.LocalDecomposition
    theorems:
    - certificate_honesty
    - margin_nonnegative
    scope: Conditional abstract Nat/Int finite-sum bound with Holder, contractivity, and residual domination
      supplied as hypotheses; no density-matrix or continuous-time mechanization.
    audit_status: Historical report preserved; fresh Lean 4.34.0 build and 11 audit declarations passed 2026-10-11
  code_evidence:
    module: caqd.bounds
    functions:
    - compute_cumulative_bounds
    - verify_bound_honesty
    tests:
    - tests/test_review_regressions.py::test_merge_preserves_past_interval_estimate
    - tests/test_bounds.py::test_bound_honesty_kill_test_tfim
- id: PO033-C2
  name: Normalized retraction differential and algebraic product tangent
  claim_type: Classical proposition
  status: Domain-corrected derivation; finite numerical regressions
  statement: The differential of the normalized ambient extension preserves partial traces and is idempotent.
    Its restriction to traceless Hermitian inputs has the algebraic product tangent image. Geometric manifold
    identification requires full-rank density factors; the full ambient range also contains scaling.
  manuscript_section: 2.1-2.2
  assumptions:
  - Unit-trace factors
  - Trace-zero Hermitian variations for normalized tangent image
  - Full rank for the smooth density-manifold identification
  code_evidence:
    module: caqd.residuals
    functions:
    - retraction_tangent_projector
    - normal_projector
    - verify_lemma_5_3_tangent_isolation
    tests:
    - tests/test_residuals.py::test_tangent_projector_idempotence
    - tests/test_residuals.py::test_marginal_preservation
    - tests/test_review_regressions.py::test_rectangular_norm_witness_and_traceful_scaling_direction
- id: PO033-C3
  name: Schatten norm dual witness; separate tangent optimality
  claim_type: Classical proposition
  status: Norm witness only; best-projection claim withdrawn
  statement: A thin SVD gives a polar witness of the trace norm. Trace-norm best tangent approximation
    additionally requires real pairing annihilation of the tangent space; the marginal projector does
    not generally satisfy this requirement.
  manuscript_section: '2.3'
  assumptions:
  - Finite matrix; real trace pairing for a real tangent space
  code_evidence:
    module: caqd.residuals
    functions:
    - dual_witness_schatten1
    tests:
    - tests/test_residuals.py::test_schatten1_dual_witness_certification
    - tests/test_review_regressions.py::test_marginal_projector_is_not_a_trace_norm_best_approximation
    - tests/test_review_regressions.py::test_rectangular_norm_witness_and_traceful_scaling_direction
- id: PO033-C4
  name: Adaptive cluster-product numerical prototype
  claim_type: Algorithm and numerical observations
  status: HEURISTIC_UNCERTIFIED; requested tolerance not certified
  statement: The prototype samples full cluster-factor normal residuals at recorded times, integrates
    one-sided event rates, and selects a feasible positive-rate merge. In the causal envelope regime,
    cluster updates are filtered by the Lieb–Robinson causal cone velocity v_LR and graph distance to
    excitation sources (r <= v_LR * t + r_margin), preventing acausal cluster fusion and spacelike defect
    leakage while ensuring compatibility with formal no-signalling (LT-NS / NoSignalling.lean). It does
    not bound integration or quadrature error or enforce the requested tolerance.
  manuscript_section: 4-5
  assumptions:
  - Product initial state
  - Finite nondecreasing time grid
  - max_bond is a positive integer ceiling on cluster qubits
  - Causal envelope parameters (v_lr, source_sites, causal_margin) when causal filtering is active
  causal_envelope_extension:
    id: PO033-C4-LR
    name: Lieb-Robinson causal velocity filtering and acausal merge prevention
    statement: Filtering cluster candidate merges by Lieb-Robinson light cone bounds prevents acausal cluster fusion, linking adaptive dynamics to Cycle 007 formal no-signalling (LT-NS), discrete rotation generators (LT-A), and continuous U(1) transport (LT-U1).
    lean4_reference: lean4/quantum_mechanics/NoSignalling.lean
  lean4_formalization:
    module: CAQD.ErrorBound
    theorems:
    - certified_tolerance_satisfaction
    - refinement_monotonicity
    scope: Tolerance implication assumes the bound meets the target; monotonicity assumes pointwise smaller
      rates. Neither shows that the solver achieves those premises. Formal completions for LT-A, LT-U1, and LT-NS reside in lean4/quantum_mechanics (RotationGroups.lean, H011Circle.lean, NoSignalling.lean).
    audit_status: Historical report preserved; fresh Lean 4.34.0 build and 11 audit declarations passed 2026-10-11
  code_evidence:
    module: caqd.adaptive
    functions:
    - evolve_adaptive
    - _cluster_residual_rates
    - compute_edge_hop_distance
    - is_edge_in_causal_cone
    - evaluate_causal_envelope_metrics
    tests:
    - tests/test_review_regressions.py::test_residual_is_sampled_at_recorded_time
    - tests/test_review_regressions.py::test_full_cluster_residual_detects_hidden_boundary_correlation
    - tests/test_review_regressions.py::test_blocked_edge_does_not_prevent_other_merge
    - tests/test_review_regressions.py::test_cluster_updates_preserve_reflection_symmetry
    - tests/test_causal_adaptive_dynamics.py::test_causal_adaptive_simulation_prevents_acausal_merging
    - tests/test_causal_adaptive_dynamics.py::test_unmerged_clusters_outside_causal_cone_retain_marginal_invariance
  reproduction: scripts/reproduce_review.py --check
- id: PO033-C5
  name: Conditional short-time coefficient
  claim_type: Classical integral proposition
  status: Conditional continuity argument; no global observable tightness
  statement: For a continuous total residual rate r at zero, B_O(t)/t tends to ||O||_inf r(0). An O(t^2)
    remainder needs local Lipschitz regularity. Observable errors need not share the coefficient.
  manuscript_section: '3.3'
  assumptions:
  - Continuity for the limit
  - Local Lipschitz rate for the quadratic remainder
  lean4_formalization:
    module: CAQD.ShortTimeRate
    theorems:
    - single_step_rate
    - leading_linear_rate_matches_defect_sum
    scope: Nat one-step sum identities, not a real-time asymptotic limit.
    audit_status: Historical report preserved; fresh Lean 4.34.0 build and 11 audit declarations passed 2026-10-11
- id: PO033-C6
  name: Conditional matching/Pinsker total-correlation implication
  claim_type: Classical conditional proposition
  status: Explicit edge lower-bound premise; no solver or Lean evidence
  statement: If active exact evolved edge marginals independently satisfy D_e(t)>=nu*t-K*t^2, a matching
    and quantum Pinsker imply the stated extensive total-correlation lower bound for t<=nu/(2K). No global
    K=24*g^2 or bond-dimension lower bound is derived.
  manuscript_section: '3.4'
  assumptions:
  - Finite simple graph of maximum degree Delta>=1 with at least a*N edges
  - Fraction eta of edges with a common proven edge defect lower bound
  - nu>0, K>0, log base b>1
