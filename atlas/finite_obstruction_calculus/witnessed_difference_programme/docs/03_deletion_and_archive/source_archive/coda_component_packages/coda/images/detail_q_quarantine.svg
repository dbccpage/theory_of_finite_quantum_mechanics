<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">CODA-Q: The Continuum</text>
  <text x="40" y="72" class="subtitle">Continuum Representations via Completion and Enclosure (Metric Completion &amp; Rational Enclosures)</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-Q · DET-Q-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Metric Completion & Real-Line Isometry -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">METRIC COMPLETION &amp; UNIFORM EXTENSION</text>
    
    <!-- Theorem Q-T1 Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="135" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Completion is Complete, Isometric &amp; Dense (Q-T1):</text>
      <text x="16" y="40" class="text-main" font-size="11">For metric space (X, d), completion X_hat has:</text>
      <text x="24" y="58" class="text-code" font-size="10">d([(x_n)], [(y_n)]) := lim_n d(x_n, y_n)</text>
      <text x="16" y="76" class="text-main" font-size="11">&#8226; X_hat is complete; i: X -&gt; X_hat is an isometry;</text>
      <text x="16" y="92" class="text-main" font-size="11">&#8226; Image i(X) is dense in X_hat.</text>
      <text x="16" y="112" class="text-code" font-size="10" fill="#34d399">Lean: completion_complete, completion_dense</text>
      <text x="16" y="126" class="text-muted" font-size="10">Density is NOT a computable selection rule.</text>
    </g>
    
    <!-- Theorem Q-T2 Card -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Rational Completion Isometric to Real Line (Q-T2):</text>
      <text x="16" y="40" class="text-main" font-size="11">Extending inclusion Q -&gt; R along completion of Q produces:</text>
      <text x="24" y="60" class="text-code" fill="#38bdf8">F : Q_hat ---&gt; R  is an isometric bijection</text>
      <text x="16" y="80" class="text-main" font-size="11">Identifies constructed completion with real line.</text>
      <text x="16" y="98" class="text-muted" font-size="10">No algorithm deciding equality of arbitrary points.</text>
    </g>

    <!-- Theorem Q-T3 Card -->
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="400" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Unique Uniformly Continuous Extension (Q-T3):</text>
      <text x="16" y="40" class="text-main" font-size="11">If f: X -&gt; Y is uniformly continuous into complete Y:</text>
      <text x="24" y="60" class="text-code" fill="#a5f3fc">exists! f_hat : X_hat -&gt; Y  with  f_hat circ i = f</text>
      <text x="16" y="80" class="text-main" font-size="11">Extensions agreeing on dense rationals agree everywhere.</text>
      <text x="16" y="98" class="text-muted" font-size="10">Requires uniform continuity; arbitrary maps do not extend.</text>
    </g>
  </g>

  <!-- Right: Midpoint Enclosures & Bisection Step -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">RATIONAL ENCLOSURES &amp; BISECTION</text>
    
    <!-- Theorem Q-T4 Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="135" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Midpoint Enclosure Error (Theorem Q-T4):</text>
      <text x="16" y="40" class="text-main" font-size="11">If lo &lt;= x &lt;= hi on the real line, then:</text>
      <text x="24" y="62" class="text-code" fill="#a5f3fc">|x - (lo + hi)/2| &lt;= (hi - lo) / 2</text>
      <text x="16" y="82" class="text-main" font-size="11">Distance from x to midpoint never exceeds half width.</text>
      <text x="16" y="100" class="text-bold" font-size="11" fill="#fca5a5">A returned midpoint is NOT the enclosed number.</text>
      <text x="16" y="118" class="text-muted" font-size="10">The bound is sharp (attained at lo, hi); not an equality.</text>
    </g>
    
    <!-- Bisection Step Q-D1 & Q-T5 Card -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="400" height="150" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fda4af">Bisection Step for Sqrt(2) (Q-D1, Q-T5):</text>
      <text x="16" y="38" class="text-main" font-size="11">Start with rational bounds 0 &lt;= lo &lt;= sqrt(2) &lt;= hi.</text>
      <text x="16" y="54" class="text-code" font-size="10">m = (lo + hi)/2; branch on m^2 &lt;= 2.</text>
      <text x="16" y="72" class="text-bold" font-size="11" fill="#34d399">Theorem Q-T5: Encloses sqrt(2); width halves to 2^-n.</text>
      <text x="24" y="90" class="text-code" font-size="10">[1, 2] -&gt; [1, 3/2] -&gt; [5/4, 3/2] -&gt; [11/8, 3/2] ...</text>
      <text x="16" y="108" class="text-main" font-size="11">Midpoint 5/4 has (5/4)^2 = 25/16 != 2 in Q.</text>
      <text x="16" y="126" class="text-muted" font-size="10">All squaring exact in Q; midpoint never squares to 2.</text>
    </g>

    <!-- Epistemic Grounding Card -->
    <g transform="translate(20, 350)">
      <rect x="0" y="0" width="400" height="96" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Scope &amp; Quantum Mechanics Disclaimer:</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; This note does NOT derive quantum mechanics.</text>
      <text x="16" y="56" class="text-main" font-size="11">&#8226; Finite samples do NOT decide continuum queries.</text>
      <text x="16" y="74" class="text-code" font-size="10" fill="#f87171">Enclosure interval is finite data; completion is quarantine.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#fbbf24">Architectural Principles of CODA-Q:</text>
    <text x="20" y="48" class="text-main">&#8226; Completion isolates continuum structures; rationals embed densely into complete real numbers without unproved axioms.</text>
    <text x="20" y="66" class="text-main">&#8226; Finite Data Honesty: We hold rational intervals [lo, hi], not continuum reals; midpoints are approximations, not identities.</text>
    <text x="20" y="84" class="text-main">&#8226; Continuum Quarantine: Continuum claims are quarantined from sovereign finite descent authority.</text>
    <text x="20" y="104" class="text-code" fill="#f87171">AuthorityEffect: None. Metric completion confers zero authority over unmeasured continuum queries.</text>
  </g>
</svg>