<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="52" class="title">The Core Loop and the Two Rules</text>
  <text x="40" y="75" class="subtitle">Master Normal Form State Transitions, Choice Points, and Parallel Refusal</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-GTLA · LOOP-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Main Loop SVG Flow -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="900" height="440" rx="8" class="card"/>
    <text x="20" y="30" class="section-title">THE REASONING OPERATING SYSTEM LOOP</text>
    
    <!-- Top Step: Supply -->
    <g transform="translate(50, 50)">
      <rect x="0" y="0" width="220" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="12" y="24" class="text-bold">1. SUPPLY (Presents)</text>
      <text x="12" y="44" class="text-code" font-size="10">supply_no_op</text>
      <text x="210" y="44" text-anchor="end" class="text-muted" font-size="10">State Unchanged</text>
    </g>

    <line x1="270" y1="80" x2="350" y2="80" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Step 2: Protected Requirement -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="240" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="14" y="24" class="text-bold" fill="#38bdf8">2. PROTECTED REQUIREMENT</text>
      <text x="14" y="44" class="text-main" font-size="11">Fidelity commitment (at stake)</text>
    </g>

    <line x1="590" y1="80" x2="660" y2="80" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Step 3: Observation & Obstruction -->
    <g transform="translate(660, 50)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#20121d" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="14" y="24" class="text-bold" fill="#fda4af">3. OBSTRUCTION</text>
      <text x="14" y="44" class="text-code" font-size="10">Separability collapse</text>
    </g>

    <!-- Downward Flow from Obstruction to Candidate Space -->
    <line x1="760" y1="110" x2="760" y2="150" class="flow-line-warn" marker-end="url(#arrow-warn)"/>

    <!-- Step 4: Candidate Space & Choice 1 -->
    <g transform="translate(560, 150)">
      <rect x="0" y="0" width="300" height="75" rx="6" class="card-amber"/>
      <text x="14" y="24" class="text-bold" fill="#fde68a">CHOICE 1: COST MEASURE</text>
      <text x="14" y="44" class="text-main" font-size="11">Candidate space generated; cost measure</text>
      <text x="14" y="60" class="text-code" font-size="10">mu_1, mu_2 decides size of candidate menu</text>
    </g>

    <!-- Flow to Two Rules Branch -->
    <line x1="710" y1="225" x2="710" y2="255" class="flow-line" marker-end="url(#arrow)"/>

    <!-- The Two Rules Box -->
    <g transform="translate(180, 255)">
      <rect x="0" y="0" width="680" height="165" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="26" class="text-bold" fill="#c7d2fe">THE TWO RULES (Completion.rule1_repair_or_extension)</text>
      
      <!-- Rule 1 -->
      <g transform="translate(20, 40)">
        <rect x="0" y="0" width="300" height="70" rx="4" class="card-green"/>
        <text x="12" y="22" class="text-bold" fill="#34d399">RULE 1: REPAIR</text>
        <text x="12" y="40" class="text-main" font-size="11">Same-level repair family non-empty.</text>
        <text x="12" y="56" class="text-code" font-size="10">Obstruction removed: x in im(d_0)</text>
      </g>
      
      <!-- Rule 2 -->
      <g transform="translate(340, 40)">
        <rect x="0" y="0" width="320" height="70" rx="4" class="card-auth"/>
        <text x="12" y="22" class="text-bold" fill="#93c5fd">RULE 2: EXTENSION</text>
        <text x="12" y="40" class="text-main" font-size="11">Exhaustion cert holds; structure created.</text>
        <text x="12" y="56" class="text-code" font-size="10">Ties retained: Completion.augFamily_retains_ties</text>
      </g>
      
      <!-- Choice 2: Handed License -->
      <g transform="translate(20, 120)">
        <rect x="0" y="0" width="640" height="35" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="12" y="22" class="text-bold" fill="#e0e7ff">CHOICE 2: AUTHORED LICENSE (from tied menu)</text>
        <text x="360" y="22" class="text-code" font-size="10" fill="#a5f3fc">Admission Monotone Monoid (the ONLY mutation)</text>
      </g>
    </g>

    <!-- Parallel Refusal Channel -->
    <g transform="translate(30, 255)">
      <rect x="0" y="0" width="130" height="165" rx="6" class="card-warn"/>
      <text x="10" y="24" class="text-bold" fill="#f43f5e" font-size="11">PARALLEL</text>
      <text x="10" y="40" class="text-bold" fill="#f43f5e" font-size="11">REFUSAL</text>
      <text x="10" y="60" class="text-main" font-size="9">Non-absorbing.</text>
      <text x="10" y="74" class="text-main" font-size="9">Touches no object</text>
      <text x="10" y="88" class="text-main" font-size="9">fields.</text>
      <text x="10" y="110" class="text-code" font-size="9" fill="#fca5a5">RefusalFrontier</text>
      <text x="10" y="126" class="text-muted" font-size="9">NOT a 3rd rule.</text>
      <text x="10" y="145" class="text-code" font-size="8" fill="#fda4af">BudgetExhausted</text>
    </g>

    <!-- Connecting Refusal Line -->
    <path d="M 660 80 C 100 80, 100 200, 100 255" class="flow-line-warn" stroke-dasharray="4,4" marker-end="url(#arrow-warn)"/>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="900" height="140" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" class="text-bold" fill="#38bdf8">Governing Laws of the Core Loop (CODA Design §4 &amp; AGENTS.md):</text>
    <text x="20" y="50" class="text-main">· Law 1: Supply changes no state (supply_no_op, Inertia.lean:17).</text>
    <text x="20" y="68" class="text-main">· Law 3: The two rules fire only when something is protected (Completion.rule1_needs_fidelity).</text>
    <text x="20" y="86" class="text-main">· Law 5: Ties are retained until an implemented isomorphism collapses them; a count of one is a spent choice.</text>
    <text x="20" y="104" class="text-main" font-size="11">· Law 8: Refusal is a parallel typed record, disjoint from residual and defect; exhaustion is not authority.</text>
    <text x="20" y="122" class="text-code" fill="#34d399">Receipts are execution reports, not mathematical proof; verified under Claim Hygiene Rule.</text>
  </g>
</svg>