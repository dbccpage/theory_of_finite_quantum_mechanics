<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">CODA-A: Residuals of Projections, Kernels, and Cokernels</text>
  <text x="40" y="72" class="subtitle">The Anomalon as a Typed Leftover — Projections, Splittings, and Universal Cokernel Factors</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-A · DET-A-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Idempotent Projection & Kernel Placement -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">LINEAR PROJECTIONS &amp; KERNEL PLACEMENT</text>
    <text x="20" y="48" class="text-main">Linear projection C : V &#8594; V with C &#8728; C = C (A-D1, A-D2):</text>
    
    <!-- Decomposition & Properties Card -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="400" height="150" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Theorems A-T1 through A-T4:</text>
      <text x="16" y="40" class="text-code" font-size="10" fill="#a5f3fc">residual(C, x) := x - Cx,   x = Cx + residual(C, x)</text>
      <text x="16" y="58" class="text-code" font-size="10" fill="#34d399">residual(C, x) = 0  &#8660;  Cx = x  (Theorem A-T1)</text>
      <text x="16" y="76" class="text-code" font-size="10" fill="#38bdf8">C(residual(C, x)) = 0  &#8658;  residual &#8712; ker C  (A-T2)</text>
      <text x="16" y="94" class="text-code" font-size="10" fill="#fde68a">residual(C, residual(C, x)) = residual(C, x)  (A-T3)</text>
      <text x="16" y="112" class="text-code" font-size="10" fill="#cbd5e1">x &#8712; im C &#8660; Cx = x;  V = im C &#8853; ker C  (A-T4)</text>
      <text x="16" y="132" class="text-muted" font-size="10">Doing the leftover map twice produces no new leftover.</text>
    </g>
    
    <!-- Commuting Residual Transport Section Title -->
    <text x="20" y="235" class="section-title">COMMUTING RESIDUAL TRANSPORT (A-T5)</text>
    
    <!-- Equivariant Residual Transport Card -->
    <g transform="translate(20, 248)">
      <rect x="0" y="0" width="400" height="92" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Equivariant Residual Transport:</text>
      <text x="16" y="42" class="text-main" font-size="11">If T: V &#8594; W intertwines corrections: T &#8728; C = D &#8728; T:</text>
      <text x="16" y="64" class="text-code" fill="#38bdf8">T(residual(C, x)) = residual(D, Tx)</text>
      <text x="16" y="82" class="text-muted" font-size="10">Intertwining maps transport leftovers equivariantly.</text>
    </g>

    <!-- Scope Fence A-S1 Card -->
    <g transform="translate(20, 350)">
      <rect x="0" y="0" width="400" height="96" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fca5a5">Scope Fence A-S1: Not a Decision or Origin Story</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; residual(C,x) = 0 does NOT mean "accept" or "settled".</text>
      <text x="16" y="56" class="text-main" font-size="11">&#8226; residual(C,x) &#8800; 0 does NOT mean "reject" or "false".</text>
      <text x="16" y="76" class="text-code" font-size="10" fill="#f87171">A leftover is an algebraic vector, not an origin story.</text>
    </g>
  </g>

  <!-- Right: Cokernel Matching & Universal Factor -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">COKERNEL MATCHING &amp; UNIVERSAL FACTOR</text>
    
    <!-- Theorem A-T6 Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="135" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Leftover Classes Match the Cokernel (A-T6):</text>
      <text x="16" y="40" class="text-main" font-size="11">For projection C &#8728; C = C on module V:</text>
      <text x="24" y="58" class="text-code" font-size="10" fill="#34d399">x - y &#8712; im C  &#8660;  residual(C, x) = residual(C, y)</text>
      <text x="16" y="76" class="text-main" font-size="11">Canonical section s([x]) = x - Cx has q &#8728; s = id:</text>
      <text x="24" y="94" class="text-code" font-size="10" fill="#a5f3fc">V / im(C) &#8773; ker C  (Canonical isomorphism)</text>
      <text x="16" y="116" class="text-muted" font-size="10">Mechanized in Lean 4 over additive commutative groups.</text>
    </g>
    
    <!-- Theorem A-T7 Card -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Unique Quotient Factorization (Theorem A-T7):</text>
      <text x="16" y="40" class="text-main" font-size="11">For submodule R &#8804; ker f, unique g: V/R &#8594; W exists:</text>
      <text x="24" y="60" class="text-code" fill="#38bdf8">g &#8728; &#960; = f  (&#960;: V &#8594; V/R quotient map)</text>
      <text x="16" y="80" class="text-main" font-size="11">Applied to R = im C, unique g reads leftover classes.</text>
      <text x="16" y="100" class="text-code" font-size="10" fill="#a5b4fc">Surjective &#960; ensures absence of free parameters.</text>
    </g>

    <!-- Toy Anomalon Witness Card -->
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="400" height="126" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Toy Anomalon Witness &amp; Clarification:</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; "Anomalon" is strictly the ClosedResidual name:</text>
      <text x="24" y="58" class="text-code" font-size="10">d_1 x = 0 with &#934;_1([x]) &gt; 0 vs repair space.</text>
      <text x="16" y="76" class="text-main" font-size="11">&#8226; Makes NO claim about nuclear physics or particles.</text>
      <text x="16" y="92" class="text-muted" font-size="10">Constructible toy witness formalised in Lean 4.</text>
      <text x="16" y="110" class="text-code" font-size="10" fill="#34d399">coda_a_t03_toy_anomalon_witness.lean</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#f43f5e">Architectural Principles of CODA-A:</text>
    <text x="20" y="48" class="text-main">&#8226; Residuals are vectors computed after a correction; they do not construct the state and do not explain why it was present.</text>
    <text x="20" y="66" class="text-main">&#8226; A projection's leftover lies in the kernel; quotient classes in V/im(C) biject canonically with kernel representatives.</text>
    <text x="20" y="84" class="text-main">&#8226; Clean separation: Leftover vectors do not inhabit standing records; they remain typed leftovers in the cokernel.</text>
    <text x="20" y="104" class="text-code" fill="#f87171">AuthorityEffect: None. Leftovers are calculated remainders, not policy decisions.</text>
  </g>
</svg>