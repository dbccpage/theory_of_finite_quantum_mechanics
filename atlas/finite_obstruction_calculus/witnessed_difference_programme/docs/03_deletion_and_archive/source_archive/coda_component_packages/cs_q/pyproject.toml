[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-cs-q-bridge"
version = "3.0.1"
description = "CODA-CS-Q — profile factorization, samples, and Lipschitz access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
replay = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
    "notebook>=7",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.setuptools]
py-modules = ["coda_cs_q_bridge_core", "coda_cs_q_engine", "cochain_presentation", "generate_figures"]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = [
    "code/coda_cs_q_bridge_core.py",
    "code/coda_cs_q_engine.py",
    "code/cochain_presentation.py",
    "code/generate_figures.py"
]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sympy.*",
    "matplotlib.*",
    "numpy.*"
]
ignore_missing_imports = true


