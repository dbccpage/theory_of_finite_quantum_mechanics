[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-gtla"
version = "3.2.1"
description = "CODA-GTLA — six jobs, not one machine; a leftover class is not standing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5"]

[tool.setuptools]
py-modules = ["coda_gtla_core", "coda_gtla_engine", "cochain_presentation", "generate_figures"]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
mypy_path = ["code"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
