[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-q"
version = "3.1.1"
description = "CODA-Q — metric completion and midpoint enclosure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[tool.setuptools]
py-modules = ["coda_q_core", "continuum", "generate_figures"]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.10"
mypy_path = ["code"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*"
]
ignore_missing_imports = true
