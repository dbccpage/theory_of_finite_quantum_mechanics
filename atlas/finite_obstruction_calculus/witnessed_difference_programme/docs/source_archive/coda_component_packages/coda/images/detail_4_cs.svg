<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">CODA-CS: The Continuum Shadow</text>
  <text x="40" y="72" class="subtitle">Continuum Re-Presentations that Descend to the Finite Calculus (Refinement &amp; Shadows)</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-CS · DET-CS-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Refinement Law & Coarse/Fine Diagram -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">REFINEMENT PRESERVES DESCENT (CS-D3, CS-T1)</text>
    <text x="20" y="48" class="text-main">Fine look fine: X -&gt; B forgotten along forget: B -&gt; A:</text>
    
    <!-- Triangle Diagram -->
    <g transform="translate(60, 60)">
      <!-- State X -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="50" y="25" text-anchor="middle" class="text-bold">State X</text>
      </g>
      
      <!-- Arrow fine -->
      <line x1="105" y1="20" x2="215" y2="20" class="flow-line" marker-end="url(#arrow)"/>
      <text x="160" y="14" text-anchor="middle" class="text-code">fine</text>
      
      <!-- Fine Obs B -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="100" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="50" y="25" text-anchor="middle" class="text-bold">Fine Obs B</text>
      </g>
      
      <!-- Arrow forget -->
      <line x1="270" y1="45" x2="270" y2="115" class="flow-line" marker-end="url(#arrow)"/>
      <text x="310" y="85" text-anchor="middle" class="text-code">forget</text>
      
      <!-- Coarse Obs A -->
      <g transform="translate(220, 120)">
        <rect x="0" y="0" width="100" height="40" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="50" y="25" text-anchor="middle" class="text-bold">Coarse Obs A</text>
      </g>
      
      <!-- Composite Arrow -->
      <line x1="80" y1="45" x2="215" y2="135" class="flow-line-dashed" marker-end="url(#arrow)"/>
      <text x="125" y="105" text-anchor="middle" class="text-code">p = forget &#8728; fine</text>
    </g>

    <!-- Fiber Constancy Definition Card -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="400" height="95" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Fibre Constancy &amp; Descent (CS-D1, CS-T1):</text>
      <text x="16" y="40" class="text-code" font-size="10" fill="#a5f3fc">FiberConstant(p, q) :&lt;==&gt; &#8704;x,y. p(x)=p(y) &#8658; q(x)=q(y)</text>
      <text x="16" y="58" class="text-main" font-size="11">Theorem CS-T1: If q is fibre-constant for forget &#8728; fine,</text>
      <text x="16" y="74" class="text-main" font-size="11">then q is fibre-constant for fine (sharp fibres smaller).</text>
    </g>

    <!-- Family Observation Equality Card -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="400" height="95" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Family Observation Equality is Pointwise (CS-T2):</text>
      <text x="16" y="42" class="text-code" font-size="10" fill="#38bdf8">(i &#8614; observe_i(x)) = (i &#8614; observe_i(y))</text>
      <text x="16" y="58" class="text-code" font-size="10" fill="#34d399">&#8660; &#8704;i &#8712; I. observe_i(x) = observe_i(y)</text>
      <text x="16" y="76" class="text-muted" font-size="10">Sampling on a grid is pointwise; no hidden data exists.</text>
    </g>
  </g>

  <!-- Right: 4 Dots 2 Shadows & Limit Notation Obstruction -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">COLLISIONS &amp; LIMIT NOTATION OBSTRUCTIONS</text>
    
    <!-- 4 Dots 2 Shadows (CS-T3) Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="145" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fda4af">Four Dots, Two Shadows (Theorems CS-T3, CS-T4):</text>
      <text x="16" y="40" class="text-main" font-size="11">On X = 2 &#215; 2, first-coordinate has two fibres of size 2:</text>
      <text x="24" y="58" class="text-code" font-size="10">forget&#8315;&#185;(false) = {(false,false), (false,true)}</text>
      <text x="24" y="74" class="text-code" font-size="10">forget&#8315;&#185;(true)  = {(true,false),  (true,true)}</text>
      <text x="16" y="94" class="text-bold" font-size="11" fill="#fca5a5">Theorem CS-T3: First coord does NOT determine second:</text>
      <text x="24" y="112" class="text-code" font-size="10" fill="#f43f5e">&#172;Factors(x &#8614; x.1, x &#8614; x.2)  (Collision obstructs)</text>
      <text x="16" y="130" class="text-muted" font-size="10">Blurry photo cannot recover forgotten coordinate.</text>
    </g>
    
    <!-- Limit Notation is Not an Answer Card -->
    <g transform="translate(20, 198)">
      <rect x="0" y="0" width="400" height="140" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Limit Notation is Not an Answer (CS-T5):</text>
      <text x="16" y="40" class="text-main" font-size="11">Naming lim_{n&#8594;&#8734;} x_n or a continuum signal does NOT</text>
      <text x="16" y="56" class="text-main" font-size="11">confer authority. Missing terminalizer blocks authority:</text>
      <text x="24" y="76" class="text-code" font-size="10" fill="#f87171">has_local_terminalizer = false &#8658; &#172;HasAuthority(X, q, b)</text>
      <text x="16" y="96" class="text-main" font-size="11">Lack of authority is an administrative refusal;</text>
      <text x="16" y="112" class="text-muted" font-size="10">limit notation does not select forgotten coordinates.</text>
    </g>

    <!-- Computational Companion Card -->
    <g transform="translate(20, 348)">
      <rect x="0" y="0" width="400" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Exact Rational Rail (code/coda_cs_core.py):</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; Checks fibre constancy on finite test profiles.</text>
      <text x="16" y="58" class="text-main" font-size="11">&#8226; Strictly exact rational arithmetic; floats raise error.</text>
      <text x="16" y="78" class="text-code" font-size="10" fill="#a5f3fc">Quadrature grid {0, 1/4, 1/2, 3/4, 1} with rational sums.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#38bdf8">Architectural Principles of CODA-CS:</text>
    <text x="20" y="48" class="text-main">&#8226; A fine observation can be forgotten to a coarse one; if a query is constant coarsely, it is constant finely.</text>
    <text x="20" y="66" class="text-main">&#8226; Finite observations cannot determine an arbitrary continuum query without fiber constancy.</text>
    <text x="20" y="84" class="text-main">&#8226; Writing a continuum name or limit does not manufacture authorization within the calculus.</text>
    <text x="20" y="104" class="text-code" fill="#f87171">AuthorityEffect: None. Continuum re-presentations descend only through certified finite profiles.</text>
  </g>
</svg>