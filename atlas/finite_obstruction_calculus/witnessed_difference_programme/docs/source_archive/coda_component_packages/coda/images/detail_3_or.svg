<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">CODA-OR: Omniversal Re-Presentation</text>
  <text x="40" y="72" class="subtitle">Obstruction Sieve, Anti-Consensus Doctrine, and Split Retractions</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-OR · DET-OR-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Anti-Consensus & 4 Square Diagnoses -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card-warn"/>
    <text x="20" y="28" class="section-title" fill="#f43f5e">ANTI-CONSENSUS DOCTRINE &amp; 4 SQUARE LABELS</text>
    
    <!-- Anti-Consensus Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="115" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="24" class="text-bold" fill="#fda4af">Mandatory Rule: Never Average Across Detectors</text>
      <text x="16" y="44" class="text-main" font-size="11">If detector D_1 reports delta_1 and D_2 reports delta_2</text>
      <text x="16" y="60" class="text-main" font-size="11">with delta_1 != delta_2, averaging is FORBIDDEN.</text>
      <text x="16" y="82" class="text-code" font-size="10" fill="#fca5a5">delta_avg = (d1 + d2)/2 ==&gt; FATAL HYGIENE VIOLATION</text>
      <text x="16" y="102" class="text-muted" font-size="10">Averaging manufactures false consensus and destroys truth.</text>
    </g>
    
    <!-- 4 Square Diagnoses -->
    <text x="20" y="184" class="section-title">FOUR LABELS FOR A SQUARE (Definition OR-D2)</text>
    <text x="20" y="202" class="text-main">Diagnoses in cochain environment d_1 circ d_0 = 0:</text>
    
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="400" height="50" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="20" class="text-code" font-size="10" fill="#34d399">1. Strict commute:</text>
      <text x="135" y="20" class="text-main" font-size="11">delta = 0 (Vanishing defect)</text>
      <text x="14" y="38" class="text-muted" font-size="10">Square commutes identically without repair</text>
    </g>
    
    <g transform="translate(20, 272)">
      <rect x="0" y="0" width="400" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="20" class="text-code" font-size="10" fill="#38bdf8">2. Exact repair:</text>
      <text x="135" y="20" class="text-main" font-size="11">delta = d_0 alpha (Repairable)</text>
      <text x="14" y="38" class="text-muted" font-size="10">d_1 delta = d_1 d_0 alpha = 0 (Always closed, OR-T4)</text>
    </g>
    
    <g transform="translate(20, 330)">
      <rect x="0" y="0" width="400" height="50" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="14" y="20" class="text-code" font-size="10" fill="#fde68a">3. Closed leftover:</text>
      <text x="135" y="20" class="text-main" font-size="11">delta not exact, d_1 delta = 0</text>
      <text x="14" y="38" class="text-muted" font-size="10">Coherent residual survivor; cannot be repaired</text>
    </g>
    
    <g transform="translate(20, 388)">
      <rect x="0" y="0" width="400" height="50" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="14" y="20" class="text-code" font-size="10" fill="#fca5a5">4. Open leftover:</text>
      <text x="135" y="20" class="text-main" font-size="11">d_1 delta != 0 (Nonclosed)</text>
      <text x="14" y="38" class="text-muted" font-size="10">Coboundary violation; cannot be exact (OR-T4)</text>
    </g>
  </g>

  <!-- Right: Span Gluing & Empty Sieve -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">SPAN GLUING &amp; EMPTY-SIEVE REFUSAL</text>
    
    <!-- Span Gluing Law -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Unique Span Gluing (Theorems OR-T1, OR-T2):</text>
      <text x="16" y="42" class="text-main" font-size="11">Given pairs (a, b) in A x B and (b', c) in B x C:</text>
      <text x="16" y="64" class="text-code" fill="#38bdf8">b = b'  &lt;==&gt;  unique triple t = (a, b, c)</text>
      <text x="16" y="86" class="text-main" font-size="11">Incompatible Countermodel (Theorem OR-T3):</text>
      <text x="16" y="104" class="text-code" fill="#fca5a5">(*, false) and (true, *) have NO triple in 1 x Bool x 1</text>
    </g>
    
    <!-- Empty Sieve Title & Card -->
    <text x="20" y="192" class="section-title">EMPTY SUPPORT SIEVE HARD REFUSAL</text>
    
    <g transform="translate(20, 206)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Sieve Standing (Theorems OR-T5, OR-T6):</text>
      <text x="16" y="42" class="text-main" font-size="11">Support sieve requires incoming arrows with standing:</text>
      <text x="24" y="64" class="text-code" font-size="10" fill="#f87171">&#8226; Empty sieve ==&gt; zero authority (OR-T5)</text>
      <text x="24" y="84" class="text-code" font-size="10" fill="#fbbf24">&#8226; Envelope membership is NOT standing (OR-T6)</text>
      <text x="24" y="104" class="text-code" font-size="10" fill="#a855f7">&#8226; Candidate without terminalizer has no standing (OR-T7)</text>
    </g>

    <!-- Observer Card -->
    <g transform="translate(20, 338)">
      <rect x="0" y="0" width="400" height="108" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Observer Card Structure (OR §4):</text>
      <text x="16" y="40" class="text-main" font-size="11">Observer cards: Carrier basis, weights w_i &gt; 0,</text>
      <text x="16" y="56" class="text-main" font-size="11">resolution delta_min, L1 aggregation, and SHA-256 digest.</text>
      <text x="16" y="76" class="text-muted" font-size="10">Refusal is a parallel non-absorbing terminal record, NEVER zero.</text>
      <text x="16" y="94" class="text-code" font-size="10" fill="#f43f5e">R_empty_support | R_no_terminalizer</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" class="text-bold" fill="#a855f7">Architectural Significance of CODA-OR:</text>
    <text x="20" y="50" class="text-main">&#8226; Non-Absorbing Refusal Topology: Contradictory observations and incompatible spans are refused rather than smoothed.</text>
    <text x="20" y="70" class="text-main">&#8226; Exact Repairs are Closed (OR-T4): Coboundary structure d_1 d_0 = 0 guarantees exact repairs never leave open residue.</text>
    <text x="20" y="90" class="text-main">&#8226; No Global Universal Assumption: No bicategory or global omniversal terminal object is assumed or proved.</text>
    <text x="20" y="112" class="text-code" fill="#f87171">AuthorityEffect: None. Adjoining comparison nodes creates zero ungrounded authority.</text>
  </g>
</svg>