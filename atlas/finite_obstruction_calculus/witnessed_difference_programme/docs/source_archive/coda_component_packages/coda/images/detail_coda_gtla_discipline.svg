<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">The General Theory of Layered Authority (CODA-GTLA)</text>
  <text x="40" y="72" class="subtitle">A leftover class is not standing — Presentations, Comparison Spans, Traces, and Evaluator Firewall</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-GTLA · DET-DISC-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Top: The Two Pillars -->
  <g transform="translate(50, 105)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="430" height="120" rx="8" class="card-accent"/>
    <text x="20" y="26" class="section-title">PILLAR I: THE OBJECT THEORY</text>
    <text x="20" y="44" class="text-bold" fill="#e2e8f0">Obstruction-First Finite Mathematics</text>
    <text x="20" y="62" class="text-main">&#8226; Difference and obstruction are ontologically prior.</text>
    <text x="20" y="78" class="text-main">&#8226; Identity is a derived quotient kernel under comparison.</text>
    <text x="20" y="94" class="text-main">&#8226; Residual is the object of study, never an erased error.</text>
    <text x="20" y="110" class="text-code" font-size="10" fill="#38bdf8">Presentations (V, diff) with diff(x,x)=0 (GTLA-D1)</text>
    
    <!-- Pillar 2 -->
    <g transform="translate(470, 0)">
      <rect x="0" y="0" width="430" height="120" rx="8" class="card-green"/>
      <text x="20" y="26" class="section-title" fill="#34d399">PILLAR II: EVIDENTIARY METHOD</text>
      <text x="20" y="44" class="text-bold" fill="#e2e8f0">Declaration Pricing &amp; Strict Non-Promotion</text>
      <text x="20" y="62" class="text-main">&#8226; Every admission classified: forced, declared, or open.</text>
      <text x="20" y="78" class="text-main">&#8226; Replayable receipts and per-theorem axiom audits.</text>
      <text x="20" y="94" class="text-main">&#8226; Claim Discipline: A leftover class is NOT standing.</text>
      <text x="20" y="110" class="text-code" font-size="10" fill="#34d399">Evaluator Firewall on declared tuples (GTLA-D4..D5)</text>
    </g>
  </g>

  <!-- Middle: Spans, Traces, and Evaluator Firewall -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="900" height="295" rx="8" class="card"/>
    <text x="20" y="26" class="section-title">SPANS, TRACES, AND THREE DISJOINT TERMINALS</text>
    <text x="20" y="46" class="text-main">Algebraic structure of comparison spans, traces, and finite pipeline evaluation in CodaGtla:</text>
    
    <g transform="translate(20, 60)">
      <!-- Left Box: Comparison Spans -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="270" height="215" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="text-bold" fill="#38bdf8">1. Comparison Spans (GTLA-D2)</text>
        <text x="14" y="40" class="text-main" font-size="10">Intermediate carrier M with maps:</text>
        <text x="14" y="56" class="text-code" font-size="10">M &#8594; P_1.V, M &#8594; P_2.V, cost &#8712; &#8469;</text>
        <text x="14" y="76" class="text-bold" font-size="10" fill="#34d399">Theorems GTLA-T1, GTLA-T2:</text>
        <text x="14" y="94" class="text-code" font-size="10" fill="#a5f3fc">cost(diagSpan) = 0  (GTLA-T1)</text>
        <text x="14" y="112" class="text-code" font-size="9" fill="#a5f3fc">cost(S_1 * S_2) &#8804; cost(S_1) + cost(S_2)</text>
        <text x="14" y="130" class="text-muted" font-size="10">(Subadditive cost, GTLA-T2)</text>
        <text x="14" y="152" class="text-main" font-size="10">Span composition is pullback set</text>
        <text x="14" y="168" class="text-main" font-size="10">with matching middle point.</text>
        <text x="14" y="195" class="text-code" font-size="10" fill="#38bdf8">Lean: ComparisonSpan</text>
      </g>
      
      <!-- Middle Box: Trace Layer & Erasure -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="270" height="215" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="text-bold" fill="#818cf8">2. Traces &amp; Erasure (GTLA-D3)</text>
        <text x="14" y="40" class="text-main" font-size="10">Trace = steps + work + span</text>
        <text x="14" y="58" class="text-bold" font-size="10" fill="#c7d2fe">Theorems GTLA-T3..T5:</text>
        <text x="14" y="76" class="text-code" font-size="10" fill="#a5b4fc">idTrace.work = 0  (GTLA-T3)</text>
        <text x="14" y="94" class="text-code" font-size="10" fill="#a5b4fc">eraseTrace(id) = diagSpan (T4)</text>
        <text x="14" y="112" class="text-code" font-size="9" fill="#a5b4fc">erase(t1*t2) = erase(t1)*erase(t2)</text>
        <text x="14" y="130" class="text-muted" font-size="10">(Erasure preserves comp, T5)</text>
        <text x="14" y="152" class="text-bold" font-size="10" fill="#fde68a">Two-Level Cost Accounting:</text>
        <text x="14" y="170" class="text-main" font-size="10">Round-trip: extensional cost = 0,</text>
        <text x="14" y="184" class="text-main" font-size="10">while intensional work cost &gt; 0.</text>
        <text x="14" y="198" class="text-code" font-size="9" fill="#fbbf24">Work retained; quotient erases.</text>
      </g>
      
      <!-- Right Box: Evaluator & 3 Terminals -->
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="270" height="215" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="text-bold" fill="#f43f5e">3. Evaluator Firewall (GTLA)</text>
        <text x="14" y="40" class="text-main" font-size="10">Record: (sieve, ref, glue, P1, G2)</text>
        <text x="14" y="58" class="text-bold" font-size="10" fill="#fda4af">Theorems GTLA-T6..T9:</text>
        <text x="14" y="74" class="text-code" font-size="10" fill="#f87171">Empty sieve &#8658; refused (T6)</text>
        <text x="14" y="90" class="text-code" font-size="10" fill="#fbbf24">&#934;_1 &gt; 0 &#8658; closedResidual (T7)</text>
        <text x="14" y="106" class="text-code" font-size="9" fill="#cbd5e1">Disjoint: auth, res, ref (T8)</text>
        <text x="14" y="122" class="text-code" font-size="9" fill="#fca5a5">&#934;_1=0 w/o lic &#8658; refused (T9)</text>
        <text x="14" y="145" class="text-bold" font-size="10" fill="#34d399">The Core Truth:</text>
        <text x="14" y="162" class="text-main" font-size="10">Leftover is NEVER standing.</text>
        <text x="14" y="176" class="text-main" font-size="10">Zero residual w/o lic refused.</text>
        <text x="14" y="195" class="text-code" font-size="9" fill="#f43f5e">Disjointness verified in Lean 4</text>
      </g>
    </g>
  </g>

  <!-- Bottom: Subsumption Refusal -->
  <g transform="translate(50, 545)">
    <rect x="0" y="0" width="900" height="170" rx="8" class="card-warn"/>
    <text x="20" y="24" class="section-title" fill="#f43f5e">HIGHER CATEGORY THEORY POSITIONING (REFUSAL OF SUBSUMPTION)</text>
    <text x="20" y="42" class="text-main" font-size="11">CODA does NOT subsume HoTT or Higher Category Theory. The subsumption verb is formally WITHDRAWN.</text>
    <text x="20" y="60" class="text-main" font-size="11">&#8226; Identity Inversion: Difference is primitive; identity is a derived quotient kernel (Research program).</text>
    <text x="20" y="78" class="text-main" font-size="11">&#8226; No Containers: Finite carriers and no universe hierarchy (Design declaration with explicit price).</text>
    <text x="20" y="96" class="text-main" font-size="11">&#8226; Transport vs Univalence: Priced representation transport is strictly weaker; refusal declared openly.</text>
    <text x="20" y="114" class="text-main" font-size="11">&#8226; Six Desks, Six Papers: Obstruction (FOC), Standing (FDA), Transport (MUR), Comparison (OR), Shadow (CS), Leftover (A).</text>
    <text x="20" y="136" class="text-code" font-size="10" fill="#fca5a5">Universal Directive: AuthorityEffect: None. Evaluator reads declared inputs; confers zero authority.</text>
  </g>
</svg>