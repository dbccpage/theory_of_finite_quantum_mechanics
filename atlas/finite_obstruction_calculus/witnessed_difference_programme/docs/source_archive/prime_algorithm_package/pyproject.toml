[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-engine-prime-algos"
version = "1.0.0"
description = "Algorithm Prime Triad: Candidate Intake, Adapter Descent, and Continuation Control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Jeremy H. Carroll" }]
keywords = [
    "algorithm-prime-triad",
    "cancontinue",
    "intake-admission",
    "exact-arithmetic",
    "lean4",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
notebooks = ["nbclient>=0.8.0", "nbformat>=5.9.0", "ipykernel>=6.0.0"]

[tool.setuptools]
package-dir = { "" = "code" }
py-modules = ["oe_prime_algorithms"]

[tool.pytest.ini_options]
testpaths = ["code"]
pythonpath = ["code"]
filterwarnings = ["error"]
