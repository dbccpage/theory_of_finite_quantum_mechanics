- gap_id: GAP-F001-S000-004
  title: Born uniqueness (Gleason)
  type: continuum_interface
  status: OPEN (CONDITIONAL)
  resolution: OPEN (CONDITIONAL)
  blocking: Ch02 Born uniqueness claim
  description: Born uniqueness of the quadratic form requires imported Hilbert space, projection lattices,
    and Gleason-type assumptions (QM_020 Theorem 6). On the two-label host the dimension extra fails (QM_122
    H017Gleason) because 2-dimensional systems admit non-contextual hidden variables. A genuine binary non-Born frame function on rational two-vectors is proved in
    the repository module GleasonRationalPlane.lean (binary_values, scale_invariant,
    orthogonal_frame_sum, no_quadratic_representation). The older
    GleasonTheorem.lean d2_binary_non_bornian_obstruction only establishes integer
    odd-coefficient arithmetic, not a frame-function representation theorem. At d >= 3, the finite integer partition is not a topology proof for
    S(Q(zeta_n)^3) and does not construct a non-Bornian
    frame function on Q(zeta_n)^3 (the d=3 rival f_rival(v) = (v_0^2 + v_2^2)/(2 ||v||^2) is generated by valid density matrix
    diag(1/2, 0, 1/2)). The Cabello 18-ray witness establishes state-independent non-contextuality defect on finite configurations,
    leaving Born rule derivation vs declaration as an open conditional question on general dense subfields.
  costed_statement: Standard Gleason representation uses the complete real/complex
    projection domain in dimension at least three and its frame-additivity and
    positivity hypotheses. This does not prove that continuum completion or an
    independently postulated continuity condition is necessary on every smaller domain.
  defended_disposition: OPEN (CONDITIONAL). Uniqueness of the quadratic Born rule on dense cyclotomic subfields
    without continuous sphere topology remains open. Finite configurations (Cabello 18-ray) force contextuality
    defects; disconnectedness alone is not a proof that every algebraic-domain
    representation theorem fails. H058 establishes d=2 four-effect tomography and recovery under its stated frame
    assumptions. Rational homogeneity requires a supplied RationalHomogeneityWitness2;
    d=3 coordinate uniqueness assumes the off-diagonal equalities.
    Global positive effect-state representation in arbitrary dimension and projection-only
    Gleason uniqueness on dense cyclotomic subfields remain unproved here.
  busch_effect_frame_resolution: H058 establishes d=2 four-effect tomography and recovery under its stated frame
    assumptions. Rational homogeneity requires a supplied RationalHomogeneityWitness2;
    d=3 coordinate uniqueness assumes the off-diagonal equalities.
    Global positive effect-state representation in arbitrary dimension and projection-only
    Gleason uniqueness on dense cyclotomic subfields remain unproved here.
  source_refs:
  - qm_020 Theorem 6
  - qm_122 §7.2 (H017Gleason)
