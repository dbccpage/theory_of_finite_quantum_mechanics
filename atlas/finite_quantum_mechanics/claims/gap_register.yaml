- gap_id: GAP-FQM-021
  title: Primitive difference does not yet select the declared quantum model or readout
  type: open_bridge
  blocking: Unconditional primitive-to-QM reconstruction
  status: OPEN
  reopened: '2026-10-11'
  description: >-
    Direct packet consumption is an integration result, not a derivation of the packet or quantum
    interpretation from primitive difference. The audited legacy complete-walk version computed a floating-point
    subtraction, then supplied its complexes, rational Cayley parameter, cyclotomic weights, detector
    and squared-amplitude readout independently. The difference value did not construct those inputs.
    The exact pairing engine explicitly calls norm_sq; its I3 cancellation is conditional on that
    declared quadratic rule. Cochain identities, positivity and endpoint normalization alone leave
    alternative readouts available on the same carrier.
  retained_result: >-
    GAP-FQM-005 remains discharged: declared finite models have executable integration paths.
    Exact rational/cyclotomic calculations inside those paths retain their stated scope; the legacy
    cochain classifier uses numerical LP tolerance and is not an exact certificate.
  closure_obligation: >-
    Specify admitted native Genesis histories and protected questions; construct and justify a faithful
    quotient and the observable/scalar structure; justify the readout, composition, positivity and
    process-availability premises. Show which choices are forced and which remain physical imports.
    Wiring a declared model through a packet, or checking I3=0 after defining a square, is insufficient.
  source_refs:
  - tests/legacy/e2e/test_quantum_walk_e2e.py::TestDirectCochainPacketWalkE2E
  - tests/legacy/e2e/conftest.py::ExactChainCochainPairing.probability_quadratic_from_complex
