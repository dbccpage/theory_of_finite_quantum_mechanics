    It passes 170/170. What it does not do is start from a primitive-difference carrier - see GAP-FQM-021.'
- gap_id: GAP-FQM-011
  title: QM_001's one real test is bound to no claim
  closed: '2026-09-04'
  note: 'Discharged, but NOT as opened. The gap said QM_001''s `code/test_qm_001_tower_walk.py` ''asserts
    something real - a lift map is linear with constant difference 2 - unlike the tautology in the same
    package'', and called populating its claim map the cheapest promotion in the corpus. That premise
    was WRONG. The test builds `lift_map = {n: float(n*2)}` and then asserts `lift_map[n] == float(n*2)`:
    it checks a dict comprehension against the expression that produced it. It is a tautology with extra
    steps, no failure of QM-001-C1 could make it fail, and its docstring''s claim to verify C1 was false.
    Populating the map would have manufactured exactly the false receipt this application exists to catch.

    What was done instead: QM_001''s claim-code map, which bound C1 to the non-existent module `qm001_lib.qm001_core`,
    was emptied; the test''s docstring was corrected in place; and the QM-001 claims that ARE finitely
    checkable were implemented and tested independently. `code/cochain.py` computes the §1 packet - D(x,y)=y-x,
    d1 d0 = 0, the weighted L1 norm, Phi_1 as an exact linear program, Gamma_2, and the trichotomy - and
    `code/tests/unit/test_cochain.py` checks C4, C5 and C6 with negative controls. Six deliberate mutations
    of the implementation were all killed by the suite. Registered as FQM-E6 through E9: the first evidence
    this application produced rather than inherited.

    QM-001-C1 itself, the conditional forced-lift implication, remains unevidenced and stays ASSERTED.'
