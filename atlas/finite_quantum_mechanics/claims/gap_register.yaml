atlas_review_findings:
  note: 'Review findings against commit 860ebf6 across coda_atlas recorded as text per workspace fence rule.'
  findings:
  - id: ATLAS-REV-01
    topic: quotient_duality_formula
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch05_cptp_trace_norm_geometry_and_dual_witnesses.md:37-39
    finding: '(C_1/ker\partial_1)^* was identified with ker\partial_1^*. The correct dual is the annihilator (ker\partial_1)^\perp = im\partial_1^*. On a triangle, the spaces have dimensions 2 versus 1. Divergence-free witnesses belong to the dual of the quotient by coboundaries.'
  - id: ATLAS-REV-02
    topic: finite_chains_quadratic_readout
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch02_conditional_hilbert_lift_and_born_normalization.md:475-476
    finding: 'Higher-degree readouts are not obstructed by discreteness alone. A finite, rational three-slit assignment P(S) = |S|^4/81 gives I_3 = 4/9. Quadratic detector structure must be an explicit assumption; I_3 = 0 does not establish that assumption.'
  - id: ATLAS-REV-03
    topic: cabello_psd_admission_vs_gluing
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch05_cptp_trace_norm_geometry_and_dual_witnesses.md:88-89
    finding: 'filter_state explicitly calls is_psd_4x4. An exact rational matrix can satisfy all 18 ray constraints and 9 frame sums, passing gluing, but have negative eigenvalue -1/100. Positivity is an admission filter, not derived from gluing alone.'
  - id: ATLAS-REV-04
    topic: dual_certificate_lean_scope
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch05_cptp_trace_norm_geometry_and_dual_witnesses.md:50-51
    finding: 'DualWitness.lean establishes an upper bound for an already supplied witness against two integers; it does not establish matrix-witness existence or zero duality gap. General matrix-witness attainment remains open.'
  - id: ATLAS-REV-05
    topic: row_sparsity_markov_descent
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch03_superposition_fibers_and_u1_holonomy.md:26-27
    finding: 'Row sparsity fails for T = diag(1, 2) which fixes probability vertices but shifts (1/2, 1/2) to (1/5, 4/5). Nonlinear normalized descent must be distinguished from linear stochastic kernels.'
  - id: ATLAS-REV-06
    topic: finite_unitary_scope
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch01_from_primitive_difference_to_quantum_carriers.md:59
    finding: 'Finite unitaries are not confined to signed permutations; exact rational rotations like (3/5, -4/5; 4/5, 3/5) exist. Scope must be restricted to integer-lattice orthogonal maps or simultaneous l1/l2 isometries.'
  - id: ATLAS-REV-07
    topic: resource_deficit_entanglement
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch04_entanglement_and_separability_obstructions.md:60-63
    finding: 'Resource deficit Delta_1,2 measures basis-dependent amplitude spread, positive even on product vector (1, 1) \otimes (1, 1) (Delta_1,2 = 12 > 0). Entanglement requires a separate nonfactorization criterion.'
  - id: ATLAS-REV-08
    topic: cyclotomic_holonomy_assumption
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch01_from_primitive_difference_to_quantum_carriers.md:34-35
    finding: 'H021 explicitly assigns rho_J := i and rho_tau := zeta_3 and checks identities; it does not derive assignments from boundary geometry alone. Representation and coefficient ring are assumptions.'
  - id: ATLAS-REV-09
    topic: recoupling_pentagon_coherence
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/book/ch06_contextuality_and_operator_algebra_boundaries.md:33-34
    finding: '5D paths agree on e_0 but disagree on e_1; 2D check establishes S_3 braid relation. Claim must be scoped to finite braid relation rather than general coherent tensor associator family.'
  - id: ATLAS-REV-10
    topic: source_inventory_formal_bindings
    location: coda_atlas/F001_quantum/S000_finite_quantum_mechanics/001_from_primitive_difference_to_quantum_mechanics/claims/source_inventory.yaml:175-192
    finding: 'Source inventory references older path containing receipts but no Lean files. SRC-QM-209 hash is stale. Upstream bindings require path and hash synchronization.'
  - id: ATLAS-REV-11
    topic: repo_root_discovery_depth
    location: coda_atlas/F001_quantum/reconciliation/round_01/tools/qm_corpus_lib.py:133-134
    finding: 'parents[7] climbs too far in current layout (requires parents[5]); sentinel-based discovery is preferred.'
  - id: ATLAS-REV-12
    topic: density_validation_tolerance
    location: density_matrix.py:7-9
    finding: 'Retaining NumPy default relative tolerance (rtol=1e-5) accepted Hermiticity and trace errors ~1e-6 when tol=1e-9. Remediated in apps/finite_qm/code/density_matrix.py by setting rtol=0.0.'
  - id: ATLAS-REV-13
    topic: measurement_rare_outcome_deletion
    location: density_matrix.py:17-22
    finding: 'Thresholding at 1e-12 deleted valid rare outcomes (p = 1e-13). Remediated in apps/finite_qm/code/density_matrix.py by separating zero-probability outcomes (p <= 0) from valid positive outcomes (p > 0).'
