- gap_id: GAP-FQM-023
  title: Transcendental von Neumann entropy interface for mixed states
  type: continuum_interface
  blocking: None (external interface priced with certified error bound)
  status: PRICED_CONTINUUM_INTERFACE
  resolution: PRICED_CONTINUUM_INTERFACE
  description: >-
    For any mixed density operator with algebraic spectrum, von Neumann entropy S(rho) = -Tr(rho log rho)
    exits the cyclotomic carrier Q(zeta_n) and is transcendental by Baker's Theorem (1975) on non-vanishing
    linear forms in logarithms (Anchor A1). It is strictly refused as a carrier-internal quantity (C750-T558,
    C750-T559). When evaluated for external thermodynamic interfaces, it must carry a certified rational interval
    enclosure [L_k, U_k] with metric width |U_k - L_k| <= 2^-k and explicit error obligation |S(rho) - S_mid| <= 2^-k.
  metric: Rational interval enclosure [L_k, U_k] with L_k <= S(rho) <= U_k
  error_obligation: Width bound U_k - L_k <= 2^-k for declared precision k >= 1
  source_refs:
  - Anchor A1 (Baker 1975, Chapters 1-3)
  - Anchor A2 (Lindemann-Weierstrass)
  - code/c750_b01_entropy_verdict.py
  - code/c750_b01_entropy_approx.py
  - evidence/c750_b01_reduction_proof.md
  - lean4/FiniteQm/C750/B01/Reduction.lean
  - lean4/FiniteQm/C750/B01/Purity.lean
