  blocking: Mixed state positivity and Archimedean ordering
  description: 'The maximal totally real subfield Q(zeta_n)^+ has phi(n)/2 real embeddings into R (16 at target conductor n=120). Pure state Gram matrices are totally positive (positive semidefinite under all real embeddings), but mixed state witnesses exist starting at minimal conductor n=5 (witness W_5 = diag(sqrt(5)-2, 3-sqrt(5))) that are positive semidefinite under one real embedding and indefinite under another. The Galois group Gal(Q(zeta_n)/Q) acts transitively on Emb(n); no finite algebraic structure within Q(zeta_n) distinguishes an ordered real embedding without an external declaration.'
  costed_statement: 'Requires 1 external declaration selecting an ordered real embedding iota: Q(zeta_n)^+ -> R.'
  defended_disposition: 'DECLARED_EXTERNAL_ASSUMPTION. Selection of an ordered real embedding is an external declaration (count = 1). Pure states require zero declarations as their Gram matrices are totally positive across all real embeddings. Mixed states and density operators with irrational eigenvalues require an embedding declaration to evaluate positivity.'
