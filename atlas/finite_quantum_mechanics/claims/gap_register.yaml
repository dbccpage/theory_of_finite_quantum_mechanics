- gap_id: GAP-F001-S000-011
  title: Everett branch counting rational sector boundary and irrational wall
  type: continuum_interface
  status: PRICED_CONTINUUM_INTERFACE
  resolution: REFUSED_BEYOND_RATIONAL_SECTOR
  blocking: Everett branch counting representation of Born weights
  description: Equal-weight branch counting in an Everett forking tree reproduces Born weights if and
    only if all branch weights lie in the rational field Q. For states with Born weights in the irrational
    sector Q(zeta_n)^+ \ Q (witnessed at minimal conductor n=5 with weights (5 +- sqrt(5))/10), no finite
    integer fine-graining N = \sum m_j can satisfy m_j / N = w_j. Extending branch counting to the irrational
    sector requires infinite branch limits or continuous topological completion, which are refused by the finite
    cyclotomic carrier.
  costed_statement: Requires infinite-depth forking trees or topological limits of rational approximation
    sequences, unconstructible on finite discrete carriers.
  defended_disposition: REFUSED_BEYOND_RATIONAL_SECTOR. Branch counting representation of Born weights is
    derived on the rational sector via minimal fine-graining of multiplicity N* = lcm(denominators) (e.g. N* = 25
    for Target 8 Bell-CHSH), but strictly refused on the irrational sector Q(zeta_n)^+ \ Q without continuous
    topological completion.
  source_refs:
  - lean4/H059RationalSector.lean
  - code/branch_finegraining.py
  - code_rs/src/branch_finegraining.rs
  - evidence/branch_finegraining.json
  - block_02/result.json
