  note: 'Discharged by deletion. The 801 `theorem X : True := by trivial` declarations that stood in for
    sibling programmes that were also 100% stubs - finite_obstruction_calculus (1,545), general_relativity
    (67), 005_mind_and_consciousness (36) - plus 17 pure-stub files inside 000_coda and projection_obstruction.
