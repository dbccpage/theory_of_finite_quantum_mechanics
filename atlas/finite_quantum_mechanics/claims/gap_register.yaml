- gap_id: GAP-FQM-005
  title: No end-to-end walk exists
  closed: '2026-09-05'
  note: 'Discharged. A 170-test, 3,331-line, five-tier end-to-end suite was found at the corpus root -
    `quantum_foundations/tests/e2e/`, outside every paper package and run by nothing - and moved into
    `code/tests/e2e/`, where the application''s suite now runs it. Tier 4 executes real quantum scenarios:
    a discrete Mach-Zehnder interferometer, a Sorkin 3-slit interference measurement, rational Cayley
    discrete time evolution, Cabello glued-interface state filtering, and a monotone admission pipeline
    with entropy audit. Tier 1 covers diamond-complex Stokes, cyclotomic-12 algebra, bilinear pairing,
