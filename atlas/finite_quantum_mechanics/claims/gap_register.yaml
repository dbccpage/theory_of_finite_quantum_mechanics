- gap_id: GAP-F001-S000-002
  title: Continuum Hilbert lift
  type: continuum_interface
  status: PRICED_CONTINUUM_INTERFACE
  resolution: PRICED_CONTINUUM_INTERFACE
  blocking: No chapter closure
  description: The transition from the finite presented carrier (integer weights, finite report labels)
    to a continuous infinite-dimensional Hilbert space is not constructed in any source paper. QM_122
    §6 explicitly refuses this. The discrete/continuum boundary is an open asymptotic interface, refused
    in the finite presentation. Canonical continuous observables [X, P] = i hbar I have no finite-dimensional
    representation (Wintner-Wielandt theorem).
  costed_statement: Requires topological completion of l1/l2 normed space, infinite-dimensional operator
    domain, and non-admitted canonical commutation [X, P] = i hbar I (unrealizable in finite dimension
    by Wintner-Wielandt trace theorem).
  defended_disposition: PRICED_CONTINUUM_INTERFACE. The finite programme stops at discrete dimension d < infty.
    Continuum Hilbert space completion is an imported asymptotic boundary, requiring Cauchy completeness,
    infinite dimensions (for CCR [X, P] = i*hbar*I), and continuous sphere topology (for Born uniqueness).
  source_refs:
  - qm_122 §6
  - qm_020 demotion box
  - lean4/H056ContinuumLiftBoundary.lean
  - code/continuum_lift.py
  - code_rs/src/continuum.rs
  - evidence/continuum_lift_boundary.json
