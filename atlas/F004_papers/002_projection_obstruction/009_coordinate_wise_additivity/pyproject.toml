[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "009_coordinate_wise_additivity"
version = "6.1.1+repository.draft"
description = "Projection Obstruction research package — 009_coordinate_wise_additivity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "ruff==0.14.13",
]
notebooks = [
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "jupyter>=1.1,<2",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<0.11",
    "nbconvert>=7.16,<8",
]

[tool.setuptools]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-p no:debugging"

[tool.coverage.run]
source = ["code"]
omit = ["*/tests/*", "*/__pycache__/*", "code/tests/*", "code/__init__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
extend-exclude = ["jupyter_notebooks"]

[tool.ruff.lint]
# Release profile: pycodestyle structural errors, Pyflakes, import order, and warnings.
# E501 is intentionally left to the formatter rather than represented as a lint claim.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.mypy]
mypy_path = "code"
explicit_package_bases = true

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0"]
