[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "008_so_k_invariant_gauge_classification"
version = "2.0.0"
description = "SO(k)-Invariant Gauge Rigidity for Declared Euclidean Stalks (GS-002)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "ruff==0.14.13",
]
notebooks = [
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "jupyter>=1.1,<2",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<0.11",
    "nbconvert>=7.16,<8",
]

[tool.setuptools]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-p no:debugging"

[tool.coverage.run]
source = ["code"]
omit = ["*/tests/*", "*/__pycache__/*", "code/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.mypy]
mypy_path = "code"
ignore_missing_imports = true
explicit_package_bases = true

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0"]
