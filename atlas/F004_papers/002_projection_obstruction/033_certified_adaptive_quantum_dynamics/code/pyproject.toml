[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caqd"
version = "1.0.1"
description = "Finite cluster-product dynamics with sampled, uncertified residual estimates"
readme = {text = "Finite adaptive quantum dynamics research prototype", content-type = "text/plain"}
license = { text = "Apache-2.0" }
authors = [{ name = "Jeremy H. Carroll" }, { name = "CODA Research Consortium" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pytest-xdist>=3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["caqd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["caqd"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
