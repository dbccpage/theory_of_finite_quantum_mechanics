  name: Graded-square sign and separate semigroup coefficient
  claim_type: Finite algebra and analytic proposition
  statement: With C=dh(q+1)dv(p)-dv(p+1)dh(q) and D=dh+(-1)^p dv, D^2=dh^2+dv^2+(-1)^p C. Independently,
    a C^2 retraction gives mixed semigroup coefficient P A n + D^2Pi(Am,n), tangent under the genuine
    retraction hypotheses.
