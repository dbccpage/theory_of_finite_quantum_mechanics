- id: PO034-C3
  name: Finite-Hamiltonian short-time nonfactorization bound
  claim_type: Analytic theorem
  statement: For a finite closed system, product initial state, and ||H||_infinity <= g for the whole
    Hamiltonian, D(t) >= nu*t - 2*(1+k^2)*g^2*t^2 >= nu*t - 6*k^2*g^2*t^2. For nu>0, t<=nu/(12*k^2*g^2)
    gives D(t)>=nu*t/2.
  scope: The code evaluates the weaker formula and compares actual analytic states numerically. Lemma
    4.3a (PO034-C3a) is the closed-system site-budget refinement. Lemma 4.3b (PO034-C3b) is the finite-dilation
    extension. Lemma 4.3d (PO034-C3d) is the finite-jump coefficient with no Hamiltonian. Lemma 4.3e (PO034-C3e)
    places a bounded Hamiltonian beside that family. The code does not evaluate these lemmas. The mixed
    quadratic coefficient is 2*(1+k^2)*(g+G)^2. A strictly smaller mixed coefficient is not certified.
    Lemma 4.3f (PO034-C3f) shows that the state-acceleration bound cannot replace (g+G)^2 by g^2+G^2.
    That lemma does not change the defect coefficient. Zero initial speed does not imply future factorization.
  code_evidence:
    module: coda_higher_cell.defect_bounds
    functions:
    - short_time_k_party_defect_lower_bound
    - evaluate_k_party_trace_defect
    tests:
    - code/tests/test_defect_bounds.py::test_short_time_bound_against_analytic_ghz_state
    - code/tests/test_defect_bounds.py::test_zero_initial_speed_does_not_imply_future_factorization
    - code/tests/test_defect_bounds.py::test_classical_separable_state_has_defect_one
    status: numerical_examples
  lean4_evidence:
    status: not_mechanized
    scope: Not mechanized in this deposit.
- id: PO034-C3a
  name: Closed-system site-budget refinement of the short-time bound
  claim_type: Lemma
  statement: For H = sum_alpha h_alpha on a closed finite system, with each Hermitian h_alpha supported
    on a declared subset X_alpha, g >= ||H||_infinity, and g_j = sum_{alpha:j in X_alpha} ||h_alpha||_infinity,
    Gamma = g^2 + g*sum_j g_j + sum_{i != j} g_i*g_j. Then D(t) >= nu*t - 2*Gamma*t^2. If nu>0 and t <=
    nu/(4*Gamma), then D(t) >= nu*t/2. The one-term decomposition h_1 = H with declared support X_1 =
    sigma and g = ||H||_infinity recovers Gamma = (1+k^2)*g^2.
  scope: Package version remains 0.1.0. The global factor g stays in Gamma. A redundant decomposition
    can make Gamma larger than the Theorem 4.3 coefficient. Removing g is not claimed. The reduced-subsystem
    statement is Lemma 4.3b, not this lemma. Example 4.3a is an exact symbolic witness, not a Python test,
    and it does not evaluate D(t).
  witness: Example 4.3a. k=3, H=X tensor X tensor I, g=1, support {1,2}, g_1=g_2=1, g_3=0. Then sum_j
    g_j=2, sum_{i != j} g_i g_j=2, Gamma=5, and 2*Gamma=10, against 2*(1+k^2)*g^2=20. Counterexample 4.2a
    gives nu=2, so D(t)>=2t-10t^2 and D(t)>=t on 0<=t<=1/10. The weaker Theorem 4.3 window is 0<=t<=1/54.
    The site-3 marginal is |0><0|, so its velocity has trace norm 0. The site-1 marginal is diag(cos^2
    t, sin^2 t), so its velocity has trace norm 2|sin(2t)|, equal to 2*g_1 at t=pi/4. The witness does
    not evaluate D(t).
  code_evidence:
    module: none
    note: Example 4.3a is the witness. The Theorem 4.3 code path is unchanged.
    status: not_executed
  lean4_evidence:
    scope: Not mechanized in this deposit.
    status: not_mechanized
  written_evidence:
    assumptions: Closed finite product carrier, Hermitian declared-support decomposition, whole-Hamiltonian
      norm bound, product initial state.
    proof_location:
      path: 034_higher_cell_cochain_projection_and_retraction_dynamics.md
      heading: '### Lemma 4.3a (Site-budget refinement on a closed system)'
    execution_status: not_executed
- id: PO034-C3b
  name: Reduced site-budget bound on a finite dilation
  claim_type: Lemma
  statement: For a finite dilation on sigma disjoint-union epsilon with k=|sigma|>=2, a Hermitian decomposition
    of the dilated Hamiltonian, g >= ||H||_infinity, and system site budgets g_j, the same Gamma = g^2
    + g*sum_{j in sigma} g_j + sum_{i != j} g_i*g_j gives D_sigma(t) >= nu_sigma*t - 2*Gamma*t^2. If nu_sigma>0
    and t <= nu_sigma/(4*Gamma), then D_sigma(t) >= nu_sigma*t/2. If H = H_sigma tensor I + I tensor H_epsilon,
    the reduced trajectory is the unitary orbit of H_sigma and ||H_epsilon||_infinity does not enter it.
  scope: Package version remains 0.1.0. The global factor g stays in Gamma. Replacement by max_j g_j is
    not claimed. A Lindblad generator without a finite autonomous Hermitian dilation is not covered. An
    environment-only summand can inflate g. Example 4.3b is an exact symbolic witness, not a Python test.
  witness: Example 4.3b. sigma={1,2,3}, epsilon={4}, H=(X tensor X tensor I) tensor |0><0|, g=1, support
    {1,2,4}, g_1=g_2=1, g_3=0, Gamma=5, and 2*Gamma=10, against the closed three-site leading coefficient
    20. Initial vector (|0000>+|0001>)/sqrt(2). Exact reduced defect D_sigma=2*ab+2*max(ab,|w|) with a=(1+cos(t)^2)/2,
    b=sin(t)^2/2, w=i*cos(t)*sin(t)/2, ab=sin(t)^2*(1+cos(t)^2)/4, and |w|=|cos(t)*sin(t)|/2. Then nu_sigma=1,
    so D_sigma >= t-10*t^2 and D_sigma >= t/2 on 0<=t<=1/20. Nonzero eigenvalues (1±cos(t))/2 on [0, pi/2]
    are not constant, so the reduced trajectory is not a unitary orbit. At t=pi/2, purity is 1/2 and D_sigma=1.
  code_evidence:
    module: none
    note: Example 4.3b is the witness. The Theorem 4.3 code path is unchanged.
    status: not_executed
  lean4_evidence:
    scope: Not mechanized in this deposit.
    status: not_mechanized
  written_evidence:
    assumptions: Finite total carrier, fixed Hermitian Hamiltonian, declared system site budgets, product
      reduced initial state.
    proof_location:
      path: 034_higher_cell_cochain_projection_and_retraction_dynamics.md
      heading: '### Lemma 4.3b (Reduced site-budget bound on a finite dilation)'
    execution_status: not_executed
- id: PO034-C3c
  name: Jump trajectory with no finite autonomous Hermitian dilation
  claim_type: Lemma
  statement: For the two-qubit jump generator L(rho)=K rho K^dagger - (1/2){K^dagger K, rho} with K=|00><11|
    and rho(0)=|11><11|, rho(t)=(1-e^{-t})|00><00|+e^{-t}|11><11|, D(t)=4*e^{-t}*(1-e^{-t}), and nu=4.
    Thus D(t)>=4*t-6*t^2, and D(t)>=2*t on 0<=t<=1/3. The population e^{-t} is not a finite sum of characters
    e^{-i*omega*t}, so the trajectory is not the reduction of any fixed finite-dimensional autonomous
    Hermitian evolution with a fixed initial total state for all t>=0.
  scope: Package version remains 0.1.0. This is one generator. The finite-jump coefficient with no Hamiltonian
    is Lemma 4.3d, and it does not recover the coefficient 6. A bounded Hamiltonian beside a finite jump
    family is Lemma 4.3e, and its coefficient does not recover 6. Lemma 4.3b's norm g and site budgets
    are unavailable. Replacement of g by max_j g_j is not claimed. The witness is exact and symbolic,
    not a Python test.
  witness: Lemma 4.3c. K=|00><11|, rho(0)=|11><11|, D(t)=4*exp(-t)*(1-exp(-t)), nu=4, coefficient 6, half-speed
    window 0<=t<=1/3. Obstruction is linear independence of exp(-t) from the characters exp(-i*omega*t).
  code_evidence:
    module: none
    note: Lemma 4.3c is the witness. The Theorem 4.3 code path is unchanged.
    status: not_executed
  lean4_evidence:
    scope: Not mechanized in this deposit.
    status: not_mechanized
  written_evidence:
    assumptions: Two-qubit jump K=|00><11|, fixed initial state |11><11|, all t>=0; no-go model is fixed
      finite autonomous Hermitian evolution.
    proof_location:
      path: 034_higher_cell_cochain_projection_and_retraction_dynamics.md
      heading: '### Lemma 4.3c (A jump trajectory with no finite autonomous Hermitian dilation)'
    execution_status: not_executed
- id: PO034-C3d
  name: Quadratic coefficient for a finite family of jumps
  claim_type: Lemma
  statement: For k>=2 and a finite jump family with no Hamiltonian, L(X)=sum_alpha (K_alpha X K_alpha^dagger
    - (1/2){K_alpha^dagger K_alpha, X}) and G >= sum_alpha ||K_alpha||_infinity^2, product initial data
    gives D(t) >= nu*t - 2*(1+k^2)*G^2*t^2 >= nu*t - 6*k^2*G^2*t^2, where nu=||f'(0)||_1. If nu>0 and
    t <= nu/(4*(1+k^2)*G^2), then D(t) >= nu*t/2. On the Lemma 4.3c data, G=1 and k=2, so the quadratic
    coefficient is 10 and the half-speed window is 1/5, not the scalar coefficient 6 and the window 1/3.
  scope: Package version remains 0.1.0. No Hamiltonian term. No site budgets. The global factor g is not
    removed, and replacement by max_j g_j is not claimed. No finite-dilation obstruction is claimed for
    a general jump family. The witness is the comparison with Lemma 4.3c, not a Python test.
  witness: Lemma 4.3c data inside Lemma 4.3d. m=1, K=|00><11|, G=1, k=2, nu=4, quadratic coefficient 2*(1+4)*G^2=10,
    half-speed window 0<=t<=1/5. Lemma 4.3c gives coefficient 6 and window 1/3. At t=0, ||rho'(0)||_1=2=2*G,
    so the first-derivative budget is achieved and the quadratic coefficient is not.
  code_evidence:
    module: none
    note: Lemma 4.3d is the derivation. The Theorem 4.3 code path is unchanged.
    status: not_executed
