paper_id: 034_higher_cell_cochain_projection_and_retraction_dynamics
title: Higher-Cell Product Retractions, Simplicial Cochains, and Finite Retraction Dynamics
version: 0.1.0
date: '2026-10-10'
status: unpublished technical preprint; first publication review candidate; deposition unverified
authority_effect: None
evidence_policy: Analytic statements, numerical tests, conditional abstract Lean proofs, and protocol
  metadata are separate evidence scopes.
claims:
- id: PO034-C1
  name: Product projector idempotence and marginals
  claim_type: Theorem
  statement: On traceless Hermitian directions at a normalized product reference, P is idempotent, preserves
    single-site marginals, and projects onto the algebraic product tangent space. Full-rank densities
    permit the usual interior manifold interpretation. Normal defect projector Q has vanishing single-site marginal traces (Tr_{\setminus j}[Q(Z)] = 0).
  scope: Boundary feasibility is separate. The full-space software map is the derivative of the homogeneous
    extension. Continuous U(1) transport requires an infinite period lattice distinct from finite torsion.
  bridge_claims:
  - id: PO034-C1-NS
    name: Product projector marginal preservation and no-signalling holonomy bridge
    statement: The product tangent projector P preserves local single-site marginals (Tr_{\setminus j}[P(Z)] = Tr_{\setminus j}[Z]) while the normal defect projector Q has vanishing single-site marginal traces (Tr_{\setminus j}[Q(Z)] = 0). Under two-site entangling Hamiltonian interactions on a simplicial cell, defect speed nu = ||Q[H, rho]||_1 > 0 accumulates boundary edge cochains and face holonomies without perturbing local marginals, matching Cycle 007 formal no-signalling (LT-NS / NoSignallingBA), continuous U(1) torsion exclusion (LT-U1), and discrete rotation generators (LT-A).
    lean4_reference: lean4/quantum_mechanics/NoSignalling.lean
    python_bridge: coda_higher_cell.cochain_holonomy_bridge
  code_evidence:
    module: coda_higher_cell.k_cell_retraction
    functions:
    - k_cell_tangent_projector
    - k_cell_normal_projector
    - verify_marginal_preservation
    tests:
    - code/tests/test_k_cell_retraction.py::test_tangent_projector_idempotence_and_marginals
    - code/tests/test_k_cell_retraction.py::test_full_space_extension_derivative_and_tiny_trace_linearity
    - code/tests/test_holonomy_defect_bridge.py::test_single_site_hamiltonian_has_zero_defect_velocity
    - code/tests/test_holonomy_defect_bridge.py::test_two_site_interaction_defect_and_marginal_annihilation
    - code/tests/test_holonomy_defect_bridge.py::test_3simplex_cochain_mapping_and_face_holonomies
    status: numerical_examples
  lean4_evidence:
    module: HigherCell.Theorem41_Idempotence
    theorems:
    - HigherCell.theorem41_marginal_preservation
    - HigherCell.theorem41_idempotence
    - HigherCell.theorem41_normal_annihilates_tangent
    scope: Conditional abstract additive identities; trace/embedding laws are structure fields. No concrete
      matrix instantiation. Formal completions for LT-A, LT-U1, and LT-NS reside in lean4/quantum_mechanics (RotationGroups.lean, H011Circle.lean, NoSignalling.lean). Stored census only; no fresh build in this review.
    status: conditional_abstract
- id: PO034-C2
  name: One-site isolation and a distinct highest-order projector
  claim_type: Theorem and counterexample
  statement: 'Q annihilates one-site Hamiltonian variations. Proper multi-site support need not be tangent:
    X1 X2 I3 at |000> has QL=L with trace norm 2. A separate projector R_k=product_j(I-E_j) annihilates
    reference-factorized proper-support variations.'
  scope: Q is not R_k for k>2. Neither full support nor a nonzero component alone establishes genuine multipartite
    entanglement.
  code_evidence:
    module: coda_higher_cell.k_cell_retraction
    functions:
