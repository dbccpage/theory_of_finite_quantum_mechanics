- id: PO034-C3f
  name: The acceleration cross term does not drop
  claim_type: Lemma
  statement: For two qubits, S=|0><0|+i|1><1|, H=Z tensor I, K=S tensor I, and rho(0)=|+><+| tensor |0><0|,
    one has g=1, G=1, and ||rho''(0)||_1=10. Thus 4*(g^2+G^2)=8 < ||rho''(0)||_1 < 16=4*(g+G)^2. The state-acceleration
    estimate ||rho''(t)||_1 <= 4*(g+G)^2 cannot be replaced by ||rho''(t)||_1 <= 4*(g^2+G^2). The orbit
    is the product A(t) tensor |0><0| with coherence c(t)=(1/2)*exp(-(1+3i)*t), so D(t)=0 and nu=0.
  scope: Package version remains 0.1.0. No site budgets. The global factor g is not removed, and replacement
    by max_j g_j is not claimed. The defect coefficient of Lemma 4.3e is not replaced by 2*(1+k^2)*(g^2+G^2),
    and this witness does not establish that the defect replacement is false. The full cross contribution
    8*g*G inside 4*(g+G)^2 is not achieved. The scalar coefficient 6 and the window 1/3 are not recovered.
    No finite-dilation obstruction is claimed for a general mixed family. The witness is exact and symbolic,
    not a Python test.
  witness: k=2, m=1, H=Z tensor I, K=S tensor I, rho(0)=|+><+| tensor |0><0|, g=1, G=1. Coherence c(t)=(1/2)*exp(-(1+3i)*t).
    ||rho'(0)||_1=sqrt(10)<4=2*(g+G). ||rho''(0)||_1=10. The gap above 4*(g^2+G^2) is 2. The acceleration
    budget 16 is not achieved. D(t)=0 and nu=0. The factor exp(-t) is not a finite sum of characters,
    so this one trajectory has no finite autonomous Hermitian dilation.
  code_evidence:
    module: none
    note: Lemma 4.3f is the derivation. The Theorem 4.3 code path is unchanged.
    status: not_executed
  lean4_evidence:
    scope: Not mechanized in this deposit.
    status: not_mechanized
