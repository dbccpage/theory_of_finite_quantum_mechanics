- id: PO034-C3e
  name: Quadratic coefficient for a bounded Hamiltonian beside a finite jump family
  claim_type: Lemma
  statement: For k>=2, H Hermitian with g >= ||H||_infinity, and a finite jump family with G >= sum_alpha
    ||K_alpha||_infinity^2, the generator L(X)=-i[H,X]+sum_alpha (K_alpha X K_alpha^dagger - (1/2){K_alpha^dagger
    K_alpha, X}) and product initial data give D(t) >= nu*t - 2*(1+k^2)*(g+G)^2*t^2 >= nu*t - 6*k^2*(g+G)^2*t^2,
    where nu=||f'(0)||_1. If nu>0 and t <= nu/(4*(1+k^2)*(g+G)^2), then D(t) >= nu*t/2. G=0 recovers the
    leading coefficient of Theorem 4.3. g=0 recovers Lemma 4.3d. The square (g+G)^2 keeps the cross term
    2*g*G. On the commuting witness k=2, g=1, G=1, the quadratic coefficient is 40 and the half-speed
    window is 1/20, not the scalar coefficient 6 and the window 1/3.
  scope: Package version remains 0.1.0. No site budgets. The global factor g is not removed, and replacement
    by max_j g_j is not claimed. The cross term is not removed, and (g+G)^2 is not replaced by g^2+G^2.
    Lemma 4.3f shows that the state-acceleration form of that replacement is false and does not change
    this defect coefficient. The scalar coefficient 6 and the window 1/3 are not recovered. No finite-dilation
    obstruction is claimed for a general mixed family. The witness is exact and symbolic, not a Python
    test.
  witness: k=2, m=1, K=|00><11|, H=|00><00|-|11><11|, rho(0)=|11><11|, g=1, G=1, nu=4. Quadratic coefficient
    2*(1+4)*(1+1)^2=40. Half-speed window 0<=t<=1/20. H commutes with the Lemma 4.3c trajectory, so D(t)=4*exp(-t)*(1-exp(-t))
    and Lemma 4.3c still gives coefficient 6 and window 1/3. At t=0, ||rho'(0)||_1=2, while 2*(g+G)=4,
    so the first-derivative budget is not achieved and the quadratic coefficient is not sharp. This one
    trajectory still has no finite autonomous Hermitian dilation.
  code_evidence:
    module: none
    note: Lemma 4.3e is the derivation. The Theorem 4.3 code path is unchanged.
    status: not_executed
  lean4_evidence:
    scope: Not mechanized in this deposit.
