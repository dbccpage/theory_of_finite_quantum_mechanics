[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coda_higher_cell"
version = "0.1.0"
description = "Finite product-state residuals, simplicial cochains, and retraction examples"
readme = {text = "PO-034 numerical examples; manuscript package version 0.1.0", content-type = "text/plain"}
license = "PolyForm-Noncommercial-1.0.0"
authors = [{name = "Jeremy H. Carroll"}]
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.14", "mypy==1.19.1", "types-PyYAML>=6"]
notebooks = ["nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["coda_higher_cell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
