[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-descent-authority"
version = "0.1.1"
description = "Finite descent standing authorization gate and exact cochain quotient solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3", "pytest-cov>=6", "matplotlib>=3.8"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "nbconvert>=7", "matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["coda_fda_core", "coda_fda_pipeline", "cochain_presentation", "generate_figures"]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

# These scientific packages do not all ship supported type stubs.
# Only missing third-party stubs are ignored; local source and tests remain checked.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "numpy", "numpy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
