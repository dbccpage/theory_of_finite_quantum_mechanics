<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">CODA-CS-Q: Finite Profile Factorization and Sampling Limits</text>
  <text x="40" y="72" class="subtitle">Image factors, decoder bounds, and missing-value obstructions (Continuum Shadow Quarantine Bridge)</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-CS-Q · DET-CSQ-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Exact Image Factorization & 2*eps Bound -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">EXACT ON IMAGE &amp; APPROXIMATE BOUNDS</text>
    
    <!-- Exact on Image Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="130" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Exact on the Image (Theorem CSQ-T1):</text>
      <text x="16" y="40" class="text-main" font-size="11">For profile p: X &#8594; P and query q: X &#8594; Y, equivalent are:</text>
      <text x="24" y="58" class="text-code" font-size="10">1. &#8707;g : im(p) &#8594; Y s.t. g(p(x)) = q(x) for all x</text>
      <text x="24" y="74" class="text-code" font-size="10">2. q is fibre-constant for p: p(x)=p(y) &#8658; q(x)=q(y)</text>
      <text x="16" y="94" class="text-main" font-size="11">Through the image, factorization matches constancy.</text>
      <text x="16" y="112" class="text-muted" font-size="10">Image factors are unique (Coda.image_factor_unique).</text>
    </g>
    
    <!-- Blurry Decoder Collision Bound Card -->
    <g transform="translate(20, 186)">
      <rect x="0" y="0" width="400" height="142" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#c7d2fe">Collision Distance at most 2&#949; (Theorem CSQ-T2):</text>
      <text x="16" y="40" class="text-main" font-size="11">If decoder g: P &#8594; Y has dist(q(x), g(p(x))) &#8804; &#949; for all x:</text>
      <text x="24" y="60" class="text-code" font-size="10" fill="#38bdf8">p(x) = p(y)  &#8658;  dist(q(x), q(y)) &#8804; 2&#949;</text>
      <text x="16" y="80" class="text-main" font-size="11">Proof by triangle inequality through g(p(x)).</text>
      <text x="16" y="98" class="text-main" font-size="11">When &#949; = 0 on metric space, dist=0 &#8658; q(x) = q(y).</text>
      <text x="16" y="118" class="text-muted" font-size="10">Fails on pseudometrics (separation required).</text>
    </g>

    <!-- Lipschitz Access Card -->
    <g transform="translate(20, 340)">
      <rect x="0" y="0" width="400" height="105" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#34d399">Lipschitz Access (Theorem CSQ-T3):</text>
      <text x="16" y="40" class="text-main" font-size="11">If q is Lipschitz with constant K &#8805; 0 on metric spaces:</text>
      <text x="24" y="60" class="text-code" font-size="10" fill="#a5f3fc">dist(x, a) &#8804; &#949;  &#8658;  dist(q(x), q(a)) &#8804; K &#183; &#949;</text>
      <text x="16" y="80" class="text-main" font-size="11">Nearby inputs give bounded change, not equality.</text>
      <text x="16" y="96" class="text-muted" font-size="10">Lipschitz access is NOT fibre constancy.</text>
    </g>
  </g>

  <!-- Right: 2 Dots Do Not Make a Curve & Sampling Limits -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">SAMPLING LIMITS &amp; MISSING VALUES</text>
    
    <!-- Theorem CSQ-T4 Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="175" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fda4af">Endpoint Samples Do Not Fix Midpoint (CSQ-T4):</text>
      <text x="16" y="40" class="text-main" font-size="11">State: real functions &#8477; &#8594; &#8477;. Profile: p(f) = (f(0), f(1)).</text>
      <text x="16" y="56" class="text-main" font-size="11">Midpoint query: q(f) = f(1/2).</text>
      <text x="24" y="76" class="text-code" font-size="10" fill="#fca5a5">f(t) = 0      &#8658;  p(f) = (0, 0),  q(f) = 0</text>
      <text x="24" y="92" class="text-code" font-size="10" fill="#fca5a5">g(t) = t(1-t) &#8658;  p(g) = (0, 0),  q(g) = 1/4</text>
      <text x="16" y="112" class="text-bold" font-size="11" fill="#f43f5e">Collision: p(f) = p(g) but q(f) &#8800; q(g)!</text>
      <text x="24" y="130" class="text-code" font-size="10" fill="#f87171">&#172;Factors(f &#8614; (f(0),f(1)), f &#8614; f(1/2))</text>
      <text x="16" y="152" class="text-muted" font-size="10">Shared sample (0,0) fits multiple curves.</text>
    </g>
    
    <!-- Theorem CSQ-T5: Evaluation Honesty Card -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="400" height="98" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Evaluation Honesty (Theorem CSQ-T5):</text>
      <text x="16" y="40" class="text-main" font-size="11">Named maps agree when query and factor composite:</text>
      <text x="24" y="60" class="text-code" font-size="10" fill="#38bdf8">g(p(x)) = q(x)  (Exact on image instances)</text>
      <text x="16" y="80" class="text-muted" font-size="10">Extension on unused labels requires explicit witness.</text>
    </g>

    <!-- Scope Fence Card -->
    <g transform="translate(20, 340)">
      <rect x="0" y="0" width="400" height="105" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Scope Fence &amp; Quantum Disclaimer:</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; This note does NOT derive quantum mechanics.</text>
      <text x="16" y="56" class="text-main" font-size="11">&#8226; Finite profiles cannot be promoted to continuum.</text>
      <text x="16" y="72" class="text-main" font-size="11">&#8226; Decoders within &#949; cannot decide truth beyond 2&#949;.</text>
      <text x="16" y="90" class="text-code" font-size="10" fill="#fca5a5">Refusal on unmeasured continuum claims.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#38bdf8">Architectural Principles of CODA-CS-Q:</text>
    <text x="20" y="48" class="text-main">&#8226; Finite Profile Bridge: Connects discrete cochain apparatus to continuum presentations via honest image profiles.</text>
    <text x="20" y="66" class="text-main">&#8226; Decoder Rigor: Approximate recovery is bounded by 2&#949;, strictly enforcing metric separation.</text>
    <text x="20" y="84" class="text-main">&#8226; Missing Values: Sampling endpoints does not specify the interior; guesses are barred from the calculus.</text>
    <text x="20" y="104" class="text-code" fill="#f87171">AuthorityEffect: None. Finite profile factorizations confer zero continuum authority.</text>
  </g>
</svg>