<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <style>
    .bg { fill: #0a0f1d; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; ry: 8; }
    .card-accent { fill: #162032; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .card-warn { fill: #1e1b2e; stroke: #f43f5e; stroke-width: 2; rx: 8; ry: 8; }
    .card-auth { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 8; ry: 8; }
    .card-green { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; ry: 8; }
    .card-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 2; rx: 8; ry: 8; }
    .card-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
    .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #a5f3fc; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .flow-line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .flow-line-warn { stroke: #f43f5e; stroke-width: 2; fill: none; }
    .flow-line-auth { stroke: #60a5fa; stroke-width: 2.5; fill: none; }
    .flow-line-green { stroke: #10b981; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="730" class="bg"/>
  
  <!-- Header Banner -->
  <rect x="20" y="20" width="960" height="70" rx="8" fill="url(#grad-header)" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="50" class="title">Level 0 Detail: Foundations &amp; Primitives (FDN)</text>
  <text x="40" y="72" class="subtitle">Root W (Witnessed Non-Identification) vs Root P (Evaluation Primer) and Separation Fences</text>
  <rect x="780" y="35" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="870" y="52" text-anchor="middle" class="text-code">CODA-FDN · DET-FDN-001</text>
  <text x="870" y="80" text-anchor="middle" class="text-muted">AuthorityEffect: None</text>

  <!-- Left: Root W vs Root P -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">ROOT W VS ROOT P KERNEL ARCHITECTURE</text>
    
    <!-- Root W Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="158" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Root W: Witnessed Irreflexive Relation</text>
      <text x="16" y="40" class="text-main" font-size="11">Kernel K = (X, R, Irr(R)) with designated witness:</text>
      <text x="16" y="58" class="text-code" fill="#a5f3fc">d = (a, b, w : R(a, b))  ==&gt;  a != b (Proved)</text>
      <text x="16" y="74" class="text-main" font-size="11">Difference is an inhabited non-identification.</text>
      <text x="16" y="90" class="text-main" font-size="11">Irreflexivity law is never entailed:</text>
      <text x="16" y="106" class="text-code" font-size="10" fill="#a5f3fc">(Bridge.irrefl_law_not_entailed)</text>
      <text x="16" y="124" class="text-code" fill="#34d399">ADMISSION KERNEL (Genesis lives here)</text>
      <text x="16" y="140" class="text-muted" font-size="10">Puts witness on NON-ZERO: difference witnessed first.</text>
      <text x="16" y="152" class="text-muted" font-size="10">Ontological priority of difference over sameness.</text>
    </g>
    
    <!-- Root P Card -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="400" height="155" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#a5b4fc">Root P: Evaluation Primer</text>
      <text x="16" y="40" class="text-main" font-size="11">Structure (delta, Zero, zero_refl, zero_symm, zero_trans):</text>
      <text x="16" y="58" class="text-code" fill="#c7d2fe">ZeroRel x y := Zero (delta x y)</text>
      <text x="16" y="76" class="text-main" font-size="11">Standard equivalence relation; quotient X / ~.</text>
      <text x="16" y="92" class="text-main" font-size="11">deltaFactor descends iff DeltaCongruent holds.</text>
      <text x="16" y="112" class="text-code" fill="#818cf8">EVALUATION KERNEL (FOC lives here)</text>
      <text x="16" y="130" class="text-muted" font-size="10">Puts witness on ZERO: equality certified by quotient.</text>
      <text x="16" y="146" class="text-muted" font-size="10">Evaluation is strictly downstream of primitive difference.</text>
    </g>

    <!-- Supply Invariance Card -->
    <g transform="translate(20, 380)">
      <rect x="0" y="0" width="400" height="65" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="20" class="text-bold" fill="#c7d2fe">Supply Invariance Law (Inertia.lean:17):</text>
      <text x="16" y="38" class="text-code" font-size="10" fill="#38bdf8">supply_no_op: Supply presents candidate,</text>
      <text x="16" y="52" class="text-code" font-size="10" fill="#38bdf8">changes NO state.</text>
    </g>
  </g>

  <!-- Right: Demarcation Fences & Separation Theorems -->
  <g transform="translate(510, 105)">
    <rect x="0" y="0" width="440" height="460" rx="8" class="card"/>
    <text x="20" y="28" class="section-title">DEMARCATION FENCES &amp; AXIOMATIC INTEGRITY</text>
    
    <!-- Fence 1 Card -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#20121d" stroke="#e11d48" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fda4af">Fence 1: Root W does not collapse to Root P</text>
      <text x="16" y="40" class="text-main" font-size="11">A non-identification (a != b) cannot become</text>
      <text x="16" y="56" class="text-main" font-size="11">an equivalence relation without explicit quotient.</text>
      <text x="16" y="76" class="text-code" fill="#fca5a5">Bridge.rootW_to_rootP_not_invertible</text>
      <text x="16" y="96" class="text-muted" font-size="10">Irreversible separation: Difference is not derived from equality.</text>
    </g>
    
    <!-- Fence 2 Card -->
    <g transform="translate(20, 178)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#fbbf24">Fence 2: Zero Axiom Inflation</text>
      <text x="16" y="40" class="text-main" font-size="11">All mechanizations in Lean 4 maintain strict axiom hygiene:</text>
      <text x="24" y="60" class="text-code" fill="#34d399">#print axioms within {propext, Quot.sound}</text>
      <text x="16" y="80" class="text-main" font-size="11">Zero unproved foundational axioms; zero Classical.choice.</text>
      <text x="16" y="98" class="text-muted" font-size="10">Axiomatic reports verified by automated lake elaboration gate.</text>
    </g>

    <!-- Epistemic Grounding Card -->
    <g transform="translate(20, 312)">
      <rect x="0" y="0" width="400" height="132" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" class="text-bold" fill="#38bdf8">Epistemic Grounding of Foundations:</text>
      <text x="16" y="40" class="text-main" font-size="11">&#8226; Primitive difference is ontologically first (Root W).</text>
      <text x="16" y="56" class="text-main" font-size="11">&#8226; Diagnostic evaluation only in quotients (Root P).</text>
      <text x="16" y="72" class="text-main" font-size="11">&#8226; Differences are measured leftovers, not origin myths.</text>
      <text x="16" y="92" class="text-code" font-size="10" fill="#f87171">Universal Directive: AuthorityEffect: None.</text>
      <text x="16" y="110" class="text-muted" font-size="10">Foundational primitives create no self-standing licenses.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="130" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" class="text-bold" fill="#38bdf8">Foundational Architecture of CODA:</text>
    <text x="20" y="48" class="text-main">&#8226; Foundations isolate genesis from evaluation: Root W proves difference exists; Root P evaluates quotient equivalence.</text>
    <text x="20" y="66" class="text-main">&#8226; Neither kernel confers sovereign authority; they form the rigorous bedrock upon which FOC and FDA operate.</text>
    <text x="20" y="84" class="text-main">&#8226; Sealed derivation assets in 19L57G1 are cited by cryptographic hash (3100c4e) and never imported into living tree.</text>
    <text x="20" y="104" class="text-code" fill="#f87171">AuthorityEffect: None. Foundations supply mathematical rigor, not operational standing.</text>
  </g>
</svg>