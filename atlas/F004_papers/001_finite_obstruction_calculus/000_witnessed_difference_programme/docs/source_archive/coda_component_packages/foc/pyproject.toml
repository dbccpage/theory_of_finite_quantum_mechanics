[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-obstruction-calculus"
version = "3.2.1"
description = "Exact two-stage finite obstruction diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "sympy>=1.12"]

[project.optional-dependencies]
notebook = ["notebook==7.6.3"]
test = ["pytest==9.0.3", "matplotlib==3.10.8"]
verification = ["numpy==2.2.6", "sympy==1.14.0", "matplotlib==3.10.8", "pytest==9.0.3", "coverage==7.16.2", "nbclient==0.11.0", "nbformat==5.11.1", "ipykernel==7.3.0", "mypy==2.3.1", "ruff==0.16.9", "PyMuPDF==1.28.2"]

[tool.setuptools]
py-modules = ["finite_obstruction"]
packages = ["foc_core"]
package-dir = { "" = "code" }

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sympy.*",
    "matplotlib.*",
    "numpy.*"
]
ignore_missing_imports = true
