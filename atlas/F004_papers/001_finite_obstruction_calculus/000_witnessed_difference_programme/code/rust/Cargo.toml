[package]
name = "wdp_finite_witness"
version = "0.1.0"
edition = "2021"
authors = ["Jeremy H. Carroll"]
description = "Paper-side finite witness helpers for the Witnessed Difference Programme. Not the canonical native calculus; the canonical owner is the workspace crate omega_wdp."
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
omega_functional = { path = "../../../../../../../omega_engine/crates_rs/omega_functional" }
omega_solvers = { path = "../../../../../../../omega_engine/crates_rs/omega_solvers" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "solve_wdp_obstruction"
path = "src/bin/solve_wdp_obstruction.rs"

[[bin]]
name = "solve_genesis_observer"
path = "src/bin/solve_genesis_observer.rs"

[lib]
name = "wdp_finite_witness"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.11.0"
