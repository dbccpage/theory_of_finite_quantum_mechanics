[package]
name = "tfqm_sheaf_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_sheaf_theory"
path = "lib.rs"

[features]
default = []

[dependencies]
engine_homology = { path = "../../../../vendor/engine/engine_homology" }
tfqm_category_theory = { path = "../category_theory" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
engine_solvers = { path = "../../../../vendor/engine/engine_solvers" }
engine_functional = { path = "../../../../vendor/engine/engine_functional" }
tfqm_functional = { path = "../functional" }
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
sha2 = "0.10"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
