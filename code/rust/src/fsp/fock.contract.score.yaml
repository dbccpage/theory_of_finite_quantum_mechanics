      "raw_utf8": "# =============================================================================\n# OMEGA ENGINE / TFQM CANONICAL FILE CONTRACT (SCORING.md v2.0.0)\n# AuthorityEffect: None\n# =============================================================================\nschema_version: \"omega.contract.v2\"\ncontract_id: \"urn:tfqm:contract:rust:fsp:fock:v2.0.0\"\ntitle: \"Fock-Space CAR Algebra, Discrete Fermionic Hamiltonian & Trotter Path Sums\"\nkind: \"math_contract\"\nlayer: \"10_math_crates\"\nrole: \"MathematicalKernel\"\nstatus: \"active_with_recorded_obligations\"\nAuthorityEffect: \"None\"\nartifact:\n  path: \"code/rust/src/fsp/fock.rs\"\n  language: \"Rust\"\n  sha256: \"2ec658201bca9e2041ac56a9050c4e898d4f0697fcdb1969722c5db5c141c89d\"\ntarget: \"L4A\"\nprofile: \"Exact\"\npurpose: \"Construct exact rational Fock-space Hubbard Hamiltonians, evaluate CAR creation/annihilation/hopping with Jordan-Wigner signs, and compute Trotter partition functions $Z_F, Z_B$, average sign $\\\\langle s \\\\rangle$, and cyclic Euler paths.\"\nsubject_role: \"Bounded-domain Fock-space CAR algebra, Jordan-Wigner hop signs, discrete Hubbard Hamiltonian matrix construction over $\\\\mathbb{Q}$, Euler transfer matrices, Trotter path-sum partition functions, and cross-language JSON scaling benchmarks.\"\ndescriptor:\n  authority_effect: \"None\"\n  evidence_ceiling: \"ExactWitness\"\n  runtime_enforcement: true\n  clean_architecture_layer: \"domain\"\n  dependencies:\n    contracts: []\n    lean4_theorems:\n      - \"lean4/FermionSignCore.lean\"\n      - \"lean4/FrustratedSpectrumObstruction.lean\"\n  refusals:\n    may_emit:\n      - \"`num_sites must be positive`\"\n      - \"`edge endpoint out of range`\"\n      - \"`self-loops are not allowed in simple hopping lattice`\"\n      - \"`lattice site count must be less than 32 for 32-bit Fock masks`\"\n      - \"`particle count exceeds lattice site capacity`\"\n      - \"`physical sector must have at least one particle`\"\n      - \"`trotter_steps must be positive`\"\n      - \"`beta must be positive`\"\ndoctrine:\n  summary: \"Construct exact rational Fock-space Hubbard Hamiltonians, evaluate CAR creation/annihilation/hopping with Jordan-Wigner signs, and compute Trotter partition functions $Z_F, Z_B$, average sign $\\\\langle s \\\\rangle$, and cyclic Euler paths.\"\n  invariants:\n    - \"CAR anticommutation $\\\\{c_{i\\\\sigma}, c_{j\\\\sigma'}^\\\\dagger\\\\} = \\\\delta_{ij}\\\\delta_{\\\\sigma\\\\sigma'}$ and $\\\\{c_{i\\\\sigma}, c_{j\\\\sigma'}\\\\} = 0$ on valid site indices `< 32`.\"\n    - \"All bit-shift operations (`is_occupied`, `jordan_wigner_hop_sign`, `preceding_count`, `car_annihilate`, `car_create`, `build_basis`) use `checked_shl` / `checked_shr` and refuse `num_sites >= 32`.\"\n    - \"Average sign $\\\\langle s \\\\rangle = Z_F / Z_B \\\\in \\\\mathbb{Q}$ equals $1$ on bipartite 3-step walks and satisfies $\\\\langle s \\\\rangle < 1$ on frustrated triangular lattices.\"\n  domain_preconditions:\n    - \"`site < 32` and `num_sites < 32` (enforced via `checked_shl` and `DiscreteFermionicHamiltonian::new`).\"\n    - \"`trotter_steps > 0` and `beta > 0`.\"\n  non_roles:\n    - \"authority_source\"\n    - \"promotion_granter\"\n    - \"continuum_equivalence_proof\"\n  required_negative_capabilities:\n    - \"no_self_certification\"\n    - \"no_implicit_authority_upgrade\"\n    - \"no_floating_point_in_exact_profile\"\ndeclaration_index:\n  - {\"declaration_line\": \"pub struct FockState {\", \"kind\": \"struct\", \"line\": 15, \"name\": \"FockState\"}\n  - {\"declaration_line\": \"pub const fn new(up_mask: u32, down_mask: u32) -> Self {\", \"kind\": \"fn\", \"line\": 21, \"name\": \"new\"}\n  - {\"declaration_line\": \"pub fn count_up(&self) -> u32 {\", \"kind\": \"fn\", \"line\": 25, \"name\": \"count_up\"}\n  - {\"declaration_line\": \"pub fn count_down(&self) -> u32 {\", \"kind\": \"fn\", \"line\": 29, \"name\": \"count_down\"}\n  - {\"declaration_line\": \"pub fn