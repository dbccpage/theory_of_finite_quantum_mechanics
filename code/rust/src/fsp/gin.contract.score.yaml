O(|\\\\text{modes}|)$ set intersections, certify opposite-sign equal-weight doublet cancellations, and audit boundary isolation of unpaired Majorana zero modes $\\\\gamma_1, \\\\gamma_{2L}$ on a 1D Kitaev chain.\"\n  invariants:\n    - \"`audit_involution_cancellations` routes to `ExactRepair` iff `pairs` is non-empty and every audited pair `(id_a, id_b)` exists in `GinIndex` with `cfg_a.jw_sign == -cfg_b.jw_sign` and `cfg_a.weight == cfg_b.weight`.\"\n    - \"`audit_kitaev_chain_majorana(l)` for $L \\\\ge 2$ bonds bulk Majorana modes $(2j, 2j+1)$ for $1 \\\\le j < L$ and isolates boundary modes $\\\\{1, 2L\\\\}$.\"\n  domain_preconditions:\n    - \"`l >= 2` for `audit_kitaev_chain_majorana(l)`.\"\n    - \"`mode_counts` elements even and `>= 4` for `benchmark_gin_involution_scaling`.\"\n  non_roles:\n    - \"authority_source\"\n    - \"promotion_granter\"\n    - \"continuum_equivalence_proof\"\n  required_negative_capabilities:\n    - \"no_self_certification\"\n    - \"no_implicit_authority_upgrade\"\n    - \"no_floating_point_in_exact_profile\"\ndeclaration_index:\n  - {\"declaration_line\": \"pub struct FermionConfiguration {\", \"kind\": \"struct\", \"line\": 14, \"name\": \"FermionConfiguration\"}\n  - {\"declaration_line\": \"pub struct InvolutionCancellationReceipt {\", \"kind\": \"struct\", \"line\": 25, \"name\": \"InvolutionCancellationReceipt\"}\n  - {\"declaration_line\": \"pub struct MajoranaZeroModeReceipt {\", \"kind\": \"struct\", \"line\": 35, \"name\": \"MajoranaZeroModeReceipt\"}\n  - {\"declaration_line\": \"pub struct GinIndex {\", \"kind\": \"struct\", \"line\": 46, \"name\": \"GinIndex\"}\n  - {\"declaration_line\": \"pub fn new() -> Self {\", \"kind\": \"fn\", \"line\": 53, \"name\": \"new\"}\n  - {\"declaration_line\": \"pub fn index_configuration(\", \"kind\": \"fn\", \"line\": 58, \"name\": \"index_configuration\"}\n  - {\"declaration_line\": \"pub fn query_by_modes(\", \"kind\": \"fn\", \"line\": 86, \"name\": \"query_by_modes\"}\n  - {\"d