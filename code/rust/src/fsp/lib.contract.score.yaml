riants_hold()`.\"\n  non_roles:\n    - \"authority_source\"\n    - \"promotion_granter\"\n    - \"continuum_equivalence_proof\"\n  required_negative_capabilities:\n    - \"no_self_certification\"\n    - \"no_implicit_authority_upgrade\"\n    - \"no_floating_point_in_exact_profile\"\ndeclaration_index:\n  - {\"declaration_line\": \"pub mod bqnf;\", \"kind\": \"mod\", \"line\": 7, \"name\": \"bqnf\"}\n  - {\"declaration_line\": \"pub mod fock;\", \"kind\": \"mod\", \"line\": 8, \"name\": \"fock\"}\n  - {\"declaration_line\": \"pub mod gin;\", \"kind\": \"mod\", \"line\": 9, \"name\": \"gin\"}\n  - {\"declaration_line\": \"pub mod hubbard;\", \"kind\": \"mod\", \"line\": 10, \"name\": \"hubbard\"}\n  - {\"declaration_line\": \"pub mod normal_forms;\", \"kind\": \"mod\", \"line\": 11, \"name\": \"normal_forms\"}\n  - {\"declaration_line\": \"pub mod witness;\", \"kind\": \"mod\", \"line\": 12, \"name\": \"witness\"}\n  - {\"declaration_line\": \"pub use bqnf::{route_packet, CochainComplex, SignPacketMetrics, TerminalRoute};\", \"kind\": \"use\", \"line\": 14, \"name\": \"bqnf\"}\n  - {\"declaration_line\": \"pub use fock::{\", \"kind\": \"use\", \"line\": 15, \"name\": \"fock\"}\n  - {\"declaration_line\": \"pub use gin::{\", \"kind\": \"use\", \"line\": 21, \"name\": \"gin\"}\n  - {\"declaration_line\": \"pub use hubbard::{\", \"kind\": \"use\", \"line\": 26, \"name\": \"hubbard\"}\n  - {\"declaration_line\": \"pub use normal_forms::{\", \"kind\": \"use\", \"line\": 32, \"name\": \"normal_forms\"}\n  - {\"declaration_line\": \"pub use witness::{refuse_foreign_fixture, refuse_removed_holonomy, witness, Witness, HOPS, MASKS};\", \"kind\": \"use\", \"line\": 37, \"name\": \"witness\"}\n  - {\"declaration_line\": \"pub fn fsp_crate_invariants_hold() -> Result<(), &'static str> {\", \"kind\": \"fn\", \"line\": 40, \"name\": \"fsp_crate_invariants_hold\"}\ndeclaration_index_scope: \"Lexical public declaration line index only; excludes private helpers and test-module items.\"