tness()`, which relies on `assert!` panics.\"\n  - \"SCORING.md Section 5.5 (No Inferred System Score): Re-exporting `fock`, `hubbard`, and `normal_forms` exposes downstream callers to their `G3: E` boundary panics until those submodules are hardened.\"\nevidence:\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/baseline.json\", \"scope\": \"Scoped offline cargo test baseline receipt and log hash for tfqm_fsp.\", \"sha256\": \"78c5f43e8ee22da2033b00b54df6b9b56723b3d1762c65958fb9dceb9be460fc\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/summary.json\", \"scope\": \"Source snapshot invariance and complete six-outcome mutation accounting summary.\", \"sha256\": \"67e1f05655597b1af15d34c7d23d28d6a2c5457722639923e0bfce6eb0da2b50\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/mutations.json\", \"scope\": \"Designated semantic fault injection runs and per-mutant log hashes.\", \"sha256\": \"6c49cf946acb882301064b27663424761a232ae06bd8d7459af6b78b358ddc92\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/metric_receipt.json\", \"scope\": \"Calibrated syn 3.0.9 source AST complexity receipt and tool-source hashes.\", \"sha256\": \"75e207ea1e8dcec4cde37baff310d3d8cab8c66565f34724448d93af2585fbc9\"}\n",
