      "raw_utf8": "# =============================================================================\n# OMEGA ENGINE / TFQM CANONICAL FILE CONTRACT (SCORING.md v2.0.0)\n# AuthorityEffect: None\n# =============================================================================\nschema_version: \"omega.contract.v2\"\ncontract_id: \"urn:tfqm:contract:rust:fsp:normal_forms:v2.0.0\"\ntitle: \"Rational RREF, Cochain Quotient Normal Form & F2 Sign-Switching Normal Form\"\nkind: \"math_contract\"\nlayer: \"10_math_crates\"\nrole: \"MathematicalKernel\"\nstatus: \"active_with_recorded_obligations\"\nAuthorityEffect: \"None\"\nartifact:\n  path: \"code/rust/src/fsp/normal_forms.rs\"\n  language: \"Rust\"\n  sha256: \"a0592961757f22a04df2ebef19435d379a99f3f5dd1d567ccea4c2bd437d4cdb\"\ntarget: \"L4A\"\nprofile: \"Exact\"\npurpose: \"Compute exact rational RREF with row-operation witness $T A = R$, project 1-cochains $c^1$ to canonical representatives modulo $\\\\mathrm{im}(d_0)$, and normalize $\\\\mathbb{F}_2$ edge signs via spanning-forest vertex gauges while extracting frustrated fundamental cycles.\"\nsubject_role: \"Bounded-domain exact rational Reduced Row Echelon Form (RREF) with transformation witness matrix $T$, cochain quotient normal form modulo $\\\\mathrm{im}(d_0)$, and $\\\\mathbb{F}_2$ spanning-forest sign-switching normal form with fundamental cycle obstruction extraction.\"\ndescriptor:\n  authority_effect: \"None\"\n  evidence_ceiling: \"ExactWitness\"\n  runtime_enforcement: true\n  clean_architecture_layer: \"domain\"\n  dependencies:\n    contracts: []\n    lean4_theorems:\n      - \"lean4/NormalFormLaws.lean\"\n  refusals:\n    may_emit:\n      - \"`matrix row length shorter than num_cols`\"\n      - \"`d0 must have nonzero row count`\"\n      - \"`d0 must be rectangular with positive column count`\"\n      - \"`c1 length must match dim_c1`\"\n      - \"`edge count and parity count mismatch`\"\n      - \"`edge parity must be in {0, 1}`\"\n      - \"`edge endpoint out of range`\"\n      - \"`grid_sizes must not be empty`\"\n      - \"`grid dimensions must be at least 2x2`\"\ndoctrine:\n  summary: \"Compute exact rational RREF with row-operation witness $T A = R$, project 1-cochains $c^1$ to canonical representatives modulo $\\\\mathrm{im}(d_0)$, and normalize $\\\\mathbb{F}_2$ edge signs via spanning-forest vertex gauges while extracting frustrated fundamental cycles.\"\n  invariants:\n    - \"`rref_with_witness` validates `row.len() >= num_cols` and produces reduced row echelon matrix `rref` and row witness `transform` such that `transform * matrix == rref` on rectangular inputs.\"\n    - \"`normalize_cochain` validates rectangular `d0` dimensions and zeroes all pivot coordinates of `c1` modulo $\\\\mathrm{im}(d_0)$.\"\n    - \"`normalize_sign_cochain` zeroes all spanning-forest edge parities via BFS vertex switching and emits one fundamental cycle per frustrated chord.\"\n  domain_preconditions:\n    - \"Every row in `matrix` passed to `rref_with_witness(matrix, num_cols)` has length `>= num_cols` (enforced at entry).\"\n    - \"Every row in `d0` passed to `normalize_cochain(d0, c1)` has identical non-zero length `dim_c0` (enforced at entry).\"\n    - \"`edges.len() == parities.len()`, `parities[i] in {0, 1}`, and endpoints `< vertex_count` in `normalize_sign_cochain`.\"\n  non_roles:\n    - \"authority_source\"\n    - \"promotion_granter\"\n    - \"continuum_equivalence_proof\"\n  required_negative_capabilities:\n    - \"no_self_certification\"\n    - \"no_implicit_authority_upgrade\"\n    - \"no_floating_point_in_exact_profile\"\ndeclaration_index:\n  - {\"declaration_line\": \"pub struct RrefResult {\", \"kind\": \"struct\", \"line\": 14, \"name\": \"RrefResult\"}\n  - {\"declaration_line\": \"pub fn rref_with_witness(\", \"kind\": \"fn\", \"line\": 65, \"name\": \"rref_with_witness\"}\n  - {\"declaration_line\": \"pub struct QuotientNormalForm {\", \"kind\": \"struct\", \"line\": 119, \"name\": \"QuotientNormalForm\"}\n  - {\"declaration_line\": \"pub fn normalize_cochain(\", \"kind\": \"fn\", \"line\": 142, \"name\": \"normalize_cochain\"}\n  - {\"declaration_line\": \"pub struct SignSwitchingNormalForm {\", \"kind\": \"struct\", \"line\": 192, \"name\": \"SignSwitchingNormalForm\"}\n  - {\"declaration_line\": \"pub fn normalize_sign_cochain(\", \"kind\": \"fn\", \"line\": 279, \"name\": \"normalize_sign_cochain\"}\n  - {\"declaration_line\": \"pub struct SignSwitchingGridRow {\", \"kind\": \"struct\", \"line\": 318, \"name\": \"SignSwitchingGridRow\"}\n  - {\"declaration_line\": \"pub fn benchmark_sign_switching_grid_scaling(\", \"kind\": \"fn\", \"line\": 330, \"name\": \"benchmark_sign_switching_grid_scaling\"}\ndeclaration_index_scope: \"Lexical public declaration line index only; excludes private helpers and test-module items.\"\nspecification:\n  algebraic_structure:\n    carrier_type: \"RrefResult / QuotientNormalForm / SignSwitchingNormalForm\"\n    operations:\n      - \"rref_with_witness\"\n      - \"normalize_cochain\"\n      - \"normalize_sign_cochain\"\n      - \"benchmark_sign_switching_grid_scaling\"\n  verification:\n    rust_test_command: \"cargo test --manifest-path code/rust/src/fsp/Cargo.toml\"\n    python_parity_test: \"code/python/tests/test_fsp_Hubbard_Majorana_Parity.py\"\n    lean4_targets:\n      - \"lean4/NormalFormLaws.lean\"\nrequirements:\n  - {\"id\": \"G1\", \"requirement\": \"Bind exact artifact SHA-256, public symbols, Lean 4 theorem correspondence, and AuthorityEffect: None.\"}\n  - {\"id\": \"G2\", \"requirement\": \"Preserve exact rational (`BigRational`) and F2 arithmetic; validate all public entry preconditions and struct construction/deserialization invariants (`RULE_RS_001`, `RULE_RS_003`).\"}\n  - {\"id\": \"G3\", \"requirement\": \"Eliminate reachable panics (`.unwrap()`, `assert!`, unchecked bit shifts, unchecked slice indexing, and zero divisors) in favor of typed `Result` refusals (`RULE_RS_001`, `RULE_RS_002`).\"}\n  - {\"id\": \"G4\", \"requirement\": \"Maintain unit, cross-language JSON fixture, and negative boundary tests with honest six-outcome mutation accounting (`R >= 0.95` required for Grade A).\"}\n  - {\"id\": \"G5\", \"requirement\": \"Maintain CCN <= 10, cognitive complexity <= 15, and control nesting <= 3 for Grade A (`SCORING.md` Section 3.5).\"}\nadmission_policy: \"Structs with `pub` fields or `serde::Deserialize` are untrusted carrier data until validated by a checked constructor; callers must not bypass constructor checks.\"\nresource_boundary: \"Exact `BigRational` and Fock-space basis enumeration scale combinatorially with site count; callers must bound lattice size (`num_sites < 32` for `FockState`).\"\nauthority_ceiling: \"Runtime finite algebraic checks only. AuthorityEffect: None.\"\nopen_obligations:\n  - \"Gate 3 -> C: Errors are returned as untyped `&'static str` rather than a structured error enum.\"\nevidence:\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/baseline.json\", \"scope\": \"Scoped offline cargo test baseline receipt and log hash for tfqm_fsp.\", \"sha256\": \"78c5f43e8ee22da2033b00b54df6b9b56723b3d1762c65958fb9dceb9be460fc\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/summary.json\", \"scope\": \"Source snapshot invariance and complete six-outcome mutation accounting summary.\", \"sha256\": \"67e1f05655597b1af15d34c7d23d28d6a2c5457722639923e0bfce6eb0da2b50\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/mutations.json\", \"scope\": \"Designated semantic fault injection runs and per-mutant log hashes.\", \"sha256\": \"6c49cf946acb882301064b27663424761a232ae06bd8d7459af6b78b358ddc92\"}\n  - {\"path\": \"evidence/quality/fsp/20261020T190710Z/metric_receipt.json\", \"scope\": \"Calibrated syn 3.0.9 source AST complexity receipt and tool-source hashes.\", \"sha256\": \"75e207ea1e8dcec4cde37baff310d3d8cab8c66565f34724448d93af2585fbc9\"}\n",
