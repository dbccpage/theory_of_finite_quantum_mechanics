nd VR=I_r identities imply exactly rank(M)=r over Q; rank zero checks the only nonvacuous identity M=0. Stored private evidence cannot be forged through serialization or mutable access. The producer uses exact rational factorization and is accepted only by this checker.\"\n      },\n      \"G3\": {\n        \"grade\": \"B\",\n        \"basis\": \"Private canonical-Q row storage, checked arithmetic, immutable input/candidate borrows, fallible vector reservations and preflight work refusal preserve the declared invariants under typed failures. The source argument covers nonzero divisors, disjoint row slices, index bounds and empty metadata. Producer no longer calls generic provider elimination. Full hashing, BigInt, matrix-storage and allocator runtime trust/failure review remains open; no global memory or machine-checked crash-freedom guarantee is asserted.\"\n      },\n      \"G4\": {\n        \"grade\": \"A\",\n        \"basis\": \"Conditional on current R>=0.95 and successful untouched/restored baselines for 24 separately designated rank faults. Independent integer-minor oracles cover 729 two-by-three matrices and their transposes; 81 inverse cases use integer adjugate/determinant expectations. Forged split maps, all shape and raw-rational roles, exact binding diagnostics, inclusive aggregate budgets/overflow/atomic counters and extreme zero-area metadata are challenged. A dedicated integration binary observes public-boundary allocation order with positive controls, and a compile-fail doctest checks certificate privacy. All six mutant outcomes remain disclosed; the conditional judgement is withheld if this source snapshot lacks the required execution.\"\n      },\n      \"G5\": {\n        \"grade\": \"B\",\n        \"basis\": \"The former CCN-11 identity function is split into zero/positive phases without changing replay order. Borrowed row kernels and move-based factor/output extraction remove redundant producer operand copies; the checker no longer clones candidates. G5 remains B pending full transitive hash/validation and representation cost review, including normalization performed by the shared rational hasher on already admitted values. Element/phase-work limits exclude rational bit growth and process memory/time.\"\n      }\n    }\n  }\n}\n",
