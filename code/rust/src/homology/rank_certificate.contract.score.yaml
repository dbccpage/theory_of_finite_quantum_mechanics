rse\",\n        \"inverse\",\n        \"empty_candidate\",\n        \"certify_rank\"\n      ],\n      \"resource lifecycle\": [\n        \"RankLimits\",\n        \"RankBudget::new\",\n        \"RankBudget::cells\",\n        \"RankBudget::requested\",\n        \"RankBudget::charge\",\n        \"product_work\",\n        \"preflight_split_work\",\n        \"admit_rank_product\",\n        \"rational_buffer\",\n        \"reduction_work\"\n      ],\n      \"closed Q elimination\": [\n        \"RationalRows::copy\",\n        \"RationalRows::augmented_identity\",\n        \"RationalRows::at\",\n        \"RationalRows::swap_rows\",\n        \"RationalRows::normalize\",\n        \"RationalRows::clear_row\",\n        \"RationalRows::reduce_column\",\n        \"RationalRows::reduce\",\n        \"RationalRows::into_prefix_matrix\",\n        \"RationalRows::into_right_block\",\n        \"distinct_rational_rows\",\n        \"rational_rref\",\n        \"rational_inverse\",\n        \"inverse_with_budget\"\n      ],\n      \"configurable public boundaries\": [\n        \"certify_rank_with_limits\",\n        \"RankCertificate::try_admit_with_limits\",\n        \"RankCertificate::verify_against_with_limits\",\n        \"RankCertificate::admit_with_budget\",\n        \"check_candidate\"\n      ]\n    },\n    \"engineering_assessment\": {\n      \"source_sha256\": \"ad7de074a639be1cbcf817fe609e2205ae7d3eac3e48cd8361549bd5d0514694\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"A\",\n          \"basis\": \"Source SHA and complete public requirement/symbol map are in this specification, bound into the generated contract and execution receipt. Concrete Q domain, exact split-rank argument, producer dependencies, carrier consumers and AuthorityEffect None are explicit. No assumption that a producer output is correct replaces identity replay.\"\n        },\n        \"G2\": {\n          \"grade\": \"A\",\n          \"basis\": \"Both public admitting operations validate canonical positive-denominator reduced Q before arithmetic. Rank/shape constraints precede products. The admitted M=UV, LU=I_r and VR=I_r identities imply exactly rank(M)=r over Q; rank zero checks the only nonvacuous identity M=0. Stored private evidence cannot be forged through serialization or mutable access. The producer uses exact rational factorization and is accepted only by this checker.\"\n        },\n        \"G3\": {\n          \"grade\": \"A\",\n          \"basis\": \"The source invariant argument covers public canonical admission, every index/divisor/count, disjoint mutable rows, finite workspace reservation and error propagation. The immutable canonical matrix token is carried to digest/identity replay; private certificate storage excludes unchecked decoding or mutation. BasicMatrix private shape/storage and typed get_ref/try_from_fn/from_row_major paths are inspected and source-pinned. Exact rational closure, num-bigint/num-integer, BLAKE3, Rust/std/compiler and allocator behavior are explicit runtime trust assumptions. Owned vector capacity is reserved fallibly; scalar-internal allocations remain standard dependency behavior. Failures publish no partial certificate. This is not a machine-checked crash-freedom or process-OOM guarantee.\"\n        },\n        \"G4\": {\n          \"grade\": \"A\",\n          \"basis\": \"Conditional on current R>=0.95 and successful untouched/restored baselines for 24 separately designated rank faults. Independent integer-minor oracles cover 729 two-by-three matrices and their transposes; 81 inverse cases use integer adjugate/determinant expectations. Forged split maps, all shape and raw-rational roles, exact binding diagnostics, inclusive aggregate budgets/overflow/atomic counters and extreme zero-area metadata are challenged. A dedicated integration binary observes public-boundary allocation order with positive controls, and a compile-fail doctest checks certificate privacy. All six mutant outcomes remain disclosed; the conditional judgement is withheld if this source snapshot lacks the required execution.\"\n        },\n        \"G5\": {\n          \"grade\": \"A\",\n          \"basis\": \"All production functions must meet calibrated A metric ceilings without opaque source macros. Borrowed arithmetic kernels and moved factor/output extraction perform no redundant inner-loop matrix/operand copies. Canonical source admission is carried through hashing without repeated rational reduction or full-value clones. Candidate validation is necessary to independent identity replay. Workspace copies create the required mutable elimination state; output factor entries and signed integer byte buffers create necessary owned results/serialization. Rational bit growth, canonicality GCD and byte hashing costs are explicit, outside the matrix-cell/scalar-operation counters; no constant bit-cost or process memory/time bound is claimed.\"\n        }\n      }\n    },\n    \"origin_review\": \"Integrated byte-for-byte from the staged candidate after successful staged checks. Original source, prior specifications and all 266 previous assessment sidecars are sealed in evidence/quality/l4a_six/20261020T064227Z-rank-activation. Fresh source/dependency/metric/mutation receipts bind this current epoch.\"\n  }\n}\n",
