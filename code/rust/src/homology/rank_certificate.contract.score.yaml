h\": \"evidence/quality/l4a_six/20261020T074554Z/metrics.json\",\n      \"sha256\": \"a297bf450b9c7f0504e2fc3f3dc6589663d94a5e73dc2d5d6c03079645b97030\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074603Z-mutations/receipt.json\",\n      \"sha256\": \"b8e3ee1012907d0af4afb185e289b04285bb317fc18886bbe9abf44da861fd08\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074603Z-mutations/mutations.json\",\n      \"sha256\": \"00fa693c6f05422ed8b6be92780f5970691494e31b82ecaa20985a6a1e370860\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"status\": \"canonical_borrowed_Q_rank_individual_gate_review\",\n    \"purpose\": \"Admit finite rank certificates through canonical coefficients, dimensions, exact split identities and a fallible matrix binding.\",\n    \"symbol_contracts\": {\n      \"RankCertificate::try_admit/check_split_identities\": {\n        \"postcondition\": \"Admit coefficients, rank and shapes before checking M=UV, LU=I and VR=I in that order. Hash the matrix only after those identities pass. Factoring the identity phase preserves every refusal and keeps typed hash propagation.\",\n        \"scope\": \"The private certificate remains an exact finite rank witness; the producer's elimination result is not trusted without replaying the identities.\",\n        \"zero_rank\": \"After coefficient and complete shape admission, rank zero requires every input entry zero. U,V,L,R then have empty storage and LU=VR=I_0 is vacuous. Zero-area usize::MAX metadata is not enumerated.\"\n      },\n      \"certify_rank\": {\n        \"postcondition\": \"Canonical input only; produce a rank factorization and split maps, then replay the public checker before emitting a certificate. For zero matrices construct the four zero-area maps directly.\",\n        \"proof_argument\": \"M=UV bounds rank(M)<=r; LU=I gives rank(U)>=r, and VR=I gives rank(V)>=r. Together rank(UV)=r. Rational Gram matrices U^T U are invertible for independent columns because sums of rational squares vanish only when each term is zero.\",\n        \"cost\": \"Private rational_rref/rational_inverse use admitted, fallibly reserved flat buffers. Input and transpose copies are made once where ownership requires them; coordinates and inverse outputs move coefficients out of working storage. Pivot divisors and elimination factors move out of the row rather than cloning operands in its arithmetic loop. Conservative phase field-operation counts are charged without refunds; scalar bit sizes, validation, hashing, comparison, allocator internals and elapsed time are outside this count.\"\n      },\n      \"RankLimits/RankBudget\": {\n        \"admission\": \"Default limits are 4096 cells per matrix and 1000000 conservative scalar operations per producer/checker call. Explicit overrides are inclusive. Cell products, operation products and aggregate charges use checked usize arithmetic. Failed charges leave spent unchanged.\",\n        \"order\": \"Producer admits input cells before canonical validation. Checker candidate admission validates canonical coefficients and shapes, then cells for input and all four maps. Positive-rank identity replay checks the sum of all three product work bounds before allocating I_r; individual products debit that same sum. verify_against checks input cells and binding before replay, without cloning the candidate.\",\n        \"zero\": \"Canonical zero matrices require no field work; rank-zero maps have zero-area buffers, including usize::MAX by zero metadata. Nonzero storage remains subject to the cell limit.\",\n        \"limits\": \"Counts are phase bounds, not an exact event counter, byte limit, BigInt bound, deadline or aggregate memory bound.\"\n      },\n      \"RationalRows/rational_rref/rational_inverse\": {\n        \"invariants\": \"rows*cols equals flat storage length; width<=cols; selected pivots are nonzero. Earlier pivot columns are zero in every later pivot row. Normalization moves the pivot to an owned divisor and writes one; clear_row uses disjoint slices, moves its factor and writes zero. Remaining entries use borrowed exact Q arithmetic. All private ranges follow admitted shape and row bounds.\",\n        \"factorization\": \"Pivot columns of the original M form U. The first rank rows of reduced M form V; truncating and moving the row buffer preserves M=UV. A full-column-rank Q matrix has positive-definite Gram matrix, giving L=(U^T U)^-1 U^T and the analogous section of V. Public identity replay is required before evidence construction.\",\n        \"inverse\": \"Square check, checked 2n, per-matrix n*2n admission and conservative work charge precede augmented-buffer allocation. Reduction scans only the left n columns. Missing pivots return typed Singular. On success left block I proves the moved right block is the inverse.\",\n        \"cost\": \"Reduction bound min(rows,width)*cols*(2*rows+1) counts at most cols divisions and rows*cols multiply/subtract pairs per pivot. Product bound is 2*rows*cols*inner. Both deliberately omit comparisons and coefficient representation costs.\"\n      },\n      \"AdmittedMatrix integration\": \"All public matrix entries first acquire a canonical immutable borrow token. The producer keeps that token through independent candidate replay; the checker hashes canonical numerators/denominators directly through its lifetime-bound token. Canonical input admission is performed once, without a second reduction or full-rational clone for hashing. Candidate coefficients are separately admitted before exact identity checks. The digest frame is shared with hashing::MATRIX_Q_DOMAIN.\"\n    },\n    \"capability_assessment\": {\n      \"source_sha256\": \"ad7de074a639be1cbcf817fe609e2205ae7d3eac3e48cd8361549bd5d0514694\",\n      \"level\": \"L4\",\n      \"basis\": \"Individual source review: immutable admitted rank certificates with typed canonical-domain, dimension, identity and matrix-binding refusals; an independently replayed M=UV/LU=I/VR=I boundary; exact-Q producer with explicit dependency trust; constant-time zero-area metadata paths; borrowed checker products and independently forged-candidate challenges. This capability judgment does not certify all five engineering gates.\"\n    },\n    \"consumer_review\": [\n      \"homology/carrier.rs stores two admitted certificates for boundary matrices; failure propagates from certify_rank before constructing the carrier.\",\n      \"homology/l5a_challenges.rs compares ranks of all 81 two-by-two {-1,0,1} matrices against integer determinant/zero-entry cases and forges identities/binding separately.\",\n      \"The canonical adapter uses pinned BasicMatrix shape/storage and get_ref/checked construction methods, num-rational BigRational arithmetic, num-bigint/num-integer canonical representation and BLAKE3 byte serialization. The provider shape invariant and typed access/reservation paths are inspected; no provider row-reduction, generic field callback or matrix multiplication is used.\",\n      \"Staged 20261020T062113Z and 20261020T062911Z-rank-trial evidence is separate from current integrated baselines and mutation receipts. None is inferred from another source epoch.\"\n    ],\n    \"open_obligations\": [],\n    \"requirement_symbol_map\": {\n      \"canonical domain\": [\n        \"RankCertificate::try_admit\",\n        \"check_coefficients\",\n        \"certify_rank\",\n        \"AdmittedMatrix::try_new\",\n        \"AdmittedMatrix::matrix\",\n        \"RankCertificate::admit_input\"\n      ],\n      \"shape and impossible-rank admission\": [\n        \"check_shapes\",\n        \"shape\"\n      ],\n      \"exact split rank argument\": [\n        \"check_split_identities\",\n        \"require_equal\",\n        \"identity\",\n        \"multiply\",\n        \"check_positive_split_identities\"\n      ],\n      \"immutable evidence and binding\": [\n        \"RankCandidate\",\n        \"RankCertificate\",\n        \"rank\",\n        \"matrix_hash\",\n        \"candidate\",\n        \"verify_against\",\n        \"AdmittedMatrix::digest\"\n      ],\n      \"producer and empty lifecycle\": [\n        \"factorization\",\n        \"left_inverse\",\n        \"inverse\",\n        \"empty_candidate\",\n        \"certify_rank\"\n      ],\n      \"resource lifecycle\": [\n        \"RankLimits\",\n        \"RankBudget::new\",\n        \"RankBudget::cells\",\n        \"RankBudget::requested\",\n        \"RankBudget::charge\",\n        \"product_work\",\n        \"preflight_split_work\",\n        \"admit_rank_product\",\n        \"rational_buffer\",\n        \"reduction_work\"\n      ],\n      \"closed Q elimination\": [\n        \"RationalRows::copy\",\n        \"RationalRows::augmented_identity\",\n        \"RationalRows::at\",\n        \"RationalRows::swap_rows\",\n        \"RationalRows::normalize\",\n        \"RationalRows::clear_row\",\n        \"RationalRows::reduce_column\",\n        \"RationalRows::reduce\",\n        \"RationalRows::into_prefix_matrix\",\n        \"RationalRows::into_right_block\",\n        \"distinct_rational_rows\",\n        \"rational_rref\",\n        \"rational_inverse\",\n        \"inverse_with_budget\"\n      ],\n      \"configurable public boundaries\": [\n        \"certify_rank_with_limits\",\n        \"RankCertificate::try_admit_with_limits\",\n        \"RankCertificate::verify_against_with_limits\",\n        \"RankCertificate::admit_with_budget\",\n        \"check_candidate\"\n      ]\n    },\n    \"engineering_assessment\": {\n      \"source_sha256\": \"ad7de074a639be1cbcf817fe609e2205ae7d3eac3e48cd8361549bd5d0514694\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"A\",\n          \"basis\": \"Source SHA and complete public requirement/symbol map are in this specification, bound into the generated contract and execution receipt. Concrete Q domain, exact split-rank argument, producer dependencies, carrier consumers and AuthorityEffect None are explicit. No assumption that a producer output is correct replaces identity replay.\"\n        },\n        \"G2\": {\n          \"grade\": \"A\",\n          \"basis\": \"Both public admitting operations validate canonical positive-denominator reduced Q before arithmetic. Rank/shape constraints precede products. The admitted M=UV, LU=I_r and VR=I_r identities imply exactly rank(M)=r over Q; rank zero checks the only nonvacuous identity M=0. Stored private evidence cannot be forged through serialization or mutable access. The producer uses exact rational factorization and is accepted only by this checker.\"\n        },\n        \"G3\": {\n          \"grade\": \"A\",\n          \"basis\": \"The source invariant argument covers public canonical admission, every index/divisor/count, disjoint mutable rows, finite workspace reservation and error propagation. The immutable canonical matrix token is carried to digest/identity replay; private certificate storage excludes unchecked decoding or mutation. BasicMatrix private shape/storage and typed get_ref/try_from_fn/from_row_major paths are inspected and source-pinned. Exact rational closure, num-bigint/num-integer, BLAKE3, Rust/std/compiler and allocator behavior are explicit runtime trust assumptions. Owned vector capacity is reserved fallibly; scalar-internal allocations remain standard dependency behavior. Failures publish no partial certificate. This is not a machine-checked crash-freedom or process-OOM guarantee.\"\n        },\n        \"G4\": {\n          \"grade\": \"A\",\n          \"basis\": \"Conditional on current R>=0.95 and successful untouched/restored baselines for 24 separately designated rank faults. Independent integer-minor oracles cover 729 two-by-three matrices and their transposes; 81 inverse cases use integer adjugate/determinant expectations. Forged split maps, all shape and raw-rational roles, exact binding diagnostics, inclusive aggregate budgets/overflow/atomic counters and extreme zero-area metadata are challenged. A dedicated integration binary observes public-boundary allocation order with positive controls, and a compile-fail doctest checks certificate privacy. All six mutant outcomes remain disclosed; the conditional judgement is withheld if this source snapshot lacks the required execution.\"\n        },\n        \"G5\": {\n          \"grade\": \"A\",\n          \"basis\": \"All production functions must meet calibrated A metric ceilings without opaque source macros. Borrowed arithmetic kernels and moved factor/output extraction perform no redundant inner-loop matrix/operand copies. Canonical source admission is carried through hashing without repeated rational reduction or full-value clones. Candidate validation is necessary to independent identity replay. Workspace copies create the required mutable elimination state; output factor entries and signed integer byte buffers create necessary owned results/serialization. Rational bit growth, canonicality GCD and byte hashing costs are explicit, outside the matrix-cell/scalar-operation counters; no constant bit-cost or process memory/time bound is claimed.\"\n        }\n      }\n    },\n    \"origin_review\": \"Integrated byte-for-byte from the staged candidate after successful staged checks. Original source, prior specifications and all 266 previous assessment sidecars are sealed in evidence/quality/l4a_six/20261020T064227Z-rank-activation. Fresh source/dependency/metric/mutation receipts bind this current epoch.\"\n  }\n}\n",
