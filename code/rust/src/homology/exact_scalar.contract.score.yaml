      "consumer_review": [
        "The homology module keeps this adapter private. Existing chain/cochain/carrier admission uses the Result<()> wrappers; bounded zero-product verification replaces provider multiplication without publishing a product. Default input/output/work limits are now explicit and can refuse formerly larger workloads.",
        "Rank producer/checker carry the admitted token to exact matrix binding, eliminating duplicate canonical normalization. Its public APIs remain separately challenged.",
        "Dependencies are pinned BasicMatrix storage/access, canonical BigRational and BigInt/GCD arithmetic, BLAKE3 and signed integer byte serialization, under the pinned Rust/std/allocator runtime. No generic field extension or arbitrary callback is admitted."
      ],
      "independent_challenge": "891 small rectangular {-1,0,1} matrix pairs against direct i64 dot sums; rational cancellation; every undefined/noncanonical coefficient class and first failing index; both raw-input roles even with a zero other side; literal signed digest frames plus public hash compatibility; exact inclusive cell/work limits; dimension/count/work overflow; maximal zero-area/zero-inner metadata and shape-specific refusal. Seventeen distinct domain, shape, budget, index, zero-law, token and digest faults are designated.",
      "open_obligations": [
        "Historical capability review is stale after integration."
