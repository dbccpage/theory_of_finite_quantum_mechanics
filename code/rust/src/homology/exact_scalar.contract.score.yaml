0, cognitive upper bound <= 15 and nesting <= 3; audit allocations and operational bounds separately.\"\n    }\n  ],\n  \"admission_policy\": \"Records with public fields or Deserialize are untrusted candidates until the specific validator admits them; a validator's name is not proof of completeness.\",\n  \"resource_boundary\": \"No process-OOM, bit-complexity, timeout or global memory guarantee is inferred from element/work counters.\",\n  \"authority_ceiling\": \"Runtime finite checks only. No formal theorem, physical derivation or authority promotion is certified.\",\n  \"open_obligations\": [\n    \"Fresh baseline execution alone does not establish independent challenge or mutation adequacy.\",\n    \"Individual G4 judgement withheld: execution or mutation prerequisite unmet.\"\n  ],\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/receipt.json\",\n      \"sha256\": \"02ef86c6eaaa341749b93cd0cff2463b8c7a462b0c14080b483b5c13cb518935\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/source_manifest.json\",\n      \"sha256\": \"b426c649d3ed095a576113062ea18b876fbd794e6eca1921ae2a296512eb5f63\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/records.py\",\n      \"sha256\": \"67b30ce4848112715d67386e9af9e83322a3643e50585f754ceb4e5c439b7819\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/specs.json\",\n      \"sha256\": \"6e319e84dc25e76ffda0c3f8009c75cd36f36aacb18a24fad7a44c3899e67c84\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145120Z-qm-consumer/receipt.json\",\n      \"sha256\": \"cd9e3c64f660364f3396d6aaacf778fcaa99605673c89dbf21bb1a96b02ac71f\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/metrics.json\",\n      \"sha256\": \"c0f6c92c146ff0cf7d91b3a78bf74c7d26b455cd9b0547dd1d36ccc6260b19ec\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"capability_assessment\": {\n      \"basis\": \"A concrete internal admission boundary serves rank, chain and cochain consumers: lifetime-bound canonical matrix views, exact framed digests, typed shape/domain/resource failures, configurable cell/work admission before scalar work, zero-area/zero-inner shortcuts and independent finite product/custody challenges. This is an executable bounded service, not a re-export or nominal marker.\",\n      \"level\": \"L4\",\n      \"source_sha256\": \"bf744580ce249ab32faa25589fd8ef53302ddda56dc826060cfb84de1c11fd85\"\n    },\n    \"consumer_review\": [\n      \"The homology module keeps this adapter private. Existing chain/cochain/carrier admission uses the Result<()> wrappers; bounded zero-product verification replaces provider multiplication without publishing a product. Default input/output/work limits are now explicit and can refuse formerly larger workloads.\",\n      \"Rank producer/checker carry the admitted token to exact matrix binding, eliminating duplicate canonical normalization. Its public APIs remain separately challenged.\",\n      \"Dependencies are pinned BasicMatrix storage/access, canonical BigRational and BigInt/GCD arithmetic, BLAKE3 and signed integer byte serialization, under the pinned Rust/std/allocator runtime. No generic field extension or arbitrary callback is admitted.\"\n    ],\n    \"engineering_assessment\": {\n      \"gates\": {\n        \"G1\": {\n          \"basis\": \"Source SHA, concrete private consumer and requirement/symbol maps, invariant arguments and pinned execution/dependency receipts mirror this complete finite Exact contract. Original helper bytes are sealed on activation. No whole-workspace or hash-injectivity claim is made.\",\n          \"grade\": \"A\"\n        },\n        \"G2\": {\n          \"basis\": \"The runtime canonical gate and lifetime-bound token enforce the Q domain, direct canonical digest frame and exact borrowed dot-product identity. Shape/count/work arithmetic is checked; zero dimensions and raw coefficients are admitted/refused according to the explicit contract. No overflowing native coefficient domain is admitted.\",\n          \"grade\": \"A\"\n        },\n        \"G3\": {\n          \"basis\": \"Private immutable token storage excludes unchecked mutation/decoding; typed access and checked admission preserve invariants on every error. No output matrix or provider generic multiplication is allocated/invoked. Scalar/GCD/byte serialization use the explicitly pinned Rust/num/BLAKE3/provider-storage trust boundary; no process-OOM, allocator-wide guarantee or machine-checked crash freedom is inferred.\",\n          \"grade\": \"A\"\n        },\n        \"G4\": {\n          \"basis\": \"Conditional on current R>=0.95 for all 17 designated helper faults and successful untouched/restored package baselines. Independent integer and rational product expectations, literal signed frames, both invalid-input roles, specific typed failures and machine/inclusive budget cases challenge the declared failure classes. The staged trial is separate and does not replace current integration evidence.\",\n          \"grade\": \"A\"\n        },\n        \"G5\": {\n          \"basis\": \"Functions must meet measured A ceilings without opaque source macros. Canonical admission costs coefficient GCD scans; digest costs the required signed byte encodings and hashing without rational renormalization. A nonvacuous zero product takes O(rows*cols*inner) rational arithmetic and at most one scalar accumulator/output product at a time, with no full matrix buffer or redundant operand copies. Zero-area/zero-inner shortcuts are constant apart from prior admission. Per-input/declared-output cells and scalar-operation limits do not bound rational bit growth, GCD/byte work, parsing or process resources.\",\n          \"grade\": \"A\"\n        }\n      },\n      \"source_sha256\": \"bf744580ce249ab32faa25589fd8ef53302ddda56dc826060cfb84de1c11fd85\"\n    },\n    \"independent_challenge\": \"891 small rectangular {-1,0,1} matrix pairs against direct i64 dot sums; rational cancellation; every undefined/noncanonical coefficient class and first failing index; both raw-input roles even with a zero other side; literal signed digest frames plus public hash compatibility; exact inclusive cell/work limits; dimension/count/work overflow; maximal zero-area/zero-inner metadata and shape-specific refusal. Seventeen distinct domain, shape, budget, index, zero-law, token and digest faults are designated.\",\n    \"open_obligations\": [],\n    \"origin_review\": \"Integrated byte-for-byte from the staged candidate after successful staged checks. Original source, prior specifications and all 266 previous assessment sidecars are sealed in evidence/quality/l4a_six/20261020T064227Z-rank-activation. Fresh source/dependency/metric/mutation receipts bind this current epoch.\",\n    \"profile\": \"Exact\",\n    \"proof_arguments\": [\n      \"Positive reduced denominators are precisely the canonical Q representation, including zero as 0/1. Safe immutable borrowing prevents mutation for the token lifetime. Private fields supply no unchecked construction/decoding route.\",\n      \"BasicMatrix storage admission ensures rows*cols equals its slice length. Compatible product dimensions and typed get_ref calls justify all borrowed dot accesses. Canonical rational multiplication and addition preserve the nonzero-denominator field; a dot product is zero iff its mathematical Q entry is zero. Exhausting entries establishes the zero-product identity; a nonzero entry establishes the supplied violation.\",\n      \"Every resource calculation is checked. Each dot product costs at most two scalar operations per inner entry; the entire declared bound is admitted before arithmetic with no early-exit refunds. Zero row/column/inner cases perform no dense traversal. No new matrix/vector is allocated. Scalar accumulators, GCD and signed byte buffers have ordinary pinned dependency allocation/bit-complexity costs.\",\n      \"Digest serialization uses the same dimension/domain/component order as public hash_matrix, but canonical admission makes normalization unnecessary. Literal signed frames independently bind this correspondence. Hash equality is diagnostic commitment, not equality by injectivity.\"\n    ],\n    \"purpose\": \"Carry immutable canonical-rational matrix admission into digest generation and verify bounded zero products through borrowed exact dot products without materializing an output matrix.\",\n    \"requirement_symbol_map\": {\n      \"bounded independent composition check\": [\n        \"ZeroProductLimits\",\n        \"cells\",\n        \"product_work\",\n        \"product_admission\",\n        \"admit_zero_product\",\n        \"admit_zero_product_with_limits\",\n        \"AdmittedMatrix::zero_product\",\n        \"dot_product\"\n      ],\n      \"canonical immutable carrier\": [\n        \"AdmittedMatrix\",\n        \"AdmittedMatrix::try_new\",\n        \"AdmittedMatrix::matrix\",\n        \"admit_coefficients\",\n        \"admit_matrix\",\n        \"admit_shaped_matrix\"\n      ],\n      \"exact byte commitment\": [\n        \"AdmittedMatrix::digest\",\n        \"hashing::MATRIX_Q_DOMAIN\",\n        \"scalars::hash_bigint\"\n      ]\n    },\n    \"scope_limits\": [\n      \"Internal canonical-Q service only. Default zero-product limits may refuse larger pre-existing workloads; callers that need a larger finite bound must choose an explicit admitted profile. No arbitrary scalar provider or general process resource guarantee is claimed.\"\n    ],\n    \"status\": \"canonical_rational_admission_individual_gate_review\",\n    \"symbol_contracts\": {\n      \"AdmittedMatrix::digest\": \"BLAKE3 frame is MATRIX_Q_DOMAIN, little-endian u64 rows/cols, then signed little-endian numerator and denominator bytes with u64 length prefixes. Hash only canonical components directly, with no rational clone/reduction. This matches hash_matrix on admitted input; the shared domain tag prevents tag drift. Supported-pointer compile assertion in scalars.rs guarantees each usize metadata/byte length fits u64. Cryptographic commitment is not an injectivity theorem.\",\n      \"AdmittedMatrix::try_new/matrix\": \"Validate all coefficients as positive-denominator reduced BigRational, rejecting the first invalid flat index. Retain a shared immutable BasicMatrix<Q> borrow. BasicMatrix private shape/storage and constructors are explicit source-pinned dependencies. Private token fields prevent sibling code from bypassing admission in safe Rust. matrix() returns only the original shared borrow.\",\n      \"ZeroProductLimits/cells/product_work/product_admission\": \"Inclusive defaults: 4096 cells per input, 4096 logical product cells, 1000000 scalar operations. Check left/right cell counts, compatible dimensions, logical output cells and checked 2*rows*cols*inner work before canonicality scans and arithmetic. All count overflow/refusal is typed MatrixError translated by HomologicalError. Logical output cells are charged despite no output matrix. Zero outputs are multiplied before potentially huge inner metadata, preserving 0*k=0.\",\n      \"admit_coefficients/admit_matrix/admit_shaped_matrix\": \"Short-circuit denominator<=0 before GCD; require gcd(numerator,denominator)=1, including 0/1. Admission has no mutation. A shape mismatch is diagnosed before coefficient scanning in admit_shaped_matrix. admit_matrix preserves the legacy Result<()> adapter by discarding the admitted borrow.\",\n      \"admit_zero_product/admit_zero_product_with_limits/AdmittedMatrix::zero_product/dot_product\": \"After resource/shape admission, require canonical tokens for both inputs, even when a side is zero. For nonempty dimensions compute each exact dot product borrowing operands and retain only its accumulator; return the caller-supplied typed violation on the first nonzero entry. Zero row/column/inner dimensions succeed without dense loops after the declared profile is admitted. No provider matrix multiplication, full output buffer or unverified scalar callback is used.\"\n    }\n  }\n}\n",
