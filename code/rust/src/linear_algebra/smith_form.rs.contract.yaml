    "differential_evidence": "Historical 20261020T012738Z-differential compared 746 then-current Smith results, including D/U/V or typed errors, with the sealed pre-refactor body. One workspace refusal was excluded from unsafe legacy allocation replay. This receipt remains bound to its original source snapshot; it is not presented as a current whole-file differential replay after the sparse repair.",
    "independent_challenge": "Existing integer-minor/unimodularity dense grids, 4225 signed Bezout cases and a 2000-step Euclidean chain; 18225 sparse products and dense roundtrips. New: 121 extreme Rational64 pairs vs i128 division/divisibility, huge raw rational cases, maximal empty metadata, a nondiagonal workspace satisfying U M V=D, literal 3x3 column order, all 729 small 2x3 heuristic tables vs immutable native row masks, literal swap-order example, inclusive metadata limits, all-zero zero-work profiles and usize::MAX row metadata. Two privacy compile-fail docs and a positive public example accompany 29 designated faults.",
