    "origin_review": "Task-authored byte-equal staged revision after 20261020T071453Z-rank-trial caught all 29 faults. Original source and all 266 prior assessment bytes are sealed in evidence/quality/l4a_six/20261020T074553Z-smith-activation. Fresh integration, not the staged run, determines this score.",
    "proof_arguments": [
      "A Bezout pair matrix has determinant (x*a+y*b)/g=1; a divisible-entry subtraction has determinant 1. Swaps/sign changes are unimodular. Applying the same row/column transforms to U/V maintains D=U M V. Earlier pivots remain isolated; divisibility of the trailing block is preserved by integer combinations. Iteration refusal publishes no result. Positive ordered factors, explicit actual-diagonal checking and identity replay complete the successful dense claim.",
      "Private row lengths and square transform dimensions are fixed at checked admission. Pair helpers receive first<second<dimension, so split_at_mut provides disjoint valid entries. Selected pivots are nonzero and exact pair quotients have nonzero divisors. Extended Euclid is iterative with decreasing remainder magnitude. Counters increment only while spent<limit, avoiding native overflow.",
      "For V transposition row<n and col<row, square lengths prove head[col][row] and tail[0][col] valid and disjoint. Row lengths do not change. Flattening checks count, reserves once and appends owned rows whose total length is count; scalar payloads move. Errors drop unpublished local buffers and leave borrowed input unchanged.",
      "Sparse private constructors establish columns.len()==cols, distinct sorted row<rows and nonzero values. Dense indices row*cols+j are below admitted rows*cols. New buffer counts/reservations are checked. Conversion and heuristic zero paths perform no dense traversal over extreme empty/row metadata.",
      "Heuristic work tuples reference immutable original input. Each pass removes one chosen column and exactly its active row set from remaining columns. GCD gives the declared nonnegative value. This establishes the finite row-removal process, not a Smith invariant theorem."
    ],
