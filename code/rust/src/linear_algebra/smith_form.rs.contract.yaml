    "symbol_contracts": {
      "SPARSE_GCD_HEURISTIC_WARNING/sparse_column_gcd_heuristic/sparse_column_gcd_heuristic_with_limit": "Return Result with default workspace limit 4096. Count nonzero entries with checked arithmetic; all-zero input needs no buffers. Otherwise admit cols+nonzero+min(cols,nonzero) elements before reserving outer column metadata, borrowed tuples and result capacity. Select first nonempty column, swap_remove it, compute nonnegative GCD and remove exactly its active row set from remaining columns. The fixed warning denies Smith certification. Input/scalar-internal allocation and bit growth are outside this workspace counter.",
      "SmithDiagonal/SmithNormalForm": "Positive divisibility-ordered invariant factors are admitted by SmithDiagonal::new_checked, including the empty rank-zero list. SmithNormalForm exposes immutable D/U/V and diagonal views; only the checked producer constructs that result.",
      "SmithWorkspace::check_diagonal/check_diagonal_entry": "Before output transfer require zero off-diagonal entries, strictly positive first-rank diagonal entries and zero remaining diagonal entries. Rank is the number of nonzero diagonal entries. This rejects U M V=D when D is not Smith diagonal.",
      "SmithWorkspace::finish/flatten_integer_rows/transpose_integer_rows": "Reserve invariant output once, copying positive diagonal factors once into that separately owned result. Move all D/U workspace values to flat owned outputs through a single fallible reservation and Vec::append. Transpose square V column buffers in place through disjoint swaps, then move them into row-major output. Replay U M V=D before publishing private fields. No full output matrix BigInt clones occur.",
      "SmithWorkspace::smallest_pivot/consider_smith_pivot": "Keep a borrowed minimum-nonzero value and coordinates; compare borrowed BigInt magnitudes, preserving first-on-tie order. No copied absolute value is allocated per scanned entry.",
      "SparseColMatrix": {
        "admission": "Private sparse columns contain exactly cols vectors, each with strictly increasing row indices below rows and nonzero integer coefficients. new_checked sorts in place and rejects violations. Its unstable sort does not specify which error wins among equal-row entries containing multiple defects.",
        "api_change": "from_dense now returns Result. The three preexisting Rust callers were adapted; two added challenge callers also handle Result. Consumers outside this repository require the same migration.",
        "challenge": "729 three-by-two matrices over {-1,0,1}, each multiplied by 25 independently enumerated integer vectors using direct i64 dot-product oracles; dense roundtrips; inclusive storage/vector/matrix budgets and usize::MAX empty-metadata/capacity refusals.",
        "dense_conversion": "to_dense checks rows*cols and output budget before fallible allocation; from_dense checks 2*cols+nnz for overflow and storage admission before counters, column descriptors and entries. The two cols terms account for counters and descriptors; nonzeros are cloned once into pre-reserved columns.",
        "empty_shapes": "Zero-area dense storage is preserved without enumerating huge row metadata. Zero-row sparse storage still requires column descriptors and counters; that metadata is included in admission.",
        "errors": "ColumnCountMismatch, ShapeOverflow, StorageCountOverflow and wrapped MatrixError allocation-limit/reservation failures. Failed operations return no partial output and do not mutate inputs.",
        "mul_vec": "Require input length cols before admitting rows output elements. Default output limit 4096; explicit inclusive override. Fallible reservation precedes zero initialization. Borrowed exact integer products accumulate into admitted row indices.",
        "resource_boundary": "Element counts are not byte limits or bounds on BigInt allocation, total process memory or elapsed time."
      },
      "borrow_sparse_columns/borrow_sparse_column/sparse_pivot_gcd/remove_sparse_pivot_rows": "Reserve metadata once fallibly and borrow original BigInt values. Compute only GCD, without unused Bezout coefficients. Retain remaining tuples in place; allocate no row-sized bitmap even for usize::MAX rows. Each selected column contains an entry, so result length is bounded by both columns and nonzero entries.",
      "from_rational64_integer_matrix/from_bigrational_integer_matrix": "Refuse denominator zero or nonintegral coefficients with row/column NonIntegerEntry. Accept unreduced or negative-denominator representations of defined integers. Widen Rational64 numerator/denominator into BigInt before remainder/division, so bounded signed division cannot overflow. Preserve matrix shape and use checked provider output construction.",
      "integer_numerator_from_rational64/integer_numerator_big/from_rational64_integer_matrix/from_bigrational_integer_matrix": "Borrow fractions. Reject denominator zero before remainder/division; require exact divisibility. Widen both i64 operands to BigInt before arithmetic, including MIN/-1. BigRational conversion avoids full-fraction clones. Empty metadata returns an empty matrix directly. Shape/reservation failures are typed; there is no additional conversion cell/bit/time limit.",
      "smith_normal_form_checked/smith_normal_form_with_limits": {
        "admission": "Check m*n + m*m + n*n with checked usize arithmetic before dense workspace allocation. The default aggregate ceiling is 4096 cells; SmithLimits exposes an explicit override and a per-pivot pass limit. Overflow and admission failure return typed SmithError/MatrixError without mutating the input.",
        "independent_challenge": "729 two-by-three integer matrices checked against determinantal divisors, transform determinants, 4225 signed Bezout inputs, a 2000-step Fibonacci Euclidean chain, inclusive aggregate budget tests, a huge zero-area metadata refusal, and a false-diagonal identity rejection.",
        "invariants": [
          "The private workspace retains admitted rectangular row lengths and square transform dimensions. Pivot scans choose the first minimum nonzero absolute value in row-major order; swaps and sign normalization precede elimination.",
          "Each subtract transform has determinant one. For Bezout coefficients xa+yb=g>0, the pair matrix [[x,y],[-b/g,a/g]] has determinant one. Row operations update U; column operations update the stored columns of V. A divisibility repair adds the same row to D and U.",
          "All internal pair helpers receive first < second from k and a later index. split_at_mut therefore yields disjoint coordinates/rows within the admitted shape. Pivot divisors are nonzero; Bezout quotients are integral.",
          "The iterative extended-Euclid loop strictly decreases nonzero remainder magnitude, has no recursion, and normalizes the final gcd sign. It preserves old_r=old_x*a+old_y*b."
        ],
        "iteration_policy": "Count one pass only after finding a nonzero pivot. Refuse when the count equals max_pivot_iterations, before the next pass. An all-zero active block does not consume a pass.",
        "postcondition": "Successful output has positive Smith invariants in divisibility order, a diagonal matrix D, and integer transforms U,V satisfying U A V = D. Empty shapes are supported when their identity workspaces are admitted.",
        "resource_boundary": "Cell limits count D/U/V dense scalar slots and are not a bound on BigInt bit growth, aggregate process allocation, formatting or elapsed time. Each workspace row reservation is fallible. Scalar operations use borrowed inputs; pair updates avoid copying entire source rows."
      },
      "sparse_column_gcd_heuristic": "Borrow values through fallibly reserved mutable metadata, preserve first-nonempty swap_remove and active-row removal, return typed Result and an explicitly uncertified GCD profile. See the detailed new workspace contract below; no full BigInt column clone or Smith certification is performed.",
      "verify_smith_identity/borrowed_integer_product": "Replay UAV=D using local borrowed BigInt dot products. Each product checks dimensions and uses provider fallible output reservation before callbacks. get_ref borrows entries; no per-dot-product operand clones are introduced. Zero-area products execute no callbacks."
    }
