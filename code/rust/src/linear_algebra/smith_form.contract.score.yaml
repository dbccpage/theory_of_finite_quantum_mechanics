b317fc18886bbe9abf44da861fd08\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074603Z-mutations/mutations.json\",\n      \"sha256\": \"00fa693c6f05422ed8b6be92780f5970691494e31b82ecaa20985a6a1e370860\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"status\": \"move_based_dense_and_bounded_sparse_individual_gate_review\",\n    \"capability_assessment\": {\n      \"source_sha256\": \"d8515871d15d6c26b10ef732e36262e53ee002c8d8ca96823dc485679b3a5691\",\n      \"level\": \"L4\",\n      \"basis\": \"Individual source review: the dense Smith producer now exposes configurable admission and typed iteration policy, preserves a private dimensioned workspace, performs closed integer unimodular transformations with iterative Bezout reduction, and checks its final certificate identity. Current independent determinantal-divisor/unimodularity and sparse arithmetic/admission challenges support this production capability. Sparse/heuristic and other whole-file engineering obligations remain explicit; this level review does not award grade A.\"\n    },\n    \"purpose\": \"Produce finite integer Smith data D, U, V with checked aggregate workspace admission and a replayed U A V = D identity; retain separate sparse heuristic APIs with their existing scope.\",\n    \"symbol_contracts\": {\n      \"smith_normal_form_checked/smith_normal_form_with_limits\": {\n        \"admission\": \"Check m*n + m*m + n*n with checked usize arithmetic before dense workspace allocation. The default aggregate ceiling is 4096 cells; SmithLimits exposes an explicit override and a per-pivot pass limit. Overflow and admission failure return typed SmithError/MatrixError without mutating the input.\",\n        \"postcondition\": \"Successful output has positive Smith invariants in divisibility order, a diagonal matrix D, and integer transforms U,V satisfying U A V = D. Empty shapes are supported when their identity workspaces are admitted.\",\n        \"iteration_policy\": \"Count one pass only after finding a nonzero pivot. Refuse when the count equals max_pivot_iterations, before the next pass. An all-zero active block does not consume a pass.\",\n        \"invariants\": [\n          \"The private workspace retains admitted rectangular row lengths and square transform dimensions. Pivot scans choose the first minimum nonzero absolute value in row-major order; swaps and sign normalization precede elimination.\",\n          \"Each subtract transform has determinant one. For Bezout coefficients xa+yb=g>0, the pair matrix [[x,y],[-b/g,a/g]] has determinant one. Row operations update U; column operations update the stored columns of V. A divisibility repair adds the same row to D and U.\",\n          \"All internal pair helpers receive first < second from k and a later index. split_at_mut therefore yields disjoint coordinates/rows within the admitted shape. Pivot divisors are nonzero; Bezout quotients are integral.\",\n          \"The iterative extended-Euclid loop strictly decreases nonzero remainder magnitude, has no recursion, and normalizes the final gcd sign. It preserves old_r=old_x*a+old_y*b.\"\n        ],\n        \"resource_boundary\": \"Cell limits count D/U/V dense scalar slots and are not a bound on BigInt bit growth, aggregate process allocation, formatting or elapsed time. Each workspace row reservation is fallible. Scalar operations use borrowed inputs; pair updates avoid copying entire source rows.\",\n        \"independent_challenge\": \"729 two-by-three integer matrices checked against determinantal divisors, transform determinants, 4225 signed Bezout inputs, a 2000-step Fibonacci Euclidean chain, inclusive aggregate budget tests, a huge zero-area metadata refusal, and a false-diagonal identity rejection.\"\n      },\n      \"SparseColMatrix\": {\n        \"admission\": \"Private sparse columns contain exactly cols vectors, each with strictly increasing row indices below rows and nonzero integer coefficients. new_checked sorts in place and rejects violations. Its unstable sort does not specify which error wins among equal-row entries containing multiple defects.\",\n        \"mul_vec\": \"Require input length cols before admitting rows output elements. Default output limit 4096; explicit inclusive override. Fallible reservation precedes zero initialization. Borrowed exact integer products accumulate into admitted row indices.\",\n        \"dense_conversion\": \"to_dense checks rows*cols and output budget before fallible allocation; from_dense checks 2*cols+nnz for overflow and storage admission before counters, column descriptors and entries. The two cols terms account for counters and descriptors; nonzeros are cloned once into pre-reserved columns.\",\n        \"empty_shapes\": \"Zero-area dense storage is preserved without enumerating huge row metadata. Zero-row sparse storage still requires column descriptors and counters; that metadata is included in admission.\",\n        \"errors\": \"ColumnCountMismatch, ShapeOverflow, StorageCountOverflow and wrapped MatrixError allocation-limit/reservation failures. Failed operations return no partial output and do not mutate inputs.\",\n        \"api_change\": \"from_dense now returns Result. The three preexisting Rust callers were adapted; two added challenge callers also handle Result. Consumers outside this repository require the same migration.\",\n        \"challenge\": \"729 three-by-two matrices over {-1,0,1}, each multiplied by 25 independently enumerated integer vectors using direct i64 dot-product oracles; dense roundtrips; inclusive storage/vector/matrix budgets and usize::MAX empty-metadata/capacity refusals.\",\n        \"resource_boundary\": \"Element counts are not byte limits or bounds on BigInt allocation, total process memory or elapsed time.\"\n      },\n      \"SmithDiagonal/SmithNormalForm\": \"Positive divisibility-ordered invariant factors are admitted by SmithDiagonal::new_checked, including the empty rank-zero list. SmithNormalForm exposes immutable D/U/V and diagonal views; only the checked producer constructs that result.\",\n      \"from_rational64_integer_matrix/from_bigrational_integer_matrix\": \"Refuse denominator zero or nonintegral coefficients with row/column NonIntegerEntry. Accept unreduced or negative-denominator representations of defined integers. Widen Rational64 numerator/denominator into BigInt before remainder/division, so bounded signed division cannot overflow. Preserve matrix shape and use checked provider output construction.\",\n      \"sparse_column_gcd_heuristic\": \"Borrow values through fallibly reserved mutable metadata, preserve first-nonempty swap_remove and active-row removal, return typed Result and an explicitly uncertified GCD profile. See the detailed new workspace contract below; no full BigInt column clone or Smith certification is performed.\",\n      \"verify_smith_identity/borrowed_integer_product\": \"Replay UAV=D using local borrowed BigInt dot products. Each product checks dimensions and uses provider fallible output reservation before callbacks. get_ref borrows entries; no per-dot-product operand clones are introduced. Zero-area products execute no callbacks.\",\n      \"SmithWorkspace::check_diagonal/check_diagonal_entry\": \"Before output transfer require zero off-diagonal entries, strictly positive first-rank diagonal entries and zero remaining diagonal entries. Rank is the number of nonzero diagonal entries. This rejects U M V=D when D is not Smith diagonal.\",\n      \"SmithWorkspace::finish/flatten_integer_rows/transpose_integer_rows\": \"Reserve invariant output once, copying positive diagonal factors once into that separately owned result. Move all D/U workspace values to flat owned outputs through a single fallible reservation and Vec::append. Transpose square V column buffers in place through disjoint swaps, then move them into row-major output. Replay U M V=D before publishing private fields. No full output matrix BigInt clones occur.\",\n      \"SmithWorkspace::smallest_pivot/consider_smith_pivot\": \"Keep a borrowed minimum-nonzero value and coordinates; compare borrowed BigInt magnitudes, preserving first-on-tie order. No copied absolute value is allocated per scanned entry.\",\n      \"integer_numerator_from_rational64/integer_numerator_big/from_rational64_integer_matrix/from_bigrational_integer_matrix\": \"Borrow fractions. Reject denominator zero before remainder/division; require exact divisibility. Widen both i64 operands to BigInt before arithmetic, including MIN/-1. BigRational conversion avoids full-fraction clones. Empty metadata returns an empty matrix directly. Shape/reservation failures are typed; there is no additional conversion cell/bit/time limit.\",\n      \"SPARSE_GCD_HEURISTIC_WARNING/sparse_column_gcd_heuristic/sparse_column_gcd_heuristic_with_limit\": \"Return Result with default workspace limit 4096. Count nonzero entries with checked arithmetic; all-zero input needs no buffers. Otherwise admit cols+nonzero+min(cols,nonzero) elements before reserving outer column metadata, borrowed tuples and result capacity. Select first nonempty column, swap_remove it, compute nonnegative GCD and remove exactly its active row set from remaining columns. The fixed warning denies Smith certification. Input/scalar-internal allocation and bit growth are outside this workspace counter.\",\n      \"borrow_sparse_columns/borrow_sparse_column/sparse_pivot_gcd/remove_sparse_pivot_rows\": \"Reserve metadata once fallibly and borrow original BigInt values. Compute only GCD, without unused Bezout coefficients. Retain remaining tuples in place; allocate no row-sized bitmap even for usize::MAX rows. Each selected column contains an entry, so result length is bounded by both columns and nonzero entries.\"\n    },\n    \"differential_evidence\": \"Historical 20261020T012738Z-differential compared 746 then-current Smith results, including D/U/V or typed errors, with the sealed pre-refactor body. One workspace refusal was excluded from unsafe legacy allocation replay. This receipt remains bound to its original source snapshot; it is not presented as a current whole-file differential replay after the sparse repair.\",\n    \"open_obligations\": [],\n    \"consumer_review\": [\n      \"Repository Rust search finds only this file calling sparse_column_gcd_heuristic. Its existing test handles the new Result; external callers must now handle typed storage/allocation refusal. The explicit-limit variant bounds new workspace elements.\",\n      \"Root homology carrier consumers use this local checked dense API and integer conversions. Similarly named external provider algorithms are distinct and are not upgraded by this file.\",\n      \"Used provider BasicMatrix primitives are private-shape storage, shape/rows/cols/as_slice/get_ref/get, from_row_major and fallible callback constructors. Their bodies are inspected: output length is checked and reserved fallibly, flat callback indices are bounded, zero area has no division/callback. Their default element limit is usize::MAX; conversions do not silently promise a 4096 cap. All callbacks here are closed library closures.\",\n      \"Other explicit runtime assumptions are BigInt/BigUint arithmetic, borrowed magnitude and GCD, Rational64/BigRational raw storage, Rust/std Vec ownership/reservation/sort/Drop and thiserror generation. Compiler, package sources and Cargo resolution are pinned by the execution receipts. No provider field or row-reduction algorithm is invoked.\"\n    ],\n    \"engineering_assessment\": {\n      \"source_sha256\": \"d8515871d15d6c26b10ef732e36262e53ee002c8d8ca96823dc485679b3a5691\",\n      \"gates\": {\n        \"G1\": {\n          \"grade\": \"A\",\n          \"basis\": \"Source SHA, complete requirement/exported-symbol and consumer maps bind the dense result, integer conversion and bounded diagnostic-process claims to pinned dependency, metric and execution receipts. Used storage/access/constructo