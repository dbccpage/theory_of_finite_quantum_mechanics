      "raw_utf8": "# YAML 1.2 (JSON syntax). AuthorityEffect: None.\n{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/linear_algebra/smith_form.rs\",\n    \"sha256\": \"d8515871d15d6c26b10ef732e36262e53ee002c8d8ca96823dc485679b3a5691\",\n    \"language\": \"Rust\"\n  },\n  \"contract_urn\": \"urn:tfqm:contract:linear_algebra:smith_form.rs\",\n  \"status\": \"move_based_dense_and_bounded_sparse_individual_gate_review\",\n  \"target\": \"L4A\",\n  \"profile\": \"Exact\",\n  \"purpose\": \"Exact matrix, elimination, polynomial and finite algebraic calculations with explicit domain/resource refusals.\",\n  \"subject_role\": \"Individual source review: the dense Smith producer now exposes configurable admission and typed iteration policy, preserves a private dimensioned workspace, performs closed integer unimodular transformations with iterative Bezout reduction, and checks its final certificate identity. Current independent determinantal-divisor/unimodularity and sparse arithmetic/admission challenges support this production capability. Sparse/heuristic and other whole-file engineering obligations remain explicit; this level review does not award grade A.\",\n  \"compilation\": {\n    \"disabled_by_cfg_any\": false,\n    \"test_or_support_file\": false\n  },\n  \"declaration_index\": [\n    {\n      \"kind\": \"enum\",\n      \"name\": \"SmithError\",\n      \"line\": 8,\n      \"declaration_line\": \"pub enum SmithError {\"\n    },\n    {\n      \"kind\": \"struct\",\n      \"name\": \"SmithDiagonal\",\n      \"line\": 49,\n      \"declaration_line\": \"pub struct SmithDiagonal {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"new_checked\",\n      \"line\": 54,\n      \"declaration_line\": \"pub fn new_checked(invariants: Vec<BigInt>) -> Result<Self, SmithError> {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"invariants\",\n      \"line\": 74,\n      \"declaration_line\"