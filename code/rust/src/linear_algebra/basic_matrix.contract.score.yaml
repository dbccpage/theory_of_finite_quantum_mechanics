d exported provider matrix mul panicked for valid 1x1 i64 MAX times 2. The owned numeric method now propagates ScalarError::OutOfRange(Multiply); private storage blocks bypass through the local type.\"\n    },\n    \"requirement_symbol_map\": {\n      \"audited private interoperability\": [\n        \"try_from_provider\",\n        \"into_provider\"\n      ],\n      \"complete pre-allocation admission\": [\n        \"preflight\",\n        \"admit\",\n        \"DEFAULT_LIMITS\",\n        \"checked_mul_with_limits\",\n        \"checked_mul_vec_with_limits\",\n        \"zip\"\n      ],\n      \"partial exact borrowed arithmetic\": [\n        \"product_entry\",\n        \"checked_add_with_limit\",\n        \"checked_sub_with_limit\"\n      ],\n      \"private shape storage and transport\": [\n        \"BasicMatrix\",\n        \"from_row_major\",\n        \"get_ref\",\n        \"set\",\n        \"try_transpose\",\n        \"try_map\"\n      ]\n    },\n    \"scope_limits\": [\n      \"Raw transport is intentionally distinct from admitted numeric values. Custom scalar implementations must uphold their own protocol.\",\n      \"No bit-length, byte-allocation, process-memory, timeout or foreign algorithm certification is implied.\"\n    ],\n    \"status\": \"individual_checked_protocol_review_requires_current_integration\",\n    \"symbol_contracts\": {\n      \"BasicMatrix/from_row_major/from_row_major_with_limit/serde\": \"Private transparent provider storage. Checked dimensions and exact vector length are maintained. Raw coefficient transport, mutation, serialization and layout conversion do not assert numeric domain admission. Numeric operations always revalidate inputs.\",\n      \"DEFAULT_LIMITS/OperationLimits/preflight\": \"Numeric defaults: 4096 output slots and 1000000 multiply/accumulate calls. Check dimensions, rows*cols, cell charge, 2*elements*inner with checked arithmetic, then work charge, all coefficients, then reserve. Limits are inclusive; huge zero-area met