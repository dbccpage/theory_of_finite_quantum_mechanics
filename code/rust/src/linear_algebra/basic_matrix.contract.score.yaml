ission\": {\n        \"claim\": \"Detect the designated MB02-right-admission fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB03-output-order\": {\n        \"claim\": \"Detect the designated MB03-output-order fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB04-work-accounting\": {\n        \"claim\": \"Detect the designated MB04-work-accounting fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB05-work-admission\": {\n        \"claim\": \"Detect the designated MB05-work-admission fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB06-product-coordinate\": {\n        \"claim\": \"Detect the designated MB06-product-coordinate fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB07-accumulation\": {\n        \"claim\": \"Detect the designated MB07-accumulation fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB08-vector-domain\": {\n        \"claim\": \"Detect the designated MB08-vector-domain fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/basic_matrix.rs\"\n      },\n      \"MB09-vector-output-order\": {\n        \"claim\": \"Detect the designated MB09-vector-output-order fault at the specified exact domain, arithmetic, re