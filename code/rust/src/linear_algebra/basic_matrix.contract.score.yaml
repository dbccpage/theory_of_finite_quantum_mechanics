points check compatible dimensions, inclusive element/work counters and every coefficient before output allocation, even for unused empty-product inputs. Each output dot is the exact ordered multiply/add sequence under the declared partial scalar protocol; zip operations preserve shape. A returned scalar refusal is propagated without inventing a value.\",\n          \"grade\": \"A\"\n        },\n        \"G3\": {\n          \"basis\": \"Output counts and arithmetic charges use checked usize operations. Admission/reservation precede buffers; division by output column count occurs only in a nonempty flat range. Product indices are bounded by admitted input shapes. Errors drop local partial outputs without input mutation. Provider storage field and outgoing conversion are private; no Numeric/Deref escape is public. Lawful scalar/callback/Clone/Drop behavior and allocator internals remain explicit environment assumptions.\",\n          \"grade\": \"A\"\n        },\n        \"G4\": {\n          \"basis\": \"Conditional on fresh untouched/restored integrated baselines and R>=0.95 for MB/PV storage faults, with compiler field/outgoing privacy controls. 6561 independent small matrix pairs, i128 dot/sum/difference models, every native overflow class, malformed coefficient roles, empty metadata, inclusive boundaries, serde shape and thread-local output-layout positive controls exercise declared failure classes.\",\n          \"grade\": \"A\"\n        },\n        \"G5\": {\n          \"basis\": \"All 39 explicit production bodies meet calibrated A ceilings. Products borrow coefficients and reserve the final flat buffer once. Full admission scans precede allocation; no per-entry operand clones or row buffers occur. Internal provider import copies once to establish separately owned storage, and export moves storage. Work counts exactly 2*m*n*k scalar calls, excluding validation/scalar internals; element counts are not byte/RSS/time bounds.\",\n          \"grade\": \"A\"\n       