          "purpose": "Provide checked canonical arbitrary-precision rational construction, immutable Q(i) field operations, and normalized rational digest frames; reexport scalar traits from the pinned external provider.",
          "domain_invariants": [
            "Q remains the BigRational type alias. Its public new_raw path can produce invalid candidates; aliasing Q is not evidence that a raw candidate is admitted.",
            "GaussianRational has private Q real/imag components. new validates a positive denominator and an already reduced numerator/denominator in each component. from_integers, zero, one and closed field operations preserve this domain.",
            "GaussianWire denies unknown fields and requires both components. BigRational's upstream decoder may normalize a finite rational before Gaussian admission; direct new rejects noncanonical raw values.",
            "There is no generic Gaussian component parameter, so neither bounded Rational64 storage nor an iterated extension with zero divisors can enter Q(i)."
          ],
          "symbol_contracts": {
            "qr": {
              "input_domain": "Two signed i64 integers, including MIN and MAX.",
              "postcondition": "Return Err(ZeroDenominator) exactly when d = 0; otherwise return the normalized mathematical rational n/d with a positive denominator.",
              "bounds_argument": "Convert to arbitrary-precision integers before denominator normalization, so MIN/-1 does not overflow signed machine storage.",
              "api_change": "qr now returns Result<Q, RationalConstructionError>. Existing local fixture callers explicitly unwrap their nonzero literal denominators.",
              "scope_limit": "The Q alias and reexported provider traits still require a complete dependency/domain review."
            },
            "validate_rational/GaussianRational::new": {
              "postcondition": "ZeroDenominator for denominator zero; NegativeDenominator for a negative denominator; NonReduced for other noncanonical numerator/denominator pairs; otherwise admit the unchanged value. new checks real before imag and exposes only immutable component accessors."
            },
            "GaussianRational arithmetic and Involution": {
              "postcondition": "add, mul, neg, inherited sub and conjugate compute the Q(i) operations. norm_sq(a+bi)=a^2+b^2. try_inv returns None exactly for zero; otherwise it returns (a-bi)/(a^2+b^2). Inherited try_div returns None exactly for a zero divisor argument.",
              "invariant_argument": "Canonical Q is a field. a^2+b^2=0 iff a=b=0 over Q, so the explicit zero check precedes both divisions. No operation can expose a mutable component or forge a denominator.",
              "bounds": "Arbitrary-precision integer arithmetic avoids machine-integer overflow. No bit-length, global allocator, process-memory or wall-clock guarantee is made."
            },
            "hash_bigint": {
              "postcondition": "Append an eight-byte little-endian u64 byte length, then the minimal signed two's-complement little-endian integer bytes supplied by num-bigint. A compile-time assertion rejects pointer widths above 64 before any usize-to-u64 hash framing conversion can truncate.",
              "independent_challenge": "Literal signed byte frames at -129, -128, -1, 0, 127 and 128."
            },
            "hash_rational": {
              "postcondition": "Refuse denominator zero before changing the caller's hasher. Otherwise normalize the finite rational and hash the normalized numerator and denominator using hash_bigint. Negative or unreduced finite raw fractions are deliberately accepted here, unlike Gaussian construction.",
              "composition": "Homology rational matrix/vector/weight/graded-vector/legacy digests propagate the typed error. Carrier wire serialization reports typed hash failure via serde rather than discarding it. Immutable boundary/coboundary maps return their constructor-bound cached digest.",
              "independent_challenge": "Failure-atomic hasher test, literal -1/2 framing, positive/negative unreduced equivalents, malformed digest propagation at every public rational digest boundary, and a literal matrix-tag/shape/entry frame."
            }
          },
          "api_changes": [
            "GaussianRational::new returns Result; real/imag are private and exposed by immutable getters. The QM density consumer uses getters and its integer fixture uses from_integers.",
            "hash_rational and the raw homology rational digest APIs are fallible. Carrier manifests and graded-vector hash queries propagate Result. Existing valid digest tags and byte frames remain unchanged."
          ],
          "resolved_counterexample": "The historical receipt 20261020T003510Z-defect-controls reproduced Gaussian construction of denominator-zero input followed by an inversion panic. The current constructor refuses that candidate before any field operation; finite regression and privacy controls are bound in the new assessment receipts.",
