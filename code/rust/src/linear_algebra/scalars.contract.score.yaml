      "raw_utf8": "# YAML 1.2 (JSON syntax). AuthorityEffect: None.\n{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/linear_algebra/scalars.rs\",\n    \"sha256\": \"94345b59fd4b4968ba0c9793deb52a20fa29692ab70eba1a9a049191565aff38\",\n    \"language\": \"Rust\"\n  },\n  \"contract_urn\": \"urn:tfqm:contract:linear_algebra:scalars.rs\",\n  \"status\": \"individual_checked_protocol_review_requires_current_integration\",\n  \"target\": \"L4A\",\n  \"profile\": \"Exact\",\n  \"purpose\": \"Exact matrix, elimination, polynomial and finite algebraic calculations with explicit domain/resource refusals.\",\n  \"subject_role\": \"Individual source review: an owned extensible fallible scalar protocol replaces provider trait reexports. Native operations return range refusals, rational queries admit canonical domains, bounded fractions widen before arithmetic, and private Gaussian storage preserves Q(i). Typed errors, independent edge models, compile-fail boundaries and adapted real consumers supply actual L4 capability.\",\n  \"compilation\": {\n    \"disabled_by_cfg_any\": false,\n    \"test_or_support_file\": false\n  },\n  \"declaration_index\": [\n    {\n      \"kind\": \"type\",\n      \"name\": \"Q\",\n      \"line\": 5,\n      \"declaration_line\": \"pub type Q = BigRational;\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"q\",\n      \"line\": 12,\n      \"declaration_line\": \"pub fn q(n: i64) -> Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"qr\",\n      \"line\": 17,\n      \"declaration_line\": \"pub fn qr(n: i64, d: i64) -> Result<Q, RationalConstructionError> {\"\n    },\n    {\n      \"kind\": \"enum\",\n      \"name\": \"RationalConstructionError\",\n      \"line\": 25,\n      \"declaration_line\": \"pub enum RationalConstructionError {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"validate_rational\",\n      \"line\": 36,\n      \"declaration_line\": \"pub fn validate_rational(value: &Q) -> Result<(), RationalConstructionError> {\"\n    },\n    {\n      \"kind\": \"struct\",\n      \"name\": \"GaussianRational\",\n      \"line\": 63,\n      \"declaration_line\": \"pub struct GaussianRational {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"new\",\n      \"line\": 69,\n      \"declaration_line\": \"pub fn new(real: Q, imag: Q) -> Result<Self, RationalConstructionError> {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"real\",\n      \"line\": 75,\n      \"declaration_line\": \"pub fn real(&self) -> &Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"imag\",\n      \"line\": 79,\n      \"declaration_line\": \"pub fn imag(&self) -> &Q {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"from_integers\",\n      \"line\": 83,\n      \"declaration_line\": \"pub fn from_integers(r: i64, i: i64) -> Self {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"norm_sq\",\n      \"line\": 90,\n      \"declaration_line\": \"pub fn norm_sq(&self) -> Q {\"\n    },\n    {\n      \"kind\": \"enum\",\n      \"name\": \"Operation\",\n      \"line\": 119,\n      \"declaration_line\": \"pub enum Operation {\"\n    },\n    {\n      \"kind\": \"enum\",\n      \"name\": \"ScalarError\",\n      \"line\": 128,\n      \"declaration_line\": \"pub enum ScalarError {\"\n    },\n    {\n      \"kind\": \"type\",\n      \"name\": \"ScalarResult\",\n      \"line\": 152,\n      \"declaration_line\": \"pub type ScalarResult<T> = std::result::Result<T, ScalarError>;\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"Semiring\",\n      \"line\": 157,\n      \"declaration_line\": \"pub trait Semiring: Clone + PartialEq + std::fmt::Debug {\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"Ring\",\n      \"line\": 165,\n      \"declaration_line\": \"pub trait Ring: Semiring {\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"Field\",\n      \"line\": 178,\n      \"declaration_line\": \"pub trait Field: Ring {\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"ExactRing\",\n      \"line\": 189,\n      \"declaration_line\": \"pub trait ExactRing: Ring {}\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"CheckedExactField\",\n      \"line\": 190,\n      \"declaration_line\": \"pub trait CheckedExactField: Field + ExactRing {}\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"Involution\",\n      \"line\": 191,\n      \"declaration_line\": \"pub trait Involution: Field + ExactRing {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_bigint\",\n      \"line\": 465,\n      \"declaration_line\": \"pub fn hash_bigint(hasher: &mut blake3::Hasher, value: &BigInt) {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_rational\",\n      \"line\": 474,\n      \"declaration_line\": \"pub fn hash_rational(\"\n    }\n  ],\n  \"declaration_index_scope\": \"Lexical line index only; signatures may span lines, include test/cfg items and omit macros/reexports.\",\n  \"requirements\": [\n    {\n      \"id\": \"G1\",\n      \"requirement\": \"Bind this source digest, declared symbols, actual claims, dependencies and consumer boundaries.\"\n    },\n    {\n      \"id\": \"G2\",\n      \"requirement\": \"Admit all public input domains; preserve exact arithmetic and declared algebraic laws on each successful path.\"\n    },\n    {\n      \"id\": \"G3\",\n      \"requirement\": \"Enumerate typed refusals and preserve state/invariants on every failure; justify all indexing and scalar preconditions.\"\n    },\n    {\n      \"id\": \"G4\",\n      \"requirement\": \"Challenge each declared critical failure class using an independent basis; retain all six mutation outcomes and require R >= 0.95 for A.\"\n    },\n    {\n      \"id\": \"G5\",\n      \"requirement\": \"Meet CCN <= 10, cognitive upper bound <= 15 and nesting <= 3; audit allocations and operational bounds separ