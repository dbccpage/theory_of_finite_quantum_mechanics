": 178,\n      \"declaration_line\": \"pub trait Field: Ring {\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"ExactRing\",\n      \"line\": 189,\n      \"declaration_line\": \"pub trait ExactRing: Ring {}\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"CheckedExactField\",\n      \"line\": 190,\n      \"declaration_line\": \"pub trait CheckedExactField: Field + ExactRing {}\"\n    },\n    {\n      \"kind\": \"trait\",\n      \"name\": \"Involution\",\n      \"line\": 191,\n      \"declaration_line\": \"pub trait Involution: Field + ExactRing {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_bigint\",\n      \"line\": 465,\n      \"declaration_line\": \"pub fn hash_bigint(hasher: &mut blake3::Hasher, value: &BigInt) {\"\n    },\n    {\n      \"kind\": \"fn\",\n      \"name\": \"hash_rational\",\n      \"line\": 474,\n      \"declaration_line\": \"pub fn hash_rational(\"\n    }\n  ],\n  \"declaration_index_scope\": \"Lexical line index only; signatures may span lines, include test/cfg items and omit macros/reexports.\",\n  \"requirements\": [\n    {\n      \"id\": \"G1\",\n      \"requirement\": \"Bind this source digest, declared symbols, actual claims, dependencies and consumer boundaries.\"\n    },\n    {\n      \"id\": \"G2\",\n      \"requirement\": \"Admit all public input domains; preserve exact arithmetic and declared algebraic laws on each successful path.\"\n    },\n    {\n      \"id\": \"G3\",\n      \"requirement\": \"Enumerate typed refusals and preserve state/invariants on every failure; justify all indexing and scalar preconditions.\"\n    },\n    {\n      \"id\": \"G4\",\n      \"requirement\": \"Challenge each declared critical failure class using an independent basis; retain all six mutation outcomes and require R >= 0.95 for A.\"\n    },\n    {\n      \"id\": \"G5\",\n      \"requirement\": \"Meet CCN <= 10, cognitive upper bound <= 15 and nesting <= 3; audit allocations and operational bounds separately.\"\n    }\n  ],\n  \"admission_policy\": \"Records with public fields or Deserialize are untrusted candidates until the specific validator admits them; a validator's name is not proof of completeness.\",\n  \"resource_boundary\": \"No process-OOM, bit-complexity, timeout or global memory guarantee is inferred from element/work counters.\",\n  \"authority_ceiling\": \"Runtime finite checks only. No formal theorem, physical derivation or authority promotion is certified.\",\n  \"open_obligations\": [\n    \"Fresh baseline execution alone does not establish independent challenge or mutation adequacy.\",\n    \"Individual G4 judgement withheld: execution or mutation prerequisite unmet.\"\n  ],\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/receipt.json\",\n      \"sha256\": \"02ef86c6eaaa341749b93cd0cff2463b8c7a462b0c14080b483b5c13cb518935\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/source_manifest.json\",\n      \"sha256\": \"b426c649d3ed095a576113062ea18b876fbd794e6eca1921ae2a296512eb5f63\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/records.py\",\n      \"sha256\": \"67b30ce4848112715d67386e9af9e83322a3643e50585f754ceb4e5c439b7819\"\n    },\n    {\n      \"path\": \"code/rust/quality/l4a_six/specs.json\",\n      \"sha256\": \"6e319e84dc25e76ffda0c3f8009c75cd36f36aacb18a24fad7a44c3899e67c84\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T104119Z-scalar-activation/activation.json\",\n      \"sha256\": \"0121f918b37a92c36a0d3cf4ab29bfcf91bafbe4df09115cbffe9cb931870daf\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T102150Z-scalar-port-faults/receipt.json\",\n      \"sha256\": \"c8ae8e9c477b3a870ad52b7bbdf3d1400f24d012de6311cfbebd19620177cf26\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T103621Z-scalar-composition/receipt.json\",\n      \"sha256\": \"112e2e31bc77781636545f7948a530075df7768fe6542069f47baacb2abfdc55\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T104923Z-mutations/INTERRUPTION.json\",\n      \"sha256\": \"8a6313af9bc23cc92f74bbd23953a52bc6d48e95e7778a56da6a003539a8ce6f\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T105520Z-scalar-regression-restoration/restoration.json\",\n      \"sha256\": \"95e15f84927602d4eb3840425bba0741a6b9b829d210c2fc2d02204964cbd213\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T105539Z-mutations/receipt.json\",\n      \"sha256\": \"22147785240c8daa095002f24f2f7617771999c50ca4bb02fa3b2151f70e2b51\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T074614Z-native-scalar-control/receipt.json\",\n      \"sha256\": \"f4b0d811fa8b495e9d8dbaee917da40fafa40de1996e86507b41a0328c3893e6\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145120Z-qm-consumer/receipt.json\",\n      \"sha256\": \"cd9e3c64f660364f3396d6aaacf778fcaa99605673c89dbf21bb1a96b02ac71f\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T145316Z/metrics.json\",\n      \"sha256\": \"c0f6c92c146ff0cf7d91b3a78bf74c7d26b455cd9b0547dd1d36ccc6260b19ec\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"api_changes\": [\n      \"Provider scalar trait reexports are replaced by owned fallible traits. Existing custom implementations and consumers must implement/handle validate and try_* Results; this is an intentional source API migration.\",\n      \"Involution and ordered-field methods now return typed Results. All in-repository root-module consumers were compiled in the staged full composition check.\"\n    ],\n    \"capability_assessment\": {\n      \"basis\": \"Individual source review: an owned extensible fallible scalar protocol replaces provider trait reexports. Native operations return range refusals, rational queries admit canonical domains, bounded fractions widen before arithmetic, and private Gaussian storage preserves Q(i). Typed errors, independent edge models, compile-fail boundaries and adapted real consumers supply actual L4 capability.\",\n      \"level\": \"L4\",\n      \"source_sha256\": \"94345b59fd4b4968ba0c9793deb52a20fa29692ab70eba1a9a049191565aff38\"\n    },\n    \"consumer_review\": [\n      \"Local elimination, matrix, polynomial, involution, ordered, tensor and law callers propagate ScalarResult. Homology conversions handle new matrix errors. The staged full original-root module/test composition compiles with all QM adaptations; an actual-root consumer receipt is additionally required for current composition evidence.\",\n      \"QM bridge explicitly admits foreign storage before local arithmetic, translates exhaustive error variants, and admits outgoing storage. Receiving provider algorithms and independent provider scalar traits remain separately scoped.\"\n    ],\n    \"domain_invariants\": [\n      \"Q is still a raw-capable BigRational alias. Successful local operations admit operands; alias membership alone proves no domain invariant.\",\n      \"i64 supports a partial checked ring representation but is neither ExactRing nor Field. Rational64 models partial representable rational-field operations, with a positive canonical denominator on success.\",\n      \"The public traits are intentionally extensible. Their identities, closure, algebraic laws, validation completeness, determinism and expected typed failures are obligations for external implementations; finite law samples cannot establish them universally.\",\n      \"GaussianRational has private canonical Q components. Its constructors, admitted serde decoder, identities and closed arithmetic preserve the domain; validate can consequently return Ok without rechecking private coordinates.\"\n    ],\n    \"engineering_assessment\": {\n      \"gates\": {\n        \"G1\": {\n          \"basis\": \"SHA-bound requirement/symbol and actual-consumer maps describe the owned protocol and deliberately distinct rational hash policy. Current receipts pin source, dependencies and commands. Archived source/sidecars retain the old overflow findings; no provider-wide repair or formal theorem is advertised.\",\n          \"grade\": \"A\"\n        },\n        \"G2\": {\n          \"basis\": \"i64 uses checked intrinsics and has no Field/ExactRing marker. Q admission requires denominator>0 and gcd(n,d)=1 before arithmetic or zero/conjugate queries. Rational64 widens raw operands first, executes in Q and narrows canonical results with checked conversion. Private admitted Gaussian components close under Q(i) formulas; a^2+b^2=0 iff both coordinates vanish, so inversion rejects exactly zero before division. Generic implementations retain explicitly stated algebra/domain obligations.\",\n          \"grade\": \"A\"\n        },\n        \"G3\": {\n          \"basis\": \"Every expected native range, raw rational domain and zero divisor failure is a typed Result. Borrowed operands are unchanged. Gaussian construction/decoding prevents forged components; native signed division is never used for field operations. q/qr widen first. Hash refusal precedes hasher mutation. num exact arithmetic, serde, blake3, Rust/std allocation and lawful custom scalar callbacks are explicit assumptions; process OOM and arbitrary downstream callback panics are outside this claim.\",\n          \"grade\": \"A\"\n        },\n        \"G4\": {\n          \"basis\": \"Conditional on fresh untouched/restored package baselines and R>=0.95 for designated SC and nonduplicate CP scalar faults. Wide native oracles, independent Gaussian coordinates, literal byte frames, malformed operand/query cases, bounded rational refusals and compiler privacy/trait controls challenge declared failure classes. A distinct F5 implementation checks preservation of generic field support. Earlier survivors and incomplete runs retain their original outcomes.\",\n          \"grade\": \"A\"\n        },\n        \"G5\": {\n          \"basis\": \"All 66 explicit production bodies meet calibrated A ceilings. Rational-domain GCD borrows components instead of cloning/reducing them. Q/Gaussian formulas borrow operands; Rational64 promotion has fixed-size inputs, and output-owned conjugates necessarily copy retained coordinates. Hash buffers are necessary byte encodings. There is no recursive local algorithm, arbitrary-precision bit bound, deadline or process-memory promise.\",\n          \"grade\": \"A\"\n        }\n      },\n      \"source_sha256\": \"94345b59fd4b4968ba0c9793deb52a20fa29692ab70eba1a9a049191565aff38\"\n    },\n    \"open_obligations\": [],\n    \"origin_and_staged_evidence\": [\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T104119Z-scalar-activation/activation.json\",\n        \"sha256\": \"0121f918b37a92c36a0d3cf4ab29bfcf91bafbe4df09115cbffe9cb931870daf\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T102150Z-scalar-port-faults/receipt.json\",\n        \"sha256\": \"c8ae8e9c477b3a870ad52b7bbdf3d1400f24d012de6311cfbebd19620177cf26\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T103621Z-scalar-composition/receipt.json\",\n        \"sha256\": \"112e2e31bc77781636545f7948a530075df7768fe6542069f47baacb2abfdc55\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T104923Z-mutations/INTERRUPTION.json\",\n        \"sha256\": \"8a6313af9bc23cc92f74bbd23953a52bc6d48e95e7778a56da6a003539a8ce6f\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T105520Z-scalar-regression-restoration/restoration.json\",\n        \"sha256\": \"95e15f84927602d4eb3840425bba0741a6b9b829d210c2fc2d02204964cbd213\"\n      },\n      {\n        \"path\": \"evidence/quality/l4a_six/20261020T105539Z-mutations/receipt.json\",\n        \"sha256\": \"22147785240c8daa095002f24f2f7617771999c50ca4bb02fa3b2151f70e2b51\"\n      }\n    ],\n    \"profile\": \"Exact\",\n    \"purpose\": \"Provide partial exact scalar operations with canonical domain admission, typed representation refusal, immutable Q(i), and stable normalized rational digest frames.\",\n    \"repaired_historical_findings\": {\n      \"controls\": [\n        {\n          \"path\": \"evidence/quality/l4a_six/20261020T074614Z-native-scalar-control/receipt.json\",\n          \"sha256\": \"f4b0d811fa8b495e9d8dbaee917da40fafa40de1996e86507b41a0328c3893e6\"\n        }\n      ],\n      \"scope\": \"Old E remains bound to its original source. Current classification requires fresh integrated checks; no stale defect receipt is passed as current-source evidence.\",\n      \"witness\": \"Previously the exported i64 provider Semiring add panicked on MAX+1. That trait reexport is removed; the owned implementation returns OutOfRange(Add), and the old ExactRing claim for i64 is absent.\"\n    },\n    \"requirement_symbol_map\": {\n      \"admitted closed Gaussian field\": [\n        \"GaussianRational::new\",\n        \"GaussianWire\",\n        \"GaussianRational::norm_sq\",\n        \"Field::try_inv\",\n        \"Involution::try_conj\"\n      ],\n      \"extensible partial exact models\": [\n        \"Semiring\",\n        \"Ring\",\n        \"Field\",\n        \"ExactRing\",\n        \"CheckedExactField\",\n        \"Involution\"\n      ],\n      \"stable finite rational hash frames\": [\n        \"hash_bigint\",\n        \"hash_rational\"\n      ],\n      \"typed representation/domain refusal\": [\n        \"ScalarError\",\n        \"ScalarResult\",\n        \"Operation\",\n        \"validate_rational\",\n        \"validate_pair\",\n        \"wide\",\n        \"narrow\"\n      ]\n    },\n    \"scope_limits\": [\n      \"Exact successful arithmetic, not universal algebraic proof, generic callback panic freedom or allocator crash freedom.\",\n      \"Arbitrary-precision bit growth, input parsing/serde allocation, hashing allocation and elapsed time have no global bound.\"\n    ],\n    \"status\": \"individual_checked_protocol_review_requires_current_integration\",\n    \"symbol_contracts\": {\n      \"GaussianRational/GaussianWire\": \"new validates real then imaginary canonical Q. Decoder denies unknown fields and admits its decoded components. Immutable accessors and closed operations preserve Q(i); inverse returns Result and rejects zero. No mutable component escape or larger extension is admitted.\",\n      \"Q implementations\": \"Admit every used operand before exact num-rational operations. Inverse/division reject admitted zero divisors explicitly. Canonical rational arithmetic preserves normalization and positivity; exact intermediates are not a bit or memory budget.\",\n      \"ScalarError/ScalarResult/Operation\": \"ZeroDenominator, NegativeDenominator, NonReduced, DivisionByZero, operation-tagged OutOfRange, InvalidDomain and neutral nonzero InversionRefused are distinct typed refusals. InversionRefused does not assert mathematical noninvertibility.\",\n      \"Semiring/Ring/Field/ExactRing/CheckedExactField/Involution\": \"Partial exact protocol with valid zero/one and validation even for queries. Default subtraction/division admit both roles first. Bounded intermediates may refuse despite a representable final expression; success always has the declared mathematical value. No totality claim is made.\",\n      \"hash_bigint\": {\n        \"independent_challenge\": \"Literal signed byte frames at -129, -128, -1, 0, 127 and 128.\",\n        \"postcondition\": \"Append an eight-byte little-endian u64 byte length, then the minimal signed two's-complement little-endian integer bytes supplied by num-bigint. A compile-time assertion rejects pointer widths above 64 before any usize-to-u64 hash framing conversion can truncate.\"\n      },\n      \"hash_rational\": {\n        \"composition\": \"Homology rational matrix/vector/weight/graded-vector/legacy digests propagate the typed error. Carrier wire serialization reports typed hash failure via serde rather than discarding it. Immutable boundary/coboundary maps return their constructor-bound cached digest.\",\n        \"independent_challenge\": \"Failure-atomic hasher test, literal -1/2 framing, positive/negative unreduced equivalents, malformed digest propagation at every public rational digest boundary, and a literal matrix-tag/shape/entry frame.\",\n        \"postcondition\": \"Refuse denominator zero before changing the caller's hasher. Otherwise normalize the finite rational and hash the normalized numerator and denominator using hash_bigint. Negative or unreduced finite raw fractions are deliberately accepted here, unlike Gaussian construction.\"\n      },\n      \"i64/BigInt implementations\": \"Native add/subtract/multiply/negate return checked intrinsic results or their Operation-tagged OutOfRange. BigInt arithmetic is unbounded exact ring arithmetic subject to allocator resources; no field implementation for either integer representation.\",\n      \"q/qr\": {\n        \"api_change\": \"qr now returns Result<Q, RationalConstructionError>. Existing local fixture callers explicitly unwrap their nonzero literal denominators.\",\n        \"bounds_argument\": \"Convert to arbitrary-precision integers before denominator normalization, so MIN/-1 does not overflow signed machine storage.\",\n        \"input_domain\": \"Two signed i64 integers, including MIN and MAX.\",\n        \"postcondition\": \"Return Err(ZeroDenominator) exactly when d = 0; otherwise return the normalized mathematical rational n/d with a positive denominator.\",\n        \"scope_limit\": \"q is an integer embedding. qr has no bounded signed normalization and rejects d=0 before Q construction.\"\n      },\n      \"validate_rational/validate_pair\": \"Reject denominator zero, then negative, then gcd(n,d)!=1, without normalization arithmetic on malformed fractions. Admit left before right. Canonical zero is 0/1.\",\n      \"wide/narrow/Rational64 implementations\": \"Build raw Q from widened numerator and denominator, admit through Q operations, and convert both resulting canonical components to i64. This avoids native MIN negation or MIN/-1 division. Reject an unrepresentable positive denominator, including inverse(MIN). Zero queries and conjugation also validate.\"\n    },\n    \"verification_challenges\": {\n      \"CP01-native-range\": {\n        \"claim\": \"Detect the designated CP01-native-range fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP02-native-range\": {\n        \"claim\": \"Detect the designated CP02-native-range fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP03-native-range\": {\n        \"claim\": \"Detect the designated CP03-native-range fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP04-native-range\": {\n        \"claim\": \"Detect the designated CP04-native-range fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP08-left-domain\": {\n        \"claim\": \"Detect the designated CP08-left-domain fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP09-right-domain\": {\n        \"claim\": \"Detect the designated CP09-right-domain fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/src/linear_algebra/scalars.rs\"\n      },\n      \"CP10-zero-query\": {\n        \"claim\": \"Detect the designated CP10-zero-query fault at the specified exact domain, arithmetic, representation or privacy boundary.\",\n        \"source\": \"code/rust/