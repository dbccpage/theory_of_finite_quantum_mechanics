[package]
name = "tfqm_general_relativity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_general_relativity"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:omega_homology", "dep:linear_algebra"]

[dependencies]
omega_homology = { version = "0.1.0", optional = true }
tfqm_holonomy = { path = "../holonomy" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"
tfqm_number_theory = { path = "../number_theory" }
linear_algebra = { version = "0.1.0", optional = true }
tfqm_lie_theory = { path = "../lie_theory" }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
