      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/combinatorics/mod.rs\",\n    \"sha256\": \"2dae3faff20c8917f015fb9543f4d708fbc1cf7545cb40817547d91e2b7ce35f\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"domain\": \"Fixed admitted provider calls and raw witness records; scalar comparison covers every u64. Public records remain mutable and forgeable by callers.\",\n    \"behavior\": [\n      \"Call the exact partition and factorial checks in that order, returning their first error; on success pass both admitted values to the private finishing assembler.\",\n      \"Private assembler: retain both supplied u64 fields without validating them; call MUB, Fano and affine checks in order and preserve all five resulting fields in the raw report.\",\n      \"Compare any u64 witness to five; accept equality only and otherwise report invariant p(4)=5 with the exact witness operand. It is public in this source module but the crate_certificate module is private and does not re-export this helper externally.\",\n      \"Compute exact partition_count(4), map a provider error, checked-convert to u64 and accept exactly five; distinguish a different representable value from conversion failure.\",\n      \"Compute exact factorial(5), map a provider error, checked-convert to u64 and accept exactly 120; distinguish other values from conversion failure.\",\n      \"Construct the admitted canonical prime-five operator bundles, map failure and accept exactly six bundles; no eigenbasis completeness claim.\",\n      \"Construct the Fano relation, map failure, recompute linearity and reject its failure, then return the actual line count. The current reviewed producer supplies exactly seven lines.\",\n      \"Construct AG(2,3), map failure, compare its actual line count to twelve and return it only on equality.\"\n    ],\n    \"capability\": \"Standard fixed witness checks, typed procedural error propagation and raw report assembly. Mathematical sophistication resides in the reviewed providers.\"\n  },\n  \"operations\": {\n    \"surface_certificate\": {\n      \"line\": 20,\n      \"signature\": \"pub fn surface_certificate() -> Result<SurfaceCertificate, SurfaceError>\",\n      \"obligation\": \"Call the exact partition and factorial checks in that order, returning their first error; on success pass both admitted values to the private finishing assembler.\"\n    },\n    \"finish_surface\": {\n      \"line\": 32,\n      \"signature\": \"fn finish_surface(partition_four: u64, factorial_five: u64) -> Result<SurfaceCertificate, SurfaceError>\",\n      \"obligation\": \"Private assembler: retain both supplied u64 fields without validating them; call MUB, Fano and affine checks in order and preserve all five resulting fields in the raw report.\"\n    },\n    \"refuse_partition_witness\": {\n      \"line\": 54,\n      \"signature\": \"pub fn refuse_partition_witness(witness: u64) -> Result<(), SurfaceError>\",\n      \"obligation\": \"Compare any u64 witness to five; accept equality only and otherwise report invariant p(4)=5 with the exact witness operand. It is public in this source module but the crate_certificate module is private and does not re-export this helper externally.\"\n    },\n    \"certify_partition\": {\n      \"line\": 64,\n      \"signature\": \"fn certify_partition() -> Result<u64, SurfaceError>\",\n      \"obligation\": \"Compute exact partition_count(4), map a provider error, checked-convert to u64 and accept exactly five; distinguish a different representable value from conversion failure.\"\n    },\n    \"certify_factorial\": {\n      \"line\": 82,\n      \"signature\": \"fn certify_factorial() -> Result<u64, SurfaceError>\",\n      \"obligation\": \"Compute exact factorial(5), map a provider error, checked-convert to u64 and accept exactly 120; distinguish other values from conversion failure.\"\n    },\n    \"certify_mub\": {\n      \"line\": 100,\n      \"signature\": \"fn certify_mub() -> Result<usize, SurfaceError>\",\n      \"obligation\": \"Construct the admitted canonical prime-five operator bundles, map failure and accept exactly six bundles; no eigenbasis completeness claim.\"\n    },\n    \"certify_fano\": {\n      \"line\": 116,\n      \"signature\": \"fn certify_fano() -> Result<usize, SurfaceError>\",\n      \"obligation\": \"Construct the Fano relation, map failure, recompute linearity and reject its failure, then return the actual line count. The current reviewed producer supplies exactly seven lines.\"\n    },\n    \"certify_affine\": {\n      \"line\": 130,\n      \"signature\": \"fn certify_affine() -> Result<usize, SurfaceError>\",\n      \"obligation\": \"Construct AG(2,3), map failure, compare its actual line count to twelve and return it only on equality.\"\n    }\n  },\n  \"invariants\": [\n    \"The fixed public surface obtains p(4), 5!, canonical prime-5 bundle count, Fano lines and AG(2,3) lines from the actual separately reviewed providers. These seven review documents, all nine production sources and both manifests are pinned. Provider outputs 5,120,6,7,12 are exact and fit both u64 and the compiled usize.\",\n    \"Errors are typed SurfaceError records. The source preserves the first failing stage, mapping provider errors to finite input diagnostics rather than continuing with defaults. The checked BigUint-to-u64 conversions admit exactly the fixed expected values and reject other representable or oversized outputs. Current fixed pure providers cannot enter those defensive failure branches, which remain reviewed rather than falsely covered by injected tests.\",\n    \"Private finish_surface trusts its two scalar arguments and joins three more fixed providers; it does not validate those scalar arguments itself. Only the preceding private checks supply them on the public path. Direct fixture calls with arbitrary u64 values confirm the weaker assembler contract. Public report fields and derived clones are freely editable; no type-level authenticity or general theorem follows from their names.\",\n    \"Fano linearity is recomputed using the reviewed pair predicate before its line count is reported. AG(2,3) uses the exact prime-order producer and explicitly checks twelve lines. Canonical prime-five MUB configuration uses the admitted operator-bundle producer and checks six bundles. This does not construct eigenvectors or classify dimensions.\",\n    \"The entry points call each fixed producer once in a fixed order. Wrapper/assembler code has no loop or recursion and introduces no redundant inner allocations. Provider allocations are bounded by fixed n=4,5, p=3,5 and seven-point Fano inputs under the provider contracts. Error formatting allocates only on failure. Successful returned records own their fields and no partial report escapes an error.\",\n    \"The native controls compare the assembled report to independently listed partitions and factorial/pair-count formulas; they also test all wrong scalar witnesses including u64::MAX, shared exports, cloned ownership and forged raw reports. Complete source mutation campaigns challenge false refusal and corruption of every exported field or provider check. Every designated fault is detected; mutation outcomes are literal, not inferred from test annotations.\",\n    \"All 8 production bodies meet structural maxima CCN 7, cognitive 3, nesting 1. Standard fixed witness checks, typed procedural error propagation and raw report assembly. Mathematical sophistication resides in the reviewed providers.\"\n  ],\n  \"failure_paths\": {\n    \"surface_certificate\": \"Call the exact partition and factorial checks in that order, returning their first error; on success pass both admitted values to the private finishing assembler.\",\n    \"finish_surface\": \"Private assembler: retain both supplied u64 fields without validating them; call MUB, Fano and affine checks in order and preserve all five resulting fields in the raw report.\",\n    \"refuse_partition_witness\": \"Compare any u64 witness to five; accept equality only and otherwise report invariant p(4)=5 with the exact witness operand. It is public in this source module but the crate_certificate module is private and does not re-export this helper externally.\",\n    \"certify_partition\": \"Compute exact partition_count(4), map a provider error, checked-convert to u64 and accept exactly five; distinguish a different representable value from conversion failure.\",\n    \"certify_factorial\": \"Compute exact factorial(5), map a provider error, checked-convert to u64 and accept exactly 120; distinguish other values from conversion failure.\",\n    \"certify_mub\": \"Construct the admitted canonical prime-five operator bundles, map failure and accept exactly six bundles; no eigenbasis completeness claim.\",\n    \"certify_fano\": \"Construct the Fano relation, map failure, recompute linearity and reject its failure, then return the actual line count. The current reviewed producer supplies exactly seven lines.\",\n    \"certify_affine\": \"Construct AG(2,3), map failure, compare its actual line count to twelve and return it only on equality.\"\n  },\n  \"trust_boundary\": \"Compiler, standard allocation/formatting, num_bigint/num_traits, thiserror and the seven exact provider implementations remain TCB. No memory-exhaustion recovery, compiler-read trace, or constant-time guarantee. AuthorityEffect: None. Fixed finite witness aggregation only. Public SurfaceCertificate and SurfaceError fields are mutable raw report records, not authenticated or invariant-bearing proof tokens; no consumer may treat a caller-built record as admitted mathematical evidence.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. Fixed finite witness aggregation only. Public SurfaceCertificate and SurfaceError fields are mutable raw report records, not authenticated or invariant-bearing proof tokens; no consumer may treat a caller-built record as admitted mathematical evidence.\",\n    \"Provider failures and to_u64 overflow arms are unreachable for the pinned exact fixed calls, whose reviewed outputs are small constants. Those defensive arms are source-reviewed and the ordered Except model is checked; no injected provider-failure execution or full Rust/MIR refinement is claimed.\",\n    \"Lean list/arithmetic examples corroborate the fixed witnesses but do not newly prove completeness of a partition enumeration or a physical MUB theorem. Actual computation semantics are discharged by the seven separately registered source reviews.\",\n    \"The actual standalone combinatorics crate and one-fault copies are compiled. External omega providers and whole-workspace success are outside the claim. Legacy mutation annotations are not the final literal six-outcome tables.\",\n    \"No production source changes were needed. Delivered L1/L2 capabilities remain below the architecture target, as authorized for honest per-file scores; completed engineering A is not a blanket L4 award.\",\n    \"Compiler, standard allocation/formatting, num_bigint/num_traits, thiserror and the seven exact provider implementations remain TCB. No memory-exhaustion recovery, compiler-read trace, or constant-time guarantee.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/mod.json\",\n      \"sha256\": \"085109412ee1b6bf581bc9864c24b365bf240e16c61031b838ffb3b284aff6dd\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
