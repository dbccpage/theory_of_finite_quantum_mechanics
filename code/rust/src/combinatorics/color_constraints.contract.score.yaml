all Cartesian assignments in lexicographic order, compute literal violated edge indexes into reusable scratch, and keep strict improvements only. Return the first minimum; zero can terminate early because no negative cost exists. The final EmptyPalette fallback is unreachable after successful positive-palette admission.\"\n    },\n    \"admit_instance\": {\n      \"line\": 88,\n      \"signature\": \"fn admit_instance(\\n    vertices: usize,\\n    edges: &[(usize, usize)],\\n    colors: usize,\\n    forbidden: &BTreeSet<(usize, usize)>,\\n    max_colorings: usize,\\n    max_edge_checks: usize,\\n) -> Result<CartesianWords, ColorConstraintError>\",\n      \"obligation\": \"Reject zero palette, then the first invalid listed edge endpoint, then the first lexicographically invalid forbidden tuple. Admit Cartesian width and row count, then compare exact cardinality*edges.len against the caller check budget. Equality is accepted. This is a conservative full-search pair-check charge even if zero early exit would use less.\"\n    },\n    \"violated_edges\": {\n      \"line\": 126,\n      \"signature\": \"fn violated_edges(\\n    coloring: &[usize],\\n    edges: &[(usize, usize)],\\n    forbidden: &BTreeSet<(usize, usize)>,\\n    violated: &mut Vec<usize>,\\n) -> Result<(), ColorConstraintError>\",\n      \"obligation\": \"Clear the private scratch length before each candidate. Read each edge endpoint via typed get and append its original index exactly when either orientation is forbidden. Duplicates and self-loops remain literal listed edges. A private malformed call can return a typed endpoint error with a partial scratch prefix; the public search exposes no partial result and its admission prevents that path.\"\n    },\n    \"color_at\": {\n      \"line\": 143,\n      \"signature\": \"fn color_at(\\n    coloring: &[usize],\\n    vertex: usize,\\n    index: usize,\\n) -> Result<usize, ColorConstraintError>\",\n      \"obligation\": \"Safely read the declared vertex and return its color, or Endpoint carrying the supplied original edge index. Never index unchecked.\"\n    },\n    \"pair_forbidden\": {\n      \"line\": 154,\n      \"signature\": \"fn pair_forbidden(forbidden: &BTreeSet<(usize, usize)>, left: usize, right: usize) -> bool\",\n      \"obligation\": \"Test either literal color-pair orientation, with undirected semantics even if only one orientation was supplied.\"\n    },\n    \"prefer\": {\n      \"line\": 158,\n      \"signature\": \"fn prefer(\\n    mut best: Option<MinimumColorViolations>,\\n    coloring: Vec<usize>,\\n    violated_edges: &mut Vec<usize>,\\n) -> Option<MinimumColorViolations>\",\n      \"obligation\": \"If no prior best or strictly fewer violations, move the current coloring and scratch vector into the new best and recycle the old best violation buffer for future scratch. Keep the previous best exactly on equal or worse costs. No output aliases mutable scratch; discarded candidates are dropped.\"\n    }\n  },\n  \"invariants\": [\n    \"Palette admission is positive even for the empty graph. Endpoint validity is checked in original edge order before forbidden tuples and any Cartesian admission. Forbidden tuples are checked in BTreeSet lexicographic order. CartesianWords then supplies admitted width<=4096 and exact full row count. Worst-case pair checks use BigUint multiplication, so cardinality*edge_count cannot wrap before comparison to usize max_edge_checks. A bounded initial Cartesian buffer can already exist at this last refusal; no promise of zero allocation before all guards is made.\",\n    \"Every candidate has exactly vertices entries, each below colors, and every edge endpoint is in range. color_at still uses get and typed errors defensively. violated_edges clears scratch and scans original edge indexes in order; an index appears exactly when the symmetric forbidden predicate holds. Duplicate/oriented edges and loops are distinct listed constraints and count independently. No count approximation or deduplication changes the objective.\",\n    \"CartesianWords covers every admitted coloring once in lexicographic order. After each candidate, best is a processed candidate with cost no greater than any processed cost. The first candidate initializes it, strict improvement replaces it, and equal costs preserve the prior earliest candidate. Induction establishes the global minimum after full traversal. If best cost is zero, all remaining natural costs are at least zero, and continuing cannot replace it, so early termination preserves both optimality and first-tie choice. The Lean fold invariant, actual result membership, global argmin, tie and zero-extension lemmas establish these abstract properties.\",\n    \"Positive colors imply colors^vertices>0, including vertices=0, hence successful Cartesian admission always yields at least one candidate and the final no-best fallback is unreachable. Empty palette, endpoint, color, width, row budget and pair-check budget errors keep their stated priority. Public arguments are borrowed or scalar; local scratch/best values drop on error and no partial result is returned. Public raw MinimumColorViolations fields can be forged independently and are not intrinsic certificates; only the function result is claimed.\",\n    \"Scratch and best violation vectors have distinct owned storage. On replacement, mem::take moves scratch into the candidate, Option::replace installs the candidate and returns the previous owned best, whose violation vector becomes scratch. On ties/worse candidates scratch is retained and later cleared; the rejected coloring is dropped. No violation-list clone is needed. The previous best coloring is dropped after moving its old violation buffer. This changes allocation behavior without changing selected values or ties.\",\n    \"Let N=colors^vertices, V=vertices, E=listed edges and F=forbidden tuples. Admission bounds the worst-case pair evaluations N*E by the caller budget; symmetric lookup uses at most two BTreeSet lookups per pair, with O(log F) comparison cost. Cartesian generation/copy has O(N*V) work. Retained working/output storage is O(V+E) (at most three coloring vectors during replacement and two violation buffers), with V<=4096. The edge budget is a pair-count bound, not a heap/time guarantee. Caller-owned graph/set size and allocator/BigUint/library implementation remain explicit TCB.\",\n    \"All eight production bodies meet maxima CCN 8, cognitive 6 and nesting 3. thiserror formatting/From, concrete Vec and Option operations, iterator closures and borrowed BTreeSet lookups are reviewed separately from the declared AST metric. No compiler-expanded control flow or Rust/MIR theorem is claimed.\"\n  ],\n  \"failure_paths\": {\n    \"ColorConstraintError::violated_invariant\": \"Return the exact stable diagnostic label for each error variant; delegate Enumeration labels to the actual admitted enumeration provider. Raw errors do not carry mathematical authority.\",\n    \"ColorConstraintError::measured_parameters\": \"Return each variant's exact ordered parameter names and decimal values, delegating Enumeration parameters unchanged.\",\n    \"minimum_color_violations\": \"Admit the complete instance before search. Enumerate all Cartesian assignments in lexicographic order, compute literal violated edge indexes into reusable scratch, and keep strict improvements only. Return the first minimum; zero can terminate early because no negative cost exists. The final EmptyPalette fallback is unreachable after successful positive-palette admission.\",\n    \"admit_instance\": \"Reject zero palette, then the first invalid listed edge endpoint, then the first lexicographically invalid forbidden tuple. Admit Cartesian width and row count, then compare exact cardinality*edges.len against the caller check budget. Equality is accepted. This is a conservative full-search pair-check charge even if zero early exit would use less.\",\n    \"violated_edges\": \"Clear the private scratch length before each candidate. Read each edge endpoint via typed get and append its original index exactly when either orientation is forbidden. Duplicates and self-loops remain literal listed edges. A private malformed call can return a typed endpoint error with a partial scratch prefix; the public search exposes no partial result and its admission prevents that path.\",\n    \"color_at\": \"Safely read the declared vertex and return its color, or Endpoint carrying the supplied original edge index. Never index unchecked.\",\n    \"pair_forbidden\": \"Test either literal color-pair orientation, with undirected semantics even if only one orientation was supplied.\",\n    \"prefer\": \"If no prior best or strictly fewer violations, move the current coloring and scratch vector into the new best and recycle the old best violation buffer for future scratch. Keep the previous best exactly on equal or worse costs. No output aliases mutable scratch; discarded candidates are dropped.\"\n  },\n  \"trust_boundary\": \"All eight production bodies meet maxima CCN 8, cognitive 6 and nesting 3. thiserror formatting/From, concrete Vec and Option operations, iterator closures and borrowed BTreeSet lookups are reviewed separately from the declared AST metric. No compiler-expanded control flow or Rust/MIR theorem is claimed.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. Native tests and mathematical model proofs have explicit separate scopes; no extracted Rust/MIR or machine-checked allocator theorem.\",\n    \"Only the actual standalone combinatorics crate and one-fault copies are compiled. No external omega or whole-workspace success is inferred.\",\n    \"Static PROVENANCE mutation-count annotations are legacy text; source-pinned recipes and literal six-outcome receipts establish actual challenge sensitivity.\",\n    \"The argmin model assumes an actual complete candidate list with exact natural costs; Cartesian coverage, literal edge evaluation, typed admission and buffer ownership are connected separately in this review.\",\n    \"The initial huge-palette minimum-direction mutant timed out. The final sensitivity campaign uses a bounded two-color search for that behavior while preserving maximum-scalar admission checks; the original successful large search is retained as auxiliary control evidence.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/color_constraints.json\",\n      \"sha256\": \"ffdd2ae6d0eaa2d95e0caac9a130af12a2c656a0700035d6e8c1da21ec61dcb6\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
