d Permutations iterator. The row count limit is checked before allocation; output ownership and allocator availability remain explicit caller/runtime boundaries.\",\n      \"Collect the admitted Combinations iterator; preserve its cardinality, width, zero-result convention and error order.\",\n      \"First admit parts<=4096. Compute exact stars-and-bars count, with zero parts giving one empty row exactly when total is zero. Reject checked upper-index overflow or excessive binomial choice, then reject row count above caller limit, then exact count*parts above 1048576 cells. Only then enumerate rows lexicographically with nonnegative entries summing to total.\",\n      \"Accept equality at width 4096; reject larger widths with ArgumentTooLarge carrying the declared operation and width, before any output vector allocation.\",\n      \"Private admitted inputs only. Handle zero parts directly; otherwise start at [0,...,total], emit each row and apply the iterative lexicographic successor. Constant call-stack depth, one width-sized scratch vector, and one required owned clone per output row.\",\n      \"Private nonempty admitted row only. Locate the rightmost positive coordinate after the first, move one unit to its predecessor, and put the remainder in the final slot. The suffix was zero; preserve sum, positivity, width and lexicographic order. Return false exactly at [total,0,...,0].\",\n      \"Compute admitted exact factorial, then check row budget before allocating [0,..,n). Own a private initial state; the first item exists also at n=0.\",\n      \"Emit the initial word once, then each next permutation exactly once; set current=None at exhaustion and remain exhausted on repeated next calls. Clone returns independently owned iterator state.\",\n      \"Compute admitted binomial, check row budget, and only for nonempty mathematical families check k<=4096 before allocating [0,..,k). k>n creates an exhausted iterator even for huge k. Exact equality of n and k does not bypass width admission.\",\n      \"Emit initial subset once, then each successor; clear state on exhaustion. Empty subset is one row when k=0, while k>n starts exhausted. Returned rows are owned.\",\n      \"Return Some exact value only when the BigUint fits u64; larger counts return None without truncation.\"\n    ],\n    \"capability\": \"L4 production enumeration API grain: private admitted lazy iterators, exact arithmetic, typed resource refusal before output allocation, bounded eager composition storage and iterative stack usage.\"\n  },\n  \"operations\": {\n    \"CombinatoricsError::violated_invariant\": {\n      \"line\": 34,\n      \"signature\": \"pub fn violated_invariant(&self) -> &'static str\",\n      \"obligation\": \"Map the two raw error variants to their exact declared invariant strings; no claim that arbitrary raw error fields were admitted.\"\n    },\n    \"CombinatoricsError::measured_parameters\": {\n      \"line\": 41,\n      \"signature\": \"pub fn measured_parameters(&self) -> Vec<(&'static str, String)>\",\n      \"obligation\": \"Return the exact ordered diagnostic key/value pairs for either variant using decimal formatting. Formatting is observational and does not admit an error record as a certificate.\"\n    },\n    \"factorial\": {\n      \"line\": 65,\n      \"signature\": \"pub fn factorial(n: usize) -> Result<BigUint, CombinatoricsError>\",\n      \"obligation\": \"Reject n>20000 before arithmetic, otherwise return exactly n! as BigUint, including 0!=1.\"\n    },\n    \"binomial\": {\n      \"line\": 80,\n      \"signature\": \"pub fn binomial(n: u64, k: u64) -> Result<BigUint, CombinatoricsError>\",\n      \"obligation\": \"Return zero for k>n. Otherwise reduce to m=min(k,n-k), reject m>16384, and compute exact choose(n,k) by the integral multiplicative recurrence. No float or truncation error is admitted.\"\n    },\n    \"budget\": {\n      \"line\": 100,\n      \"signature\": \"fn budget(what: &'static str, requested: &BigUint, limit: usize) -> Result<(), CombinatoricsError>\",\n      \"obligation\": \"Compare exact BigUint requested cardinality against the usize limit. Equality is allowed; only a larger request returns BudgetExceeded with a cloned exact request.\"\n    },\n    \"next_permutation\": {\n      \"line\": 112,\n      \"signature\": \"pub fn next_permutation(items: &mut [usize]) -> bool\",\n      \"obligation\": \"On an arbitrary mutable usize word, return the next lexicographic distinct permutation of its multiset. If no successor exists, return false and leave the slice unchanged. Find the longest decreasing suffix and swap the pivot with the rightmost greater item, then reverse only that suffix.\"\n    },\n    \"next_combination\": {\n      \"line\": 133,\n      \"signature\": \"pub fn next_combination(combination: &mut [usize], n: usize) -> bool\",\n      \"obligation\": \"Reject invalid, out-of-range or non-increasing coordinates with false and no mutation. For a valid sorted k-subset of 0..n, increment the rightmost coordinate below n-k+i and rebuild its minimal increasing suffix; terminal or empty subsets return false unchanged.\"\n    },\n    \"permutations\": {\n      \"line\": 153,\n      \"signature\": \"pub fn permutations(n: usize, limit: usize) -> Result<Vec<Vec<usize>>, CombinatoricsError>\",\n      \"obligation\": \"Collect the admitted Permutations iterator. The row count limit is checked before allocation; output ownership and allocator availability remain explicit caller/runtime boundaries.\"\n    },\n    \"combinations\": {\n      \"line\": 157,\n      \"signature\": \"pub fn combinations(\\n    n: usize,\\n    k: usize,\\n    limit: usize,\\n) -> Result<Vec<Vec<usize>>, CombinatoricsError>\",\n      \"obligation\": \"Collect the admitted Combinations iterator; preserve its cardinality, width, zero-result convention and error order.\"\n    },\n    \"weak_compositions\": {\n      \"line\": 165,\n      \"signature\": \"pub fn weak_compositions(\\n    total: usize,\\n    parts: usize,\\n    limit: usize,\\n) -> Result<Vec<Vec<usize>>, CombinatoricsError>\",\n      \"obligation\": \"First admit parts<=4096. Compute exact stars-and-bars count, with zero parts giving one empty row exactly when total is zero. Reject checked upper-index overflow or excessive binomial choice, then reject row count above caller limit, then exact count*parts above 1048576 cells. Only then enumerate rows lexicographically with nonnegative entries summing to total.\"\n    },\n    \"admit_width\": {\n      \"line\": 197,\n      \"signature\": \"fn admit_width(what: &'static str, width: usize) -> Result<(), CombinatoricsError>\",\n      \"obligation\": \"Accept equality at width 4096; reject larger widths with ArgumentTooLarge carrying the declared operation and width, before any output vector allocation.\"\n    },\n    \"collect_compositions\": {\n      \"line\": 208,\n      \"signature\": \"fn collect_compositions(total: usize, parts: usize) -> Vec<Vec<usize>>\",\n      \"obligation\": \"Private admitted inputs only. Handle zero parts directly; otherwise start at [0,...,total], emit each row and apply the iterative lexicographic successor. Constant call-stack depth, one width-sized scratch vector, and one required owned clone per output row.\"\n    },\n    \"next_composition\": {\n      \"line\": 226,\n      \"signature\": \"fn next_composition(current: &mut [usize]) -> bool\",\n      \"obligation\": \"Private nonempty admitted row only. Locate the rightmost positive coordinate after the first, move one unit to its predecessor, and put the remainder in the final slot. The suffix was zero; preserve sum, positivity, width and lexicographic order. Return false exactly at [total,0,...,0].\"\n    },\n    \"Permutations::new\": {\n      \"line\": 246,\n      \"signature\": \"pub fn new(n: usize, limit: usize) -> Result<Self, CombinatoricsError>\",\n      \"obligation\": \"Compute admitted exact factorial, then check row budget before allocating [0,..,n). Own a private initial state; the first item exists also at n=0.\"\n    },\n    \"Permutations::next\": {\n      \"line\": 259,\n      \"signature\": \"fn next(&mut self) -> Option<Vec<usize>>\",\n      \"obligation\": \"Emit the initial word once, then each next permutation exactly once; set current=None at exhaustion and remain exhausted on repeated next calls. Clone returns independently owned iterator state.\"\n    },\n    \"Combinations::new\": {\n      \"line\": 282,\n      \"signature\": \"pub fn new(n: usize, k: usize, limit: usize) -> Result<Self, CombinatoricsError>\",\n      \"obligation\": \"Compute admitted binomial, check row budget, and only for nonempty mathematical families check k<=4096 before allocating [0,..,k). k>n creates an exhausted iterator even for huge k. Exact equality of n and k does not bypass width admission.\"\n    },\n    \"Combinations::next\": {\n      \"line\": 302,\n      \"signature\": \"fn next(&mut self) -> Option<Vec<usize>>\",\n      \"obligation\": \"Emit initial subset once, then each successor; clear state on exhaustion. Empty subset is one row when k=0, while k>n starts exhausted. Returned rows are owned.\"\n    },\n    \"to_u64\": {\n      \"line\": 317,\n      \"signature\": \"pub fn to_u64(count: &BigUint) -> Option<u64>\",\n      \"obligation\": \"Return Some exact value only when the BigUint fits u64; larger counts return None without truncation.\"\n    }\n  },\n  \"invariants\": [\n    \"Factorial maintains product=i! after processing i. Binomial maintains result=choose(n-m+i,i); multiplying by n-m+i then dividing by i is integral by the standard subset-counting identity. BigUint multiplication cannot wrap; n-m+i<=n and i>=1 prevent machine overflow and zero division. Choice m is bounded before the loop. No factorial or binomial value is converted approximately.\",\n    \"Permutation suffix search first proves n>=2, then maintains 0<=i<n while decreasing it. If i=0, no successor exists and the word has not been touched. Otherwise a greater suffix element exists because items[i]>items[i-1]; the decreasing j search must stop at or above i. The swap and reversal are in range and construct the least lexicographic greater multiset permutation. Iteration therefore terminates on the finite family without repeats.\",\n    \"Combination validation precedes n-k subtraction. For a valid increasing subset, coordinate i is at most n-k+i<=n-1. A strict smaller-than guard makes increment safe and leaves room for every reconstructed suffix coordinate. Lexicographic successor is therefore total on admitted slices, strictly increasing until the final subset, and preserves cardinality and bounds. Invalid input returns false without writes.\",\n    \"Weak-composition zero-part cases are explicit. Positive parts satisfy the stars-and-bars bijection between nonnegative rows summing to total and subsets of total+parts-1 positions; upper-index addition is checked before binomial. Width is bounded before counting, row count before cells, and exact BigUint cell count before scratch/output allocation. Count zero implies no emitted rows; parts zero with total zero emits precisely one empty row.\",\n    \"In an admitted nonempty composition row, every entry is at most total and the sum is total. The chosen rightmost positive coordinate after index zero has only zeros to its right. Removing that coordinate, transferring one unit left and moving its remainder to the last coordinate preserves total. The predecessor is strictly below total before increment, so even total=usize::MAX cannot overflow. This is exactly the next lexicographic row: keep the longest possible prefix, increase its last mutable coordinate minimally, and minimize the suffix by concentrating its sum at the final coordinate. The terminal row has all mass in coordinate zero. Every row occurs once, and the finite admitted count bounds traversal.\",\n    \"Private iterator fields cannot be replaced by callers. Constructors check domain, row budget and owned-width bounds before vector construction. Clone preserves these invariants. Iterator failure/exhaustion clears state; raw error records and diagnostic strings do not certify mathematical models. No deserialization, unsafe block, arbitrary callback or unchecked public model constructor appears.\",\n    \"Weak compositions retain at most 1048576 scalar cells and a width<=4096 scratch row, with constant call-stack depth instead of recursive depth=parts. On the tested 64-bit target a conservative row-header overhead is at most 24 times the cell bound, plus scalar cells and scratch. This is a logical storage bound, not an allocator or process-memory guarantee. Eager permutations/combinations honor caller row limits; their aggregate memory budget is not promised independently of caller limits. Lazy iterators keep only one bounded row; each emitted row is necessarily owned.\",\n    \"Derived thiserror formatting, Debug/Clone/Eq, concrete Vec and BigUint operations are standard-library/compiler/dependency trust. The source metric parser does not expand their implementations. No Rust/MIR proof or cross-repository provider attestation is claimed. Native exact oracles and source invariant arguments remain distinct from machine-checked mathematical proof.\"\n  ],\n  \"failure_paths\": {\n    \"CombinatoricsError::violated_invariant\": \"Map the two raw error variants to their exact declared invariant strings; no claim that arbitrary raw error fields were admitted.\",\n    \"CombinatoricsError::measured_parameters\": \"Return the exact ordered diagnostic key/value pairs for either variant using decimal formatting. Formatting is observational and does not admit an error record as a certificate.\",\n    \"factorial\": \"Reject n>20000 before arithmetic, otherwise return exactly n! as BigUint, including 0!=1.\",\n    \"binomial\": \"Return zero for k>n. Otherwise reduce to m=min(k,n-k), reject m>16384, and compute exact choose(n,k) by the integral multiplicative rec