   },\n    \"validate_point\": {\n      \"line\": 94,\n      \"signature\": \"pub fn validate_point(&self, point: PhasePoint) -> Result<(), WeylSystemError>\",\n      \"obligation\": \"Reject q>=dim or p>=dim with exact raw coordinates and modulus; admit equality-below values only. No arithmetic is performed before domain rejection.\"\n    },\n    \"symplectic_form\": {\n      \"line\": 103,\n      \"signature\": \"pub fn symplectic_form(&self, u: PhasePoint, v: PhasePoint) -> Result<usize, WeylSystemError>\",\n      \"obligation\": \"Validate u before v, then return (u.q*v.p-u.p*v.q) in the least nonnegative modular representative. Products are reduced first and dim is added before subtraction.\"\n    },\n    \"commutes\": {\n      \"line\": 112,\n      \"signature\": \"pub fn commutes(&self, u: PhasePoint, v: PhasePoint) -> Result<bool, WeylSystemError>\",\n      \"obligation\": \"Propagate coordinate errors; return true exactly for zero symplectic form.\"\n    },\n    \"add\": {\n      \"line\": 116,\n      \"signature\": \"pub fn add(&self, u: PhasePoint, v: PhasePoint) -> Result<PhasePoint, WeylSystemError>\",\n      \"obligation\": \"Validate u then v, then add both coordinates modulo dim, preserving the admitted representative range.\"\n    },\n    \"isotropic_rays\": {\n      \"line\": 125,\n      \"signature\": \"pub fn isotropic_rays(&self) -> Result<Vec<Vec<PhasePoint>>, WeylSystemError>\",\n      \"obligation\": \"Reject any composite admitted modulus before allocation, then produce the vertical ray followed by all slope rays in slope order, each point ordered by its free coordinate. Every ray includes the origin once. Field facts apply only after prime admission.\"\n    },\n    \"certify_ray_partition\": {\n      \"line\": 153,\n      \"signature\": \"pub fn certify_ray_partition(prime: usize) -> Result<(usize, usize), WeylSystemError>\",\n      \"obligation\": \"Generate the admitted prime rays and independently count their nonzero union. Check p+1 rays and p*p-1 distinct nonzero points; report the count tuple only if both checks hold. No caller-supplied certificate or authenticity claim.\"\n    },\n    \"count_nonzero\": {\n      \"line\": 175,\n      \"signature\": \"fn count_nonzero(rays: &[Vec<PhasePoint>]) -> usize\",\n      \"obligation\": \"Compute the set union cardinality after excluding the literal origin, irrespective of duplicate raw records in its private input.\"\n    },\n    \"collect_nonzero\": {\n      \"line\": 183,\n      \"signature\": \"fn collect_nonzero(seen: &mut BTreeSet<PhasePoint>, ray: &[PhasePoint])\",\n      \"obligation\": \"Insert each non-origin raw coordinate into the owned ordered set; skip origin and deduplicate. This is a private union helper, not a coordinate admission function.\"\n    }\n  },\n  \"invariants\": [\n    \"PhasePoint has public fields and its new method is only a raw record constructor. DiscreteWeylSystem carries a private modulus admitted once in 2..=256. All exported point arithmetic now calls the same relative coordinate gate, left operand before right. Composites support ring addition/alternating form; only ray generation requires primality.\",\n    \"For admitted coordinates each product is <=255 squared=65025 and sum <=510. Residues term1,term2<d make d+term1>=term2 and <=511, so modular subtraction never underflows. The exact result is the determinant modulo d, including even and composite d. Both addition results lie below d. No float, saturation, division by zero or unchecked large-operand arithmetic occurs.\",\n    \"Trial divisors 2..p find a proper divisor exactly for composite p. At a prime p, the vertical ray (0,y) and slope rays (x,m*x mod p) each have p distinct entries via their free coordinate. The actual field direction theorem gives a unique direction to each nonzero point, isotropy, and disjointness outside origin. Its Option-field direction count is p+1. Natural representatives compute those field coordinates exactly.\",\n    \"Generation owns one outer vector and one exact-capacity vector per required ray. At most 257*256 phase records are constructed by the admitted domain (the actual largest prime is 251). count_nonzero stores at most p*p-1 records and tests both output counts against the checked formula; failure is typed. Those checks corroborate this private generator; they are not a universal checker for arbitrary malformed raw ray matrices.\",\n    \"The independent inverse-classification oracle enumerates every coordinate and groups nonzero points by y/x or vertical, independently of production slope enumeration, for every prime modulus through 256. It compares complete ordered rays, checks each point with its direction anchor and verifies the distinct union/certificate. Every composite modulus is refused for rays. Exhaustive small-ring pairs and i128 determinant reduction also check signs, zero divisors, boundary moduli and both operand gates.\",\n    \"All 13 production bodies have structural maxima CCN 6, cognitive 7, nesting 2. Point operations have constant work/no heap allocation except an error diagnostic only when requested. Trial division is O(d), ray generation O(d squared) records with no redundant inner allocations, and union/certification O(d squared log d) set work/storage bounded by the admitted modulus. Standard collection allocation remains TCB. Returned raw vectors/count tuples carry no authority.\"\n  ],\n  \"failure_paths\": {\n    \"violated_invariant\": \"Exhaustively describe the four typed error invariants without granting authority.\",\n    \"measured_parameters\": \"Report the exact dimension/range, coordinate/modulus, or generated partition count operands.\",\n    \"PhasePoint::new\": \"Construct a raw public coordinate record without claiming admission; arbitrary usize coordinates remain representable records.\",\n    \"DiscreteWeylSystem::new\": \"Admit every modulus in 2..=256, including composites, and reject others before arithmetic or allocation. Private dim has no mutation route.\",\n    \"dim\": \"Return the admitted immutable modulus.\",\n    \"validate_point\": \"Reject q>=dim or p>=dim with exact raw coordinates and modulus; admit equality-below values only. No arithmetic is performed before domain rejection.\",\n    \"symplectic_form\": \"Validate u before v, then return (u.q*v.p-u.p*v.q) in the least nonnegative modular representative. Products are reduced first and dim is added before subtraction.\",\n    \"commutes\": \"Propagate coordinate errors; return true exactly for zero symplectic form.\",\n    \"add\": \"Validate u then v, then add both coordinates modulo dim, preserving the admitted representative range.\",\n    \"isotropic_rays\": \"Reject any composite admitted modulus before allocation, then produce the vertical ray followed by all slope rays in slope order, each point ordered by its free coordinate. Every ray includes the origin once. Field facts apply only after prime admission.\",\n    \"certify_ray_partition\": \"Generate the admitted prime rays and independently count their nonzero union. Check p+1 rays and p*p-1 distinct nonzero points; report the count tuple only if both checks hold. No caller-supplied certificate or authenticity claim.\",\n    \"count_nonzero\": \"Compute the set union cardinality after excluding the literal origin, irrespective of duplicate raw records in its private input.\",\n    \"collect_nonzero\": \"Insert each non-origin raw coordinate into the owned ordered set; skip origin and deduplicate. This is a private union helper, not a coordinate admission function.\"\n  },\n  \"trust_boundary\": \"Fixed dimension 2..=256 bounds owned work and integer intermediates on the compiled 64-bit target (bounds also fit 32-bit usize). Allocator/compiler/standard collections/thiserror are TCB; no out-of-memory recovery or constant-time guarantee. Lean proves actual ring/field/finite-set facts. Rust representative arithmetic, prime trial division, ordered loops, private ownership and Vec-to-Finset correspondence are explicit source arguments corroborated by independent tests, not extracted Rust/MIR or allocator proofs.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. These are exact modular phase-coordinate operations and admitted operator bundles; no complex matrices/eigenvectors, actual unbiased eigenbasis construction, continuous representation, or classification/completeness theorem for composite dimensions.\",\n    \"Lean proves actual ring/field/finite-set facts. Rust representative arithmetic, prime trial division, ordered loops, private ownership and Vec-to-Finset correspondence are explicit source arguments corroborated by independent tests, not extracted Rust/MIR or allocator proofs.\",\n    \"The exact standalone tfqm_combinatorics crate and copied subjects are compiled with real siblings. Root manifests are pinned for import disambiguation; external omega providers and whole-workspace success are not inferred.\",\n    \"Legacy in-source mutation counts are not current accounting. Final native receipts preserve all six outcomes; earlier MUB failures, its 13-killed/1-survived campaign, and rejected proof remain separate and are not used as passing proof evidence.\",\n    \"Fixed dimension 2..=256 bounds owned work and integer intermediates on the compiled 64-bit target (bounds also fit 32-bit usize). Allocator/compiler/standard collections/thiserror are TCB; no out-of-memory recovery or constant-time guarantee.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/weyl_systems.json\",\n      \"sha256\": \"383e8c01a7660087d775603419dd93a6fb69dfab016cbcf664a17cbec271a6e5\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
