      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/combinatorics/cartesian_words.rs\",\n    \"sha256\": \"b49ba3a662945a1a52006311d08de1c627d00170953340887ec01c10e9445331\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"domain\": \"Finite usize alphabet sizes and widths admitted by caller/hard width and exact word-count budgets; zero alphabet and zero width have explicit Cartesian-product semantics.\",\n    \"behavior\": [\n      \"Admit width <= min(caller max_width,4096) before exponentiation or word allocation. Compute exact base^width as BigUint, reject cardinality above max_words, then convert the admitted count to usize. Private state is None exactly for zero count and otherwise the all-zero word. Empty width has one empty word, even for base zero. Typed diagnostic priority and exact requested cardinalities are preserved.\",\n      \"Return the full initially admitted base^width throughout iteration and cloning; this is not the remaining length and no ExactSizeIterator promise is added.\",\n      \"Take the private current owned vector or remain exhausted. Borrow it to construct the successor, then return it by ownership. This removes the former extra output clone while preserving values, order, independent output buffers and cloned-iterator independence.\",\n      \"For a valid current word, clone one future-state buffer and traverse digits right to left. Use checked addition, return on the first increment below base, and otherwise reset carried digits to zero. A complete carry, including the empty word, returns None. The source constructor guarantees every observed current digit is admitted; the checked-add fallback remains defensive.\"\n    ],\n    \"capability\": \"L4 bounded exact Cartesian iterator with immutable admitted state and typed allocation admission.\"\n  },\n  \"operations\": {\n    \"CartesianWords::new\": {\n      \"line\": 17,\n      \"signature\": \"pub fn new(\\n        base: usize,\\n        width: usize,\\n        max_words: usize,\\n        max_width: usize,\\n    ) -> Result<Self, CombinatoricsError>\",\n      \"obligation\": \"Admit width <= min(caller max_width,4096) before exponentiation or word allocation. Compute exact base^width as BigUint, reject cardinality above max_words, then convert the admitted count to usize. Private state is None exactly for zero count and otherwise the all-zero word. Empty width has one empty word, even for base zero. Typed diagnostic priority and exact requested cardinalities are preserved.\"\n    },\n    \"cardinality\": {\n      \"line\": 60,\n      \"signature\": \"pub fn cardinality(&self) -> usize\",\n      \"obligation\": \"Return the full initially admitted base^width throughout iteration and cloning; this is not the remaining length and no ExactSizeIterator promise is added.\"\n    },\n    \"Iterator::next\": {\n      \"line\": 68,\n      \"signature\": \"fn next(&mut self) -> Option<Self::Item>\",\n      \"obligation\": \"Take the private current owned vector or remain exhausted. Borrow it to construct the successor, then return it by ownership. This removes the former extra output clone while preserving values, order, independent output buffers and cloned-iterator independence.\"\n    },\n    \"advance\": {\n      \"line\": 75,\n      \"signature\": \"fn advance(word: &[usize], base: usize) -> Option<Vec<usize>>\",\n      \"obligation\": \"For a valid current word, clone one future-state buffer and traverse digits right to left. Use checked addition, return on the first increment below base, and otherwise reset carried digits to zero. A complete carry, including the empty word, returns None. The source constructor guarantees every observed current digit is admitted; the checked-add fallback remains defensive.\"\n    }\n  },\n  \"invariants\": [\n    \"All iterator fields are private. Only new constructs ordinary instances and it first bounds width by both caller and hard limits. It then computes exact BigUint power and refuses a count greater than the caller max_words before allocating the owned digit vector. Since max_words is usize, accepted count necessarily fits usize; the conversion fallback is unreachable after this comparison. Width<=4096 also makes u32 conversion failure unreachable. Clone preserves admitted state and deep-copies the current Vec. No unchecked constructor, mutation accessor, Deserialize or Default bypass exists.\",\n    \"An admitted nonempty current word has fixed admitted width and every digit below base. For a zero alphabet, positive width has count zero and no current vector; width zero has count one and the empty vector. The all-zero initialization has rank zero. For valid positive-width words, each digit is at most base-1, so digit+1<=base<=usize::MAX and checked_add succeeds without wrap. Thus the internal fallback cannot silently truncate an admitted enumeration.\",\n    \"Reverse the Rust most-significant-first word to obtain the least-significant-first model. Its positional value is d0 + base*(d1 + ...), below base^width. The full carry model proves successor length, validity and value=old+1. Exhaustion occurs exactly when old+1=base^width. Valid fixed-width words have injective values via modulus and quotient. Starting at the zero vector, the source therefore emits every integer rank from 0 through count-1 once, without gaps or duplicate words, and then remains exhausted. Fixed-width positional rank agrees with the Rust lexicographic order. The model proofs cover all admitted abstract digit lists; reverse-Vec traversal and constructor/BigUint correspondence receive this separate source argument.\",\n    \"The updated next moves the current Vec out with take, borrows it for advance and returns it unchanged. Before the change, next first cloned current and advance cloned that output again, then replaced the original current. After the change, only the future-state clone is needed. Outputs, successor state, initial cardinality, exhaustion and clone behavior are unchanged on all admitted inputs. A caller mutating an emitted Vec or advancing a cloned iterator cannot mutate the other private vector.\",\n    \"On the tested 64-bit target, width admission bounds owned digit buffers to 4096 usize cells each; a next call holds the moved output and one future-state clone, with constant call-stack depth and O(width) traversal/copy work. Exact power computation has at most 4096*64 significant result bits for a usize base, but standard BigUint implementation costs and allocation availability remain TCB. Row budget bounds the total number of emitted words; callers control how many owned outputs they retain. No global process-memory, allocation-success or constant-time promise is made.\",\n    \"All four production bodies meet calibrated maxima CCN 6, cognitive 4 and nesting 2. Concrete Vec allocation, Option take/map, derived Clone/Debug, checked integer addition and BigUint power/conversion are explicitly reviewed; source metrics do not expand standard-library implementations or prove Rust/MIR. Raw error values are diagnostics and do not attest mathematical authority.\"\n  ],\n  \"failure_paths\": {\n    \"CartesianWords::new\": \"Admit width <= min(caller max_width,4096) before exponentiation or word allocation. Compute exact base^width as BigUint, reject cardinality above max_words, then convert the admitted count to usize. Private state is None exactly for zero count and otherwise the all-zero word. Empty width has one empty word, even for base zero. Typed diagnostic priority and exact requested cardinalities are preserved.\",\n    \"cardinality\": \"Return the full initially admitted base^width throughout iteration and cloning; this is not the remaining length and no ExactSizeIterator promise is added.\",\n    \"Iterator::next\": \"Take the private current owned vector or remain exhausted. Borrow it to construct the successor, then return it by ownership. This removes the former extra output clone while preserving values, order, independent output buffers and cloned-iterator independence.\",\n    \"advance\": \"For a valid current word, clone one future-state buffer and traverse digits right to left. Use checked addition, return on the first increment below base, and otherwise reset carried digits to zero. A complete carry, including the empty word, returns None. The source constructor guarantees every observed current digit is admitted; the checked-add fallback remains defensive.\"\n  },\n  \"trust_boundary\": \"All four production bodies meet calibrated maxima CCN 6, cognitive 4 and nesting 2. Concrete Vec allocation, Option take/map, derived Clone/Debug, checked integer addition and BigUint power/conversion are explicitly reviewed; source metrics do not expand standard-library implementations or prove Rust/MIR. Raw error values are diagnostics and do not attest mathematical authority.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. The formal positional list model uses reversed digit order relative to Rust vectors; no extracted Rust/MIR or machine-checked allocator theorem.\",\n    \"Proofs cover exact successor, positional injectivity/range, exhaustion and arithmetic boundaries. Source review connects BigUint power, constructor admission, reverse traversal and ownership.\",\n    \"Only the actual local combinatorics crate and one-fault copies are compiled. External omega and whole-workspace results are outside the claim.\",\n    \"The static PROVENANCE mutation-count annotation is historical text; the current source-pinned recipe and six-outcome native ledger establish actual sensitivity.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/cartesian_words.json\",\n      \"sha256\": \"8b035900ceb41c6b61c48f31a1ca5f598d9765f5afdbe8770e3689979003be00\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
