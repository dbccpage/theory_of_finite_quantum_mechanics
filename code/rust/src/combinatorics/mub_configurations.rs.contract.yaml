    "domain": "Modular phase coordinates with dimension 2..256; prime-only generated rays. MUB bundles have exactly d-1 distinct nonidentity in-domain mutually commuting points, at most d+1 globally disjoint bundles. The raw bound arithmetic helper accepts any representable dim+1.",
