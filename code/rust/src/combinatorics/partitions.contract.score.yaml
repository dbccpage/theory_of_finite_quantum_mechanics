 actual realization, conjugacy size and denominator divisibility. Grouping the nontrivial multiset product gives product length^multiplicity, while 1-cycles contribute 1^count=1 and their count! fixed-point factor. Thus the source denominator is positive, divides n!, and BigUint integer division loses no fraction. Input order is irrelevant because exact multiplicities are stored in a BTreeMap.\",\n    \"All five production bodies meet maxima CCN 9, cognitive 7, nesting 3. Counting performs O(n squared) exact BigUint additions in O(n) values. Counting values are bounded by the positive-composition count 2^(n-1) for n>0, so their bit growth is finite under n<=1000. Enumeration visits at most the output-path prefixes and copies each required owned row, with O(p(n)*n) scalar work/storage upper bound under the conservative cap. Conjugacy scans caller input, then has map size, factorial and exponent work bounded by admitted total 20000. Standard-library and BigUint implementation costs/allocator availability remain TCB; no global heap or constant-time promise.\",\n    \"Public inputs are borrowed or scalar and no caller data is mutated. Local workspaces drop on typed failure. Output vectors and BigUint values are owned results; raw returned values are not authority or intrinsic proof certificates. Runtime construction/stack correspondence and DP completeness are source arguments corroborated independently, distinct from the abstract Mathlib model.\"\n  ],\n  \"failure_paths\": {\n    \"admit\": \"Accept n<=1000 including the boundary; reject larger arguments before DP vector allocation with exact typed operation/argument/maximum fields.\",\n    \"partition_count\": \"After admission initialize the empty partition count to one. For each allowed part ascending, update totals ascending by adding the already-updated same-part predecessor. Disjoint slices borrow the summand without an owned BigUint clone. Return exact p(n), including p(0)=1.\",\n    \"partitions\": \"Compute the admitted exact count first, reject count above caller row budget, then reject conservative count*n above 1048576 cells. Equality is allowed. Only then construct all positive nonincreasing rows summing to n, in descending lexicographic order. Zero has exactly the empty row. This bound can conservatively refuse a request whose actual shorter rows would fit.\",\n    \"collect_partitions\": \"Private admitted n only. Explicit frames record remaining sum and next descending part; current is the path prefix. Zero remaining emits an owned row, exhausted frames backtrack, and each positive choice decreases both the parent cursor and child remaining. Preserve original recursive traversal order with a constant machine call stack and at most n+1 frames.\",\n    \"conjugacy_class_size\": \"Reject any zero cycle length first, then checked total-sum overflow. Admit factorial(total)<=the supported argument domain before map/power work. Count exact multiplicities, checked-convert each exponent, and compute n! divided by product length^multiplicity * multiplicity!. Empty and unsorted cycle lists are supported; all accepted positive lists give an integral class size. Oversized totals now refuse before multiplicity work, intentionally changing diagnostic argument priority for some formerly oversized inputs.\"\n  },\n  \"trust_boundary\": \"Public inputs are borrowed or scalar and no caller data is mutated. Local workspaces drop on typed failure. Output vectors and BigUint values are owned results; raw returned values are not authority or intrinsic proof certificates. Runtime construction/stack correspondence and DP completeness are source arguments corroborated independently, distinct from the abstract Mathlib model.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. Native tests and mathematical model proofs have explicit separate scopes; no extracted Rust/MIR or machine-checked allocator theorem.\",\n    \"Only the actual standalone combinatorics crate and one-fault copies are compiled. No external omega or whole-workspace success is inferred.\",\n    \"Static PROVENANCE mutation-count annotations are legacy text; source-pinned recipes and literal six-outcome receipts establish actual challenge sensitivity.\",\n    \"DP and explicit-stack completeness and the Rust-to-multiset/fixed-point correspondence are separate source arguments; the model directly proves actual Mathlib partition/conjugacy and arithmetic/admission facts.\",\n    \"The eager cell bound is conservative count*n, not actual row-cell equality. The new total-first conjugacy lifecycle intentionally changes some oversized-input diagnostic details.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/partitions.json\",\n      \"sha256\": \"225adfe75edf65de8a0c244131545d15819293841ff339dabbd6a121b09ef2b4\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
