      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Rust\",\n    \"path\": \"code/rust/src/governance/src/score.rs\",\n    \"sha256\": \"b6821d07cbfbc75e04058a85e029972452e0a7a4405376550695c6c676e61796\"\n  },\n  \"assessment_id\": \"governance-crate-self-assessment-v1\",\n  \"assessment_status\": \"complete\",\n  \"assessor\": \"Claude Opus 5.5 (model-drafted; requires maintainer review)\",\n  \"basis\": {\n    \"G1\": \"Claim URN urn:tfqm:governance:score:v1, AuthorityEffect None, exact source digest. Requirement R1 maps to the exported symbols and back (contract.requirements); consumers are verify.rs, descriptor.rs, policy.rs and the CLI, all in this crate and audited in this review.\",\n    \"G2\": \"Non-Numeric profile. Domains are closed enums; text enters only through FromStr, which rejects every malformed spelling tested (lower case, whitespace, B+, A-, L0, L6, extra characters, non-ASCII). Composite follows sections 1.2 and 1.4 including the known-E rule (scenario 4).\",\n    \"G3\": \"No unsafe (crate forbids it); clippy denies unwrap, expect, indexing, panic and arithmetic side effects in non-test code, and every function is a match over closed enums or a bounded str::get, so no production path can panic; the only error is the typed ScoreError.\",\n    \"G4\": \"Exhaustive enumeration as the generator: all 30 tokens round-trip, every grade at every gate position is checked for the minimum, all 30 tokens are checked against the floor (10 admitted). Every ScoreError variant is produced by a negative test. Mutation ratio from the campaign below. Campaign (governance/tools/mutation_campaign.py, 18 operator kinds over non-test code): killed 10, survived 0, invalid 1, inconclusive 0, no mutant classed equivalent; R = 1.0. Suites: 47 library tests and 10 binary tests pass (cargo-test.log).\",\n    \"G5\": \"Production functions: lizard max CCN as recorded in metrics; clippy cognitive complexity <= 15 and nesting <= 3 hold as errors. Not claimed A: allocation behaviour (unassessed() allocates a small Vec) was not benchmarked. Max production CCN 6 (as_str) over 21 functions; clippy -D cognitive_complexity (15) -D excessive_nesting (3) exit 0.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-10-23T04:46:53+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/governance/20261023T043243Z/mutation.json\",\n      \"sha256\": \"7bb3ff9e387a1ecbee3b3b1c8615334e194346f2de5d7797aff976880094715a\"\n    },\n    {\n      \"path\": \"evidence/governance/20261023T043243Z/receipt.json\",\n      \"sha256\": \"b63b0466feb0141bd6425c4f1796d050b55be1108abc2d6e5e6317f1b133586b\"\n    },\n    {\n      \"path\": \"evidence/governance/20261023T043243Z/cargo-test.log\",\n      \"sha256\": \"16d0fb70d7fdec31908de12211548f7f43e7c2f44a99e86df912d8e157997a68\"\n    },\n    {\n      \"path\": \"evidence/governance/20261023T043243Z/clippy.log\",\n      \"sha256\": \"3bb7a9413909f79ffd70fb2b7636a0e56ea51610f0886b830ddfeb375e1da7a8\"\n    },\n    {\n      \"path\": \"evidence/governance/20261023T043243Z/lizard.csv\",\n      \"sha256\": \"f9bb83555dc2543508c959b28f6e99098317d851d1c009f0b9550d5ab6a72bf5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"41f114724413adcc3c1dea465e027531a5665bbf65e748bc02f4005d2e90660f\"\n    },\n    {\n      \"path\": \"governance/policy.json\",\n      \"sha256\": \"2e3f68aefd419a78c8f9c33d630d5f2df2bbde95543c3fe883edb99a05bfc235\"\n    }\n  ],\n  \"gates\": {\n    \"G1\": \"B\",\n    \"G2\": \"B\",\n    \"G3\": \"B\",\n    \"G4\": \"B\",\n    \"G5\": \"B\"\n  },\n  \"grade_ceiling\": \"B\",\n  \"is_complete\": true,\n  \"level\": \"L4\",\n  \"level_basis\": \"L4 on production craft: closed enumerations make invalid levels, grades, gates and tokens unrepresentable; the single text entry point is strict parsing with a typed ScoreError; the weakest-link and unassessed rules of SCORING.md sections 1.2 and 1.4 are encoded once. It is the smallest module and the most debatable L4 claim: a reviewer may judge it L3 (structured domain modelling), which would put it below the floor.\",\n  \"metrics\": {\n    \"clippy_cognitive_threshold\": 15,\n    \"clippy_nesting_threshold\": 3,\n    \"lizard_max_ccn_production\": 6,\n    \"lizard_max_ccn_tests\": 3,\n    \"lizard_production_functions\": 21\n  },\n  \"mutation_accounting\": {\n    \"conservative_ratio\": 1.0,\n    \"demonstrably_equivalent\": 0,\n    \"inconclusive\": 0,\n    \"invalid\": 1,\n    \"killed\": 10,\n    \"survived\": 0,\n    \"unrun\": 0\n  },\n  \"open_higher_grade_findings\": [\n    \"No property-based generators outside score.rs (G4 B needs them).\",\n    \"Panic freedom rests on clippy lints and review, not on a proof (G3 B).\",\n    \"Allocation behaviour not benchmarked (G5 A).\",\n    \"Grades drafted by the model that wrote the code; an independent review is still needed.\"\n  ],\n  \"profile\": \"Non-Numeric\",\n  \"rubric\": {\n    \"path\": \"SCORING.md\",\n    \"sha256\": \"41f114724413adcc3c1dea465e027531a5665bbf65e748bc02f4005d2e90660f\"\n  },\n  \"schema_version\": \"2.0.0\",\n  \"score_token\": \"L4B\"\n}\n",
