[package]
name = "tfqm_number_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_number_theory"
path = "lib.rs"

[features]
default = []

[dependencies]
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
tfqm_combinatorics = { path = "../combinatorics" }
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
