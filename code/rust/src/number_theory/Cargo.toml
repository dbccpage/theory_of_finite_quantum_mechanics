[package]
name = "tfqm_number_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_number_theory"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:linear_algebra", "dep:omega_kernel"]

[dependencies]
linear_algebra = { version = "0.1.0", optional = true }
omega_kernel = { version = "0.1.0", optional = true }
omega_combinatorics = { package = "tfqm_combinatorics", path = "../combinatorics" }
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0"
