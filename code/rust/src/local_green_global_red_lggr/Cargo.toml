[package]
name = "tfqm_local_green_global_red_lggr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_local_green_global_red_lggr"
path = "lib.rs"

[features]
default = []

[dependencies]
blake3 = "1.8"
engine_policy = { path = "../../../../vendor/engine/engine_policy" }
tfqm_holonomy = { path = "../holonomy" }
engine_homology = { path = "../../../../vendor/engine/engine_homology" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
engine_types = { path = "../../../../vendor/engine/engine_types" }
tfqm_functional = { path = "../functional" }
engine_replay = { path = "../../../../vendor/engine/engine_replay" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
