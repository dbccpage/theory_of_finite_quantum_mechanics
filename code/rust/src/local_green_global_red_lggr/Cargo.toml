[package]
autotests = false
name = "omega_epk"
version.workspace = true
edition = "2021"
description = "Evaluated Path Kernels (LGGR I, II, III, and V: exact path composition, soundness check, and detector adequacy)."
authors = ["Anomalon Contributors"]
license.workspace = true

[dependencies]
blake3 = "1.8"
omega_policy = { path = "../omega_policy" }
omega_holonomy = { path = "../omega_holonomy" }
omega_homology = { path = "../omega_homology" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
omega_types = { path = "../omega_types" }
omega_functional = { path = "../omega_functional" }
omega_replay = { path = "../omega_replay" }
omega_linear_algebra = { package = "linear_algebra", path = "../omega_linear_algebra" }

[dev-dependencies]
omega_kernel = { path = "../omega_kernel" }

