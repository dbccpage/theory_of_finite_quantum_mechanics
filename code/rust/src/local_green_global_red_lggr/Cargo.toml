[package]
name = "tfqm_local_green_global_red_lggr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_local_green_global_red_lggr"
path = "lib.rs"

[features]
default = []
external-omega = [
    "dep:omega_policy",
    "dep:omega_homology",
    "dep:omega_types",
    "dep:omega_replay",
    "dep:omega_linear_algebra",
    "dep:omega_kernel",
]

[dependencies]
blake3 = "1.8"
omega_policy = { version = "0.1.0", optional = true }
tfqm_holonomy = { path = "../holonomy" }
omega_homology = { version = "0.1.0", optional = true }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
omega_types = { version = "0.1.0", optional = true }
tfqm_functional = { path = "../functional" }
omega_replay = { version = "0.1.0", optional = true }
omega_linear_algebra = { package = "linear_algebra", version = "0.1.0", optional = true }
omega_kernel = { version = "0.1.0", optional = true }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
