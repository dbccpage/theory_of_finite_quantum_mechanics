[package]
autotests = false
name = "omega_higher_category_theory"
version.workspace = true
edition = "2021"
description = "Strict 2-categories, bicategories, exchange laws, and Mac Lane coherence for the Omega Engine"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
constants = { path = "../constants" }
omega_category_theory = { path = "../omega_category_theory" }
omega_kernel = { path = "../omega_kernel" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
proptest = "1.5"

[dev-dependencies]
tempfile = "3"
linear_algebra = { path = "../omega_linear_algebra" }
omega_number_theory = { path = "../omega_number_theory" }

