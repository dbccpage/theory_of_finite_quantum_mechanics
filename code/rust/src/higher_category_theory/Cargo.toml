[package]
name = "tfqm_higher_category_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_higher_category_theory"
path = "lib.rs"

[features]
default = []

[dependencies]
constants = { path = "../../../../vendor/engine/constants" }
tfqm_category_theory = { path = "../category_theory" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
proptest = "1.5"

[dev-dependencies]
tempfile = "3"
tfqm_number_theory = { path = "../number_theory" }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
