[package]
name = "tfqm_higher_category_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_higher_category_theory"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:constants", "dep:omega_kernel", "dep:linear_algebra"]

[dependencies]
constants = { version = "0.1.0", optional = true }
omega_category_theory = { package = "tfqm_category_theory", path = "../category_theory" }
omega_kernel = { version = "0.1.0", optional = true }
linear_algebra = { version = "0.1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
proptest = "1.5"

[dev-dependencies]
tempfile = "3"
omega_number_theory = { package = "tfqm_number_theory", path = "../number_theory" }
