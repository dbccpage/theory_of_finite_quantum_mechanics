[package]
name = "tfqm_functional"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_functional"
path = "lib.rs"

[features]
default = []

[dependencies]
tfqm_number_theory = { path = "../number_theory" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
sha2 = "0.10"
thiserror = "2.0"
anyhow = "1.0"
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }

[dev-dependencies]
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
