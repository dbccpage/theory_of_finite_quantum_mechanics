[package]
name = "tfqm_majorana"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_majorana"
path = "lib.rs"

[features]
default = []

[dependencies]
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
tfqm_number_theory = { path = "../number_theory" }
tfqm_lie_theory = { path = "../lie_theory" }
tfqm_functional = { path = "../functional" }
engine_homology = { path = "../../../../vendor/engine/engine_homology" }
num-traits = "0.2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tfqm_fusion_categories = { path = "../fusion_categories" }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
