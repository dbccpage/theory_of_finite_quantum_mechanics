[package]
name = "tfqm_majorana"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_majorana"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:linear_algebra", "dep:omega_homology"]

[dependencies]
linear_algebra = { version = "0.1.0", optional = true }
omega_number_theory = { package = "tfqm_number_theory", path = "../number_theory" }
omega_lie_theory = { package = "tfqm_lie_theory", path = "../lie_theory" }
omega_functional = { package = "tfqm_functional", path = "../functional" }
omega_homology = { version = "0.1.0", optional = true }
num-traits = "0.2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
omega_fusion_categories = { package = "tfqm_fusion_categories", path = "../fusion_categories" }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
