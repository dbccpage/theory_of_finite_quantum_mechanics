[package]
autotests = false
name = "omega_majorana"
version.workspace = true
edition = "2021"
description = "Majorana GF(2) parity schedule diagnostics + lattice play complexes (AuthorityEffect None; not GTLA terminalizer)"
license.workspace = true
authors = ["Anomalon Contributors"]

[dependencies]
linear_algebra = { path = "../omega_linear_algebra" }
omega_number_theory = { path = "../omega_number_theory" }
omega_lie_theory = { path = "../omega_lie_theory" }
omega_functional = { path = "../omega_functional" }
num-traits = "0.2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
omega_fusion_categories = { path = "../omega_fusion_categories" }
omega_homology = { path = "../omega_homology" }

[[test]]
name = "majorana_parity_algebra"
path = "../tests/omega_majorana/majorana_parity_algebra.rs"

[lib]
name = "omega_majorana"
path = "src/lib.rs"
