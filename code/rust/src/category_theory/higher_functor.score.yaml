  description: "Higher-Category Functors \u2014 Spec Section 10.  Three strictness levels: Strict 2-Functor:  preserves composition and identity by equality. Pseudofunctor:     preserves up to invertible 2-cells (coherence required). Lax Functor:       preserves up to possibly non-invertible 2-cells.  Direction convention (lax, not oplax): Composition:  F(g) \u2218 F(f) \u21d2 F(g \u2218 f) Unit:         id_{F(A)} \u21d2 F(id_A)  The reverse (oplax) direction would be: Composition:  F(g \u2218 f) \u21d2 F(g) \u2218 F(f) Unit:         F(id_A) \u21d2 id_{F(A)} This module uses the lax convention exclusively.  Boundary preservation (validation obligation, not compiler-enforced): For 1-cells:  src\u2081(F(f)) = F(src\u2081(f)),  tgt\u2081(F(f)) = F(tgt\u2081(f)) For 2-cells:  src\u2082(F(\u03b1)) = F(src\u2082(\u03b1)),  tgt\u2082(F(\u03b1)) = F(tgt\u2082(\u03b1))  Delivered checks inspect supplied boundary tables and coherence-name membership. They do not admit a 2-functor, inverse laws, coherence or complete map domains. Empty supplied tables pass vacuously. Trait names express caller obligations; public records and forward/inverse pairs carry no checked certificate."
