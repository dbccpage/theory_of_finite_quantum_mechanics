      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/arrow.rs\",\n    \"sha256\": \"57571c9cfa26d71575075deab4c329fc901b67511732fc6cf3c8eca5d7e17540\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Non-Numeric record and callback orchestration profile selected before evaluation. Reader/state/writer/error callback combinators: exact context/state/value routing, ordered logs, original errors, arbitrary input Clone behavior. No callback purity/termination, crash freedom or external rollback promise.\",\n    \"delivered_behavior\": \"Reader/state/writer/error callback combinators: exact context/state/value routing, ordered logs, original errors, arbitrary input Clone behavior. No callback purity/termination, crash freedom or external rollback promise.\",\n    \"exclusions\": \"No mathematical result, physical derivation, proof authentication or authority promotion is inferred from report labels, callbacks or matching names.\"\n  },\n  \"operations\": {\n    \"arr\": {\n      \"signature\": \"pub fn arr<A, B, F>(f: F) -> Arrow<A, B> where A: 'static + Send + Sync, B: 'static + Send + Sync, F: Fn(A) -> B + Send + Sync + 'static,\",\n      \"obligation\": \"Capture Fn in one Arc. Invoke supplied f once, return its B with identical moved state and empty writer; borrowed context is unused. No callback purity/termination/panic guarantee from Fn.\"\n    },\n    \"compose\": {\n      \"signature\": \"pub fn compose<A, B, C>(k1: Arrow<A, B>, k2: Arrow<B, C>) -> Arrow<A, C> where A: 'static + Send + Sync, B: 'static + Send + Sync, C: 'static + Send + Sync,\",\n      \"obligation\": \"Call k1 with original context/state/input; first Err returns before k2. On first success call k2 once with identical context, returned state and B. Second Err discards returned local logs/state and preserves original anyhow Error. On success move ordered w1 then w2, second state and C. External callback effects are not rolled back.\"\n    },\n    \"tell\": {\n      \"signature\": \"pub fn tell<A>(v: Violation) -> Arrow<A, A> where A: 'static + Clone + Send + Sync,\",\n      \"obligation\": \"Per invocation clone exactly the stored Violation into singleton writer and move state/input unchanged. A:Clone bound is retained but input clone is not invoked. Violation clone cost includes its three strings.\"\n    },\n    \"map_input\": {\n      \"signature\": \"pub fn map_input<A, B, F>(f: F) -> Arrow<A, B> where A: 'static + Send + Sync, B: 'static + Send + Sync, F: Fn(A) -> B + Send + Sync + 'static,\",\n      \"obligation\": \"Same executable lift as arr: call supplied input transformation once, preserve moved state, emit no log. No hidden Arrow parameter, reader transformation or mathematical law validation.\"\n    },\n    \"fanout\": {\n      \"signature\": \"pub fn fanout<A, B, C>(ab: Arrow<A, B>, ac: Arrow<A, C>) -> Arrow<A, (B, C)> where A: Clone + 'static + Send + Sync, B: 'static + Send + Sync, C: 'static + Send + Sync,\",\n      \"obligation\": \"Call Clone::clone once for the left input, then ab with original context/state and that clone. On success call ac with first returned state and original input; errors propagate and short circuit. Success appends ordered logs, returns second state and (B,C). No equality or purity assumption on custom Clone; model takes arbitrary clone function.\"\n    },\n    \"split\": {\n      \"signature\": \"pub fn split<A, B, C, D>(f1: Arrow<A, B>, f2: Arrow<C, D>) -> Arrow<(A, C), (B, D)> where A: 'static + Send + Sync, B: 'static + Send + Sync, C: 'static + Send + Sync, D: 'static + Send + Sync,\",\n      \"obligation\": \"Consume pair (A,C), call f1 with A then f2 with C and returned state, same context. Errors propagate/short circuit; append logs in order and return second state plus (B,D). No input cloning or parallel execution.\"\n    },\n    \"choice\": {\n      \"signature\": \"pub fn choice<A, B, C>(f: Arrow<A, C>, g: Arrow<B, C>) -> Arrow<Either<A, B>, C> where A: 'static + Send + Sync, B: 'static + Send + Sync, C: 'static + Send + Sync,\",\n      \"obligation\": \"Match actual Either tag, invoke only selected callback with identical context, state and payload. Return its exact result or error, with no extra writer/state transformation.\"\n    }\n  },\n  \"invariants\": [\n    \"ValidationInventory models unrestricted flags/issues, exact append/projection, vacuous success, typed blockers and bounded failure counts. Rust Vec preserves list order, clones only necessary owned projections, and count cannot exceed actual Vec length. Unit Debug rendering and std allocation are separately reviewed runtime contracts.\",\n    \"ArrowEffects is a pure total mathematical callback value model over Reader, owned State, ordered List writer and Except. Compose associativity is proved in that model only. Rust Fn does not imply purity, termination, panic freedom or determinism. Concrete source control flow and native traces establish invocation order/short circuit and original error payloads under admitted runtime callbacks; no blanket runtime category-law or rollback theorem.\",\n    \"Fanout model accepts an arbitrary clone function; successful left input is clone(a) and right input is a. The non-lawful Odd clone fixture detects swapped clone/original delivery. Context rationals are opaque stored input: even raw 1/0 or 2/4 is transported without normalization or arithmetic by these combinators.\"\n  ],\n  \"failure_paths\": {\n    \"explicit_paths\": {\n      \"arr\": \"Capture Fn in one Arc. Invoke supplied f once, return its B with identical moved state and empty writer; borrowed context is unused. No callback purity/termination/panic guarantee from Fn.\",\n      \"compose\": \"Call k1 with original context/state/input; first Err returns before k2. On first success call k2 once with identical context, returned state and B. Second Err discards returned local logs/state and preserves original anyhow Error. On success move ordered w1 then w2, second state and C. External callback effects are not rolled back.\",\n      \"tell\": \"Per invocation clone exactly the stored Violation into singleton writer and move state/input unchanged. A:Clone bound is retained but input clone is not invoked. Violation clone cost includes its three strings.\",\n      \"map_input\": \"Same executable lift as arr: call supplied input transformation once, preserve moved state, emit no log. No hidden Arrow parameter, reader transformation or mathematical law validation.\",\n      \"fanout\": \"Call Clone::clone once for the left input, then ab with original context/state and that clone. On success call ac with first returned state and original input; errors propagate and short circuit. Success appends ordered logs, returns second state and (B,C). No equality or purity assumption on custom Clone; model takes arbitrary clone function.\",\n      \"split\": \"Consume pair (A,C), call f1 with A then f2 with C and returned state, same context. Errors propagate/short circuit; append logs in order and return second state plus (B,D). No input cloning or parallel execution.\",\n      \"choice\": \"Match actual Either tag, invoke only selected callback with identical context, state and payload. Return its exact result or error, with no extra writer/state transformation.\"\n    },\n    \"runtime_boundary\": [\n      \"No unsafe code, internal unchecked indexing, arithmetic/narrowing or recursive combinator body. Metadata methods store unrestricted data. Callback Err is propagated; callback panic/nontermination, custom Clone behavior and external side effects remain explicit caller boundaries.\",\n      \"Rust String/Vec/Arc allocation and ordinary Clone behavior are runtime contracts; caller-defined Into<String> conversion and Clone/Into behavior are explicit external code boundaries. No allocator-totality, verified MIR or external-effect rollback claim. Failed second callback returns no state/log value by Result type; existing external trace effects remain visible.\"\n    ]\n  },\n  \"trust_boundary\": {\n    \"formal\": \"Pinned clean Lean/Mathlib, standard foundational axioms only. Value models are not Rust extraction; purity/totality and concrete callback effects are separated.\",\n    \"runtime\": \"Captured rustc/std, String/Vec/Arc, derived tagged data traits and anyhow error propagation. User Fn/Clone operations and allocation remain the declared boundary.\",\n    \"scope\": \"Reader/state/writer/error callback combinators: exact context/state/value routing, ordered logs, original errors, arbitrary input Clone behavior. No callback purity/termination, crash freedom or external rollback promise.\"\n  },\n  \"assurance_limits\": [\n    \"A is scoped source/model/native evidence, not A+, Rust/MIR extraction, allocator/crash totality or full application replay.\",\n    \"Finite fixtures do not prove arbitrary callback purity/termination or all mathematical named obligations. Public diagnostics are forgeable caller metadata; fresh concrete checkers and private certificates are separately assessed.\",\n    \"Two initial common-build refusals remain unrun receipts: collection inference in a removed-use mutant, then ambiguous trace fixture type. Repaired candidate and annotated trace compile in final campaign; no failed attempt is relabeled a pass. Contracts remain pending.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/arrow.score.yaml\",\n      \"sha256\": \"22fab6223bee9451f317c98f61d24729b97ef86de12a77245be10b07174ede9a\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
