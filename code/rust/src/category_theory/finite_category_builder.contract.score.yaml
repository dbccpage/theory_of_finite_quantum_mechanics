      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/finite_category_builder.rs\",\n    \"sha256\": \"258b538e53a8e7c8cb5b4330b56346b6417832fc3ac8e080b5ef7f4cecc8fe04\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Finite owned raw category declarations and caller strings; arbitrary blank/colliding names and partial/overwritten tables remain untrusted.\",\n    \"delivered_behavior\": \"Fluent raw edits, boundary-only identity_checked, ordered identity recipe, raw move-out or full fresh certificate admission. No generated-name freshness, free-category property or standalone category-law proof from builder calls.\",\n    \"failure\": \"identity_checked returns exact String refusal on foreign loop boundary; build_validated propagates the fresh report; ordinary allocator/format/map runtime contracts remain explicit.\"\n  },\n  \"operations\": {\n    \"new\": {\n      \"signature\": \"pub fn new(name: &str) -> Self\",\n      \"obligation\": \"Own a raw DeclaredFiniteCategory with the exact supplied name and empty data. No validation, freshness or nonempty-domain claim.\"\n    },\n    \"walking_arrow\": {\n      \"signature\": \"pub fn walking_arrow(name: &str, source: &str, target: &str, arrow: &str) -> Self\",\n      \"obligation\": \"Apply the literal recipe: generated source identity, generated target identity, named source->target arrow, then identity completions. Labels may collide or be blank; no free/walking-category theorem is promised for arbitrary caller names. Complete admission remains separate.\"\n    },\n    \"object\": {\n      \"signature\": \"pub fn object(mut self, object: &str) -> Self\",\n      \"obligation\": \"Insert exact supplied object through canonical raw mutator and return owned Self.\"\n    },\n    \"morphism\": {\n      \"signature\": \"pub fn morphism(mut self, name: &str, source: &str, target: &str) -> Self\",\n      \"obligation\": \"Insert/overwrite exact name/source/target through raw mutator, including its endpoint object insertions. No name/boundary/law gate here.\"\n    },\n    \"identity\": {\n      \"signature\": \"pub fn identity(mut self, object: &str, morphism: &str) -> Self\",\n      \"obligation\": \"Declare a raw loop and identity binding. It may overwrite a named arrow or leave stale bindings elsewhere; full admission later rejects invalid resulting presentations.\"\n    },\n    \"identity_checked\": {\n      \"signature\": \"pub fn identity_checked(mut self, object: &str, morphism: &str) -> Result<Self, String>\",\n      \"obligation\": \"If arrow exists, refuse when either endpoint differs from supplied object, preserving full message payload. If absent, create the requested loop. Then set the raw identity binding. This is only boundary admission, not unit-law certification. On error the consumed builder is dropped, not returned as a partial value.\"\n    },\n    \"identity_object\": {\n      \"signature\": \"pub fn identity_object(mut self, object: &str) -> Self\",\n      \"obligation\": \"Format exact id_ prefix plus object; insert loop and binding with that name. Formatting is a deterministic recipe, not collision avoidance or an automatic mathematical identity proof.\"\n    },\n    \"composition\": {\n      \"signature\": \"pub fn composition(mut self, first: &str, second: &str, composite: &str) -> Self\",\n      \"obligation\": \"Raw overwrite of ordered (first,second)->composite, where second follows first. No endpoint, totality or associativity check.\"\n    },\n    \"path_composition\": {\n      \"signature\": \"pub fn path_composition(mut self, f: &str, g: &str, composite: &str) -> Self\",\n      \"obligation\": \"Same raw overwrite convention with argument names f,g. Preserve order g after f.\"\n    },\n    \"identity_compositions\": {\n      \"signature\": \"pub fn identity_compositions(mut self) -> Self\",\n      \"obligation\": \"Borrow morphisms/identities immutably and compositions mutably through disjoint fields. Visit the same BTreeMap value order as old cloned snapshot. For each morphism, source identity entry update precedes target identity entry update. Present identities set exact ordered keys to the morphism name; missing ones do nothing. Entry modify/insert has the same logical overwrite semantics, including deterministic last-write wins on raw collisions. Other fields and unrelated table entries remain unchanged.\"\n    },\n    \"build\": {\n      \"signature\": \"pub fn build(self) -> DeclaredFiniteCategory\",\n      \"obligation\": \"Move out the exact owned raw declaration without admission. It is not a certificate.\"\n    },\n    \"build_validated\": {\n      \"signature\": \"pub fn build_validated(self) -> Result<ValidatedFiniteCategory, ValidationReport>\",\n      \"obligation\": \"Delegate the exact owned declaration to the only full ValidatedFiniteCategory::try_new admission path. Fresh typed report failure propagates; success owns that same admitted context. No private certificate field construction or stale user report is accepted.\"\n    }\n  },\n  \"invariants\": [\n    \"FiniteBuilder.checked_missing/checked_existing_iff mirror None creation versus exact source=object AND target=object boundary admission. String/Option/boolean translation and precise error formatting are separately source-reviewed.\",\n    \"FiniteBuilder.update_self/update_other/update_shadow specify logical table insertion and last-write wins. Four completeOne cases match the two optional identity lookups in source-before-target order; complete_append binds ordered iteration. Old Vec snapshot cloned the same ascending BTreeMap values; disjoint borrowed maps cannot be mutated through the composition field, so all logical updates and their order are unchanged.\",\n    \"BTreeMap Entry modifies/inserts exactly the same key/value contents as the old raw set_composition, reusing existing value String capacity where available. String capacities, map layout and allocation addresses are not mathematical fields or promised compatibility. Required owned tuple keys remain copied for the existing public map API; no allocation-free overwrite guarantee is invented.\",\n    \"build_validated passes exact owned raw data to the existing checked finite-category constructor. Its exhaustive fresh guards, private immutable commit and FiniteCategory model realize actual finite laws on success; the raw builder does not claim those laws beforehand. ValidationInventory supplies exact report flag/typed issue behavior.\"\n  ],\n  \"failure_paths\": {\n    \"new\": \"Own a raw DeclaredFiniteCategory with the exact supplied name and empty data. No validation, freshness or nonempty-domain claim.\",\n    \"walking_arrow\": \"Apply the literal recipe: generated source identity, generated target identity, named source->target arrow, then identity completions. Labels may collide or be blank; no free/walking-category theorem is promised for arbitrary caller names. Complete admission remains separate.\",\n    \"object\": \"Insert exact supplied object through canonical raw mutator and return owned Self.\",\n    \"morphism\": \"Insert/overwrite exact name/source/target through raw mutator, including its endpoint object insertions. No name/boundary/law gate here.\",\n    \"identity\": \"Declare a raw loop and identity binding. It may overwrite a named arrow or leave stale bindings elsewhere; full admission later rejects invalid resulting presentations.\",\n    \"identity_checked\": \"If arrow exists, refuse when either endpoint differs from supplied object, preserving full message payload. If absent, create the requested loop. Then set the raw identity binding. This is only boundary admission, not unit-law certification. On error the consumed builder is dropped, not returned as a partial value.\",\n    \"identity_object\": \"Format exact id_ prefix plus object; insert loop and binding with that name. Formatting is a deterministic recipe, not collision avoidance or an automatic mathematical identity proof.\",\n    \"composition\": \"Raw overwrite of ordered (first,second)->composite, where second follows first. No endpoint, totality or associativity check.\",\n    \"path_composition\": \"Same raw overwrite convention with argument names f,g. Preserve order g after f.\",\n    \"identity_compositions\": \"Borrow morphisms/identities immutably and compositions mutably through disjoint fields. Visit the same BTreeMap value order as old cloned snapshot. For each morphism, source identity entry update precedes target identity entry update. Present identities set exact ordered keys to the morphism name; missing ones do nothing. Entry modify/insert has the same logical overwrite semantics, including deterministic last-write wins on raw collisions. Other fields and unrelated table entries remain unchanged.\",\n    \"build\": \"Move out the exact owned raw declaration without admission. It is not a certificate.\",\n    \"build_validated\": \"Delegate the exact owned declaration to the only full ValidatedFiniteCategory::try_new admission path. Fresh typed report failure propagates; success owns that same admitted context. No private certificate field construction or stale user report is accepted.\"\n  },\n  \"trust_boundary\": {\n    \"formal\": \"Clean pinned Lean/Mathlib models: actual finite-category admission, literal reports and raw table/loop/ordered update semantics. Explicit Rust correspondence, not extracted Rust or MIR.\",\n    \"runtime\": \"Captured rustc/std String/Vec/BTreeMap/BTreeSet contracts, format and derived Clone. Safe disjoint borrowing prevents mutation of iterated morphism/identity fields. No allocator-totality or memory-layout theorem.\",\n    \"scope\": \"Own source and current local consumers only; no external application/package or authority promotion.\"\n  },\n  \"assurance_limits\": [\n    \"L2 is the delivered fluent declaration/guard capability; complete mathematical admission delegates to the separately assessed L5 certificate core.\",\n    \"A is scoped source/model/native evidence, not A+, measured allocation contract, Rust/MIR extraction, crash/allocator totality or full application success.\",\n    \"Generated names and arbitrary caller overwrites are raw recipes. String capacities, allocation addresses and map layout may change; logical names/endpoints/table contents and public signatures are preserved. Contracts pending.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/finite_category_builder.score.yaml\",\n      \"sha256\": \"199926411776d7a056681762b17c8c1ed3e37865db2b66a4b9814afe4142638d\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
