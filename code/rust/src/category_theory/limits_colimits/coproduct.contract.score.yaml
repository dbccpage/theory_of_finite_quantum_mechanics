      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/limits_colimits/coproduct.rs\",\n    \"sha256\": \"4f7aec81569672d6cd61326a10ac2c4a4f7e5069dc30b493c60c55f85ed5b0c7\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Raw mutable literal String/collection metadata. Byte-nonempty labels permit whitespace/NUL/Unicode without normalization. Constructors, Default and serde emit raw candidates, never mathematical law certificates.\",\n    \"acceptance\": \"Nonempty label/coproduct_object, nonempty summands, every summand/injection tag nonempty, then injections are absent (length zero) or exactly as numerous as summands. No categorical coproduct universal property is checked.\",\n    \"failure\": \"Required own fields precede ordered child/inventory checks, which precede conditional label/length constraints. The first exact typed error returns without subject mutation. Shape context alone may prefix detail; other typed tags/payloads remain intact.\",\n    \"construction\": \"The complete owner-qualified body map specifies direct field moves, explicit raw defaults, identity-tag generation, list appends and borrowed getters. No admitted category/cone/product type is constructed.\"\n  },\n  \"operations\": {\n    \"Coproduct::new\": {\n      \"signature\": \"pub fn new(label: impl Into<String>) -> Self\",\n      \"scope\": \"Literal shape/typed context or raw-data construction/observation only; not a category/universal-property admission.\"\n    },\n    \"Coproduct::binary\": {\n      \"signature\": \"pub fn binary( label: impl Into<String>, coproduct_object: impl Into<String>, left: impl Into<String>, right: impl Into<String>, injection_left: impl Into<String>, injection_right: impl Into<String>, ) -> Self\",\n      \"scope\": \"Literal shape/typed context or raw-data construction/observation only; not a category/universal-property admission.\"\n    },\n    \"Coproduct::validate_shell\": {\n      \"signature\": \"pub fn validate_shell(&self) -> Result<(), ArithmosError>\",\n      \"scope\": \"Literal shape/typed context or raw-data construction/observation only; not a category/universal-property admission.\"\n    }\n  },\n  \"invariants\": [\n    \"The explicit policy and body map distinguish literal metadata predicates from the mathematical concepts named by the file. Ordered finite String checks map to MetadataValidation; ShapeInventory separately checks boundary equality, positive/optional counts, conditional label binding and all typed context variants. No mathematical category or universal-property hypothesis is silently assumed.\",\n    \"Each iterator borrows a finite actual Vec/BTreeMap; the prefix invariant preserves prior field/entry checks and returns the first failure. Category splits these three ordered inventories into cohesive private helpers, preserving call order and propagating every typed refusal with ?. No validator changes the raw record or returns a retained proof token.\",\n    \"Nested parent checks run own fields first, then the actual child, then later constraints. Limit/Colimit use the actual same-parent Cone shape-context helper. Its match exhaustively maps InvalidShape detail while forwarding every other enum variant unchanged. The checked contextualize model proves no child error becomes success.\",\n    \"Std String equality/is_empty, Vec/BTreeMap iteration/length and formatting implement the declared primitive relation. Product/Coproduct use only exact usize lengths/comparisons, no arithmetic/narrowing. No unchecked production index, division, recursion or user callback occurs in validation. Standard constructor conversion/allocator behavior remains the explicit runtime boundary.\",\n    \"Native test namespaces compile inside the actual Rust parent modules, retaining original visibility and actual peer providers. Only the isolated snapshot gains serde_json as a test dependency for case decoding. Candidate files live under that package and are included in dependency-content binding; no production visibility is widened.\"\n  ],\n  \"failure_paths\": {\n    \"own_labels\": \"First exact InvalidShape(empty FIELD).\",\n    \"nested_or_entries\": \"Nonempty label/coproduct_object, nonempty summands, every summand/injection tag nonempty, then injections are absent (length zero) or exactly as numerous as summands. No categorical coproduct universal property is checked.\",\n    \"context\": \"Shape tags retain location-prefixed detail; law/precondition tags remain exact. The helper is directly tested with all three variants, including variants not emitted by current child shape guards.\",\n    \"raw_transport\": \"Serde preserves rejected candidates; raw default/new/setters can intentionally fail subsequent validation. Unit success is a current shape observation, not immutable mathematical evidence.\",\n    \"runtime\": \"Typed failures propagate without broad recovery. Standard String/&str conversions, arbitrary caller Into implementations and allocator/serde/collection internals retain their explicitly declared trusted-runtime contracts.\"\n  },\n  \"trust_boundary\": {\n    \"math\": \"Only the stated raw shape/inventory rules. No category identity, smallness, cone law, representability or universal property is proved.\",\n    \"formal\": \"Pinned kernel-checked ordered-predicate and ShapeInventory models; source/data/stdlib correspondence is reviewed separately, not extracted Rust or MIR.\",\n    \"runtime\": \"Captured safe Rust/compiler/std, actual category error enum, serde/json, collection and String behavior and ordinary conversion/allocator contracts.\",\n    \"adapter\": \"Original same-parent lexical scopes and real providers; isolated serde_json test-dependency addition is recorded in the Cargo snapshot/dependency receipt.\"\n  },\n  \"assurance_limits\": [\n    \"Capability L2 raw metadata/shape implementation, not L5 mathematics inferred from a type name.\",\n    \"Contracts pending. No A+, alternate compiler, Rust/MIR equivalence, global allocator totality, origin attestation, whole-workspace pass or mathematical category/universal-property admission.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/limits_colimits/coproduct.score.yaml\",\n      \"sha256\": \"065ff2d6cdd2ce5a8f90535377a49f8b42ba2697279bc46e2667514df17b7df4\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
