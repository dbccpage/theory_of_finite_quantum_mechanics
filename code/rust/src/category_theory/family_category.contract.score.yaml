t eligible union. Private standard iterator clones no records and borrowed names remain valid for the immutable family borrow.\",\n    \"Old and new propagation observations coincide for every raw family/query:source gate unchanged;active occurrences unchanged;old linear membership/dedup and new borrowed sets implement identical predicates;both append at the same first eligible encounter. Only transient active String clones and repeated linear scans disappear. The frozen old method is secondary evidence;an independent direct status/sentinel/member oracle checks the contract.\",\n    \"Runtime maps are separate raw key-list stores. Registration moves one input String and appends without deduplication. Queries borrow original stored entries, not lookalike copies. Unknown keys are valid raw registrations;unknown queries are empty. HashMap iteration order is not exposed because only exact-key lookup and Vec order are observed. Public metadata can change between calls;no persistent context certificate is claimed.\",\n    \"The matches! site in is_active expands to one pure match with Exists=true and wildcard=false. Its expanded source branch bound remains below A ceilings;the calibrated tool records the macro as opaque and does not certify MIR. All statuses are independently exercised. Other derives and formatting are standard String/enum/Vec operations. There is no source indexing, arithmetic, unsafe, recursion or unchecked unwrap.\",\n    \"Lean proves raw eligible append/rejection/prefix and sequential collection laws, inactive-source/empty behavior, and exact key-list registration order. It does not prove Rust Unicode implementation, a category/functor law, agent execution or provenance. Rust parser, borrowing/set/order and metadata field refinement is reviewed separately and tested against exact native cases.\"\n  ],\n  \"failure_paths\": {\n    \"Constraint::new\": \"Store exact id, description and severity without validation. Empty/duplicate identifiers are permit