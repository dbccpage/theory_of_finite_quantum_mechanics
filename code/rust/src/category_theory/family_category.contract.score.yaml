 two-arm enum match; Consolidated/Deprecated/Planned are inactive, regardless of target label.\",\n      \"Store exact String identifier and supplied lifecycle enum; no uniqueness/admission.\",\n      \"Delegate exact id to new with Exists, not an external activation action.\",\n      \"Private finite standard iterator of borrowed family/rule names. In encounter order, require candidate!=source, active membership and first insertion into seen; only then copy one required owned output String. Sets are membership indices only, never output order. Generic iterator has no public arbitrary callback entry.\",\n      \"Store exact id/description and empty members/constraints/rules/related lists. No mathematical functor or family consistency certificate.\",\n      \"Borrow original Exists member records in original occurrence order, retaining duplicate IDs. No detached copies.\",\n      \"Borrow exact identifiers of Exists rows in occurrence order, including duplicates.\",\n      \"True iff at least one row has exact queried id and Exists status; inactive duplicate rows do not veto an active occurrence.\",\n      \"Inactive/missing source returns empty. Otherwise create borrowed active-ID vector and set once. Visit rules in original order; wildcard expands active occurrences, otherwise explicit targets in original order. Shared seen set removes name duplicates across rules, source is excluded, and inactive/unknown names are excluded. Return first eligible encounter order. No propagation or agent execution occurs.\",\n      \"Move raw family descriptor unchanged and create two empty, independent name-to-list HashMaps. No AgentFunctor references or law admission.\",\n      \"Append supplied owned String to exact raw constraint-name key, creating list if absent. Unknown keys and duplicates allowed; does not enforce family constraints.\",\n      \"Append supplied owned String to exact raw propagation-pattern key in independent map; preserve duplicates/order, no action executed.\",\n      \"Borrow stored String entries for exact key in insertion order, or empty reference vector if missing. No execution or capability checking.\",\n      \"Borrow exact independent propagation list in order, or empty vector if absent. No execution.\",\n      \"Borrow current raw family.id. Public family mutation intentionally changes future observations.\",\n      \"Delegate current query to current raw family descriptor, preserving source filtering/order. No stored certificate or automatic activation.\"\n    ],\n    \"capability\": \"L2 structured metadata,parsers and ordered target observations. Historical category/functor labels do not admit mathematical laws or agent references/execution.\"\n  },\n  \"operations\": {\n    \"Constraint::new\": {\n      \"line\": 52,\n      \"signature\": \"pub fn new(id: &str, description: &str, severity: Severity) -> Self\",\n      \"obligation\": \"Store exact id, description and severity without validation. Empty/duplicate identifiers are permitted raw metadata; no constraint satisfaction is checked.\"\n    },\n    \"Severity::parse\": {\n      \"line\": 72,\n      \"signature\": \"pub fn parse(s: &str) -> Self\",\n      \"obligation\": \"Apply Rust Unicode uppercase, then exact CRITICAL/HIGH/MEDIUM matching; every other value becomes Low. No trim. Dotless-i spellings can normalize to matching ASCII; whitespace and other lookalike scripts are not silently normalized.\"\n    },\n    \"Severity::fmt\": {\n      \"line\": 83,\n      \"signature\": \"fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result\",\n      \"obligation\": \"Return exact uppercase display label for each enum variant through standard formatter. Derived order is declaration order Critical<High<Medium<Low.\"\n    },\n    \"PropagationRule::new\": {\n      \"line\": 110,\n      \"signature\": \"pub fn new(pattern: &str, example: &str, targets: Vec<String>) -> Self\",\n      \"obligation\": \"Store exact pattern/example and move target list unchanged, including duplicates and reserved labels.\"\n    },\n    \"PropagationRule::targets_all\": {\n      \"line\": 119,\n      \"signature\": \"pub fn targets_all(&self) -> bool\",\n      \"obligation\": \"True iff any target equals exact case-sensitive All members sentinel. Other targets are ignored by propagation expansion when sentinel present; no trimming/case normalization.\"\n    },\n    \"MemberStatus::parse\": {\n      \"line\": 143,\n      \"signature\": \"pub fn parse(s: &str) -> Self\",\n      \"obligation\": \"Trim outer Rust Unicode whitespace, then case-sensitive EXISTS/PLANNED, CONSOLIDATED -> prefix, specialized DEPRECATED -> consolidated into prefix before general DEPRECATED -> prefix. Copy remaining target exactly; internal leading spaces retained. Unmatched input becomes Planned. Whole-string trim can remove a required trailing prefix space, so prefix-only forms follow literal matching/fallback.\"\n    },\n    \"MemberStatus::is_active\": {\n      \"line\": 166,\n      \"signature\": \"pub fn is_active(&self) -> bool\",\n      \"obligation\": \"Only Exists is active. matches! expands to one pure two-arm enum match; Consolidated/Deprecated/Planned are inactive, regardless of target label.\"\n    },\n    \"FamilyMember::new\": {\n      \"line\": 185,\n      \"signature\": \"pub fn new(string_id: &str, status: MemberStatus) -> Self\",\n      \"obligation\": \"Store exact String identifier and supplied lifecycle enum; no uniqueness/admission.\"\n    },\n    \"FamilyMember::active\": {\n      \"line\": 192,\n      \"signature\": \"pub fn active(string_id: &str) -> Self\",\n      \"obligation\": \"Delegate exact id to new with Exists, not an external activation action.\"\n    },\n    \"collect_targets\": {\n      \"line\": 220,\n      \"signature\": \"fn collect_targets<'a>(\\n    candidates: impl IntoIterator<Item = &'a str>, source: &str,\\n    active: &BTreeSet<&str>, seen: &mut BTreeSet<&'a str>, targets: &mut Vec<String>,\\n)\",\n      \"obligation\": \"Private finite standard iterator of borrowed family/rule names. In encounter order, require candidate!=source, active membership and first insertion into seen; only then copy one required owned output String. Sets are membership indices only, never output order. Generic iterator has no public arbitrary callback entry.\"\n    },\n    \"StringFamily::new\": {\n      \"line\": 232,\n      \"signature\": \"pub fn new(id: &str, description: &str) -> Self\",\n      \"obligation\": \"Store exact id/description and empty members/constraints/rules/related lists. No mathematical functor or family consistency certificate.\"\n    },\n    \"StringFamily::active_members\": {\n      \"line\": 244,\n      \"signature\": \"pub fn active_members(&self) -> Vec<&FamilyMember>\",\n      \"obligation\": \"Borrow original Exists member records in original occurrence order, retaining duplicate IDs. No detached copies.\"\n    },\n    \"StringFamily::active_member_ids\": {\n      \"line\": 252,\n      \"signature\": \"pub fn active_member_ids(&self) -> Vec<&str>\",\n      \"obligation\": \"Borrow exact identifiers of Exists rows in occurrence order, including duplicates.\"\n    },\n    \"StringFamily::contains_active\": {\n      \"line\": 261,\n      \"signature\": \"pub fn contains_active(&self, string_id: &str) -> bool\",\n      \"obligation\": \"True iff at least one row has exact queried id and Exists status; inactive duplicate rows do not veto an active occurrence.\"\n    },\n    \"StringFamily::get_propagation_targets\": {\n      \"line\": 268,\n      \"signature\": \"pub fn get_propagation_targets(&self, string_id: &str) -> Vec<String>\",\n      \"obligation\": \"Inactive/missing source returns empty. Otherwise create borrowed active-ID vector and set once. Visit rules in original order; wildcard expands active occurrences, otherwise explicit targets in original order. Shared seen set removes name duplicates across rules, source is excluded, and inactive/unknown names are excluded. Return first eligible encounter order. No propagation or agent execution occurs.\"\n    },\n    \"FamilyFunctor::from_family\": {\n      \"line\": 307,\n      \"signature\": \"pub fn from_family(family: StringFamily) -> Self\",\n      \"obligation\": \"Move raw family descriptor unchanged and create two empty, independent name-to-list HashMaps. No AgentFunctor references or law admission.\"\n    },\n    \"FamilyFunctor::map_constraint\": {\n      \"line\": 316,\n      \"signature\": \"pub fn map_constraint(&mut self, constraint_id: &str, string: String)\",\n      \"obligation\": \"Append supplied owned String to exact raw constraint-name key, creating list if absent. Unknown keys and duplicates allowed; does not enforce family constraints.\"\n    },\n    \"FamilyFunctor::map_propagation\": {\n      \"line\": 324,\n      \"signature\": \"pub fn map_propagation(&mut self, pattern: &str, string: String)\",\n      \"obligation\": \"Append supplied owned String to exact raw propagation-pattern key in independent map; preserve duplicates/order, no action executed.\"\n    },\n    \"FamilyFunctor::apply_constraint\": {\n      \"line\": 332,\n      \"signature\": \"pub fn apply_constraint(&self, constraint_id: &str) -> Vec<&String>\",\n      \"obligation\": \"Borrow stored String entries for exact key in insertion order, or empty reference vector if missing. No execution or capability checking.\"\n    },\n    \"FamilyFunctor::apply_propagation\": {\n      \"line\": 340,\n      \"signature\": \"pub fn apply_propagation(&self, pattern: &str) -> Vec<&String>\",\n      \"obligation\": \"Borrow exact independent propagation list in order, or empty vector if absent. No execution.\"\n    },\n    \"FamilyFunctor::id\": {\n      \"line\": 348,\n      \"signature\": \"pub fn id(&self) -> &str\",\n      \"obligation\": \"Borrow current raw family.id. Public family mutation intentionally changes future observations.\"\n    },\n    \"FamilyFunctor::get_propagation_targets\": {\n 