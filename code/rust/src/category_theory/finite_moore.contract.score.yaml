y replay alone.\"\n    },\n    \"valid_quotient_map_shape\": {\n      \"line\": 237,\n      \"signature\": \"fn valid_quotient_map_shape(&self, target: &Self, map: &[usize]) -> bool\",\n      \"obligation\": \"Short-circuit same alphabet,exact source map length,all target indices in range,then image cardinality equals target cardinality. Since range already admitted,this last condition is surjectivity. Same order as old disjunctive refusal;no map indexing before length/range known.\"\n    },\n    \"preserves_quotient_at\": {\n      \"line\": 244,\n      \"signature\": \"fn preserves_quotient_at(&self, target: &Self, map: &[usize], state: usize) -> bool\",\n      \"obligation\": \"Private successful map-shape guard/state<n. Require same report at target image and every labeled update commutes. Known row/map bounds justify direct indices. Equivalent negation of prior statewise mismatch/any-step mismatch.\"\n    },\n    \"same_behavior_set\": {\n      \"line\": 256,\n      \"signature\": \"pub fn same_behavior_set(&self, other: &Self) -> bool\",\n      \"obligation\": \"Unequal alphabets false. Build disjoint union using source offset for target transitions and exact original labels;canonical greatest relation on union yields common behavior blocks. Compare set of blocks met by each carrier (both inclusion directions),not state-count or multiplicity equality. Nonempty admitted machines preserve union typing;state+offset fits addressable live safe storage,union allocation may fail as std TCB. Reports/input labels are external literal IDs,not arbitrarily renamable.\"\n    }\n  },\n  \"invariants\": [\n    \"Immutable admitted nonempty n-state/A-input matrix with valid total target indices. Wrong partition/map lengths rejected before every public path that calls private indexing helpers. Private refine/pair/map predicates rely on these explicit guards;reports/transitions/state count never mutably exposed. Safe Vec ownership/addressability bounds report/ID counters and dis