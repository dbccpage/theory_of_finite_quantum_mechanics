repeated-step/unstable/overrefined/forged-map/payload cases.\",\n      \"Ordered shape/range/onto guard then statewise report/transition homomorphism guard. Compute actual minimal map;for each source m assign target slot map[m] its minimal block. Different previous assignment explicitly refuses,otherwise fill once. Surjectivity guarantees every target slot Some before final unwrap;homomorphism kernel lies in future equivalence,so valid fibers share block. Return unique factor making factor(map(m))=minimal(m),not arbitrary map admission by replay alone.\",\n      \"Short-circuit same alphabet,exact source map length,all target indices in range,then image cardinality equals target cardinality. Since range already admitted,this last condition is surjectivity. Same order as old disjunctive refusal;no map indexing before length/range known.\",\n      \"Private successful map-shape guard/state<n. Require same report at target image and every labeled update commutes. Known row/map bounds justify direct indices. Equivalent negation of prior statewise mismatch/any-step mismatch.\",\n      \"Unequal alphabets false. Build disjoint union using source offset for target transitions and exact original labels;canonical greatest relation on union yields common behavior blocks. Compare set of blocks met by each carrier (both inclusion directions),not state-count or multiplicity equality. Nonempty admitted machines preserve union typing;state+offset fits addressable live safe storage,union allocation may fail as std TCB. Reports/input labels are external literal IDs,not arbitrarily renamable.\"\n    ],\n    \"capability\": \"L3 conservative bounded exact finite algorithm with replayable quotient records;no automatic L5 foundational/physical authority from categorical terminology.\"\n  },\n  \"operations\": {\n    \"normalize\": {\n      \"line\": 36,\n      \"signature\": \"fn normalize<T: Ord>(signatures: impl IntoIterator<Item = T>) -> Vec<usize>\",\n      \"obligation\": \"Private