      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/functor_composition.rs\",\n    \"sha256\": \"83e602173ea7486c4db70039a74747756db5b8516e6c1e12194493b27312b5f6\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact retained: finite identifier category/map/report operations only, no own fixed-width arithmetic, floating operation or numerical extension.\",\n    \"certificate\": \"Fresh complete endpoint category laws plus exact functor map domains, bindings, images, boundaries, actual identity/composition laws gate an immutable owned snapshot certificate. Full middle category equality gates composition of certified inputs; raw result name/output still require separate admission.\",\n    \"raw\": \"Literal identity, partial-map composition, reverse construction and inclusion membership/boundary declarations on arbitrary raw data. No helper silently certifies endpoint laws, full image/domain requirements or freshness. Raw opposite normalizes keys to morphism value names in sorted original order and accumulates all encountered endpoints/identity keys.\"\n  },\n  \"operations\": {\n    \"violation\": {\n      \"line\": 19,\n      \"signature\": \"fn violation(\\n    unit: FunctorValidation,\\n    location: ValidationLocation,\\n    message: impl Into<String>,\\n) -> ValidationViolation\",\n      \"obligation\": \"Construct Functor(unit), exact supplied location/message and Error severity; no external validation or authority effect is inferred by a typed label.\"\n    },\n    \"add_unit\": {\n      \"line\": 32,\n      \"signature\": \"fn add_unit(\\n    report: &mut ValidationReport,\\n    unit: FunctorValidation,\\n    violations: Vec<ValidationViolation>,\\n)\",\n      \"obligation\": \"Append one named functor phase with all provided typed failures through the assessed report constructor. Never discard failures or infer mathematics from an empty externally supplied vector.\"\n    },\n    \"try_new\": {\n      \"line\": 48,\n      \"signature\": \"pub fn try_new(\\n        declared: DeclaredFiniteFunctor,\\n        source: &DeclaredFiniteCategory,\\n        target: &DeclaredFiniteCategory,\\n    ) -> Result<Self, ValidationReport>\",\n      \"obligation\": \"Compute fresh full validation report over the supplied raw endpoints and maps. Only an internally created all-passed report releases a private certificate owning the declaration and independent source/target clones. Any expected failure returns its full report, not a certificate. Inputs are immutable borrowed plain records with no interior mutability, so the subsequent owned snapshot cannot race a safe mutation between check and clone.\"\n    },\n    \"declared\": {\n      \"line\": 65,\n      \"signature\": \"pub fn declared(&self) -> &DeclaredFiniteFunctor\",\n      \"obligation\": \"Return only immutable borrowed declaration from this module-specific certificate; its type is nominally distinct from cat_functor::ValidatedFiniteFunctor.\"\n    },\n    \"source\": {\n      \"line\": 69,\n      \"signature\": \"pub fn source(&self) -> &DeclaredFiniteCategory\",\n      \"obligation\": \"Return the actual owned immutable source snapshot.\"\n    },\n    \"target\": {\n      \"line\": 73,\n      \"signature\": \"pub fn target(&self) -> &DeclaredFiniteCategory\",\n      \"obligation\": \"Return the actual owned immutable target snapshot.\"\n    },\n    \"into_declared\": {\n      \"line\": 77,\n      \"signature\": \"pub fn into_declared(self) -> DeclaredFiniteFunctor\",\n      \"obligation\": \"Consume the certificate and return its raw declaration, dropping endpoint snapshots; this intentionally loses the certificate boundary.\"\n    },\n    \"identity_functor\": {\n      \"line\": 82,\n      \"signature\": \"pub fn identity_functor(category: &DeclaredFiniteCategory, name: &str) -> DeclaredFiniteFunctor\",\n      \"obligation\": \"Create exact caller-named raw identity maps on every supplied object and morphism key, with endpoint labels copied from the raw category name. Do not admit endpoint laws or normalize arbitrary names.\"\n    },\n    \"compose_declared_functors\": {\n      \"line\": 97,\n      \"signature\": \"pub fn compose_declared_functors(\\n    name: &str,\\n    first: &DeclaredFiniteFunctor,\\n    second: &DeclaredFiniteFunctor,\\n) -> Result<DeclaredFiniteFunctor, String>\",\n      \"obligation\": \"Require first target label equal second source label before constructing output. Iterate every first object-map entry in sorted key order, require the corresponding second mapping and insert its actual final image; then do the same for morphisms. First missing object precedes morphism errors, with exact identifying payload. No partial declaration is returned on error; extra second-map entries are ignored. Output endpoints/name are literal caller/first-source/second-target. This is raw partial-map composition, not law admission.\"\n    },\n    \"compose_validated_functors\": {\n      \"line\": 137,\n      \"signature\": \"pub fn compose_validated_functors(\\n    name: &str,\\n    first: &ValidatedFiniteFunctor,\\n    second: &ValidatedFiniteFunctor,\\n) -> Result<DeclaredFiniteFunctor, String>\",\n      \"obligation\": \"First require full structural equality of owned middle category snapshots, not just equal names. Then compose the admitted raw maps in G-after-F order. Output is deliberately a raw declaration and caller output name is not admitted; lawful reuse still requires the appropriate certificate constructor.\"\n    },\n    \"opposite_category\": {\n      \"line\": 155,\n      \"signature\": \"pub fn opposite_category(category: &DeclaredFiniteCategory, name: &str) -> DeclaredFiniteCategory\",\n      \"obligation\": \"Clone declared object set once. In sorted original morphism-key order, register reversed endpoint names only if absent, then insert a required owned reversed morphism keyed by its value name. This preserves legacy raw key/name normalization and last-write collisions, including endpoints from overwritten rows. Register all foreign identity keys only when absent, copy all identity bindings, and reverse each raw composition pair without filtering. No law checks, interpretation, freshness or raw double-opposite identity are promised; admitted canonical-key closed tables support the mathematical use.\"\n    },\n    \"opposite_functor\": {\n      \"line\": 185,\n      \"signature\": \"pub fn opposite_functor(\\n    name: &str,\\n    functor: &DeclaredFiniteFunctor,\\n    source_op_category: &str,\\n    target_op_category: &str,\\n) -> DeclaredFiniteFunctor\",\n      \"obligation\": \"Own exact supplied opposite labels/name and clone unchanged raw object/morphism maps. Opposite endpoint structure and laws must be separately constructed and admitted, not inferred from string names.\"\n    },\n    \"inclusion_functor\": {\n      \"line\": 197,\n      \"signature\": \"pub fn inclusion_functor(\\n    name: &str,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n) -> Result<DeclaredFiniteFunctor, String>\",\n      \"obligation\": \"Require each source object name be a target object and each source arrow key be a target arrow with both equal endpoint strings, in sorted phase order. Insert identity-on-name mappings and return raw output; identity/composition law compatibility or endpoint validity is not checked. Empty source permits empty output name; failures preserve exact first missing/mismatch payload and expose no partial declaration.\"\n    },\n    \"declared_finite_functor_from_maps\": {\n      \"line\": 231,\n      \"signature\": \"pub fn declared_finite_functor_from_maps(\\n    name: &str,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n    object_map: &[(&str, &str)],\\n    morphism_map: &[(&str, &str)],\\n) -> DeclaredFiniteFunctor\",\n      \"obligation\": \"Create raw named endpoint-bound record and apply supplied object/morphism pairs in input order; duplicate source keys have last-write values. Do not certify membership, totality, identity/composition or nonblank names.\"\n    },\n    \"validate_functor_between\": {\n      \"line\": 251,\n      \"signature\": \"pub fn validate_functor_between(\\n    functor: &DeclaredFiniteFunctor,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n) -> ValidationReport\",\n      \"obligation\": \"Build a fresh caller-named report. Check complete actual source/target category laws, then functor name, exact map domains, object images/binding, arrow images, both boundaries, actual identities and every source composition. No phase is skipped because another failed; the entire report retains typed evidence. On malformed raw inputs, individual law functions can skip unresolved references only because complete report contains the independent prerequisite failures. Constructor gates on this whole report.\"\n    },\n    \"check_endpoint_categories\": {\n      \"line\": 296,\n      \"signature\": \"fn check_endpoint_categories(\\n    report: &mut ValidationReport,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n)\",\n      \"obligation\": \"Always validate source category through the assessed eight-phase checker. Validate target separately unless full raw structural equality makes it the same category; equal names alone cannot skip target admission. Preserve every typed endpoint failure in separately named report phases.\"\n    },\n    \"check_functor_name\": {\n      \"line\": 309,\n      \"signature\": \"fn check_functor_name(functor: &DeclaredFiniteFunctor) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Emit exactly one Name/Global/Error violation for a whitespace-only name; otherwise empty. No name normalization or callback.\"\n    },\n    \"check_mapping_domains\": {\n      \"line\": 320,\n      \"signature\": \"fn check_mapping_domains(\\n    functor: &DeclaredFiniteFunctor,\\n    source: &DeclaredFiniteCategory,\\n) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Require sorted exact object-map key equality to source objects and arrow-map key equality to source morphism keys, independently reporting each domain mismatch; reject extras as well as omissions.\"\n    },\n    \"check_object_images\": {\n      \"line\": 342,\n      \"signature\": \"fn check_object_images(\\n    functor: &DeclaredFiniteFunctor,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Report mismatching source and target category labels, then inspect every actual source object for a mapped target member, preserving missing/unknown object payloads. Map extras are separately rejected by domain checking.\"\n    },\n    \"check_morphism_images\": {\n      \"line\": 390,\n      \"signature\": \"fn check_morphism_images(\\n    functor: &DeclaredFiniteFunctor,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Inspect every source arrow key for a defined known target arrow image, emitting exact missing/unknown payloads. Extra keys are independently rejected by map domain checking.\"\n    },\n    \"check_boundary_images\": {\n      \"line\": 417,\n      \"signature\": \"fn check_boundary_images(\\n    functor: &DeclaredFiniteFunctor,\\n    source: &DeclaredFiniteCategory,\\n    target: &DeclaredFiniteCategory,\\n) -> Vec<ValidationViolation>\",\n      \"obligation\": \"For each source arrow with resolved image/source-object-map/target-object-map/target-image boundary, compare both endpoint strings and emit a typed boundary diagnostic on either difference. Missing prerequisites are not acceptance: whole-report membership/domain/endpoint phases reject them.\"\n    },\n    \"check_identity_images\": {\n      \"line\": 