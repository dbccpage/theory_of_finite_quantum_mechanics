 equality as the original owned BTreeMap. Unique sorted keys retain original path indices. Composable concatenation is a valid DAG path, and complete enumeration guarantees lookup succeeds. Clearing one scratch vector and appending both words gives the original concatenation. Cached v/p labels have exactly the original values. Allocation order changes, but there are no user callbacks or mutable inputs whose successful result depends on that order.\",\n    \"Identity index v labels arrow p{v} at object v{v}; every other path has its exact outer boundary. The declared composition domain consists of exactly the compatible pairs, with result the unique concatenated word. Empty words give both units, and list append gives associativity. The actual finite-category validator independently checks the declaration before ownership is exposed. Matrix and declared cells use the same i,j,k, so the index API agrees with the held certificate. Missing closure or validation failure returns a typed error.\",\n    \"FinitePathCategory and FinitePath fields are private. There is no unchecked/default/Deserialize constructor or mutable accessor. The owner retains the graph, complete paths, composition matrix and actual ValidatedFiniteCategory. Shared getters and Clone preserve this context; consuming a separately cloned certificate cannot mutate the owner. Checked public queries refuse unknown indices. None composition means noncomposability. Counts and all private indices are bounded by V,E,P<=64.\",\n    \"Mathlib Paths and lift_unique establish the mathematical free-category universal property. The finite DAG representation above connects the delivered construction to that theorem. There is no new Rust functor-lift API. L5 describes the owned certificate architecture and theorem-matching abstraction, not a module title or size. MAX_PATHS is an execution cap; acyclicity and strict rank provide mathematical finiteness.\",\n    \"All phases preserve the original public constructor result and error precedence: graph/cycle admission and prefix BFS are unchanged; borrowed lookup, cached labels and scratch concatenation produce the same words, indices, names and compositions. This preservation assumes standard allocation succeeds, not that OOM is a typed PathError. Unreachable defensive error remaps were not counted as non-equivalent public-domain faults.\"\n  ],\n  \"failure_paths\": {\n    \"PathError::fmt\": \"Exact refusal prefix plus standard Debug variant;all eight public unit errors display without additional semantic checking. Standard formatter allocation/failure TCB.\",\n    \"FinitePath::source\": \"Borrowed immutable path returns admitted start vertex ID.\",\n    \"FinitePath::target\": \"Return admitted end vertex ID.\",\n    \"FinitePath::edges\": \"Borrow exact chronological edge-ID word;empty word is identity at its source. Edge IDs refer to owned original edge inventory and distinguish parallel edges.\",\n    \"checked_outgoing\": \"Ordered admission:zerovertices EmptyGraph;vertexcount>64 OR edgecount>64 GraphBudget;any endpoint>=vertices InvalidVertex. Only then allocate outgoing/indegree and index admitted vertices. Outgoing edge IDs preserve input index order;counts each incoming edge including parallel edges. Ensure acyclic before returning graph index,so Cycle precedes path-budget refusal.\",\n    \"ensure_acyclic\": \"Private typed outgoing/indegree graph preconditions. Kahn ready set contains residual indegree0 vertices;pop smallest,visit once,process every outgoing edge once,decrement remaining target indegree and queue newlyzero target. Decrements nonnegative,counts<=64. All vertices popped iff acyclic;otherwise Cycle. Success pop order gives strict rank increasing on every edge.\",\n    \"enumerate_paths\": \"Private admitted DAG/outgoing and budget<=64. If vertices>budget,PathBudget before identity allocation. Seed identities at indices exactlyvertices,then BFS each path prefix and its ordered outgoing edge IDs. Check count==budget BEFORE every child append. Child word copies necessary owned prefix and appends one actual generator;source preserved,target actualedge.target. All counts<=budget;success only after frontier exhausted and hence complete,never truncated. Distinct source/edge words retained including parallel edges.\",\n    \"declared_path_category\": \"Private complete admitted path inventory starts with vertex identities. Cache required v{id}/p{id} labels once. Add one identity pervertex in vertex order,then all nonidentity arrows with exact outer boundaries/path index labels. Category name exact constant. Returns raw category+path-name vector for same indexed inventory;does not itself certify laws.\",\n    \"PathLookup::new\": \"Borrow every unique (path.source,path.edges slice) with its original index;sort lexical tuple keys once. No word/vector clones. DAG enumeration yields unique keys;unstable tie order irrelevant. Returned rows lifetime-bound to immutable original paths.\",\n    \"PathLookup::find\": \"Binary search exact borrowed source/word key;return original index on found row or typedMissingComposite. get guard handles any impossible bad search index without panic. Private constructor queries complete composable words;arbitrary direct fixture unknown query intentionally refuses.\",\n    \"compose_paths\": \"Private path/name inventory consistent. Allocate requiredP² None matrix,one borrowed lookup and ONE reusable word scratch outside nested loops. Skip exactly boundary-mismatched pairs. For composable p thenq,clear scratch,append chronological p.edges thenq.edges,lookup same source;closure gives exact compositek. Store both matrix[i][j]=k and declared category composition(p{i},p{j})=p{k}. Cached names avoid inner-loop formatting;only required owned category table keys/value copies remain.\",\n    \"FinitePathCategory::new\": \"Graph admission/cycle check first;enumerate at min(callermax,64);build exact same raw category and indexed composition;call actual ValidatedFiniteCategory::try_new and refuse CategoryValidation on failure. Only then expose owned immutable vertices,originaledges,completepaths,matrix and admitted category. No unchecked/default/deserialized constructor. Public signature/error precedence preserved.\",\n    \"FinitePathCategory::vertices\": \"Return exact admitted original vertex count,not path cardinality.\",\n    \"FinitePathCategory::edges\": \"Borrow exact original ordered generator inventory;caller cannot mutate owned graph through shared slice.\",\n    \"FinitePathCategory::paths\": \"Borrow full admitted complete path inventory in BFS order,not a truncatedprefix. Entries private immutable paths.\",\n    \"FinitePathCategory::category\": \"Borrow owned actual admitted category certificate for this exact graph/path/composition context;no mutable access or name-only context substitution.\",\n    \"FinitePathCategory::path\": \"Checked lookup of pathindex;out ofrange UnknownPath,no fallbackidentity or unsafeindex.\",\n    \"FinitePathCategory::compose\": \"Checked first and second matrix lookup;unknown either UnknownPath;known pairs yieldSome exact concatenation index iff matching boundaries,otherwiseNone. None never means missing closure;private completed matrix shared with held category certificate.\",\n    \"FinitePathCategory::edge_path\": \"Unknown edge>=owned edgecount UnknownPath first. Otherwise find unique one-edge word [edge] in full inventory;returnindex. DefensiveMissingComposite unreachable for admittedgraphgenerator. Parallel same-boundary edges retain distinct IDs/paths.\",\n    \"FinitePathCategory::origin_path_counts\": \"Required counts Vecvertexcount initialized0,incrementonce percompletepath at valid immutable source;counts/sum<=P<=64,so no usizeoverflow. Counts actualpaths includingoneidentityeach,not edge degree.\"\n  },\n  \"trust_boundary\": \"Rustcompiler/stdVec/Set/sort/binarysearch/format/allocator,safeownedaddressability,actualseparatelyreviewedcategoryadmissionproviders,Lean