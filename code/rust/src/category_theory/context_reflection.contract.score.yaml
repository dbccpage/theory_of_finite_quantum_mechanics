e immutable original source clone.\",\n      \"Borrow the immutable completed system with the least congruent coarsening and unchanged actions/carrier.\",\n      \"Borrow the canonical initial profile and each strict round; omit the repeated stable final round.\",\n      \"Admit the identity carrier map from original source to completed system. The original equivalence is included in its congruent closure.\",\n      \"Require exact original source equality, then an actually congruent target. Re-admit the same owned map from completed source to that target. Return WrongDomain or TargetNotCongruent before admission as specified.\",\n      \"For typed already-admitted arrows, require the original source, congruent target, completed candidate source, identical candidate target, and identical carrier map. These are precisely the comma triangle conditions for an identity-carrier unit; accepted factors are unique.\",\n      \"Require exact original endpoints against both reflections before re-admitting the same map between completed objects. Incorrect endpoints return WrongDomain; saturation preservation establishes success for admitted matching arrows.\"\n    ],\n    \"capability\": \"L5: immutable admitted objects and typed arrows implement a category, checked identity/composition, least congruent reflection, natural units, reflector maps and unique comma factors. Raw witness metadata remains explicitly rechecked.\"\n  },\n  \"operations\": {\n    \"ContextSystem::new\": {\n      \"line\": 37,\n      \"signature\": \"pub fn new(\\n        profiles: Vec<usize>,\\n        transitions: Vec<Vec<usize>>,\\n        context_count: usize,\\n    ) -> Result<Self, ContextError>\",\n      \"obligation\": \"Delegate to FiniteMoore admission: nonempty carrier, exactly one total in-range action row per state with the declared context count. Own the admitted model or return Carrier with the original typed error.\"\n    },\n    \"state_count\": {\n      \"line\": 47,\n      \"signature\