truction. The helper preserves the original witness order.\"\n    },\n    \"is_congruent\": {\n      \"line\": 88,\n      \"signature\": \"pub fn is_congruent(&self) -> bool\",\n      \"obligation\": \"Return true exactly when no obstruction exists.\"\n    },\n    \"ContextHom::new\": {\n      \"line\": 101,\n      \"signature\": \"pub fn new(\\n        source: &'a ContextSystem,\\n        target: &'a ContextSystem,\\n        map: Vec<usize>,\\n    ) -> Result<Self, ContextError>\",\n      \"obligation\": \"Check context-count equality first, then map length and target ranges. For each source x, check every ordered profile pair before its contexts. Reject the first ProfileNotPreserved or ActionNotPreserved in this original order. Privately own only a fully admitted map and immutable borrowed endpoints.\"\n    },\n    \"ContextHom::source\": {\n      \"line\": 130,\n      \"signature\": \"pub fn source(&self) -> &ContextSystem\",\n      \"obligation\": \"Borrow the exact immutable source endpoint.\"\n    },\n    \"target\": {\n      \"line\": 133,\n      \"signature\": \"pub fn target(&self) -> &ContextSystem\",\n      \"obligation\": \"Borrow the exact immutable target endpoint.\"\n    },\n    \"map\": {\n      \"line\": 136,\n      \"signature\": \"pub fn map(&self) -> &[usize]\",\n      \"obligation\": \"Borrow the admitted state map without mutable access.\"\n    },\n    \"identity\": {\n      \"line\": 139,\n      \"signature\": \"pub fn identity(system: &'a ContextSystem) -> Result<Self, ContextError>\",\n      \"obligation\": \"Construct the identity carrier map through full arrow admission; exact unit laws follow from pointwise identity.\"\n    },\n    \"then\": {\n      \"line\": 142,\n      \"signature\": \"pub fn then(&self, next: &Self) -> Result<Self, ContextError>\",\n      \"obligation\": \"Require exact value equality of middle objects, including numeric profiles, action table, and context count. Clone-equal objects are accepted. Compose next.map[self.map[x]] and re-admit every arrow law; otherwise WrongDomain.\"\n    },\n    \"reflects_profiles\": {\n      \"line\": 152,\n      \"signature\": \"pub fn reflects_profiles(&self) -> bool\",\n      \"obligation\": \"For every ordered source pair, test that related images imply related originals. This reflects profile equivalence and does not imply state injectivity.\"\n    },\n    \"canonicalize\": {\n      \"line\": 168,\n      \"signature\": \"fn canonicalize(labels: &[usize]) -> Vec<usize>\",\n      \"obligation\": \"Assign dense class IDs in first occurrence order using BTreeMap entries keyed by the original label. Preserve exactly the equality kernel, including sparse usize::MAX labels.\"\n    },\n    \"merge\": {\n      \"line\": 178,\n      \"signature\": \"fn merge(labels: &mut [usize], x: usize, y: usize)\",\n      \"obligation\": \"Relabel every occurrence of the class containing y by the current class containing x. Preserve equivalence and coarsen only; valid private indices come from admitted actions.\"\n    },\n    \"merge_round\": {\n      \"line\": 188,\n      \"signature\": \"fn merge_round(source: &ContextSystem, old: &[usize], labels: &mut [usize])\",\n      \"obligation\": \"Visit every old-related unordered pair in original x/y order and merge its action images. Use the fixed old snapshot throughout the round; current labels determine only unions.\"\n    },\n    \"merge_pair\": {\n      \"line\": 198,\n      \"signature\": \"fn merge_pair(source: &ContextSystem, x: usize, y: usize, labels: &mut [usize])\",\n      \"obligation\": \"For each context ascending, merge the two admitted action-image classes. No payload clone or allocation occurs in this helper.\"\n    },\n    \"CongruenceReflection::new\": {\n      \"line\": 211,\n      \"signature\": \"pub fn new(source: &ContextSystem) -> Result<Self, ContextError>\",\n      \"obligation\": \"Start from the canonical original relation. Repeatedly close all old-related action pairs and canonicalize. Append only strict changes; each strict change merges classes, so at most n-1 strict rounds occur. Build the completed system with exactly the original actions and context count, and own the source clone and canonical chain.\"\n    },\n    \"CongruenceReflection::source\": {\n      \"line\": 234,\n      \"signature\": \"pub fn source(&self) -> &ContextSystem\",\n      \"obligation\": \"Borrow the immutable original source clone.\"\n    },\n    \"completed\": {\n      \"line\": 237,\n      \"signature\": \"pub fn completed(&self) -> &ContextSystem\",\n      \"obligation\": \"Borrow the immutable completed system with the least congruent coarsening and unchanged actions/carrier.\"\n    },\n    \"chain\": {\n      \"line\": 240,\n      \"signature\": \"pub fn chain(&self) -> &[Vec<usize>]\",\n      \"obligation\": \"Borrow the canonical initial profile and each strict round; omit the repeated stable final round.\"\n    },\n    \"unit\": {\n      \"line\": 243,\n      \"signature\": \"pub fn unit(&self) -> Result<ContextHom<'_>, ContextError>\",\n      \"obligation\": \"Admit the identity carrier map from original source to completed system. The original equivalence is included in its congruent closure.\"\n    },\n    \"factor\": {\n      \"line\": 253,\n      \"signature\": \"pub fn factor<'a>(&'a self, arrow: &ContextHom<'a>) -> Result<ContextHom<'a>, ContextError>\",\n      \"obligation\": \"Require exact original source equality, then an actually congruent target. Re-admit the same owned map from completed source to that target. Return WrongDomain or TargetNotCongruent before admission as specified.\"\n    },\n    \"is_factor\": {\n      \"line\": 264,\n      \"signature\": \"pub fn is_factor(&self, arrow: &ContextHom<'_>, candidate: &ContextHom<'_>) -> bool\",\n      \"obligation\": \"For typed already-admitted arrows, require the original source, congruent target, completed candidate source, identical candidate target, and identical carrier map. These are precisely the comma triangle conditions for an identity-carrier unit; accepted factors are unique.\"\n    },\n    \"reflect_arrow\": {\n      \"line\": 274,\n      \"signature\": \"pub fn reflect_arrow<'a>(\\n    source: &'a CongruenceReflection,\\n    target: &'a CongruenceReflection,\\n    arrow: &ContextHom<'_>,\\n) -> Result<ContextHom<'a>, ContextError>\",\n      \"obligation\": \"Require exact original endpoints against both reflections before re-admitting the same map between completed objects. Incorrect endpoints return WrongDomain; saturation preservation establishes success for admitted matching arrows.\"\n    }\n  },\n  \"invariants\": [\n    \"ContextSystem privately owns an admitted FiniteMoore with nonempty carrier and total range-checked actions. ContextHom privately owns its map and borrows immutable admitted endpoints. CongruenceReflection privately owns source, completion and chain. No public unchecked constructor, mutable endpoint accessor, Default or Deserialize bypass exists. Clone preserves admitted values. Raw ContextWitness fields are always rechecked.\",\n    \"Numeric profile equality is an equivalence relation, and each context is a fixed labelled total action. Arrow admission preserves that equivalence and commutes with every action. Rust rejects cross-alphabet arrows before map admission. Middle object equality is exact value equality, not pointer identity or isomorphism. The checked identity and composition implement the category with pointwise maps; the Lean model supplies an actual Mathlib Category at a fixed context type.\",\n    \"Canonicalization preserves precisely the input equality kernel and chooses class IDs by first occurrence. Each merge unions whole current classes, never splits them. Each round uses the previous relation to choose action constraints and monotonically unions current classes. Any congruent upper relation contains every merge by induction, proving leastness. At a stable canonical vector every related pair has related action images, proving congruence. A strict round decreases the finite number of blocks; canonical IDs prevent spurious label-only changes, giving at most n-1 strict rounds.\",\n    \"The completed object retains the same carrier, actions and context labels. Its profile relation is the least action-stable equivalence containing the original. The identity carrier unit is therefore an admitted arrow. For any admitted map to a congruent target, action compatibility transports every saturation generator and equivalence closure; thus the same map factors through completion. Since the unit is the identity on the carrier, the triangle fixes every factor value and yields uniqueness. reflect_arrow transports saturation and preserves identities and composition. The Lean model proves the actual reflector functor, natural unit, factor equivalence, its naturality and reflection idempotence.\",\n    \"The congruence reflection can merge previously distinct profiles. It is not a report-reflecting repair. A profile-reflecting arrow into a congruent target would force the original relation to be congruent; the explicit three-state noncongruence example therefore has no such arrow. Reflection means equality-kernel reflection, without any state-injectivity claim. The proof unit_reflects_iff records this boundary.\",\n    \"All public index paths have range checks or originate from admitted arrows and model tables. check_witness short circuits before indexing. ContextHom::new preserves the original per-x profile-then-action error priority, rather than collecting all profile failures first. All failure variants propagate as documented. No caller-supplied congruence or factor flag is trusted. Error order, canonical chain and endpoint distinctions are independently tested.\",\n    \"Canonicalization uses O(n log n) map work and O(n) storage. A conservative closure bound is O(n^4 k + n^2 log n), including up to n strict/final rounds, n squared pairs, k actions and an n-element class relabel scan. Stored chain uses O(n squared), with owned action tables O(nk). No explicit work or heap budget is promised. Required snapshots, owned source/actions, output maps and chain rows are retained; merge helpers allocate no per-pair buffers. Native small models and AST metrics do not establish a resource bound for arbitrary inputs.\",\n    \"Every one of the 29 production function bodies is mapped. The selected source has maximum calibrated CCN 10, cognitive 15 and nesting 3. Concrete standard-library constructors, iterator closures, indexing and derived Clone are reviewed; the AST tool does not expand library implementations or prove Rust/MIR. Formal proofs concern the abstract categorical model; source-to-model correspondence is a separate review obligation.\"\n  ],\n  \"failure_paths\": {\n    \"ContextSystem::new\": \"Delegate to FiniteMoore admission: nonempty carrier, exactly one total in-range action row per state with the declared context count. Own the admitted model or return Carrier with the original typed error.\",\n    \"state_count\": \"Return the positive admitted carrier size.\",\n    \"context_count\": \"Return the fixed context alphabet size; zero is supported.\",\n    \"profiles\": \"Borrow the exact stored numeric profile labels. Equality of labels defines the relation; sparse labels are legal.\",\n    \"transitions\": \"Borrow the admitted total action table without mutation.\",\n    \"related\": \"Check both state indices before profile indexing, then compare literal profile labels. Any out-of-range state returns false.\",\n    \"check_witness\": \"Validate the context and related endpoints before action indexing; accept precisely a related pair whose action images are unrelated. Raw witness records confer no certificate status.\",\n    \"obstruction\": \"Search x ascending, y ascending below x, then context ascending. Return the first valid obstruction or None exactly for a congruent profile relation.\",\n    \"obstruction_for_pair\": \"For 