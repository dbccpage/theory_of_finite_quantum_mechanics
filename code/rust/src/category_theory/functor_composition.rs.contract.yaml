      "obligation": "First require full structural equality of owned middle category snapshots, not just equal names. Then compose the admitted raw maps in G-after-F order. Output is deliberately a raw declaration and caller output name is not admitted; lawful reuse still requires the appropriate certificate constructor."
    },
    "opposite_category": {
      "line": 155,
      "signature": "pub fn opposite_category(category: &DeclaredFiniteCategory, name: &str) -> DeclaredFiniteCategory",
      "obligation": "Clone declared object set once. In sorted original morphism-key order, register reversed endpoint names only if absent, then insert a required owned reversed morphism keyed by its value name. This preserves legacy raw key/name normalization and last-write collisions, including endpoints from overwritten rows. Register all foreign identity keys only when absent, copy all identity bindings, and reverse each raw composition pair without filtering. No law checks, interpretation, freshness or raw double-opposite identity are promised; admitted canonical-key closed tables support the mathematical use."
    },
