      "signature": "pub fn compose_declared_functors(\n    name: &str,\n    first: &DeclaredFiniteFunctor,\n    second: &DeclaredFiniteFunctor,\n) -> Result<DeclaredFiniteFunctor, String>",
      "obligation": "Require first target label equal second source label before constructing output. Iterate every first object-map entry in sorted key order, require the corresponding second mapping and insert its actual final image; then do the same for morphisms. First missing object precedes morphism errors, with exact identifying payload. No partial declaration is returned on error; extra second-map entries are ignored. Output endpoints/name are literal caller/first-source/second-target. This is raw partial-map composition, not law admission."
