on\": \"Ordered literal parameter/tag/label refusal\"\n    }\n  },\n  \"invariants\": [\n    \"All public production bodies are mapped above. Constructors move explicit supplied values and store documented defaults; with_note appends only a raw note. They intentionally may construct a candidate that fails validation.\",\n    \"validate_shell reads required String lengths in the recorded order and then the declared threshold/tag predicate, changing no data. Every failed guard returns the existing typed InvalidShape variant with the original payload; every accepted path returns unit only.\",\n    \"The ordered-label proof applies to the finite label prefix. ParameterMetadata.optionalLevel supplies the threshold/tag result where applicable; the first_error/accepted_prefix lemmas preserve the label-before-parameter refusal order. These are models plus a reviewed source relation, not extracted Rust or a law of the named mathematical concept.\",\n    \"Signed levels stay i32, unsigned level/arity stay u32, and the optional bound stays usize on the captured 64-bit target. Comparisons with constants do not overflow or divide. String operations/formatting preserve literal bytes, including whitespace, NUL and Unicode. No partial indexing, recursion, mathematical division or unchecked cast exists.\"\n  ],\n  \"failure_paths\": {\n    \"labels\": \"First exact typed InvalidShape, no mutation or successful artifact.\",\n    \"parameters\": \"None is accepted as an untruncated declaration; Some(i32) must be >= -2. This is not a truncation operation or HIT.\",\n    \"construction\": \"Standard String/&str conversions, derived serde/Clone/Eq and allocator behavior are declared trusted library/runtime contracts; arbitrary caller Into implementations remain external. Validation invokes no caller callback.\",\n    \"representation\": \"Primitive integer wire decoding enforces fixed-width ranges; raw candidate serde roundtrips do not certify semantic validity.\"\n  },\n  \"trust_boundary\": {\n    \"math\": \"Only literal metadata thresholds and tags; no categorical or HoTT premise is silently imported.\",\n    \"runtime\": \"Pinned Rust compiler/std, serde derives and the existing errors::ArithmosError exposed through the canonical crate self-alias. Challenge namespaces import that same actual category crate type. Standard conversion/allocator contracts apply.\",\n    \"model\": \"Pinned Lean/Mathlib kernel checks for ordered labels and separate threshold/tag programs. Source predicate/payload correspondence is explicit source review; no MIR equivalence.\"\n  },\n  \"assurance_limits\": [\n    \"Capability remains L2 raw metadata, not the mathematics suggested by the name.\",\n    \"Contracts pending. No A+, independent compiler, Rust/MIR refinement, allocator totality, author attestation or whole-workspace pass.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/foundations/truncation.score.yaml\",\n      \"sha256\": \"253e189f40e7aeba1bc09231c85b22b0df97f578e1fd0e72c7cdc72676910c30\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
