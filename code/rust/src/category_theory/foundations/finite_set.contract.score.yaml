      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/foundations/finite_set.rs\",\n    \"sha256\": \"6c154362ed87f04513aa3e3f705ca79a7fbda10be3e797fccf805b6b6ac81f5d\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Finite sequences of literal stored UTF-8 String elements. Trimming is solely a non-whitespace-emptiness check and never normalizes element identity. Differently spelled strings, including Unicode compositions or padded names, are distinct elements.\",\n    \"acceptance\": \"Label and every element have a nonempty trimmed view; elements are pairwise distinct under exact stored-string equality; optional declared_cardinality is None or exactly elements.len(). Empty element inventory is allowed.\",\n    \"refusal_order\": \"EmptyLabel first; then first empty or duplicate element in increasing index order, emptiness before duplication at one entry; then CardinalityMismatch {declared,actual}.\",\n    \"raw_and_admitted\": \"FiniteSet constructors/Default/public fields/serde are raw transport. ValidatedFiniteSet owns exactly the checked raw record privately. TryFrom and its serde path re-run all gates, getters expose only shared views, Clone preserves owned checked data, and consuming conversion returns freely mutable raw data.\",\n    \"errors\": \"Public FiniteSetError variants carry exact payloads. Display preserves prior diagnostics and propagates formatter failure. Raw cardinality always reports actual inventory length, including rejected raw records.\",\n    \"authority\": \"None. This establishes a finite literal-set invariant; no real-world entity equivalence, category law, HoTT principle, normalization theorem or physical claim follows.\"\n  },\n  \"operations\": {\n    \"FiniteSetError::fmt\": {\n      \"obligation\": \"Render the four exact error variants and return the formatter result; all indices/counts are usize.\"\n    },\n    \"FiniteSet::new\": {\n      \"obligation\": \"Raw empty inventory with supplied label and Some(0).\"\n    },\n    \"FiniteSet::with_elements\": {\n      \"obligation\": \"Move supplied label/elements, store the actual len as Some(n); admission remains separate.\"\n    },\n    \"FiniteSet::cardinality\": {\n      \"obligation\": \"Observe actual elements.len(), independently of declared validity.\"\n    },\n    \"FiniteSet::validate_shell\": {\n      \"obligation\": \"Trim-emptiness label, per-entry emptiness then BTreeSet duplicate rejection, optional cardinality equality; return unit or exact typed payload without mutation.\"\n    },\n    \"ValidatedFiniteSet::try_from\": {\n      \"obligation\": \"Borrow-check the owned candidate before the sole private-field construction.\"\n    },\n    \"FiniteSet::from(ValidatedFiniteSet)\": {\n      \"obligation\": \"Consume the admitted wrapper and move out the original raw record.\"\n    },\n    \"ValidatedFiniteSet::declared\": {\n      \"obligation\": \"Shared borrow of the checked raw record.\"\n    },\n    \"ValidatedFiniteSet::label\": {\n      \"obligation\": \"Shared borrow of unchanged stored label.\"\n    },\n    \"ValidatedFiniteSet::elements\": {\n      \"obligation\": \"Shared slice of unchanged stored elements.\"\n    },\n    \"ValidatedFiniteSet::cardinality\": {\n      \"obligation\": \"Delegate to the actual inventory length.\"\n    },\n    \"ValidatedFiniteSet::contains\": {\n      \"obligation\": \"Exact stored-string membership by finite iteration; no normalization or trimming.\"\n    }\n  },\n  \"invariants\": [\n    \"The BTreeSet loop invariant is seen = the exact set of already visited tags, all prior tags nonblank and distinct. It starts empty; a nonblank fresh tag extends that prefix; a blank or repeated tag returns before the next iteration. Safe String equality and ordering agree on exact stored identity. Entries are borrowed, not cloned or mutated.\",\n    \"FiniteLiteralSet.scan_success_iff proves finite scan success exactly when all remaining tags satisfy the primitive nonblank predicate, are pairwise distinct, and avoid the initial seen set. Initial seen is empty. The optional cardinality theorem and checks_success_iff add label and actual-list-length binding. admit_preserves_raw and admit_invariants prove data preservation and the full admitted predicate.\",\n    \"Rust correspondence is explicitly reviewed: Unicode trim emptiness is the declared primitive; BTreeSet membership/insert implements the finite set operation, enumerate supplies successive bounded entry indices, and Vec::len supplies exact usize cardinality. The model uses Nat indices/counts, not narrowed coefficient arithmetic. This is not extracted Rust or mechanized MIR refinement.\",\n    \"All entries lie in a finite Vec<String>; enumerate cannot overflow an actual allocated sequence. No index operation, addition, subtraction, multiplication or division is used by production validation. Counts are compared in usize without narrowing; diagnostics retain exact indices/counts.\",\n    \"Only TryFrom constructs the private admitted field, after validation. Derived deserialization calls that TryFrom. There is no admitted Default or public mutable field; shared String/Vec views cannot be mutated in safe Rust. Clone owns checked data, and raw conversion consumes a wrapper, so later raw mutation cannot invalidate a retained admitted clone.\",\n    \"Each fmt branch uses bounded formatting or direct write_str and propagates fmt::Error. Error values are ordinary diagnostic data; constructing an error or raw record does not construct a valid set.\"\n  ],\n  \"failure_paths\": {\n    \"label\": \"EmptyLabel before constructing the seen set or inspecting element data.\",\n    \"entry\": \"EmptyElement or DuplicateElement at the first relevant exact index; no partial admitted artifact is returned.\",\n    \"cardinality\": \"CardinalityMismatch preserves both the caller declaration and actual len, after every entry passes.\",\n    \"serde\": \"Raw FiniteSet serde preserves even rejected candidates. Admitted serde re-runs TryFrom and rejects private wrapper layout; serde type/range errors remain serde errors.\",\n    \"format\": \"All four display branches propagate a failing writer result.\",\n    \"resources\": \"BTreeSet temporary nodes, String/Vec/serde clones and allocations use pinned safe library/runtime contracts. No global allocator totality or memory reservation theorem is asserted.\"\n  },\n  \"trust_boundary\": {\n    \"runtime\": \"Pinned safe Rust/std, String UTF-8 equality/ordering and Unicode-whitespace predicates, BTreeSet insert/membership, Vec ownership/length/iteration, serde derives/json and ordinary allocator/conversion contracts. Arbitrary caller-supplied Into/serializer implementations remain external.\",\n    \"formal\": \"Pinned Lean/Mathlib kernel and standard foundational axioms. The nonblank primitive and BTreeSet-to-Finset/source representation relation are explicit reviewed boundaries, not newly proved Unicode/stdlib implementations.\",\n    \"wire\": \"Serde JSON candidate transport and admitted rechecking only. No signature, author origin, cross-repository attestation or global theorem authority.\"\n  },\n  \"assurance_limits\": [\n    \"Capability L3 bounded literal-set domain and immutable admission, not an L5 theorem inferred from naming.\",\n    \"Contracts pending. No A+, extracted-program/MIR equivalence, Unicode normalization theorem, global allocator totality, external-origin attestation or whole-workspace pass.\",\n    \"Rust source/representation correspondence is reviewed separately from the checked mathematical model. Namespace compilation is shared; candidate test dispatch/state is separate.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/foundations/finite_set.score.yaml\",\n      \"sha256\": \"5bca0fe7ae540d2c67d97396ae9404f32e76ccfaf1486bfeb4bc242b338c8893\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
