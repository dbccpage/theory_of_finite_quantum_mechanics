  "formal_specification": {
    "domain": "Finite sequences of literal stored UTF-8 String elements. Trimming is solely a non-whitespace-emptiness check and never normalizes element identity. Differently spelled strings, including Unicode compositions or padded names, are distinct elements.",
    "acceptance": "Label and every element have a nonempty trimmed view; elements are pairwise distinct under exact stored-string equality; optional declared_cardinality is None or exactly elements.len(). Empty element inventory is allowed.",
    "refusal_order": "EmptyLabel first; then first empty or duplicate element in increasing index order, emptiness before duplication at one entry; then CardinalityMismatch {declared,actual}.",
    "raw_and_admitted": "FiniteSet constructors/Default/public fields/serde are raw transport. ValidatedFiniteSet owns exactly the checked raw record privately. TryFrom and its serde path re-run all gates, getters expose only shared views, Clone preserves owned checked data, and consuming conversion returns freely mutable raw data.",
    "errors": "Public FiniteSetError variants carry exact payloads. Display preserves prior diagnostics and propagates formatter failure. Raw cardinality always reports actual inventory length, including rejected raw records.",
    "authority": "None. This establishes a finite literal-set invariant; no real-world entity equivalence, category law, HoTT principle, normalization theorem or physical claim follows."
  },
