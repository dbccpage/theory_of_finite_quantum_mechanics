      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/abelian/chain_complex_category.rs\",\n    \"sha256\": \"94400fe1cb180f575b519cbbe057c591a20ff69f5e4386bbfa1b7e5ec8e6b98d\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Raw metadata label, i32 lower and upper endpoints, and arbitrary notes. No category or differential law is represented.\",\n    \"degree_span\": \"Returns Some(u32(upper-lower)) iff lower<=upper; otherwise None. The span is a difference, not inclusive cardinality.\",\n    \"validation\": \"Return first InvalidShape for an empty byte-string label, then for inverted endpoints; otherwise Ok. Validation borrows the raw record without changing it.\",\n    \"construction\": \"new sets both endpoints to zero. with_degree_bounds stores the exact supplied endpoints. with_note appends without changing any existing field.\"\n  },\n  \"operations\": {\n    \"new\": {\n      \"obligation\": \"Raw label, zero endpoints and empty notes.\"\n    },\n    \"with_degree_bounds\": {\n      \"obligation\": \"Store both i32 endpoints unchanged.\"\n    },\n    \"with_note\": {\n      \"obligation\": \"Append one converted note; retain the label and both endpoints.\"\n    },\n    \"degree_span\": {\n      \"obligation\": \"Ordered guard followed by exact standard-library unsigned abs_diff, or None for inversion.\"\n    },\n    \"validate_shell\": {\n      \"obligation\": \"Ordered, typed label/bounds guards followed by the sole Ok return.\"\n    }\n  },\n  \"invariants\": [\n    \"For i32 endpoints, lower>=-2^31 and upper<=2^31-1. On the ordered branch, 0<=upper-lower<=2^32-1; the checked DegreeWindow Lean model proves this bound. std i32::abs_diff represents that nonnegative integer in u32 without performing a signed subtraction.\",\n    \"On inversion the query returns None and shape validation returns the second typed error, unless the empty-label guard already returned the first. The separately checked ordered-predicate model and direct source-stage mapping establish no successful result after a required validation refusal.\",\n    \"All constructors return raw metadata, so invalid raw declarations are not silently promoted. No field is an admitted category or chain-complex certificate.\"\n  ],\n  \"failure_paths\": {\n    \"empty_label\": \"InvalidShape(\\\"empty label\\\"), tested as an exact typed payload.\",\n    \"inverted_bounds\": \"degree_span None; validator InvalidShape with the actual signed endpoints in their original order.\",\n    \"overflow\": \"The pre-fix checked i32 subtraction panicked for MIN..MAX. It is retained as an E-level historical witness. The replacement uses abs_diff after the order check.\",\n    \"allocation_and_conversion\": \"Ordinary String/Vec allocation and caller-owned Into behavior are declared runtime boundaries; the arithmetic query itself allocates nothing.\"\n  },\n  \"trust_boundary\": {\n    \"numeric\": \"i32 and u32 representation and the exact std abs_diff contract under the pinned Rust compiler/runtime. No float, saturating approximation or narrowing signed subtraction is used.\",\n    \"proof\": \"Lean kernel, pinned Mathlib, standard foundational axioms only. The arithmetic/refusal models are not Rust/MIR refinement proofs.\",\n    \"runtime\": \"Safe Rust, standard String/Vec operations and serde-derived raw representation. No unsafe, production indexing or recursion.\"\n  },\n  \"assurance_limits\": [\n    \"Capability is L2 metadata and a bounded integer query, not a category of chain complexes.\",\n    \"Contracts remain pending.\",\n    \"No A+, extracted program, mechanized Rust/MIR equivalence, global allocator/crash-freedom proof, cross-repository attestation or whole-workspace pass is claimed.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/abelian/chain_co