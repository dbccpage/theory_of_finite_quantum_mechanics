  urn: "urn:tfqm:rust:category_theory:finite_report_query"
  description: "Total finite report/query decision contract (realized-image factorization).  AuthorityEffect: None.  Inputs are explicitly enumerated finite sets `X` (source), `A` (report codomain) and `B` (query codomain), together with row tables that must be total functions `p: X -> A` and `q: X -> B`. Admission refuses duplicate carrier identities, duplicate rows (including identical duplicates), missing rows, extraneous rows and values outside the declared codomain. Codomain membership is a typing premise of `p: X -> A`, not a separate profile check that may disagree with it.  On admitted input exactly one outcome holds:  * `Factorable`: there is one and only one table `D: P -> B` on the realized image `P = p(X)` with `D(p(x)) = q(x)` for every `x`; * `Collision`: there are `x, y` with `p(x) = p(y)` and `q(x) != q(y)`.  The decoder is unique on `P` only; outside `P` it is not determined, so it is not emitted there. Refinement transfer is one-way: if `p = h . p_f` and `q` factors through `p`, then `q` factors through `p_f` with `D_f = D_c . h`; the converse fails (see the tests)."
  scope: "Only the source-bound runtime behavior; no formal theorem, physical derivation or authority promotion is certified."
