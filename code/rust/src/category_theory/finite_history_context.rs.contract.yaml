    "profile": "Exact finite usize state/symbol identities and ordered word concatenation, without approximation.",
    "domain": "Admitted finite total control transducers over the same alphabet as admitted total memory, valid start, and separately admitted reachable-state actions. Arbitrary HistoryContext implementations have no inferred global guarantee.",
    "behavior": [
      "Create the one root vertex with no parent, exact state-to-ID entry 0, and cursor 0. Private concrete product triples, without a public unchecked model constructor.",
      "Read the current vertex with checked get; advance cursor once and return its stable ID and triple. Append-only vertex order is FIFO discovery order. None means every discovered vertex was processed.",
      "For a fresh product triple only, save the next dense ID and one earlier parent/input link. Existing triples keep their first discovery and parent. No full word is copied.",
      "Follow valid strictly decreasing predecessor IDs to the root, collect input labels backwards, and reverse once. Reconstruct exactly the first shortest lexicographic discovery word. Called only for returned collision witnesses.",
      "Require nonempty control states, initial index in range, matching state arrays, total state/input transition and emission shapes, valid control destinations, and all emitted digits inside the declared alphabet. Alphabet zero is valid with empty emissions. Move and privately own all tables; otherwise InvalidTransducer.",
      "Return the stored declared alphabet cardinality, including zero.",
      "Return the positive control-transition row count.",
      "Build a one-control-state transducer emitting the supplied image of each input, with no initial or final emission. Actual constructor checks every image; an empty alphabet is valid.",
      "Build a one-control-state identity emission transducer with the supplied initial prefix and no final suffix. Constructor checks prefix digits.",
      "Build a one-control-state identity emission transducer with no initial prefix and the supplied final suffix. Constructor checks suffix digits.",
      "Check alphabet then start. Explore the complete reachable (source memory, control, emitted-prefix memory) graph. Apply final emission only to the observation at each vertex. Save the first image and representative vertex per source state; return the first conflicting canonical word pair, or exact images with None only on unreachable source states and the full reachable-product count.",
      "Explore the same complete product graph and final emissions. Compare literal memory reports of original and transformed states. Save the first target report and representative ID per source report; return the first pair with equal source reports and unequal target reports, or None. This differs from state-image descent.",
      "Reject alphabet mismatch before invalid start, then initialize source=start, control=declared initial, and output memory after initial emission. No final emission is carried into the search root.",
      "For each input in ascending order update source memory, control state, and emitted-prefix memory using only that transition emission. Admit each fresh triple with its current parent ID. Final emissions never feed the next step.",
      "Recompute the entire canonical descent result for self, memory, and start. Exact mismatch gives InvalidCertificate; admission errors propagate. This verifies a result without authenticating external context identity.",
      "Start with initial output, read input digits left to right, reject an invalid digit before indexing, append the old control state transition emission, advance control, and append the final control emission once. Preserve exact word order and multiplicities.",
      "Reject invalid initial memory state first, then process the word left to right with an alphabet check before each transition. Return the exact total action result, including empty-word identity.",
      "Require valid start and an in-range action of memory-state length. BFS computes first shortest lexicographic representative histories. Reject exactly when a reachable source state has an unreachable action image. Unreachable source states impose no closure requirement. Own the admitted memory, action, and required representative words.",
      "Borrow exact canonical representative histories, with None precisely for unreachable states.",
      "Borrow the exact admitted state action.",
      "Run the valid input history to its reachable state and return an owned copy of the representative of its action image. Admission ensures that representative exists. Invalid words and initial-state errors propagate; unavailable lookup remains a defensive typed failure."
