      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/functor/functor.rs\",\n    \"sha256\": \"f0910eb6749ba84a342d93b11dbc130e9fe288091d88663c7d7b5d7f59f428fc\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"Raw mutable literal metadata. Required fields and every selected inventory component are nonempty byte strings; whitespace/Unicode/NUL and arbitrary nonempty labels are permitted. Empty inventories are permitted. No referential integrity, totality, monotonicity, naturality, adjoint, commutative-square or lifting law is admitted.\",\n    \"ordered_labels\": [\n      \"label\",\n      \"source_category\",\n      \"target_category\"\n    ],\n    \"ordered_inventories\": [\n      {\n        \"field\": \"object_map\",\n        \"kind\": \"pairs\",\n        \"fields\": [\n          \"a\",\n          \"b\"\n        ],\n        \"diagnostic\": \"empty object_map tag at index {i}\",\n        \"loop\": \"for (i, (a, b)) in self.object_map.iter().enumerate()\",\n        \"source_operands\": [\n          \"a.is_empty()\",\n          \"b.is_empty()\"\n        ]\n      },\n      {\n        \"field\": \"morphism_map\",\n        \"kind\": \"pairs\",\n        \"fields\": [\n          \"a\",\n          \"b\"\n        ],\n        \"diagnostic\": \"empty morphism_map tag at index {i}\",\n        \"loop\": \"for (i, (a, b)) in self.morphism_map.iter().enumerate()\",\n        \"source_operands\": [\n          \"a.is_empty()\",\n          \"b.is_empty()\"\n        ]\n      }\n    ],\n    \"construction\": \"Constructors/setters store raw data without mathematical admission. Vec append or list replacement preserves the declared input order; raw flags remain declarations. Serde remains raw transport.\",\n    \"acceptance\": \"All ordered required fields and all ordered selected entry components satisfy nonemptiness. Other fields remain unconstrained declarations. Success returns unit only.\",\n    \"failure\": \"First required-label failure then first invalid collection/entry returns existing typed InvalidShape with its exact specified diagnostic. For maps iteration is BTreeMap key order; the shared entry diagnostic does not claim a numeric insertion index. No validation mutation or partial admitted artifact.\",\n    \"specific_operation\": \"No operation beyond the mapped raw data construction/assignment and literal inventory validation.\"\n  },\n  \"operations\": {\n    \"Functor::new\": {\n      \"signature\": \"pub fn new(label: impl Into<String>) -> Self\",\n      \"classification\": \"Raw constructor, flag default, assignment or append; no mathematical-law admission\"\n    },\n    \"Functor::between\": {\n      \"signature\": \"pub fn between( label: impl Into<String>, source_category: impl Into<String>, target_category: impl Into<String>, ) -> Self\",\n      \"classification\": \"Raw constructor, flag default, assignment or append; no mathematical-law admission\"\n    },\n    \"Functor::with_object_map\": {\n      \"signature\": \"pub fn with_object_map(mut self, object_map: Vec<(String, String)>) -> Self\",\n      \"classification\": \"Raw constructor, flag default, assignment or append; no mathematical-law admission\"\n    },\n    \"Functor::with_morphism_map\": {\n      \"signature\": \"pub fn with_morphism_map(mut self, morphism_map: Vec<(String, String)>) -> Self\",\n      \"classification\": \"Raw constructor, flag default, assignment or append; no mathematical-law admission\"\n    },\n    \"Functor::validate_shell\": {\n      \"signature\": \"pub fn validate_shell(&self) -> Result<(), ArithmosError>\",\n      \"classification\": \"Ordered raw label/component refusal\"\n    }\n  },\n  \"invariants\": [\n    \"Flatten required literal labels then each selected collection/component in source order. The first empty String returns its exact typed diagnostic without mutation. Constructors/setters are raw data; no law is admitted.\",\n    \"Flatten individual nonempty String checks into the unchanged ordered-predicate model, giving every component of one entry the same diagnostic. The OR-of-empty condition is the complement of the required conjunction. success_iff/first_error_preserved apply to any finite inventory, including empty lists. This is source-reviewed correspondence, not extracted Rust/MIR.\",\n    \"Borrowed iter()/enumerate() yields actual bounded entries; no mutable validation, unchecked indexing or numeric conversion occurs. The prefix invariant extends on a valid entry and exits at the first violation. All 42 public production methods in this twelve-file batch have owner-qualified body maps.\",\n    \"Raw constructors, field/list replacement, append and flag defaults do not construct an admitted mathematical wrapper. Standard String/Vec/conversion/allocator contracts remain explicit dependencies.\"\n  ],\n  \"failure_paths\": {\n    \"required_labels\": \"First literal empty field, exact InvalidShape(empty FIELD).\",\n    \"inventory\": \"First invalid component of the first invalid entry, in the stated collection order. Entry components share the policy diagnostic, so no stronger component-name claim is made.\",\n    \"raw_transport\": \"Derived serde may construct rejected raw candidates, which must still call validate_shell. No admitted wrapper exists in these modules.\",\n    \"runtime\": \"Validation performs no user callback, rational arithmetic, narrowing cast, partial index or mutable operation. Standard String/&str constructor conversions, arbitrary caller Into implementations and allocator behavior remain the ordinary external runtime boundary.\"\n  },\n  \"trust_boundary\": {\n    \"model\": \"Unchanged kernel-checked ordered finite String-predicate/refusal model with standard foundational axioms. Dynamic inventory-to-list relation and runtime enumeration are source reviewed.\",\n    \"runtime\": \"Pinned safe Rust/std, actual crate errors::ArithmosError via the canonical self-alias, serde derives and standard allocator/conversion contracts.\",\n    \"adapter\": \"Only OppositeCategoryShell requires a parent category import adapter for the actual current MorphismTriple provider; no provider algorithm is cloned. Typed InvalidShape comes from the canonical category self-alias or that same real crate in challenge namespaces.\"\n  },\n  \"assurance_limits\": [\n    \"Capability remains L2 raw metadata and literal data operations; named mathematical objects are not admitted by these shape checks.\",\n    \"Contracts pending. No A+, independent compiler, Rust/MIR refinement, allocator-totality theorem, origin authentication or whole-workspace pass.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/functor/functor.score.yaml\",\n      \"sha256\": \"345f7f01fbf84f0a9d97017e66d8fe8524614f1eb804c87de8dd92e0f443e4ac\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
