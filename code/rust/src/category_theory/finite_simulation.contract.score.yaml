smatch preserving both exact values and coordinate; equal Options continue. Both unavailable is equal but never an added availability. Exact mode never permits added availability; extension may not drop or alter an old defined mapped target. Mutates only caller-owned provisional output vector.\",\n      \"Precondition: state < admitted map length = source state count, valid target map, one fully typed word per source input. Check raw report equality before any step in this state. For each macro in input order compare mapped source target (or None) against full target.run at mapped state. compare_step appends extension additions or returns first mismatch. Provider errors map to InvalidEncoding defensively; with these admitted tables/full alphabet checks that branch is not publicly reachable. No state data changes.\",\n      \"Ordered phase composition map->encoding->checked budget, then states in ascending source index. Stop at first report/step mismatch and return it as an Ok decision, discarding provisional additions from earlier coordinates. Only when every report/step is compatible return Checked with all and only added availability coordinates in source-state/input order. Exact defines partial-step simulation with report preservation, hence every encoded word; extension requires injective map and preserves every old defined step, while additions are explicit.\",\n      \"Recompute with all expected source/target/map/encoding/mode/budget arguments, propagate typed admission/resource refusals first, then compare entire canonical SimulationDecision structurally. Ok(()) may verify a correct ReportMismatch or StepMismatch diagnostic; it does not mean a successful simulation. Only a Checked decision certifies compatible admitted input. Any coordinate, payload, ordering or added-list difference is CertificateMismatch.\"\n    ],\n    \"provider_correspondence\": \"PartialDynamics private new rejects empty reports, transition-row count/width mismatch and out-of-range Som