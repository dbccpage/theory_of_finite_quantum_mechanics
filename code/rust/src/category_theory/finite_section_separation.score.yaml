  urn: "urn:tfqm:rust:category_theory:finite_section_separation"
  description: "Separation of finite section records with declared domains, and the quotient identity of an exact rational pseudometric.  AuthorityEffect: None.  A section record is `(id, D, v)` with a unique identity, an explicit finite coordinate set `D` and a total table `v: D -> Q`. Equal list lengths do not identify coordinate sets: records are compared only on a declared common domain, and a record on another domain is refused as incomparable.  For an admitted finite pseudometric `d` on record identities and an admitted equivalence `E`, with `Z = {(s,t) : d(s,t) = 0}`:  * the inherited distance on `S/E` is well defined exactly when `E \u2286 Z` (otherwise `IdentificationNotZero`); * it separates classes exactly when `E = Z` (otherwise `ZeroCollision`); * with at least two classes, `\u0394 = min{d(s,t) : not E(s,t)}` is positive and attained (otherwise `NoDistinctClasses` for one class).  An \u03b5-decoder bounds every report fiber by `2\u03b5`; with `2\u03b5 < \u0394` the class-valued query factors through the report, decided by the DP-1 owner [`crate::finite_report_query`]. All arithmetic is exact (`BigRational`)."
  scope: "Only the source-bound runtime behavior; no formal theorem, physical derivation or authority promotion is certified."
