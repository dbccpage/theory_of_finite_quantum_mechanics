        "signature": "pub fn fail(unit: &str, violations: Vec<String>) -> Self",
        "obligation": "Store exact unit and owned message vector with passed=false, even if messages are empty."
      },
      "ValidationReport::new": {
        "signature": "pub fn new(name: &str) -> Self",
        "obligation": "Store exact target name and empty vectors. Empty report is vacuously passing; names are unvalidated metadata."
      },
      "ValidationReport::add": {
        "signature": "pub fn add(&mut self, result: ValidationResult)",
        "obligation": "Append one supplied raw result unchanged. Public passed/messages fields may contradict; only passed flags enter success/failure counts."
      },
      "ValidationReport::add_violation": {
        "signature": "pub fn add_violation(&mut self, violation: ValidationViolation)",
        "obligation": "Append one failed result with exact Debug unit name and cloned message, then move the complete typed issue to typed_violations. Error/Warning/Info all block all_passed. Type renderer is diagnostic text, not a stable wire format."
      },
      "ValidationReport::add_typed": {
        "signature": "pub fn add_typed(&mut self, unit: &str, violations: Vec<ValidationViolation>)",
        "obligation": "Empty batch appends exactly one passing result and no typed issue. Nonempty batch appends one failed result named by the separate batch unit, projects messages in input order and moves complete typed issues in that same order. Batch unit need not equal issue units; failure_count counts result rows, not individual issues."
