      "ValidationReport::failure_count": {
        "signature": "pub fn failure_count(&self) -> usize",
        "obligation": "Count false result flags only. Count is at most results.len(), hence fits actual usize Vec length; no sum of unbounded external counts."
      },
      "ValidationReport::violation_count": {
        "signature": "pub fn violation_count(&self) -> usize",
        "obligation": "Return exactly typed_violations.len(), independent of result row count and severity."
      }
    },
