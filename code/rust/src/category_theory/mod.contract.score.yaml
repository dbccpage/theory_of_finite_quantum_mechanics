m variants;Witness exposes raw mutable name with standard Clone/PartialEq/Eq/Debug. Both aliases point to legacy providers. Hierarchical/legacy module catalogs expose actual providers but do not inherit their capabilities as per-file algorithms. All provider mathematics remains separately scored,including incomplete records.\"\n  ],\n  \"failure_paths\": {\n    \"morphism_eq\": \"No own refusal or panic;delegates exactly once to potentially arbitrary user Eq. No Eq axioms/category laws admitted.\",\n    \"Witness::new\": \"No label admission;conversion may panic/allocate as TCB;exact returned string stored includingempty. No extra callback or clone.\",\n    \"traits\": \"Abstract programmer implementations may return None/Err or violate mathematical laws;type checking does not certify semantic axioms.\",\n    \"catalog\": \"Canonicalrootcompilesunadapted;compatibilitydefaultbodiescompileonlywithexplicitprovideraliasadapter. No separate child nominal identity guarantee.\"\n  },\n  \"trust_boundary\": \"Rust compiler/std,caller Eq and Into<String> behavior,standard derives,canonical child providers. Lean pure callback-value model,not arbitrary Rust callback purity/termination/allocator or full module graph semantics.\",\n  \"assurance_limits\": [\n    \"Contracts pending;AuthorityEffect None.\",\n    \"Category/monoidal/law abstract signatures do not check axioms;raw labels are not certificates.\",\n    \"Exported modules retain their own independent scores;whole-workspace/GlobalGreen not claimed.\",\n    \"Copied namespaces use explicit actual-provider aliases and do not test separate nominal child instantiation or standalone mod.rs root.\",\n    \"Callback failures/allocation/termination outside own two-body control;native finite callback probes not a universal guarantee.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/mod.score.yaml\",\n      \"sha256\": \"ea368079a1592b0c4beeddf6fbc3a1139afe26a645f425d886c75af9ad20e7f5\"\n