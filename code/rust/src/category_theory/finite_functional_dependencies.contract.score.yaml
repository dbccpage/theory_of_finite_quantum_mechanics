re docs,loop extraction and pure cached usize join layout. Old and new calls to T equality/clone occur in the same row/coordinate order under these lawful trait assumptions;standard usize layout computations have no user T callbacks. No redundant row/payload clones or position scans occur within pair loops. Required projected-record clone feeds two distinct owned outputs;lost original FD clones and required T row clones remain. Max output16384rows of <=8values;payload byte size and allocator/runtime bound are not inferred. fmt write! has one formatting delegation and no hidden domain branch. Derived serde/Debug/Clone/Eq code is compiler/library TCB,not counted as expanded AST.\"\n  ],\n  \"failure_paths\": {\n    \"FdRefusal::fmt\": \"Standard Debug formatting of typed refusal,including all saved violation indices;no hidden mathematical decision.\",\n    \"Work::spend\": \"Private invariant 0<=used<=limit. Refuse at equality before increment; otherwise charge exactly one FD/subset inspection. limit=MAX safe because used<limit before addition.\",\n    \"heading\": \"First reject arity outside1..8 or original cover>128 as UnsupportedHeading; only then shift. Refuse any determinant/dependent bit outside heading. Empty and duplicate covers valid.\",\n    \"close\": \"Validate heading/input. Start exactly input. Each ordered full scan charges every FD, applies only enabled strictly growing dependency,and saves its original index. Include final stable scan. <=8strict attribute additions;return least closed superset or BudgetUnknown without partial result.\",\n    \"closure\": \"Create private zero-used budget and delegate close. Empty FD cover has zero-cost stable pass and succeeds even budget0.\",\n    \"verify_closure\": \"Validate heading and both masks. Replay only in-range enabled strictly growing applications from input;require saved result equality and closure under every FD. Alternate valid strict derivations accepted;no requirement of canonical producer order,ext