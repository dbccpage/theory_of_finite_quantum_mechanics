determinant true.\",\n    \"first_violation\": \"Private validated rows and dependency masks. Visit first ascending then second<first ascending;test determinant agreement before negated dependent agreement. Return earliest pair exactly orNone. No row or mask copies.\",\n    \"JoinLayout::new\": \"JoinLayout private constructor:arity before shifts,nonempty in-heading components,cover and<=128 input counts elseInvalidDecomposition. Compute pure usize indices/shared pairs/original-heading output exactly once;left values preferred on intersection. No arbitrary T callbacks or per-row-pair layout allocation.\",\n    \"JoinLayout::column\": \"Find first original attribute index in left;otherwise checked right lookup. Cover guarantees existence on constructor path;private direct missing case still returnsInvalidDecomposition rather than unwrap panic.\",\n    \"JoinLayout::matches\": \"Private shape-admitted rows:compare exactly shared column pairs in ascending left attribute order. Empty intersection true. No copies or allocations.\",\n    \"JoinLayout::row\": \"Private shape-admitted rows:clone exactly one chosen value per original attribute,ascending heading,left preferred. Owned Vec is required output. Match has only two finite branch variants;no payload conversion or arithmetic.\",\n    \"natural_join\": \"Preflight layout then both row widths,including empty opposing relation;shape refusal InstanceShape. Left-major/right-minor at most128*128 pairs;compare cached shared positions,materialize only matching rows,insert into result set. No repeated position scans or redundant T/output Vec clones in pair loop.\"\n  },\n  \"trust_boundary\": \"Rust/std/serde/compiler,preparedLean/Mathlib;lawful compatible Ord/Eq and value-preserving Clone. No SQL semantics,extracted Rust theorem,allocator/callback totality or database authority.\",\n  \"assurance_limits\": [\n    \"Contracts pending.\",\n    \"No admitted immutable schema/report certificate;raw serde is untrusted.\",\n    \"