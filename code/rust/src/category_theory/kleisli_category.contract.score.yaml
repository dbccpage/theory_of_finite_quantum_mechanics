          "urn": "urn:tfqm:rust:category_theory:kleisli_category",
          "description": "Kleisli Category Construction — Spec Section 23.  Given a finite category C and a finite monad T on C, the Kleisli category C_T has: - Objects: Same as C. - Morphisms A → B: Morphisms A → T(B) in C. - Identity on A: The monad unit η_A : A → T(A). - Composition of f : A → T(B) and g : B → T(C): Defined as μ_C ∘ T(g) ∘ f.  This module provides two entry points following the Declared → Validated discipline:  - `declare_kleisli_category`: builds raw `DeclaredFiniteCategory` from unvalidated monad data. The caller is responsible for validation.  - `build_validated_kleisli_category`: accepts a `ValidatedFiniteCategory` and `ValidatedFiniteMonad`, constructs the Kleisli category, and returns a `ValidatedFiniteCategory` on success.",
