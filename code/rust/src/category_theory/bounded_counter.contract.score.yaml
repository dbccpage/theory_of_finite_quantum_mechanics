      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/bounded_counter.rs\",\n    \"sha256\": \"0dd87ffb60cff60ef045771a539e8b87ecafb772f7751cc2171337b5dd7fc2c0\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"domain\": \"A finite horizon r:usize and a private clipped class c with 0<=c<=r. It represents min(n,r) for a conceptual unbounded nonnegative integer n; it does not execute a wrapping native integer counter.\",\n    \"admission\": \"from_count injects its bounded input count into this quotient. try_from_clip admits exactly c<=r; a larger integer owner is responsible for supplying its correct clip. Every admitted c has the native representative n=c.\",\n    \"transition\": \"At r=0 every event refuses ContextExhausted. Otherwise r decreases by one; increment is n->n+1, decrement refuses exactly n=0 and otherwise n->n-1. Successful reports are the clip at the new horizon.\",\n    \"observation\": \"Read the word left to right, stopping at the first typed refusal. An unexecuted long suffix cannot replace an earlier GuardRefusal with ContextExhausted.\",\n    \"separation\": \"At a shared horizon equal classes return None. Distinct classes return k=min(c,d)+1<=r, the minimal possible distinguishing continuation length for future legality. k decrements distinguish them; all shorter words are native-guard legal on both. Different horizons return DifferentDepths.\",\n    \"limits\": \"The conceptual r+1 class count is not allocated or computed as a machine-size integer. No unrestricted-continuation congruence or physical/native-state custody is claimed.\"\n  },\n  \"operations\": {\n    \"CounterEvent\": {\n      \"obligation\": \"Closed increment/decrement alphabet.\"\n    },\n    \"CounterBoundary\": {\n      \"obligation\": \"Exactly native guard refusal or exhausted context budget.\"\n    },\n    \"CounterReportError\": {\n      \"obligation\": \"Exactly invalid clip or mismatched comparison horizons.\"\n    },\n    \"CounterReport\": {\n      \"obligation\": \"Private Copy value carrying horizon and admitted clipped class.\"\n    },\n    \"from_count\": {\n      \"obligation\": \"min(count,r) admits the invariant for every bounded input count.\"\n    },\n    \"try_from_clip\": {\n      \"obligation\": \"Reject c>r before constructing the value.\"\n    },\n    \"remaining\": {\n      \"obligation\": \"Read the private horizon without mutable exposure.\"\n    },\n    \"clipped\": {\n      \"obligation\": \"Read the private admitted class without mutable exposure.\"\n    },\n    \"advance\": {\n      \"obligation\": \"Budget guard, native zero/decrement guard, range-safe increment and clipped transition.\"\n    },\n    \"observe\": {\n      \"obligation\": \"Standard Result::try_fold preserves order and first-error payload.\"\n    },\n    \"separating_removals\": {\n      \"obligation\": \"Same-depth guard, lazy None for equality, otherwise a bounded positive minimal decrement length.\"\n    }\n  },\n  \"invariants\": [\n    \"clip_bound proves c<=r. Private fields, admitted constructors and Copy-only observation prevent safe callers from injecting c>r. There is no Deserialize implementation or mutable field/getter.\",\n    \"For r>0, guard_exact proves c=0 iff n=0. increment_step and decrement_step prove the clipped transition identities over Nat, independent of fixed-width arithmetic. The checked budget subtraction rules out r=0 before computing a successor report.\",\n    \"In the increment addition branch c<r-1, increment_branch_bound gives c+1<=r-1<=usize::MAX; the other branch returns r-1 without adding. Decrement uses checked_sub and min(new_budget). Every successful branch therefore preserves c<=r.\",\n    \"For distinct c,d<=r, separator_bound gives min(c,d)+1<=r; the arithmetic cannot overflow. Equality uses lazy bool::then, so MAX+1 is never evaluated for equal MAX classes.\",\n    \"A pure decrement prefix of length min(c,d)+1 reaches zero then refuses in the smaller native class and remains legal in the larger class. decrement_separator supplies the necessary bounds; short_words_legal proves every shorter event word is native-guard legal in both. Such words fit the shared horizon, so none can distinguish by budget refusal.\",\n    \"Left-to-right standard iterator/Result semantics compose the per-step invariant without mutation or partial state output after a refusal. Namespace/package identity is irrelevant to these production bodies: they use only their private value, closed enums, std operations and a borrowed slice.\"\n  ],\n  \"failure_paths\": {\n    \"invalid_clip\": \"ClipExceedsDepth before any CounterReport construction.\",\n    \"zero_budget\": \"ContextExhausted before processing either event.\",\n    \"zero_decrement\": \"GuardRefusal at the first decrement of a zero class with positive budget.\",\n    \"comparison\": \"DifferentDepths before any separator arithmetic.\",\n    \"error_commit\": \"Result::Err returns no successor report. The original Copy input and external source owner remain unchanged.\"\n  },\n  \"trust_boundary\": {\n    \"runtime\": \"Pinned safe Rust compiler/runtime, usize checked_sub/min, lazy bool::then and standard Result iterator contracts. No allocation, unsafe, user callback, serialization or production recursion occurs.\",\n    \"proof\": \"Eight checked Lean clipping/guard/transition/bound/separation/native-word lemmas under a clean pinned Mathlib. These are mathematical models plus source correspondence, not Rust/MIR extraction or crash-freedom verification.\",\n    \"owner\": \"try_from_clip checks its own class domain, not the accuracy of an unseen owner count. An owner mapping a BigInt must prove the clip relation before relying on the bounded answer.\"\n  },\n  \"assurance_limits\": [\n    \"The delivered capability is L3 bounded-domain quotient computation; no L5 promotion based on mathematical terminology.\",\n    \"The checked model is not mechanized Rust/MIR refinement, allocator/crash-freedom proof, cross-repository authorship attestation or a claim about a whole native WDP owner execution.\",\n    \"Contracts remain pending, and no whole-directory A or unrestricted-continuation result is inferred.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/bounded_counter.score.yaml\",\n      \"sha256\": \"682848434e716ad05f7b53583cb6261154e7dbab0b8fb74f973bb8898781073c\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
