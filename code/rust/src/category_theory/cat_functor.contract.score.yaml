      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/cat_functor.rs\",\n    \"sha256\": \"73fb34edfa85a62b2ceee2423130cf88ba3d3744f628be8653753afc0f9a5960\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact retained: admitted finite identifier categories/maps, exact string equality and defined table composition, with no own fixed-width arithmetic, float or unadmitted numeric extension.\",\n    \"certificate\": \"The immutable owned certificate admits exactly nonblank correctly bound finite declarations with exact source map domains, known target images, both preserved boundaries, actual identities and every source table composite. Source and target are already admitted categories, not just matching names.\",\n    \"raw\": \"Generic trait signatures express caller obligations. Public raw records and legacy supplied-case/name diagnostics remain unchecked; id_ diagnostic is a literal naming rule only, empty domains vacuous.\"\n  },\n  \"operations\": {\n    \"ValidatedFiniteFunctor::try_new\": {\n      \"line\": 47,\n      \"signature\": \"pub fn try_new(\\n        declared: DeclaredFiniteFunctor,\\n        source: ValidatedFiniteCategory,\\n        target: ValidatedFiniteCategory,\\n    ) -> Result<Self, FunctorAdmissionError>\",\n      \"obligation\": \"Move raw declaration and two already admitted owned endpoint categories into a private candidate. Binding, exact map domains/images, both boundaries, actual identities and every source composite must all return Ok in that order before releasing the candidate. Any typed error returns no certificate; no rollback of caller/global effects is needed because these are immutable internal checks.\"\n    },\n    \"ValidatedFiniteFunctor::declared\": {\n      \"line\": 65,\n      \"signature\": \"pub fn declared(&self) -> &DeclaredFiniteFunctor\",\n      \"obligation\": \"Borrow immutable raw declaration inside admitted certificate; no mutable access/deserialization bypass exists.\"\n    },\n    \"ValidatedFiniteFunctor::source\": {\n      \"line\": 68,\n      \"signature\": \"pub fn source(&self) -> &ValidatedFiniteCategory\",\n      \"obligation\": \"Borrow the owned admitted source category.\"\n    },\n    \"ValidatedFiniteFunctor::target\": {\n      \"line\": 71,\n      \"signature\": \"pub fn target(&self) -> &ValidatedFiniteCategory\",\n      \"obligation\": \"Borrow the owned admitted target category, not the source.\"\n    },\n    \"ValidatedFiniteFunctor::on_object\": {\n      \"line\": 74,\n      \"signature\": \"pub fn on_object(&self, object: &str) -> Option<&str>\",\n      \"obligation\": \"Delegate exact borrowed lookup to the stored object map; outside-domain identifiers return None.\"\n    },\n    \"ValidatedFiniteFunctor::on_morphism\": {\n      \"line\": 77,\n      \"signature\": \"pub fn on_morphism(&self, morphism: &str) -> Option<&str>\",\n      \"obligation\": \"Delegate exact borrowed lookup to stored morphism map; outside-domain identifiers return None.\"\n    },\n    \"ValidatedFiniteFunctor::check_binding\": {\n      \"line\": 81,\n      \"signature\": \"fn check_binding(&self) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"Reject whitespace-only functor name first, then any mismatch of raw endpoint names against owned admitted endpoints. No reliance on names alone for category laws: actual endpoint objects are owned admitted categories.\"\n    },\n    \"ValidatedFiniteFunctor::check_maps\": {\n      \"line\": 93,\n      \"signature\": \"fn check_maps(&self) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"Ordered key equality enforces exact total object and morphism source domains, excluding missing and extra keys. Then validate every object image and every morphism image against actual admitted target membership, with exact objects/morphisms kind payloads and phase precedence.\"\n    },\n    \"ValidatedFiniteFunctor::check_boundaries\": {\n      \"line\": 119,\n      \"signature\": \"fn check_boundaries(&self) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"For every actual admitted source arrow, compare actual target boundary of its mapped arrow against both mapped source endpoints. Reject missing or unequal boundaries with the first sorted source arrow name. No silently skipped unknown images.\"\n    },\n    \"ValidatedFiniteFunctor::check_identities\": {\n      \"line\": 136,\n      \"signature\": \"fn check_identities(&self) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"Use each actual source identity binding and actual target identity binding at the mapped object; require a defined expected identity and equal mapped arrow, with exact first object error. No id_ naming assumption in certificate admission.\"\n    },\n    \"ValidatedFiniteFunctor::check_compositions\": {\n      \"line\": 150,\n      \"signature\": \"fn check_compositions(&self) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"Build one shared borrowed target-composition view. For every actual admitted source composition row (first,second,result), map both arrows, compose in target in first-then-second order, and require a defined equal image of result. Return first sorted pair error otherwise. Source category admission establishes this table is exactly the composable domain.\"\n    },\n    \"check_images\": {\n      \"line\": 166,\n      \"signature\": \"fn check_images(\\n    map: &BTreeMap<String, String>,\\n    contains: impl Fn(&str) -> bool,\\n    kind: &'static str,\\n) -> Result<(), FunctorAdmissionError>\",\n      \"obligation\": \"Private known callsites pass only immutable target object/arrow membership predicates. Scan map values in key order and reject the first nonmember with exact kind/image; no external/public callback is admitted by this helper.\"\n    },\n    \"CompositionLookup::new\": {\n      \"line\": 194,\n      \"signature\": \"pub(crate) fn new(table: &'a CompositionTable) -> Self\",\n      \"obligation\": \"Build one borrowed row per sorted unique BTreeMap pair key, without filtering, sorting, owned key copies or changing associations. String and str lexicographic order agree. Immutable borrowing prevents mutation during the view lifetime. This is the prior category-validator lookup moved into a crate-visible shared helper taking the same underlying table directly.\"\n    },\n    \"CompositionLookup::compose\": {\n      \"line\": 202,\n      \"signature\": \"pub(crate) fn compose(&self, first: &str, second: &str) -> Option<&'a str>\",\n      \"obligation\": \"Use exact first/second borrowed tuple binary search and checked Vec::get to observe the corresponding borrowed result or None. No query-key String allocation or unsafe index. Only crate-level access is widened; fields stay private.\"\n    },\n    \"DeclaredFiniteFunctor::new\": {\n      \"line\": 267,\n      \"signature\": \"pub fn new(name: &str, source: &str, target: &str) -> Self\",\n      \"obligation\": \"Own exact raw name/source/target names and initialize independent empty object/morphism BTreeMaps without certification.\"\n    },\n    \"DeclaredFiniteFunctor::map_object\": {\n      \"line\": 277,\n      \"signature\": \"pub fn map_object(&mut self, src: &str, tgt: &str)\",\n      \"obligation\": \"Insert/overwrite exact owned source->target object name pair, leaving morphism map unchanged.\"\n    },\n    \"DeclaredFiniteFunctor::map_morphism\": {\n      \"line\": 281,\n      \"signature\": \"pub fn map_morphism(&mut self, src: &str, tgt: &str)\",\n      \"obligation\": \"Insert/overwrite exact owned source->target morphism name pair, leaving object map unchanged.\"\n    },\n    \"DeclaredFiniteFunctor::on_object\": {\n      \"line\": 285,\n      \"signature\": \"pub fn on_object(&self, obj: &str) -> Option<&str>\",\n      \"obligation\": \"Borrowed-key lookup of object map only, without insertion or allocation.\"\n    },\n    \"DeclaredFiniteFunctor::on_morphism\": {\n      \"line\": 289,\n      \"signature\": \"pub fn on_morphism(&self, mor: &str) -> Option<&str>\",\n      \"obligation\": \"Borrowed-key lookup of morphism map only, without insertion or allocation.\"\n    },\n    \"check_identity_law\": {\n      \"line\": 322,\n      \"signature\": \"pub fn check_identity_law(functor: &DeclaredFiniteFunctor) -> Vec<String>\",\n      \"obligation\": \"Legacy literal id_ naming rule over supplied sorted object mappings. Build the required source identity name; absent mapping yields the exact undefined diagnostic and skips target-name allocation. Only a present mapping builds expected id_target, comparing exact names and reporting mismatch. Empty map is vacuous. This does not check arbitrary category identity labels or source-domain completeness.\"\n    },\n    \"check_composition_law\": {\n      \"line\": 344,\n      \"signature\": \"pub fn check_composition_law(\\n    functor: &DeclaredFiniteFunctor,\\n    source_compositions: &[(&str, &str, &str)], // (f, g, g∘f) in source\\n    target_compositions: &CompositionTable,     // (f, g) → g∘f in target\\n) -> Vec<String>\",\n      \"obligation\": \"Use one borrowed view of supplied raw target table and inspect supplied source triples in input order. Missing f, then g, then composite mapping each gives exactly its first missing diagnostic. Otherwise compare explicit target composite with mapped result; absent table row and differing result have distinct exact messages. Empty supplied cases are vacuous, no universal functor law inferred.\"\n    },\n    \"check_object_totality\": {\n      \"line\": 385,\n      \"signature\": \"pub fn check_object_totality(\\n    functor: &DeclaredFiniteFunctor,\\n    source_objects: &[&str],\\n) -> Vec<String>\",\n      \"obligation\": \"For each supplied object name, emit an exact missing-map diagnostic when absent; retain source list order and duplicates, allow extra mappings and empty source list. This is supplied-list coverage only.\"\n    },\n    \"check_morphism_totality\": {\n      \"line\": 402,\n      \"signature\": \"pub fn check_morphism_totality(\\n    functor: &DeclaredFiniteFunctor,\\n    source_morphisms: &[&str],\\n) -> Vec<String>\",\n      \"obligation\": \"Corresponding literal supplied-list morphism-map coverage; retain order/duplicates and allow extras/vacuous empty list.\"\n    },\n    \"check_boundary_preservation\": {\n      \"line\": 419,\n      \"signature\": \"pub fn check_boundary_preservation(\\n    functor: &DeclaredFiniteFunctor,\\n    source_boundaries: &[(&str, &str, &str)], // (morphism, source_obj, target_obj) in source cat\\n    target_boundaries: &BTreeMap<String, (String, String)>, // F(f) -> (src, tgt)\\n) -> Vec<String>\",\n      \"obligation\": \"For each supplied boundary triple require arrow mapping, source mapping, target mapping and target image boundary in that priority, one missing diagnostic then continue. When all present, compare endpoints independently, source mismatch before target mismatch. Supplied order/multiplicity retained; no actual endpoint/category admission or full map domains follows from this legacy diagnostic.\"\n    }\n  },\n  \"invariants\": [\n    \"Move raw declaration and two already admitted owned endpoint categories into a private candidate. Binding, exact map domains/images, both boundaries, actual identities and every source composite must all return Ok in that order before releasing the candidate. Any typed error returns no certificate; no rollback of caller/global effects is needed because these are immutable internal checks.\",\n    \"Borrow immutable raw declaration inside admitted certificate; no mutable access/deserialization bypass exists.\",\n    \"Borrow the owned admitted source category.\",\n    \"Borrow the owned admitted target category, not the source.\",\n    \"Delegate exact borrowed lookup to the stored object map; outside-