      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/category_theory/finite_category_validation.rs\",\n    \"sha256\": \"7f2500dd70aa415eebcb9b30b0cf8f5817443d0357b8395569c6df74cbef963d\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"raw_domain\": \"Finite owned object-name set O, named-arrow map M, identity map I and a partial composition map C. C[(f,g)] is g after f. Raw declarations are untrusted mutable data; names are opaque strings, not structural certificates.\",\n    \"admission\": \"Category, object and arrow names are nonblank. Each arrow key equals its name and has both endpoints in O. Identity-map domain is exactly O; each identity is a declared self-loop. Composition domain is exactly the boundary-compatible pairs of declared arrows; results are declared arrows with the required outer endpoints. Both unit equations hold, and every compatible triple has two defined equal composites.\",\n    \"certificate\": \"ValidatedFiniteCategory owns the entire admitted declaration in a private field. There is one checked constructor; Clone preserves its data, declared() returns only a shared borrow, and into_declared consumes the certificate. No Deserialize/Default/unchecked constructor exists.\",\n    \"observation\": \"The Category trait returns Option: foreign objects/arrows and noncomposable pairs yield None. Successful lookups return the exactly bound declared values. No name-only replacement of endpoint context occurs.\",\n    \"diagnostics\": \"validate_finite_category always reports eight phases. Each diagnostic carries a typed law unit, location and Error severity. Name diagnostics for category/object names use ObjectReference; blank morphism names use MorphismBoundary. The name-check phase itself has the stable MorphismBoundary phase label.\",\n    \"mathematics\": \"The admitted finite identifier sets refine Fin n and Fin m. FiniteCategory.lean checks six typed law predicates plus arbitrary raw-domain guard flags; success implies Laws, preserves the exact input data and realizes an actual Mathlib Category on Fin n. Finite model proofs are not mechanized Rust extraction, parser equivalence or MIR crash-freedom proofs.\",\n    \"authority\": \"AuthorityEffect None. Neither metadata declarations nor the model proof establish physical, infinite-category or whole-directory results.\"\n  },\n  \"operations\": {\n    \"violation\": {\n      \"line\": 14,\n      \"signature\": \"fn violation(\\n    unit: FiniteCategoryValidation,\\n    location: ValidationLocation,\\n    message: impl Into<String>,\\n) -> ValidationViolation\",\n      \"obligation\": \"Create an Error-severity typed law/location diagnostic.\"\n    },\n    \"add_unit\": {\n      \"line\": 27,\n      \"signature\": \"fn add_unit(\\n    report: &mut ValidationReport,\\n    unit: FiniteCategoryValidation,\\n    violations: Vec<ValidationViolation>,\\n)\",\n      \"obligation\": \"Preserve the phase name and typed diagnostics through ValidationReport::add_typed.\"\n    },\n    \"check_object_references\": {\n      \"line\": 35,\n      \"signature\": \"pub fn check_object_references(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Check key/name equality, both endpoints and foreign identity-map objects.\"\n    },\n    \"check_nonempty_names\": {\n      \"line\": 92,\n      \"signature\": \"pub fn check_nonempty_names(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Reject blank category, object and arrow keys with their declared typed diagnostic units.\"\n    },\n    \"check_identity_totality\": {\n      \"line\": 125,\n      \"signature\": \"pub fn check_identity_totality(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Require each object identity to exist, name a declared arrow and have a self-loop boundary.\"\n    },\n    \"check_identity_laws\": {\n      \"line\": 169,\n      \"signature\": \"pub fn check_identity_laws(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Check both unit compositions for every arrow with resolved identities; missing identities are independently rejected by totality.\"\n    },\n    \"identity_composition_violation\": {\n      \"line\": 198,\n      \"signature\": \"fn identity_composition_violation(\\n    lookup: &CompositionLookup<'_>,\\n    first: &str,\\n    second: &str,\\n    expected: &str,\\n) -> Option<ValidationViolation>\",\n      \"obligation\": \"Accept only Some(expected); preserve the actual optional composite and pair on refusal.\"\n    },\n    \"check_composition_totality\": {\n      \"line\": 217,\n      \"signature\": \"pub fn check_composition_totality(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Require a table result for every boundary-compatible declared pair.\"\n    },\n    \"check_composition_closure\": {\n      \"line\": 247,\n      \"signature\": \"pub fn check_composition_closure(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Reject each unknown first arrow, second arrow or result in any table row.\"\n    },\n    \"check_composition_boundaries\": {\n      \"line\": 289,\n      \"signature\": \"pub fn check_composition_boundaries(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Reject noncomposable rows and wrong outer endpoints; unresolved references are independently rejected by closure.\"\n    },\n    \"check_associativity\": {\n      \"line\": 339,\n      \"signature\": \"pub fn check_associativity(category: &DeclaredFiniteCategory) -> Vec<ValidationViolation>\",\n      \"obligation\": \"Enumerate compatible triples and collect every unequal/undefined comparison.\"\n    },\n    \"associativity_at\": {\n      \"line\": 360,\n      \"signature\": \"fn associativity_at(\\n    lookup: &CompositionLookup<'_>,\\n    first: &str,\\n    second: &str,\\n    third: &str,\\n) -> Option<ValidationViolation>\",\n      \"obligation\": \"Compare the two Option composition routes and require an actual defined result.\"\n    },\n    \"validate_finite_category\": {\n      \"line\": 380,\n      \"signature\": \"pub fn validate_finite_category(category: &DeclaredFiniteCategory) -> ValidationReport\",\n      \"obligation\": \"Run all eight phases and return their fresh complete typed report.\"\n    }\n  },\n  \"invariants\": {\n    \"representation\": [\n      \"Ordered unique string keys enumerate O and M. Equality of key/name and endpoint membership establish source/target functions Fin m -> Fin n. Identity-domain checks establish total self-loop identities. Composition closure admits outputs into Fin m; totality plus boundary rejection gives exact partial-composition domain.\",\n      \"Rust Some/None results refine Lean Option. Identity comparisons require Some(expected), never two undefined values. Associativity requires a defined left composite and equality of both sides. Given independently checked composition domain/boundaries this is equivalent to the model Option.bind law.\"\n    ],\n    \"commit_and_failure\": [\n      \"try_new creates a fresh local report from an immutable borrow, then constructs Self only under report.all_passed(). Publicly forgeable standalone reports are not accepted as constructor inputs.\",\n      \"Each checker emits Error violations on its failing branches. add_typed marks any nonempty violation vector failed and retains its typed payload; all_passed requires all phase booleans and an empty typed-violation list. Therefore any raw-domain refusal or failed law dominates the sole successful commit.\",\n      \"No production unwrap/expect, direct slice indexing, recursion, unsafe, FFI, async task, service handle or mutable global occurs in these two modules. Borrowed candidate state is not mutated, and owned scratch vectors are dropped on return. Expected rejection returns a typed report, rather than a default certificate.\"\n    ],\n    \"lookup_index\": [\n      \"CompositionLookup borrows every raw table row once, in BTreeMap lexicographic key order. String::Ord and str::Ord compare the same bytes, so the borrowed pair order is unchanged. binary_search_by_key compares exact pairs; its index is observed through Vec::get, not unchecked indexing.\",\n      \"The view retains junk rows too: admission does not silently discard unknown/noncomposable entries. Separate closure/boundary checks still reject them. Pair-view tests include prefix, empty, embedded-NUL, non-ASCII and missing keys.\",\n      \"Standard Rust collection/iterator and binary-search contracts remain in the declared TCB. Their compiler implementation is not mechanized here; the bridge is a complete source-stage audit, not a claimed verified-MIR result.\"\n    ],\n    \"ownership\": [\n      \"All successful construction paths flow through try_new, including the builder, path category, dagger/groupoid and higher-category derived presentations and validated Kleisli output. Certificates have no interior-mutable fields. A mutable declaration recovered by consuming or cloning a certificate is not itself evidence after mutation.\"\n    ]\n  },\n  \"failure_paths\": {\n    \"raw_declarations\": \"Raw mutators only edit untrusted data; no category-law claim is made until admission.\",\n    \"admission\": \"Any violating phase returns a nonpassing fresh report; the certificate commit is unreachable on that branch.\",\n    \"lookup\": \"Unknown identifiers/noncomposable pairs return None. A missing/incorrect borrowed lookup causes refusal, never default acceptance.\",\n    \"runtime\": \"Ordinary safe-Rust, collection, allocation and compiler contracts remain the declared TCB; allocator totality and machine-checked crash freedom are not claimed.\"\n  },\n  \"trust_boundary\": {\n    \"runtime\": \"Pinned Rust compiler, standard String/BTreeMap/BTreeSet/Vec contracts and the resolved Cargo dependency closure.\",\n    \"formal\": \"Lean 4.33.1, pinned clean Mathlib revision, standard foundational axioms only. Explicit Rust-to-model source audit; no extracted-program or MIR proof.\"\n  },\n  \"assurance_limits\": [\n    \"Contracts remain pending at the user request.\",\n    \"No mechanized Rust/MIR equivalence, allocator totality, machine-checked crash freedom, exact compiler file-read trace, cross-repository origin attestation or whole-directory A grade is inferred.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/src/category_theory/finite_category_validation.score.yaml\",\n      \"sha256\": \"c7fe5f789b766506b98167c71cb7e6b68b4ab7f8bd9f6270f7a105993422763a\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
