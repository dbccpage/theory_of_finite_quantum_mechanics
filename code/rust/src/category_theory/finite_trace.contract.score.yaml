ds with Rc::unwrap_or_clone; queue is empty and local popped words dropped, so successful canonical strong count1 permits payload reuse with safe fallback.\"\n    },\n    \"verify_trace\": {\n      \"line\": 183,\n      \"signature\": \"pub fn verify_trace(\\n        &self,\\n        start: usize,\\n        word: &[usize],\\n        mode: ReplayMode,\\n        limits: TraceLimits,\\n        certificate: &TraceComponent,\\n    ) -> Result<(), ContinuationError>\",\n      \"obligation\": \"Recompute full canonical component for externally expected start/word/mode/limits and require full structural equality of every member and ordered discovery witness. Removing a member, changing original tuple/mode, edge fields or order fails CertificateMismatch; resource/domain errors propagate before comparison. This accepts the exact canonical tree, not any alternate spanning proof. No source hash/machine identity certificate.\"\n    }\n  },\n  \"invariants\": [\n    \"Private frontier starts with exactly the caller word in seen and FIFO queue, one shared immutable Rc<Vec> payload, no tree and zero check count. Seen order/equality uses Vec value, not pointer identity. Input max_words>=1 and initial whole-word availability are admitted before call.\",\n    \"If checks>=limit return WorkLimit BEFORE increment; otherwise increment by1. Since limit<=usize::MAX, checks<limit implies checks+1 fits. Each attempted adjacent position is charged, including equal letters, inadmissible swaps and already-seen neighbors; no conclusion from exhaustion.\",\n    \"Given one adjacent swapped candidate, query by Vec value without allocation. Existing member does nothing. Fresh member requires seen.len()<max_words before insert; create ONE owned Vec payload inside Rc, share it between ordered seen and FIFO queue, append original from word/position/actual swap witness as the required owned tree output. No mutable key alias or pointer-order comparison. Original BFS insertion/discovery order preserved.\