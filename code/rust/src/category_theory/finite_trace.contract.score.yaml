ked(n+1)^2 for distinguish including internal dead state; overflow is WorkLimit. Cell count is not total time/bytes admission.\",\n      \"Private position < word.len()-1 and full current word enabled. Re-run exact prefix, reject missing prefix defensively, certify the two adjacent events on that ACTUAL prefix state with complete pair bound. Only Independent permits an edge. ExactState additionally requires raw ab==ba; ProtectedFutures permits unequal raw endpoints with equal complete future observations. Other outcomes skip, typed errors propagate. Returned witness unchanged.\",\n      \"Scan every position ascending, charge BEFORE certification, then skip inadmissible edges. Equal symbols yield only self-edge, skipped after full charge/certification. For eligible unequal symbols lazily create one scratch Vec per expansion, swap only adjacent positions, register relative to original word, and restore scratch before next position. Newly stored words deep-copy scratch once and then share immutable payload; tree.from remains original word, never scratch. Failure drops provisional frontier without a result.\",\n      \"Admit initial word and pair budget; initialize frontier. Pop FIFO, expand all positions; resource refusal aborts rather than returning partial component. Inductively every discovered word is enabled, same length/inventory and reachable by certified mode-specific edge; processed neighbors are seen, every fresh node enqueued once. Empty queue implies seen is closed and exactly full connected component. Return original start/word/mode, lexicographically sorted complete members and original BFS discovery tree. Drain shared words with Rc::unwrap_or_clone; queue is empty and local popped words dropped, so successful canonical strong count1 permits payload reuse with safe fallback.\",\n      \"Recompute full canonical component for externally expected start/word/mode/limits and require full structural equality of every member and ordered discovery witness. Removing a member, changing original tuple/mode, edge fields or order fails CertificateMismatch; resource/domain errors propagate before comparison. This accepts the exact canonical tree, not any alternate spanning proof. No source hash/machine identity certificate.\"\n    ],\n    \"provider_refinement\": \"Private admitted PartialDynamics gives nonempty rectangular closed partial transitions. run checks start/full alphabet then Option-folds all steps; certify_swap source has complete four-endpoint availability, true complete-future quotient and bounded sound distinction. (n+1)^2 covers every ordered completed state pair, including the distinct unavailable sink. Only an Independent value is consumed here; actual provider/SwapCertificate nominal identities and public signatures remain unchanged in test copies. Source-reviewed FiniteMoore split-only refinement is exact all-word observation kernel; empty/current readout and availability are part of that observation. The completed finite machine is immutable; same protected future observations preserve suffix availability/readouts. Independent source score remains separate and its actual original method is executed by these controls.\"\n  },\n  \"operations\": {\n    \"new\": {\n      \"line\": 48,\n      \"signature\": \"fn new(word: &[usize]) -> Self\",\n      \"obligation\": \"Private frontier starts with exactly the caller word in seen and FIFO queue, one shared immutable Rc<Vec> payload, no tree and zero check count. Seen order/equality uses Vec value, not pointer identity. Input max_words>=1 and initial whole-word availability are admitted before call.\"\n    },\n    \"charge\": {\n      \"line\": 58,\n      \"signature\": \"fn charge(&mut self, limit: usize) -> Result<(), ContinuationError>\",\n      \"obligation\": \"If checks>=limit return WorkLimit BEFORE increment; otherwise increment by1. Since limit<=usize::MAX, checks<limit implies checks+1 fits. Each attempted adjacent position is charged, including equal let