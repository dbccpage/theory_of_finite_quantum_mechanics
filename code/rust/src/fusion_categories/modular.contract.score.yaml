      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/modular.rs\",\n    \"sha256\": \"aba2ed0e56a32a0fd6017e9084666e4673c4448a6a96d21f9a160d5f11539cda\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"claim_urn\": \"urn:tfqm:fusion:modular:bounded-exact-data:v1\",\n    \"domain\": \"Admitted immutable ribbon records with lawful exact scalar value semantics and compatible conjugation/root data. Fresh ModularData has rank1..32 and aligned private carriers. Public methods compute their exact displayed formulas or return typed failures; modular/physical interpretation is conditional as specified, with optional positive global dimension D and any u32 genus.\",\n    \"behavior\": [\n      \"Compute exact S_ab=(theta_a theta_b)^-1 sum_c N(a,b*,c)d_c theta_c from admitted ribbon data, then clone owned inputs and retain D^2 and p+. This constructor alone does not verify modularity.\",\n      \"Private aligned ring/dimension/twist vectors from an admitted ribbon value: cache inverse twists, d*theta and dual labels, then fill the n-by-n balancing matrix; propagate checked inversion, label and matrix errors.\",\n      \"Compute total+m*value: zero moves total, one adds without scalar embedding, larger m must fit i64 before exact embedding or returns Overflow.\",\n      \"Private admitted labels and values length=ring.rank: sum_c N(a,b,c)*values[c] using checked multiplicity conversion.\",\n      \"Build through from_ribbon and call verify before returning; the same public type also has an unchecked-with-respect-to-modularity constructor, so it is not a sealed certificate type.\",\n      \"Borrow the ring rank established by ring admission, at most32.\",\n      \"Borrow the immutable admitted ring; no mutable access is granted.\",\n      \"Borrow the retained immutable dimension vector aligned with ring labels.\",\n      \"Borrow the retained immutable twist vector aligned with ring labels.\",\n      \"Borrow the retained immutable square balancing matrix.\",\n      \"Borrow the exact sum of squared ribbon dimensions.\",\n      \"Borrow the exact positive Gauss sum supplied by ribbon data; no independent positivity assertion.\",\n      \"Return the raw D^2 field element only; this method computes no logarithm or physical entropy.\",\n      \"Return a fresh diagonal matrix of twists, propagating matrix allocation/domain errors.\",\n      \"Return the exact zero-one charge conjugation matrix C_ab=[dual(a)=b].\",\n      \"Private admitted ring: directly construct scale*C without an unscaled intermediate; propagate label/matrix errors.\",\n      \"Construct scale times the rank-dimensional identity directly; propagate matrix errors.\",\n      \"Require equal shapes; then return the first unequal entry in row-major order, or None for equal matrices.\",\n      \"Refuse in fixed order: zero D^2, asymmetry, deficient rank, S^2!=D^2 C, SS^dagger!=D^2 I, (ST)^3!=p+S^2, first Verlinde defect. Success establishes these checks only.\",\n      \"Use first_difference and map the first unequal coordinate to the supplied typed modular defect; propagate shape errors.\",\n      \"Scan the strict upper triangle in lexicographic order, refusing the first asymmetric pair.\",\n      \"Compute exact provider rank and refuse rank<size, carrying actual and expected ranks.\",\n      \"Compute the actual matrix square and compare to D^2 C; return the square for reuse after equality succeeds.\",\n      \"Compute S times its actual conjugate transpose and compare to D^2 I; no plain-transpose substitution.\",\n      \"Construct (ST)_ab=S_ab*theta_b by column scaling without a dense diagonal multiplication.\",\n      \"Form (ST)^3 using two actual matrix products and compare row-major to p+ times the supplied S^2.\",\n      \"Delegate the bounded full defect computation to the admitted ring provider and report its first triple; do not claim a category realization theorem.\",\n      \"Divide p+^2 by D^2, require its advertised root data (n,k), return exact rational4k/n. Physical angle interpretation requires a compatible canonical complex root embedding.\",\n      \"Require supplied D squares to stored D^2, then decide D>0, then divide p+ by D and require root data; return exact8k/n. Wrong square, nonpositive and undecidable sign have distinct priority.\",\n      \"Require label<rank; compute the second indicator sum using cached d_b*theta_b^2 and d_c/theta_c^2; divide by D^2 and admit exactly -1,0,1.\",\n      \"Private aligned retained vectors: precompute (d_b theta_b^2,d_b/theta_b^2), propagating checked division refusal.\",\n      \"Private admitted labels and rank-aligned weights: compute sum_c N(b,c,a)*weights[b].0*weights[c].1, skipping zero coefficients.\",\n      \"Map exact values1,-1,0 to i8; reject every other field value with FrobeniusSchur{label}.\",\n      \"Admit genus exponent before field arithmetic; compute sum_a(D^2/d_a^2)^(g-1), grouping equal squares, and return only an exact nonnegative integer. Nonrational, fractional and negative outputs refuse.\",\n      \"For any u32 genus compute i64(genus)-1, require absolute value<=MAX_SCALAR_EXPONENT, otherwise return Budget before scalar work.\",\n      \"Group exactly equal dimension squares with positive u64 counts, at most rank<=32; replace each square by checked D^2/square without a second ratio buffer.\"\n    ]\n  },\n  \"operations\": {\n    \"ModularData::from_ribbon\": {\n      \"line\": 49,\n      \"signature\": \"pub fn from_ribbon(ribbon: &RibbonFusionCategory<K>) -> Result<Self, FusionError>\",\n      \"obligation\": \"Compute exact S_ab=(theta_a theta_b)^-1 sum_c N(a,b*,c)d_c theta_c from admitted ribbon data, then clone owned inputs and retain D^2 and p+. This constructor alone does not verify modularity.\"\n    },\n    \"ModularData::ribbon_s_matrix\": {\n      \"line\": 61,\n      \"signature\": \"fn ribbon_s_matrix(\\n        ring: &FusionRing,\\n        dimensions: &[K],\\n        twists: &[K],\\n    ) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Private aligned ring/dimension/twist vectors from an admitted ribbon value: cache inverse twists, d*theta and dual labels, then fill the n-by-n balancing matrix; propagate checked inversion, label and matrix errors.\"\n    },\n    \"ModularData::add_multiple\": {\n      \"line\": 85,\n      \"signature\": \"fn add_multiple(total: K, value: &K, multiplicity: u64) -> Result<K, FusionError>\",\n      \"obligation\": \"Compute total+m*value: zero moves total, one adds without scalar embedding, larger m must fit i64 before exact embedding or returns Overflow.\"\n    },\n    \"ModularData::fusion_sum\": {\n      \"line\": 100,\n      \"signature\": \"fn fusion_sum(ring: &FusionRing, a: usize, b: usize, values: &[K]) -> Result<K, FusionError>\",\n      \"obligation\": \"Private admitted labels and values length=ring.rank: sum_c N(a,b,c)*values[c] using checked multiplicity conversion.\"\n    },\n    \"ModularData::verified\": {\n      \"line\": 108,\n      \"signature\": \"pub fn verified(ribbon: &RibbonFusionCategory<K>) -> Result<Self, FusionError>\",\n      \"obligation\": \"Build through from_ribbon and call verify before returning; the same public type also has an unchecked-with-respect-to-modularity constructor, so it is not a sealed certificate type.\"\n    },\n    \"ModularData::rank\": {\n      \"line\": 114,\n      \"signature\": \"pub fn rank(&self) -> usize\",\n      \"obligation\": \"Borrow the ring rank established by ring admission, at most32.\"\n    },\n    \"ModularData::ring\": {\n      \"line\": 118,\n      \"signature\": \"pub fn ring(&self) -> &FusionRing\",\n      \"obligation\": \"Borrow the immutable admitted ring; no mutable access is granted.\"\n    },\n    \"ModularData::dimensions\": {\n      \"line\": 122,\n      \"signature\": \"pub fn dimensions(&self) -> &[K]\",\n      \"obligation\": \"Borrow the retained immutable dimension vector aligned with ring labels.\"\n    },\n    \"ModularData::twists\": {\n      \"line\": 126,\n      \"signature\": \"pub fn twists(&self) -> &[K]\",\n      \"obligation\": \"Borrow the retained immutable twist vector aligned with ring labels.\"\n    },\n    \"ModularData::s_tilde\": {\n      \"line\": 130,\n      \"signature\": \"pub fn s_tilde(&self) -> &BasicMatrix<K>\",\n      \"obligation\": \"Borrow the retained immutable square balancing matrix.\"\n    },\n    \"ModularData::d_squared\": {\n      \"line\": 134,\n      \"signature\": \"pub fn d_squared(&self) -> &K\",\n      \"obligation\": \"Borrow the exact sum of squared ribbon dimensions.\"\n    },\n    \"ModularData::p_plus\": {\n      \"line\": 138,\n      \"signature\": \"pub fn p_plus(&self) -> &K\",\n      \"obligation\": \"Borrow the exact positive Gauss sum supplied by ribbon data; no independent positivity assertion.\"\n    },\n    \"ModularData::topological_entanglement_entropy_dimension_squared\": {\n      \"line\": 142,\n      \"signature\": \"pub fn topological_entanglement_entropy_dimension_squared(&self) -> &K\",\n      \"obligation\": \"Return the raw D^2 field element only; this method computes no logarithm or physical entropy.\"\n    },\n    \"ModularData::t_matrix\": {\n      \"line\": 146,\n      \"signature\": \"pub fn t_matrix(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Return a fresh diagonal matrix of twists, propagating matrix allocation/domain errors.\"\n    },\n    \"ModularData::charge_conjugation\": {\n      \"line\": 150,\n      \"signature\": \"pub fn charge_conjugation(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Return the exact zero-one charge conjugation matrix C_ab=[dual(a)=b].\"\n    },\n    \"ModularData::scaled_charge_conjugation\": {\n      \"line\": 154,\n      \"signature\": \"fn scaled_charge_conjugation(&self, scale: &K) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Private admitted ring: directly construct scale*C without an unscaled intermediate; propagate label/matrix errors.\"\n    },\n    \"ModularData::scaled_identity\": {\n      \"line\": 165,\n      \"signature\": \"fn scaled_identity(&self, scale: &K) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Construct scale times the rank-dimensional identity directly; propagate matrix errors.\"\n    },\n    \"ModularData::first_difference\": {\n      \"line\": 171,\n      \"signature\": \"fn first_difference(\\n        left: &BasicMatrix<K>,\\n        right: &BasicMatrix<K>,\\n    ) -> Result<Option<(usize, usize)>, FusionError>\",\n      \"obligation\": \"Require equal shapes; then return the first unequal entry in row-major order, or None for equal matrices.\"\n    },\n    \"ModularData::verify\": {\n      \"line\": 192,\n      \"signature\": \"pub fn verify(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Refuse in fixed order: zero D^2, asymmetry, deficient rank, S^2!=D^2 C, SS^dagger!=D^2 I, (ST)^3!=p+S^2, first Verlinde defect. Success establishes these checks only.\"\n    },\n    \"ModularData::require_equal\": {\n      \"line\": 204,\n      \"signature\": \"fn require_equal(\\n        left: &BasicMatrix<K>,\\n        right: &BasicMatrix<K>,\\n        defect: impl FnOnce(usize, usize) -> ModularDefect,\\n    ) -> Result<(), FusionError>\",\n      \"obligation\": \"Use first_difference and map the first unequal coordinate to the supplied typed modular defect; propagate shape errors.\"\n    },\n    \"ModularData::verify_symmetry\": {\n      \"line\": 215,\n      \"signature\": \"fn verify_symmetry(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Scan the strict upper triangle in lexicographic order, refusing the first asymmetric pair.\"\n    },\n    \"ModularData::verify_nondegenerate\": {\n      \"line\": 226,\n      \"signature\": \"fn verify_nondegenerate(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Compute exact provider rank and refuse rank<size, carrying actual and expected ranks.\"\n    },\n    \"ModularData::verify_square\": {\n      \"line\": 237,\n      \"signature\": \"fn verify_square(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Compute the actual matrix square and compare to D^2 C; return the square for reuse after equality succeeds.\"\n    },\n    \"ModularData::verify_unitarity\": {\n      \"line\": 247,\n      \"signature\": \"fn verify_unitarity(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Compute S times its actual conjugate transpose and compare to D^2 I; no plain-transpose substitution.\"\n    },\n    \"ModularData::st_matrix\": {\n      \"line\": 258,\n      \"signature\": \"fn st_matrix(&self) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Construct (ST)_ab=S_ab*theta_b by column scaling without a dense diagonal multiplication.\"\n    },\n    \"ModularData::verify_relation\": {\n      \"line\": 265,\n      \"signature\": \"fn verify_relation(&self, squared: &BasicMatrix<K>) -> Result<(), FusionError>\",\n      \"obligation\": \"Form (ST)^3 using two actual matrix products and compare row-major to p+ times the supplied S^2.\"\n    },\n    \"ModularData::verify_verlinde\": {\n      \"line\": 273,\n      \"signature\": \"fn verify_verlinde(&self) -> Result<(), FusionError>\",\n      \"obligation\": \"Delegate the bounded full defect computation to the admitted ring provider and report its first triple; do not claim a category realization theorem.\"\n    },\n    \"ModularData::central_charge_mod_4\": {\n      \"line\": 284,\n      \"signature\": \"pub fn central_charge_mod_4(&self) -> Result<Rational, FusionError>\",\n      \"obligation\": \"Divide p+^2 by D^2, require its advertised root data (n,k), return exact rational4k/n. Physical angle interpretation requires a compatible canonical complex root embedding.\"\n    },\n    \"ModularData::central_charge_mod_8\": {\n      \"line\": 298,\n      \"signature\": \"pub fn central_charge_mod_8(&self, total_dimension: &K) -> Result<Rational, FusionError>\",\n      \"obligation\": \"Require supplied D squares to stored D^2, then decide D>0, then divide p+ by D and require root data; return exact8k/n. Wrong square, nonpositive and undecidable sign have distinct priority.\"\n    },\n    \"ModularData::frobenius_schur_indicator\": {\n      \"line\": 323,\n      \"signature\": \"pub fn frobenius_schur_indicator(&self, a: usize) -> Result<i8, FusionError>\",\n      \"obligation\": \"Require label<rank; compute the second indicator sum using cached d_b*theta_b^2 and d_c/theta_c^2; divide by D^2 and admit exactly -1,0,1.\"\n    },\n    \"ModularData::indicator_weights\": {\n      \"line\": 338,\n      \"signature\": \"fn indicator_weights(&self) -> Result<Vec<(K, K)>, FusionError>\",\n      \"obligation\": \"Private aligned retained vectors: precompute (d_b theta_b^2,d_b/theta_b^2), propagating checked division refusal.\"\n    },\n    \"ModularData::indicator_row\": {\n      \"line\": 352,\n      \"signature\": \"fn indicator_row(&self, a: usize, b: usize, weights: &[(K, K)]) -> Result<K, FusionError>\",\n      \"obligation\": \"Private admitted labels and rank-aligned weights: compute sum_c N(b,c,a)*weights[b].0*weights[c].1, skipping zero coefficients.\"\n    },\n    \"ModularData::indicator_result\": {\n      \"line\": 364,\n      \"signature\": \"fn indicator_result(a: usize, value: &K) -> Result<i8, FusionError>\",\n      \"obligation\": \"Map exact values1,-1,0 to i8; reject every other field value with FrobeniusSchur{label}.\"\n    },\n    \"ModularData::ground_state_degeneracy\": {\n      \"line\": 378,\n      \"signature\": \"pub fn ground_state_degeneracy(&self, genus: u32) -> Result<BigInt, FusionError>\",\n      \"obligation\": \"Admit genus exponent before field arithmetic; compute sum_a(D^2/d_a^2)^(g-1), grouping equal squares, and return only an exact nonnegative integer. Nonrational, fractional and negative outputs refuse.\"\n    },\n    \"ModularData::genus_exponent\": {\n      \"line\": 398,\n      \"signature\": \"fn genus_exponent(genus: u32) -> Result<i64, FusionError>\",\n      \"obligation\": \"For any u32 genus compute i64(genus)-1, require absolute value<=MAX_SCALAR_EXPONENT, otherwise return Budget before scalar work.\"\n    },\n    \"ModularData::dimension_ratios\": {\n      \"line\": 412,\n      \"signature\": \"fn dimension_ratios(&self) -> Result<Vec<(K, u64)>, FusionError>\",\n      \"obligation\": \"Group exactly equal dimension squares with positive u64 counts, at most rank<=32; replace each square by checked D^2/square without a second ratio buffer.\"\n    },\n    \"ModularData::Clone/Debug/PartialEq\": {\n      \"obligation\": \"Derives preserve the same private ring, aligned vectors, matrix and exact values under scalar value semantics; cloning has payload-dependent cost and does not run verify.\",\n      \"origin\": \"Rust private ownership / explicit derive attributes in bound source\"\n    },\n    \"ModularDefect::Debug/Clone/Copy/PartialEq/Eq/Display/Error\": {\n      \"obligation\": \"Derives preserve the literal discriminant/witness and render the declared ten diagnostic variants. They perform no arithmetic validation. The unchanged declaration is covered by the diagnostic source review/bridge and nominal-type native composition.\",\n      \"origin\": \"Rust private ownership / explicit derive attributes in bound source\"\n    }\n  },\n  \"invariants\": [\n    \"Carrier: ModularData fields are private and have no public mutator or Deserialize. from_ribbon is the only fresh public construction path and retains an admitted ring of rank1..32, aligned dimensions/twists and an n-by-n matrix; Clone preserves alignment under scalar value semantics. Its borrowed getters cannot resize those carriers. verified adds verify but returns the same type, so an arbitrary value of the type is not a sealed modularity certificate.\",\n    \"Balancing: precompute inv(theta_a),d_c*theta_c and b*. Each entry is inv(theta_a)*inv(theta_b)*sum_c N(a,b*,c)d_c*theta_c, without dropping multiplicities. The source convention equals the published N(a*,b) form by simultaneous duality N(a,b*)^c=N(a*,b)^(c*), d_(c*)=d_c and theta_(c*)=theta_c. The cyclic3 Fourier witness detects accidental omission of the dual; self-dual examples alone cannot establish that convention.\",\n    \"Coefficient safety: add_multiple preserves zero/one directly and admits u64->i64 before embedding larger coefficients. Public ribbon rings are multiplicity-free, but the helper still refuses a forged extreme coefficient. Every public genus is u32, so i64(genus)-1 lies in[-1,4294967294]. Its unsigned absolute value is computed before comparing to the pinned scalar exponent bound. Label and shape admission precede private indexing.\",\n    \"Ordered verification: after D^2!=0, the strict upper triangle yields the first asymmetric pair, exact rank then checks nondegeneracy, actual multiplication checks S^2=D^2*C, and actual conjugate transpose checks SS^dagger=D^2*I. Column scaling constructs ST and two ordered products construct its cube; equality to p+S^2 precedes the first provider Verlinde triple. Matrix mismatches scan row-major; shape disagreement is typed, never zip-truncated.\",\n    \"Root-index results: root_of_unity_data requires an advertised order1..4096 and scans powers until finding equality; its reduced(n,k) has0<=k<n. Multipliers4/8 are widened to u64 before multiplication and are bounded by32760. Rational denominators are positive and numerator/denominator remain BigInt. Mod8 additionally checks suppliedD^2, then a decidable positive sign before division. A returned root index is an angle in the advertised generator; canonical complex embeddings are additional hypotheses for physical central-charge terminology.\",\n    \"Second indicator: aligned cached u_b=d_b*theta_b^2 and v_c=d_c/theta_c^2 give sum_bc N(b,c,a)u_b v_c/D^2. The field factorization equals the raw squared-ratio formula; zero multiplicities skip unnecessary products, nonzero coefficients use checked embedding. Exactly1,-1,0 are admitted as i8; every other exact result carries FrobeniusSchur{label}. This computation is available on raw data too, so its mathematical interpretation is conditional on the required modular-category hypotheses.\",\n    \"Genus sum: group dimension squares by exact equality, preserving the total count n and positive counts<=32; replace each key in place with D^2/square. Equal squares yield equal ratios, so summing count*ratio^(g-1) equals the literal per-label sum in a lawful characteristic-zero field. The genus budget refuses before any grouping/division/power, zero denominators remain typed, and rational projection then nonnegative-integrality admission precedes BigInt extraction. Raw from_ribbon data is allowed, so a successful number is the specified exact formula; a physical state-space interpretation requires additional mathematical hypotheses.\",\n    \"Logical cost: balancing is O(n^3) field work with O(n^2) output and O(n) caches; inverses/dual lookups occur once per label. verify uses O(n^3) rank/products plus the existing O(n^4) full Verlinde defect provider, retaining up to O(n^3) defect triples. Reusing S^2 and direct ST/scaled C/I construction avoids unused unscaled/diagonal matrices and generic exponentiation products. Keeping the full provider result before first() is a limitation of the reused API, not a claim of streaming or an allocation-free provider.\",\n    \"Indicator work is O(n^2) with O(n) weights and no per-channel inverse. Genus grouping is O(n^2) equality work/O(n) retained pairs, one division and O(log(|g-1|+1)) repeated-squaring work per distinct square; the pinned provider exponent limit is2^20. Root lookup uses at most4096 scalar steps. Matrix constructors admit at most1024 entries due to the ring rank bound, even when the called default matrix APIs use UNLIMITED logical policies. Arbitrary field coefficient bit growth, allocation failure and operation implementation costs remain outside these bounds.\"\n  ],\n  \"failure_paths\": {\n    \"ModularData::from_ribbon\": \"Compute exact S_ab=(theta_a theta_b)^-1 sum_c N(a,b*,c)d_c theta_c from admitted ribbon data, then clone owned inputs and retain D^2 and p+. This constructor alone does not verify modularity. Checked scalar/matrix/provider errors propagate unchanged through FusionError; no partial data or rounded value is returned.\",\n    \"ModularData::ribbon_s_matrix\": \"Private aligned ring/dimension/twist vectors from an admitted ribbon value: cache inverse twists, d*theta and dual labels, then fill the n-by-n balancing matrix; propagate checked inversion, label and matrix errors. Checked scalar/matrix/provider errors propagate unchanged through FusionError; no partial data or rounded value is returned.\",\n    \"ModularData::add_multiple\": \"Compute total+m*value: zero moves total, one adds without scalar embedding, larger m must fit i64 before exact embedding or returns Overflow. Checked scalar/matrix/provider errors propagate unchanged through FusionError; no partial data or rounded value is returned.\",\n    \"ModularData::fusion_sum\": \"Private admitted labels and values length=ring.rank: sum_c N(a,b,c)*values[c] using checked multiplicity conversion. Checked scalar/matrix/provider errors propagate unchanged through FusionError; no partial data or rounded value is returned.\",\n    \"ModularData::verified\": \"Build through from_ribbon and call verify before returning; the same public type also has an unchecked-with-respect-to-modularity constructor, so it is not a sealed certificate type. Checked scalar/matrix/provider errors propagate unchanged through FusionError; no partial data or rounded value is returned.\",\n    \"ModularData::rank\": \"Infallible immutable getter under the retained carrier 