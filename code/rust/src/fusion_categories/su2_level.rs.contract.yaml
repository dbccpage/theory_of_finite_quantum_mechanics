    "domain": "Lawful immutable characteristic-zero FusionScalar fields with compatible roots/conjugation. Public levels are1..6, q-integer indices0..2*(level+2), and metric labels0..level. A factory requires its8*(level+2) root; metrics/q-integers require their specified2*(level+2) root. The field admission is sufficient, not a minimal-field completeness claim.",
    "behavior": [
      "Require level1..6 before arithmetic, field admission or allocation; Budget retains the requested value and limit6, including0 and usize::MAX refusals.",
      "After level and index admission, admit q and its inverse once; compute (q^n-(q^-1)^n)/(q-q^-1) by bounded unsigned powers. Level/index refusal priority and all performed field/scalar failures remain typed for the declared lawful field.",
      "Private quantum-admissible triangle has even perimeter<=2*level and each side<=half. Return the squared triangle factorial quotient with all indices0..level+1, propagating checked zero/field division errors.",
      "Private z lies above all four lower limits, below all three upper limits and<=level. Return factorial[z+1] over the seven factorial products. All subtractions are ordinary nonnegative usize arithmetic; independent index evidence discharges their preconditions.",
      "Scan exactly max(lower)..=min(level,upper) with alternating (-1)^z sign; an empty interval returns zero without touching factorials; checked coefficient failures propagate.",
      "For a,b,c,d,e,f admitted by the four SU(2) fusion channels, compute the original fixed nonorthonormal q-Racah gauge: dimension[e] times two squared triangle factors times the alternating sum and the outer half-perimeter sign.",
      "Private level1..6: admit one q root and inverse; compute [1] by checked difference/difference, [2]=q+q^-1, then [a+1]=(q+q^-1)[a]-[a-1]. Own exactly level+1 dimensions and preserve checked division admission. Move the step into dimensions[1] and borrow it for later recurrence updates, avoiding a retained field-value clone.",
      "Reuse dimensions[a]=[a+1] to build factorials[0]=1 and factorials[n+1]=factorials[n]*dimensions[n], with exact capacities level+1 and level+2. No per-factor root/inverse recomputation.",
      "For an admitted channel and total, invert dimension[channel]*dimension[total] times the two named squared triangle factors, preserving field/zero inverse errors.",
      "Construct exactly one square diagonal output directly from admitted channel metadata. Evaluate the fallible weight callback exactly once per diagonal entry, never off-diagonal; return zeros elsewhere and drop partial output on callback/matrix failure. Empty channels produce0x0 with no callback. No temporary field-weight vector or cloned diagonal buffer is allocated.",
      "Borrow the already admitted, ordered left/right channel slices and aligned dimension/factorial data. Construct both diagonal inverse-weight matrices in their exact row/column order and triangle orientation; empty slices give0x0 matrices. No cloned channel lists or field-weight buffers; propagate the first callback/matrix failure.",
      "Enumerate left/right admitted intermediate labels in ascending ring-label order for the public metric API, then borrow those two metadata vectors into tree_metrics_for_channels. Return both metrics including empty sectors, preserving support and orientation.",
      "Admit the level, then the first label>level with its actual label/rank witness, then the actual SU(2) ring and coefficient data; return both weighted tree metrics or the first typed provider error.",
      "Compute actual conjugate-transpose(F)*left*F and require exact equality to right; preserve matrix/scalar errors and return Inconsistent(q-Racah weighted unitarity) on mismatch, without a positivity or orthonormal-gauge claim.",
      "For every retained F block, borrow its existing row and column channel slices directly, compute the two actual tree metrics and require F-adjoint*left*F=right before materializing braiding. No regenerated channel lists; propagate the first error.",
      "Private positive order8*(level+2) in24..64 and compatible primitive root: own exactly one period [1,z,...,z^(order-1)] by a single multiplication recurrence, without an unused final power.",
      "Private admitted channel a,b,c<=6 with c<=a+b and even sum, and a nonempty matching root table: compute Casimir difference in[-96,48], reduce by Euclidean residue, clone that phase and apply (-1)^((a+b-c)/2).",
      "Admit level then the8*(level+2) braiding root, construct the actual ring and cached coefficients, materialize F, move the ring into FusionCategory, check all weighted blocks, materialize R from a single root-period cache, then call actual braided/ribbon validation. No partial category is returned on failure."
    ]
