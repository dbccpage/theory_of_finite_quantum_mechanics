    "domain": "Any public recipe type K satisfying the declared lawful exact field/root protocol. Pointed inputs are borrowed finite moduli and square signed-i64 exponent matrices, optional names; constructors admit factors>=2 and product<=32. Nontrivial fixed recipes additionally require their exact roots/sqrt2/phi. Typed refusals are part of the API.",
