      "Compose FusionCategory, BraidedFusionCategory and RibbonFusionCategory admissions in that order; propagate the first typed error and return only the admitted owned value.",
      "Build the rank-three Ising recipe using an admitted sqrt(2) and sixteenth roots; propagate field, symbol and ribbon validation failures.",
      "For the admitted Ising ring and nonzero sqrt(2), construct its fixed gauge F blocks; invert sqrt(2) once and propagate inversion or symbol-shape refusal.",
      "Construct the fixed Ising R values from roots with exponents -1,3,4 of order16 and -1; propagate missing-field and symbol errors.",
      "Build the rank-two Fibonacci recipe using the admitted golden ratio and tenth roots; propagate all provider admissions.",
      "For the admitted Fibonacci ring and golden ratio phi, use phi-1 and its negative in the fixed gauge block; no claim of a unitary gauge conversion.",
      "Set the two nontrivial Fibonacci R channels to tenth roots with exponents -4 and3; propagate missing-field and symbol errors.",
      "Build rank-two semion with the nontrivial -1 associator and i braiding; require the field and ordinary category/ribbon checks.",
      "Admit group factors/product, square exponent shape and names; reduce signed coefficients before requesting only the required root subgroup, then build the bilinear R values and unit dimensions through ordinary category/ribbon checks.",
      "Require exactly factors rows and factors columns per row; rows refuse first, then the first ragged row reports its actual column count.",
      "Euclidean gcd for unsigned inputs; gcd(0,b)=b and gcd(a,0)=a; callers of reduced_coefficient provide a positive denominator.",
      "Private domain: left/right admitted factors 2..32. Reduce any i64 coefficient modulo gcd(left,right) before dividing numerator/denominator by their gcd; denominator stays positive, including zero residue.",
      "Private PhasePlan constructor requires admitted factors with product<=32 and a square exponent matrix. Use the lcm of reduced denominators and rescale each reduced numerator to that common order.",
      "Private matching digit vectors and admitted PhasePlan: sum weight_ij*x_i*y_j modulo positive plan.order. Rank<=5, digits<=31 and weights<=31 keep the unsigned sum below2^20.",
      "Private order1..32: admit an exact generator once and generate precisely order powers from one; missing field refuses before symbol construction.",
      "Instantiate the fixed [2,2] upper off-diagonal bicharacter and labels 1,e,m,eps through pointed_braided.",
      "Instantiate the fixed [2,2] diagonal/upper bicharacter and labels 1,f1,f2,f3 through pointed_braided.",
      "Check usize-to-i64 conversion, require n>=2, then admit [n,n] through the group/rank bounds and the fixed bicharacter. The recipe name does not establish an independent categorical center theorem.",
      "Instantiate a one-factor bicharacter for arbitrary signed k through pointed_braided; n=0/1 and rank>32 refuse; k divisible by n requires only the trivial root subgroup."
