[package]
name = "tfqm_fusion_categories"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_fusion_categories"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:linear_algebra"]

[dependencies]
linear_algebra = { version = "0.1.0", optional = true }
tfqm_number_theory = { path = "../number_theory" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
