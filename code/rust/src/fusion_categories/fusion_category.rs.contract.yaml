    "Gauge::inverse": "Create one inverse per retained vertex through the checked scalar provider, retaining key support and ordering. Return the first provider failure; under lawful field/nonzero gauge hypotheses the result is a reciprocal gauge. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "module::classify_f_block": "Use lazy expected channel iterators to classify vacant, missing or unexpected sectors without temporary channel vectors. Require exact ordered row/column metadata and matching actual matrix shape, then delegate inverse classification. Preserve defect priority and concrete shape witnesses. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "module::invert_f_block": "Cache an actual inverse for an invertible admitted block, classify only the named singular/no-inverse provider variants as Singular, and propagate every other error. Raw category admission records singular blocks instead of silently declaring them invertible. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::new": "Delegate raw structural/category-resource admission to new_with_limits using the actual default limits. Success is not unit or pentagon validation. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::new_with_limits": "Require multiplicity-free support and resources before rank comparison and block admission. Scan all quadruples lexicographically; retain actual inverse blocks and ordered singular labels in private state. Missing/unexpected/metadata/shape/provider failures return typed errors without partial state. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::singular_blocks": "Borrow the ordered singular-label list recorded during actual inversion; do not infer unit/pentagon validity from an empty list. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::validated": "Construct the actual raw carrier, run its full ordered validate method and return it only on success. The public type also has raw constructors, so type identity alone is not a law certificate. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::ring": "Borrow the immutable sealed FusionRing actually retained in this category. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::f_symbols": "Borrow the exact retained raw FSymbols; no mutation is exposed through this reference. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::f_entry": "Return a cloned stored coefficient when present and exact zero for any absent block/channel. This total extension is the explicit algebraic convention used by the finite law equations. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::f_inverse_block": "Borrow an actually cached inverse block; return None for an absent or recorded-singular block. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::f_inverse_entry": "Look up the inverse with its exchanged f/e channel orientation and return a cloned coefficient, or exact zero when no inverse entry exists. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::fuse_table": "Build the same ordered nonzero support table from this category's sealed ring for the finite law scan. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::pentagon_defects": "Enumerate every unequal pentagon equation on admitted left/right path pairs, preserving lexicographic nine-label order and both exact sides. The admitted record/work bounds cover this full scan. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::first_pentagon_defect": "Use the same ordered complete scan with early exit after its first unequal equation; return exactly the first full-scan defect or None. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::pentagon_scan": "Create one reusable path workspace, visit label quadruples lexicographically and stop only when requested and an actual defect was appended. No dense nine-label product or regenerated per-quad workspace is allocated. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::pentagon_quad_scan": "Fill both path sides for one quadruple and compare every compatible pair sharing total e, in[e,f,g,k,l] order. Append exact unequal sides; stop after the first only under the requested early-exit mode. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::pentagon_lhs": "Compute F[f,c,d;e](g,l)*F[a,b,l;e](f,k), using zero when either stored factor is absent. No floating representation or implicit conjugation is introduced. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::pentagon_rhs": "Sum F[a,b,c;g](f,h)*F[a,h,d;e](g,k)*F[b,c,d;k](h,l) over admitted h in b*c, skipping missing factors as zero. Other h in0..rank have zero support in the first factor, so the restricted sum is the complete declared finite equation. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::unit_defect_labels": "Stream lexicographic blocks with one of the three input legs equal to the unit and whose actual matrix is not1x1 with entry1. The output label d is not a fourth input leg. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::unit_defects": "Collect the complete streaming unit-defect inventory in its existing key order. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::validate": "Refuse the first recorded singular block, then the first unit defect, then the first pentagon defect. Success establishes these finite checks on this immutable value; raw construction remains separately available. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::is_unitary": "Ask the actual involution/matrix provider whether every stored F matrix is unitary, returning false on the first negative answer and propagating provider errors. This is an orthonormal-matrix predicate, separate from weighted gauges or positivity. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::gauge_transform": "For each stored F entry, multiply by u(a,b,e)*u(e,c,d)/(u(b,c,f)*u(a,f,d)) with checked required vertices/division. Preserve channel metadata, clone the borrowed ring into the new owned value, and re-run actual raw structural/resource admission. Arbitrary gauges can change unit normalization. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::unit_constraint": "Borrow one required unit-channel F coefficient or return UnitNormalizationImpossible with the exact first three outer labels; do not synthesize a missing scalar. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::unit_gauge_pair": "For a nonunit b, require its dual and the two original unit coefficients in order; invert the left coefficient through the actual scalar provider and return the right and left gauge values. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::normalized_units_and_gauge": "Build one fresh normalization gauge, replace its nonunit right/left unit vertices in place, transform once, and refuse any remaining first unit defect. Return both the actual transformed category and its gauge, so callers can retain the result without a duplicate transformation. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::unit_normalizing_gauge": "Return the gauge from the shared checked normalization computation; errors retain their original order. This API intentionally discards the companion normalized value because only the gauge was requested. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::normalize_units": "Return the already constructed normalized value from the shared checked computation. Do not rebuild or re-invert the same category a second time. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::dimension_invariant": "For an admitted label and its actual dual, multiply the two specified unit-channel F entries or return the declared BlockMissing witness. This raw product is invariant under unit-compatible gauges; arbitrary unnormalized gauges need not preserve it. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::verify_dimension_entry": "After global slice-length admission, require the actual d[a] to be nonzero and equal to d[dual(a)], preserving zero-before-sphericity priority. Borrow dimension entries without unnecessary clones. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::verify_character_pair": "For one admitted ordered pair, sum the actual embedded nonzero multiplicities times borrowed dimensions and compare to d[a]*d[b]. Preserve embedding overflow/provider errors and exact NotCharacter labels. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::verify_dimension_invariant": "After prior dimension checks, require d[a]*d[dual(a)] times the actual unit-channel F product to equal1; preserve provider/lookup failure or report DisagreesWithF for the actual label. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::verify_dimensions": "Require exact slice cardinality, unit dimension1, then ordered nonzero/spherical checks, lexicographic ring-character pairs, and ordered F-product agreement. This accepts exact signed characters when lawful; no positivity or Frobenius-Perron choice is implied. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape.",
    "FusionCategory::frobenius_schur_indicator": "Check the label/dual first; return None immediately for a nonselfdual object without inspecting dimensions. Otherwise require the unit F coefficient and dimension entry, return only the exact signs1/-1 of their product, and report the typed not-sign defect for every other value. Performed scalar/matrix/ring/provider errors remain typed FusionError; failed owned intermediates do not escape."
  },
  "trust_boundary": "Sealed actual FusionRing representation/admission (rank<=32); actual pinned BasicMatrix callback/shape/storage and exact elimination/involution providers; lawful immutable FusionScalar field, embedding and conjugation; Rust compiler/runtime and ordinary allocation. User callbacks own their effects/panics/time; no allocator or coefficient-bit totality is certified.",
  "assurance_limits": [
    "AuthorityEffect: None. Bounded exact multiplicity-free F-symbol structure, ordered finite law replay, scalar gauges and exact dimension predicates only. No general categorification, physical realization, extracted Rust proof, scalar bit-cost or allocator/OS-memory theorem.",
    "Raw FSymbols and FusionCategory::new may contain singular, unit or pentagon defects. validated runs actual finite checks but shares its public type with raw construction; downstream callers must respect the method-specific admission boundary.",
    "Open scalar/callback protocols require lawful immutable exact field/involution/embedding behavior. Nonlawful, impure, panicking or unbounded client implementations are not certified. Pinned actual matrix/ring/scalar implementations, compiler and ordinary allocation remain in the declared trusted computation.",
    "The12 clean Lean declarations establish their mathematical gauge/count/index model. Actual support enumeration, vector/cache representation, failure order and provider correspondence remain explicit source/native obligations. The finite native corpus is not an all-ring theorem.",
    "Logical category limits are scoped construction/replay admissions, not a meter over repeated API calls or all CPU/map-lookup operations. Retained right-workspace capacities can accumulate across totals, bounded by O(rank*width^2), even when one quadruple has only O(width^3) live paths."
