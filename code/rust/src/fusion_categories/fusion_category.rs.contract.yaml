      "Reset an aligned rank-sized output and distribute each positive source count through every admitted vertex (g,label)->total. Count per output is at most rank times the input per-label bound; zero counts add no paths.",
      "For each nonempty block dimension d, accumulate2*(d*d+2*d+4) logical symbol/metadata cells and4*d^3+2*d^2+d inverse-work units. Empty blocks contribute zero; admitted d<=32 makes all u128 arithmetic exact.",
      "Before coefficient construction, preserve ordered traversal, symbol storage, pentagon-record and aggregate-work charges. Enumerate actual multiplicity-free path dimensions with two reused rank-sized buffers. Scalar-operation and element limits are logical resource admissions, not allocator or coefficient-bit bounds.",
      "Wrap the supplied DimensionDefect without changing its variant, labels or count witnesses.",
      "Borrow the immutable sorted row-channel metadata owned by this block.",
      "Borrow the immutable sorted column-channel metadata owned by this block.",
      "Borrow the exact stored coefficient matrix; borrowing grants no inverse, unit or pentagon law.",
      "Binary-search both channel lists and return the corresponding borrowed matrix entry; missing channels or unavailable matrix coordinates return None rather than inventing a coefficient.",
      "Use the actual checked exact-field inverse; exchange owned row/column channel lists and return the inverse matrix. Singular/provider failures propagate; this method does not validate category laws.",
      "Lift an infallible caller coefficient callback into the default fallible constructor, preserving admitted support, callback order and typed admission failures. Caller panics/side effects are not intercepted.",
      "Lift an infallible coefficient callback into the explicit-limit constructor; multiplicity/resource admission precedes every callback invocation.",
      "Delegate to explicit-limit construction with the actual DEFAULT_CATEGORY_LIMITS; preserve callback failures and their first occurrence.",
      "First require multiplicity-free ring support, then admit all resources, then visit label quadruples lexicographically. Insert exactly nonempty aligned F blocks, invoking the callback in actual matrix row-major channel order; stop on the first typed error without returning partial symbols.",
      "Refuse a non-pointed ring before coefficient construction; otherwise build the raw all-one pointed symbols through the same admitted factory. This is not a proof that arbitrary all-one non-pointed symbols are valid.",
      "Return the retained label rank without recomputation or category admission.",
      "Borrow the block at the exact label quadruple, returning None for an absent key.",
      "Compose block lookup and channel lookup; return None on any absent block/channel rather than a synthesized raw value.",
      "Borrow all retained blocks in BTreeMap lexicographic key order; preserve each block's own channel ordering.",
      "Validate block and both channel coordinates before cloning the persistent map. Change exactly the selected matrix entry in the owned result and preserve the original. Zero values and law defects remain allowed raw data; missing/block/matrix failures remain typed.",
      "Collect the two exact ordered supports, omit a doubly empty sector, and refuse unequal channel cardinalities. Construct the rectangular coefficient matrix under max_elements; matrix callback indices are shape-bounded and map directly to the two channel vectors.",
      "Scan label triples lexicographically and refuse the first N(a,b,c)>1 with its actual coefficient. The sealed ring bounds every index; accepted support coefficients are exactly0/1.",
      "Lazily enumerate ascending e with N(a,b,e)>0 and N(e,c,d)>0 for admitted labels. The cloneable iterator has no channel-vector allocation.",
      "Lazily enumerate ascending f with N(b,c,f)>0 and N(a,f,d)>0 for admitted labels. The cloneable iterator has no channel-vector allocation.",
      "Materialize the row and column iterators only when owned block metadata is needed; preserve ordering, multiplicity-free support and empty sectors.",
      "Own one empty left-path vector and rank right-path groups. Group indices correspond to the final total; later fills reuse their capacities.",
      "Clear the previous left workspace, enumerate every admitted three-vertex left-associated path exactly once, store[e,f,g], and sort lexicographically. Reuse capacity across quadruples.",
      "Clear each previous right group, enumerate every admitted three-vertex right-associated path exactly once, group by total e, and sort each[k,l] list. Reuse capacity across quadruples.",
      "Report syntactic potential membership of a named F-entry in one of the two left or three right factors of this defect. The middle RHS intermediate label varies; this conservative footprint does not establish admissibility, nonzero contribution or absence of cancellation.",
      "Build one unit scalar per admitted vertex of the supplied ring support. This is raw vertex data, not a matrix gauge for arbitrary higher multiplicity spaces.",
      "Visit admitted triples lexicographically and evaluate the supplied callback exactly once per retained vertex; own the resulting map without zero or category-law validation.",
      "Build all vertex values, then refuse the first lexicographic zero with its exact vertex. A successful gauge has every supported vertex present and nonzero under the lawful field assumption; no partial gauge escapes.",
      "Borrow a value at the exact vertex key or return None for a missing key.",
      "Borrow the required vertex or return GaugeMissing with the exact requested triple; do not replace missing values with zero or one.",
      "Refuse a zero replacement before checking membership, then require the exact supported vertex. Preserve zero-before-missing error priority.",
      "For the private owned normalization gauge, validate the nonzero existing vertex and replace it in place. Do not clone the whole map or admit a new vertex.",
      "Validate zero/membership before cloning the persistent gauge, replace exactly one value in the owned result, and preserve the source gauge.",
      "Create one inverse per retained vertex through the checked scalar provider, retaining key support and ordering. Return the first provider failure; under lawful field/nonzero gauge hypotheses the result is a reciprocal gauge.",
      "Use lazy expected channel iterators to classify vacant, missing or unexpected sectors without temporary channel vectors. Require exact ordered row/column metadata and matching actual matrix shape, then delegate inverse classification. Preserve defect priority and concrete shape witnesses.",
      "Cache an actual inverse for an invertible admitted block, classify only the named singular/no-inverse provider variants as Singular, and propagate every other error. Raw category admission records singular blocks instead of silently declaring them invertible.",
      "Delegate raw structural/category-resource admission to new_with_limits using the actual default limits. Success is not unit or pentagon validation.",
      "Require multiplicity-free support and resources before rank comparison and block admission. Scan all quadruples lexicographically; retain actual inverse blocks and ordered singular labels in private state. Missing/unexpected/metadata/shape/provider failures return typed errors without partial state.",
      "Borrow the ordered singular-label list recorded during actual inversion; do not infer unit/pentagon validity from an empty list.",
      "Construct the actual raw carrier, run its full ordered validate method and return it only on success. The public type also has raw constructors, so type identity alone is not a law certificate.",
      "Borrow the immutable sealed FusionRing actually retained in this category.",
      "Borrow the exact retained raw FSymbols; no mutation is exposed through this reference.",
      "Return a cloned stored coefficient when present and exact zero for any absent block/channel. This total extension is the explicit algebraic convention used by the finite law equations.",
      "Borrow an actually cached inverse block; return None for an absent or recorded-singular block.",
      "Look up the inverse with its exchanged f/e channel orientation and return a cloned coefficient, or exact zero when no inverse entry exists.",
      "Build the same ordered nonzero support table from this category's sealed ring for the finite law scan.",
      "Enumerate every unequal pentagon equation on admitted left/right path pairs, preserving lexicographic nine-label order and both exact sides. The admitted record/work bounds cover this full scan.",
      "Use the same ordered complete scan with early exit after its first unequal equation; return exactly the first full-scan defect or None.",
      "Create one reusable path workspace, visit label quadruples lexicographically and stop only when requested and an actual defect was appended. No dense nine-label product or regenerated per-quad workspace is allocated.",
      "Fill both path sides for one quadruple and compare every compatible pair sharing total e, in[e,f,g,k,l] order. Append exact unequal sides; stop after the first only under the requested early-exit mode.",
      "Compute F[f,c,d;e](g,l)*F[a,b,l;e](f,k), using zero when either stored factor is absent. No floating representation or implicit conjugation is introduced.",
      "Sum F[a,b,c;g](f,h)*F[a,h,d;e](g,k)*F[b,c,d;k](h,l) over admitted h in b*c, skipping missing factors as zero. Other h in0..rank have zero support in the first factor, so the restricted sum is the complete declared finite equation.",
      "Stream lexicographic blocks with one of the three input legs equal to the unit and whose actual matrix is not1x1 with entry1. The output label d is not a fourth input leg.",
      "Collect the complete streaming unit-defect inventory in its existing key order.",
      "Refuse the first recorded singular block, then the first unit defect, then the first pentagon defect. Success establishes these finite checks on this immutable value; raw construction remains separately available.",
      "Ask the actual involution/matrix provider whether every stored F matrix is unitary, returning false on the first negative answer and propagating provider errors. This is an orthonormal-matrix predicate, separate from weighted gauges or positivity.",
      "For each stored F entry, multiply by u(a,b,e)*u(e,c,d)/(u(b,c,f)*u(a,f,d)) with checked required vertices/division. Preserve channel metadata, clone the borrowed ring into the new owned value, and re-run actual raw structural/resource admission. Arbitrary gauges can change unit normalization.",
      "Borrow one required unit-channel F coefficient or return UnitNormalizationImpossible with the exact first three outer labels; do not synthesize a missing scalar.",
      "For a nonunit b, require its dual and the two original unit coefficients in order; invert the left coefficient through the actual scalar provider and return the right and left gauge values.",
      "Build one fresh normalization gauge, replace its nonunit right/left unit vertices in place, transform once, and refuse any remaining first unit defect. Return both the actual transformed category and its gauge, so callers can retain the result without a duplicate transformation.",
      "Return the gauge from the shared checked normalization computation; errors retain their original order. This API intentionally discards the companion normalized value because only the gauge was requested.",
      "Return the already constructed normalized value from the shared checked computation. Do not rebuild or re-invert the same category a second time.",
      "For an admitted label and its actual dual, multiply the two specified unit-channel F entries or return the declared BlockMissing witness. This raw product is invariant under unit-compatible gauges; arbitrary unnormalized gauges need not preserve it.",
      "After global slice-length admission, require the actual d[a] to be nonzero and equal to d[dual(a)], preserving zero-before-sphericity priority. Borrow dimension entries without unnecessary clones.",
      "For one admitted ordered pair, sum the actual embedded nonzero multiplicities times borrowed dimensions and compare to d[a]*d[b]. Preserve embedding overflow/provider errors and exact NotCharacter labels.",
      "After prior dimension checks, require d[a]*d[dual(a)] times the actual unit-channel F product to equal1; preserve provider/lookup failure or report DisagreesWithF for the actual label.",
      "Require exact slice cardinality, unit dimension1, then ordered nonzero/spherical checks, lexicographic ring-character pairs, and ordered F-product agreement. This accepts exact signed characters when lawful; no positivity or Frobenius-Perron choice is implied.",
      "Check the label/dual first; return None immediately for a nonselfdual object without inspecting dimensions. Otherwise require the unit F coefficient and dimension entry, return only the exact signs1/-1 of their product, and report the typed not-sign defect for every other value."
