    "domain": "Sealed rank1..32 FusionRing values. Category operations require multiplicity-free supports; lawful immutable exact characteristic-zero FusionScalar field/involution/embedding and compatible actual matrix providers. Method-specific raw, structural, law and dimension admissions are stated separately.",
    "behavior": [
      "Lazily enumerate every ordered pair in0..rank exactly once in lexicographic order, without tuple storage; public callers supply the sealed admitted rank.",
      "Extend the ordered pair stream with every third label in ascending order, yielding the complete lexicographic rank-cubed domain without materialization.",
      "Extend the ordered triple stream with every fourth label in ascending order, yielding the complete lexicographic rank-fourth domain without materialization.",
      "Build the rank-by-rank support table of ascending labels c with N(a,b,c)>0 from the sealed ring. Every retained label is in0..rank; no coefficient or category law is inferred from this table.",
      "Admit requested<=limit including equality, or return Budget with the exact static resource name, u128 request and widened limit. No narrowing or allocation precedes this comparison.",
