            "obligation": "Refuse w=0 or w>4096 before field allocation. Enumerate generator^k for k=0..w-1, comparing exact values; first hit returns (w/gcd(k,w),k/gcd(k,w)), including identity (1,0). Return None if x is not in this advertised cyclic subgroup. No search outside the subgroup; generic lawfulness and primitive order are preconditions.",
