      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/scalar.rs\",\n    \"sha256\": \"67e0c8679e0843208179ae1b9522daccbd5a87e8e3d7b8d5dead1706680b5bb8\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"claim_urn\": \"urn:tfqm:fusion:exact-scalar-adapters:v1\",\n    \"domain\": \"Built-in rational/Gaussian/Eisenstein/fixed cyclotomic fields and valid const cyclotomic N. Generic operations assume lawful exact field, compatible conjugation/rational embedding and the advertised primitive root. Root search/power helpers cap w at 4096. Signed exponents range over all i64.\",\n    \"behavior\": [\n      \"Default returns None for every value; absence of an exact sign oracle is never fabricated as zero or positive.\",\n      \"Read w. Refuse n=0, w=0, w>4096 or n not dividing w before division/remainder or field work. Set step=w/n and residue=k rem_euclid n for every signed-i64 k, then exponent=residue*step in [0,w). Return generator^exponent via the bounded exact power provider; preserve provider failure as None. Exponent reduction is modulo n BEFORE multiplication, so i64::MIN/MAX are fully admitted.\",\n      \"Return precisely the provider real_sign result; None maps to SignUndecided with context a real scalar. No approximate sign or positivity assertion.\",\n      \"Delegate the complete signed exponent domain to the trait method, preserving its value; refusal maps to FieldTooSmall with the exact requested-order diagnostic. This includes unsupported order requests, not only field-extension deficiency.\",\n      \"Request the canonical eighth root and its inverse independently, refusing either missing root with the same FieldTooSmall diagnostic; return their exact sum. Positive sqrt(2) is the canonical embedding convention of supplied built-in roots; arbitrary client generators only establish the corresponding conjugate sum.\",\n      \"Request canonical tenth root and inverse independently and return the exact sum, refusing either absence with FieldTooSmall. The positive golden ratio uses the built-in canonical complex embedding; the open protocol alone cannot order an arbitrary client generator.\",\n      \"Refuse w=0 or w>4096 before field allocation. Enumerate generator^k for k=0..w-1, comparing exact values; first hit returns (w/gcd(k,w),k/gcd(k,w)), including identity (1,0). Return None if x is not in this advertised cyclic subgroup. No search outside the subgroup; generic lawfulness and primitive order are preconditions.\",\n      \"Refuse an empty coefficient slice; return a clone of the first coefficient iff EVERY remaining power-basis coefficient is zero. This is valid for the supplied independent cyclotomic bases; a noncanonical reducible basis would not satisfy the precondition.\",\n      \"Clone the exact rational unchanged.\",\n      \"Return 2, the full rational root-of-unity group order.\",\n      \"Return exact -1, a generator of order two.\",\n      \"Compare the canonical exact rational against zero via Signed; positive, negative and zero are all distinguished.\",\n      \"Return the real coefficient iff imaginary coefficient is exactly zero; otherwise None.\",\n      \"Return 4, for Q(i).\",\n      \"Return i in the exact Gaussian basis.\",\n      \"Delegate to rational sign only if imaginary part is zero; otherwise return None.\",\n      \"Return the rational coefficient iff the independent zeta3 coefficient is zero; otherwise None.\",\n      \"Return 6, for Q(zeta3).\",\n      \"Return 1+zeta3, the canonical primitive sixth root.\",\n      \"Delegate to the rational coefficient sign only when zeta3 coefficient is zero; otherwise None.\",\n      \"Check exact reality before requesting real embeddings. Refuse nonreal inputs and propagate either embedding construction or exact sign failure as None. Provider admission/budgets and canonical real embedding are trusted, not replaced with a guess.\",\n      \"Use the provider independent-basis rational projection for the valid const conductor N.\",\n      \"Report zero for unsupported N before multiplication. For 1<=N<=pinned MAX_CONDUCTOR=1024, return N if even, 2N if odd; all arithmetic fits usize and u32. Invalid generic field value construction remains a provider compile-time refusal.\",\n      \"For valid N in 1..=1024, choose zeta_N for even N and -zeta_N^((N+1)/2) for odd N. The latter squares to zeta_N and has exact order 2N. The conversion fallback is unreachable in the valid domain; invalid N is outside the value constructor domain.\",\n      \"Delegate the provider exact cyclotomic value to the admitted exact real-sign helper.\"\n    ],\n    \"canonical_embedding\": \"Positive sqrt_two/golden_ratio names refer to the canonical roots of built-in providers. An arbitrary client primitive generator can choose another Galois embedding, so the generic protocol only promises the exact root sum.\",\n    \"generated_adapter_contracts\": {\n      \"Cyc5::to_rational\": {\n        \"origin\": \"cyclotomic_scalar! invocation for Cyc5\",\n        \"signature\": \"fn to_rational(&self) -> Option<Rational>\",\n        \"obligation\": \"Project the independent fixed power basis using constant_term; nonzero nonconstant coefficients refuse.\"\n      },\n      \"Cyc5::root_of_unity_order\": {\n        \"origin\": \"cyclotomic_scalar! invocation for Cyc5\",\n        \"signature\": \"fn root_of_unity_order() -> u32\",\n        \"obligation\": \"Return the exact fixed root group order 10.\"\n      },\n      \"Cyc5::primitive_root_of_unity\": {\n        \"origin\": \"cyclotomic_scalar! invocation for Cyc5\",\n        \"signature\": \"fn primitive_root_of_unity() -> Self\",\n        \"obligation\": \"Evaluate the source-bound literal root expression in the exact fixed field; the Cyc5 odd-conductor root is -zeta5^3.\"\n      },\n      \"Cyc5::real_sign\