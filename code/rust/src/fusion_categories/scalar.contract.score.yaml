p=w/n is positive and n*step=w<=4096. Euclidean reduction gives 0<=r=k mod n<n, including k=i64::MIN. Hence exponent=r*step lies in [0,w), is mathematically congruent to k*step modulo w, and fits both signed i64 and u32 before the provider exponent cap 2^20. No overflow-prone intermediate is ever evaluated. Eight checked Lean declarations cover these arithmetic facts and both signed extremes; Rust correspondence is a separate literal source argument.\",\n    \"Root identification maintains current=generator^k, starts at identity and advances exactly once per rejected exponent. A primitive order-w generator has distinct powers for 0<=k<w. The first match has reduced coprime angle k/g over w/g, with gcd(0,w)=w. There are at most 4096 exact comparisons/multiplications; scalar bit costs remain dependent on the lawful implementation.\",\n    \"Independent Gaussian/Eisenstein and cyclotomic power bases make rational projection equivalent to every nonconstant coefficient being zero. Signed rational comparisons are exact. Nonreal cyclotomic values cannot reach the real-sign solver; solver refusals remain None/SignUndecided.\",\n    \"All eight macro invocations instantiate four branch-free adapter methods. The macro template, literal arguments, deterministic 32-body substitution view and calibrated view metrics are bound separately. Native actual macro compilation checks every adapter order, rational projection, exact sign and divisor-order powers; the view is not a compiled source substitute.\",\n    \"Valid const conductors are 1..=1024 from the pinned provider. Even N has root group order N; odd N order 2N with generator -zeta_N^((N+1)/2). Supported arithmetic stays <=2048; unsupported order metadata returns zero before 2N. The type provider enforces valid value construction separately.\"\n  ],\n  \"failure_paths\": {\n    \"FusionScalar::real_sign\": \"Default returns None for every value; absence of an exact sign oracle is never fabricated as zero or positive.\",\n    \"FusionScalar::root_of_unity\": \"Read w. Refuse n=0, w=0, w>4096 or n not dividing w before division/remainder or field work. Set step=w/n and residue=k rem_euclid n for every signed-i64 k, then exponent=residue*step in [0,w). Return generator^exponent via the bounded exact power provider; preserve provider failure as None. Exponent reduction is modulo n BEFORE multiplication, so i64::MIN/MAX are fully admitted.\",\n    \"module::sign_of\": \"Return precisely the provider real_sign result; None maps to SignUndecided with context a real scalar. No approximate sign or positivity assertion.\",\n    \"module::root_of_unity\": \"Delegate the complete signed exponent domain to the trait method, preserving its value; refusal maps to FieldTooSmall with the exact requested-order diagnostic. This includes unsupported order requests, not only field-extension deficiency.\",\n    \"module::sqrt_two\": \"Request the canonical eighth root and its inverse independently, refusing either missing root with the same FieldTooSmall diagnostic; return their exact sum. Positive sqrt(2) is the canonical embedding convention of supplied built-in roots; arbitrary client generators only establish the corresponding conjugate sum.\",\n    \"module::golden_ratio\": \"Request canonical tenth root and inverse independently and return the exact sum, refusing either absence with FieldTooSmall. The positive golden ratio uses the built-in canonical complex embedding; the open protocol alone cannot order an arbitrary client generator.\",\n    \"module::root_of_unity_data\": \"Refuse w=0 or w>4096 before field allocation. Enumerate generator^k for k=0..w-1, comparing exact values; first hit returns (w/gcd(k,w),k/gcd(k,w)), including identity (1,0). Return None if x is not in this advertised cyclic subgroup. No search outside the subgroup; generic lawfulness and primitive order are preconditions.\",\n    \"module::constant_term\": \"Refuse an empty coefficient slice; return a clone of the first coefficient iff EVERY remaining power-basis coefficient is zero. This is valid for the supplied independent cyclotomic bases; a noncanonical reducible basis would not satisfy the precondition.\",\n    \"Rational::to_rational\": \"Clone the exact rational unchanged.\",\n    \"Rational::root_of_unity_order\": \"Return 2, the full rational root-of-unity group order.\",\n    \"Rational::primitive_root_of_unity\": \"Return exact -1, a generator of order two.\",\n    \"Rational::real_sign\": \"Compare the canonical exact rational against zero via Signed; positive, negative and zero are all distinguished.\",\n    \"GaussianRat::to_rational\": \"Return the real coefficient iff imaginary coefficient is exactly zero; otherwise None.\",\n    \"GaussianRat::root_of_unity_order\": \"Return 4, for Q(i).\",\n    \"GaussianRat::primitive_root_of_unity\": \"Return i in the exact Gaussian basis.\",\n    \"GaussianRat::real_sign\": \"Delegate to rational sign only if imaginary part is zero; otherwise return None.\",\n    \"EisensteinRat::to_rational\": \"Return the rational coefficient iff the independent zeta3 coefficient is zero; otherwise None.\",\n    \"EisensteinRat::root_of_unity_order\": \"Return 6, for Q(zeta3).\",\n    \"EisensteinRat::primitive_root_of_unity\": \"Return 1+zeta3, the canonical primitive sixth root.\",\n    \"EisensteinRat::real_sign\": \"Delegate to the rational coefficient sign only when zeta3 coefficient is zero; otherwise None.\",\n    \"module::cyclotomic_sign\": \"Check exact reality before requesting real embeddings. Refuse nonreal inputs and propagate either embedding construction or exact sign failure as None. Provider admission/budgets and canonical real embedding are trusted, not replaced with a guess.\",\n    \"Cyclotomic<N>::to_rational\": \"Use the provider independent-basis rational projection for the valid const conductor N.\",\n    \"Cyclotomic<N>::root_of_unity_order\": \"Report zero for unsupported N before multiplication. For 1<=N<=pinned MAX_CONDUCTOR=1024, return N if even, 2N if odd; all arithmetic fits usize and u32. Invalid generic field value construction remains a provider compile-time refusal.\",\n    \"Cyclotomic<N>::primitive_root_of_unity\": \"For valid N in 1..=1024, choose zeta_N for even N and -zeta_N^((N+1)/2) for odd N. The latter squares to zeta_N and has exact order 2N. The conversion fallback is unreachable in the valid domain; invalid N is outside the value constructor domain.\",\n    \"Cyclotomic<N>::real_sign\": \"Delegate the provider exact cyclotomic value to the admitted exact real-sign helper.\"\n  },\n  \"trust_boundary\": \"Rust/compiler, lawful exact Field/ExactRing/Involution/RationalEmbedding implementations, num_bigint/num_rational, pinned cyclotomic power bases and exact real-embedding provider. The open marker/protocol cannot enforce algebraic laws or resource behavior of client implementations. Valid generic values require 1<=N<=1024 per the pinned provider. Standard allocation/OS memory and bit complexity of arbitrary rational coefficients are not bounded by the root-order cap.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. Root arithmetic, subfield projection and exact-sign admission only; no category realizability, physical interpretation or abstract client-law enforcement.\",\n    \"The Lean model proves exact modular arithmetic, not Rust extraction, compiler correctness, arbitrary client crash freedom or allocation totality.\",\n    \"A 4096-step root-order cap is not a heap-byte/runtime bound for arbitrary exact scalar coefficient sizes.\",\n    \"Rust/compiler, lawful exact Field/ExactRing/Involution/RationalEmbedding implementations, num_bigint/num_rational, pinned cyclotomic power bases and exact real-embedding provider. The open marker/protocol cannot enforce algebraic laws or resource behavior of client implementations. Valid generic values require 1<=N<=1024 per the pinned provider. Standard allocation/OS memory and bit complexity of arbitrary ration