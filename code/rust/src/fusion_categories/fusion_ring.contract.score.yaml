  \"obligation\": \"Construct the admitted cyclic pointed ring for n=2..32; zero/one or excessive n refuse through group admission before naming. The trivial group is available through empty moduli.\"\n    },\n    \"FusionRing::pointed\": {\n      \"line\": 768,\n      \"signature\": \"pub fn pointed(moduli: &[usize], names: Option<Vec<String>>) -> Result<Self, FusionError>\",\n      \"obligation\": \"Admit the mixed-radix abelian group, allocate its bounded tensor and fill one product outcome using allocation-free group addition. Default or caller-supplied names are checked by the table constructor; validate all based-ring laws before return.\"\n    },\n    \"FusionRing::ising\": {\n      \"line\": 784,\n      \"signature\": \"pub fn ising() -> Result<Self, FusionError>\",\n      \"obligation\": \"Validate the literal Ising table through the ordinary certified constructor.\"\n    },\n    \"FusionRing::fibonacci\": {\n      \"line\": 788,\n      \"signature\": \"pub fn fibonacci() -> Result<Self, FusionError>\",\n      \"obligation\": \"Construct and validate the literal rank-two tensor with tau squared=1+tau and the two metadata names. No approximate golden ratio is used.\"\n    },\n    \"FusionRing::semion\": {\n      \"line\": 795,\n      \"signature\": \"pub fn semion() -> Result<Self, FusionError>\",\n      \"obligation\": \"Return the named pointed Z2 fusion ring; braiding/spin data are outside this file.\"\n    },\n    \"FusionRing::toric_code\": {\n      \"line\": 799,\n      \"signature\": \"pub fn toric_code() -> Result<Self, FusionError>\",\n      \"obligation\": \"Return the named pointed Z2-by-Z2 fusion ring only.\"\n    },\n    \"FusionRing::three_fermion\": {\n      \"line\": 806,\n      \"signature\": \"pub fn three_fermion() -> Result<Self, FusionError>\",\n      \"obligation\": \"Return the same Z2-by-Z2 fusion multiplicities with different metadata names; no fermion statistics or braiding is certified here.\"\n    },\n    \"FusionRing::su2_level\": {\n      \"line\": 813,\n      \"signature\": \"pub fn su2_level(k: usize) -> Result<Self, FusionError>\",\n      \"obligation\": \"checked_add k+1 first, reject k=0 or rank>32 before allocation, then fill all bounded SU2 triangle/parity products, attach names and validate the complete based ring. Admitted levels are 1..31, with typed Overflow at usize::MAX.\"\n    },\n    \"FusionRing::fill_su2_product\": {\n      \"line\": 833,\n      \"signature\": \"fn fill_su2_product(n: &mut [u64], rank: usize, k: usize, i: usize, j: usize)\",\n      \"obligation\": \"Private admitted k/rank/i/j: set exactly labels from abs(i-j) to min(i+j,2k-i-j) of even i+j+l parity. i+j<=2k makes subtraction exact; bounded labels make flattened slots valid.\"\n    },\n    \"FusionRing::rep_s3\": {\n      \"line\": 845,\n      \"signature\": \"pub fn rep_s3() -> Result<Self, FusionError>\",\n      \"obligation\": \"Construct and validate the fixed representation-ring tensor with unit, sign and standard labels; this is the commutative representation ring, distinct from the noncommutative S3 group-ring challenge.\"\n    }\n  },\n  \"invariants\": [\n    \"Carrier and storage invariant: every raw table has 1<=rank<=32, exactly rank cubed nonnegative-u64 entries and rank arbitrary name strings. Names are metadata only. Unit is numeric label zero. All table/ring/group representation fields are private with shared views and owned clones, so safe public code cannot forge or mutate a certified carrier. Literal Ising data separately have rank 3, 27 entries and three names.\",\n    \"Group invariant: each factor is at least two; the checked prefix product stays <=32 before moduli are copied, so an admitted factor list has length<=5 and every arithmetic prefix fits usize on the compiled 64-bit target (also 32-bit). Empty moduli give order one. Division/remainder decodes digits; the prefix weighted sum encodes them and is always below the next prefix product. This proves round-trip, modular addition and negation. Direct streaming operations remove digit-vector allocations; digit-vector APIs still return their necessary owned outputs.\",\n    \"Coefficient lookup invariant: admitted a,b,c<r give flattened index (a*r+b)*r+c<r cubed<=32768. Every public label method checks its arguments before lookup; crate-only n and private helpers have explicit bounded-label preconditions. Law loops, admitted duals, generated group products, vector shapes and prevalidated words establish those bounds internally. A get fallback is not advertised as safe validation of arbitrary usize indices.\",\n    \"Law admission invariant: raw shaping alone asserts no fusion laws. The checker tests both unit laws, optional commutativity, all associativity coefficients, unique unit-pair duals with involution, then both reciprocity equalities. All loops are finite and scans preserve a,b,c,d lexicographic priority. u64 products fit u128 (kernel bound); checked sums either are exact or refuse. No wrapped result can certify a law. try_new intentionally uses the noncommutative path, so a successful Ring carries exactly a bounded unital based-ring invariant rather than commutativity or categorical realizability.\",\n    \"Closure of the declared based-ring structure: nonnegative coefficients extend bilinearly to the free integer module, unit/associativity hold on basis elements and hence all elements, and the unit coefficient supplies the standard basis pairing. Reciprocity plus dual involution gives N(a,b,c)=N(b_star,a_star,c_star), so the basis involution is anti-multiplicative and L_a transpose=L_a_star. The source law gates discharge these hypotheses; no realization by associators or braidings is assumed.\",\n    \"Path invariant: the empty word has one path at unit zero. At each word label w, next[c]=sum_a counts[a]*N(a,w,c), which counts the disjoint choices of previous endpoint and each multiplicity channel. This is right-fusion order, independently tested on a noncommutative S3 group ring. The kernel proves the exact finite matrix-product and concatenation form of this recurrence. All counts use BigUint; zeros are skipped without changing the sum, and two disjoint rank-length buffers are cleared then swapped. The second vector is allocated only when needed, and selected target counts are moved, not cloned.\",\n    \"Work invariant: for each admitted w, D_w=max_a sum_c N(a,w,c)<2^69 is computed exactly in u128. path_growth is zero for D<=1 and otherwise ceil(log2 D) from leading zeros of D-1. If the current total path mass has at most prefix_bits bits, then after this step it has at most prefix_bits+growth bits. Each intermediate output sum is at most total_input_mass*(2^64-1), so charging r squared*(prefix_bits+64) covers the declared scalar-bit envelope. The source admits the first prefix at equality to 2^32 and refuses the first greater charge before BigUint work. A stack cache computes each label growth once. Preflight is O(r cubed+word length) scalar metadata work, outside this deliberately abstract bit-work charge.\",\n    \"Failure/size invariant: repeated-label counting checks label, then copies<=16384, then bit work. Mixed words check length, then all labels, then bit work before count-vector allocation. Private iterators are finite copies of that same admitted immutable sequence. prefix_bits<=1+69*16384 and all preflight work arithmetic fits u128. Late invalid labels now refuse before prefix arithmetic. Oversized-word and coefficient-growth work refusals are typed Budget values; they intentionally narrow formerly impractical requests. They are not CPU-cycle, byte-precise heap or OS-memory guarantees.\",\n    \"Narrowing invariant: u64 path outputs are produced only by checked conversion after the exact count is computed. Rational spectral coefficients pass is_integer before to_integer; an unexpected fractional provider coefficient is a typed Polynomial error. Generic Verlinde expected coefficients are embedded only after u64-to-i64 admission, otherwise the entire local defect list is discarded with Overflow. No float, rounding, saturation or silent quotient truncation appears in admitted paths.\",\n    \"Matrix/spectral invariant: fusion_matrix(a)[b,c]=N(a,b,c), and the rational matrix builder lifts these same integers directly into one bounded flat buffer. The checked characteristic polynomial is monic and constant-first. The kernel proves characteristic-polynomial compatibility with Int-to-Rat embedding. Exact algebraic-root computation uses the pinned provider limits (degree 64, coefficient bits 4096, refinement steps 16384) and may return their typed errors even for an otherwise admitted ring. Successful results are certified rational/quadratic/isolated-root carriers, not floating approximations. The FP identification is justified by the separately recorded finite spectral argument, not by pretending the Rust or Perron-Frobenius theorem was extracted into Lean.\",\n    \"Verlinde invariant: for lawful exact FusionScalar operations, compatible integer/rational embedding and conjugation, the method checks the r-by-r shape first, then d_squared inverse, then the first-row inverses. It evaluates sum_x S[a,x]*S[b,x]*conjugate(S[c,x])/S[0,x]/d_squared in the original order and compares to the admitted coefficient in that field. It reports all mismatches lexicographically; an empty result proves these finite field identities only, not unitarity/nondegeneracy of S or existence of a modular category. Exactness/lawfulness and operation costs of caller-defined scalar implementations are explicit TCB assumptions, not runtime properties conferred by an open marker trait.\",\n    \"Catalog invariant: pointed tables use the actual admitted abelian group addition; Fibonacci, Ising and S3 representation tables are explicit finite tensors passed through ordinary validation. Semion/toric/three-fermion names refer to fusion multiplicities only, with no spin/braiding claim. SU2 accepts exactly k=1..31 after checked k+1; its admitted i,j<=k imply i+j<=2k, and triangle/parity filling is exact with bounded row-major indices. Constructor rank, shape and name errors remain ordered and constructor-owned allocation follows rank admission.\",\n    \"Lifecycle/cost invariant: every Result failure drops local work and returns no partial certified object, count vector, spectral coefficient vector or defect list. Borrowed inputs are not written by this module; effects of arbitrary scalar implementations belong to their declared TCB. Cloning a borrowed table into a returned owned ring is required by the API. Law validation uses O(r fifth) bounded u128 operations; group operations are O(number of factors); preflight uses O(r cubed+L); admitted DP uses two O(r)-value buffers and at most the declared scalar-bit envelope. Spectral matrix/characteristic/root methods use bounded matrix dimensions and pinned provider budgets; generic Verlinde uses O(r fourth) scalar operations plus input-field bit costs. No allocation for digit intermediates, coefficient BigUint copies, per-step count vectors, temporary integer-to-rational matrices, target-count clones or repeated flat-table growth remains. All 74 bodies meet measured maxima 10/9/3.\"\n  ],\n  \"failure_paths\": {\n    \"module::admit_rank\": \"Admit exactly 1..=32 before constructor-owned allocation; reject zero/excessive ranks with both actual rank and maximum.\",\n    \"module::flatten_multiplicities\": \"Private bounded-R caller: reserve exactly R cubed entries and preserve row-major plane/row/column order without vector growth. Public array construction admits R first; catalog calls use fixed R=2 or 3.\",\n    \"AbelianGroup::new\": \"Consume a borrowed factor list. Require each factor>=2, checked-multiply its prefix order, then require prefix order<=32 before copying moduli. Empty factors give the trivial order-one group. Report the first invalid factor, product overflow or excessive prefix order.\",\n    \"AbelianGroup::moduli\": \"Borrow the private, admitted factor list without mutation.\",\n    \"AbelianGroup::order\": \"Return its exact private product, at least one and at most 32.\",\n    \"AbelianGroup::check_label\": \"Accept precisely labels below order, including the empty-product case; reject equality/above before coordinate arithmetic.\",\n    \"AbelianGroup::digits\": \"Admit the label then repeatedly divide/remainder by each positive modulus, producing least-significant-factor-first digits. Final remainder is zero and every digit is within its factor.\",\n    \"AbelianGroup::label\": \"Check exact digit length before checking each digit bound. Encode the weighted sum with prefix-product strides; all prefixes and the final label fit below order<=32.\",\n    \"AbelianGroup::add\": \"Admit a then b, stream their admitted residues into the same mixed-radix encoding, and perform componentwise modular addition without allocating digit vectors.\",\n    \"AbelianGroup::negate\": \"Admit the label and stream modular negatives into the encoding, using (m-digit)%m so zero remains zero, with no heap allocation.\",\n    \"FusionTable::new\": \"Admit rank before generating default names, then delegate shape/name validation. Default name strings label indices; they are metadata, not mathematical identifiers.\",\n    \"FusionTable::with_names\": \"Admit rank, then exactly rank cubed coefficients, then exactly rank names. Own the shaped nonnegative-u64 tensor and arbitrary strings privately; this raw table constructor does not assert fusion laws or uniqueness/nonemptiness of name strings.\",\n    \"FusionTable::from_array\": \"Admit const R before flattening the caller-owned array. Use the exact-capacity row-major helper, then the ordinary constructor.\",\n    \"FusionTable::rank\": \"Return the immutable admitted tensor rank.\",\n    \"FusionTable::names\": \"Return shared read-only metadata; numerical labels determine all algebra.\",\n    \"FusionTable::check\": \"Admit label<rank; return the exact label or a typed Label error.\",\n    \"FusionTable::at\": \"Private bounded-label lookup computes (a*r+b)*r+c. Production callers prove a,b,c<r; flattened index<r cubed<=32768. The zero get fallback is defensive, not validation of arbitrary oversized indices.\",\n    \"FusionTable::multiplicity\": \"Admit a then b then c at the public boundary and return the exact u64 coefficient.\",\n    \"FusionTable::associativity_sum\": \"Private bounded-r loop: convert both u64 factors to u128, checked-multiply and checked-add. Individual products fit u128; aggregate overflow refuses rather than wraps.\",\n    \"FusionTable::unique_dual\": \"For fixed bounded a, find the unique b with nonzero unit coefficient, requiring coefficient exactly one. Reject a on multiple hits, coefficient>1 or no hit.\",\n    \"FusionTable::dual_labels\": \"Collect candidate duals in a order, then require dual(dual(a))=a for every a. All collected labels are below rank. Return the first offending a.\",\n    \"FusionTable::first_unit_defect\": \"Check both left and right unit-zero laws against delta(c,label), scanning labels then c; report the first bad label.\",\n    \"FusionTable::first_commutativity_defect\": \"Scan left<right in order and report the first pair with any unequal outcome coefficient. This optional test is not imposed by FusionRing::try_new.\",\n    \"FusionTable::associativity_defect_at\": \"At one bounded (a,b,c,d), compute both exact checked-u128 convolution sums. Return the two actual unequal values or an Overflow diagnostic; return None only for two successful equal sums.\",\n    \"FusionTable::associativity_defect_for_pair\": \"For fixed a,b, scan c then d ascending and preserve the first exact mismatch/overflow witness.\",\n    \"FusionTable::first_associativity_defect\": \"Scan a then b and delegate c,d; helper factoring preserves the full original lexicographic witness order.\",\n    \"FusionTable::first_duality_defect\": \"Map the first failed dual candidate/involution to a Duality defect without changing the label.\",\n    \"FusionTable::reciprocity_defect_for_pair\": \"Private in-range candidate-dual entries, with missing entries falling back to their original labels: find first c violating either Frobenius coefficient equality. Production passes the complete admitted dual list.\",\n    \"FusionTable::first_reciprocity_defect\": \"Scan a,b ascending and report the first c reciprocity witness. Internal caller establishes bounded candidate dual entries.\",\n    \"FusionTable::first_defect\": \"Check unit, optional commutativity, then associativity/overflow, duality and reciprocity in that exact priority order.\",\n    \"FusionTable::first_defect_allowing_noncommutative\": \"Check unit and all remaining based-ring laws without requiring commutativity. Noncommutative finite group rings are intentionally admitted.\",\n    \"FusionTable::first_noncommutative_remainder\": \"Check associativity/overflow first, duality next, then reciprocity with recomputed admitted duals. No failed law yields a successful certificate.\",\n    \"FusionTable::validate\": \"Clone this borrowed raw table into the owned validated-ring constructor. The owned table copy is required by the returned Ring API; failure leaves the borrowed input unchanged.\",\n    \"FusionTable::charge_counts\": \"Admit label first, then copies<=16384, then conservative scalar-bit work. Only then compute exact right-fusion counts from the unit via the repeated label, including zero copies.\",\n    \"FusionTable::charge_counts_u64\": \"Compute the same admitted exact counts, then checked-narrow every entry. Refuse any count outside u64 and discard partial converted output.\",\n    \"FusionTable::unit_counts\": \"Create exactly rank BigUint counts with one in slot zero and zeros elsewhere; this is the empty-word state.\",\n    \"FusionTable::path_growth\": \"For one admitted label compute D=max_a sum_c N(a,w,c) in u128. Return zero for D<=1, otherwise ceil(log2 D) using leading zeros of D-1. D<=32*(2^64-1)<2^69.\",\n    \"FusionTable::admit_path_work\": \"Private bounded-length, prevalidated labels only. Keep a fixed stack cache of label growths. Charge r squared*(prefix_bits+64) per step, reject at the first cumulative charge>2^32, and advance prefix_bits by that label growth. Equality is admitted. This conservative scalar-bit envelope is not a CPU-cycle or heap-byte bound.\",\n    \"FusionTable::step_into\": \"Private rank-length disjoint count/output buffers and admitted w: clear the output, skip zero counts and zero coefficients, and sum count[a]*N(a,w,c) exactly using scalar-u64 multiplication. No coefficient BigUint copies or output-vector allocation occurs here.\",\n    \"FusionTable::path_counts\": \"Private previously admitted iterator: start at the unit, allocate the second rank-length buffer only if a step exists, clear/fill then swap buffers. Preserve right-multiplication word order; return owned final counts without cloning.\",\n    \"FusionTable::ising\": \"Return the literal rank-three, 27-entry Ising tensor and three fixed names. Literal dimensions satisfy the raw-table representation invariant; validated-ring construction is separate.\",\n    \"FusionRing::try_new\": \"Own a raw shaped table, reject its first noncommutative-allowing law/overflow defect, then store its admitted involutive dual list privately. Success certifies a bounded based ring, not categorical realizability.\",\n    \"FusionRing::rank\": \"Return the certified carrier rank.\",\n    \"FusionRing::names\": \"Borrow its owned label-name metadata.\",\n    \"FusionRing::unit\": \"Return the designated numeric unit label zero.\",\n    \"FusionRing::table\": \"Borrow the raw table read-only; callers cannot mutate the certified representation.\",\n    \"FusionRing::dual\": \"Admit the public label and return its stored in-range dual; preserve typed defensive missing-entry failure.\",\n    \"FusionRing::multiplicity\": \"Delegate the three-label admission and exact coefficient access.\",\n    \"FusionRing::n\": \"Crate-only bounded-label coefficient access for validated consumer loops. This fast path does not admit arbitrary raw labels; consumers must establish all three bounds.\",\n    \"FusionRing::fuse\": \"Admit a then b and return each c with positive coefficient, once in ascending order. This is support, not an expanded multiplicity list.\",\n    \"FusionRing::is_commutative\": \"Report whether every tensor pair commutes, without changing the noncommutative Ring type invariant.\",\n    \"FusionRing::is_multiplicity_free\": \"Return true exactly when every nonnegative coefficient is at most one.\",\n    \"FusionRing::is_pointed\": \"Return true exactly when every product has total coefficient one. checked-u64 row-sum overflow makes the result false, never a spurious one.\",\n    \"FusionRing::fusion_paths\": \"Compute the admitted word counts first, then admit target, preserving word-error-before-target priority. Move the selected BigUint out of the owned count vector without cloning. Invalid target may follow bounded valid-word computation.\",\n    \"FusionRing::fusion_path_counts\": \"Reject word length>16384 before inspecting labels; validate every label before work admission and BigUint allocation; then compute the exact counts with two reusable buffers.\",\n    \"FusionRing::fusion_matrix\": \"Admit a, then return integer matrix rows b/columns c with entries N(a,b,c); no truncating scalar representation.\",\n    \"FusionRing::rational_fusion_matrix\": \"Admit a before allocation; construct the same row-major entries directly as exact rationals through a bounded flat BasicMatrix builder. Avoid a temporary integer matrix and nested conversion vectors.\",\n    \"FusionRing::integral_coefficients\": \"Require each provider rational coefficient to be integral before conversion to BigInt; reject an unexpected fractional coefficient with a typed Polynomial error instead of truncating it.\",\n    \"FusionRing::characteristic_polynomial\": \"Build the exact integral fusion matrix in rational representation, obtain its monic characteristic polynomial from the pinned provider, and pass all coefficients through the integrality gate. Coefficients are returned constant-first.\",\n    \"FusionRing::frobenius_perron_dimension\": \"Return the provider-certified largest real root of the integral nonnegative fusion matrix characteristic polynomial, or propagate its explicit algebraic budget/domain error. Perron-Frobenius identifies this root as the FP dimension; success is not promised beyond provider budgets.\",\n    \"FusionRing::global_dimension_squared\": \"Form the exact ordered sum over a of N_a*N_dual(a), obtain its checked integral characteristic polynomial, and return its largest real root or provider error. The based-ring positive character identifies it with sum of squared FP dimensions; no fusion category or physical authority follows.\",\n    \"FusionRing::verlinde_defects\": \"For a lawful exact FusionScalar with compatible integer embedding/conjugation, reject wrong S shape before inversions, then invert d_squared and each first-row entry in order. Scan a,b,c lexicographically, collecting precisely unequal field identities; do not claim that S is itself modular/unitary.\",\n    \"FusionRing::verlinde_value\": \"For one admitted triple and rank-length weights, sum in x order S[a,x]*S[b,x]*conjugate(S[c,x])/S[0,x], then multiply by d_squared inverse. Preserve typed matrix errors; field operations are the declared lawful-scalar TCB.\",\n    \"FusionRing::collect_verlinde_pair\": \"Scan c in order, compute the formula value, then checked-convert the u64 coefficient to i64 for field embedding. On overflow return the exact embedding error and expose no partial defects; otherwise append each mismatch.\",\n    \"FusionRing::z_n\": \"Construct the admitted cyclic pointed ring for n=2..32; zero/one or excessive n refuse through group admission before naming. The trivial group is available through empty moduli.\",\n    \"FusionRing::pointed\": \"Admit the mixed-radix abelian group, allocate its bounded tensor and fill one product outcome using allocation-free group addition. Default or caller-supplied names are checked by the table constructor; validate all based-ring laws before return.\",\n    \"FusionRing::ising\": \"Validate the literal Ising table through the ordinary certified constructor.\",\n    \"FusionRing::fibonacci\": \"Construct and validate the literal rank-two tensor with tau squared=1+tau and the two metadata names. No approximate golden ratio is used.\",\n    \"FusionRing::semion\": \"Return the named pointed Z2 fusion ring; braiding/spin data are outside this file.\",\n    \"FusionRing::toric_code\": \"Return the named pointed Z2-by-Z2 fusion ring only.\",\n    \"FusionRing::three_fermion\": \"Return the same Z2-by-Z2 fusion multiplicities with different metadata names; no fermion statistics or braiding is certified here.\",\n    \"FusionRing::su2_level\": \"checked_add k+1 first, reject k=0 or rank>32 before allocation, then fill all bounded SU2 triangle/parity products, attach names and validate the complete based ring. Admitted levels are 1..31, with typed Overflow at usize::MAX.\",\n    \"FusionRing::fill_su2_product\": \"Private admitted k/rank/i/j: set exactly labels from abs(i-j) to min(i+j,2k-i-j) of even i+j+l parity. i+j<=2k makes subtraction exact; bounded labels make flattened slots valid.\",\n    \"FusionRing::rep_s3\": \"Construct and validate the fixed representation-ring tensor with unit, sign and standard labels; this is the commutative representation ring, distinct from the noncommutative S3 group-ring challenge.\"\n  },\n  \"trust_boundary\": \"Trust includes Rust/compiler, standard allocation, num_bigint/num_rational, BasicMatrix/exact-field implementations and exact algebraic-root isolation. Spectral provider budgets can refuse. Generic scalar lawfulness, compatible embedding/conjugation, and its arithmetic bit costs are a caller/domain assumption, not a sealed security guarantee. The 2^32 scalar-bit envelope is a conservative cost model with fixed rank/word caps, not measured CPU time or heap bytes; custom field operations and OS memory exhaustion are not controlled by it. Refusals of large-growth path requests are intentional new admission behavior. Crate-only n and private helpers require their documented label/shape/iterator preconditions; public entry points establish them. No arbitrary internal misuse or unsafe client mutation is covered.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. This file delivers bounded based rings and exact algorithms/checks, not associators, categorical realizability, braiding/spin statistics, a classification theorem or physical authority.\",\n    \"Lean proves the listed arithmetic/matrix/admission facts. The complete Rust refinement, allocator behavior and finite PF interpretation are explicit source arguments; the latter uses the cited primary mathematical result and is not represented as a new kernel theorem.\",\n    \"Trust includes Rust/compiler, standard allocation, num_bigint/num_rational, BasicMatrix/exact-field implementations and exact algebraic-root isolation. Spectral provider budgets can refuse. Generic scalar lawfulness, compatible embedding/conjugation, and its arithmetic bit costs are a caller/domain assumption, not a sealed security guarantee.\",\n    \"The 2^32 scalar-bit envelope is a conservative cost model with fixed rank/word caps, not measured CPU time or heap bytes; custom field operations and OS memory exhaustion are not controlled by it. Refusals of large-growth path requests are intentional new admission behavior.\",\n    \"Crate-only n and private helpers require their documented label/shape/iterator preconditions; public entry points establish them. No arbitrary internal misuse or unsafe client mutation is covered.\",\n    \"Native scope is actual full fusion packages and both canonical crate roots, with all support sources content-bound. No main-workspace validation or origin/authority attestation is inferred. Historical passing intermediate sources and the rejected first matrix model remain distinct, without relabeling.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/fusion_ring.json\",\n      \"sha256\": \"6ea3e0def7cfca70d6d164444a598a2f6014c85cdb991454f3e2857128f34057\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
