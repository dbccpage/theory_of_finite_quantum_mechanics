      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/fusion_ring.rs\",\n    \"sha256\": \"be67d1f5782df7428c799daa5447c5a424f60dade5d11b627d78cf82617cbd46\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"boundary_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"domain\": \"Partial contract: selected rank admission, law-check traversal, exact matrix conversion and refactored scalar/generator operations. Complete ring semantics/provider/cost review remains pending.\",\n    \"behavior\": [\n      \"Admit exactly 1..=32 with no allocation, returning RankOutOfRange otherwise. This new common guard precedes convenience constructor allocations.\",\n      \"Admit rank before allocating default name strings; pass names and multiplicities to with_names. Invalid-rank requests allocate no constructor-owned heap storage.\",\n      \"Admit rank first, then exactly rank cubed multiplicities, then exactly rank names; own a raw shaped table. This constructor alone does not validate fusion-ring laws.\",\n      \"Admit const R before flattening the caller-supplied stack array; preserve the original row-major order and ordinary constructor behavior on admitted R.\",\n      \"Admit the cyclic modulus via pointed/AbelianGroup before generating names; preserve accepted default names for n=2..32 and legacy refusal of n=0,1.\",\n      \"checked_add the level-plus-one rank; return typed Overflow for usize::MAX, preserve the zero-level/rank error and admit levels 1..31 before allocation. For admitted i,j<=k, i+j<=2*k proves the high-limit subtraction exact without saturation.\",\n      \"Scan labels b ascending for the unique nonzero unit coefficient in a*b; require exactly one occurrence of multiplicity one, preserving the first failing a.\",\n      \"Collect unique duals in a order, then verify the same involution check as before; no acceptance predicate or error priority changes.\",\n      \"Evaluate both checked-u128 sums at one (a,b,c,d), returning the same mismatch or overflow witness with identical operands.\",\n      \"For fixed (a,b), scan c then d ascending and stop at the first outcome defect.\",\n      \"Scan a then b ascending and ask the pair helper for c,d; this preserves the complete original lexicographic defect ordering.\",\n      \"For fixed (a,b), compute the same dual fallbacks once and find the first violating c. No invalid-dual fallback semantics changes.\",\n      \"Scan a then b ascending and report the first c witness from the pair helper.\",\n      \"Factor the identical checked label lookup, integer fusion matrix and integer-to-rational map into one reusable conversion.\",\n      \"Accumulate the same ordered sum of N_a*N_a_star in exact rational matrices, then call the unchanged characteristic-polynomial and root providers.\",\n      \"Compute the same x-ordered scalar sum and final d_inverse multiplication for one (a,b,c). Field/scalar dependencies and coefficient conversion assumptions remain unreviewed at the full ring level.\",\n      \"For fixed (a,b), scan c ascending, compute each full scalar value before checked coefficient embedding and append the same mismatch witnesses into the existing output vector.\",\n      \"Preserve shape, d_inverse and first-row inverse admission order, then scan a,b and delegate c to the pair helper. No per-pair output vector allocation.\",\n      \"For admitted k/rank/i/j, fill the same low..high labels of correct parity in the existing row-major slice; no intermediate allocation.\"\n    ]\n  },\n  \"operations\": {\n    \"admit_rank\": {\n      \"obligation\": \"Admit exactly 1..=32 with no allocation, returning RankOutOfRange otherwise. This new common guard precedes convenience constructor allocations.\"\n    },\n    \"FusionTable::new\": {\n      \"obligation\": \"Admit rank before allocating default name strings; pass names and multiplicities to with_names. Invalid-rank requests allocate no constructor-owned heap storage.\"\n    },\n    \"FusionTable::with_names\": {\n      \"obligation\": \"Admit rank first, then exactly rank cubed multiplicities, then exactly rank names; own a raw shaped table. This constructor alone does not validate fusion-ring laws.\"\n    },\n    \"FusionTable::from_array\": {\n      \"obligation\": \"Admit const R before flattening the caller-supplied stack array; preserve the original row-major order and ordinary constructor behavior on admitted R.\"\n    },\n    \"FusionRing::z_n\": {\n      \"obligation\": \"Admit the cyclic modulus via pointed/AbelianGroup before generating names; preserve accepted default names for n=2..32 and legacy refusal of n=0,1.\"\n    },\n    \"FusionRing::su2_level\": {\n      \"obligation\": \"checked_add the level-plus-one rank; return typed Overflow for usize::MAX, preserve the zero-level/rank error and admit levels 1..31 before allocation. For admitted i,j<=k, i+j<=2*k proves the high-limit subtraction exact without saturation.\"\n    },\n    \"unique_dual\": {\n      \"obligation\": \"Scan labels b ascending for the unique nonzero unit coefficient in a*b; require exactly one occurrence of multiplicity one, preserving the first failing a.\"\n    },\n    \"dual_labels\": {\n      \"obligation\": \"Collect unique duals in a order, then verify the same involution check as before; no acceptance predicate or error priority changes.\"\n    },\n    \"associativity_defect_at\": {\n      \"obligation\": \"Evaluate both checked-u128 sums at one (a,b,c,d), returning the same mismatch or overflow witness with identical operands.\"\n    },\n    \"associativity_defect_for_pair\": {\n      \"obligation\": \"For fixed (a,b), scan c then d ascending and stop at the first outcome defect.\"\n    },\n    \"first_associativity_defect\": {\n      \"obligation\": \"Scan a then b ascending and ask the pair helper for c,d; this preserves the complete original lexicographic defect ordering.\"\n    },\n    \"reciprocity_defect_for_pair\": {\n      \"obligation\": \"For fixed (a,b), compute the same dual fallbacks once and find the first violating c. No invalid-dual fallback semantics changes.\"\n    },\n    \"first_reciprocity_defect\": {\n      \"obligation\": \"Scan a then b ascending and report the first c witness from the pair helper.\"\n    },\n    \"rational_fusion_matrix\": {\n      \"obligation\": \"Factor the identical checked label lookup, integer fusion matrix and integer-to-rational map into one reusable conversion.\"\n    },\n    \"global_dimension_squared\": {\n      \"obligation\": \"Accumulate the same ordered sum of N_a*N_a_star in exact rational matrices, then call the unchanged characteristic-polynomial and root providers.\"\n    },\n    \"verlinde_value\": {\n      \"obligation\": \"Compute the same x-ordered scalar sum and final d_inverse multiplication for one (a,b,c). Field/scalar dependencies and coefficient conversion assumptions remain unreviewed at the full ring level.\"\n    },\n    \"collect_verlinde_pair\": {\n      \"obligation\": \"For fixed (a,b), scan c ascending, compute each full scalar value before checked coefficient embedding and append the same mismatch witnesses into the existing output vector.\"\n    },\n    \"verlinde_defects\": {\n      \"obligation\": \"Preserve shape, d_inverse and first-row inverse admission order, then scan a,b and delegate c to the pair helper. No per-pair output vector allocation.\"\n    },\n    \"fill_su2_product\": {\n      \"obligation\": \"For admitted k/rank/i/j, fill the same low..high labels of correct parity in the existing row-major slice; no intermediate allocation.\"\n    }\n  },\n  \"invariants\": [\n    \"For rank r in 1..32, r cubed<=32768, so table sizes and flattened indices are bounded before construction. The new guard itself is allocation-free and reaches every convenience path before its allocations. Caller-provided names, multiplicity vectors and arrays already exist and are outside this constructor-owned allocation claim.\",\n    \"For SU2 accepted k<=31 and rank=k+1, all i,j<=k imply i+j<=2*k; direct natural subtraction is exact and all intermediate usize products fit the compiled platform. The pre-admission k+1 has an explicit overflow error instead of a panic or wrap.\"\n  ],\n  \"failure_paths\": {\n    \"rank\": \"Reject invalid rank before owned name/flat allocation.\",\n    \"level\": \"checked_add failure is typed Overflow; zero/excessive levels refuse before allocation.\"\n  },\n  \"trust_boundary\": \"Source arithmetic/admission arguments plus scoped native and Lean model checks; compiler, exact arithmetic libraries, standard allocator and external path dependencies remain TCB. No full Rust refinement or allocator theorem.\",\n  \"assurance_limits\": [\n    \"Only selected ring admission/refactor paths have partial contracts. Full ring law, spectral, provider, cost and mutation review remains pending.\",\n    \"Allocation instrumentation is confined to appended test fixtures and one native test thread. No production global allocator change or formal machine allocation proof is claimed.\",\n    \"Ring has 68 current bodies, all within A structural limits (9/7/3). Complete ring invariant/provider/cost review and critical mutation evidence remain pending; no ring grade is awarded.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/fusion_boundary_review.json\",\n      \"sha256\": \"cd5d328408bd883fd32fc2087fdaca24d0c5599f22e68ce1ed68e0f584530464\"\n    },\n    {\n      \"path\": \"evidence/quality/six_module/checkpoint-007/repair-history.json\",\n      \"sha256\": \"bef8747e9d45d68beedceeb37d519b754c1806dfb98e4930b7558ed2c45b603d\"\n    },\n    {\n      \"path\": \"evidence/quality/six_module/20261020T014925Z-fusion-audit/receipt.json\",\n      \"sha256\": \"f0d0c42c80b5aeeeabe39b523ba06ad7c88e20cafd05422211c6ea4c7fa2b6ea\"\n    },\n    {\n      \"path\": \"evidence/q