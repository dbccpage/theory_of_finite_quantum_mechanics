      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/fusion_ring.rs\",\n    \"sha256\": \"3ca09b760cb523f8c6dbe80779612ebac2fcae907065897df1816838b3748655\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"claim_urn\": \"urn:tfqm:fusion-categories:bounded-based-ring:v2\",\n    \"domain\": \"Ranks 1..32 with shaped nonnegative-u64 coefficients; validated rings additionally satisfy checked-representable associativity sums, both units, unique involutive duals and reciprocity, allowing noncommutativity. Words have length<=16384 and admitted scalar-bit work. Generic Verlinde identities assume lawful exact scalar operations/embedding/conjugation; spectral calls may refuse under pinned provider budgets.\",\n    \"behavior\": [\n      \"Admit exactly 1..=32 before constructor-owned allocation; reject zero/excessive ranks with both actual rank and maximum.\",\n      \"Private bounded-R caller: reserve exactly R cubed entries and preserve row-major plane/row/column order without vector growth. Public array construction admits R first; catalog calls use fixed R=2 or 3.\",\n      \"Consume a borrowed factor list. Require each factor>=2, checked-multiply its prefix order, then require prefix order<=32 before copying moduli. Empty factors give the trivial order-one group. Report the first invalid factor, product overflow or excessive prefix order.\",\n      \"Borrow the private, admitted factor list without mutation.\",\n      \"Return its exact private product, at least one and at most 32.\",\n      \"Accept precisely labels below order, including the empty-product case; reject equality/above before coordinate arithmetic.\",\n      \"Admit the label then repeatedly divide/remainder by each positive modulus, producing least-significant-factor-first digits. Final remainder is zero and every digit is within its factor.\",\n      \"Check exact digit length before checking each digit bound. Encode the weighted sum with prefix-product strides; all prefixes and the final label fit below order<=32.\",\n      \"Admit a then b, stream their admitted residues into the same mixed-radix encoding, and perform componentwise modular addition without allocating digit vectors.\",\n      \"Admit the label and stream modular negatives into the encoding, using (m-digit)%m so zero remains zero, with no heap allocation.\",\n      \"Admit rank before generating default names, then delegate shape/name validation. Default name strings label indices; they are metadata, not mathematical identifiers.\",\n      \"Admit rank, then exactly rank cubed coefficients, then exactly rank names. Own the shaped nonnegative-u64 tensor and arbitrary strings privately; this raw table constructor does not assert fusion laws or uniqueness/nonemptiness of name strings.\",\n      \"Admit const R before flattening the caller-owned array. Use the exact-capacity row-major helper, then the ordinary constructor.\",\n      \"Return the immutable admitted tensor rank.\",\n      \"Return shared read-only metadata; numerical labels determine all algebra.\",\n      \"Admit label<rank; return the exact label or a typed Label error.\",\n      \"Private bounded-label lookup computes (a*r+b)*r+c. Production callers prove a,b,c<r; flattened index<r cubed<=32768. The zero get fallback is defensive, not validation of arbitrary oversized indices.\",\n      \"Admit a then b then c at the public boundary and return the exact u64 coefficient.\",\n      \"Private bounded-r loop: convert both u64 factors to u128, checked-multiply and checked-add. Individual products fit u128; aggregate overflow refuses rather than wraps.\",\n      \"For fixed bounded a, find the unique b with nonzero unit coefficient, requiring coefficient exactly one. Reject a on multiple hits, coefficient>1 or no hit.\",\n      \"Collect candidate duals in a order, then require dual(dual(a))=a for every a. All collected labels are below rank. Return the first offending a.\",\n      \"Check both left and right unit-zero laws against delta(c,label), scanning labels then c; report the first bad label.\",\n      \"Scan left<right in order and report the first pair with any unequal outcome coefficient. This optional test is not imposed by FusionRing::try_new.\",\n      \"At one bounded (a,b,c,d), compute both exact checked-u128 convolution sums. Return the two actual unequal values or an Overflow diagnostic; return None only for two successful equal sums.\",\n      \"For fixed a,b, scan c then d ascending and preserve the first exact mismatch/overflow witness.\",\n      \"Scan a then b and delegate c,d; helper factoring preserves the full original lexicographic witness order.\",\n      \"Map the first failed dual candidate/involution to a Duality defect without changing the label.\",\n      \"Private in-range candidate-dual entries, with missing entries falling back to their original labels: find first c violating either Frobenius coefficient equality. Production passes the complete admitted dual list.\",\n      \"Scan a,b ascending and report the first c reciprocity witness. Internal caller establishes bounded candidate dual entries.\",\n      \"Check unit, optional commutativity, then associativity/overflow, duality and reciprocity in that exact priority order.\",\n      \"Check unit and all remaining based-ring laws without requiring commutativity. Noncommutative finite group rings are intentionally admitted.\",\n      \"Check associativity/overflow first, duality next, then reciprocity with recomputed admitted duals. No failed law yields a successful certificate.\",\n      \"Clone this borrowed raw table into the owned validated-ring constructor. The owned table copy is required by the returned Ring API; failure leaves the borrowed input unchanged.\",\n      \"Admit label first, then copies<=16384, then conservative scalar-bit work. Only then compute exact right-fusion counts from the unit via the repeated label, including zero copies.\",\n      \"Compute the same admitted exact counts, then checked-narrow every entry. Refuse any count outside u64 and discard partial converted output.\",\n      \"Create exactly rank BigUint counts with one in slot zero and zeros elsewhere; this is the empty-word state.\",\n      \"For one admitted label compute D=max_a sum_c N(a,w,c) in u128. Return zero for D<=1, otherwise ceil(log2 D) using leading zeros of D-1. D<=32*(2^64-1)<2^69.\",\n      \"Private bounded-length, prevalidated labels only. Keep a fixed stack cache of label growths. Charge r squared*(prefix_bits+64) per step, reject at the first cumulative charge>2^32, and advance prefix_bits by that label growth. Equality is admitted. This conservative scalar-bit envelope is not a CPU-cycle or heap-byte bound.\",\n      \"Private rank-length disjoint count/output buffers and admitted w: clear the output, skip zero counts and zero coefficients, and sum count[a]*N(a,w,c) exactly using scalar-u64 multiplication. No coefficient BigUint copies or output-vector allocation occurs here.\",\n      \"Private previously admitted iterator: start at the unit, allocate the second rank-length buffer only if a step exists, clear/fill then swap buffers. Preserve right-multiplication word order; return owned final counts without cloning.\",\n      \"Return the literal rank-three, 27-entry Ising tensor and three fixed names. Literal dimensions satisfy the raw-table representation invariant; validated-ring construction is separate.\",\n      \"Own a raw shaped table, reject its first noncommutative-allowing law/overflow defect, then store its admitted involutive dual list privately. Success certifies a bounded based ring, not categorical realizability.\",\n      \"Return the certified carrier rank.\",\n      \"Borrow its owned label-name metadata.\",\n      \"Return the designated numeric unit label zero.\",\n      \"Borrow the raw table read-only; callers cannot mutate the certified representation.\",\n      \"Admit the public label and return its stored in-range dual; preserve typed defensive missing-entry failure.\",\n      \"Delegate the three-label admission and exact coefficient access.\",\n      \"Crate-only bounded-label coefficient access for validated consumer loops. This fast path does not admit arbitrary raw labels; consumers must establish all three bounds.\",\n      \"Admit a then b and return each c with positive coefficient, once in ascending order. This is support, not an expanded multiplicity list.\",\n      \"Report whether every tensor pair commutes, without changing the noncommutative Ring type invariant.\",\n      \"Return true exactly when every nonnegative coefficient is at most one.\",\n      \"Return true exactly when every product has total coefficient one. checked-u64 row-sum overflow makes the result false, never a spurious one.\",\n      \"Compute the admitted word counts first, then admit target, preserving word-error-before-target priority. Move the selected BigUint out of the owned count vector without cloning. Invalid target may follow bounded valid-word computation.\",\n      \"Reject word length>16384 before inspecting labels; validate every label before work admission and BigUint allocation; then compute the exact counts with two reusable buffers.\",\n      \"Admit a, then return integer matrix rows b/columns c with entries N(a,b,c); no truncating scalar representation.\",\n      \"Admit a before allocation; construct the same row-major entries directly as exact rationals through a bounded flat BasicMatrix builder. Avoid a temporary integer matrix and nested conversion vectors.\",\n      \"Require each provider rational coefficient to be integral before conversion to BigInt; reject an unexpected fractional coefficient with a typed Polynomial error instead of truncating it.\",\n      \"Build the exact integral fusion matrix in rational representation, obtain its monic characteristic polynomial from the pinned provider, and pass all coefficients through the integrality gate. Coefficients are returned constant-first.\",\n      \"Return the provider-certified largest real root of the integral nonnegative fusion matrix characteristic polynomial, or propagate its explicit algebraic budget/domain error. Perron-Frobenius identifies this root as the FP dimension; success is not promised beyond provider budgets.\",\n      \"Form the exact ordered sum over a of N_a*N_dual(a), obtain its checked integral characteristic polynomial, and return its largest real root or provider error. The based-ring positive character identifies it with sum of squared FP dimensions; no fusion category or physical authority follows.\",\n      \"For a lawful exact FusionScalar with compatible integer embedding/conjugation, reject wrong S shape before inversions, then invert d_squared and each first-row entry in order. Scan a,b,c lexicographically, collecting precisely unequal field identities; do not claim that S is itself modular/unitary.\",\n      \"For one admitted triple and rank-length weights, sum in x order S[a,x]*S[b,x]*conjugate(S[c,x])/S[0,x], then multiply by d_squared inverse. Preserve typed matrix errors; field operations are the declared lawful-scalar TCB.\",\n      \"Scan c in order, compute the formula value, then checked-convert the u64 coefficient to i64 for field embedding. On overflow return the exact embedding error and expose no partial defects; otherwise append each mismatch.\",\n      \"Construct the admitted cyclic pointed ring for n=2..32; zero/one or excessive n refuse through group admission before naming. The trivial group is available through empty moduli.\",\n      \"Admit the mixed-radix abelian group, allocate its bounded tensor and fill one product outcome using allocation-free group addition. Default or caller-supplied names are checked by the table constructor; validate all based-ring laws before return.\",\n      \"Validate the literal Ising table through the ordinary certified constructor.\",\n      \"Construct and validate the literal rank-two tensor with tau squared=1+tau and the two metadata names. No approximate golden ratio is used.\",\n      \"Return the named pointed Z2 fusion ring; braiding/spin data are outside this file.\",\n      \"Return the named pointed Z2-by-Z2 fusion ring only.\",\n      \"Return the same Z2-by-Z2 fusion multiplicities with different metadata names; no fermion statistics or braiding is certified here.\",\n      \"checked_add k+1 first, reject k=0 or rank>32 before allocation, then fill all bounded SU2 triangle/parity products, attach names and validate the complete based ring. Admitted levels are 1..31, with typed Overflow at usize::MAX.\",\n      \"Private admitted k/rank/i/j: set exactly labels from abs(i-j) to min(i+j,2k-i-j) of even i+j+l parity. i+j<=2k makes subtraction exact; bounded labels make flattened slots valid.\",\n      \"Construct and validate the fixed representation-ring tensor with unit, sign and standard labels; this is the commutative representation ring, distinct from the noncommutative S3 group-ring challenge.\"\n    ],\n    \"capability\": \"L4 bounded based-ring algorithms and invariant-bearing API; no categorical realizability or physical authority.\"\n  },\n  \"operations\": {\n    \"module::admit_rank\": {\n      \"line\": 18,\n      \"signature\": \"fn admit_rank(rank: usize) -> Result<(), FusionError>\",\n      \"obligation\": \"Admit exactly 1..=32 before constructor-owned allocation; reject zero/excessive ranks with both actual rank and maximum.\"\n    },\n    \"module::flatten_multiplicities\": {\n      \"line\": 29,\n      \"signature\": \"fn flatten_multiplicities<const R: usize>(n: &[[[u64; R]; R]; R]) -> Vec<u64>\",\n      \"obligation\": \"Private bounded-R caller: reserve exactly R cubed entries and preserve row-major plane/row/column order without vector growth. Public array construction admits R first; catalog calls use fixed R=2 or 3.\"\n    },\n    \"AbelianGroup::new\": {\n      \"line\": 69,\n      \"signature\": \"pub fn new(moduli: &[usize]) -> Result<Self, FusionError>\",\n      \"obligation\": \"Consume a borrowed factor list. Require each factor>=2, checked-multiply its prefix order, then require prefix order<=32 before copying moduli. Empty factors give the trivial order-one group. Report the first invalid factor, product overflow or excessive prefix order.\"\n    },\n    \"AbelianGroup::moduli\": {\n      \"line\": 94,\n      \"signature\": \"pub fn moduli(&self) -> &[usize]\",\n      \"obligation\": \"Borrow the private, admitted factor list without mutation.\"\n    },\n    \"AbelianGroup::order\": {\n      \"line\": 98,\n      \"signature\": \"pub fn order(&self) -> usize\",\n      \"obligation\": \"Return its exact private product, at least one and at most 32.\"\n    },\n    \"AbelianGroup::check_label\": {\n      \"line\": 102,\n      \"signature\": \"fn check_label(&self, label: usize) -> Result<(), FusionError>\",\n      \"obligation\": \"Accept precisely labels below order, including the empty-product case; reject equality/above before coordinate arithmetic.\"\n    },\n    \"AbelianGroup::digits\": {\n      \"line\": 112,\n      \"signature\": \"pub fn digits(&self, label: usize) -> Result<Vec<usize>, FusionError>\",\n      \"obligation\": \"Admit the label then repeatedly divide/remainder by each positive modulus, producing least-significant-factor-first digits. Final remainder is zero and every digit is within its factor.\"\n    },\n    \"AbelianGroup::label\": {\n      \"line\": 126,\n      \"signature\": \"pub fn label(&self, digits: &[usize]) -> Result<usize, FusionError>\",\n      \"obligation\": \"Check exact digit length before checking each digit bound. Encode the weighted sum with prefix-product strides; all prefixes and the final label fit below order<=32.\"\n    },\n    \"AbelianGroup::add\": {\n      \"