, construct its fixed gauge F blocks; invert sqrt(2) once and propagate inversion or symbol-shape refusal. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::ising_r\": \"Construct the fixed Ising R values from roots with exponents -1,3,4 of order16 and -1; propagate missing-field and symbol errors. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::fibonacci\": \"Build the rank-two Fibonacci recipe using the admitted golden ratio and tenth roots; propagate all provider admissions. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::fibonacci_f\": \"For the admitted Fibonacci ring and golden ratio phi, use phi-1 and its negative in the fixed gauge block; no claim of a unitary gauge conversion. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::fibonacci_r\": \"Set the two nontrivial Fibonacci R channels to tenth roots with exponents -4 and3; propagate missing-field and symbol errors. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::semion\": \"Build rank-two semion with the nontrivial -1 associator and i braiding; require the field and ordinary category/ribbon checks. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::pointed_braided\": \"Admit group factors/product, square exponent shape and names; reduce signed coefficients before requesting only the required root subgroup, then build the bilinear R values and unit dimensions through ordinary category/ribbon checks. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::check_exponent_shape\": \"Require exactly factors rows and factors columns per row; rows refuse first, then the first ragged row reports its actual column count. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::gcd\": \"Infallible private helper under its explicitly admitted size/shape/matching-digit preconditions; no public malformed-plan admission is claimed.\",\n    \"module::reduced_coefficient\": \"Infallible private helper under its explicitly admitted size/shape/matching-digit preconditions; no public malformed-plan admission is claimed.\",\n    \"PhasePlan::new\": \"Infallible private helper under its explicitly admitted size/shape/matching-digit preconditions; no public malformed-plan admission is claimed.\",\n    \"PhasePlan::exponent\": \"Infallible private helper under its explicitly admitted size/shape/matching-digit preconditions; no public malformed-plan admission is claimed.\",\n    \"module::phase_roots\": \"Private order1..32: admit an exact generator once and generate precisely order powers from one; missing field refuses before symbol construction. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::toric_code\": \"Instantiate the fixed [2,2] upper off-diagonal bicharacter and labels 1,e,m,eps through pointed_braided. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::three_fermion\": \"Instantiate the fixed [2,2] diagonal/upper bicharacter and labels 1,f1,f2,f3 through pointed_braided. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::quantum_double_cyclic\": \"Check usize-to-i64 conversion, require n>=2, then admit [n,n] through the group/rank bounds and the fixed bicharacter. The recipe name does not establish an independent categorical center theorem. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\",\n    \"module::cyclic_pointed\": \"Instantiate a one-factor bicharacter for arbitrary signed k through pointed_braided; n=0/1 and rank>32 refuse; k divisible by n requires only the trivial root subgroup. All lower-provider typed errors propagate; failed owned intermediate state is dropped without returning an admitted ribbon value.\"\n  },\n  \"trust_boundary\": \"Lawful immutable characteristic-zero exact field values, rational embedding, compatible conjugation and root generators; honest optional rational/sign projections. FusionScalar is an open protocol and cannot enforce those laws for arbitrary client implementations. Rust/compiler, pinned thiserror and exact matrix/ring/category/ribbon/scalar providers are explicit dependencies. Logical element/operation counts exclude scalar bit length, comparison/clone cost, allocator metadata and OS memory. No arbitrary client panic or allocator-totality theorem is asserted.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. These are bounded exact construction/checking/computation APIs; no physical authority, publication or whole-workspace verification is inferred.\",\n    \"Lawful immutable characteristic-zero exact field values, rational embedding, compatible conjugation and root generators; honest optional rational/sign projections. FusionScalar is an open protocol and cannot enforce those laws for arbitrary client implementations. Rust/compiler, pinned thiserror and exact matrix/ring/category/ribbon/scalar providers are explicit dependencies. Logical element/operation counts exclude scalar bit length, comparison/clone cost, allocator metadata and OS memory. No arbitr