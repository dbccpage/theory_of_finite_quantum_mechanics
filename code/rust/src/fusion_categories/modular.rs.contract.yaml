    "profile": "Exact",
    "claim_urn": "urn:tfqm:fusion:modular:bounded-exact-data:v1",
    "domain": "Admitted immutable ribbon records with lawful exact scalar value semantics and compatible conjugation/root data. Fresh ModularData has rank1..32 and aligned private carriers. Public methods compute their exact displayed formulas or return typed failures; modular/physical interpretation is conditional as specified, with optional positive global dimension D and any u32 genus.",
    "behavior": [
      "Compute exact S_ab=(theta_a theta_b)^-1 sum_c N(a,b*,c)d_c theta_c from admitted ribbon data, then clone owned inputs and retain D^2 and p+. This constructor alone does not verify modularity.",
      "Private aligned ring/dimension/twist vectors from an admitted ribbon value: cache inverse twists, d*theta and dual labels, then fill the n-by-n balancing matrix; propagate checked inversion, label and matrix errors.",
      "Compute total+m*value: zero moves total, one adds without scalar embedding, larger m must fit i64 before exact embedding or returns Overflow.",
      "Private admitted labels and values length=ring.rank: sum_c N(a,b,c)*values[c] using checked multiplicity conversion.",
      "Build through from_ribbon and call verify before returning; the same public type also has an unchecked-with-respect-to-modularity constructor, so it is not a sealed certificate type.",
      "Borrow the ring rank established by ring admission, at most32.",
      "Borrow the immutable admitted ring; no mutable access is granted.",
      "Borrow the retained immutable dimension vector aligned with ring labels.",
      "Borrow the retained immutable twist vector aligned with ring labels.",
      "Borrow the retained immutable square balancing matrix.",
      "Borrow the exact sum of squared ribbon dimensions.",
      "Borrow the exact positive Gauss sum supplied by ribbon data; no independent positivity assertion.",
      "Return the raw D^2 field element only; this method computes no logarithm or physical entropy.",
      "Return a fresh diagonal matrix of twists, propagating matrix allocation/domain errors.",
      "Return the exact zero-one charge conjugation matrix C_ab=[dual(a)=b].",
      "Private admitted ring: directly construct scale*C without an unscaled intermediate; propagate label/matrix errors.",
      "Construct scale times the rank-dimensional identity directly; propagate matrix errors.",
      "Require equal shapes; then return the first unequal entry in row-major order, or None for equal matrices.",
      "Refuse in fixed order: zero D^2, asymmetry, deficient rank, S^2!=D^2 C, SS^dagger!=D^2 I, (ST)^3!=p+S^2, first Verlinde defect. Success establishes these checks only.",
      "Use first_difference and map the first unequal coordinate to the supplied typed modular defect; propagate shape errors.",
      "Scan the strict upper triangle in lexicographic order, refusing the first asymmetric pair.",
      "Compute exact provider rank and refuse rank<size, carrying actual and expected ranks.",
      "Compute the actual matrix square and compare to D^2 C; return the square for reuse after equality succeeds.",
      "Compute S times its actual conjugate transpose and compare to D^2 I; no plain-transpose substitution.",
      "Construct (ST)_ab=S_ab*theta_b by column scaling without a dense diagonal multiplication.",
      "Form (ST)^3 using two actual matrix products and compare row-major to p+ times the supplied S^2.",
      "Delegate the bounded full defect computation to the admitted ring provider and report its first triple; do not claim a category realization theorem.",
      "Divide p+^2 by D^2, require its advertised root data (n,k), return exact rational4k/n. Physical angle interpretation requires a compatible canonical complex root embedding.",
      "Require supplied D squares to stored D^2, then decide D>0, then divide p+ by D and require root data; return exact8k/n. Wrong square, nonpositive and undecidable sign have distinct priority.",
      "Require label<rank; compute the second indicator sum using cached d_b*theta_b^2 and d_c/theta_c^2; divide by D^2 and admit exactly -1,0,1.",
      "Private aligned retained vectors: precompute (d_b theta_b^2,d_b/theta_b^2), propagating checked division refusal.",
      "Private admitted labels and rank-aligned weights: compute sum_c N(b,c,a)*weights[b].0*weights[c].1, skipping zero coefficients.",
      "Map exact values1,-1,0 to i8; reject every other field value with FrobeniusSchur{label}.",
      "Admit genus exponent before field arithmetic; compute sum_a(D^2/d_a^2)^(g-1), grouping equal squares, and return only an exact nonnegative integer. Nonrational, fractional and negative outputs refuse.",
      "For any u32 genus compute i64(genus)-1, require absolute value<=MAX_SCALAR_EXPONENT, otherwise return Budget before scalar work.",
      "Group exactly equal dimension squares with positive u64 counts, at most rank<=32; replace each square by checked D^2/square without a second ratio buffer."
    ]
  },
