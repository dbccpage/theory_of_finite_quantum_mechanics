      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/error.rs\",\n    \"sha256\": \"67f005d8f3fbb1284b4544c86a952fd6e092251fe6c7ac395f9e12df41efb0e6\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Non-Numeric\",\n    \"claim_urn\": \"urn:tfqm:fusion:typed-diagnostic-routing:v1\",\n    \"domain\": \"All constructible FusionError records and wrapped provider/domain defects. Numeric fields are witnesses supplied by callers, not validated by this enum.\",\n    \"behavior\": [\n      \"Preserve exact provider payload and transparent Display/source delegation.\",\n      \"Preserve exact algebraic provider payload and transparent Display/source delegation.\",\n      \"Preserve exact scalar provider payload and transparent Display/source delegation.\",\n      \"Preserve matrix provider payload, prefix Display with matrix storage, expose matrix as Error::source.\",\n      \"Render every local diagnostic with its actual named fields and nested defect prefix; no fabricated context or lost numeric witness.\",\n      \"Three transparent variants forward their provider source, Matrix returns the wrapped error, and local/domain-defect variants have no source. Nested defects are data payloads, not #[source] chains.\",\n      \"Derived structural value semantics retain the entire discriminant/payload; formatting itself does not assert the reported defect is true.\"\n    ]\n  },\n  \"operations\": {\n    \"RingDefect::from\": {\n      \"line\": 102,\n      \"signature\": \"fn from(defect: RingDefect) -> Self\",\n      \"obligation\": \"Wrap the owned RingDefect in its matching FusionError variant without altering or discarding payload. No validation, arithmetic or allocation is introduced.\"\n    },\n    \"CategoryDefect::from\": {\n      \"line\": 108,\n      \"signature\": \"fn from(defect: CategoryDefect