c witness.\",\n      \"origin\": \"derive(Debug,Clone,PartialEq,Eq,thiserror::Error) and field attributes\"\n    },\n    \"Error::source\": {\n      \"obligation\": \"Three transparent variants forward their provider source, Matrix returns the wrapped error, and local/domain-defect variants have no source. Nested defects are data payloads, not #[source] chains.\",\n      \"origin\": \"derive(Debug,Clone,PartialEq,Eq,thiserror::Error) and field attributes\"\n    },\n    \"Clone/PartialEq/Eq/Debug\": {\n      \"obligation\": \"Derived structural value semantics retain the entire discriminant/payload; formatting itself does not assert the reported defect is true.\",\n      \"origin\": \"derive(Debug,Clone,PartialEq,Eq,thiserror::Error) and field attributes\"\n    }\n  },\n  \"invariants\": [\n    \"Each explicit From body is exactly one matching enum constructor, retaining its entire owned defect. Rust enum constructors preserve fields and discriminate wrappers; no arithmetic, narrowing, search or exception suppression occurs.\",\n    \"All thiserror attributes were read against all 23 variants: three transparent provider wrappers, four prefixed domain wrappers, one matrix #[from] source wrapper and 15 local field-bearing diagnostics. Native challenges instantiate all variants, all eight From conversions, field-rich payloads, maximum-u128 display, clone/equality and explicit source behavior.\",\n    \"Direct conversions are constant work and allocate nothing; Display/Clone delegate payload-dependent work. Arbitrary string length and provider formatting/clone costs are outside an allocator or runtime guarantee. The enum is forgeable data and never treated as a mathematical certificate.\"\n  ],\n  \"failure_paths\": {\n    \"RingDefect::from\": \"Wrap the owned RingDefect in its matching FusionError variant without altering or discarding payload. No validation, arithmetic or allocation is introduced.\",\n    \"CategoryDefect::from\": \"Wrap the owned CategoryDefect in it