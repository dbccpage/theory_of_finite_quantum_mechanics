      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/fusion_categories/braid_group.rs\",\n    \"sha256\": \"a712d750b7701b6358632d1617310c75ccc60f18a6c5a5af38109297ba50efc6\",\n    \"language\": \"Rust\"\n  },\n  \"status\": \"source_reviewed\",\n  \"formal_specification\": {\n    \"profile\": \"Exact\",\n    \"claim_urn\": \"urn:tfqm:fusion:braid_group:bounded-exact-actions:v1\",\n    \"domain\": \"Finite lists of exact square matrices over a lawful field, positive common closure dimension and compatible immutable Hash/Eq. Ordinary closure is in GL(n,K); projective closure is modulo nonzero scalar factors. Explicit bound and OperationLimits may conservatively refuse. Empty relation input is vacuously valid, but closure requires generators.\",\n    \"behavior\": [\n      \"Admit requested<=limit, including equality and zero; otherwise return Budget preserving what, requested and limit without saturation or truncation.\",\n      \"Checked u128 product with empty product one; report Overflow at the first overflowing multiplication, never wrap.\",\n      \"Delegate the entire ordered defect enumeration to the declared default limits.\",\n      \"Determine n from the first generator (zero for empty input), validate all shapes before cost admission, admit aggregate storage/work, then list all singular defects followed by adjacent/far defects in original i-major order. Empty input returns no defects; 0x0 generators are singular.\",\n      \"Find the first generator not shaped (n,n) and return Shape with expected shape and the actual bad shape. Empty input passes; this private helper does not assert n>0.\",\n      \"Checked aggregate generator storage g*n^2 before work estimation. Charge 2*(g*(g-1)+4*max(g-1,0))*n^3+3*g*n^3+g*n*(n+1), with the g-1 factors explicitly zero-clamped as combinatorial empty-pair counts. This conservative scalar-operation model may refuse before rank/multiplication. Shaped native inputs and the first admitted storage bound prove the remaining small u128 factors safe.\",\n      \"Append Singular{i} in input order when n=0 or the exact pinned elimination rank is below n; propagate provider failures and preserve prior defect vector ordering.\",\n      \"Private i<generators.len() and common admitted square shape: append the adjacent braid failure at i, then far failures (i,j) in ascending j>=i+2. Never reorder multiplication or swap defect witnesses.\",\n      \"Under admitted compatible shapes, compute (a*b)*a with checked exact provider multiplication and the same per-operation limits.\",\n      \"Borrow any shaped matrix. Return None exactly for the all-zero matrix; otherwise take the first row-major nonzero entry lambda and return (lambda^-1*m,lambda). Delegate inverse/scale failures. Reconstruction is m=lambda*normal; this function allocates its necessary owned returned matrix.\",\n      \"Return None for shape mismatch, either zero matrix, or unequal canonical normal forms. Otherwise return lb/la, the oriented factor satisfying b=(lb/la)*a; inversion/division failures remain typed.\",\n      \"Read the immutable number of distinct retained elements/classes.\",\n      \"Borrow the immutable discovery-order elements. No public mutable field or view can invalidate shape/index/closure invariants.\",\n      \"Read whether stored representatives are canonical projective classes.\",\n      \"Refuse mismatching shape as false before scalar work. In ordinary mode query the borrowed row-major slice directly, with no matrix clone/allocation. In projective mode canonicalize nonzero input and query its class; zero returns false and provider errors propagate.\",\n      \"Return Some(number of elements) only for Finite; ExceedsBound returns None and never asserts infinitude.\",\n      \"Delegate bounded ordinary/projective forward closure to default operation limits, without preallocating by the requested bound.\",\n      \"Admit nonempty common positive square shape, generator storage/work and invertibility before the zero-bound outcome. For bound>0 seed canonical identity and explore right-products in BFS discovery order. A new candidate at full bound yields ExceedsBound; a completed frontier yields Finite. Budget/provider failure discards partial state rather than exposing a finite certificate.\",\n      \"Reject missing generators with ListLength; reject zero/non-square first shape with NotSquare; reject first incompatible sibling with Shape carrying its actual shape; return common positive dimension.\",\n      \"Admit g*n^2 generator slots and g*n*(2*n^2+n+1) conservative rank work before exact rank tests. Reject the first singular generator before any bound=0 result; no group storage is allocated here.\",\n      \"Own a product matrix. Ordinary mode moves it unchanged. Projective mode refuses an unexpected all-zero product, computes one inverse of its first nonzero entry, and scales each original coordinate in place using safe matrix set. A nonzero coordinate implies cols>0; row-major loop indices stay in shape. No second dense buffer or matrix clone is allocated; errors drop the owned partial matrix.\",\n      \"Private admitted n>0: charge four*n^2 logical scalar slots (two retained arrays and a conservative two-buffer scratch allowance), allocate identity once, clone only the required hash key, and move identity into elements. Identity is already projectively canonical and is not normalized again.\",\n      \"Private admitted compatible canonical h: return true if key already exists; if new and elements.len()>=bound return false before inserting. Otherwise clone exactly one key into the hash set and move h into the ordered vector. The caller has already charged retained/scratch slots.\",\n      \"Private current<elements.len(), matching admitted generators, immutable scalar hashes: for each generator charge 2*(states+1)*n^2 retained-plus-scratch slots, then checked-add 2*n^3 plus projective (n^2+1) scalar work. Multiply the borrowed current element on the right, normalize its owned result in place and record a new element/class; stop on first excess-bound candidate or typed failure.\"\n    ]\n  },\n  \"operations\": {\n    \"module::charge\": {\n      \"line\": 15,\n      \"signature\": \"fn charge(what: &'static str, requested: u128, limit: usize) -> Result<(), FusionError>\",\n      \"obligation\": \"Admit requested<=limit, including equality and zero; otherwise return Budget preserving what, requested and limit without saturation or truncation.\"\n    },\n    \"module::product\": {\n      \"line\": 26,\n      \"signature\": \"fn product(factors: &[u128]) -> Result<u128, FusionError>\",\n      \"obligation\": \"Checked u128 product with empty product one; report Overflow at the first overflowing multiplication, never wrap.\"\n    },\n    \"module::braid_relation_defects\": {\n      \"line\": 41,\n      \"signature\": \"pub fn braid_relation_defects<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n) -> Result<Vec<BraidRelationDefect>, FusionError>\",\n      \"obligation\": \"Delegate the entire ordered defect enumeration to the declared default limits.\"\n    },\n    \"module::braid_relation_defects_with_limits\": {\n      \"line\": 47,\n      \"signature\": \"pub fn braid_relation_defects_with_limits<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n    limits: OperationLimits,\\n) -> Result<Vec<BraidRelationDefect>, FusionError>\",\n      \"obligation\": \"Determine n from the first generator (zero for empty input), validate all shapes before cost admission, admit aggregate storage/work, then list all singular defects followed by adjacent/far defects in original i-major order. Empty input returns no defects; 0x0 generators are singular.\"\n    },\n    \"module::check_generator_shapes\": {\n      \"line\": 66,\n      \"signature\": \"fn check_generator_shapes<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n    n: usize,\\n    operation: &'static str,\\n) -> Result<(), FusionError>\",\n      \"obligation\": \"Find the first generator not shaped (n,n) and return Shape with expected shape and the actual bad shape. Empty input passes; this private helper does not assert n>0.\"\n    },\n    \"module::relation_admission\": {\n      \"line\": 81,\n      \"signature\": \"fn relation_admission(\\n    generators: usize,\\n    n: usize,\\n    limits: OperationLimits,\\n) -> Result<(), FusionError>\",\n      \"obligation\": \"Checked aggregate generator storage g*n^2 before work estimation. Charge 2*(g*(g-1)+4*max(g-1,0))*n^3+3*g*n^3+g*n*(n+1), with the g-1 factors explicitly zero-clamped as combinatorial empty-pair counts. This conservative scalar-operation model may refuse before rank/multiplication. Shaped native inputs and the first admitted storage bound prove the remaining small u128 factors safe.\"\n    },\n    \"module::singular_defects\": {\n      \"line\": 108,\n      \"signature\": \"fn singular_defects<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n    n: usize,\\n    limits: OperationLimits,\\n    defects: &mut Vec<BraidRelationDefect>,\\n) -> Result<(), FusionError>\",\n      \"obligation\": \"Append Singular{i} in input order when n=0 or the exact pinned elimination rank is below n; propagate provider failures and preserve prior defect vector ordering.\"\n    },\n    \"module::pair_defects\": {\n      \"line\": 122,\n      \"signature\": \"fn pair_defects<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n    i: usize,\\n    limits: OperationLimits,\\n    defects: &mut Vec<BraidRelationDefect>,\\n) -> Result<(), FusionError>\",\n      \"obligation\": \"Private i<generators.len() and common admitted square shape: append the adjacent braid failure at i, then far failures (i,j) in ascending j>=i+2. Never reorder multiplication or swap defect witnesses.\"\n    },\n    \"module::braid_triple\": {\n      \"line\": 147,\n      \"signature\": \"fn braid_triple<K: FusionScalar>(\\n    a: &BasicMatrix<K>,\\n    b: &BasicMatrix<K>,\\n    limits: OperationLimits,\\n) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Under admitted compatible shapes, compute (a*b)*a with checked exact provider multiplication and the same per-operation limits.\"\n    },\n    \"module::projective_normal_form\": {\n      \"line\": 156,\n      \"signature\": \"pub fn projective_normal_form<K: FusionScalar>(\\n    m: &BasicMatrix<K>,\\n) -> Result<Option<(BasicMatrix<K>, K)>, FusionError>\",\n      \"obligation\": \"Borrow any shaped matrix. Return None exactly for the all-zero matrix; otherwise take the first row-major nonzero entry lambda and return (lambda^-1*m,lambda). Delegate inverse/scale failures. Reconstruction is m=lambda*normal; this function allocates its necessary owned returned matrix.\"\n    },\n    \"module::equal_up_to_scalar\": {\n      \"line\": 170,\n      \"signature\": \"pub fn equal_up_to_scalar<K: FusionScalar>(\\n    a: &BasicMatrix<K>,\\n    b: &BasicMatrix<K>,\\n) -> Result<Option<K>, FusionError>\",\n      \"obligation\": \"Return None for shape mismatch, either zero matrix, or unequal canonical normal forms. Otherwise return lb/la, the oriented factor satisfying b=(lb/la)*a; inversion/division failures remain typed.\"\n    },\n    \"FiniteMatrixGroup::order\": {\n      \"line\": 200,\n      \"signature\": \"pub fn order(&self) -> usize\",\n      \"obligation\": \"Read the immutable number of distinct retained elements/classes.\"\n    },\n    \"FiniteMatrixGroup::elements\": {\n      \"line\": 204,\n      \"signature\": \"pub fn elements(&self) -> &[BasicMatrix<K>]\",\n      \"obligation\": \"Borrow the immutable discovery-order elements. No public mutable field or view can invalidate shape/index/closure invariants.\"\n    },\n    \"FiniteMatrixGroup::is_projective\": {\n      \"line\": 208,\n      \"signature\": \"pub fn is_projective(&self) -> bool\",\n      \"obligation\": \"Read whether stored representatives are canonical projective classes.\"\n    },\n    \"FiniteMatrixGroup::contains\": {\n      \"line\": 212,\n      \"signature\": \"pub fn contains(&self, m: &BasicMatrix<K>) -> Result<bool, FusionError>\",\n      \"obligation\": \"Refuse mismatching shape as false before scalar work. In ordinary mode query the borrowed row-major slice directly, with no matrix clone/allocation. In projective mode canonicalize nonzero input and query its class; zero returns false and provider errors propagate.\"\n    },\n    \"ClosureOutcome::order\": {\n      \"line\": 236,\n      \"signature\": \"pub fn order(&self) -> Option<usize>\",\n      \"obligation\": \"Return Some(number of elements) only for Finite; ExceedsBound returns None and never asserts infinitude.\"\n    },\n    \"module::group_closure\": {\n      \"line\": 244,\n      \"signature\": \"pub fn group_closure<K: FusionScalar + Hash + Eq>(\\n    generators: &[BasicMatrix<K>],\\n    bound: usize,\\n    projective: bool,\\n) -> Result<ClosureOutcome<K>, FusionError>\",\n      \"obligation\": \"Delegate bounded ordinary/projective forward closure to default operation limits, without preallocating by the requested bound.\"\n    },\n    \"module::group_closure_with_limits\": {\n      \"line\": 252,\n      \"signature\": \"pub fn group_closure_with_limits<K: FusionScalar + Hash + Eq>(\\n    generators: &[BasicMatrix<K>],\\n    bound: usize,\\n    projective: bool,\\n    limits: OperationLimits,\\n) -> Result<ClosureOutcome<K>, FusionError>\",\n      \"obligation\": \"Admit nonempty common positive square shape, generator storage/work and invertibility before the zero-bound outcome. For bound>0 seed canonical identity and explore right-products in BFS discovery order. A new candidate at full bound yields ExceedsBound; a completed frontier yields Finite. Budget/provider failure discards partial state rather than exposing a finite certificate.\"\n    },\n    \"module::closure_dimension\": {\n      \"line\": 275,\n      \"signature\": \"fn closure_dimension<K: FusionScalar>(generators: &[BasicMatrix<K>]) -> Result<usize, FusionError>\",\n      \"obligation\": \"Reject missing generators with ListLength; reject zero/non-square first shape with NotSquare; reject first incompatible sibling with Shape carrying its actual shape; return common positive dimension.\"\n    },\n    \"module::closure_admission\": {\n      \"line\": 295,\n      \"signature\": \"fn closure_admission<K: FusionScalar>(\\n    generators: &[BasicMatrix<K>],\\n    n: usize,\\n    limits: OperationLimits,\\n) -> Result<u128, FusionError>\",\n      \"obligation\": \"Admit g*n^2 generator slots and g*n*(2*n^2+n+1) conservative rank work before exact rank tests. Reject the first singular generator before any bound=0 result; no group storage is allocated here.\"\n    },\n    \"module::normalized\": {\n      \"line\": 319,\n      \"signature\": \"fn normalized<K: FusionScalar>(\\n    mut m: BasicMatrix<K>,\\n    projective: bool,\\n) -> Result<BasicMatrix<K>, FusionError>\",\n      \"obligation\": \"Own a product matrix. Ordinary mode moves it unchanged. Projective mode refuses an unexpected all-zero product, computes one inverse of its first nonzero entry, and scales each original coordinate in place using safe matrix set. A nonzero coordinate implies cols>0; row-major loop indices stay in shape. No second dense buffer or matrix clone is allocated; errors drop the owned partial matrix.\"\n    },\n    \"module::initial_group\": {\n      \"line\": 343,\n      \"signature\": \"fn initial_group<K: FusionScalar + Hash + Eq>(\\n    n: usize,\\n    projective: bool,\\n    limits: OperationLimits,\\n) -> Result<FiniteMatrixGroup<K>, FusionError>\",\n      \"obligation\": \"Private admitted n>0: charge four*n^2 logical scalar slots (two retained arrays and a conservative two-buffer scratch allowance), allocate identity once, clone only the required hash key, and move identity into elements. Identity is already projectively canonical and is not normalized again.\"\n    },\n    \"module::record_element\": {\n      \"line\": 366,\n      \"signature\": \"fn record_element<K: FusionScalar + Hash + Eq>(\\n    group: &mut FiniteMatrixGroup<K>,\\n    h: BasicMatrix<K>,\\n    bound: usize,\\n) -> bool\",\n      \"obligation\": \"Private admitted compatible canonical h: return true if key already exists; if new and elements.len()>=bound return false before inserting. Otherwise clone exactly one key into the hash set and move h into the ordered vector. The caller has already charged retained/scratch slots.\"\n    },\n    \"module::expand_closure\": {\n      \"line\": 382,\n      \"signature\": \"fn expand_closure<K: FusionScalar + Hash + Eq>(\\n    group: &mut FiniteMatrixGroup<K>,\\n    current: usize,\\n    generators: &[BasicMatrix<K>],\\n    bound: usize,\\n    limits: OperationLimits,\\n    work: &mut u128,\\n) -> Result<bool, FusionError>\",\n      \"obligation\": \"Private current<elements.len(), matching admitted generators, immutable scalar hashes: for each generator charge 2*(states+1)*n^2 retained-plus-scratch slots, then checked-add 2*n^3 plus projective (n^2+1) scalar work. Multiply the borrowed current element on the right, normalize its owned result in place and record a new element/class; stop on first excess-bound candidate or typed failure.\"\n    },\n    \"FiniteMatrixGroup::Clone\": {\n      \"obligation\": \"Clone both private ordered elements and hash keys without changing their matching invariant. Cost depends on retained states and scalar payloads.\",\n      \"origin\": \"derive(Clone,Debug)\"\n    },\n    \"BraidRelationDefect data\": {\n      \"obligation\": \"Copy/clone/equality preserve each literal defect witness. Public defect data does not prove that the defect actually holds.\",\n      \"origin\": \"derive(Debug,Clone,Copy,PartialEq,Eq)\"\n    },\n    \"ClosureOutcome::Clone\": {\n      \"obligation\": \"Clone the same result variant and owned finite group or bound; an ExceedsBound record alone is not an infinitude certificate.\",\n      \"origin\": \"derive(Debug,Clone)\"\n    }\n  },\n  \"invariants\": [\n    \"Shape and numeric invariant: public relation checks validate the first mismatching square shape before cost arithmetic; closure separately rejects empty input and zero/non-square first carrier before sibling mismatch. For n>0, admitted g*n^2<=usize::MAX and g>=1 bound n^2<=usize::MAX and g*n*(n+1)<=2*usize::MAX. For n=0, all dimension products vanish. Checked aggregate products/additions and these bounds protect the remaining widened factors on the content-bound 64-bit target.\",\n    \"Finite carrier invariant: elements starts with identity and index with its exact row-major key; both are private. Every new key is absent before insertion, then exactly one owned element and one owned key are added together. Their order is deterministic BFS discovery order. A cursor explores every generator right-product for every retained element, including elements appended by earlier exploration; completion therefore yields the smallest right-generator-closed set containing identity.\",\n    \"Group interpretation: native admitted generators are invertible by the pinned exact rank solver. Every state is a word in them and every generator right-product lies in the completed finite set. The Lean word/minimality and finite-submonoid inverse theorems establish why complete finite forward closure is a group even when the ambient group is infinite. GL(n,K) construction and Rust-to-model refinement remain explicit source reasoning; no inversion table is required.\",\n    \"Projective invariant: the first nonzero coefficient chooses a unique representative with that coefficient one. Exact division proves reconstruction and invariance under any nonzero scalar factor. Compatible commutative field multiplication respects these classes, so closure models the subgroup of projective GL generated by the inputs. The quotient-group representation is a source argument; Lean proves coordinate normalization, not a complete PGL construction. All-zero products cannot occur for lawful invertible inputs; the defensive path is a typed Inconsistent error.\",\n    \"Ownership/cost invariant: no bound-sized preallocation occurs. The owned element vector doubles as the FIFO frontier, so no second matrix queue or popped matrix clone exists. Ordinary membership uses a borrowed slice. Projective products are scaled in place with one fixed inverse, and identity is already canonical. Only a new state needs its owned hash-key copy. The declared 2*(states+1)*n^2 envelope conservatively covers two retained arrays per state plus transient candidate/new-key headroom; the earlier two-scratch allowance is an upper bound, not a claim that in-place normalization still allocates a second matrix. Scalar work charges exact named conservative formulas, not wall-clock or bit complexity.\",\n    \"Refusal invariant: rank/storage/work errors expose no partial Finite group. A newly distinct state at full bound yields ExceedsBound; a zero bound is exceeded by the mathematical identity after generator admission. ExceedsBound says only that this finite bound is exceeded; it does not certify an infinite group. Shape/error priority and conservative storage refusals are intentional public behavior changes.\"\n  ],\n  \"failure_paths\": {\n    \"module::charge\": \"Admit requested<=limit, including equality and zero; otherwise return Budget preserving what, requested and limit without saturation or truncation.\",\n    \"module::product\": \"Checked u128 product with empty product one; report Overflow at the first overflowing multiplication, never wrap.\",\n    \"module::braid_relation_defects\": \"Delegate the entire ordered defect enumeration to the declared default limits.\",\n    \"module::braid_relation_defects_with_limits\": \"Determine n from the first generator (zero for empty input), validate all shapes before cost admission, admit aggregate storage/work, then list all singular defects followed by adjacent/far defects in original i-major order. Empty input returns no defects; 0x0 generators are singular.\",\n    \"module::check_generator_shapes\": \"Find the first generator not shaped (n,n) and return Shape with expected shape and the actual bad shape. Empty input passes; this private helper does not assert n>0.\",\n    \"module::relation_admission\": \"Checked aggregate generator storage g*n^2 before work estimation. Charge 2*(g*(g-1)+4*max(g-1,0))*n^3+3*g*n^3+g*n*(n+1), with the g-1 factors explicitly zero-clamped as combinatorial empty-pair counts. This conservative scalar-operation model may refuse before rank/multiplication. Shaped native inputs and the first admitted storage bound prove the remaining small u128 factors safe.\",\n    \"module::singular_defects\": \"Append Singular{i} in input order when n=0 or the exact pinned elimination rank is below n; propagate provider failures and preserve prior defect vector ordering.\",\n    \"module::pair_defects\": \"Private i<generators.len() and common admitted square shape: append the adjacent braid failure at i, then far failures (i,j) in ascending j>=i+2. Never reorder multiplication or swap defect witnesses.\",\n    \"module::braid_triple\": \"Under admitted compatible shapes, compute (a*b)*a with checked exact provider multiplication and the same per-operation limits.\",\n    \"module::projective_normal_form\": \"Borrow any shaped matrix. Return None exactly for the all-zero matrix; otherwise take the first row-major nonzero entry lambda and return (lambda^-1*m,lambda). Delegate inverse/scale failures. Reconstruction is m=lambda*normal; this function allocates its necessary owned returned matrix.\",\n    \"module::equal_up_to_scalar\": \"Return None for shape mismatch, either zero matrix, or unequal canonical normal forms. Otherwise return lb/la, the oriented factor satisfying b=(lb/la)*a; inversion/division failures remain typed.\",\n    \"FiniteMatrixGroup::order\": \"Read the immutable number of distinct retained elements/classes.\",\n    \"FiniteMatrixGroup::elements\": \"Borrow the immutable discovery-order elements. No public mutable field or view can invalidate shape/index/closure invariants.\",\n    \"FiniteMatrixGroup::is_projective\": \"Read whether stored representatives are canonical projective classes.\",\n    \"FiniteMatrixGroup::contains\": \"Refuse mismatching shape as false before scalar work. In ordinary mode query the borrowed row-major slice directly, with no matrix clone/allocation. In projective mode canonicalize nonzero input and query its class; zero returns false and provider errors propagate.\",\n    \"ClosureOutcome::order\": \"Return Some(number of elements) only for Finite; ExceedsBound returns None and never asserts infinitude.\",\n    \"module::group_closure\": \"Delegate bounded ordinary/projective forward closure to default operation limits, without preallocating by the requested bound.\",\n    \"module::group_closure_with_limits\": \"Admit nonempty common positive square shape, generator storage/work and invertibility before the zero-bound outcome. For bound>0 seed canonical identity and explore right-products in BFS discovery order. A new candidate at full bound yields ExceedsBound; a completed frontier yields Finite. Budget/provider failure discards partial state rather than exposing a finite certificate.\",\n    \"module::closure_dimension\": \"Reject missing generators with ListLength; reject zero/non-square first shape with NotSquare; reject first incompatible sibling with Shape carrying its actual shape; return common positive dimension.\",\n    \"module::closure_admission\": \"Admit g*n^2 generator slots and g*n*(2*n^2+n+1) conservative rank work before exact rank tests. Reject the first singular generator before any bound=0 result; no group storage is allocated here.\",\n    \"module::normalized\": \"Own a product matrix. Ordinary mode moves it unchanged. Projective mode refuses an unexpected all-zero product, computes one inverse of its first nonzero entry, and scales each original coordinate in place using safe matrix set. A nonzero coordinate implies cols>0; row-major loop indices stay in shape. No second dense buffer or matrix clone is allocated; errors drop the owned partial matrix.\",\n    \"module::initial_group\": \"Private admitted n>0: charge four*n^2 logical scalar slots (two retained arrays and a conservative two-buffer scratch allowance), allocate identity once, clone only the required hash key, and move identity into elements. Identity is already projectively canonical and is not normalized again.\",\n    \"module::record_element\": \"Private admitted compatible canonical h: return true if key already exists; if new and elements.len()>=bound return false before inserting. Otherwise clone exactly one key into the hash set and move h into the ordered vector. The caller has already charged retained/scratch slots.\",\n    \"module::expand_closure\": \"Private current<elements.len(), matching admitted generators, immutable scalar hashes: for each generator charge 2*(states+1)*n^2 retained-plus-scratch slots, then checked-add 2*n^3 plus projective (n^2+1) scalar work. Multiply the borrowed current element on the right, normalize its owned result in place and record a new element/class; stop on first excess-bound candidate or typed failure.\"\n  },\n  \"trust_boundary\": \"Rust/compiler and standard allocation; exact immutable commutative field/embedding/conjugation laws and compatible stable Hash/Eq for scalar values; pinned num_bigint/num_rational, exact matrix storage/multiplication/elimination and scalar inverse providers. FusionScalar/ExactRing are open protocols, not sealed runtime enforcement. OperationLimits count logical scalar slots and conservative field operations, not scalar bit sizes, hash/compare time, allocator metadata, callback work or OS memory. No arbitrary custom-field crash freedom is inferred.\",\n  \"assurance_limits\": [\n    \"AuthorityEffect: None. Exact finite computational output and matrix defects only; no fusion-category realizability, general R-matrix classification, physical authority or complete six-module goal is inferred.\",\n    \"Rust/compiler and standard allocation; exact immutable commutative field/embedding/conjugation laws and compatible stable Hash/Eq for scalar values; pinned num_bigint/num_rational, exact matrix storage/multiplication/elimination and scalar inverse providers. FusionScalar/ExactRing are open protocols, not sealed runtime enforcement. OperationLimits count logical scalar slots and conservative field operations, not scalar bit sizes, hash/compare time, allocator metadata, callback work or OS memory. No arbitrary custom-field crash freedom is inferred.\",\n    \"Lean proves the named word/finite-inverse/normalization/matrix-conjugation model facts. Rust extraction, GL/PGL implementation refinement, numeric tensor flattening, allocator behavior and provider-wide correctness remain separate source/native evidence. No MIR proof or A+ crash/byte-cost theorem is claimed.\",\n    \"An earlier campaign with survivors remains unchanged. New independent S3 and nontrivial storage/cube boundary witnesses close the identified test blind spots; successful intermediate sources are preserved separately from final current-source evidence.\"\n  ],\n  \"review_evidence\": [\n    {\n      \"path\": \"code/rust/quality/six_module/assessments/fusion_braid_group.json\",\n      \"sha256\": \"5f0915644f911a9ddb78861f0310bb0b1d5e7cebf048b20a862544b563332ce9\"\n    }\n  ],\n  \"open_obligations\": []\n}\n",
