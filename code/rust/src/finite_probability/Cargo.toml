[package]
name = "tfqm_finite_probability"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_finite_probability"
path = "lib.rs"

[features]
default = []

[dependencies]
tfqm_combinatorics = { path = "../combinatorics" }
tfqm_number_theory = { path = "../number_theory" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }

[[example]]
name = "genesis_impl_exact_replay"
path = "examples/genesis_impl_exact_replay.rs"

[[example]]
name = "l1_import_exact_replay"
path = "examples/l1_import_exact_replay.rs"

[[example]]
name = "born_boundary_exact_replay"
path = "examples/born_boundary_exact_replay.rs"

[dev-dependencies]
serde_json = "1.0"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
