[package]
name = "tfqm_holonomy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_holonomy"
path = "lib.rs"

[features]
default = []
external-omega = ["dep:omega_kernel", "dep:omega_homology", "dep:linear_algebra"]

[dependencies]
omega_kernel = { version = "0.1.0", optional = true }
omega_homology = { version = "0.1.0", optional = true }
linear_algebra = { version = "0.1.0", optional = true }
num-rational = { version = "0.4.2", features = ["serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
