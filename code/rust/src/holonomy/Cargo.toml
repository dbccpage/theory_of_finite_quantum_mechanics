[package]
name = "tfqm_holonomy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_holonomy"
path = "lib.rs"

[features]
default = []

[dependencies]
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
engine_homology = { path = "../../../../vendor/engine/engine_homology" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
num-rational = { version = "0.4.2", features = ["serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
