[package]
name = "tfqm_operad_theory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_operad_theory"
path = "lib.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
