[package]
name = "tfqm_wdp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_wdp"
path = "lib.rs"

[features]
default = []
external-omega = [
    "dep:omega_ooutwire_primitives",
    "dep:omega_policy",
    "dep:omega_types",
    "dep:omega_certifiers",
    "dep:omega_measurement",
    "dep:omega_homology",
    "dep:linear_algebra",
    "dep:omega_kernel",
    "dep:omega_quantum_physics",
    "dep:omega_solvers",
    "dep:omega_replay",
    "dep:omega_wdp",
]

[dependencies]
omega_ooutwire_primitives = { version = "0.1.0", optional = true }
omega_policy = { version = "0.1.0", optional = true }
omega_types = { version = "0.1.0", optional = true }
omega_certifiers = { version = "0.1.0", optional = true }
nalgebra = "0.33"
omega_epk = { package = "tfqm_local_green_global_red_lggr", path = "../local_green_global_red_lggr" }
omega_measurement = { version = "0.1.0", optional = true }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
blake3 = "1.8"
sha2 = "0.10"
hex = "0.4"
omega_homotopy_type_theory = { package = "tfqm_homotopy_type_theory", path = "../homotopy_type_theory" }
omega_functional = { package = "tfqm_functional", path = "../functional" }
omega_homology = { version = "0.1.0", optional = true }
linear_algebra = { version = "0.1.0", optional = true }
omega_holonomy = { package = "tfqm_holonomy", path = "../holonomy" }
omega_kernel = { version = "0.1.0", optional = true }
omega_combinatorics = { package = "tfqm_combinatorics", path = "../combinatorics" }
omega_quantum_physics = { version = "0.1.0", optional = true }
omega_finite_probability = { package = "tfqm_finite_probability", path = "../finite_probability" }
omega_number_theory = { package = "tfqm_number_theory", path = "../number_theory" }
omega_solvers = { version = "0.1.0", optional = true }
omega_category_theory = { package = "tfqm_category_theory", path = "../category_theory" }
omega_general_relativity = { package = "tfqm_general_relativity", path = "../general_relativity" }
omega_replay = { version = "0.1.0", optional = true }
omega_wdp = { version = "0.1.0", optional = true }

[dev-dependencies]
omega_majorana = { package = "tfqm_majorana", path = "../majorana" }
serde_yaml = "0.9"
