[package]
name = "tfqm_wdp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_wdp"
path = "lib.rs"

[features]
default = []

[dependencies]
engine_wire_primitives = { path = "../../../../vendor/engine/engine_wire_primitives" }
engine_policy = { path = "../../../../vendor/engine/engine_policy" }
engine_types = { path = "../../../../vendor/engine/engine_types" }
engine_certifiers = { path = "../../../../vendor/engine/engine_certifiers" }
nalgebra = "0.33"
tfqm_local_green_global_red_lggr = { path = "../local_green_global_red_lggr" }
engine_measurement = { path = "../../../../vendor/engine/engine_measurement" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
blake3 = "1.8"
sha2 = "0.10"
hex = "0.4"
tfqm_homotopy_type_theory = { path = "../homotopy_type_theory" }
tfqm_functional = { path = "../functional" }
engine_homology = { path = "../../../../vendor/engine/engine_homology" }
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
tfqm_holonomy = { path = "../holonomy" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
engine_functional = { path = "../../../../vendor/engine/engine_functional" }
engine_epk = { path = "../../../../vendor/engine/engine_local_green_global_red_lggr" }
engine_number_theory = { path = "../../../../vendor/engine/engine_number_theory" }
tfqm_combinatorics = { path = "../combinatorics" }
engine_quantum_physics = { path = "../../../../vendor/engine/engine_quantum_physics" }
tfqm_finite_probability = { path = "../finite_probability" }
tfqm_number_theory = { path = "../number_theory" }
engine_solvers = { path = "../../../../vendor/engine/engine_solvers" }
tfqm_category_theory = { path = "../category_theory" }
tfqm_general_relativity = { path = "../general_relativity" }
engine_replay = { path = "../../../../vendor/engine/engine_replay" }
engine_wdp = { path = "../../../../vendor/engine/engine_wdp" }

[dev-dependencies]
engine_finite_probability = { path = "../../../../vendor/engine/engine_finite_probability" }
tfqm_majorana = { path = "../majorana" }
serde_yaml = "0.9"

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
