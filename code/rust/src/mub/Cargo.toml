[package]
name = "tfqm_mub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autobins = false

[lib]
name = "tfqm_mub"
path = "lib.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
engine_policy = { path = "../../../../vendor/engine/engine_policy" }
engine_kernel = { path = "../../../../vendor/engine/engine_kernel" }
nalgebra = "0.33"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
linear_algebra = { path = "../../../../vendor/engine/linear_algebra" }
tfqm_functional = { path = "../functional" }
engine_functional = { path = "../../../../vendor/engine/engine_functional" }
engine_number_theory = { path = "../../../../vendor/engine/engine_number_theory" }
tfqm_wdp = { path = "../wdp" }
engine_types = { path = "../../../../vendor/engine/engine_types" }
engine_contracts = { path = "../../../../vendor/engine/engine_contracts" }
tfqm_homotopy_type_theory = { path = "../homotopy_type_theory" }
engine_pipelines = { path = "../../../../vendor/engine/engine_pipelines" }
engine_state = { path = "../../../../vendor/engine/engine_state" }
engine_quantum_physics = { path = "../../../../vendor/engine/engine_quantum_physics" }
tfqm_number_theory = { path = "../number_theory" }
engine_solvers = { path = "../../../../vendor/engine/engine_solvers" }
engine_certifiers = { path = "../../../../vendor/engine/engine_certifiers" }
engine_symbol_host_runtime = { path = "../../../../vendor/engine/engine_symbol_host_runtime" }
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
