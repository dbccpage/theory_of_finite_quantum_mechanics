[package]
name = "tfqm_mub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tfqm_mub"
path = "lib.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
omega_policy = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_policy" }
omega_kernel = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_kernel" }
nalgebra = "0.33"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
linear_algebra = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_linear_algebra" }
omega_functional = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_functional" }
omega_wdp = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_wdp" }
omega_types = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_types" }
omega_contracts = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_contracts" }
omega_homotopy_type_theory = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_homotopy_type_theory" }
omega_pipelines = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_pipelines" }
omega_state = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_state" }
omega_quantum_physics = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_quantum_physics" }
omega_number_theory = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_number_theory" }
omega_solvers = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_solvers" }
omega_certifiers = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_certifiers" }
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
omega_symbol_game_runtime = { path = "C:/Users/a343o/source/repos/the_symbol_game/omega_engine/crates_rs/omega_symbol_game_runtime" }
