[package]
autotests = false
name = "omega_mub"
version.workspace = true
edition = "2021"
description = "Omega-native MUB reconstruction (GTLA/CODA-FOC), separated from the quarantined Apache port `mub`"
license.workspace = true

[dependencies]
omega_policy = { path = "../omega_policy" }
omega_kernel = { path = "../omega_kernel" }
# Boundary: exact cyclotomic ARITHMETIC is native (cyclotomic24 etc.). This crate has
# no dependency on the quarantined Apache port: `crates/mub` was deleted 2026-08-04 and
# the optional `apache-compare` cross-check lane was removed with it.
nalgebra = "0.33"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
linear_algebra = { path = "../omega_linear_algebra" }
omega_functional = { path = "../omega_functional" }
omega_wdp = { path = "../omega_wdp" }
omega_types = { path = "../omega_types" }
omega_contracts = { path = "../omega_contracts" }
omega_homotopy_type_theory = { path = "../omega_homotopy_type_theory" }
omega_pipelines = { path = "../omega_pipelines" }
omega_state = { path = "../omega_state" }
omega_quantum_physics = { path = "../omega_quantum_physics" }
omega_number_theory = { path = "../omega_number_theory" }
omega_solvers = { path = "../omega_solvers" }
omega_certifiers = { path = "../omega_certifiers" }
# Thin Jupyter face only — not a Python math core. Off by default.
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
omega_symbol_game_runtime = { path = "../omega_symbol_game_runtime" }

[features]
# omega_mub is Apache-INDEPENDENT: the `mub` crate and its `apache-compare`
# cross-validation lane were removed 2026-08-04. deep_run's manifest, lower-bound,
# and upper-bound replays are now unconditionally MissingProofObligation (honest:
# "not replayed") — the same terminal the default build already produced.
# `python` = thin PyO3 dict surface; `extension-module` for maturin/cdylib wheels.
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[lib]
name = "omega_mub"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

