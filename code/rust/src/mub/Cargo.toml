[package]
name = "tfqm_mub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autobins = false

[lib]
name = "tfqm_mub"
path = "lib.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
external-omega = [
    "dep:omega_policy",
    "dep:omega_kernel",
    "dep:linear_algebra",
    "dep:omega_types",
    "dep:omega_contracts",
    "dep:omega_pipelines",
    "dep:omega_state",
    "dep:omega_quantum_physics",
    "dep:omega_solvers",
    "dep:omega_certifiers",
    "dep:omega_symbol_game_runtime",
]

[dependencies]
omega_policy = { version = "0.1.0", optional = true }
omega_kernel = { version = "0.1.0", optional = true }
nalgebra = "0.33"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
linear_algebra = { version = "0.1.0", optional = true }
omega_functional = { package = "tfqm_functional", path = "../functional" }
omega_wdp = { package = "tfqm_wdp", path = "../wdp" }
omega_types = { version = "0.1.0", optional = true }
omega_contracts = { version = "0.1.0", optional = true }
omega_homotopy_type_theory = { package = "tfqm_homotopy_type_theory", path = "../homotopy_type_theory" }
omega_pipelines = { version = "0.1.0", optional = true }
omega_state = { version = "0.1.0", optional = true }
omega_quantum_physics = { version = "0.1.0", optional = true }
omega_number_theory = { package = "tfqm_number_theory", path = "../number_theory" }
omega_solvers = { version = "0.1.0", optional = true }
omega_certifiers = { version = "0.1.0", optional = true }
omega_symbol_game_runtime = { version = "0.1.0", optional = true }
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "../governance" }
