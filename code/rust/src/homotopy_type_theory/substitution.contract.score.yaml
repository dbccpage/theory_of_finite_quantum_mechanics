     \"sha256\": \"6c7da30021450dc1ab6029067b83a376969e5774facff43d0293c70ced94ec83\"\n    },\n    {\n      \"path\": \"evidence/quality/l4a_six/20261020T185729Z-mutations/mutations.json\",\n      \"sha256\": \"01abdbac8d4c6f8ac55b07e888ab73ccd0b089aa89552725d1be4bcb57329010\"\n    }\n  ],\n  \"reviewed_specification\": {\n    \"capability_assessment\": {\n      \"basis\": \"Executable production-grain syntax API replaces the entirely disabled recursive stub: private admitted storage, iterative grammar/depth validation, explicit token/name/depth/work limits, fallible output construction, capture/overflow refusals, and separate independent structural and allocation challenges. This is finite untyped syntax, not a HoTT typing or proof kernel.\",\n      \"level\": \"L4\",\n      \"source_sha256\": \"c98923908da413f71d5e7e7276c2f7fe3028599125c6bd00c475cd5c0a544467\"\n    },\n    \"consumer_review\": [\n      \"The local tfqm_homotopy_type_theory lib.rs and compatibility mod.rs declare this module. Repository Rust search found no existing calls to the formerly disabled API; no runnable legacy API is claimed compatible.\",\n      \"The main Rust library publicly reexports the local package. The source-pinned audit workspace uses that local package and dedicated integration tests; its passing tests do not imply a fresh full main-workspace build.\",\n      \"Dependencies are Rust core/std under the pinned compiler and allocator runtime. This module introduces no external algebra provider or mutable global state.\"\n    ],\n    \"independent_challenge\": \"80 independently constructed finite trees: 19200 substitutions against a separate recursive structural oracle; 1200 positive/negative shifts against separate recursive/index-arithmetic oracles; every operator arity/binder role; literal capture/context-removal cases; signed-machine extremes, Unicode byte counts, exact inclusive work/token/name/depth refusals, immutable input checks and depth-1024 traversal. Compile-fail privacy and positive public examples accompany dedicated allocation observations with positive controls.\",\n    \"open_obligations\": [],\n    \"origin_review\": \"New implementation authored for this task, replacing an entirely disabled local stub. Original source bytes are sealed in evidence/quality/l4a_six/20261020T045747Z-hott-activation. activation.json records the first integration bytes; subsequent test-strengthening revisions are separately bound by each fresh execution source manifest and this current source SHA.\",\n    \"proof_arguments\": [\n      \"Prefix validation starts with exactly one pending root. Popping one slot and pushing precisely the token arity preserves the frontier invariant. An exhausted frontier before tokens end is a trailing root; a missing future-node deficit is an incomplete tree. Every accepted token therefore has one uniquely determined tree position/depth.\",\n      \"Shift changes only variable labels, preserving grammar and depth metadata. Checked arithmetic and changed>=active-cutoff preserve the admitted variable domain without capture.\",\n      \"Substitution replaces each target leaf by one complete prefix tree. Input bound variables are below index+d and remain unchanged. Decrementing a larger variable cannot cross depth d. Replacement variables below their local depth stay bound locally; the other variables are lifted by d and cannot be captured. Exact output counts prove all private vector pushes fit reserved buffers.\",\n      \"Every production traversal is iterative. Allocated buffers and immutable inputs are disjoint; an error publishes no Term and drops partial local storage. Scalar integer additions/products are checked, or bounded by admitted vector lengths and occurrence counts.\"\n    ],\n    \"purpose\": \"Admit one finite untyped prefix-syntax tree and perform capture-avoiding de Bruijn shift, substitution and scope instantiation with checked arithmetic, finite work admission and immutable input ownership.\",\n    \"requirement_symbol_map\": {\n      \"admitted grammar and abstraction\": [\n        \"Token\",\n        \"Token::arity\",\n        \"Token::nonbinding_arity\",\n        \"Token::eliminator_arity\",\n        \"Token::binds\",\n        \"Token::payload_bytes\",\n        \"Term\",\n        \"Term::try_new\",\n        \"Term::tokens\",\n        \"Term::binder_depths\",\n        \"Term::name_bytes\",\n        \"check_tree\",\n        \"push_children\"\n      ],\n      \"capture-avoiding operations\": [\n        \"shift\",\n        \"check_shift\",\n        \"append_shifted\",\n        \"moved_variable\",\n        \"substitute\",\n        \"instantiate\",\n        \"is_target\",\n        \"substituted_variable\",\n        \"lifted_variable\",\n        \"check_replacement\",\n        \"replacement_count\",\n        \"check_substitution\",\n        \"append_replacement\"\n      ],\n      \"resource and failure lifecycle\": [\n        \"TermLimits\",\n        \"SubstitutionError\",\n        \"admit\",\n        \"add\",\n        \"mul\",\n        \"reserve\",\n        \"SubstitutionSize\",\n        \"substitution_size\",\n        \"admit_substitution_size\",\n        \"Output::new\",\n        \"Output::push\",\n        \"Output::finish\",\n        \"copy_token\"\n      ]\n    },\n    \"scope_limits\": [\n      \"The finite syntax API intentionally does not implement typing, normalization, beta reduction, HoTT axioms or a serialized-input budget.\"\n    ],\n    \"status\": \"bounded_syntax_individual_gate_review\",\n    \"symbol_contracts\": {\n      \"SubstitutionSize/substitution_size/admit_substitution_size/Output/copy_token\": \"For n input tokens, k target occurrences and m replacement tokens, output tokens are n-k+k*m; output free-name bytes are input bytes+k*replacement bytes. Reserve both output vectors once. Free-name contents are copied once per required output occurrence using fallible String reservation; other token clones have no heap payload. Private pushes stay within precomputed exact counts. A failed copy drops local partial buffers without mutating either input. Actual copy work includes the total output UTF-8 name bytes B_out; token-visit counters do not count each copied byte.\",\n      \"Term::try_new/check_tree/push_children\": \"Require a nonempty token vector encoding exactly one prefix tree. A stack of pending child depths gives each token its validated binder depth. Reverse child scheduling preserves left-to-right prefix order. Every pending child needs a future token; reject a deficit before exceeding the once-reserved input-length stack. Reject trailing roots, checked-depth overflow, excessive depth/token/name/visit counts. Success has equal token/depth vector lengths and exact free-name byte sum; fields have no public mutation or unchecked decoder.\",\n      \"TermLimits/admit/add/mul/reserve/SubstitutionError\": \"Inclusive defaults: 4096 tokens, 1048576 free-name bytes, binder depth 1024 and 1000000 conservative token visits. Constructor visits n; shift 2*n; substitution 3*n+2*k*m, accounting for count, validation and copy scans. Child scheduling is bounded by four children per token. All count/variable/depth arithmetic is checked. Limits describe local representations and work units; candidate parsing, allocator internals, process memory and elapsed time are not bounded.\",\n      \"Token/arity/nonbinding_arity/eliminator_arity/binds/payload_bytes\": \"A prefix token is one node. Lambda/Fst/Snd/Refl/NatSucc have one child; Pi/App/Sigma/Pair/Abort two; IdType three; BoolElim/NatElim four; variables, free names, universes and the unit/empty/bool/natural constants are leaves. Lambda binds its only child; Pi and Sigma bind their second child. Other children introduce no binder. Free names are opaque UTF-8 strings, including empty names. Universe u32 values are syntax labels, not universe-level proofs.\",\n      \"check_replacement/lifted_variable/append_replacement\": \"At internal replacement depth e, preserve variables below e and add the input depth d to every other variable. Output metadata is d+e. This preserves replacement-local bindings while lifting only its free variables past input binders. Overflow is refused before output construction.\",\n      \"shift/check_shift/append_shifted/moved_variable\": \"At binder depth d, preserve variables below cutoff+d; shift the others by signed amount using checked unsigned magnitude arithmetic. Refuse arithmetic underflow/overflow and results below the active cutoff, preventing down-shift capture. Checked cutoff+depth overflow is a typed refusal. Constants/free names and tree grammar are preserved. Check all shift arithmetic and depth/work admission before output allocation.\",\n      \"substitute/instantiate/check_substitution/replacement_count/is_target/substituted_variable\": \"At input binder depth d, replace Var(index+d); decrement strictly larger variables once; preserve smaller variables. Each replacement is one admitted tree. instantiate is substitution at context index zero on the scope body without its outer Lambda. Preflight all output sizes, free-name bytes, replacement lifting and work/depth admission before output allocation.\"\n    }\n  }\n}\n",
