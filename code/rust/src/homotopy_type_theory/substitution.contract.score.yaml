      "status": "bounded_syntax_individual_gate_review",
      "symbol_contracts": {
        "SubstitutionSize/substitution_size/admit_substitution_size/Output/copy_token": "For n input tokens, k target occurrences and m replacement tokens, output tokens are n-k+k*m; output free-name bytes are input bytes+k*replacement bytes. Reserve both output vectors once. Free-name contents are copied once per required output occurrence using fallible String reservation; other token clones have no heap payload. Private pushes stay within precomputed exact counts. A failed copy drops local partial buffers without mutating either input. Actual copy work includes the total output UTF-8 name bytes B_out; token-visit counters do not count each copied byte.",
        "Term::try_new/check_tree/push_children": "Require a nonempty token vector encoding exactly one prefix tree. A stack of pending child depths gives each token its validated binder depth. Reverse child scheduling preserves left-to-right prefix order. Every pending child needs a future token; reject a deficit before exceeding the once-reserved input-length stack. Reject trailing roots, checked-depth overflow, excessive depth/token/name/visit counts. Success has equal token/depth vector lengths and exact free-name byte sum; fields have no public mutation or unchecked decoder.",
        "TermLimits/admit/add/mul/reserve/SubstitutionError": "Inclusive defaults: 4096 tokens, 1048576 free-name bytes, binder depth 1024 and 1000000 conservative token visits. Constructor visits n; shift 2*n; substitution 3*n+2*k*m, accounting for count, validation and copy scans. Child scheduling is bounded by four children per token. All count/variable/depth arithmetic is checked. Limits describe local representations and work units; candidate parsing, allocator internals, process memory and elapsed time are not bounded.",
        "Token/arity/nonbinding_arity/eliminator_arity/binds/payload_bytes": "A prefix token is one node. Lambda/Fst/Snd/Refl/NatSucc have one child; Pi/App/Sigma/Pair/Abort two; IdType three; BoolElim/NatElim four; variables, free names, universes and the unit/empty/bool/natural constants are leaves. Lambda binds its only child; Pi and Sigma bind their second child. Other children introduce no binder. Free names are opaque UTF-8 strings, including empty names. Universe u32 values are syntax labels, not universe-level proofs.",
        "check_replacement/lifted_variable/append_replacement": "At internal replacement depth e, preserve variables below e and add the input depth d to every other variable. Output metadata is d+e. This preserves replacement-local bindings while lifting only its free variables past input binders. Overflow is refused before output construction.",
        "shift/check_shift/append_shifted/moved_variable": "At binder depth d, preserve variables below cutoff+d; shift the others by signed amount using checked unsigned magnitude arithmetic. Refuse arithmetic underflow/overflow and results below the active cutoff, preventing down-shift capture. Checked cutoff+depth overflow is a typed refusal. Constants/free names and tree grammar are preserved. Check all shift arithmetic and depth/work admission before output allocation.",
        "substitute/instantiate/check_substitution/replacement_count/is_target/substituted_variable": "At input binder depth d, replace Var(index+d); decrement strictly larger variables once; preserve smaller variables. Each replacement is one admitted tree. instantiate is substitution at context index zero on the scope body without its outer Lambda. Preflight all output sizes, free-name bytes, replacement lifting and work/depth admission before output allocation."
      }
    }
