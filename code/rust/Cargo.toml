[workspace]
resolver = "2"
members = [
    ".",
    "src/category_theory",
    "src/combinatorics",
    "src/finite_probability",
    "src/fsp",
    "src/genesis_tm",
    "src/functional",
    "src/fusion_categories",
    "src/general_relativity",
    "src/governance",
    "src/higher_category_theory",
    "src/holonomy",
    "src/homotopy_type_theory",
    "src/lie_theory",
    "src/local_green_global_red_lggr",
    "src/majorana",
    "src/mub",
    "src/number_theory",
    "src/operad_theory",
    "src/sheaf_theory",
    "src/wdp",
]

[package]
name = "theory_of_finite_qm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sovereign exact rational algebraic certifiers for the Theory of Finite Quantum Mechanics"

[features]
default = []
external-omega = [
    "dep:linear_algebra",
    "dep:omega_homology",
    "dep:omega_policy",
    "dep:omega_functional",
    "dep:omega_solvers",
    "dep:omega_kernel",
    "dep:omega_combinatorics",
    "dep:omega_lie_theory",
    "dep:omega_general_relativity",
    "dep:omega_engines",
    "dep:omega_quantum_physics",
    "dep:omega_number_theory",
    "dep:omega_holonomy",
    "dep:omega_types",
    "dep:finite_qm_native",
]

[dependencies]
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
blake3 = "1.5"
hex = "0.4"

nalgebra = { version = "0.33", features = ["serde-serialize"] }
# External omega_engine crates (optional; override via gitignored .cargo/config.toml [patch.crates-io]).
# Note: in-repo counterparts for functional, combinatorics, lie_theory, general_relativity,
# number_theory, and holonomy are linked below via relative paths as tfqm_<domain>.
linear_algebra = { version = "0.1.0", optional = true }
omega_homology = { version = "0.1.0", optional = true }
omega_policy = { version = "0.1.0", optional = true }
omega_functional = { version = "0.1.0", optional = true }
omega_solvers = { version = "0.1.0", optional = true }
omega_kernel = { version = "0.1.0", optional = true }
omega_combinatorics = { version = "0.1.0", optional = true }
omega_lie_theory = { version = "0.1.0", optional = true }
omega_general_relativity = { version = "0.1.0", optional = true }
omega_engines = { version = "0.1.0", features = ["strict_invariants"], optional = true }
omega_quantum_physics = { version = "0.1.0", optional = true }
omega_number_theory = { version = "0.1.0", optional = true }
omega_holonomy = { version = "0.1.0", optional = true }
omega_types = { version = "0.1.0", optional = true }
finite_qm_native = { version = "0.1.0", optional = true }

tfqm_category_theory = { path = "src/category_theory" }
tfqm_combinatorics = { path = "src/combinatorics" }
tfqm_finite_probability = { path = "src/finite_probability" }
tfqm_fsp = { path = "src/fsp" }
tfqm_functional = { path = "src/functional" }
tfqm_fusion_categories = { path = "src/fusion_categories" }
tfqm_general_relativity = { path = "src/general_relativity" }
tfqm_higher_category_theory = { path = "src/higher_category_theory" }
tfqm_holonomy = { path = "src/holonomy" }
tfqm_homotopy_type_theory = { path = "src/homotopy_type_theory" }
tfqm_lie_theory = { path = "src/lie_theory" }
tfqm_local_green_global_red_lggr = { path = "src/local_green_global_red_lggr" }
tfqm_majorana = { path = "src/majorana" }
tfqm_mub = { path = "src/mub" }
tfqm_number_theory = { path = "src/number_theory" }
tfqm_operad_theory = { path = "src/operad_theory" }
tfqm_sheaf_theory = { path = "src/sheaf_theory" }
tfqm_wdp = { path = "src/wdp" }

[[bin]]
name = "finite_cli"
path = "src/bin/finite_cli.rs"

[[bin]]
name = "entropy_cli"
path = "src/bin/entropy_cli.rs"

[dev-dependencies]
proptest = "1.5"

# Workspace-wide: member-level profiles are ignored by Cargo.
[profile.release]
overflow-checks = true

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "src/governance" }
