[workspace]
resolver = "2"
members = [
    ".",
    "src/category_theory",
    "src/combinatorics",
    "src/finite_probability",
    "src/fsp",
    "src/genesis_tm",
    "src/functional",
    "src/fusion_categories",
    "src/general_relativity",
    "src/governance",
    "src/higher_category_theory",
    "src/holonomy",
    "src/homotopy_type_theory",
    "src/lie_theory",
    "src/local_green_global_red_lggr",
    "src/majorana",
    "src/mub",
    "src/number_theory",
    "src/operad_theory",
    "src/sheaf_theory",
    "src/wdp",
]

[package]
name = "theory_of_finite_qm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sovereign exact rational algebraic certifiers for the Theory of Finite Quantum Mechanics"

[features]
default = []

[dependencies]
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
blake3 = "1.5"
hex = "0.4"

nalgebra = { version = "0.33", features = ["serde-serialize"] }
linear_algebra = { path = "../../vendor/engine/linear_algebra" }
engine_homology = { path = "../../vendor/engine/engine_homology" }
engine_policy = { path = "../../vendor/engine/engine_policy" }
engine_functional = { path = "../../vendor/engine/engine_functional" }
engine_solvers = { path = "../../vendor/engine/engine_solvers" }
engine_kernel = { path = "../../vendor/engine/engine_kernel" }
engine_combinatorics = { path = "../../vendor/engine/engine_combinatorics" }
engine_lie_theory = { path = "../../vendor/engine/engine_lie_theory" }
engine_general_relativity = { path = "../../vendor/engine/engine_general_relativity" }
engine_runtime = { path = "../../vendor/engine/engine_runtime", features = ["strict_invariants"] }
engine_quantum_physics = { path = "../../vendor/engine/engine_quantum_physics" }
engine_number_theory = { path = "../../vendor/engine/engine_number_theory" }
engine_holonomy = { path = "../../vendor/engine/engine_holonomy" }
engine_types = { path = "../../vendor/engine/engine_types" }

tfqm_category_theory = { path = "src/category_theory" }
tfqm_combinatorics = { path = "src/combinatorics" }
tfqm_finite_probability = { path = "src/finite_probability" }
tfqm_fsp = { path = "src/fsp" }
tfqm_functional = { path = "src/functional" }
tfqm_fusion_categories = { path = "src/fusion_categories" }
tfqm_general_relativity = { path = "src/general_relativity" }
tfqm_higher_category_theory = { path = "src/higher_category_theory" }
tfqm_holonomy = { path = "src/holonomy" }
tfqm_homotopy_type_theory = { path = "src/homotopy_type_theory" }
tfqm_lie_theory = { path = "src/lie_theory" }
tfqm_local_green_global_red_lggr = { path = "src/local_green_global_red_lggr" }
tfqm_majorana = { path = "src/majorana" }
tfqm_mub = { path = "src/mub" }
tfqm_number_theory = { path = "src/number_theory" }
tfqm_operad_theory = { path = "src/operad_theory" }
tfqm_sheaf_theory = { path = "src/sheaf_theory" }
tfqm_wdp = { path = "src/wdp" }

[[bin]]
name = "finite_cli"
path = "src/bin/finite_cli.rs"

[[bin]]
name = "entropy_cli"
path = "src/bin/entropy_cli.rs"

[dev-dependencies]
proptest = "1.5"

# Workspace-wide: member-level profiles are ignored by Cargo.
[profile.release]
overflow-checks = true

[profile.test]
debug = 0

# Contract governance hook (build.rs); see governance/README.md.
[build-dependencies]
governance = { path = "src/governance" }
