      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/rust/src/tests/omega_mub/fixture_receipts.rs\",\n    \"sha256\": \"71e6c6decfd93402d0c1dd1d54b66ad87dcc8a48b055c5b43f98a87686c21c49\"\n  },\n  \"profile\": \"Exact\",\n  \"rubric\": {\n    \"path\": \"SCORING.md\",\n    \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n  },\n  \"level\": \"L4\",\n  \"level_basis\": \"Production API grain and custody: strict bounded admission, opaque admitted and verified states, owned observations, typed errors, root/path preflight and canonical containment, complete streaming IO with separate total/per-file limits, explicit registration and supervised source-bound fault checks.\",\n  \"gates\": {\n    \"G1\": \"C\",\n    \"G2\": \"C\",\n    \"G3\": \"C\",\n    \"G4\": \"C\",\n    \"G5\": \"B\"\n  },\n  \"basis\": {\n    \"G1\": \"Exact source/asset/dependency pins, unique claim URN and literal authority ceiling. Historical annotations remain annotations; no complete downstream provenance or derivation claim.\",\n    \"G2\": \"Known SHA-256 abc/empty controls, exact bounded counters, metadata admission and independent Python byte/digest audit of all 20 sealed inputs. No approximate arithmetic on admitted paths.\",\n    \"G3\": \"Typed expected failure and indexed register refusal, private immutable observations and RAII file ownership. Actual Windows junction escape refused. No formal panic-freedom, filesystem-race immunity or hard real-time claim.\",\n    \"G4\": \"14 debug and 14 release tests, Clippy with warnings denied, and compiled-source bindings. 31 distinct non-equivalent faults killed across two executions. One original survivor is retained and excluded only by the written absorption proof; two deliberate invalid controls are excluded, never kills. No exhaustive fault-space or alternate compiler claim.\",\n    \"G5\": \"Complete syn AST function coverage, calibrated conservative decision/control bounds and reviewed linear cost envelope. Lizard's missed digest_text boundary is disclosed rather than replaced with a false zero or claimed agreement. No Sonar-conformance, expanded dependency, heap or runtime proof.\"\n  },\n  \"metrics\": {\n    \"ast_decision_upper_bound\": 14,\n    \"weighted_control_upper_bound\": 17,\n    \"control_nesting\": 2\n  },\n  \"mutation_outcomes\": {\n    \"KILLED\": 31,\n    \"DEMONSTRABLY_EQUIVALENT\": 1\n  },\n  \"is_complete\": true,\n  \"composite_grade\": \"C\",\n  \"score_token\": \"L4C\",\n  \"requested_target\": \"L4E or higher\",\n  \"target_achieved\": true,\n  \"target_scope\": \"This exact Rust source only; full 24-directory objective remains open.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T225459Z-rust-fixture-challenge/receipt.json\",\n      \"sha256\": \"e53b314eb976317f1487d921b388a22b3d791664b4ca18d29635c307deec0691\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T230113Z-rust-fixture-challenge/receipt.json\",\n      \"sha256\": \"500c3ca4ea614d11e3e8635d6568802bd32a3bedd532f05650ca8613107508fe\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T225459Z-rust-fixture-challenge/adversarial-review.json\",\n      \"sha256\": \"3a651f0d937afb8063d1d40ab69d1e427233164ecba566417181fc9edcbedcef\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T225459Z-rust-fixture-challenge/host-custody-audit.json\",\n      \"sha256\": \"c67ab7c187a6ef1a6c02989bf9191656d9876ad2d0dc7905f9da86bc893c1062\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T225535Z-rust-structure/receipt.json\",\n      \"sha256\": \"ed01701891a1a50ed584e294d22736568cf0719466aff0826172740171995e7f\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch5-atlas.log\",\n      \"sha256\": \"45425bc105e799841cffa39d959410b2947cb7f8fb62879199a2fa95f302b7f3\"\n    },\n    {\n      \"path\": \"evidence/