of-orbit values.\",\n    \"test_tier2_fsp_cochain_complex_negative_dimensions_rejection\": \"FEAT-FSP-B05: Verify CochainComplex dimension bounds and matrix size checks.\",\n    \"test_tier2_majorana_fock_carrier_mode_extremes\": \"FEAT-MAJ-B01: Verify FockCarrier mode limits and rejection outside [1, MAX_MODES].\",\n    \"test_tier2_majorana_fock_carrier_generator_index_out_of_bounds\": \"FEAT-MAJ-B02: Verify majorana_generator rejection of indices outside [1, 2*modes].\",\n    \"test_tier2_majorana_monomial_identity_and_involution\": \"FEAT-MAJ-B03: Verify identity monomial behavior and self-annihilation (gamma_i^2 = 1).\",\n    \"test_tier2_majorana_kitaev_wire_zero_hopping_trivial_phase\": \"FEAT-MAJ-B04: Verify SparseKitaevWire in trivial atomic phase (t=0, delta=0, mu=1).\",\n    \"test_tier2_majorana_braid_action_out_of_range_index\": \"FEAT-MAJ-B05: Verify MajoranaBraidAction rejection of out-of-bounds braid indices.\",\n    \"test_tier2_majorana_tetron_planar_vs_torus_topology\": \"FEAT-MAJ-B06: Verify topology boundaries: Disk (dim_h1=0), Cylinder (dim_h1=1), Torus (dim_h1=2).\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"CheckError or assertion failure on mismatched invariants or unadmitted values; expected test exceptions caught and verified.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter 