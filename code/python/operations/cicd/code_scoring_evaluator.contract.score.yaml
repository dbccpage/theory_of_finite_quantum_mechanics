      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/operations/cicd/code_scoring_evaluator.py\",\n    \"sha256\": \"079221f1e46acd9d6e8bcb58ac07a7c36ebfd066352b32d1602430b9a072dbcf\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:scoring:code_scoring_evaluator:v2\",\n  \"role\": \"library\",\n  \"purpose\": \"Code Scoring Evaluator & Gate (Version 2.0.0). Compatibility claim: urn:omega:scoring:grade-minimum-witness:v1\",\n  \"operations\": {\n    \"ScoringError\": \"One violated scoring invariant, with the measured parameters.\",\n    \"checked_int\": \"Return one integer after refusing float and bool.\",\n    \"grade_minimum_witness\": \"Return 0 when min(A+, A, B) is B and min(E, A+) is E.\",\n    \"min_grade\": \"Return the weakest known grade; an empty or incomplete assessment is null.\",\n    \"grade_ceiling\": \"Compute known grade ceiling from all evaluated non-null gates.\",\n    \"GateScore\": \"Evaluation result for an individual quality gate.\",\n    \"FileScoreRecord\": \"Typed evaluation record for a single source or formal artifact.\",\n    \"CodeScoringReceipt\": \"Typed machine receipt for CI/CD code scoring evaluation.\",\n    \"validate_record_against_schema\": \"Validate schema and grade consistency; unavailable validators fail closed.\",\n    \"detect_language\": \"Detect language from file suffix.\",\n    \"detect_profile\": \"Detect computational profile from explicit annotations or domain heuristics.\",\n    \"evaluate_gate1_provenance\": \"Source annotations alone do not establish provenance or claim mapping.\",\n    \"evaluate_gate2_semantic_and_numeric\": \"Record the selected profile without treating syntax as mathematical evidence.\",\n    \"evaluate_gate3_failure_safety\": \"Absence of abort keywords cannot establish complete failure behavior.\",\n    \"evaluate_gate4_tests\": \"No test, compiler, proof checker or mutation campaign is executed here.\",\n    \"evaluate_gate5_structure_and_complexity\": \"A partial source metric is an observation, not a complete G5 assessment.\",\n    \"assign_level\": \"Return a provisional lower bound; keyword presence cannot certify capability.\",\n    \"score_source_file\": \"Score a single source file across all five gates and return a typed record.\",\n    \"evaluate_scoring_rubric\": \"Run code scoring evaluator over the specified paths.\",\n    \"evaluate_main\": \"CLI entrypoint.\",\n    \"main\": \"Keep the no-argument grade-minimum witness API; arguments run static triage.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
