    "doctrine": {
      "summary": "Root governance law for the Omega Engine contract system. Governs every contract\nunder the contract_canonical_definitions hierarchy.\n",
      "non_role": [
        "artifact-family collapse",
        "evidence emitting facts without checking",
        "facts emitting decisions",
        "decisions executing actions",
        "action licenses executing themselves",
        "records controlling execution",
        "unlicensed lifts",
        "implicit trace control",
        "certificate authority exceeding evidence authority",
        "llm self-certification",
        "search authority claims",
        "solver transition authorization"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MAY propose candidate text, packets,\nstructures, patches, or explanations.\n\nThe LLM MUST NOT certify, validate, evaluate, terminalize, authorize transitions,\nexecute transitions, or upgrade evidence authority.\n\nLLM output enters the system as Generated evidence only. It must pass through\nparsing, checking, evaluation, and licensing boundaries before it can support any\nFactEnvelope, DecisionEnvelope, ActionLicense, Action, or Record.\n"
      },
      "role_boundary_law": {
        "text": "Search proposes candidates only.\nSolvers compute results only.\nCertifiers check evidence only.\nEvaluators judge facts or candidate quality only within declared evaluator authority.\nTerminalizers seal terminal outcomes or licenses only.\nThe Engine executes licensed transitions only.\nNone of these roles may silently assume the authority of another role.\n"
      },
      "health_model_law": {
        "text": "HealthModel reports invariant-relative health only.\nHealthModel MUST NOT prescribe action, select policy, authorize repair, license a\nlift, or execute transition.\nHealthModel default AuthorityEffect is EvidenceOnly before invariant/source checking\nand FactOnly after invariant/source checking.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "Certificate authority MUST NOT exceed attached evidence authority.\nA certificate MAY bind, check, replay, summarize, or attest to attached evidence\nwithin its declared certifier capability.\nA certificate MUST NOT create authority absent from the attached evidence, declared\nchecker capability, replay boundary, or governing contract.\n"
      },
      "declarations_required": [
        "paper-level concept dependencies",
        "primary artifact family",
        "referenced artifact families (may not emit)",
        "output authority layer",
        "default AuthorityEffect",
        "forbidden later-layer concepts",
        "required certificates for replay/audit",
        "forbidden implementation tokens",
        "required negative-capability tests",
        "service vs reference consumption",
        "emitted artifact type",
        "implementation boundary crate/module"
      ],
      "artifact_family_law": {
        "text": "A contract MUST emit exactly one primary artifact family.\nAllowed families: StructureArtifact, EvidenceEnvelope, FactEnvelope,\nDecisionEnvelope, ActionLicense, Action, Record.\n",
        "invalid_combinations": [
          "EvidenceEnvelope + FactEnvelope from one unchecked interface",
          "FactEnvelope + DecisionEnvelope from one interface",
          "DecisionEnvelope + ActionLicense from one interface",
          "ActionLicense + Action from one interface",
          "Record + Action from one interface",
          "StructureArtifact + semantic DecisionEnvelope from one interface"
        ]
      },
      "checked_packet_boundary_law": "CheckedPacket is the universal evidence-promotion boundary.\nGenerated output MUST NOT become FactEnvelope, DecisionEnvelope, ActionLicense,\nAction, or Record without passing the required parsing and checking boundary.\nPacketization proves grammar, carrier, schema, and representation integrity only.\nIt does not prove semantic truth.\n",
      "authority_effect_law": {
        "canonical_enum": [
          "None",
          "EvidenceOnly",
          "FactOnly",
          "RequiresEvaluator",
          "RequestsDecision",
          "AuthorizesTransition",
          "StateTransition"
        ],
        "default_mapping": {
          "StructureArtifact": "None or EvidenceOnly",
          "EvidenceEnvelope": "EvidenceOnly",
          "FactEnvelope": "EvidenceOnly, FactOnly, or RequiresEvaluator",
          "DecisionEnvelope": "RequestsDecision",
          "ActionLicense": "AuthorizesTransition",
          "Action": "StateTransition",
          "Record": "EvidenceOnly or FactOnly"
        },
        "rule": "No contract may invent a local AuthorityEffect enum."
      },
      "family_flow_law": {
        "valid_upward": "StructureArtifact -> EvidenceEnvelope -> FactEnvelope -> DecisionEnvelope -> ActionLicense -> Action",
        "valid_recording": "Record records StructureArtifact, EvidenceEnvelope, FactEnvelope, DecisionEnvelope, ActionLicense, and Action.",
        "invalid_downward": [
          "EvidenceEnvelope -> FactEnvelope without checking",
          "FactEnvelope -> EvidenceEnvelope by erasing judgment",
          "DecisionEnvelope -> FactEnvelope",
          "ActionLicense -> DecisionEnvelope",
          "Action -> ActionLicense",
          "Action -> DecisionEnvelope",
          "Record -> Action",
          "Record -> Policy",
          "Trace -> implicit execution",
          "Certificate -> authority above attached evidence"
        ]
      },
      "representation_meaning_split": {
        "required_split": {
          "representation_change": "RepresentationBoundary / Projector / ForgetfulBoundary",
          "shape_checking": "Parser / PacketValidator / CheckedPacket boundary",
          "meaning_judgment": "Evaluator",
          "policy_decision": "Policy / MetaJudgment",
          "transition_license": "Terminalizer / Licensing boundary",
          "state_transition": "Engine"
        }
      },
      "operator_authority_law": {
        "effect_classes": {
          "E": "exact repair",
          "I": "quotient isometry",
          "C": "context embedding",
          "R": "residual projection",
          "M": "refused mutation"
        },
        "rules": [
          "No candidate may self-declare its operator class.",
          "Operator classification must be evidence-based.",
          "M is absorbing refusal and is never composable.",
          "No commutation, compression, or normalization without explicit RewriteLaw or certificate.",
          "R requires deterministic TiePolicy.",
          "C . C requires declared context composition.",
          "Normal form must emit rewrite trace and certificate references."
        ]
      },
      "lift_law": "A lift requires: obstruction reference, witness references, certificate references,\nlift license, MetaJudgment approval when governance or layer authority changes,\nEngine execution boundary.\nA lift license authorizes a lift but does not execute it.\nAny structural ascent, carrier/schema expansion, or layer transition without a\nlift license is invalid.\n",
      "trace_law": {
        "allows": [
          "replay",
          "audit",
          "debugging",
          "provenance"
        ],
        "must_not": [
          "trigger execution",
          "encode hidden policy",
          "mutate runtime state",
          "enrich records post-hoc",
          "act as cache",
          "control future behavior without a declared TraceConsumerContract"
        ]
      },
      "constitutional_laws": [
        "NoJudgmentInsideFacts",
        "NoDecisionInsideFacts",
        "NoActionInsideRecords",
        "NoExecutionInsideLicenses",
        "NoLiftWithoutWitness",
        "NoLiftWithoutLicense",
        "NoAuthorityAboveEvidence",
        "NoSemanticCreationInsideRepresentationBoundaries",
        "NoTruthClaimInsidePacketization",
        "NoLLMSelfCertification",
        "NoSearchAuthority",
        "NoSolverTransitionAuthorization",
        "NoEnginePolicyEvaluation"
      ],
