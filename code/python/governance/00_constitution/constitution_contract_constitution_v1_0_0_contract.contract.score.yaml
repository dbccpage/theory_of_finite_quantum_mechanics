        "contract_distinguishes_action_license_from_action",
        "contract_distinguishes_evidence_from_fact"
      ],
      "canonical_invariant": "Structure, Evidence, Fact, Decision, ActionLicense, Action, and Record are separate\nartifact families. Evidence may support facts only through checking. Facts may support\ndecisions only through evaluation or policy. Decisions may support action licenses only\nthrough terminalization or licensing. Action licenses may authorize actions but may not\nexecute themselves. Records may record all and control none.\n",
