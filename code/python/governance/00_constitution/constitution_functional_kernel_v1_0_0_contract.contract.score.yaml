      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:constitution:functional_kernel:v1.0.0\",\n  \"title\": \"FunctionalKernel\",\n  \"kind\": \"constitution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"00_constitution\",\n  \"role\": \"Constitution\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Observable\",\n        \"Measurement\",\n        \"Solver\",\n        \"CertificateKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Functional computes typed mathematical values and emits measurement evidence.\\nFunctional does not judge, rank, search, schedule, terminalize, license, authorize,\\nmutate, or execute. Functional output has measurement authority only.\\n\",\n    \"non_role\": [\n      \"evaluator judgment\",\n      \"search scheduling\",\n      \"policy interpretation\",\n      \"lift triggering\",\n      \"terminalization\",\n      \"state mutation\",\n      \"execution\",\n      \"acceptance decision\",\n      \"refusal decision\",\n      \"transition authorization\",\n      \"certificate authority creation\",\n      \"evidence authority upgrade\",\n      \"terminal status assignment\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\\nterminalize, authorize transitions, execute transitions, or upgrade evidence authority.\\nLLM output may propose Functional definitions or candidate measurement expressions,\\nbut those proposals have no Functional authority until parsed, checked, tested, and\\nadmitted under this contract.\\n\"\n    },\n    \"core_definition\": \"A Functional is a deterministic, stateless mathematical mapping from declared state\\ntypes to typed scalar, vector, or measurement outputs with optional certificate\\nreferences. It may call declared Observables or Solver interfaces to compute those\\nvalues, but it must not mutate state, orchestrate execution, search alternatives,\\nrank candidates, terminalize, authorize transitions, or return acceptance/rejection\\ndecisions.\\n\",\n    \"minimal_functional_basis\": {\n      \"class_i\": {\n        \"name\": \"Primary Obstruction Magnitude (Phi1)\",\n        \"definition\": \"Phi1(omega) := min_s || omega - B s ||_1\",\n        \"role\": \"Measures irreducible closure failure. Well-founded, lexicographically dominant.\"\n      },\n      \"class_ii\": {\n        \"name\": \"Higher Obstruction / Closure Stress (Gamma2)\",\n        \"definition\": \"Gamma2(h1) := || d1 h1 ||_1\",\n        \"role\": \"Detects structural failure of repair. Prevents fake descent.\"\n      },\n      \"class_iii\": {\n        \"name\": \"Conditioning / Regime Gate (R_cl)\",\n        \"definition\": \"R_cl : (Phi1, Gamma2) -> ClosureRegime\",\n        \"role\": \"Classifies operating regimes to prevent silent regime errors.\",\n        \"regimes\": {\n          \"Normal\": \"Phi1 > epsilon\",\n          \"TerminalZero\": \"Phi1 <= epsilon AND Gamma2 <= epsilon\",\n          \"PathologicalTear\": \"Phi1 <= epsilon AND Gamma2 > epsilon\"\n        }\n      },\n      \"class_iv\": {\n        \"name\": \"Representative Distortion / Tie-Breaking (Xi)\",\n        \"definition\": \"Xi := ||rho(omega) - rho(h1*)||_1\",\n        \"role\": \"Measures how obstruction is represented. Intentionally powerless.\"\n      }\n    },\n    \"functional_evidence_matrix\": {\n      \"Phi1\": {\n        \"role\": \"primary obstruction magnitude evidence\",\n        \"may_decide_descent\": false,\n        \"may_trigger_lift\": false,\n        \"may_decide_success\": false\n      },\n      \"Gamma2\": {\n        \"role\": \"closure stress evidence\",\n        \"may_decide_descent\": false,\n        \"may_trigger_lift\": false,\n        \"may_decide_success\": false\n      },\n      \"R_cl\": {\n        \"role\": \"closure regime evidence\",\n        \"may_decide_descent\": false,\n        \"may_trigger_lift\": false,\n        \"may_decide_success\": false\n      },\n      \"Xi\": {\n        \"role\": \"diagnostic / tie-break evidence only\",\n        \"may_decide_descent\": false,\n        \"may_trigger_lift\": false,\n        \"may_decide_success\": false\n      }\n    },\n    \"triad_functional\": \"The Triad functional is not fundamental. It should be named Triad_display and used\\nonly for dashboards, logging, regression testing, or comparative benchmarking.\\nIt MUST NEVER be used for acceptance decisions, lift triggering, operator gating,\\nor ordering primary descent.\\n\",\n    \"forbidden_functionals\": [\n      {\n        \"name\": \"l2 norms\",\n        \"reason\": \"Allows cancellation, breaks obstruction localization\"\n      },\n      {\n        \"name\": \"Averaged scores\",\n        \"reason\": \"Hides localized failure\"\n      },\n      {\n        \"name\": \"Learned scalar reward\",\n        \"reason\": \"Violates evaluator immutability\"\n      },\n      {\n        \"name\": \"Entropy as primary\",\n        \"reason\": \"Conflates multiplicity with obstruction\"\n      },\n      {\n        \"name\": \"Softmax / exp\",\n        \"reason\": \"Non-monotone under descent\"\n      },\n      {\n        \"name\": \"Probabilistic confidence as primary obstruction evidence\",\n        \"reason\": \"Not structural and not replay-stable unless separately certified\"\n      }\n    ],\n    \"pipeline_flow\": \"Observable/Solver -> Functional -> MeasurementEnvelope -> MeasurementKernel /\\nCertificateKernel -> Evaluator -> Policy / MetaJudgment -> Terminalizer /\\nLicensing boundary -> Engine\\n\",\n    \"trait_shape\": {\n      \"trait_name\": \"Functional<State>\",\n      \"methods\": [\n        \"fn functional_id(&self) -> FunctionalId\",\n        \"fn functional_version(&self) -> FunctionalVersion\",\n        \"fn compute(&self, state: &State) -> Result<FunctionalOutput, FunctionalError>\"\n      ],\n      \"output_struct\": \"FunctionalOutput\",\n      \"output_fields\": [\n        \"functional_id\",\n        \"functional_version\",\n        \"input_hash\",\n        \"config_hash\",\n        \"output_hash\",\n        \"values\",\n        \"witness_refs\",\n        \"certificate_refs\",\n        \"solver_refs\",\n        \"observable_refs\",\n        \"range_behavior\",\n        \"authority_effect\"\n      ]\n    },\n    \"range_behavior\": {\n      \"variants\": [\n        \"Bounded { min, max }\",\n        \"UnboundedAllowed\",\n        \"DivergenceIsError\",\n        \"DeclaredClamp { min, max }\"\n      ]\n    },\n    \"admissibility_checklist\": [\n      \"Input is typed state reference (&State)\",\n      \"Output is typed measurement, not verdict\",\n      \"Stateless -- no history, no cache affecting result\",\n      \"Configuration is immutable\",\n      \"Range behavior is declared\",\n      \"No silent clamping\",\n      \"No acceptance/rejection logic\",\n      \"No state mutation\",\n      \"No execution orchestration\",\n      \"Deterministic given same inputs\"\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"accepted = true\",\n        \"rejected = true\",\n        \"verdict\",\n        \"should_descend\",\n        \"should_lift\",\n        \"requires_lift\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalStatus\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute(\",\n        \"mutate_state\",\n        \"rank_candidates\",\n        \"search_alternatives\",\n        \"schedule_search\",\n        \"trigger_lift\",\n        \"grant_authority\",\n        \"upgrade_authority\"\n      ]\n    },\n    \"required_tests\": [\n      \"functional_does_not_mutate_state\",\n      \"functional_does_not_emit_verdict\",\n      \"functional_does_not_trigger_lift\",\n      \"functional_does_not_terminalize\",\n      \"functional_does_not_call_engine\",\n      \"functional_has_no_history\",\n      \"functional_records_input_and_output_hash\",\n      \"same_state_same_functional_output\",\n      \"xi_cannot_trigger_lift\",\n      \"triad_display_cannot_drive_evaluator\",\n      \"declared_clamp_required\",\n      \"functional_output_defaults_to_evidence_only\",\n      \"functional_output_requires_checking_for_factonly\",\n      \"functional_does_not_authorize_transition\",\n      \"functional_does_not_emit_terminal_status\",\n      \"functional_does_not_emit_action_license\",\n      \"functional_does_not_promote_evidence_authority\",\n      \"functional_records_config_hash\",\n      \"functional_records_observable_refs\",\n      \"functional_records_solver_refs\",\n      \"functional_cache_does_not_affect_result\",\n      \"functional_metalift_language_does_not_trigger_lift\"\n    ],\n    \"canonical_invariant\": \"Functional computes typed mathematical measurement evidence. It does not judge, rank,\\nsearch, schedule, terminalize, license, authorize, mutate, or execute. Functional\\noutput is EvidenceOnly until promoted by an explicit checked measurement or certificate\\nboundary.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"FunctionalKernel\",\n      \"role\": \"Deterministic mathematical measurement composer\",\n      \"version\": \"2.0\",\n      \"classification\": \"constitution\",\n      \"split_from\": \"authority_contract.md (lines 113-589)\",\n      \"doctrine_version\": \"2026-05\",\n      \"depends_on\": [\n        \"Observable\",\n        \"Measurement\",\n        \"Solver\",\n        \"CertificateKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"evaluator judgment\",\n        \"search scheduling\",\n        \"policy interpretation\",\n        \"lift triggering\",\n        \"terminalization\",\n        \"state mutation\",\n        \"execution\",\n        \"acceptance decision\",\n        \"refusal decision\",\n        \"transition authorization\",\n        \"certificate authority creation\",\n        \"evidence authority upgrade\",\n        \"terminal status assignment\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"MeasurementEnvelope\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"FunctionalOutput\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_constitution_contract:v1.0.0\"\n    ]\n  }\n}\n",
