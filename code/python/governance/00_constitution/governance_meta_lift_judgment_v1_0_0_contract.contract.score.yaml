      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:governance:meta_lift_judgment:v1.0.0\ntitle: MetaLiftJudgment\nkind: constitution_contract\nstatus: active_doctrine\nlayer: 00_constitution\nrole: MetaLiftJudgment\ndescriptor:\n  authority_effect: requests_decision\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: true\n  customer_claim_allowed: false\n  dependencies:\n    contracts:\n    - ContractConstitution\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'MetaLiftJudgment is the specialized, read-only governance judgment contract\n    that determines whether a proposed carrier-extension lift plan (MetaLiftPlan /\n    ProposedCarrier) and its attached evidence certificates satisfy the declared lift\n    doctrine. MetaLiftJudgment emits RequestsDecision (never LiftLicense or StateTransition).\n    LicensingBoundary alone consumes MetaLiftJudgment to issue LiftLicense (AuthorizesTransition).\n    Engine alone commits already-computed licensed lift results to runtime state.\n\n    '\n  anti_god_object_law: producer != judge != executor\n  canonical_flow: 'MetaPlanner (emits MetaLiftRequest) -> Lift subsystem (computes\n    detached proposed carrier extension) -> Functional / Certifier (generates evidence\n    certificates) -> MetaLiftJudgment (judges admissibility; emits RequestsDecision)\n    -> LicensingBoundary (evaluates judgment; issues LiftLicense) -> Engine (durable\n    commit of EXACT licensed lifted carrier to runtime state)\n\n    '\n  non_role:\n  - lift application\n  - carrier mutation\n  - search execution\n  - candidate scheduling\n  - operator computation\n  - solver computation\n  - measurement computation\n  - evaluator recomputation\n  - terminalization\n  - license minting\n  - certificate creation for unverified evidence\n  - engine action execution\n  - trace mutation\n  - storage mutation\n  - unlicensed carrier extension\n  - self-certification of minimality\n  subsystem_firewalls:\n    planner_boundary: MetaPlanner selects same-regime operators or emits MetaLiftRequest;\n      it does not judge lift admissibility.\n    lift_subsystem_boundary: Lift subsystem constructs proposed carrier extension;\n      it does not commit to runtime state.\n    certifier_boundary: MinimalityCertifier, PersistenceCertifier, and AreaLockCertifier\n      check mathematical properties; MetaLiftJudgment only verifies their existence\n      and scope alignment.\n    judge_boundary: MetaLiftJudgment judges admissibility; it cannot mint LiftLicense\n      or execute transitions.\n    licensing_boundary: LicensingBoundary alone evaluates MetaLiftJudgment to issue\n      LiftLicense.\n    engine_boundary: Engine alone commits an already-computed, licensed lift result\n      to runtime state.\n  minimality_enforcement:\n    consumed_certificate: MinimalityCertificate (emitted by external MinimalityCertifier)\n    declared_universe:\n      lift_component_type: LiftComponent\n      lift_component_set: LiftComponentSet\n      sub_lift_relation: SubLiftRelation(L', L) [L' ≺ L]\n      candidate_space_property: finite_and_decidable\n    theorem_obligation: 'Minimal(L) <=> Repairs(L) AND forall L'' ≺ L, NOT Repairs(L'')\n\n      '\n    judgment_rule: 'MetaLiftJudgment verifies that a valid MinimalityCertificateRef\n      exists, binds the target plan, and carries sufficient evidence authority. MetaLiftJudgment\n      NEVER reruns search or proof over sublifts.\n\n      '\n  externalized_lift_math:\n    lift_theory_contract_ref: urn:omega:governance:lift_theory:v1.0.0\n    area_lock_irreducibility_certificate_ref: urn:omega:governance:area_lock_irreducibility_certificate:v1.0.0\n    notes: 'Delta-laws (unary vs binary) and gauge area-lock calculations (m_G(gamma)\n      > 0) are externalized into consumed LiftTheory and Certificate contracts. MetaLiftJudgment\n      mechanism checks presence and validity of certificates without embedding specific\n      regime-dependent mathematical constants.\n\n      '\n  structural_representation:\n    meta_decision:\n      variants:\n      - name: NoLift\n        fields:\n        - reason\n        - evidence_refs\n      - name: LiftAdmissible\n        fields:\n        - judgment_id\n        - lift_plan_ref\n        - evidence_refs\n        - satisfied_condition_refs\n        - judgment_hash\n        - authority_effect\n      - name: Refuse\n        fields:\n        - failure\n        - evidence_refs\n        - missing_requirement_refs\n        - optional_certificate_refs\n    meta_no_lift_reason:\n      variants:\n      - GaugeRemovable\n      - NoContextWitness\n      - NotPersistent\n      - NotIrreducible\n      - DeltaNotAdmissible\n      - MinimalityUnproven\n    meta_lift_plan:\n      fields:\n      - plan_id\n      - source_carrier_ref\n      - target_carrier_schema_ref\n      - obstruction_ref\n      - context_witness_ref\n      - persistence_certificate_ref\n      - irreducibility_certificate_ref\n      - minimality_certificate_ref\n      - plan_hash\n    lift_license_ref:\n      contract_ref: urn:omega:governance:lift_license:v1.0.0\n      notes: LiftLicense structure is canonically defined in lift_license.contract.yaml.\n  artifact_algebra:\n    MetaLiftRequest:\n      authority_effect: AuthorityEffect::EvidenceOnly\n      owner: MetaPlanner\n      intent: we appear to need a higher regime\n    MetaLiftPlan:\n      authority_effect: AuthorityEffect::EvidenceOnly\n      owner: LiftSubsystem\n      intent: exact proposed structural extension\n    ProposedCarrier:\n      authority_effect: AuthorityEffect::None\n      owner: LiftSubsystem\n      intent: detached result of applying lift mathematics\n    MetaLiftJudgment:\n      authority_effect: AuthorityEffect::RequestsDecision\n      owner: MetaLiftJudgment\n      intent: evidence shows proposed lift is/isn't admissible\n    LiftLicense:\n      authority_effect: AuthorityEffect::AuthorizesTransition\n      owner: LicensingBoundary\n      intent: authorizes Engine to commit proposed transition\n    EngineAction:\n      authority_effect: AuthorityEffect::StateTransition\n      owner: Engine\n      intent: durable commit of exact licensed carrier state\n  negative_capabilities:\n  - apply a lift\n  - mutate a carrier\n  - run search over sublifts\n  - schedule candidates\n  - compute operator outputs\n  - terminalize final state\n  - mint LiftLicense\n  - create certificates for unverified evidence\n  - execute Engine actions\n  - compute measurements\n  - recompute Functional outputs\n  - invoke solvers\n  - inspect mutable Engine internals\n  - emit Action directly\n  - emit StateTransition directly\n  - store or mutate Trace\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - apply_lift\n    - execute_lift\n    - mutate_carrier\n    - mint_license\n    - EngineResult\n    - StateTransition\n    - TerminalEnvelope\n    - execute(\n    - schedule_search\n    - run_search\n    - compute_operator\n    - compute_phi\n    - compute_gamma\n    - compute_xi\n    - invoke_solver\n    - terminalize(\n    - write_trace\n    - store_state\n  required_tests:\n  - meta_judgment_does_not_apply_lift\n  - meta_judgment_does_not_mutate_carrier\n  - meta_judgment_does_not_run_search\n  - meta_judgment_does_not_schedule_candidates\n  - meta_judgment_does_not_compute_operator_outputs\n  - meta_judgment_does_not_compute_measurements\n  - meta_judgment_consumes_measurement_refs_only\n  - meta_judgment_does_not_invoke_solvers\n  - meta_judgment_does_not_terminalize\n  - meta_judgment_does_not_execute_engine_actions\n  - meta_judgment_does_not_mint_license\n  - meta_lift_request_is_evidence_only\n  - lift_license_authorizes_but_does_not_execute\n  - engine_requires_lift_license_for_lift_execution\n  - binary_lift_requires_context_witness\n  - lift_without_license_rejected\n  - lift_without_persistence_certificate_rejected\n  - lift_without_irreducibility_certificate_rejected\n  - lift_without_minimality_certificate_rejected\n  - metalift_contract_does_not_self_certify_minimality\n  canonical_invariant: 'MetaLiftJudgment judges lift admissibility from submitted\n    evidence. LiftSubsystem constructs detached proposed carrier extensions. LicensingBoundary\n    alone issues LiftLicense. Engine alone commits licensed lift transitions to runtime\n    state. No Meta artifact executes, mutates, terminalizes, searches, solves, measures,\n    licenses, or self-certifies.\n\n    '\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - urn:omega:constitution:base_constitution_contract:v1.0.0\n",
