    "title": "MetaLiftJudgment",
    "kind": "constitution_contract",
    "status": "active_doctrine",
    "layer": "00_constitution",
    "role": "MetaLiftJudgment",
    "descriptor": {
      "authority_effect": "requests_decision",
      "evidence_ceiling": "ShapeOnly",
      "runtime_enforcement": true,
      "customer_claim_allowed": false,
      "dependencies": {
        "contracts": [
          "ContractConstitution"
        ],
        "proof_obligations": []
      },
      "terminals": {
        "may_emit": [],
