        "lift_license_authorizes_but_does_not_execute",
        "engine_requires_lift_license_for_lift_execution",
        "binary_lift_requires_context_witness",
        "lift_without_license_rejected",
        "lift_without_persistence_certificate_rejected",
        "lift_without_irreducibility_certificate_rejected",
        "lift_without_minimality_certificate_rejected",
        "metalift_contract_does_not_self_certify_minimality"
      ],
      "canonical_invariant": "MetaLiftJudgment judges lift admissibility from submitted evidence. LiftSubsystem constructs detached proposed carrier extensions. LicensingBoundary alone issues LiftLicense. Engine alone commits licensed lift transitions to runtime state. No Meta artifact executes, mutates, terminalizes, searches, solves, measures, licenses, or self-certifies.\n"
    },
