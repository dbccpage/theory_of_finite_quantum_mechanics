schema_version: omega.contract.v2
contract_id: urn:omega:governance:base_contract:v1.0.0
title: Root Nominal Governance Base Contract
kind: governance_contract
layer: 00_constitution
role: Constitution
status: active
council_owner: L3_logos_techne

descriptor:
  authority_effect: None
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  clean_architecture_layer: domain
  customer_claim_allowed: false
  dependencies:
    contracts: []
    lean4_theorems: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit:
      - REFUSAL_INVALID_ARGUMENTS
      - REFUSAL_GATE_FAILED
      - REFUSAL_INVARIANT_BREACH
      - REFUSAL_UNAUTHORIZED_TRANSITION
      - REFUSAL_AUTHORITY_ESCALATION

relationships:
  extends: []
  realizes: []

doctrine:
  summary: >-
    Universal nominal root base contract for all governance contracts across the
    Omega Engine ecosystem (including ASI regime, constitutional strata, and crate bindings).
    Enforces the constitutional ceiling that Markdown is declarative specification,
    AuthorityEffect is strictly None at rest, and all operational gates must reside in
    executable code with fail-closed receipts.
  invariants:
    - "AuthorityEffect is strictly None across all declarative definitions."
    - "Inheritance transfers and accumulates constraints; it never elevates authority or transfers proof status."
    - "LLM systems operate strictly as candidate generators and cannot self-certify."
    - "Artifact family boundaries are inviolable: StructureArtifact -> EvidenceEnvelope -> FactEnvelope -> DecisionEnvelope -> ActionLicense -> Action."
    - "Every terminal outcome requires an explicit typed evidence envelope and zero silent fallbacks."
  non_roles:
    - authority_source
    - self_certification_oracle
    - implicit_coercion_engine
    - promotional_amplifier
    - runtime_execution_hijack
  required_negative_capabilities:
    - no_llm_self_certification
    - no_implicit_authority_upgrade
    - no_undeclared_state_transition
    - no_unlicensed_lift
    - no_hidden_state_mutation

specification:
  algebraic_structure:
    carrier_type: NominalGovernanceCarrier
    operations: []
  ports:
    input_packet: urn:omega:packet:work_packet:v1.0.0
    output_packet: urn:omega:packet:swarm_run_receipt:v1.0.0
    error_type: Refusal
  verification:
    fitness_test: tests/test_governance_contracts_regime.py
    lean4_file: null
