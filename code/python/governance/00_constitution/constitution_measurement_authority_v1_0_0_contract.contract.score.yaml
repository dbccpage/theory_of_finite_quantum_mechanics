      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:constitution:measurement_authority:v1.0.0\",\n  \"title\": \"FunctionalMeasurementAuthority\",\n  \"kind\": \"constitution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"00_constitution\",\n  \"role\": \"Constitution\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Functional\",\n        \"Measurement\",\n        \"MeasurementAccessControl\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Only Functionals may emit canonical cohomological measurement values\\n(Phi1, Gamma2, Xi, quotient mass, closure defect, cohomological status).\\nFunctional measurement authority is not execution authority.\\n\",\n    \"non_role\": [\n      \"search access to cohomological values\",\n      \"solver emission of canonical cohomological values\",\n      \"evaluator recomputation\",\n      \"engine recomputation\",\n      \"terminalization\",\n      \"execution\"\n    ],\n    \"strict_access_law\": {\n      \"Search\": \"Forbidden from importing PhiFunctional, GammaFunctional, XiFunctional. May consume only opaque Evaluator priority hints.\",\n      \"Solver\": \"Forbidden from emitting Phi, Gamma2, Xi as canonical values. May emit solver artifacts used by Functionals.\",\n      \"Functional\": \"Sole canonical source of truth for cohomological measurements.\",\n      \"Evaluator\": \"Consumes Functional outputs and Policy. May judge but not recompute.\",\n      \"Engine\": \"Routes on typed Evaluator verdicts. May not compute, recompute, reinterpret, or scalarize cohomological values.\",\n      \"Terminalizer\": \"Consumes verified decisions and replay/certificate evidence. MUST NOT compute Phi1, Gamma2, Xi, quotient mass, closure defect, or cohomological status.\"\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"outside Functional implementation files\",\n      \"tokens\": [\n        \"PhiFunctional\",\n        \"GammaFunctional\",\n        \"XiFunctional\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"canonical_phi\",\n        \"canonical_gamma\",\n        \"canonical_xi\"\n      ]\n    },\n    \"required_tests\": [\n      \"search_cannot_import_phi_functional\",\n      \"search_cannot_import_gamma_functional\",\n      \"search_cannot_import_xi_functional\",\n      \"solver_cannot_emit_canonical_phi\",\n      \"solver_cannot_emit_canonical_gamma\",\n      \"evaluator_cannot_recompute_functional_values\",\n      \"engine_cannot_compute_functional_values\",\n      \"terminalizer_cannot_compute_functional_values\"\n    ],\n    \"canonical_invariant\": \"No canonical cohomological value exists without Functional emission.\\nNo Search access to cohomological semantics.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"FunctionalMeasurementAuthority\",\n      \"role\": \"Canonical source boundary for cohomological measurements\",\n      \"version\": \"2.0\",\n      \"classification\": \"constitution\",\n      \"split_from\": \"authority_contract.md (lines 1-110)\",\n      \"doctrine_version\": \"2026-05\",\n      \"depends_on\": [\n        \"Functional\",\n        \"Measurement\",\n        \"MeasurementAccessControl\"\n      ],\n      \"forbidden_authority\": [\n        \"search access to cohomological values\",\n        \"solver emission of canonical cohomological values\",\n        \"evaluator recomputation\",\n        \"engine recomputation\",\n        \"terminalization\",\n        \"execution\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"MeasurementAccessRule\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"FunctionalAuthorityRule\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_constitution_contract:v1.0.0\"\n    ],\n    \"coalescence_mode\": \"specializes\",\n    \"coalesces_with\": [\n      \"urn:omega:evidence:measurement_kernel:v1.0.0\"\n    ]\n  }\n}\n",
