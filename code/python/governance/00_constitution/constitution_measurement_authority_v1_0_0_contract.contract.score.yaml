        "Functional": "Sole canonical source of truth for cohomological measurements.",
        "Evaluator": "Consumes Functional outputs and Policy. May judge but not recompute.",
        "Engine": "Routes on typed Evaluator verdicts. May not compute, recompute, reinterpret, or scalarize cohomological values.",
        "Terminalizer": "Consumes verified decisions and replay/certificate evidence. MUST NOT compute Phi1, Gamma2, Xi, quotient mass, closure defect, or cohomological status."
      },
