      "semantic_creation_doctrine": "Semantic creation is allowed only through declared and checked boundaries:\ndeclared input structure, declared witnesses, declared certificates, declared\nevaluators, declared policies, declared licenses, approved MetaJudgment,\nEngine-executed licensed transition. Anything else is semantic smuggling.\n",
