            "policy_branching",
            "terminalization"
          ]
        },
        "ForgetfulBoundary": {
          "owns": "lawful_information_forgetting",
          "emits": "EvidenceEnvelope",
          "authority_effect": "EvidenceOnly",
          "forbidden": [
            "silent_compression",
            "equivalence_claim",
            "terminalization",
            "execution"
          ]
        },
