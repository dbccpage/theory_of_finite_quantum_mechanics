        "taxonomy_rejects_semantic_creation_without_license_or_metalift"
      ],
      "canonical_invariant": "Structure supports evidence. Checked evidence supports facts. Facts support decisions.\nDecisions support licenses. Licenses authorize actions. The Engine executes actions.\nRecords record all and control none.\n",
