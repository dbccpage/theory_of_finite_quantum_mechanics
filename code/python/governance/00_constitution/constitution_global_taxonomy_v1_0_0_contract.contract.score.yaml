      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:constitution:global_taxonomy:v1.0.0\ntitle: GlobalContractTaxonomy\nkind: constitution_contract\nstatus: mathematical_wip\nlayer: 00_constitution\nrole: Constitution\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - ContractConstitution\n    - GlobalConventions\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This taxonomy defines artifact family separation, the authority graph,\n    canonical\n\n    AuthorityEffect, fixed-layer operator effect classes (E/I/C/R/M), role boundary\n\n    taxonomy, core operational entities, and semantic creation doctrine.\n\n    '\n  non_role: &id002\n  - artifact family collapse\n  - evidence fact collapse\n  - license action collapse\n  - hidden semantic creation\n  - unlicensed authority escalation\n  - local authority effect enum\n  - local artifact family enum\n  - operator effect taxonomy redefinition\n  artifact_families:\n    StructureArtifact:\n      description: Inert declared structure\n      examples:\n      - BaseType\n      - Carrier\n      - Presheaf\n      - Section\n      - Quotient\n      - Operator schema\n      - Lift schema\n      - Obstruction schema\n      - Contract schema\n    EvidenceEnvelope:\n      description: Evidence-bearing artifact that has not yet become a fact\n      examples:\n      - GeneratedOutput\n      - ParsedPacket\n      - CheckedPacket\n      - WitnessEnvelope\n      - CandidatePacket\n      - ReplayEvidence\n      - MeasurementEvidence\n      - SolverEvidence\n    FactEnvelope:\n      description: Checked factual output requiring later judgment before decision\n        or action\n      examples:\n      - ObservableOutput\n      - MeasurementEnvelope\n      - FunctionalOutput after checking\n      - AnalysisOutput\n      - DiagnosticReport\n      - SolverOutput after checking\n      - CertificateEnvelope\n      - ReplayReport\n      - TraceFact\n    DecisionEnvelope:\n      description: Typed judgment output\n      examples:\n      - EvaluationResult\n      - PolicyDecisionEnvelope\n      - MetaDecision\n      - TerminalEnvelope\n    ActionLicense:\n      description: Authority-bearing license that permits but does not execute a transition\n      examples:\n      - LiftLicense\n      - TransitionLicense\n      - OperatorApplicationLicense\n      - RollbackLicense\n    Action:\n      description: Executed state transition\n      examples:\n      - Engine state transition\n      - licensed operator application\n      - licensed lift application\n      - rollback application\n    Record:\n      description: Immutable history\n      examples:\n      - TraceArtifact\n      - TraceBundle\n      - Ledger row\n      - retention trace\n  authority_graph:\n    valid_flow: StructureArtifact -> EvidenceEnvelope -> FactEnvelope -> DecisionEnvelope\n      -> ActionLicense -> Action\n    record_flow: Record records all artifact families.\n    forbidden_flow:\n    - EvidenceEnvelope -> FactEnvelope without checking\n    - FactEnvelope -> EvidenceEnvelope by erasing judgment\n    - DecisionEnvelope -> Action without license\n    - ActionLicense -> Action without Engine execution\n    - FactEnvelope -> Action\n    - StructureArtifact -> Action\n    - Record -> Action\n    - Record -> PolicyDecision\n    - TraceArtifact -> hidden execution\n    - CertificateEnvelope -> authority above attached evidence\n  fixed_layer_operator_effect_classes:\n    E:\n      name: exact repair\n      description: Certified fixed-layer reduction of obstruction\n    I:\n      name: quotient isometry\n      description: Representation change preserving quotient obstruction geometry\n    C:\n      name: context embedding\n      description: Declared embedding into an admissible context\n    R:\n      name: residual projection\n      description: Deterministic projection to residual representative under declared\n        TiePolicy\n    M:\n      name: refused mutation\n      description: Refusal class for invalid, unlicensed, or authority-insufficient\n        mutation\n  role_boundary_taxonomy:\n  - Intake\n  - RepresentationBoundary\n  - Parser\n  - PacketValidator\n  - Observable\n  - Functional\n  - Solver\n  - SearchGenerator\n  - Certifier\n  - Evaluator\n  - Policy\n  - Terminalizer\n  - LicensingBoundary\n  - Engine\n  - Trace\n  - Replay\n  - StorageBoundary\n  core_operational_entities:\n    Evaluator:\n      owns: admissibility_judgment_over_evidence\n      emits: FactEnvelope or DecisionEnvelope\n      authority_effect: RequiresEvaluator or RequestsDecision\n      forbidden:\n      - state_mutation\n      - structure_discovery\n      - terminalization\n      - execution\n    Diagnostic:\n      owns: health_checks\n      emits: FactEnvelope\n      authority_effect: EvidenceOnly -> FactOnly\n      forbidden:\n      - state_mutation\n      - policy_judgment\n      - terminalization\n      - execution\n      - action_prescription\n    RepresentationBoundary:\n      owns: representation_transport\n      emits: StructureArtifact or EvidenceEnvelope\n      authority_effect: None or EvidenceOnly\n      forbidden:\n      - meaning_creation\n      - evaluation\n      - terminalization\n      - execution\n    DeclaredMorphism:\n      owns: declared_local_morphism\n      emits: StructureArtifact or EvidenceEnvelope\n      authority_effect: None or EvidenceOnly\n      forbidden:\n      - hidden_lift\n      - state_mutation_without_return\n      - policy_branching\n      - terminalization\n    ForgetfulBoundary:\n      owns: lawful_information_forgetting\n      emits: EvidenceEnvelope\n      authority_effect: EvidenceOnly\n      forbidden:\n      - silent_compression\n      - equivalence_claim\n      - terminalization\n      - execution\n    GaugeEquivalence:\n      owns: zero_cost_same_carrier_equivalence\n      emits: EvidenceEnvelope\n      authority_effect: EvidenceOnly -> FactOnly after certified check\n      forbidden:\n      - semantic_injection\n      - topology_change\n      - carrier_change\n      - true_obstruction_reduction\n    ReflectionBoundary:\n      owns: quotation_reflection_boundary\n      emits: EvidenceEnvelope or FactEnvelope\n      authority_effect: EvidenceOnly or AuthorizesTransition for license artifact\n      forbidden:\n      - execution\n      - scheduling\n      - hidden_decode\n      - terminalization\n    Policy:\n      owns: typed_admissibility_classification\n      emits: PolicyDecisionEnvelope\n      authority_effect: RequestsDecision\n      forbidden:\n      - metric_computation\n      - solver_invocation\n      - ranking\n      - terminalization\n      - execution\n    Terminalizer:\n      owns: terminal_mapping_from_verified_evidence\n      emits: TerminalEnvelope or ActionLicense\n      authority_effect: RequestsDecision or AuthorizesTransition\n      forbidden:\n      - metric_computation\n      - policy_interpretation\n      - certificate_creation\n      - storage_mutation\n      - execution\n    Engine:\n      owns: certified_state_transition\n      emits: Action\n      authority_effect: StateTransition\n      forbidden:\n      - direct_metric_computation\n      - policy_interpretation\n      - certificate_signing\n      - terminalization_internally\n    Pipeline:\n      owns: stage_graph_orchestration\n      emits: Record or None\n      authority_effect: None or EvidenceOnly\n      forbidden:\n      - operator_execution\n      - certificate_creation\n    Trace:\n      owns: immutable_causal_record\n      emits: Record\n      authority_effect: EvidenceOnly or FactOnly\n      forbidden:\n      - execution_trigger\n      - policy_rule\n      - hidden_cache\n      - post_hoc_enrichment\n      - authority_upgrade\n    Replay:\n      owns: deterministic_reconstruction\n      emits: EvidenceEnvelope or FactEnvelope\n      authority_effect: EvidenceOnly -> FactOnly after replay checking\n      forbidden:\n      - live_execution\n      - speculative_execution\n      - trace_mutation\n      - terminalization\n    Certificate:\n      owns: claim_evidence_binding\n      emits: CertificateEnvelope\n      authority_effect: EvidenceOnly or FactOnly bounded by evidence\n      forbidden:\n      - authorization\n      - terminalization\n      - execution\n      - authority_above_evidence\n    SearchGenerator:\n      owns: candidate_proposal_generation\n      emits: CandidatePacket\n      authority_effect: None or EvidenceOnly\n      forbidden:\n      - evaluation\n      - certification\n      - terminalization\n      - transition_authorization\n      - execution\n    Solver:\n      owns: declared_computation\n      emits: SolverOutput\n      authority_effect: EvidenceOnly -> FactOnly after checking\n      forbidden:\n      - policy_interpretation\n      - transition_authorization\n      - terminalization\n      - execution\n    Observable:\n      owns: primitive_measurement_extraction\n      emits: ObservableOutput\n      authority_effect: EvidenceOnly -> FactOnly after checking\n      forbidden:\n      - evaluation\n      - policy_interpretation\n      - terminalization\n      - execution\n    Functional:\n      owns: deterministic_mathematical_measurement_composition\n      emits: MeasurementEnvelope\n      authority_effect: EvidenceOnly -> FactOnly after checking\n      forbidden:\n      - judgment\n      - ranking\n      - search\n      - scheduling\n      - terminalization\n      - transition_authorization\n      - execution\n    PacketValidator:\n      owns: grammar_schema_carrier_representation_checks\n      emits: CheckedPacket\n      authority_effect: EvidenceOnly\n      forbidden:\n      - semantic_truth_claim\n      - evaluation\n      - policy_interpretation\n      - terminalization\n      - execution\n    LicensingBoundary:\n      owns: transition_authorization\n      emits: ActionLicense\n      authority_effect: AuthorizesTransition\n      forbidden:\n      - execution\n      - state_mutation\n      - evidence_fabrication\n  semantic_creation_doctrine: 'Semantic creation is allowed only through declared\n    and checked boundaries:\n\n    declared input structure, declared witnesses, declared certificates, declared\n\n    evaluators, declared policies, declared licenses, approved MetaJudgment,\n\n    Engine-executed licensed transition. Anything else is semantic smuggling.\n\n    '\n  required_tests:\n  - taxonomy_defines_all_artifact_families\n  - taxonomy_defines_evidence_fact_license_action_separation\n  - taxonomy_defines_canonical_authority_effect\n  - taxonomy_rejects_local_authority_effect_enums\n  - taxonomy_rejects_local_artifact_family_enums\n  - taxonomy_rejects_operator_effect_redefinition\n  - taxonomy_rejects_evidence_to_fact_without_checking\n  - taxonomy_rejects_fact_to_action_direct_flow\n  - taxonomy_rejects_decision_to_action_without_license\n  - taxonomy_rejects_license_self_execution\n  - taxonomy_rejects_record_control_flow\n  - taxonomy_rejects_trace_hidden_execution\n  - taxonomy_rejects_certificate_authority_above_evidence\n  - taxonomy_rejects_semantic_creation_without_license_or_metalift\n  canonical_invariant: 'Structure supports evidence. Checked evidence supports facts.\n    Facts support decisions.\n\n    Decisions support licenses. Licenses authorize actions. The Engine executes actions.\n\n    Records record all and control none.\n\n    '\n  legacy_metadata:\n    name: GlobalContractTaxonomy\n    role: Artifact family and authority taxonomy with entity classification\n    version: '2.0'\n    classification: constitution\n    split_from: contract_constitution.md (lines 944-1210)\n    doctrine_version: 2026-05\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: StructureArtifact\n    domain_output_kind: TaxonomyRule\n    referenced_output_families:\n    - StructureArtifact\n    referenced_domain_kinds:\n    - AuthorityGraph\n    llm_forbidden:\n    - measurement\n    - evaluation\n    - certification\n    - signing\n    - storage\n    - policy definition\n    - solving\n    - terminalization\n    - transition authorization\n    - execution\n    - authority promotion\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n",
