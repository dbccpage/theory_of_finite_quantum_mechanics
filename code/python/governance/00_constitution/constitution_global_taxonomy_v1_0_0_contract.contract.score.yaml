          "authority_effect": "EvidenceOnly -> FactOnly after certified check",
          "forbidden": [
            "semantic_injection",
            "topology_change",
            "carrier_change",
            "true_obstruction_reduction"
          ]
        },
        "ReflectionBoundary": {
          "owns": "quotation_reflection_boundary",
          "emits": "EvidenceEnvelope or FactEnvelope",
          "authority_effect": "EvidenceOnly or AuthorizesTransition for license artifact",
          "forbidden": [
            "execution",
            "scheduling",
            "hidden_decode",
            "terminalization"
          ]
        },
        "Policy": {
          "owns": "typed_admissibility_classification",
          "emits": "PolicyDecisionEnvelope",
          "authority_effect": "RequestsDecision",
          "forbidden": [
            "metric_computation",
            "solver_invocation",
            "ranking",
            "terminalization",
            "execution"
          ]
        },
        "Terminalizer": {
          "owns": "terminal_mapping_from_verified_evidence",
          "emits": "TerminalEnvelope or ActionLicense",
          "authority_effect": "RequestsDecision or AuthorizesTransition",
          "forbidden": [
            "metric_computation",
            "policy_interpretation",
            "certificate_creation",
            "storage_mutation",
            "execution"
          ]
        },
