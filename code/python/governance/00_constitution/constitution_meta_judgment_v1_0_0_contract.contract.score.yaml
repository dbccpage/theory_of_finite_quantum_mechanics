      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:constitution:meta_judgment:v1.0.0\",\n  \"title\": \"MetaJudgmentAndMetaLift\",\n  \"kind\": \"constitution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"00_constitution\",\n  \"role\": \"Constitution\",\n  \"descriptor\": {\n    \"authority_effect\": \"requests_decision\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"ContractConstitution\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"MetaJudgment = read-only governance judgment over lift admissibility and authority\\nconditions. MetaLiftContract = lift-license artifact or proposed lift contract.\\nEngine = only executor of licensed lift transitions.\\n\",\n    \"non_role\": [\n      \"lift application\",\n      \"carrier mutation\",\n      \"search execution\",\n      \"candidate scheduling\",\n      \"operator computation\",\n      \"solver computation\",\n      \"measurement computation\",\n      \"evaluator recomputation\",\n      \"terminalization\",\n      \"certificate creation for unverified evidence\",\n      \"certificate authority above attached evidence\",\n      \"engine action execution\",\n      \"trace mutation\",\n      \"storage mutation\",\n      \"unlicensed carrier extension\",\n      \"self-certification of minimality\"\n    ],\n    \"two_forms\": {\n      \"MetaJudgment\": \"Read-only 2-morphism-like governance over contracts, operators, and traces. Validates admissibility and composability.\",\n      \"MetaLiftContract\": \"Licensed boundary artifact describing an admissible carrier-extension transition L_h : C_N -> C_{N+1}. Does not execute.\"\n    },\n    \"minimality_enforcement\": {\n      \"conditions\": [\n        \"sim_{N+1} is a congruence\",\n        \"For all L' subset L_h, sim_{N+1}^{L'} is not a congruence\"\n      ],\n      \"mechanisms\": {\n        \"repair_enabling\": \"A lift is invalid unless obstruction equivalence becomes a congruence after the lift.\",\n        \"delta_law\": \"Unary lift (Delta=1) iff already a congruence but names lacking. Binary lift (Delta=2) iff not a congruence. Higher-arity lifts presently unlicensed.\",\n        \"context_witnessed\": \"Binary lift admissible only when an admissible context C[_] distinguishes the irreducible failure.\"\n      }\n    },\n    \"area_lock_phase_gate\": \"If m_G(gamma) > 0, the evidence may support irreducibility under the declared gauge\\nmodel. A lift still requires persistence, context witness, license, minimality evidence,\\nand Engine execution boundary. MetaJudgment may consume checked MeasurementId references\\nbut MUST NOT compute or recompute measurements.\\n\",\n    \"failure_classes\": [\n      {\n        \"name\": \"Authority failure\",\n        \"description\": \"Licensed lift claimed but no governance license permits it.\"\n      },\n      {\n        \"name\": \"Representation failure\",\n        \"description\": \"No admissible representation expansion reduces the obstruction.\"\n      },\n      {\n        \"name\": \"Evidence failure\",\n        \"description\": \"Claim cannot survive forgetful descent due to missing/revoked evidence.\"\n      }\n    ],\n    \"structural_representation\": {\n      \"meta_decision\": {\n        \"variants\": [\n          {\n            \"name\": \"NoLift\",\n            \"fields\": [\n              \"reason\",\n              \"evidence_refs\"\n            ]\n          },\n          {\n            \"name\": \"LiftAdmissible\",\n            \"fields\": [\n              \"license\",\n              \"contract_ref\",\n              \"evidence_refs\"\n            ]\n          },\n          {\n            \"name\": \"Refuse\",\n            \"fields\": [\n              \"failure\",\n              \"certificate_ref\"\n            ]\n          }\n        ]\n      },\n      \"meta_no_lift_reason\": {\n        \"variants\": [\n          \"GaugeRemovable\",\n          \"NoContextWitness\",\n          \"NotPersistent\",\n          \"NotIrreducible\",\n          \"LicenseMissing\",\n          \"DeltaNotAdmissible\"\n        ]\n      },\n      \"meta_lift_contract\": {\n        \"fields\": [\n          \"source_carrier\",\n          \"target_carrier_schema\",\n          \"obstruction_ref\",\n          \"context_witness\",\n          \"persistence_certificate\",\n          \"irreducibility_certificate\",\n          \"minimality_certificate\",\n          \"delta\",\n          \"contract_hash\"\n        ]\n      },\n      \"lift_license\": {\n        \"fields\": [\n          \"license_id\",\n          \"contract_ref\",\n          \"authority_refs\",\n          \"evidence_refs\",\n          \"authority_effect\"\n        ]\n      },\n      \"lift_delta\": {\n        \"variants\": [\n          \"UnaryName\",\n          \"BinaryConjugatePair\"\n        ]\n      }\n    },\n    \"authority_effect_mapping\": {\n      \"MetaJudgment\": \"RequestsDecision\",\n      \"unchecked_MetaLiftRequest\": \"EvidenceOnly\",\n      \"checked_MetaLiftContract_LiftLicense\": \"AuthorizesTransition\",\n      \"Engine\": \"StateTransition\",\n      \"Pipeline\": \"None or EvidenceOnly\"\n    },\n    \"anti_god_object_law\": \"producer != judge != executor\",\n    \"negative_capabilities\": [\n      \"apply a lift\",\n      \"mutate a carrier\",\n      \"run search\",\n      \"schedule candidates\",\n      \"compute operator outputs\",\n      \"terminalize final state\",\n      \"create certificates for unverified evidence\",\n      \"execute Engine actions\",\n      \"compute measurements\",\n      \"recompute Functional outputs\",\n      \"invoke solvers\",\n      \"inspect mutable Engine internals\",\n      \"emit Action directly\",\n      \"emit StateTransition directly\",\n      \"store or mutate Trace\"\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"apply_lift\",\n        \"execute_lift\",\n        \"mutate_carrier\",\n        \"EngineResult\",\n        \"StateTransition\",\n        \"TerminalEnvelope\",\n        \"execute(\",\n        \"schedule_search\",\n        \"run_search\",\n        \"compute_operator\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"invoke_solver\",\n        \"terminalize(\",\n        \"write_trace\",\n        \"store_state\"\n      ]\n    },\n    \"required_tests\": [\n      \"meta_judgment_does_not_apply_lift\",\n      \"meta_judgment_does_not_mutate_carrier\",\n      \"meta_judgment_does_not_run_search\",\n      \"meta_judgment_does_not_schedule_candidates\",\n      \"meta_judgment_does_not_compute_operator_outputs\",\n      \"meta_judgment_does_not_compute_measurements\",\n      \"meta_judgment_consumes_measurement_refs_only\",\n      \"meta_judgment_does_not_invoke_solvers\",\n      \"meta_judgment_does_not_terminalize\",\n      \"meta_judgment_does_not_execute_engine_actions\",\n      \"meta_lift_request_is_evidence_only\",\n      \"lift_license_authorizes_but_does_not_execute\",\n      \"engine_requires_lift_license_for_lift_execution\",\n      \"binary_lift_requires_context_witness\",\n      \"lift_without_license_rejected\",\n      \"lift_without_persistence_certificate_rejected\",\n      \"lift_without_irreducibility_certificate_rejected\",\n      \"lift_without_minimality_certificate_rejected\",\n      \"metalift_contract_does_not_self_certify_minimality\"\n    ],\n    \"canonical_invariant\": \"MetaJudgment judges lift admissibility from submitted evidence. MetaLiftContract\\ndescribes a carrier-extension transition. LiftLicense authorizes the Engine to attempt\\nthat transition. Engine alone executes licensed lift transitions. No Meta artifact\\nexecutes, mutates, terminalizes, searches, solves, measures, or self-certifies.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"MetaJudgmentAndMetaLift\",\n      \"role\": \"Meta layer governance boundary - judgment and lift licensing\",\n      \"version\": \"2.0\",\n      \"classification\": \"constitution\",\n      \"split_from\": \"contract_constitution.md (lines 247-757)\",\n      \"doctrine_version\": \"2026-05\",\n      \"depends_on\": [\n        \"ContractConstitution\"\n      ],\n      \"forbidden_authority\": [\n        \"lift application\",\n        \"carrier mutation\",\n        \"search execution\",\n        \"candidate scheduling\",\n        \"operator computation\",\n        \"solver computation\",\n        \"measurement computation\",\n        \"evaluator recomputation\",\n        \"terminalization\",\n        \"certificate creation for unverified evidence\",\n        \"certificate authority above attached evidence\",\n        \"engine action execution\",\n        \"trace mutation\",\n        \"storage mutation\",\n        \"unlicensed carrier extension\",\n        \"self-certification of minimality\"\n      ],\n      \"primary_output_family\": \"DecisionEnvelope\",\n      \"referenced_output_families\": [\n        \"ActionLicense\",\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
