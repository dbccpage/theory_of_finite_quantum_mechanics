    "doctrine": {
      "summary": "These conventions apply to all Omega Engine contracts and Rust implementations.\nThey define how contract laws become enforceable code, tests, and typed APIs.\nThese conventions do not define artifact families, authority effects, or authority\nflow. Those are owned by the ContractConstitution and GlobalContractTaxonomy.\n",
      "non_role": [
        "unchecked law claims",
        "implicit partial APIs",
        "hidden runtime validation",
        "untyped invariants",
        "silent evidence promotion",
        "authority-changing conventions",
        "convention-defined local taxonomy"
      ],
      "pattern_a_algebraic_laws_as_property_tests": "For any law like associativity, identity, functor laws, d^2=0, etc.:\n- Provide a Law module with proptests or deterministic finite checks.\n- Provide witness constructors for small counterexamples in debug builds.\n- Keep the law documented on the trait and testable via helpers.\nEvery algebraic law MUST have at least one of: deterministic finite law check,\nproperty test, witness-based counterexample test, replayable certificate verification.\n",
      "pattern_b_invariants_as_types": "Prefer checked constructors. Invalid states should be unrepresentable when practical.\nIf invalid states cannot be made unrepresentable, the contract MUST name the Validator\nthat rejects them. Validators prove shape, domain, or representation admissibility\nonly. They MUST NOT upgrade authority unless the validator contract explicitly owns\nthat checked boundary.\n",
      "pattern_c_total_vs_partial_apis": "For operations that may fail:\n- Provide try_* returning Result<_, Error>\n- Provide *_unchecked behind unsafe or internal modules\n- Make domain constraints explicit\nNo public contract API may silently clamp, coerce, repair, infer, fabricate, or\ndefault missing evidence.\n",
      "pattern_d_canonical_hashing": "Every replay-relevant artifact MUST expose an artifact-specific canonical hash set.\nAt minimum: input_hash, output_hash.\nWhen relevant: config_hash, schema_hash, evidence_hash, trace_hash.\nHashes MUST be computed from canonical serialization.\nHash presence proves replay identity only. It does not prove semantic truth or authority.\n",
      "pattern_e_negative_capability_tests": "Every contract MUST include tests proving what the component cannot do.\nRequired categories when applicable: does not mutate, does not execute, does not\nterminalize, does not license transitions, does not authorize transitions, does not\ncreate certificates, does not upgrade evidence authority, does not interpret policy,\ndoes not call solvers unless explicitly declared, does not inspect forbidden\nmeasurements, does not perform hidden service lookup, does not emit multiple primary\nartifact families, same input produces same output hash.\n",
      "pattern_f_service_boundary_calls": {
        "forbidden": [
          "direct cross-layer import",
          "hidden global registry access",
          "ambient runtime lookup",
          "database handle hidden in BaseType",
          "implicit engine handle",
          "implicit policy handle",
          "implicit terminalizer handle",
          "implicit certificate signer",
          "implicit solver backend"
        ],
        "allowed": [
          "declared service trait",
          "typed artifact reference",
          "certificate reference",
          "witness reference",
          "replay manifest reference",
          "checked packet reference",
          "measurement envelope reference",
          "action license reference"
        ]
      },
      "pattern_g_fail_closed": "Ambiguous, missing, malformed, or unverifiable evidence MUST fail closed.\nFail closed means: return typed error, emit invalid/indeterminate report, emit\nrefusal where the role owns refusal, do not repair silently, do not promote evidence\nauthority, do not proceed by default, do not substitute policy defaults unless\ndeclared by policy contract.\n",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "unwrap_authority",
          "default_if_missing",
          "silent_clamp",
          "implicit_coerce",
          "implicit_infer",
          "auto_repair",
          "auto_certify",
          "auto_license",
          "auto_execute",
          "global_registry_lookup",
          "ambient_runtime_lookup",
          "unchecked_public",
          "hidden_service_lookup",
          "promote_evidence",
          "authority_upgrade"
        ]
      },
      "required_tests": [
        "laws_have_property_or_finite_tests",
        "prose_only_law_is_rejected",
        "partial_api_uses_try_prefix_or_result",
        "unchecked_api_not_public",
        "public_api_does_not_silently_clamp_coerce_or_repair",
        "replay_artifacts_have_hashes",
        "canonical_serialization_hash_stable",
        "hash_presence_does_not_imply_truth",
        "negative_capability_tests_declared",
        "missing_evidence_fails_closed",
        "fail_closed_does_not_promote_authority",
        "service_calls_use_declared_interfaces",
        "hidden_service_lookup_rejected"
      ],
      "canonical_invariant": "Contract laws must become typed APIs, property tests, finite checks, hashes, witnesses,\ncertificates, replay checks, or explicit fail-closed errors. Conventions enforce\nauthority boundaries but do not define new authority.\n",
