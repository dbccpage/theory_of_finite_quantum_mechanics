      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:binary_degree_functional:v1.0.0\",\n  \"title\": \"Binary (F₂) Φ₁ and Γ₂ specializations and integer triangle-face Γ₂\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1:v1.0.0\",\n        \"urn:omega:math:gamma2_closure_defect:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"binary_degree_functionals\",\n    \"symbol\": \"Φ₁, Γ₂ over F₂\",\n    \"ascii_symbol\": \"BinaryDegree\",\n    \"notation\": \"Φ₁(r) = min_{x ∈ F₂^n} |r + d₀x|_H;  Γ₂(r) = |d₁r|_H;  Γ₂(face) = |ab + bc + ca|; BinaryDegreeFunctional only measures chain composites and exposes binary carrier helpers\",\n    \"domain\": [\n      \"row-major F₂ matrices d₀ (m × n) and d₁, given as Vec<Vec<bool>>\",\n      \"binary residual r ∈ F₂^m\",\n      \"three orientation-adjusted i64 edge coefficients per triangle face (integer path)\"\n    ],\n    \"codomain\": {\n      \"description\": \"Phi1Functional and Gamma2Functional return exact usize Hamming values or a typed BinaryDegreeError. Gamma2Functional returns exact i64/u64 values or IntegerGamma2Error::CapacityOverflow.\"\n    },\n    \"definition\": {\n      \"phi1\": \"Hamming distance from r to im(d₀) over F₂, by exhaustive search over F₂^n when n ≤ 20\",\n      \"gamma2\": \"Hamming weight of d₁r over F₂\",\n      \"image_membership\": \"Gaussian elimination over F₂ on the augmented matrix [d₀ | r]\",\n      \"chain_composite_weight\": \"number of nonzero entries of a supplied d₁d₀ matrix\",\n      \"integer_face\": \"closure = ab + bc + ca (checked i64); face Γ₂ = |closure|; total = checked u64 sum\"\n    }\n  },\n  \"laws\": [\n    \"Exhaustive Φ₁ law: for n ≤ 20 (MAX_EXHAUSTIVE_BINARY_DOMAIN_DIM) every x ∈ F₂^n is tried, so the returned value is the exact minimum Hamming distance.\",\n    \"Bounded fallback law: for n > 20, Φ₁ is returned only when r ∈ im(d₀) (value 0) or r has Hamming weight at most 1 (value equal to that weight). Every other input is refused with ExhaustiveSearchTooLarge, never approximated.\",\n    \"Γ₂ law: Γ₂ is the Hamming weight of d₁r on the supplied binary C² carrier. It is a different functional from Φ₁, computed by a separate routine.\",\n    \"Composite fence: chain_composite_weight counts chain-law violations in a supplied d₁d₀. It is not Φ₁ and does not build the composite.\",\n    \"Shape law: ragged matrices and inputs of the wrong length are refused with typed errors.\",\n    \"Integer overflow law: the triangle closure and the face total use checked arithmetic and refuse on overflow instead of wrapping.\",\n    \"Exactness law: F₂ values are bool and integer values are checked i64/u64; there is no floating-point path.\",\n    \"Authority law: no value from this module mints AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Deterministic exhaustive enumeration order over F₂^n\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"binary_degree\",\n    \"symbols\": [\n      \"MAX_EXHAUSTIVE_BINARY_DOMAIN_DIM\",\n      \"BinaryDegreeError\",\n      \"BinaryDegreeFunctional\"\n    ],\n    \"required_tests\": [\n      \"composite_weight_is_shape_checked_and_separate_from_phi1\",\n      \"integer_face_gamma2_detects_arithmetic_overflow\",\n      \"binary_quotient_and_closure_have_distinct_values\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A ragged composite matrix must be rejected, and composite weight is not Φ₁\",\n    \"Integer face closure overflow must be refused, not wrapped\"\n  ],\n  \"doctrine\": {\n    \"binding_review_20261014\": \"The integer Gamma2 refusal type is declared in omega_functional::gamma2, not binary_degree. This binding covers binary_degree only; the Gamma2 dependency remains declared separately.\",\n    \"summary\": \"Phi1Functional owns the exact F₂ arithmetic for Φ₁ (Hamming distance to im(d₀), exhaustive up to 20 source dimensions, fail-closed beyond). Gamma2Functional owns binary Γ₂ (Hamming weight of d₁r) and checked integer Γ₂ on oriented triangle faces. Callers may build cochains but should not recompute these values elsewhere. Nonclaim: no search beyond the declared bound; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Φ₁ over ℚ or ℝ, or a primal-dual certificate\",\n      \"Approximate Φ₁ above the exhaustive bound\",\n      \"Cochain construction or carrier declaration\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION untested_paths: the n > 20 fallback, ExhaustiveSearchTooLarge, InputDimensionMismatch, is_in_image and Gamma2Functional::checked_total overflow have no dedicated unit test here; omega_discrete_deformation_algebra exercises some of them through its degree tower; AuthorityEffect: None.\"\n  ]\n}\n",
