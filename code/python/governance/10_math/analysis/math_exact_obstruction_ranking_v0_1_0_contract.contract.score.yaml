      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_obstruction_ranking:v0.1.0\",\n  \"title\": \"Exact Deterministic Obstruction Ranking\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_obstruction_ranking\",\n    \"symbol\": \"exact_obstruction_ranking\",\n    \"ascii_symbol\": \"exact_obstruction_ranking\",\n    \"notation\": \"Exact Deterministic Obstruction Ranking\",\n    \"domain\": [\n      \"Rational Phi1 and Gamma2, optional rational Xi, labels and input positions\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact finite constructions implemented by omega_policy::evaluation_hierarchy; results remain scoped to the declared carrier and budgets.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Exact arithmetic and explicit finite carrier validation\",\n      \"A typed refusal for unsupported or exhausted computations\"\n    ]\n  },\n  \"laws\": [\n    \"Ranking is a transitive total order by Phi1, Gamma2, declared Xi before absent Xi, label and position\",\n    \"Ranking does not certify strict improvement or feasibility\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact independent witness replay where a witness is returned\"\n    ]\n  },\n  \"relationships\": {\