_strictly_schur_concave_on_every_grid_pair\",\n      \"mutual_information_is_the_relative_entropy_to_the_product_of_marginals\",\n      \"total_correlation_vanishes_exactly_when_the_table_factors\",\n      \"relative_entropy_is_nonnegative_zero_only_on_equal_distributions_and_above_pinsker\",\n      \"relative_entropy_does_not_increase_under_a_stochastic_map\",\n      \"renyi_entropies_decrease_with_the_order_and_are_constant_exactly_on_uniform_supports\",\n      \"local_stochastic_maps_do_not_increase_the_mutual_information\",\n      \"the_conditional_entropy_vanishes_exactly_when_b_is_a_function_of_a\"\n    ]\n  },\n  \"negative_tests\": [\n    \"The logarithm of zero or of a negative rational must be refused\",\n    \"A value declared prime that is not prime must be refused\",\n    \"A cofactor that trial division cannot certify must be refused as undecided, and a larger declared bound must decide it\",\n    \"Zero has no factorisation, and a trial-division bound above the maximum must be refused\",\n    \"An enclosure precision above the maximum must be refused\",\n    \"A sign that the declared precision does not separate from zero must be refused, not guessed\",\n    \"A relative entropy with q_i = 0 and p_i > 0, or between distributions of different sizes, must be refused\"\n  ],\n  \"doctrine\": {\n    \"binding_review_20261014\": \"Integer factorization delegates to omega_number_theory::integer_factorization::factor_natural; factor_integer is not an export of this module.\",\n    \"summary\": \"Entropies of rational distributions are exact rational combinations of logarithms of primes, so equality, cancellation and the vanishing of an entropy are decided by comparing coefficient maps. Real values are certified by exact rational enclosures and forms are ordered by certified sign, with typed refusals where the declared bound or precision is insufficient. The enclosure series is a stand-in for the certified logarithm of omega_kernel and is isolated in one private function.\",\n    \"non_role\": [\n      \"Transcendence of entropies (the Baker-type statement that a nonzero form has transcendental value is a cited theorem, not computed here)\",\n      \"Von Neumann entropy of a quantum state\",\n      \"Floating-point entropy or numerical optimisation\",\n      \"Differential entropy\"\n    ]\n  },\n  \"wip\": [\n    \"ln_integer_bounds is a private atanh series with range reduction by a power of two; it is to be replaced by the certified logarithm enclosure of omega_kernel when that exists\",\n    \"Only trial division with Miller-Rabin on 64 bits is provided; Pollard rho or ECM for larger cofactors is not implemented and such cofactors are refused\",\n    \"Renyi entropies of non-integer order are not forms (the power sum is irrational) and are not provided\",\n    \"The density-matrix (quantum) entropy is not here; the spectrum of a rational Hermitian matrix would feed shannon_entropy_form from omega_quantum_physics\"\n  ]\n}\n",
