products and vector-length extensions refuse integer overflow even under an explicitly unlimited policy\",\n    \"The quantum and holonomy presets preserve their distinct memory ceilings\",\n    \"A refusal leaves the caller buffer unchanged\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_kernel\",\n    \"module\": \"resource_limits\",\n    \"symbols\": [\n      \"OperationLimits\",\n      \"ResourceError\",\n      \"check_and_reserve\"\n    ],\n    \"required_tests\": [\n      \"shared_resource_policies_preserve_limits_and_refuse_overflow_even_when_unbounded\",\n      \"hilbert_dimension_is_checked_against_zero_and_the_ceiling\",\n      \"reserve_refuses_length_arithmetic_that_overflows\",\n      \"reserve_refuses_beyond_the_limit_and_allocates_within_it\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Refuse zero dimensions, exceeded ceilings, multiplication overflow and len+additional overflow\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Dimensions and allocation lengths are checked before allocation; Checked products and vector-length extensions refuse integer overflow even under an explicitly unlimited policy; The quantum and holonomy presets preserve their distinct memory ceilings; A refusal leaves the caller buffer unchanged.\",\n    \"non_role\": [\n      \"Resource admission does not establish mathematical feasibility or physical realization\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
