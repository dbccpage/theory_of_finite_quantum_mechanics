    "math": {
      "object_kind": "finite_markov_chain",
      "symbol": "P ∈ ℚ^(n×n) row-stochastic; π with πP = π, ∑π = 1, π ≥ 0",
      "ascii_symbol": "markov_chain",
      "notation": "communicating classes are the strongly connected components of the support graph; a class is closed when no edge leaves it; π_C is the unique stationary law of a closed class C",
      "domain": [
        "kernel: a square stochastic map on Fin n",
        "bounds: exact step counts are at most MAX_EXACT_STEPS"
      ],
      "codomain": {
        "description": "The structure of a finite Markov chain computed exactly: communicating classes with closedness and period, recurrent and transient states, the stationary distribution of every closed class (and of the chain when it has exactly one), absorption probabilities and expected absorption times from the transient states, expected hitting and return times, time reversal and detailed balance, primitivity, and exact mixing diagnostics with no limits.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "The kernel is square; a rectangular kernel is not a chain",
        "The stationary law of a closed class is the unique solution of (P_C^T - I) π = 0, ∑π = 1 by an exact solve, replayed against πP = π and checked to be a probability vector",
        "The stationary distribution of the whole chain is returned only when there is exactly one closed class; with several the count is reported",
        "Hitting times are defined only when every state can reach the target, which is decided by a backward search",
        "Mixing is computed on exact powers up to a declared bound, and exceeding the bound or not reaching epsilon within it is a typed refusal"
      ]
    },
    "laws": [
      "Classes agree with the equivalence classes of mutual reachability from a Warshall closure, and periods agree with the gcd of return times from boolean matrix powers, on every 3-state support pattern and every 4-state support with one or two successors per row",
      "A chain is primitive exactly when it is irreducible and aperiodic, and then P^k is positive already at (n - 1)^2 + 1 (Wielandt)",
      "The dimension of the kernel of P^T - I equals the number of closed classes",
      "For an irreducible chain π equals the Markov-chain tree theorem value (the normalised sum over spanning trees directed at i of the product of edge probabilities), and π is strictly positive",
      "Every stationary law of a reducible chain is a convex combination of the closed-class laws and carries no mass on transient states",
      "Kac: for an irreducible chain the expected return time to i is 1/π_i, computed from hitting-time solves independent of the stationary solve",
      "Gambler's ruin: the absorption probability and expected duration equal i/N and i(N - i) for p = 1/2, and the geometric closed forms for a biased walk",
      "Two-state chain: d(k) = |1 - a - b|^k max(π_0, π_1); in general d(k) ≤ δ(P)^k for the Dobrushin coefficient, d is non-increasing, and a periodic chain never mixes",
      "A birth-death chain is reversible with the product-formula law, the time reversal of a reversible chain is the chain, and the reversal of a biased cycle swaps its directions and has the same stationary law"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "All arithmetic is exact in BigRational",
        "Classes are ordered by smallest state and states are ordered increasingly"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
