        "MAX_EXACT_STEPS"
      ],
      "required_tests": [
        "a_non_square_kernel_is_not_a_chain",
        "the_stationary_laws_of_the_closed_classes_are_exact_and_the_chain_has_none_unique",
        "hitting_times_are_refused_when_a_state_cannot_reach_the_target",
        "the_time_reversal_needs_a_positive_stationary_law",
        "step_counts_above_the_exact_limit_are_refused",
        "mixing_refuses_a_chain_without_a_unique_stationary_law_and_steps_above_the_limit",
        "classes_closedness_periods_and_state_kinds_have_their_hand_values",
        "a_long_path_does_not_overflow_the_stack_of_the_component_search",
        "absorption_probabilities_and_times_have_their_hand_values",
        "classes_periods_and_primitivity_agree_with_closures_and_boolean_powers_on_every_three_state_support",
        "classes_periods_and_primitivity_agree_with_the_oracles_on_every_four_state_support_with_one_or_two_successors",
        "the_stationary_law_of_every_irreducible_three_and_four_state_chain_is_the_tree_theorem_value",
        "every_stationary_law_of_a_reducible_chain_is_a_mixture_of_its_closed_class_laws",
        "the_expected_return_time_is_the_reciprocal_of_the_stationary_mass_on_every_irreducible_chain",
        "hitting_times_satisfy_the_first_step_equations",
        "the_symmetric_gamblers_ruin_has_probability_i_over_n_and_duration_i_times_n_minus_i",
        "the_biased_gamblers_ruin_has_the_geometric_closed_forms",
        "the_two_state_chain_mixes_geometrically_with_the_closed_form_distance_and_mixing_time",
        "the_distance_to_stationarity_is_non_increasing_and_bounded_by_the_dobrushin_power",
        "a_periodic_chain_has_a_stationary_law_that_the_powers_do_not_converge_to",
        "a_birth_death_chain_is_reversible_with_its_product_formula_law",
        "a_biased_cycle_is_not_reversible_and_its_time_reversal_swaps_the_directions"
      ]
    },
    "negative_tests": [
      "A non-square kernel must be refused as a chain",
      "The stationary distribution of a chain with several closed classes must be refused, reporting their number",
      "A hitting time to a target that some state cannot reach must be refused, naming the state",
      "A time reversal against a non-stationary law, a zero-mass state or a wrong-sized law must be refused",
      "A step count above the exact maximum must be refused",
      "A mixing profile for a chain without a unique stationary law must be refused"
    ],
    "doctrine": {
      "summary": "A finite Markov chain is analysed by finite computations only: graph algorithms on the support for classes, recurrence, period and primitivity, and exact linear solves for stationary laws, absorption and hitting times, each replayed or cross-checked by an independent route (boolean closures, the tree theorem, Kac's formula, closed forms of the gambler's ruin and of the two-state chain). Questions about infinite time are answered by these finite computations or are not answered; mixing is exact on powers up to a declared bound.",
      "non_role": [
        "Continuous-time or infinite-state chains",
        "Floating-point convergence tests or tolerances",
        "Statistical estimation of a chain from data",
        "Quantum dynamics or decoherence"
      ]
    },
    "wip": [
      "Sparse or very large chains are not optimised: the solves are dense exact eliminations",
      "The spectral gap and relaxation time are not computed; only the exact total variation profile and the Dobrushin coefficient are",
      "Coupling-from-the-past and other exact sampling are not implemented"
    ]
  },
