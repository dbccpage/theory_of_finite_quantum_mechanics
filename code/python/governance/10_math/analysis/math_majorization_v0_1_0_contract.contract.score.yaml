      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:majorization:v0.1.0\",\n  \"title\": \"Majorization Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_preorder_on_probability_vectors\",\n    \"symbol\": \"p ≻ q iff ∑_(i≤k) p↓_i ≥ ∑_(i≤k) q↓_i for every k (both of total 1)\",\n    \"ascii_symbol\": \"majorization\",\n    \"notation\": \"p↓ is the non-increasing rearrangement; Equal, PMajorizesQ, QMajorizesP or Incomparable; T = l I + (1 - l) Q with Q a transposition and 0 ≤ l ≤ 1\",\n    \"domain\": [\n      \"vectors: nonempty lists of exact rationals, each ≥ 0, summing to exactly 1, stored sorted non-increasing\",\n      \"comparison of vectors of different lengths pads the shorter with zeros\"\n    ],\n    \"codomain\": {\n      \"description\": \"The majorization preorder on probability vectors decided exactly by partial sums, with its four outcomes, the thermal ladder p_k proportional to r^k, Nielsen's criterion as a pure statement on two vectors, and the constructive Hardy-Littlewood-Polya theorem: when p majorizes q there is a chain of at most n - 1 T-transforms carrying p↓ to q↓, whose product is a doubly stochastic map M with pM = q.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Entries are nonnegative exact rationals summing to exactly one; the constructor sorts, so the order of the input does not matter\",\n      \"A thermal ladder needs a positive ratio, at least one level and at most a declared number of levels\",\n      \"A T-transform needs two distinct coordinates inside the vector and a weight in [0, 1]\",\n      \"A T-transform chain exists only when the first vector majorizes the second, and is refused otherwise\"\n    ]\n  },\n  \"laws\": [\n    \"Majorization is a preorder: reflexive and transitive; p and q majorize each other exactly when they are permutations of one another\",\n    \"The partial-sum test agrees with two independent definitions: every k-subset of q sums to at most the k largest entries of p, and ∑ (p_i - c)_+ ≥ ∑ (q_i - c)_+ at every breakpoint c\",\n    \"A point mass majorizes every vector and the uniform vector is majorized by every vector\",\n    \"The example (7/10, 3/20, 3/20) against (3/5, 7/20, 1/20) is incomparable: 7/10 > 3/5 but 17/20 < 19/20\",\n    \"Thermal ladder: r = 1/2 with 4 levels is (8, 4, 2, 1)/15, ratio above one is the reversed ladder, and for r1 < r2 ≤ 1 the ladder of r1 strictly majorizes the ladder of r2\",\n    \"Nielsen criterion as a pure statement: locc_convertible(source, target) holds exactly when target majorizes source, so conversion goes from less ordered to more ordered spectra only, and incomparable spectra convert in neither direction\",\n    \"Hardy-Littlewood-Polya: for p ≻ q the chain has at most n - 1 transforms with 0 < l < 1, applying it to p↓ gives q↓ exactly, and its product is doubly stochastic\",\n    \"Conversely every doubly stochastic map sends a vector to one it is majorized by, and a stochastic map that is not doubly stochastic can send the uniform vector to a vector that majorizes it\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All arithmetic is exact in BigRational\",\n      \"The T-transform chain is built by the fixed rule of the largest index above and the smallest index below\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_finite_probability\",\n    \"module\": \"majorization\",\n    \"symbols\": [\n      \"ProbabilityVector\",\n      \"Majorization\",\n      \"MajorizationError\",\n      \"compare\",\n      \"majorizes\",\n      \"locc_convertible\",\n      \"thermal_ladder\",\n      \"TTransform\",\n      \"t_transform_chain\",\n      \"apply_chain\",\n      \"doubly_stochastic_transform\",\n      \"MAX_LADDER_LEVELS\"\n    ],\n    \"required_tests\": [\n      \"construction_sorts_and_refuses_empty_negative_and_unnormalised_input\",\n      \"a_thermal_ladder_refuses_a_non_positive_ratio_no_levels_and_too_many_levels\",\n      \"a_t_transform_moves_mass_between_two_coordinates_and_refuses_bad_arguments\",\n      \"the_chain_carries_p_to_q_exactly_with_at_most_n_minus_one_strict_transforms\",\n      \"majorization_is_a_preorder_antisymmetric_exactly_up_to_permutation\",\n      \"the_partial_sum_test_agrees_with_the_subset_and_the_hinge_definitions\",\n      \"a_point_mass_majorizes_everything_and_the_uniform_vector_is_majorized_by_everything\",\n      \"the_four_outcomes_each_occur_and_the_documented_example_is_incomparable\",\n      \"a_permutation_of_the_entries_does_not_change_the_vector_or_any_comparison\",\n      \"vectors_of_different_lengths_compare_by_padding_with_zeros\",\n      \"nielsen_conversion_goes_from_more_to_less_entangled_spectra_only\",\n      \"the_thermal_ladder_has_the_documented_values_and_the_ratio_order_is_the_majorization_order\",\n      \"a_doubly_stochastic_image_is_always_majorized_by_its_source_but_a_general_map_need_not_be\",\n      \"entropy_is_strictly_schur_concave_on_every_grid_pair\"\n    ]\n  },\n  \"negative_tests\": [\n    \"An empty vector, a negative entry or a sum other than exactly one must be refused\",\n    \"A thermal ladder with a non-positive ratio, zero levels or more levels than the declared maximum must be refused\",\n    \"A T-transform with equal coordinates, a weight outside [0, 1] or a coordinate outside the vector must be refused\",\n    \"A T-transform chain between vectors where the first does not majorize the second must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Majorization is decided exactly by partial sums, and the decision is cross-checked against the subset definition and the convex hinge-function definition. The Hardy-Littlewood-Polya direction is constructive and exact: the chain of T-transforms is built, applied to reproduce the target exactly, and multiplied into a doubly stochastic map, while the converse is checked on enumerated doubly stochastic maps with a negative control. Nielsen's criterion is stated only as majorization of two probability vectors.\",\n    \"non_role\": [\n      \"Any claim about entanglement, LOCC protocols or thermodynamics\",\n      \"Weak (sub)majorization of vectors that do not sum to one\",\n      \"Infinite vectors or continuous majorization\"\n    ]\n  },\n  \"wip\": [\n    \"The real-valued Schur-concavity statement is certified for the Shannon entropy form on enumerated pairs, not proved for all Schur-concave functions\",\n    \"Thermal ladders with ratio above one are the reversed ladder; no separate Hamiltonian level structure is represented\"\n  ]\n}\n",
