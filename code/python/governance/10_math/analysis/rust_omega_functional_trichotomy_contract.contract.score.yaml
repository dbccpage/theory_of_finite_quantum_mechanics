      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"rust:omega_functional:trichotomy\",\n  \"kind\": \"rust_file_contract\",\n  \"name\": \"Finite obstruction trichotomy — Phi1/Gamma2 classifier\",\n  \"version\": \"1.0.0\",\n  \"crate\": \"omega_policy\",\n  \"file\": \"crates_rs/omega_policy/src/trichotomy.rs\",\n  \"module_path\": \"omega_policy::trichotomy\",\n  \"role\": \"obstruction_trichotomy_classifier\",\n  \"status\": \"active\",\n  \"authority_effect\": \"EvidenceOnly\",\n  \"transition_authority\": \"none\",\n  \"description\": \"classify_exact(Phi1, Gamma2) -> ObstructionStatus: ExactRepair (Phi1 = 0), StabilizedSurvivor (Phi1 > 0 and Gamma2 = 0), OpenObstruction (Phi1 > 0 and Gamma2 > 0). Descriptive classifier of the obstruction state of a degree-1 residual; mints no authority, issues no ActionLicense. The v1 math contract is urn:omega:math:finite_obstruction_trichotomy:v0.2.0 (this os contract is the Lean<->Rust binding / third leg, not a replacement).\\n\",\n  \"lean_anchor\": {\n    \"file\": \"omega_engine_atlas/coda_atlas/F004_papers/006_finite_qm/lean4/PointedObstructionClassifier.lean\",\n    \"repointed_from\": \"omega_engine/lean4/…/OmegaCosmology/Primitives/PointedObstructionClassifier.lean (not present in this repository)\",\n    \"in_tree_build\": \"Root `PointedObstructionClassifier` of omega_engine_atlas/coda_atlas/F004_papers/006_finite_qm/lean4/lakefile.lean (leanprover/lean4:v4.33.1); core Lean, imports PrimitiveDifference. A byte-identical copy sits at omega_engine_atlas/coda_atlas/omega_engine_finite_qm/lean4/.\",\n    \"replay\": \"2026-09-29 standalone compile with Lean 4.34.0 (the package pins 4.33.1), exit 0: classifier_total is axiom-free; terminalize_{exactRepair,stabilizedSurvivor,openObstruction}_iff print axioms [propext].\\n\",\n    \"modeled_definitions\": [\n      \"ObstructionClassifier (Phi, Gamma : Q -> Nat) + terminalize -> ObstructionStatus (the reusable trichotomy operad)\",\n      \"classifier_total + classifier_exclusive_{exact_stabilized,exact_open,stabilized_open} (totality + mutual exclusivity)\",\n      \"terminalize_{exactRepair,stabilizedSurvivor,openObstruction}_iff (terminalize matches the Phi=0 / Gamma=0 case split)\"\n    ],\n    \"cochain_instance_file\": \"lean4/original_lean_20260809/finite_cochain_complex.lean\",\n    \"cochain_instance_repointed_from\": \"omega_engine/lean4/…/OmegaCosmology/Primitives/FiniteCochainComplex.lean (never present in this repository)\",\n    \"cochain_instance_build\": \"Not a root of any Lake package here; its imports primitive_difference, «lg006_pointed_obstruction_classifier» and «lg006_primitive_obstruction_pipeline» do not resolve. 2026-09-29 scratch replay (Lean 4.34.0 + Mathlib v4.34.0, those three imports rewritten to the finite_qm modules, body unchanged): exit 0; every cochain_instance name elaborates and the TRI-L2/TRI-L3 theorems print axioms [propext, Classical.choice, Quot.sound].\\n\",\n    \"cochain_instance\": [\n      \"cochainClassifier (Phi = coboundary indicator, Gamma = gammaRaw) instantiates the operad\",\n      \"cochainClassifier_phi_eq_zero_iff / cochainClassifier_gamma_eq_zero_iff\",\n      \"gammaL1_eq_zero_iff_closed; gammaL1_eq_zero_of_mem_range (exact => closed via d1 d0 = 0)\"\n    ],\n    \"orientation\": \"ExactRepair iff Phi=0 (coboundary); StabilizedSurvivor iff Phi>0 and Gamma=0 (closed nonexact); OpenObstruction iff Phi>0 and Gamma>0\"\n  },\n  \"owns\": [\n    \"exact_finite_obstruction_classification\"\n  ],\n  \"does_not_own\": [\n    \"phi1 (omega_functional::phi1)\",\n    \"gamma2 (omega_functional::gamma2)\",\n    \"obstruction_classifier_operad (owned by OmegaCore.PointedObstructionClassifier)\",\n    \"authority_minting\",\n    \"terminalization / ActionLicense\",\n    \"customer_facing_claim\"\n  ],\n  \"lean_obligations\": [\n    {\n      \"id\": \"TRI-L0\",\n      \"theorem\": \"Totality + mutual exclusivity of the trichotomy on (Phi, Gamma): exactly one of exact/survivor/open holds.\",\n      \"lean_name\": \"OmegaCore.ObstructionClassifier.classifier_total\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"TRI-L1\",\n      \"theorem\": \"terminalize realizes the (Phi=0 / Gamma=0) case split (exact/survivor/open iff lemmas).\",\n      \"lean_name\": \"OmegaCore.ObstructionClassifier.terminalize_exactRepair_iff (+ stabilizedSurvivor/openObstruction)\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"TRI-L2\",\n      \"theorem\": \"Cochain instance: Phi = 0 iff q is a coboundary (Phi1 = 0); Gamma = 0 iff q is closed (Gamma2 = 0).\",\n      \"lean_name\": \"OmegaCore.cochainClassifier_phi_eq_zero_iff (+ cochainClassifier_gamma_eq_zero_iff)\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"TRI-L3\",\n      \"theorem\": \"KEYSTONE exact => closed: an exactRepair cochain residual has Gamma = 0 (a coboundary has zero closure charge), via d1 d0 = 0. This is the well-foundedness of the trichotomy.\",\n      \"lean_name\": \"OmegaCore.cochainClassifier_exact_imp_gamma_zero (via gammaL1_eq_zero_of_mem_range)\",\n      \"status\": \"proved_in_lean\"\n    }\n  ],\n  \"notes\": [\n    \"Reuses the abstract OmegaCore.ObstructionClassifier operad; the cochain instance only contributes the d1 d0 = 0 keystone (exact => closed). This is the reusable-operad pattern: one trichotomy proved once on the operad, instantiated per carrier.\",\n    \"Descriptive only; the trichotomy describes obstruction state and does not mint authority, terminalize, or issue an ActionLicense (matches the v1 math contract doctrine).\",\n    \"FSP framing: Meron (Paper 041) is the exactRepair corner (full cancellation, Phi1=0); the general fermion sign problem lands in stabilizedSurvivor (residual H^1) or openObstruction.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ],\n    \"coalescence_mode\": \"compatibility_alias\",\n    \"coalesces_with\": [\n      \"urn:omega:rust:omega_functional:trichotomy:v1.1.0\"\n    ]\n  }\n}\n",
