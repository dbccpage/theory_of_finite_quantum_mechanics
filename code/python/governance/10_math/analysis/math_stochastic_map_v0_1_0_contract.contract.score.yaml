      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:stochastic_map:v0.1.0\",\n  \"title\": \"Stochastic Map Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_stochastic_kernel\",\n    \"symbol\": \"M : Fin(m) → Fin(n), M_ij = P(Y = j | X = i), rows summing to 1\",\n    \"ascii_symbol\": \"stochastic_map\",\n    \"notation\": \"p ↦ pM (pushforward), f ↦ Mf (pullback), f;g = fg (composition), M ⊗ N (tensor), δ(M) = (1/2) max_(i,i') ∑_j |M_ij - M_i'j|\",\n    \"domain\": [\n      \"source_n, target_n: sizes ≥ 1\",\n      \"rows: source_n rows of target_n exact rationals, each entry ≥ 0, each row summing to exactly 1\"\n    ],\n    \"codomain\": {\n      \"description\": \"A row-stochastic rational matrix: a morphism of the category of finite stochastic kernels. Composition is the matrix product, identities are identity matrices, the tensor product is the Kronecker product, and with copy, discard, projections and swap the category is a Markov category. Equality is equality of shape and entries; the label is provenance only.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every row sums to exactly one and every entry is nonnegative; the fields are private so a value is always validated\",\n      \"A distribution acts on the right, p ↦ pM, and composition \\\"first f, then g\\\" is the matrix product f g\",\n      \"Composition and application require the target size to equal the next source size, and refuse a mismatch\",\n      \"Sizes that overflow usize in a product are refused, and a matrix power is bounded by a declared maximum exponent\"\n    ]\n  },\n  \"laws\": [\n    \"Composition is associative, identities are two-sided units, and pushforward is a functor: (pA)B = p(AB)\",\n    \"Pullback is adjoint to pushforward: ∑_i p_i (Mf)_i = ∑_j (pM)_j f_j\",\n    \"Interchange: (A ⊗ B);(C ⊗ D) = (A;C) ⊗ (B;D), and (p ⊗ r)(A ⊗ B) = pA ⊗ rB\",\n    \"Copy and discard are a cocommutative comonoid, and a map commutes with copy exactly when it is deterministic\",\n    \"Swap is natural: swap;(g ⊗ f) = (f ⊗ g);swap\",\n    \"Bayesian inversion swaps prior and likelihood: p_i M_ij = q_j K_ji with q = pM, and inverting twice returns the original kernel when the prior has full support\",\n    \"TV(pM, qM) ≤ δ(M) TV(p, q) with δ(M) in [0, 1], equality for some pair of point masses, δ = 0 exactly when all rows are equal, δ = 1 exactly when two rows have disjoint supports\",\n    \"A square map is doubly stochastic exactly when it fixes the uniform distribution and all column sums are 1; convex mixtures of permutations and the transposes of doubly stochastic maps are doubly stochastic\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All arithmetic is exact in BigRational\",\n      \"Composition agrees with the dense matrix product of omega_linear_algebra\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_finite_probability\",\n    \"module\": \"stochastic_map\",\n    \"symbols\": [\n      \"StochasticMap\",\n      \"StochasticMap::try_from_rows\",\n      \"StochasticMap::compose\",\n      \"StochasticMap::apply\",\n      \"StochasticMap::pullback\",\n      \"StochasticMap::tensor\",\n      \"StochasticMap::from_function\",\n      \"StochasticMap::permutation\",\n      \"StochasticMap::bayesian_inverse\",\n      \"StochasticMap::dobrushin_coefficient\",\n      \"StochasticMap::is_doubly_stochastic\",\n      \"StochasticMap::power\"\n    ],\n    \"required_tests\": [\n      \"a_non_row_stochastic_matrix_is_refused_at_its_row\",\n      \"malformed_shapes_and_negative_entries_are_refused_with_their_positions\",\n      \"composition_and_application_refuse_mismatched_carriers\",\n      \"a_permutation_is_validated_and_its_inverse_composes_to_the_identity\",\n      \"a_function_becomes_a_deterministic_map_and_composition_composes_functions\",\n      \"a_target_with_zero_mass_has_no_posterior_and_is_refused\",\n      \"the_transpose_of_a_map_that_is_not_doubly_stochastic_is_refused\",\n      \"powers_agree_with_repeated_composition_and_are_bounded\",\n      \"structural_maps_refuse_a_size_that_overflows_before_allocating\",\n      \"composition_is_associative_and_the_action_agrees_with_it\",\n      \"composition_agrees_with_the_dense_matrix_product_of_linear_algebra\",\n      \"pullback_is_adjoint_to_pushforward_on_enumerated_functions\",\n      \"the_interchange_law_and_the_action_on_products_hold\",\n      \"copy_and_discard_are_a_comonoid\",\n      \"a_map_commutes_with_copy_exactly_when_it_is_deterministic\",\n      \"projections_recover_the_factors_of_a_product_and_swap_is_natural\",\n      \"the_bayesian_inverse_reproduces_the_joint_distribution_and_inverts_back\",\n      \"total_variation_contracts_by_at_most_the_dobrushin_coefficient_and_the_bound_is_tight\",\n      \"the_dobrushin_coefficient_has_the_expected_extreme_values\",\n      \"doubly_stochastic_means_the_uniform_distribution_is_preserved\",\n      \"convex_mixtures_of_permutations_are_doubly_stochastic_and_the_transpose_is_too\",\n      \"composition_passes_the_i64_ceiling_exactly\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A matrix with a row that does not sum to exactly one must be refused, naming the row\",\n    \"A zero source or target, a wrong row count or row length, or a negative entry must be refused with its position\",\n    \"Composition or application with mismatched carrier sizes must be refused\",\n    \"A function image outside the target, or a list that is not a bijection, must be refused as a permutation\",\n    \"A function with no points must be refused\",\n    \"A Bayesian inverse with a target point of zero mass must be refused\",\n    \"The transpose of a map that is not doubly stochastic must be refused\",\n    \"A matrix power above the declared maximum exponent, or of a non-square map, must be refused\",\n    \"A structural map whose size product overflows usize must be refused before any allocation\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A finite stochastic map is a row-stochastic rational matrix whose rows are checked to sum to exactly one, so composing kernels has no fixed-width ceiling and no tolerance. The monoidal structure (tensor, copy, discard, projections, swap) is verified by the Markov-category laws on enumerated maps, including the characterisation of deterministic maps as those that commute with copying, and composition is cross-checked against the dense matrix product of linear algebra. The Dobrushin coefficient is exact and its contraction bound is tight.\",\n    \"non_role\": [\n      \"Quantum channels, Kraus operators or any Born-rule claim\",\n      \"Continuous kernels or infinite carriers\",\n      \"Floating-point transition probabilities\",\n      \"Conditional independence or causal structure\"\n    ]\n  },\n  \"wip\": [\n    \"Rows are stored as Vec<Vec<BigRational>> and converted to BasicMatrix on demand; a BasicMatrix-native representation is not adopted\",\n    \"Only the row-stochastic convention is provided; the column-stochastic transpose convention used by omega_wdp StochasticUpdate converts through transpose\",\n    \"Kantorovich transport and coupling optimisation between marginals are not implemented\"\n  ]\n}\n",
