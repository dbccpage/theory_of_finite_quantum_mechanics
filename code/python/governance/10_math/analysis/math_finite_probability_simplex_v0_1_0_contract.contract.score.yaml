      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_probability_simplex:v0.1.0\",\n  \"title\": \"Finite Probability Simplex Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_probability_distribution\",\n    \"symbol\": \"p ∈ Δ(Fin n) = {p ∈ ℚ^n : p_i ≥ 0, ∑_i p_i = 1}\",\n    \"ascii_symbol\": \"probability_simplex\",\n    \"notation\": \"p ∈ Δ_n over Fin n = {0, ..., n-1}; P(A) = ∑_(i∈A) p_i; E[f] = ∑_i p_i f_i; TV(p, q) = (1/2) ∑_i |p_i - q_i|\",\n    \"domain\": [\n      \"carrier: Fin n with n ≥ 1\",\n      \"masses: n exact rationals (BigRational), each ≥ 0, summing to exactly 1\"\n    ],\n    \"codomain\": {\n      \"description\": \"A validated probability vector on a finite carrier, with exact events, expectations, total variation distance, product distributions on Fin n x Fin m (index i*m + j), convex mixtures and rational power sums ∑ p_i^α. Equality is equality of the mass vectors; the label is provenance only.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every mass is a nonnegative exact rational and the masses sum to exactly one; there is no tolerance\",\n      \"The fields are private: a value comes from a validating constructor (try_from_probs, try_new, try_from_weights, dirac, uniform)\",\n      \"The carrier Fin n has n ≥ 1, and a size product that overflows usize is refused, not wrapped\",\n      \"Events and expectations name points and values of the carrier, and a point outside it is refused\"\n    ]\n  },\n  \"laws\": [\n    \"Total variation is a metric on Δ_n (symmetric, zero exactly on equal vectors, triangle inequality) with values in [0, 1]\",\n    \"TV(p, q) = (1/2) ∑_i |p_i - q_i| = max over events A of |p(A) - q(A)|, two independent computations of one number\",\n    \"Probability is additive over disjoint events, and expectation is linear in the function\",\n    \"The product distribution p ⊗ q has mass p_i q_j at index i*m + j and has p and q as marginals\",\n    \"A convex combination of simplices with nonnegative weights summing to one is a simplex\",\n    \"The power sum ∑_(p_i>0) p_i^α is rational; α = 0 is the support size, α = 1 is 1, α = 2 is the purity, and the uniform distribution on n points has purity 1/n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All arithmetic is exact in BigRational\",\n      \"Support lists and events are reported in increasing order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_finite_probability\",\n    \"module\": \"simplex\",\n    \"symbols\": [\n      \"ProbabilitySimplex\",\n      \"ProbabilitySimplex::try_from_probs\",\n      \"ProbabilitySimplex::try_new\",\n      \"ProbabilitySimplex::try_from_weights\",\n      \"ProbabilitySimplex::total_variation\",\n      \"ProbabilitySimplex::probability_of\",\n      \"ProbabilitySimplex::expectation\",\n      \"ProbabilitySimplex::product\",\n      \"ProbabilitySimplex::convex_combination\",\n      \"ProbabilitySimplex::power_sum\"\n    ],\n    \"required_tests\": [\n      \"a_vector_not_summing_to_one_is_refused_with_its_exact_sum\",\n      \"a_negative_mass_is_refused_at_its_index\",\n      \"empty_and_wrongly_sized_masses_are_refused\",\n      \"a_dirac_point_outside_the_carrier_is_refused\",\n      \"weights_are_normalised_exactly_and_a_zero_total_is_refused\",\n      \"events_are_additive_over_disjoint_events_and_count_repeats_once\",\n      \"total_variation_of_disjoint_supports_is_one_and_sizes_must_agree\",\n      \"a_convex_combination_is_a_simplex_and_bad_weights_are_refused\",\n      \"expectation_is_linear_and_matches_a_hand_value\",\n      \"a_carrier_needs_a_point\",\n      \"a_product_that_overflows_usize_is_refused_not_wrapped\",\n      \"total_variation_is_a_metric_on_the_three_point_grid\",\n      \"total_variation_is_the_largest_event_gap_on_every_grid_pair\",\n      \"a_product_distribution_multiplies_masses_and_has_the_factors_as_marginals\",\n      \"power_sums_are_the_rational_moments_and_purity_is_the_second\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Masses that do not sum to exactly one must be refused, reporting the exact sum\",\n    \"A negative mass must be refused, reporting its index\",\n    \"An empty vector, or one whose length differs from the carrier, must be refused\",\n    \"A Dirac point outside the carrier must be refused\",\n    \"Weights that sum to zero, or a negative weight, must not be normalised\",\n    \"An event naming a point outside the carrier must be refused\",\n    \"Total variation between simplices of different sizes must be refused\",\n    \"A mixture with a negative weight, weights not summing to one, or parts of different sizes must be refused\",\n    \"An expectation whose value list has the wrong length must be refused\",\n    \"A carrier with no points must be refused\",\n    \"A carrier product that overflows usize must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A finite probability simplex is a vector of exact rationals that sums to one, so a value of the type is a distribution and consumers never re-validate it. Its derived quantities (events, expectations, total variation, products, mixtures, power sums) are exact, and the total variation is checked against an independent maximum over events. This is classical finite probability; it makes no claim about a quantum Born rule.\",\n    \"non_role\": [\n      \"Continuous or infinite distributions\",\n      \"Floating-point probabilities or tolerances\",\n      \"Any quantum state or Born-rule claim\",\n      \"Measure-theoretic structure beyond a finite carrier\"\n    ]\n  },\n  \"wip\": [\n    \"FinN lives in the sibling module finite_set and is bound by the test a_carrier_needs_a_point; this contract binds the module simplex only\",\n    \"Entropy is not a method of the simplex: it is the LogForm of the log_linear_entropy_form contract\"\n  ]\n}\n",
