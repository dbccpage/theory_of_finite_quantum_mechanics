      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:causal_poset_core:v0.1.0\",\n  \"title\": \"Finite causal posets\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"causal_poset_core\",\n    \"symbol\": \"causal_poset_core\",\n    \"ascii_symbol\": \"causal_poset_core\",\n    \"notation\": \"Finite causal posets\",\n    \"domain\": [\n      \"Declared finite carrier and strict relation with typed cycle, index and operation refusals.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_homology::finite_poset; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The transitive closure is strict and acyclic.\",\n    \"Spacelike pairs are incomparable pairs.\",\n    \"Linear extensions preserve every strict relation.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"finite_poset\",\n    \"symbols\": [\n      \"FinitePoset\"\n    ],\n    \"required_tests\": [\n      \"a_missing_composite_violates_transitivity_and_is_named\",\n      \"incomparable_pairs_are_order_incomparability_not_integer_inequality\"\n    ]\n  },\n  \"negative_tests\": [\n    \"generating_relations_close_transitively_and_refuse_cycles\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The transitive closure is strict and acyclic.; Spacelike pairs are incomparable pairs.; Linear extensions preserve every strict relation..\",\n    \"non_role\": [\n      \"The pure order carrier belongs to homology; C1/C2 census and fixtures belong to the native program.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
