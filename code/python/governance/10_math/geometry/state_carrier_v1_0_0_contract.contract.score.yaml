      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:state:carrier:v1.0.0\",\n  \"title\": \"Carrier\",\n  \"kind\": \"state_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"01_state\",\n  \"role\": \"Carrier\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"TypeAndKindContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Carrier boundary. Carrier is declared state structure, not a live mutable object. Carrier changes require a licensed transition committed by Engine and recorded as local outbox trace signals fused solely by the Runtime Trace Coordinator. Carrier is finite declared structure. Carrier does not act as world, model, ontology, semantic domain, embedding space, terminalizer, or executor.\\n\",\n    \"non_role\": [\n      \"mutation without licensed transition\",\n      \"self-modification\",\n      \"implicit carrier change\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\\nauthorize transitions, execute transitions, or upgrade evidence authority.\\n\\nLLM output may propose carrier schemas or carrier declarations, but those proposals are\\nEvidenceOnly until checked against this contract.\\n\"\n    },\n    \"certificate_authority_bound\": {\n      \"doctrine\": 6,\n      \"text\": \"Certificate authority MUST NOT exceed attached evidence authority. No carrier certificate may\\nclaim authority beyond the evidence it binds.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Cohomological Semantics\",\n      \"role\": \"Finite declared structure.\",\n      \"classification\": \"State layer -- carrier is NOT an operator. It is the state space that operators act upon. Carrier has no effect-class assignment (effect_class: none). Only the five canonical effect-classes (E, I, C, R, M) are operators.\"\n    },\n    \"structural_representation\": {\n      \"carrier_artifact\": {\n        \"struct_name\": \"CarrierArtifact\",\n        \"fields\": [\n          {\n            \"name\": \"carrier_id\",\n            \"type\": \"CarrierId\"\n          },\n          {\n            \"name\": \"carrier_kind\",\n            \"type\": \"CarrierKind\"\n          },\n          {\n            \"name\": \"c0_ref\",\n            \"type\": \"SpaceRef\"\n          },\n          {\n            \"name\": \"c1_ref\",\n            \"type\": \"SpaceRef\"\n          },\n          {\n            \"name\": \"c2_ref\",\n            \"type\": \"SpaceRef\"\n          },\n          {\n            \"name\": \"d0_ref\",\n            \"type\": \"CoboundaryMapRef\"\n          },\n          {\n            \"name\": \"d1_ref\",\n            \"type\": \"CoboundaryMapRef\"\n          },\n          {\n            \"name\": \"admissible_repair_set\",\n            \"type\": \"RepairSetRef\"\n          },\n          {\n            \"name\": \"context_family\",\n            \"type\": \"ContextFamilyRef\"\n          },\n          {\n            \"name\": \"coefficient_semantics\",\n            \"type\": \"CoefficientDomainId\"\n          },\n          {\n            \"name\": \"schema_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"carrier_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"chain_law_witness\",\n            \"type\": \"Option<WitnessId>\"\n          },\n          {\n            \"name\": \"chain_law_certificate\",\n            \"type\": \"Option<CertificateId>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"layer_split_note\": \"Computational carrier implementations are not authority-bearing by themselves. The intended\\nlayer split is:\\n\\nCarrier\\n  exact in-memory computational cochain complex\\n  no authority effect\\n  no contract promotion\\n\\nCarrierManifest\\n  serializable identity/evidence for exact Carrier\\n\\nCarrierArtifact\\n  contract-level declared carrier record\\n  EvidenceOnly by default\\n\\nCheckedCarrierArtifact\\n  checked contract wrapper\\n  FactOnly only after validation/certificate refs\\n\"\n    },\n    \"chain_cochain_law\": \"A Carrier MUST declare:\\n\\nd1 ∘ d0 = 0\\n\\nThe law must be witnessed or certified.\\n\\nA structure without a declared and checked `d1 ∘ d0 = 0` witness or certificate is not a valid\\nchecked cohomological carrier. It may exist only as an unchecked carrier proposal.\\n\",\n    \"requires\": [\n      \"$C^0$, $C^1$, $C^2$\",\n      \"$d_0: C^0 \\\\to C^1$\",\n      \"$d_1: C^1 \\\\to C^2$\",\n      \"$d_1 \\\\circ d_0 = 0$\",\n      \"admissible_repair_set\",\n      \"context_family\",\n      \"coefficient_semantics\",\n      \"carrier hash\",\n      \"declared schema\",\n      \"declared repair image\",\n      \"declared context family\",\n      \"chain/cochain law witness or certificate\"\n    ],\n    \"must_not\": [\n      \"Be defined as \\\"world\\\", \\\"model\\\", \\\"ontology\\\", \\\"semantic domain\\\", or \\\"embedding space\\\".\",\n      \"Hide topology in labels.\",\n      \"Infer faces from cycles without declared 2-cells.\",\n      \"Treat embeddings as carrier structure.\",\n      \"Treat LLM latent space as carrier structure.\"\n    ],\n    \"admissibility_checklist\": [\n      \"Carrier type is declared\",\n      \"Carrier algebra is well-formed (d1 compose d0 = 0)\",\n      \"Dimension/rank is bounded and explicit\",\n      \"Base field is specified\",\n      \"Carrier transitions require a licensed transition executed by Engine. The transition may be supported by a certified fixed-layer effect-class application, but the operator certificate is not itself the state transition.\",\n      \"Admissible repair set is declared\",\n      \"Context family is declared\",\n      \"Coefficient semantics are declared\",\n      \"Carrier hash is deterministic and stable\",\n      \"Chain/cochain law is witnessed or certified\"\n    ],\n    \"refusal_conditions\": [\n      \"Untyped carrier (carrier without declared type)\",\n      \"Undeclared carrier transition (state change without certified path)\",\n      \"Carrier mutation without licensed Engine transition\",\n      \"Implicit expressivity change (carrier dimension or rank change without declaration)\",\n      \"Dimension mismatch (declared dimension does not match structure)\",\n      \"Carrier without chain/cochain law witness\",\n      \"Carrier self-modification (carrier acting on itself)\",\n      {\n        \"note\": \"Checked E/I/C/R/M evidence may support a transition license, but cannot mutate carrier state by itself.\"\n      }\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"world_model\",\n        \"ontology\",\n        \"semantic_domain\",\n        \"embedding_space\",\n        \"latent_space\",\n        \"infer_faces_from_cycles\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute(\",\n        \"mutate_runtime\",\n        \"authorize_transition\",\n        \"score_candidate\",\n        \"quality_score\"\n      ]\n    },\n    \"required_tests\": [\n      \"carrier_authority_effect_defaults_to_evidence_only\",\n      \"checked_carrier_may_promote_to_factonly\",\n      \"carrier_requires_c0_c1_c2\",\n      \"carrier_requires_d0_d1\",\n      \"carrier_verifies_d1_d0_zero\",\n      \"carrier_requires_admissible_repair_set\",\n      \"carrier_requires_context_family\",\n      \"carrier_rejects_world_model_label\",\n      \"carrier_rejects_embedding_space_claim\",\n      \"carrier_rejects_cycles_as_faces_without_declared_2cells\",\n      \"same_carrier_same_hash\",\n      \"carrier_transition_requires_engine_license\",\n      \"carrier_certificate_does_not_execute_transition\",\n      \"carrier_requires_schema_hash\",\n      \"carrier_requires_chain_law_witness_or_certificate\",\n      \"carrier_does_not_treat_operator_certificate_as_mutation\"\n    ],\n    \"canonical_invariant\": \"Carrier is finite declared cohomological structure. It is not world, ontology, semantic domain,\\nembedding space, terminalizer, or executor. Carrier artifacts are EvidenceOnly until checked.\\nCarrier mutation requires a licensed Engine transition; certificates and operators do not mutate\\ncarrier state by themselves.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Carrier\",\n      \"role\": \"Typed algebraic state space over which all computations, measurements, and transformations operate\",\n      \"classification\": \"state\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"TypeAndKindContract\"\n      ],\n      \"forbidden_authority\": [\n        \"mutation without licensed transition\",\n        \"self-modification\",\n        \"implicit carrier change\"\n      ],\n      \"primary_output_family\": \"StructureArtifact\",\n      \"domain_output_kind\": \"CarrierArtifact\",\n      \"checked_domain_output_kind\": \"CheckedCarrierArtifact\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_state_contract:v1.0.0\"\n    ]\n  }\n}\n",
