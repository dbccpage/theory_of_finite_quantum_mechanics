      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:nerve:v0.1.0\",\n  \"title\": \"Nerve Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"simplicial_complex\",\n    \"symbol\": \"N(U) where U = {U_i}_{i ∈ I}\",\n    \"ascii_symbol\": \"nerve\",\n    \"notation\": \"N(U) where U = {U_i}_{i ∈ I}\",\n    \"domain\": [\n      \"vertices: Index set I from the cover\",\n      \"simplices: Collection of finite subsets S ⊆ I with non-empty intersection\"\n    ],\n    \"codomain\": {\n      \"description\": \"Abstract simplicial complex with vertex set I (cover index set)\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every simplex corresponds to a non-empty intersection\",\n      \"All non-empty intersections are represented as simplices\",\n      \"All faces of simplices are present\",\n      \"Vertices and simplices follow canonical ordering\"\n    ]\n  },\n  \"laws\": [\n    \"S ⊆ I is a simplex iff ∩_{i ∈ S} U_i ≠ ∅\",\n    \"If S is a simplex and T ⊆ S, then T is a simplex\",\n    \"Vertices of N(U) are in bijection with cover sets\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Vertices ordered as in Cover artifact\",\n      \"Simplices enumerated by cardinality then lexicographically\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"cover_id does not resolve\",\n    \"Cover has no sets (I = ∅)\",\n    \"Some U_i = ∅, vertex excluded from nerve\",\n    \"Implementations disagree on intersection emptiness\",\n    \"{i,j} claimed as simplex but U_i ∩ U_j = ∅\",\n    \"{i,j,k} is simplex but {i,j} not recorded\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The Nerve of a cover is a simplicial complex whose vertices correspond to the sets in the cover, and whose k-simplices correspond to (k+1)-fold intersections that are non-empty. The contract takes a Cover artifact and produces a SimplicialComplex artifact representing the nerve. It validates that the nerve construction is correct: a simplex {U_0, ..., U_k} exists iff the intersection U_0 ∩ ... ∩ U_k is non-empty.\",\n    \"non_role\": [\n      \"Verifying the Nerve Theorem hypothesis (good cover conditions)\",\n      \"Computing Cech cohomology (separate contract)\",\n      \"Supporting infinite covers (finite index sets only)\",\n      \"Implicit cover definitions (requires explicit point sets)\"\n    ]\n  },\n  \"wip\": [\n    \"Contract does not verify Nerve Theorem hypothesis (good cover, contractible intersections) - these are FactEnvelope claims\",\n    \"Infinite covers are not supported (finite index sets only)\",\n    \"Cover must provide explicit point sets for each U_i; implicit covers (defined by predicates) cannot be computed without enumeration\",\n    \"Refinement of covers and induced maps on nerves could be separate ComputationWitness\",\n    \"Relationship with Cech cohomology: nerve is indexing complex for Cech cochains - needs separate contract\",\n    \"Vertices ordered according to Cover artifact index ordering\",\n    \"Simplices enumerated by cardinality, then lexicographically by sorted vertex indices\",\n    \"Intersection computation uses canonical point ID set intersection\",\n    \"Empty cover sets (U_i = ∅) result in fewer nerve vertices than cover sets - valid but documented\"\n  ]\n}\n",
