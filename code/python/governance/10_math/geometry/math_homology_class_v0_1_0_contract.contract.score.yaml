      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:homology_class:v0.1.0\",\n  \"title\": \"HomologyClass\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quotient_space_element\",\n    \"symbol\": \"[z] ∈ H_n(C)\",\n    \"ascii_symbol\": \"homology_class\",\n    \"notation\": \"[z] ∈ H_n(C)\",\n    \"domain\": [\n      \"cycle: element of ker(d_n)\",\n      \"representative: chosen normal form representative\",\n      \"boundary_subspace: im(d_{n+1})\",\n      \"quotient_space: H_n = ker(d_n) / im(d_{n+1})\"\n    ],\n    \"codomain\": {\n      \"description\": \"Equivalence class in the quotient vector space H_n = ker(d_n) / im(d_{n+1}) where d_n is the boundary operator of degree n in a chain complex.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Representative must be in ker(d_n)\",\n      \"Boundary subspace must match degree n-1\",\n      \"Quotient space must be ker(d_n) / im(d_{n+1})\",\n      \"Representative must be in deterministic normal form\",\n      \"Class hash must be deterministic and reproducible\"\n    ]\n  },\n  \"laws\": [\n    \"d_n(z) = 0 (representative is a cycle)\",\n    \"[z] = [z'] iff z - z' ∈ im(d_{n+1})\",\n    \"[z] + [w] = [z + w]\",\n    \"λ[z] = [λz] for scalar λ\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Quotient algorithm must be deterministic\",\n      \"Normal form computation must be deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"homology_class\",\n    \"symbols\": [\n      \"HomologyClass\"\n    ],\n    \"required_tests\": [\n      \"test_homology_class_complex_mismatch_rejected\",\n      \"test_homology_class_domain_mismatch_rejected\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject representative that is not a cycle (d_n(z) ≠ 0)\",\n    \"Reject boundary subspace from wrong degree\",\n    \"Reject quotient basis mismatch\",\n    \"Reject class hash mismatch under normal form\",\n    \"Reject artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Equivalence class [z] in H_n = ker(d_n) / im(d_{n+1}) represented by a cycle modulo boundaries. Homology classes represent closed chains up to boundary equivalence and are core finite obstruction/residual objects.\",\n    \"non_role\": [\n      \"Does not compute homology groups directly (only individual classes)\",\n      \"Does not handle persistent or relative homology variants (see open questions)\",\n      \"Does not provide cohomology class representation\"\n    ]\n  },\n  \"wip\": [\n    \"Define persistent homology class variants separately\",\n    \"Define relative homology class variants separately\",\n    \"Specify how to handle infinite-dimensional homology groups\",\n    \"Clarify coefficient ring flexibility (Z, Q, F_p, etc.)\",\n    \"Current implementation focuses on finite-dimensional chain complexes\",\n    \"Normal form computation assumes choice of basis for quotient space\",\n    \"Future work: extend to persistent and relative homology\"\n  ]\n}\n",
