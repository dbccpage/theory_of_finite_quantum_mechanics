      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:chain_group:v0.1.0\",\n  \"title\": \"ChainGroup\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"graded_module_component\",\n    \"symbol\": \"C_n\",\n    \"ascii_symbol\": \"chain_group\",\n    \"notation\": \"C_n\",\n    \"domain\": [\n      \"degree: integer (i64)\",\n      \"group_or_module: hash reference to algebraic structure\",\n      \"coefficient_domain: hash reference to coefficient ring/field\",\n      \"basis: optional hash reference when finite/free\"\n    ],\n    \"codomain\": {\n      \"description\": \"The underlying group or module C_n at degree n, with elements represented as linear combinations of basis elements over a coefficient domain.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Degree must exist in parent graded module or chain complex\",\n      \"Component hash must match parent structure's component at this degree\",\n      \"Coefficient domain hash must match parent structure's coefficient domain\",\n      \"When finite/free, basis hash must be provided and match parent\",\n      \"Artifact hash must be deterministic and reproducible\"\n    ]\n  },\n  \"laws\": [\n    \"All elements belong to a fixed degree n\",\n    \"Elements form a group or module over coefficient domain\",\n    \"When basis provided, all chains expressible as linear combinations\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Looking up the same degree in the same graded module must reproduce the same ChainGroup artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject degree absent from parent structure\",\n    \"Reject component hash mismatch with parent\",\n    \"Reject coefficient domain hash mismatch\",\n    \"Reject chain coordinates outside basis length\",\n    \"Reject artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Homological degree component C_n of a graded module or chain complex. ChainGroup is the carrier for n-chains, boundaries from degree n+1, cycles in degree n, and homology classes H_n.\",\n    \"non_role\": [\n      \"Does not classify admissibility or emit policy decisions\",\n      \"Does not produce customer-facing claims or certificates\",\n      \"Does not terminalize or confer authority\",\n      \"Does not perform homology computation (delegated to higher-level contracts)\"\n    ]\n  },\n  \"wip\": [\n    \"Decide naming split for ChainGroup versus ChainModule\",\n    \"Clarify relationship with graded module components\",\n    \"Determine if separate ChainModule contract needed\",\n    \"Current implementation focuses on chain complex context\",\n    \"May need generalization for arbitrary graded modules\",\n    \"Basis representation and storage strategy under review\"\n  ]\n}\n",
