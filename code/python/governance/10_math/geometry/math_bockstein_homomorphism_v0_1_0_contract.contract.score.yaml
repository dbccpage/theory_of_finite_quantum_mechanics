      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bockstein_homomorphism:v0.1.0\",\n  \"title\": \"Bockstein Homomorphism Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"connecting_homomorphism_in_cohomology\",\n    \"symbol\": \"beta: H^k(X; F_2) -> H^(k+1)(X; F_2), beta[c] = [ (delta c_hat) / 2 mod 2 ] for an integral lift c_hat with entries 0 and 1\",\n    \"ascii_symbol\": \"bockstein_homomorphism\",\n    \"notation\": \"connecting map of 0 -> Z/2 -> Z/4 -> Z/2 -> 0; first Steenrod square Sq^1 on H^k(X; F_2)\",\n    \"domain\": [\n      \"an IntegralChainComplex and a degree k below the top degree\",\n      \"a cocycle of degree k over F_2\"\n    ],\n    \"codomain\": {\n      \"description\": \"A cocycle of degree k + 1 over F_2 (for one cocycle), or the matrix of beta in the bases of H^k and H^(k+1) of the mod-2 reduction (for the map on classes).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The cochain must be a cocycle mod 2, so that the integral coboundary of the lift is even\",\n      \"The integral coboundary is computed exactly (i128) from the sparse integer boundary\",\n      \"A degree at or above the top degree has no target and is refused\"\n    ]\n  },\n  \"laws\": [\n    \"beta is well defined on classes: replacing a cocycle by another in the same class changes beta(c) by a coboundary\",\n    \"beta(1) = 0 on H^0: the constant cochain lifts to a constant integral cochain whose coboundary is zero\",\n    \"beta detects 2-torsion: it vanishes on the 3 x 3 torus lattice, the 7-vertex torus, the boundary of the tetrahedron and the one-face torus, and is an isomorphism H^1 -> H^2 on the 6-vertex projective plane and on its one-cell model (Sq^1 x = x^2 is nonzero there)\",\n    \"On the Klein bottle cell complex beta: H^1 (dimension 2) -> H^2 (dimension 1) has rank 1, matching H^2(X; Z) = Z/2\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Bases of H^k come from F2ChainComplex::cohomology_basis in a fixed order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"integral_chain_complex\",\n    \"symbols\": [\n      \"IntegralChainComplex::bockstein_of_cocycle\",\n      \"IntegralChainComplex::bockstein_matrix\"\n    ],\n    \"required_tests\": [\n      \"the_bockstein_refuses_a_non_cocycle_and_the_top_degree\",\n      \"the_bockstein_homomorphism_detects_two_torsion\",\n      \"the_bockstein_of_a_class_does_not_depend_on_the_representative\",\n      \"the_bockstein_of_the_torus_lattice_vanishes\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A cochain that is not a cocycle mod 2 must be refused\",\n    \"A degree at or above the top degree must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The Bockstein homomorphism is computed by lifting a cocycle to an integral cochain, taking the exact integral coboundary, halving and reducing. It is checked on spaces where the answer is known independently: zero where there is no 2-torsion, an isomorphism on the projective plane, rank 1 on the Klein bottle.\",\n    \"non_role\": [\n      \"Higher Bocksteins for Z/2^r\",\n      \"Bockstein maps with coefficients other than F_2\",\n      \"Steenrod squares other than Sq^1\"\n    ]\n  },\n  \"wip\": [\n    \"omega_homology::bockstein_homomorphism is still a label-and-notes shell; the working map is here, and nothing there was changed\",\n    \"beta composed with itself is not exercised: the complexes tested have at most H^2\"\n  ]\n}\n",
