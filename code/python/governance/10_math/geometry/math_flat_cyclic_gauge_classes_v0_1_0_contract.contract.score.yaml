      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:flat_cyclic_gauge_classes:v0.1.0\",\n  \"title\": \"Flat Cyclic Gauge Classes Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_group_cohomology_count\",\n    \"symbol\": \"|H^1(X; Z_n)| = |Hom(H_1(X; Z), Z_n)|\",\n    \"ascii_symbol\": \"flat_cyclic_gauge_classes\",\n    \"notation\": \"classes of flat Z_n-connections on a 2-complex X modulo vertex gauge; count = n^(z - r) * prod_i gcd(d_i, n)\",\n    \"domain\": [\n      \"complex: a CellComplex whose faces are closed boundary walks\",\n      \"order: n >= 1, the order of the cyclic group Z_n\"\n    ],\n    \"codomain\": {\n      \"description\": \"The exact number of gauge classes of flat connections with values in Z_n, as an unbounded integer, together with the cycle rank z of the edge graph.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"n >= 1; n = 0 is refused\",\n      \"Every face boundary must be a closed walk of edges with directions +1 or -1, else the class count is refused\",\n      \"The count is exact: the face boundaries in the coordinates of the z edges off a spanning forest are reduced by Smith normal form over the integers (no modular shortcut, no enumeration)\"\n    ]\n  },\n  \"laws\": [\n    \"Gauge classes of all Z_n connections on the edge graph number n^z, with z = E - V + (number of connected components) the cycle rank\",\n    \"Gauge classes of flat connections number |H^1(X; Z_n)| = |Hom(H_1(X; Z), Z_n)| (universal coefficients; H_0 is free)\",\n    \"With M the integer matrix of face boundaries in the off-forest coordinates, rank r and invariant factors d_1 | ... | d_r, the count is n^(z - r) times the product of gcd(d_i, n); without faces, or when every face boundary cancels, it is n^z\",\n    \"Simply connected complexes (a disk, a tetrahedron boundary) have one class; the torus has n^2; the projective plane cell complex (one loop, one face with boundary e e) has gcd(2, n); the Klein bottle has n gcd(2, n)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact BigInt elimination; the exponent and the modulus reduction are checked conversions\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_holonomy\",\n    \"module\": \"gauge_fixing\",\n    \"symbols\": [\n      \"flat_cyclic_gauge_classes\",\n      \"cycle_rank\"\n    ],\n    \"required_tests\": [\n      \"a_cyclic_group_of_order_zero_is_refused\",\n      \"faces_that_are_not_closed_walks_are_refused\",\n      \"cycle_rank_is_edges_minus_vertices_plus_components\",\n      \"flat_cyclic_classes_match_the_first_cohomology_of_each_complex\",\n      \"flat_cyclic_classes_agree_with_brute_force_enumeration_of_connections_and_gauge_orbits\",\n      \"quarter_turn_gauge_classes_are_counted_by_the_cycle_rank\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A cyclic group of order 0 must be refused\",\n    \"A face whose boundary steps are not a closed walk, name a missing edge, or carry a direction other than +1 or -1 must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The number of flat Z_n gauge classes is computed from the spanning forest and the Smith normal form of the face boundaries, and checked against brute-force enumeration of every Z_n connection and every vertex gauge on small complexes, including cell complexes with torsion in H_1 (projective plane, Klein bottle) and lattices with antiparallel edges (2 x 2 torus).\",\n    \"non_role\": [\n      \"Cohomology with non-cyclic coefficient groups\",\n      \"Non-abelian flat connections modulo gauge\",\n      \"Higher cohomology groups (see the F2 cohomology contract for H^k with F2 coefficients)\"\n    ]\n  },\n  \"wip\": [\n    \"Only cyclic coefficient groups Z_n are counted; the class of each connection is not enumerated, only its number\"\n  ]\n}\n",
