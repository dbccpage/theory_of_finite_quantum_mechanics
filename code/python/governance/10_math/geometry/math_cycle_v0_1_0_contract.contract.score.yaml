      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cycle:v0.1.0\",\n  \"title\": \"Cycle Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"kernel_element\",\n    \"symbol\": \"z ∈ ker(d_n) ⊆ C_n\",\n    \"ascii_symbol\": \"cycle\",\n    \"notation\": \"z ∈ ker(d_n) ⊆ C_n\",\n    \"domain\": [\n      \"representative: vector_in_chain_group\",\n      \"degree: non_negative_integer\",\n      \"witness: unforgeable_kernel_membership_token\"\n    ],\n    \"codomain\": {\n      \"description\": \"Element z ∈ C_n where C_n is a chain group in a chain complex, together with certified proof that d_n(z) = 0.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Application of boundary map d_n to cycle representative yields zero\",\n      \"Cycle representative is valid element of chain group C_n\",\n      \"Cycle degree matches chain group degree\",\n      \"Referenced boundary map matches complex structure at given degree\",\n      \"CycleWitness hash binds to specific complex, degree, and representative\"\n    ]\n  },\n  \"laws\": [\n    \"d_n(z) = 0 in C_{n-1}\",\n    \"z ∈ C_n where n = degree\",\n    \"CycleWitness binds z to specific complex and boundary map\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Boundary computation must be deterministic\",\n      \"All hashes computed from canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"cycle\",\n    \"symbols\": [\n      \"Cycle\"\n    ],\n    \"required_tests\": [\n      \"try_cycle_rejects_coefficient_length_mismatch\",\n      \"try_cycle_rejects_nonzero_boundary\",\n      \"try_cycle_rejects_degree_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject chain representative with wrong dimension for degree\",\n    \"Reject boundary map that doesn't match claimed degree\",\n    \"Reject element where d_n(z) ≠ 0\",\n    \"Reject cycle when coefficient domain differs from complex\",\n    \"Reject cycle artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Chain z in C_n satisfying d_n z = 0. Cycles are kernel elements of boundary maps and representatives for homology classes.\",\n    \"non_role\": [\n      \"Homology class equivalence (separate homology contract)\",\n      \"Boundary elements (separate boundary contract)\",\n      \"Normalized cycle representatives (deferred)\",\n      \"Cohomology cycles (dual cochain complex)\"\n    ]\n  },\n  \"wip\": [\n    \"How to define normalized cycle representatives for canonical forms?\",\n    \"Should cycles in degree 0 have special handling beyond augmentation map?\",\n    \"How to represent relative cycles in chain pairs?\",\n    \"Currently targets finite chain complexes only\",\n    \"Normalized cycle representatives deferred to future version\",\n    \"Cohomology cycles (cocycles) handled by separate cochain complex contract\",\n    \"Relative homology and cycle pairs deferred\"\n  ]\n}\n",
