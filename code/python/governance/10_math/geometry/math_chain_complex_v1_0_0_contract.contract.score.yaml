          "BoundarySpace": "B_n = im(d_{n+1}).",
          "CycleSpace": "Z_n = ker(d_n).",
          "Homology": "H_n = Z_n/B_n.",
          "Phi1": "Φ₁ is not defined by this contract; it belongs to the Omega cochain quotient layer.",
