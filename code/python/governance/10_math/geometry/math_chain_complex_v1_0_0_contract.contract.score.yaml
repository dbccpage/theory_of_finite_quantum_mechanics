      "1. Contract metadata": {
        "title": "Chain complex",
        "version": "0.1.0",
        "object_type": "mathematical_structure",
        "primitive_scope": "graded chain groups with degree-lowering boundary maps"
      },
      "2. Mathematical object / functional role": {
        "role": "A graded family of chain groups/modules C_n with boundary maps d_n:C_n→C_{n-1} satisfying d_{n-1}∘d_n=0.",
        "purpose": "Provides the base structure for cycles, boundaries, homology, exact sequences, and obstruction-theoretic constructions.",
        "non_role": [
          "Does not define the Omega finite cochain layer directly.",
          "Does not compute Φ₁, Γ₂, or Ξ.",
          "Does not classify admissibility.",
          "Does not issue certificates.",
          "Does not terminalize.",
          "Does not produce customer-facing claims."
        ]
      },
      "3. Domain and codomain": {
        "domain": "graded finite chain groups/modules over a declared coefficient domain R",
        "codomain": "valid chain complex structure",
        "maps": {
          "boundary": "d_n:C_n→C_{n-1}"
        }
      },
      "4. Required structures": {
        "required": [
          "coefficient domain R",
          "degree index set",
          "finite chain group/module C_n for each declared degree n",
          "ordered basis or finite presentation for each C_n",
          "boundary map d_n for each declared adjacent degree",
          "boundary law d_{n-1}∘d_n=0"
        ],
        "optional": [
          "boundedness declaration",
          "filtration",
          "augmentation",
          "grading convention"
        ]
      },
      "5. Definition": {
        "chain_complex": "A chain complex is a graded object C_• with degree-lowering maps d_n such that d_{n-1}∘d_n=0 for all adjacent declared degrees.",
        "cycles": "Z_n = ker(d_n).",
        "boundaries": "B_n = im(d_{n+1}).",
        "homology": "H_n = Z_n / B_n when B_n⊆Z_n follows from d_n∘d_{n+1}=0.",
        "finite_scope": "This contract version covers finite declared degree sets only."
      },
      "6. Laws and invariants": {
        "boundary_squared_zero": "d_{n-1}∘d_n=0 for all adjacent declared degrees.",
        "degree_shift": "d_n lowers degree by one.",
        "coefficient_uniformity": "All C_n are modules over the same declared coefficient domain R.",
        "dimension_or_presentation_compatibility": "Boundary maps have source and target compatible with declared C_n presentations.",
        "homology_well_defined": "B_n⊆Z_n follows from the boundary law."
      },
      "7. Equality / equivalence rules": {
        "strict_equality": "Same R, same degree set, same ordered bases/presentations, same boundary maps.",
        "chain_isomorphism": "Degreewise invertible maps F_n:C_n→C'_n satisfying F_{n-1}d_n=d'_nF_n.",
        "chain_homotopy_equivalence": "Separate contract; not assumed here."
      },
      "8. Replay / determinism requirements": {
        "requirements": [
          "Boundary application is deterministic.",
          "Boundary composition d_{n-1}d_n is replayable.",
          "Basis/presentation serialization is canonical.",
          "Exact arithmetic is used unless a tolerance profile is declared.",
          "No randomness, time, or external state."
        ]
      },
      "9. Relationship to other Omega primitives": {
        "relationships": {
