      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:chain_complex:v1.0.0\",\n  \"title\": \"Chain complex\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"A graded family of chain groups/modules C_n with boundary maps d_n:C_n→C_{n-1} satisfying d_{n-1}∘d_n=0.\",\n    \"symbol\": \"C_•\",\n    \"ascii_symbol\": \"ChainComplex\",\n    \"formula\": \"… → C_n --d_n→ C_{n-1} --d_{n-1}→ C_{n-2} → …\",\n    \"1. Contract metadata\": {\n      \"title\": \"Chain complex\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"mathematical_structure\",\n      \"primitive_scope\": \"graded chain groups with degree-lowering boundary maps\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"A graded family of chain groups/modules C_n with boundary maps d_n:C_n→C_{n-1} satisfying d_{n-1}∘d_n=0.\",\n      \"purpose\": \"Provides the base structure for cycles, boundaries, homology, exact sequences, and obstruction-theoretic constructions.\",\n      \"non_role\": [\n        \"Does not define the Omega finite cochain layer directly.\",\n        \"Does not compute Φ₁, Γ₂, or Ξ.\",\n        \"Does not classify admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"graded finite chain groups/modules over a declared coefficient domain R\",\n      \"codomain\": \"valid chain complex structure\",\n      \"maps\": {\n        \"boundary\": \"d_n:C_n→C_{n-1}\"\n      }\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"coefficient domain R\",\n        \"degree index set\",\n        \"finite chain group/module C_n for each declared degree n\",\n        \"ordered basis or finite presentation for each C_n\",\n        \"boundary map d_n for each declared adjacent degree\",\n        \"boundary law d_{n-1}∘d_n=0\"\n      ],\n      \"optional\": [\n        \"boundedness declaration\",\n        \"filtration\",\n        \"augmentation\",\n        \"grading convention\"\n      ]\n    },\n    \"5. Definition\": {\n      \"chain_complex\": \"A chain complex is a graded object C_• with degree-lowering maps d_n such that d_{n-1}∘d_n=0 for all adjacent declared degrees.\",\n      \"cycles\": \"Z_n = ker(d_n).\",\n      \"boundaries\": \"B_n = im(d_{n+1}).\",\n      \"homology\": \"H_n = Z_n / B_n when B_n⊆Z_n follows from d_n∘d_{n+1}=0.\",\n      \"finite_scope\": \"This contract version covers finite declared degree sets only.\"\n    },\n    \"6. Laws and invariants\": {\n      \"boundary_squared_zero\": \"d_{n-1}∘d_n=0 for all adjacent declared degrees.\",\n      \"degree_shift\": \"d_n lowers degree by one.\",\n      \"coefficient_uniformity\": \"All C_n are modules over the same declared coefficient domain R.\",\n      \"dimension_or_presentation_compatibility\": \"Boundary maps have source and target compatible with declared C_n presentations.\",\n      \"homology_well_defined\": \"B_n⊆Z_n follows from the boundary law.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"strict_equality\": \"Same R, same degree set, same ordered bases/presentations, same boundary maps.\",\n      \"chain_isomorphism\": \"Degreewise invertible maps F_n:C_n→C'_n satisfying F_{n-1}d_n=d'_nF_n.\",\n      \"chain_homotopy_equivalence\": \"Separate contract; not assumed here.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Boundary application is deterministic.\",\n        \"Boundary composition d_{n-1}d_n is replayable.\",\n        \"Basis/presentation serialization is canonical.\",\n        \"Exact arithmetic is used unless a tolerance profile is declared.\",\n        \"No randomness, time, or external state.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"CochainLayer\": \"Omega COCHAIN_LAYER_CONTRACT is a degree-0..2 cochain specialization with degree-raising coboundaries d₀:C⁰→C¹ and d₁:C¹→C².\",\n        \"BoundarySpace\": \"B_n = im(d_{n+1}).\",\n        \"CycleSpace\": \"Z_n = ker(d_n).\",\n        \"Homology\": \"H_n = Z_n/B_n.\",\n        \"Phi1\": \"Φ₁ is not defined by this contract; it belongs to the Omega cochain quotient layer.\",\n        \"Gamma2\": \"Γ₂ is not this chain boundary law; Omega Γ₂ uses cochain d₁:C¹→C².\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ChainComplexDescriptor {\\n    pub coefficient_domain_hash: String,\\n    pub degree_index_set_hash: String,\\n    pub chain_group_hashes: Vec<String>,\\n    pub boundary_map_hashes: Vec<String>,\\n    pub boundary_law_witness_hash: Option<String>,\\n    pub arithmetic_mode_hash: String,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Boundary map has wrong degree shift.\",\n        \"d_{n-1}∘d_n != 0.\",\n        \"Missing chain group for boundary source or target.\",\n        \"Coefficient domain mismatch between chain groups.\",\n        \"Boundary map dimensions/presentations incompatible.\",\n        \"Chain complex confused with Omega cochain layer.\",\n        \"Homology claimed without boundary law.\",\n        \"Authority, admissibility, or customer claim emitted.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Bounded, filtered, and augmented specializations.\",\n        \"Double complexes.\",\n        \"Spectral sequence construction interface.\",\n        \"Infinite-dimensional chain groups.\",\n        \"Chain homotopy equivalence contract.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"CHAIN_COMPLEX_CONTRACT\": {\n        \"symbol\": \"C_•\",\n        \"ascii_symbol\": \"ChainComplex\",\n        \"formula\": \"d_{n-1}∘d_n=0\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"graded finite chain groups/modules over R\",\n        \"codomain\": \"valid chain complex\",\n        \"required_structures\": [\n          \"coefficient domain R\",\n          \"degree index set\",\n          \"finite C_n\",\n          \"basis or finite presentation\",\n          \"boundary maps d_n:C_n→C_{n-1}\",\n          \"boundary law d_{n-1}d_n=0\"\n        ],\n        \"definition\": \"graded chain groups with degree-lowering boundary maps squaring to zero\",\n        \"laws\": [\n          \"d²=0\",\n          \"degree shift -1\",\n          \"coefficient uniformity\",\n          \"B_n⊆Z_n\"\n        ],\n        \"forbidden_interpretations\": [\n          \"Omega cochain layer without dual/specialization\",\n          \"Φ₁/Γ₂/Ξ functional\",\n          \"policy decision\",\n          \"customer claim\",\n          \"certificate authority\"\n        ],\n        \"relationships\": [\n          \"Z_n=ker(d_n)\",\n          \"B_n=im(d_{n+1})\",\n          \"H_n=Z_n/B_n\",\n          \"COCHAIN_LAYER is degree-raising cochain specialization\"\n        ],\n        \"negative_tests\": [\n          \"wrong degree shift\",\n          \"d² nonzero\",\n          \"missing source/target group\",\n          \"coefficient mismatch\",\n          \"chain/cochain confusion\"\n        ],\n        \"open_questions\": [\n          \"filtered/bounded/augmented variants\",\n          \"double complexes\",\n          \"spectral sequences\",\n          \"chain homotopy\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
