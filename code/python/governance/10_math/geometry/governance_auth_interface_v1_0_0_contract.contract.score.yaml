      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:auth_interface:v1.0.0\",\n  \"title\": \"AuthInterface\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"AuthInterface\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"PolicyContract\",\n        \"BoundaryContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the authentication and authorization boundary for the system.\\n\\nAuthInterface is NOT an operator in the five-effect-class algebra (E, I, C, R, M).\\nIt is an access-gating boundary. Auth is orthogonal to the effect-class algebra -- it\\ngates access to resources, not computation. Auth must not be confused with Evaluator,\\nwhich judges admissibility of evidence. Auth judges identity and permission.\\n\",\n    \"non_role\": [\n      \"certification\",\n      \"evaluation\",\n      \"terminalization\",\n      \"execution\",\n      \"mutation\",\n      \"evidence authority creation\",\n      \"admissibility judgment\",\n      \"operator classification\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM-generated content carries zero authority at this interface. LLM output is candidate\\nmaterial only. No LLM output may influence identity verification, role assignment,\\npermission grants, or access decisions. Auth decisions are deterministic functions of\\nverified identity, declared roles, and permission grants.\\n\"\n    },\n    \"core_definition\": \"The AuthInterface verifies identity, resolves declared roles, and checks permission scope\\nagainst grants. It gates access to system resources. It does not judge the admissibility\\nof evidence (that is the Evaluator's role), does not classify candidates (that is\\ngovernance), and does not execute state transitions (that is the Engine's role).\\n\\nAuth answers: \\\"Is this requester allowed to access this resource?\\\"\\nEvaluator answers: \\\"Is this evidence admissible under policy?\\\"\\n\\nThese are distinct questions. Auth must not absorb Evaluator responsibilities or vice versa.\\n\",\n    \"certificate_authority_bound\": {\n      \"doctrine\": 6,\n      \"text\": \"Auth does not create certificate authority. Auth decisions confirm identity and permission\\nscope. Any downstream certificate that references an auth decision inherits no additional\\nauthority from the auth gate itself. Auth is a precondition for access, not a source of\\nevidence authority.\\n\"\n    },\n    \"admissibility_checklist\": [\n      \"Identity is verified (token, credential, or certificate-based)\",\n      \"Role is declared (not inferred or assumed)\",\n      \"Permission scope is bounded (specific resource or resource class)\",\n      \"Request schema validates\",\n      \"Auth policy is declared and versioned\"\n    ],\n    \"refusal_conditions\": [\n      \"Unverified identity (missing, expired, or invalid credential)\",\n      \"Undeclared role (role not present in identity claims)\",\n      \"Permission scope exceeds grant (requested access beyond what role allows)\",\n      \"Missing auth policy\",\n      \"Malformed auth request\",\n      \"Expired session or token\",\n      \"Identity spoofing detected\",\n      \"Role escalation attempt\"\n    ],\n    \"auth_vs_evaluator_boundary\": \"Auth:      gates access by identity and permission\\nEvaluator: judges admissibility of evidence under policy\\n\\nAuth does NOT:\\n  - judge evidence quality\\n  - classify candidates\\n  - apply evaluation policy\\n  - make admissibility verdicts\\n\\nEvaluator does NOT:\\n  - verify identity\\n  - check permissions\\n  - resolve roles\\n  - gate resource access\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"certify\",\n        \"evaluate\",\n        \"terminalize\",\n        \"execute\",\n        \"mutate\",\n        \"authority_upgrade\",\n        \"sign_certificate\",\n        \"create_authority\",\n        \"admissibility_verdict\"\n      ]\n    },\n    \"required_tests\": [\n      \"auth_rejects_unverified_identity\",\n      \"auth_rejects_undeclared_role\",\n      \"auth_rejects_scope_exceeding_grant\",\n      \"auth_does_not_judge_evidence_admissibility\",\n      \"auth_does_not_create_certificate_authority\",\n      \"auth_is_orthogonal_to_effect_class_algebra\",\n      \"auth_decision_does_not_carry_evidence_authority\",\n      \"auth_llm_output_carries_no_authority\"\n    ],\n    \"canonical_invariant\": \"Auth gates access by identity and permission. It is orthogonal to the effect-class\\nalgebra and does not judge evidence admissibility, create certificate authority, or\\nexecute state transitions.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"AuthInterface\",\n      \"role\": \"Authentication and authorization boundary gating access to system resources\",\n      \"version\": \"1.0\",\n      \"classification\": \"governance\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"PolicyContract\",\n        \"BoundaryContract\"\n      ],\n      \"forbidden_authority\": [\n        \"certification\",\n        \"evaluation\",\n        \"terminalization\",\n        \"execution\",\n        \"mutation\",\n        \"evidence authority creation\",\n        \"admissibility judgment\",\n        \"operator classification\"\n      ],\n      \"primary_output_family\": \"DecisionEnvelope\",\n      \"domain_output_kind\": \"AuthDecision\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    },\n    \"migration_note\": \"authority_effect set to none per validate_auth_interface (legacy YAML declared RequestsDecision; that was YAML->Rust drift, resolved in favor of the validator).\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
