      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cohomology_class:v0.1.0\",\n  \"title\": \"CohomologyClass Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quotient_group_element\",\n    \"symbol\": \"[α] ∈ H^n(C•)\",\n    \"ascii_symbol\": \"cohomology_class\",\n    \"notation\": \"[α] ∈ H^n(C•)\",\n    \"domain\": [\n      \"representative: cocycle in ker(delta_n)\",\n      \"coboundary_subspace: im(delta_{n-1})\",\n      \"quotient_space: H^n = ker(delta_n) / im(delta_{n-1})\"\n    ],\n    \"codomain\": {\n      \"description\": \"Equivalence class [alpha] where alpha is a cocycle in ker(delta_n), with equivalence relation: alpha ~ beta if alpha - beta ∈ im(delta_{n-1})\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Representative must be a cocycle (delta_n(representative) = 0)\",\n      \"Coboundary subspace must be im(delta_{n-1}) for correct degree\",\n      \"Quotient space must match ker(delta_n) / im(delta_{n-1})\",\n      \"Representative must be in canonical normal form for the quotient\",\n      \"class_hash must match deterministic hash of normal form representative\"\n    ]\n  },\n  \"laws\": [\n    \"delta_n(alpha) = 0\",\n    \"[alpha] = [beta] iff alpha - beta ∈ im(delta_{n-1})\",\n    \"[alpha] + [beta] = [alpha + beta]\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Reducing the same cocycle modulo the same coboundary subspace with the same quotient algorithm must reproduce class_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"homology_class\",\n    \"symbols\": [\n      \"CohomologyClass\"\n    ],\n    \"required_tests\": [\n      \"test_cohomology_class_complex_mismatch_rejected\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Representative that is not a cocycle (delta_n ≠ 0)\",\n    \"Coboundary subspace from incorrect degree\",\n    \"Quotient basis inconsistent with quotient space\",\n    \"class_hash does not match normal form computation\",\n    \"Artifact attempting to claim authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Equivalence class [alpha] in H^n = ker(delta_n) / im(delta_{n-1}) represented by a cocycle modulo coboundaries.\\nCohomology classes represent closed cochains up to coboundary equivalence and are core obstruction and characteristic-class carriers.\",\n    \"non_role\": [\n      \"Does not classify admissibility or emit policy decisions\",\n      \"Does not emit certificates or produce customer-facing claims\",\n      \"Does not terminalize or make authority decisions\",\n      \"Does not compute cup products (handled by dependent contract)\"\n    ]\n  },\n  \"wip\": [\n    \"Define cup-product compatibility in a dependent contract\",\n    \"Core structure complete, awaiting cup-product extension\",\n    \"Validation infrastructure matches template requirements\",\n    \"Replay requirements explicitly defined for class_hash\"\n  ]\n}\n",
