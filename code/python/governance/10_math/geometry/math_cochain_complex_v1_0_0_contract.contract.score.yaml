      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cochain_complex:v1.0.0\",\n  \"title\": \"Cochain Complex\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"cochain_complex\",\n    \"symbol\": \"C^•\",\n    \"ascii_symbol\": \"CochainComplex\",\n    \"notation\": \"... → C^{n-1} → C^n → C^{n+1} → ...\",\n    \"domain\": [\n      \"graded cochain groups C^n over a coefficient field or ring\",\n      \"degree-raising coboundary maps delta_n : C^n → C^{n+1}\",\n      \"a degree index set\"\n    ],\n    \"codomain\": {\n      \"description\": \"a well-formed graded complex artifact (purely structural; emits no class)\"\n    },\n    \"definition\": {\n      \"degree_shift\": \"delta_n : C^n → C^{n+1} raises degree by exactly 1\",\n      \"complex_law\": \"delta_{n+1} ∘ delta_n = 0 for all n\",\n      \"graded_module_structure\": \"each C^n is a module over a fixed coefficient domain\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"graded module with a degree-indexed family of cochain groups C^n\",\n      \"a complete coboundary-map table delta_n for every adjacent degree pair\",\n      \"a single fixed coefficient domain (field or ring) shared by all C^n\",\n      \"a complex-law witness establishing delta_{n+1} ∘ delta_n = 0\",\n      \"an explicit finite basis hash for each cochain group\"\n    ],\n    \"compatibility\": [\n      \"all cochain groups must share the same coefficient domain\",\n      \"source/target degrees of every coboundary map must exist in the degree index set\"\n    ]\n  },\n  \"laws\": {\n    \"degree_shift\": \"Every coboundary map raises degree by exactly one (C^n → C^{n+1}).\",\n    \"complex_law\": \"delta_{n+1} ∘ delta_n = 0 for all n — the defining cochain-complex identity.\",\n    \"graded_module_structure\": \"Each C^n is a module over the single shared coefficient domain.\",\n    \"coefficient_consistency\": \"A complex with mixed coefficient domains is not well-formed.\",\n    \"descriptive_only\": \"The complex is structural; it classifies nothing and confers no authority.\"\n  },\n  \"equivalence\": {\n    \"artifact_equality\": \"Two complexes are equal iff their content-addressed StructureArtifact hashes agree under canonical serialization.\",\n    \"coefficient_mode\": \"Equality requires the same declared coefficient domain and degree index set.\"\n  },\n  \"replay\": {\n    \"requirements\": [\n      \"no external state, randomness, or time-dependent data\",\n      \"graded-module and coboundary-map data fixed as canonical byte arrays\",\n      \"coboundary composition deterministic from canonical matrices\",\n      \"deterministic SHA-256 artifact hash reproducible from the inputs\"\n    ]\n  },\n  \"relationships\": {\n    \"CochainGroup\": \"Each degree component C^n of the complex is a [[cochain_group]].\",\n    \"Cohomology\": \"Cohomology H^n is the homology of this complex (ker delta_n / im delta_{n-1}).\",\n    \"CechCochain\": \"Čech cochains assemble into a cochain complex of this shape over a nerve.\",\n    \"ObstructionClass\": \"Obstruction classes are cohomology classes of a cochain complex.\",\n    \"Phi1\": \"The degree-1 obstruction functional acts on residuals living in this complex's C^1.\",\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"cochain_complex\",\n    \"symbols\": [\n      \"CochainComplex\"\n    ],\n    \"required_tests\": [\n      \"test_coboundary_law_violation_rejected\",\n      \"test_dimension_mismatch_d0\",\n      \"dim_rejects_degree_outside_finite_support\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Coboundary map with the wrong degree shift (delta : C^n → C^m, m ≠ n+1)\",\n    \"Complex-law violation (delta_{n+1} ∘ delta_n ≠ 0)\",\n    \"Missing cochain group for a coboundary map's source or target\",\n    \"Coefficient-domain mismatch (different fields for different groups)\",\n    \"Artifact claiming authority or admissibility\",\n    \"Unbounded complex declared without an explicit specification\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Graded cochain groups C^n with degree-raising coboundary maps satisfying delta ∘ delta = 0 — the base structure for cocycles, coboundaries, cohomology, Čech complexes, and obstruction classes. Purely structural; confers no authority.\\n\",\n    \"non_role\": [\n      \"Does not compute cohomology (see the cohomology contract).\",\n      \"Does not specialize to Čech or de Rham complexes (separate contracts).\",\n      \"Does not model double complexes or spectral sequences (separate contracts).\",\n      \"Does not issue certificates, terminalize, or produce customer-facing claims.\"\n    ]\n  },\n  \"wip\": [\n    \"Currently targets bounded cochain complexes only; unbounded complexes deferred.\",\n    \"Čech and de Rham specializations will be separate contracts referencing this base.\",\n    \"Filtered complexes and bicomplexes are out of scope for v1.\",\n    \"Legacy owner block named promotion target omega_homology::cochain_complex.rs.\",\n    \"Legacy owner note: Cohomological grading: d raises degree by +1. Construction or explicit validation must witness d^2=0. See MATHEMATICAL_CONVENTIONS.md.\"\n  ]\n}\n",
