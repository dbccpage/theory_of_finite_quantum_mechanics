          "summary": "Defines the induced homomorphism f_*: H_n(C) -> H_n(D) for any chain map f: C_* -> D_*. The homology functor H_n: Ch(R-Mod) -> R-Mod sends chain complexes to their n-th homology modules and chain maps to the induced homomorphisms on homology. Functoriality guarantees that composition of chain maps is preserved at the homology level: (g . f)_* = g_* . f_* and (id_C)_* = id_{H(C)}. This is crucial for verifying that state-machine transitions (refinements) do not change topological invariants."
        },
        "kind": "math_contract",
        "laws": [
          "For chain maps f: C_* -> D_* and g: D_* -> E_*, the induced map satisfies (g . f)_* = g_* . f_*: H_n(C) -> H_n(E).\n",
          "For the identity chain map id_C: C_* -> C_*, the induced map satisfies (id_C)_* = id_{H_n(C)}.\n",
          "A chain map f: C_* -> D_* satisfies d^D_n . f_n = f_{n-1} . d^C_n for all n. This commutativity is required for the induced map on homology to be well-defined.\n",
          "The induced map f_*: H_n(C) -> H_n(D) is independent of the representative chosen for a homology class: if [z] = [z'] in H_n(C), then [f_n(z)] = [f_n(z')] in H_n(D). This follows from the chain map condition.\n",
          "H_n(C) = ker(d_n: C_n -> C_{n-1}) / im(d_{n+1}: C_{n+1} -> C_n), and H_n(C) inherits R-module structure from Z_n(C) = ker(d_n).\n"
