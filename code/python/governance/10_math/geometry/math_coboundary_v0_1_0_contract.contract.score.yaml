    "doctrine": {
      "summary": "A Coboundary is a cochain beta in C^n that is the image beta = delta_{n-1}(alpha) of a cochain alpha in C^{n-1}, where delta is the coboundary map of a cochain complex. Coboundaries are exact cocycles and form the quotient denominator for cohomology classes. This contract defines the structure, validation, and deterministic operations for coboundaries, ensuring that they are properly witnessed as images of coboundary maps.",
