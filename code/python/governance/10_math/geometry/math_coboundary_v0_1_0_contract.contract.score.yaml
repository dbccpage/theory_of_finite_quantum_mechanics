      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:coboundary:v0.1.0\",\n  \"title\": \"Coboundary Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"coboundary\",\n    \"symbol\": \"beta = delta_{n-1}(alpha), beta ∈ B^n(C) ⊆ Z^n(C) ⊆ C^n\",\n    \"ascii_symbol\": \"coboundary\",\n    \"notation\": \"beta = delta_{n-1}(alpha), beta ∈ B^n(C) ⊆ Z^n(C) ⊆ C^n\",\n    \"domain\": [\n      \"cochain_complex: C^•\",\n      \"source_cochain_group: C^{n-1}\",\n      \"target_cochain_group: C^n\",\n      \"coboundary_map: delta_{n-1}: C^{n-1} → C^n\",\n      \"preimage_cochain: alpha ∈ C^{n-1}\",\n      \"coboundary_cochain: beta = delta_{n-1}(alpha) ∈ C^n\"\n    ],\n    \"codomain\": {\n      \"description\": \"Cochain beta in C^n that is the image of coboundary map delta_{n-1}\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Preimage cochain alpha must be valid member of C^{n-1}\",\n      \"Coboundary map must have degree +1 (maps C^{n-1} to C^n)\",\n      \"Coboundary cochain beta must equal delta_{n-1}(alpha)\",\n      \"Coboundary cochain beta must be valid member of C^n\",\n      \"Coboundary beta must satisfy delta_n(beta) = 0\"\n    ]\n  },\n  \"laws\": [\n    \"beta = delta_{n-1}(alpha) for some alpha ∈ C^{n-1}\",\n    \"delta_n(beta) = 0 (follows from delta² = 0)\",\n    \"Preimage cochain alpha is valid member of C^{n-1}\",\n    \"Coboundary cochain beta is valid member of C^n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Coboundary computation is deterministic\",\n      \"Cochain representations are canonical\",\n      \"Coboundary map is content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Preimage alpha not in C^{n-1} must be rejected\",\n    \"Coboundary beta not in C^n must be rejected\",\n    \"delta(alpha) != declared coboundary beta must be rejected\",\n    \"Coboundary map with wrong degree must be rejected\",\n    \"Coboundary artifact claiming authority must be rejected\",\n    \"Coboundary artifact claiming admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Coboundary is a cochain beta in C^n that is the image beta = delta_{n-1}(alpha) of a cochain alpha in C^{n-1}, where delta is the coboundary map of a cochain complex. Coboundaries are exact cocycles and form the quotient denominator for cohomology classes. This contract defines the structure, validation, and deterministic operations for coboundaries, ensuring that they are properly witnessed as images of coboundary maps.\",\n    \"non_role\": [\n      \"Cocycle classification (separate Cocycle contract)\",\n      \"Cohomology class computation (separate CohomologyClass contract)\",\n      \"Coboundary representative selection (deferred)\"\n    ]\n  },\n  \"wip\": [\n    \"Should we define normalized coboundary representatives?\",\n    \"Currently assumes finite cochain complexes\",\n    \"Coboundary representative selection is not yet specified\",\n    \"Relationship to Cocycle contract needs clarification\",\n    \"Dual to Boundary contract in chain complexes\"\n  ]\n}\n",
