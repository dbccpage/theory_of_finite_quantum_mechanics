    "doctrine": {
      "summary": "A single Čech k-cochain: an assignment of coefficient-group elements to the k-simplices of the nerve of a cover. Purely structural; confers no authority.\n",
      "non_role": [
        "Does not represent the full Čech cohomology complex (see the Čech cohomology contract).",
