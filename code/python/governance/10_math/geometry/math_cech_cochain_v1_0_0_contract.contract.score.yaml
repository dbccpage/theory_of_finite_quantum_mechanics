      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cech_cochain:v1.0.0\",\n  \"title\": \"Čech Cochain\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"cochain\",\n    \"symbol\": \"c : N(U)_k → G\",\n    \"ascii_symbol\": \"CechCochain\",\n    \"notation\": \"c : N(U)_k → G\",\n    \"domain\": [\n      \"the nerve N(U) of a cover U = {U_i} of a space X\",\n      \"a non-negative degree k\",\n      \"an abelian coefficient group G\",\n      \"a map from k-simplex identifiers to elements of G\"\n    ],\n    \"codomain\": {\n      \"description\": \"a single validated Čech k-cochain (purely structural; emits no class)\"\n    },\n    \"definition\": {\n      \"cochain\": \"a function c assigning to each k-simplex of N(U) an element of G\",\n      \"coboundary\": \"delta : C^k → C^{k+1} via the alternating-sum formula\",\n      \"scope\": \"this contract is a single k-cochain; the full complex lives in Čech cohomology\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"a nerve_id resolving to a valid Nerve artifact\",\n      \"a degree k with 0 ≤ k ≤ max dimension of the nerve\",\n      \"all simplex ids being valid, sorted k-simplices of the nerve\",\n      \"each value being a valid element of the coefficient group\",\n      \"values sorted lexicographically by simplex id, each simplex at most once\",\n      \"a content-addressed SHA-256 hash over the canonical serialization\"\n    ],\n    \"compatibility\": [\n      \"the degree must not exceed the nerve's maximum dimension\",\n      \"coefficient values must belong to the declared coefficient group\"\n    ]\n  },\n  \"laws\": {\n    \"simplex_membership\": \"Every simplex id must be a valid, canonically-sorted k-simplex of the nerve.\",\n    \"coefficient_validity\": \"Every value is a valid element of the declared abelian coefficient group.\",\n    \"uniqueness\": \"Each simplex appears at most once in the value map.\",\n    \"canonical_order\": \"Values are sorted lexicographically by simplex id; sorted ids imply alternating signs.\",\n    \"descriptive_only\": \"A cochain is structural; it classifies nothing and confers no authority.\"\n  },\n  \"equivalence\": {\n    \"artifact_equality\": \"Two cochains are equal iff nerve, degree, coefficient group, and canonical values hash agree.\",\n    \"zero_cochain\": \"An empty value list and an all-identity assignment are equivalent via the group identity.\"\n  },\n  \"replay\": {\n    \"requirements\": [\n      \"no external state, randomness, or time-dependent data\",\n      \"simplex ids serialized as sorted tuples of 4-byte unsigned LE integers\",\n      \"values serialized in the coefficient group's canonical form, sorted by simplex id\",\n      \"deterministic SHA-256 hash over the canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"Nerve\": \"Cochains are defined on the simplices of the nerve N(U) of a cover.\",\n    \"CochainComplex\": \"Čech cochains assemble into a [[cochain_complex]] under the Čech coboundary.\",\n    \"CechCohomology\": \"Čech cohomology is the cohomology of the complex of these cochains.\",\n    \"Cover\": \"The cover U of the space X induces the nerve on which cochains live.\",\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"nerve_id does not resolve to a Nerve artifact\",\n    \"degree exceeds the nerve's maximum dimension\",\n    \"simplex id references vertices not in the nerve, or has the wrong cardinality\",\n    \"simplex id is unsorted (e.g. (2,0,1) instead of (0,1,2))\",\n    \"duplicate simplex id in the value list\",\n    \"value not in the coefficient group (e.g. 0.5 for coefficients in Z)\",\n    \"value list not sorted lexicographically by simplex id\",\n    \"artifact hash does not match the recomputed hash\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A single Čech k-cochain: an assignment of coefficient-group elements to the k-simplices of the nerve of a cover. Purely structural; confers no authority.\\n\",\n    \"non_role\": [\n      \"Does not represent the full Čech cohomology complex (see the Čech cohomology contract).\",\n      \"Does not compute cohomology groups directly.\",\n      \"Does not handle cup products (a separate computation).\",\n      \"Does not issue certificates, terminalize, or produce customer-facing claims.\"\n    ]\n  },\n  \"wip\": [\n    \"Sheaf coefficients are planned via a Sheaf artifact hash in the coefficient group id.\",\n    \"Zero cochain may be an empty list; the group identity handles equivalence.\",\n    \"Cup product will be a separate operation with a dedicated computation witness.\",\n    \"Alternating-sign convention is implicit in the sorted-simplex representation.\"\n  ]\n}\n",
