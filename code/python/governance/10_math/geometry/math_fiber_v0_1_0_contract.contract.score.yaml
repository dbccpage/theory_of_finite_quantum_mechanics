        "doctrine": {
          "summary": "A Fiber is the representation of the vector space attached to a point of a base space (e.g., the fiber of a vector bundle).  It is a finite‑dimensional vector space V_p over a field K, equipped with an ordered basis.  The contract captures the structure of V_p together with the base‑point identifier, guaranteeing dimension, field consistency, and basis integrity.  It does not prescribe connections, transition maps, or bundle topology; those belong to separate contracts."
        },
        "kind": "math_contract",
        "layer": "math",
        "relationships": {
          "extends": [
            "urn:omega:governance:base_contract:v1.0.0"
