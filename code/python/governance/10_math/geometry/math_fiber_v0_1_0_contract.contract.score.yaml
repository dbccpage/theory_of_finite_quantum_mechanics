        "schema_version": "omega.contract.v1",
        "status": "mathematical_wip",
        "title": "Fiber",
        "wip": [
          {
            "items": [
              "The exact format of base_point_id is not yet standardised; for smooth manifolds it could be a tuple of coordinates and a chart name, but a general bundle base might be a topological space. Currently the contract accepts any non‑empty byte string with a hash, leaving the interpretation to higher‑level contexts.\n",
              "The relationship between a Fiber and a Vector residing in it is not formalised here; it is expected that a Vector contract will reference the Fiber's codomain_basis_hash as its own codomain.\n",
              "No fiber‑wise inner product or norm is included; those would be separate structure contracts (e.g., InnerProduct on a Fiber).\n",
              "The contract does not address infinite‑dimensional fibers.",
              "The list of allowed FactEnvelope types (e.g., \"is_trivial_bundle\", \"has_constant_rank\") is deferred to a future sub‑contract.\n",
              "The validation of linear independence of the basis is optional and may be performed by an external verifier; the contract only guarantees hash consistency by default.\n"
            ],
            "wip_status": true
          }
        ]
