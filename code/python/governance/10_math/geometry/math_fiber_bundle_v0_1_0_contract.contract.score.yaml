      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:fiber_bundle:v0.1.0\",\n  \"title\": \"FiberBundle\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"A FiberBundle is a collection of finite-dimensional vector spaces (fibers) over a common field K, each attached to a distinct base point.  It is the discrete analogue of a vector bundle: the total space is the disjoint union of the fibers, the base space is a set of abstract points, and the projection maps each fiber to its base point.  The contract ensures that all fibers share the same field and dimension, that base points are unique, and that each fiber is a valid Fiber artifact.  No topological, smooth, or continuity conditions are imposed; those belong to separate contracts.\"\n  },\n  \"wip\": [\n    {\n      \"wip_status\": true,\n      \"questions\": [\n        {\n          \"question\": \"The contract assumes a discrete base set; for continuous base spaces (manifolds) a separate `TopologicalFiberBundle` contract would be needed, incorporating atlas and transition functions.\\n\"\n        },\n        {\n          \"question\": \"Global frames (choices of basis for every fiber that vary smoothly) are not covered; a `FrameField` contract may be added later.\\n\"\n        },\n        {\n          \"question\": \"The bundle currently requires explicit Fiber artifacts for every base point, which is impractical for infinite bases.  A future version might allow a generator function (content-addressed) that produces Fibers on demand.\\n\"\n        },\n        {\n          \"question\": \"The concept of a \\\"typical fiber\\\" (a Fiber without a base point) is not yet standardised; the `typical_fiber_basis_hash` field is optional and informative.\\n\"\n        },\n        {\n          \"question\": \"Sub-bundle and quotient bundle constructions are deferred to ComputationWitness specifications.\\n\"\n        },\n        {\n          \"question\": \"The exact sorting rule for base point IDs with mixed encodings (text vs. binary) needs a precise canonicalisation; currently it is bytewise comparison of the raw UTF-8/byte strings.\\n\"\n        }\n      ]\n    }\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "record": {
        "contract_id": "urn:omega:math:fiber_bundle:v0.1.0",
        "descriptor": {
          "authority_effect": "none",
          "customer_claim_allowed": false,
          "dependencies": {
            "contracts": [],
            "proof_obligations": []
          },
          "evidence_ceiling": "ShapeOnly",
          "operator_classes": {
            "may_support": [],
            "must_not_self_assign": true
          },
          "refusals": {
            "may_emit": []
          },
          "runtime_enforcement": false,
          "terminals": {
            "may_emit": [],
            "may_support": []
          }
        },
        "doctrine": {
          "summary": "A FiberBundle is a collection of finite-dimensional vector spaces (fibers) over a common field K, each attached to a distinct base point.  It is the discrete analogue of a vector bundle: the total space is the disjoint union of the fibers, the base space is a set of abstract points, and the projection maps each fiber to its base point.  The contract ensures that all fibers share the same field and dimension, that base points are unique, and that each fiber is a valid Fiber artifact.  No topological, smooth, or continuity conditions are imposed; those belong to separate contracts."
        },
        "kind": "math_contract",
        "layer": "math",
        "relationships": {
          "extends": [
            "urn:omega:governance:base_contract:v1.0.0"
          ]
        },
        "schema_version": "omega.contract.v1",
        "status": "mathematical_wip",
        "title": "FiberBundle",
        "wip": [
          {
            "questions": [
              {
                "question": "The contract assumes a discrete base set; for continuous base spaces (manifolds) a separate `TopologicalFiberBundle` contract would be needed, incorporating atlas and transition functions.\n"
              },
              {
                "question": "Global frames (choices of basis for every fiber that vary smoothly) are not covered; a `FrameField` contract may be added later.\n"
              },
              {
                "question": "The bundle currently requires explicit Fiber artifacts for every base point, which is impractical for infinite bases.  A future version might allow a generator function (content-addressed) that produces Fibers on demand.\n"
              },
              {
                "question": "The concept of a \"typical fiber\" (a Fiber without a base point) is not yet standardised; the `typical_fiber_basis_hash` field is optional and informative.\n"
              },
              {
                "question": "Sub-bundle and quotient bundle constructions are deferred to ComputationWitness specifications.\n"
              },
              {
                "question": "The exact sorting rule for base point IDs with mixed encodings (text vs. binary) needs a precise canonicalisation; currently it is bytewise comparison of the raw UTF-8/byte strings.\n"
              }
            ],
            "wip_status": true
          }
        ]
      },
