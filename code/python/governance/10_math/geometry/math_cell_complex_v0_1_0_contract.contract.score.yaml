      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cell_complex:v0.1.0\",\n  \"title\": \"CellComplex Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"cell_complex\",\n    \"symbol\": \"X = X^0 ∪ X^1 ∪ ... ∪ X^n with φ_α: S^{k-1} → X^{k-1}\",\n    \"ascii_symbol\": \"cell_complex\",\n    \"notation\": \"X = X^0 ∪ X^1 ∪ ... ∪ X^n with φ_α: S^{k-1} → X^{k-1}\",\n    \"domain\": [\n      \"max_dimension: non-negative integer N\",\n      \"cells: list of N+1 lists of cell identifiers\",\n      \"attaching_maps: list of AttachingMapDescriptor for each cell with dimension ≥ 1\"\n    ],\n    \"codomain\": {\n      \"description\": \"A finite CW complex with cells organized by dimension, where each n-cell (n ≥ 1) has an attaching map from S^{n-1} to the (n-1)-skeleton X^{n-1}.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"cells list has exactly max_dimension + 1 entries\",\n      \"No cell identifier appears more than once\",\n      \"Cell identifiers within each dimension are sorted lexicographically\",\n      \"At least one 0-cell is required\",\n      \"Each k-cell (k ≥ 1) has an attaching map with correct dimension and valid boundary references\",\n      \"∂∂ = 0 for all cells\",\n      \"StructureArtifact hash matches canonical serialization\"\n    ]\n  },\n  \"laws\": [\n    \"max_dimension ≥ 0\",\n    \"cells[0] is non-empty\",\n    \"Each cell identifier is unique across all dimensions\",\n    \"For all k-cells c with k ≥ 2, ∂(∂c) = 0\",\n    \"Each n-cell (n ≥ 1) has exactly one attaching map referencing only (n-1)-cells\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cell identifiers serialized in sorted order within each dimension\",\n      \"Dimensions serialized in ascending order\",\n      \"Attaching maps serialized by dimension ascending, then cell_id lexicographic\",\n      \"AttachingMapDescriptor fields serialized as: cell_id (length-prefixed), dimension (4-byte LE), boundary_cells count (4-byte LE), pairs of (cell_id length-prefixed, coefficient signed 4-byte LE)\"\n    ]\n  },\n  \"negative_tests\": [\n    \"max_dimension = -1 must be rejected\",\n    \"max_dimension = 2 but cells has 4 lists\",\n    \"cell_a appears in both cells[0] and cells[1]\",\n    \"cells[0] = [] must be rejected\",\n    \"1-cell has no AttachingMapDescriptor\",\n    \"2-cell attaching map references 0-cell instead of 1-cell\",\n    \"Attaching map references cell not in skeleton\",\n    \"For 2-cell c, ∂(∂c) ≠ 0\",\n    \"cells[1] = ['b', 'a'] not lexicographically ordered\",\n    \"Non-canonical attaching map serialization order\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A CellComplex (CW complex) is a topological space constructed by iteratively attaching cells of increasing dimension. The contract defines a finite CW complex with an explicit cell structure: a finite set of cells indexed by dimension, together with attaching maps for each cell. Each n-cell has an attaching map from the (n-1)-sphere to the (n-1)-skeleton. The contract validates the inductive structure, cell counts, and attaching map consistency, but does not compute homology or homotopy groups (those are ComputationWitness outputs).\",\n    \"non_role\": [\n      \"Geometric embeddings or coordinate representations\",\n      \"Infinite CW complexes\",\n      \"Homotopy group computation (provided as ComputationWitness)\",\n      \"Homology group computation (provided as ComputationWitness)\",\n      \"Relative CW complexes (X, A)\"\n    ]\n  },\n  \"wip\": [\n    \"Geometric embeddings or characteristic maps beyond combinatorial boundary data - separate GeometricCellComplex contract?\",\n    \"Support for infinite CW complexes?\",\n    \"Relationship with SimplicialComplex - conversion via simplicial_to_cellular ComputationWitness?\",\n    \"Orientation consistency enforcement across the complex (currently not enforced, but can be verified via FactEnvelope 'is orientable')\",\n    \"Relative CW complexes (X, A) - add as RelativeCellComplex contract with subspace reference?\",\n    \"Performance optimization for ∂∂ = 0 check on large complexes (O(cells * boundary_size))\",\n    \"Contract uses signed coefficients in attaching maps to encode orientation\",\n    \"Simplicial complexes can be viewed as special case of regular CW complexes\",\n    \"Homology and homotopy groups are ComputationWitness outputs, not part of contract validation\",\n    \"All serialization must follow canonical order: dimensions ascending, then cell_id lexicographic within dimension\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
