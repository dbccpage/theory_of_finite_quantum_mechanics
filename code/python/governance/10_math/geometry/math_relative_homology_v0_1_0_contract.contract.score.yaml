    "doctrine": {
      "summary": "Relative homology H_n(X,A) for a topological pair (X,A) with A a subspace of X. Defined as the homology of the quotient chain complex C_*(X)/C_*(A), it measures cycles in X modulo those in A. Relative homology fits into the long exact sequence of a pair, satisfies excision for good pairs, and is fundamental for Mayer-Vietoris sequences, cellular homology, and Poincare-Lefschetz duality.",
