      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:relative_homology:v0.1.0\",\n  \"title\": \"RelativeHomology Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"relative_homology_group\",\n    \"symbol\": \"H_n(X, A) = ker(d_n) / im(d_{n+1}) in C_*(X)/C_*(A)\",\n    \"ascii_symbol\": \"relative_homology\",\n    \"notation\": \"H_n(X, A) = ker(d_n) / im(d_{n+1}) in C_*(X)/C_*(A)\",\n    \"domain\": [\n      \"total_chain_complex: chain_complex_of_X\",\n      \"subspace_chain_complex: chain_complex_of_A\",\n      \"quotient_chain_complex: chain_complex_X_mod_A\",\n      \"relative_cycles: ker(d_n) in C_n(X)/C_n(A)\",\n      \"relative_boundaries: im(d_{n+1}) in C_n(X)/C_n(A)\",\n      \"connecting_homomorphism: boundary_map_H_n(X,A)_to_H_{n-1}(A)\",\n      \"coefficient_domain: ring_or_field\",\n      \"degree: integer_index\"\n    ],\n    \"codomain\": {\n      \"description\": \"Quotient module H_n(X,A) = ker(d_n)/im(d_{n+1}) computed from the quotient chain complex C_*(X)/C_*(A) for a topological pair (X,A) with A a subspace of X.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"C_*(A) is a subcomplex of C_*(X): inclusion maps commute with boundary operators\",\n      \"d^2 = 0 in the quotient chain complex C_*(X)/C_*(A)\",\n      \"The long exact sequence of the pair is exact at every term\",\n      \"The connecting homomorphism d: H_n(X,A) -> H_{n-1}(A) is well-defined on equivalence classes\",\n      \"For good pairs, the quotient map induces H_n(X,A) -> H_n(X/A, *) isomorphism\",\n      \"Relative homology class hash is deterministic and reproducible\"\n    ]\n  },\n  \"laws\": [\n    \"C_*(X)/C_*(A) is a well-defined chain complex: A is a subcomplex of X and the induced boundary maps satisfy d^2 = 0\",\n    \"The sequence ... -> H_n(A) -> H_n(X) -> H_n(X,A) -> H_{n-1}(A) -> ... is exact at every term\",\n    \"For good pairs, H_n(X,A) is isomorphic to H_n(X/A, *) via the quotient map\",\n    \"The connecting homomorphism d: H_n(X,A) -> H_{n-1}(A) is natural with respect to maps of pairs\",\n    \"d_{n-1} . d_n = 0 in the quotient chain complex C_*(X)/C_*(A)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All quotient chain complex data from canonical matrices\",\n      \"Connecting homomorphism computation is deterministic\",\n      \"Rechecking must reproduce artifact_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject when C_*(A) is not a subcomplex of C_*(X) (inclusion does not commute with boundary)\",\n    \"Reject when d^2 != 0 in the quotient chain complex C_*(X)/C_*(A)\",\n    \"Reject when the long exact sequence of the pair fails exactness\",\n    \"Reject when connecting homomorphism is not well-defined on equivalence classes\",\n    \"Reject excision claim for a pair that does not satisfy good pair conditions\",\n    \"Reject when coefficient domains of C_*(X) and C_*(A) differ\",\n    \"Reject artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Relative homology H_n(X,A) for a topological pair (X,A) with A a subspace of X. Defined as the homology of the quotient chain complex C_*(X)/C_*(A), it measures cycles in X modulo those in A. Relative homology fits into the long exact sequence of a pair, satisfies excision for good pairs, and is fundamental for Mayer-Vietoris sequences, cellular homology, and Poincare-Lefschetz duality.\",\n    \"non_role\": [\n      \"Persistent homology or filtered variants (separate contracts)\",\n      \"Cohomology or relative cohomology (separate contracts)\",\n      \"Spectral sequences derived from relative filtrations (separate contracts)\",\n      \"Infinite CW-complex pairs (currently finite pairs only)\"\n    ]\n  },\n  \"wip\": [\n    \"How to handle relative homology for non-good pairs where excision fails?\",\n    \"Should Mayer-Vietoris be a separate contract or integrated here?\",\n    \"How to support relative cohomology as a dual contract?\",\n    \"What is the interface for cellular homology construction from CW-pair relative groups?\",\n    \"How to represent Poincare-Lefschetz duality pairings with relative homology?\",\n    \"Currently targets finite CW-pair chain complexes only\",\n    \"Infinite-dimensional relative chain groups deferred to future versions\",\n    \"Cellular homology via relative groups H_n(X^n, X^{n-1}) is a primary use case\",\n    \"Mayer-Vietoris sequence construction deferred to separate contract\",\n    \"Poincare-Lefschetz duality pairing deferred to separate contract\",\n    \"Reduced relative homology (via quotient X/A) handled through excision axiom\"\n  ]\n}\n",
