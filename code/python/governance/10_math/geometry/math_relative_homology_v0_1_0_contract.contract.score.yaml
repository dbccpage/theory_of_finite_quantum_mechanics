        "connecting_homomorphism: boundary_map_H_n(X,A)_to_H_{n-1}(A)",
        "coefficient_domain: ring_or_field",
        "degree: integer_index"
      ],
      "codomain": {
        "description": "Quotient module H_n(X,A) = ker(d_n)/im(d_{n+1}) computed from the quotient chain complex C_*(X)/C_*(A) for a topological pair (X,A) with A a subspace of X.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "C_*(A) is a subcomplex of C_*(X): inclusion maps commute with boundary operators",
        "d^2 = 0 in the quotient chain complex C_*(X)/C_*(A)",
        "The long exact sequence of the pair is exact at every term",
        "The connecting homomorphism d: H_n(X,A) -> H_{n-1}(A) is well-defined on equivalence classes",
        "For good pairs, the quotient map induces H_n(X,A) -> H_n(X/A, *) isomorphism",
        "Relative homology class hash is deterministic and reproducible"
      ]
    },
    "laws": [
      "C_*(X)/C_*(A) is a well-defined chain complex: A is a subcomplex of X and the induced boundary maps satisfy d^2 = 0",
      "The sequence ... -> H_n(A) -> H_n(X) -> H_n(X,A) -> H_{n-1}(A) -> ... is exact at every term",
      "For good pairs, H_n(X,A) is isomorphic to H_n(X/A, *) via the quotient map",
      "The connecting homomorphism d: H_n(X,A) -> H_{n-1}(A) is natural with respect to maps of pairs",
      "d_{n-1} . d_n = 0 in the quotient chain complex C_*(X)/C_*(A)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
