      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_convex_geometry:v0.1.0\",\n  \"title\": \"Exact Finite Convex Geometry\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_convex_geometry\",\n    \"symbol\": \"exact_convex_geometry\",\n    \"ascii_symbol\": \"exact_convex_geometry\",\n    \"notation\": \"Exact Finite Convex Geometry\",\n    \"domain\": [\n      \"Finite points and a target over Q, or an H-representation Ex=e and Ax<=b\",\n      \"A declared complete support or active-set enumeration budget\",\n      \"Valid rational entries retain every existing finite dimension/row/candidate policy; malformed zero-denominator inputs and certificates return InvalidRational before arithmetic, after bounded structural/shape admission\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact finite constructions implemented by omega_solvers::convex_geometry; results remain scoped to the declared carrier and budgets.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Exact arithmetic and explicit finite carrier validation\",\n      \"A typed refusal for unsupported or exhausted computations\"\n    ]\n  },\n  \"laws\": [\n    \"Convex witnesses have nonnegative weights summing to one and reproduce the target\",\n    \"A negative hull decision exhausts affinely independent supports of size at most d+1\",\n    \"Every returned vertex satisfies all original constraints and a full-rank active system\",\n    \"An empty vertex list does not certify emptiness of an unbounded polyhedron\",\n    \"All public coordinate, matrix, RHS/bound and certificate scalar routes reject zero denominators before sign/elimination/objective arithmetic\",\n    \"Public convex/packing witness lengths are validated before any unbounded entry scan\",\n    \"Independent valid interval-hull, square-vertex and diagonal-packing controls retain their exact results\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact independent witness replay where a witness is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_solvers\",\n    \"module\": \"solver_convex_vertex_enum\",\n    \"symbols\": [\n      \"ConvexWitness\",\n      \"convex_membership\",\n      \"verify_convex_witness\",\n      \"vertex_enumeration\"\n    ],\n    \"required_tests\": [\n      \"convex_membership_replays_weights_and_kills_tampering\",\n      \"active_sets_find_square_and_affine_line_vertices\",\n      \"unbounded_and_vertex_free_carriers_do_not_get_false_emptiness_claims\",\n      \"convex_geometry_denominators::all_malformed_rational_routes_refuse_without_panicking\",\n      \"convex_geometry_denominators::every_malformed_route_reports_invalid_rational\",\n      \"convex_geometry_denominators::valid_geometry_controls_replay_independent_normal_hull_square_and_packing\",\n      \"convex_geometry_denominators::witness_shape_refusal_precedes_malformed_scalar_scans\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject ragged dimensions, size-limit excess, budget exhaustion and mutated affine witnesses\",\n    \"convex_geometry_denominators::all_malformed_rational_routes_refuse_without_panicking\",\n    \"convex_geometry_denominators::every_malformed_route_reports_invalid_rational\",\n    \"convex_geometry_denominators::witness_shape_refusal_precedes_malformed_scalar_scans\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact Finite Convex Geometry on a declared finite carrier.\",\n    \"non_role\": [\n      \"PROVED, GlobalGreen, or operational authority\",\n      \"Continuum or infinite-carrier completion claims\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite checks are local evidence; no theorem-prover discharge is asserted.\"\n  ]\n}\n",
