      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cup_product:v0.1.0\",\n  \"title\": \"Cup Product Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"cup_product\",\n    \"symbol\": \"alpha U beta, [alpha] U [beta] in H^{p+q}(X;R)\",\n    \"ascii_symbol\": \"cup_product\",\n    \"notation\": \"alpha U beta, [alpha] U [beta] in H^{p+q}(X;R)\",\n    \"domain\": [\n      \"cochain_complex: C^*(X;R)\",\n      \"coefficient_ring: R (commutative ring with unit)\",\n      \"left_cochain_group: C^p(X;R)\",\n      \"right_cochain_group: C^q(X;R)\",\n      \"target_cochain_group: C^{p+q}(X;R)\",\n      \"left_degree: p (non-negative integer)\",\n      \"right_degree: q (non-negative integer)\",\n      \"target_degree: p+q\",\n      \"diagonal_approximation: Alexander-Whitney diagonal Delta: C_n -> direct_sum_{p+q=n} C_p tensor C_q\"\n    ],\n    \"codomain\": {\n      \"description\": \"Bilinear operation on cochain groups C^p(X;R) x C^q(X;R) -> C^{p+q}(X;R) that descends to cohomology H^p(X;R) x H^q(X;R) -> H^{p+q}(X;R)\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Cup product of a p-cochain and q-cochain must produce a (p+q)-cochain\",\n      \"Cup product must be R-bilinear in both arguments\",\n      \"(alpha U beta) U gamma must equal alpha U (beta U gamma)\",\n      \"Augmentation cocycle epsilon must act as two-sided identity\",\n      \"[alpha] U [beta] = (-1)^{pq} [beta] U [alpha] at the cohomology level\",\n      \"delta(alpha U beta) = delta(alpha) U beta + (-1)^p alpha U delta(beta)\",\n      \"Input cochains must be valid members of their respective cochain groups\",\n      \"All component hashes must be valid and content-addressed\"\n    ]\n  },\n  \"laws\": [\n    \"(a*alpha_1 + b*alpha_2) U beta = a*(alpha_1 U beta) + b*(alpha_2 U beta) for all a,b in R\",\n    \"alpha U (a*beta_1 + b*beta_2) = a*(alpha U beta_1) + b*(alpha U beta_2) for all a,b in R\",\n    \"(alpha U beta) U gamma = alpha U (beta U gamma) for all cochains alpha, beta, gamma\",\n    \"epsilon U alpha = alpha = alpha U epsilon, where epsilon is the augmentation cocycle in C^0\",\n    \"[alpha] U [beta] = (-1)^{pq} [beta] U [alpha] in H^{p+q} for [alpha] in H^p, [beta] in H^q\",\n    \"delta(alpha U beta) = delta(alpha) U beta + (-1)^p alpha U delta(beta)\",\n    \"If alpha in C^p and beta in C^q, then alpha U beta in C^{p+q}\",\n    \"If delta(alpha) = 0 and delta(beta) = 0, then delta(alpha U beta) = 0 (cocycles map to cocycles)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cup product computation is deterministic given canonical cochain representations\",\n      \"Simplex face operations (front p-face, back q-face) are deterministic\",\n      \"Coefficient ring multiplication is deterministic\",\n      \"Alexander-Whitney diagonal is content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Left cochain alpha not in C^p must be rejected\",\n    \"Right cochain beta not in C^q must be rejected\",\n    \"Result cochain with degree != p+q must be rejected\",\n    \"Cochains over different coefficient rings must be rejected\",\n    \"Cup product violating Leibniz rule must be rejected\",\n    \"Attempting to descend non-cocycles to cohomology must be rejected\",\n    \"CupProduct artifact claiming authority must be rejected\",\n    \"CupProduct artifact claiming admissibility must be rejected\",\n    \"Same inputs producing different hashes must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The Cup Product is a bilinear operation on cohomology classes U: H^p(X;R) x H^q(X;R) -> H^{p+q}(X;R) that gives the cohomology ring its multiplicative structure. At the cochain level, the cup product of cochains alpha in C^p and beta in C^q is defined on a (p+q)-simplex sigma by (alpha U beta)(sigma) = alpha(front p-face of sigma) * beta(back q-face of sigma). The cup product is associative, unital, satisfies graded commutativity (alpha U beta = (-1)^{pq} beta U alpha at the cohomology level), and obeys the Leibniz rule delta(alpha U beta) = delta(alpha) U beta + (-1)^p alpha U delta(beta). This contract defines the structure, validation, and deterministic operations for cup products, ensuring correct bilinearity, associativity, graded commutativity, and compatibility with the coboundary operator.\",\n    \"non_role\": [\n      \"Cochain complex construction (separate CochainComplex contract)\",\n      \"Cohomology class quotient computation (separate CohomologyClass contract)\",\n      \"Steenrod operations (deferred to separate contract)\",\n      \"Massey products and higher-order operations (deferred)\",\n      \"Cross product and Kunneth formula (separate contracts)\",\n      \"Classification of admissibility or policy decisions\",\n      \"Certificate generation or authority claims\"\n    ]\n  },\n  \"wip\": [\n    \"Should relative cup products H^p(X,A) x H^q(X,B) -> H^{p+q}(X, A U B) be a separate contract?\",\n    \"Define cap product as a dependent contract or extend this one?\",\n    \"How to handle cup-i products and Steenrod's higher diagonal approximations?\",\n    \"Should the Alexander-Whitney diagonal be a separate contract or embedded here?\",\n    \"Cross product and Kunneth compatibility: separate contract or extension?\",\n    \"Currently assumes simplicial cochain complexes with Alexander-Whitney diagonal\",\n    \"Graded commutativity holds at the cohomology level; at cochain level only up to homotopy\",\n    \"Associativity at cochain level follows from Alexander-Whitney conventions\",\n    \"Unit element is the augmentation cocycle epsilon: C_0 -> R sending every 0-simplex to 1\",\n    \"Relationship to CohomologyClass contract: cup product is the dependent operation referenced there\",\n    \"Cap product, slant product, and Steenrod operations are deferred to separate contracts\",\n    \"Poincare duality formulation depends on this cup product plus a fundamental class\"\n  ]\n}\n",
