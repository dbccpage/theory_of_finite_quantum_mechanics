      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:boundary_map:v0.1.0\",\n  \"title\": \"BoundaryMap Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"linear_map\",\n    \"symbol\": \"d_n: C_n → C_{n-1}\",\n    \"ascii_symbol\": \"boundary_map\",\n    \"notation\": \"d_n: C_n → C_{n-1}\",\n    \"domain\": [\n      \"matrix: BasicMatrix<K>\",\n      \"source_dim: dimension of C_n\",\n      \"target_dim: dimension of C_{n-1}\",\n      \"shift: DegreeShift (BoundaryMinusOne or CoboundaryPlusOne)\"\n    ],\n    \"codomain\": {\n      \"description\": \"Linear map between chain groups C_n and C_{n-1}\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Target degree must be source_degree - 1\",\n      \"Matrix dimensions must match source and target chain group ranks\",\n      \"Source and target chain groups must be compatible\",\n      \"Coefficient domain must match chain complex coefficient ring\",\n      \"Applying boundary to source chain must yield element in target group\"\n    ]\n  },\n  \"laws\": [\n    \"Boundary map lowers degree by 1: d_n: C_n → C_{n-1}\",\n    \"d_n is a linear map: d_n(ax + by) = a·d_n(x) + b·d_n(y)\",\n    \"Composition of consecutive boundaries is zero: d_n ∘ d_{n+1} = 0\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Matrix application must be deterministic\",\n      \"Same chain input must produce same boundary output hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Target degree not n-1 must be rejected\",\n    \"Matrix with wrong dimensions must be rejected\",\n    \"Mismatched coefficient domains must be rejected\",\n    \"Boundary output outside target group must be rejected\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Degree-lowering map d_n: C_n -> C_{n-1} in a chain complex. Boundary maps produce boundaries, define cycles by kernel, and support the chain-complex law d_n ∘ d_{n+1} = 0.\",\n    \"non_role\": [\n      \"Computing homology groups (separate HomologyGroup contract)\",\n      \"Spectral sequences (separate SpectralSequence contract)\",\n      \"Homotopy or derived functors (separate derived category contracts)\"\n    ]\n  },\n  \"wip\": [\n    \"Decide sign conventions for simplicial/cubical/singular boundaries\",\n    \"Validators referenced but not yet fully implemented\",\n    \"Sign conventions may vary by geometric context (simplicial vs cubical)\",\n    \"Future versions may support sparse matrix representations\"\n  ]\n}\n",
