      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:sheaf_cohomology:v0.1.0\",\n  \"title\": \"Sheaf Cohomology Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"derived_functor_cohomology\",\n    \"symbol\": \"H^k(X; F) or H^•(X; F) for the graded group\",\n    \"ascii_symbol\": \"sheaf_cohomology\",\n    \"notation\": \"H^k(X; F) or H^•(X; F) for the graded group\",\n    \"domain\": [\n      \"sheaf: Sheaf F on topological space X\",\n      \"space: Underlying topological space X\",\n      \"degree_sequence: Cohomology groups indexed by k ∈ ℕ\"\n    ],\n    \"codomain\": {\n      \"description\": \"Sequence of cohomology groups {H^k(X; F) | k ≥ 0} where each H^k is an abelian group (or module over the sheaf's ring).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The sheaf_id must resolve to a valid Sheaf artifact\",\n      \"Method must be one of: cech, injective, flabby\",\n      \"If method is cech, cover_id must be provided and valid\",\n      \"Cover must be a cover of the sheaf's underlying space\",\n      \"Given identical inputs (sheaf, method, cover), the artifact hash must be identical across all implementations\\n\"\n    ]\n  },\n  \"laws\": [\n    \"H^0(X; F) = Γ(X, F) (global sections functor)\",\n    \"For 0 → F' → F → F'' → 0 exact, there exists a long exact sequence ... → H^k(X; F') → H^k(X; F) → H^k(X; F'') → H^{k+1}(X; F') → ...\\n\",\n    \"Sheaf morphisms induce morphisms on cohomology\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cohomology groups serialized by degree in canonical order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"sheaf_id does not resolve to a Sheaf artifact\",\n    \"method is 'singular' (invalid)\",\n    \"method is cech but cover_id is not provided\",\n    \"Cover is for a different space than the sheaf\",\n    \"method is cech but cover is not good (not acyclic); in strict mode this should be rejected or issue warning\\n\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"SheafCohomology is the derived functor cohomology of a sheaf. H^k(X; F) measures the obstruction to extending local sections globally. The contract computes sheaf cohomology via Cech cohomology (for suitable covers) or injective resolutions, producing cohomology group descriptors for each degree.\",\n    \"non_role\": [\n      \"Hypercohomology (cohomology of complexes of sheaves)\",\n      \"Infinite-dimensional cohomology without explicit truncation\",\n      \"Automatic selection of optimal computation method\",\n      \"Cohomological duality theorems (these are FactEnvelopes)\"\n    ]\n  },\n  \"wip\": [\n    \"The contract supports finite computations; infinite-dimensional cohomology requires different handling (truncation or completion).\\n\",\n    \"The Cech-to-derived comparison (Leray's theorem) is a FactEnvelope claim when the cover is Leray - should this be formalized?\\n\",\n    \"Hypercohomology (cohomology of complexes of sheaves) is not part of this contract - should it be a separate contract or extension?\\n\",\n    \"Serre duality and other cohomological dualities are FactEnvelopes - should we provide a standard schema for duality claims?\\n\",\n    \"The relationship with CechCohomology contract: SheafCohomology generalizes CechCohomology with sheaf coefficients.\\n\",\n    \"For good (acyclic) covers, the Cech cohomology Ȟ^k(U; F) is isomorphic to sheaf cohomology H^k(X; F). The contract emits a ComputationWitness with the isomorphism witness.\\n\",\n    \"Spectral sequences (e.g., Leray spectral sequence) are supported via ComputationWitness but not yet fully formalized in contract.\\n\",\n    \"The snake lemma algorithm for connecting homomorphisms in long exact sequences is content-addressed via algorithm_hash.\\n\"\n  ]\n}\n",
