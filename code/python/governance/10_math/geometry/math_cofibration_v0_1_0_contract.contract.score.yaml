      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cofibration:v0.1.0\",\n  \"title\": \"Cofibration Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"cofibration\",\n    \"symbol\": \"i: A >-> X, cofiber X/A, Puppe sequence A -> X -> X/A -> SA -> ...\",\n    \"ascii_symbol\": \"cofibration\",\n    \"notation\": \"i: A >-> X, cofiber X/A, Puppe sequence A -> X -> X/A -> SA -> ...\",\n    \"domain\": [\n      \"domain: topological space A (the subspace or source)\",\n      \"codomain: topological space X (the ambient space or target)\",\n      \"morphism: continuous map i: A -> X\",\n      \"cofiber: X/A = X cup_i CA (mapping cone, derived)\",\n      \"ndr_data: optional NDR pair (u, h) where u: X -> I, h: X x I -> X\"\n    ],\n    \"codomain\": {\n      \"description\": \"A cofibration consists of a continuous map i: A -> X between topological spaces (or objects of a model category) satisfying the homotopy extension property. The domain A, codomain X, and the morphism i are the primary data. The cofiber X/A = X cup_i CA (the mapping cone) is a derived construction.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Domain A and codomain X must be valid topological spaces (or model category objects)\",\n      \"The map i: A -> X must be a well-defined continuous map\",\n      \"The homotopy extension property must hold for the pair (X, A) with respect to i\",\n      \"For Hurewicz cofibrations in Top, i must be injective (closed embedding)\",\n      \"All cofibration and cofiber sequence computations must be deterministic\"\n    ]\n  },\n  \"laws\": [\n    \"For any space Y, any map f: X -> Y, and any homotopy H: A x I -> Y with H(a, 0) = f(i(a)) for all a in A, there exists a homotopy H~: X x I -> Y such that H~(x, 0) = f(x) for all x in X and H~(i(a), t) = H(a, t) for all a in A and t in I.\\n\",\n    \"The map i: A -> X is well-defined, meaning i maps every element of A to an element of X. Domain and codomain must be valid topological spaces (or model category objects).\\n\",\n    \"For classical cofibrations in Top (Hurewicz cofibrations), the map i is necessarily injective (a closed embedding). In model categories, this constraint may be relaxed.\\n\",\n    \"If i: A -> X and j: X -> Y are cofibrations, then j . i: A -> Y is a cofibration.\\n\",\n    \"If i: A -> X is a cofibration and f: A -> B is any map, then the pushout map B -> X cup_A B is a cofibration.\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\",\n      \"Computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid domain space must be rejected\",\n    \"Invalid codomain space must be rejected\",\n    \"Morphism not mapping A to X must be rejected\",\n    \"Map failing HEP (extension does not exist) must be rejected\",\n    \"Non-injective map for Hurewicz cofibration must be rejected\",\n    \"NDR pair data violating u^{-1}(0) = i(A) must be rejected\",\n    \"Composition where codomain != other.domain must be rejected\",\n    \"Non-canonical serialization must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Cofibration is a morphism i: A -> X in a model category (or concretely, a map of topological spaces) satisfying the homotopy extension property (HEP). Given a homotopy H: A x I -> Y and a map f: X -> Y extending H(-, 0) along i, the homotopy H extends to a homotopy H~: X x I -> Y. Cofibrations are dual to fibrations: where fibrations satisfy the homotopy lifting property (HLP), cofibrations satisfy HEP. The cofiber (mapping cone) X/A completes the cofiber sequence A -> X -> X/A. Examples include CW-inclusions, NDR (neighbourhood deformation retract) pairs, and closed inclusions of sub-CW-complexes.\",\n    \"non_role\": [\n      \"Full model category axiom verification (see ModelCategory contract)\",\n      \"Geometric realisation or coordinate embeddings\",\n      \"Homotopy group computation (provided as ComputationWitness)\",\n      \"Infinite-dimensional CW-complex constructions\",\n      \"Equivariant cofibrations\"\n    ]\n  },\n  \"wip\": [\n    \"Full HEP verification is undecidable in general; contract uses sample-based or NDR-pair-based verification\",\n    \"Hurewicz vs Serre cofibrations: Serre cofibrations (HEP for CW pairs only) are not yet distinguished structurally\",\n    \"Relative CW complexes (X, A) as canonical cofibrations - tighter integration with CellComplex contract\",\n    \"Cofiber sequences and Puppe sequences: how far to extend (suspension, loop, Omega-Sigma adjunction)\",\n    \"Cofibrant replacement functors in model categories\",\n    \"Equivariant cofibrations for G-spaces\",\n    \"CW-inclusions are the primary concrete examples of cofibrations in v0.1.0\",\n    \"NDR pair characterisation (u, h) provides constructive HEP verification\",\n    \"Duality with Fibration contract: cofibration HEP is dual to fibration HLP\",\n    \"Mapping cone X/A = X cup_i CA is the cofiber, dual to the homotopy fiber\",\n    \"Acyclic cofibrations (cofibration + weak equivalence) have LLP w.r.t. all fibrations\",\n    \"Closed under composition, pushout, retract, and transfinite composition\"\n  ]\n}\n",
      "record": {
