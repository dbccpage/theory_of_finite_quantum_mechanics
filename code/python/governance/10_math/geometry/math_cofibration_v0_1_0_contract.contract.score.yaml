          "summary": "A Cofibration is a morphism i: A -> X in a model category (or concretely, a map of topological spaces) satisfying the homotopy extension property (HEP). Given a homotopy H: A x I -> Y and a map f: X -> Y extending H(-, 0) along i, the homotopy H extends to a homotopy H~: X x I -> Y. Cofibrations are dual to fibrations: where fibrations satisfy the homotopy lifting property (HLP), cofibrations satisfy HEP. The cofiber (mapping cone) X/A completes the cofiber sequence A -> X -> X/A. Examples include CW-inclusions, NDR (neighbourhood deformation retract) pairs, and closed inclusions of sub-CW-complexes."
        },
        "kind": "math_contract",
        "laws": [
          "For any space Y, any map f: X -> Y, and any homotopy H: A x I -> Y with H(a, 0) = f(i(a)) for all a in A, there exists a homotopy H~: X x I -> Y such that H~(x, 0) = f(x) for all x in X and H~(i(a), t) = H(a, t) for all a in A and t in I.\n",
          "The map i: A -> X is well-defined, meaning i maps every element of A to an element of X. Domain and codomain must be valid topological spaces (or model category objects).\n",
          "For classical cofibrations in Top (Hurewicz cofibrations), the map i is necessarily injective (a closed embedding). In model categories, this constraint may be relaxed.\n",
          "If i: A -> X and j: X -> Y are cofibrations, then j . i: A -> Y is a cofibration.\n",
          "If i: A -> X is a cofibration and f: A -> B is any map, then the pushout map B -> X cup_A B is a cofibration.\n"
