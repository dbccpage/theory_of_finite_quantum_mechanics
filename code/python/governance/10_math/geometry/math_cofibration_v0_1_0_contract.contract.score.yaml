      "ascii_symbol": "cofibration",
      "notation": "i: A >-> X, cofiber X/A, Puppe sequence A -> X -> X/A -> SA -> ...",
      "domain": [
        "domain: topological space A (the subspace or source)",
        "codomain: topological space X (the ambient space or target)",
        "morphism: continuous map i: A -> X",
        "cofiber: X/A = X cup_i CA (mapping cone, derived)",
        "ndr_data: optional NDR pair (u, h) where u: X -> I, h: X x I -> X"
      ],
      "codomain": {
        "description": "A cofibration consists of a continuous map i: A -> X between topological spaces (or objects of a model category) satisfying the homotopy extension property. The domain A, codomain X, and the morphism i are the primary data. The cofiber X/A = X cup_i CA (the mapping cone) is a derived construction.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Domain A and codomain X must be valid topological spaces (or model category objects)",
        "The map i: A -> X must be a well-defined continuous map",
        "The homotopy extension property must hold for the pair (X, A) with respect to i",
        "For Hurewicz cofibrations in Top, i must be injective (closed embedding)",
        "All cofibration and cofiber sequence computations must be deterministic"
      ]
    },
    "laws": [
      "For any space Y, any map f: X -> Y, and any homotopy H: A x I -> Y with H(a, 0) = f(i(a)) for all a in A, there exists a homotopy H~: X x I -> Y such that H~(x, 0) = f(x) for all x in X and H~(i(a), t) = H(a, t) for all a in A and t in I.\n",
      "The map i: A -> X is well-defined, meaning i maps every element of A to an element of X. Domain and codomain must be valid topological spaces (or model category objects).\n",
      "For classical cofibrations in Top (Hurewicz cofibrations), the map i is necessarily injective (a closed embedding). In model categories, this constraint may be relaxed.\n",
      "If i: A -> X and j: X -> Y are cofibrations, then j . i: A -> Y is a cofibration.\n",
      "If i: A -> X is a cofibration and f: A -> B is any map, then the pushout map B -> X cup_A B is a cofibration.\n"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Validators are content-addressed",
        "Computation functions are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
