      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:integral_chain_complex:v0.1.0\",\n  \"title\": \"Integral Chain Complex with Torsion Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"chain_complex_over_the_integers\",\n    \"symbol\": \"C_top -> ... -> C_1 -> C_0 free abelian groups with integer boundary matrices d_k, d_{k-1} d_k = 0; H_k(X; Z) = Z^r + sum Z/d\",\n    \"ascii_symbol\": \"integral_chain_complex\",\n    \"notation\": \"sparse integer boundary columns of (row, coefficient) pairs; free rank r_k = n_k - rank d_k - rank d_(k+1); torsion = invariant factors d > 1 of d_(k+1)\",\n    \"domain\": [\n      \"cell counts n_0, ..., n_top and sparse integer boundary matrices d_k of shape n_{k-1} x n_k\",\n      \"or a SimplicialComplex with its signed boundary matrices\"\n    ],\n    \"codomain\": {\n      \"description\": \"The complex with d_{k-1} d_k = 0 checked exactly; its reduction mod 2 as an F2 chain complex; the integral homology of each degree (free rank and torsion invariant factors, by Smith normal form); and the Euler characteristic.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"d_{k-1} d_k = 0 over Z, checked in i128 with a typed overflow refusal\",\n      \"Columns are normalised: rows sorted, repeated rows summed with checked arithmetic, zeros dropped, row indices below the row count\",\n      \"Shapes must match the cell counts, and the number of boundary maps must be one fewer than the number of degrees\"\n    ]\n  },\n  \"laws\": [\n    \"d_{k-1} d_k = 0 exactly over Z\",\n    \"H_k(X; Z) = Z^(n_k - rank d_k - rank d_(k+1)) plus the sum of Z/d over the invariant factors d > 1 of d_(k+1)\",\n    \"The free ranks are the rational Betti numbers\",\n    \"Reduction mod 2 of a Z-complex is an F_2 complex, and dim H^k(X; F_2) = rank H_k + t_k + t_(k-1) with t_j the number of even torsion summands of H_j(X; Z)\",\n    \"The 6-vertex projective plane has H_1 = Z/2; the one-face cell complex with boundary 2e has H_1 = Z/2, with boundary 3e it has H_1 = Z/3 (invisible to F_2); the Klein bottle cell complex has H_1 = Z + Z/2; tori have no torsion\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact BigInt Smith normal form from omega_linear_algebra\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"integral_chain_complex\",\n    \"symbols\": [\n      \"IntegralChainComplex\",\n      \"SparseIntegerMatrix\",\n      \"IntegralHomology\"\n    ],\n    \"required_tests\": [\n      \"a_chain_complex_refuses_malformed_boundary_data\",\n      \"sparse_integer_products_refuse_overflow\",\n      \"degrees_outside_the_complex_are_refused\",\n      \"integral_homology_with_torsion_of_known_surfaces\",\n      \"f2_cohomology_follows_from_integral_homology_by_universal_coefficients\",\n      \"torsion_is_seen_by_f2_but_not_by_q\",\n      \"integral_homology_of_the_torus_is_z_z_squared_z_with_no_torsion\",\n      \"the_existing_exact_betti_code_agrees_on_the_lattice_carrier\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A complex with no degrees, a wrong number of boundary maps, a wrongly shaped boundary, or boundaries that do not compose to zero must be refused\",\n    \"A boundary entry whose row index is outside the matrix must be refused\",\n    \"A product of boundary coefficients that overflows must be refused, not wrapped\",\n    \"A degree above the top degree must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The integral counterpart of the F_2 chain complex: sparse integer boundaries, exact d d = 0, and homology with torsion by Smith normal form. Its purpose here is to be an independent route to the F_2 dimensions (universal coefficients) and to supply the integral lift the Bockstein map needs; free ranks are checked against the rational Betti numbers of the simplicial code and the lattice carrier against the existing exact_betti.\",\n    \"non_role\": [\n      \"Cohomology with integer coefficients as a separate object (only homology and the Bockstein lift are provided)\",\n      \"Homology of complexes too large for dense Smith normal form\",\n      \"Coefficient groups other than Z and F_2\"\n    ]\n  },\n  \"wip\": [\n    \"Smith normal form is dense; very large complexes would need a sparse reduction\",\n    \"The existing omega_homology::exact_betti works on 2-truncated carriers only; this module handles any top degree\"\n  ]\n}\n",
