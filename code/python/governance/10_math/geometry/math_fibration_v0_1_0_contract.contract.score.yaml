    "doctrine": {
      "summary": "A Fibration is a map p: E → B satisfying the homotopy lifting property (HLP): any homotopy in B can be lifted to E.  Fibrations generalize fiber bundles and are central to homotopy theory. The contract validates the map, base, total space, and optionally verifies the HLP or provides fiber data."
    },
    "wip": [
      {
        "status": "WIP",
        "issues": [
          "The contract does not verify the full HLP (undecidable in general); it may sample specific lifts.",
          "Serre fibrations (HLP for CW pairs) vs Hurewicz fibrations (HLP for all spaces) are not distinguished structurally.",
          "Fiber bundles are fibrations with additional local triviality; see FiberBundle contract.",
          "Path space fibrations and loop space fibrations are important special cases."
        ]
      }
    ],
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
