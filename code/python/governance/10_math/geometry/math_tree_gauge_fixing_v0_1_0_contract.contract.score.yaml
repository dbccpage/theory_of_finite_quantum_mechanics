      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:tree_gauge_fixing:v0.1.0\",\n  \"title\": \"Tree Gauge Fixing and Holonomy Verdict Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"discrete_gauge_theory_decision\",\n    \"symbol\": \"U_e in GL(d, F) for oriented edges e = (s, t); g: V -> GL(d, F); U_e -> g(t) U_e g(s)^(-1); R_e = T(t)^(-1) U_e T(s)\",\n    \"ascii_symbol\": \"tree_gauge_fixing\",\n    \"notation\": \"T(v) = transport from the component root to v along a breadth-first spanning forest, g(v) = T(v)^(-1), residual R_e = g(t) U_e g(s)^(-1) on every edge\",\n    \"domain\": [\n      \"complex: a CellComplex of vertices, oriented edges and faces (closed boundary walks)\",\n      \"connection: one invertible d x d matrix per edge index over an exact field (BigRational, Q(i), any ExactScalar), or a string-keyed DiscreteConnection on a complex without antiparallel edges\"\n    ],\n    \"codomain\": {\n      \"description\": \"The tree gauge g with its residual connection (the identity on every tree edge), the holonomies of the fundamental cycles, a pure-gauge verdict carrying the potentials or a replayable witness cycle, a gauge-equivalence verdict (Equivalent with a gauge, Inequivalent, or Undetermined), and a curvature verdict (Curved, FlatNontrivial, GaugeTrivial).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Exact field arithmetic only: no floats, no tolerances\",\n      \"Transport along a walk is the path-ordered product M_k ... M_1, a backward step uses the inverse, as in omega_holonomy::holonomy\",\n      \"The spanning forest depends only on the complex: roots in vertex order, vertices discovered along edges in increasing edge order\",\n      \"Edge-indexed connections carry independent values on antiparallel edges; string-keyed connections store one matrix per vertex pair and read the opposite pair as its inverse, so the adapters refuse complexes with antiparallel edges\",\n      \"Every index, walk, face boundary, gauge and value count is validated and a failure is a typed HolonomyError\"\n    ]\n  },\n  \"laws\": [\n    \"The tree gauge g(v) = T(v)^(-1) makes U'_e = g(t) U_e g(s)^(-1) the identity on every tree edge\",\n    \"For an edge e = (s, t) off the forest the residual is R_e = T(t)^(-1) U_e T(s): the edge value conjugated by the tree-path transports, equal to the holonomy of the fundamental cycle of e based at the component root; based at s the same loop has holonomy T(s) R_e T(s)^(-1)\",\n    \"A connection is pure gauge exactly when every residual is the identity, and then h(v) = T(v) satisfies U_e = h(t) h(s)^(-1) with h(root) = 1\",\n    \"Every connection on a forest is pure gauge; gauge triviality depends only on the holonomies of cycles, so changing the value of an edge on no cycle keeps a connection pure gauge\",\n    \"Gauge covariance: the residual of the gauge transform g.A is g(root) R_A g(root)^(-1); the trace and determinant of every residual are gauge invariant\",\n    \"Equal residuals certify gauge equivalence with the gauge T_b(v) g_a(v); a residual whose trace or determinant differs proves inequivalence; for a one-dimensional fibre every difference of residuals is decided; for a larger fibre the remaining cases are Undetermined, because a gauge constant on a component conjugates all residuals at once\",\n    \"Face holonomy is gauge covariant, so flatness is gauge invariant; on a complex with no faces there is no curvature and the verdict is never Curved\",\n    \"On a simply connected complex every flat connection is pure gauge, and on a cell complex with torsion in H_1 a flat connection can have holonomy other than the identity (u^2 = 1 on the projective plane cell)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Breadth-first discovery in vertex order and edge order, never hash order\",\n      \"A witness cycle replays with EdgeConnection::loop_holonomy and, without antiparallel edges, with compute_loop_holonomy on its vertex list\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_holonomy\",\n    \"module\": \"gauge_fixing\",\n    \"symbols\": [\n      \"EdgeConnection\",\n      \"TreeGauge\",\n      \"FundamentalCycle\",\n      \"HolonomyWitness\",\n      \"PureGaugeVerdict\",\n      \"GaugeEquivalence\",\n      \"HolonomyVerdict\",\n      \"tree_gauge\",\n      \"tree_gauge_indexed\",\n      \"gauge_equivalence\",\n      \"face_holonomies\",\n      \"holonomy_verdict\"\n    ],\n    \"required_tests\": [\n      \"edge_connection_construction_refuses_malformed_data\",\n      \"antiparallel_edges_carry_independent_values_only_in_an_edge_indexed_connection\",\n      \"walks_are_validated_step_by_step\",\n      \"gauge_transforms_refuse_malformed_gauges\",\n      \"faces_that_are_not_closed_walks_are_refused\",\n      \"equivalence_needs_matching_dimensions\",\n      \"indices_outside_the_complex_are_refused\",\n      \"non_abelian_equivalence_is_not_overclaimed\",\n      \"every_connection_on_a_tree_is_gauge_trivial\",\n      \"the_tree_gauge_makes_every_tree_edge_the_identity_and_spans_each_component\",\n      \"the_residual_on_a_cycle_edge_is_the_holonomy_of_its_fundamental_cycle\",\n      \"the_residual_is_the_edge_value_conjugated_by_the_tree_path_transports\",\n      \"the_tree_gauge_residual_equals_the_string_keyed_gauge_action\",\n      \"a_gauge_transform_of_the_trivial_connection_is_pure_gauge_and_its_potentials_come_back\",\n      \"the_trivial_connection_is_pure_gauge_with_identity_potentials\",\n      \"a_perturbed_cycle_edge_is_not_pure_gauge_and_the_witness_replays\",\n      \"gauge_triviality_depends_only_on_the_holonomies_of_cycles\",\n      \"a_gauge_transformation_conjugates_the_tree_residuals_by_the_root_gauge\",\n      \"an_abelian_residual_is_the_product_of_the_edge_values_around_the_cycle\",\n      \"a_flat_connection_with_holonomy_minus_one_lives_on_the_two_by_two_torus\",\n      \"abelian_gauge_equivalence_is_decided_by_the_residuals\",\n      \"a_graph_has_no_curvature_and_a_cycle_can_carry_flat_nontrivial_holonomy\",\n      \"filling_the_cycle_turns_the_same_flux_into_curvature\",\n      \"on_a_simply_connected_complex_flat_means_gauge_trivial_and_a_perturbation_is_curved\",\n      \"torsion_lets_a_flat_connection_carry_holonomy_on_the_projective_plane\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A connection with the wrong number of edge values, a wrongly shaped value, a singular value or fibre dimension 0 must be refused\",\n    \"A string-keyed connection on a complex with antiparallel edges must be refused by the adapters, not guessed\",\n    \"A walk with a step that does not leave the vertex the previous step reached, a direction other than +1 or -1, an edge or vertex index out of range, or more steps than the path limit must be refused\",\n    \"A gauge with the wrong number of vertices, a wrongly shaped matrix or a singular matrix must be refused\",\n    \"A face whose boundary steps are not a closed walk must be refused\",\n    \"Comparing connections of different fibre dimension must be refused\",\n    \"An edge or vertex index outside the complex must be refused\",\n    \"Connections that differ by a constant conjugating gauge must not be reported as inequivalent\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The pure gauge decision, gauge fixing and curvature verdict of discrete connection theory, stated once for any exact fibre. The tree gauge reduces a connection to its residuals on the edges off a spanning forest; the residuals are the holonomies of the fundamental cycles, conjugated by tree-path transports, so the same algorithm serves U(1), permutation and quaternion fibres. Tests replay every result against the string-keyed gauge action, loop holonomy and pure-gauge constructor already in omega_holonomy, against explicit path products written from the definitions, and against brute-force enumeration of connections and gauge orbits.\",\n    \"non_role\": [\n      \"Continuous or infinite-dimensional gauge groups\",\n      \"Decision of gauge equivalence of non-abelian connections beyond the stated invariants\",\n      \"Physical interpretation of a connection, for example as an electromagnetic potential\",\n      \"Laplacians, curvature commutators and Bianchi identities (separate omega_holonomy modules)\"\n    ]\n  },\n  \"wip\": [\n    \"Gauge equivalence for a fibre of dimension above 1 reports Undetermined when the residuals differ by a possible simultaneous conjugation; deciding isomorphism of the two tuples of residuals is not attempted\",\n    \"The spanning forest is breadth-first in vertex order; no minimal-height or other choice of tree is offered\",\n    \"Callers with private connection and gauge code, for example omega_quantum_physics::u1_graph_connection and holonomy_interference, have not yet been repointed to this module\"\n  ]\n}\n",
      "record": {
