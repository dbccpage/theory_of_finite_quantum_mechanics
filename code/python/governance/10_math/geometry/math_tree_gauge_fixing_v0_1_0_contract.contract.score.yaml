a_flat_connection_with_holonomy_minus_one_lives_on_the_two_by_two_torus\n  - abelian_gauge_equivalence_is_decided_by_the_residuals\n  - a_graph_has_no_curvature_and_a_cycle_can_carry_flat_nontrivial_holonomy\n  - filling_the_cycle_turns_the_same_flux_into_curvature\n  - on_a_simply_connected_complex_flat_means_gauge_trivial_and_a_perturbation_is_curved\n  - torsion_lets_a_flat_connection_carry_holonomy_on_the_projective_plane\nnegative_tests:\n- A connection with the wrong number of edge values, a wrongly shaped value, a singular\n  value or fibre dimension 0 must be refused\n- A string-keyed connection on a complex with antiparallel edges must be refused by\n  the adapters, not guessed\n- A walk with a step that does not leave the vertex the previous step reached, a direction\n  other than +1 or -1, an edge or vertex index out of range, or more steps than the\n  path limit must be refused\n- A gauge with the wrong number of vertices, a wrongly shaped matrix or a singular\n  matrix must be refused\n- A face whose boundary steps are not a closed walk must be refused\n- Comparing connections of different fibre dimension must be refused\n- An edge or vertex index outside the complex must be refused\n- Connections that differ by a constant conjugating gauge must not be reported as\n  inequivalent\ndoctrine:\n  summary: The pure gauge decision, gauge fixing and curvature verdict of discrete\n    connection theory, stated once for any exact fibre. The tree gauge reduces a connection\n    to its residuals on the edges off a spanning forest; the residuals are the holonomies\n    of the fundamental cycles, conjugated by tree-path transports, so the same algorithm\n    serves U(1), permutation and quaternion fibres. Tests replay every result against\n    the string-keyed gauge action, loop holonomy and pure-gauge constructor already\n    in omega_holonomy, against explicit path products written from the definitions,\n    and against brute-force enumeration of connections and gauge orbits.\n  non_role:\n  - Continuous or infinite-dimensional gauge groups\n  - Decision of gauge equivalence of non-abelian connections beyond the stated invariants\n  - Physical interpretation of a connection, for example as an electromagnetic potential\n  - Laplacians, curvature commutators and Bianchi identities (separate omega_holonomy\n    modules)\nwip:\n- Gauge equivalence for a fibre of dimension above 1 reports Undetermined when the\n  residuals differ by a possible simultaneous conjugation; deciding isomorphism of\n  the two tuples of residuals is not attempted\n- The spanning forest is breadth-first in vertex order; no minimal-height or other\n  choice of tree is offered\n- Callers with private connection and gauge code, for example omega_quantum_physics::u1_graph_connection\n  and holonomy_interference, have not yet been repointed to this module\n",
