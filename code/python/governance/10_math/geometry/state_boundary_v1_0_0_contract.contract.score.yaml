    "doctrine": {
      "summary": "This contract defines the Boundary boundary.\n\nA Boundary is a typed structural interface between a local candidate space and a global\ncarrier reference. It declares the shape of crossing, admissibility predicates, and required\nevidence references.\n\nA Boundary does not apply the crossing. It does not decide admissibility. It does not transport\nstate. It does not mutate carriers.\n",
      "non_role": [
        "execution",
        "evaluation",
        "certification",
        "mutation",
        "terminalization",
        "semantic truth claim",
        "authority promotion"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, or upgrade evidence authority.\n\nLLM output may propose Boundary specifications, but those proposals are EvidenceOnly until\nchecked against the Boundary contract and Carrier contract.\n"
      },
      "classification": {
        "subsystem": "Cohomological Semantics",
        "role": "Typed structural interface between local candidate spaces and global carrier state.",
        "classification": "State layer -- structure declaration."
      },
      "structural_representation": {
        "boundary_spec": {
          "struct_name": "BoundarySpec",
          "fields": [
            {
              "name": "boundary_id",
              "type": "BoundaryId"
            },
