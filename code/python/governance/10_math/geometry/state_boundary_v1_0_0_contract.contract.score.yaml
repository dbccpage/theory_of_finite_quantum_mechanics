              "name": "authority_effect",
              "type": "AuthorityEffect",
              "default": "EvidenceOnly"
            }
          ]
        },
        "enums": [
          {
            "name": "CrossingType",
            "variants": [
              "LocalToGlobalInjection",
              "GlobalToLocalProjection",
              "DeclaredEquivalence"
            ],
            "note": "CrossingType::DeclaredEquivalence is a boundary declaration. It is not the fixed-layer operator class QuotientIsometry."
          }
        ]
      },
      "authority_boundary": {
        "may": [
          "Declare the shape of local-to-global and global-to-local crossings",
          "Specify admissibility predicates for crossing",
          "Require specific evidence kinds for crossing"
        ],
        "must_not": [
          "Compute metrics or measurements",
          "Evaluate admissibility (that is the Evaluator's role; Boundary defines the predicate, not applies it)",
          "Execute state transitions",
          "Certify anything",
          "Terminalize"
        ]
      },
      "admissibility_checklist": [
        "Local and global carrier refs must be valid",
        "Crossing type must be declared",
        "Admissibility predicate must be total (defined for all inputs)",
        "Required evidence kinds must be satisfiable"
      ],
      "refusal_conditions": [
        {
          "name": "BoundaryRefusal",
          "variants": [
            "InvalidCarrierRef",
            "CrossingTypeUndeclared",
            "AdmissibilityPredicatePartial",
            "RequiredEvidenceUnsatisfiable"
          ]
        }
      ],
      "checking_and_replay_obligation": "Boundary declarations are structural and immutable. Creating or changing a BoundarySpec does\nnot execute a transition by itself.\n\nIf a boundary is added, removed, or changed in the carrier state, that change must occur through\na licensed carrier transition and be recorded by the Trace boundary.\n\nBoundary itself does not write trace records.\n",
