      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:boundary:v0.1.0\",\n  \"title\": \"Boundary Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"boundary\",\n    \"symbol\": \"b = d_{n+1}(c), b ∈ B_n(C) ⊆ Z_n(C) ⊆ C_n\",\n    \"ascii_symbol\": \"boundary\",\n    \"notation\": \"b = d_{n+1}(c), b ∈ B_n(C) ⊆ Z_n(C) ⊆ C_n\",\n    \"domain\": [\n      \"chain_complex: C_•\",\n      \"source_chain_group: C_{n+1}\",\n      \"target_chain_group: C_n\",\n      \"boundary_map: d_{n+1}: C_{n+1} → C_n\",\n      \"preimage_chain: c ∈ C_{n+1}\",\n      \"boundary_chain: b = d_{n+1}(c) ∈ C_n\"\n    ],\n    \"codomain\": {\n      \"description\": \"Chain b in C_n that is the image of boundary map d_{n+1}\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Preimage chain c must be valid member of C_{n+1}\",\n      \"Boundary map must have degree -1 (maps C_{n+1} to C_n)\",\n      \"Boundary chain b must equal d_{n+1}(c)\",\n      \"Boundary chain b must be valid member of C_n\",\n      \"Boundary b must satisfy d_n(b) = 0\"\n    ]\n  },\n  \"laws\": [\n    \"b = d_{n+1}(c) for some c ∈ C_{n+1}\",\n    \"d_n(b) = 0 (follows from d² = 0)\",\n    \"Preimage chain c is valid member of C_{n+1}\",\n    \"Boundary chain b is valid member of C_n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Boundary computation is deterministic\",\n      \"Chain representations are canonical\",\n      \"Boundary map is content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Preimage c not in C_{n+1} must be rejected\",\n    \"Boundary b not in C_n must be rejected\",\n    \"d(c) != declared boundary b must be rejected\",\n    \"Boundary map with wrong degree must be rejected\",\n    \"Boundary artifact claiming authority must be rejected\",\n    \"Boundary artifact claiming admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Boundary is a chain b in C_n that is the image b = d_{n+1}(c) of a chain c in C_{n+1}, where d is the boundary map of a chain complex. Boundaries are exact cycles and form the quotient denominator for homology classes. This contract defines the structure, validation, and deterministic operations for boundaries, ensuring that they are properly witnessed as images of boundary maps.\",\n    \"non_role\": [\n      \"Cycle classification (separate Cycle contract)\",\n      \"Homology class computation (separate HomologyClass contract)\",\n      \"Boundary representative selection (deferred)\"\n    ]\n  },\n  \"wip\": [\n    \"Should we define canonical boundary representatives?\",\n    \"How to handle boundary computation for infinite chain complexes?\",\n    \"Should we cache boundary computations for efficiency?\",\n    \"Currently assumes finite chain complexes\",\n    \"Boundary representative selection is not yet specified\",\n    \"Relationship to Cycle contract needs clarification\"\n  ]\n}\n",
