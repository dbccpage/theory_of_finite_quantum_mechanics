        "queries_refuse_elements_outside_the_poset",
        "a_tampered_width_certificate_is_not_accepted",
        "linear_extension_work_is_budgeted_with_typed_refusals",
        "maximal_chain_enumeration_is_bounded_with_a_typed_refusal",
        "the_census_refuses_sizes_above_its_bound",
        "a_cover_has_no_element_strictly_between",
        "the_strict_order_is_the_transitive_closure_of_its_covers",
        "every_width_certificate_is_a_valid_dilworth_pair",
        "width_and_height_agree_with_subset_enumeration_on_every_small_poset",
        "counting_enumerating_and_brute_force_agree_on_every_small_poset",
        "dual_reverses_every_relation_and_is_an_involution",
        "labelled_counts_match_the_known_sequence",
        "the_bounded_recursion_enumerates_exactly_the_posets_found_by_brute_force",
        "unlabelled_counts_match_the_known_sequence",
        "orbit_stabilizer_ties_class_sizes_to_automorphism_groups"
      ]
    },
    "negative_tests": [
      "A reflexive relation (u, u) must be refused",
      "A relation naming an element outside 0..n must be refused",
      "A relation listed twice must be refused rather than absorbed",
      "Both (u, v) and (v, u) must be refused as an asymmetry violation",
      "(u, v) and (v, w) without (u, w) must be refused, naming the first missing pair",
      "More than 256 elements must be refused",
      "Generating relations that contain a cycle must be refused when closed",
      "Deserializing a relation set that is not a strict order must be refused",
      "A query naming an element outside the poset, or a repeated element in a chain test, must be refused",
      "A width certificate with a non-antichain, an uncovered element, an element covered twice or unequal counts must not verify",
      "Linear-extension, chain, maximal-chain and order-complex enumeration beyond the stated budget must be refused with a typed error",
      "Census, canonical-form, isomorphism and automorphism requests above the stated size bounds (6 and 8 elements) must be refused"
    ],
    "doctrine": {
      "summary": "A finite poset on {0, ..., n-1} is a strict order whose three laws are checked at every way of making one, so a value of the type is an order. The order-theoretic quantities built on it are cross-checked against independent routes: subset enumeration for width and height, permutation enumeration for linear extensions, relation-subset enumeration for the labelled census, and orbit-stabilizer for the unlabelled one. Enumeration never loops over all 2^(n(n-1)) relation sets: labelled posets are generated by adding one element at a time with a down-set and an up-set, and sizes above the stated bounds are refused.",
      "non_role": [
        "Infinite or continuous orders",
        "Lattice-specific structure (meets, joins, distributivity)",
        "Physical interpretation of an order, for example causal structure",
        "Isomorphism testing beyond 8 elements"
      ]
    },
    "wip": [
      "FiniteDirectedGraph::covering_edges returns every edge of the graph, which is the set of covers only for a graph that is already a Hasse diagram; that existing module is unchanged and FinitePoset::covers computes the covers",
      "Canonical forms try every relabelling that respects the pair (number of predecessors, number of successors); there is no refinement, which is why the bound is 8 elements",
      "The width certificate is checked by WidthCertificate::verified_width; no separate proof object is emitted",
      "Only the zeta and Mobius functions of the incidence algebra are provided, no general convolution product",
      "Callers with a private poset type, for example omega_quantum_physics::causal_order, have not yet been repointed to this module"
    ]
  },
