      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_poset:v0.1.0\",\n  \"title\": \"Finite Poset Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_strict_partial_order\",\n    \"symbol\": \"(P, <) with P = {0, ..., n-1} and < irreflexive, asymmetric and transitive\",\n    \"ascii_symbol\": \"finite_poset\",\n    \"notation\": \"(P, <); u <= v iff u = v or u < v; v covers u iff u < v and no w has u < w < v\",\n    \"domain\": [\n      \"size: n with 0 <= n <= 256 (MAX_POSET_ELEMENTS)\",\n      \"strict_relations: a set of pairs (u, v) with u, v in 0..n, read as u < v\"\n    ],\n    \"codomain\": {\n      \"description\": \"A validated strict partial order on {0, ..., n-1} held as predecessor and successor bit rows, with exact order-theoretic queries: relations, covers (the Hasse diagram), incomparable pairs, up-sets, down-sets, open and closed intervals, chains and antichains, height, width with a Dilworth certificate, linear extensions, the dual order, induced sub-orders and the bounded completion. poset_census adds bounded enumeration of labelled posets, the unlabelled census, canonical forms, isomorphism and automorphism counts.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Irreflexive: no pair (u, u) is present\",\n      \"Asymmetric: (u, v) and (v, u) are never both present\",\n      \"Transitive: (u, v) and (v, w) present imply (u, w) present\",\n      \"Every relation names elements of 0..n, and no relation is listed twice\",\n      \"The fields are private: a value comes from a validating constructor or from validated deserialization\",\n      \"Every query and enumeration states its bound, and exceeding it is a typed error\"\n    ]\n  },\n  \"laws\": [\n    \"Irreflexivity, asymmetry and transitivity of the stored relation\",\n    \"v covers u exactly when u < v and the open interval (u, v) is empty\",\n    \"The strict order is the transitive closure of its covers: closing the Hasse diagram transitively returns the order\",\n    \"Dilworth: the width (size of a largest antichain) equals the smallest number of chains that partition the set; an antichain and a chain partition of equal size certify the width\",\n    \"Height is the size of a largest chain\",\n    \"Linear extensions: e(D) = sum over the maximal elements x of D of e(D without x), e(empty) = 1; n pairwise incomparable elements have n! of them\",\n    \"The dual poset reverses every relation, and dualizing twice returns the poset\",\n    \"Orbit-stabilizer: the number of labelled posets on n elements isomorphic to P equals n! divided by the number of automorphisms of P\",\n    \"The numbers of labelled posets on 0..6 elements are 1, 1, 3, 19, 219, 4231, 130023, and the numbers of isomorphism classes are 1, 1, 2, 5, 16, 63, 318\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Relations, covers, chains and linear extensions are listed in lexicographic order\",\n      \"Enumeration order is fixed by the recursion, never by hash order\",\n      \"Every count that can exceed 64 bits is exact (BigUint or BigInt)\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"finite_poset\",\n    \"symbols\": [\n      \"FinitePoset\",\n      \"PosetError\",\n      \"WidthCertificate\",\n      \"BoundedCompletion\",\n      \"MAX_POSET_ELEMENTS\",\n      \"MAX_LINEAR_EXTENSION_ELEMENTS\"\n    ],\n    \"required_tests\": [\n      \"a_reflexive_relation_is_refused\",\n      \"a_relation_outside_the_element_range_is_refused\",\n      \"a_repeated_relation_is_refused_rather_than_absorbed\",\n      \"both_directions_of_one_pair_violate_asymmetry\",\n      \"a_missing_composite_violates_transitivity_and_is_named\",\n      \"more_than_the_element_limit_is_refused\",\n      \"generating_relations_close_transitively_and_refuse_cycles\",\n      \"deserialization_revalidates_the_order\",\n      \"queries_refuse_elements_outside_the_poset\",\n      \"a_tampered_width_certificate_is_not_accepted\",\n      \"linear_extension_work_is_budgeted_with_typed_refusals\",\n      \"maximal_chain_enumeration_is_bounded_with_a_typed_refusal\",\n      \"the_census_refuses_sizes_above_its_bound\",\n      \"a_cover_has_no_element_strictly_between\",\n      \"the_strict_order_is_the_transitive_closure_of_its_covers\",\n      \"every_width_certificate_is_a_valid_dilworth_pair\",\n      \"width_and_height_agree_with_subset_enumeration_on_every_small_poset\",\n      \"counting_enumerating_and_brute_force_agree_on_every_small_poset\",\n      \"dual_reverses_every_relation_and_is_an_involution\",\n      \"labelled_counts_match_the_known_sequence\",\n      \"the_bounded_recursion_enumerates_exactly_the_posets_found_by_brute_force\",\n      \"unlabelled_counts_match_the_known_sequence\",\n      \"orbit_stabilizer_ties_class_sizes_to_automorphism_groups\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A reflexive relation (u, u) must be refused\",\n    \"A relation naming an element outside 0..n must be refused\",\n    \"A relation listed twice must be refused rather than absorbed\",\n    \"Both (u, v) and (v, u) must be refused as an asymmetry violation\",\n    \"(u, v) and (v, w) without (u, w) must be refused, naming the first missing pair\",\n    \"More than 256 elements must be refused\",\n    \"Generating relations that contain a cycle must be refused when closed\",\n    \"Deserializing a relation set that is not a strict order must be refused\",\n    \"A query naming an element outside the poset, or a repeated element in a chain test, must be refused\",\n    \"A width certificate with a non-antichain, an uncovered element, an element covered twice or unequal counts must not verify\",\n    \"Linear-extension, chain, maximal-chain and order-complex enumeration beyond the stated budget must be refused with a typed error\",\n    \"Census, canonical-form, isomorphism and automorphism requests above the stated size bounds (6 and 8 elements) must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A finite poset on {0, ..., n-1} is a strict order whose three laws are checked at every way of making one, so a value of the type is an order. The order-theoretic quantities built on it are cross-checked against independent routes: subset enumeration for width and height, permutation enumeration for linear extensions, relation-subset enumeration for the labelled census, and orbit-stabilizer for the unlabelled one. Enumeration never loops over all 2^(n(n-1)) relation sets: labelled posets are generated by adding one element at a time with a down-set and an up-set, and sizes above the stated bounds are refused.\",\n    \"non_role\": [\n      \"Infinite or continuous orders\",\n      \"Lattice-specific structure (meets, joins, distributivity)\",\n      \"Physical interpretation of an order, for example causal structure\",\n      \"Isomorphism testing beyond 8 elements\"\n    ]\n  },\n  \"wip\": [\n    \"FiniteDirectedGraph::covering_edges returns every edge of the graph, which is the set of covers only for a graph that is already a Hasse diagram; that existing module is unchanged and FinitePoset::covers computes the covers\",\n    \"Canonical forms try every relabelling that respects the pair (number of predecessors, number of successors); there is no refinement, which is why the bound is 8 elements\",\n    \"The width certificate is checked by WidthCertificate::verified_width; no separate proof object is emitted\",\n    \"Only the zeta and Mobius functions of the incidence algebra are provided, no general convolution product\",\n    \"Callers with a private poset type, for example omega_quantum_physics::causal_order, have not yet been repointed to this module\"\n  ]\n}\n",
      "record": {
