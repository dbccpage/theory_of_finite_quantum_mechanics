    "math": {
      "object_kind": "finite_strict_partial_order",
      "symbol": "(P, <) with P = {0, ..., n-1} and < irreflexive, asymmetric and transitive",
      "ascii_symbol": "finite_poset",
      "notation": "(P, <); u <= v iff u = v or u < v; v covers u iff u < v and no w has u < w < v",
      "domain": [
        "size: n with 0 <= n <= 256 (MAX_POSET_ELEMENTS)",
        "strict_relations: a set of pairs (u, v) with u, v in 0..n, read as u < v"
      ],
      "codomain": {
        "description": "A validated strict partial order on {0, ..., n-1} held as predecessor and successor bit rows, with exact order-theoretic queries: relations, covers (the Hasse diagram), incomparable pairs, up-sets, down-sets, open and closed intervals, chains and antichains, height, width with a Dilworth certificate, linear extensions, the dual order, induced sub-orders and the bounded completion. poset_census adds bounded enumeration of labelled posets, the unlabelled census, canonical forms, isomorphism and automorphism counts.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Irreflexive: no pair (u, u) is present",
        "Asymmetric: (u, v) and (v, u) are never both present",
        "Transitive: (u, v) and (v, w) present imply (u, w) present",
        "Every relation names elements of 0..n, and no relation is listed twice",
        "The fields are private: a value comes from a validating constructor or from validated deserialization",
        "Every query and enumeration states its bound, and exceeding it is a typed error"
      ]
    },
    "laws": [
      "Irreflexivity, asymmetry and transitivity of the stored relation",
      "v covers u exactly when u < v and the open interval (u, v) is empty",
      "The strict order is the transitive closure of its covers: closing the Hasse diagram transitively returns the order",
      "Dilworth: the width (size of a largest antichain) equals the smallest number of chains that partition the set; an antichain and a chain partition of equal size certify the width",
      "Height is the size of a largest chain",
      "Linear extensions: e(D) = sum over the maximal elements x of D of e(D without x), e(empty) = 1; n pairwise incomparable elements have n! of them",
      "The dual poset reverses every relation, and dualizing twice returns the poset",
      "Orbit-stabilizer: the number of labelled posets on n elements isomorphic to P equals n! divided by the number of automorphisms of P",
      "The numbers of labelled posets on 0..6 elements are 1, 1, 3, 19, 219, 4231, 130023, and the numbers of isomorphism classes are 1, 1, 2, 5, 16, 63, 318"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Relations, covers, chains and linear extensions are listed in lexicographic order",
        "Enumeration order is fixed by the recursion, never by hash order",
        "Every count that can exceed 64 bits is exact (BigUint or BigInt)"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
