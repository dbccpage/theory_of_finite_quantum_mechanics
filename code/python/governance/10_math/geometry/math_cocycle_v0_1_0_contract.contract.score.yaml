      "summary": "A cocycle is a cochain α in a cochain complex C^n such that the coboundary map δ_n applied to α yields zero: δ_n(α) = 0. Cocycles are closed cochains and serve as representatives for cohomology classes and obstruction classes in homological algebra and obstruction theory.",
