      },
      "4. Required structures": {
        "required": [
          "valid cochain layer",
          "exactness d₁d₀=0",
          "Z¹ = ker(d₁)",
          "B¹ = im(d₀)",
          "quotient relation restricted to Z¹"
        ]
      },
      "5. Definition": {
        "cohomology_class": "[h]_H = h + B¹ for h ∈ Z¹",
        "zero_class": "[h]_H = 0 iff h ∈ B¹",
        "survivor_class": "a nonzero class in H¹",
        "stabilized_residual": "a residual h with h ∈ Z¹, h ∉ B¹; equivalently Φ₁ > 0 and Γ₂ = 0 under declared comparison mode"
      },
      "6. Laws and invariants": {
        "closed_only": "Only h ∈ Z¹ may define H¹ classes.",
        "exact_zero": "h ∈ B¹ represents the zero class in H¹.",
        "not_Q1": "H¹ is a subquotient / closed-sector quotient, not all of Q¹.",
        "quotient_equality": "[h]_H = [k]_H iff h-k ∈ B¹, with h,k ∈ Z¹.",
        "exactness_required": "H¹ is well-defined only when B¹ ⊆ Z¹, i.e. d₁d₀ = 0."
      },
      "7. Equality / equivalence rules": {
        "equality": "[h]_H = [k]_H iff h-k ∈ B¹, with h,k ∈ Z¹.",
        "nonzero": "[h]_H is nonzero iff h ∉ B¹.",
        "representative_warning": "Raw closed representatives may differ while defining the same H¹ class."
      },
