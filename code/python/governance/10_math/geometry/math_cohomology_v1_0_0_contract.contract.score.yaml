      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cohomology:v1.0.0\",\n  \"title\": \"Degree-1 cohomology\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:closed_sector:v1.0.0\",\n        \"urn:omega:math:exact_repair_space:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"H¹ is the quotient of closed degree-1 cochains by exact repairs.\",\n    \"symbol\": \"H¹\",\n    \"ascii_symbol\": \"H1\",\n    \"formula\": \"H¹ = Z¹ / B¹\",\n    \"1. Contract metadata\": {\n      \"title\": \"Degree-1 cohomology\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"cohomology_quotient\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"H¹ is the quotient of closed degree-1 cochains by exact repairs.\",\n      \"purpose\": \"Represents closed survivors modulo exact repair.\",\n      \"non_role\": [\n        \"Does not include nonclosed residuals.\",\n        \"Does not equal all of Q¹.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"valid cochain layer with d₁d₀=0, Z¹=ker(d₁), B¹=im(d₀)\",\n      \"codomain\": \"cohomology space H¹\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"exactness d₁d₀=0\",\n        \"Z¹ = ker(d₁)\",\n        \"B¹ = im(d₀)\",\n        \"quotient relation restricted to Z¹\"\n      ]\n    },\n    \"5. Definition\": {\n      \"cohomology_class\": \"[h]_H = h + B¹ for h ∈ Z¹\",\n      \"zero_class\": \"[h]_H = 0 iff h ∈ B¹\",\n      \"survivor_class\": \"a nonzero class in H¹\",\n      \"stabilized_residual\": \"a residual h with h ∈ Z¹, h ∉ B¹; equivalently Φ₁ > 0 and Γ₂ = 0 under declared comparison mode\"\n    },\n    \"6. Laws and invariants\": {\n      \"closed_only\": \"Only h ∈ Z¹ may define H¹ classes.\",\n      \"exact_zero\": \"h ∈ B¹ represents the zero class in H¹.\",\n      \"not_Q1\": \"H¹ is a subquotient / closed-sector quotient, not all of Q¹.\",\n      \"quotient_equality\": \"[h]_H = [k]_H iff h-k ∈ B¹, with h,k ∈ Z¹.\",\n      \"exactness_required\": \"H¹ is well-defined only when B¹ ⊆ Z¹, i.e. d₁d₀ = 0.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"equality\": \"[h]_H = [k]_H iff h-k ∈ B¹, with h,k ∈ Z¹.\",\n      \"nonzero\": \"[h]_H is nonzero iff h ∉ B¹.\",\n      \"representative_warning\": \"Raw closed representatives may differ while defining the same H¹ class.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Verify d₁d₀=0 before constructing H¹.\",\n        \"Verify d₁h=0 before admitting h as an H¹ representative.\",\n        \"B¹ membership witnesses replay for equality or zero-class claims.\",\n        \"Canonical H¹ basis policy must be deterministic if materialized.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"CochainLayer\": \"Requires valid cochain layer.\",\n        \"B1\": \"B¹ is the zero relation denominator.\",\n        \"Z1\": \"Z¹ supplies admissible closed representatives.\",\n        \"Q1\": \"H¹ is not Q¹; nonclosed Q¹ elements are excluded.\",\n        \"Phi1\": \"Φ₁ > 0 separates non-exact closed classes from exact repair.\",\n        \"Gamma2\": \"Γ₂ = 0 separates closed from open obstruction.\",\n        \"StabilizedSurvivor\": \"Φ₁ > 0 and Γ₂ = 0 corresponds to closed non-exact residual.\",\n        \"OpenObstruction\": \"Γ₂ > 0 excludes the residual from H¹.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct CohomologyDescriptor {\\n    pub layer_hash: String,\\n    pub z1_descriptor_hash: String,\\n    pub b1_descriptor_hash: String,\\n    pub exactness_artifact_hash: String,\\n    pub quotient_policy_hash: Option<String>,\\n    pub h1_basis_policy_hash: Option<String>,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"H¹ claimed without verifying d₁d₀=0.\",\n        \"Open obstruction treated as H¹ class.\",\n        \"Nonclosed residual admitted into H¹.\",\n        \"Raw closed vector treated as H¹ class without quotienting by B¹.\",\n        \"Zero class claim without B¹ membership witness.\",\n        \"H¹ treated as all of Q¹.\",\n        \"Canonical H¹ basis materialized without deterministic policy.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Canonical H¹ basis policy.\",\n        \"Tolerance-mode closed-sector admission.\",\n        \"Subquotient construction over non-field coefficient domains.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"COHOMOLOGY_CONTRACT\": {\n        \"symbol\": \"H¹\",\n        \"ascii_symbol\": \"H1\",\n        \"formula\": \"H¹=Z¹/B¹\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"Z¹,B¹ with valid d₁d₀=0\",\n        \"codomain\": \"H¹\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"Z¹\",\n          \"B¹\",\n          \"restricted quotient relation\",\n          \"exactness d₁d₀=0\"\n        ],\n        \"definition\": \"closed classes modulo exact repair\",\n        \"laws\": [\n          \"closed-only\",\n          \"B¹ is zero class\",\n          \"H¹ != Q¹\",\n          \"[h]=[k] iff h-k∈B¹\"\n        ],\n        \"forbidden_interpretations\": [\n          \"open obstruction as H¹\",\n          \"nonclosed survivor\",\n          \"Q¹ collapsed to H¹\",\n          \"raw closed vector as class without quotient\"\n        ],\n        \"relationships\": [\n          \"StabilizedSurvivor iff Φ₁>0 and Γ₂=0 under declared mode\",\n          \"OpenObstruction excluded by Γ₂>0\",\n          \"ExactRepair is zero class\"\n        ],\n        \"negative_tests\": [\n          \"missing exactness\",\n          \"open as H¹\",\n          \"nonclosed admitted\",\n          \"zero class without B¹ witness\",\n          \"H¹ treated as Q¹\"\n        ],\n        \"open_questions\": [\n          \"canonical H¹ basis policy\",\n          \"tolerance closure admission\",\n          \"non-field quotient construction\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
