      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:field_elimination:v0.1.0\",\n  \"title\": \"Exact Field Elimination Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"linear_algebra_algorithm\",\n    \"symbol\": \"RREF(A), rank A, ker A, ker Aᵀ, im A, A x = b, A⁻¹, det A over an exact field F\",\n    \"ascii_symbol\": \"field_elimination\",\n    \"notation\": \"A ∈ M_{m×n}(F), b ∈ Fᵐ, F : Field + ExactRing\",\n    \"domain\": [\n      \"matrix: BasicMatrix<F> of shape m×n\",\n      \"right-hand side: slice of F of length m\",\n      \"budgets: OperationLimits { max_elements, max_scalar_ops }\"\n    ],\n    \"codomain\": {\n      \"description\": \"The unique reduced row echelon form with its pivot columns, the rank, bases of the right kernel, left kernel and column space, the solution set of A x = b as a particular solution plus a kernel basis or an inconsistency certificate, the inverse of a square matrix or a Singular refusal carrying its rank, and the determinant. Every answer is exact; a scalar that is not a field is refused.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Gauss–Jordan elimination takes the first nonzero entry of the column as pivot and multiplies by try_inv of the pivot; a nonzero pivot with no inverse is refused as ScalarContract\",\n      \"The pivot columns are strictly increasing, each pivot column of the reduced form is a standard unit vector, and the zero rows come last\",\n      \"kernel_basis returns one vector per free column, in column order, with 1 at its own free column, 0 at the other free columns and minus the reduced-form entries at the pivot columns\",\n      \"image_basis returns the columns of the ORIGINAL matrix at the pivot columns\",\n      \"solve returns Consistent { particular, kernel_basis } with every free variable of the particular solution equal to 0, or Inconsistent with a certificate y satisfying yᵀA = 0 and yᵀb = 1, obtained as a solution of the dual system [Aᵀ; bᵀ] y = e; a consistent answer is replayed as A x = b and a certificate is replayed before it is returned\",\n      \"inverse of a singular matrix is refused as Singular { rank, size } with the true rank; determinant of the empty matrix is 1\",\n      \"Every function has a _with_limits form whose preflight charges the worse of the paths it may take: solve charges the consistent path (replay and kernel basis) or the refusal path (reduction of the dual system [Aᵀ; bᵀ] y = e and the certificate replay), whichever is larger\"\n    ]\n  },\n  \"laws\": [\n    \"The reduced row echelon form of a matrix is unique; rref(rref(A)) = rref(A)\",\n    \"rank(A) = |pivot columns| = rank(Aᵀ)\",\n    \"rank(A) + dim ker(A) = n (rank–nullity) and rank(A) + dim ker(Aᵀ) = m\",\n    \"A v = 0 for every kernel vector v, the kernel vectors are linearly independent, and yᵀ A = 0 for every left-kernel vector y\",\n    \"b ∈ im(A) iff yᵀ b = 0 for every y in the left kernel (Fredholm alternative); otherwise a replayable y with yᵀA = 0 and yᵀb != 0 exists\",\n    \"the solutions of A x = b are exactly particular + span(kernel_basis)\",\n    \"A A⁻¹ = I = A⁻¹ A, and A is invertible iff rank A = n iff det A != 0\",\n    \"det(A B) = det A · det B, det Aᵀ = det A, det(c A) = cⁿ det A, and exchanging two rows negates the determinant\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"The reduced row echelon form, pivot columns, kernel basis and image basis agree entry for entry with the BigRational instance of ExactRowReduction (uniqueness of the reduced form makes this a differential test)\",\n      \"solve agrees with solve_in_image on verdict and particular solution; determinant agrees with bareiss_determinant on integer matrices\",\n      \"An InconsistencyCertificate replays through verify without trusting the solver\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_field::elimination\",\n    \"symbols\": [\n      \"RowReduced\",\n      \"InconsistencyCertificate\",\n      \"LinearSolution\",\n      \"rref\",\n      \"rank\",\n      \"kernel_basis\",\n      \"left_kernel_basis\",\n      \"image_basis\",\n      \"solve\",\n      \"inverse\",\n      \"determinant\",\n      \"is_invertible\"\n    ],\n    \"required_tests\": [\n      \"a_non_field_scalar_is_refused_not_miscomputed\",\n      \"inverse_refuses_singular_matrices_with_their_rank_and_non_square_input\",\n      \"a_singular_refusal_is_certified_by_a_kernel_vector_and_a_zero_determinant\",\n      \"solve_inconsistent_yields_a_replayable_certificate\",\n      \"a_certificate_failing_in_a_single_column_is_rejected\",\n      \"solve_handles_empty_shapes_and_refuses_wrong_length\",\n      \"reduction_budget_boundaries_are_inclusive\",\n      \"solve_budget_covers_the_certificate_path\",\n      \"the_kernel_budget_charges_the_output_not_just_the_input\",\n      \"left_kernel_budget_charges_the_output_size\",\n      \"is_invertible_agrees_with_a_nonzero_determinant\"\n    ]\n  },\n  \"negative_tests\": [\n    \"a scalar with a nonzero element that has no inverse must be refused as ScalarContract, never produce a rank, kernel or determinant\",\n    \"inverse of a singular matrix must be refused as Singular carrying the true rank, the refusal must be certified by a nonzero kernel vector with A x = 0 and a zero determinant, and inverse or determinant of a non-square matrix must be refused as NotSquare\",\n    \"an inconsistent system must yield a certificate that verify accepts, and a tampered or unrelated certificate must be rejected, including one that fails in a single column only\",\n    \"a right-hand side whose length is not the row count must be refused with both lengths\",\n    \"an operation whose documented worst-case bound exceeds the budget must be refused before any scalar work, and a bound equal to the limit must be accepted\",\n    \"a budget that covers only the success path of solve but not its certificate path must be refused\",\n    \"the kernel and left-kernel budgets must charge the output size, not only the input size\",\n    \"is_invertible of a non-square matrix must be refused rather than answer false\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact elimination over any field of the scalar tower: reduced row echelon form, rank, right kernel, left kernel, column-space basis, the linear system A x = b with a replayable refusal certificate, the inverse and the determinant. It removes the restriction of the pre-existing elimination to Rational64 and BigRational, so the same algorithms serve Q(i), cyclotomic fields, finite fields and real quadratic fields, and it cross-validates against the pre-existing elimination on BigRational.\",\n    \"non_role\": [\n      \"Numerical linear algebra and conditioning (see eigen and gram_schmidt for the float tier)\",\n      \"Fraction-free integer elimination (determinant::bareiss_determinant is the integer route)\",\n      \"Smith normal form and module structure over rings\",\n      \"Iterative or sparse solvers (solvers belong to omega_solvers)\"\n    ]\n  },\n  \"wip\": [\n    \"No Lean statement of the elimination laws exists; the YAML to Lean to Rust chain for this contract is open\",\n    \"Pivots are the first nonzero entry, which is exact but can grow coefficient size over fields with large representations; no pivoting strategy for size is implemented\",\n    \"The certificate path of solve runs a second elimination (of the dual system [Aᵀ; bᵀ] y = e) instead of tracking row operations in the first\",\n    \"Kernel and image bases are returned as Vec<Vec<F>> rather than the sealed RawSubspaceBasis of the Rational64/BigRational route\",\n    \"The existing ExactRowReduction trait remains sealed to Rational64 and BigRational; it is not generalised here\"\n  ]\n}\n",
