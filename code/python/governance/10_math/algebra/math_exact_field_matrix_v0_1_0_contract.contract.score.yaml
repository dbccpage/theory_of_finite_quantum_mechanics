      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_field_matrix:v0.1.0\",\n  \"title\": \"Exact Field Matrix Algebra Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"matrix_algebra\",\n    \"symbol\": \"M_{m×n}(F) with +, ·, ᵀ, tr, ⊗, [·,·], ⊕ over an exact field F\",\n    \"ascii_symbol\": \"exact_field_matrix\",\n    \"notation\": \"A ∈ M_{m×n}(F), F : Field + ExactRing\",\n    \"domain\": [\n      \"matrices: BasicMatrix<F> of shape m×n (zero-sized shapes allowed)\",\n      \"scalars: F implementing the exact scalar tower\",\n      \"vectors: slices of F\",\n      \"exponents: u64\",\n      \"budgets: OperationLimits { max_elements, max_scalar_ops }\"\n    ],\n    \"codomain\": {\n      \"description\": \"Matrices over F built by construction (identity, zeros, diagonal, from_rows, from_fn), entrywise operations (add, sub, neg, scale, transpose), products (multiply, multiply_vector, kronecker, commutator, anticommutator, power), block forms (block_diagonal, direct_sum, hstack, vstack) and exact predicates. Every operation checks shapes before scalar work and returns a typed ExactFieldError on violation.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every operation takes Field + ExactRing scalars and uses only the tower methods, never std::ops on the scalar\",\n      \"Shapes are checked before any scalar work: add and sub need equal shapes, multiply needs a.cols = b.rows, hstack needs equal row counts, vstack equal column counts, trace, commutator, anticommutator, power and commutes need square operands\",\n      \"from_rows refuses a row whose length differs from row 0 and names the row; the empty list is the 0×0 matrix\",\n      \"Operations whose cost is not linear in their input have a _with_limits form that refuses, before any scalar work, when a worst-case bound exceeds the budget; a bound equal to the limit is accepted\",\n      \"Documented worst-case costs: multiply 2·m·k·n scalar calls; multiply_vector 2·m·k; kronecker one mul per output entry; power 2·2·bits(e)·n³\",\n      \"No floating point, no tolerance, no panic on caller data; dimension overflow and allocation failure are typed errors\"\n    ]\n  },\n  \"laws\": [\n    \"(A B) C = A (B C), A (B + C) = A B + A C, and I A = A = A I\",\n    \"(A B)ᵀ = Bᵀ Aᵀ and (Aᵀ)ᵀ = A\",\n    \"tr(A B) = tr(B A) for A of shape m×n and B of shape n×m, and tr(A + B) = tr A + tr B\",\n    \"entry (i·p + k, j·q + l) of A ⊗ B is A[i][j] · B[k][l] for B of shape p×q\",\n    \"(A ⊗ B)(C ⊗ D) = (A C) ⊗ (B D) and tr(A ⊗ B) = tr A · tr B\",\n    \"[A, B] = A B − B A is antisymmetric, traceless and satisfies the Jacobi identity; {A, B} = A B + B A is symmetric; [A, B] + {A, B} = 2 A B\",\n    \"A⁰ = I for every square A (the zero matrix included) and A^(a+b) = Aᵃ Aᵇ\",\n    \"block_diagonal has shape (Σ rows) × (Σ cols) with zeros off the blocks; hstack and vstack concatenate\",\n    \"to_rows and from_rows are inverse; widen_rational64 and narrow_to_rational64 are inverse where the entries fit in i64\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Products accumulate in row-major output order with the inner index increasing; zero entries of the left factor are skipped, which changes no result\",\n      \"The multiplication agrees with BasicMatrix::mul (std operators) and kronecker with tensor::kronecker_matrices on BigRational\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_field::matrix\",\n    \"symbols\": [\n      \"identity\",\n      \"zeros\",\n      \"diagonal\",\n      \"from_rows\",\n      \"to_rows\",\n      \"from_fn\",\n      \"row\",\n      \"column\",\n      \"add\",\n      \"sub\",\n      \"neg\",\n      \"scale\",\n      \"transpose\",\n      \"trace\",\n      \"dot\",\n      \"multiply\",\n      \"multiply_vector\",\n      \"kronecker\",\n      \"commutator\",\n      \"anticommutator\",\n      \"commutes\",\n      \"power\",\n      \"block_diagonal\",\n      \"direct_sum\",\n      \"hstack\",\n      \"vstack\",\n      \"is_zero_matrix\",\n      \"is_identity_matrix\",\n      \"is_symmetric\",\n      \"widen_rational64\",\n      \"narrow_to_rational64\"\n    ],\n    \"required_tests\": [\n      \"add_and_sub_refuse_unequal_shapes\",\n      \"multiplication_refuses_inner_dimension_mismatch\",\n      \"from_rows_refuses_ragged_input_and_names_the_row\",\n      \"trace_is_cyclic_and_needs_a_square_matrix\",\n      \"power_refuses_non_square_input_and_unaffordable_work\",\n      \"multiply_vector_agrees_with_a_column_matrix_product\",\n      \"dimension_overflow_is_a_typed_error_not_a_panic\",\n      \"element_budget_boundary_is_inclusive\",\n      \"multiply_budget_charges_two_ops_per_inner_product_term\",\n      \"matrix_vector_and_kronecker_budgets_charge_their_documented_costs\",\n      \"rational64_conversions_round_trip_and_refuse_overflow\",\n      \"predicates_answer_exactly_and_refuse_non_square_input\",\n      \"stacking_concatenates_and_checks_shapes\"\n    ]\n  },\n  \"negative_tests\": [\n    \"add or sub of matrices with different shapes must be refused with the two shapes\",\n    \"multiply with a.cols != b.rows must be refused with the two shapes\",\n    \"from_rows with a row whose length differs from row 0 must be refused and name the row\",\n    \"trace, commutator, anticommutator and power of a non-square matrix must be refused\",\n    \"multiply_vector with a vector whose length is not a.cols must be refused with both lengths\",\n    \"a dimension product that overflows usize must be a typed DimensionOverflow, never a panic or a wrapped size\",\n    \"an operation whose documented worst-case element or scalar-operation bound exceeds the budget must be refused before any scalar work, and the bound itself must be accepted\",\n    \"narrow_to_rational64 of an entry that does not fit in i64 must be refused with the entry position\",\n    \"is_identity_matrix and is_symmetric of a non-square matrix must be refused rather than answer false\",\n    \"hstack or vstack of incompatible shapes must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact matrix construction and arithmetic over any field of the scalar tower: identity, zeros, diagonal and row-list construction, add, sub, neg, scale, transpose, trace, matrix and matrix-vector products, the Kronecker product, commutators, integer powers by square-and-multiply, block forms, and exact predicates. It is the one generic home for operations that domain crates previously re-implemented on private matrix types, and it works over Q, GF(p), Q(i), real quadratic fields and any other tower field.\",\n    \"non_role\": [\n      \"Floating-point or tolerance-based matrices (see complex_matrix and the nalgebra adapters)\",\n      \"Sparse or structured storage\",\n      \"Decompositions and solvers (see field_elimination and ordered_field_ldlt)\",\n      \"Partial traces and tensor-network contraction (tensor::partial_trace_right is the existing home)\",\n      \"Matrices over non-fields or noncommutative rings\"\n    ]\n  },\n  \"wip\": [\n    \"No Lean statement of the matrix-ring laws exists; the YAML to Lean to Rust chain for this contract is open\",\n    \"The cost bounds are worst-case formulas checked by boundary tests; they are not measured runtimes\",\n    \"max_elements bounds each matrix-sized allocation, not the number of simultaneously live scratch matrices (a small constant) and not scalar-internal heap use\",\n    \"The contract does not yet separate the std-operator route (BasicMatrix::mul, kronecker_matrices), which remains for scalars that have std ops but no tower implementation\"\n  ]\n}\n",
      "record": {
