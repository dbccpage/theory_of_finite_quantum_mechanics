        "narrow_to_rational64"
      ],
      "required_tests": [
        "add_and_sub_refuse_unequal_shapes",
        "multiplication_refuses_inner_dimension_mismatch",
        "from_rows_refuses_ragged_input_and_names_the_row",
        "trace_is_cyclic_and_needs_a_square_matrix",
        "power_refuses_non_square_input_and_unaffordable_work",
        "multiply_vector_agrees_with_a_column_matrix_product",
        "dimension_overflow_is_a_typed_error_not_a_panic",
        "element_budget_boundary_is_inclusive",
        "multiply_budget_charges_two_ops_per_inner_product_term",
        "matrix_vector_and_kronecker_budgets_charge_their_documented_costs",
        "rational64_conversions_round_trip_and_refuse_overflow",
        "predicates_answer_exactly_and_refuse_non_square_input",
        "stacking_concatenates_and_checks_shapes"
      ]
    },
    "negative_tests": [
      "add or sub of matrices with different shapes must be refused with the two shapes",
      "multiply with a.cols != b.rows must be refused with the two shapes",
      "from_rows with a row whose length differs from row 0 must be refused and name the row",
      "trace, commutator, anticommutator and power of a non-square matrix must be refused",
      "multiply_vector with a vector whose length is not a.cols must be refused with both lengths",
      "a dimension product that overflows usize must be a typed DimensionOverflow, never a panic or a wrapped size",
      "an operation whose documented worst-case element or scalar-operation bound exceeds the budget must be refused before any scalar work, and the bound itself must be accepted",
      "narrow_to_rational64 of an entry that does not fit in i64 must be refused with the entry position",
      "is_identity_matrix and is_symmetric of a non-square matrix must be refused rather than answer false",
      "hstack or vstack of incompatible shapes must be refused"
    ],
    "doctrine": {
      "summary": "Exact matrix construction and arithmetic over any field of the scalar tower: identity, zeros, diagonal and row-list construction, add, sub, neg, scale, transpose, trace, matrix and matrix-vector products, the Kronecker product, commutators, integer powers by square-and-multiply, block forms, and exact predicates. It is the one generic home for operations that domain crates previously re-implemented on private matrix types, and it works over Q, GF(p), Q(i), real quadratic fields and any other tower field.",
      "non_role": [
        "Floating-point or tolerance-based matrices (see complex_matrix and the nalgebra adapters)",
        "Sparse or structured storage",
        "Decompositions and solvers (see field_elimination and ordered_field_ldlt)",
        "Partial traces and tensor-network contraction (tensor::partial_trace_right is the existing home)",
        "Matrices over non-fields or noncommutative rings"
      ]
    },
    "wip": [
      "No Lean statement of the matrix-ring laws exists; the YAML to Lean to Rust chain for this contract is open",
      "The cost bounds are worst-case formulas checked by boundary tests; they are not measured runtimes",
      "max_elements bounds each matrix-sized allocation, not the number of simultaneously live scratch matrices (a small constant) and not scalar-internal heap use",
      "The contract does not yet separate the std-operator route (BasicMatrix::mul, kronecker_matrices), which remains for scalars that have std ops but no tower implementation"
    ]
  },
