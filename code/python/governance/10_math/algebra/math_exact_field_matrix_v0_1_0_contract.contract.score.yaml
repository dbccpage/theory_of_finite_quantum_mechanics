    "math": {
      "object_kind": "matrix_algebra",
      "symbol": "M_{m×n}(F) with +, ·, ᵀ, tr, ⊗, [·,·], ⊕ over an exact field F",
      "ascii_symbol": "exact_field_matrix",
      "notation": "A ∈ M_{m×n}(F), F : Field + ExactRing",
      "domain": [
        "matrices: BasicMatrix<F> of shape m×n (zero-sized shapes allowed)",
        "scalars: F implementing the exact scalar tower",
        "vectors: slices of F",
        "exponents: u64",
        "budgets: OperationLimits { max_elements, max_scalar_ops }"
      ],
      "codomain": {
        "description": "Matrices over F built by construction (identity, zeros, diagonal, from_rows, from_fn), entrywise operations (add, sub, neg, scale, transpose), products (multiply, multiply_vector, kronecker, commutator, anticommutator, power), block forms (block_diagonal, direct_sum, hstack, vstack) and exact predicates. Every operation checks shapes before scalar work and returns a typed ExactFieldError on violation.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Every operation takes Field + ExactRing scalars and uses only the tower methods, never std::ops on the scalar",
        "Shapes are checked before any scalar work: add and sub need equal shapes, multiply needs a.cols = b.rows, hstack needs equal row counts, vstack equal column counts, trace, commutator, anticommutator, power and commutes need square operands",
        "from_rows refuses a row whose length differs from row 0 and names the row; the empty list is the 0×0 matrix",
        "Operations whose cost is not linear in their input have a _with_limits form that refuses, before any scalar work, when a worst-case bound exceeds the budget; a bound equal to the limit is accepted",
        "Documented worst-case costs: multiply 2·m·k·n scalar calls; multiply_vector 2·m·k; kronecker one mul per output entry; power 2·2·bits(e)·n³",
        "No floating point, no tolerance, no panic on caller data; dimension overflow and allocation failure are typed errors"
      ]
    },
    "laws": [
      "(A B) C = A (B C), A (B + C) = A B + A C, and I A = A = A I",
      "(A B)ᵀ = Bᵀ Aᵀ and (Aᵀ)ᵀ = A",
      "tr(A B) = tr(B A) for A of shape m×n and B of shape n×m, and tr(A + B) = tr A + tr B",
      "entry (i·p + k, j·q + l) of A ⊗ B is A[i][j] · B[k][l] for B of shape p×q",
      "(A ⊗ B)(C ⊗ D) = (A C) ⊗ (B D) and tr(A ⊗ B) = tr A · tr B",
      "[A, B] = A B − B A is antisymmetric, traceless and satisfies the Jacobi identity; {A, B} = A B + B A is symmetric; [A, B] + {A, B} = 2 A B",
      "A⁰ = I for every square A (the zero matrix included) and A^(a+b) = Aᵃ Aᵇ",
      "block_diagonal has shape (Σ rows) × (Σ cols) with zeros off the blocks; hstack and vstack concatenate",
      "to_rows and from_rows are inverse; widen_rational64 and narrow_to_rational64 are inverse where the entries fit in i64"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Products accumulate in row-major output order with the inner index increasing; zero entries of the left factor are skipped, which changes no result",
        "The multiplication agrees with BasicMatrix::mul (std operators) and kronecker with tensor::kronecker_matrices on BigRational"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "rust_binding": {
