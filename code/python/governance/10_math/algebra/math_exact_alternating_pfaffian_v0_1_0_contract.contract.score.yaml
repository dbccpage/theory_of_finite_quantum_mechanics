      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_alternating_pfaffian:v0.1.0\",\n  \"title\": \"Exact Alternating-Matrix Pfaffian\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_alternating_pfaffian\",\n    \"symbol\": \"exact_alternating_pfaffian\",\n    \"ascii_symbol\": \"exact_alternating_pfaffian\",\n    \"notation\": \"Exact Alternating-Matrix Pfaffian\",\n    \"domain\": [\n      \"Even square matrices of dimension 0..=128 over an exact field, with zero diagonal and A^T=-A\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of linear_algebra::exact_pfaffian; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Simultaneous row/column pivot swaps change the Pfaffian sign\",\n    \"The skew Schur recurrence gives pf(A)^2=det(A)\",\n    \"The empty Pfaffian is one and a singular alternating matrix has zero Pfaffian\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_pfaffian\",\n    \"symbols\": [\n      \"PfaffianError\",\n      \"pfaffian\"\n    ],\n    \"required_tests\": [\n      \"pfaffian_sign_pivoting_and_determinant_square_are_exact\",\n      \"non_alternating_and_odd_carriers_are_refused\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Odd/rectangular/oversized and nonalternating carriers are refused; noninvertible field pivots are typed errors\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Simultaneous row/column pivot swaps change the Pfaffian sign; The skew Schur recurrence gives pf(A)^2=det(A); The empty Pfaffian is one and a singular alternating matrix has zero Pfaffian.\",\n    \"non_role\": [\n      \"No floating determinant sign or spectral approximation\",\n      \"No automatic claim that a finite-chain Pfaffian is a bulk invariant\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
