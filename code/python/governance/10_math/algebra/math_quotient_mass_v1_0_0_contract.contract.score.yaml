      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quotient_mass:v1.0.0\",\n  \"title\": \"Quotient Mass Phi1 Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:cochain_layer:v1.0.0\",\n        \"urn:omega:math:exact_repair_space:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [\n        \"R\",\n        \"E\"\n      ],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quotient_norm_functional\",\n    \"symbol\": \"Phi_1: C^1 -> Q_{>=0}\",\n    \"ascii_symbol\": \"Phi1\",\n    \"formula\": \"Phi_1(x) = min_phi sum_e w_e |x_e - (d_0 phi)_e|\",\n    \"dual_formula\": \"Phi_1(x) = max_{y: d_0^T y = 0, |y_e| <= w_e} <y, x>\",\n    \"domain\": [\n      \"x: 1-cochain over finite 2-complex with positive rational weights w_e > 0\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact rational quotient distance Phi_1(x) >= 0 from x to im(d_0).\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Cochain complex C^0 -> C^1 -> C^2 with d_1 d_0 = 0\",\n      \"All edge weights w_e must be strictly positive rationals (w_e in Q_{>0})\",\n      \"Exact arithmetic over Q; floats and bare booleans strictly forbidden\",\n      \"Spanning forest enumeration budget must be bounded\"\n    ]\n  },\n  \"laws\": [\n    \"Definition 3.1 (Quotient Mass): Phi_1(x) is the weighted l1 distance of x to im(d_0).\",\n    \"DDC-TAPE-11 (Spanning Forest Minimality): On a finite graph, Phi_1 is attained at a potential determined by a spanning forest whose edges are all tight (Prop 3.2).\",\n    \"Exact Dual Certification: Every Phi_1 measurement must return a primal potential phi and a dual circulation flow y (d_0^T y = 0, |y_e| <= w_e) whose inner product <y, x> equals the primal objective, closing the duality gap exactly with zero tolerance.\",\n    \"Gauge Invariance: Phi_1(x + d_0 alpha) = Phi_1(x) for all alpha in C^0.\",\n    \"Hodge Exactness Characterization: Over Q, Phi_1(x) = 0 iff x_C = 0 and x_H = 0 in the orthogonal Hodge decomposition C^1 = im(d_0) + im(d_1^T) + H^1 (Theorem 3.3, OE010-01).\",\n    \"Guard g_3 (Zero Residual Mass): Zero residual mass requires exact rational vanishing (Phi_1 == 0). Positive policy tolerances are forbidden in exact algebraic theory.\"\n  ],\n  \"negative_tests\": [\n    \"Floats or non-exact scalars passed to Phi_1 must be rejected with FLOAT_FORBIDDEN.\",\n    \"Dual flow violating d_0^T y = 0 or |y_e| <= w_e must be rejected.\",\n    \"Non-zero duality gap between primal and dual objective must be rejected.\",\n    \"Gauge shift altering Phi_1 must be rejected.\",\n    \"Non-zero residual mass accepted under positive tolerance must be rejected.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Phi_1 measures the exact irreducible quotient obstruction of a 1-cochain modulo coboundaries im(d_0). It represents unresolved boundary tension that cannot be discharged by gauge repair.\",\n    \"symbol\": \"Phi_1\",\n    \"ascii_symbol\": \"Phi1\",\n    \"operator_class_symbol\": \"R\",\n    \"non_role\": [\n      \"authority_minting\",\n      \"policy_decision\",\n      \"self_certification\"\n    ],\n    \"canonical_invariant\": \"Phi_1 is a non-authoritative diagnostic functional. Phi_1 = 0 certifies that a defect is exact within declared scope; it confers zero authority beyond scope.\"\n  },\n  \"wip\": [\n    \"Runtime enforcement and exact verification authority were unsupported scaffold claims; mathematical declarations supply local replay obligations without operational authority.\",\n    \"The symbolic BUDGET_UNKNOWN/FLOAT_FORBIDDEN/BOOL_FORBIDDEN phrases are explanatory input guards, not registered refusal emissions.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
