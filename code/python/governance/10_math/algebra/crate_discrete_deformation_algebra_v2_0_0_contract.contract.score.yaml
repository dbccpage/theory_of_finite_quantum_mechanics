      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:crate:discrete_deformation_algebra:v2.0.0\",\n  \"title\": \"Discrete Deformation Calculus\",\n  \"kind\": \"math_contract\",\n  \"layer\": \"10_math_crates\",\n  \"role\": \"MathematicalKernel\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"clean_architecture_layer\": \"domain\",\n    \"dependencies\": {\n      \"contracts\": [],\n      \"lean4_theorems\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"REFUSED_INVALID_WITNESS\",\n        \"REFUSED_BUDGET_EXHAUSTED\",\n        \"REFUSED_NON_ZERO_CURL\",\n        \"REFUSED_UNLICENSED_LIFT\",\n        \"REFUSED_REQUIRES_LIFT\",\n        \"REFUSED_MISSING_LOSS_LEDGER\",\n        \"REFUSED_DETECTOR_INADEQUATE\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Discrete Deformation Calculus (DDC) 8-letter operational trace alphabet A_DDC = {E, R, C, I, Lambda, D, M, T}, 8 candidate runtime laws, and Merkle-chained step validation.\",\n    \"invariants\": [\n      \"DDC transitions execute under operational alphabet A_DDC = {E, R, C, I, Lambda, D, M, T}.\",\n      \"Every step records deterministic input/output digests and witness flags chained by SHA-256.\",\n      \"Law 2 (Terminal Absorption): No steps admitted after T.\",\n      \"Law 3 (Refusal Absorption): After M, only C, Lambda, or T may follow.\",\n      \"Law 4 (Lift Trigger): Structural lift Lambda requires license and trigger (ClosedResidual or DetectorInadequate).\",\n      \"Law 5 (Integration Requires Receipt): Step integration I requires verified step receipt.\",\n      \"Law 6 (Descent Requires Loss Ledger): Scale descent D requires explicit LossLedger recording dropped dimensions and lost mass.\",\n      \"Law 7 (Exact Repair Discharges): Exact repair E requires before-class ExactRepair and discharges to zero without crossing classes.\",\n      \"Law 8 (Context Exposure Is Not Repair): Context exposure C changes carrier and never lowers Phi_1 or Gamma_2.\",\n      \"Four-Axis Separation: DiagnosticClass != RoutingTerminal != ExtensionStatus != AuthorityStatus.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"promotion_granter\",\n      \"implicit_coercion\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\",\n      \"no_undeclared_state_transition\",\n      \"no_unpriced_obstruction_decrease\"\n    ]\n  },\n  \"specification\": {\n    \"algebraic_structure\": {\n      \"carrier_type\": \"DiscreteDeformationAlgebraCarrier\",\n      \"operations\": []\n    },\n    \"ports\": {\n      \"input_packet\": \"urn:omega:packet:work_packet:v1.0.0\",\n      \"output_packet\": \"urn:omega:packet:swarm_run_receipt:v1.0.0\",\n      \"error_type\": \"Refusal\"\n    },\n    \"verification\": {\n      \"fitness_test\": null,\n      \"lean4_file\": null\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
