      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:smith_normal_form:v0.1.0\",\n  \"title\": \"Smith Normal Form Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"smith_decomposition_triple\",\n    \"symbol\": \"(U, S, V): U·A·V = S, U ∈ GL(m,Z), V ∈ GL(n,Z), S diagonal\",\n    \"ascii_symbol\": \"smith_normal_form\",\n    \"notation\": \"(U, S, V): U·A·V = S, U ∈ GL(m,Z), V ∈ GL(n,Z), S diagonal\",\n    \"domain\": [\n      \"matrix_A: M_{m×n}(Z), m≥1, n≥1, exact integer entries\",\n      \"matrix_U: GL(m,Z), det(U) = ±1\",\n      \"matrix_S: M_{m×n}(Z), diagonal, invariant factors with divisibility chain\",\n      \"matrix_V: GL(n,Z), det(V) = ±1\",\n      \"ring: Z (exact integer arithmetic, no floating point)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A triple (U, S, V) together with the original matrix A, all over Z with exact arithmetic. U is m×m unimodular, S is m×n diagonal with divisibility chain, V is n×n unimodular.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"m ≥ 1 and n ≥ 1\",\n      \"det(U) ∈ {1, -1} and U is m×m\",\n      \"det(V) ∈ {1, -1} and V is n×n\",\n      \"S_{i,j} = 0 for all i ≠ j; no tolerance\",\n      \"For k=1 to min(m,n)-1: (S_{k,k}=0 → S_{k+1,k+1}=0); (S_{k,k}≠0 → S_{k+1,k+1} mod S_{k,k} = 0)\\n\",\n      \"U · A · V = S entrywise over Z\",\n      \"Re-running validators on canonical serialization of (A, U, S, V) produces a byte-identical ValidationWitness.\\n\"\n    ]\n  },\n  \"laws\": [\n    \"det(U) ∈ {1, -1}; U is m×m\",\n    \"det(V) ∈ {1, -1}; V is n×n\",\n    \"S_{i,j} = 0 for all i ≠ j\",\n    \"For k=1 to min(m,n)-1: if S_{k,k}=0 then S_{k+1,k+1}=0; if S_{k,k}≠0 then S_{k+1,k+1} mod S_{k,k} = 0.\\n\",\n    \"U · A · V = S (exact, entrywise over Z)\",\n    \"All entries are exact integers; floating-point is disallowed\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Canonical serialization: row-major decimal strings, no whitespace\",\n      \"Dimensions (m, n) serialized as u64 before matrix entries\",\n      \"ComputationWitness operation trace must be fully deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A=[[2]], U=[[2]], S=[[2]], V=[[1]]; det(U)=2 ≠ ±1\",\n    \"V provided as non-square matrix; fails before determinant\",\n    \"S=[[1,1],[0,1]]; off-diagonal entry nonzero\",\n    \"S=diag(2,3); 2 does not divide 3\",\n    \"A=[[1]], U=[[1]], V=[[1]], S=[[2]]; U·A·V=[[1]] ≠ [[2]]\",\n    \"S=diag(0,5); zero entry must force all later diagonals to zero\",\n    \"Entries with decimal point rejected by schema before math checks\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Computation of the Smith normal form of an integer matrix A ∈ M_{m×n}(Z), returning a triple (U, S, V) where U ∈ GL(m,Z), V ∈ GL(n,Z), S is diagonal with the divisibility chain on nonzero invariant factors, and U · A · V = S exactly over Z. Validity is determined solely by mathematical verification: unimodularity, diagonality, divisibility, and exact matrix equality.\",\n    \"non_role\": [\n      \"Does not enforce a unique choice of U or V\",\n      \"Does not extract or assert rank as a separate verified claim\",\n      \"Does not handle zero-dimensional matrices (m=0 or n=0): WIP\",\n      \"Does not define performance requirements or algorithm selection\",\n      \"No policy decisions or authority claims\"\n    ]\n  },\n  \"wip\": [\n    \"Zero-dimensional matrices (m=0 or n=0) are out of scope; edge case handling deferred\",\n    \"Canonical serialization format for big integers must be finalized (decimal string recommended)\",\n    \"Divisibility convention when S_{k,k}=0: adopted rule is zero forces all later diagonals to zero; cross-reference with standard definition needed\",\n    \"Compact trace format for ComputationWitness on large matrices is unspecified; WIP\",\n    \"Uniqueness: U and V are not unique; downstream consumers must not assume a canonical choice\",\n    \"The contract verifies any valid Smith triple (U, S, V); it does not assert uniqueness of U or V\",\n    \"Invariant factors are the unique invariant of the decomposition, but the contract verifies only that the provided triple satisfies the defining equations\",\n    \"Exact integer arithmetic is mandatory; no floating-point representations allowed\",\n    \"Schema hash algorithm is SHA-256; canonical serialization is row-major decimal strings, no whitespace\",\n    \"authority_effect is fixed to 'none'; no policy or admissibility claims\"\n  ]\n}\n",
