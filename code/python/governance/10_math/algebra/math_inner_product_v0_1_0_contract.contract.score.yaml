      "InnerProduct on V, Vector from different space (different basis_hash)",
      "V has dimension 3, supplied vector has 4 components",
      "FactEnvelope claiming 'is_symmetric' for non-symmetric matrix (G != G^T)"
    ],
    "doctrine": {
      "summary": "An InnerProduct represents a bilinear (or sesquilinear) form on a finite-dimensional vector space V over a field K, expressed in a chosen ordered basis of V. The form is given by a square matrix G (the Gram matrix) such that the pairing of vectors x and y (written as column vectors) is x^T G y for real bilinear forms, and x† G y for complex sesquilinear forms. This contract defines the structure of the Gram matrix and its relationship to V, together with deterministic computations (evaluation of the pairing) and decidable facts (e.g. symmetry, positive-definiteness). It does not confer authority or decide admissibility.",
      "non_role": [
        "Does not determine whether form is bilinear or sesquilinear (captured by field K)",
        "Does not assert symmetry, Hermitian, or positive-definite properties (use FactEnvelopes)",
        "Does not confer authority or decide admissibility",
        "Does not extend to infinite-dimensional or continuous basis spaces",
        "Does not provide sparse matrix representations"
      ]
    },
    "wip": [
      "Contract does not distinguish between bilinear and sesquilinear forms in structure; evaluation function in ComputationWitness must be chosen according to field's conjugation rules. Precise handling of complex conjugation will be part of field_spec contract.",
      "Facts like 'positive definite' require ordering on field K; currently only sub-fields of ℝ supported for such properties. Separate 'OrderedField' contract anticipated.",
      "Contract limited to finite-dimensional spaces. Extension to continuous bases or reproducing kernel Hilbert spaces is deferred.",
      "No sparse representation of Gram matrix defined; only dense row-major serialization used.",
      "List of allowed FactEnvelope types and their validators will be specified in future 'InnerProductProperties' sub-contract.",
      "Canonical scalar artifact for inner product result not defined here; assumes separate 'Scalar' contract exists and is referenced.",
      "Status set to mathematical_wip until OrderedField and InnerProductProperties contracts are completed",
      "Validator execution order is critical: dimension → field elements → basis → carrier/field consistency → artifact hash",
      "ComputationWitness for evaluation must include content-addressed evaluation function hash to ensure deterministic replay",
      "FactEnvelopes for properties (symmetry, Hermitian, positive-definite) are separate artifacts that reference the InnerProduct StructureArtifact hash",
      "Sparse matrix support deferred to v0.2.0",
      "Infinite-dimensional extension (RKHS) deferred to v1.0.0 or separate contract"
    ]
  },
