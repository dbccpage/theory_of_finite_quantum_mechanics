        "StructureArtifact hash must match SHA-256 of canonical serialization"
      ]
    },
    "laws": [
      "Gram matrix G must be n × n where n = dim(V)",
      "Every entry of G must be a valid element of field K",
      "Ordered basis must be linearly independent and span V",
      "Carrier space V must be declared over field K"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Gram matrix entries serialized in row-major order",
        "Field elements encoded according to field_spec",
        "Validator and computation functions are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
