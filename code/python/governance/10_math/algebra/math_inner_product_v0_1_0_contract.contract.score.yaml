      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:inner_product:v0.1.0\",\n  \"title\": \"InnerProduct Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"bilinear_form\",\n    \"symbol\": \"⟨x, y⟩ = x^T G y (real) or x† G y (complex)\",\n    \"ascii_symbol\": \"inner_product\",\n    \"notation\": \"⟨x, y⟩ = x^T G y (real) or x† G y (complex)\",\n    \"domain\": [\n      \"gram_matrix: n × n array of field elements in row-major order\",\n      \"carrier_space: finite-dimensional vector space V with dimension n\",\n      \"field_spec: field K with element serialization rules\",\n      \"ordered_basis: ordered list of n basis vectors with basis_hash\"\n    ],\n    \"codomain\": {\n      \"description\": \"Gram matrix G: n × n array over field K, representing inner product on V\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Gram matrix dimensions must equal carrier space dimension\",\n      \"All matrix entries must be valid field elements\",\n      \"Supplied basis_hash must match SHA-256 of ordered basis\",\n      \"Carrier space field must match field_spec\",\n      \"StructureArtifact hash must match SHA-256 of canonical serialization\"\n    ]\n  },\n  \"laws\": [\n    \"Gram matrix G must be n × n where n = dim(V)\",\n    \"Every entry of G must be a valid element of field K\",\n    \"Ordered basis must be linearly independent and span V\",\n    \"Carrier space V must be declared over field K\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Gram matrix entries serialized in row-major order\",\n      \"Field elements encoded according to field_spec\",\n      \"Validator and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::vector_space\",\n    \"symbols\": [\n      \"InnerProduct\"\n    ],\n    \"required_tests\": [\n      \"inner_product_rejects_dimension_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"carrier dimension n=3, gram_matrix is 3×4\",\n    \"field_spec = 'GF(2)', gram_matrix contains entry '2'\",\n    \"supplied basis_hash does not match SHA-256 of ordered basis\",\n    \"carrier_space over ℝ, but field_spec = 'GF(5)'\",\n    \"InnerProduct on V, Vector from different space (different basis_hash)\",\n    \"V has dimension 3, supplied vector has 4 components\",\n    \"FactEnvelope claiming 'is_symmetric' for non-symmetric matrix (G != G^T)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An InnerProduct represents a bilinear (or sesquilinear) form on a finite-dimensional vector space V over a field K, expressed in a chosen ordered basis of V. The form is given by a square matrix G (the Gram matrix) such that the pairing of vectors x and y (written as column vectors) is x^T G y for real bilinear forms, and x† G y for complex sesquilinear forms. This contract defines the structure of the Gram matrix and its relationship to V, together with deterministic computations (evaluation of the pairing) and decidable facts (e.g. symmetry, positive-definiteness). It does not confer authority or decide admissibility.\",\n    \"non_role\": [\n      \"Does not determine whether form is bilinear or sesquilinear (captured by field K)\",\n      \"Does not assert symmetry, Hermitian, or positive-definite properties (use FactEnvelopes)\",\n      \"Does not confer authority or decide admissibility\",\n      \"Does not extend to infinite-dimensional or continuous basis spaces\",\n      \"Does not provide sparse matrix representations\"\n    ]\n  },\n  \"wip\": [\n    \"Contract does not distinguish between bilinear and sesquilinear forms in structure; evaluation function in ComputationWitness must be chosen according to field's conjugation rules. Precise handling of complex conjugation will be part of field_spec contract.\",\n    \"Facts like 'positive definite' require ordering on field K; currently only sub-fields of ℝ supported for such properties. Separate 'OrderedField' contract anticipated.\",\n    \"Contract limited to finite-dimensional spaces. Extension to continuous bases or reproducing kernel Hilbert spaces is deferred.\",\n    \"No sparse representation of Gram matrix defined; only dense row-major serialization used.\",\n    \"List of allowed FactEnvelope types and their validators will be specified in future 'InnerProductProperties' sub-contract.\",\n    \"Canonical scalar artifact for inner product result not defined here; assumes separate 'Scalar' contract exists and is referenced.\",\n    \"Status set to mathematical_wip until OrderedField and InnerProductProperties contracts are completed\",\n    \"Validator execution order is critical: dimension → field elements → basis → carrier/field consistency → artifact hash\",\n    \"ComputationWitness for evaluation must include content-addressed evaluation function hash to ensure deterministic replay\",\n    \"FactEnvelopes for properties (symmetry, Hermitian, positive-definite) are separate artifacts that reference the InnerProduct StructureArtifact hash\",\n    \"Sparse matrix support deferred to v0.2.0\",\n    \"Infinite-dimensional extension (RKHS) deferred to v1.0.0 or separate contract\"\n  ]\n}\n",
