      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quotient_space:v1.0.0\",\n  \"title\": \"Residual quotient space\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:cochain_layer:v1.0.0\",\n        \"urn:omega:math:exact_repair_space:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Q¹ records residual distinctions modulo admissible exact repair.\",\n    \"symbol\": \"Q¹\",\n    \"ascii_symbol\": \"Q1\",\n    \"formula\": \"Q¹ = C¹ / B¹\",\n    \"1. Contract metadata\": {\n      \"title\": \"Residual quotient space\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"quotient_space_or_module\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Q¹ records residual distinctions modulo admissible exact repair.\",\n      \"purpose\": \"Makes exact repair invisible while preserving non-exact residual classes.\",\n      \"hodge_decomposition\": \"Over Q, C¹ = im(d₀) ⊕ im(d₁^T) ⊕ H¹ with H¹ = ker(d₁) ∩ ker(d₀^T) (Theorem 3.3, OE010-01). Thus Q¹ ≅ im(d₁^T) ⊕ H¹.\",\n      \"diagnostic_classes\": {\n        \"ExactRepair\": \"x_C = 0 and x_H = 0 <=> Phi_1 = 0 and Gamma_2 = 0.\",\n        \"ClosedResidual\": \"x_C = 0 and x_H != 0 <=> Phi_1 > 0 and Gamma_2 = 0.\",\n        \"ActiveClosureFailure\": \"x_C != 0 <=> Gamma_2 > 0 (witness dominance).\"\n      },\n      \"non_role\": [\n        \"Does not require representatives to be closed.\",\n        \"Does not equal H¹; Q¹ contains both harmonic H¹ and co-exact im(d₁^T) components.\",\n        \"Does not select canonical representatives unless a representative policy (TieR) is declared.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"C¹ and B¹=im(d₀)\",\n      \"codomain\": \"quotient object Q¹ = C¹ / B¹\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"C¹\",\n        \"B¹\",\n        \"equivalence relation x~y iff x-y∈B¹\",\n        \"projection π:C¹→Q¹\"\n      ],\n      \"optional\": [\n        \"canonical representative policy (TieR)\",\n        \"quotient basis or quotient module presentation\",\n        \"quotient equality witness format\"\n      ]\n    },\n    \"5. Definition\": {\n      \"class\": \"[x] = x + B¹\",\n      \"equality\": \"[x]=[y] iff x-y ∈ B¹ iff ∃α such that x-y=d₀α.\",\n      \"projection\": \"π:C¹→Q¹ maps x to [x].\",\n      \"hodge_split\": \"For x in C¹, x = x_E + x_C + x_H, where x_E in im(d₀), x_C in im(d₁^T), x_H in H¹.\",\n      \"sign_convention\": \"Uses x-y=d₀α for equality witnesses; plus/minus variants must be declared consistently.\"\n    },\n    \"6. Laws and invariants\": {\n      \"projection_kernel\": \"ker(π)=B¹.\",\n      \"exact_repair_triviality\": \"π(x+d₀α)=π(x).\",\n      \"hodge_characterization\": \"Gamma_2(x) > 0 iff x_C != 0; Phi_1(x) = 0 iff x_C = 0 and x_H = 0 (Theorem 3.3, DDC-TAPE-10).\",\n      \"witness_dominance\": \"Positive Gamma_2 strictly dominates Phi_1 in routing; open defects cannot seal.\",\n      \"representative_distinction\": \"A representative x is not the quotient class [x].\",\n      \"quotient_identity\": \"All representatives in x+B¹ define the same Q¹ class.\",\n      \"not_closed_by_default\": \"A Q¹ class need not have a closed representative unless separately shown.\",\n      \"carrier_bound\": \"Q¹ is bound to its source cochain layer and B¹.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"quotient_equality\": \"Requires replayable B¹ membership witness, preferably α.\",\n      \"strict_representative_equality\": \"x=y as C¹ vectors is stronger than [x]=[y].\",\n      \"class_equality\": \"Class equality is equality modulo B¹, not coordinate equality.\",\n      \"cross_layer_comparison\": \"Q¹ objects from different carriers/layers require declared transport.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Quotient equality witnesses must replay.\",\n        \"Canonical representative policy must be deterministic if used.\",\n        \"Basis/order/hash inherited from cochain layer.\",\n        \"B¹ descriptor hash fixed.\",\n        \"Projection or quotient presentation hash fixed if materialized.\",\n        \"Tolerance-mode membership requires declared tolerance profile.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"B1\": \"B¹ is the denominator of Q¹.\",\n        \"Phi1\": \"Φ₁ is a quotient norm/obstruction mass on Q¹.\",\n        \"E\": \"E acts trivially on Q¹.\",\n        \"I\": \"I permutes Q¹ preserving Φ₁.\",\n        \"R\": \"R selects a canonical representative of a Q¹ class when TieR is declared.\",\n        \"H1\": \"H¹ is the closed harmonic subsector ker(d₁) ∩ ker(d₀^T); Q¹ contains both H¹ and im(d₁^T).\",\n        \"Gamma2\": \"Γ₂(x) = ||d₁ x||₁; measures the co-exact part x_C.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct QuotientSpaceDescriptor {\\n    pub layer_hash: String,\\n    pub c1_basis_hash: String,\\n    pub b1_descriptor_hash: String,\\n    pub projection_hash: Option<String>,\\n    pub quotient_presentation_hash: Option<String>,\\n    pub representative_policy_hash: Option<String>,\\n    pub membership_witness_format_hash: Option<String>,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Quotient equality claimed without witness α or B¹ membership proof.\",\n        \"Representative confused with quotient class.\",\n        \"Quotient norm computed before B¹ is defined.\",\n        \"Q¹ treated as H¹.\",\n        \"Q¹ element assumed closed without Γ₂/Z¹ check.\",\n        \"Canonical representative used without deterministic policy.\",\n        \"Q¹ compared across different carriers without transport.\",\n        \"Tolerance membership used without tolerance profile.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Canonical quotient basis policy.\",\n        \"Exact and tolerance witness formats.\",\n        \"Quotient module presentation over non-field coefficient domains.\",\n        \"Transport contract for cross-layer Q¹ comparison.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"QUOTIENT_SPACE_CONTRACT\": {\n        \"symbol\": \"Q¹\",\n        \"ascii_symbol\": \"Q1\",\n        \"formula\": \"Q¹=C¹/B¹\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"C¹,B¹\",\n        \"codomain\": \"Q¹\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"C¹\",\n          \"B¹\",\n          \"x~y iff x-y∈B¹\",\n          \"π:C¹→Q¹\",\n          \"representative policy optional\"\n        ],\n        \"definition\": \"[x]=x+B¹; π(x)=[x]\",\n        \"laws\": [\n          \"ker(π)=B¹\",\n          \"E acts trivially on Q¹\",\n          \"representative is not class\",\n          \"Q¹ not closed by default\"\n        ],\n        \"forbidden_interpretations\": [\n          \"representative equals class\",\n          \"Q¹ equals H¹\",\n          \"Q¹ elements automatically closed\",\n          \"canonical representative without policy\"\n        ],\n        \"relationships\": [\n          \"Φ₁ quotient norm\",\n          \"I permutes Q¹\",\n          \"R selects representative\",\n          \"Γ₂ descends to Q¹ only when d₁d₀=0\"\n        ],\n        \"negative_tests\": [\n          \"no equality witness\",\n          \"representative/class confusion\",\n          \"norm before B¹\",\n          \"Q¹ treated as H¹\",\n          \"closedness assumed\",\n          \"cross-carrier comparison\"\n        ],\n        \"open_questions\": [\n          \"quotient basis policy\",\n          \"witness formats\",\n          \"non-field quotient module presentation\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
