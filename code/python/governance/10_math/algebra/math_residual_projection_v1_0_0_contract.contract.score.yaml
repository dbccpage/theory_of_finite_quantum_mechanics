      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:residual_projection:v1.0.0\",\n  \"title\": \"Residual projection\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1_obstruction_mass:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"residual_projection\",\n    \"ascii_symbol\": \"residual_projection\",\n    \"symbol\": \"residual_projection\",\n    \"notation\": \"residual_projection\",\n    \"domain\": [\n      \"carrier: instance of residual_projection\"\n    ],\n    \"codomain\": {\n      \"description\": \"Mathematical object declared by Residual projection (structural shell).\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Carrier for residual_projection must be finite/explicit where claimed\",\n      \"Object kind and domain/codomain (or equivalent) must be declared\",\n      \"Operations, if any, must preserve declared structure\",\n      \"No authority effect may be self-assigned by the structure\"\n    ]\n  },\n  \"laws\": [\n    \"Residual projection is a pure mathematical structure (AuthorityEffect none)\",\n    \"All declared required_structures must hold for a valid instance\",\n    \"Replay is deterministic: no external state, no randomness, no wall-clock\",\n    \"This contract does not mint customer claims or GlobalGreen\"\n  ],\n  \"negative_tests\": [\n    \"Artifact claiming Residual projection without required structures must be rejected\",\n    \"Empty or ill-typed carrier for residual_projection must be rejected\",\n    \"Artifact claiming authority or admissibility must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected\",\n    \"Non-deterministic or external-state-dependent construction must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Selects a canonical minimal-norm representative of a Q¹ class. Nonclaim fence: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT/Univalence discharge from this contract alone.\",\n    \"symbol\": \"R\",\n    \"ascii_symbol\": \"ResidualProjection\",\n    \"formula\": \"R(x) = x - d₀α*\",\n    \"operator_class_symbol\": \"R\",\n    \"1. Contract metadata\": {\n      \"title\": \"Residual projection\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"canonical_representative_operator\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Selects a canonical minimal-norm representative of a Q¹ class.\",\n      \"purpose\": \"Turns a relation-valued optimization into a replayable operator only when a deterministic tie policy is declared.\",\n      \"non_role\": [\n        \"Does not change the Q¹ class.\",\n        \"Does not repair by itself.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"x ∈ C¹ with B¹ and Φ₁ optimization problem\",\n      \"codomain\": \"canonical residual representative in the same Q¹ class\",\n      \"representative_selector\": \"R is a section-like representative selector for Q¹ classes when TieR is deterministic.\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"B¹ exact repair space\",\n        \"Φ₁ optimization problem\",\n        \"weighted norm profile\",\n        \"deterministic TieR\",\n        \"quotient class preservation witness\"\n      ],\n      \"optional\": [\n        \"α* witness\",\n        \"primal optimization transcript\",\n        \"dual witness\",\n        \"saturation witness\"\n      ]\n    },\n    \"5. Definition\": {\n      \"formula\": \"R(x)=x-d₀α* where α* solves min_α ||x-d₀α||_{1,w}.\",\n      \"sign_convention\": \"Minus convention for minimization; compatible with E plus convention via α↦-α.\",\n      \"relation_without_tie\": \"Without TieR, R is relation-valued over all optimal residuals.\",\n      \"deterministic_operator\": \"With TieR, R is a function.\",\n      \"canonical_residual\": \"R(x) is the selected Φ₁-minimizing representative of [x].\"\n    },\n    \"6. Laws and invariants\": {\n      \"class_preservation\": \"[R(x)] = [x] in Q¹.\",\n      \"minimality\": \"||R(x)||_{1,w}=Φ₁([x]).\",\n      \"gamma2_preservation\": \"Γ₂(R(x)) = Γ₂(x) since d₁d₀ = 0; coboundary moves leave d₁x strictly invariant (DDC-R-02).\",\n      \"diagnostic_class_preservation\": \"R preserves the three-way diagnostic class: ExactRepair, ClosedResidual, or ActiveClosureFailure.\",\n      \"carrier_unchanged\": \"R leaves the carrier strictly unchanged.\",\n      \"adequate_detector_required\": \"R requires an adequate detector witness.\",\n      \"cycle_coordinate_registration\": \"R retains b₁ = |E| - |V| + c coordinates outside the spanning forest, one per independent cycle (DDC-R-06).\",\n      \"exact_dual_certification\": \"Phi_1 is certified by a spanning-forest potential phi and a dual circulation flow y (d₀^T y = 0, |y_e| <= w_e) closing the duality gap exactly: <y, x> = Phi_1([x]).\",\n      \"idempotence\": \"R(R(x))=R(x) when TieR is deterministic.\",\n      \"exact_absorption\": \"R ∘ E_β = R for every exact repair action E_β under the same layer and deterministic TieR.\",\n      \"non_commutation_warning\": \"E_β ∘ R need not equal R unless E_β is trivial on representatives.\",\n      \"relation_warning\": \"Without TieR, laws hold for the optimal residual set, not for a single deterministic output.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"representative_equality\": \"R outputs compare as C¹ vectors under fixed basis.\",\n      \"relation_equality\": \"Without TieR, equality is equality of optimal residual sets.\",\n      \"tie_policy_equality\": \"Different TieR policies may select different canonical representatives with the same Φ₁ value.\",\n      \"quotient_equality\": \"All R outputs remain in the original Q¹ class.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"TieR hash.\",\n        \"Optimization replay or exact solve artifact.\",\n        \"α* witness if exported.\",\n        \"Dual circulation witness y closing duality gap.\",\n        \"Quotient class witness.\",\n        \"Layer hash.\",\n        \"B¹ hash.\",\n        \"Weight profile hash.\",\n        \"Tolerance profile if approximate.\",\n        \"Dual feasibility/saturation replay if dual witness is claimed.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"operator_class\": \"R belongs to operator class R.\",\n        \"not_M\": \"R is not M when it preserves quotient class, minimality, and Γ₂.\",\n        \"E\": \"R absorbs prior exact repair: R∘E=R.\",\n        \"Q1\": \"R selects a representative of a Q¹ class; it is not itself a quotient class.\",\n        \"Phi1\": \"R realizes the Φ₁ minimal norm.\",\n        \"Gamma2\": \"R strictly preserves Γ₂.\",\n        \"Xi\": \"Ξ depends on deterministic h₁*=R(x) when used.\",\n        \"TieR\": \"TieR is required to make R replayable as an operator.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ResidualProjectionDescriptor {\\n    pub layer_hash: String,\\n    pub b1_hash: String,\\n    pub phi1_problem_hash: String,\\n    pub weight_profile_hash: String,\\n    pub tie_policy_hash: String,\\n    pub alpha_witness_hash: Option<String>,\\n    pub optimization_artifact_hash: Option<String>,\\n    pub dual_witness_hash: Option<String>,\\n    pub tolerance_profile_hash: Option<String>,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"R claimed without tie policy.\",\n        \"R changes quotient class.\",\n        \"R changes Γ₂ or diagnostic class (ResidualProjectionChangedClosure).\",\n        \"R changes carrier (FixedCarrierOpChangedCarrier).\",\n        \"R output not minimal.\",\n        \"R used as deterministic when multiple optima exist.\",\n        \"R claimed without Φ₁ optimization problem.\",\n        \"Different TieR policies silently mixed.\",\n        \"E∘R incorrectly assumed equal to R.\",\n        \"Approximate optimization treated as exact without tolerance profile.\",\n        \"R mislabeled as M despite quotient preservation and minimality.\",\n        \"R admitted despite missing minimality witness or missing dual certificate.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Canonical TieR registry.\",\n        \"Exact LP certificate interface.\",\n        \"TieR equivalence and versioning.\",\n        \"Approximate optimization admissibility boundaries.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"RESIDUAL_PROJECTION_CONTRACT\": {\n        \"symbol\": \"R\",\n        \"ascii_symbol\": \"ResidualProjection\",\n        \"operator_class_symbol\": \"R\",\n        \"formula\": \"R(x)=x-d₀α*\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"x∈C¹ with B¹/Φ₁ problem\",\n        \"codomain\": \"canonical representative in [x]\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"Φ₁ problem\",\n          \"B¹\",\n          \"weighted norm\",\n          \"TieR\",\n          \"quotient preservation\"\n        ],\n        \"definition\": \"minimal-norm representative selected by deterministic tie policy\",\n        \"laws\": [\n          \"class preserving\",\n          \"minimal (realizes Φ₁)\",\n          \"preserves Γ₂ and three-way diagnostic class (DDC-R-02)\",\n          \"carrier unchanged\",\n          \"requires adequate detector\",\n          \"idempotent with TieR\",\n          \"R∘E=R\",\n          \"E∘R not generally R\"\n        ],\n        \"forbidden_interpretations\": [\n          \"deterministic without TieR\",\n          \"mutation\",\n          \"changing Γ₂ or diagnostic class\",\n          \"policy decision\",\n          \"quotient class itself\",\n          \"repair by itself\"\n        ],\n        \"relationships\": [\n          \"operator class R\",\n          \"not M when class-preserving, minimal, and Γ₂-preserving\",\n          \"realizes Φ₁\",\n          \"preserves Γ₂\",\n          \"feeds Ξ as h₁*\"\n        ],\n        \"negative_tests\": [\n          \"missing TieR\",\n          \"class changed\",\n          \"Γ₂ changed (ResidualProjectionChangedClosure)\",\n          \"carrier changed (FixedCarrierOpChangedCarrier)\",\n          \"not minimal\",\n          \"multiple optima unhandled\",\n          \"TieR policies mixed\",\n          \"approximate treated as exact\"\n        ],\n        \"open_questions\": [\n          \"TieR registry\",\n          \"exact LP certificate interface\",\n          \"TieR versioning\"\n        ]\n      }\n    },\n    \"non_role\": [\n      \"Authority minting or GlobalGreen discharge\",\n      \"Customer-facing claims or product guarantees\",\n      \"Full encyclopedia mechanization of residual_projection (deferred)\",\n      \"HoTT/Univalence theorem discharge from this contract alone\",\n      \"Runtime enforcement as proof of mathematical truth\"\n    ]\n  },\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NO