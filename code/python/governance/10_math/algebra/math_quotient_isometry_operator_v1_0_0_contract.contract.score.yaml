      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quotient_isometry_operator:v1.0.0\",\n  \"title\": \"Quotient isometry operator class I\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:quotient_space:v1.0.0\",\n        \"urn:omega:math:phi1_obstruction_mass:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"A quotient automorphism or isometry preserving Φ₁, not necessarily fixing classes.\",\n    \"symbol\": \"I\",\n    \"ascii_symbol\": \"QuotientIsometry\",\n    \"formula\": \"I:Q¹→Q¹ with Φ₁(I[x]) = Φ₁([x])\",\n    \"operator_class_symbol\": \"I\",\n    \"1. Contract metadata\": {\n      \"title\": \"Quotient isometry operator class I\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"operator_class\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"A quotient automorphism or isometry preserving Φ₁, not necessarily fixing classes.\",\n      \"purpose\": \"Represents symmetry on quotient obstruction classes, not repair.\",\n      \"non_role\": [\n        \"Does not perform exact repair.\",\n        \"Does not decrease Φ₁.\",\n        \"Does not select a canonical representative.\",\n        \"Does not mutate carrier.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"Q¹ or declared finite subset of Q¹\",\n      \"codomain\": \"Q¹ or same declared finite subset of Q¹\",\n      \"domain_scope\": {\n        \"allowed\": [\n          \"full_Q1\",\n          \"finite_declared_subset\"\n        ]\n      }\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"source Q¹\",\n        \"map on Q¹\",\n        \"Φ₁ preservation proof or witness\",\n        \"well-definedness on quotient classes\",\n        \"invertibility or declared finite bijection\",\n        \"declared registry or finite budget if enumerated\"\n      ],\n      \"optional\": [\n        \"non-identity witness if classified as nontrivial I\",\n        \"representative-level lift Ĩ:C¹→C¹\"\n      ]\n    },\n    \"5. Definition\": {\n      \"preservation\": \"Φ₁(I[x]) = Φ₁([x]) for all declared domain classes.\",\n      \"permutation\": \"I may permute obstruction classes.\",\n      \"automorphism\": \"I is bijective on Q¹ or on the declared finite domain subset.\",\n      \"quotient_well_definedness\": \"If [x]=[y], then I[x]=I[y].\",\n      \"representative_lift_rule\": \"Any representative-level lift Ĩ must satisfy π(Ĩx)=I(πx).\"\n    },\n    \"6. Laws and invariants\": {\n      \"isometry\": \"Φ₁ preserved.\",\n      \"automorphism\": \"I must be well-defined and invertible on declared quotient domain.\",\n      \"composition\": \"I_a ∘ I_b = I_{a⋅b} where registry/group law is declared.\",\n      \"identity\": \"The identity quotient map is the neutral isometry.\",\n      \"priority\": \"E is classified before I.\",\n      \"no_repair\": \"I preserves quotient mass and does not constitute repair progress.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"operator_equality\": \"Same action on Q¹ under fixed quotient basis, finite table, or declared group law.\",\n      \"nontrivial_I\": \"A nontrivial I requires witness ∃[x] such that I([x]) ≠ [x].\",\n      \"identity_case\": \"If I fixes all Q¹ classes, it is the identity quotient isometry.\",\n      \"not_E\": \"E acts trivially on Q¹; an I classification concerns quotient-level symmetry, not representative-level gauge movement.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Finite map or deterministic rule replay.\",\n        \"Φ₁ preservation replay.\",\n        \"Quotient well-definedness replay.\",\n        \"Invertibility/bijection replay.\",\n        \"Carrier hash unchanged.\",\n        \"Q¹ hash unchanged.\",\n        \"Registry entry if composed.\",\n        \"Representative lift compatibility replay if lift is provided.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"E\": \"E is classified before I; E is representative gauge movement and identity on Q¹.\",\n        \"Q1\": \"I acts on quotient classes.\",\n        \"Phi1\": \"I preserves quotient mass.\",\n        \"R\": \"R may choose canonical representatives after I, but I itself does not select representatives.\",\n        \"M\": \"Carrier mutation or hidden basis change is M, not I.\",\n        \"EvaluationHierarchy\": \"I does not improve Φ₁; it preserves the primary diagnostic.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct QuotientIsometryOperatorDescriptor {\\n    pub q1_hash: String,\\n    pub action_hash: String,\\n    pub domain_scope: IsometryDomainScope,\\n    pub phi1_preservation_witness_hash: String,\\n    pub quotient_well_definedness_witness_hash: String,\\n    pub invertibility_witness_hash: String,\\n    pub non_identity_witness_hash: Option<String>,\\n    pub registry_hash: Option<String>,\\n    pub representative_lift_hash: Option<String>,\\n}\\n\\npub enum IsometryDomainScope {\\n    FullQ1,\\n    FiniteDeclaredSubset,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"I changes Φ₁.\",\n        \"I is not well-defined on quotient classes.\",\n        \"I is not invertible on declared domain.\",\n        \"I is actually representative-level E but classified as nontrivial quotient I.\",\n        \"I uses undeclared carrier mutation.\",\n        \"I changes basis silently.\",\n        \"I composition claimed without registry/group law.\",\n        \"Representative lift provided but π(Ĩx) ≠ I(πx).\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Finite isometry registry format.\",\n        \"Non-identity witness normalization.\",\n        \"Group law / composition table format.\",\n        \"Representative-level lift compatibility schema.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"QUOTIENT_ISOMETRY_OPERATOR_CONTRACT\": {\n        \"symbol\": \"I\",\n        \"ascii_symbol\": \"QuotientIsometry\",\n        \"operator_class_symbol\": \"I\",\n        \"formula\": \"I:Q¹→Q¹, Φ₁ preserved\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"Q¹ or finite declared subset\",\n        \"codomain\": \"Q¹ or same finite declared subset\",\n        \"required_structures\": [\n          \"map on Q¹\",\n          \"Φ₁ preservation\",\n          \"quotient well-definedness\",\n          \"invertibility/bijection\",\n          \"registry optional\",\n          \"non-identity witness if nontrivial\"\n        ],\n        \"definition\": \"quotient automorphism/isometry preserving Φ₁\",\n        \"laws\": [\n          \"Φ₁ preserved\",\n          \"may permute classes\",\n          \"well-defined on Q¹\",\n          \"invertible on declared domain\",\n          \"E classified first\",\n          \"I_a∘I_b=I_{a⋅b} if group law declared\"\n        ],\n        \"forbidden_interpretations\": [\n          \"repair\",\n          \"carrier mutation\",\n          \"E mislabeled as nontrivial I\",\n          \"representative lift without compatibility\"\n        ],\n        \"relationships\": [\n          \"symmetry on Q¹\",\n          \"not repair\",\n          \"E is identity on Q¹\",\n          \"M for hidden carrier/basis mutation\"\n        ],\n        \"negative_tests\": [\n          \"Φ₁ changed\",\n          \"not well-defined\",\n          \"not invertible\",\n          \"actually E\",\n          \"undeclared carrier mutation\",\n          \"bad representative lift\"\n        ],\n        \"open_questions\": [\n          \"registry/group law\",\n          \"non-identity witness\",\n          \"representative lift schema\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
