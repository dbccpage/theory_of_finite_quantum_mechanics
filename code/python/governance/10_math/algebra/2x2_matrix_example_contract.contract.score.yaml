      "raw_utf8": "{\n  \"example_id\": \"basic_matrix_2x2_identity_multiplication\",\n  \"description\": \"2×2 identity matrix multiplication preserves input matrix\",\n  \"matrix_a\": {\n    \"rows\": 2,\n    \"cols\": 2,\n    \"data\": [\n      1,\n      2,\n      3,\n      4\n    ],\n    \"scalar_domain\": \"urn:math:contract:Field:v0.1.0#GF(5)\",\n    \"layout\": \"row_major\"\n  },\n  \"identity_matrix\": {\n    \"rows\": 2,\n    \"cols\": 2,\n    \"data\": [\n      1,\n      0,\n      0,\n      1\n    ],\n    \"scalar_domain\": \"urn:math:contract:Field:v0.1.0#GF(5)\",\n    \"layout\": \"row_major\"\n  },\n  \"operation\": {\n    \"name\": \"matmul\",\n    \"left_operand\": \"matrix_a\",\n    \"right_operand\": \"identity_matrix\",\n    \"preconditions\": [\n      \"lhs_cols (2) == rhs_rows (2)\"\n    ],\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        1,\n        2,\n        3,\n        4\n      ]\n    }\n  },\n  \"operation_commuted\": {\n    \"name\": \"matmul\",\n    \"left_operand\": \"identity_matrix\",\n    \"right_operand\": \"matrix_a\",\n    \"preconditions\": [\n      \"lhs_cols (2) == rhs_rows (2)\"\n    ],\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        1,\n        2,\n        3,\n        4\n      ]\n    }\n  },\n  \"transpose_example\": {\n    \"input\": \"matrix_a\",\n    \"operation\": \"transpose\",\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        1,\n        3,\n        2,\n        4\n      ]\n    }\n  },\n  \"transpose_involution\": {\n    \"input\": \"matrix_a\",\n    \"operation\": \"transpose\",\n    \"then_operation\": \"transpose\",\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        1,\n        2,\n        3,\n        4\n      ]\n    }\n  },\n  \"scalar_multiplication\": {\n    \"input\": \"matrix_a\",\n    \"operation\": \"scale\",\n    \"scalar\": 2,\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        2,\n        4,\n        6,\n        8\n      ]\n    }\n  },\n  \"addition_example\": {\n    \"left_operand\": \"matrix_a\",\n    \"right_operand\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        4,\n        3,\n        2,\n        1\n      ],\n      \"scalar_domain\": \"urn:math:contract:Field:v0.1.0#GF(5)\"\n    },\n    \"operation\": \"add\",\n    \"expected_result\": {\n      \"rows\": 2,\n      \"cols\": 2,\n      \"data\": [\n        5,\n        5,\n        5,\n        5\n      ]\n    }\n  },\n  \"validation\": {\n    \"contract\": \"urn:math:contract:BasicMatrix:v1.0.0\",\n    \"validators_applied\": [\n      \"shape_validator\",\n      \"storage_validator\",\n      \"scalar_domain_validator\"\n    ],\n    \"deterministic\": true,\n    \"replay_algorithm\": \"SHA-256\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
