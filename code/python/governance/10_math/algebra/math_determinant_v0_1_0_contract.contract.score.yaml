      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:determinant:v0.1.0\",\n  \"title\": \"Determinant Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"determinant\",\n    \"symbol\": \"det(A) ∈ K (or R)\",\n    \"ascii_symbol\": \"determinant\",\n    \"notation\": \"det(A) ∈ K (or R)\",\n    \"domain\": [\n      \"matrix: square_matrix_or_endomorphism\",\n      \"coefficient_domain: field_K_or_ring_R\",\n      \"dimension: n\",\n      \"output: scalar_in_K_or_R\"\n    ],\n    \"codomain\": {\n      \"description\": \"Scalar value computed from square matrix over field K or commutative ring R\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Input matrix must be square\",\n      \"Matrix coefficients must belong to declared field or ring\",\n      \"Determinant algorithm must be specified (elimination, Bareiss, Leibniz, or declared)\",\n      \"Re-running algorithm on same input must produce same output hash\",\n      \"Scalar output hash must match determinant result\"\n    ]\n  },\n  \"laws\": [\n    \"Matrix must be square (dimension n×n)\",\n    \"Coefficients must be valid elements of declared field or commutative ring\",\n    \"Determinant computation must be deterministic and reproducible\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Canonical matrix bytes from BasicMatrix contract\",\n      \"Algorithm reference must be deterministic (elimination, Bareiss, Leibniz, declared)\",\n      \"Pivot/sign conventions recorded in ComputationWitness\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Non-square matrix must be rejected\",\n    \"Coefficients not in valid field or ring must be rejected\",\n    \"Sign convention violation must be rejected\",\n    \"Hash mismatch between computed and stored must be rejected\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Determinant records the deterministic scalar determinant of a square matrix or finite endomorphism over a declared field or commutative ring. This contract defines the structure, validation, and deterministic computation of matrix determinants.\",\n    \"non_role\": [\n      \"Determinant does not classify admissibility\",\n      \"No policy decisions or certificates emitted\",\n      \"No customer-facing claims\",\n      \"Separate exact symbolic determinants from approximate numeric determinants (WIP)\"\n    ]\n  },\n  \"wip\": [\n    \"How to separate exact symbolic determinants from approximate numeric determinants?\",\n    \"How to encode determinant over non-field commutative rings?\",\n    \"Should we support additional algorithms (e.g., LU decomposition with partial pivoting)?\",\n    \"How to handle determinants of matrices with variable-size entries (infinite fields)?\",\n    \"Currently supports elimination, Bareiss, Leibniz, and declared algorithms\",\n    \"Exact vs approximate determinants deferred (WIP)\",\n    \"Non-field ring support requires additional validation (WIP)\",\n    \"Algorithm reference must be deterministic and reproducible\",\n    \"No authority claims permitted (purely mathematical contract)\"\n  ]\n}\n",
