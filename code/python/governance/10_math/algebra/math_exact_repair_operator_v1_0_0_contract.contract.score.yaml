        "object_type": "operator_class"
      },
      "2. Mathematical object / functional role": {
        "role": "Gauge movement inside the same quotient class discharging exact defects.",
        "purpose": "Represents exact repair action on representatives; eliminates local tension in im(d₀).",
        "non_role": [
          {
            "Does not cross classes": "cannot exactify non-exact residuals (DDC-E-03)."
          },
          "Cannot be applied to non-exact states; non-exact states route to REFUSED_NON_ZERO_CURL.",
          "Does not mutate carrier.",
          "Does not classify policy admissibility.",
          "Does not issue certificates.",
          "Does not terminalize.",
          "Does not produce customer-facing claims."
        ]
      },
      "3. Domain and codomain": {
        "domain": "x ∈ C¹ with α ∈ C⁰ in a valid cochain layer with before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)",
        "codomain": "x + d₀α = 0 ∈ C¹ in the same carrier, leaving after-class ExactRepair (Φ₁ = 0, Γ₂ = 0)",
        "representative_action": "acts nontrivially on C¹ representatives",
        "quotient_action": "acts trivially on Q¹"
      },
      "4. Required structures": {
        "required": [
          "valid cochain layer",
          "α ∈ C⁰",
          "d₀: C⁰ → C¹",
          "x ∈ C¹ with before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)",
          "adequate detector witness",
          "coefficient domain R"
        ],
        "sign_convention": "plus convention; minimization contracts using x-d₀α are equivalent under α↦-α"
      },
      "5. Definition": {
        "action": "E_α(x) = x + d₀α",
        "exact_repair_term": "d₀α ∈ B¹",
        "discharge_condition": "for lawful DDC step E, x + d₀α = 0",
        "quotient_identity": "[E_α(x)] = [x] in Q¹",
        "projection_identity": "π(E_α(x)) = π(x)"
      },
      "6. Laws and invariants": {
        "law_7_exact_repair_discharges": "E requires before-class ExactRepair (Φ₁ = 0, Γ₂ = 0), leaves carrier unchanged, and leaves Φ₁ = Γ₂ = 0 with zero defect after repair (Ddc.E_gauge_repair_discharges).",
        "no_class_crossing": "Gauge moves preserve d₁x and exactness; E cannot cross classes (Ddc.E_gauge_preserves_closure, Ddc.E_gauge_preserves_exactness).",
        "refusal_on_non_exact": "An attempted E on a state with Γ₂ > 0 or Φ₁ > 0 is refused as REFUSED_NON_ZERO_CURL (Ddc.E_triangle_open_not_exact).",
        "phi1_preserved": "Φ₁([E_α(x)]) = Φ₁([x]) = 0",
        "quotient_class_identity": "π(E_α(x)) = π(x)",
        "composition": "E_α ∘ E_β = E_{α+β}",
        "identity": "E_0 = id_C¹",
        "inverse": "E_α^{-1} = E_{-α} when additive inverse exists in C⁰",
        "priority": "E is classified before I",
        "carrier_unchanged": "E leaves carrier strictly unchanged.",
        "adequate_detector_required": "E requires an adequate detector.",
        "no_progress": "E changes representative but not quotient obstruction mass."
      },
      "7. Equality / equivalence rules": {
        "operator_equality": "E_α = E_β on C¹ iff d₀(α-β)=0",
        "alpha_equivalence": "α and β differing by ker(d₀) define the same E action.",
        "action_equality": "Outputs equal as C¹ vectors under fixed basis.",
        "quotient_equality": "Outputs always define the same Q¹ class as input."
      },
      "8. Replay / determinism requirements": {
        "requirements": [
          "α serialized under C⁰ basis.",
          "d₀ hash fixed.",
          "x serialized under C¹ basis when action witness is claimed.",
          "addition over R deterministic.",
          "carrier unchanged.",
          "basis ordering fixed."
        ]
      },
      "9. Relationship to other Omega primitives": {
        "relationships": {
          "B1": "Adds an element of B¹ = im(d₀).",
          "Q1": "Acts trivially on Q¹.",
          "Phi1": "Preserves quotient mass.",
          "R": "R ∘ E = R when R is deterministic over quotient class.",
          "I": "E is classified before I even when Φ₁ is preserved.",
          "M": "Carrier mutation or hidden basis change is M, not E."
        }
      },
      "10. Rust descriptor shape": {
