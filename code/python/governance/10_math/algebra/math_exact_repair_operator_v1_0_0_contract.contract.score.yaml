      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_repair_operator:v1.0.0\",\n  \"title\": \"Exact repair operator class E\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:exact_repair_space:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Gauge movement inside the same quotient class.\",\n    \"symbol\": \"E_α\",\n    \"ascii_symbol\": \"E_alpha\",\n    \"formula\": \"E_α(x) = x + d₀α\",\n    \"operator_class_symbol\": \"E\",\n    \"1. Contract metadata\": {\n      \"title\": \"Exact repair operator class E\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"operator_class\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Gauge movement inside the same quotient class discharging exact defects.\",\n      \"purpose\": \"Represents exact repair action on representatives; eliminates local tension in im(d₀).\",\n      \"non_role\": [\n        {\n          \"Does not cross classes\": \"cannot exactify non-exact residuals (DDC-E-03).\"\n        },\n        \"Cannot be applied to non-exact states; non-exact states route to REFUSED_NON_ZERO_CURL.\",\n        \"Does not mutate carrier.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"x ∈ C¹ with α ∈ C⁰ in a valid cochain layer with before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)\",\n      \"codomain\": \"x + d₀α = 0 ∈ C¹ in the same carrier, leaving after-class ExactRepair (Φ₁ = 0, Γ₂ = 0)\",\n      \"representative_action\": \"acts nontrivially on C¹ representatives\",\n      \"quotient_action\": \"acts trivially on Q¹\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"α ∈ C⁰\",\n        \"d₀: C⁰ → C¹\",\n        \"x ∈ C¹ with before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)\",\n        \"adequate detector witness\",\n        \"coefficient domain R\"\n      ],\n      \"sign_convention\": \"plus convention; minimization contracts using x-d₀α are equivalent under α↦-α\"\n    },\n    \"5. Definition\": {\n      \"action\": \"E_α(x) = x + d₀α\",\n      \"exact_repair_term\": \"d₀α ∈ B¹\",\n      \"discharge_condition\": \"for lawful DDC step E, x + d₀α = 0\",\n      \"quotient_identity\": \"[E_α(x)] = [x] in Q¹\",\n      \"projection_identity\": \"π(E_α(x)) = π(x)\"\n    },\n    \"6. Laws and invariants\": {\n      \"law_7_exact_repair_discharges\": \"E requires before-class ExactRepair (Φ₁ = 0, Γ₂ = 0), leaves carrier unchanged, and leaves Φ₁ = Γ₂ = 0 with zero defect after repair (Ddc.E_gauge_repair_discharges).\",\n      \"no_class_crossing\": \"Gauge moves preserve d₁x and exactness; E cannot cross classes (Ddc.E_gauge_preserves_closure, Ddc.E_gauge_preserves_exactness).\",\n      \"refusal_on_non_exact\": \"An attempted E on a state with Γ₂ > 0 or Φ₁ > 0 is refused as REFUSED_NON_ZERO_CURL (Ddc.E_triangle_open_not_exact).\",\n      \"phi1_preserved\": \"Φ₁([E_α(x)]) = Φ₁([x]) = 0\",\n      \"quotient_class_identity\": \"π(E_α(x)) = π(x)\",\n      \"composition\": \"E_α ∘ E_β = E_{α+β}\",\n      \"identity\": \"E_0 = id_C¹\",\n      \"inverse\": \"E_α^{-1} = E_{-α} when additive inverse exists in C⁰\",\n      \"priority\": \"E is classified before I\",\n      \"carrier_unchanged\": \"E leaves carrier strictly unchanged.\",\n      \"adequate_detector_required\": \"E requires an adequate detector.\",\n      \"no_progress\": \"E changes representative but not quotient obstruction mass.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"operator_equality\": \"E_α = E_β on C¹ iff d₀(α-β)=0\",\n      \"alpha_equivalence\": \"α and β differing by ker(d₀) define the same E action.\",\n      \"action_equality\": \"Outputs equal as C¹ vectors under fixed basis.\",\n      \"quotient_equality\": \"Outputs always define the same Q¹ class as input.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"α serialized under C⁰ basis.\",\n        \"d₀ hash fixed.\",\n        \"x serialized under C¹ basis when action witness is claimed.\",\n        \"addition over R deterministic.\",\n        \"carrier unchanged.\",\n        \"basis ordering fixed.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"B1\": \"Adds an element of B¹ = im(d₀).\",\n        \"Q1\": \"Acts trivially on Q¹.\",\n        \"Phi1\": \"Preserves quotient mass.\",\n        \"R\": \"R ∘ E = R when R is deterministic over quotient class.\",\n        \"I\": \"E is classified before I even when Φ₁ is preserved.\",\n        \"M\": \"Carrier mutation or hidden basis change is M, not E.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ExactRepairOperatorDescriptor {\\n    pub layer_hash: String,\\n    pub d0_hash: String,\\n    pub alpha_hash: String,\\n    pub source_vector_hash: Option<String>,\\n    pub sign_convention: ExactRepairSignConvention,\\n}\\n\\npub enum ExactRepairSignConvention {\\n    PlusD0Alpha,\\n    MinusD0Alpha,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"E applied to non-exact class (ExactRepairFromNonExactClass, REFUSED_NON_ZERO_CURL).\",\n        \"E leaving non-zero defect or residual (ExactRepairLeftResidual, ExactRepairLeftDefect).\",\n        \"E changes quotient class.\",\n        \"E declared without α.\",\n        \"E changes carrier.\",\n        \"E changes basis silently.\",\n        \"E claimed to reduce Φ₁ from non-exact state.\",\n        \"E treated as structural progress.\",\n        \"E_α and E_β treated as distinct despite d₀(α-β)=0.\",\n        \"Action applied with α from a different layer.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Normal form for compressed E compositions.\",\n        \"Handling ker(d₀) representatives for α.\",\n        \"Sign convention normalization across Φ₁/R contracts.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"EXACT_REPAIR_OPERATOR_CONTRACT\": {\n        \"symbol\": \"E_α\",\n        \"ascii_symbol\": \"E_alpha\",\n        \"operator_class_symbol\": \"E\",\n        \"formula\": \"E_α(x)=x+d₀α\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"x∈C¹ with α∈C⁰ and before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)\",\n        \"codomain\": \"C¹ representative in same Q¹ class leaving x+d₀α = 0\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"α\",\n          \"d₀\",\n          \"x with before-class ExactRepair\",\n          \"adequate detector\",\n          \"coefficient domain R\"\n        ],\n        \"definition\": \"exact repair/gauge action discharging exact defect to zero\",\n        \"laws\": [\n          {\n            \"Law 7\": \"before-class ExactRepair, carrier unchanged, leaves zero defect\"\n          },\n          \"cannot cross classes (gauge preserves closure and exactness)\",\n          \"non-exact input routes to REFUSED_NON_ZERO_CURL\",\n          \"Φ₁ preserved (= 0)\",\n          \"quotient class identity\",\n          \"E_α∘E_β=E_{α+β}\",\n          \"E₀=id\",\n          \"classified before I\"\n        ],\n        \"forbidden_interpretations\": [\n          \"structural progress\",\n          \"carrier mutation\",\n          \"class-crossing repair\",\n          \"repair without α\",\n          \"Φ₁ decrease from positive state\",\n          \"policy decision\"\n        ],\n        \"relationships\": [\n          \"B¹ action\",\n          \"trivial on Q¹\",\n          \"R∘E=R when R deterministic\",\n          \"classified before I\"\n        ],\n        \"negative_tests\": [\n          \"E on non-exact class\",\n          \"E leaving non-zero defect\",\n          \"class changed\",\n          \"missing α\",\n          \"carrier changed\",\n          \"basis changed\",\n          \"claimed Φ₁ reduction\",\n          \"wrong layer α\"\n        ],\n        \"open_questions\": [\n          \"composition normal form\",\n          \"ker(d₀) α representatives\",\n          \"sign convention normalization\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
