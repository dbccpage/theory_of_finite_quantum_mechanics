g non-zero defect or residual (ExactRepairLeftResidual, ExactRepairLeftDefect).\",\n        \"E changes quotient class.\",\n        \"E declared without α.\",\n        \"E changes carrier.\",\n        \"E changes basis silently.\",\n        \"E claimed to reduce Φ₁ from non-exact state.\",\n        \"E treated as structural progress.\",\n        \"E_α and E_β treated as distinct despite d₀(α-β)=0.\",\n        \"Action applied with α from a different layer.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Normal form for compressed E compositions.\",\n        \"Handling ker(d₀) representatives for α.\",\n        \"Sign convention normalization across Φ₁/R contracts.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"EXACT_REPAIR_OPERATOR_CONTRACT\": {\n        \"symbol\": \"E_α\",\n        \"ascii_symbol\": \"E_alpha\",\n        \"operator_class_symbol\": \"E\",\n        \"formula\": \"E_α(x)=x+d₀α\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"x∈C¹ with α∈C⁰ and before-class ExactRepair (Φ₁ = 0, Γ₂ = 0)\",\n        \"codomain\": \"C¹ representative in same Q¹ class leaving x+d₀α = 0\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"α\",\n          \"d₀\",\n          \"x with before-class ExactRepair\",\n          \"adequate detector\",\n          \"coefficient domain R\"\n        ],\n        \"definition\": \"exact repair/gauge action discharging exact defect to zero\",\n        \"laws\": [\n          {\n            \"Law 7\": \"before-class ExactRepair, carrier unchanged, leaves zero defect\"\n          },\n          \"cannot cross classes (gauge preserves closure and exactness)\",\n          \"non-exact input routes to REFUSED_NON_ZERO_CURL\",\n          \"Φ₁ preserved (= 0)\",\n          \"quotient class identity\",\n          \"E_α∘E_β=E_{α+β}\",\n          \"E₀=id\",\n          \"classified before I\"\n        ],\n        \"forbidden_interpretations\": [\n          \"structural progress\",\n          \"carrier mutation\",\n          \"class-crossing repair\",\n          \"repair without α\",\n          \"Φ₁ decrease from positive state\",\n          \"policy decision\"\n        ],\n        \"relationships\": [\n          \"B¹ action\",\n          \"trivial on Q¹\",\n          \"R∘E=R when R deterministic\",\n          \"classified before I\"\n        ],\n        \"negative_tests\": [\n          \"E on non-exact class\",\n          \"E leaving non-zero defect\",\n          \"class changed\",\n          \"missing α\",\n          \"carrier changed\",\n          \"basis changed\",\n          \"claimed Φ₁ reduction\",\n          \"wrong layer α\"\n        ],\n        \"open_questions\": [\n          \"composition normal form\",\n          \"ker(d₀) α representatives\",\n          \"sign convention normalization\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
