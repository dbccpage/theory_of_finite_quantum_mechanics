      "6. Laws and invariants": {
        "law_7_exact_repair_discharges": "E requires before-class ExactRepair (Φ₁ = 0, Γ₂ = 0), leaves carrier unchanged, and leaves Φ₁ = Γ₂ = 0 with zero defect after repair (Ddc.E_gauge_repair_discharges).",
