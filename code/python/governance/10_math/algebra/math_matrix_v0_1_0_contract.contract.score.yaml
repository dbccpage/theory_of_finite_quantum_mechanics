      "field_spec = \"GF(7)\", but an entry contains the byte pattern representing \"9\", which is not a valid element of GF(7)\n",
      "provided domain_basis_hash does not match the SHA-256 of the actual ordered basis list\n",
      "ComputationWitness for \"multiply\" between a 3×2 matrix A and a 4×3 matrix B (inner dimensions 2 ≠ 4 make product undefined)\n",
      "domain_space declared over ℝ, codomain_space declared over ℂ\n",
      "FactEnvelope asserting \"trace = 0\" for a 2×3 matrix\n"
    ],
    "doctrine": {
      "summary": "A Matrix represents a linear map between two finite-dimensional vector spaces (domain and codomain) over a field K, expressed in terms of chosen ordered bases. This contract defines the structure, its validation, and allowed deterministic computations and decidable facts. It is purely structural; it does not confer any authority, nor does it decide admissibility for any application.",
      "non_role": [
        "Does not assert algebraic properties (rank, eigenvalues, positive-definiteness)",
        "Does not confer authority",
        "Does not decide admissibility for applications",
        "Does not support infinite-dimensional vector spaces",
        "Does not define sparse or compressed storage formats"
      ]
    },
    "wip": [
      "The exact canonical form for basis vectors (e.g., symbolic names, abstract coordinates) has not been standardised; the current placeholder defines a basis as an ordered list of Unicode strings that are normalised using NFKC before hashing.",
      "The contract is limited to finite-dimensional vector spaces. Extensions to free modules over rings or infinite-dimensional Hilbert spaces are deferred.",
      "The treatment of real and complex floating-point numbers is postponed to a companion 'FieldContract' that specifies rounding rules and tolerance. At present, Matrix only supports exact fields.",
      "FactEnvelope types and their deterministic validator signatures will be enumerated in a forthcoming 'MatrixProperties' sub-contract.",
      "No sparse or compressed storage format is defined. The StructureArtifact always uses a dense row-major representation.",
      "Status: mathematical_wip",
      "Authority effect: none (fixed, cannot be overridden)",
      "Customer claims: not allowed",
      "All validators must run in sequence; only if all succeed is a StructureArtifact created",
