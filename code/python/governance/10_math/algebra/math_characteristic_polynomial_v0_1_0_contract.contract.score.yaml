      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:characteristic_polynomial:v0.1.0\",\n  \"title\": \"Characteristic and Minimal Polynomial Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"matrix_invariant\",\n    \"symbol\": \"p_A(x) = det(x I − A) ∈ F[x] and the minimal polynomial m_A | p_A\",\n    \"ascii_symbol\": \"characteristic_polynomial\",\n    \"notation\": \"A ∈ M_n(F), F : Field + ExactRing\",\n    \"domain\": [\n      \"matrix: square BasicMatrix<F> of size n\",\n      \"polynomial: coefficients in ascending powers, entry i is the coefficient of xⁱ\",\n      \"budgets: OperationLimits { max_elements, max_scalar_ops }\"\n    ],\n    \"codomain\": {\n      \"description\": \"Monic polynomials as vectors of ascending coefficients: the characteristic polynomial (degree n, computed without any division by the Berkowitz algorithm and therefore valid in every characteristic) and the minimal polynomial (least degree d <= n with m_A(A) = 0, found by the first dependence among vec(I), vec(A), vec(A²), …). Also Horner evaluation of a polynomial at a matrix and the nilpotent, idempotent and involution tests.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The characteristic polynomial has exactly n + 1 entries and the last entry is 1\",\n      \"Only add, mul and neg of the scalar are used by the characteristic polynomial: no division, so characteristic 2 and 3 fields are valid\",\n      \"The Toeplitz column of each trailing block (a, R, C, M) is (1, −a, −R·C, −R·M·C, …, −R·M^(s−2)·C)\",\n      \"The minimal polynomial is monic of degree at most n; the zero matrix gives x, the scalar matrix c·I gives x − c, and the empty matrix gives the constant 1\",\n      \"is_nilpotent tests Aⁿ = 0; is_idempotent tests A² = A; is_involution tests A² = I (a matrix involution, not the field involution); all three refuse a non-square matrix\",\n      \"The worst-case cost charged by the budget is 2n⁴ + 4n³ scalar calls for the characteristic polynomial and n² elements; for the minimal polynomial 2n⁴ plus the reductions of the n²×(k+1) grids, k = 1..n, on at most n²·(n+1) elements\"\n    ]\n  },\n  \"laws\": [\n    \"Cayley–Hamilton: p_A(A) = 0\",\n    \"the coefficient of x^(n−1) is −tr A, and the constant term is (−1)ⁿ det A\",\n    \"p_(S A S⁻¹) = p_A and p_(Aᵀ) = p_A\",\n    \"p_(c A)(x) has coefficient c^(n−i) · (coefficient of xⁱ in p_A)\",\n    \"A is nilpotent iff p_A = xⁿ iff Aⁿ = 0\",\n    \"the companion matrix of a monic polynomial has that polynomial as characteristic and as minimal polynomial\",\n    \"m_A(A) = 0, m_A divides p_A, and deg m_A equals the rank of {vec(I), vec(A), …, vec(Aⁿ)}\",\n    \"the minimal polynomial of the multiplication matrix of a field element is the minimal polynomial of that element\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cayley–Hamilton is replayed with evaluate_polynomial_at_matrix, which uses matrix products only\",\n      \"Berkowitz agrees with an independent Faddeev–LeVerrier implementation over BigRational (which divides by k and is valid only in characteristic 0)\",\n      \"Divisibility m_A | p_A is replayed by long division with zero remainder\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_field::characteristic_polynomial\",\n    \"symbols\": [\n      \"characteristic_polynomial\",\n      \"minimal_polynomial\",\n      \"evaluate_polynomial_at_matrix\",\n      \"is_nilpotent\",\n      \"is_idempotent\",\n      \"is_involution\"\n    ],\n    \"required_tests\": [\n      \"predicates_and_polynomial_refuse_non_square_input\",\n      \"charpoly_budget_boundary_is_inclusive\",\n      \"minimal_polynomial_refuses_non_square_input_and_respects_its_budget\"\n    ]\n  },\n  \"negative_tests\": [\n    \"the characteristic polynomial, the minimal polynomial, the nilpotent, idempotent and involution tests, and polynomial evaluation at a matrix must refuse a non-square matrix\",\n    \"an operation whose documented worst-case bound exceeds the budget must be refused before any scalar work, and a bound equal to the limit must be accepted\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The characteristic polynomial of a square matrix over any exact field, by the division-free Berkowitz algorithm, and its minimal polynomial, with Horner evaluation at a matrix for the Cayley–Hamilton replay and the three exact tests A^n = 0, A² = A and A² = I. Because no division occurs in the characteristic polynomial, the result is valid over GF(2) and GF(3) at dimensions where the Faddeev–LeVerrier recurrence would divide by zero. The minimal polynomial of a multiplication matrix is the minimal polynomial of the field element it represents.\",\n    \"non_role\": [\n      \"Root finding, factorisation or isolation of the roots (polynomial arithmetic over F belongs to the number-theory crate)\",\n      \"Jordan or rational canonical forms\",\n      \"Eigenvectors and spectral decomposition\",\n      \"Numerical eigenvalue algorithms\"\n    ]\n  },\n  \"wip\": [\n    \"No Lean statement of Cayley–Hamilton or the Berkowitz identity exists; the YAML to Lean to Rust chain for this contract is open\",\n    \"The polynomials are returned as raw coefficient vectors; a polynomial type with arithmetic belongs to omega_number_theory, which depends on this crate and therefore cannot be imported here\",\n    \"The minimal polynomial costs O(n⁵) scalar calls (n reductions of n²-row grids); a Krylov route on single vectors would be cheaper for multiplication matrices of field elements but needs polynomial gcd over F\",\n    \"The O(n⁴) characteristic polynomial is conservative for large n; a fraction-free Bareiss route would be cheaper over integer-like fields\"\n  ]\n}\n",
