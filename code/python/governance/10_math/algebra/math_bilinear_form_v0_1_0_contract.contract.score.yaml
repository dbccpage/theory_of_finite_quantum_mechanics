      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bilinear_form:v0.1.0\",\n  \"title\": \"Bilinear Form Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"bilinear_form\",\n    \"symbol\": \"B: V x W -> K (as matrix with respect to bases)\",\n    \"ascii_symbol\": \"bilinear_form\",\n    \"notation\": \"B: V x W -> K (as matrix with respect to bases)\",\n    \"domain\": [\n      \"left_vector_space: vector_space_V\",\n      \"right_vector_space: vector_space_W\",\n      \"field: field_K\",\n      \"matrix: m_x_n_scalar_matrix\"\n    ],\n    \"codomain\": {\n      \"description\": \"Bilinear map V x W -> K encoded by matrix representation\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Left and right vector spaces must be over the same field K\",\n      \"V x W domain carriers must be compatible\",\n      \"Matrix dimensions must match basis lengths (m = dim(V), n = dim(W))\",\n      \"All matrix entries must be valid scalars in field K\",\n      \"All hashes (carrier, basis, matrix, field) must be valid\"\n    ]\n  },\n  \"laws\": [\n    \"V, W, and K all use the same field\",\n    \"Matrix dimensions match basis lengths (m = dim(V), n = dim(W))\",\n    \"B(av + bv', w) = aB(v,w) + bB(v',w) for all a,b in K\",\n    \"B(v, aw + bw') = aB(v,w) + bB(v,w') for all a,b in K\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Evaluation B(v,w) must replay deterministically from canonical vector components and matrix entries\",\n      \"Field arithmetic operations must be deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"V and W over different fields must be rejected\",\n    \"Matrix dimensions not matching basis lengths must be rejected\",\n    \"Matrix with invalid scalar entry must be rejected\",\n    \"Claiming positive-definiteness without FactEnvelope must be rejected\",\n    \"BilinearForm claiming authority or admissibility must be rejected\",\n    \"Same inputs producing different hashes must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"BilinearForm is a finite matrix-backed map V x W -> K that is linear in each argument over a declared field K. Bilinear forms encode pairings, Gram matrices, symplectic forms, quadratic precursors, and inner-product substrate facts. The contract forms the structure only; symmetry, nondegeneracy, positivity, and inner-product status are separate FactEnvelopes or contracts.\",\n    \"non_role\": [\n      \"Symmetry, nondegeneracy, positivity are separate FactEnvelopes\",\n      \"Inner-product status is a separate contract\",\n      \"Classification of admissibility or policy decisions\",\n      \"Certificate generation or authority claims\"\n    ]\n  },\n  \"wip\": [\n    \"Decide row/column convention for V x W universally\",\n    \"Define sesquilinear forms separately for complex Hilbert spaces\",\n    \"How to handle symmetry, alternating, and degenerate properties (via FactEnvelope?)\",\n    \"Should inner-product status be a separate contract or FactEnvelope?\",\n    \"Symmetry, nondegeneracy, positivity are separate FactEnvelopes\",\n    \"Row/column convention for V x W needs to be universally decided\",\n    \"Sesquilinear forms for complex Hilbert spaces may need separate contract\",\n    \"Matrix representation uses basis hashes for V and W\",\n    \"Evaluation B(v,w) computed deterministically via canonical field arithmetic\",\n    \"No authority, admissibility, or customer-facing claims allowed\"\n  ]\n}\n",
