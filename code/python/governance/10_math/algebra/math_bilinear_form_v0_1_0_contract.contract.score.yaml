    "doctrine": {
      "summary": "BilinearForm is a finite matrix-backed map V x W -> K that is linear in each argument over a declared field K. Bilinear forms encode pairings, Gram matrices, symplectic forms, quadratic precursors, and inner-product substrate facts. The contract forms the structure only; symmetry, nondegeneracy, positivity, and inner-product status are separate FactEnvelopes or contracts.",
