      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:linear_map:v0.1.0\",\n  \"title\": \"Linear Map Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"linear_map\",\n    \"symbol\": \"f: V → W (as matrix with respect to bases)\",\n    \"ascii_symbol\": \"linear_map\",\n    \"notation\": \"f: V → W (as matrix with respect to bases)\",\n    \"domain\": [\n      \"domain: vector_space_V\",\n      \"codomain: vector_space_W\",\n      \"matrix: coordinate_matrix\"\n    ],\n    \"codomain\": {\n      \"description\": \"Linear transformation V → W between finite-dimensional vector spaces\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Domain, codomain, and matrix artifacts must exist\",\n      \"All three artifacts must reference same field K\",\n      \"Matrix dimensions must match space dimensions\",\n      \"Matrix basis hashes must match space basis hashes\"\n    ]\n  },\n  \"laws\": [\n    \"Domain, codomain, and matrix all over same field K\",\n    \"Matrix dimensions match space dimensions\",\n    \"Matrix basis hashes match space basis hashes\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Artifact existence verified via content-addressing\",\n      \"Validator and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_map\",\n    \"symbols\": [\n      \"LinearMap\"\n    ],\n    \"required_tests\": [\n      \"new_checked_rejects_domain_dimension_mismatch\",\n      \"new_checked_rejects_codomain_dimension_mismatch\",\n      \"checked_compose_rejects_codomain_domain_basis_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"One of three artifact hashes does not resolve must be rejected\",\n    \"Domain, codomain, or matrix using different fields must be rejected\",\n    \"Matrix dimensions not matching space dimensions must be rejected\",\n    \"Matrix basis hashes not matching space basis hashes must be rejected\",\n    \"Composing maps where codomain of f != domain of g must be rejected\",\n    \"Identity matrix with mismatched basis must be rejected\",\n    \"Same inputs producing different hashes must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A LinearMap is a linear transformation between two finite-dimensional vector spaces V (domain) and W (codomain) over a common field K, expressed with respect to chosen ordered bases of V and W. It is the pairing of a domain VectorSpace, a codomain VectorSpace, and a Matrix artifact that encodes the transformation in those bases. This contract guarantees compatibility of dimensions, bases, and field, but does not assert any additional algebraic properties (injectivity, surjectivity, kernel) — those are separate FactEnvelopes.\",\n    \"non_role\": [\n      \"Algebraic properties (injectivity, surjectivity, kernel) are separate FactEnvelopes\",\n      \"Abstract maps without chosen basis (deferred to AbstractLinearMap contract)\",\n      \"Continuous or infinite-dimensional spaces (out of scope)\",\n      \"Determinant computation (separate ComputationWitness)\"\n    ]\n  },\n  \"wip\": [\n    \"Should abstract maps without chosen basis have separate AbstractLinearMap contract?\",\n    \"How to handle composition when intermediate Matrix artifacts must be created?\",\n    \"How to define version-aware referencing when VectorSpace/Matrix contracts upgrade?\",\n    \"How to compute properties like 'is invertible' (requires determinant)?\",\n    \"Requires explicit Matrix artifact (no abstract basis-free maps)\",\n    \"Operations like composition generate new Matrix artifacts\",\n    \"Continuous or infinite-dimensional spaces not addressed\",\n    \"Properties like injectivity/surjectivity are separate FactEnvelopes\",\n    \"Dimension and field_id cached in descriptor (derivable from referenced artifacts)\",\n    \"Version changes to VectorSpace/Matrix contracts could invalidate existing LinearMaps\"\n  ]\n}\n",
