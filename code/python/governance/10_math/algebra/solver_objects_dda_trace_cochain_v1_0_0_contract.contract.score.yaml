    "math": {
      "object_kind": "dda_trace_cochain",
      "symbol": "c_dda in C^k(Alphabet)",
      "definition": "System contract binding the Discrete Deformation Calculus (DDC) 8-letter operational alphabet A_DDC = {E, R, C, I, Lambda, D, M, T} to cochain evaluations and Merkle-chained step receipts.",
      "alphabet": [
        {
          "letter": "E",
          "name": "Exact repair",
          "role": "Eliminates local boundary tension in im(d_0); requires ExactRepair before-class; leaves Phi_1 = Gamma_2 = 0, zero defect, carrier unchanged.",
          "required_witness": "Exact potential alpha in C^0 such that x - d_0 alpha = 0",
          "refusal_reason": "REFUSED_NON_ZERO_CURL"
        },
        {
          "letter": "R",
          "name": "Residual projection",
          "role": "Selects minimal-norm representative under TieR; preserves Phi_1, Gamma_2, and diagnostic class; carrier unchanged.",
          "required_witness": "Spanning forest potential or dual circulation witness; adequate detector",
          "refusal_reason": "REFUSED_DETECTOR_INADEQUATE"
        },
        {
          "letter": "C",
          "name": "Context exposure",
          "role": "Declares or splits carrier, window, or boundary complex; changes carrier; never lowers Phi_1 or Gamma_2 (Law 8).",
          "required_witness": "Context embedding map and declared carrier/boundary definition",
          "refusal_reason": "REFUSED_CARRIER_MUTATION"
        },
        {
          "letter": "I",
          "name": "Integration",
          "role": "Appends deterministic step receipt to hash chain; data state unchanged; requires verified receipt (Law 5).",
          "required_witness": "Deterministic step receipt",
          "refusal_reason": "REFUSED_MISSING_RECEIPT"
        },
        {
          "letter": "Lambda",
          "name": "Structural lift",
          "role": "Extends carrier capacity under licensed context extension; preserves norms; requires license and trigger (Law 4).",
          "required_witness": "License certificate and Law 4 trigger (ClosedResidual or DetectorInadequate)",
          "refusal_reason": "REFUSED_UNLICENSED_LIFT / REFUSED_LIFT_TRIGGER"
        },
        {
          "letter": "D",
          "name": "Descent",
          "role": "Scale descent lowering from rich to coarse carrier; changes carrier; requires LossLedger (Law 6).",
          "required_witness": "Explicit LossLedger L_adapter recording dropped coordinates and lost mass",
          "refusal_reason": "REFUSED_MISSING_LOSS_LEDGER"
        },
        {
          "letter": "M",
          "name": "Typed refusal",
          "role": "Refuses invalid, unwitnessed, or out-of-budget request; leaves data state unchanged; transitions control to Refused.",
          "required_witness": "Reason code from closed vocabulary of 7 typed reasons",
          "refusal_reason": "REFUSED_INVALID_WITNESS"
        },
        {
          "letter": "T",
          "name": "Terminalization",
          "role": "Closes execution trace on routing terminal; requires Gamma_2 = 0 and adequate detector; transitions control to Terminalized (Law 2).",
          "required_witness": "Zero face-closure defect (Gamma_2 = 0), adequate detector, terminal policy evaluation",
          "refusal_reason": "REFUSED_OPEN_OBSTRUCTION / REFUSED_DETECTOR_INADEQUATE"
        }
      ],
      "fsm_control_states": [
        "Open",
        "Refused",
        "Terminalized"
      ],
      "laws": [
        "Law 1 (Trace Typing & Receipt Determinism): Every transition emits a letter in A_DDC with before/after state digests, carrier IDs, and witness flags; receipts chain as h_{t+1} = SHA256(t : h_t : alpha : json(r_t)).",
        "Law 2 (Terminal Absorption): Once T is emitted, control transitions to Terminalized and admits no further steps (Ddc.terminal_absorbing, Ddc.lawful_T_is_last).",
        "Law 3 (Refusal Absorption): After M, only C (changed scope), Lambda (licensed lift), or T (terminalization) may follow (Ddc.refusal_absorbing).",
        "Law 4 (Lift Trigger Law): Lambda requires a license and a trigger: the before-state must be ClosedResidual (Phi_1 > 0, Gamma_2 = 0) or DetectorInadequate (Ddc.L_needs_licence_and_trigger).",
        "Law 5 (Integration Requires Receipt): Step integration I requires an explicit, cryptographically verifiable receipt; without a receipt, it routes to M (Ddc.I_needs_receipt).",
        "Law 6 (Descent Requires Loss Ledger): Scale descent D requires an explicit LossLedger recording dropped coordinates and lost mass; without a ledger, it routes to M (Ddc.D_needs_ledger).",
        "Law 7 (Exact Repair Discharges): Exact repair E requires before-class ExactRepair (Phi_1 = 0, Gamma_2 = 0), leaves carrier unchanged, leaves Phi_1 = Gamma_2 = 0 and zero defect after repair, and cannot cross classes (Ddc.E_gauge_repair_discharges, Ddc.E_gauge_preserves_closure).",
        "Law 8 (Context Exposure Is Not Repair): Declaring or exposing a boundary C changes the carrier and never lowers Phi_1 or Gamma_2 (Ddc.C_is_not_repair, Ddc.C_changes_carrier).",
        "No Free Decrease Theorem: If a lawful step lowers Phi_1 or Gamma_2, its letter is D or Lambda (Ddc.no_free_decrease).",
        "Open Obstruction Theorem: From Gamma_2 > 0, a lawful tape without D or Lambda keeps Gamma_2 > 0 and never terminalizes (Ddc.open_needs_priced_move).",
        "CREDIT Tape Theorem: The tape C.R.E.D.I.T is lawful iff each step satisfies its law, starts from Phi_1 = Gamma_2 = 0, and includes a LossLedger at D (Ddc.credit_lawful_iff, Ddc.credit_starts_exact, Ddc.credit_needs_ledger)."
      ],
      "four_axis_separation": {
        "invariant": "DiagnosticClass != RoutingTerminal != ExtensionStatus != AuthorityStatus",
        "diagnostic_classes": [
          "ExactRepair",
          "ClosedResidual",
          "ActiveClosureFailure"
        ],
        "routing_terminals": [
          "CheckPassed",
          "ResidualTerminal",
          "RequiresLift",
          "Refusal"
        ],
        "authority_effect": "None (all emitted receipts strictly carry AuthorityEffect.none)"
      }
    },
    "doctrine": {
      "summary": "OESOS and Prime binding contract for DDA/DDC Trace Trajectory Cochain.",
      "non_role": [
        "authority_minting",
        "policy_decision",
        "self_certification",
        "state_transition"
      ],
      "canonical_invariant": "This contract is structural and AuthorityEffect None. DDC records how an obstruction was handled by a finite computation, not whether the world is true. A lawful tape is replay evidence; it is never authority."
    }
