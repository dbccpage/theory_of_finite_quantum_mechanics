      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:solver_objects:dda_trace_cochain:v1.0.0\",\n  \"title\": \"DDA Trace Trajectory Cochain\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"role\": \"MathObject\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_math_contract:v1.0.0\"\n    ],\n    \"semantic_contracts\": [\n      \"omega_engine_governance/contracts/contracts_math/cochain_layer.contract.yaml\"\n    ],\n    \"runtime_bindings\": [\n      \"omega_engine.crates.discrete_deformation_algebra.dda_trace_logger\",\n      \"omega_engine.crates.discrete_deformation_algebra.dda_engine\"\n    ],\n    \"used_by\": [\n      \"OESOS\",\n      \"Prime000\",\n      \"Prime001\",\n      \"Prime002\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"dda_trace_cochain\",\n    \"symbol\": \"c_dda in C^k(Alphabet)\",\n    \"definition\": \"System contract binding the Discrete Deformation Calculus (DDC) 8-letter operational alphabet A_DDC = {E, R, C, I, Lambda, D, M, T} to cochain evaluations and Merkle-chained step receipts.\",\n    \"alphabet\": [\n      {\n        \"letter\": \"E\",\n        \"name\": \"Exact repair\",\n        \"role\": \"Eliminates local boundary tension in im(d_0); requires ExactRepair before-class; leaves Phi_1 = Gamma_2 = 0, zero defect, carrier unchanged.\",\n        \"required_witness\": \"Exact potential alpha in C^0 such that x - d_0 alpha = 0\",\n        \"refusal_reason\": \"REFUSED_NON_ZERO_CURL\"\n      },\n      {\n        \"letter\": \"R\",\n        \"name\": \"Residual projection\",\n        \"role\": \"Selects minimal-norm representative under TieR; preserves Phi_1, Gamma_2, and diagnostic class; carrier unchanged.\",\n        \"required_witness\": \"Spanning forest potential or dual circulation witness; adequate detector\",\n        \"refusal_reason\": \"REFUSED_DETECTOR_INADEQUATE\"\n      },\n      {\n        \"letter\": \"C\",\n        \"name\": \"Context exposure\",\n        \"role\": \"Declares or splits carrier, window, or boundary complex; changes carrier; never lowers Phi_1 or Gamma_2 (Law 8).\",\n        \"required_witness\": \"Context embedding map and declared carrier/boundary definition\",\n        \"refusal_reason\": \"REFUSED_CARRIER_MUTATION\"\n      },\n      {\n        \"letter\": \"I\",\n        \"name\": \"Integration\",\n        \"role\": \"Appends deterministic step receipt to hash chain; data state unchanged; requires verified receipt (Law 5).\",\n        \"required_witness\": \"Deterministic step receipt\",\n        \"refusal_reason\": \"REFUSED_MISSING_RECEIPT\"\n      },\n      {\n        \"letter\": \"Lambda\",\n        \"name\": \"Structural lift\",\n        \"role\": \"Extends carrier capacity under licensed context extension; preserves norms; requires license and trigger (Law 4).\",\n        \"required_witness\": \"License certificate and Law 4 trigger (ClosedResidual or DetectorInadequate)\",\n        \"refusal_reason\": \"REFUSED_UNLICENSED_LIFT / REFUSED_LIFT_TRIGGER\"\n      },\n      {\n        \"letter\": \"D\",\n        \"name\": \"Descent\",\n        \"role\": \"Scale descent lowering from rich to coarse carrier; changes carrier; requires LossLedger (Law 6).\",\n        \"required_witness\": \"Explicit LossLedger L_adapter recording dropped coordinates and lost mass\",\n        \"refusal_reason\": \"REFUSED_MISSING_LOSS_LEDGER\"\n      },\n      {\n        \"letter\": \"M\",\n        \"name\": \"Typed refusal\",\n        \"role\": \"Refuses invalid, unwitnessed, or out-of-budget request; leaves data state unchanged; transitions control to Refused.\",\n        \"required_witness\": \"Reason code from closed vocabulary of 7 typed reasons\",\n        \"refusal_reason\": \"REFUSED_INVALID_WITNESS\"\n      },\n      {\n        \"letter\": \"T\",\n        \"name\": \"Terminalization\",\n        \"role\": \"Closes execution trace on routing terminal; requires Gamma_2 = 0 and adequate detector; transitions control to Terminalized (Law 2).\",\n        \"required_witness\": \"Zero face-closure defect (Gamma_2 = 0), adequate detector, terminal policy evaluation\",\n        \"refusal_reason\": \"REFUSED_OPEN_OBSTRUCTION / REFUSED_DETECTOR_INADEQUATE\"\n      }\n    ],\n    \"fsm_control_states\": [\n      \"Open\",\n      \"Refused\",\n      \"Terminalized\"\n    ],\n    \"laws\": [\n      \"Law 1 (Trace Typing & Receipt Determinism): Every transition emits a letter in A_DDC with before/after state digests, carrier IDs, and witness flags; receipts chain as h_{t+1} = SHA256(t : h_t : alpha : json(r_t)).\",\n      \"Law 2 (Terminal Absorption): Once T is emitted, control transitions to Terminalized and admits no further steps (Ddc.terminal_absorbing, Ddc.lawful_T_is_last).\",\n      \"Law 3 (Refusal Absorption): After M, only C (changed scope), Lambda (licensed lift), or T (terminalization) may follow (Ddc.refusal_absorbing).\",\n      \"Law 4 (Lift Trigger Law): Lambda requires a license and a trigger: the before-state must be ClosedResidual (Phi_1 > 0, Gamma_2 = 0) or DetectorInadequate (Ddc.L_needs_licence_and_trigger).\",\n      \"Law 5 (Integration Requires Receipt): Step integration I requires an explicit, cryptographically verifiable receipt; without a receipt, it routes to M (Ddc.I_needs_receipt).\",\n      \"Law 6 (Descent Requires Loss Ledger): Scale descent D requires an explicit LossLedger recording dropped coordinates and lost mass; without a ledger, it routes to M (Ddc.D_needs_ledger).\",\n      \"Law 7 (Exact Repair Discharges): Exact repair E requires before-class ExactRepair (Phi_1 = 0, Gamma_2 = 0), leaves carrier unchanged, leaves Phi_1 = Gamma_2 = 0 and zero defect after repair, and cannot cross classes (Ddc.E_gauge_repair_discharges, Ddc.E_gauge_preserves_closure).\",\n      \"Law 8 (Context Exposure Is Not Repair): Declaring or exposing a boundary C changes the carrier and never lowers Phi_1 or Gamma_2 (Ddc.C_is_not_repair, Ddc.C_changes_carrier).\",\n      \"No Free Decrease Theorem: If a lawful step lowers Phi_1 or Gamma_2, its letter is D or Lambda (Ddc.no_free_decrease).\",\n      \"Open Obstruction Theorem: From Gamma_2 > 0, a lawful tape without D or Lambda keeps Gamma_2 > 0 and never terminalizes (Ddc.open_needs_priced_move).\",\n      \"CREDIT Tape Theorem: The tape C.R.E.D.I.T is lawful iff each step satisfies its law, starts from Phi_1 = Gamma_2 = 0, and includes a LossLedger at D (Ddc.credit_lawful_iff, Ddc.credit_starts_exact, Ddc.credit_needs_ledger).\"\n    ],\n    \"four_axis_separation\": {\n      \"invariant\": \"DiagnosticClass != RoutingTerminal != ExtensionStatus != AuthorityStatus\",\n      \"diagnostic_classes\": [\n        \"ExactRepair\",\n        \"ClosedResidual\",\n        \"ActiveClosureFailure\"\n      ],\n      \"routing_terminals\": [\n        \"CheckPassed\",\n        \"ResidualTerminal\",\n        \"RequiresLift\",\n        \"Refusal\"\n      ],\n      \"authority_effect\": \"None (all emitted receipts strictly carry AuthorityEffect.none)\"\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"OESOS and Prime binding contract for DDA/DDC Trace Trajectory Cochain.\",\n    \"non_role\": [\n      \"authority_minting\",\n      \"policy_decision\",\n      \"self_certification\",\n      \"state_transition\"\n    ],\n    \"canonical_invariant\": \"This contract is structural and AuthorityEffect None. DDC records how an obstruction was handled by a finite computation, not whether the world is true. A lawful tape is replay evidence; it is never authority.\"\n  }\n}\n",
