      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:tie_r:v1.0.0\",\n  \"title\": \"Deterministic Residual Tie Selection Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:residual_projection:v1.0.0\",\n        \"urn:omega:math:quotient_mass:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [\n        \"R\"\n      ],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"tie_breaking_policy\",\n    \"symbol\": \"TieR: 2^{argmin_alpha ||x - d_0 alpha||_{1,w}} -> C^1\",\n    \"ascii_symbol\": \"TieR\",\n    \"notation\": \"TieR(argmin_alpha ||x - d_0 alpha||_{1,w}) = x - d_0 alpha*\",\n    \"domain\": [\n      \"candidate_potentials: non-empty set of tight potentials minimizing weighted l1 norm\",\n      \"carrier: finite oriented graph or 2-complex with ordered vertices and edges\"\n    ],\n    \"codomain\": {\n      \"description\": \"Unique, canonically selected minimal-norm representative R(x) in C^1.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"carrier must have canonical vertex ordering and edge ordering\",\n      \"candidate potentials must achieve exact minimum Phi_1\",\n      \"spanning forest construction must follow deterministic BFS/DFS from sorted roots\",\n      \"selected potential alpha* must be zero on the root vertex of each connected component\"\n    ]\n  },\n  \"laws\": [\n    \"DDC-TAPE-11 (Spanning Forest Enumeration): Phi_1 is attained at a potential determined by a spanning forest whose edges are tight; enumerating spanning forests computes Phi_1 exactly (Prop 3.2).\",\n    \"Deterministic Selection: TieR turns the relation-valued argmin into a deterministic single-valued function R: C^1 -> C^1.\",\n    \"Idempotence: With deterministic TieR, R(R(x)) = R(x).\",\n    \"Exact Absorption: For any exact shift d_0 alpha, R(x + d_0 alpha) = R(x) under the same TieR policy.\",\n    \"Class Preservation: [R(x)] = [x] in Q^1; Gamma_2(R(x)) = Gamma_2(x).\",\n    \"Xi Tie Hierarchy Precondition: Under primary diagnostic ties (Phi_{1,A} = Phi_{1,B} and Gamma_{2,A} = Gamma_{2,B}), secondary metrics such as Xi may be evaluated, but Xi can never override worsening primary diagnostics.\"\n  ],\n  \"negative_tests\": [\n    \"Non-deterministic representative selection where multiple optima exist must be rejected.\",\n    \"Representative with objective strictly greater than Phi_1 must be rejected.\",\n    \"Tie policy that alters Gamma_2 must be rejected.\",\n    \"Xi tie-break applied when primary diagnostics are not tied must be rejected.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"TieR establishes a deterministic canonical choice among tied minimal-norm representatives of a quotient class Q^1, ensuring that residual projection R is a reproducible mathematical operator.\",\n    \"symbol\": \"TieR\",\n    \"ascii_symbol\": \"TieR\",\n    \"operator_class_symbol\": \"R\",\n    \"non_role\": [\n      \"authority_minting\",\n      \"policy_decision\",\n      \"self_certification\"\n    ],\n    \"canonical_invariant\": \"Without TieR, residual projection R is a set-valued relation. With TieR, R is a replayable endomorphism on C^1.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
