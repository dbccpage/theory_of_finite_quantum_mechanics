    "title": "Transport Loss Ledger Contract",
    "kind": "math_contract",
    "status": "active",
    "layer": "math",
    "descriptor": {
      "authority_effect": "none",
      "evidence_ceiling": "ShapeOnly",
      "runtime_enforcement": false,
      "customer_claim_allowed": false,
      "dependencies": {
        "contracts": [
          "urn:omega:math:quotient_transport:v1.0.0"
        ],
        "proof_obligations": []
      },
      "terminals": {
