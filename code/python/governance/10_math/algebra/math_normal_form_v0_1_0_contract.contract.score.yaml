        "reduction_trace: Sequence of reduction steps from input to normal form"
      ],
      "codomain": {
        "description": "A normal form computation consists of: the expression set S, the rewriting relation ->, evidence of confluence and termination, and the normal form function nf: S -> NF(S) where NF(S) is the set of irreducible elements.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "nf(x) is irreducible -- no further reductions apply",
        "nf(x) is reachable from x via the reduction relation: x ->* nf(x)",
        "nf(nf(x)) = nf(x)",
        "Artifact hash correctly computed from expression and normal form data"
      ]
    },
    "laws": [
      "The rewriting system is confluent: for all x, y, z in S, if x ->* y and x ->* z, then there exists w in S such that y ->* w and z ->* w.  This guarantees uniqueness of normal forms.\n",
      "The rewriting system is terminating: there are no infinite reduction sequences x_0 -> x_1 -> x_2 -> ... in S.\n",
      "An element y in S is in normal form (irreducible) if there is no z in S with y -> z.  The normal form function returns only irreducible elements.\n",
      "For each x in S, nf(x) is unique.  This follows from confluence and termination but must be verified independently when the rewriting system is supplied.\n",
      "nf(nf(x)) = nf(x) for all x in S.  Applying the normal form function to an already-normal element is the identity.\n"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Reduction strategy must be deterministic (e.g., leftmost-outermost)",
        "Expression encoding normalized to canonical bytes",
        "Validators and computation functions are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "negative_tests": [
      "Rewriting system is not confluent",
      "Rewriting system has infinite reduction sequences",
      "Expression hash does not resolve to valid artifact",
      "Expression is not in the domain of the rewriting system"
    ],
    "doctrine": {
      "summary": "A Normal Form is a canonical representative of an equivalence class under a specified reduction or rewriting system.  Given a set S of expressions, an equivalence relation ~ on S, and a reduction relation ->* that is confluent and terminating, the normal form nf(x) of x in S is the unique element y such that x ->* y and y is irreducible (no further reductions apply).  Two elements x, y in S are equivalent (x ~ y) if and only if nf(x) = nf(y).  This contract defines the structure of normal form computations and the properties they must satisfy.",
      "non_role": [
        "Does not define specific rewriting systems (lambda calculus, Groebner, etc.)",
