      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:normal_form:v0.1.0\",\n  \"title\": \"Normal Form Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"canonical_representative\",\n    \"symbol\": \"nf: S -> NF(S), nf(x) = y iff x ->* y and y is irreducible\",\n    \"ascii_symbol\": \"normal_form\",\n    \"notation\": \"nf: S -> NF(S), nf(x) = y iff x ->* y and y is irreducible\",\n    \"domain\": [\n      \"expression_set: Set S of expressions in the algebraic structure\",\n      \"rewriting_relation: One-step reduction relation -> on S\",\n      \"normal_form_set: Subset NF(S) of irreducible elements\",\n      \"normal_form_function: Function nf: S -> NF(S) mapping each expression to its unique normal form\",\n      \"reduction_trace: Sequence of reduction steps from input to normal form\"\n    ],\n    \"codomain\": {\n      \"description\": \"A normal form computation consists of: the expression set S, the rewriting relation ->, evidence of confluence and termination, and the normal form function nf: S -> NF(S) where NF(S) is the set of irreducible elements.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"nf(x) is irreducible -- no further reductions apply\",\n      \"nf(x) is reachable from x via the reduction relation: x ->* nf(x)\",\n      \"nf(nf(x)) = nf(x)\",\n      \"Artifact hash correctly computed from expression and normal form data\"\n    ]\n  },\n  \"laws\": [\n    \"The rewriting system is confluent: for all x, y, z in S, if x ->* y and x ->* z, then there exists w in S such that y ->* w and z ->* w.  This guarantees uniqueness of normal forms.\\n\",\n    \"The rewriting system is terminating: there are no infinite reduction sequences x_0 -> x_1 -> x_2 -> ... in S.\\n\",\n    \"An element y in S is in normal form (irreducible) if there is no z in S with y -> z.  The normal form function returns only irreducible elements.\\n\",\n    \"For each x in S, nf(x) is unique.  This follows from confluence and termination but must be verified independently when the rewriting system is supplied.\\n\",\n    \"nf(nf(x)) = nf(x) for all x in S.  Applying the normal form function to an already-normal element is the identity.\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Reduction strategy must be deterministic (e.g., leftmost-outermost)\",\n      \"Expression encoding normalized to canonical bytes\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Rewriting system is not confluent\",\n    \"Rewriting system has infinite reduction sequences\",\n    \"Expression hash does not resolve to valid artifact\",\n    \"Expression is not in the domain of the rewriting system\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Normal Form is a canonical representative of an equivalence class under a specified reduction or rewriting system.  Given a set S of expressions, an equivalence relation ~ on S, and a reduction relation ->* that is confluent and terminating, the normal form nf(x) of x in S is the unique element y such that x ->* y and y is irreducible (no further reductions apply).  Two elements x, y in S are equivalent (x ~ y) if and only if nf(x) = nf(y).  This contract defines the structure of normal form computations and the properties they must satisfy.\",\n    \"non_role\": [\n      \"Does not define specific rewriting systems (lambda calculus, Groebner, etc.)\",\n      \"Does not handle non-terminating or non-confluent systems\",\n      \"Does not implement the reduction strategy (leftmost, rightmost, etc.)\",\n      \"Does not classify admissibility of expressions\",\n      \"Does not cover weak normal forms or head normal forms\"\n    ]\n  },\n  \"wip\": [\n    \"Should this contract support weak normal forms and head normal forms?\",\n    \"How to handle rewriting systems where termination is undecidable?\",\n    \"Integration with specific normal form contracts (Smith, Jordan, Groebner)\",\n    \"Whether reduction traces should be stored or only their hashes\",\n    \"Strategy selection (leftmost-outermost vs innermost) as contract parameter\",\n    \"This contract is generic over the rewriting system -- specific instances are separate contracts\",\n    \"Confluence and termination are assumed as preconditions, not proved by this contract\",\n    \"The reduction trace provides a constructive witness of reachability\",\n    \"Consider adding complexity bounds (max reduction steps) as a contract parameter\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_pipelines\",\n    \"module\": \"coda_gtlanf\",\n    \"symbols\": [\n      \"Normalize\",\n      \"FinClaim\",\n      \"CodaGtlaNf\",\n      \"normalize_l\",\n      \"include_i\",\n      \"t\",\n      \"is_fixed\"\n    ]\n  }\n}\n",
