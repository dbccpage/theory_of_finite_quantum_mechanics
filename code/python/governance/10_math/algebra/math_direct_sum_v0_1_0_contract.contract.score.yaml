    "laws": [
      "All component vector spaces must be over the same field K",
      "dim(V₁ ⊕ V₂ ⊕ ... ⊕ Vₙ) = dim(V₁) + dim(V₂) + ... + dim(Vₙ)",
      "If Bᵢ is a basis for Vᵢ, then B₁ ∪ B₂ ∪ ... ∪ Bₙ (concatenated) forms a basis for the direct sum\n",
      "For each i, there exists a canonical injection ιᵢ: Vᵢ → V₁ ⊕ ... ⊕ Vₙ given by ιᵢ(vᵢ) = (0, ..., 0, vᵢ, 0, ..., 0)\n",
      "For each i, there exists a canonical projection πᵢ: V₁ ⊕ ... ⊕ Vₙ → Vᵢ given by πᵢ((v₁, ..., vₙ)) = vᵢ\n"
