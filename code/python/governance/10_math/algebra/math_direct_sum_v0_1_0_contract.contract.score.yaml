      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:direct_sum:v0.1.0\",\n  \"title\": \"DirectSum Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"vector_space\",\n    \"symbol\": \"V₁ ⊕ V₂ ⊕ ... ⊕ Vₙ\",\n    \"ascii_symbol\": \"direct_sum\",\n    \"notation\": \"V₁ ⊕ V₂ ⊕ ... ⊕ Vₙ\",\n    \"domain\": [\n      \"component_spaces: finite list of vector spaces over same field K\",\n      \"elements: tuples (v₁, v₂, ..., vₙ)\"\n    ],\n    \"codomain\": {\n      \"description\": \"The carrier is the Cartesian product V₁ × V₂ × ... × Vₙ of the component vector spaces. Elements are tuples (v₁, v₂, ..., vₙ) where vᵢ ∈ Vᵢ.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Component list must be non-empty unless zero-object policy declared\",\n      \"All component vector spaces must be over the same field\",\n      \"Output dimension must equal sum of component dimensions\",\n      \"Output basis must match declared concatenation policy\",\n      \"All component and output hashes must be consistent\"\n    ]\n  },\n  \"laws\": [\n    \"All component vector spaces must be over the same field K\",\n    \"dim(V₁ ⊕ V₂ ⊕ ... ⊕ Vₙ) = dim(V₁) + dim(V₂) + ... + dim(Vₙ)\",\n    \"If Bᵢ is a basis for Vᵢ, then B₁ ∪ B₂ ∪ ... ∪ Bₙ (concatenated) forms a basis for the direct sum\\n\",\n    \"For each i, there exists a canonical injection ιᵢ: Vᵢ → V₁ ⊕ ... ⊕ Vₙ given by ιᵢ(vᵢ) = (0, ..., 0, vᵢ, 0, ..., 0)\\n\",\n    \"For each i, there exists a canonical projection πᵢ: V₁ ⊕ ... ⊕ Vₙ → Vᵢ given by πᵢ((v₁, ..., vₙ)) = vᵢ\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Same ordered component list produces identical output\",\n      \"Same concatenation policy produces identical basis hash\",\n      \"Component order matters for determinism\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject empty component list unless zero object policy declared\",\n    \"Reject components over different fields\",\n    \"Reject output dimension not equal to sum of components\",\n    \"Reject output basis not matching concatenation policy\",\n    \"Reject artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"DirectSum is the finite-dimensional vector space formed by the external direct sum of a finite list of vector spaces over the same field. It combines independent carriers and provides canonical injections and projections for use in block matrices, chain groups, decompositions, biproduct examples, and separability operations.\",\n    \"non_role\": [\n      \"Internal direct sums (these may be a separate contract)\",\n      \"Infinite direct sums or infinite-dimensional spaces\",\n      \"Direct sums of modules over rings (only vector spaces over fields)\",\n      \"Policy decisions or authority conferral\"\n    ]\n  },\n  \"wip\": [\n    \"Decide whether internal direct sums are a separate contract\",\n    \"Define zero-dimensional direct-sum behavior\",\n    \"Should we support infinite direct sums in a future version?\",\n    \"Policy for component reordering and its effect on basis ordering\",\n    \"Contract migrated from markdown to YAML format 2026-05-25\",\n    \"Component ordering matters for basis concatenation and determinism\",\n    \"Canonical injections and projections are structurally enforced\",\n    \"Zero object behavior needs explicit policy declaration\"\n  ]\n}\n",
