    "requirements": {
      "required_structures": [
        "Input vector family must be non-empty",
        "All input vectors must share same basis ID",
        "All input vectors must have dimension = basis.dimension()",
        "Input vectors must be linearly independent (no zero pivots)",
        "All output vector pairs must have exact zero dot product",
        "All output vectors must be nonzero",
        "Each u_i = v_i - sum_{j < i} c_{ij} u_j must hold exactly"
      ]
    },
    "laws": [
      "<u_i, u_j> = 0 for all i ≠ j (exact zero)",
      "u_i ≠ 0 for all i (detects linear dependence)",
      "span{u_1, ..., u_i} = span{v_1, ..., v_i} for all i",
      "u_i = v_i - sum_{j < i} c_{ij} u_j (diagonal = 1)",
      "output count = input count",
      "All computations over Ratio<BigInt> (no rounding)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "No floating-point arithmetic (exact rationals only)",
        "Input vectors processed in order",
