      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:gram_schmidt:v0.1.0\",\n  \"title\": \"Gram-Schmidt Orthogonalization Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"algorithm\",\n    \"symbol\": \"GS(v_1, ..., v_n) = (u_1, ..., u_n, certificate)\",\n    \"ascii_symbol\": \"gram_schmidt\",\n    \"notation\": \"GS(v_1, ..., v_n) = (u_1, ..., u_n, certificate)\"\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Input vector family must be non-empty\",\n      \"All input vectors must share same basis ID\",\n      \"All input vectors must have dimension = basis.dimension()\",\n      \"Input vectors must be linearly independent (no zero pivots)\",\n      \"All output vector pairs must have exact zero dot product\",\n      \"All output vectors must be nonzero\",\n      \"Each u_i = v_i - sum_{j < i} c_{ij} u_j must hold exactly\"\n    ]\n  },\n  \"laws\": [\n    \"<u_i, u_j> = 0 for all i ≠ j (exact zero)\",\n    \"u_i ≠ 0 for all i (detects linear dependence)\",\n    \"span{u_1, ..., u_i} = span{v_1, ..., v_i} for all i\",\n    \"u_i = v_i - sum_{j < i} c_{ij} u_j (diagonal = 1)\",\n    \"output count = input count\",\n    \"All computations over Ratio<BigInt> (no rounding)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"No floating-point arithmetic (exact rationals only)\",\n      \"Input vectors processed in order\",\n      \"Projection coefficients computed deterministically\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::gram_schmidt\",\n    \"symbols\": [\n      \"gram_schmidt_exact_standard\",\n      \"OrthogonalFamily\",\n      \"GramSchmidtCertificate\",\n      \"OrthogonalityWitness\",\n      \"SpanPreservationWitness\",\n      \"GramSchmidtError\"\n    ],\n    \"required_tests\": [\n      \"rejects_dependent_vectors\",\n      \"rejects_empty_input\",\n      \"rejects_dimension_mismatch\",\n      \"rejects_basis_mismatch_specifically\",\n      \"verify_output_family_fails_on_non_orthogonal\",\n      \"verify_span_preservation_fails_on_corruption\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Two linearly dependent vectors (scalar multiples)\",\n    \"Empty input vector family\",\n    \"Input vector dimension does not match basis\",\n    \"Input vector has different basis ID\",\n    \"Verification detects corrupted zero vector in output\",\n    \"Verification detects non-orthogonal output vectors\",\n    \"Verification detects span preservation failure\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact rational Gram-Schmidt orthogonalization under the standard coordinate dot product. Given a linearly independent family of coordinate vectors over Ratio<BigInt>, produces a pairwise orthogonal family with identical span. Uses exact arithmetic (no floating-point) and verifies orthogonality, nonzero outputs, and span preservation via triangular transformation matrix. Returns orthogonal (not orthonormal) vectors with algebraic certificates.\",\n    \"non_role\": [\n      \"Orthonormalization (normalization is separate operation)\",\n      \"Numerical floating-point stability (exact rational arithmetic only)\",\n      \"Arbitrary Gram matrix inner products (standard dot product only)\",\n      \"Complex or Hermitian Gram-Schmidt (real rationals only)\",\n      \"QR factorization (separate contract)\",\n      \"Rank-revealing pivoting (standard order only)\",\n      \"Modified Gram-Schmidt algorithm (classical algorithm only)\"\n    ]\n  },\n  \"wip\": [\n    \"Should we support modified Gram-Schmidt for better numerical behavior?\",\n    \"How to extend to arbitrary Gram matrix inner products?\",\n    \"Should we support complex/Hermitian Gram-Schmidt?\",\n    \"What is the canonical way to normalize output vectors (separate contract)?\",\n    \"Should we provide QR factorization as separate operation?\",\n    \"Classical Gram-Schmidt only (not modified algorithm)\",\n    \"Standard coordinate dot product only (no arbitrary Gram matrix)\",\n    \"Exact rational arithmetic only (no floating-point)\",\n    \"Orthogonal output (not orthonormal - normalization separate)\",\n    \"No rank-revealing pivoting (standard input order preserved)\",\n    \"Real rationals only (no complex or quaternion support)\",\n    \"Full verification: orthogonality, nonzero, span preservation\",\n    \"Algebraic certificates with projection coefficients\",\n    \"Linear independence detected via zero pivot errors\"\n  ]\n}\n",
