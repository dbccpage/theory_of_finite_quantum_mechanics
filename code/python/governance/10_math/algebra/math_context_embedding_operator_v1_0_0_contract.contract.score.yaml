      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:context_embedding_operator:v1.0.0\",\n  \"title\": \"Context embedding operator class C\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Declared context embedding used for diagnostic exposure.\",\n    \"symbol\": \"C_c = ρ_c\",\n    \"ascii_symbol\": \"ContextEmbedding\",\n    \"operator_class_symbol\": \"C\",\n    \"1. Contract metadata\": {\n      \"title\": \"Context embedding operator class C\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"operator_class\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Declared context embedding used for diagnostic exposure.\",\n      \"purpose\": \"Exposes congruence failures under a declared context; it is not repair.\",\n      \"non_role\": [\n        \"Does not perform exact repair.\",\n        \"Does not prove source equivalence.\",\n        \"Does not automatically authorize a lift.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"source carrier, cochain object, quotient object, or layer object under declared embedding level\",\n      \"codomain\": \"declared target/context carrier, cochain object, quotient object, or layer object\",\n      \"embedding_level\": {\n        \"allowed\": [\n          \"carrier\",\n          \"cochain\",\n          \"quotient\",\n          \"layer\"\n        ]\n      }\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"context c\",\n        \"embedding map ρ_c\",\n        \"source carrier or source layer\",\n        \"target/context carrier or target layer\",\n        \"embedding level\",\n        \"declared possible effect on Φ₁ and Γ₂\"\n      ],\n      \"optional\": [\n        \"witness pair x,y with x~y in source\",\n        \"context congruence-failure witness\",\n        \"target equivalence relation\"\n      ]\n    },\n    \"5. Definition\": {\n      \"action\": \"C_c(x) = ρ_c(x)\",\n      \"exposure\": \"C exposes congruence failure when x ~ y in source but ρ_c(x) and ρ_c(y) are not equivalent in context.\",\n      \"diagnostic_role\": \"The purpose of C is to test stability of equivalence under context.\"\n    },\n    \"6. Laws and invariants\": {\n      \"declared_context\": \"Context and target carrier/layer must be explicit.\",\n      \"role_priority\": \"C is classified as C by role even if sample Φ₁ is preserved.\",\n      \"not_repair\": \"C is not exact repair; C changes the carrier and must never lower Φ₁ or Γ₂ (Law 8, DDC-C-06).\",\n      \"no_silent_mutation\": \"A context embedding must not silently mutate the source carrier.\",\n      \"target_validity\": \"Any target-side Φ₁ or Γ₂ claim requires target-side structures sufficient to define those functionals.\",\n      \"law_8_non_decrease\": \"If Φ₁ or Γ₂ decreases, the move is not a lawful C; lowering must be priced as D (descent with LossLedger) or Λ (structural lift with license and trigger).\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"operator_equality\": \"Same context id, same source/target carriers, same embedding level, and same embedding map under fixed hashes.\",\n      \"context_id_warning\": \"Same context id alone does not imply same operator.\",\n      \"congruence_failure\": \"Requires replayable source-equivalent pair and target inequivalence witness.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"ρ_c replay.\",\n        \"source carrier/layer hash.\",\n        \"target carrier/layer hash.\",\n        \"embedding-level declaration.\",\n        \"context witness replay if congruence failure is claimed.\",\n        \"target equivalence replay if target inequivalence is claimed.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"priority\": \"Context embeddings come before I in classification priority.\",\n        \"I\": \"C is not I merely because Φ₁ is preserved on a sample.\",\n        \"M\": \"Silent source mutation is M, not C.\",\n        \"Phi1\": \"C changes carrier and must never lower Φ₁ (Law 8). Any reduction requires D or Λ.\",\n        \"Gamma2\": \"C changes carrier and must never lower Γ₂ (Law 8).\",\n        \"Q1\": \"Context may test whether Q¹ equivalence survives embedding.\",\n        \"lift\": \"C may expose a lift requirement if equivalence fails under context, but does not authorize lift by itself.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ContextEmbeddingOperatorDescriptor {\\n    pub context_id: String,\\n    pub operator_class_symbol: OperatorClassSymbol, // C\\n    pub embedding_level: EmbeddingLevel,\\n    pub source_carrier_hash: String,\\n    pub target_carrier_hash: String,\\n    pub source_layer_hash: Option<String>,\\n    pub target_layer_hash: Option<String>,\\n    pub embedding_hash: String,\\n    pub effect_declaration_hash: Option<String>,\\n    pub target_equivalence_hash: Option<String>,\\n}\\n\\npub enum EmbeddingLevel {\\n    Carrier,\\n    Cochain,\\n    Quotient,\\n    Layer,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"C classified as I because sample Φ₁ is preserved.\",\n        \"Context carrier missing.\",\n        \"Context embedding mutates source silently.\",\n        \"Context exposure lowering Φ₁ or Γ₂ (violates Law 8; ContextExposureLoweredObstruction).\",\n        \"Same context id treated as same operator despite different embedding hash.\",\n        \"Target Γ₂ claimed without target C²/d₁.\",\n        \"Congruence failure claimed without replayable x,y,context witness.\",\n        \"Context embedding treated as repair.\",\n        \"Context embedding treated as automatic lift authorization.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Context witness schema.\",\n        \"Lift handoff descriptor.\",\n        \"Target equivalence witness schema.\",\n        \"Embedding-level normalization policy.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"CONTEXT_EMBEDDING_OPERATOR_CONTRACT\": {\n        \"symbol\": \"C_c=ρ_c\",\n        \"ascii_symbol\": \"ContextEmbedding\",\n        \"operator_class_symbol\": \"C\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"source carrier/cochain/quotient/layer\",\n        \"codomain\": \"context carrier/cochain/quotient/layer\",\n        \"required_structures\": [\n          \"context c\",\n          \"ρ_c\",\n          \"source carrier or layer\",\n          \"target carrier or layer\",\n          \"embedding level\",\n          \"effect declaration\"\n        ],\n        \"definition\": \"declared context embedding for diagnostic exposure\",\n        \"laws\": [\n          \"classified as C by role\",\n          \"not repair\",\n          \"changes carrier\",\n          \"never lowers Φ₁ or Γ₂ (Law 8)\",\n          \"must not silently mutate source\"\n        ],\n        \"forbidden_interpretations\": [\n          \"I because sample mass preserved\",\n          \"silent source mutation\",\n          \"repair\",\n          \"automatic lift authorization\",\n          \"lowering obstruction under C without priced move D or Λ\",\n          \"same context id implies same operator\"\n        ],\n        \"relationships\": [\n          \"before I in priority\",\n          \"may expose lift requirement\",\n          \"silent mutation is M\",\n          \"target Γ₂ requires target C²/d₁\"\n        ],\n        \"negative_tests\": [\n          \"mislabeled as I\",\n          \"missing context carrier\",\n          \"silent source mutation\",\n          \"lowering Φ₁ or Γ₂ under C\",\n          \"target Γ₂ without target degree-2 structure\",\n          \"congruence failure without witness\"\n        ],\n        \"open_questions\": [\n          \"context witness schema\",\n          \"lift handoff descriptor\",\n          \"target equivalence witness schema\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
