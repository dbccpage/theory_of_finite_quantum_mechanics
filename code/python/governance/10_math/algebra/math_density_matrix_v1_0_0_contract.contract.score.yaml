      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:density_matrix:v1.0.0\",\n  \"title\": \"Density Matrix Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"operator\",\n    \"symbol\": \"ρ ∈ D(ℋ), where D(ℋ) is the space of density operators on ℋ ≅ ℂ^n\",\n    \"ascii_symbol\": \"density_matrix\",\n    \"notation\": \"ρ ∈ D(ℋ), where D(ℋ) is the space of density operators on ℋ ≅ ℂ^n\",\n    \"domain\": [\n      \"dimension: positive integer n ≥ 1\",\n      \"matrix: complex n×n matrix (nalgebra::DMatrix<Complex<f64>>)\",\n      \"validation_report: trace, Hermitian defect, minimum eigenvalue, config\"\n    ],\n    \"codomain\": {\n      \"description\": \"A complex square matrix ρ ∈ ℂ^(n×n) satisfying: (1) trace(ρ) = 1 (2) ρ† = ρ (Hermitian) (3) ρ ≥ 0 (positive semidefinite: all eigenvalues ≥ 0)\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The trace of the density matrix equals 1 within trace_tol\",\n      \"Matrix equals its conjugate transpose within hermitian_tol\",\n      \"All eigenvalues are non-negative (≥ -psd_tol)\",\n      \"All matrix entries are finite (no NaN, no infinity)\",\n      \"Matrix dimension n ≥ 1\",\n      \"All tolerance values are positive and finite\",\n      \"psd_tol ≥ hermitian_tol (positive semidefinite check must be at least as loose as Hermitian check)\",\n      \"Purity Tr(ρ²) satisfies 1/n ≤ purity ≤ 1\",\n      \"Kraus operators satisfy ∑ᵢ Kᵢ† Kᵢ = I (trace preservation)\",\n      \"Bloch vector satisfies |r| ≤ 1 for qubit states\"\n    ]\n  },\n  \"laws\": [\n    \"trace(ρ) = 1\",\n    \"ρ† = ρ (conjugate transpose equals self)\",\n    \"⟨ψ|ρ|ψ⟩ ≥ 0 for all |ψ⟩ ∈ ℋ (equivalently: all eigenvalues ≥ 0)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Eigenvalue computation uses deterministic nalgebra symmetric_eigen\",\n      \"Floating-point operations follow IEEE 754 determinism\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::density\",\n    \"symbols\": [\n      \"DensityMatrixCandidate\",\n      \"NumericalDensityMatrix\",\n      \"DensityMatrixConfig\",\n      \"DensityMatrixValidationReport\",\n      \"DensityMatrixError\"\n    ],\n    \"required_tests\": [\n      \"rejects_zero_dimension\",\n      \"rejects_trace_not_one\",\n      \"rejects_non_hermitian_matrix\",\n      \"rejects_non_psd_matrix\",\n      \"rejects_nan_in_raw_data\",\n      \"rejects_shape_mismatch_in_raw\",\n      \"rejects_negative_probability_in_diagonal\",\n      \"rejects_bloch_vector_outside_sphere\",\n      \"rejects_bloch_with_nan\",\n      \"get_rejects_out_of_bounds\",\n      \"partial_trace_rejects_dimension_mismatch\",\n      \"mixture_rejects_negative_weight\",\n      \"mixture_rejects_weight_sum_not_one\",\n      \"config_try_new_rejects_negative_tolerance\",\n      \"config_try_new_rejects_nan_tolerance\",\n      \"config_try_new_rejects_psd_smaller_than_hermitian\",\n      \"amplitudes_rejects_unnormalized_state\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Construction with dimension=0 must fail\",\n    \"Matrix with trace != 1 must fail validation\",\n    \"Matrix with ρ != ρ† must fail validation\",\n    \"Matrix with negative eigenvalues must fail validation\",\n    \"NaN entries must be rejected immediately\",\n    \"Data length != dimension² must fail\",\n    \"Negative diagonal probabilities must fail\",\n    \"Bloch vector with |r| > 1 must fail\",\n    \"NaN in Bloch vector must fail\",\n    \"Access beyond dimension must fail\",\n    \"Incorrect subsystem dimensions must fail\",\n    \"Negative mixture weights must fail\",\n    \"Mixture weights not summing to 1 must fail\",\n    \"Negative tolerance values must fail\",\n    \"NaN tolerance values must fail\",\n    \"psd_tol < hermitian_tol must fail consistency check\",\n    \"State vector with ||ψ|| != 1 must fail\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"This contract specifies the mathematical structure and validation requirements for quantum density matrices. A density matrix is a positive semidefinite, Hermitian operator with trace one that represents the quantum state of a system. This contract covers both pure states (rank-1 projectors) and mixed states (convex combinations of pure states).\\nThe contract enforces physical consistency through configurable numerical tolerances for trace, Hermiticity, and positive semidefiniteness checks. All operations are deterministic and replay-compatible.\\nDensity matrices are fundamental to quantum information theory, quantum computing, and statistical quantum mechanics. They enable representation of both pure and mixed states, partial trace operations for subsystems, quantum channels via Kraus operators, and entropy calculations.\",\n    \"non_role\": [\n      \"Symbolic manipulation of density matrices\",\n      \"Exact rational or algebraic number representation\",\n      \"Infinite-dimensional Hilbert spaces\",\n      \"Real-time quantum dynamics simulation\",\n      \"Quantum circuit compilation or optimization\",\n      \"Automatic differentiation or gradient computation\",\n      \"GPU or distributed computation backends\"\n    ]\n  },\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced as obligations; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"STAGE1_MECHANICAL_PASS\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Mechanical GTLA field gates passed (authority/math/non_role/structures/laws-or-requirements/negative_tests). Not PROVED.\",\n        \"recommendation\": \"Repair under meth-level math re-review (ADR-007); not GlobalGreen.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"REALIZATION_CORE_MATCH\",\n        \"severity\": \"low\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"Dedicated realization at omega_linear_algebra/src/linear_algebra/density.rs. Symbols DensityMatrixCandidate, NumericalDensityMatrix, DensityMatrixConfig, DensityMatrixValidationReport, DensityMatrixError present. Candidate/validate enforces dim>=1, shape, NaN refuse, trace_tol, hermitian_tol, psd_tol; purity, partial_trace, bloch, kraus ops exist with matching negative tests. Binding module string \\\"density\\\" is shorthand vs disk path linear_algebra::density. Core physical laws MATCH under numerical tolerances (ShapeOnly). Not PROVED / not GlobalGreen.\\n\",\n        \"recommendation\": \"Optional: set rust_binding.module to linear_algebra::density for path honesty.\\n\",\n        \"file\": \"omega_engine/crates/omega_linear_algebra/src/linear_algebra/density.rs\",\n        \"yaml_law\": \"trace(rho)=1; rho dagger=rho; PSD eigenvalues; dim>=1; finite entries; tol consistency; purity/Kraus/Bloch requirements listed.\\n\",\n        \"code_behavior\": \"Numerical validation path implements listed structural checks with tolerances; purity/bloch/kraus helpers present; ZeroDimension refused.\\n\",\n        \"delta\": \"MATCH\"\n      }\n    ]\n  }\n}\n",
