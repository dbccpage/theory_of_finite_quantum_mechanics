      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:rank:v0.1.0\",\n  \"title\": \"Rank\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"linear_map_invariant\",\n    \"symbol\": \"rank(A) = r, where A: F^m → F^n, r = dim(im(A))\",\n    \"ascii_symbol\": \"rank\",\n    \"notation\": \"rank(A) = r, where A: F^m → F^n, r = dim(im(A))\",\n    \"domain\": [\n      \"matrix_hash: Blake3 hash of canonical matrix bytes\",\n      \"coefficient_domain_id: Identifier for coefficient domain (field/ring)\",\n      \"coefficient_domain_hash: Hash of coefficient domain specification\"\n    ],\n    \"codomain\": {\n      \"description\": \"Non-negative integer measuring image dimension\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Matrix must have valid row and column counts\",\n      \"Coefficient domain must be supported and properly specified\",\n      \"Algorithm reference must identify a deterministic rank algorithm\",\n      \"Rank must satisfy 0 ≤ rank ≤ min(row_count, column_count)\",\n      \"All hash fields must be consistent with their source data\",\n      \"Row reduction witness must be consistent with rank value\"\n    ]\n  },\n  \"laws\": [\n    \"0 ≤ rank(A) ≤ min(m, n) for A ∈ Mat_{m×n}(F)\",\n    \"Rank computation must be deterministic and reproducible\",\n    \"rank(A) + nullity(A) = n for A: F^n → F^m\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Re-running declared rank algorithm over same canonical matrix bytes must reproduce same rank_value_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject rank greater than min(row_count, column_count)\",\n    \"Reject unsupported coefficient domain\",\n    \"Reject pivot witness inconsistent with normal form\",\n    \"Reject rank hash mismatch\",\n    \"Reject artifact claiming authority or admissibility\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Rank records the deterministic rank of a finite matrix or linear map over a declared coefficient domain. It measures image dimension and supports kernel/image/cokernel computations, exactness checks, dimension formulas, finite obstruction complexes, and linear independence tests.\",\n    \"non_role\": [\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates\",\n      \"Does not terminalize\",\n      \"Does not produce customer-facing claims\"\n    ]\n  },\n  \"wip\": [\n    \"Define separate numerical rank contract with tolerance ledger\",\n    \"Decide module rank behavior over non-field rings\",\n    \"Current implementation assumes field coefficient domain\",\n    \"Numerical rank with tolerance requires separate contract\",\n    \"Module rank over non-field rings may need different validation\"\n  ]\n}\n",
