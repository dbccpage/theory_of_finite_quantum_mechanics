      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_field_law_checks:v0.1.0\",\n  \"title\": \"Exact Field Law Checks Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_sample_law_replay\",\n    \"symbol\": \"check(laws, S) for a finite sample S ⊂ F of the field, involution and order obligations\",\n    \"ascii_symbol\": \"exact_field_law_checks\",\n    \"notation\": \"S : &[F], F : Field + ExactRing (+ Involution, OrderedExactField, HermitianOrdered)\",\n    \"domain\": [\n      \"sample: a finite slice of scalar values\",\n      \"trait obligations: the field axioms, the four involution axioms, the order axioms, the Hermitian-order axioms\"\n    ],\n    \"codomain\": {\n      \"description\": \"Ok when every law holds on the sample, otherwise LawViolated naming the first violated law in a documented check order. A failing check proves the implementation breaks that law; a passing check is evidence on the sample only.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"check_field_axioms runs three passes (single elements, pairs, triples) so a missing inverse is reported before a derived division failure\",\n      \"check_involution_axioms checks in this order: additive, multiplicative, fixes 1, order at most two\",\n      \"check_ordered_axioms checks in this order: sign in {-1, 0, 1}, zero exactly for zero, negation, positive sums, positive products\",\n      \"check_hermitian_ordered_axioms checks that fixed_field_sign is None exactly for non-fixed elements, that signs are valid, the negation and closure laws on the fixed elements, and that every norm x · conj x has sign >= 0 and 0 only for zero\",\n      \"Cost is cubic in the sample size; samples are expected to have a few dozen elements\"\n    ]\n  },\n  \"laws\": [\n    \"a failing check names a law that the implementation provably violates on the sample\",\n    \"BigRational, GF(p), a Gaussian rational field and a real quadratic field satisfy the obligations they claim on the shipped test samples\",\n    \"a ring with zero divisors claiming to be a field, a conjugation that is not a ring homomorphism, a signum that is out of range or inconsistent with is_zero, and a fixed-field sign that is None for a fixed element are each detected\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"The check order is fixed, so the reported law is deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_field::laws\",\n    \"symbols\": [\n      \"check_field_axioms\",\n      \"check_involution_axioms\",\n      \"check_ordered_axioms\",\n      \"check_hermitian_ordered_axioms\"\n    ],\n    \"required_tests\": [\n      \"a_ring_with_zero_divisors_fails_the_field_axioms\",\n      \"a_wrong_inverse_is_caught_and_named\",\n      \"a_defective_involution_is_caught_and_named\",\n      \"a_defective_order_is_caught_and_named\",\n      \"a_defective_hermitian_sign_is_caught_and_named\",\n      \"a_negative_norm_violates_the_hermitian_order_obligations\"\n    ]\n  },\n  \"negative_tests\": [\n    \"a sample containing a ring with zero divisors used as a field must be reported as violating the inverse law\",\n    \"a try_inv that answers Some(x) with x · x != 1 must be reported as violating the inverse law\",\n    \"a conjugation that is not additive, not multiplicative or does not fix 1 must be reported with that law\",\n    \"a signum out of range, inconsistent with is_zero, or violating the negation law must be reported with that law\",\n    \"a fixed-field sign that is None for a fixed element or out of range must be reported with that law\",\n    \"a field with a Galois involution whose norm is negative must be reported as violating the norm law\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The scalar traits state obligations the compiler cannot check. These functions replay them on a finite sample and name the first law that fails, so a crate that implements Field, Involution, OrderedExactField or HermitianOrdered for a new exact type can put one line in its tests. They are evidence, not proof.\",\n    \"non_role\": [\n      \"A proof that an implementation satisfies the axioms\",\n      \"Exhaustive checking of an infinite field\",\n      \"Checks of the analytic (floating-point) tier\"\n    ]\n  },\n  \"wip\": [\n    \"No Lean statement of the field, involution or order axioms exists; the YAML to Lean to Rust chain for this contract is open\",\n    \"The samples used by the shipped tests are hand-chosen; there is no generator that draws from every component of a cyclotomic field\",\n    \"Associativity and distributivity are checked on triples only, so a sample of size N costs O(N³) scalar operations\"\n  ]\n}\n",
      "record": {
