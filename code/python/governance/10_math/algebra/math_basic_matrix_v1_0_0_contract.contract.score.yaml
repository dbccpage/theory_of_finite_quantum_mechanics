      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:basic_matrix:v1.0.0\",\n  \"title\": \"Basic Matrix Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_rectangular_matrix\",\n    \"symbol\": \"A ∈ K^{m×n}\",\n    \"ascii_symbol\": \"basic_matrix\",\n    \"notation\": \"A ∈ K^{m×n}\",\n    \"domain\": [\n      \"rows: finite_index_set\",\n      \"cols: finite_index_set\",\n      \"entries: scalar_domain\"\n    ],\n    \"codomain\": {\n      \"description\": \"A finite rectangular array with fixed shape (rows, cols) and entries from a scalar domain (typically a field).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"rows and cols are finite natural numbers (rows, cols > 0)\",\n      \"every access must satisfy 0 <= i < rows and 0 <= j < cols\",\n      \"stored data length must equal rows * cols\",\n      \"same matrix, row, and col always resolve to the same entry\",\n      \"operations may not silently change shape\"\n    ]\n  },\n  \"laws\": [\n    \"rows and cols are finite natural numbers (rows, cols > 0)\",\n    \"every access must satisfy 0 <= i < rows and 0 <= j < cols\",\n    \"stored data length must equal rows * cols\",\n    \"same matrix, row, and col always resolve to the same entry\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All serializations are fixed byte arrays\",\n      \"Operation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"backend::basic_matrix\",\n    \"symbols\": [\n      \"BasicMatrix\",\n      \"MatrixError\"\n    ],\n    \"required_tests\": [\n      \"test_from_row_major_mismatch\",\n      \"test_out_of_bounds\",\n      \"test_add_sub_mismatch\",\n      \"test_mul_dimension_mismatch\",\n      \"test_shape_preserved\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Matrix with rows=0 must be rejected\",\n    \"Matrix with cols=0 must be rejected\",\n    \"Data length not equal to rows*cols must be rejected\",\n    \"Accessing index >= rows or >= cols must fail\",\n    \"Matmul with lhs_cols != rhs_rows must be rejected\",\n    \"Add with different shapes must be rejected\",\n    \"Operations on matrices from different fields must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Defines the canonical finite rectangular matrix representation used by linear algebra, cochain complexes, incidence maps, solvers, and validators. A BasicMatrix is a finite rectangular array of scalars over a declared field, with well-defined shape (rows × cols), deterministic indexing, and shape- preserving operations. This contract is purely structural and does not confer authority.\",\n    \"non_role\": [\n      \"Symbolic tensor algebra (deferred to symbolic computation contract)\",\n      \"Infinite-dimensional operators (out of scope)\",\n      \"Implicit shape coercion (always rejected)\",\n      \"Unchecked floating-point authority (requires explicit policy)\",\n      \"Sparse matrix optimization (separate sparse_matrix contract)\"\n    ]\n  }\n}\n",
