      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:complex_matrix:v1.0.0\",\n  \"title\": \"Complex Matrix Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_rectangular_complex_matrix\",\n    \"symbol\": \"A ∈ C^{m×n}\",\n    \"ascii_symbol\": \"complex_matrix\",\n    \"notation\": \"A ∈ C^{m×n}\",\n    \"domain\": [\n      \"rows: finite_index_set\",\n      \"cols: finite_index_set\",\n      \"entries: complex_field_C\"\n    ],\n    \"codomain\": {\n      \"description\": \"A finite rectangular array with fixed shape (rows, cols) and entries from the complex field C. Each entry z = a + bi where a, b are finite real numbers.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"rows and cols are finite natural numbers (rows, cols > 0)\",\n      \"all entries z = a + bi have finite a and b (no NaN, no Inf)\",\n      \"every access must satisfy 0 <= i < rows and 0 <= j < cols\",\n      \"stored data length must equal rows * cols\",\n      \"same matrix, row, and col always resolve to the same entry\",\n      \"A** = A (adjoint applied twice returns original matrix)\",\n      \"operations may not silently change shape\"\n    ]\n  },\n  \"laws\": [\n    \"rows and cols are finite natural numbers (rows, cols > 0)\",\n    \"all entries z = a + bi have finite a and b (no NaN, no Inf)\",\n    \"every access must satisfy 0 <= i < rows and 0 <= j < cols\",\n    \"stored data length must equal rows * cols\",\n    \"same matrix, row, and col always resolve to the same entry\",\n    \"A** = A (adjoint applied twice returns original matrix)\",\n    \"(αA + βB)* = ᾱA* + β̄B* (adjoint is conjugate-linear)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All serializations are fixed byte arrays\",\n      \"Operation functions are content-addressed\",\n      \"Complex number operations are IEEE 754 deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::complex_matrix\",\n    \"symbols\": [\n      \"ComplexMatrix\",\n      \"ComplexMatrixError\",\n      \"C64\",\n      \"CMatrix\",\n      \"CVector\"\n    ],\n    \"required_tests\": [\n      \"from_row_major_rejects_length_mismatch\",\n      \"from_row_major_rejects_nan_real_part\",\n      \"from_row_major_rejects_nan_imag_part\",\n      \"from_row_major_rejects_infinite_entry\",\n      \"from_row_major_rejects_infinite_imag_part\",\n      \"scale_real_rejects_nan_scalar\",\n      \"get_rejects_out_of_bounds\",\n      \"set_rejects_out_of_bounds\",\n      \"set_rejects_non_finite_value\",\n      \"mul_rejects_dimension_mismatch\",\n      \"add_rejects_shape_mismatch\",\n      \"sub_rejects_shape_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Matrix with rows=0 must be rejected\",\n    \"Matrix with cols=0 must be rejected\",\n    \"Data length not equal to rows*cols must be rejected\",\n    \"Entry with NaN real part must be rejected\",\n    \"Entry with NaN imaginary part must be rejected\",\n    \"Entry with Inf real part must be rejected\",\n    \"Entry with Inf imaginary part must be rejected\",\n    \"scale_real with NaN or Inf scalar must be rejected\",\n    \"Accessing index >= rows or >= cols must fail\",\n    \"Setting index >= rows or >= cols must fail\",\n    \"Setting nonfinite value must be rejected\",\n    \"Matmul with lhs_cols != rhs_rows must be rejected\",\n    \"Add with different shapes must be rejected\",\n    \"Sub with different shapes must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Defines rectangular matrices over the complex field C with complex number operations, Hermitian adjoints (conjugate transpose), and complex-specific matrix operations. ComplexMatrix extends BasicMatrix semantics to the complex domain, adding conjugation, adjoint operations, and Hermitian properties. All entries are validated for finiteness (no NaN or Inf in real or imaginary parts). This contract is purely structural and does not confer authority.\",\n    \"non_role\": [\n      \"Infinite-dimensional operators (out of scope)\",\n      \"Sparse matrix optimization (separate sparse_complex_matrix contract)\",\n      \"Symbolic complex algebra (deferred to symbolic computation contract)\",\n      \"Implicit shape coercion (always rejected)\",\n      \"Unchecked complex infinity (NaN, Inf always rejected)\"\n    ]\n  }\n}\n",
