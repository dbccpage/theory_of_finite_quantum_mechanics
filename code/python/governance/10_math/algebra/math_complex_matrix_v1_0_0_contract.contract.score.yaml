      "module": "linear_algebra::complex_matrix",
      "symbols": [
        "ComplexMatrix",
        "ComplexMatrixError",
        "C64",
        "CMatrix",
        "CVector"
      ],
      "required_tests": [
        "from_row_major_rejects_length_mismatch",
        "from_row_major_rejects_nan_real_part",
        "from_row_major_rejects_nan_imag_part",
        "from_row_major_rejects_infinite_entry",
        "from_row_major_rejects_infinite_imag_part",
        "scale_real_rejects_nan_scalar",
        "get_rejects_out_of_bounds",
        "set_rejects_out_of_bounds",
        "set_rejects_non_finite_value",
        "mul_rejects_dimension_mismatch",
        "add_rejects_shape_mismatch",
        "sub_rejects_shape_mismatch"
      ]
    },
    "negative_tests": [
      "Matrix with rows=0 must be rejected",
      "Matrix with cols=0 must be rejected",
      "Data length not equal to rows*cols must be rejected",
      "Entry with NaN real part must be rejected",
      "Entry with NaN imaginary part must be rejected",
      "Entry with Inf real part must be rejected",
      "Entry with Inf imaginary part must be rejected",
      "scale_real with NaN or Inf scalar must be rejected",
      "Accessing index >= rows or >= cols must fail",
      "Setting index >= rows or >= cols must fail",
      "Setting nonfinite value must be rejected",
      "Matmul with lhs_cols != rhs_rows must be rejected",
      "Add with different shapes must be rejected",
      "Sub with different shapes must be rejected"
    ],
    "doctrine": {
      "summary": "Defines rectangular matrices over the complex field C with complex number operations, Hermitian adjoints (conjugate transpose), and complex-specific matrix operations. ComplexMatrix extends BasicMatrix semantics to the complex domain, adding conjugation, adjoint operations, and Hermitian properties. All entries are validated for finiteness (no NaN or Inf in real or imaginary parts). This contract is purely structural and does not confer authority.",
      "non_role": [
        "Infinite-dimensional operators (out of scope)",
        "Sparse matrix optimization (separate sparse_complex_matrix contract)",
        "Symbolic complex algebra (deferred to symbolic computation contract)",
        "Implicit shape coercion (always rejected)",
        "Unchecked complex infinity (NaN, Inf always rejected)"
      ]
    }
  },
