        "code/python/governance/10_math/algebra/math_ordered_field_ldlt_v0_1_0.contract.yaml"
      ],
      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:ordered_field_ldlt:v0.1.0\",\n  \"title\": \"Ordered-Field Inertia and LDLT Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quadratic_form_invariant\",\n    \"symbol\": \"inertia(A) = (p, n, z) and A = L D L* (L* = Lᵀ or L†) over an ordered field\",\n    \"ascii_symbol\": \"ordered_field_ldlt\",\n    \"notation\": \"A = Aᵀ over F : OrderedExactField, or A = A† over F : HermitianOrdered\",\n    \"domain\": [\n      \"field: F implementing OrderedExactField (a total order compatible with the field operations) or HermitianOrdered (an involution whose fixed field is ordered and whose norms are nonnegative)\",\n      \"matrix: square symmetric (Hermitian) BasicMatrix<F>\",\n      \"budgets: OperationLimits { max_elements, max_scalar_ops }\"\n    ],\n    \"codomain\": {\n      \"description\": \"The inertia (positive, negative, zero diagonal counts of a congruence diagonalisation) with exact definiteness decisions, the quadratic and Hermitian forms, and the pivoting-free LDLᵀ factorisation (and, for Hermitian matrices, the L D L† factorisation) whose early stop carries a witness vector v with v* A v < 0.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"OrderedExactField::signum returns -1, 0 or 1, is 0 exactly for zero, satisfies signum(−x) = −signum(x), and the positive elements are closed under + and ·; an implementor must prove this and BigRational implements it\",\n      \"HermitianOrdered::fixed_field_sign is None exactly for elements not fixed by the involution, is an order sign on the fixed field, and every norm x · conj x has sign >= 0 and 0 only for x = 0\",\n      \"The algorithms refuse a signum or fixed_field_sign that returns a value outside {-1, 0, 1}, is zero for a nonzero element, or is None for a diagonal entry, as ScalarContract\",\n      \"Input must be symmetric (Hermitian for the Hermitian routines); the first offending position is reported\",\n      \"LDLᵀ accepts a zero pivot only when its whole Schur column is zero, stops at a negative pivot or at a zero pivot with a nonzero column, and leaves L with identity columns and D with zeros from the stopping step on\",\n      \"The witness of a NegativePivot at step j is (L*)⁻¹ e_j and has v* A v = pivot; the witness of ZeroPivotWithNonzeroColumn is (L*)⁻¹ (x e_j + e_i) with x = −(S_ii + 1)/(2 S_ij) and has v* A v = −1 (S is the Schur complement); here v* A v is vᵀ A v for ldlt and v† A v for hermitian_ldl\",\n      \"hermitian_ldl uses the recurrences D[j] = A[j][j] − Σ L[j][k] D[k] conj(L[j][k]) and L[i][j] = (A[i][j] − Σ L[i][k] D[k] conj(L[j][k])) / D[j]; its pivots are fixed by the involution and their signs are read with fixed_field_sign\",\n      \"The worst-case cost charged by ldlt is 2n³ + n² scalar calls\"\n    ]\n  },\n  \"laws\": [\n    \"Sylvester: inertia(Sᵀ A S) = inertia(A) for every invertible S (valid over every ordered field, and for Hermitian forms under S† A S)\",\n    \"p + n = rank A and p + n + z = dimension\",\n    \"A is positive semidefinite iff n = 0, and positive definite iff n = 0 and z = 0\",\n    \"for a completed LDLᵀ, A = L D Lᵀ with L unit lower triangular and every pivot >= 0; for a completed Hermitian factorisation A = L D L† with the same shape\",\n    \"the pivoting-free LDLᵀ completes iff A is positive semidefinite (it agrees with the inertia decision)\",\n    \"a stopped LDLᵀ carries a witness v with vᵀ A v < 0, replayable with quadratic_form; a stopped Hermitian factorisation carries v with v† A v of sign −1, replayable with hermitian_form\",\n    \"A is positive definite iff all leading principal minors are positive, and positive semidefinite iff all principal minors are nonnegative\",\n    \"over Q(i), the inertia of a Hermitian matrix is half the inertia of its real symmetric realification [[Re, −Im], [Im, Re]] (replayed by the tests over Q(i); not claimed for other fields)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"The order obligations replay on a finite sample through exact_field::laws::check_ordered_axioms and check_hermitian_ordered_axioms\",\n      \"The pivoting-free LDLᵀ reproduces the pre-existing exact_ldlt::ldlt_decomposition_rational triple (L, D, is_psd) entry for entry, including the partial fill after an early stop, and the congruence decisions agree with exact_ldlt::is_psd_rational\",\n      \"No tolerance: a perturbation of size 10⁻³⁰ is decided\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_field::ordered\",\n    \"symbols\": [\n      \"OrderedExactField\",\n      \"HermitianOrdered\",\n      \"Inertia\",\n      \"Ldlt\",\n      \"LdltOutcome\",\n      \"inertia\",\n      \"hermitian_inertia\",\n      \"is_positive_semidefinite\",\n      \"is_positive_definite\",\n      \"hermitian_is_positive_semidefinite\",\n      \"hermitian_is_positive_definite\",\n      \"quadratic_form\",\n      \"hermitian_form\",\n      \"ldlt\",\n      \"hermitian_ldl\"\n    ],\n    \"required_tests\": [\n      \"asymmetric_non_square_and_non_hermitian_inputs_are_refused\",\n      \"a_lying_signum_is_a_typed_error\",\n      \"a_lying_fixed_field_sign_is_a_typed_error\",\n      \"ldlt_reports_a_negative_pivot_with_a_witness\",\n      \"ldlt_reports_a_zero_pivot_with_a_nonzero_column_and_a_lifted_witness\",\n      \"hermitian_ldl_witness_for_an_imaginary_off_diagonal_entry\",\n      \"hermitian_ldl_refuses_non_hermitian_input_and_respects_the_budget\",\n      \"a_perturbation_far_below_any_tolerance_is_decided_exactly\",\n      \"ldlt_budget_boundary_is_inclusive\"\n    ]\n  },\n  \"negative_tests\": [\n    \"a matrix that is not symmetric must be refused as NotSymmetric, one that is not Hermitian as NotHermitian, and a non-square matrix as NotSquare\",\n    \"a scalar whose signum returns a value outside {-1, 0, 1} or zero for a nonzero element must be refused as ScalarContract\",\n    \"a scalar whose fixed_field_sign is None for a diagonal entry or outside {-1, 0, 1} must be refused as ScalarContract\",\n    \"a matrix that is not positive semidefinite must make ldlt (and hermitian_ldl) stop with a witness v whose form is negative, for a negative pivot and for a zero pivot with a nonzero Schur column, including a zero pivot whose Schur entry is purely imaginary\",\n    \"hermitian_ldl of a matrix that is not Hermitian must be refused as NotHermitian\",\n    \"a perturbation below any floating-point tolerance must still be decided exactly\",\n    \"an operation whose documented worst-case bound exceeds the budget must be refused before any scalar work, and a bound equal to the limit must be accepted\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact inertia, definiteness and LDLᵀ over any ordered field, and Hermitian inertia over any field with an involution whose fixed field is ordered. The signature is read from a congruence diagonalisation, so it is complete (it handles zero diagonal entries) and valid over Q, real quadratic fields and real cyclotomic subfields, and over Q(i) and cyclotomic fields for Hermitian forms. The pivoting-free LDLᵀ and its Hermitian form L D L† (no realification, so the dimension is not doubled) are the certificate-bearing route: when they stop they return a vector that proves the matrix indefinite.\",\n    \"non_role\": [\n      \"Numerical definiteness with tolerances\",\n      \"Eigenvalues, spectral decomposition or exact real-algebraic roots\",\n      \"Cholesky of nearly singular floating-point matrices\",\n      \"Fields whose involution can produce negative norms, where no signature exists\"\n    ]\n  },\n  \"wip\": [\n    \"No Lean statement of Sylvester's law exists; the YAML to Lean to Rust chain for this contract is open\",\n    \"The pre-existing exact_ldlt module (BigRational only, String errors, rejects the empty matrix) remains alongside this one; it is cross-validated but not yet rebuilt on top of it\",\n    \"OrderedExactField and HermitianOrdered are implemented in this crate for BigRational only; the real quadratic, Gaussian rational and cyclotomic implementations belong to the number-theory crate\",\n    \"The ldlt witness is exact but not minimal; no witness of minimal support is computed\",\n    \"Positive definiteness of a matrix over a field whose order is given only by an enclosure (interval) is not supported; a sign must be exact\"\n  ]\n}\n",
      "record": {
