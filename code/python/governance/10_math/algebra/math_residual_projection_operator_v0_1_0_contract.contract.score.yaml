      "Projection operator artifact claiming authority must be rejected",
      "Projection operator artifact claiming admissibility must be rejected"
    ],
    "doctrine": {
      "summary": "A ResidualProjectionOperator P: M -> M is an idempotent linear map (P^2 = P) that decomposes a module M into resolved and residual components: M = ker(P) + im(P), where ker(P) is the resolved subspace and im(P) is the residual subspace. Given a morphism f: A -> M, the resolved subspace is im(f) and the residual projection P extracts the component of any element that lies outside im(f). This is the algebraic mechanism for isolating what remains unresolved after a computation step.",
      "non_role": [
        "Choosing which complement to project onto (that is a regime decision)",
        "Policy on projection method selection",
        "Authority over projection correctness beyond algebraic verification",
        "Customer-facing claims about projection quality"
      ]
    },
