      "domain": [
        "ambient_module: M (the module being decomposed)",
        "resolved_submodule: N = ker(P) (resolved component)",
        "residual_submodule: R = im(P) (residual component)",
        "projection_map: P: M -> M (idempotent endomorphism)",
        "complement_map: Id - P: M -> M (resolved projection)"
      ],
      "codomain": {
        "description": "An idempotent linear map P: M -> M together with the resolved submodule N = ker(P) and the residual submodule R = im(P).\n"
      }
    },
    "requirements": {
      "required_structures": [
        "P must be verified as a linear map on M",
        "P^2 = P must be verified",
        "ker(P) must equal the declared resolved submodule N",
        "M = ker(P) + im(P) must be a valid direct sum",
        "Matrix representation of P must be content-addressed"
      ]
    },
    "laws": [
      "P is a linear map: P(a*m + b*n) = a*P(m) + b*P(n)",
      "P^2 = P (applying P twice equals applying once)",
      "ker(P) equals the resolved submodule N",
      "M = ker(P) + im(P) as internal direct sum"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Matrix multiplication is deterministic",
