      "Should oblique projections be supported or only orthogonal ones?",
      "Currently assumes finite-dimensional modules",
      "Orthogonal vs oblique projection distinction deferred",
      "Infinite-dimensional projections deferred to future version",
      "Self-adjointness condition (for orthogonal projections) not yet enforced"
