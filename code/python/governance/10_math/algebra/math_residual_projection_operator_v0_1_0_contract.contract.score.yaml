      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:residual_projection_operator:v0.1.0\",\n  \"title\": \"Residual Projection Operator Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"projection_operator\",\n    \"symbol\": \"P: M -> M, P^2 = P, M = ker(P) + im(P)\",\n    \"ascii_symbol\": \"residual_projection_operator\",\n    \"notation\": \"P: M -> M, P^2 = P, M = ker(P) + im(P)\",\n    \"domain\": [\n      \"ambient_module: M (the module being decomposed)\",\n      \"resolved_submodule: N = ker(P) (resolved component)\",\n      \"residual_submodule: R = im(P) (residual component)\",\n      \"projection_map: P: M -> M (idempotent endomorphism)\",\n      \"complement_map: Id - P: M -> M (resolved projection)\"\n    ],\n    \"codomain\": {\n      \"description\": \"An idempotent linear map P: M -> M together with the resolved submodule N = ker(P) and the residual submodule R = im(P).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"P must be verified as a linear map on M\",\n      \"P^2 = P must be verified\",\n      \"ker(P) must equal the declared resolved submodule N\",\n      \"M = ker(P) + im(P) must be a valid direct sum\",\n      \"Matrix representation of P must be content-addressed\"\n    ]\n  },\n  \"laws\": [\n    \"P is a linear map: P(a*m + b*n) = a*P(m) + b*P(n)\",\n    \"P^2 = P (applying P twice equals applying once)\",\n    \"ker(P) equals the resolved submodule N\",\n    \"M = ker(P) + im(P) as internal direct sum\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Matrix multiplication is deterministic\",\n      \"Idempotency check is deterministic\",\n      \"All matrices use canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Operator that is not linear must be rejected\",\n    \"Operator where P^2 != P must be rejected\",\n    \"Operator whose kernel does not equal declared resolved submodule must be rejected\",\n    \"Decomposition where M != ker(P) + im(P) must be rejected\",\n    \"Projection operator artifact claiming authority must be rejected\",\n    \"Projection operator artifact claiming admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A ResidualProjectionOperator P: M -> M is an idempotent linear map (P^2 = P) that decomposes a module M into resolved and residual components: M = ker(P) + im(P), where ker(P) is the resolved subspace and im(P) is the residual subspace. Given a morphism f: A -> M, the resolved subspace is im(f) and the residual projection P extracts the component of any element that lies outside im(f). This is the algebraic mechanism for isolating what remains unresolved after a computation step.\",\n    \"non_role\": [\n      \"Choosing which complement to project onto (that is a regime decision)\",\n      \"Policy on projection method selection\",\n      \"Authority over projection correctness beyond algebraic verification\",\n      \"Customer-facing claims about projection quality\"\n    ]\n  },\n  \"wip\": [\n    \"Should we support orthogonal projections (requiring inner product structure)?\",\n    \"How to handle projections in infinite-dimensional spaces?\",\n    \"Should oblique projections be supported or only orthogonal ones?\",\n    \"Currently assumes finite-dimensional modules\",\n    \"Orthogonal vs oblique projection distinction deferred\",\n    \"Infinite-dimensional projections deferred to future version\",\n    \"Self-adjointness condition (for orthogonal projections) not yet enforced\"\n  ]\n}\n",
