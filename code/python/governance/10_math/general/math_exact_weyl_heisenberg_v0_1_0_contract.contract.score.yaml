and D(a,b)^*=D(-a,-b)\",\n    \"Signed coordinates including i64 MIN/MAX are reduced before multiplication\",\n    \"Displacements are a complete orthogonal operator basis; monomial parity pairing equals the dense exact trace\",\n    \"The characteristic-zero CCR trace obstruction distinguishes nonzero central scalar from zero\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_lie_theory\",\n    \"module\": \"heisenberg\",\n    \"symbols\": [\n      \"WeylHeisenberg\",\n      \"WeylHeisenberg::with_phase_root\",\n      \"WeylHeisenberg::displacement\",\n      \"WeylHeisenberg::product_phase\",\n      \"WeylHeisenberg::displaced_parity\",\n      \"WeylHeisenberg::parity_pairing\",\n      \"WeylHeisenberg::reconstruct_operator\",\n      \"trace_obstruction\",\n      \"stone_von_neumann_census\"\n    ],\n    \"required_tests\": [\n      \"odd_displacements_have_the_correct_dagger_product_and_orthogonality_laws\",\n      \"extreme_coordinates_reduce_before_multiplication\",\n      \"even_dimension_keeps_the_winding_sign_and_dagger_law\",\n      \"weyl_displacements_span_the_full_matrix_algebra\",\n      \"the_displaced_parity_contraction_matches_dense_conjugation_and_trace\",\n      \"ccr_trace_refusal_and_finite_stone_von_neumann_census_are_distinct\"\n    ]\n  },\n  \"negative_tests\": [\n    \"The former negative-half convention fails the tested dagger law\",\n    \"Invalid dimension, nonprimitive roots and missing even-dimensional phase roots are refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"For ZX=omega XZ the symmetric displacement is tau^(ab) X^a Z^b; D(a,b)D(c,e)=tau^(bc-ae)D(a+c,b+e) and D(a,b)^*=D(-a,-b); Signed coordinates including i64 MIN/MAX are reduced before multiplication; Displacements are a complete orthogonal operator basis; monomial parity pairing equals the dense exact trace; The characteristic-zero CCR trace obstruction distinguishes nonzero central scalar from zero.\",\n    \"non_role\": [\n      \"Finite Weyl relations are not finite-dimensional characteristic-zero CCR\",\n      \"No continuum Stone-von Neumann theorem or limit is claimed\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
