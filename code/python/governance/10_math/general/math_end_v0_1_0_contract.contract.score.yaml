      "Must reject when universal property fails"
    ],
    "doctrine": {
      "summary": "An end is a universal dinatural transformation for a bifunctor F: C^op × C → D, written ∫_c F(c,c). Ends generalize limits and equalizers, and compute natural transformation objects and Hom spaces in functor categories.",
