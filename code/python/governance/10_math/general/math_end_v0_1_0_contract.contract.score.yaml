      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:end:v0.1.0\",\n  \"title\": \"End Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"universal_dinatural_transformation\",\n    \"symbol\": \"∫_c F(c,c)\",\n    \"ascii_symbol\": \"end\",\n    \"notation\": \"∫_c F(c,c)\",\n    \"domain\": [\n      \"bifunctor: F: C^op × C → D\",\n      \"end_object: e ∈ D\",\n      \"wedge: dinatural family ω_c: e → F(c,c)\"\n    ],\n    \"codomain\": {\n      \"description\": \"An end consists of: 1. A bifunctor F: C^op × C → D 2. An end object e ∈ D 3. A wedge ω: (ω_c: e → F(c,c))_c that is dinatural\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"F must be a valid bifunctor C^op × C → D\",\n      \"Wedge ω must satisfy dinaturality condition for all morphisms\",\n      \"End must satisfy universal property among all wedges\",\n      \"All end artifacts must be content-addressed via SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"F must be a bifunctor from C^op × C to D\",\n    \"For each f: c → c', the diagram F(c',c) → F(c,c) → F(c,c') commutes\",\n    \"For any wedge (w, τ_c: w → F(c,c)), there exists unique h: w → e such that τ_c = ω_c ∘ h for all c\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\",\n      \"Given same data, must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Must reject when F is not a valid bifunctor\",\n    \"Must reject when wedge fails dinaturality\",\n    \"Must reject when universal property fails\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An end is a universal dinatural transformation for a bifunctor F: C^op × C → D, written ∫_c F(c,c). Ends generalize limits and equalizers, and compute natural transformation objects and Hom spaces in functor categories.\",\n    \"non_role\": [\n      \"Coends (dual construction, separate contract)\",\n      \"Weighted ends (future extension)\",\n      \"Enriched ends (requires enriched category theory)\",\n      \"∞-categorical ends (higher category theory)\"\n    ]\n  },\n  \"wip\": [\n    \"Weighted ends\",\n    \"Enriched ends\",\n    \"∞-categorical ends\",\n    \"Current implementation covers classical ends in ordinary categories\",\n    \"Equalizer formula provides computational foundation\",\n    \"Natural transformation space formula is primary use case\",\n    \"Future work: weighted and enriched variants\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"limits_colimits\",\n    \"symbols\": [\n      \"End\"\n    ],\n    \"required_tests\": [\n      \"validate_ok\",\n      \"validate_rejects_missing_bifunctor\"\n    ]\n  }\n}\n",
