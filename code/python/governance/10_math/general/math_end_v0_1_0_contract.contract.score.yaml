        "All end artifacts must be content-addressed via SHA-256"
      ]
    },
    "laws": [
      "F must be a bifunctor from C^op × C to D",
      "For each f: c → c', the diagram F(c',c) → F(c,c) → F(c,c') commutes",
      "For any wedge (w, τ_c: w → F(c,c)), there exists unique h: w → e such that τ_c = ω_c ∘ h for all c\n"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Validators are content-addressed",
        "Given same data, must produce identical artifact hash"
      ]
    },
