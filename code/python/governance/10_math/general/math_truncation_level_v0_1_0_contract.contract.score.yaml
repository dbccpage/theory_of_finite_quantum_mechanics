      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:truncation_level:v0.1.0\",\n  \"title\": \"TruncationLevel Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"homotopy_type_classification\",\n    \"symbol\": \"is-n-type A, where n ∈ {-2, -1, 0, 1, 2, ...}\",\n    \"ascii_symbol\": \"truncation_level\",\n    \"notation\": \"is-n-type A, where n ∈ {-2, -1, 0, 1, 2, ...}\",\n    \"domain\": [\n      \"level: integer n ≥ -2\",\n      \"type_ref: type A\",\n      \"proof: proof that A is n-truncated\"\n    ],\n    \"codomain\": {\n      \"description\": \"Integer n ≥ -2 representing the truncation level, together with a type A and a proof that A is n-truncated\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Truncation level n must be ≥ -2\",\n      \"Referenced type A must exist and be resolvable\",\n      \"Truncation proof must correctly establish n-truncation\",\n      \"Artifact hash must be deterministic SHA-256 of inputs\"\n    ]\n  },\n  \"laws\": [\n    \"n ≥ -2\",\n    \"For all x, y : A and all (n+1)-fold path spaces, the path space is contractible\\n\",\n    \"If A is n-truncated, then A is (n+1)-truncated\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"type_id does not resolve\",\n    \"level < -2\",\n    \"Type claimed to be set (n=0) but has non-trivial path spaces\\n\",\n    \"proof_id does not resolve\",\n    \"Level -2 requires ContractibleType proof, but different proof provided\\n\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A TruncationLevel classifies types by their homotopical complexity. The levels are: (-2) contractible, (-1) proposition, (0) set, (1) groupoid, (n) n-type. The contract validates that a type is n-truncated by verifying that all (n+1)-fold path spaces are contractible.\",\n    \"non_role\": [\n      \"Does not implement the truncation operation ||A||_n (higher inductive type)\",\n      \"Does not provide lattice operations on truncation levels\",\n      \"Does not handle infinite or unbounded truncation levels\"\n    ]\n  },\n  \"wip\": [\n    \"The n-truncation operation ||A||_n is a higher inductive type - implementation strategy TBD\",\n    \"Truncation levels form a lattice; higher types are less truncated - formalize lattice structure\",\n    \"Relationship with ContractibleType: contractible = (-2)-type - ensure consistency\",\n    \"Univalence compatibility with truncation - verify preservation under equivalence\",\n    \"Computation rules for truncation operation - define canonical forms\",\n    \"Contract defines classification only, not the truncation operation itself\",\n    \"Proof validation requires recursive checking of path spaces\",\n    \"Level -2 (contractible) special case handled via ContractibleType contract\",\n    \"Levels -1 (prop) and 0 (set) are most common in practice\",\n    \"Higher levels (n ≥ 1) require sophisticated path space analysis\"\n  ]\n}\n",
