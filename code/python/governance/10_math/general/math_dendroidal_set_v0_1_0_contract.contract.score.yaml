      "codomain": {
        "description": "A dendroidal set is a presheaf on the planar tree category Omega. An (infinity, 1)-operad (dendroidal quasi-category) is a dendroidal set where every inner horn Lambda^e(T) admits a filler whose missing face is the operadic composition along the inner edge e."
      }
