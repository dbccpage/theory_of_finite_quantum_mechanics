      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:dendroidal_set:v0.1.0\",\n  \"title\": \"Dendroidal Set and Inner Horn Filler Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"dendroidal_set\",\n    \"symbol\": \"dSet = PSh(Omega)\",\n    \"ascii_symbol\": \"dendroidal_set\",\n    \"notation\": \"X : Omega^op -> Set, with inner horn fillers Lambda^e(T) -> X extending to Omega[T] -> X\",\n    \"domain\": [\n      \"planar_tree_category: category Omega of rooted planar trees with corollas, grafting, and edge contractions\",\n      \"inner_edges: internal edges connecting two vertices in a rooted tree\",\n      \"inner_horns: sub-dendroidal sets Lambda^e(T) omitting the inner edge contraction face partial_e T\"\n    ],\n    \"codomain\": {\n      \"description\": \"A dendroidal set is a presheaf on the planar tree category Omega. An (infinity, 1)-operad (dendroidal quasi-category) is a dendroidal set where every inner horn Lambda^e(T) admits a filler whose missing face is the operadic composition along the inner edge e.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Planar tree representation with explicit vertices, leaf edges, root edge, and inner edges.\",\n      {\n        \"Elementary face maps\": \"inner face (edge contraction) and outer faces (vertex removal).\"\n      },\n      \"Inner horn structure Lambda^e(T) omitting the inner face partial_e T.\",\n      \"Constructive inner horn filler producing the operadic composite on the missing inner face.\",\n      \"Equivalence theorem demonstrating that for linear trees, dendroidal horn filling coincides with simplicial horn filling Lambda^1_2 -> Delta^2.\",\n      \"Strictly zero floating-point arithmetic in Rust implementation.\",\n      \"Soviet memory allocation bounds enforced via reserve_exact and OperationLimits.\",\n      \"Deterministic content-addressed artifact hash.\"\n    ]\n  },\n  \"laws\": [\n    \"Inner horn filling: every inner horn Lambda^e(T_graft) admits a filler matching outer faces\",\n    \"Composite realization: the missing inner face partial_e produced by horn filling equals the operadic composite\",\n    \"Simplicial reduction: for linear trees with arity 1 vertices, the dendroidal nerve coincides with the simplicial nerve\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Trees serialized in canonical discrete planar order\",\n      \"Given identical input tree and horn, produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"dendroidal_set\",\n    \"symbols\": [\n      \"PlanarTree\",\n      \"TreeVertex\",\n      \"TreeEdge\",\n      \"DendroidalSet\",\n      \"TreeInnerHorn\",\n      \"DendroidalSet::fill_dendroidal_inner_horn\",\n      \"DendroidalSet::verify_dendroidal_inner_horn_property\"\n    ],\n    \"required_tests\": [\n      \"test_dendroidal_set_positive_verification\",\n      \"test_kill_mut_ds_01_missing_inner_face_mismatch\",\n      \"test_kill_mut_ds_02_outer_face_top_mismatch\",\n      \"test_kill_mut_ds_03_outer_face_bot_mismatch\",\n      \"test_kill_mut_ds_04_inner_edge_boundary_mismatch\",\n      \"test_kill_mut_ds_05_tree_cycle_violation\",\n      \"test_kill_mut_ds_06_allocation_cap_exceeded\",\n      \"test_register_rejects_composite_with_wrong_input_colours\",\n      \"test_verify_rejects_composite_whose_colours_differ_from_the_tree\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.DendroidalSet\",\n    \"symbols\": [\n      \"Corolla\",\n      \"GraftedTree\",\n      \"contractInnerEdge\",\n      \"fillLinearDendroidalInnerHorn\",\n      \"fillLinear_matches_top\",\n      \"fillLinear_matches_bot\",\n      \"fillLinear_inner_face_eq_composite\",\n      \"dendroidal_linear_inner_horn_fills\",\n      \"dendroidal_simplicial_nerve_agreement\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Missing inner face calculation mismatch (MUT-DS-01)\",\n    \"Outer face top boundary mismatch on horn filler (MUT-DS-02)\",\n    \"Outer face bot boundary mismatch on horn filler (MUT-DS-03)\",\n    \"Inner edge boundary colour mismatch (MUT-DS-04)\",\n    \"Tree graph contains cycles violating rooted tree condition (MUT-DS-05)\",\n    \"Soviet allocation limit exceeded in dendroidal solver (MUT-DS-06)\",\n    \"Composite input colours are not the graft substitution\",\n    \"Table entry whose colours differ from the contracted tree\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A dendroidal set generalizes simplicial sets from linear orders [n] to trees Omega. An (infinity, 1)-operad is a dendroidal set satisfying inner horn filling extensions, representing multi-ary operations composing up to coherent higher homotopies.\",\n    \"non_role\": [\n      \"Continuous topological operads with non-discrete topology\",\n      \"Infinite-depth non-well-founded trees\",\n      \"Inner horns on trees with more than two vertices\"\n    ]\n  },\n  \"wip\": [\n    \"Dendroidal complete Segal spaces\",\n    \"Boardman-Vogt tensor product of dendroidal sets\"\n  ]\n}\n",
