      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:polynomial_ring:v0.1.0\",\n  \"title\": \"Polynomial Ring over an Exact Field Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"polynomial_ring\",\n    \"symbol\": \"F[x], and over Q: content, Sturm counts and real-root isolation\",\n    \"ascii_symbol\": \"polynomial_ring\",\n    \"notation\": \"F[x], and over Q: content, Sturm counts and real-root isolation\",\n    \"domain\": [\n      \"coefficients: ascending list over an exact field F of the linear_algebra scalar tower\",\n      \"interval endpoints: exact rationals, for the real-root routines\"\n    ],\n    \"codomain\": {\n      \"description\": \"Normalised polynomials (no trailing zero coefficient); quotients, remainders, gcds, resultants, discriminants; exact counts of real roots in (a, b]; rational isolating intervals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every polynomial is normalised: the leading stored coefficient is nonzero and the zero polynomial is empty\",\n      \"Division by the zero polynomial is refused with a typed error\",\n      \"The squarefree operations are valid in characteristic zero\",\n      \"Real-root counts are of distinct roots, in a half-open interval (a, b]\",\n      \"A rational root is reported exactly; an irrational root is reported by an interval whose endpoints are not roots\",\n      \"No floating point appears in any operation\"\n    ]\n  },\n  \"laws\": [\n    \"f = q g + r with deg r < deg g (Euclidean division)\",\n    \"s a + t b = gcd(a, b), gcd monic (Bezout)\",\n    \"Res(f, g) equals the Sylvester determinant, and Res(prod(x - a_i), prod(x - b_j)) = prod(a_i - b_j)\",\n    \"disc(f) = 0 exactly when f has a repeated root\",\n    \"f = lc(f) prod q_i^i for the squarefree decomposition q_i\",\n    \"content(f g) = content(f) content(g) (Gauss)\",\n    \"prod over d | n of Phi_d = x^n - 1, deg Phi_n = phi(n), Phi_n(1) = p for a prime power p^k\",\n    \"Sturm: the number of distinct real roots in (a, b] is V(a) - V(b)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"polynomial\",\n    \"symbols\": [\n      \"Polynomial\",\n      \"PolynomialError\",\n      \"ExactField\",\n      \"cyclotomic_polynomial\",\n      \"euler_phi\",\n      \"mobius\",\n      \"SturmSequence\",\n      \"sturm_sequence\",\n      \"count_real_roots\",\n      \"count_all_real_roots\",\n      \"real_root_bound\",\n      \"isolate_real_roots\",\n      \"rational_roots\",\n      \"refine_root\",\n      \"refine_simple_root\",\n      \"RealRoot\",\n      \"RootLocation\"\n    ],\n    \"required_tests\": [\n      \"ring_laws_and_degree_additivity_hold_on_a_grid\",\n      \"euclidean_division_reconstructs_the_dividend_with_a_smaller_remainder\",\n      \"division_by_the_zero_polynomial_is_refused_not_panicked\",\n      \"extended_gcd_satisfies_the_bezout_identity\",\n      \"resultant_matches_the_sylvester_determinant_and_the_product_over_roots\",\n      \"discriminant_vanishes_exactly_for_repeated_roots_and_equals_the_root_product\",\n      \"discriminant_refuses_the_zero_polynomial_and_constants\",\n      \"squarefree_part_drops_multiplicities_and_yun_reassembles_the_polynomial\",\n      \"gauss_lemma_content_is_multiplicative\",\n      \"cyclotomic_polynomials_satisfy_the_defining_relations_for_every_n_up_to_40\",\n      \"cyclotomic_polynomial_refuses_zero_and_oversized_conductors\",\n      \"sturm_counts_distinct_real_roots_in_half_open_intervals\",\n      \"sturm_counts_agree_with_direct_counting_of_known_rational_roots\",\n      \"sturm_refuses_the_zero_polynomial_and_reversed_intervals\",\n      \"isolation_reports_every_rational_root_exactly_with_its_multiplicity\",\n      \"isolation_separates_close_irrational_roots\",\n      \"refinement_refuses_a_non_positive_tolerance_and_a_non_isolating_interval\",\n      \"cauchy_bound_strictly_contains_every_real_root\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Division by the zero polynomial must be refused\",\n    \"The discriminant of the zero polynomial or of a constant must be refused\",\n    \"Sturm counting for the zero polynomial or over a reversed interval must be refused\",\n    \"Root refinement with a non-positive tolerance or a non-isolating interval must be refused\",\n    \"A cyclotomic polynomial for conductor 0 or above the declared maximum must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Dense univariate polynomials over any exact field of the scalar tower, with the exact real-root machinery over Q: Gauss content, cyclotomic polynomials, Sturm sequences, isolation and refinement of real roots.\",\n    \"non_role\": [\n      \"Floating-point root finding\",\n      \"Factorisation over Q into irreducibles (not built)\",\n      \"Multivariate polynomials\"\n    ]\n  },\n  \"wip\": [\n    \"Factorisation over Q (Kronecker or Zassenhaus) is not built\",\n    \"The squarefree routines assume characteristic zero; there is no GF(p) polynomial type yet\",\n    \"No Lean counterpart exists for Sturm's theorem or the resultant\"\n  ]\n}\n",
