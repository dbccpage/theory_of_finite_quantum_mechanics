      "ε is not FG ⇒ Id_D",
      "ε_{F(A)} ∘ F(η_A) ≠ id_{F(A)}",
      "G(ε_B) ∘ η_{G(B)} ≠ id_{G(B)}"
    ],
    "doctrine": {
      "binding_review_20261014": "The binding is the declared finite category/functor validator, not an unrestricted adjunction theorem. These symbols are source-checked; this review does not rerun the category behavior suite.",
