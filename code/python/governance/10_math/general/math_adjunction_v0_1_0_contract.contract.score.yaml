      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:adjunction:v0.1.0\",\n  \"title\": \"Adjunction Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"adjunction\",\n    \"symbol\": \"F ⊣ G\",\n    \"ascii_symbol\": \"adjunction\",\n    \"notation\": \"F ⊣ G\",\n    \"domain\": [\n      \"left_functor: functor F: C → D\",\n      \"right_functor: functor G: D → C\",\n      \"unit: natural_transformation η: Id_C ⇒ GF\",\n      \"counit: natural_transformation ε: FG ⇒ Id_D\"\n    ],\n    \"codomain\": {\n      \"description\": \"Two functors F: C → D and G: D → C with natural transformations η and ε\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"F: C → D and G: D → C must connect the same categories\",\n      \"η must be a natural transformation Id_C ⇒ GF\",\n      \"ε must be a natural transformation FG ⇒ Id_D\",\n      \"ε_{F(A)} ∘ F(η_A) = id_{F(A)} for all A in C\",\n      \"G(ε_B) ∘ η_{G(B)} = id_{G(B)} for all B in D\"\n    ]\n  },\n  \"laws\": [\n    \"For each object A in C: ε_{F(A)} ∘ F(η_A) = id_{F(A)}\",\n    \"For each object B in D: G(ε_B) ∘ η_{G(B)} = id_{G(B)}\",\n    \"η is a natural transformation: Id_C ⇒ GF\",\n    \"ε is a natural transformation: FG ⇒ Id_D\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Functors and natural transformations are content-addressed\",\n      \"Composition order is fully determined\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"left_functor_id does not resolve\",\n    \"F and G do not connect the same categories\",\n    \"η is not Id_C ⇒ GF\",\n    \"ε is not FG ⇒ Id_D\",\n    \"ε_{F(A)} ∘ F(η_A) ≠ id_{F(A)}\",\n    \"G(ε_B) ∘ η_{G(B)} ≠ id_{G(B)}\"\n  ],\n  \"doctrine\": {\n    \"binding_review_20261014\": \"The binding is the declared finite category/functor validator, not an unrestricted adjunction theorem. These symbols are source-checked; this review does not rerun the category behavior suite.\",\n    \"summary\": \"An Adjunction between categories C and D consists of functors F: C → D (left adjoint) and G: D → C (right adjoint) with a natural bijection Hom_D(F(A), B) ≅ Hom_C(A, G(B)). The contract validates the adjunction via unit/counit or hom-set bijection.\",\n    \"non_role\": [\n      \"Multi-adjunctions (adjoint triples, quadruples)\",\n      \"Enriched or bicategorical adjunctions\",\n      \"Homotopy-coherent adjunctions (∞-categories)\",\n      \"Proof of adjunction from initial/terminal objects\"\n    ]\n  },\n  \"wip\": [\n    \"How to support the hom-set bijection definition (equivalent to unit/counit)?\",\n    \"What FactEnvelope types should be standardized for adjoint equivalences?\",\n    \"How to encode monad algebras and Eilenberg-Moore categories?\",\n    \"Should we support adjoint functors between bicategories?\",\n    \"Currently targets ordinary adjunctions between 1-categories\",\n    \"Adjoint equivalences (both η and ε are isomorphisms) are important special case\",\n    \"Monads arise from adjunctions via T = GF - derive_monad method implemented\",\n    \"Comonads arise from adjunctions via D = FG - derive_comonad method implemented\",\n    \"Kleisli composition for derived monads is implemented\",\n    \"Validation includes triangle identities, functor existence, and naturality\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"legacy_adjunction\",\n    \"symbols\": [\n      \"DeclaredFiniteAdjunction\",\n      \"validate_declared_adjunction\"\n    ],\n    \"required_tests\": [\n      \"left_triangle_trivial\",\n      \"missing_unit_is_violation\"\n    ]\n  }\n}\n",
