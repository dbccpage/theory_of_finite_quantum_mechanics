        "Homotopy-coherent adjunctions (∞-categories)",
        "Proof of adjunction from initial/terminal objects"
      ]
    },
    "wip": [
      "How to support the hom-set bijection definition (equivalent to unit/counit)?",
      "What FactEnvelope types should be standardized for adjoint equivalences?",
      "How to encode monad algebras and Eilenberg-Moore categories?",
      "Should we support adjoint functors between bicategories?",
      "Currently targets ordinary adjunctions between 1-categories",
      "Adjoint equivalences (both η and ε are isomorphisms) are important special case",
      "Monads arise from adjunctions via T = GF - derive_monad method implemented",
      "Comonads arise from adjunctions via D = FG - derive_comonad method implemented",
      "Kleisli composition for derived monads is implemented",
      "Validation includes triangle identities, functor existence, and naturality"
    ],
    "rust_binding": {
