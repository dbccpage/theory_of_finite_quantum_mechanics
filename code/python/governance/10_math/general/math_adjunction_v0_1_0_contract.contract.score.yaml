        "unit: natural_transformation η: Id_C ⇒ GF",
        "counit: natural_transformation ε: FG ⇒ Id_D"
      ],
      "codomain": {
        "description": "Two functors F: C → D and G: D → C with natural transformations η and ε"
      }
    },
    "requirements": {
      "required_structures": [
        "F: C → D and G: D → C must connect the same categories",
        "η must be a natural transformation Id_C ⇒ GF",
        "ε must be a natural transformation FG ⇒ Id_D",
        "ε_{F(A)} ∘ F(η_A) = id_{F(A)} for all A in C",
        "G(ε_B) ∘ η_{G(B)} = id_{G(B)} for all B in D"
      ]
    },
    "laws": [
      "For each object A in C: ε_{F(A)} ∘ F(η_A) = id_{F(A)}",
      "For each object B in D: G(ε_B) ∘ η_{G(B)} = id_{G(B)}",
      "η is a natural transformation: Id_C ⇒ GF",
      "ε is a natural transformation: FG ⇒ Id_D"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Functors and natural transformations are content-addressed",
        "Composition order is fully determined"
      ]
    },
    "relationships": {
      "extends": [
