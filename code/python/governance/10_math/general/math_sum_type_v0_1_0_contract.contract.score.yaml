      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:sum_type:v0.1.0\",\n  \"title\": \"Sum Type Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"type_former\",\n    \"symbol\": \"coprod_{i in I} A_i or A_1 + A_2 + ... + A_n\",\n    \"ascii_symbol\": \"sum_type\",\n    \"notation\": \"coprod_{i in I} A_i or A_1 + A_2 + ... + A_n\",\n    \"domain\": [\n      \"index_set: finite_ordered_set\",\n      \"summand_types: indexed_family_of_types\",\n      \"total_space: tagged_union_set\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Sum Type consists of: - Index set I: a finite set of tags - Summand types: {A_i}_{i in I}, a type for each tag - Total space: the disjoint union coprod_{i in I} A_i = {(i, a) | i in I, a: A_i} - Injections: inj_i: A_i -> coprod A_i for each i\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Index set I must be non-empty\",\n      \"Each summand type A_i must resolve to a valid type artifact\",\n      \"All tags in I must be distinct\",\n      \"Total space equals the disjoint union of all summand types\",\n      \"StructureArtifact hash matches canonical serialization\"\n    ]\n  },\n  \"laws\": [\n    \"For each i in I and a: A_i, inj_i(a) is an element of the sum type\",\n    \"Every element of the sum type is inj_i(a) for exactly one i in I and one a: A_i\",\n    \"Given f_i: A_i -> C for all i, there exists a unique [f_i]: coprod A_i -> C\",\n    \"[f_i](inj_j(a)) = f_j(a) for all j in I and a: A_j\",\n    \"For g: coprod A_i -> C, g = [g o inj_i]_{i in I}\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Tags serialized as sorted byte strings separated by U+001E\",\n      \"Summand type IDs serialized as 32-byte hashes in tag order\",\n      \"Tagged values serialized as (tag_length, tag_bytes, value_length, value_bytes)\",\n      \"All validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Index set I is empty\",\n    \"Tags contain duplicates ['A', 'A']\",\n    \"Tags are not sorted ['B', 'A']\",\n    \"3 tags but only 2 summand types\",\n    \"A summand type artifact does not resolve\",\n    \"Value is not an element of the summand type for the given tag\",\n    \"Tag is not in the index set\",\n    \"Case analysis missing a case for one tag\",\n    \"Different serialization conventions produce different hashes\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Sum Type (coproduct type) encodes a tagged disjoint union of a finite family of types. Given an index set I and types {A_i}_{i in I}, the sum type coprod_{i in I} A_i consists of pairs (i, a) where i in I is a tag and a: A_i. For the binary case, A + B has injections inl: A -> A + B and inr: B -> A + B. Elimination is by case analysis: given a function f_i: A_i -> C for each i, there is a unique function [f_i]: coprod A_i -> C. The contract validates injection, case analysis (elimination), and the computation rule (beta: [f_i](inj_j(a)) = f_j(a)).\",\n    \"non_role\": [\n      \"Does not encode dependent sums (use SigmaType for that)\",\n      \"Does not handle infinite index sets\",\n      \"Does not verify decidability of tag equality\",\n      \"Does not support quotient types or higher inductive types\",\n      \"Does not handle recursive sum types (inductive types)\"\n    ]\n  },\n  \"wip\": [\n    \"Should the contract support empty sum types (initial object / void type)?\",\n    \"How should recursive sum types (inductive types) be handled?\",\n    \"Should the contract encode the decidability of tag comparison?\",\n    \"How should sum types interact with the sigma type contract for dependent sums?\",\n    \"Should unique elimination (up to propositional equality) be verified?\",\n    \"Only finite index sets and finite summand types are directly encodable\",\n    \"Binary sum type A + B is the special case with I = {0, 1}\",\n    \"Tags are byte strings to support arbitrary naming conventions\",\n    \"Total space size is the sum of all summand type cardinalities\",\n    \"Case analysis exhaustiveness requires exactly one function per tag\",\n    \"All operations are deterministic and content-addressed for replay\"\n  ]\n}\n",
