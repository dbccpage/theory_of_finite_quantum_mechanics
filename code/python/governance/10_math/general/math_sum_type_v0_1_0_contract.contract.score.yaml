    "doctrine": {
      "summary": "A Sum Type (coproduct type) encodes a tagged disjoint union of a finite family of types. Given an index set I and types {A_i}_{i in I}, the sum type coprod_{i in I} A_i consists of pairs (i, a) where i in I is a tag and a: A_i. For the binary case, A + B has injections inl: A -> A + B and inr: B -> A + B. Elimination is by case analysis: given a function f_i: A_i -> C for each i, there is a unique function [f_i]: coprod A_i -> C. The contract validates injection, case analysis (elimination), and the computation rule (beta: [f_i](inj_j(a)) = f_j(a)).",
