        "description": "A Sum Type consists of: - Index set I: a finite set of tags - Summand types: {A_i}_{i in I}, a type for each tag - Total space: the disjoint union coprod_{i in I} A_i = {(i, a) | i in I, a: A_i} - Injections: inj_i: A_i -> coprod A_i for each i\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Index set I must be non-empty",
        "Each summand type A_i must resolve to a valid type artifact",
        "All tags in I must be distinct",
        "Total space equals the disjoint union of all summand types",
        "StructureArtifact hash matches canonical serialization"
      ]
    },
    "laws": [
      "For each i in I and a: A_i, inj_i(a) is an element of the sum type",
      "Every element of the sum type is inj_i(a) for exactly one i in I and one a: A_i",
      "Given f_i: A_i -> C for all i, there exists a unique [f_i]: coprod A_i -> C",
      "[f_i](inj_j(a)) = f_j(a) for all j in I and a: A_j",
      "For g: coprod A_i -> C, g = [g o inj_i]_{i in I}"
    ],
    "replay": {
