      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:certified_cochain_quotient:v0.1.0\",\n  \"title\": \"Certified Exact Cochain Quotient\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"certified_cochain_quotient\",\n    \"symbol\": \"certified_cochain_quotient\",\n    \"ascii_symbol\": \"certified_cochain_quotient\",\n    \"notation\": \"Certified Exact Cochain Quotient\",\n    \"domain\": [\n      \"Finite rational cochain map d0 and defect x\",\n      \"Strictly positive rational weights and declared pivot budget\",\n      \"Each cochain axis is at most256; the simplex pivot budget remains caller declared. Inputs have nonzero rational denominators.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact finite constructions implemented by omega_solvers::certified_phi1; results remain scoped to the declared carrier and budgets.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Exact arithmetic and explicit finite carrier validation\",\n      \"A typed refusal for unsupported or exhausted computations\"\n    ]\n  },\n  \"laws\": [\n    \"The proposed L1 quotient mass is accepted only after independent primal/dual replay\",\n    \"Equal local absolute values can have distinct global quotient classes\",\n    \"An empty carrier has zero mass with a checked zero-dimensional certificate\",\n    \"The shared direct L1 proposer rejects zero-denominator rational data before optimization and its public sparse pairing validates shape and indices before summation.\",\n    \"The nalgebra proposer checks default pivot-budget arithmetic before cloning and retains the coefficient width of a zero-row carrier within its declared allocation ceiling.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact independent witness replay where a witness is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_solvers\",\n    \"module\": \"solver_cohomology_quotient_phi1\",\n    \"symbols\": [\n      \"certified_phi1\",\n      \"lggr_cochain_witness\",\n      \"CertifiedPhi1Error\"\n    ],\n    \"required_tests\": [\n      \"triangle_quotient_mass_and_dual_circulation_are_replayed\",\n      \"local_absolute_values_do_not_determine_the_quotient_class\",\n      \"malformed_weights_and_budget_exhaustion_cannot_be_certified\",\n      \"empty_cochains_keep_zero_value_and_refuse_unbounded_zero_axes\",\n      \"solver_lp_exact_simplex::public_boundary_tests::direct_l1_refuses_invalid_rationals_and_replays_exact_pivot_and_zero_pivot_optima\",\n      \"solver_lp_exact_simplex::public_boundary_tests::public_sparse_pairing_refuses_malformed_carriers_and_replays_the_exact_dot_product\",\n      \"solver_lp_exact_simplex::public_boundary_tests::nalgebra_projection_preserves_empty_width_and_refuses_overflow_before_cloning\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject shape mismatch, nonpositive weights, exhausted proposals and failed replay\",\n    \"Refuse oversized empty-carrier coefficient axes before allocation, and zero-denominator rational inputs before optimization.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Certified Exact Cochain Quotient on a declared finite carrier.\",\n    \"non_role\": [\n      \"PROVED, GlobalGreen, or operational authority\",\n      \"Continuum or infinite-carrier completion claims\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite checks are local evidence; no theorem-prover discharge is asserted.\",\n    \"The direct proposer and sparse pairing have their own public boundaries; they do not replace the independent certified quotient replay or its256-axis admission limit.\"\n  ]\n}\n",
