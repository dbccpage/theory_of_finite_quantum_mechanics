      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:delta_object:v0.1.0\",\n  \"title\": \"DeltaObject Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"simplicial_object\",\n    \"symbol\": \"X: Delta^op -> C, X_n with d_i and s_j\",\n    \"ascii_symbol\": \"delta_object\",\n    \"notation\": \"X: Delta^op -> C, X_n with d_i and s_j\",\n    \"domain\": [\n      \"objects: {X_n}_{n >= 0}, the objects at each simplicial degree\",\n      \"face_maps: {d_i: X_n -> X_{n-1}}_{0 <= i <= n}, the face maps\",\n      \"degeneracy_maps: {s_j: X_n -> X_{n+1}}_{0 <= j <= n}, the degeneracy maps\",\n      \"max_degree: N, the maximum degree for which data is provided\"\n    ],\n    \"codomain\": {\n      \"description\": \"A functor Delta^op -> C given by objects, face maps, and degeneracy maps\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Each X_n must be a valid object in the target category\",\n      \"Each face map d_i must be a valid morphism X_n -> X_{n-1}\",\n      \"Each degeneracy map s_j must be a valid morphism X_n -> X_{n+1}\",\n      \"All five simplicial identity families must hold\",\n      \"Artifact hash must be SHA-256 over all component hashes\"\n    ]\n  },\n  \"laws\": [\n    \"d_i . d_j = d_{j-1} . d_i for i < j\",\n    \"s_i . s_j = s_{j+1} . s_i for i <= j\",\n    \"d_i . s_j = s_{j-1} . d_i for i < j\",\n    \"d_j . s_j = id = d_{j+1} . s_j\",\n    \"d_i . s_j = s_j . d_{i-1} for i > j+1\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All validators content-addressed\",\n      \"Given same inputs, must produce identical artifact hash\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid objects at some degree must be rejected\",\n    \"Face map with wrong domain/codomain must be rejected\",\n    \"Degeneracy map with wrong domain/codomain must be rejected\",\n    \"Violation of d_i . d_j = d_{j-1} . d_i must be rejected\",\n    \"Violation of mixed face-degeneracy identity must be rejected\",\n    \"Artifact claiming authority must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A DeltaObject (simplicial object) is a functor X: Delta^op -> C, where Delta is the simplex category of finite ordinals and order-preserving maps. Concretely, a DeltaObject consists of a sequence of objects {X_n}_{n >= 0} in C together with face maps d_i: X_n -> X_{n-1} (for 0 <= i <= n) and degeneracy maps s_j: X_n -> X_{n+1} (for 0 <= j <= n) satisfying the simplicial identities. This contract validates the data of a simplicial object, including the objects at each degree, the face and degeneracy maps, and the simplicial identity relations.\",\n    \"non_role\": [\n      \"Does not determine if the simplicial set is a Kan complex\",\n      \"Does not compute homotopy groups\",\n      \"Does not compute homology groups\",\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\"\n    ]\n  },\n  \"wip\": [\n    \"Whether to support semi-simplicial objects (face maps only, no degeneracies)\",\n    \"Whether to support augmented simplicial objects (with X_{-1})\",\n    \"Truncation: how to handle n-truncated simplicial objects\",\n    \"Relationship to nerve of categories and Kan complexes\",\n    \"Currently in WIP status - full implementation pending\",\n    \"Simplicial identity verification needs efficient implementation\",\n    \"Integration with homological algebra pipeline needs design\",\n    \"Finite presentation: only data up to max_degree is stored\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"simplicial_set\",\n    \"symbols\": [\n      \"SimplicialSet\",\n      \"Simplex\"\n    ],\n    \"required_tests\": [\n      \"test_simplicial_set_and_quasi_category_positive_verification\",\n      \"test_kill_mut_p3_03_simplicial_identity_violation\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
