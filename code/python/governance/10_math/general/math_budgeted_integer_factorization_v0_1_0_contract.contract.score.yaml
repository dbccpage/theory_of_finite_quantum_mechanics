      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:budgeted_integer_factorization:v0.1.0\",\n  \"title\": \"Certified Budgeted Integer and Rational Factorization\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"budgeted_integer_factorization\",\n    \"symbol\": \"budgeted_integer_factorization\",\n    \"ascii_symbol\": \"budgeted_integer_factorization\",\n    \"notation\": \"Certified Budgeted Integer and Rational Factorization\",\n    \"domain\": [\n      \"Positive BigUint/BigInt integers and positive BigRational inputs\",\n      \"Declared shared operation budget, including numerator and denominator work\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_number_theory::integer_factorization; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Successful factors are proved prime and their product reconstructs the original input exactly\",\n    \"Rational prime exponents are signed and canceled zero exponents are removed\",\n    \"Proven deterministic u64 primality and bounded exact larger-integer trial certification are distinguished from an unfinished search\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"integer_factorization\",\n    \"symbols\": [\n      \"FactorizationBudget\",\n      \"FactorizationError\",\n      \"factor_natural\",\n      \"factor_integer\",\n      \"factor_positive_rational\",\n      \"is_prime_u64\"\n    ],\n    \"required_tests\": [\n      \"certified_factorization_reconstructs_large_integers_and_refuses_exhaustion\",\n      \"rational_factorization_replays_signed_exponents_and_shares_one_budget\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Zero/nonpositive inputs are refused\",\n    \"Operation exhaustion cannot be reported as primality or a complete factorization\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Successful factors are proved prime and their product reconstructs the original input exactly; Rational prime exponents are signed and canceled zero exponents are removed; Proven deterministic u64 primality and bounded exact larger-integer trial certification are distinguished from an unfinished search.\",\n    \"non_role\": [\n      \"No probabilistic prime claim\",\n      \"No promise to complete arbitrarily large factorization within a finite budget\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
