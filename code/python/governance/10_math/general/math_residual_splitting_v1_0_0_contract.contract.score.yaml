      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:residual_splitting:v1.0.0\",\n  \"title\": \"Rational splittings of a repair image and their weighted ℓ¹ distortion\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"residual_splitting\",\n    \"symbol\": \"‖L_H‖_{1,w}\",\n    \"ascii_symbol\": \"SplitDistortion\",\n    \"notation\": \"Q^m = R ⊕ W_H, R = im d0, L_H = (N - B H) Q, Φ₁(x) ≤ ‖L_H x‖_{1,w} ≤ ‖L_H‖_{1,w} Φ₁(x)\",\n    \"domain\": [\n      \"a repair map d0, an m x k rational matrix given row-wise, with declared column count k\",\n      \"a basis B of R (m x r), a completion N (m x (m - r)) with S = [B N] invertible, and S^{-1} = [U; Q]\",\n      \"a rational parameter H (r x (m - r)) selecting the complement W_H = im(N - B H)\",\n      \"strictly positive rational weights w on Q^m\"\n    ],\n    \"codomain\": {\n      \"description\": \"The exact weighted operator norm ‖L_H‖_{1,w} of a replayed splitting, or a typed ResidualSplittingError naming the failed shape or identity.\"\n    },\n    \"definition\": {\n      \"projections\": \"C_H = B (U + H Q) onto R; L_H = (N - B H) Q = I - C_H onto W_H along R\",\n      \"operator_norm\": \"‖M‖_{1,w} = max_j Σ_i w_i |M_ij| / w_j; zero when m = 0\",\n      \"distortion_bound\": \"L_H vanishes on R and x - L_H x = C_H x lies in R, so with Φ₁(x) = min_a ‖x - d0 a‖_{1,w} one has Φ₁(x) ≤ ‖L_H x‖_{1,w} ≤ ‖L_H‖_{1,w} Φ₁(x).\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Rational matrices of the declared shapes with positive denominators\",\n      \"Strictly positive rational weights\"\n    ]\n  },\n  \"laws\": [\n    \"Replay law: ResidualSplittingCertificate::verify recomputes S S^{-1} = I, S^{-1} S = I, B = d0 F, d0 = B E, C = B (U + H Q), L = (N - B H) Q, C + L = I, C C = C and L d0 = 0 before returning a norm.\",\n    \"Identity refusal law: a failed identity is IdentityFails naming the identity and the first failing entry; a wrong shape is Shape; a bad denominator is InvalidRational; a nonpositive weight is NonPositiveWeight.\",\n    \"Transport law: verify_transport checks T C = C' T for square matrices and names the first failing entry.\",\n    \"Scope law: this module checks one supplied splitting and returns its distortion; whether some H gives distortion at most one is decided elsewhere (omega_solvers::contractive_complement), not here.\",\n    \"Exactness law: all arithmetic is BigRational; there is no floating-point path and no tolerance.\",\n    \"Authority law: a returned norm mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Exact rational arithmetic only\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"residual_splitting\",\n    \"symbols\": [\n      \"ResidualSplittingError\",\n      \"RowMatrix\",\n      \"multiply\",\n      \"weighted_l1_operator_norm\",\n      \"splitting_from_parameter\",\n      \"ResidualSplittingCertificate\",\n      \"verify_transport\"\n    ],\n    \"required_tests\": [\n      \"two_dimensional_splittings_are_contractive\",\n      \"tampered_certificates_name_the_failed_identity\",\n      \"extreme_images\",\n      \"weighted_norm_and_transport\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A certificate with any tampered matrix must be refused with IdentityFails naming the failed identity\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"residual_splitting replays a producer-supplied splitting Q^m = R ⊕ W_H of a repair image R = im d0 and returns the exact weighted ℓ¹ operator norm of its residual projection. The parametrisation of all complements by H and the distortion bound are written proofs in the module documentation; the code checks the identities of one supplied certificate. Nonclaim: not a search for a contractive complement; not Φ₁ evaluation; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Search or feasibility decisions over H (see omega_solvers::contractive_complement)\",\n      \"Evaluation of Φ₁ itself (see urn:omega:math:phi1:v1.0.0)\",\n      \"Floating-point or tolerance-based linear algebra\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION mechanisation: the complement parametrisation and the distortion bound are written proofs, not machine-checked; AuthorityEffect: None.\"\n  ]\n}\n",
