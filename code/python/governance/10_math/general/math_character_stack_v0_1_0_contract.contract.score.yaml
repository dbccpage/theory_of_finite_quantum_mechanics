      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:character_stack:v0.1.0\",\n  \"title\": \"Character Stack Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"derived_quotient_stack\",\n    \"symbol\": \"Char(Γ, G) = [Hom(Γ, G)/G], RChar(Γ, G) for derived version\",\n    \"ascii_symbol\": \"character_stack\",\n    \"notation\": \"Char(Γ, G) = [Hom(Γ, G)/G], RChar(Γ, G) for derived version\",\n    \"domain\": [\n      \"source_group: Group Γ (typically fundamental group π_1(X))\",\n      \"gauge_group: Target gauge group G\",\n      \"morphism_space: Space of group homomorphisms Hom(Γ, G)\",\n      \"quotient_action: Conjugation action of G on Hom(Γ, G)\"\n    ],\n    \"codomain\": {\n      \"description\": \"The character stack is a quotient stack [Hom(Γ, G)/G] where Γ is the source group (fundamental group) and G is the gauge group. The derived version RChar(Γ, G) is the derived quotient stack.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Both source group Γ and gauge group G must be valid groups\",\n      \"Stack structure must be correct quotient [Hom(Γ, G)/G]\",\n      \"Derived stack must carry valid shifted symplectic structure (if present)\",\n      \"Artifact hash must be deterministic SHA-256 over all data\"\n    ]\n  },\n  \"laws\": [\n    \"The character stack is the quotient stack [Hom(Γ, G)/G] under conjugation\",\n    \"The derived character stack RChar(Γ, G) carries a shifted symplectic structure\",\n    \"For Γ = π_1(X), Char(Γ, G) parametrizes G-local systems on X\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid source or gauge group must be rejected\",\n    \"Incorrect quotient stack structure must be rejected\",\n    \"Invalid shifted symplectic structure must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A character stack (or character variety stack) parametrizes representations of a fundamental group up to conjugation. Character stacks are derived stacks with shifted symplectic structures central to geometric representation theory.\",\n    \"non_role\": [\n      \"Does not handle non-derived moduli stacks\",\n      \"Does not implement full geometric Langlands duality\",\n      \"Does not provide skein algebra quantization\"\n    ]\n  },\n  \"wip\": [\n    \"Non-abelian Hodge correspondence\",\n    \"Derived character varieties\",\n    \"Factorization homology and character stacks\",\n    \"Contract captures core character stack structure\",\n    \"Shifted symplectic structure validation needs PTVV theory implementation\",\n    \"Geometric Langlands correspondence requires additional gauge theory contracts\",\n    \"Skein algebra quantization deferred to future version\"\n  ]\n}\n",
