    ],
    "doctrine": {
      "summary": "A DeltaMorphism is a morphism f: X -> Y between two delta objects (simplicial objects) that commutes with all face maps d_i and degeneracy maps s_j. In the category of simplicial sets, a DeltaMorphism is a natural transformation between the underlying functors Delta^op -> Set. This contract validates the source, target, component maps, and the simplicial compatibility conditions (naturality with respect to face and degeneracy maps).",
