      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:gamma2_closure_defect:v1.0.0\",\n  \"title\": \"Γ₂ closure defect\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:validated_cochain_complex:v1.0.0\",\n        \"urn:omega:math:raw_closure_defect:v1.0.0\",\n        \"urn:omega:math:hashes:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Secondary closure defect functional.\",\n    \"symbol\": \"Γ₂\",\n    \"ascii_symbol\": \"Gamma2\",\n    \"formula\": \"Γ₂([h]) = ||d₁h||₁\",\n    \"1. Contract metadata\": {\n      \"title\": \"Γ₂ closure defect\",\n      \"version\": \"1.0.0\",\n      \"object_type\": \"closure_defect_functional\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Secondary closure defect functional.\",\n      \"purpose\": \"Measures whether a degree-1 residual is closed after Φ₁ selection.\",\n      \"non_role\": [\n        \"Does not compute obstruction mass.\",\n        \"Does not replace Φ₁.\",\n        \"Does not define cohomology gamma-square Γ².\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"representative_domain\": \"h ∈ C¹, usually h₁* selected by Φ₁/TieR\",\n      \"quotient_domain\": \"[h] ∈ Q¹ only when d₁d₀=0 makes Γ₂ quotient-well-defined\",\n      \"codomain\": \"nonnegative scalar ||d₁h||₁ on C² under declared norm profile\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"h ∈ C¹\",\n        \"d₁:C¹→C²\",\n        \"exactness check d₁d₀=0 for quotient-level interpretation\",\n        \"C² basis\",\n        \"norm on C²\"\n      ],\n      \"norm_profile\": {\n        \"default\": \"unweighted ℓ¹ on C²\",\n        \"optional\": [\n          \"weighted ℓ¹ on C²\",\n          \"declared C² norm profile\"\n        ]\n      }\n    },\n    \"5. Definition\": {\n      \"formula\": \"Γ₂([h]) = ||d₁h||₁ when quotient-well-defined; otherwise Γ₂(h)=||d₁h||₁ as representative-level closure defect.\",\n      \"closed\": \"Closed iff Γ₂ = 0 in exact mode.\",\n      \"open\": \"Open iff Γ₂ > 0 in exact mode.\",\n      \"degree_separation\": \"Γ₂ is impossible without C² and d₁ data.\",\n      \"descends_to_Q1\": \"Γ₂ descends to Q¹ only when d₁d₀ = 0.\",\n      \"tolerance_mode\": \"Γ₂ <= ε may be treated as zero only under declared tolerance profile.\"\n    },\n    \"6. Laws and invariants\": {\n      \"nonnegativity\": \"Γ₂ >= 0.\",\n      \"exact_repair_invariance\": \"If d₁d₀=0, then Γ₂(h+d₀α)=Γ₂(h).\",\n      \"quotient_well_definedness\": \"Γ₂ is independent of representative exactly when d₁d₀=0.\",\n      \"hierarchy\": \"Γ₂ is checked after Φ₁ and cannot accept Φ₁-worsening proposals.\",\n      \"strict_improvement_rule\": \"Γ₂ may decide strict improvement only when Φ₁ is tied.\",\n      \"non_worse_rule\": \"Γ₂ may be checked for non-worsening only after Φ₁ is non-worsening.\",\n      \"classifications\": [\n        \"StabilizedSurvivor iff Φ₁>0 and Γ₂=0.\",\n        \"OpenObstruction iff Φ₁>0 and Γ₂>0.\"\n      ]\n    },\n    \"7. Equality / equivalence rules\": {\n      \"scalar_equality\": \"Exact equality in exact mode; tolerance comparison only with declared tolerance profile.\",\n      \"quotient_well_definedness\": \"Requires d₁d₀=0.\",\n      \"representative_equivalence\": \"If h' = h + d₀α and d₁d₀=0, then Γ₂(h') = Γ₂(h).\",\n      \"tolerance_equivalence\": \"Tolerance-zero does not equal exact zero unless declared by comparison mode.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"d₁h replay.\",\n        \"C² norm replay.\",\n        \"Exactness witness/artifact for d₁d₀=0 if quotient interpretation is claimed.\",\n        \"Tolerance profile if approximate.\",\n        \"Basis/order/carrier hashes match layer.\",\n        \"Norm profile hash is fixed.\",\n        \"No NaN or infinite scalar values.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"Phi1\": \"Secondary after Φ₁.\",\n        \"Z1\": \"Γ₂=0 iff selected residual lies in Z¹ under exact mode.\",\n        \"H1\": \"Γ₂=0 is required before a residual can represent H¹.\",\n        \"Q1\": \"Γ₂ descends to Q¹ only when d₁d₀=0.\",\n        \"Trichotomy\": \"Separates StabilizedSurvivor from OpenObstruction when Φ₁>0.\",\n        \"EvaluationHierarchy\": \"Γ₂ may decide only after Φ₁ tie for strict improvement.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct Gamma2Descriptor {\\n    pub layer_hash: String,\\n    pub d1_hash: String,\\n    pub residual_hash: String,\\n    pub c2_basis_hash: String,\\n    pub c2_norm_profile_hash: String,\\n    pub exactness_artifact_hash: Option<String>,\\n    pub tolerance_profile_hash: Option<String>,\\n    pub quotient_interpretation: bool,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Γ₂ computed without d₁.\",\n        \"Γ₂ computed without C² structure.\",\n        \"Γ₂ claimed as quotient-well-defined when d₁d₀ != 0.\",\n        \"Γ₂ used to accept Φ₁-worsening proposal.\",\n        \"Closure claimed with d₁h != 0 in exact mode.\",\n        \"Closure claimed with ||d₁h|| > ε in tolerance mode.\",\n        \"Γ₂ confused with cohomology gamma-square Γ².\",\n        \"Weighted C² norm used without norm profile.\",\n        \"Representative-level Γ₂ treated as quotient-level Γ₂ without exactness.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Weighted C² norm variants.\",\n        \"Exactness witness/artifact canonical format.\",\n        \"Tolerance-zero predicate for closure.\",\n        \"Whether representative-level Γ₂ should be separately named when d₁d₀ is not verified.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"QUOTIENT_GAMMA2_CONTRACT\": {\n        \"symbol\": \"Γ₂\",\n        \"ascii_symbol\": \"Gamma2\",\n        \"formula\": \"Γ₂([h])=||d₁h||₁\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"h∈C¹ with d₁:C¹→C²; quotient-level only if d₁d₀=0\",\n        \"codomain\": \"nonnegative scalar\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"h\",\n          \"d₁\",\n          \"C² basis\",\n          \"C² norm\",\n          \"d₁d₀=0 for quotient interpretation\"\n        ],\n        \"definition\": \"closure defect; closed iff zero\",\n        \"laws\": [\n          \"nonnegative\",\n          \"descends to Q¹ only if d₁d₀=0\",\n          \"invariant under B¹ shifts when d₁d₀=0\",\n          \"cannot override worse Φ₁\",\n          \"strict Γ₂ improvement only after Φ₁ tie\"\n        ],\n        \"forbidden_interpretations\": [\n          \"GammaSquare/Γ² operation\",\n          \"Γ₂ without C²/d₁\",\n          \"policy classifier\",\n          \"quotient-level Γ₂ without exactness\"\n        ],\n        \"relationships\": [\n          \"secondary after Φ₁\",\n          \"detects membership in Z¹\",\n          \"separates StabilizedSurvivor/OpenObstruction\",\n          \"required before H¹ interpretation\"\n        ],\n        \"negative_tests\": [\n          \"missing d₁\",\n          \"missing C²\",\n          \"nonexact layer\",\n          \"overrides Φ₁\",\n          \"d₁h nonzero but closed\",\n          \"confused with Γ²\"\n        ],\n        \"open_questions\": [\n          \"C² norm profile\",\n          \"exactness artifact format\",\n          \"tolerance-zero predicate\"\n        ]\n      }\n    }\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"gamma2\",\n    \"symbols\": [\n      \"ExactCochainComplexQ\",\n      \"DegreeOneResidualQ\",\n      \"ExactGamma2Result\",\n      \"ClosureStatus\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
