      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:maurer_cartan_equation:v0.1.0\",\n  \"title\": \"Maurer–Cartan Residual Contract (finite cochain deformation check)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_maurer_cartan_residual\",\n    \"symbol\": \"MC(a) = d₁(a) + ½[a,a]₂ ∈ C²\",\n    \"ascii_symbol\": \"maurer_cartan_equation\",\n    \"notation\": \"finite-degree cochain MC residual (diagnostic)\",\n    \"domain\": [\n      \"connection-like 1-cochain a ∈ C¹ (finite)\",\n      \"coboundary d₁ : C¹ → C²\",\n      \"bracket [ , ]₂ : C¹ × C¹ → C² (declared bilinear/graded-symmetric as implemented)\"\n    ],\n    \"codomain\": {\n      \"description\": \"Residual 2-cochain measuring failure of the Maurer–Cartan equation on a finite cochain complex. Full DGLA/L∞ deformation theory is out of scope for this contract instance.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Degree discipline: a in degree 1, MC(a) in degree 2\",\n      \"Declared d and bracket with composable finite dimensions\",\n      \"Deterministic residual evaluation\",\n      \"Residual is diagnostic (Γ₂-channel), not Φ₁ acceptance authority\"\n    ]\n  },\n  \"laws\": [\n    \"Residual law: MC(a) := d(a) + ½[a,a] (coefficients per declared convention).\",\n    \"Flatness witness: MC(a)=0 is the finite flatness check for this a — not a continuum theorem.\",\n    \"Degree law: inputs/outputs live in declared cochain degrees only.\",\n    \"Non-decision law: residual feeds deformation/consistency channels; does not mint authority.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Deterministic residual\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"maurer_cartan\",\n    \"symbols\": [\n      \"Cochain1\",\n      \"Cochain2\"\n    ],\n    \"required_tests\": [\n      \"dimension_mismatch_error\",\n      \"mc_rejects_da_bracket_dimension_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Degree-mixed a (not pure C¹) must be rejected when typed wrappers exist\",\n    \"Dimension mismatch between d(a) and [a,a] must be rejected\",\n    \"Treating nonzero residual as authority accept must be rejected\",\n    \"Claiming full L∞/DGLA theorem package from residual alone must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Finite Maurer–Cartan residual on cochains: MC(a)=d(a)+½[a,a]. Diagnostic for deformation consistency (Γ₂), not continuum DGLA completeness. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge.\",\n    \"non_role\": [\n      \"Full DGLA/L∞ deformation functor theorem package\",\n      \"Continuum gauge theory flatness theorems\",\n      \"Φ₁ acceptance authority\",\n      \"PROVED / GlobalGreen / HoTT discharge\"\n    ],\n    \"legacy_contract_id\": \"urn:math:contract:MaurerCartanEquation:v1.0.0\",\n    \"migration_note\": \"B3 meth: scoped to finite cochain MC residual matching maurer_cartan.rs.\"\n  },\n  \"wip\": [\n    \"Exact rational MC residual vs current f64 demo residual.\",\n    \"Bracket conventions (graded skew, factors of 1/2) must stay fixed per realization.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B3_LEGACY_SHELL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B3: replaced generic DGLA shell with finite MC residual laws; residual f64 vs exact arithmetic noted as code-follows-YAML follow-up.\",\n        \"recommendation\": \"Object-specific math settled for this pass; align code under ADR-007a where YAML is ahead or code still over-scopes. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b3_legacy_shells_meth\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"MATCH_WITH_NUMERIC_RESIDUAL\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_homology/src/maurer_cartan.rs\",\n        \"detail\": \"RS implements degree-disciplined MC residual with Cochain1/2. Uses f64 in places — exactness residual OPEN. Not PROVED.\",\n        \"delta\": \"CODE_NUMERIC_MORE_PERMISSIVE_THAN_EXACT_YAML\"\n      }\n    ]\n  }\n}\n",
