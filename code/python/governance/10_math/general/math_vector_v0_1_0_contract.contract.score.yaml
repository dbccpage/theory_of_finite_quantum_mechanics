      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:vector:v0.1.0\",\n  \"title\": \"Vector Contract (coordinate vector)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"coordinate_vector\",\n    \"symbol\": \"v ∈ V ≅ K^n (column)\",\n    \"ascii_symbol\": \"vector\",\n    \"notation\": \"v = (v_1,…,v_n)^T relative to ordered basis of V\",\n    \"domain\": [\n      \"field K\",\n      \"codomain space V over K with dim n ≥ 0 and ordered basis\",\n      \"components: length-n sequence of elements of K\"\n    ],\n    \"codomain\": {\n      \"description\": \"Element of finite-dimensional vector space V over K as a column of coordinates in a fixed ordered basis. n=0 is the unique zero vector of the zero space.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"n = dim(V) ∈ ℕ₀\",\n      \"len(components) = n\",\n      \"each component ∈ K\",\n      \"basis identity of V is recorded (hash or explicit list)\",\n      \"column convention (map K→V) unless a separate row-vector object is introduced\"\n    ]\n  },\n  \"laws\": [\n    \"Length law: number of components equals dim(V).\",\n    \"Field law: every component is an element of K.\",\n    \"Zero-space law: if n=0 then components is empty and v is the unique zero vector.\",\n    \"Addition law: u+v defined only for equal V (same field, dim, basis identity).\",\n    \"Scalar law: α·v stays in V; α ∈ K.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Component order is basis order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"vector::vector\",\n    \"symbols\": [\n      \"CoordinateVector\"\n    ],\n    \"required_tests\": [\n      \"test_new_dimension_mismatch\",\n      \"test_checked_add_basis_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"components.len() ≠ dim(V) must be rejected\",\n    \"Component not in K must be rejected\",\n    \"Adding vectors with different space/basis identity must be rejected\",\n    \"Scalar from a different field must be rejected\",\n    \"Row-vector claims under column-only convention without a row object must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Vector is a coordinate representation of an element of finite-dim V over K in an ordered basis (column convention). Zero-dimensional V allowed. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge.\",\n    \"non_role\": [\n      \"Norm/inner-product geometry (separate contracts)\",\n      \"Row vectors as maps V→K (separate object if needed)\",\n      \"Infinite-dimensional vectors\",\n      \"Authority / PROVED / GlobalGreen / HoTT discharge\"\n    ]\n  },\n  \"wip\": [\n    \"Canonical '1_K' domain basis encoding for the K→V column view.\",\n    \"Parity between CoordinateVector RS and full field/hash artifact layer.\"\n  ]\n}\n",
