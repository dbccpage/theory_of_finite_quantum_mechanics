      "notation": "v = (v_1,…,v_n)^T relative to ordered basis of V",
      "domain": [
        "field K",
        "codomain space V over K with dim n ≥ 0 and ordered basis",
        "components: length-n sequence of elements of K"
      ],
      "codomain": {
        "description": "Element of finite-dimensional vector space V over K as a column of coordinates in a fixed ordered basis. n=0 is the unique zero vector of the zero space."
      }
    },
    "requirements": {
      "required_structures": [
        "n = dim(V) ∈ ℕ₀",
        "len(components) = n",
        "each component ∈ K",
        "basis identity of V is recorded (hash or explicit list)",
        "column convention (map K→V) unless a separate row-vector object is introduced"
      ]
    },
    "laws": [
      "Length law: number of components equals dim(V).",
      "Field law: every component is an element of K.",
      "Zero-space law: if n=0 then components is empty and v is the unique zero vector.",
      "Addition law: u+v defined only for equal V (same field, dim, basis identity).",
      "Scalar law: α·v stays in V; α ∈ K.",
      "Authority law: no PROVED/GlobalGreen/HoTT from this contract alone."
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No wall-clock dependence",
        "Component order is basis order"
      ]
    },
