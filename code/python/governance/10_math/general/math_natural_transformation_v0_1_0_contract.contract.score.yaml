      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:natural_transformation:v0.1.0\",\n  \"title\": \"Natural Transformation Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"natural_transformation\",\n    \"symbol\": \"η: F ⇒ G\",\n    \"ascii_symbol\": \"natural_transformation\",\n    \"notation\": \"η: F ⇒ G\",\n    \"domain\": [\n      \"source_functor: functor F: C → D\",\n      \"target_functor: functor G: C → D\",\n      \"components: family {η_A | A ∈ Ob(C)}\"\n    ],\n    \"codomain\": {\n      \"description\": \"Family of morphisms η_A: F(A) → G(A) indexed by objects A in source category C\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Source and target functors exist and have compatible domains/codomains\",\n      \"Each component η_A is a valid morphism with correct domain and codomain\",\n      \"Naturality squares commute for all morphisms in source category\",\n      \"StructureArtifact hash is deterministic from functors and components\"\n    ]\n  },\n  \"laws\": [\n    \"F and G have the same source and target categories\",\n    \"For each object A in C, η_A is a morphism in D with dom(η_A) = F(A) and cod(η_A) = G(A)\",\n    \"For all morphisms f: A → B in C, G(f) ∘ η_A = η_B ∘ F(f) in D\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Components indexed by source objects in canonical order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"source_functor_id does not resolve must be rejected\",\n    \"F and G with different source categories must be rejected\",\n    \"Object A with no component η_A must be rejected\",\n    \"Component with dom(η_A) ≠ F(A) must be rejected\",\n    \"G(f) ∘ η_A ≠ η_B ∘ F(f) must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A NaturalTransformation η: F ⇒ G between functors F, G: C → D is a family of morphisms η_A: F(A) → G(A) for each object A in C, satisfying the naturality condition: G(f) ∘ η_A = η_B ∘ F(f) for all f: A → B. The contract validates the component morphisms and naturality squares. Natural transformations are the 2-morphisms of Cat, the 2-category of categories, and form the functor category [C, D] with vertical composition.\",\n    \"non_role\": [\n      \"Modifications (3-morphisms between natural transformations) - handled by higher category contracts\",\n      \"Natural isomorphism verification (separate FactEnvelope)\",\n      \"Yoneda lemma implementation (separate contract)\",\n      \"Extranatural transformations or dinatural transformations\"\n    ]\n  },\n  \"wip\": [\n    \"How to handle natural isomorphisms (all η_A are isomorphisms) - via FactEnvelope or separate contract?\",\n    \"Should modifications (3-morphisms between natural transformations) be in this contract or separate?\",\n    \"How does the Yoneda lemma integration work (natural transformations as elements)?\",\n    \"What is the representation for natural transformations in infinite categories?\",\n    \"Currently targets finite natural transformations with explicit component lists\",\n    \"Natural isomorphisms are important but verification mechanism not yet specified\",\n    \"Modifications (3-morphisms) deferred to higher category contract\",\n    \"Yoneda lemma (expressing natural transformations as elements) in separate contract\",\n    \"Middle four interchange law for horizontal composition requires careful testing\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"natural_trans\",\n    \"symbols\": [\n      \"NaturalTransformation\"\n    ],\n    \"required_tests\": [\n      \"trivial_nat_trans_passes_naturality\"\n    ]\n  }\n}\n",
