      "Object A with no component η_A must be rejected",
      "Component with dom(η_A) ≠ F(A) must be rejected",
      "G(f) ∘ η_A ≠ η_B ∘ F(f) must be rejected"
    ],
    "doctrine": {
      "summary": "A NaturalTransformation η: F ⇒ G between functors F, G: C → D is a family of morphisms η_A: F(A) → G(A) for each object A in C, satisfying the naturality condition: G(f) ∘ η_A = η_B ∘ F(f) for all f: A → B. The contract validates the component morphisms and naturality squares. Natural transformations are the 2-morphisms of Cat, the 2-category of categories, and form the functor category [C, D] with vertical composition.",
      "non_role": [
        "Modifications (3-morphisms between natural transformations) - handled by higher category contracts",
        "Natural isomorphism verification (separate FactEnvelope)",
        "Yoneda lemma implementation (separate contract)",
        "Extranatural transformations or dinatural transformations"
      ]
    },
    "wip": [
      "How to handle natural isomorphisms (all η_A are isomorphisms) - via FactEnvelope or separate contract?",
