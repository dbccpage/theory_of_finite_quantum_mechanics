      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:right_kan_extension:v0.1.0\",\n  \"title\": \"Right Kan Extension Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"functor_extension\",\n    \"symbol\": \"Ran_K(F): C' → D with ε: Ran_K(F) ∘ K → F\",\n    \"ascii_symbol\": \"right_kan_extension\",\n    \"notation\": \"Ran_K(F): C' → D with ε: Ran_K(F) ∘ K → F\",\n    \"domain\": [\n      \"F: functor C → D (to be extended)\",\n      \"K: functor C → C' (along which to extend)\",\n      \"extension: functor Ran_K(F): C' → D\",\n      \"counit: natural transformation ε: Ran_K(F) ∘ K → F\"\n    ],\n    \"codomain\": {\n      \"description\": \"Given functors F: C → D and K: C → C', the right Kan extension consists of: - A functor Ran_K(F): C' → D - A natural transformation ε: Ran_K(F) ∘ K → F (counit) - Universal property: for any G: C' → D and α: G ∘ K → F,\\n  there exists unique β: G → Ran_K(F) with ε ∘ (β * 1_K) = α\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"F, K, and Ran_K(F) preserve composition and identities\",\n      \"ε: Ran_K(F) ∘ K → F is natural\",\n      \"Ran_K(F) satisfies the universal property of right Kan extension\",\n      \"Content hash is deterministically computed via SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"F, K, and Ran_K(F) are functors\",\n    \"ε is a natural transformation\",\n    \"For any G: C' → D and α: G ∘ K → F, there exists unique β: G → Ran_K(F) such that ε ∘ (β * 1_K) = α\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validator functions are content-addressed\",\n      \"Given identical inputs, must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid functor F must be rejected\",\n    \"Invalid functor K must be rejected\",\n    \"Non-natural counit must be rejected\",\n    \"Extension not satisfying universal property must be rejected\",\n    \"Counit with incorrect source must be rejected\",\n    \"Counit with incorrect target must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A right Kan extension is a universal construction extending a functor F: C → D along K: C → C' to a functor Ran_K(F): C' → D. Right Kan extensions provide limits, ends, and general universal constructions in category theory. Given functors F: C → D and K: C → C', the right Kan extension Ran_K(F): C' → D is characterized by a universal natural transformation ε: Ran_K(F) ∘ K → F.\",\n    \"non_role\": [\n      \"Left Kan extensions (separate contract)\",\n      \"Specific limit constructions (use dedicated limit contracts)\",\n      \"∞-categorical Kan extensions (future work)\"\n    ]\n  },\n  \"wip\": [\n    \"Pointwise Kan extensions: characterization and verification\",\n    \"Absolute Kan extensions: definition and properties\",\n    \"∞-categorical Kan extensions: higher coherence structures\",\n    \"Efficient computation of limits over comma categories\",\n    \"Integration with end/coend calculus\",\n    \"Universal property validator requires proof search mechanism\",\n    \"Pointwise formula implementation depends on limit infrastructure\",\n    \"End formula requires enriched category theory support\",\n    \"Connection to adjunctions needs explicit formalization\",\n    \"Future: parametricity for polymorphic Kan extensions\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"limits_colimits\",\n    \"symbols\": [\n      \"KanExtension\"\n    ],\n    \"required_tests\": [\n      \"ran_validate_ok\"\n    ]\n  }\n}\n",
