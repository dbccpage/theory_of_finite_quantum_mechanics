    "math": {
      "object_kind": "universal_cocone",
      "symbol": "colim D or lim→ D",
      "ascii_symbol": "colimit",
      "notation": "colim D or lim→ D",
      "domain": [
        "diagram: Functor D: J → C",
        "colimit_object: Object L in C",
        "coprojections: Family {ι_j: D(j) → L | j ∈ Ob(J)}"
      ],
      "codomain": {
        "description": "A colimit consists of: - A diagram D: J → C (source functor) - An object L in C (the colimit object) - For each j ∈ Ob(J), a morphism ι_j: D(j) → L (coprojections)\n"
      }
    },
    "requirements": {
      "required_structures": [
        "The diagram D: J → C must be a valid functor",
        "L must be an object in category C",
        "Each ι_j must be a morphism D(j) → L in C",
        "For all morphisms f: j → k in J, ι_k ∘ D(f) = ι_j",
        "Any cocone factors uniquely through L"
      ]
    },
    "laws": [
      "For every morphism f: j → k in J, ι_k ∘ D(f) = ι_j",
      "For any cocone (M, μ_j: D(j) → M), there exists a unique morphism u: L → M such that u ∘ ι_j = μ_j for all j ∈ Ob(J)\n"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Coprojections indexed by J's objects in canonical order",
        "Validators and computation functions are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "negative_tests": [
      "diagram_id does not resolve",
      "colimit_object_id does not resolve",
      "ι_j does not have codomain L",
      "ι_k ∘ D(f) ≠ ι_j for some f: j → k",
      "Another cocone cannot factor through L uniquely"
    ],
    "doctrine": {
      "summary": "A Colimit of a diagram D: J → C is a universal cocone under D. It consists of an object L (the colimit) and morphisms ι_j: D(j) → L (the coprojections) such that any other cocone factors uniquely through L. The contract validates the cocone and universality.",
      "non_role": [
        "Does not provide specific colimit constructions (coproduct, pushout, etc.)",
        "Does not compute colimits automatically, only validates given cocones",
        "Does not handle large colimits (requires small diagrams)"
      ]
    },
