      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:primitive_difference:v0.1.0\",\n  \"title\": \"PrimitiveDifference Contract (δ, ZeroRel, finite residual quotient)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"primitive_difference_zero_rel_finite_quotient\",\n    \"symbol\": \"δ : A → A → B,  Zero : B → Prop,  ZeroRel x y := Zero(δ x y)\",\n    \"ascii_symbol\": \"primitive_difference\",\n    \"notation\": \"finite residual quotient of carrier A by ZeroRel\",\n    \"domain\": [\n      \"carrier type A (presentations / objects being compared)\",\n      \"difference codomain B\",\n      \"δ : A → A → B (primitive difference)\",\n      \"Zero : B → Prop (which differences count as no difference)\",\n      \"finite domain list Dom ⊆ A when decidable checks are claimed\"\n    ],\n    \"codomain\": {\n      \"description\": \"A PrimitiveDifference structure induces ZeroRel on A. On a finite declared domain, ZeroRel must be an equivalence; residual quotient classes are the finite quotient of Dom by ZeroRel. Observables that factor through the residual quotient are the admissible (invariant) maps. This is the CODA PrimDiff / zero-rel / finite-quotient kernel — not a set-diff of “primitive atoms.”\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"δ and Zero are total and deterministic on the declared carrier\",\n      \"ZeroRel x y := Zero(δ x y)\",\n      \"On any finite Dom where laws are claimed decidable, ZeroRel is reflexive, symmetric, transitive\",\n      \"Quotient classes are opaque / branded to a carrier when issued by a validated finite carrier\",\n      \"Observables claimed “admissible” must be invariant on ZeroRel pairs (factor through the residual quotient)\",\n      \"No authority effect is self-assigned by δ, Zero, or the quotient\"\n    ]\n  },\n  \"laws\": [\n    \"ZeroRel definition: ZeroRel x y ⇔ Zero(δ x y).\",\n    \"Finite equivalence laws (on Dom): refl / symm / trans of ZeroRel, or construction refuses with witness index.\",\n    \"Delta-congruence (when claimed): if x~x' and y~y' then δ(x,y)=δ(x',y') on Dom.\",\n    \"Factors-through: observable φ is residual-admissible on Dom iff ∀ ZeroRel pairs, φ(x)=φ(y).\",\n    \"Finite only: decidable checks are evidence on Dom, not global theorems over all A.\",\n    \"Authority law: PrimDiff/quotient never mints host AuthorityEffect, proposal accept, or GlobalGreen.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Finite Dom order is part of the evidence when classes are computed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homotopy_type_theory\",\n    \"module\": \"primitive_difference\",\n    \"symbols\": [\n      \"PrimitiveDifference\",\n      \"QuotientClass\",\n      \"FiniteCarrier\",\n      \"ValidatedFiniteCarrier\",\n      \"ZeroLawWitness\",\n      \"DeltaCongruenceWitness\",\n      \"PrimitiveDifferenceError\"\n    ],\n    \"required_tests\": [\n      \"zero_rel_not_reflexive_rejected\",\n      \"zero_rel_not_symmetric_rejected\",\n      \"zero_rel_not_transitive_rejected\",\n      \"observable_descends_iff_congruent_on_domain\",\n      \"cross_carrier_quotient_class_rejected\"\n    ]\n  },\n  \"negative_tests\": [\n    \"ZeroRel not reflexive on Dom must refuse with index witness\",\n    \"ZeroRel not symmetric on Dom must refuse with index witness\",\n    \"ZeroRel not transitive on Dom must refuse with index witness\",\n    \"Observable that splits a ZeroRel pair must not be marked factors-through\",\n    \"Forged quotient class (wrong carrier brand) must not apply under branded apply\",\n    \"Artifact claiming GlobalGreen/PROVED/host auth from PrimDiff alone must be rejected\",\n    \"Using set-diff of 'atoms' as if it were ZeroRel residual quotient must be rejected for this object\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"PrimitiveDifference is the CODA kernel: δ, Zero, ZeroRel, and (on finite Dom) the residual quotient through which admissible observables factor. Dual-face: theory in omega_homotopy_type_theory; serializable judgment rows in omega_types. Lean anchors the axiomatics. None of YAML/Lean/RS/PY mint host authority. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT univalence discharge; finite Dom evidence is not a universal theorem.\\n\",\n    \"non_role\": [\n      \"Host AuthorityEffect / proposal accept / GlobalGreen minting\",\n      \"Continuum/universal proofs over all carriers without finite Dom\",\n      \"Semantic “isomorphism detection” beyond ZeroRel as declared\",\n      \"Automatic reconciliation patches (atlas rows propose; host auths)\",\n      \"Set-diff inventory of unrelated “primitive components” (legacy shell object — retired here)\"\n    ]\n  },\n  \"wip\": [\n    \"Split secondary YAML if set-diff inventory of content-addressed atoms is still needed as a different object\",\n    \"Pair factorization / LGGR pair obstruction full surface parity RS↔PY\",\n    \"PD-L4/L5/L6 finite⇒Lean subtype bridge obligations\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_PRIMDIFF_CODA_REPAIR\",\n        \"severity\": \"high\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"W0 library-spine: prior YAML described added/removed/modified primitives (set-diff). That is a different object. Replaced with CODA PrimDiff/zero-rel/finite quotient matching Lean FOC axiomatics and omega_homotopy_type_theory::primitive_difference.\\n\",\n        \"recommendation\": \"Keep set-diff inventory as a separate YAML if still needed; do not re-merge.\",\n        \"pass\": \"dual_face_w0_primdiff\"\n      },\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"ADR007A_TWO_HOMES\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Two RS homes remain: theory (homotopy_type_theory) and judgment record (omega_types). Declared primary rust_binding = theory module; judgment row types are dual-face records, not a second math object.\\n\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"THEORY_MATCH\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_homotopy_type_theory/src/primitive_difference.rs\",\n        \"yaml_law\": \"δ, Zero, ZeroRel, finite equivalence laws, factors-through\",\n        \"code_behavior\": \"trait PrimitiveDifference + FiniteCarrier validation + quotient classes\",\n        \"detail\": \"Primary theory surface MATCH on core kernel. LGGR/pair surfaces partial. Not PROVED.\",\n        \"delta\": \"MATCH_CORE\"\n      },\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"JUDGMENT_RECORD\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_types/src/primitive_difference.rs\",\n        \"detail\": \"Serializable PrimitiveDifferenceJudgment + thin trait — dual-face record, not full finite checker.\",\n        \"delta\": \"MATCH_AS_RECORD\"\n      },\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"PY_DUAL\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine_py/omega_homotopy_type_theory/primitive_difference.py\",\n        \"detail\": \"PY theory dual exists; omega_types.primitive_difference is thinner judgment record. Parity tests required for W1.\",\n        \"delta\": \"PARTIAL_PY_PARITY\"\n      }\n    ]\n  }\n}\n",
