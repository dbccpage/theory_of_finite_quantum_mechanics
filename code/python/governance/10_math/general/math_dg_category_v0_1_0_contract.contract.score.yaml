      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:dg_category:v0.1.0\",\n  \"title\": \"Differential Graded Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"dg_category\",\n    \"symbol\": \"C = (Ob, Hom^\\\\bullet, d, \\\\circ, id)\",\n    \"ascii_symbol\": \"dg_category\",\n    \"notation\": \"C = (Obj, Hom^\\\\bullet, d, comp, id) with d^2 = 0 and graded Leibniz rule\",\n    \"domain\": [\n      \"objects: (Obj : Type u) collection of 0-cells\",\n      \"graded_homs: (Hom^\\\\bullet : Obj -> Obj -> GradedModule) graded morphism spaces \\\\bigoplus_n Hom^n(X, Y)\",\n      \"differentials: (d : Hom^n(X, Y) -> Hom^{n+1}(X, Y)) cochain differential satisfying d \\\\circ d = 0\",\n      \"graded_composition: (\\\\circ : Hom^m(Y, Z) \\\\times Hom^n(X, Y) -> Hom^{m+n}(X, Z))\",\n      \"identities: id_X \\\\in Hom^0(X, X) satisfying d(id_X) = 0\",\n      \"graded_leibniz_rule: d(g \\\\circ f) = d(g) \\\\circ f + (-1)^{|g|} g \\\\circ d(f)\",\n      \"cohomology_category: H^0(C) where morphisms are degree 0 cocycles modulo coboundaries\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Differential Graded (DG) category is a category enriched over chain complexes of modules. Morphism spaces Hom^\\\\bullet(X, Y) are cochain complexes with differentials d satisfying d^2 = 0. Morphism composition satisfies the graded Leibniz product rule with sign factor (-1)^{|g|}, and identities are closed degree-0 cocycles.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Differential satisfies d^2 = 0 on all graded morphism spaces.\",\n      \"Graded composition strictly satisfies the graded Leibniz rule d(g \\\\circ f) = d(g) \\\\circ f + (-1)^{|g|} g \\\\circ d(f).\",\n      \"Identity elements id_X are degree 0 cocycles with d(id_X) = 0.\",\n      {\n        \"Composition is strictly associative\": \"(h \\\\circ g) \\\\circ f = h \\\\circ (g \\\\circ f).\"\n      },\n      {\n        \"Left and right unit laws hold\": \"id_Y \\\\circ f = f = f \\\\circ id_X.\"\n      },\n      \"Cohomology category H^0(C) is well-defined on closed degree-0 cocycles modulo boundaries.\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Differential nilpotence: d \\\\circ d = 0 for all degrees\",\n    \"Graded Leibniz rule: d(g \\\\circ f) = d(g) \\\\circ f + (-1)^{|g|} g \\\\circ d(f)\",\n    \"Identity closedness: d(id_X) = 0 for all objects X\",\n    \"Graded associativity: (h \\\\circ g) \\\\circ f = h \\\\circ (g \\\\circ f)\",\n    \"Graded units: id_Y \\\\circ f = f = f \\\\circ id_X\",\n    \"Homotopy invariance: chain homotopic morphisms f ~ g induce equal morphisms in H^0(C)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Graded bases and differentials serialized in canonical order\",\n      \"Exact discrete integer degree and sign arithmetic\",\n      \"Deterministic evaluation produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"dg_category\",\n    \"symbols\": [\n      \"DgCategory\",\n      \"GradedHomComplex\",\n      \"DifferentialMap\",\n      \"ChainDifferential\",\n      \"LeibnizSignValidator\",\n      \"CohomologyCategoryH0\"\n    ],\n    \"required_tests\": [\n      \"test_dg_category_basic_lifecycle\",\n      \"test_dg_graded_leibniz_even_and_odd\",\n      \"test_kill_mut_p2_01_broken_differential\",\n      \"test_kill_mut_p2_02_violated_leibniz_sign\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Differential fails nilpotence d^2 != 0 (BrokenDifferential / MUT-P2-01)\",\n    \"Graded Leibniz rule violated with incorrect sign (+1 instead of (-1)^|g|) (ViolatedLeibnizSign / MUT-P2-02)\",\n    \"Identity morphism not closed under differential d(id_X) != 0\",\n    \"Graded composition degree mismatch |g \\\\circ f| != |g| + |f|\",\n    \"Composition fails associativity (h \\\\circ g) \\\\circ f != h \\\\circ (g \\\\circ f)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A DG-category (differential graded category) is a category enriched over chain complexes of modules. Morphism spaces are cochain complexes with differentials d satisfying d^2 = 0, and composition satisfies the graded Leibniz rule with sign factor (-1)^{|g|}. DG categories provide algebraic enhancements for triangulated and derived categories, eliminating non-functorial cone cones.\",\n    \"non_role\": [\n      \"A-infinity categories with higher homotopies m_k for k >= 3\",\n      \"Model category structures on DG-categories\",\n      \"Non-linear or differential geometric manifolds\"\n    ]\n  },\n  \"wip\": [\n    \"Pretriangulated DG structures with twisted complexes and shift functors\",\n    \"DG enhancement of bounded derived category D^b(A)\",\n    \"Exact rational discrete verification of Leibniz sign in Rust\"\n  ]\n}\n",
