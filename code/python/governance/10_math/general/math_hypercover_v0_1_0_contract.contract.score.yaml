      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:hypercover:v0.1.0\",\n  \"title\": \"Hypercover\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"simplicial_object_with_covering_property\",\n    \"symbol\": \"U_• → X in site (C, J)\",\n    \"ascii_symbol\": \"hypercover\",\n    \"notation\": \"U_• → X in site (C, J)\",\n    \"domain\": [\n      \"base_object: X in category C\",\n      \"simplicial_levels: U_n for n ≥ 0\",\n      \"face_maps: d_i: U_n → U_{n-1}\",\n      \"degeneracy_maps: s_i: U_n → U_{n+1}\",\n      \"covering_maps: U_{n+1} → (cosk_n U_•)_{n+1}\"\n    ],\n    \"codomain\": {\n      \"description\": \"Simplicial object U_• in a site (C, J) with U_n objects at each level, face maps d_i: U_n → U_{n-1}, degeneracy maps s_i: U_n → U_{n+1}, and a map U₀ → X to the base object.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The map U₀ → X must be a covering in the site J\",\n      \"For all n ≥ 0, U_{n+1} → (cosk_n U_•)_{n+1} is a covering\",\n      \"Face and degeneracy maps satisfy simplicial relations\",\n      \"Artifact hash is SHA-256 over canonical serialized data\"\n    ]\n  },\n  \"laws\": [\n    \"U₀ → X is a covering in J\",\n    \"U_• satisfies simplicial identities (face/degeneracy relations)\",\n    \"For each n ≥ 0, U_{n+1} → (cosk_n U_•)_{n+1} is a covering\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"Simplicial data serialized in canonical order\",\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"site_id does not resolve to a valid Site\",\n    \"base_object_id does not resolve to object in category\",\n    \"Face/degeneracy relations fail simplicial identities\",\n    \"U₀ → X is not a covering in J(X)\",\n    \"U_{n+1} → cosk_n fails to cover at some level n\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Hypercover is a simplicial object U_• → X in a site that refines coverings at each level: U₀ → X is a covering, U₁ → U₀ ×_X U₀ is a covering of the intersection, and so on. Hypercovers compute cohomology and provide resolution of sheaves. The contract validates the hypercover axioms. # Section 1: description\",\n    \"non_role\": [\n      \"Not responsible for constructing specific hypercovers for given sites\",\n      \"Does not implement cohomology computation algorithms\",\n      \"Does not provide descent theory beyond validation\",\n      \"Not a general simplicial object validator (only hypercover axioms)\"\n    ]\n  },\n  \"wip\": [\n    \"Hypercovers compute sheaf cohomology via homotopy limit - how to integrate?\",\n    \"Verdier's hypercovering theorem relates hypercover cohomology to derived functor cohomology - implementation path?\",\n    \"In ∞-topos, hypercovers are colimit diagrams - higher category theory integration?\",\n    \"Contract defines validation structure but cohomology computation deferred\",\n    \"Bounded vs unbounded hypercovers both supported via truncation_level\",\n    \"Coskeleton computation is deterministic and content-addressed\",\n    \"May need integration with derived category contract for cohomology\"\n  ]\n}\n",
