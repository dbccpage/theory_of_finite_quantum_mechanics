      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:identity_morphism:v0.1.0\",\n  \"title\": \"Identity Morphism Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"morphism\",\n    \"symbol\": \"id_A: A → A\",\n    \"ascii_symbol\": \"identity_morphism\",\n    \"notation\": \"id_A: A → A\",\n    \"domain\": [\n      \"morphism: underlying morphism reference\",\n      \"object: object this is the identity of\"\n    ],\n    \"codomain\": {\n      \"description\": \"Identity arrow id_A: A → A for an object A\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The morphism_id must resolve to a valid Morphism artifact\",\n      \"The object_id must resolve to a valid Object artifact\",\n      \"The morphism must be an endomorphism: domain = codomain = object_id\",\n      \"The morphism must satisfy identity laws for composition\"\n    ]\n  },\n  \"laws\": [\n    \"id_A ∘ f = f for all f: X → A\",\n    \"g ∘ id_A = g for all g: A → Y\",\n    \"domain = codomain = A\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Given same morphism and object, must produce identical artifact hash\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"morphism_id does not resolve to a Morphism artifact\",\n    \"object_id does not resolve to an Object artifact\",\n    \"domain ≠ codomain, not an endomorphism\",\n    \"exists f such that id_A ∘ f ≠ f\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An IdentityMorphism is the identity arrow on an object in a category.  For each object A, the identity id_A: A → A is the neutral element for composition.  The contract validates that the morphism satisfies the identity law.\",\n    \"non_role\": [\n      \"Does not enforce uniqueness structurally (uniqueness is a theorem)\",\n      \"Does not manage category structure directly\",\n      \"Does not handle composite morphisms\"\n    ]\n  },\n  \"wip\": [\n    \"The contract wraps a Morphism with the identity property\",\n    \"Uniqueness of identity is a theorem, not enforced structurally\",\n    \"The relationship with Category: identities are specified in the Category structure\",\n    \"Migrated from markdown format on 2026-05-25\",\n    \"All 11 sections mapped to YAML structure\",\n    \"Ready for implementation in omega-category crate\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"finite_category\",\n    \"symbols\": [\n      \"DeclaredFiniteCategory\",\n      \"ValidatedFiniteCategory\"\n    ],\n    \"required_tests\": [\n      \"try_new_refuses_object_without_identity\"\n    ]\n  }\n}\n",
