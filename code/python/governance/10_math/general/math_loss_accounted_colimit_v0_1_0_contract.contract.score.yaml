    ],
    "doctrine": {
      "summary": "A LossAccountedColimit extends the categorical colimit construction by tracking information loss at each coprojection. Given a diagram D: J -> C, the loss-accounted colimit pairs the colimit object L with a LossLedger that records, for each coprojection iota_j: D(j) -> L, a quantified measure of information lost in the mapping. This is relevant in representation transport, certified comparison, and any setting where colimits involve quotients or identifications that discard structure. The construction is purely mathematical and does not make authority or policy claims.",
      "non_role": [
        "Does not classify admissibility",
