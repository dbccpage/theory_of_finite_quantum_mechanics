a^2 theta_a (this replaces the former statement (ST)^3 = S^2, which holds only for the c-normalised T e^{-2 pi i c/24} and the normalised S = S~ / D)\",\n    \"Gauss-Milgram: p_+ / D = exp(2 pi i c / 8), read exactly as p_+^2 / D^2 = a root of unity of the field\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact field arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Not a braided fusion category\",\n    \"S-matrix incorrectly computed\",\n    \"S-matrix is degenerate (not invertible)\",\n    \"Verlinde formula is violated\",\n    \"(S~ T)^3 != p_+ S~^2\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_fusion_categories\",\n    \"module\": \"modular\",\n    \"symbols\": [\n      \"ModularData\",\n      \"ModularDefect\"\n    ],\n    \"required_tests\": [\n      \"a_symmetric_braiding_gives_a_degenerate_s_matrix_and_is_refused\",\n      \"the_verlinde_formula_fails_on_a_perturbed_s_matrix\",\n      \"fibonacci_modular_data_and_central_charge_are_exact\",\n      \"ising_modular_data_central_charge_and_ground_states_are_exact\",\n      \"the_toric_code_is_modular_with_the_pinned_s_matrix_and_four_to_the_g_ground_states\"\n    ]\n  },\n  \"doctrine\": {\n    \"summary\": \"A modular tensor category (MTC) is a non-degenerate ribbon fusion category. Its modular data (S~, T) satisfy the exact relations above in the coefficient field; the normalised SL_2(Z) relations follow after dividing by D and the c-dependent phase, which are not in general field elements.\",\n    \"non_role\": [\n      \"Does not implement general ribbon categories without modularity\",\n      \"Does not handle infinite-rank categories\",\n      \"Does not provide physical lattice models\"\n    ]\n  },\n  \"wip\": [\n    \"Classification of MTCs by rank\",\n    \"Super-modular categories\",\n    \"Witt group of MTCs\",\n    \"The normalised SL_2(Z) representation is not built; only the in-field relations are checked\",\n    \"Lean counterparts are not written\"\n  ]\n}\n",
