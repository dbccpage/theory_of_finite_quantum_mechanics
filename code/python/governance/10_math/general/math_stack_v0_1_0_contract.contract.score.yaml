      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:stack:v0.1.0\",\n  \"title\": \"Stack Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"pseudofunctor\",\n    \"symbol\": \"F: C^op → Cat satisfying descent for {U_i → U} ∈ J(U)\",\n    \"ascii_symbol\": \"stack\",\n    \"notation\": \"F: C^op → Cat satisfying descent for {U_i → U} ∈ J(U)\",\n    \"domain\": [\n      \"site: Site (C, J) with Grothendieck topology\",\n      \"pseudofunctor: F: C^op → Cat with coherence isomorphisms\",\n      \"descent_data: Descent categories Des({U_i}) for each covering\"\n    ],\n    \"codomain\": {\n      \"description\": \"Pseudofunctor F: C^op → Cat on a site (C, J)\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The site (C, J) must exist and be validated\",\n      \"Object assignment, restriction functors, and coherence isomorphisms must be well-defined\",\n      \"For each covering, F(U) → Des is fully faithful\",\n      \"For each covering, F(U) → Des is essentially surjective\",\n      \"Artifact hash computed as SHA-256 over contract_id, version, site_id, pseudofunctor_hash\"\n    ]\n  },\n  \"laws\": [\n    \"For any covering {U_i → U}, F(U) → Des({U_i}) is fully faithful\",\n    \"For any covering {U_i → U}, F(U) → Des({U_i}) is essentially surjective\",\n    \"Coherence isomorphisms (gf)* ≅ f* g* satisfy cocycle condition\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Pseudofunctor data serialized in canonical order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"site_id does not resolve to a valid Site\",\n    \"Coherence isomorphisms don't satisfy cocycle condition\",\n    \"F(U) → Des not fully faithful for some covering\",\n    \"F(U) → Des not essentially surjective for some covering\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Stack is a category-valued presheaf F: C^op → Cat (or Gpd) on a site (C, J) satisfying the descent condition for objects and morphisms. Stacks generalize sheaves to handle groupoid-valued data. The contract validates descent/gluing for both objects and isomorphisms.\",\n    \"non_role\": [\n      \"Higher stacks (n-stacks for n > 1) or (∞,1)-categorical stacks\",\n      \"Algebraic geometry-specific geometric structure (beyond categorical descent)\",\n      \"Derived stacks or spectral stacks\"\n    ]\n  },\n  \"wip\": [\n    \"Stacks in groupoids (all morphisms invertible) are most common\",\n    \"Algebraic stacks have additional geometric structure\",\n    \"2-sheaves and higher stacks use (∞,1)-categories\",\n    \"Currently supports 1-stacks (Cat-valued presheaves)\",\n    \"Groupoid-valued case is the primary use case for moduli problems\",\n    \"Future work may extend to algebraic stacks with geometric conditions\"\n  ]\n}\n",
