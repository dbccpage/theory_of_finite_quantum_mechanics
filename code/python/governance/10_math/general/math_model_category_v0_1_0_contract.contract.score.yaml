      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:model_category:v0.1.0\",\n  \"title\": \"Model Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"model_category\",\n    \"symbol\": \"M with classes (W, F, C)\",\n    \"ascii_symbol\": \"model_category\",\n    \"notation\": \"M with classes (W, F, C) satisfying Quillen axioms MC1-MC5\",\n    \"domain\": [\n      \"category: underlying_category\",\n      \"weak_equivalences: class_W\",\n      \"fibrations: class_F\",\n      \"cofibrations: class_C\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Quillen model category is a complete and cocomplete category M equipped with three distinguished subcategories of morphisms (Weak Equivalences W, Fibrations F, Cofibrations C) satisfying the two-out-of-three property, retract stability, lifting properties ((W ∩ C) ⋔ F and C ⋔ (W ∩ F)), and functorial factorizations.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Category M has finite limits and colimits.\",\n      \"Weak equivalences satisfy two-out-of-three property.\",\n      \"Acyclic cofibrations (W ∩ C) have left lifting property with respect to fibrations F.\",\n      \"Cofibrations C have left lifting property with respect to acyclic fibrations (W ∩ F).\",\n      \"Any morphism has both required functorial factorizations.\",\n      \"All operations respect OperationLimits and Soviet Builder allocation caps.\",\n      \"Deterministic content-addressed artifact hash.\"\n    ]\n  },\n  \"laws\": [\n    \"Two-out-of-three property for weak equivalences: if f ∘ g is defined and two of {f, g, f ∘ g} are in W, then so is the third\",\n    \"Lifting axioms: (W ∩ C) ⋔ F and C ⋔ (W ∩ F)\",\n    \"Factorization axioms: any morphism f factors as f = p ∘ i with i ∈ W ∩ C, p ∈ F and as f = q ∘ j with j ∈ C, q ∈ W ∩ F\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators and computation functions are content-addressed\",\n      \"Given same data, produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"model_category\",\n    \"symbols\": [\n      \"ModelCategory\",\n      \"ModelMorphism\",\n      \"CommutativeSquare\",\n      \"MorphismFactorizations\"\n    ],\n    \"required_tests\": [\n      \"test_model_category_positive_verification\",\n      \"test_kill_mut_p3_01_two_out_of_three_violation\",\n      \"test_kill_mut_p3_02_lifting_property_violation\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.ModelCategory\",\n    \"symbols\": [\n      \"ModelStructure\",\n      \"HasLiftingProperty\",\n      \"IsAcyclicCofibration\",\n      \"IsAcyclicFibration\",\n      \"identity_factorization\",\n      \"comp_weak_equiv\",\n      \"left_cancel_weak_equiv\",\n      \"right_cancel_weak_equiv\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Weak equivalences fail two-of-three property (MUT-P3-01)\",\n    \"Lifting property fails for acyclic cofibration vs fibration (MUT-P3-02)\",\n    \"Missing morphism in factorization\",\n    \"Factorization intermediate maps not in required classes\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A model category is a category M with three distinguished classes of morphisms (weak equivalences, fibrations, cofibrations) satisfying Quillen's axioms MC1-MC5. Model categories provide an axiomatic framework for abstract homotopy theory.\",\n    \"non_role\": [\n      \"Automatic construction of the homotopy category Ho(M)\",\n      \"Non-functorial factorizations\"\n    ]\n  },\n  \"wip\": [\n    \"Combinatorial and cofibrantly generated model category structures\",\n    \"Quillen adjunctions and Quillen equivalences\"\n  ]\n}\n",
