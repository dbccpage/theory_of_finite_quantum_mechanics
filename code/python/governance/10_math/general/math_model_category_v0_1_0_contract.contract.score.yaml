        "description": "A Quillen model category is a complete and cocomplete category M equipped with three distinguished subcategories of morphisms (Weak Equivalences W, Fibrations F, Cofibrations C) satisfying the two-out-of-three property, retract stability, lifting properties ((W ∩ C) ⋔ F and C ⋔ (W ∩ F)), and functorial factorizations."
      }
    },
    "requirements": {
      "required_structures": [
        "Category M has finite limits and colimits.",
        "Weak equivalences satisfy two-out-of-three property.",
        "Acyclic cofibrations (W ∩ C) have left lifting property with respect to fibrations F.",
        "Cofibrations C have left lifting property with respect to acyclic fibrations (W ∩ F).",
        "Any morphism has both required functorial factorizations.",
        "All operations respect OperationLimits and Soviet Builder allocation caps.",
        "Deterministic content-addressed artifact hash."
      ]
    },
    "laws": [
      "Two-out-of-three property for weak equivalences: if f ∘ g is defined and two of {f, g, f ∘ g} are in W, then so is the third",
      "Lifting axioms: (W ∩ C) ⋔ F and C ⋔ (W ∩ F)",
      "Factorization axioms: any morphism f factors as f = p ∘ i with i ∈ W ∩ C, p ∈ F and as f = q ∘ j with j ∈ C, q ∈ W ∩ F"
    ],
    "replay": {
      "requirements": [
        "No external state",
