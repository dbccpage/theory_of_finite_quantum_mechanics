    "math": {
      "object_kind": "graph_phi1_forest_enumeration",
      "symbol": "Φ₁",
      "ascii_symbol": "GraphPhi1",
      "notation": "Φ₁([c]) = min_{g ∈ ℚ^V} Σ_{(u,v) ∈ E} w_uv |c_uv − (g_v − g_u)|",
      "domain": [
        "finite declared vertex list V with unique names",
        "finite edge list E; each edge names two distinct declared vertices",
        "per-edge rational claim c_uv and strictly positive rational weight w_uv, as strings"
      ],
      "codomain": {
        "description": "GraphPhi1Result: the minimum weighted residual over the enumerated gauges (rational string), a minimizing vertex gauge, and the number of spanning forests enumerated. Or a typed GraphPhi1Error. No dual witness is produced."
      },
      "definition": {
        "formula": "Φ₁([c]) = min_g Σ w_uv |c_uv − (g_v − g_u)|",
        "search": "For every spanning forest of the declared graph, fix the gauge that makes each forest edge residual-free (zero on each component root), evaluate the weighted residual, and keep the first strict minimum. The zero gauge is the initial candidate.",
        "bound": "At most 100000 spanning forests are enumerated; reaching the bound refuses"
      }
    },
    "requirements": {
      "required_structures": [
        "Finite vertex names, unique",
        "Finite edges between distinct declared vertices",
        "Exact rational claims and strictly positive exact rational weights"
      ]
    },
    "laws": [
      "Enumeration law: the returned value is the minimum weighted residual over every spanning-forest-tight gauge and the zero gauge. The search is exhaustive over spanning forests, or it refuses (EnumerationLimit); it never returns a partial minimum.",
      "Optimality basis: equality of that minimum with the quotient infimum rests on the linear-programming fact that this ℓ¹ gauge problem has an optimal basic solution in which a spanning forest of edges is residual-free. This module does not replay that argument or emit a dual witness, so the value is not a replayed primal-dual certificate.",
      "Carrier law: duplicate vertex names, endpoints outside the declared vertices, self edges, unparseable rationals and non-positive weights are refused with typed errors.",
      "Determinism law: for a fixed request the enumeration order, the minimum and the returned gauge are deterministic.",
      "Exactness law: all arithmetic is BigRational; there is no floating-point path.",
      "Separation fence: this is degree-1 Φ₁ on a graph. It computes no Γ₂, because the request declares no 2-cells.",
      "Authority law: the result mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense."
    ],
    "replay": {
      "requirements": [
        "No external state, randomness or wall-clock",
        "Exact rational arithmetic only",
        "Deterministic spanning-forest enumeration order"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "rust_binding": {
      "crate": "omega_solvers",
