        "GraphPhi1Result",
        "GraphPhi1Error",
        "solve_graph_phi1"
      ],
      "required_tests": [
        "rejects_nonpositive_weight",
        "exact_and_inconsistent_triangles",
        "rational_triangle_uses_exact_weighted_minimum",
        "planar_triangular_multi_cycle_b1_2",
        "kagome_trimer_multi_cycle_b1_4"
      ]
    },
    "negative_tests": [
      "A zero edge weight must be rejected"
    ],
    "doctrine": {
      "summary": "solve_graph_phi1 computes the degree-1 weighted ℓ¹ quotient distance of an edge claim on a small declared graph by enumerating spanning-forest gauges, and refuses beyond 100000 forests. It is an exact enumeration, not a primal-dual certificate: no dual witness is returned. Nonclaim: not Γ₂; not authority; not PROVED; not GlobalGreen.",
      "non_role": [
        "Primal-dual certificate replay (see urn:omega:math:phi1:v1.0.0)",
        "Γ₂ or any 2-cell closure defect",
        "Scalable LP solving beyond the enumeration bound",
        "Authority minting, ActionLicense, PROVED or GlobalGreen"
      ]
    },
