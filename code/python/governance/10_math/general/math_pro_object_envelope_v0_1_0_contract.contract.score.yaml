    ],
    "doctrine": {
      "summary": "A ProObjectEnvelope records a pro-object as a formal cofiltered limit \"lim\"_{i in I} X_i together with its index category I, the objects X_i, and the transition morphisms f_{ij}: X_j -> X_i for i <= j. The envelope provides access to finite-level approximations and validates the cofiltering condition, transition compatibility, and functoriality of the diagram.",
      "non_role": [
        "Ind-objects (cofiltered colimits, the dual notion)",
