    "doctrine": {
      "summary": "A derived stack is a stack valued in derived/spectral rings or simplicial rings, encoding \"derived\" moduli problems where the cotangent complex is non-trivial. Derived stacks capture virtual structures and obstruction theory intrinsically. The contract defines functors X: (cdga_k)^op → S (simplicial sets) satisfying descent for étale/smooth topology, with classical truncation t_0(X) as an ordinary stack. The cotangent complex L_X captures deformation theory. Derived stacks handle derived intersections, virtual fundamental classes, and perfect obstruction theories.",
