      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:derived_stack:v0.1.0\",\n  \"title\": \"DerivedStack Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"derived_stack\",\n    \"symbol\": \"X: (cdga_k)^op → S\",\n    \"ascii_symbol\": \"derived_stack\",\n    \"notation\": \"X: (cdga_k)^op → S\",\n    \"domain\": [\n      \"functor: X: (Aff)^op → S\",\n      \"base_category: ∞-category of affines (cdga, E_∞-rings, etc.)\",\n      \"target_category: simplicial sets or ∞-groupoids\",\n      \"topology: étale, smooth, or other Grothendieck topology\",\n      \"descent_data: verification of descent for specified topology\"\n    ],\n    \"codomain\": {\n      \"description\": \"Functor from derived affines to simplicial sets with descent\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Base category is appropriate (cdga, E_∞-rings, etc.)\",\n      \"X is a well-defined functor to spaces\",\n      \"X satisfies descent for the specified topology\",\n      \"StructureArtifact hash is deterministic from functor data\"\n    ]\n  },\n  \"laws\": [\n    \"X is a well-defined functor to spaces\",\n    \"X satisfies descent for the specified topology\",\n    \"t_0(X) is an ordinary stack\",\n    \"L_X exists and captures deformation theory\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All functor data is content-addressed\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid base category must be rejected\",\n    \"Functor not well-defined must be rejected\",\n    \"X not satisfying étale/smooth descent must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A derived stack is a stack valued in derived/spectral rings or simplicial rings, encoding \\\"derived\\\" moduli problems where the cotangent complex is non-trivial. Derived stacks capture virtual structures and obstruction theory intrinsically. The contract defines functors X: (cdga_k)^op → S (simplicial sets) satisfying descent for étale/smooth topology, with classical truncation t_0(X) as an ordinary stack. The cotangent complex L_X captures deformation theory. Derived stacks handle derived intersections, virtual fundamental classes, and perfect obstruction theories.\",\n    \"non_role\": [\n      \"Classical stacks (use ordinary Stack contract)\",\n      \"Non-derived moduli problems (use ordinary moduli stack)\",\n      \"Specific derived moduli schemes (separate FactEnvelopes)\"\n    ]\n  },\n  \"wip\": [\n    \"Quasi-smooth derived stacks have virtual fundamental classes\",\n    \"Derived algebraic geometry (DAG) vs spectral algebraic geometry (SAG)\",\n    \"Derived moduli of sheaves, derived Quot schemes\",\n    \"How to encode specific derived moduli problems as FactEnvelopes?\",\n    \"What validation is needed for perfect obstruction theories?\",\n    \"Contract is in WIP status - derived stack theory is active research area\",\n    \"Descent verification may require sophisticated ∞-categorical machinery\",\n    \"Cotangent complex computation is highly non-trivial\",\n    \"Virtual fundamental classes require perfect obstruction theory\",\n    \"Classical truncation t_0(X) should be verified to be an ordinary stack\"\n  ]\n}\n",
