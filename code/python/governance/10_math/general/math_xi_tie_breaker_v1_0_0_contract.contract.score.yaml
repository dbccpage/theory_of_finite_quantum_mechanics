      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:xi_tie_breaker:v1.0.0\",\n  \"title\": \"Ξ representative-alignment diagnostic\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1:v1.0.0\",\n        \"urn:omega:math:phi1_obstruction_mass:v1.0.0\",\n        \"urn:omega:math:gamma2_closure_defect:v1.0.0\",\n        \"urn:omega:math:residual_projection:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"xi_tie_breaker\",\n    \"ascii_symbol\": \"xi_tie_breaker\",\n    \"symbol\": \"xi_tie_breaker\",\n    \"notation\": \"xi_tie_breaker\",\n    \"domain\": [\n      \"carrier: instance of xi_tie_breaker\"\n    ],\n    \"codomain\": {\n      \"description\": \"Mathematical object declared by Ξ representative-alignment diagnostic (structural shell).\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Carrier for xi_tie_breaker must be finite/explicit where claimed\",\n      \"Object kind and domain/codomain (or equivalent) must be declared\",\n      \"Operations, if any, must preserve declared structure\",\n      \"No authority effect may be self-assigned by the structure\"\n    ]\n  },\n  \"laws\": [\n    \"Ξ representative-alignment diagnostic is a pure mathematical structure (AuthorityEffect none)\",\n    \"All declared required_structures must hold for a valid instance\",\n    \"Replay is deterministic: no ext