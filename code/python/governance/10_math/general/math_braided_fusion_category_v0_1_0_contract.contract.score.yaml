      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:braided_fusion_category:v0.1.0\",\n  \"title\": \"Braided Fusion Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"braided_fusion_category\",\n    \"symbol\": \"R^{ab}_c and theta_a on a multiplicity-free fusion category\",\n    \"ascii_symbol\": \"braided_fusion_category\",\n    \"notation\": \"R^{ab}_c in K^*, theta_a = (1/d_a) sum_c N_{aa}^c d_c R^{aa}_c\",\n    \"domain\": [\n      \"fusion_category: a multiplicity-free fusion category over an exact field K with commutative ring\",\n      \"r_symbols: a nonzero R^{ab}_c for every vertex N_{ab}^c = 1\",\n      \"dimensions: quantum dimensions d_a in K (ribbon structure)\"\n    ],\n    \"codomain\": {\n      \"description\": \"R-symbols satisfying both hexagon equations; with dimensions, the twists theta_a satisfy the balancing relation. The fusion space Hom(total, a_1 x ... x a_n) carries an exact braid-group representation.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The fusion ring is commutative\",\n      \"One nonzero R-symbol at exactly each vertex\",\n      \"Both hexagon equations hold exactly in the field\"\n    ]\n  },\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact field arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"laws\": [\n    \"hexagon: R^{ec}_d [(F^{cab}_d)^-1]_{eg} = sum_f [F^{abc}_d]_{ef} R^{bc}_f [(F^{acb}_d)^-1]_{fg} R^{ac}_g\",\n    \"mirror hexagon: the same with R^{xy}_z replaced by (R^{yx}_z)^-1\",\n    \"twist: theta_a = (1/d_a) sum_c N_{aa}^c d_c R^{aa}_c\",\n    \"balancing: R^{ab}_c R^{ba}_c = theta_c / (theta_a theta_b), theta_{a*} = theta_a, theta_0 = 1\",\n    \"gauge: u^{ab}_c acts by F -> u^{ab}_e u^{ec}_d / (u^{bc}_f u^{af}_d) F and R^{ab}_c -> (u^{ab}_c / u^{ba}_c) R^{ab}_c, preserving both hexagons, the twists and the modular data\",\n    \"braid representation: the generators on a fusion space satisfy sigma_i sigma_{i+1} sigma_i = sigma_{i+1} sigma_i sigma_{i+1} and sigma_i sigma_j = sigma_j sigma_i for |i - j| >= 2, and the full twist (sigma_1 ... sigma_{n-1})^n is the scalar theta_total / theta_a^n\",\n    \"the two hexagon equations are different: a perturbed R can satisfy one and violate the other\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A non-commutative fusion ring must be refused\",\n    \"A missing, unexpected or zero R-symbol must be refused\",\n    \"A perturbed R-symbol must fail the direct hexagon, the mirror hexagon, or both, at exactly the affected index tuples\",\n    \"A dimension vector that is a ring character but disagrees with the F-symbols must be refused\",\n    \"A twist or monodromy violating the balancing relation must be refused\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_fusion_categories\",\n    \"module\": \"braided\",\n    \"symbols\": [\n      \"RSymbols\",\n      \"BraidedFusionCategory\",\n      \"RibbonFusionCategory\",\n      \"HexagonForm\",\n      \"HexagonDefect\",\n      \"BraidedDefect\",\n      \"FusionSpace\"\n    ],\n    \"required_tests\": [\n      \"fibonacci_perturbed_r_symbols_fail_both_hexagons_at_exactly_the_independent_tuples\",\n      \"the_toric_code_with_a_wrong_mutual_braiding_fails_both_hexagons_at_the_independent_tuples\",\n      \"perturbed_ising_r_symbols_fail_the_hexagons_at_the_independent_tuples\",\n      \"fibonacci_braid_generators_obey_the_relations_the_full_twist_and_the_hecke_quadratic\",\n      \"ising_braid_relations_hold_on_mixed_words_with_psi_and_the_unit\",\n      \"fibonacci_gauge_changes_f_but_not_the_modular_data\",\n      \"the_majorana_algebra_is_an_independent_witness_for_the_anyon_braid_generators\"\n    ]\n  },\n  \"doctrine\": {\n    \"summary\": \"R-symbols, both hexagon equations, twists, the balancing relation and exact braid-group representations on fusion spaces, for multiplicity-free commutative fusion categories over exact number fields. The catalog (Ising, Fibonacci, semion, toric code, three-fermion, quantum doubles D(Z_n), cyclic pointed) is validated exactly.\",\n    \"non_role\": [\n      {\n        \"Says nothing about density of a braid image\": \"a bounded closure that exceeds its bound is not a certificate of density\"\n      },\n      \"Does not handle fusion multiplicity N > 1\",\n      \"Makes no statement about any material or device\"\n    ]\n  },\n  \"wip\": [\n    \"Fibonacci is given in the algebraic gauge; its unitary gauge needs phi^(-1/2), which lies in no cyclotomic field\",\n    \"SU(2)_k and other higher-rank categories have rings but no F- or R-symbols yet\",\n    \"Lean counterparts are not written\"\n  ]\n}\n",
