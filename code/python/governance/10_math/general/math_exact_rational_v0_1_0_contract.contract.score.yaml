      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_rational:v0.1.0\",\n  \"title\": \"Exact Rational Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_number_field\",\n    \"symbol\": \"Q, with exact square roots and the squarefree part n = f s^2\",\n    \"ascii_symbol\": \"exact_rational\",\n    \"notation\": \"Q, with exact square roots and the squarefree part n = f s^2\",\n    \"domain\": [\n      \"numerator: arbitrary-precision integer\",\n      \"denominator: nonzero arbitrary-precision integer\",\n      \"radicand: arbitrary-precision integer, for the squarefree part\"\n    ],\n    \"codomain\": {\n      \"description\": \"Rationals in lowest terms; exact square roots of rational squares; the unique pair (f, s) with n = f s^2, f squarefree, s >= 1.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Rationals are kept in lowest terms with a positive denominator; unreduced spellings are reduced before any decision\",\n      \"A square root is returned only when the value is the exact square of a rational\",\n      \"The squarefree part is decided exactly or refused with a typed error; it is never guessed\",\n      \"No floating point appears in any operation\"\n    ]\n  },\n  \"laws\": [\n    \"sqrt_exact(q)^2 = q whenever it returns a value, and it returns the nonnegative root\",\n    \"integer_sqrt(n) = max r >= 0 with r^2 <= n < (r+1)^2 for n >= 0\",\n    \"n = f * s^2 with f squarefree (carrying the sign of n) and s >= 1; 0 = 0 * 1^2\",\n    \"An unreduced rational and its reduction have the same square-root decision\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"rational\",\n    \"symbols\": [\n      \"Rational\",\n      \"sqrt_exact\",\n      \"is_rational_square\",\n      \"integer_sqrt\",\n      \"checked_integer_sqrt\",\n      \"exact_integer_sqrt\",\n      \"is_perfect_square\",\n      \"squarefree_part\",\n      \"squarefree_part_with_limit\",\n      \"ArithmeticError\",\n      \"checked_ratio\"\n    ],\n    \"required_tests\": [\n      \"integer_sqrt_is_the_floor_square_root_on_every_small_input\",\n      \"integer_sqrt_of_a_negative_is_zero_and_the_checked_form_refuses\",\n      \"perfect_squares_are_recognised_and_non_squares_and_negatives_are_not\",\n      \"sqrt_exact_decides_squares_of_reduced_and_unreduced_spellings\",\n      \"squarefree_part_satisfies_its_defining_identity_on_every_small_integer\",\n      \"squarefree_part_refuses_rather_than_guesses_beyond_the_limit\",\n      \"squarefree_part_limit_above_the_maximum_is_refused\",\n      \"checked_ratio_refuses_a_zero_denominator_and_reduces_otherwise\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A square root of a negative rational must be refused (None)\",\n    \"A square root of a rational that is not a square must be refused (None), never approximated\",\n    \"A squarefree part that needs factoring beyond the trial-division limit must be refused with SquarefreePartUndecided\",\n    \"A trial-division limit above the declared maximum must be refused\",\n    \"A zero denominator must be refused by the checked constructor\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact rational arithmetic and the integer routines that number fields rest on: floor and exact square roots, perfect-square tests, and the squarefree part of an integer by bounded trial division with a typed refusal beyond the limit.\",\n    \"non_role\": [\n      \"Factorisation of large integers\",\n      \"Floating-point approximation of roots\",\n      \"Any operational authority\"\n    ]\n  },\n  \"wip\": [\n    \"rq() still panics on a zero denominator by design (literal helper); data paths use checked_ratio\",\n    \"No Lean counterpart exists for the squarefree decomposition\"\n  ]\n}\n",
