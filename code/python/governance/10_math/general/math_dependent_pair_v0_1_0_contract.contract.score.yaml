      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:dependent_pair:v0.1.0\",\n  \"title\": \"DependentPair Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"sigma-type\",\n    \"symbol\": \"Sigma(a:A). B(a)\",\n    \"ascii_symbol\": \"dependent_pair\",\n    \"notation\": \"Sigma(a:A). B(a)\",\n    \"domain\": [\n      \"base_type: Type A\",\n      \"fiber_family: Type family B : A -> Type\",\n      \"first_component: Element a : A (the base/witness)\",\n      \"second_component: Element b : B(a) (the fiber element)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A pair (a, b) where a : A and b : B(a), with B a type family over A\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"first_component_hash must resolve to a valid element of base type A\",\n      \"fiber_family_hash must resolve to a valid type family B over A\",\n      \"second_component_hash must resolve to an element b : B(a)\",\n      \"Artifact hash must be deterministic from base, family, and fiber element\"\n    ]\n  },\n  \"laws\": [\n    \"The second component b must inhabit B(a) for the declared first component a\",\n    \"The first component a must be a valid element of A\",\n    \"The type family B must be well-formed over A\",\n    \"pi1(a,b) = a and pi2(a,b) = b, with pi2 typed in B(pi1(a,b))\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Fiber membership check is deterministic from base and fiber element\",\n      \"Same inputs must produce identical artifact hash\"\n    ]\n  },\n  \"negative_tests\": [\n    \"first_component_hash does not resolve to valid element of A\",\n    \"fiber_family_hash does not resolve to valid type family\",\n    \"Second component does not inhabit fiber B(a)\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"DependentPair represents the sigma type Sigma(a:A). B(a) from dependent type theory. It consists of a pair (a, b) where a is an element of base type A and b is an element of the fiber B(a). The first projection extracts a, and the second projection extracts b. The contract validates that the second component genuinely inhabits the type determined by the first component.\",\n    \"non_role\": [\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates\",\n      \"Does not terminalize\",\n      \"Does not produce customer-facing claims\",\n      \"Does not handle dependent function types (Pi types)\",\n      \"Does not handle identity types or path types\"\n    ]\n  },\n  \"wip\": [\n    \"How to encode the type family B concretely for content-addressing\",\n    \"Relationship between DependentPair and DependentPacket: is packet just a transport wrapper?\",\n    \"Should we support eta-expansion (a, b) = pair for DependentPair?\",\n    \"Connection to existential types and proof-relevant witnesses\",\n    \"Currently targets finite, concrete type families\",\n    \"Pi types (dependent function types) are separate contracts\",\n    \"Identity/path types not yet in scope\",\n    \"May need extensionality principle: pairs equal iff both projections equal\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"category::fibered_category\",\n    \"symbols\": [\n      \"FiberedCategoryShell\"\n    ],\n    \"required_tests\": [\n      \"test_fibered_category_projection\",\n      \"test_fibered_category_cleavage\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
