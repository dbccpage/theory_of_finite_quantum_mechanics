    "doctrine": {
      "summary": "DependentPair represents the sigma type Sigma(a:A). B(a) from dependent type theory. It consists of a pair (a, b) where a is an element of base type A and b is an element of the fiber B(a). The first projection extracts a, and the second projection extracts b. The contract validates that the second component genuinely inhabits the type determined by the first component.",
