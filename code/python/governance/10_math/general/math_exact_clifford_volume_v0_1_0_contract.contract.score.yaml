      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_clifford_volume:v0.1.0\",\n  \"title\": \"Exact Clifford Families and Graded Volume\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_clifford_volume\",\n    \"symbol\": \"exact_clifford_volume\",\n    \"ascii_symbol\": \"exact_clifford_volume\",\n    \"notation\": \"Exact Clifford Families and Graded Volume\",\n    \"domain\": [\n      \"Declared exact Clifford matrices with metric signs plus/minus one\",\n      \"Dense admission at matrix dimension <=64 and at most 128 generators; standard constructor n<=12; ordered-product rank n<=8\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_lie_theory::clifford; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Every anticommutator equals 2 eta_mu delta_mu_nu I\",\n    \"Volume square is (-1)^(n(n-1)/2) times the metric-sign product\",\n    \"Even families have a normalized chirality involution anticommuting with every gamma\",\n    \"Standard minimal complex representations span the complete matrix algebra\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_lie_theory\",\n    \"module\": \"clifford\",\n    \"symbols\": [\n      \"CliffordFamily\",\n      \"CliffordFamily::admit\",\n      \"CliffordFamily::euclidean\",\n      \"CliffordFamily::minkowski\",\n      \"CliffordFamily::volume_square\",\n      \"CliffordFamily::chirality\",\n      \"CliffordFamily::product_span_rank\",\n      \"jordan_wigner_operator\"\n    ],\n    \"required_tests\": [\n      \"exact_clifford_families_have_the_declared_volume_square_chirality_and_full_matrix_span\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Exact perturbations break admission; empty/mismatched families, odd chirality and oversized standard constructions are refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Every anticommutator equals 2 eta_mu delta_mu_nu I; Volume square is (-1)^(n(n-1)/2) times the metric-sign product; Even families have a normalized chirality involution anticommuting with every gamma; Standard minimal complex representations span the complete matrix algebra.\",\n    \"non_role\": [\n      \"No floating spin representation or symbolic classification of every Clifford module\",\n      \"Dense operation bounds remain part of the domain\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle