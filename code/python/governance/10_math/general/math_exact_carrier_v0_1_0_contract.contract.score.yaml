},\n  \"laws\": [\n    \"Exactness of differential: d∘d = 0 holds exactly on the carrier (construction refuse on fail).\",\n    \"Finiteness: each C^k is finite-rank free (ranks in ℕ₀).\",\n    \"Degree discipline: differentials shift degree by exactly one (sign convention fixed per instance).\",\n    \"Cycles: ker(d_k) is the cycle module at degree k; boundaries im(d_{k-1}) ⊆ ker(d_k).\",\n    \"Homology is quotient bookkeeping H_k = ker/im — definitional, not a theorem discharge here.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Exact scalar arithmetic for d∘d checks\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"exact_carrier\",\n    \"symbols\": [\n      \"CarrierError\",\n      \"matrix_content_hash\"\n    ],\n    \"required_tests\": [\n      \"maps_with_non_composable_shapes_must_be_rejected\",\n      \"cochain_relation_enforced\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Maps with non-composable shapes must be rejected\",\n    \"Construction claiming exactness when d∘d ≠ 0 must fail\",\n    \"Floating-point approximate zero used as exact d∘d witness must be rejected for this object\",\n    \"Infinite-rank claims under this finite carrier contract must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact Carrier is a finite cochain/chain complex with exact d∘d=0 bookkeeping over exact scalars. Supports precise homology/cohomology residual accounting. Legacy urn:math:contract:ExactCarrier migrated. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge.\",\n    \"non_role\": [\n      \"Abstract infinite category theory / six-functor formalisms\",\n      \"Continuum cohomology of manifolds\",\n      \"Authority, customer claims, PROVED/GlobalGreen/HoTT discharge\",\n      \"Floating-point spectral claims as exactness witnesses\"\n    ],\n    \"legacy_contract_id\": \"urn:math:contract:ExactCarrier:v1.0.0\",\n    \"migration_note\": \"B3 meth: replaced generic shell with finite exact cochain carrier laws aligned to omega_homology exact_carrier intent.\"\n  },\n  \"wip\": [\n    \"Canonical chain vs cochain orientation package across all consumers.\",\n    \"Full symbol export list for Carrier types beyond hash/error surface.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B3_LEGACY_SHELL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B3: demoted legacy shell prose; defined finite exact cochain carrier with d∘d=0; kept mathematical_wip.\",\n        \"recommendation\": \"Object-specific math settled for this pass; align code under ADR-007a where YAML is ahead or code still over-scopes. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b3_legacy_shells_meth\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"PARTIAL_MATCH\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_homology/src/exact_carrier.rs\",\n        \"detail\": \"RS implements finite carrier with exact rational d∘d checks. Residual import/TODO debt and