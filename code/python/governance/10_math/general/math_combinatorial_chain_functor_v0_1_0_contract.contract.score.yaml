          "d_1(e) = t(e) - s(e) is uniquely determined by the graph orientation",
          "C_n(G; R) is the free R-module on the n-dimensional cells of G",
          "For graph morphism f: G -> H, F(f) . d^G = d^H . F(f)",
          "C_n(G; R) = 0 for n >= 2 and n < 0 (graph complex is 2-term)"
