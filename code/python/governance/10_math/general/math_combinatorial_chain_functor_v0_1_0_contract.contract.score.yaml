          "How should the functor extend to simplicial complexes? The clique complex or flag complex of a graph provides a natural simplicial structure with higher-dimensional cells (triangles, tetrahedra, etc.), yielding nontrivial C_n for n >= 2. Should this be a separate contract or a parameterized extension?\n",
