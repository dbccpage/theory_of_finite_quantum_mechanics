      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:site:v0.1.0\",\n  \"title\": \"Site Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"site\",\n    \"symbol\": \"(C, J)\",\n    \"ascii_symbol\": \"site\",\n    \"notation\": \"(C, J)\",\n    \"domain\": [\n      \"category: underlying category C\",\n      \"topology: Grothendieck topology J on C\"\n    ],\n    \"codomain\": {\n      \"description\": \"A pair (C, J) where C is a category and J is a Grothendieck topology on C.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The category_id must resolve to a valid Category artifact\",\n      \"The topology_id must resolve to a valid GrothendieckTopology artifact\",\n      \"The topology must be defined on the given category\",\n      \"Site artifact hash must be deterministic\"\n    ]\n  },\n  \"laws\": [\n    \"C must be a valid category\",\n    \"J must be a valid Grothendieck topology\",\n    \"J must be defined on category C\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"category_id does not resolve to a valid Category\",\n    \"topology_id does not resolve to a valid GrothendieckTopology\",\n    \"topology is not defined on the given category\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Site is a category C equipped with a Grothendieck topology J. It provides the categorical foundation for sheaf theory, generalizing open covers in topological spaces. The contract validates the underlying category and the coverage structure.\",\n    \"non_role\": [\n      \"Does not define sheaves themselves (see sheaf_on_site contract)\",\n      \"Does not provide computational topology tools\",\n      \"Does not handle concrete topological space constructions\"\n    ]\n  },\n  \"wip\": [\n    \"Subcanonical sites (representables are sheaves) are important\",\n    \"Sites with enough points allow stalks at all points\",\n    \"Comparison with locale theory and pointless topology\",\n    \"Contract is in WIP status awaiting implementation of validators\",\n    \"Covering family computation algorithms need optimization\",\n    \"Integration with sheaf_on_site contract pending\"\n  ]\n}\n",
