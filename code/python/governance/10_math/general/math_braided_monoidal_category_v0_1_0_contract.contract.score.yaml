        "right_unitor: natural isomorphism rho_X: tensorObj X unit -> X",
        "double_braiding: beta_{Y,X} o beta_{X,Y}: tensorObj X Y -> tensorObj X Y"
      ],
      "codomain": {
        "description": "A braided monoidal category is a monoidal category equipped with a natural isomorphism braiding beta_{X,Y}: X tensor Y -> Y tensor X satisfying the two Mac Lane hexagon coherence axioms."
      }
    },
    "requirements": {
      "required_structures": [
        "The underlying monoidal category must satisfy bifunctoriality and all monoidal axioms.",
        "The associator pentagon coherence diagram and unitor triangle diagram commute.",
        "The braiding beta must be a natural isomorphism between tensorObj X Y and tensorObj Y X.",
        "The braiding must satisfy Hexagon Axiom 1 relating beta_{X, tensorObj Y Z} to beta_{X,Y} and beta_{X,Z}.",
        "The braiding must satisfy Hexagon Axiom 2 relating beta_{tensorObj X Y, Z} to beta_{X,Z} and beta_{Y,Z}.",
        "Each component beta_{X,Y} must have a two-sided inverse beta^{-1}_{X,Y}.",
        "Artifact hash is deterministically computed from monoidal and braiding data."
      ]
    },
    "laws": [
      "Braiding naturality: comp (tensorHom f g) (braiding X2 Y2).hom = comp (braiding X1 Y1).hom (tensorHom g f)",
      "Hexagon Axiom 1: comp (associator X Y Z).hom (comp (braiding X (tensorObj Y Z)).hom (associator Y Z X).hom) = comp (tensorHom (braiding X Y).hom (cat.id Z)) (comp (associator Y X Z).hom (tensorHom (cat.id Y) (braiding X Z).hom))",
      "Hexagon Axiom 2: comp (associator X Y Z).inv (comp (braiding (tensorObj X Y) Z).hom (associator Z X Y).inv) = comp (tensorHom (cat.id X) (braiding Y Z).hom) (comp (associator X Z Y).inv (tensorHom (braiding X Z).hom (cat.id Y)))",
      "Braiding isomorphism: comp (braiding X Y).hom (braiding X Y).inv = cat.id (tensorObj X Y) and comp (braiding X Y).inv (braiding X Y).hom = cat.id (tensorObj Y X)",
      "Monoidal pentagon: comp (tensorHom (associator W X Y).hom (cat.id Z)) (comp (associator W (tensorObj X Y) Z).hom (tensorHom (cat.id W) (associator X Y Z).hom)) = comp (associator (tensorObj W X) Y Z).hom (associator W X (tensorObj Y Z)).hom",
      "Monoidal triangle: comp (associator X unit Y).hom (tensorHom (cat.id X) (leftUnitor Y).hom) = tensorHom (rightUnitor X).hom (cat.id Y)"
    ],
