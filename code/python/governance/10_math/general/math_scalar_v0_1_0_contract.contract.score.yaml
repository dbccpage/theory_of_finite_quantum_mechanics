      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:scalar:v0.1.0\",\n  \"title\": \"Scalar Contract (field element as K^1)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"field_element_as_1d_vector\",\n    \"symbol\": \"s ∈ K ≅ K^1\",\n    \"ascii_symbol\": \"scalar\",\n    \"notation\": \"s as the unique coordinate of an element of the 1-dimensional space K\",\n    \"domain\": [\n      \"field K\",\n      \"dimension 1\",\n      \"canonical basis [1_K]\"\n    ],\n    \"codomain\": {\n      \"description\": \"An element of field K, optionally viewed as a 1×1 matrix / 1-dimensional vector over K.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared dimension is 1 when using the K^1 view\",\n      \"Value is a valid element of K\",\n      \"Field identity is consistent across operations\",\n      \"0 has no multiplicative inverse\"\n    ]\n  },\n  \"laws\": [\n    \"Element law: s ∈ K.\",\n    \"One-dim law: as a vector, dim=1 and basis is canonical [1_K].\",\n    \"Field ops: + and · are the field operations of K.\",\n    \"Inverse law: s^{-1} defined only for s ≠ 0.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Canonical field element encoding when serialized\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"scalars\",\n    \"symbols\": [\n      \"Semiring\",\n      \"Ring\",\n      \"Field\"\n    ],\n    \"required_tests\": [\n      \"z5_is_exact_field\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Dimension ≠ 1 under K^1 view must be rejected\",\n    \"Value not in K must be rejected\",\n    \"invert(0) must error\",\n    \"Operations across different field identities must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"binding_review_20261014\": \"zero, one, add and mul are Semiring requirements; try_inv is a Field requirement. Bind the actual traits, not nonexistent top-level functions. Trait declarations alone do not establish the field laws of every implementation.\",\n    \"summary\": \"Scalar is an element of a field K, optionally as the unique coordinate of K^1. Atomic value type for products and scaling. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge.\",\n    \"non_role\": [\n      \"Ordered-field positivity facts (separate)\",\n      \"Floating-point rounding policy\",\n      \"Authority / PROVED / GlobalGreen / HoTT discharge\"\n    ]\n  },\n  \"wip\": [\n    \"Whether a scalar is a special case of Vector(n=1) or a distinct primitive remains open.\",\n    \"No Scalar newtype is defined in omega_linear_algebra::scalars; dim=1 is not a type-level witness here.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B1_LINEAR_ALGEBRA\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B1 meth: clarified K^1 view and inverse law; relationship URNs omega-normalized; Agent-1 added thin Scalar<K: Field> newtype with DIM=1 and try_inv None at zero.\",\n        \"recommendation\": \"Continue object-specific meth; align code under ADR-007a after YAML settles. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b1_linear_algebra_meth\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"SHAPE_METHOD_SURFACE_MATCH\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_linear_algebra/src/scalars.rs\",\n        \"detail\": \"rust_binding → omega_linear_algebra::scalars::Scalar<K: Field> with DIM=1, field ops, try_inv None at zero. Inverse law MATCH. Ordered-field / float policy ε. AuthorityEffect None; not PROVED / GlobalGreen.\\n\",\n        \"delta\": \"MATCH_SHAPE\",\n        \"residual_epsilon\": \"K^1 vs Vector(n=1) object fence open; no runtime field-identity tags\"\n      }\n    ]\n  }\n}\n",
