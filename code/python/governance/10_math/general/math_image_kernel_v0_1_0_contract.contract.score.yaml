      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:image_kernel:v0.1.0\",\n  \"title\": \"Image and Kernel Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"image_kernel_pair\",\n    \"symbol\": \"Im(f), Ker(f) for f: V → W\",\n    \"ascii_symbol\": \"image_kernel\",\n    \"notation\": \"Im(f), Ker(f) for f: V → W\",\n    \"domain\": [\n      \"linear_map: linear_map_f\",\n      \"image: Im(f) = {f(v) : v ∈ V} ⊆ W\",\n      \"kernel: Ker(f) = {v ∈ V : f(v) = 0} ⊆ V\",\n      \"rank: dim(Im(f))\",\n      \"nullity: dim(Ker(f))\"\n    ],\n    \"codomain\": {\n      \"description\": \"Image and kernel subspaces of a linear map\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"All computations use a sealed CheckedExactField (Rational64 or BigRational, with no integer primitives permitted)\",\n      \"RREF computation produces unique canonical form\",\n      \"Image basis uses original matrix pivot columns (not RREF columns)\",\n      \"Kernel basis constructed from free variable assignments\",\n      \"rank + nullity = domain dimension\",\n      \"Both image and kernel bases are linearly independent\"\n    ]\n  },\n  \"laws\": [\n    \"Im(f) ⊆ W (subspace of codomain)\",\n    \"Ker(f) ⊆ V (subspace of domain)\",\n    \"dim(V) = dim(Im(f)) + dim(Ker(f))\",\n    \"∀v ∈ Ker(f), f(v) = 0\",\n    \"Image basis vectors are linearly independent\",\n    \"Kernel basis vectors are linearly independent\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact rational arithmetic via CheckedExactField (no floating-point, no integer truncation)\",\n      \"Canonical RREF algorithm (unique output)\",\n      \"Artifact existence verified via content-addressing\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::image_kernel\",\n    \"symbols\": [\n      \"ExactRowReduction\",\n      \"RankRref\",\n      \"RawSubspaceBasis\",\n      \"ExactLinearAlgebraError\",\n      \"solve_in_image\",\n      \"ImageMembership\",\n      \"ImageMembershipWitness\"\n    ],\n    \"required_tests\": [\n      \"image_membership_rejects_dimension_mismatch\",\n      \"rank_plus_nullity_equals_domain_dimension\",\n      \"kernel_basis_vectors_map_to_zero\",\n      \"image_basis_vectors_are_linearly_independent\",\n      \"kernel_basis_vectors_are_linearly_independent\",\n      \"rank_and_rref_is_deterministic\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid matrix dimensions or out-of-bounds access must be rejected\",\n    \"rank + nullity != domain_dimension must be rejected\",\n    \"Vector not mapping to zero must not be in kernel basis\",\n    \"Linearly dependent image basis vectors must be rejected\",\n    \"Linearly dependent kernel basis vectors must be rejected\",\n    \"Non-canonical RREF form must be rejected\",\n    \"Same inputs producing different outputs must be rejected\",\n    \"Integer primitive matrices (e.g. BasicMatrix<i64>) must fail compilation (CheckedExactField sealed)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"This contract defines the image (range) Im(f) and kernel (nullspace) Ker(f) of a linear map f: V → W between finite-dimensional vector spaces over an exact field K. The image is the set of all outputs {f(v) : v ∈ V} ⊆ W, and the kernel is the set of all inputs mapping to zero {v ∈ V : f(v) = 0} ⊆ V. The contract guarantees the rank-nullity theorem: dim(V) = dim(Im(f)) + dim(Ker(f)). This implementation uses exact rational arithmetic via sealed CheckedExactField protocol (Rational64 and BigRational) with row reduction (RREF) to compute basis representations for both subspaces (one_oears.md ruling 4).\",\n    \"non_role\": [\n      \"Orthogonal bases (requires inner product structure)\",\n      \"Approximate numerical computation (use exact rational arithmetic)\",\n      \"Infinite-dimensional spaces (only finite-dimensional vector spaces)\",\n      \"Change-of-basis tracking (basis identity is opaque)\",\n      \"Continuous maps (discrete linear algebra only)\"\n    ]\n  },\n  \"wip\": [\n    \"Should we provide orthogonal bases via Gram-Schmidt (requires inner product)?\",\n    \"How to handle rational overflow detection and recovery?\",\n    \"Should we expose RREF as a separate FactEnvelope?\",\n    \"How to integrate with higher-level VectorSpace/Subspace contracts?\",\n    \"Should we provide change-of-basis tracking for bases?\",\n    \"Rational64 enforced by i64 OverflowCeiling refusal with fallback to BigRational\",\n    \"Integer primitives fail at compile time via sealed CheckedExactField\",\n    \"Bases are ''raw'' (no coordinate system identity attached)\",\n    \"Image basis uses original matrix columns (geometric interpretation)\",\n    \"Kernel basis uses standard free variable construction\",\n    \"RREF is computed once and reused for both image and kernel\",\n    \"No caching of RREF results across multiple queries\",\n    \"Thread-safe (immutable operations only)\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; never promote from this block alone\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"STAGE1_MECHANICAL_PASS\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Mechanical GTLA field gates passed (authority/math/non_role/structures/laws-or-requirements/negative_tests). Not PROVED.\",\n        \"recommendation\": \"Repair under meth-level math re-review; not GlobalGreen.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"MODULE_PATH_ALIGNED\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_linear_algebra/src/linear_algebra/image_kernel.rs\",\n        \"yaml_law\": \"rust_binding.module: linear_algebra::image_kernel; rank-nullity; CheckedExactField generics (Rational64, BigRational)\",\n        \"code_behavior\": \"File lives under linear_algebra::image_kernel (re-exported at crate::image_kernel). Symbols ExactRowReduction, RankRref, RawSubspaceBasis, ExactLinearAlgebraError, solve_in_image, ImageMembership, ImageMembershipWitness present. Exact checked Rational64 and BigRational RREF with sealed CheckedExactField protocol.\\n\",\n        \"detail\": \"Module path and sealed field protocol match YAML intent; integer primitives refused.\\n\",\n        \"delta\": \"MATCH_EXACT\"\n      }\n    ]\n  }\n}\n",
