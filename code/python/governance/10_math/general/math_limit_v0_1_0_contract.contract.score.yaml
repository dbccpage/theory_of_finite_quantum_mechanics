      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:limit:v0.1.0\",\n  \"title\": \"Limit Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"universal_construction\",\n    \"symbol\": \"lim D = (L, {π_j: L → D(j)}_{j ∈ Ob(J)})\",\n    \"ascii_symbol\": \"limit\",\n    \"notation\": \"lim D = (L, {π_j: L → D(j)}_{j ∈ Ob(J)})\",\n    \"domain\": [\n      \"diagram: Functor D: J → C\",\n      \"limit_object: Object L in C\",\n      \"projections: Morphisms π_j: L → D(j) for each j ∈ Ob(J)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A limit consists of: (1) a diagram D: J → C (functor from index category J to category C), (2) an object L in C (the limit object), (3) projection morphisms π_j: L → D(j) for each object j in J, satisfying the cone commutativity condition and universal property.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The diagram D: J → C must exist and be a valid functor\",\n      \"The limit object L must be an object in category C\",\n      \"Each projection π_j must be a morphism L → D(j) in C\",\n      \"For each f: j → k in J, D(f) ∘ π_j = π_k must hold\",\n      \"Every cone must factor uniquely through the limit\"\n    ]\n  },\n  \"laws\": [\n    \"For each morphism f: j → k in J, D(f) ∘ π_j = π_k\",\n    \"For any cone (M, {μ_j: M → D(j)}), there exists a unique morphism u: M → L such that π_j ∘ u = μ_j for all j ∈ Ob(J)\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Projections indexed by J's objects in canonical order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"diagram_id does not resolve\",\n    \"limit_object_id does not resolve\",\n    \"π_j does not have domain L\",\n    \"D(f) ∘ π_j ≠ π_k for some morphism f\",\n    \"Another cone cannot factor through L uniquely\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Limit of a diagram D: J → C is a universal cone over D. It consists of an object L (the limit) and morphisms π_j: L → D(j) (the projections) such that any other cone factors uniquely through L. The contract validates the cone and universality.\",\n    \"non_role\": [\n      \"This contract does not handle colimits (dual construction)\",\n      \"This contract does not compute limits automatically\",\n      \"This contract does not verify completeness of categories\"\n    ]\n  },\n  \"wip\": [\n    \"Verifying the universal property requires checking all cones, which is infinite in general. For finite categories, exhaustive check is possible.\",\n    \"How to efficiently verify universal property for infinite categories?\",\n    \"Limits are unique up to unique isomorphism - should we auto-generate isomorphism witnesses?\",\n    \"Products, terminal objects, equalizers, pullbacks are special cases of limits\",\n    \"Consider implementing a finite category checker for exhaustive universal property verification\",\n    \"May need to add optional 'proof_term' field for constructive proofs of universal property\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"limits_colimits\",\n    \"symbols\": [\n      \"Limit\"\n    ],\n    \"required_tests\": [\n      \"validate_ok\",\n      \"validate_rejects_bad_cone\"\n    ]\n  }\n}\n",
