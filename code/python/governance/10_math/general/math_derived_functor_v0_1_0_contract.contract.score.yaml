      "Non-derivable functor must be rejected",
      "Resolution-dependent result must be rejected"
    ],
    "doctrine": {
      "summary": "A derived functor is the total derived functor of a functor between abelian or model categories. For F: A → B, the derived functor LF or RF is computed using resolutions and captures the \"homotopically correct\" version of F. This contract defines the structure, validation, and computational requirements for derived functors in the Omega Engine.",
      "non_role": [
