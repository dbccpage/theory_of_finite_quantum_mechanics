      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bounded_derived_category:v0.1.0\",\n  \"title\": \"Bounded Derived Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"bounded_derived_category\",\n    \"symbol\": \"D^b(A) \\\\subset D(A)\",\n    \"ascii_symbol\": \"bounded_derived_category\",\n    \"notation\": \"D^b(A) = { X^\\\\bullet \\\\in Ch(A) | \\\\exists N, \\\\forall |n| > N, H^n(X^\\\\bullet) = 0 }\",\n    \"domain\": [\n      \"abelian_category: base abelian category A\",\n      \"bounded_complexes: subcategory of complexes X^\\\\bullet with bounded cohomology: \\\\exists a, b, \\\\forall n < a \\\\lor n > b, H^n(X) = 0\",\n      \"boundedness_variants: D^b (bounded), D^+ (bounded below), D^- (bounded above)\",\n      \"triangulated_structure: full triangulated subcategory structure inherited from D(A)\",\n      \"cohomology_bounds: exact integer bounds [lower_bound, upper_bound] for non-vanishing cohomology\"\n    ],\n    \"codomain\": {\n      \"description\": \"The bounded derived category D^b(A) is the full triangulated subcategory of D(A) consisting of complexes whose cohomology vanishes in all but finitely many degrees. It is the primary setting for coherent sheaf theory and Serre duality.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Base category A is abelian.\",\n      {\n        \"All objects satisfy bounded cohomology\": \"H^n(X) = 0 for |n| >> 0.\"\n      },\n      \"Closed under translation [1] and [-1].\",\n      {\n        \"Closed under mapping cones\": \"if X, Y in D^b(A), then C(f) in D^b(A).\"\n      },\n      \"Full embedding into D(A).\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Vanishing cohomology: \\\\exists a, b \\\\in Z such that H^n(X) = 0 for all n < a and n > b\",\n    \"Triangulated subcategory closure: distinguished triangle on X, Y in D^b(A) implies cone object Z in D^b(A)\",\n    \"Shift stability: H^n(X[k]) = H^{n+k}(X), preserving finite cohomological support\",\n    \"Quasi-isomorphism preservation: every quasi-isomorphism between bounded complexes inverts within D^b(A)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cohomology bounds and complexes serialized in canonical order\",\n      \"Exact integer degree bounds; deterministic hashing\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"bounded_derived\",\n    \"symbols\": [\n      \"BoundedDerivedCategory\",\n      \"BoundedComplex\",\n      \"CohomologyBoundValidator\"\n    ],\n    \"required_tests\": [\n      \"test_bounded_derived_category_and_truncation\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Complex with unbounded cohomology asserted as bounded\",\n    \"Mapping cone of bounded complexes escapes declared degree bounds\",\n    \"Non-abelian base category\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The bounded derived category D^b(A) restricts the derived category to complexes with cohomology supported in finitely many degrees. It forms a full triangulated subcategory and is the foundational framework for coherent sheaves, Fourier-Mukai transforms, and Bridgeland stability conditions.\",\n    \"non_role\": [\n      \"Unbounded derived categories D(A)\",\n      \"Ind-coherent and pro-coherent extensions\",\n      \"Infinite direct sums / Brown representability\"\n    ]\n  },\n  \"wip\": [\n    \"Bound propagation algorithm across mapping cones in Rust\",\n    \"Full subcategory verification in Lean 4\",\n    \"Exact discrete cohomology vanishing checks\"\n  ]\n}\n",
