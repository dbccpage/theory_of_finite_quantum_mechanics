      "ascii_symbol": "composition_law",
      "notation": "g ∘ f",
      "domain": [
        "morphisms: set of morphisms in the category",
        "composition_function: partial function Mor × Mor → Mor"
      ],
      "codomain": {
        "description": "The composition law is defined on the set of morphisms in a category. For morphisms f: A → B and g: B → C where cod(f) = dom(g), the composition g ∘ f: A → C exists.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Composition must be defined for all composable pairs of morphisms",
        "Composition must satisfy (h ∘ g) ∘ f = h ∘ (g ∘ f) for all composable triples",
        "g ∘ f is only defined when cod(f) = dom(g)",
        "Composition must be deterministic: same inputs always produce same output"
      ]
    },
    "laws": [
      "For all composable triples f, g, h: (h ∘ g) ∘ f = h ∘ (g ∘ f)",
      "For f: A → B and g: B → C: dom(g ∘ f) = dom(f) = A",
      "For f: A → B and g: B → C: cod(g ∘ f) = cod(g) = C"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Composition triples sorted canonically",
        "Validators and composition functions are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "negative_tests": [
      "category_id does not resolve to a valid Category",
      "Composable pair (f, g) has no defined composite",
      "g ∘ f has domain ≠ domain(f)",
      "g ∘ f has codomain ≠ codomain(g)",
      "(h ∘ g) ∘ f ≠ h ∘ (g ∘ f) for some composable triple"
    ],
    "doctrine": {
      "summary": "A CompositionLaw defines how morphisms compose in a category. Given f: A → B and g: B → C, the composition g ∘ f: A → C is defined. The law must satisfy associativity. The contract validates the composition table or function.",
      "non_role": [
        "This contract does not handle horizontal composition in 2-categories",
