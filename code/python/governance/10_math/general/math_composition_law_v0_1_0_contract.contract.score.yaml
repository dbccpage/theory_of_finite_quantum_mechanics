      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:composition_law:v0.1.0\",\n  \"title\": \"Composition Law Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"binary_operation\",\n    \"symbol\": \"g ∘ f\",\n    \"ascii_symbol\": \"composition_law\",\n    \"notation\": \"g ∘ f\",\n    \"domain\": [\n      \"morphisms: set of morphisms in the category\",\n      \"composition_function: partial function Mor × Mor → Mor\"\n    ],\n    \"codomain\": {\n      \"description\": \"The composition law is defined on the set of morphisms in a category. For morphisms f: A → B and g: B → C where cod(f) = dom(g), the composition g ∘ f: A → C exists.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Composition must be defined for all composable pairs of morphisms\",\n      \"Composition must satisfy (h ∘ g) ∘ f = h ∘ (g ∘ f) for all composable triples\",\n      \"g ∘ f is only defined when cod(f) = dom(g)\",\n      \"Composition must be deterministic: same inputs always produce same output\"\n    ]\n  },\n  \"laws\": [\n    \"For all composable triples f, g, h: (h ∘ g) ∘ f = h ∘ (g ∘ f)\",\n    \"For f: A → B and g: B → C: dom(g ∘ f) = dom(f) = A\",\n    \"For f: A → B and g: B → C: cod(g ∘ f) = cod(g) = C\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Composition triples sorted canonically\",\n      \"Validators and composition functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"category_id does not resolve to a valid Category\",\n    \"Composable pair (f, g) has no defined composite\",\n    \"g ∘ f has domain ≠ domain(f)\",\n    \"g ∘ f has codomain ≠ codomain(g)\",\n    \"(h ∘ g) ∘ f ≠ h ∘ (g ∘ f) for some composable triple\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A CompositionLaw defines how morphisms compose in a category. Given f: A → B and g: B → C, the composition g ∘ f: A → C is defined. The law must satisfy associativity. The contract validates the composition table or function.\",\n    \"non_role\": [\n      \"This contract does not handle horizontal composition in 2-categories\",\n      \"This contract does not provide composition in bicategories or weak categories\",\n      \"This contract does not handle monoidal composition (tensor products)\"\n    ]\n  },\n  \"wip\": [\n    \"Should this contract be merged with Category or kept separate for modularity?\",\n    \"How to handle large categories where table representation is impractical?\",\n    \"What is the contract structure for higher composition in 2-categories?\",\n    \"Contract is closely tied to Category; modularity vs. integration trade-off\",\n    \"Function representation needed for large/infinite categories\",\n    \"Higher composition (2-categories, bicategories) requires separate contract\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"finite_category_validation\",\n    \"symbols\": [\n      \"check_composition_totality\",\n      \"check_composition_closure\",\n      \"check_composition_boundaries\",\n      \"check_associativity\"\n    ],\n    \"required_tests\": [\n      \"associativity_failure_is_detected\",\n      \"noncomposable_composition_fails\"\n    ]\n  }\n}\n",
