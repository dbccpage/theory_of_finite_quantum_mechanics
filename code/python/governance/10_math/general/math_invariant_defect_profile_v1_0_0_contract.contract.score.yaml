          "certify_now(",
          "evaluate_admissibility(",
          "apply_operator_now(",
          "self_declare_effect_class",
          "commutative_signature",
          "order_free_classifier"
        ]
      },
      "required_tests": [
        "invariant_defect_profile_is_order_sensitive",
        "invariant_defect_profile_distinguishes_noncommuting_operators",
        "invariant_defect_profile_confers_no_authority",
        "invariant_defect_profile_records_per_invariant_effect_word",
        "invariant_defect_profile_equivalence_is_reflexive_symmetric_transitive"
      ],
      "canonical_invariant": "An InvariantDefectProfile is the order-sensitive per-invariant effect word of an operator's normal form. It classifies operators (Operator-Shadow, Theorem 7.1), confers no authority, is not an operator, and is distinct from both the obstruction-class SHA fingerprint and the order-free severity aggregate.\n",
      "references": [
