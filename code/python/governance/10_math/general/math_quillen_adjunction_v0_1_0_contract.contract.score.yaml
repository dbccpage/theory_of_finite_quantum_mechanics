      "summary": "A Quillen adjunction between model categories M and N is an adjunction F ⊣ G where F preserves cofibrations and G preserves fibrations (equivalently, F preserves acyclic cofibrations or G preserves acyclic fibrations). It induces an adjunction on homotopy categories.",
