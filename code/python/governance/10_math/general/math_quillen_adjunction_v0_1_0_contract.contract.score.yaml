      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quillen_adjunction:v0.1.0\",\n  \"title\": \"Quillen Adjunction Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quillen_adjunction\",\n    \"symbol\": \"F: M ⇆ N :G\",\n    \"ascii_symbol\": \"quillen_adjunction\",\n    \"notation\": \"F: M ⇆ N :G\",\n    \"domain\": [\n      \"source_model: model category M\",\n      \"target_model: model category N\",\n      \"left_functor: F: M → N (left adjoint)\",\n      \"right_functor: G: N → M (right adjoint)\",\n      \"adjunction: adjunction data for F ⊣ G\"\n    ],\n    \"codomain\": {\n      \"description\": \"Pair of model categories (M, N) with functors F: M → N, G: N → M forming an adjunction F ⊣ G satisfying the Quillen condition.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Source and target are valid model categories\",\n      \"F: M → N and G: N → M are functors between the model categories\",\n      \"F and G form a categorical adjunction F ⊣ G\",\n      \"Either (F preserves cofibrations and acyclic cofibrations) OR (G preserves fibrations and acyclic fibrations)\\n\"\n    ]\n  },\n  \"laws\": [\n    \"F ⊣ G forms a categorical adjunction\",\n    \"F preserves cofibrations and acyclic cofibrations (equivalently: F is left Quillen)\\n\",\n    \"G preserves fibrations and acyclic fibrations (equivalently: G is right Quillen)\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\",\n      \"Computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Source or target lacks model structure\",\n    \"F ⊣ G fails adjunction verification\",\n    \"F doesn't preserve cofibrations\",\n    \"G doesn't preserve fibrations\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Quillen adjunction between model categories M and N is an adjunction F ⊣ G where F preserves cofibrations and G preserves fibrations (equivalently, F preserves acyclic cofibrations or G preserves acyclic fibrations). It induces an adjunction on homotopy categories.\",\n    \"non_role\": [\n      \"Does not implement general adjunctions between arbitrary categories\",\n      \"Does not verify Quillen equivalences (only adjunctions)\",\n      \"Does not compute total derived functors or higher homotopy categories\"\n    ]\n  },\n  \"wip\": [\n    \"Quillen adjunctions induce ∞-categorical adjunctions\",\n    \"A Quillen adjunction is a Quillen equivalence if LF ⊣ RG is an equivalence\",\n    \"Ken Brown's lemma: F preserves weak equivalences between cofibrant objects\",\n    \"Current implementation validates basic Quillen conditions\",\n    \"Derived functor computation assumes cofibrant/fibrant replacement exists\",\n    \"Quillen equivalence detection not yet implemented\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"model_category\",\n    \"symbols\": [\n      \"ModelCategory\",\n      \"CommutativeSquare\"\n    ],\n    \"required_tests\": [\n      \"test_model_category_positive_verification\",\n      \"test_kill_mut_p3_02_lifting_property_violation\"\n    ]\n  }\n}\n",
