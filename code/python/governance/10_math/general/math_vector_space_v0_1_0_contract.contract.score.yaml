      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:vector_space:v0.1.0\",\n  \"title\": \"VectorSpace Contract (finite-dimensional, ordered basis)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_dimensional_vector_space\",\n    \"symbol\": \"V ∈ Vect_K^{fin}\",\n    \"ascii_symbol\": \"vector_space\",\n    \"notation\": \"V ≅ K^n with ordered basis (n ≥ 0)\",\n    \"domain\": [\n      \"field K\",\n      \"dimension n ∈ ℕ₀\",\n      \"ordered basis B = (b_1,…,b_n) with |B|=n (empty when n=0)\"\n    ],\n    \"codomain\": {\n      \"description\": \"Finite-dimensional vector space over K equipped with an ordered basis. n=0 is the zero space with empty basis.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"n ∈ ℕ₀ (zero space allowed)\",\n      \"len(ordered_basis) = n\",\n      \"field K is declared and shared by all vectors in V\",\n      \"basis identity is content-addressable when hashed\",\n      \"linear independence of B is required when a verifier is attached; hash-only admission is wip residual\"\n    ]\n  },\n  \"laws\": [\n    \"Dimension law: dim(V)=n with n ≥ 0.\",\n    \"Basis length law: ordered basis has exactly n elements.\",\n    \"Zero-space law: n=0 ⇒ unique zero vector and empty basis.\",\n    \"Field law: V is a vector space over a single field K.\",\n    \"Span law: declared basis is intended as a basis (span + independence) when verified.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Deterministic basis serialization when hashes are used\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"linear_algebra::vector_space\",\n    \"symbols\": [\n      \"FiniteVectorSpace\"\n    ],\n    \"required_tests\": [\n      \"geometric_vector_rejects_coordinate_basis_dimension_mismatch\",\n      \"space_rejects_basis_dimension_mismatch\",\n      \"geometric_vector_rejects_basis_mismatch\",\n      \"space_rejects_coordinate_dimension_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"len(ordered_basis) ≠ n must be rejected\",\n    \"Mismatched basis hash vs basis list must be rejected\",\n    \"Invalid or missing field declaration must be rejected\",\n    \"Dependent basis must be rejected when independence verifier is engaged\",\n    \"Vectors claiming membership with wrong space identity must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"VectorSpace is a finite-dimensional K-vector space with an ordered basis, including the zero space n=0. Carrier for vectors and domain/codomain of linear maps. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge.\",\n    \"non_role\": [\n      \"Normed/inner-product/topological structure\",\n      \"Infinite-dimensional spaces\",\n      \"Abstract spaces without any declared basis presentation\",\n      \"Authority / PROVED / GlobalGreen / HoTT discharge\"\n    ]\n  },\n  \"wip\": [\n    \"Independence verification may be deferred; hash-only admission is residual.\",\n    \"Isomorphism classes vs concrete basis presentations are intentionally distinct.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B1_LINEAR_ALGEBRA\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B1 meth: allowed dim n=0 zero space; removed hard reject of dimension=0; kept independence verification as conditional/wip.\",\n        \"recommendation\": \"Continue object-specific meth; align code under ADR-007a after YAML settles. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b1_linear_algebra_meth\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"PARTIAL_REALIZATION\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_linear_algebra/src/linear_algebra/vector_space.rs\",\n        \"detail\": \"FiniteVectorSpace metadata present; ordered-basis hash verifier residual. Not PROVED.\",\n        \"delta\": \"YAML_AHEAD_OF_CODE\"\n      }\n    ]\n  }\n}\n",
