      "object_kind": "sheaf",
      "symbol": "F ∈ Sh(C, J)",
      "ascii_symbol": "sheaf_on_site",
      "notation": "F ∈ Sh(C, J)",
      "domain": [
        "site: (C, J) where C is a category and J is a Grothendieck topology",
        "presheaf: F: C^op → Set",
        "sheaf_condition: F(U) ≅ lim_{V → U ∈ S} F(V) for all S ∈ J(U)"
      ],
      "codomain": {
        "description": "A presheaf F: C^op → Set together with a site (C, J) such that the sheaf condition holds for all covering sieves.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "The site (C, J) must exist and be valid",
        "The presheaf F must exist and be defined on C",
        "For all U and all S ∈ J(U), the map F(U) → lim_{V → U ∈ S} F(V) must be an isomorphism\n"
      ]
    },
    "laws": [
      "For every object U and every covering sieve S ∈ J(U), the natural map F(U) → lim_{(f: V → U) ∈ S} F(V) is an isomorphism.\n",
      "For every covering family {f_i: U_i → U}, if sections s_i ∈ F(U_i) agree on all overlaps (i.e., s_i|_{U_i ×_U U_j} = s_j|_{U_i ×_U U_j}), then there exists a unique section s ∈ F(U) such that s|_{U_i} = s_i.\n"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Validators are content-addressed"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
    "negative_tests": [
      "site_id does not resolve",
      "presheaf_id does not resolve",
      "Presheaf not defined on site category C",
      "F(U) → lim F(V) is not an isomorphism for some covering sieve"
    ],
    "doctrine": {
      "summary": "A SheafOnSite is a presheaf F: C^op → Set on a site (C, J) that satisfies the sheaf condition with respect to the Grothendieck topology J. The contract validates the descent/gluing property.",
      "non_role": [
        "Sheafification (associating a sheaf to any presheaf)",
        "Topos structure on Sh(C, J)",
        "Geometric morphisms"
      ]
    },
    "wip": [
      "Sheafification: associates a sheaf to any presheaf",
      "For subcanonical topologies, all representables are sheaves",
