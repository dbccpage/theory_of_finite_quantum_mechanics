      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:phi3_quotient_obstruction:v1.0.0\",\n  \"title\": \"Φ₃ degree-3 quotient obstruction certificate replay and Γ₃ defect evaluation\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"phi3_certificate_replay\",\n    \"symbol\": \"Φ₃\",\n    \"ascii_symbol\": \"Phi3\",\n    \"notation\": \"Φ₃([H]) = min_{B ∈ C²} ‖H − d₂B‖_{1,ν};  Γ₃(B) = ‖d₂B‖_{1,ν}\",\n    \"domain\": [\n      \"caller-supplied rational matrix d₂ : C² → C³ (|C₃| rows, |C₂| columns)\",\n      \"optional caller-supplied d₁ : C¹ → C² and d₀ : C⁰ → C¹\",\n      \"flux H ∈ C³, 3-cell weights ν, potential B ∈ C², residual r, dual u, reported value\"\n    ],\n    \"codomain\": {\n      \"description\": \"verify_exact_certificate returns VerifiedExactPhi3, a sealed wrapper around the replayed certificate, or a typed ExactPhi3CertificateError. evaluate_bianchi_defect returns the exact rational ‖d₂B‖_{1,ν} or a typed error. Neither searches for a minimizer.\"\n    },\n    \"definition\": {\n      \"formula\": \"Φ₃([H]) = min_B ‖H − d₂B‖_{1,ν}\",\n      \"dual\": \"max ⟨H, u⟩ subject to d₂ᵀu = 0 and |u_c| ≤ ν_c\",\n      \"acceptance\": \"r = H − d₂B, d₂ᵀu = 0, |u_c| ≤ ν_c, ν_c > 0, reported ≥ 0, Σ ν_c|r_c| = reported = ⟨H, u⟩\",\n      \"closure_defect\": \"Γ₃(B) = Σ_c ν_c |(d₂B)_c| with ν_c > 0\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Finite rational d₂ with one row per 3-cell and one column per 2-cell\",\n      \"Strictly positive rational 3-cell weights ν\",\n      \"Flux H, residual r and dual u of 3-cell length; potential B of 2-cell length\",\n      \"Optional d₁, used to check d₂d₁ = 0; optional d₀, used with d₁ to check d₁d₀ = 0\"\n    ]\n  },\n  \"laws\": [\n    \"Weak-duality law: for every B and every u with d₂ᵀu = 0 and |u_c| ≤ ν_c, ⟨H, u⟩ ≤ ‖H − d₂B‖_{1,ν}. A replayed certificate with equal primal and dual values reports the LP minimum for the supplied d₂, ν and H.\",\n    \"Primal replay law: every residual entry must equal (H − d₂B)_c in exact rational arithmetic.\",\n    \"Dual replay law: u must satisfy d₂ᵀu = 0 on every 2-cell and |u_c| ≤ ν_c on every 3-cell.\",\n    \"Weight law: every 3-cell weight must be strictly positive, in the verifier and in evaluate_bianchi_defect.\",\n    \"Chain-law scope: d₂d₁ = 0 is checked only when d₁ is supplied, and d₁d₀ = 0 only when both d₁ and d₀ are supplied. The code calls d₂d₁ = 0 the discrete Bianchi identity; it is the chain law d∘d = 0 on the supplied matrices, not a differential-geometric theorem.\",\n    \"Defect law: if B = d₁A and d₂d₁ = 0 then Γ₃(B) = 0. evaluate_bianchi_defect computes Γ₃ for any supplied B; it does not check d₂d₁ = 0 itself.\",\n    \"Carrier fence: the verifier checks the supplied matrices. It does not check that they are the coboundaries of a declared cell complex, and it computes no Betti number.\",\n    \"Exactness law: all arithmetic is BigRational; there is no floating-point path.\",\n    \"Separation fence: Φ₃ is a degree-3 quotient distance and Γ₃ a degree-3 closure mass. Neither is Φ₁, Γ₂ or Ξ.\",\n    \"Authority law: a replayed certificate or evaluated defect mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Exact rational arithmetic only\",\n      \"Deterministic replay of the submitted primal and dual witness\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"phi3\",\n    \"symbols\": [\n      \"ExactPhi3CertificateWire\",\n      \"ExactPhi3Certificate\",\n      \"VerifiedExactPhi3\",\n      \"ExactPhi3CertificateError\",\n      \"Phi3Functional\"\n    ],\n    \"required_tests\": [\n      \"test_simplex4_rejects_non_closed_3_chain\",\n      \"test_bianchi_defect_rejects_non_positive_weights\",\n      \"test_simplex4_chain_laws_and_valid_b3_certificate\",\n      \"test_bianchi_identity_exact_flux_has_zero_defect\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A dual witness that is not a closed 3-cycle (d₂ᵀu ≠ 0) must be rejected\",\n    \"Γ₃ evaluation with a zero or negative 3-cell weight must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Phi3Functional replays a submitted exact rational primal-dual witness for the degree-3 weighted ℓ¹ quotient distance min_B ‖H − d₂B‖_{1,ν}, and evaluates the degree-3 closure mass ‖d₂B‖_{1,ν}. Acceptance means the reported value is the LP minimum for the supplied matrices and weights, by weak duality. Nonclaim: no cell-complex, cohomology or physical-field certification; no minimizer search; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Minimizer search or LP solving\",\n      \"Cell-complex or Betti-number certification\",\n      \"Differential-geometric Bianchi identity or physical field claims\",\n      \"Φ₁, Γ₂ or Ξ\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION untested_refusals: DualNormBoundViolation, DualValueMismatch, PrimalResidualMismatch, PrimalValueMismatch, NegativeReportedValue, BianchiNilpotenceViolation, CochainNilpotenceViolation, verifier NonPositiveWeight and the dimension refusals are implemented with no dedicated unit test; AuthorityEffect: None.\",\n    \"OPEN_OBLIGATION d0_without_d1: a d₀ supplied without d₁ is ignored rather than refused, so no chain law is checked for it. Phi4Functional refuses the same shape with MissingD1ForD0; AuthorityEffect: None.\"\n  ]\n}\n",
