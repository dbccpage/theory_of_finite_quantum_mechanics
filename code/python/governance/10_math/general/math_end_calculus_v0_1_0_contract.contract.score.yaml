      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:end_calculus:v0.1.0\",\n  \"title\": \"End Calculus Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"computational_calculus\",\n    \"symbol\": \"∫_c F(c,c)\",\n    \"ascii_symbol\": \"end_calculus\",\n    \"notation\": \"∫_c F(c,c)\",\n    \"domain\": [\n      \"categories: Category instances involved\",\n      \"bifunctors: Bifunctors F: C^op × C → D\",\n      \"end_expression: ∫_c F(c,c) formula\"\n    ],\n    \"codomain\": {\n      \"description\": \"End formulas over bifunctors F: C^op × C → D, producing universal wedges satisfying dinaturality conditions\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"All bifunctors must be well-defined functors\",\n      \"Dinaturality conditions must be satisfied\",\n      \"End computation must follow standard formulas\",\n      \"Artifact hash must be deterministic SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"For each f: c → c' in C, the diagram F(c,c) → F(c,c') → F(c',c') equals F(c,c) → F(c',c) → F(c',c')\\n\",\n    \"End ∫_c F(c,c) is universal among all wedges satisfying dinaturality\\n\",\n    \"∫_c ∫_d F(c,d) ≃ ∫_{(c,d)} F(c,d)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\",\n      \"Computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid bifunctors must be rejected\",\n    \"Dinaturality failure must be rejected\",\n    \"Incorrect computation must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"End calculus is the systematic use of ends and their properties to compute and manipulate categorical constructions. End calculus provides computational tools for natural transformations, limits, and representation theory.\",\n    \"non_role\": [\n      \"Does not provide enriched end calculus\",\n      \"Does not handle ∞-categorical end calculus\",\n      \"Does not support weighted ends\"\n    ]\n  },\n  \"wip\": [\n    \"Enriched end calculus\",\n    \"∞-categorical end calculus\",\n    \"Weighted ends\",\n    \"Contract version 0.1.0 covers basic end calculus\",\n    \"Future versions will add enriched and ∞-categorical variants\",\n    \"Weighted ends require monoidal category infrastructure\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"limits_colimits::end\",\n    \"symbols\": [\n      \"End\"\n    ],\n    \"required_tests\": [\n      \"validate_ok\",\n      \"validate_rejects_empty\"\n    ]\n  }\n}\n",
