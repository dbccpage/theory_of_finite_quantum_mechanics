      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:coend_calculus:v0.1.0\",\n  \"title\": \"Coend Calculus Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"categorical_calculus\",\n    \"symbol\": \"∫^c F(c,c)\",\n    \"ascii_symbol\": \"coend_calculus\",\n    \"notation\": \"∫^c F(c,c)\",\n    \"domain\": [\n      \"categories: Set of categories involved\",\n      \"bifunctors: Bifunctors F: C^op × C → D\",\n      \"integration_variables: Variables c ranging over categories\"\n    ],\n    \"codomain\": {\n      \"description\": \"Coend expressions are built from bifunctors F: C^op × C → D, with integration variable c ranging over C, producing objects in D via universal cowedges.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"All bifunctors involved must be well-defined\",\n      \"Cowedge components must satisfy dinaturality conditions\",\n      \"Coend computations must follow correct rules (Yoneda, Fubini, etc.)\",\n      \"Content-addressed hash must be deterministic SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"For coend ∫^c F(c,c), there exists a universal cowedge from F to the coend, such that any other cowedge factors uniquely through it.\\n\",\n    \"The components of a cowedge satisfy dinaturality: for each morphism f: c → c', the diagram commutes appropriately.\\n\",\n    \"∫^c F(c) × Hom(c,−) ≃ F\",\n    \"∫^c ∫^d ≃ ∫^{(c,d)}\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validator and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid bifunctors must be rejected\",\n    \"Violations of dinaturality must be rejected\",\n    \"Incorrect coend computations must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Coend calculus is the systematic use of coends and their properties to compute and manipulate categorical constructions. Coend calculus provides computational tools for profunctors, Kan extensions, and representation theory.\",\n    \"non_role\": [\n      \"Enriched coend calculus (WIP)\",\n      \"∞-categorical coend calculus (WIP)\",\n      \"Weighted coends (WIP)\"\n    ]\n  },\n  \"wip\": [\n    \"Enriched coend calculus\",\n    \"∞-categorical coend calculus\",\n    \"Weighted coends\",\n    \"Current implementation focuses on ordinary (non-enriched) coends\",\n    \"Extension to enriched settings requires additional structure\",\n    \"∞-categorical version requires higher categorical machinery\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"coend\",\n    \"symbols\": [\n      \"DeclaredFiniteCoend\",\n      \"DinaturalityWitness\",\n      \"check_dinaturality\"\n    ],\n    \"required_tests\": [\n      \"trivial_coend_single_object\",\n      \"coend_with_identification\"\n    ]\n  }\n}\n",
