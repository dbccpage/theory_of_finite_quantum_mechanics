      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:gamma_reconciliation:v1.0.0\",\n  \"title\": \"Raw versus second-repair quotient Γ, certificate checkers\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"gamma_reconciliation\",\n    \"symbol\": \"Γ_raw, Γ_quot\",\n    \"ascii_symbol\": \"GammaRawQuot\",\n    \"notation\": \"Γ_raw(x) = ‖D x‖_{1,w}; Γ_quot(x) = min_u ‖D x + A u‖_{1,w}\",\n    \"domain\": [\n      \"a defect map D, an m x n rational matrix given row-wise\",\n      \"a second-repair map A, an m x k rational matrix given row-wise\",\n      \"strictly positive rational weights w on Q^m, admitted by RepairQuotientProblem::try_new\",\n      \"a defect argument x in Q^n, and producer-supplied certificates over these data\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact rational values (a certified Γ_quot value, a raw value and an upper bound for a value gap, a zero-test gap value) or a typed GammaReconciliationError naming the failed check.\"\n    },\n    \"definition\": {\n      \"raw\": \"Γ_raw(x) = Σ_i w_i |(D x)_i|\",\n      \"quotient\": \"Γ_quot(x) = min over u in Q^k of ‖D x + A u‖_{1,w}; taking u = 0 gives Γ_quot ≤ Γ_raw\",\n      \"agreement_condition\": \"Γ_quot(x) = Γ_raw(x) for every x exactly when D^T K_w = D^T B_w, where B_w is the weight box and K_w is B_w intersected with ker A^T. Since D^T B_w is the convex hull of the 2^m points D^T (w ⊙ σ), σ in {-1, 1}^m, this is the finite vertex condition, one extension z_σ per sign vector.\",\n      \"zero_test_condition\": \"The zero tests Γ_raw(x) = 0 and Γ_quot(x) = 0 agree for every x exactly when im D ∩ im A = {0}; this is weaker than value agreement.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"A problem admitted by RepairQuotientProblem::try_new (matching shapes, positive denominators, strictly positive weights)\",\n      \"Exact rational certificate entries with positive denominators\"\n    ]\n  },\n  \"laws\": [\n    \"Dual certificate law: verify_quotient_certificate accepts a value only when the residual equals D x + A u, the value equals the weighted norm of the residual, the dual lies in the weight box, annihilates every column of A, and pairs with D x to the value.\",\n    \"Vertex table law: verify_vertex_table accepts only a table with exactly the 2^m sign vectors, each entry in the weight box, annihilating A and restricting to D^T (w ⊙ σ); acceptance is the finite vertex condition for agreement at every x.\",\n    \"Farkas law: verify_vertex_farkas checks nonnegative box multipliers, a zero combination and a negative bound, builds x = -restriction and u = -annihilator, and replays the value gap before returning it.\",\n    \"Gap law: verify_value_gap and verify_zero_test_gap accept only a strict gap that they recompute from the problem data.\",\n    \"Descent law: verify_raw_descent checks D d0 = 0 and verify_quotient_descent checks D d0 = A G for a declared first repair d0.\",\n    \"Size refusal: all_sign_vectors, and with it verify_vertex_table, refuses m > MAX_VERTEX_ROWS (16) with CarrierTooLarge; no partial table is checked.\",\n    \"Exactness law: all arithmetic is BigRational; there is no floating-point path and no tolerance.\",\n    \"Authority law: a checked certificate mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Exact rational arithmetic only\",\n      \"Deterministic sign-vector order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"gamma_reconciliation\",\n    \"symbols\": [\n      \"MAX_VERTEX_ROWS\",\n      \"GammaReconciliationError\",\n      \"QuotientGammaCertificate\",\n      \"VertexFarkasCertificate\",\n      \"ValueGapWitness\",\n      \"VertexExtensionTable\",\n      \"all_sign_vectors\",\n      \"RepairQuotientProblem\"\n    ],\n    \"required_tests\": [\n      \"raw_two_quotient_one_with_dual_certificate\",\n      \"weighted_variant_raw_five_quotient_three\",\n      \"farkas_certificate_for_failed_vertex_builds_the_gap\",\n      \"opposite_repair_has_complete_vertex_table\",\n      \"zero_test_gap_and_descent_conditions\",\n      \"refusals_are_typed\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A malformed or tampered certificate, a missing or repeated sign vector, and a carrier with more than MAX_VERTEX_ROWS rows must each be refused with a typed error\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"gamma_reconciliation checks producer-supplied certificates that compare the raw closure-defect value Γ_raw with the quotient value Γ_quot after a second repair map A. It does not search for certificates. The equivalences between the vertex condition and agreement at every x, and between im D ∩ im A = {0} and zero-test agreement, are written proofs in the module documentation; the code checks the finite certificates those proofs use. Nonclaim: not a solver; not a binary or Hamming-weight carrier; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Certificate construction or optimisation (no search is performed)\",\n      \"Binary carriers with Hamming weight\",\n      \"Vertex tables for more than MAX_VERTEX_ROWS rows\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION vertex_cap: the full vertex table is exponential in m and is refused above MAX_VERTEX_ROWS = 16; larger carriers have no agreement check here; AuthorityEffect: None.\",\n    \"OPEN_OBLIGATION mechanisation: the agreement and zero-test equivalences are written proofs, not machine-checked; AuthorityEffect: None.\"\n  ]\n}\n",
