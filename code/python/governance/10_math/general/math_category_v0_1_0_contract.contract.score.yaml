      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:category:v0.1.0\",\n  \"title\": \"Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"category\",\n    \"symbol\": \"C = (Ob(C), Hom(C), id, ∘)\",\n    \"ascii_symbol\": \"category\",\n    \"notation\": \"C = (Ob(C), Hom(C), id, ∘)\",\n    \"domain\": [\n      \"objects: collection of object identifiers\",\n      \"morphisms: collection of morphism descriptors with domain and codomain\",\n      \"identities: mapping from objects to identity morphisms\",\n      \"composition: binary operation on composable morphisms\"\n    ],\n    \"codomain\": {\n      \"description\": \"Collection of objects and morphisms with domain/codomain structure\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"A category must have at least one object\",\n      \"Every morphism must have valid domain and codomain in the object collection\",\n      \"Composition of morphisms must be deterministic and reproducible\"\n    ]\n  },\n  \"laws\": [\n    \"For f: A → B, id_B ∘ f = f\",\n    \"For f: A → B, f ∘ id_A = f\",\n    \"For f: A → B, g: B → C, h: C → D: (h ∘ g) ∘ f = h ∘ (g ∘ f)\",\n    \"For composable morphisms f, g, the composite g ∘ f exists\",\n    \"Each object A has exactly one identity morphism id_A: A → A\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Objects and morphisms sorted canonically\",\n      \"Composition function is content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"objects = [] must be rejected\",\n    \"Morphism with non-existent domain object must be rejected\",\n    \"Object without identity morphism must be rejected\",\n    \"Composable morphisms f: A → B, g: B → C with undefined g ∘ f must be rejected\",\n    \"Category where id_B ∘ f ≠ f must be rejected\",\n    \"Category where (h ∘ g) ∘ f ≠ h ∘ (g ∘ f) must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Category consists of a collection of objects, a collection of morphisms between objects, identity morphisms for each object, and a composition law satisfying associativity and identity laws. The contract validates the category axioms for finite categories.\",\n    \"non_role\": [\n      \"Large categories with proper classes (requires different representation)\",\n      \"Small vs. locally small distinction (not formalized)\",\n      \"Enriched categories (separate contract)\",\n      \"2-categories and higher categories (separate contracts)\",\n      \"Infinite categories with generators and relations\"\n    ]\n  },\n  \"wip\": [\n    \"How to represent large categories with proper classes?\",\n    \"Should small vs. locally small distinction be formalized?\",\n    \"How to efficiently encode generators and relations for infinite categories?\",\n    \"What FactEnvelope types should be standardized (is_groupoid, is_poset, etc.)?\",\n    \"Currently handles finite categories only\",\n    \"Composition can be specified as table or function reference\",\n    \"Enriched categories deferred to separate contract\",\n    \"2-categories and higher categories deferred to separate contracts\",\n    \"Object and Morphism contracts are components of Category\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"finite_category\",\n    \"symbols\": [\n      \"DeclaredFiniteCategory\",\n      \"ValidatedFiniteCategory\"\n    ],\n    \"required_tests\": [\n      \"validated_category_implements_category_trait\",\n      \"try_new_refuses_object_without_identity\"\n    ]\n  }\n}\n",
