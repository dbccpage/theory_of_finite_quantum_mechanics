      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:stable_infinity_category:v0.1.0\",\n  \"title\": \"Stable Infinity Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"stable_infinity_category\",\n    \"symbol\": \"C ∈ St∞Cat with 0, Ω, Σ, and Ω ≃ Σ^{-1}\",\n    \"ascii_symbol\": \"stable_infinity_category\",\n    \"notation\": \"C ∈ St∞Cat with 0, Ω, Σ, and Ω ≃ Σ^{-1}\",\n    \"domain\": [\n      \"infinity_category: underlying pointed ∞-category\",\n      \"zero_object: object 0 that is both initial and terminal\",\n      \"loop_functor: loop functor Ω : C → C\",\n      \"suspension_functor: suspension functor Σ : C → C\",\n      \"loop_suspension_equivalence: mutual equivalence Ω ⊣ Σ\"\n    ],\n    \"codomain\": {\n      \"description\": \"A stable ∞-category is a pointed ∞-category with finite limits and colimits where fiber sequences are equivalent to cofiber sequences, and the loop and suspension functors are mutually inverse equivalences.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The category has an object that is both initial and terminal (zero object).\",\n      \"All finite limits and colimits exist in the category.\",\n      \"Loop functor Ω and suspension functor Σ are mutually inverse equivalences.\",\n      \"Unit η: X ≃ ΩΣX and counit ε: ΣΩY ≃ Y are weak equivalences.\",\n      \"Every fiber sequence corresponds to a cofiber sequence.\",\n      \"Ω-spectra levels E_n have structure equivalences E_n ≃ Ω E_{n+1}.\",\n      \"All operations respect OperationLimits and Soviet Builder allocation caps.\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Zero object: 0 is both initial and terminal\",\n    \"Fiber-cofiber equivalence: a square is a pushout iff it is a pullback\",\n    \"Loop-suspension equivalence: Ω and Σ are mutually inverse equivalences\",\n    \"Suspension identity composition: id_comp preserves suspension\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All validators are content-addressed\",\n      \"Given same structural data, must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"stable_infinity\",\n    \"symbols\": [\n      \"StableInfinityCategory\",\n      \"PointedObject\",\n      \"PointedMorphism\",\n      \"FiberSequence\",\n      \"SpectrumLevel\"\n    ],\n    \"required_tests\": [\n      \"test_stable_infinity_category_positive_verification\",\n      \"test_kill_mut_p3_05_stable_infinity_loop_suspension_violation\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.StableInfinityCategory\",\n    \"symbols\": [\n      \"PointedCategory\",\n      \"FiberSequence\",\n      \"StableStructure\",\n      \"OmegaSpectrum\",\n      \"sigma_omega_counit_invertible\",\n      \"omega_sigma_unit_invertible\",\n      \"suspension_id_comp\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Zero object is not both initial and terminal\",\n    \"Loop and suspension functors fail to be inverse equivalences (MUT-P3-05)\",\n    \"Unit or counit morphism is not an equivalence\",\n    \"Spectrum structure map is not an equivalence\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A stable ∞-category is an ∞-category with a zero object, where every morphism has a fiber and cofiber, and the loop-suspension adjunction Ω ⊣ Σ is an equivalence. Developed extensively in Lurie's Higher Algebra, stable ∞-categories axiomatize modern stable homotopy theory and homological algebra.\",\n    \"non_role\": [\n      \"Unstable spaces\",\n      \"Non-pointed ∞-categories\"\n    ]\n  },\n  \"wip\": [\n    \"t-structures and hearts\",\n    \"Symmetric monoidal stable ∞-categories\"\n  ]\n}\n",
