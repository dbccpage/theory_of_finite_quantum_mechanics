      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:compactly_generated_category:v0.1.0\",\n  \"title\": \"Compactly Generated Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"presentable_infinity_category\",\n    \"symbol\": \"C with C^ω ⊂ C\",\n    \"ascii_symbol\": \"compactly_generated_category\",\n    \"notation\": \"C with C^ω ⊂ C (compact generators generating C under filtered colimits)\",\n    \"domain\": [\n      \"infinity_category: underlying presentable ∞-category\",\n      \"compact_objects: small set of compact generators C^ω\",\n      \"accessibility_cardinal: ω (smallest infinite cardinal)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A compactly generated ∞-category is a presentable ∞-category with ω-accessibility, generated under filtered colimits by an essentially small subcategory of compact objects C^ω.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Category has small filtered colimits.\",\n      {\n        \"All specified compact objects satisfy finite presentation\": \"morphisms from K to filtered colimits factor through a finite stage.\"\n      },\n      \"Every object in C is presented as a filtered colimit of compact generators.\",\n      \"All operations respect OperationLimits and Soviet Builder allocation caps.\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Colimit existence: filtered colimits exist in C\",\n    \"Compactness law: for each K ∈ C^ω and filtered diagram D, Hom(K, colim D) ≃ colim Hom(K, D)\",\n    \"Factorization: any morphism from a compact object to a colimit factors essentially uniquely through a finite stage\",\n    \"Generation: C is the Ind-completion of C^ω\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validator functions are content-addressed\",\n      \"Given same data, produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"compactly_generated\",\n    \"symbols\": [\n      \"CompactlyGeneratedCategory\",\n      \"CompactObject\",\n      \"FilteredDiagram\",\n      \"DiagramStage\",\n      \"FactorizationWitness\"\n    ],\n    \"required_tests\": [\n      \"test_compactly_generated_category_positive_verification\",\n      \"test_kill_mut_p3_06_compact_factorization_violation\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.CompactlyGenerated\",\n    \"symbols\": [\n      \"FilteredSystem\",\n      \"IsCompactObject\",\n      \"CompactlyGeneratedCategory\",\n      \"compact_factorization\",\n      \"identitySystem\",\n      \"compact_id_factorization\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Factorization witness claims nonexistent diagram stage (MUT-P3-06)\",\n    \"Object not in compact generators and lacking presenting diagram\",\n    \"Presenting diagram contains non-compact stage objects\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A compactly generated ∞-category is a presentable ∞-category generated under filtered colimits by a small collection of compact objects. Compact objects play the role of finite objects (e.g. finite spectra in Sp, perfect complexes in D(R)).\",\n    \"non_role\": [\n      \"Unbounded inaccessible categories\",\n      \"Categories lacking small colimits\"\n    ]\n  },\n  \"wip\": [\n    \"Ind-completion functor Ind(C^ω) ≃ C\",\n    \"Relation to presentable symmetric monoidal categories\"\n  ]\n}\n",
