      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:shor_topos:v0.1.0\",\n  \"title\": \"Shor Period Geometry Contract (discrete modular period extraction)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"discrete_shor_period_geometry\",\n    \"symbol\": \"period r of a^x mod N via discrete phase/path geometry\",\n    \"ascii_symbol\": \"shor_topos\",\n    \"notation\": \"topological period extraction (legacy name shor_topos; not an elementary topos)\",\n    \"domain\": [\n      \"integers base a, modulus N > 1, finite step bound\",\n      \"modular exponentiation trace f(x)=a^x mod N\",\n      \"discrete phase / path-sum style amplitude bookkeeping (finite)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A finite discrete geometry for period finding inspired by Shor's algorithm. Despite the historical stem name 'shor_topos', this contract does NOT claim an elementary topos (finite limits, exponentials, subobject classifier) as implemented law.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Finite modular trace generator parameters (a, N, max_steps)\",\n      \"Deterministic trace sequence\",\n      \"Declared period-extraction / interference scoring is finite and replayable\",\n      \"No claim of quantum hardware authority\"\n    ]\n  },\n  \"laws\": [\n    \"Trace law: modular sequence is generated deterministically from (a,N,max_steps).\",\n    \"Period law: a candidate period r is a discrete fixed-point/resonance claim under the declared scoring — not a quantum supremacy certificate.\",\n    \"Name honesty: stem 'shor_topos' is legacy; object is discrete period geometry, not a verified elementary topos.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT/quantum-authority from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness (unless explicitly seeded and recorded)\",\n      \"No wall-clock dependence\",\n      \"Deterministic modular arithmetic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Claiming elementary topos axioms as discharged by this module must be rejected\",\n    \"N ≤ 1 or invalid modular parameters must be rejected\",\n    \"Nondeterministic period claims without recorded seed must be rejected\",\n    \"Claiming quantum hardware execution from pure modular trace must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"binding_review_20261014\": \"The declared Rust crate/module is absent from the active Cargo workspace. Withdraw this realization binding; the retained specification has no executable implementation credit from it.\",\n    \"summary\": \"Discrete modular period-extraction geometry historically named shor_topos. B3 meth removes elementary-topos overclaim. Live RS provides modular traces and period-finding geometry sketches. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT or topos theorem discharge.\",\n    \"non_role\": [\n      \"Elementary topos theory (Ω-object, finite limits package)\",\n      \"Quantum circuit hardware execution certificates\",\n      \"Cryptanalytic claims against production RSA\",\n      \"PROVED / GlobalGreen / HoTT discharge\"\n    ],\n    \"legacy_contract_id\": \"urn:math:contract:ShorTopos:v1.0.0\",\n    \"migration_note\": \"B3 meth: renamed mathematical object to discrete period geometry; kept stem id for corpus continuity; forbade topos axiom overclaim.\"\n  },\n  \"wip\": [\n    \"Whether to mint a new stem discrete_shor_period_geometry and deprecate shor_topos name.\",\n    \"Full interference scoring vs modular_trace-only surface.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B3_LEGACY_SHELL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B3: repaired topos overclaim; object is discrete Shor-inspired period geometry.\",\n        \"recommendation\": \"Object-specific math settled for this pass; align code under ADR-007a where YAML is ahead or code still over-scopes. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b3_legacy_shells_meth\"\n      },\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"MATH-OVERCLAIM-REPAIRED\",\n        \"severity\": \"high\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Prior shell asserted elementary topos axioms. Live module is modular period geometry (L098-style). Overclaim removed under meth review.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"NAME_LEGACY_PARTIAL_IMPL\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_topology_theory_theory/src/shor_topos.rs\",\n        \"detail\": \"generate_modular_trace and related geometry present; not a topos engine. After YAML repair, name residual remains. Not PROVED.\",\n        \"delta\": \"MATCH_SCOPE_WITH_LEGACY_NAME\"\n      }\n    ]\n  }\n}\n",
