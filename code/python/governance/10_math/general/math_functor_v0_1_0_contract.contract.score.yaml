        "F(id_A) = id_{F(A)} for all objects A",
        "F(g ∘ f) = F(g) ∘ F(f) for all composable pairs"
      ]
    },
    "laws": [
      "F(id_A) = id_{F(A)} for all objects A in C",
      "F(g ∘ f) = F(g) ∘ F(f) for all composable f, g in C",
      "dom(F(f)) = F(dom(f)) for all morphisms f in C",
      "cod(F(f)) = F(cod(f)) for all morphisms f in C"
    ],
    "replay": {
      "requirements": [
        "No external state",
