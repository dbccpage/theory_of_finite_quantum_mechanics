      "F(id_A) ≠ id_{F(A)} for some object A",
      "F(g ∘ f) ≠ F(g) ∘ F(f) for some composable pair"
    ],
    "doctrine": {
      "summary": "A Functor F: C → D is a structure-preserving map between categories.  It maps objects to objects and morphisms to morphisms, preserving identities and composition.  The contract validates the functor axioms.",
