      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:functor:v0.1.0\",\n  \"title\": \"Functor Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"functor\",\n    \"symbol\": \"F: C → D\",\n    \"ascii_symbol\": \"functor\",\n    \"notation\": \"F: C → D\",\n    \"domain\": [\n      \"object_map: function from Ob(C) to Ob(D)\",\n      \"morphism_map: function from Mor(C) to Mor(D)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A pair of maps (F₀, F₁) where F₀ maps objects and F₁ maps morphisms\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"source_category_id must resolve to a valid Category artifact\",\n      \"target_category_id must resolve to a valid Category artifact\",\n      \"Every object in C must have an image in D\",\n      \"Every morphism in C must have an image in D\",\n      \"For all f: A → B in C, F(f): F(A) → F(B) in D\",\n      \"F(id_A) = id_{F(A)} for all objects A\",\n      \"F(g ∘ f) = F(g) ∘ F(f) for all composable pairs\"\n    ]\n  },\n  \"laws\": [\n    \"F(id_A) = id_{F(A)} for all objects A in C\",\n    \"F(g ∘ f) = F(g) ∘ F(f) for all composable f, g in C\",\n    \"dom(F(f)) = F(dom(f)) for all morphisms f in C\",\n    \"cod(F(f)) = F(cod(f)) for all morphisms f in C\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Mappings serialized in canonical order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"source_category_id does not resolve to valid Category\",\n    \"target_category_id does not resolve to valid Category\",\n    \"An object in C has no image in D\",\n    \"F(f) does not have domain F(dom(f))\",\n    \"F(id_A) ≠ id_{F(A)} for some object A\",\n    \"F(g ∘ f) ≠ F(g) ∘ F(f) for some composable pair\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Functor F: C → D is a structure-preserving map between categories.  It maps objects to objects and morphisms to morphisms, preserving identities and composition.  The contract validates the functor axioms.\",\n    \"non_role\": [\n      \"Contravariant functors (modeled as functors C^op → D)\",\n      \"Profunctors or bifunctors (separate contracts)\",\n      \"Higher functors (∞-categories)\",\n      \"Lax or oplax functors (separate contracts)\"\n    ]\n  },\n  \"wip\": [\n    \"How to model contravariant functors? Current approach: functors C^op → D\",\n    \"What FactEnvelope types for functor properties (full, faithful, essentially surjective)?\",\n    \"How to represent functor categories and natural transformations?\",\n    \"Should we include profunctors or keep them as separate contract?\",\n    \"Currently targets covariant functors between categories\",\n    \"ContravariantFunctor trait exists but not yet integrated into contract\",\n    \"Functor composition is specified but needs integration with NaturalTransformation contract\",\n    \"FactEnvelope for 'is full', 'is faithful', 'is essentially surjective', 'is an equivalence' needs standardization\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"cat_functor\",\n    \"symbols\": [\n      \"CatFunctor\"\n    ],\n    \"required_tests\": [\n      \"composition_law_missing_mapping_is_violation\",\n      \"declared_finite_functor_identity_law\"\n    ]\n  }\n}\n",
