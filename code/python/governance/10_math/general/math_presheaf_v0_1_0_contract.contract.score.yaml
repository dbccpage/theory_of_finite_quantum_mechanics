      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:presheaf:v0.1.0\",\n  \"title\": \"Presheaf Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"contravariant_functor\",\n    \"symbol\": \"F: Open(X)^op → C\",\n    \"ascii_symbol\": \"presheaf\",\n    \"notation\": \"F: Open(X)^op → C\",\n    \"domain\": [\n      \"source_category: Open(X)^op - opposite category of open sets of topological space X\",\n      \"target_category: C - arbitrary category (Set, Ab, Vect_k, etc.)\",\n      \"object_map: F(U) - object in C for each open set U\",\n      \"morphism_map: ρ_{V,U}: F(U) → F(V) - restriction map for each inclusion V ⊆ U\"\n    ],\n    \"codomain\": {\n      \"description\": \"Contravariant functor F: Open(X)^op → C\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The space_id must resolve to a valid TopologicalSpace artifact\",\n      \"Every open set U must have a corresponding section F(U)\",\n      \"Every inclusion V ⊆ U must have a corresponding restriction map ρ_{V,U}\",\n      \"For each open set U, the restriction ρ_{U,U} must equal id_{F(U)}\",\n      \"For each chain W ⊆ V ⊆ U, must have ρ_{W,U} = ρ_{W,V} ∘ ρ_{V,U}\"\n    ]\n  },\n  \"laws\": [\n    \"For each open set U, ρ_{U,U} = id_{F(U)}\",\n    \"For each chain W ⊆ V ⊆ U, ρ_{W,U} = ρ_{W,V} ∘ ρ_{V,U}\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"Open sets and inclusions ordered canonically\",\n      \"No external state dependencies\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"space_id does not resolve to a valid TopologicalSpace\",\n    \"An open set U has no corresponding F(U)\",\n    \"An inclusion V ⊆ U has no corresponding ρ_{V,U}\",\n    \"ρ_{U,U} ≠ id_{F(U)} for some open set U\",\n    \"ρ_{W,U} ≠ ρ_{W,V} ∘ ρ_{V,U} for some chain W ⊆ V ⊆ U\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Presheaf is a contravariant functor from the category of open sets of a topological space to a target category.  It assigns to each open set U an object F(U) and to each inclusion V ⊆ U a restriction morphism ρ_{V,U}: F(U) → F(V).  The contract validates functoriality but does not require the sheaf axioms.\",\n    \"non_role\": [\n      \"Enforcing sheaf axioms (locality and gluing)\",\n      \"Distinguishing separated presheaves from general presheaves\",\n      \"Implementing sheafification algorithm\",\n      \"Representing presheaf morphisms (natural transformations)\"\n    ]\n  },\n  \"wip\": [\n    \"The contract does not distinguish between presheaves and separated presheaves (those satisfying locality but not gluing)\",\n    \"Presheaf morphisms are natural transformations; these require a separate artifact type\",\n    \"The relationship with the Sheaf contract: a Presheaf becomes a Sheaf if it additionally passes locality and gluing validators\",\n    \"Yoneda embedding and representable presheaves should be captured as FactEnvelope topics\",\n    \"Should we support presheaves on arbitrary sites (not just topological spaces)?\",\n    \"This contract focuses on the functor axioms only, not the sheaf axioms\",\n    \"Sheafification will be a separate operation in the Sheaf contract\",\n    \"Natural transformations between presheaves will need their own contract\",\n    \"Consider adding support for presheaves valued in monoidal categories\"\n  ]\n}\n",
