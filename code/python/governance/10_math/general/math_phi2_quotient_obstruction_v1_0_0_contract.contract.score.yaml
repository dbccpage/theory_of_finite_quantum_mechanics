      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:phi2_quotient_obstruction:v1.0.0\",\n  \"title\": \"Φ₂ degree-2 quotient obstruction certificate replay\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"phi2_certificate_replay\",\n    \"symbol\": \"Φ₂\",\n    \"ascii_symbol\": \"Phi2\",\n    \"notation\": \"Φ₂([B]) = min_{A ∈ C¹} ‖B − d₁A‖_{1,w}\",\n    \"domain\": [\n      \"caller-supplied rational matrix d₁ : C¹ → C² (|F| rows, |E| columns)\",\n      \"optional caller-supplied rational matrix d₀ : C⁰ → C¹\",\n      \"flux B ∈ C², face weights w, gauge potential A ∈ C¹, residual r, dual y, reported value\"\n    ],\n    \"codomain\": {\n      \"description\": \"VerifiedExactPhi2, a sealed wrapper around the replayed certificate, or a typed ExactPhi2CertificateError. The module checks a submitted witness; it does not search for a minimizer and does not construct one.\"\n    },\n    \"definition\": {\n      \"formula\": \"Φ₂([B]) = min_A ‖B − d₁A‖_{1,w}\",\n      \"dual\": \"max ⟨B, y⟩ subject to d₁ᵀy = 0 and |y_f| ≤ w_f\",\n      \"acceptance\": \"r = B − d₁A, d₁ᵀy = 0, |y_f| ≤ w_f, w_f > 0, reported ≥ 0, Σ w_f|r_f| = reported = ⟨B, y⟩\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Finite rational d₁ with one row per face and one column per edge\",\n      \"Strictly positive rational face weights w\",\n      \"Flux B, residual r and dual y of face length; potential A of edge length\",\n      \"Optional d₀ with one row per edge, used only to check d₁d₀ = 0\"\n    ]\n  },\n  \"laws\": [\n    \"Weak-duality law: for every A and every y with d₁ᵀy = 0 and |y_f| ≤ w_f, ⟨B, y⟩ ≤ ‖B − d₁A‖_{1,w}. A replayed certificate whose primal and dual values are equal therefore reports the minimum of this LP for the supplied d₁, w and B.\",\n    \"Primal replay law: every residual entry must equal (B − d₁A)_f in exact rational arithmetic.\",\n    \"Dual replay law: y must satisfy d₁ᵀy = 0 on every edge and |y_f| ≤ w_f on every face.\",\n    \"Weight law: every face weight must be strictly positive.\",\n    \"Chain-law scope: d₁d₀ = 0 is checked only when d₀ is supplied. Without d₀ no chain law is checked.\",\n    \"Carrier fence: the verifier checks the supplied matrices. It does not check that they are the coboundaries of a declared cell complex, and it computes no Betti number.\",\n    \"Exactness law: all arithmetic is BigRational. The string wire form refuses unparseable rationals; there is no floating-point path.\",\n    \"Separation fence: Φ₂ is a degree-2 quotient distance. It is not Φ₁, Γ₂ or Ξ.\",\n    \"Authority law: a replayed certificate mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Exact rational arithmetic only\",\n      \"Deterministic replay of the submitted primal and dual witness\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_functional\",\n    \"module\": \"phi2\",\n    \"symbols\": [\n      \"ExactPhi2CertificateWire\",\n      \"ExactPhi2Certificate\",\n      \"VerifiedExactPhi2\",\n      \"ExactPhi2CertificateError\",\n      \"Phi2Functional\"\n    ],\n    \"required_tests\": [\n      \"test_tetrahedron_rejects_non_closed_2_chain\",\n      \"test_tetrahedron_rejects_dual_norm_violation\",\n      \"test_tetrahedron_rejects_duality_gap\",\n      \"test_tetrahedron_chain_law_and_valid_b2_certificate\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A dual witness that is not a closed 2-cycle (d₁ᵀy ≠ 0) must be rejected\",\n    \"A dual witness with |y_f| greater than w_f must be rejected\",\n    \"A reported value that differs from the dual pairing ⟨B, y⟩ must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Phi2Functional replays a submitted exact rational primal-dual witness for the degree-2 weighted ℓ¹ quotient distance min_A ‖B − d₁A‖_{1,w}. Acceptance means the reported value is the LP minimum for the supplied matrices and weights, by weak duality. Nonclaim: it does not certify that the matrices come from a given cell complex, compute cohomology, or search for a minimizer; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Minimizer search or LP solving\",\n      \"Cell-complex or Betti-number certification\",\n      \"Φ₁, Γ₂ or Ξ\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION untested_refusals: NonPositiveWeight, PrimalResidualMismatch, ChainLawViolation, D1RowMismatch, D1ColumnMismatch, D0DimensionMismatch, FaceDimensionMismatch, NegativeReportedValue and PrimalValueMismatch are implemented refusals with no dedicated unit test; AuthorityEffect: None.\"\n  ]\n}\n",
