      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:stacky_groupoid:v0.1.0\",\n  \"title\": \"StackyGroupoid Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"groupoid_in_stacks\",\n    \"symbol\": \"G_1 ⇉ G_0 in Stacks\",\n    \"ascii_symbol\": \"stacky_groupoid\",\n    \"notation\": \"G_1 ⇉ G_0 in Stacks\",\n    \"domain\": [\n      \"object_stack: Stack G_0\",\n      \"morphism_stack: Stack G_1\",\n      \"structure_maps: source, target, composition, identity, inverse\"\n    ],\n    \"codomain\": {\n      \"description\": \"A pair of stacks (G_0, G_1) with structure morphisms\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"G_0 and G_1 are stacks\",\n      \"Groupoid axioms hold (associativity, identity, inverse)\",\n      \"Coherence conditions for 2-morphisms\",\n      \"All artifacts are content-addressed via SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"G_0 and G_1 are stacks (2-sheaves)\",\n    \"Source, target, composition, identity, inverse satisfy groupoid laws\",\n    \"Associativity and unit laws hold up to coherent 2-morphisms\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:o