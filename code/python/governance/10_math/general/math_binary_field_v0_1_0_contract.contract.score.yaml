      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:binary_field:v0.1.0\",\n  \"title\": \"Binary Field GF(2^k) Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_field\",\n    \"symbol\": \"GF(2^k) with bit-mask elements and the symplectic trace form\",\n    \"ascii_symbol\": \"binary_field\",\n    \"notation\": \"GF(2^k) with bit-mask elements and the symplectic trace form\",\n    \"domain\": [\n      \"degree k >= 1\",\n      \"modulus: irreducible polynomial of exact degree k, as a bit mask\",\n      \"element: bit mask below 2^k\"\n    ],\n    \"codomain\": {\n      \"description\": \"The field GF(2^k) with carry-less arithmetic, the absolute trace, the symplectic trace form on GF(2^k)^2 and the binary Pauli phase algebra.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The modulus must be an irreducible polynomial of exactly the declared degree; any other modulus is refused\",\n      \"Hermitian Paulis are self-adjoint involutions\"\n    ]\n  },\n  \"laws\": [\n    \"x * x = x + 1 and x * (x + 1) = 1 in GF(4) = F_2[x]/(x^2 + x + 1)\",\n    \"Every nonzero element has a multiplicative inverse\",\n    \"The trace of GF(4) takes the values 0, 0, 1, 1 on 0, 1, x, x + 1\",\n    \"A line group has one element per subset of its generators\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"binary_field\",\n    \"symbols\": [\n      \"BinaryField\",\n      \"BinaryPauli\",\n      \"find_irreducible_binary_polynomial\",\n      \"binary_polynomial_coefficients\",\n      \"build_line_group\"\n    ],\n    \"required_tests\": [\n      \"the_first_irreducible_polynomials_are_the_known_ones\",\n      \"gf4_multiplication_and_trace_match_hand_computation\",\n      \"every_nonzero_element_has_an_inverse\",\n      \"a_reducible_modulus_is_refused\",\n      \"a_modulus_of_the_wrong_degree_is_refused\",\n      \"hermitian_paulis_are_self_adjoint_involutions\",\n      \"a_line_group_has_one_element_per_subset_of_generators\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A reducible modulus must be refused\",\n    \"A modulus of the wrong degree must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Packed binary fields GF(2^k) with the trace and the symplectic trace form used by the Weyl-board spread checks, and the binary Pauli phase algebra.\",\n    \"non_role\": [\n      \"Fields of characteristic other than 2\",\n      \"GF(2) matrix elimination\"\n    ]\n  },\n  \"wip\": [\n    \"BinaryField::new panics (assert) on a bad modulus instead of returning a typed error\"\n  ]\n}\n",
