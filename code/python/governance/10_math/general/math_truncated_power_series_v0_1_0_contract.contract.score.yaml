      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:truncated_power_series:v0.1.0\",\n  \"title\": \"Bounded Exact Formal Power Series\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"truncated_power_series\",\n    \"symbol\": \"truncated_power_series\",\n    \"ascii_symbol\": \"truncated_power_series\",\n    \"notation\": \"Bounded Exact Formal Power Series\",\n    \"domain\": [\n      \"Formal series modulo x^(N+1) over a canonical exact field, N at most 1024.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_number_theory::power_series; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Truncated multiplication is convolution modulo x^(N+1).\",\n    \"Inverse, log and exp use exact recurrences and obey exp(log(1+x))=1+x through retained order.\",\n    \"Composition requires zero inner constant and integer division requires an invertible characteristic element.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"power_series\",\n    \"symbols\": [\n      \"TruncatedSeries\",\n      \"SeriesError\",\n      \"MAX_SERIES_ORDER\"\n    ],\n    \"required_tests\": [\n      \"formal_series_inverse_log_exp_and_composition_are_exact\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Noninvertible constant, wrong log/exp constants, order mismatch, characteristic obstruction and exponent excess are typed refusals.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Truncated multiplication is convolution modulo x^(N+1).; Inverse, log and exp use exact recurrences and obey exp(log(1+x))=1+x through retained order.; Composition requires zero inner constant and integer division requires an invertible characteristic element..\",\n    \"non_role\": [\n      \"No analytic convergence assertion for formal series.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
