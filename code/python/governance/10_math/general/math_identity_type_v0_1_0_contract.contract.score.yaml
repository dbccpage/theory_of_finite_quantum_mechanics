      "domain": [
        "ambient_type: Type A in which a and b live",
        "left_endpoint: Term a : A",
        "right_endpoint: Term b : A"
      ],
      "codomain": {
        "description": "For a type A and terms a, b : A, the identity type Id_A(a, b) or (a =_A b) is the type of equality proofs/paths from a to b.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "The ambient type A must resolve to a valid type artifact",
        "The left endpoint a must be a valid term of type A",
        "The right endpoint b must be a valid term of type A",
        "The artifact hash must be deterministically computed from contract_id, version, ambient_type_id, left_term_id, and right_term_id\n"
      ]
    },
    "laws": [
      "For all a : A, there exists refl_a : a =_A a",
      "J-eliminator: Given a motive C : (x : A) → (y : A) → (p : x = y) → Type and a base case d : C(a, a, refl_a), we can eliminate any p : a = b to produce C(a, b, p)\n",
      "Both a and b must have type A"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Identical inputs must produce identical artifact hash"
      ]
    },
    "relationships": {
