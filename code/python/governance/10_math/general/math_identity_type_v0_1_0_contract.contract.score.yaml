      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:identity_type:v0.1.0\",\n  \"title\": \"IdentityType\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"type_former\",\n    \"symbol\": \"a =_A b or Id_A(a, b)\",\n    \"ascii_symbol\": \"identity_type\",\n    \"notation\": \"a =_A b or Id_A(a, b)\",\n    \"domain\": [\n      \"ambient_type: Type A in which a and b live\",\n      \"left_endpoint: Term a : A\",\n      \"right_endpoint: Term b : A\"\n    ],\n    \"codomain\": {\n      \"description\": \"For a type A and terms a, b : A, the identity type Id_A(a, b) or (a =_A b) is the type of equality proofs/paths from a to b.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The ambient type A must resolve to a valid type artifact\",\n      \"The left endpoint a must be a valid term of type A\",\n      \"The right endpoint b must be a valid term of type A\",\n      \"The artifact hash must be deterministically computed from contract_id, version, ambient_type_id, left_term_id, and right_term_id\\n\"\n    ]\n  },\n  \"laws\": [\n    \"For all a : A, there exists refl_a : a =_A a\",\n    \"J-eliminator: Given a motive C : (x : A) → (y : A) → (p : x = y) → Type and a base case d : C(a, a, refl_a), we can eliminate any p : a = b to produce C(a, b, p)\\n\",\n    \"Both a and b must have type A\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Identical inputs must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"ambient_type_id does not resolve to valid type\",\n    \"left_term_id does not have type A\",\n    \"right_term_id does not have type A\",\n    \"contract_version is not '0.1.0'\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An IdentityType (a =_A b) is the type of paths (proofs of equality) between two terms a and b of type A. In Homotopy Type Theory (HoTT), identity types are the foundation of equality and homotopy. The contract validates the ambient type and the two endpoints. Identity types support reflexivity, path induction (J-eliminator), and transport operations.\",\n    \"non_role\": [\n      \"This contract defines identity types, not paths themselves (paths are Term artifacts)\",\n      \"Does not implement path composition or higher groupoid structure\",\n      \"Does not provide definitional equality checking\",\n      \"Does not handle univalence axiom enforcement\"\n    ]\n  },\n  \"wip\": [\n    \"How are paths (inhabitants of identity types) represented as Term artifacts?\",\n    \"What is the contract relationship between Path and IdentityType?\",\n    \"How are higher identity types (paths between paths) constructed?\",\n    \"Should higher dimensional paths have separate contracts or be iterated identity types?\",\n    \"Identity type defines the type structure; paths are terms of this type\",\n    \"Higher identity types are iterated applications of identity type constructor\",\n    \"Path composition, inverse, and higher groupoid structure likely need separate operations\",\n    \"Univalence axiom integration deferred to future version\"\n  ]\n}\n",
