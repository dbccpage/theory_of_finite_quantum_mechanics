      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:phi1_obstruction_mass:v1.0.0\",\n  \"title\": \"Φ₁ obstruction mass\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:cochain_layer:v1.0.0\",\n        \"urn:omega:math:exact_repair_space:v1.0.0\",\n        \"urn:omega:math:quotient_space:v1.0.0\",\n        \"urn:omega:math:hashes:v1.0.0\",\n        \"urn:omega:math:phi1:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Primary obstruction mass: the weighted ℓ¹ quotient norm on Q¹.\",\n    \"symbol\": \"Φ₁\",\n    \"ascii_symbol\": \"Phi1\",\n    \"formula\": \"Φ₁([ω]) = inf_α ||ω - d₀α||_{1,w}\",\n    \"1. Contract metadata\": {\n      \"title\": \"Φ₁ obstruction mass\",\n      \"version\": \"0.2.0\",\n      \"object_type\": \"quotient_norm_functional\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Primary obstruction mass: the weighted ℓ¹ quotient norm on Q¹.\",\n      \"purpose\": \"Measures residual mass after all exact repairs in B¹ have been minimized out.\",\n      \"non_role\": [\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"[ω] ∈ Q¹ represented by ω ∈ C¹\",\n      \"codomain\": \"exact nonnegative rational with replayed primal-dual evidence, or an explicitly non-authority display diagnostic\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer (C⁰, C¹, C², d₀, d₁)\",\n        \"B¹ = im(d₀)\",\n        \"Q¹ = C¹ / B¹\",\n        \"weight profile w\",\n        \"ω ∈ C¹\",\n        \"weighted ℓ¹ norm ||·||_{1,w}\"\n      ],\n      \"witness_modes\": {\n        \"primal_witness\": {\n          \"optional\": false,\n          \"required_for\": \"every certified Phi1 claim\",\n          \"fields\": [\n            \"α* ∈ C⁰\",\n            \"h₁* = ω - d₀α*\",\n            \"||h₁*||_{1,w}\"\n          ]\n        },\n        \"dual_witness\": {\n          \"optional\": false,\n          \"required_for\": \"every certified Phi1 claim\",\n          \"fields\": [\n            \"φ* ∈ C¹*\",\n            \"d₀ᵀφ* = 0\",\n            \"||φ*||_{∞,w*} <= 1\",\n            \"<φ*, h₁*> = Φ₁\"\n          ]\n        },\n        \"exact_solver_transcript\": {\n          \"optional\": true,\n          \"note\": \"May supplement replay, but never replaces the mandatory primal and dual witnesses.\"\n        }\n      }\n    },\n    \"5. Definition\": {\n      \"primal\": \"Φ₁([ω]) = inf_α ||ω - d₀α||_{1,w}\",\n      \"dual\": \"when applicable, Φ₁([ω]) = max_φ <φ,ω> subject to d₀ᵀφ = 0 and ||φ||_{∞,w*} <= 1, where w* is the dual norm convention induced by the weighted ℓ¹ norm.\\n\",\n      \"exact_zero_mode\": \"ExactRepair iff Φ₁ = 0 in exact arithmetic.\",\n      \"tolerance_mode\": \"Tolerance values are display diagnostics only and cannot emit exact Φ₁ claims.\",\n      \"certified_scalar_mode\": \"A scalar is certified only with replayable exact primal and dual evidence whose objective values match.\"\n    },\n    \"6. Laws and invariants\": {\n      \"quotient_invariance\": \"Φ₁([ω + d₀β]) = Φ₁([ω])\",\n      \"nonnegativity\": \"Φ₁ >= 0\",\n      \"exact_repair\": \"Φ₁ = 0 iff ω ∈ B¹\",\n      \"quotient_norm\": \"Φ₁ is a norm/seminorm on Q¹ depending on the declared layer assumptions; WIP must state exact assumptions.\",\n      \"hierarchy\": \"Φ₁ dominates Γ₂ and Ξ; neither may override worse Φ₁.\",\n      \"saturation\": \"Every certified claim satisfies <φ*, ω> = <φ*, h₁*> = Φ₁ = ||h₁*||_{1,w}.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"scalar_equality\": \"Exact scalar equality in exact mode; tolerance comparison only with declared tolerance profile.\",\n      \"quotient_equality\": \"If ω₁ - ω₂ ∈ B¹, then Φ₁([ω₁]) = Φ₁([ω₂]).\",\n      \"representative_warning\": \"Different representatives of the same Q¹ class may have different raw ℓ¹ norms but must have the same Φ₁.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Optimization problem statement is frozen.\",\n        \"Layer, basis, d₀, weights, and ω are hash-bound in any replay artifact.\",\n        \"Tie policies are declared if h₁* is exported as a canonical residual.\",\n        \"Dual feasibility is replayable when dual witness is claimed.\",\n        \"Raw floats are approximate display values, not exact certificates.\",\n        \"A cochain obstruction packet refuses any Φ₁ claim without both witnesses.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"B1\": \"Φ₁ = 0 iff the class is exact.\",\n        \"Q1\": \"Φ₁ is defined on Q¹.\",\n        \"Gamma2\": \"Γ₂ is checked after Φ₁ on a selected residual h₁*.\",\n        \"Xi\": \"Ξ is tertiary only after Φ₁/Γ₂ tie.\",\n        \"R\": \"Residual projection R selects a deterministic Φ₁-minimizing representative when TieR is declared.\",\n        \"EvaluationHierarchy\": \"Φ₁ is the first lexicographic key.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ExactPhi1Certificate {\\n    pub omega: Vec<BigRational>,\\n    pub d0: Vec<Vec<BigRational>>,\\n    pub weights: Vec<BigRational>,\\n    pub alpha: Vec<BigRational>,\\n    pub primal_residual: Vec<BigRational>,\\n    pub dual_witness: Vec<BigRational>,\\n    pub reported_value: BigRational,\\n}\\n\\npub fn verify_exact_certificate(\\n    certificate: ExactPhi1Certificate,\\n) -> Result<VerifiedExactPhi1, ExactPhi1CertificateError>;\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Φ₁ computed as ||ω||₁ without minimizing over B¹.\",\n        \"Φ₁ depends on representative choice inside the same Q¹ class.\",\n        \"Dual witness violates d₀ᵀφ = 0.\",\n        \"Dual witness violates ||φ||_{∞,w*} <= 1.\",\n        \"Primal and dual values disagree.\",\n        \"Saturation identity fails.\",\n        \"Raw float treated as exact certificate.\",\n        \"Γ₂ or Ξ used to override worse Φ₁.\",\n        \"Canonical h₁* exported without TieR when multiple minimizers exist.\",\n        \"Φ₁ is not the raw representative norm ||ω||₁ unless d₀α=0 is optimal.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"General certificate-producing LP witness generation beyond specialized solvers.\",\n        \"Canonical residual export policy when minimizer is nonunique.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"PHI1_OBSTRUCTION_MASS_CONTRACT\": {\n        \"symbol\": \"Φ₁\",\n        \"ascii_symbol\": \"Phi1\",\n        \"formula\": \"Φ₁([ω])=inf_α ||ω-d₀α||_{1,w}\",\n        \"status\": \"exact_rational_certificate_gate_implemented\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"Q¹ represented by ω in C¹\",\n        \"codomain\": \"nonnegative scalar\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"weights\",\n          \"ω\",\n          \"B¹\",\n          \"Q¹\",\n          \"weighted ℓ¹ norm\",\n          \"mandatory α* for certified claims\",\n          \"mandatory h₁* for certified claims\",\n          \"mandatory φ* for certified claims\"\n        ],\n        \"definition\": \"weighted ℓ¹ quotient norm; dual max when applicable\",\n        \"laws\": [\n          \"quotient invariant\",\n          \"nonnegative\",\n          \"Φ₁=0 iff ExactRepair\",\n          \"Φ₁ dominates Γ₂ and Ξ\"\n        ],\n        \"forbidden_interpretations\": [\n          \"raw norm ||ω||₁\",\n          \"raw float exact certificate\",\n          \"Γ₂/Ξ override\",\n          \"canonical residual without TieR\"\n        ],\n        \"relationships\": [\n          \"primary evaluation key\",\n          \"defined on Q¹\",\n          \"feeds Γ₂ through selected residual h₁*\",\n          \"R selects a minimizing representative\"\n        ],\n        \"negative_tests\": [\n          \"no minimization\",\n          \"representative-dependent value\",\n          \"dual infeasible\",\n          \"dual norm violation\",\n          \"primal/dual mismatch\",\n          \"saturation failure\",\n          \"raw float exact\",\n          \"Γ₂/Ξ override\"\n        ],\n        \"open_questions\": [\n          \"general certificate-producing solver generation\",\n          \"canonical residual export policy\"\n        ]\n      }\n    }\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_types\",\n    \"module\": \"obstruction_mass\",\n    \"symbols\": [\n      \"ObstructionMass\",\n      \"ObstructionMassError\",\n      \"EvidenceBindings\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
