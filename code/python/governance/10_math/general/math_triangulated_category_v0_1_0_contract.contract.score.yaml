      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:triangulated_category:v0.1.0\",\n  \"title\": \"Triangulated Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"triangulated_category\",\n    \"symbol\": \"(D, [1], Delta) with triangles X -> Y -> Z -> X[1]\",\n    \"ascii_symbol\": \"triangulated_category\",\n    \"notation\": \"(D, [1], Delta) where [1]: D -> D is autoequivalence and Delta is class of distinguished triangles\",\n    \"domain\": [\n      \"additive_category: underlying additive category D with direct sums and zero object\",\n      \"translation_functor: additive autoequivalence T = [1]: D -> D\",\n      \"distinguished_triangles: sextuples (X, Y, Z, u, v, w) forming triangles X -u-> Y -v-> Z -w-> X[1]\",\n      \"verdier_axiom_tr1: identity triangles X -id-> X -> 0 -> X[1] distinguished; closure under isomorphism; cone completion exists\",\n      \"verdier_axiom_tr2: rotation axiom stating (X, Y, Z, u, v, w) distinguished iff (Y, Z, X[1], v, w, -u[1]) distinguished\",\n      \"verdier_axiom_tr3: morphism extension axiom between distinguished triangles\",\n      \"verdier_axiom_tr4: octahedral axiom encoding composition of distinguished triangles for v \\\\circ u into a commuting braid\"\n    ],\n    \"codomain\": {\n      \"description\": \"A triangulated category is an additive category equipped with an autoequivalence translation functor [1] and a distinguished class of triangles satisfying Verdier's four axioms TR1-TR4.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Underlying category is additive with strict zero object and direct sums.\",\n      \"Translation functor [1] is an exact additive autoequivalence.\",\n      {\n        \"Every morphism u\": \"X -> Y can be completed to a distinguished triangle X -> Y -> Z -> X[1] (TR1).\"\n      },\n      {\n        \"Triangles are stable under rotation with exact anti-shift sign -u[1]\": \"Y[1] -> X[2] (TR2).\"\n      },\n      \"Any commuting square between base morphisms of distinguished triangles extends to a morphism of triangles (TR3).\",\n      \"Octahedral axiom commutes strictly across all 8 faces and composite triangles (TR4).\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"TR1: Identity triangle X -id-> X -> 0 -> X[1] is distinguished, isomorphic triangles are distinguished, cone completions exist\",\n    \"TR2 Rotation: (X, Y, Z, u, v, w) distinguished <=> (Y, Z, X[1], v, w, -u[1]) distinguished\",\n    \"TR3 Extension: for distinguished triangles with b \\\\circ u = u' \\\\circ a, there exists c: Z -> Z' completing the triangle morphism\",\n    \"TR4 Octahedron: distinguished triangles on u: X -> Y, v: Y -> Z, and v \\\\circ u: X -> Z form an octahedral braid with a triangle on cones C(u) -> C(v \\\\circ u) -> C(v) -> C(u)[1]\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Triangle sextuples and diagrams serialized in canonical order\",\n      \"Exact rational discrete arithmetic; signs verified algebraically\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"triangulated\",\n    \"symbols\": [\n      \"TriangulatedCategory\",\n      \"DistinguishedTriangle\",\n      \"TranslationFunctor\",\n      \"RotationValidator\",\n      \"OctahedralBraidValidator\"\n    ],\n    \"required_tests\": [\n      \"test_rotation_validator_double_rotation\",\n      \"test_octahedral_axiom_complete_braid\",\n      \"test_kill_mut_p2_03_broken_rotation_axiom_tr2\",\n      \"test_kill_mut_p2_04_non_commuting_octahedral_axiom_tr4\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Category lacks additive structure or zero object\",\n    \"Translation functor [1] fails autoequivalence\",\n    \"Rotation TR2 violates sign change (-u[1] replaced with +u[1]) (BrokenRotationAxiom / MUT-P2-03)\",\n    \"Octahedral axiom TR4 braid fails commutativity (NonCommutingOctahedral / MUT-P2-04)\",\n    \"Cone completion fails to exist for a valid morphism\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A triangulated category abstracts the homological structure of derived categories and stable homotopy categories. It replaces short exact sequences with distinguished triangles and kernels/cokernels with mapping cones. Verdier's axioms TR1-TR4 govern rotation, extension, and octahedral braiding.\",\n    \"non_role\": [\n      \"Stable infinity-category enhancements\",\n      \"Model category fibrant/cofibrant resolutions\",\n      \"Non-additive triangulated structures\"\n    ]\n  },\n  \"wip\": [\n    \"Formal proof of TR1-TR4 in Lean 4 (Triangulated.lean)\",\n    \"Exact octahedral braid commutativity validator in Rust\",\n    \"Discrete verification of negative translation sign -u[1]\"\n  ]\n}\n",
