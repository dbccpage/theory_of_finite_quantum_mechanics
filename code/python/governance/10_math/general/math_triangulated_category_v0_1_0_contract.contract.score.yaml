      "notation": "(D, [1], Delta) where [1]: D -> D is autoequivalence and Delta is class of distinguished triangles",
      "domain": [
        "additive_category: underlying additive category D with direct sums and zero object",
        "translation_functor: additive autoequivalence T = [1]: D -> D",
        "distinguished_triangles: sextuples (X, Y, Z, u, v, w) forming triangles X -u-> Y -v-> Z -w-> X[1]",
        "verdier_axiom_tr1: identity triangles X -id-> X -> 0 -> X[1] distinguished; closure under isomorphism; cone completion exists",
        "verdier_axiom_tr2: rotation axiom stating (X, Y, Z, u, v, w) distinguished iff (Y, Z, X[1], v, w, -u[1]) distinguished",
        "verdier_axiom_tr3: morphism extension axiom between distinguished triangles",
        "verdier_axiom_tr4: octahedral axiom encoding composition of distinguished triangles for v \\circ u into a commuting braid"
      ],
      "codomain": {
        "description": "A triangulated category is an additive category equipped with an autoequivalence translation functor [1] and a distinguished class of triangles satisfying Verdier's four axioms TR1-TR4."
      }
    },
    "requirements": {
      "required_structures": [
        "Underlying category is additive with strict zero object and direct sums.",
        "Translation functor [1] is an exact additive autoequivalence.",
        {
          "Every morphism u": "X -> Y can be completed to a distinguished triangle X -> Y -> Z -> X[1] (TR1)."
        },
        {
          "Triangles are stable under rotation with exact anti-shift sign -u[1]": "Y[1] -> X[2] (TR2)."
        },
        "Any commuting square between base morphisms of distinguished triangles extends to a morphism of triangles (TR3).",
        "Octahedral axiom commutes strictly across all 8 faces and composite triangles (TR4).",
        "Structure hash is deterministically content-addressed."
      ]
    },
    "laws": [
      "TR1: Identity triangle X -id-> X -> 0 -> X[1] is distinguished, isomorphic triangles are distinguished, cone completions exist",
      "TR2 Rotation: (X, Y, Z, u, v, w) distinguished <=> (Y, Z, X[1], v, w, -u[1]) distinguished",
      "TR3 Extension: for distinguished triangles with b \\circ u = u' \\circ a, there exists c: Z -> Z' completing the triangle morphism",
      "TR4 Octahedron: distinguished triangles on u: X -> Y, v: Y -> Z, and v \\circ u: X -> Z form an octahedral braid with a triangle on cones C(u) -> C(v \\circ u) -> C(v) -> C(u)[1]"
    ],
