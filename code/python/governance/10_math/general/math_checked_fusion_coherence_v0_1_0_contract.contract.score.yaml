ave both sides zero.\",\n    \"Full label traversal, F/inverse storage, possible defect records, pentagon scalar calls and both hexagon scalar-call bounds are admitted before coefficient generation.\",\n    \"Sparse traversal preserves lexicographic first-defect labels and agrees with the independently specified nontrivial Z2 defect.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_fusion_categories\",\n    \"module\": \"fusion_category\",\n    \"symbols\": [\n      \"FSymbols\",\n      \"FusionCategory\",\n      \"DEFAULT_CATEGORY_LIMITS\"\n    ],\n    \"required_tests\": [\n      \"generic_category_admission_bounds_storage_and_law_work_before_coefficients\",\n      \"pointed_rank32_replays_every_pentagon_without_dense_label_products\",\n      \"the_pentagon_defect_reports_the_first_tuple_and_both_sides\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Tight storage or law-work admission refuses before invoking a coefficient callback.\",\n    \"Unbounded ring rank is not substituted for an operation budget.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Every pentagon matrix element on admissible four-fold fusion paths is checked exactly; all other label tuples have both sides zero.; Full label traversal, F/inverse storage, possible defect records, pentagon scalar calls and both hexagon scalar-call bounds are admitted before coefficient generation.; Sparse traversal preserves lexicographic first-defect labels and agrees with the independently specified nontrivial Z2 defect..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"Resource refusal does not assert failure of a mathematical law or infiniteness of a closure.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
