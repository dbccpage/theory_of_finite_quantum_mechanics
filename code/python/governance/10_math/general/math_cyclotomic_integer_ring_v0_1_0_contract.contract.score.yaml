      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cyclotomic_integer_ring:v0.1.0\",\n  \"title\": \"Canonical Integral Cyclotomic Ring\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"cyclotomic_integer_ring\",\n    \"symbol\": \"cyclotomic_integer_ring\",\n    \"ascii_symbol\": \"cyclotomic_integer_ring\",\n    \"notation\": \"Canonical Integral Cyclotomic Ring\",\n    \"domain\": [\n      \"Runtime conductor n in 1..=1024\",\n      \"A single Vec<BigInt> canonical power basis modulo the monic cyclotomic polynomial\",\n      \"Rational ingestion proves every coefficient integral and checks its declared count budget; default admission limit 512 coefficients\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_number_theory::cyclotomic_integer; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Canonical integer reduction preserves ring products and character-table inner products\",\n    \"Conjugation is an involutive ring automorphism; zeta times its conjugate and zeta^n both equal one\",\n    \"Stored coefficient count equals phi(n); the allocating rational adapter view is canonically trimmed\",\n    \"The norm is Res(Phi_n,value), an integer, and units are precisely elements of norm plus or minus one\",\n    \"256-bit input coefficients survive admission and exact Gaussian norm replay without narrowing\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"cyclotomic_integer\",\n    \"symbols\": [\n      \"CyclotomicInteger\",\n      \"CyclotomicIntegerError\",\n      \"CyclotomicInteger::new\",\n      \"CyclotomicInteger::with_budget\",\n      \"CyclotomicInteger::from_integer\",\n      \"CyclotomicInteger::from_formal_sum\",\n      \"CyclotomicInteger::root_of_unity\",\n      \"CyclotomicInteger::coefficients\",\n      \"CyclotomicInteger::coefficient_values\",\n      \"CyclotomicInteger::norm\",\n      \"CyclotomicInteger::is_unit\"\n    ],\n    \"required_tests\": [\n      \"the_modulus_is_the_monic_integer_cyclotomic_polynomial\",\n      \"the_stored_coefficient_count_is_the_totient\",\n      \"the_sum_of_all_nth_roots_of_unity_vanishes\",\n      \"a_root_of_unity_times_its_conjugate_is_one\",\n      \"conjugation_is_an_involutive_ring_automorphism\",\n      \"a_conductor_three_element_reduces_and_compares_canonically\",\n      \"invalid_conductors_and_mismatched_operands_are_refused\",\n      \"as_integer_reads_only_true_integers\",\n      \"roots_satisfy_the_order_and_defining_polynomial\",\n      \"canonical_norms_agree_with_fixed_conductor_fields\",\n      \"construction_refuses_invalid_conductors_coefficients_and_cross_ring_arithmetic\",\n      \"integral_admission_and_character_arithmetic_share_unbounded_integer_coefficients\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Conductor zero or greater than 1024, coefficient count overflow, and nonintegral rational coefficients are typed refusals\",\n    \"Cross-conductor arithmetic is refused\",\n    \"Zero and the tested nonunit Gaussian integer have nonunit norm\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Canonical integer reduction preserves ring products and character-table inner products; Conjugation is an involutive ring automorphism; zeta times its conjugate and zeta^n both equal one; Stored coefficient count equals phi(n); the allocating rational adapter view is canonically trimmed; The norm is Res(Phi_n,value), an integer, and units are precisely elements of norm plus or minus one; 256-bit input coefficients survive admission and exact Gaussian norm replay without narrowing.\",\n    \"non_role\": [\n      \"No second numerical ring in Lie or native campaign adapters\",\n      \"No classification of class groups or derivation of cyclotomic unit generators\",\n      \"No numerical approximation or implicit conductor compositum\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
