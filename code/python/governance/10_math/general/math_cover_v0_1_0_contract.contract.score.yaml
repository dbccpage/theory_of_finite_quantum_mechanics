        "subsets: list_of_nonempty_subsets"
      ],
      "codomain": {
        "description": "A Cover consists of: - Base space X: a finite set of points - Index set I: a finite set of cover indices - Assignment function: I → P(X) where P(X) is the power set of X Each index i ∈ I maps to a non-empty subset U_i ⊆ X, and ⋃_{i∈I} U_i = X\n"
      }
    },
    "requirements": {
      "required_structures": [
        "base_space_id must resolve to a valid BaseSpace artifact",
        "cover_indices must be non-empty, distinct, and lexicographically sorted",
        "Number of subsets equals number of cover indices",
        "Each subset is non-empty, contains only points from X, and is sorted",
        "Union of all subsets equals exactly the set X",
        "StructureArtifact hash matches canonical serialization"
      ]
    },
    "laws": [
      "Index set I is non-empty",
      "Each U_i is non-empty",
      "For all i ∈ I, U_i ⊆ X",
      "⋃_{i∈I} U_i = X (every point in X is covered)",
      "Index set I is totally ordered (lexicographic on byte strings)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Cover index identifiers serialized as sorted UTF-8 strings separated by U+001E",
        "Each subset serialized as sorted list of point IDs, each with 2-byte little-endian length prefix",
        "Subsets separated by U+001F",
        "All validators and computation functions are content-addressed"
      ]
    },
