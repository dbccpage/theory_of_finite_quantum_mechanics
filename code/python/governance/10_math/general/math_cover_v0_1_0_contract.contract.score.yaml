    "doctrine": {
      "summary": "A Cover is a finite indexed family of subsets of a finite set X (the base space) whose union is X. Each member of the cover is a non-empty subset of X. The contract records the base space, the index set, and the assignment of subsets to indices. It is used to build the nerve for Čech cohomology and for defining locally trivial structures. No topological properties (openness, contractibility) are asserted.",
