      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:cover:v0.1.0\",\n  \"title\": \"Cover Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"indexed_family\",\n    \"symbol\": \"𝒰 = {U_i}_{i∈I} covering X where ⋃_{i∈I} U_i = X\",\n    \"ascii_symbol\": \"cover\",\n    \"notation\": \"𝒰 = {U_i}_{i∈I} covering X where ⋃_{i∈I} U_i = X\",\n    \"domain\": [\n      \"base_space: finite_set\",\n      \"index_set: finite_ordered_set\",\n      \"subsets: list_of_nonempty_subsets\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Cover consists of: - Base space X: a finite set of points - Index set I: a finite set of cover indices - Assignment function: I → P(X) where P(X) is the power set of X Each index i ∈ I maps to a non-empty subset U_i ⊆ X, and ⋃_{i∈I} U_i = X\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"base_space_id must resolve to a valid BaseSpace artifact\",\n      \"cover_indices must be non-empty, distinct, and lexicographically sorted\",\n      \"Number of subsets equals number of cover indices\",\n      \"Each subset is non-empty, contains only points from X, and is sorted\",\n      \"Union of all subsets equals exactly the set X\",\n      \"StructureArtifact hash matches canonical serialization\"\n    ]\n  },\n  \"laws\": [\n    \"Index set I is non-empty\",\n    \"Each U_i is non-empty\",\n    \"For all i ∈ I, U_i ⊆ X\",\n    \"⋃_{i∈I} U_i = X (every point in X is covered)\",\n    \"Index set I is totally ordered (lexicographic on byte strings)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cover index identifiers serialized as sorted UTF-8 strings separated by U+001E\",\n      \"Each subset serialized as sorted list of point IDs, each with 2-byte little-endian length prefix\",\n      \"Subsets separated by U+001F\",\n      \"All validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"base_space_id does not resolve\",\n    \"cover_indices is empty list []\",\n    \"cover_indices contains duplicates ['U1', 'U1']\",\n    \"cover_indices not sorted ['U2', 'U1']\",\n    \"3 indices but only 2 subsets\",\n    \"A subset is [] (empty)\",\n    \"Subset contains 'p99' which is not in X\",\n    \"Subset is ['b', 'a'] (not sorted)\",\n    \"X has points {1,2,3} but subsets cover only {1,2}\",\n    \"Different serialization conventions produce different hashes\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Cover is a finite indexed family of subsets of a finite set X (the base space) whose union is X. Each member of the cover is a non-empty subset of X. The contract records the base space, the index set, and the assignment of subsets to indices. It is used to build the nerve for Čech cohomology and for defining locally trivial structures. No topological properties (openness, contractibility) are asserted.\",\n    \"non_role\": [\n      \"Topological properties (openness, contractibility) are not encoded\",\n      \"Infinite covers are not supported (only finite sets and finite index sets)\",\n      \"Measure-theoretic properties are not included\",\n      \"Cover does not automatically generate its nerve (requires separate operation)\"\n    ]\n  },\n  \"wip\": [\n    \"Should the Cover contract generate the Nerve as an optional output, or always require a separate ComputationWitness operation?\",\n    \"How should infinite covers (e.g., open covers of manifolds) be handled? Generator function approach?\",\n    \"Should cover properties (open, closed, locally finite) be included as FactEnvelope claims referencing external topological space contracts?\",\n    \"What is the best approach for encoding refinement relationships: as FactEnvelope predicate or as a separate RefinementArtifact?\",\n    \"Should Lebesgue number property be supported for metric space covers, or is that out of scope?\",\n    \"Contract treats subsets as plain sets with no topological or measure-theoretic properties\",\n    \"Only finite covers supported; infinite covers would require generator function and lazy evaluation\",\n    \"Nerve computation is a separate operation producing ComputationWitness, not automatic\",\n    \"Refinement checking is a FactEnvelope predicate referencing both Cover artifacts\",\n    \"Common refinement computation creates new Cover artifact with intersections\",\n    \"Cover properties (partition, open, closed) are FactEnvelope claims, not part of core contract\",\n    \"Serialization uses U+001E for index separator and U+001F for subset separator with 2-byte length prefixes\",\n    \"All operations are deterministic and content-addressed for replay\"\n  ]\n}\n",
