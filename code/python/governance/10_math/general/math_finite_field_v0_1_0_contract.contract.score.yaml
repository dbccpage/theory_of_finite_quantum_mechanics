        "is_prime",
        "checked_pow"
      ],
      "required_tests": [
        "the_trace_lands_in_f_p_with_uniform_fibres",
        "the_field_axioms_hold_on_gf27",
        "constructors_refuse_non_primes",
        "irreducibility_helpers_refuse_invalid_or_reducible_inputs",
        "a_reducible_modulus_is_not_a_field_and_fails_the_identities"
      ]
    },
    "negative_tests": [
      "A composite characteristic must be refused by the checked constructors",
      "A reducible modulus must not be accepted as irreducible",
      "A field whose order overflows usize must be refused"
    ],
    "doctrine": {
      "summary": "Enumerated finite fields GF(p^k) as polynomials over F_p modulo a monic irreducible, with the absolute trace used to build additive characters.",
      "non_role": [
        "Large finite fields that cannot be enumerated",
        "Elliptic curves over finite fields"
      ]
    },
    "wip": [
      "FiniteField::new does not check irreducibility of a supplied modulus (use with_first_irreducible)",
