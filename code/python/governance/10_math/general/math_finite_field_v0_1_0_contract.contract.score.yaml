      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_field:v0.1.0\",\n  \"title\": \"Finite Field GF(p^k) Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_field\",\n    \"symbol\": \"GF(p^k) = F_p[x] / (f), f monic irreducible of degree k\",\n    \"ascii_symbol\": \"finite_field\",\n    \"notation\": \"GF(p^k) = F_p[x] / (f), f monic irreducible of degree k\",\n    \"domain\": [\n      \"prime p\",\n      \"degree k >= 1\",\n      \"monic modulus of degree k over F_p\"\n    ],\n    \"codomain\": {\n      \"description\": \"The field GF(p^k) with every element enumerated, addition, multiplication, powers and the absolute trace to F_p.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"p must be prime; a degree of zero or an overflowing order p^k is refused\",\n      \"The absolute trace lands in F_p; a reducible modulus is detected by the trace leaving F_p\",\n      \"Irreducibility is decided by trial division by monic divisors up to half the degree\"\n    ]\n  },\n  \"laws\": [\n    \"a^(q-1) = 1 for every nonzero a in GF(q) (Fermat)\",\n    \"The trace has uniform fibres: every value of F_p is taken q/p times\",\n    \"Every nonzero element has a multiplicative inverse\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"finite_field\",\n    \"symbols\": [\n      \"FiniteField\",\n      \"FieldElement\",\n      \"find_irreducible_monic\",\n      \"is_irreducible_monic\",\n      \"is_prime\",\n      \"checked_pow\"\n    ],\n    \"required_tests\": [\n      \"the_trace_lands_in_f_p_with_uniform_fibres\",\n      \"the_field_axioms_hold_on_gf27\",\n      \"constructors_refuse_non_primes\",\n      \"irreducibility_helpers_refuse_invalid_or_reducible_inputs\",\n      \"a_reducible_modulus_is_not_a_field_and_fails_the_identities\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A composite characteristic must be refused by the checked constructors\",\n    \"A reducible modulus must not be accepted as irreducible\",\n    \"A field whose order overflows usize must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Enumerated finite fields GF(p^k) as polynomials over F_p modulo a monic irreducible, with the absolute trace used to build additive characters.\",\n    \"non_role\": [\n      \"Large finite fields that cannot be enumerated\",\n      \"Elliptic curves over finite fields\"\n    ]\n  },\n  \"wip\": [\n    \"FiniteField::new does not check irreducibility of a supplied modulus (use with_first_irreducible)\",\n    \"arithmetic uses usize coefficients and is not hardened against a mismatched element degree\"\n  ]\n}\n",
