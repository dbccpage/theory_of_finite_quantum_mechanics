        "monic modulus of degree k over F_p"
      ],
      "codomain": {
        "description": "The field GF(p^k) with every element enumerated, addition, multiplication, powers and the absolute trace to F_p."
      }
    },
    "requirements": {
      "required_structures": [
        "p must be prime; a degree of zero or an overflowing order p^k is refused",
        "The absolute trace lands in F_p; a reducible modulus is detected by the trace leaving F_p",
        "Irreducibility is decided by trial division by monic divisors up to half the degree"
      ]
    },
    "laws": [
      "a^(q-1) = 1 for every nonzero a in GF(q) (Fermat)",
      "The trace has uniform fibres: every value of F_p is taken q/p times",
      "Every nonzero element has a multiplicative inverse"
    ],
    "replay": {
