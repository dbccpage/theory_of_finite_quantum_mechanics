    "doctrine": {
      "summary": "A ContractibleType is a type that is homotopically trivial: it has exactly one element up to paths. Formally, A is contractible if there exists a center c : A and for all x : A, a path c = x. The contract validates the center and the contraction paths. Contractible types are the (-2)-truncated types and serve as the unit of homotopy type theory.",
