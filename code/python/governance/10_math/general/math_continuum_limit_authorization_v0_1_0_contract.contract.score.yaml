      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:continuum_limit_authorization:v0.1.0\",\n  \"title\": \"ContinuumLimitAuthorization Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"continuum_limit_structure\",\n    \"symbol\": \"Auth(lim_{-->} F) := (F, cofinal, convergence, consistency)\",\n    \"ascii_symbol\": \"continuum_limit_authorization\",\n    \"notation\": \"Auth(lim_{-->} F) := (F, cofinal, convergence, consistency)\",\n    \"domain\": [\n      \"directed_system: A functor F: I -> C from a directed poset I to a category C of finite shadows\",\n      \"cofinal_witness: A proof that the directed system is cofinal in the continuum object\",\n      \"convergence_data: Data showing the colimit lim_{-->} F exists in C\",\n      \"overlap_consistency: Coherence data for agreement on overlapping finite shadows\"\n    ],\n    \"codomain\": {\n      \"description\": \"A directed system of finite shadows with convergence data and cofinal witness\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The directed system F: I -> C must be a valid functor from a directed poset\",\n      \"The cofinal witness must demonstrate coverage of the continuum object\",\n      \"Convergence data must prove the colimit exists\",\n      \"Transition maps must be coherent on overlaps\",\n      \"Artifact hash must be SHA-256 over all component hashes\"\n    ]\n  },\n  \"laws\": [\n    \"The indexing poset I is directed and F is a valid functor\",\n    \"The directed system is cofinal: for every finite shadow S, there exists alpha in I with S <= F(alpha)\",\n    \"The colimit lim_{-->} F exists and is unique up to canonical isomorphism\",\n    \"For alpha <= beta in I, the transition map F(alpha) -> F(beta) is consistent\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All validators content-addressed\",\n      \"Given same inputs, must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Non-directed poset or invalid functor must be rejected\",\n    \"Missing or invalid cofinality proof must be rejected\",\n    \"System without convergence data must be rejected\",\n    \"Incoherent transition maps must be rejected\",\n    \"Artifact claiming operational authority must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A ContinuumLimitAuthorization encodes the mathematical prerequisites for promoting a finite-shadow (discrete approximation) to a continuum-level object. It bundles a directed system of finite approximations, a cofinal witness demonstrating that the system covers the continuum object, and convergence data showing that the limit exists and is well-defined. This contract validates the mathematical conditions only; it confers no operational authority and makes no policy decisions.\",\n    \"non_role\": [\n      \"Does not confer operational authority or permissions\",\n      \"Does not emit policy decisions about system behavior\",\n      \"Does not classify admissibility of any entity\",\n      \"Does not perform the actual limit computation\"\n    ]\n  },\n  \"wip\": [\n    \"Relationship between continuum limit authorization and the CODA-CS continuum finite-shadow tower\",\n    \"Whether cofinality should be defined categorically or order-theoretically\",\n    \"Interaction with transfinite indexing systems for uncountable directed sets\",\n    \"Currently in WIP status - full implementation pending\",\n    \"Convergence criteria need formal specification\",\n    \"Integration with omega_engine continuum tower needs design\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"unbounded_derived\",\n    \"symbols\": [\n      \"UnboundedDerivedCategory\",\n      \"ResolutionStrategy\"\n    ],\n    \"required_tests\": [\n      \"test_unbounded_derived_category_and_resolutions\"\n    ]\n  }\n}\n",
