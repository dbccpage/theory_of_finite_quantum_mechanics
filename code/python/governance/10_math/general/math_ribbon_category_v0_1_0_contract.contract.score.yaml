      "symbol": "(C, tensor, beta, theta, dual)",
      "ascii_symbol": "ribbon_category",
      "notation": "(C, tensorObj, braiding, twist, dual, ev, coev)",
      "domain": [
        "underlying_category: braided monoidal category (br : BraidedCategory Obj)",
        "rigid_structure: rigid monoidal structure with dual objects X*, ev, and coev",
        "twist: natural ribbon automorphism theta_X: X -> X",
        "snake_equations: left and right zig-zag equations for evaluation and coevaluation",
        "quantum_trace: Tr_q(f) = ev o beta_{X, X*} o ((f o theta_X) tensor id_{X*}) o coev",
        "quantum_dim: dim_q(X) = Tr_q(id_X)"
      ],
      "codomain": {
        "description": "A ribbon category (tortile category) is a braided monoidal category equipped with a compatible rigid duality and a natural twist automorphism theta_X: X -> X satisfying the ribbon axiom and duality compatibility."
      }
    },
    "requirements": {
      "required_structures": [
        "Underlying structure must be a valid braided monoidal category satisfying hexagon axioms.",
        "Rigid structure must supply dual objects X*, evaluation ev_X, and coevaluation coev_X.",
        "Left and right snake / zig-zag equations must hold for evaluation and coevaluation.",
        "Twist theta must be a natural isomorphism theta_X: X ≅ X.",
        "Ribbon axiom theta_{X tensor Y} = (theta_X tensor theta_Y) o beta_{X,Y} o beta_{Y,X} must hold.",
        "Twist must be compatible with duality: theta_{X*} = (theta_X)* via dualMorphism.",
        "Quantum trace and quantum dimension must be deterministically computable.",
        "Artifact hash is deterministically computed from structural data."
      ]
    },
    "laws": [
      "Braided category: (C, tensor, beta) satisfies monoidal and hexagon coherence axioms",
      "Twist naturality: comp f (twist Y).hom = comp (twist X).hom f",
      "Ribbon axiom: (twist (tensorObj X Y)).hom = comp (tensorHom (twist X).hom (twist Y).hom) (comp (braiding X Y).hom (braiding Y X).hom)",
      "Twist duality compatibility: (twist (dual X)).hom = dualMorphism (twist X).hom",
      "Left snake equation: comp (leftUnitor X).inv (comp (tensorHom (coev X) (cat.id X)) (comp (associator X (dual X) X).hom (comp (tensorHom (cat.id X) (ev X)) (rightUnitor X).hom))) = cat.id X",
      "Right snake equation: comp (rightUnitor (dual X)).inv (comp (tensorHom (cat.id (dual X)) (coev X)) (comp (associator (dual X) X (dual X)).inv (comp (tensorHom (ev X) (cat.id (dual X))) (leftUnitor (dual X)).hom))) = cat.id (dual X)",
      "Quantum trace definition: quantumTrace f = comp (coev X) (comp (tensorHom (comp f (twist X).hom) (cat.id (dual X))) (comp (braiding X (dual X)).hom (ev X)))",
      "Quantum dimension definition: quantumDim X = quantumTrace (cat.id X)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
