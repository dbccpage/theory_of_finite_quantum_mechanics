      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_obstruction_trichotomy:v0.2.0\",\n  \"title\": \"Finite Obstruction Trichotomy\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1_obstruction_mass:v1.0.0\",\n        \"urn:omega:math:gamma2_closure_defect:v1.0.0\",\n        \"urn:omega:math:phi1:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        \"PO-D3\",\n        \"PO-D2b\"\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": [\n        \"ExactRepair\",\n        \"StabilizedSurvivor\",\n        \"OpenObstruction\"\n      ]\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"Invalid\",\n        \"Incomparable\",\n        \"TriRefused(NumericUndecidable)\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_exact_classifier\",\n    \"symbol\": \"ExactRepair | StabilizedSurvivor | OpenObstruction\",\n    \"ascii_symbol\": \"FiniteObstructionClass\",\n    \"domain\": [\n      \"verified exact finite rational Phi1 certificate\",\n      \"exact rational Gamma2 quotient evidence\"\n    ],\n    \"codomain\": {\n      \"classes\": [\n        \"ExactRepair\",\n        \"StabilizedSurvivor\",\n        \"OpenObstruction\"\n      ],\n      \"meta_outcomes\": [\n        \"Invalid\",\n        \"Incomparable\",\n        \"TriRefused(NumericUndecidable)\"\n      ]\n    },\n    \"definition\": {\n      \"exact_repair\": \"Phi1 = 0\",\n      \"stabilized_survivor\": \"Phi1 > 0 and Gamma2 = 0\",\n      \"open_obstruction\": \"Phi1 > 0 and Gamma2 > 0\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"verified exact rational Phi1 primal-dual certificate\",\n      \"exact rational Gamma2 value computed from the certified Phi1 residual\",\n      \"exact verification that d1 d0 = 0\",\n      \"same residual and d0 repair map in the Phi1 and Gamma2 artifacts\"\n    ],\n    \"compatibility\": [\n      \"Phi1 and Gamma2 must refer to the same carrier/layer or declared transport\"\n    ],\n    \"refusal_if_approximate\": [\n      \"TriRefused(NumericUndecidable)\"\n    ]\n  },\n  \"laws\": {\n    \"totality\": \"Under verified exact finite rational Phi1/Gamma2 evidence, exactly one trichotomy class holds.\",\n    \"survivor_meaning\": \"Survivor means StabilizedSurvivor only.\",\n    \"descriptive_only\": \"Trichotomy does not decide admissibility and does not issue ActionLicense.\",\n    \"closure_dependency\": \"StabilizedSurvivor depends on exact Gamma2 = 0.\",\n    \"exact_dependency\": \"ExactRepair depends on exact certified Phi1 = 0.\",\n    \"floating_firewall\": \"No floating heuristic may emit an exact trichotomy constructor.\"\n  },\n  \"equivalence\": {\n    \"class_equality\": \"Same enum label under same comparison mode and compatible carrier/layer.\",\n    \"exact_mode\": \"Exact comparisons require exact scalar semantics.\",\n    \"tolerance_mode\": \"Tolerance comparisons are diagnostic-only and return TriRefused(NumericUndecidable) at the exact-classifier boundary.\"\n  },\n  \"replay\": {\n    \"requirements\": [\n      \"finite numeric values\",\n      \"no NaN\",\n      \"no infinite values\",\n      \"nonnegative Phi1 and Gamma2\",\n      \"exact rational arithmetic replay\",\n      \"mandatory Phi1 primal-dual certificate replay\",\n      \"exact Gamma2 and d1d0 = 0 replay\",\n      \"carrier/layer compatibility replay\"\n    ]\n  },\n  \"relationships\": {\n    \"Phi1\": \"Primary scalar; determines ExactRepair versus survivor/open cases.\",\n    \"Gamma2\": \"Closure scalar; separates StabilizedSurvivor from OpenObstruction when Phi1 > 0.\",\n    \"Z1\": \"Gamma2 = 0 corresponds to closed residual under valid Gamma2 definition.\",\n    \"H1\": \"StabilizedSurvivor corresponds to a closed nonexact residual class under valid Phi1/Gamma2 definitions.\",\n    \"Q1\": \"ExactRepair means the Q1 class has zero Phi1.\",\n    \"EvaluationHierarchy\": \"Trichotomy describes state; hierarchy compares before/after diagnostics.\",\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_policy\",\n    \"module\": \"trichotomy\",\n    \"symbols\": [\n      \"CertifiedExactTrichotomy\",\n      \"ObstructionDiagnosticClass\",\n      \"TrichotomyOutcome\",\n      \"TrichotomyRefusal\",\n      \"classify_exact\"\n    ]\n  },\n  \"negative_tests\": [\n    \"NaN values\",\n    \"Infinite values\",\n    \"Negative Phi1 or Gamma2\",\n    \"Tolerance mode used to emit exact trichotomy\",\n    \"StabilizedSurvivor claimed with Gamma2 > 0\",\n    \"ExactRepair claimed with Phi1 > 0\",\n    \"OpenObstruction claimed with Gamma2 = 0\",\n    \"Phi1 and Gamma2 from different carriers compared without transport\",\n    \"Trichotomy used as ActionLicense\",\n    \"Trichotomy rendered as customer-facing claim\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Descriptive exact finite rational classifier for obstruction state. It is not a policy decision, not a customer-facing claim, and not an authority source.\\n\",\n    \"non_role\": [\n      \"Does not decide admissibility.\",\n      \"Does not rank business severity.\",\n      \"Does not issue ActionLicense.\",\n      \"Does not issue certificates.\",\n      \"Does not terminalize.\",\n      \"Does not produce customer-facing claims.\"\n    ],\n    \"compact_yaml\": {\n      \"FINITE_OBSTRUCTION_TRICHOTOMY_CONTRACT\": {\n        \"symbol\": \"ExactRepair|StabilizedSurvivor|OpenObstruction\",\n        \"ascii_symbol\": \"FiniteObstructionClass\",\n        \"formula\": \"ExactRepair iff Phi1=0; StabilizedSurvivor iff Phi1>0 and Gamma2=0; OpenObstruction iff Phi1>0 and Gamma2>0\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"Phi1,Gamma2 with comparison mode\",\n        \"codomain\": \"descriptive obstruction class\",\n        \"required_structures\": [\n          \"verified exact rational Phi1 primal-dual certificate\",\n          \"exact rational Gamma2 value computed from the certified Phi1 residual\",\n          \"exact verification that d1 d0 = 0\",\n          \"carrier/layer compatibility or declared transport\"\n        ],\n        \"definition\": \"ExactRepair iff Phi1=0; StabilizedSurvivor iff Phi1>0 and Gamma2=0; OpenObstruction iff Phi1>0 and Gamma2>0\",\n        \"laws\": [\n          \"total under verified exact finite rational Phi1/Gamma2 evidence\",\n          \"descriptive only; does not decide admissibility\",\n          \"floating heuristics cannot emit exact trichotomy constructors\"\n        ],\n        \"forbidden_interpretations\": [\n          \"floating heuristic exact class\",\n          \"policy decision\",\n          \"ActionLicense\",\n          \"business severity ranking\",\n          \"customer claim\"\n        ],\n        \"relationships\": [\n          \"Phi1 determines ExactRepair versus survivor/open cases\",\n          \"Gamma2 separates StabilizedSurvivor from OpenObstruction when Phi1 > 0\",\n          \"EvaluationHierarchy compares before/after diagnostics\"\n        ],\n        \"negative_tests\": [\n          \"NaN or infinite values\",\n          \"negative Phi1 or Gamma2\",\n          \"tolerance mode emits exact trichotomy\",\n          \"carrier mismatch without transport\",\n          \"trichotomy used as ActionLicense\"\n        ],\n        \"open_questions\": [\n          \"canonical tolerance-zero predicate\",\n          \"optional diagnostic vocabulary for approximate displays\"\n        ]\n      }\n    }\n  },\n  \"wip\": [\n    \"Canonical tolerance-zero predicate.\",\n    \"Positive/zero/indeterminate tolerance vocabulary.\",\n    \"Optional diagnostic vocabulary for approximate displays; it must not force an exact class.\"\n  ]\n}\n",
