      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:fusion_ring:v0.1.0\",\n  \"title\": \"Fusion Ring Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"based_ring\",\n    \"symbol\": \"K_0 with a x b = sum_c N_{ab}^c c\",\n    \"ascii_symbol\": \"fusion_ring\",\n    \"notation\": \"N_{ab}^c in Z_{>=0}, unit 0, dual a*\",\n    \"domain\": [\n      \"labels: simple objects 0..r-1, the unit at label 0, r at most 32\",\n      \"structure_constants: non-negative integers N_{ab}^c\",\n      \"duality: the unique a* with N_{a a*}^0 = 1\"\n    ],\n    \"codomain\": {\n      \"description\": \"A table of non-negative integer structure constants that satisfies the unit, associativity, duality and Frobenius-reciprocity laws. The ring of a braided category is commutative.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Structure constants are checked non-negative integers; sums are checked and never wrap\",\n      \"Label 0 is the unit\",\n      \"Every label has a dual and duality is an involution\"\n    ]\n  },\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact integer arithmetic only; fusion-path counts are arbitrary precision\"\n    ]\n  },\n  \"laws\": [\n    \"unit: N_{0a}^c = N_{a0}^c = delta_{ac}\",\n    \"associativity: sum_e N_{ab}^e N_{ec}^d = sum_f N_{bc}^f N_{af}^d\",\n    \"duality: N_{ab}^0 = 1 exactly for b = a*, and (a*)* = a\",\n    \"Frobenius reciprocity: N_{ab}^c = N_{a* c}^b = N_{c b*}^a\",\n    \"the Frobenius-Perron dimension of a is the largest real root of det(x - N_a) with (N_a)_{bc} = N_{ab}^c\",\n    \"the global dimension D^2 = sum_a d_a^2 is the Perron eigenvalue of sum_a N_a N_{a*}\",\n    \"the number of fusion paths from the unit through a word w to c is the c-th entry of the product of the fusion matrices of w applied to the unit vector\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A table whose unit row is not the identity must be refused as a unit defect\",\n    \"A table with N_{ab}^c != N_{ba}^c must be reported as a commutativity defect when commutativity is required\",\n    \"A table violating associativity must be refused and report the first failing index\",\n    \"A table in which the unit occurs twice in a x a must be refused as having no dual\",\n    \"A table violating Frobenius reciprocity must be refused\",\n    \"A table of the wrong flat length, or of rank zero or above the maximum, must be refused\",\n    \"A label outside 0..rank must be refused\",\n    \"Fusion-path counts must not wrap (a count that does not fit u64 is an error, not a wrapped number)\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_fusion_categories\",\n    \"module\": \"fusion_ring\",\n    \"symbols\": [\n      \"FusionTable\",\n      \"FusionRing\",\n      \"RingDefect\",\n      \"AbelianGroup\"\n    ],\n    \"required_tests\": [\n      \"mutated_tables_are_refused_by_exactly_the_law_they_break\",\n      \"frobenius_reciprocity_is_a_separate_law_with_its_own_defect\",\n      \"shapes_and_labels_are_refused_with_typed_errors\",\n      \"sigma_paths_count_the_parity_sectors_with_exact_arithmetic\",\n      \"frobenius_perron_dimensions_are_exact\",\n      \"the_catalog_rings_have_their_known_shape\"\n    ]\n  },\n  \"doctrine\": {\n    \"summary\": \"The based ring of simple objects of a fusion category, as a validated table of non-negative integer structure constants, with exact Frobenius-Perron dimensions (integer, quadratic surd, or an isolated root with a Sturm-certified rational interval).\",\n    \"non_role\": [\n      \"Does not decide whether a ring is categorifiable (that needs F-symbols)\",\n      \"Does not compute anything for rings of rank above 32\",\n      \"Makes no statement about any physical system\"\n    ]\n  },\n  \"wip\": [\n    \"Frobenius-Perron dimensions of higher degree are isolated roots, not closed forms\",\n    \"Non-commutative rings are accepted by validation but have no braided structure\",\n    \"Lean counterparts are not written\"\n  ]\n}\n",
