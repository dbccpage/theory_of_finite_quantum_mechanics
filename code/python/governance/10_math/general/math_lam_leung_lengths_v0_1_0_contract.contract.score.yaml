      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:lam_leung_lengths:v0.1.0\",\n  \"title\": \"Lam-Leung Vanishing-Sum Lengths\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"lam_leung_lengths\",\n    \"symbol\": \"lam_leung_lengths\",\n    \"ascii_symbol\": \"lam_leung_lengths\",\n    \"notation\": \"Lam-Leung Vanishing-Sum Lengths\",\n    \"domain\": [\n      \"A positive conductor n and nonnegative integer weight\",\n      \"Declared exact factorization and residue-search budgets\"\n    ],\n    \"codomain\": {\n      \"description\": \"Exact finite constructions implemented by omega_number_theory::vanishing_sums; results remain scoped to the declared carrier and budgets.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Exact arithmetic and explicit finite carrier validation\",\n      \"A typed refusal for unsupported or exhausted computations\"\n    ]\n  },\n  \"laws\": [\n    \"Allowed weights form the numerical semigroup generated by distinct prime divisors of n\",\n    \"Returned prime-polygon multiplicities sum exactly to the declared weight\",\n    \"The result permits repeated roots and makes no irreducible-sum classification claim\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact independent witness replay where a witness is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"vanishing_sums\",\n    \"symbols\": [\n      \"VanishingLengthWitness\",\n      \"lam_leung_length\",\n      \"VanishingLengthError\"\n    ],\n    \"required_tests\": [\n      \"lam_leung_lengths_match_small_exhaustive_numerical_semigroups\",\n      \"prime_polygon_witness_replays_in_the_actual_cyclotomic_field\",\n      \"exhausted_search_and_mutated_witnesses_are_refused\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject zero conductor, exhausted search, excessive residue carriers and mutated witnesses\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Lam-Leung Vanishing-Sum Lengths on a declared finite carrier.\",\n    \"non_role\": [\n      \"PROVED, GlobalGreen, or operational authority\",\n      \"Continuum or infinite-carrier completion claims\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite checks are local evidence; no theorem-prover discharge is asserted.\"\n  ]\n}\n",
