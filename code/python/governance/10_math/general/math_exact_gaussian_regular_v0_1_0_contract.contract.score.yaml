      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_gaussian_regular:v0.1.0\",\n  \"title\": \"Exact Gaussian Regular Representation\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_gaussian_regular\",\n    \"symbol\": \"exact_gaussian_regular\",\n    \"ascii_symbol\": \"exact_gaussian_regular\",\n    \"notation\": \"Exact Gaussian Regular Representation\",\n    \"domain\": [\n      \"Gaussian rationals and checked rational 2x2 matrices\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_number_theory::gaussian_regular; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"a+bi maps to [[a,-b],[b,a]] injectively\",\n    \"The map preserves one, addition and multiplication exactly\",\n    \"The image of i squares to -I, while the real sign matrix squares to I\",\n    \"The inverse image test recognizes exactly the regular-representation shape\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"gaussian_regular\",\n    \"symbols\": [\n      \"regular_representation\",\n      \"regular_coordinates\"\n    ],\n    \"required_tests\": [\n      \"the_complex_structure_squares_to_minus_one_and_the_sign_to_plus_one\",\n      \"the_regular_representation_is_an_injective_unital_ring_homomorphism\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Wrong dimensions and 2x2 matrices outside the regular image return no coordinates\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"a+bi maps to [[a,-b],[b,a]] injectively; The map preserves one, addition and multiplication exactly; The image of i squares to -I, while the real sign matrix squares to I; The inverse image test recognizes exactly the regular-representation shape.\",\n    \"non_role\": [\n      \"No preferred physical complex structure is inferred from an arbitrary real sign carrier\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
