      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bicategory:v0.1.0\",\n  \"title\": \"Bicategory Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"bicategory\",\n    \"symbol\": \"B (bicategory with 0-cells, 1-cells, 2-cells, compositions, coherence)\",\n    \"ascii_symbol\": \"bicategory\",\n    \"notation\": \"B = (Obj, Hom, Hom2, id1, hcomp1, id2, vcomp, hcomp2, associator, left_unitor, right_unitor)\",\n    \"domain\": [\n      \"zero_cells: (Obj : Type u) collection of objects (0-cells)\",\n      \"one_cells: (Hom : Obj -> Obj -> Type v) 1-morphisms with source and target 0-cells\",\n      \"two_cells: (Hom2 : Hom A B -> Hom A B -> Type w) 2-morphisms between parallel 1-cells\",\n      \"vertical_composition: (vcomp : Hom2 f g -> Hom2 g h -> Hom2 f h) with vertical identity id2\",\n      \"horizontal_composition_1: (hcomp1 : Hom A B -> Hom B C -> Hom A C) with identity 1-cells id1\",\n      \"horizontal_composition_2: (hcomp2 : Hom2 f1 f2 -> Hom2 g1 g2 -> Hom2 (hcomp1 f1 g1) (hcomp1 f2 g2))\",\n      \"whisker_left: whiskerLeft f beta = hcomp2 (id2 f) beta\",\n      \"whisker_right: whiskerRight alpha g = hcomp2 alpha (id2 g)\",\n      \"associator: natural 2-isomorphism associator (f : Hom A B) (g : Hom B C) (h : Hom C D) : Iso2 (hcomp1 (hcomp1 f g) h) (hcomp1 f (hcomp1 g h))\",\n      \"left_unitor: natural 2-isomorphism leftUnitor (f : Hom A B) : Iso2 (hcomp1 (id1 A) f) f\",\n      \"right_unitor: natural 2-isomorphism rightUnitor (f : Hom A B) : Iso2 (hcomp1 f (id1 B)) f\"\n    ],\n    \"codomain\": {\n      \"description\": \"A bicategory consists of 0-cells, 1-cells with source and target, 2-cells between parallel 1-cells, vertical composition forming a category on each Hom(A, B), horizontal composition operations on 1-cells and 2-cells, and coherent associator and left/right unitor 2-isomorphisms.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"All 1-cells have valid source/target 0-cells; all 2-cells have parallel source/target 1-cells.\",\n      \"For each pair of 0-cells A, B, the 1-cells and 2-cells form a category under vertical composition with identity 2-cells.\",\n      \"Horizontal composition of 1-cells and 2-cells respects boundaries and preserves vertical identities.\",\n      \"Whiskering operations whiskerLeft and whiskerRight correspond to horizontal composition with identity 2-cells.\",\n      \"The middle-four interchange law hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta) holds.\",\n      \"The Mac Lane pentagon coherence diagram for associators commutes.\",\n      \"The Mac Lane triangle coherence diagram relating associator and unitors commutes.\",\n      \"Structure hash is deterministically computed from cell and morphism data.\"\n    ]\n  },\n  \"laws\": [\n    \"Vertical category axioms: vcomp (vcomp alpha beta) gamma = vcomp alpha (vcomp beta gamma), vcomp (id2 f) alpha = alpha, vcomp alpha (id2 g) = alpha\",\n    \"Horizontal identity preservation: hcomp2 (id2 f) (id2 g) = id2 (hcomp1 f g)\",\n    \"Middle-four interchange law: hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta)\",\n    \"Associator naturality: vcomp (hcomp2 (hcomp2 alpha beta) gamma) (associator f2 g2 h2).hom = vcomp (associator f1 g1 h1).hom (hcomp2 alpha (hcomp2 beta gamma))\",\n    \"Left unitor naturality: vcomp (whiskerLeft (id1 A) alpha) (leftUnitor f2).hom = vcomp (leftUnitor f1).hom alpha\",\n    \"Right unitor naturality: vcomp (whiskerRight alpha (id1 B)) (rightUnitor f2).hom = vcomp (rightUnitor f1).hom alpha\",\n    \"Mac Lane pentagon axiom: vcomp (whiskerRight (associator f g h).hom k) (vcomp (associator f (hcomp1 g h) k).hom (whiskerLeft f (associator g h k).hom)) = vcomp (associator (hcomp1 f g) h k).hom (associator f g (hcomp1 h k)).hom\",\n    \"Mac Lane triangle axiom: vcomp (associator f (id1 B) g).hom (whiskerLeft f (leftUnitor g).hom) = whiskerRight (rightUnitor f).hom g\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cells and morphisms serialized in canonical order\",\n      \"All compositions deterministic\",\n      \"Validators and computation functions content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"scope\": \"finite_table_diagnostics_only\",\n    \"complete_contract_implementation\": false,\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"bicategory\",\n    \"symbols\": [\n      \"Bicategory\",\n      \"FiniteBicategory\",\n      \"Invertible2Cell\"\n    ],\n    \"required_tests\": [\n      \"test_triangle_coherence_verified\",\n      \"test_invertibility_violation_caught\",\n      \"test_challenge_mut_05_triangle_coherence_enforcement\",\n      \"test_challenge_mut_06_pentagon_coherence_enforcement\"\n    ]\n  },\n  \"negative_tests\": [\n    \"1-cell source/target not in 0-cells (ZeroCellNotFound or OneCellBoundaryMismatch)\",\n    \"2-cells with non-parallel source/target 1-cells (TwoCellBoundaryMismatch)\",\n    \"Vertical composition not associative or lacks units (VerticalNotComposable)\",\n    \"Horizontal composition boundary mismatch (HorizontalNotComposable)\",\n    \"Middle-four interchange law violated (ExchangeLawViolation)\",\n    \"Mac Lane pentagon axiom violated (PentagonCoherenceViolation)\",\n    \"Mac Lane triangle axiom violated (TriangleCoherenceViolation)\",\n    \"Associator is not an invertible 2-cell (InvertibilityViolation)\",\n    \"Unitor is not an invertible 2-cell (InvertibilityViolation)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Bicategory (weak 2-category) consists of 0-cells, 1-cells, and 2-cells where composition of 1-cells is associative and unital up to coherent 2-isomorphisms (associators and unitors). Coherence is governed by Mac Lane's pentagon and triangle identities and the middle-four interchange law.\",\n    \"non_role\": [\n      \"Strict 2-categories (where associator and unitors are identity morphisms)\",\n      \"Tricategories (weak 3-categories)\",\n      \"Double categories (with two independent composition directions)\",\n      \"Monoidal categories (which are one-object bicategories via delooping)\"\n    ]\n  },\n  \"wip\": [\n    \"General coherence, strictification, and Lean-to-Rust semantic correspondence are not proved.\",\n    \"The Lean structure records laws as hypotheses; compilation does not validate arbitrary input data.\",\n    \"The Rust binding supplies finite tables and selected diagnostics, not complete category certification.\"\n  ],\n  \"lean_binding\": {\n    \"path\": \"lean4/research_programs/higher_category_theory/Bicategory.lean\",\n    \"symbol\": \"HigherCategoryTheory.Bicategory\",\n    \"scope\": \"algebraic_structure_with_law_fields\"\n  }\n}\n",
