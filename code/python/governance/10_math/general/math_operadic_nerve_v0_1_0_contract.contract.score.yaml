      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:operadic_nerve:v0.1.0\",\n  \"title\": \"Higher-Dimensional Operadic Nerve Functor Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"operadic_nerve\",\n    \"symbol\": \"N : ColouredOperad -> (∞, 1)-Cat\",\n    \"ascii_symbol\": \"operadic_nerve\",\n    \"notation\": \"N(O) mapping coloured operads to Joyal quasi-categories via simplicial spine nerve\",\n    \"domain\": [\n      \"coloured_operad: multicategory with colours, multi-ary operations, identities, and unary spine composition\",\n      \"inner_horns: simplicial inner horns Lambda^k_n for 0 < k < n\"\n    ],\n    \"codomain\": {\n      \"description\": \"An operadic nerve functor maps each coloured operad O to a simplicial set N(O) such that the underlying unary spine forms a Joyal quasi-category. Every inner horn Lambda^1_2 composed of compatible operations f01 and f12 admits a constructive filler whose missing face d1 is the operadic composite f12 o_1 f01.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Coloured operad with strict unary associativity and unitality.\",\n      \"Functorial realization of underlying 1-category ColouredOperad.toCategory.\",\n      \"Constructive inner horn filler fillInnerHorn2_1 matching outer faces d0 and d2.\",\n      \"Quasi-category satisfaction theorem operadic_nerve_is_quasi_category in Lean 4.\",\n      \"Strictly zero floating-point arithmetic (0 f32/f64) in Rust implementation.\",\n      \"Soviet memory allocation bounds enforced via reserve_exact and OperationLimits.\",\n      \"Deterministic content-addressed artifact hash.\"\n    ]\n  },\n  \"laws\": [\n    \"Inner horn filling: every inner horn Lambda^1_2 admits a constructive filler matching d0 and d2\",\n    \"Composite realization: the missing face d1 produced by horn filling equals operadic composition\",\n    \"Identity preservation: degenerate 1-simplices correspond to operadic identity operations\",\n    \"Associativity of composition: nerve 2-simplex compositions associate strictly\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Operations serialized in canonical discrete order\",\n      \"Given identical input operad, produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"operadic_nerve\",\n    \"symbols\": [\n      \"ColouredOperad\",\n      \"OperadicNerve\",\n      \"InnerHorn2_1\",\n      \"fill_inner_horn_2_1\",\n      \"OperadicNerve::verify_quasi_category_property\"\n    ],\n    \"required_tests\": [\n      \"test_operadic_nerve_positive_verification\",\n      \"test_kill_mut_on_01_missing_face_d1_mismatch\",\n      \"test_kill_mut_on_02_face_d0_mismatch\",\n      \"test_kill_mut_on_03_face_d2_mismatch\",\n      \"test_kill_mut_on_04_non_associative_composition\",\n      \"test_kill_mut_on_05_non_unital_identity\",\n      \"test_kill_mut_on_06_allocation_cap_exceeded\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.OperadicNerve\",\n    \"symbols\": [\n      \"ColouredOperad\",\n      \"OperadicNerve\",\n      \"fillInnerHorn2_1\",\n      \"fillInnerHorn2_1_matches_d0\",\n      \"fillInnerHorn2_1_matches_d2\",\n      \"missingFace_d1_source_target\",\n      \"operadic_nerve_is_quasi_category\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Missing face d1 calculation mismatch (MUT-ON-01)\",\n    \"Face d0 boundary mismatch on horn filler (MUT-ON-02)\",\n    \"Face d2 boundary mismatch on horn filler (MUT-ON-03)\",\n    \"Non-associative operation composition in spine (MUT-ON-04)\",\n    \"Non-unital identity operation composition (MUT-ON-05)\",\n    \"Allocation limit exceeded in operadic nerve solver (MUT-ON-06)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An operadic nerve functor maps coloured operads to quasi-categories. This provides a bridge between multicategories/coloured operads and Joyal (infinity, 1)-categories, establishing that operadic composition fills inner simplicial horns.\",\n    \"non_role\": [\n      \"Continuous topology or smooth operads\",\n      \"Unbounded infinity-operads with non-discrete higher cells\"\n    ]\n  },\n  \"wip\": [\n    \"Dendroidal nerve of coloured operads to dendroidal infinity-operads\",\n    \"Boardman-Vogt tensor product of operadic nerves\"\n  ]\n}\n",
