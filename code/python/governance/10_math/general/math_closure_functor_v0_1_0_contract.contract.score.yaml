    ],
    "doctrine": {
      "summary": "ClosureFunctor is a functor Cl: Res -> Cl(Res) from the category of residual objects to the category of closure results. It maps each residual object to its closure attempt result, and each morphism between residuals to the corresponding morphism between closure results. The functor preserves identity morphisms and composition, and produces a ClosureCharge for each object measuring the residual obstruction after closure. ClosureFunctor is the operational core of the typed residual closure layer, governed by a ClosureDiscipline.",
