      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:nerve_of_category:v0.1.0\",\n  \"title\": \"Nerve of Category\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"simplicial_set\",\n    \"symbol\": \"N(C) : Δ^op → Set\",\n    \"ascii_symbol\": \"nerve_of_category\",\n    \"notation\": \"N(C) : Δ^op → Set\",\n    \"domain\": [\n      \"dimension_n: set of n-composable morphism chains\",\n      \"face_maps: composition or deletion operations\",\n      \"degeneracy_maps: identity insertion operations\"\n    ],\n    \"codomain\": {\n      \"description\": \"A simplicial set N(C) where N(C)_n is the set of composable n-chains of morphisms in category C\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Source category C must be a valid category\",\n      \"Face and degeneracy maps must satisfy simplicial identities\",\n      \"Nerve must satisfy Segal condition (2-coskeletal with unique inner horn fillers)\",\n      \"Artifact hash must be deterministically computable via SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"Face and degeneracy maps satisfy standard simplicial identities\",\n    \"N(C) is 2-coskeletal with unique inner horn fillers\",\n    \"The nerve functor N: Cat → sSet is fully faithful\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid category must be rejected\",\n    \"Violation of simplicial identities must be rejected\",\n    \"Violation of Segal condition must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The nerve of a category C is a simplicial set N(C) encoding the compositional structure of C. The nerve construction embeds categories fully faithfully into simplicial sets and provides the bridge between category theory and homotopy theory.\",\n    \"non_role\": [\n      \"Higher categorical nerves (bicategories, higher categories)\",\n      \"Homotopy coherent nerve\",\n      \"Nerve of operads or other algebraic structures\"\n    ]\n  },\n  \"wip\": [\n    \"Higher categorical nerves\",\n    \"Nerve of bicategories and higher categories\",\n    \"Homotopy coherent nerve\",\n    \"Current implementation handles ordinary categories only\",\n    \"Extension to higher categories planned for future versions\",\n    \"Homotopy coherent nerve requires additional structure\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"nerve\",\n    \"symbols\": [\n      \"DeclaredNerve\",\n      \"ValidatedFiniteNerve\"\n    ],\n    \"required_tests\": [\n      \"test_face_maps\",\n      \"test_degeneracy_maps\",\n      \"test_simplicial_identities\"\n    ]\n  }\n}\n",
