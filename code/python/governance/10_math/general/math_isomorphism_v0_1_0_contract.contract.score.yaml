      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:isomorphism:v0.1.0\",\n  \"title\": \"Isomorphism Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"isomorphism\",\n    \"symbol\": \"f: A ≅ B with inverse g, where g ∘ f = id_A and f ∘ g = id_B\",\n    \"ascii_symbol\": \"isomorphism\",\n    \"notation\": \"f: A ≅ B with inverse g, where g ∘ f = id_A and f ∘ g = id_B\",\n    \"domain\": [\n      \"morphism: Morphism f: A → B\",\n      \"inverse: Morphism g: B → A\",\n      \"domain: Object A\",\n      \"codomain: Object B\"\n    ],\n    \"codomain\": {\n      \"description\": \"An isomorphism consists of two morphisms f: A → B and g: B → A in a category C, where composition in both orders yields identity morphisms on the respective objects.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The morphism f: A → B must exist and be valid\",\n      \"The inverse morphism g: B → A must exist and be valid\",\n      \"dom(f) = cod(g) = A and cod(f) = dom(g) = B\",\n      \"Composition g ∘ f must equal id_A\",\n      \"Composition f ∘ g must equal id_B\",\n      \"Artifact hash must be deterministic and reproducible\"\n    ]\n  },\n  \"laws\": [\n    \"g ∘ f = id_A\",\n    \"f ∘ g = id_B\",\n    \"dom(f) = cod(g) = A and cod(f) = dom(g) = B\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Given same morphism and inverse, must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"morphism_id does not resolve to Morphism artifact\",\n    \"inverse_id does not resolve to Morphism artifact\",\n    \"dom(f) ≠ cod(g)\",\n    \"g ∘ f ≠ id_A\",\n    \"f ∘ g ≠ id_B\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An Isomorphism is a morphism f: A → B that has a two-sided inverse g: B → A such that g ∘ f = id_A and f ∘ g = id_B. The contract validates the morphism and its inverse, verifying the isomorphism conditions.\",\n    \"non_role\": [\n      \"Automatic detection of isomorphisms from morphisms alone\",\n      \"Category-specific isomorphism detection (e.g., bijection detection)\",\n      \"Natural isomorphisms between functors (covered by NaturalTransformation contract)\",\n      \"Proof that inverses are unique (this is a theorem, not a validation)\"\n    ]\n  },\n  \"wip\": [\n    \"The contract requires explicit inverse; detecting isomorphisms from morphisms alone is category-dependent\",\n    \"Isomorphism uniqueness (inverse is unique) is a theorem, not a validation - should we include a proof witness?\",\n    \"Natural isomorphisms between functors are in the NaturalTransformation contract - should we reference it explicitly?\",\n    \"Current implementation requires explicit morphism and inverse IDs\",\n    \"Composition and inversion operations are deterministic\",\n    \"All validators are content-addressed for replay\",\n    \"May need category-specific isomorphism detection in future versions\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"functor\",\n    \"symbols\": [\n      \"IsomorphismOfCategories\"\n    ],\n    \"required_tests\": [\n      \"validate_ok\"\n    ]\n  }\n}\n",
