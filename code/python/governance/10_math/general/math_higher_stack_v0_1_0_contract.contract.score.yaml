      ]
    },
    "laws": [
      "For every covering {U_i → U}, the canonical map F(U) → holim F(U_i) is an equivalence in n-Grpd",
      "Values are n-truncated (π_k = 0 for k > n)",
      "F preserves composition and identities"
    ],
    "replay": {
      "requirements": [
        "No external state",
