    "math": {
      "object_kind": "derived_category",
      "symbol": "D(A) = Ch(A)[Qis^-1]",
      "ascii_symbol": "derived_category",
      "notation": "D(A) = (Ch(A), Qis^-1, [1], C(f))",
      "domain": [
        "abelian_category: base abelian category A with exact sequences and homology functors",
        "chain_complexes: category Ch(A) of unbounded cochain complexes (X^\\bullet, d_X)",
        "quasi_isomorphisms: class Qis of chain maps inducing cohomology isomorphisms H^n(f): H^n(X) \\cong H^n(Y)",
        "mapping_cone: functorial mapping cone object C(f) = Y \\oplus X[1] with cone differential matrix [[d_Y, f], [0, -d_X]]",
        "localization_calculus: calculus of left and right fractions for formally inverting Qis",
        "shift_functor: translation functor [1] shifting degrees by (X[1])^n = X^{n+1} with d_{X[1]} = -d_X"
      ],
      "codomain": {
        "description": "The derived category D(A) of an abelian category A is obtained by localizing the category of chain complexes Ch(A) at the multiplicative system of quasi-isomorphisms. D(A) is canonically equipped with a triangulated structure where distinguished triangles arise from mapping cones C(f)."
      }
    },
    "requirements": {
      "required_structures": [
        "Base category A is abelian.",
        "Quasi-isomorphisms form a localizing class admitting a calculus of fractions.",
        "Mapping cone differential matrix satisfies d_{C(f)}^2 = 0.",
        "Canonical mapping cone triangle X -f-> Y -i-> C(f) -p-> X[1] is distinguished.",
        "Every quasi-isomorphism becomes an isomorphism in D(A).",
        "Structure hash is deterministically content-addressed."
      ]
    },
    "laws": [
      "Cone differential nilpotence: [[d_Y, f], [0, -d_X]]^2 = [[d_Y^2, d_Y f - f d_X], [0, d_X^2]] = 0 since d^2=0 and d_Y f = f d_X",
      "Inversion law: for every s in Qis, Q(s) has a two-sided inverse in D(A)",
      "Shift functor: (X[1])^n = X^{n+1} and d_{X[1]}^n = -d_X^{n+1}",
      "Long exact cohomology sequence: distinguished cone triangle induces ... -> H^n(X) -> H^n(Y) -> H^n(C(f)) -> H^{n+1}(X) -> ...",
      "Roof composition: composition of fractions is associative via the Ore condition"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Complex differentials and mapping cones serialized in canonical order",
        "Exact rational discrete arithmetic; signs verified algebraically"
      ]
