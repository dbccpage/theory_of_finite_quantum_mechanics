      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:composition_table:v0.1.0\",\n  \"title\": \"Composition Table Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_table\",\n    \"symbol\": \"T = {(f, g, g compose f) : cod(f) = dom(g)}\",\n    \"ascii_symbol\": \"composition_table\",\n    \"notation\": \"T = {(f, g, g compose f) : cod(f) = dom(g)}\",\n    \"domain\": [\n      \"category: the finite category whose composition is tabulated\",\n      \"entries: set of triples (f, g, h) with cod(f) = dom(g) and g compose f = h\",\n      \"morphism_set: the finite set of all morphisms in the category\"\n    ],\n    \"codomain\": {\n      \"description\": \"The carrier is a finite set of triples (f, g, h) where f and g are composable morphisms and h = g compose f is their composite.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every composable pair must have an entry in the table\",\n      \"No composable pair may appear in multiple entries\",\n      \"Composition derived from the table must be associative\",\n      \"Identity morphisms must act as left and right units\",\n      \"Same table data always produces the same validation outcome\"\n    ]\n  },\n  \"laws\": [\n    \"For every composable pair (f, g), there exists exactly one entry (f, g, h) in T\",\n    \"No composable pair (f, g) appears in more than one entry\",\n    \"For all composable triples: T(T(f,g), h) = T(f, T(g,h))\",\n    \"For all f and the identity id on cod(f): T(f, id) = f\",\n    \"For all f and the identity id on dom(f): T(id, f) = f\",\n    \"For (f, g, h) in T: dom(h) = dom(f) and cod(h) = cod(g)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Table entries sorted canonically by (f, g) before hashing\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"category_id does not resolve\",\n    \"A composable pair has no entry\",\n    \"A composable pair has multiple conflicting entries\",\n    \"Table-derived composition fails associativity\",\n    \"Identity morphism does not act as unit\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A CompositionTable is an explicit finite table encoding the composition law of a finite category. Each entry (f, g, h) in the table records that the composition g compose f = h, where cod(f) = dom(g). The table must be complete (every composable pair has an entry), consistent (each pair maps to a unique composite), and associative (the composition derived from the table satisfies (h compose g) compose f = h compose (g compose f)). This is the concrete data representation of the abstract CompositionLaw contract.\",\n    \"non_role\": [\n      \"This contract does not handle infinite categories (use CompositionLaw with function representation)\",\n      \"This contract does not define the morphisms themselves (see Morphism contract)\",\n      \"This contract does not handle enriched or higher composition\"\n    ]\n  },\n  \"wip\": [\n    \"What is the maximum practical table size before switching to function representation?\",\n    \"Should the table support lazy validation for very large finite categories?\",\n    \"How to handle categories where the morphism set is finite but very large?\",\n    \"This is the concrete data representation of the abstract CompositionLaw\",\n    \"For categories with > ~10^6 morphisms, table representation becomes impractical\",\n    \"The table is the primary input for graph-based categorical computation\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"finite_category_validation\",\n    \"symbols\": [\n      \"validate_finite_category\",\n      \"check_composition_totality\",\n      \"check_composition_closure\",\n      \"check_composition_boundaries\",\n      \"check_associativity\"\n    ],\n    \"required_tests\": [\n      \"valid_category_passes_all_units\",\n      \"missing_composition_is_typed_violation\",\n      \"noncomposable_composition_fails\",\n      \"associativity_failure_is_detected\"\n    ]\n  }\n}\n",
