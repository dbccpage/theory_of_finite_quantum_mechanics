      "ascii_symbol": "two_category",
      "notation": "C = (Obj, Hom, Hom2, id1, hcomp1, id2, vcomp, hcomp2)",
      "domain": [
        "zero_cells: (Obj : Type u) collection of objects (0-cells)",
        "one_cells: (Hom : Obj -> Obj -> Type v) collection of 1-morphisms between objects",
        "two_cells: (Hom2 : Hom A B -> Hom A B -> Type w) collection of 2-morphisms between parallel 1-morphisms",
        "vertical_composition: (vcomp : Hom2 f g -> Hom2 g h -> Hom2 f h) with vertical identity id2",
        "horizontal_composition_1: (hcomp1 : Hom A B -> Hom B C -> Hom A C) with identity 1-cells id1",
        "horizontal_composition_2: (hcomp2 : Hom2 f1 f2 -> Hom2 g1 g2 -> Hom2 (hcomp1 f1 g1) (hcomp1 f2 g2))",
        "strict_associator: associator f g h = eqToIso2 (hcomp1_assoc f g h)",
        "strict_left_unitor: leftUnitor f = eqToIso2 (id1_hcomp1 f)",
        "strict_right_unitor: rightUnitor f = eqToIso2 (hcomp1_id1 f)"
      ],
      "codomain": {
        "description": "A strict 2-category is a category enriched over Cat, consisting of 0-cells, 1-cells, and 2-cells where 1-cell composition is strictly associative and strictly unital, and 2-cell composition satisfies the middle-four interchange law."
      }
    },
    "requirements": {
      "required_structures": [
        "All cells have valid source and target 0-cells or parallel 1-cells.",
        {
          "Composition of 1-cells is strictly associative": "hcomp1 (hcomp1 f g) h = hcomp1 f (hcomp1 g h)."
        },
        {
          "Identity 1-cells are strict units": "hcomp1 (id1 A) f = f and hcomp1 f (id1 B) = f."
        },
        "Vertical composition of 2-cells forms a category on each Hom(A, B).",
        {
          "Horizontal composition of 2-cells preserves vertical identities": "hcomp2 (id2 f) (id2 g) = id2 (hcomp1 f g)."
        },
        {
          "The middle-four interchange law relates vertical and horizontal composition": "hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta)."
        },
        "Coherence isomorphisms (associator and unitors) are canonical identity 2-isomorphisms.",
        "Structure hash is deterministically computed from cell and morphism data."
      ]
    },
    "laws": [
      "Strict 1-cell associativity: for composable 1-cells f, g, h, hcomp1 (hcomp1 f g) h = hcomp1 f (hcomp1 g h)",
      "Strict left unit: for 1-cell f: A -> B, hcomp1 (id1 A) f = f",
      "Strict right unit: for 1-cell f: A -> B, hcomp1 f (id1 B) = f",
      "Vertical composition: 2-cells alpha: f => g, beta: g => h compose to vcomp alpha beta: f => h",
      "Horizontal composition: 2-cells alpha: f1 => f2, beta: g1 => g2 compose to hcomp2 alpha beta: hcomp1 f1 g1 => hcomp1 f2 g2",
      "Interchange law: hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta)"
