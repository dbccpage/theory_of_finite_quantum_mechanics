r weak categories\",\n      \"Non-strict 2-categories\"\n    ]\n  },\n  \"wip\": [\n    \"General coherence, strictification, and Lean-to-Rust semantic correspondence are not proved.\",\n    \"The Lean structure records laws as hypotheses; compilation does not validate arbitrary input data.\",\n    \"The Rust binding supplies finite tables and selected diagnostics, not complete category certification.\"\n  ],\n  \"lean_binding\": {\n    \"path\": \"lean4/research_programs/higher_category_theory/TwoCategory.lean\",\n    \"symbol\": \"HigherCategoryTheory.Strict2Category\",\n    \"scope\": \"algebraic_structure_with_law_fields\"\n  }\n}\n",
