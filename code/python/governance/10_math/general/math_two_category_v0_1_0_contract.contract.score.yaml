, 1-cells, and 2-cells where 1-cell composition is strictly associative and strictly unital, and 2-cell composition satisfies the middle-four interchange law.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"All cells have valid source and target 0-cells or parallel 1-cells.\",\n      {\n        \"Composition of 1-cells is strictly associative\": \"hcomp1 (hcomp1 f g) h = hcomp1 f (hcomp1 g h).\"\n      },\n      {\n        \"Identity 1-cells are strict units\": \"hcomp1 (id1 A) f = f and hcomp1 f (id1 B) = f.\"\n      },\n      \"Vertical composition of 2-cells forms a category on each Hom(A, B).\",\n      {\n        \"Horizontal composition of 2-cells preserves vertical identities\": \"hcomp2 (id2 f) (id2 g) = id2 (hcomp1 f g).\"\n      },\n      {\n        \"The middle-four interchange law relates vertical and horizontal composition\": \"hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta).\"\n      },\n      \"Coherence isomorphisms (associator and unitors) are canonical identity 2-isomorphisms.\",\n      \"Structure hash is deterministically computed from cell and morphism data.\"\n    ]\n  },\n  \"laws\": [\n    \"Strict 1-cell associativity: for composable 1-cells f, g, h, hcomp1 (hcomp1 f g) h = hcomp1 f (hcomp1 g h)\",\n    \"Strict left unit: for 1-cell f: A -> B, hcomp1 (id1 A) f = f\",\n    \"Strict right unit: for 1-cell f: A -> B, hcomp1 f (id1 B) = f\",\n    \"Vertical composition: 2-cells alpha: f => g, beta: g => h compose to vcomp alpha beta: f => h\",\n    \"Horizontal composition: 2-cells alpha: f1 => f2, beta: g1 => g2 compose to hcomp2 alpha beta: hcomp1 f1 g1 => hcomp1 f2 g2\",\n    \"Interchange law: hcomp2 (vcomp alpha beta) (vcomp gamma delta) = vcomp (hcomp2 alpha gamma) (hcomp2 beta delta)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"Cells serialized in canonical order\",\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent 