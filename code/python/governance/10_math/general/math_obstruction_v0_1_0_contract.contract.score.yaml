      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:obstruction:v0.1.0\",\n  \"title\": \"Obstruction Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"obstruction_tower\",\n    \"symbol\": \"{o_n in H^{n+1}(X; pi_n(F))}_{n >= 0}\",\n    \"ascii_symbol\": \"obstruction\",\n    \"notation\": \"{o_n in H^{n+1}(X; pi_n(F))}_{n >= 0}\",\n    \"domain\": [\n      \"fibration: Fibration p: E -> B with fiber F\",\n      \"base_complex: CW complex X with skeletal filtration X^0 subset X^1 subset ... subset X^n\",\n      \"coefficient_system: Local coefficient system pi_n(F) on X (possibly twisted)\",\n      \"obstruction_classes: Sequence {o_n in H^{n+1}(X; pi_n(F))} indexed by skeleton dimension\",\n      \"indeterminacy_subgroups: Sequence {I_n subset H^{n+1}(X; pi_n(F))} of indeterminacy groups\",\n      \"extension_records: Sequence of partial section choices at each skeleton where o_n = 0\",\n      \"current_skeleton: Highest skeleton to which extension has been achieved\"\n    ],\n    \"codomain\": {\n      \"description\": \"A tower of obstruction data governing the inductive extension of a partial section through the skeletal filtration of a CW complex. The tower consists of: (1) an extension problem (fibration, base CW complex, partial section), (2) a sequence of obstruction classes o_n in H^{n+1}(X; pi_n(F)) for each skeleton, (3) indeterminacy subgroups recording the ambiguity at each stage, and (4) extension records tracking the choices made at each successful extension step.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Obstruction classes must be computed in strictly increasing skeletal order\",\n      \"Each o_n must lie in H^{n+1}(X; pi_n(F)) for the correct coefficient system\",\n      \"Extension to skeleton n+1 is recorded only when o_n vanishes\",\n      \"Indeterminacy subgroup I_n must be recorded at each level where extension is possible\",\n      \"Each obstruction cocycle representative must satisfy the coboundary condition\",\n      \"Artifact hash must be correctly computed from all tower data\"\n    ]\n  },\n  \"laws\": [\n    \"The obstruction class o_n is defined only when all prior obstructions o_0, ..., o_{n-1} vanish and extensions to the n-skeleton have been chosen.  The tower must be computed in strictly increasing skeletal order.\\n\",\n    \"If the obstruction class o_n vanishes ([o_n] = 0 in H^{n+1}(X; pi_n(F))), then the partial section s_n extends to the (n+1)-skeleton s_{n+1}. If o_n is non-zero, no extension to the (n+1)-skeleton exists.\\n\",\n    \"The obstruction class o_n at skeleton n is well-defined only modulo an indeterminacy subgroup I_n subset H^{n+1}(X; pi_n(F)).  The indeterminacy arises from the freedom in choosing the extension at the previous step and must be tracked at each level.\\n\",\n    \"Each obstruction o_n is computed at the cocycle level as an element of Z^{n+1}(X; pi_n(F)) before passing to cohomology.  The cocycle representative must satisfy the coboundary condition delta(o_n) = 0.\\n\",\n    \"The coefficient system pi_n(F) must be compatible with the fibration structure and base complex.  When the fiber has non-trivial fundamental group action, the coefficient system is a local (twisted) system.\\n\",\n    \"For a finite-dimensional CW complex X of dimension d, the obstruction tower terminates: only obstructions o_0, ..., o_{d-1} are non-trivially defined.  If all vanish, a global section exists.\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cocycle representatives normalized to canonical form\",\n      \"Extension choices must be deterministically recorded\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"fibration_id does not resolve to valid artifact\",\n    \"base_complex_id does not resolve to valid CW complex\",\n    \"Attempt to compute o_n when o_{n-1} has not been computed\",\n    \"Attempt to extend section when current obstruction is non-zero\",\n    \"Obstruction class lies in wrong cohomology group\",\n    \"Cocycle representative does not satisfy delta = 0\",\n    \"Extension attempted without recording indeterminacy subgroup\",\n    \"Attempt to compute obstruction beyond base complex dimension\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Obstruction Theory is the systematic framework for determining when a partial mathematical construction can be extended one skeleton at a time through a CW complex or Postnikov tower.  Given a fibration p: E -> B and a partial section s_n defined on the n-skeleton X^n, the theory produces a sequence of obstruction classes o_n in H^{n+1}(X; pi_n(F)) governing stepwise extension.  If o_n = 0 the section extends to X^{n+1}; if o_n != 0, extension is impossible.  This contract manages the full tower of obstructions, tracks indeterminacy subgroups, and organizes the inductive extension process.\",\n    \"non_role\": [\n      \"Individual obstruction classes are handled by the ObstructionClass contract\",\n      \"Characteristic classes (Chern, Stiefel-Whitney, Pontryagin) as special obstructions are separate\",\n      \"Equivariant obstruction theory is not covered\",\n      \"Does not implement the homotopy theory of fibrations directly\",\n      \"Does not handle rational obstruction theory or minimal models\"\n    ]\n  },\n  \"wip\": [\n    \"PostnikovTower contract does not yet exist; when created, add as dependency\",\n    \"Twisted coefficient systems (local systems) need more detailed specification\",\n    \"Secondary obstructions and higher-order indeterminacy require further formalization\",\n    \"Relationship between different obstruction theories (Eilenberg, Steenrod, Postnikov) should be documented\",\n    \"Relative obstruction theory (extending from a subcomplex) may warrant a separate contract\",\n    \"Equivariant obstruction theory is deferred to a future contract\",\n    \"Contract handles the full inductive obstruction tower, distinct from single ObstructionClass\",\n    \"Indeterminacy is tracked as subgroups but detailed computation deferred to implementation\",\n    \"CellComplex contract (urn:math:contract:CellComplex:v0.1.0) is used; CwComplex is an alias\",\n    \"PostnikovTower dependency should be added when that contract is created\",\n    \"Consider factoring out extension choice management into a separate ExtensionChoice contract\"\n  ]\n}\n",
      "record": {
