      ]
    },
    "negative_tests": [
      "Reject map where f(m + n) != f(m) + f(n)",
      "Reject map where f(r . m) != r . f(m)",
      "Reject homomorphism between modules over different rings",
      "Reject homomorphism with invalid domain module",
      "Reject composition where codomain of first != domain of second",
      "Reject homomorphism that attempts to claim authority"
    ],
    "doctrine": {
      "summary": "A ModuleHomomorphism is an R-linear map f: M -> N between left R-modules. It is a group homomorphism (f(m + n) = f(m) + f(n)) that additionally commutes with scalar multiplication (f(r . m) = r . f(m) for all r in R and m in M). Module homomorphisms are the morphisms in the category R-Mod of left R-modules. They generalize linear transformations from vector spaces to modules over arbitrary rings. Kernels and cokernels of module homomorphisms give rise to exact sequences, the foundation of homological algebra.",
      "non_role": [
        "Does not classify admissibility",
        "Does not emit policy decisions",
        "Does not emit certificates",
        "Does not terminalize operations",
        "Does not produce customer-facing claims",
        "Does not define the modules themselves (see Module contract)",
        "Does not compute kernels or cokernels (separate contracts)",
        "Does not handle bimodule maps or graded module maps"
      ]
    },
    "wip": [
      "Should injective/surjective/bijective classification be separate contracts or flags?",
      "How to handle infinite modules where exhaustive verification is impossible?",
      "Integration with exact sequence and chain complex contracts",
      "Module homomorphisms are the morphisms of R-Mod",
      "Kernel and image are submodules; their quotient structure is handled separately",
      "Chain complexes are sequences of module homomorphisms with boundary^2 = 0",
      "When R is a field, this specializes to linear transformation",
      "The Module contract explicitly notes that module homomorphisms would be a separate contract"
    ],
    "rust_binding": {
