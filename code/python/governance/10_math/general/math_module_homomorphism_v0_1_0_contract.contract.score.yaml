        "f(r . m) = r . f(m) for all r in R and m in M",
        "morphism_hash must match canonical hash of the homomorphism record"
      ]
    },
    "laws": [
      "f(m + n) = f(m) + f(n) for all m, n in M",
      "f(r . m) = r . f(m) for all r in R and m in M",
      "f(0_M) = 0_N (derived from additivity)",
      "Domain M and codomain N must be modules over the same ring R"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
