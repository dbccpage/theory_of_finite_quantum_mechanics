      ],
      "codomain": {
        "description": "An R-linear map f: M -> N between left R-modules. The carrier consists of the domain module M, the codomain module N, the scalar ring R (shared by both modules), and the map f itself.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "Domain module M must satisfy the Module contract",
