      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:module_homomorphism:v0.1.0\",\n  \"title\": \"ModuleHomomorphism Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"morphism\",\n    \"symbol\": \"f: M -> N (R-linear)\",\n    \"ascii_symbol\": \"module_homomorphism\",\n    \"notation\": \"f: M -> N (R-linear)\",\n    \"domain\": [\n      \"domain_module_hash: SHA-256 hash of the domain module M\",\n      \"codomain_module_hash: SHA-256 hash of the codomain module N\",\n      \"ring_hash: SHA-256 hash of the scalar ring R\",\n      \"map_hash: SHA-256 hash of the map specification\",\n      \"morphism_hash: SHA-256 hash of the entire morphism record\"\n    ],\n    \"codomain\": {\n      \"description\": \"An R-linear map f: M -> N between left R-modules. The carrier consists of the domain module M, the codomain module N, the scalar ring R (shared by both modules), and the map f itself.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Domain module M must satisfy the Module contract\",\n      \"Codomain module N must satisfy the Module contract\",\n      \"Domain and codomain must be modules over the same ring R\",\n      \"f(m + n) = f(m) + f(n) for all m, n in M\",\n      \"f(r . m) = r . f(m) for all r in R and m in M\",\n      \"morphism_hash must match canonical hash of the homomorphism record\"\n    ]\n  },\n  \"laws\": [\n    \"f(m + n) = f(m) + f(n) for all m, n in M\",\n    \"f(r . m) = r . f(m) for all r in R and m in M\",\n    \"f(0_M) = 0_N (derived from additivity)\",\n    \"Domain M and codomain N must be modules over the same ring R\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"No random numbers\",\n      \"No wall-clock data\",\n      \"No network calls\",\n      \"No thread scheduling dependencies\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject map where f(m + n) != f(m) + f(n)\",\n    \"Reject map where f(r . m) != r . f(m)\",\n    \"Reject homomorphism between modules over different rings\",\n    \"Reject homomorphism with invalid domain module\",\n    \"Reject composition where codomain of first != domain of second\",\n    \"Reject homomorphism that attempts to claim authority\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A ModuleHomomorphism is an R-linear map f: M -> N between left R-modules. It is a group homomorphism (f(m + n) = f(m) + f(n)) that additionally commutes with scalar multiplication (f(r . m) = r . f(m) for all r in R and m in M). Module homomorphisms are the morphisms in the category R-Mod of left R-modules. They generalize linear transformations from vector spaces to modules over arbitrary rings. Kernels and cokernels of module homomorphisms give rise to exact sequences, the foundation of homological algebra.\",\n    \"non_role\": [\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates\",\n      \"Does not terminalize operations\",\n      \"Does not produce customer-facing claims\",\n      \"Does not define the modules themselves (see Module contract)\",\n      \"Does not compute kernels or cokernels (separate contracts)\",\n      \"Does not handle bimodule maps or graded module maps\"\n    ]\n  },\n  \"wip\": [\n    \"Should injective/surjective/bijective classification be separate contracts or flags?\",\n    \"How to handle infinite modules where exhaustive verification is impossible?\",\n    \"Integration with exact sequence and chain complex contracts\",\n    \"Module homomorphisms are the morphisms of R-Mod\",\n    \"Kernel and image are submodules; their quotient structure is handled separately\",\n    \"Chain complexes are sequences of module homomorphisms with boundary^2 = 0\",\n    \"When R is a field, this specializes to linear transformation\",\n    \"The Module contract explicitly notes that module homomorphisms would be a separate contract\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"dg_category\",\n    \"symbols\": [\n      \"DifferentialMap\",\n      \"GradedMorphism\"\n    ],\n    \"required_tests\": [\n      \"test_dg_category_basic_lifecycle\",\n      \"test_dg_graded_leibniz_even_and_odd\"\n    ]\n  }\n}\n",
