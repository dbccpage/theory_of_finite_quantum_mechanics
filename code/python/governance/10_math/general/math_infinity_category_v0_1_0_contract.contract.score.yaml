k → X (0 < k < n) admits a filler Δ^n → X\",\n    \"Kan complexes: every horn Λ^n_k → X (0 <= k <= n) admits a filler\",\n    \"Composition is associative up to coherent higher homotopy\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Simplices and data serialized in canonical order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"simplicial_set\",\n    \"symbols\": [\n      \"SimplicialSet\",\n      \"Simplex\",\n      \"Horn\",\n      \"KanComplexValidator\",\n      \"QuasiCategoryValidator\"\n    ],\n    \"required_tests\": [\n      \"test_simplicial_set_and_quasi_category_positive_verification\",\n      \"test_kill_mut_p3_03_simplicial_identity_violation\",\n      \"test_kill_mut_p3_04_quasi_category_inner_horn_filling_violation\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.SimplicialSet\",\n    \"symbols\": [\n      \"SimplicialSet\",\n      \"HornData\",\n      \"HornFiller\",\n      \"IsKanComplex\",\n      \"IsQuasiCategory\",\n      \"kan_complex_is_quasi_category\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid model_type not recognized\",\n    \"Presentation data doesn't match model type\",\n    \"Inner horn has no filler (MUT-P3-04)\",\n    \"Simplicial identity violated (MUT-P3-03)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An InfinityCategory (∞-category or (∞,1)-category) has objects, morphisms, 2-morphisms, and higher morphisms of all dimensions, where all k-morphisms for k >= 2 are invertible up to higher morphisms. The contract validates the ∞-categorical structure via the quasicategory model.\",\n    \"non_role\": [\n      \"(∞,n)-categories with non-invertible cells beyond dimension 1\",\n      \"Concrete continuous spaces\"\n    ]\n  },\n  \"wip\": [\n    \"Quillen equivalence of models\",\n    \"Homotopy hypothesis for ∞-groupoids\"\n  ]\n}\n",
