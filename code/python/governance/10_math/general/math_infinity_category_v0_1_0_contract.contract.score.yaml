        "description": "Model-dependent presentation of an (∞,1)-category. For quasicategory, a simplicial set with the inner horn filling property. For Kan complex, a simplicial set where all horns have fillers. Higher cells are invertible up to coherent homotopy."
      }
    },
    "requirements": {
      "required_structures": [
        "presentation_data must be well-formed for the chosen model_type",
        "For quasicategories, all inner horns must have fillers",
        "Underlying simplicial set satisfies all 5 simplicial identities",
        "Artifact hash is deterministically content-addressed over model_type and presentation_data"
      ]
    },
    "laws": [
      "For quasicategories: every inner horn Λ^n_k → X (0 < k < n) admits a filler Δ^n → X",
      "Kan complexes: every horn Λ^n_k → X (0 <= k <= n) admits a filler",
      "Composition is associative up to coherent higher homotopy"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Simplices and data serialized in canonical order",
        "Validators and computation functions are content-addressed"
