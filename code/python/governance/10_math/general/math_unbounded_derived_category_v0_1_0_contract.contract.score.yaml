      ],
      "codomain": {
        "description": "The unbounded derived category D(A) is the localization of the homotopy category K(A) at all quasi-isomorphisms without degree bounds. It supports unbounded derived functors via Spaltenstein resolutions and satisfies Grothendieck duality."
      }
    },
    "requirements": {
      "required_structures": [
        "Base category A is abelian and closed under direct sums.",
        "Objects are arbitrary unbounded chain complexes without finiteness conditions.",
        "Localization at quasi-isomorphisms is well-defined via homotopy category K(A).",
        "Triangulated structure satisfies TR1-TR4.",
        "Full embeddings of D^b(A), D^+(A), and D^-(A).",
        "Structure hash is deterministically content-addressed."
      ]
    },
    "laws": [
      "Complex differential: d^{n+1} \\circ d^n = 0 for all n \\in Z",
      "Quasi-isomorphism inversion: s \\in Qis implies Q(s) is an isomorphism",
      "Coproduct preservation: direct sums of distinguished triangles are distinguished",
      "Subcategory inclusion: D^b(A) embeds into D(A) as a full triangulated subcategory"
    ],
    "replay": {
      "requirements": [
        "No external state",
