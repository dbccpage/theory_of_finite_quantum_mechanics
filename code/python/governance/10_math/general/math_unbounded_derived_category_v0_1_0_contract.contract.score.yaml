      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:unbounded_derived_category:v0.1.0\",\n  \"title\": \"Unbounded Derived Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"unbounded_derived_category\",\n    \"symbol\": \"D(A) = K(A)[Qis^-1]\",\n    \"ascii_symbol\": \"unbounded_derived_category\",\n    \"notation\": \"D(A) = (Ch(A), Qis^-1, [1], Delta)\",\n    \"domain\": [\n      \"abelian_category: abelian category A with arbitrary direct sums and coproducts\",\n      \"unbounded_complexes: category Ch(A) of arbitrary unbounded complexes ... -> X^{n-1} -> X^n -> X^{n+1} -> ...\",\n      \"homotopy_category: homotopy category K(A) quotiented by chain homotopies\",\n      \"resolutions: K-projective, K-injective, or K-flat resolutions for unbounded derived functors\",\n      \"triangulated_structure: triangulated category structure satisfying Verdier axioms and admitting arbitrary coproducts\"\n    ],\n    \"codomain\": {\n      \"description\": \"The unbounded derived category D(A) is the localization of the homotopy category K(A) at all quasi-isomorphisms without degree bounds. It supports unbounded derived functors via Spaltenstein resolutions and satisfies Grothendieck duality.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Base category A is abelian and closed under direct sums.\",\n      \"Objects are arbitrary unbounded chain complexes without finiteness conditions.\",\n      \"Localization at quasi-isomorphisms is well-defined via homotopy category K(A).\",\n      \"Triangulated structure satisfies TR1-TR4.\",\n      \"Full embeddings of D^b(A), D^+(A), and D^-(A).\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Complex differential: d^{n+1} \\\\circ d^n = 0 for all n \\\\in Z\",\n    \"Quasi-isomorphism inversion: s \\\\in Qis implies Q(s) is an isomorphism\",\n    \"Coproduct preservation: direct sums of distinguished triangles are distinguished\",\n    \"Subcategory inclusion: D^b(A) embeds into D(A) as a full triangulated subcategory\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Complex differentials and morphisms serialized in canonical order\",\n      \"Content-addressed deterministic evaluation\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"unbounded_derived\",\n    \"symbols\": [\n      \"UnboundedDerivedCategory\",\n      \"ChainComplexChain\",\n      \"ResolutionStrategy\"\n    ],\n    \"required_tests\": [\n      \"test_unbounded_derived_category_and_resolutions\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Non-abelian base category\",\n    \"Failure of differential nilpotence d^2 != 0 at any degree\",\n    \"Resolution strategy fails to resolve unbounded complex\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The unbounded derived category D(A) contains all chain complexes without boundedness restrictions. It is essential for Grothendieck duality, sheaf cohomology with arbitrary supports, and Brown representability. It fully contains the bounded variants D^b, D^+, and D^-.\",\n    \"non_role\": [\n      \"Finiteness or compact generation constraints\",\n      \"Ad-hoc truncations\"\n    ]\n  },\n  \"wip\": [\n    \"Spaltenstein resolution models in Rust\",\n    \"Axiomatic unbounded localization in Lean 4\",\n    \"Grothendieck duality contract link\"\n  ]\n}\n",
