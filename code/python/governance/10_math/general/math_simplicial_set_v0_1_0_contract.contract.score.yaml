      "object_kind": "simplicial_set",
      "symbol": "X_• : Δ^op → Set",
      "ascii_symbol": "simplicial_set",
      "notation": "X_• with face maps d_i and degeneracy maps s_j satisfying simplicial identities",
      "domain": [
        "simplices: (X_n : Type u) graded sets of n-simplices for n >= 0",
        "face_maps: (d_i : X_n -> X_{n-1}) for 0 <= i <= n",
        "degeneracy_maps: (s_j : X_n -> X_{n+1}) for 0 <= j <= n"
      ],
      "codomain": {
        "description": "A simplicial set is a contravariant functor from the simplex category Δ to Set. It consists of collections of n-simplices with boundary/face maps d_i and degeneracy maps s_j satisfying the standard five simplicial identities."
      }
    },
    "requirements": {
      "required_structures": [
        "Face maps d_i and degeneracy maps s_j satisfy all 5 simplicial identities.",
        "Horn structures Λ^k_n are well-defined with matching boundary faces.",
        "Inner horns (0 < k < n) and outer horns (k = 0, n) are classified.",
        "All indices and dimensions use exact discrete integer arithmetic.",
        "Deterministic content-addressed artifact hash."
      ]
    },
    "laws": [
      "Face-face identity: d_i ∘ d_j = d_{j-1} ∘ d_i for i < j",
      "Face-degeneracy identity 1: d_i ∘ s_j = s_{j-1} ∘ d_i for i < j",
      "Face-degeneracy identity 2: d_j ∘ s_j = id = d_{j+1} ∘ s_j",
      "Face-degeneracy identity 3: d_i ∘ s_j = s_j ∘ d_{i-1} for i > j + 1",
      "Degeneracy-degeneracy identity: s_i ∘ s_j = s_{j+1} ∘ s_i for i <= j"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Simplices and faces serialized in canonical discrete order",
        "Given same data, produces identical artifact hash"
      ]
    },
