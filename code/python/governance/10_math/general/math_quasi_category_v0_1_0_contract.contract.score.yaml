      "ascii_symbol": "quasi_category",
      "notation": "C as simplicial set where every inner horn Λ^k_n (0 < k < n) admits a filler",
      "domain": [
        "simplicial_set: underlying simplicial set X_•",
        "inner_horns: collection of inner horns Λ^k_n for 0 < k < n"
      ],
      "codomain": {
        "description": "A quasi-category (or Joyal ∞-category, weak Kan complex) is a simplicial set in which every inner horn Λ^k_n (0 < k < n) has a filler Δ^n → X. Inner 2-horns correspond to composable pairs of morphisms, and filling provides associative composition up to coherent higher homotopies."
      }
    },
    "requirements": {
      "required_structures": [
        "Underlying simplicial set satisfies all 5 simplicial identities.",
        "Every inner horn Λ^k_n (0 < k < n) has at least one filler n-simplex.",
