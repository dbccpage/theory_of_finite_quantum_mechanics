      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quasi_category:v0.1.0\",\n  \"title\": \"Quasi-Category (Infinity-Category) Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quasi_category\",\n    \"symbol\": \"C : (∞, 1)-Cat\",\n    \"ascii_symbol\": \"quasi_category\",\n    \"notation\": \"C as simplicial set where every inner horn Λ^k_n (0 < k < n) admits a filler\",\n    \"domain\": [\n      \"simplicial_set: underlying simplicial set X_•\",\n      \"inner_horns: collection of inner horns Λ^k_n for 0 < k < n\"\n    ],\n    \"codomain\": {\n      \"description\": \"A quasi-category (or Joyal ∞-category, weak Kan complex) is a simplicial set in which every inner horn Λ^k_n (0 < k < n) has a filler Δ^n → X. Inner 2-horns correspond to composable pairs of morphisms, and filling provides associative composition up to coherent higher homotopies.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Underlying simplicial set satisfies all 5 simplicial identities.\",\n      \"Every inner horn Λ^k_n (0 < k < n) has at least one filler n-simplex.\",\n      \"Horn boundary faces agree on common intersections.\",\n      \"Kan complexes unconditionally satisfy quasi-category condition.\",\n      \"Deterministic content-addressed artifact hash.\"\n    ]\n  },\n  \"laws\": [\n    \"Inner horn filling: every inner horn Λ^k_n → X (0 < k < n) admits a filler Δ^n → X\",\n    \"Kan complexes are quasi-categories: any simplicial set filling all horns fills inner horns\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Simplices and horns serialized in canonical discrete order\",\n      \"Given same data, produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"simplicial_set\",\n    \"symbols\": [\n      \"QuasiCategoryValidator\",\n      \"KanComplexValidator\",\n      \"Horn\",\n      \"SimplicialSet\"\n    ],\n    \"required_tests\": [\n      \"test_simplicial_set_and_quasi_category_positive_verification\",\n      \"test_kill_mut_p3_04_quasi_category_inner_horn_filling_violation\"\n    ]\n  },\n  \"lean4_binding\": {\n    \"module\": \"HigherCategoryTheory.SimplicialSet\",\n    \"symbols\": [\n      \"IsQuasiCategory\",\n      \"IsKanComplex\",\n      \"kan_complex_is_quasi_category\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Inner horn lacks a filler n-simplex (MUT-P3-04)\",\n    \"Outer horn passed to inner horn validator\",\n    \"Horn faces boundary mismatch\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A quasi-category is a simplicial set where all inner horns can be filled. Developed by Boardman-Vogt and Joyal, and systematically elaborated by Lurie (Higher Topos Theory), quasi-categories provide the canonical model for (∞,1)-categories where 1-morphisms compose weakly up to coherent invertible higher cells.\",\n    \"non_role\": [\n      \"Strict 1-categories\",\n      \"Unbounded higher categories (∞,n) for n > 1\"\n    ]\n  },\n  \"wip\": [\n    \"Joyal model structure on simplicial sets\",\n    \"Straightening and unstraightening equivalences\"\n  ]\n}\n",
