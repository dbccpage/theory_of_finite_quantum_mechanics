        "Kan complexes unconditionally satisfy quasi-category condition.",
        "Deterministic content-addressed artifact hash."
      ]
    },
    "laws": [
      "Inner horn filling: every inner horn Λ^k_n → X (0 < k < n) admits a filler Δ^n → X",
      "Kan complexes are quasi-categories: any simplicial set filling all horns fills inner horns"
    ],
    "replay": {
