      "summary": "A quasi-category is a simplicial set where all inner horns can be filled. Developed by Boardman-Vogt and Joyal, and systematically elaborated by Lurie (Higher Topos Theory), quasi-categories provide the canonical model for (∞,1)-categories where 1-morphisms compose weakly up to coherent invertible higher cells.",
