      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:lefschetz_operator:v0.1.0\",\n  \"title\": \"Lefschetz Pairing Diagnostic Contract (finite cochain Ξ-channel)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"finite_lefschetz_pairing_diagnostic\",\n    \"symbol\": \"⟨α, L·β⟩ on finite cochains\",\n    \"ascii_symbol\": \"lefschetz_operator\",\n    \"notation\": \"weighted/structural pairing diagnostic — not Hard Lefschetz theorem\",\n    \"domain\": [\n      \"finite-dimensional cochain (or chain) vectors α, β\",\n      \"structural operator L (shift/adjacency — not learned)\",\n      \"bilinear pairing form on the finite ambient space\"\n    ],\n    \"codomain\": {\n      \"description\": \"A diagnostic pairing value and optional defect/shift scores used in routing (Ξ-channel). Explicitly NOT the classical Hard Lefschetz isomorphism L^k : H^{n-k} ≅ H^{n+k} on compact Kähler manifolds.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Finite ambient dimension for α, β, L\",\n      \"L is structural (declared adjacency/shift), not a trained free matrix\",\n      \"Pairing is deterministic bilinear form on the finite space\",\n      \"Outputs are diagnostic only (no accept/reject authority)\"\n    ]\n  },\n  \"laws\": [\n    \"Diagnostic law: object computes ⟨α, L·β⟩ (and declared defects) deterministically.\",\n    \"Scope fence: does not assert Hard Lefschetz isomorphisms on continuum Kähler cohomology.\",\n    \"Degree honesty: if graded shift is claimed, degrees must be declared; otherwise ungraded finite pairing only.\",\n    \"Non-decision law: pairing may inform routing; it does not mint Φ₁ acceptance or authority.\",\n    \"Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Deterministic pairing evaluation\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"lefschetz\",\n    \"symbols\": [\n      \"LefschetzPairing\"\n    ],\n    \"required_tests\": [\n      \"dimension_mismatch_returns_error\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Claiming Hard Lefschetz isomorphism theorem discharge from this object must be rejected\",\n    \"Using a learned free L as if structural without declaration must be rejected\",\n    \"Dimension mismatch between α, β, L must be rejected\",\n    \"Using pairing as sole accept/reject authority must be rejected\",\n    \"Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Finite Lefschetz-style pairing diagnostic for cochain routing (Ξ-channel). Live RS documents that this is a weighted inner-product diagnostic, not Hard Lefschetz. B3 meth repaired YAML to match that honesty. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT/Hard Lefschetz theorem.\",\n    \"non_role\": [\n      \"Hard Lefschetz theorem on compact Kähler manifolds\",\n      \"Full primitive cohomology / sl(2) representation theory\",\n      \"Acceptance authority (Φ₁)\",\n      \"PROVED / GlobalGreen / HoTT discharge\"\n    ],\n    \"legacy_contract_id\": \"urn:math:contract:LefschetzOperator:v1.0.0\",\n    \"migration_note\": \"B3 meth: removed continuum Hard Lefschetz overclaim; redefined as finite pairing diagnostic.\"\n  },\n  \"wip\": [\n    \"Optional graded L: H^p → H^{p+2} discrete model as a separate object if needed.\",\n    \"Exact rational pairing vs f64 residual in some call sites.\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B3_LEGACY_SHELL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"B3: YAML previously overclaimed Hard Lefschetz; repaired to finite diagnostic matching lefschetz.rs scope fence.\",\n        \"recommendation\": \"Object-specific math settled for this pass; align code under ADR-007a where YAML is ahead or code still over-scopes. Not PROVED; not GlobalGreen; not LEAN4.\",\n        \"pass\": \"b3_legacy_shells_meth\"\n      },\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"MATH-OVERCLAIM-REPAIRED\",\n        \"severity\": \"high\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Prior shell cited L^k : H^{n-k} ≅ H^{n+k}. That is continuum Kähler geometry; estate RS does not implement it. Repaired under meth review.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"SCOPE_ALIGNED\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates/omega_homology/src/lefschetz.rs\",\n        \"detail\": \"RS explicitly non-Hard-Lefschetz pairing diagnostic. After B3 YAML repair, scopes align; residual on exact symbol export names. Not PROVED.\",\n        \"delta\": \"MATCH_SCOPE\"\n      }\n    ]\n  }\n}\n",
