      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quotient_mass:v1.0.0\",\n  \"title\": \"Quotient mass (Q¹ mass metric packaging)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:hashes:v1.0.0\",\n        \"urn:omega:math:phi1:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quotient_mass\",\n    \"symbol\": \"m_Q([ω])\",\n    \"ascii_symbol\": \"QuotientMass\",\n    \"notation\": \"mass of a class in Q¹ under a declared quotient metric (default Φ₁)\",\n    \"domain\": [\n      \"class [ω] ∈ Q¹ = C¹ / im(d₀)\",\n      \"declared quotient metric (default = Φ₁ weighted ℓ¹ quotient norm)\"\n    ],\n    \"codomain\": {\n      \"description\": \"Nonnegative mass of a residual class in Q¹ under the declared metric. Default metric is Φ₁; other metrics require explicit declaration.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Quotient space Q¹ with finite presentations\",\n      \"Declared metric on Q¹ (default Φ₁)\",\n      \"Nonnegative mass scalar\",\n      \"Compatibility of metric declaration with weight profile\"\n    ]\n  },\n  \"laws\": [\n    \"Default-metric law: unless otherwise declared, quotient mass equals Φ₁([ω]).\",\n    \"Nonnegativity: mass ≥ 0.\",\n    \"Zero law: mass = 0 iff class is metric-zero (exact under Φ₁ default).\",\n    \"Declaration law: non-default metrics must be named; silent metric swap is refuse.\",\n    \"Separation fence: quotient mass is not Γ₂ closure defect.\",\n    \"Authority law: no PROVED / GlobalGreen / ActionLicense from mass alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"Deterministic evaluation under declared metric\",\n      \"Metric identity hashed when multi-metric modes exist\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_types\",\n    \"module\": \"quotient_mass\",\n    \"symbols\": [\n      \"QuotientMass\"\n    ],\n    \"required_tests\": [\n      \"test_quotient_mass_rejects_negative\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Undeclared metric swap must be rejected\",\n    \"Negative mass must be rejected\",\n    \"Mass identified with Γ₂ must be rejected\",\n    \"Authority / GlobalGreen from mass alone must be rejected\",\n    \"Claiming PROVED / HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Quotient mass packages a nonnegative metric on Q¹ (default Φ₁). Nonclaim: not Γ₂; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Closure defect Γ₂\",\n      \"Trichotomy classification\",\n      \"Authority / PROVED / GlobalGreen / HoTT\"\n    ]\n  },\n  \"wip\": [\n    \"Explicit multi-metric registry if needed beyond Φ₁ default\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B4_FOC_RESIDUAL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Meth B4: default-to-Φ₁ clarified; avoid smash with obstruction_mass packaging.\",\n        \"recommendation\": \"If objects are identical, future merge only with ≃ witness; for now keep both.\",\n        \"pass\": \"meth_b4_foc_residual\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"HAS_RS_BINDING\",\n        \"severity\": \"low\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"quotient_mass module present.\",\n        \"file\": \"omega_engine/crates_rs/omega_types/src/quotient_mass.rs\",\n        \"delta\": \"MATCH\"\n      },\n      {\n        \"reviewer\": \"techne-master-of-proofs-and-derivations\",\n        \"role\": \"PROOF_META_REVIEW\",\n        \"code\": \"PANEL_CONSISTENT\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"detail\": \"Possible near-duplicate of phi1_obstruction_mass — residual, not silent merge.\"\n      }\n    ]\n  }\n}\n",
