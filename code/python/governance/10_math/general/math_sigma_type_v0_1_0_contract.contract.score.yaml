      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:sigma_type:v0.1.0\",\n  \"title\": \"Sigma Type Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"type_former\",\n    \"symbol\": \"Sigma(x: A). B(x) or Sum_{x: A} B(x)\",\n    \"ascii_symbol\": \"sigma_type\",\n    \"notation\": \"Sigma(x: A). B(x) or Sum_{x: A} B(x)\",\n    \"domain\": [\n      \"base_type: finite_type\",\n      \"type_family: indexed_family_of_types\",\n      \"total_space: dependent_pair_set\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Sigma Type consists of: - Base type A: a finite type with enumerable elements - Type family B: A -> Type, assigning to each a: A a type B(a) - Total space: the set of all pairs (a, b) with a: A and b: B(a)\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Base type A must be a valid finite type with enumerable elements\",\n      \"Type family B must assign a valid type B(a) to each element a: A\",\n      \"Total space must equal the disjoint union of fibers {B(a)}_{a: A}\",\n      \"First and second projections must satisfy computation rules\",\n      \"StructureArtifact hash matches canonical serialization\"\n    ]\n  },\n  \"laws\": [\n    \"Given a: A and b: B(a), the pair (a, b) is an element of Sigma(x: A). B(x)\",\n    \"pi_1(a, b) = a for all (a, b) in the sigma type\",\n    \"pi_2(a, b) = b: B(a) for all (a, b) in the sigma type\",\n    \"pi_1(a, b) = a and pi_2(a, b) = b (computation rules)\",\n    \"For all p: Sigma(x: A). B(x), p = (pi_1(p), pi_2(p))\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Base type elements serialized in canonical sorted order\",\n      \"Type family serialized as sorted (element, fiber_type_id) pairs with U+001E separators\",\n      \"Dependent pairs serialized as (first, second) with 2-byte length prefixes\",\n      \"All validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Base type artifact does not resolve\",\n    \"Type family missing fiber for some element of A\",\n    \"Fiber type artifact does not resolve\",\n    \"First component of pair is not in A\",\n    \"Second component is not in B(first)\",\n    \"Projection does not satisfy beta rule\",\n    \"Different serialization conventions produce different hashes\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Sigma Type (dependent pair type, dependent sum) is a fundamental type-theoretic construction. Given a base type A and a type family B: A -> Type, the sigma type Sigma(x: A). B(x) consists of dependent pairs (a, b) where a: A and b: B(a). The type of the second component depends on the value of the first component. When B is constant (B(x) = C for all x), the sigma type reduces to the ordinary Cartesian product A x C. The contract encodes the base type, the type family, and validates dependent pair construction and elimination (projections).\",\n    \"non_role\": [\n      \"Does not encode higher inductive types\",\n      \"Does not handle universe polymorphism (universe levels are external)\",\n      \"Does not verify decidability of type equality\",\n      \"Does not encode path types or identity types\",\n      \"Does not implement proof-irrelevant sigma types\"\n    ]\n  },\n  \"wip\": [\n    \"Should the sigma type support dependent elimination (induction principle) as an operation?\",\n    \"How should universe levels for A and B be tracked?\",\n    \"Should truncated sigma types (e.g., mere existence / propositional truncation) be a variant?\",\n    \"How should sigma types interact with the path type contract for transport?\",\n    \"Should record types be encoded as iterated sigma types?\",\n    \"Only finite base types and finite fiber types are directly encodable\",\n    \"Constant families reduce to ordinary Cartesian products\",\n    \"Eta expansion is validated exhaustively over the total space\",\n    \"Type family is stored as an explicit map from base elements to fiber type artifact IDs\",\n    \"Total space size is the sum of fiber sizes: Sum_{a: A} |B(a)|\",\n    \"All operations are deterministic and content-addressed for replay\"\n  ]\n}\n",
