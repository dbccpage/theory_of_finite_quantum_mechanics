        "squares: (Square : Horiz A B -> Horiz C D -> Vert A C -> Vert B D -> Type z) 2-cells with top/bottom horizontal and left/right vertical boundaries",
        "horizontal_composition: (\\circ_h : Square(\\alpha) \\times Square(\\beta) -> Square(\\alpha \\circ_h \\beta))",
        "vertical_composition: (\\circ_v : Square(\\alpha) \\times Square(\\gamma) -> Square(\\alpha \\circ_v \\gamma))",
        "horizontal_identities: id_h(v) square with vertical morphism v on boundaries and horizontal identities",
        "vertical_identities: id_v(f) square with horizontal morphism f on boundaries and vertical identities",
        "square_interchange_law: (\\alpha \\circ_h \\beta) \\circ_v (\\gamma \\circ_h \\delta) = (\\alpha \\circ_v \\gamma) \\circ_h (\\beta \\circ_v \\delta)"
      ],
      "codomain": {
        "description": "A double category D is an internal category in Cat, consisting of objects (0-cells), horizontal 1-cells, vertical 1-cells, and 2-cells (squares) with horizontal and vertical composition operations sharing the same 0-cells and satisfying the square middle-four interchange law."
      }
    },
    "requirements": {
      "required_structures": [
        "Objects, horizontal morphisms, and vertical morphisms form two category structures sharing the same objects.",
        {
          "Squares have four matching boundaries": "top f, bottom g, left u, right v."
        },
        "Horizontal composition of squares is strictly associative and unital.",
        "Vertical composition of squares is strictly associative and unital.",
        {
          "Square interchange law strictly relates horizontal and vertical composition": "(\\alpha \\circ_h \\beta) \\circ_v (\\gamma \\circ_h \\delta) = (\\alpha \\circ_v \\gamma) \\circ_h (\\beta \\circ_v \\delta)."
        },
        "Structure hash is deterministically content-addressed."
      ]
    },
    "laws": [
      "Horizontal square associativity: (\\alpha \\circ_h \\beta) \\circ_h \\gamma = \\alpha \\circ_h (\\beta \\circ_h \\gamma)",
      "Vertical square associativity: (\\alpha \\circ_v \\beta) \\circ_v \\gamma = \\alpha \\circ_v (\\beta \\circ_v \\gamma)",
      "Horizontal square units: \\alpha \\circ_h id_h(v_r) = \\alpha = id_h(v_l) \\circ_h \\alpha",
      "Vertical square units: \\alpha \\circ_v id_v(f_b) = \\alpha = id_v(f_t) \\circ_v \\alpha",
      "Middle-four square interchange law: (\\alpha \\circ_h \\beta) \\circ_v (\\gamma \\circ_h \\delta) = (\\alpha \\circ_v \\gamma) \\circ_h (\\beta \\circ_v \\delta)"
    ],
    "replay": {
