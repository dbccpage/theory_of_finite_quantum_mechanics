vertical identities\",\n      \"square_interchange_law: (\\\\alpha \\\\circ_h \\\\beta) \\\\circ_v (\\\\gamma \\\\circ_h \\\\delta) = (\\\\alpha \\\\circ_v \\\\gamma) \\\\circ_h (\\\\beta \\\\circ_v \\\\delta)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A double category D is an internal category in Cat, consisting of objects (0-cells), horizontal 1-cells, vertical 1-cells, and 2-cells (squares) with horizontal and vertical composition operations sharing the same 0-cells and satisfying the square middle-four interchange law.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Objects, horizontal morphisms, and vertical morphisms form two category structures sharing the same objects.\",\n      {\n        \"Squares have four matching boundaries\": \"top f, bottom g, left u, right v.\"\n      },\n      \"Horizontal composition of squares is strictly associative and unital.\",\n      \"Vertical composition of squares is strictly associative and unital.\",\n      {\n        \"Square interchange law strictly relates horizontal and vertical composition\": \"(\\\\alpha \\\\circ_h \\\\beta) \\\\circ_v (\\\\gamma \\\\circ_h \\\\delta) = (\\\\alpha \\\\circ_v \\\\gamma) \\\\circ_h (\\\\beta \\\\circ_v \\\\delta).\"\n      },\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Horizontal square associativity: (\\\\alpha \\\\circ_h \\\\beta) \\\\circ_h \\\\gamma = \\\\alpha \\\\circ_h (\\\\beta \\\\circ_h \\\\gamma)\",\n    \"Vertical square associativity: (\\\\alpha \\\\circ_v \\\\beta) \\\\circ_v \\\\gamma = \\\\alpha \\\\circ_v (\\\\beta \\\\circ_v \\\\gamma)\",\n    \"Horizontal square units: \\\\alpha \\\\circ_h id_h(v_r) = \\\\alpha = id_h(v_l) \\\\circ_h \\\\alpha\",\n    \"Vertical square units: \\\\alpha \\\\circ_v id_v(f_b) = \\\\alpha = id_v(f_t) \\\\circ_v \\\\alpha\",\n    \"Middle-four square interchange law: (\\\\alpha \\\\circ_h \\\\beta) \\\\circ_v (\\\\gamma \\\\circ_h \\\\delta) = (\\\\alpha \\\\circ_v \\\\gamma) \\\\circ_h (\\\\beta \\\\circ_v \\\\delta)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Squares and cells serialized in canonical order\",\n      \"Content-addressed deterministic evaluation\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"double_category\",\n    \"symbols\": [\n      \"DoubleCategory\",\n      \"HorizontalCell\",\n      \"VerticalCell\",\n      \"SquareCell\",\n      \"SquareInterchange\"\n    ],\n    \"required_tests\": [\n      \"test_double_category_horizontal_and_vertical_composition\",\n      \"test_double_category_interchange_verification\",\n      \"test_kill_mut_p2_05_square_interchange_inversion\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Square boundary mismatch (top/bottom/left/right 1-cells do not match 0-cell corners)\",\n    \"Horizontal square composition boundary mismatch\",\n    \"Vertical square composition boundary mismatch\",\n    \"Square interchange law violated (inversion of horizontal and vertical order) (SquareInterchangeInversion / MUT-P2-05)\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A DoubleCategory contains objects, horizontal 1-morphisms, vertical 1-morphisms, and 2-cells (squares). Unlike 2-categories which treat 1-cells and 2-cells hierarchically, double categories treat horizontal and vertical morphisms on an equal footing, related by the 2-dimensional square interchange law.\",\n    \"non_role\": [\n      \"Pseudo-double categories with weak horizontal composition\",\n      \"Virtual double categories\",\n      \"Triple categories / n-fold categories\"\n    ]\n  },\n  \"wip\": [\n    \"Formalization of strict DoubleCategory in Lean 4 (DoubleCategory.lean)\",\n    \"Zero-allocation square composition in Rust\",\n    \"Property testing of square interchange law\"\n  ]\n}\n",
