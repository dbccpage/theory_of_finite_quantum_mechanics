      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:higher_functor:v0.1.0\",\n  \"title\": \"Higher Functor Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"higher_functor\",\n    \"symbol\": \"F: B1 -> B2\",\n    \"ascii_symbol\": \"higher_functor\",\n    \"notation\": \"F = (obj, map1, map2, compositor, unitor)\",\n    \"domain\": [\n      \"source: (B1 : Bicategory Obj1) source higher category\",\n      \"target: (B2 : Bicategory Obj2) target higher category\",\n      \"object_map: (obj : Obj1 -> Obj2) mapping on 0-cells\",\n      \"one_cell_map: (map1 : B1.Hom A B -> B2.Hom (obj A) (obj B)) mapping on 1-cells\",\n      \"two_cell_map: (map2 : B1.Hom2 f g -> B2.Hom2 (map1 f) (map1 g)) preserving vertical composition and identities\",\n      \"compositor: invertible 2-cell phi_{f,g}: hcomp1 (map1 f) (map1 g) ≅ map1 (hcomp1 f g)\",\n      \"unitor: invertible 2-cell phi_A: id1 (obj A) ≅ map1 (id1 A)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A higher functor (pseudofunctor / weak 2-functor) F: B1 -> B2 between bicategories consists of an object map F0, a 1-cell map F1, a 2-cell map F2 strictly preserving vertical composition, and coherent compositor and unitor 2-isomorphisms satisfying associator and unitor coherence hexagon/triangle diagrams.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Source B1 and target B2 must be valid bicategories.\",\n      \"Functor 1-cell map preserves 0-cell source and target boundaries.\",\n      \"Functor 2-cell map strictly preserves vertical identity id2 and vertical composition vcomp.\",\n      \"Compositor 2-isomorphism phi_{f,g} is natural in f and g.\",\n      \"Compositor and unitor satisfy the associator coherence hexagon diagram.\",\n      \"Compositor and unitor satisfy the left and right unitor coherence triangle diagrams.\",\n      \"Strict 2-functors have identity compositor and unitor 2-cells.\",\n      \"Artifact hash is deterministically computed from functor maps and coherence cells.\"\n    ]\n  },\n  \"laws\": [\n    \"Vertical identity preservation: map2 (B1.id2 f) = B2.id2 (map1 f)\",\n    \"Vertical composition preservation: map2 (B1.vcomp alpha beta) = B2.vcomp (map2 alpha) (map2 beta)\",\n    \"Compositor naturality: B2.vcomp (B2.hcomp2 (map2 alpha) (map2 beta)) (compositor f2 g2).hom = B2.vcomp (compositor f1 g1).hom (map2 (B1.hcomp2 alpha beta))\",\n    \"Associator coherence: B2.vcomp (B2.whiskerRight (compositor f g).hom (map1 h)) (B2.vcomp (compositor (B1.hcomp1 f g) h).hom (map2 (B1.associator f g h).hom)) = B2.vcomp (B2.associator (map1 f) (map1 g) (map1 h)).hom (B2.vcomp (B2.whiskerLeft (map1 f) (compositor g h).hom) (compositor f (B1.hcomp1 g h)).hom)\",\n    \"Left unitor coherence: B2.vcomp (B2.whiskerRight (unitor A).hom (map1 f)) (B2.vcomp (compositor (B1.id1 A) f).hom (map2 (B1.leftUnitor f).hom)) = (B2.leftUnitor (map1 f)).hom\",\n    \"Right unitor coherence: B2.vcomp (B2.whiskerLeft (map1 f) (unitor B).hom) (B2.vcomp (compositor f (B1.id1 B)).hom (map2 (B1.rightUnitor f).hom)) = (B2.rightUnitor (map1 f)).hom\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Maps and cells serialized in canonical order\",\n      \"Deterministic evaluation produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Source or target higher category references do not resolve\",\n    \"Functor 1-cell map violates 0-cell source/target boundaries (OneCellBoundaryMismatch)\",\n    \"Functor 2-cell map violates vertical composition or identity preservation\",\n    \"Compositor 2-cell is not an invertible 2-isomorphism\",\n    \"Compositor naturality condition violated\",\n    \"Associator coherence diagram fails to commute\",\n    \"Left or right unitor coherence diagram fails to commute\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A HigherFunctor (pseudofunctor / weak 2-functor) is a morphism between higher categories preserving 0-cells, 1-cells, and 2-cells. Vertical composition is preserved strictly while horizontal composition and identities are preserved up to coherent 2-isomorphisms (compositors and unitors).\",\n    \"non_role\": [\n      \"Enriched functors over general monoidal categories\",\n      \"Monoidal functor tensor structures\",\n      \"Functor categories (which form bicategories themselves)\"\n    ]\n  },\n  \"wip\": [\n    \"General coherence, strictification, and Lean-to-Rust semantic correspondence are not proved.\",\n    \"The Lean structure records laws as hypotheses; compilation does not validate arbitrary input data.\",\n    \"No native implementation of this complete structure is bound by this contract.\"\n  ],\n  \"lean_binding\": {\n    \"path\": \"lean4/research_programs/higher_category_theory/HigherFunctor.lean\",\n    \"symbol\": \"HigherCategoryTheory.Pseudofunctor\",\n    \"scope\": \"algebraic_structure_with_law_fields\"\n  }\n}\n",
