indexed canonically by arity\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Some P(n) is ill-formed\",\n    \"Nested compositions don't agree\",\n    \"Unit does not satisfy identity properties\",\n    \"Composition not equivariant under permutations\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An operad P is a collection of spaces P(n) parametrizing n-ary operations, with composition maps and symmetric group actions satisfying associativity, unitality, and equivariance. Operads encode types of algebraic structures. The contract validates the operad axioms.\",\n    \"non_role\": [\n      \"Does not implement operad algebras in specific categories\",\n      \"Does not compute Koszul duality (marked as WIP)\",\n      \"Does not handle modular, cyclic, or colored operads yet\"\n    ]\n  },\n  \"wip\": [\n    \"Koszul duality: P and P^! related via bar construction\",\n    \"Operad algebras in various categories\",\n    \"Modular operads, cyclic operads, properads\",\n    \"Implementation of colored operads\",\n    \"Cofibrant replacement for operads\",\n    \"Contract focuses on basic operad axioms validation\",\n    \"Free algebra construction marked as ComputationWitness but not fully specified\",\n    \"Koszul duality and related constructions deferred to future versions\",\n    \"Symmetric monoidal category dependency needs concrete implementation\"\n  ]\n}\n",
