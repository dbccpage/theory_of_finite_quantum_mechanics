      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:chain_complex:v1.0.0\",\n  \"title\": \"Chain complex (finite graded)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"chain_complex\",\n    \"symbol\": \"C_•\",\n    \"ascii_symbol\": \"ChainComplex\",\n    \"notation\": \"… → C_n --d_n→ C_{n-1} --d_{n-1}→ C_{n-2} → …\",\n    \"domain\": [\n      \"coefficient domain R (ring or field)\",\n      \"finite degree index set I ⊂ ℤ (or ℕ)\",\n      \"for each n ∈ I: finite R-module C_n with finite presentation/basis\",\n      \"for each adjacent pair: boundary map d_n : C_n → C_{n-1}\"\n    ],\n    \"codomain\": {\n      \"description\": \"A finite graded chain complex over R with degree-lowering boundaries satisfying d² = 0. Structural only; does not mint homology classes or FOC Φ/Γ.\"\n    },\n    \"definition\": {\n      \"chain_complex\": \"Graded object C_• with maps d_n of degree −1 and d_{n−1} ∘ d_n = 0.\",\n      \"cycles\": \"Z_n = ker(d_n)\",\n      \"boundaries\": \"B_n = im(d_{n+1})\",\n      \"homology\": \"H_n = Z_n / B_n when B_n ⊆ Z_n (follows from d² = 0)\",\n      \"finite_scope\": \"This contract version covers finite declared degree sets only.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Coefficient domain R declared and shared by all C_n\",\n      \"Finite degree index set I\",\n      \"Finite C_n for each n ∈ I (presentation or ordered basis)\",\n      \"Boundary map d_n for each adjacent degree pair present in I\",\n      \"Boundary law witness / check that d_{n−1} ∘ d_n = 0 on all adjacent pairs\",\n      \"Degree shift −1 (source degree n, target degree n−1)\"\n    ]\n  },\n  \"laws\": [\n    \"Boundary-squared law: d_{n−1} ∘ d_n = 0 for every adjacent declared pair.\",\n    \"Degree-shift law: each d_n lowers degree by exactly one.\",\n    \"Coefficient uniformity: every C_n is an R-module for the same declared R.\",\n    \"Presentation compatibility: each d_n has source/target matching declared C_n presentations.\",\n    \"Homology well-definedness: B_n ⊆ Z_n follows from the boundary-squared law.\",\n    \"Finite-scope law: only finitely many degrees and finite C_n ranks are in-scope for this version.\",\n    \"Authority law: no PROVED / GlobalGreen / HoTT discharge from this contract alone.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No wall-clock dependence\",\n      \"Boundary application and d∘d checks are deterministic\",\n      \"Basis/presentation serialization is canonical when hashed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"chain_complex\",\n    \"symbols\": [\n      \"ChainComplex\"\n    ],\n    \"required_tests\": [\n      \"test_boundary_law_violation_rejected\",\n      \"test_dimension_mismatch_d1\",\n      \"dim_rejects_degree_outside_finite_support\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Boundary map with wrong degree shift (not n → n−1) must be rejected\",\n    \"d_{n−1} ∘ d_n ≠ 0 must be rejected\",\n    \"Missing C_n for a declared boundary source or target must be rejected\",\n    \"Coefficient domain mismatch across degrees must be rejected\",\n    \"Infinite/unbounded degree family without explicit finite I must be rejected under this version\",\n    \"Confusing this object with Omega cochain layer (degree-raising) without dualization must be rejected\",\n    \"Claiming H_n without d² = 0 must be rejected\",\n    \"Claiming PROVED / GlobalGreen / HoTT / Φ₁/Γ₂ identity from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Finite graded chain complex C_• over R with d² = 0. Base structure for cycles, boundaries, and homology. Nonclaim: does not claim PROVED; does not claim GlobalGreen; does not claim HoTT discharge; does not define FOC Φ₁/Γ₂ (cochain residual layer).\",\n    \"non_role\": [\n      \"Computing FOC Φ₁ / Γ₂ / Ξ functionals\",\n      \"Omega cochain layer specialization (degree-raising d₀,d₁)\",\n      \"Chain homotopy equivalence as a full object (separate contract)\",\n      \"Infinite-dimensional chain groups\",\n      \"Spectral sequences / double complexes\",\n      \"Authority minting, customer claims, PROVED/GlobalGreen/HoTT discharge\"\n    ]\n  },\n  \"wip\": [\n    \"Bounded/filtered/augmented specializations\",\n    \"Double complexes and spectral sequence interfaces\",\n    \"Chain homotopy equivalence contract\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B2_HOMOLOGY\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Meth B2 pass: lifted d²=0, degree shift, finite scope, and dual-fence into canonical laws/structures/negative_tests; removed theater shells. Not PROVED; human re-review welcome.\",\n        \"recommendation\": \"Stage-2 realization align under ADR-007a; LEAN4 only if paper demands.\",\n        \"pass\": \"meth_b2_homology\"\n      },\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"FINITE_ONLY_FENCE\",\n        \"severity\": \"low\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"detail\": \"Contract is finite-degree / finite-rank only; unbounded complexes remain residual.\",\n        \"recommendation\": \"Keep fence until a separate unbounded object is introduced.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"BOUNDED_THREE_TERM_ONLY\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"omega_homology::chain_complex is finite C2→C1→C0 with d1∘d2=0 checks (MATCH core law) but not a general graded family over arbitrary I. YAML finite-scope is honest; general multi-degree API is YAML_AHEAD_OF_CODE relative to full graded I.\",\n        \"file\": \"omega_engine/crates/omega_homology/src/chain_complex.rs\",\n        \"yaml_law\": \"Finite graded C_• with d²=0 on all adjacent pairs in I.\",\n        \"code_behavior\": \"Degree-bounded 0..2 chain complex with verified composition zero.\",\n        \"delta\": \"YAML_AHEAD_OF_CODE\"\n      },\n      {\n        \"reviewer\": \"techne-master-of-proofs-and-derivations\",\n        \"role\": \"PROOF_META_REVIEW\",\n        \"code\": \"PANEL_CONSISTENT\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"detail\": \"Stages 1–2 consistent: math laws real; realization is demo-bounded. Not PROVED; not GlobalGreen; LEAN4 not claimed.\"\n      }\n    ]\n  }\n}\n",
