      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:enriched_category:v0.1.0\",\n  \"title\": \"Enriched Category Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"enriched_category\",\n    \"symbol\": \"C_V = (Ob, Hom_V, \\\\circ, j)\",\n    \"ascii_symbol\": \"enriched_category\",\n    \"notation\": \"C enriched over (V, \\\\otimes, I, \\\\alpha, \\\\lambda, \\\\rho)\",\n    \"domain\": [\n      \"monoidal_base: monoidal category (V, \\\\otimes, I, \\\\alpha, \\\\lambda, \\\\rho) providing hom-objects and tensor product\",\n      \"objects: (Obj : Type u) collection of object identifiers in C\",\n      \"hom_objects: (C(X, Y) \\\\in Ob(V)) hom-object in V for each pair of objects\",\n      \"composition_morphism: (\\\\circ_{X,Y,Z} : C(Y, Z) \\\\otimes C(X, Y) -> C(X, Z)) morphism in V\",\n      \"unit_morphism: (j_X : I -> C(X, X)) morphism in V from monoidal unit I\",\n      \"associativity_diagram: commutativity of \\\\circ \\\\circ (id \\\\otimes \\\\circ) \\\\circ \\\\alpha = \\\\circ \\\\circ (\\\\circ \\\\otimes id)\",\n      \"unit_diagrams: commutativity of \\\\circ \\\\circ (id \\\\otimes j) = \\\\rho and \\\\circ \\\\circ (j \\\\otimes id) = \\\\lambda\"\n    ],\n    \"codomain\": {\n      \"description\": \"A category C enriched over a monoidal category V is a collection of objects Ob(C) together with a hom-object C(X, Y) \\\\in V for every pair of objects, composition morphisms \\\\circ_{X,Y,Z}: C(Y, Z) \\\\otimes C(X, Y) -> C(X, Z) in V, and unit morphisms j_X: I -> C(X, X) in V satisfying enriched associativity and unit diagrams.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Enriching category V is a valid monoidal category satisfying pentagon and triangle coherence.\",\n      \"Every pair of objects X, Y has a valid hom-object C(X, Y) in Ob(V).\",\n      \"Composition morphism \\\\circ_{X,Y,Z} has domain C(Y, Z) \\\\otimes C(X, Y) and codomain C(X, Z) in V.\",\n      \"Unit morphism j_X has domain I and codomain C(X, X) in V.\",\n      \"Enriched associativity diagram commutes strictly in V for all object quadruples.\",\n      \"Enriched left and right unit diagrams commute strictly in V for all object pairs.\",\n      \"Structure hash is deterministically content-addressed.\"\n    ]\n  },\n  \"laws\": [\n    \"Enriched associativity: \\\\circ_{X,Y,W} \\\\circ (id \\\\otimes \\\\circ_{X,Y,Z}) \\\\circ \\\\alpha = \\\\circ_{X,Z,W} \\\\circ (\\\\circ_{Z,Y,W} \\\\otimes id)\",\n    \"Enriched left unit: \\\\circ_{X,Y,Y} \\\\circ (j_Y \\\\otimes id) = \\\\lambda_{C(X,Y)}\",\n    \"Enriched right unit: \\\\circ_{X,X,Y} \\\\circ (id \\\\otimes j_X) = \\\\rho_{C(X,Y)}\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Hom-objects, morphisms, and unit maps serialized in canonical order\",\n      \"Content-addressed deterministic evaluation\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"enriched\",\n    \"symbols\": [\n      \"EnrichedCategory\",\n      \"HomObject\",\n      \"EnrichedComposition\",\n      \"EnrichedUnit\"\n    ],\n    \"required_tests\": [\n      \"test_enriched_associativity_diagram\",\n      \"test_enriched_category_lifecycle_and_unitality\",\n      \"test_kill_mut_p2_06_enriched_unit_morphism_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Monoidal base category V does not resolve or lacks unit/associator\",\n    \"Composition morphism has invalid domain/codomain in V\",\n    \"Unit morphism j_X tampered or has invalid codomain (EnrichedUnitMorphismMismatch / MUT-P2-06)\",\n    \"Enriched associativity diagram fails to commute in V\",\n    \"Enriched unit diagrams fail to commute in V\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An EnrichedCategory replaces set-theoretic hom-sets with objects of a monoidal category V. Composition is a morphism in V and units are morphisms from the monoidal unit I. When V = Set it yields ordinary categories; V = Cat yields 2-categories; V = Ch yields DG categories.\",\n    \"non_role\": [\n      \"Enriched functors and enriched natural transformations (separate contracts)\",\n      \"Enriched model categories\",\n      \"Non-monoidal base categories\"\n    ]\n  },\n  \"wip\": [\n    \"Enriched category formalization in Lean 4 (Enriched.lean)\",\n    \"Rust discrete matrix/algebraic models of enriched categories\",\n    \"Verification of unit morphism coherence under Woland mutation MUT-P2-06\"\n  ]\n}\n",
