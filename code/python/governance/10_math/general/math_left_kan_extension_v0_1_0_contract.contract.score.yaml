    "doctrine": {
      "summary": "A left Kan extension is a universal construction extending a functor F: C → D along K: C → C' to a functor Lan_K(F): C' → D. Left Kan extensions provide colimits, coends, and are fundamental to the calculus of profunctors. Given functors F: C → D and K: C → C', the left Kan extension Lan_K(F): C' → D is universal with respect to natural transformations η: F → Lan_K(F) ∘ K. When colimits exist, Lan_K(F)(c') = colim_{(c, f: K(c)→c')} F(c). The coend formula gives Lan_K(F)(c') = ∫^{c∈C} C'(Kc, c') ⊗ Fc.",
