      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:left_kan_extension:v0.1.0\",\n  \"title\": \"Left Kan Extension Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"universal_construction\",\n    \"symbol\": \"Lan_K(F): C' → D with η: F → Lan_K(F) ∘ K\",\n    \"ascii_symbol\": \"left_kan_extension\",\n    \"notation\": \"Lan_K(F): C' → D with η: F → Lan_K(F) ∘ K\",\n    \"domain\": [\n      \"functor_F: Functor F: C → D\",\n      \"functor_K: Functor K: C → C'\",\n      \"extension: Functor Lan_K(F): C' → D\",\n      \"unit: Natural transformation η: F → Lan_K(F) ∘ K\"\n    ],\n    \"codomain\": {\n      \"description\": \"Given functors F: C → D and K: C → C', a left Kan extension consists of: - A functor Lan_K(F): C' → D - A natural transformation η: F → Lan_K(F) ∘ K (the unit) - Universal property: for any G: C' → D and α: F → G ∘ K, there exists\\n  unique β: Lan_K(F) → G such that α = (β * K) · η\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"F: C → D, K: C → C', and Lan_K(F): C' → D are valid functors\",\n      \"η: F → Lan_K(F) ∘ K is a natural transformation\",\n      \"Universal property satisfied for all G and α\",\n      \"Artifact hash is deterministic SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"F, K, and Lan_K(F) are functors\",\n    \"η: F → Lan_K(F) ∘ K is a natural transformation\",\n    \"For any G: C' → D and α: F → G ∘ K, there exists unique β: Lan_K(F) → G such that α = (β * K) · η\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"F is not a valid functor\",\n    \"K is not a valid functor\",\n    \"η is not a natural transformation\",\n    \"Universal property does not hold\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A left Kan extension is a universal construction extending a functor F: C → D along K: C → C' to a functor Lan_K(F): C' → D. Left Kan extensions provide colimits, coends, and are fundamental to the calculus of profunctors. Given functors F: C → D and K: C → C', the left Kan extension Lan_K(F): C' → D is universal with respect to natural transformations η: F → Lan_K(F) ∘ K. When colimits exist, Lan_K(F)(c') = colim_{(c, f: K(c)→c')} F(c). The coend formula gives Lan_K(F)(c') = ∫^{c∈C} C'(Kc, c') ⊗ Fc.\",\n    \"non_role\": [\n      \"Right Kan extensions (use RightKanExtension contract)\",\n      \"∞-categorical Kan extensions (future work)\",\n      \"Non-pointwise existence conditions beyond basic colimit requirements\"\n    ]\n  },\n  \"wip\": [\n    \"Pointwise Kan extensions: when do they exist and how to verify?\",\n    \"Density and codensity monads from Kan extensions\",\n    \"∞-categorical Kan extensions and their properties\",\n    \"Kan extensions along profunctors\",\n    \"Absolute Kan extensions and their characterization\",\n    \"Current implementation focuses on pointwise left Kan extensions with colimit formula\",\n    \"Coend formula requires tensor product structure in target category\",\n    \"Universal property verification needs efficient mediating morphism search\",\n    \"Consider caching colimit computations for performance\",\n    \"Adjunction Lan_K ⊣ (−) ∘ K should be verified systematically\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_category_theory\",\n    \"module\": \"limits_colimits\",\n    \"symbols\": [\n      \"KanExtension\"\n    ],\n    \"required_tests\": [\n      \"lan_validate_ok\",\n      \"kind_default_is_lan\"\n    ]\n  }\n}\n",
