      ]
    },
    "laws": [
      "If F and G are weakly equivalent diagrams, then hocolim F and hocolim G are weakly equivalent.\n",
      "hocolim F is computed as colim(QF) where QF is a cofibrant replacement of F.\n",
      "hocolim F satisfies the universal property of colimits up to weak equivalence.\n"
    ],
    "replay": {
      "requirements": [
