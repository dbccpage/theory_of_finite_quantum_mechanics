      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:homotopy_colimit:v0.1.0\",\n  \"title\": \"Homotopy Colimit Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"derived_functor\",\n    \"symbol\": \"hocolim F\",\n    \"ascii_symbol\": \"homotopy_colimit\",\n    \"notation\": \"hocolim F\",\n    \"domain\": [\n      \"index_category: small_category\",\n      \"target_category: model_category_or_infinity_category\",\n      \"diagram: functor_I_to_C\"\n    ],\n    \"codomain\": {\n      \"description\": \"For a diagram F: I → C in a model category, the homotopy colimit hocolim F is the colimit of a cofibrant replacement of F.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The diagram F: I → C must be a valid functor\",\n      \"The cofibrant replacement QF must be computed correctly\",\n      \"hocolim F must satisfy the universal property\",\n      \"The artifact hash must be deterministic (SHA-256)\"\n    ]\n  },\n  \"laws\": [\n    \"If F and G are weakly equivalent diagrams, then hocolim F and hocolim G are weakly equivalent.\\n\",\n    \"hocolim F is computed as colim(QF) where QF is a cofibrant replacement of F.\\n\",\n    \"hocolim F satisfies the universal property of colimits up to weak equivalence.\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Cofibrant replacement must be deterministic\",\n      \"Validators must be content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Index category I is not a valid small category\",\n    \"Diagram F is not well-defined\",\n    \"Cofibrant replacement computation fails\",\n    \"Universal property is not satisfied\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A homotopy colimit is the derived version of a categorical colimit, computed in a model category or ∞-category. It captures the \\\"homotopically correct\\\" colimit that respects weak equivalences.\",\n    \"non_role\": [\n      \"Ordinary categorical colimits (use standard category theory)\",\n      \"Homotopy limits (dual construction)\",\n      \"Non-homotopy-invariant constructions\"\n    ]\n  },\n  \"wip\": [\n    \"Homotopy colimits in ∞-categories\",\n    \"Bousfield-Kan formula: hocolim via simplicial replacement\",\n    \"Reedy model structures and latching objects\",\n    \"Contract defines basic structure and validation requirements\",\n    \"Implementation pending for ∞-category case\",\n    \"Simplicial replacement formulas need expansion\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"model_category\",\n    \"symbols\": [\n      \"ModelCategory\",\n      \"MorphismFactorizations\"\n    ],\n    \"required_tests\": [\n      \"test_model_category_positive_verification\"\n    ]\n  }\n}\n",
