    "doctrine": {
      "summary": "Q¹ records residual distinctions modulo admissible exact repair.",
      "symbol": "Q¹",
      "ascii_symbol": "Q1",
      "formula": "Q¹ = C¹ / B¹",
      "1. Contract metadata": {
        "title": "Residual quotient space",
        "version": "0.1.0",
        "object_type": "quotient_space_or_module"
      },
      "2. Mathematical object / functional role": {
        "role": "Q¹ records residual distinctions modulo admissible exact repair.",
        "purpose": "Makes exact repair invisible while preserving non-exact residual classes.",
        "hodge_decomposition": "Over Q, C¹ = im(d₀) ⊕ im(d₁^T) ⊕ H¹ with H¹ = ker(d₁) ∩ ker(d₀^T) (Theorem 3.3, OE010-01). Thus Q¹ ≅ im(d₁^T) ⊕ H¹.",
        "diagnostic_classes": {
          "ExactRepair": "x_C = 0 and x_H = 0 <=> Phi_1 = 0 and Gamma_2 = 0.",
          "ClosedResidual": "x_C = 0 and x_H != 0 <=> Phi_1 > 0 and Gamma_2 = 0.",
          "ActiveClosureFailure": "x_C != 0 <=> Gamma_2 > 0 (witness dominance)."
        },
        "non_role": [
          "Does not require representatives to be closed.",
          "Does not equal H¹; Q¹ contains both harmonic H¹ and co-exact im(d₁^T) components.",
          "Does not select canonical representatives unless a representative policy (TieR) is declared.",
          "Does not classify policy admissibility.",
          "Does not issue certificates.",
          "Does not terminalize.",
          "Does not produce customer-facing claims."
        ]
      },
      "3. Domain and codomain": {
        "domain": "C¹ and B¹=im(d₀)",
        "codomain": "quotient object Q¹ = C¹ / B¹"
      },
      "4. Required structures": {
        "required": [
          "valid cochain layer",
          "C¹",
          "B¹",
          "equivalence relation x~y iff x-y∈B¹",
          "projection π:C¹→Q¹"
        ],
        "optional": [
          "canonical representative policy (TieR)",
          "quotient basis or quotient module presentation",
          "quotient equality witness format"
        ]
      },
      "5. Definition": {
        "class": "[x] = x + B¹",
        "equality": "[x]=[y] iff x-y ∈ B¹ iff ∃α such that x-y=d₀α.",
        "projection": "π:C¹→Q¹ maps x to [x].",
        "hodge_split": "For x in C¹, x = x_E + x_C + x_H, where x_E in im(d₀), x_C in im(d₁^T), x_H in H¹.",
        "sign_convention": "Uses x-y=d₀α for equality witnesses; plus/minus variants must be declared consistently."
      },
      "6. Laws and invariants": {
        "projection_kernel": "ker(π)=B¹.",
        "exact_repair_triviality": "π(x+d₀α)=π(x).",
        "hodge_characterization": "Gamma_2(x) > 0 iff x_C != 0; Phi_1(x) = 0 iff x_C = 0 and x_H = 0 (Theorem 3.3, DDC-TAPE-10).",
        "witness_dominance": "Positive Gamma_2 strictly dominates Phi_1 in routing; open defects cannot seal.",
        "representative_distinction": "A representative x is not the quotient class [x].",
        "quotient_identity": "All representatives in x+B¹ define the same Q¹ class.",
        "not_closed_by_default": "A Q¹ class need not have a closed representative unless separately shown.",
        "carrier_bound": "Q¹ is bound to its source cochain layer and B¹."
      },
      "7. Equality / equivalence rules": {
        "quotient_equality": "Requires replayable B¹ membership witness, preferably α.",
        "strict_representative_equality": "x=y as C¹ vectors is stronger than [x]=[y].",
        "class_equality": "Class equality is equality modulo B¹, not coordinate equality.",
        "cross_layer_comparison": "Q¹ objects from different carriers/layers require declared transport."
      },
      "8. Replay / determinism requirements": {
        "requirements": [
          "Quotient equality witnesses must replay.",
          "Canonical representative policy must be deterministic if used.",
          "Basis/order/hash inherited from cochain layer.",
          "B¹ descriptor hash fixed.",
          "Projection or quotient presentation hash fixed if materialized.",
          "Tolerance-mode membership requires declared tolerance profile."
        ]
      },
      "9. Relationship to other Omega primitives": {
        "relationships": {
          "B1": "B¹ is the denominator of Q¹.",
          "Phi1": "Φ₁ is a quotient norm/obstruction mass on Q¹.",
          "E": "E acts trivially on Q¹.",
          "I": "I permutes Q¹ preserving Φ₁.",
          "R": "R selects a canonical representative of a Q¹ class when TieR is declared.",
          "H1": "H¹ is the closed harmonic subsector ker(d₁) ∩ ker(d₀^T); Q¹ contains both H¹ and im(d₁^T).",
          "Gamma2": "Γ₂(x) = ||d₁ x||₁; measures the co-exact part x_C."
        }
      },
      "10. Rust descriptor shape": {
        "sketch": "pub struct QuotientSpaceDescriptor {\n    pub layer_hash: String,\n    pub c1_basis_hash: String,\n    pub b1_descriptor_hash: String,\n    pub projection_hash: Option<String>,\n    pub quotient_presentation_hash: Option<String>,\n    pub representative_policy_hash: Option<String>,\n    pub membership_witness_format_hash: Option<String>,\n}\n"
      },
      "11. Negative definition tests": {
        "tests": [
          "Quotient equality claimed without witness α or B¹ membership proof.",
          "Representative confused with quotient class.",
