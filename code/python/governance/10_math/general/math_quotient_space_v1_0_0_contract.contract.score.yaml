          "Q¹ treated as H¹.",
          "Q¹ element assumed closed without Γ₂/Z¹ check.",
          "Canonical representative used without deterministic policy.",
          "Q¹ compared across different carriers without transport.",
          "Tolerance membership used without tolerance profile."
        ]
