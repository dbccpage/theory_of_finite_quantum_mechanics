      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:gaussian_rational:v0.1.0\",\n  \"title\": \"Gaussian Rational Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_number_field\",\n    \"symbol\": \"Q(i) = { a + b i : a, b in Q }\",\n    \"ascii_symbol\": \"gaussian_rational\",\n    \"notation\": \"Q(i) = { a + b i : a, b in Q }\",\n    \"domain\": [\n      \"re: exact rational\",\n      \"im: exact rational\"\n    ],\n    \"codomain\": {\n      \"description\": \"Elements a + b i of the field Q(i), with i^2 = -1, in canonical (re, im) form.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Equality is mathematical equality of the pair (re, im)\",\n      \"Every nonzero element is invertible with inverse conj(z) / N(z)\",\n      \"No floating point appears in any operation\"\n    ]\n  },\n  \"laws\": [\n    \"i * i = -1\",\n    \"z * conj(z) = N(z) = re^2 + im^2\",\n    \"z * z^-1 = 1 for every nonzero z\",\n    \"The scalar-tower field axioms hold (commutative ring, every nonzero element invertible)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"cyclotomic\",\n    \"symbols\": [\n      \"GaussianRat\"\n    ],\n    \"required_tests\": [\n      \"test_gaussian_rationals\",\n      \"test_gaussian_rational_field_element\",\n      \"gaussian_rationals_form_a_field\",\n      \"quadratic_minus_one_agrees_with_the_gaussian_rationals\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Inversion of zero must be refused by the scalar-tower try_inv (None)\",\n    \"An element must never be compared through a floating-point approximation\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The Gaussian rationals Q(i) as an exact field, cross-validated against the compile-time quadratic field Quadratic<-1> and the generic cyclotomic field of conductor 4.\",\n    \"non_role\": [\n      \"Gaussian integers as a Euclidean domain (factorisation, primes)\",\n      \"Floating-point complex numbers\"\n    ]\n  },\n  \"wip\": [\n    \"Inherent zero inversion is outside its nonzero precondition; data paths use the canonical scalar-tower Field::try_inv refusal.\"\n  ]\n}\n",
