      "object_kind": "exact_number_field",
      "symbol": "Q(sqrt d) = { a + b sqrt d : a, b in Q }, d squarefree",
      "ascii_symbol": "quadratic_field",
      "notation": "Q(sqrt d) = { a + b sqrt d : a, b in Q }, d squarefree",
      "domain": [
        "radicand d: squarefree integer, not 0 or 1 (compile time for Quadratic<D>, run time for QuadraticNumber)",
        "a, b: exact rationals"
      ],
      "codomain": {
        "description": "Elements a + b sqrt d with exact norm, trace, conjugate, inverse, exact square roots in the field, and for d > 0 an exact total order."
      }
    },
    "requirements": {
      "required_structures": [
        "The radicand is squarefree; an invalid compile-time radicand does not compile, an invalid run-time radicand is refused",
        "Two irrational elements of different fields are never combined; a rational lifts into any field",
        "The order of a real field is decided by comparing a^2 with d b^2, never by approximating sqrt d",
        "Elements of an imaginary field have no sign and are refused",
        "No floating point appears in any operation"
      ]
    },
    "laws": [
      "N(xy) = N(x) N(y) and conj is a ring automorphism; x conj(x) = N(x), x + conj(x) = Tr(x)",
      "phi^2 = phi + 1 and phi^n = F_n phi + F_{n-1} for the golden ratio (d = 5)",
      "The order is total, antisymmetric, translation invariant and compatible with scaling by positives (d > 0)",
      "An element is a square in Q(sqrt d) iff its norm is a rational square r^2 and one of (a +- r)/2 is a nonzero rational square",
      "Quadratic<-1> agrees with Q(i) and Quadratic<-3> with Q(zeta_3)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Exact arithmetic only; no floating point and no tolerance"
      ]
    },
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    },
