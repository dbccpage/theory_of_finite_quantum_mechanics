      "The sum of surds with different radicands must be refused as not a single surd",
      "A square-root request in a field that is not the element's own field must be refused"
    ],
    "doctrine": {
      "summary": "Quadratic number fields in three forms: compile-time radicand with the scalar tower and exact order, one-term real surds, and run-time radicand numbers with exact square-root decisions.",
