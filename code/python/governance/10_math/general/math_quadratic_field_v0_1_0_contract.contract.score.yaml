      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quadratic_field:v0.1.0\",\n  \"title\": \"Quadratic Number Field Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_number_field\",\n    \"symbol\": \"Q(sqrt d) = { a + b sqrt d : a, b in Q }, d squarefree\",\n    \"ascii_symbol\": \"quadratic_field\",\n    \"notation\": \"Q(sqrt d) = { a + b sqrt d : a, b in Q }, d squarefree\",\n    \"domain\": [\n      \"radicand d: squarefree integer, not 0 or 1 (compile time for Quadratic<D>, run time for QuadraticNumber)\",\n      \"a, b: exact rationals\"\n    ],\n    \"codomain\": {\n      \"description\": \"Elements a + b sqrt d with exact norm, trace, conjugate, inverse, exact square roots in the field, and for d > 0 an exact total order.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The radicand is squarefree; an invalid compile-time radicand does not compile, an invalid run-time radicand is refused\",\n      \"Two irrational elements of different fields are never combined; a rational lifts into any field\",\n      \"The order of a real field is decided by comparing a^2 with d b^2, never by approximating sqrt d\",\n      \"Elements of an imaginary field have no sign and are refused\",\n      \"No floating point appears in any operation\"\n    ]\n  },\n  \"laws\": [\n    \"N(xy) = N(x) N(y) and conj is a ring automorphism; x conj(x) = N(x), x + conj(x) = Tr(x)\",\n    \"phi^2 = phi + 1 and phi^n = F_n phi + F_{n-1} for the golden ratio (d = 5)\",\n    \"The order is total, antisymmetric, translation invariant and compatible with scaling by positives (d > 0)\",\n    \"An element is a square in Q(sqrt d) iff its norm is a rational square r^2 and one of (a +- r)/2 is a nonzero rational square\",\n    \"Quadratic<-1> agrees with Q(i) and Quadratic<-3> with Q(zeta_3)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"quadratic\",\n    \"symbols\": [\n      \"Quadratic\",\n      \"Surd\",\n      \"QuadraticNumber\",\n      \"QuadraticError\",\n      \"is_valid_radicand\"\n    ],\n    \"required_tests\": [\n      \"the_radicand_predicate_accepts_exactly_the_squarefree_integers_other_than_0_and_1\",\n      \"every_quadratic_field_satisfies_the_field_axioms\",\n      \"the_norm_is_multiplicative_and_the_conjugate_is_a_ring_automorphism\",\n      \"the_golden_ratio_satisfies_its_defining_identities\",\n      \"exact_sign_agrees_with_an_independent_rational_enclosure_of_the_root\",\n      \"exact_sign_is_correct_where_floating_point_cannot_tell\",\n      \"the_order_is_total_translation_invariant_and_scale_compatible\",\n      \"quadratic_minus_one_agrees_with_the_gaussian_rationals\",\n      \"quadratic_minus_three_agrees_with_the_eisenstein_rationals\",\n      \"square_root_decisions_on_known_cases\",\n      \"a_negative_radicand_is_refused_whatever_the_coefficient\",\n      \"surd_sums_exist_only_for_equal_radicands_or_zero\",\n      \"a_non_squarefree_or_zero_radicand_is_refused\",\n      \"operations_lift_rationals_and_refuse_to_mix_irrational_fields\",\n      \"signs_of_quadratic_numbers_are_exact_and_imaginary_fields_refuse\",\n      \"sqrt_in_refuses_a_foreign_field_and_an_invalid_field\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A non-squarefree or zero radicand must be refused\",\n    \"Combining irrational elements of different quadratic fields must be refused\",\n    \"The sign of an irrational element of an imaginary field must be refused\",\n    \"A negative radicand for a real surd must be refused\",\n    \"The sum of surds with different radicands must be refused as not a single surd\",\n    \"A square-root request in a field that is not the element's own field must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Quadratic number fields in three forms: compile-time radicand with the scalar tower and exact order, one-term real surds, and run-time radicand numbers with exact square-root decisions.\",\n    \"non_role\": [\n      \"Rings of integers, ideals and class groups\",\n      \"Floating-point square roots\"\n    ]\n  },\n  \"wip\": [\n    \"Squarefree radicands above the const-evaluation budget (about 10^11) are refused at compile time\",\n    \"No Lean counterpart exists for the square-root decision procedure\"\n  ]\n}\n",
