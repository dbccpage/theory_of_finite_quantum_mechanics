        "a_non_squarefree_or_zero_radicand_is_refused",
        "operations_lift_rationals_and_refuse_to_mix_irrational_fields",
        "signs_of_quadratic_numbers_are_exact_and_imaginary_fields_refuse",
        "sqrt_in_refuses_a_foreign_field_and_an_invalid_field"
      ]
    },
    "negative_tests": [
