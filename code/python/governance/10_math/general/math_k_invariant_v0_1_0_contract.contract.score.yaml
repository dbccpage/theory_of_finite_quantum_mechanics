      "Artifact attempting to claim authority or admissibility must be rejected"
    ],
    "doctrine": {
      "summary": "A k-invariant (Postnikov invariant) is a cohomology class k_n in H^{n+1}(X_n; pi_n(X)) that classifies the fibration X_{n+1} -> X_n in the Postnikov tower of a space X. Here X_n is the n-th Postnikov section obtained by killing all homotopy groups above dimension n. The k-invariant determines the twist in attaching the next Eilenberg-MacLane space K(pi_{n+1}(X), n+1) as a fiber. If k_n = 0 the fibration is trivial (a product). The sequence {k_n} together with {pi_n(X)} completely determines the homotopy type of X (for simply connected spaces, or more generally with the action of pi_1 on higher groups). k-invariants are fundamental in obstruction theory and Postnikov tower reconstruction.",
      "non_role": [
        "Does not compute full Postnikov tower (covered by PostnikovTower contract)",
        "Does not implement spectral sequences (covered by separate contract)",
        "Does not compute homotopy groups (assumes they are given)",
        "Does not classify admissibility or emit policy decisions",
        "Does not emit certificates or produce customer-facing claims"
      ]
    },
    "wip": [
      "Local coefficient systems and pi_1-action on higher homotopy groups",
      "Secondary k-invariants and higher-order obstruction data",
      "Computational methods for k-invariants via spectral sequences",
      "Relationship to Postnikov towers in model categories and infinity-categories",
      "Initial implementation covers k-invariants for simply connected spaces",
      "Local coefficient system support deferred to future version",
      "PostnikovTower contract does not yet exist; dependency is forward-declared",
      "Naturality under maps implemented via pullback operation",
      "Validation infrastructure matches template requirements"
    ]
