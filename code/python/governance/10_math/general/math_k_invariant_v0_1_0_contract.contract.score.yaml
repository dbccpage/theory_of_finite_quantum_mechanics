      "ascii_symbol": "k_invariant",
      "notation": "k_n in H^{n+1}(X_n; pi_n(X))",
      "domain": [
        "postnikov_section: The n-th Postnikov section X_n of X",
        "fiber_group: The homotopy group pi_n(X) serving as coefficient group",
        "cohomology_degree: Degree n+1 in H^{n+1}(X_n; pi_n(X))",
        "classifying_class: The cohomology class k_n itself"
      ],
      "codomain": {
        "description": "A cohomology class k_n in H^{n+1}(X_n; pi_n(X)) where X_n is the n-th Postnikov section of a space X. The class k_n classifies the fibration X_{n+1} -> X_n with fiber K(pi_{n+1}(X), n+1). The cohomology is taken with local coefficients in the homotopy group pi_n(X), which may carry a pi_1(X)-module structure.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "k_n must be a valid cocycle representative in H^{n+1}(X_n; pi_n(X))",
        "X_n must satisfy pi_i(X_n) = pi_i(X) for i <= n and pi_i(X_n) = 0 for i > n",
        "The coefficient group pi_n(X) must be abelian (automatic for n >= 2)",
        "Cohomology degree must equal n+1 where n is the Postnikov section level",
        "Artifact hash is SHA-256 over all structure data"
      ]
    },
    "laws": [
      "k_n must be a well-defined element of H^{n+1}(X_n; pi_n(X))",
      "X_n must have pi_i(X_n) = pi_i(X) for i <= n and pi_i(X_n) = 0 for i > n",
      "k_n classifies the fibration K(pi_{n+1}(X), n+1) -> X_{n+1} -> X_n",
      "k_n = 0 implies X_{n+1} = X_n x K(pi_{n+1}(X), n+1)",
      "A map f: X -> Y induces f*(k_n^Y) compatible with k_n^X under the induced map on Postnikov sections"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Validators are content-addressed",
        "Same input data produces identical artifact hash",
        "Same cocycle representative and Postnikov section produce identical k-invariant hash"
      ]
    },
    "relationships": {
