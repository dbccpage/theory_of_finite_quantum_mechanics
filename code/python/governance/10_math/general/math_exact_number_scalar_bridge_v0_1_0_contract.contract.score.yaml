      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_number_scalar_bridge:v0.1.0\",\n  \"title\": \"Exact Number Scalar Bridge Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"trait_implementation_bridge\",\n    \"symbol\": \"(+, *, -, 0, 1) with Semiring < Ring < Field < ExactRing on every exact number type\",\n    \"ascii_symbol\": \"exact_number_scalar_bridge\",\n    \"notation\": \"(+, *, -, 0, 1) with Semiring < Ring < Field < ExactRing on every exact number type\",\n    \"domain\": [\n      \"fixed-conductor exact types: GaussianRat, EisensteinRat, Cyc5, Cyc8, Cyc12, Cyc24, Cyc28, Cyc44, Cyc52, Cyc120\",\n      \"the linear_algebra scalar tower traits and std::ops\"\n    ],\n    \"codomain\": {\n      \"description\": \"The std::ops operators, num_traits Zero and One, and the linear_algebra Semiring, Ring, Field and ExactRing implementations for every fixed-conductor exact type, sharing one arithmetic per type.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Every canonical scalar-tower implementation delegates to the type's single inherent exact arithmetic; ExactFieldElement is retired.\",\n      \"Field::try_inv refuses zero and inverts every nonzero element through one shared solver\",\n      \"Equality is mathematical equality (canonical reduced form)\"\n    ]\n  },\n  \"laws\": [\n    \"Commutative ring axioms and distributivity hold through the tower\",\n    \"a * a^-1 = 1 for every nonzero a, and try_inv(0) is None\",\n    \"The std::ops operators agree with the inherent methods\",\n    \"BasicMatrix over these types multiplies as expected (the Hadamard-like matrix squares to the identity)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Exact arithmetic only; no floating point and no tolerance\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"scalar\",\n    \"required_tests\": [\n      \"gaussian_rationals_form_a_field\",\n      \"eisenstein_rationals_form_a_field\",\n      \"cyclotomic_fields_form_fields\",\n      \"large_conductor_fields_invert_through_the_shared_solver\",\n      \"operators_agree_with_the_inherent_methods\",\n      \"cyclotomic_matrices_use_the_linear_algebra_matrix_type\"\n    ],\n    \"symbols\": [\n      \"RationalEmbedding\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Inversion of zero through the tower must be refused (None)\",\n    \"A canonical scalar must not carry a second arithmetic implementation beside its inherent number-field arithmetic.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The bridge that states every fixed-conductor exact type in the vocabulary of the estate: std::ops, num_traits and the linear_algebra scalar tower, so the generic exact matrix algorithms apply.\",\n    \"non_role\": [\n      \"Fixed-width or floating-point scalars\",\n      \"Implementations for types outside this crate\"\n    ]\n  },\n  \"wip\": [\n    \"All fixed exact scalars use the canonical scalar tower and Involution; generic scalar algorithms remain scoped by their explicit field contracts and budgets.\"\n  ]\n}\n",
