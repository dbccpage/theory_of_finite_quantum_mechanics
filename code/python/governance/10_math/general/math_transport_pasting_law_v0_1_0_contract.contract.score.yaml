      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:transport_pasting_law:v0.1.0\",\n  \"title\": \"TransportPastingLaw Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"coherence-condition\",\n    \"symbol\": \"T_2 . T_1 = T_{1,3} and L(T_2 . T_1) = L(T_1) + L(T_2)\",\n    \"ascii_symbol\": \"transport_pasting_law\",\n    \"notation\": \"T_2 . T_1 = T_{1,3} and L(T_2 . T_1) = L(T_1) + L(T_2)\",\n    \"domain\": [\n      \"transport_1: T_1 : R_1 -> R_2 (first transport)\",\n      \"transport_2: T_2 : R_2 -> R_3 (second transport)\",\n      \"composed_transport: T_2 . T_1 : R_1 -> R_3 (composition)\",\n      \"direct_transport: T_{1,3} : R_1 -> R_3 (direct, if exists)\",\n      \"loss_1: L(T_1) (loss of first transport)\",\n      \"loss_2: L(T_2) (loss of second transport)\",\n      \"composed_loss: L(T_2 . T_1) (loss of composition)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A verification record confirming that T_2 . T_1 = T_{1,3} and L(T_2 . T_1) = L(T_1) + L(T_2).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Codomain of T_1 must equal domain of T_2\",\n      \"Composed transport must agree with direct transport (if exists)\",\n      \"Loss of composition must equal sum of individual losses\",\n      \"Triple composition must be associative\"\n    ]\n  },\n  \"laws\": [\n    \"T_2 . T_1 agrees with T_{1,3} when T_{1,3} exists\",\n    \"L(T_2 . T_1) = L(T_1) + L(T_2)\",\n    \"Codomain of T_1 must equal domain of T_2\",\n    \"For T_3 : R_3 -> R_4, (T_3 . T_2) . T_1 = T_3 . (T_2 . T_1)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Composition computation is deterministic\",\n      \"Loss addition is deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Transports with mismatched codomain/domain must be rejected\",\n    \"Composed transport disagreeing with direct must be rejected\",\n    \"Non-additive loss composition must be rejected\",\n    \"Non-associative triple composition must be rejected\",\n    \"Pasting law artifact claiming authority must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A TransportPastingLaw is a mathematical coherence condition for cross-representation transports. It verifies that when two transports T_1 : R_1 -> R_2 and T_2 : R_2 -> R_3 are composed, the result agrees with any direct transport T_{1,3} : R_1 -> R_3. The law also requires that loss ledgers compose additively: L(T_2 . T_1) = L(T_1) + L(T_2). This is the categorical coherence condition ensuring that representation transport forms a well-defined category (or enriched category with loss).\",\n    \"non_role\": [\n      \"Does not construct transport maps (records coherence verification)\",\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates or trust markers\",\n      \"Does not produce customer-facing claims\",\n      \"Does not terminalize\"\n    ]\n  },\n  \"wip\": [\n    \"Should the pasting law handle approximate equality for lossy transports?\",\n    \"How to define loss addition for non-numeric loss measures?\",\n    \"Should we support higher coherence (pasting of pasting laws)?\",\n    \"Currently assumes strict equality for composition agreement\",\n    \"Loss additivity assumes numeric loss measures\",\n    \"Relationship to CODA-MUR transport layer and bicategorical coherence needs formalization\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"two_category\",\n    \"symbols\": [\n      \"Strict2Category\",\n      \"OneMorphismData\"\n    ],\n    \"required_tests\": [\n      \"test_shape_4_triangle_1cells\",\n      \"prop_middle_four_interchange_law\"\n    ]\n  }\n}\n",
