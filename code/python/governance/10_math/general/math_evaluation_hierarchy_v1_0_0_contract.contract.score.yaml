      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:math:evaluation_hierarchy:v1.0.0\ntitle: Evaluation hierarchy\nkind: math_contract\nstatus: mathematical_wip\nlayer: math\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts:\n    - urn:omega:math:phi1_obstruction_mass:v1.0.0\n    - urn:omega:math:gamma2_closure_defect:v1.0.0\n    - urn:omega:math:xi_tie_breaker:v1.0.0\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\nmath:\n  object_kind: evaluation_hierarchy\n  ascii_symbol: evaluation_hierarchy\n  symbol: evaluation_hierarchy\n  notation: evaluation_hierarchy\n  domain:\n  - 'carrier: instance of evaluation_hierarchy'\n  codomain:\n    description: Mathematical object declared by Evaluation hierarchy (structural\n      shell).\nrequirements:\n  required_structures:\n  - Carrier for evaluation_hierarchy must be finite/explicit where claimed\n  - Object kind and domain/codomain (or equivalent) must be declared\n  - Operations, if any, must preserve declared structure\n  - No authority effect may be self-assigned by the structure\nlaws:\n- Evaluation hierarchy is a pure mathematical structure (AuthorityEffect none)\n- All declared required_structures must hold for a valid instance\n- 'Replay is deterministic: no external state, no randomness, no wall-clock'\n- This contract does not mint customer claims or GlobalGreen\nrust_binding:\n  crate: omega_policy\n  module: evaluation_hierarchy\n  symbols:\n  - DiagnosticComparison\n  - classify_guarded_non_worse\n  - compare_guarded_diagnostics\n  - guarded_non_worse\n  - guarded_strictly_improves\n  required_tests:\n  - tied_diagnostics_preserve_and_mismatched_xi_is_incomparable\n  - nonfinite_xi_is_invalid\nnegative_tests:\n- Artifact claiming Evaluation hierarchy without required structures must be rejected\n- Empty or ill-typed carrier for evaluation_hierarchy must be rejected\n- Artifact claiming authority or admissibility must be rejected\n- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected\n- Non-deterministic or external-state-dependent construction must be rejected\ndoctrine:\n  summary: 'Lexicographic diagnostic order over before/after Φ₁, Γ₂, and optionally\n    Ξ. Nonclaim: this contract does not claim HoTT/Univalence discharge, PROVED status,\n    or GlobalGreen.'\n  symbol: lexicographic(Φ₁, Γ₂, Ξ)\n  ascii_symbol: lexicographic(Phi1,Gamma2,Xi)\n  1. Contract metadata:\n    title: Evaluation hierarchy\n    version: 0.1.0\n    object_type: lexicographic_diagnostic_order\n  2. Mathematical object / functional role:\n    role: Lexicographic diagnostic order over before/after Φ₁, Γ₂, and optionally\n      Ξ.\n    purpose: Defines diagnostic comparison of before/after triples; not a policy decision.\n    non_role:\n    - Does not classify policy admissibility.\n    - Does not issue certificates.\n    - Does not terminalize.\n    - Does not produce customer-facing claims.\n    - Does not compare diagnostics across unrelated carriers without transport.\n  3. Domain and codomain:\n    domain: before/after diagnostic tuples with compatible carrier, definitions, and\n      comparison mode\n    codomain:\n    - StrictlyImproves\n    - Preserves\n    - NonWorse\n    - Worsens\n    - Incomparable\n    - Invalid\n  4. Required structures:\n    required:\n    - Φ₁_before\n    - Φ₁_after\n    - Γ₂_before\n    - Γ₂_after\n    - 'comparison mode: exact or tolerance'\n    - carrier/layer compatibility or declared transport\n    - weight profile compatibility or declared weight transport\n    optional:\n    - Ξ_before\n    - Ξ_after\n    - Ξ tie policy\n    required_if_approximate:\n    - tolerance profile\n  5. Definition:\n    lexicographic_order: Compare Φ₁ first, Γ₂ second, Ξ third if used.\n    strictly_improves_rule: 'A proposal strictly improves iff:\n\n      1. Φ₁_after < Φ₁_before, or\n\n      2. Φ₁_after tied with Φ₁_before and Γ₂_after < Γ₂_before, or\n\n      3. Φ₁ and Γ₂ tied and Ξ is used and Ξ_after < Ξ_before.\n\n      '\n    preserves_rule: 'A proposal preserves iff:\n\n      - Φ₁_after tied with Φ₁_before, and\n\n      - Γ₂_after tied with Γ₂_before, and\n\n      - Ξ is omitted or Ξ_after tied with Ξ_before.\n\n      '\n    non_worse_rule: 'A proposal is non-worse iff it strictly improves or preserves.\n\n      '\n    worsens_rule: 'A proposal worsens iff:\n\n      - Φ₁_after > Φ₁_before, or\n\n      - Φ₁ tied and Γ₂_after > Γ₂_before, or\n\n      - Φ₁ and Γ₂ tied, Ξ is used, and Ξ_after > Ξ_before.\n\n      '\n    incomparable_rule: 'A proposal is incomparable if carriers, layers, weight profiles,\n\n      comparison modes, diagnostic definitions, or required transports do not match.\n\n      '\n    override_forbidden:\n    - Γ₂ cannot override Φ₁.\n    - Ξ cannot override Φ₁.\n    - Ξ cannot override Γ₂.\n    resource_bounds: R_cl or other resource closure bounds are separate declared constraints\n      if used.\n  6. Laws and invariants:\n    lexicographic_priority: Φ₁ first, Γ₂ second, Ξ third.\n    tie_required: Lower-priority keys are inspected only after higher-priority keys\n      tie under comparison mode.\n    xi_optional: Ξ may be omitted; if omitted, comparison stops at Γ₂.\n    no_policy_authority: The hierarchy does not decide policy admissibility or customer-facing\n      claims.\n    carrier_compatibility: No cross-carrier comparison without declared transport.\n  7. Equality / equivalence rules:\n    tie: Tie means exact equality in exact mode or equivalence under declared tolerance\n      profile.\n    comparison: All scalar comparisons require finite values and declared comparison\n      mode.\n    transported_equality: Transported comparisons require explicit carrier/layer/weight\n      transport.\n  8. Replay / determinism requirements:\n    requirements:\n    - Same comparison mode before/after.\n    - Tolerance profile hash if approximate.\n    - Carrier/layer hashes match or transport is declared.\n    - Weight profile hashes match or weight transport is declared.\n    - Ξ omitted unless explicitly declared.\n    - No NaN.\n    - No infinite diagnostic values.\n    - No raw float comparison without comparison mode.\n  9. Relationship to other Omega primitives:\n    relationships:\n      Phi1: Dominant key.\n      Gamma2: Secondary key only after Φ₁ tie.\n      Xi: Tertiary key only after Φ₁ and Γ₂ tie.\n      Trichotomy: Uses Φ₁ and Γ₂ but does not replace trichotomy.\n      evaluators: Used by evaluators as diagnostic order, not policy.\n  10. Rust descriptor shape:\n    sketch: \"pub struct EvaluationHierarchyDescriptor {\\n    pub comparison_mode_hash:\\\n      \\ String,\\n    pub uses_xi: bool,\\n\\n    pub carrier_before_hash: String,\\n\\\n      \\    pub carrier_after_hash: String,\\n    pub transport_hash: Option<String>,\\n\\\n      \\n    pub weight_profile_before_hash: Option<String>,\\n    pub weight_profile_after_hash:\\\n      \\ Option<String>,\\n    pub weight_transport_hash: Option<String>,\\n\\n    pub\\\n      \\ phi1_before_hash: String,\\n    pub phi1_after_hash: String,\\n    pub gamma2_before_hash:\\\n      \\ String,\\n    pub gamma2_after_hash: String,\\n    pub xi_before_hash: Option<String>,\\n\\\n      \\    pub xi_after_hash: Option<String>,\\n}\\n\\npub enum DiagnosticComparison\\\n      \\ {\\n    StrictlyImproves,\\n    Preserves,\\n    NonWorse,\\n    Worsens,\\n  \\\n      \\  Incomparable,\\n    Invalid,\\n}\\n\"\n  11. Negative definition tests:\n    tests:\n    - Accept because Ξ improves while Φ₁ worsens.\n    - Accept because Γ₂ improves while Φ₁ worsens.\n    - Use Ξ before Γ₂.\n    - Compare floats without tolerance profile.\n    - Compare across different carriers without transport.\n    - Compare across different weight profiles without weight transport.\n    - All diagnostics tied but result marked Worsens.\n    - All diagnostics tied but result marked StrictlyImproves.\n    - Ξ omitted but comparison requires Ξ improvement.\n    - NaN diagnostic treated as comparable.\n  12. Open questions / WIP status:\n    wip:\n    - Resource closure bound composition.\n    - Canonical tolerance comparison vocabulary.\n    - Transport policy for cross-carrier comparison.\n    - Whether Ξ omission yields partial order or truncated lexicographic order.\n  compact_yaml:\n    EVALUATION_HIERARCHY_CONTRACT:\n      symbol: lexicographic(Φ₁,Γ₂,Ξ)\n      ascii_symbol: lexicographic(Phi1,Gamma2,Xi)\n      status: mathematical_definition_wip\n      authority_effect: none\n      customer_claim_allowed: false\n      domain: before/after diagnostic tuples with compatible carrier/comparison mode\n      codomain:\n      - StrictlyImproves\n      - Preserves\n      - NonWorse\n      - Worsens\n      - Incomparable\n      - Invalid\n      required_structures:\n      - before/after Φ₁\n      - before/after Γ₂\n      - before/after Ξ if used\n      - comparison mode\n      - carrier compatibility or transport\n      - tolerance profile if approximate\n      definition: 'lexicographic diagnostic order: Φ₁ first, Γ₂ second, Ξ third if\n        used'\n      laws:\n      - Γ₂ cannot override Φ₁\n      - Ξ cannot override Φ₁/Γ₂\n      - lower keys inspected only after higher-key tie\n      - resource bounds separate\n      forbidden_interpretations:\n      - policy decision\n      - customer claim\n      - Ξ-first comparison\n      - cross-carrier comparison without transport\n      - non-worse means strictly improves only\n      relationships:\n      - used by evaluators\n      - not policy\n      - depends on Φ₁/Γ₂/Ξ contracts\n      negative_tests:\n      - Ξ improves but Φ₁ worsens\n      - Γ₂ improves but Φ₁ worsens\n      - Ξ before Γ₂\n      - floats without tolerance\n      - carrier mismatch\n      - all tied marked as improvement\n      open_questions:\n      - resource closure bounds\n      - transport policy\n      - tolerance vocabulary\n  non_role:\n  - Authority minting or GlobalGreen discharge\n  - Customer-facing claims or product assurances\n  - Full encyclopedia mechanization of evaluation_hierarchy (deferred)\n  - HoTT/Univalence theorem discharge from this contract alone\n  - Runtime enforcement as proof of mathematical truth\nnomos_debate_NOT_CANONICAL:\n  banner: NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none\n  not_part_of_contract_law: true\n  authority_effect: none\n  potential_defects:\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    code: G_MATH_BLOCK\n    severity: medium\n    claim_class: '[STANDARD]'\n    detail: Missing or not detected field gate G_MATH_BLOCK\n    recommendation: Repair under meth-level math re-review (ADR-007); not GlobalGreen.\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    code: G_LAWS_OR_REQUIREMENTS\n    severity: medium\n    claim_class: '[STANDARD]'\n    detail: Missing or not detected field gate G_LAWS_OR_REQUIREMENTS\n    recommendation: Repair under meth-level math re-review (ADR-007); not GlobalGreen.\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    code: G_REQUIRED_STRUCTURES\n    severity: medium\n    claim_class: '[STANDARD]'\n    detail: 'DEEP Stage-1: required_structures missing or empty'\n    recommendation: Repair under meth-level math re-review (ADR-007/007a); not GlobalGreen.\n    pass: stage1_deep_has_rs\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    code: G_NEGATIVE_TESTS\n    severity: medium\n    claim_class: '[STANDARD]'\n    detail: 'DEEP Stage-1: negative_tests missing or empty'\n    recommendation: Repair under meth-level math re-review (ADR-007/007a); not GlobalGreen.\n    pass: stage1_deep_has_rs\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    cod