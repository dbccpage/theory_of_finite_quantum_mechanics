    "doctrine": {
      "summary": "An Object is an element of a category. In a category C, objects are the nodes of the categorical graph. The contract defines an object by its identifier and its membership in a category. Objects in a category are abstract entities that serve as domains and codomains for morphisms. The internal structure of an object is not visible categorically; objects are only understood through their morphisms. Examples: sets, groups, topological spaces, types.",
      "non_role": [
        "Does not expose internal structure of objects",
        "Does not define morphisms between objects (see Morphism contract)",
        "Does not handle category-wide properties (see Category contract)"
      ]
    },
    "wip": [
      "The contract is minimal; objects are primarily defined by their role in the category",
      "Internal structure of objects (e.g., elements of a set) is not part of this contract",
      "The relationship with Category: Objects are listed in the Category artifact",
      "Contract defines objects purely categorically, without internal structure",
      "Objects are understood only through their morphisms",
      "Future versions may need to handle enriched categories or internal homs"
    ],
    "rust_binding": {
      "crate": "omega_category_theory",
      "module": "finite_category",
      "symbols": [
        "DeclaredFiniteCategory",
        "ValidatedFiniteCategory"
      ],
      "required_tests": [
