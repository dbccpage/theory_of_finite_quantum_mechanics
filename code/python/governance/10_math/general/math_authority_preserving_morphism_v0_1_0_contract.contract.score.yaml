      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:authority_preserving_morphism:v0.1.0\",\n  \"title\": \"AuthorityPreservingMorphism Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"authority_preserving_morphism\",\n    \"symbol\": \"f: (A, grade_A) -> (B, grade_B) with grade_B(f(a)) <= grade_A(a)\",\n    \"ascii_symbol\": \"authority_preserving_morphism\",\n    \"notation\": \"f: (A, grade_A) -> (B, grade_B) with grade_B(f(a)) <= grade_A(a)\",\n    \"domain\": [\n      \"source: graded_object_A\",\n      \"target: graded_object_B\",\n      \"morphism: structure_preserving_map f: A -> B\",\n      \"grading_poset: partially_ordered_set_P\",\n      \"source_grading: grading_function A -> P\",\n      \"target_grading: grading_function B -> P\"\n    ],\n    \"codomain\": {\n      \"description\": \"A morphism f: A -> B in a category C where A and B are equipped with gradings/filtrations, and f respects the grading.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"f is a valid morphism in the ambient category\",\n      \"grade(f(a)) <= grade(a) for sampled elements\",\n      \"Source and target use the same grading poset\",\n      \"f maps from the declared source to the declared target\",\n      \"Artifact hash is deterministically computed\"\n    ]\n  },\n  \"laws\": [\n    \"f is a morphism in the ambient category C (preserves algebraic structure)\",\n    \"grade(f(a)) <= grade(a) for all a in A\",\n    \"Source and target gradings use the same partially ordered set P\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Morphism application from canonical structure tables\",\n      \"Rechecking must reproduce non_escalation_witness_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Morphism that increases authority level must be rejected\",\n    \"Map that does not preserve algebraic structure must be rejected\",\n    \"Source and target with different grading posets must be rejected\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An authority-preserving morphism is a map f: A -> B between graded or filtered objects such that f respects the grading: if a has authority level k, then f(a) has authority level at most k. This models the principle that transformations cannot escalate authority. The morphism must also preserve the underlying algebraic structure (e.g., linearity, module homomorphism). This contract validates the mathematical structure only and confers no actual authority.\",\n    \"non_role\": [\n      \"Granting or checking actual system authority (this is purely mathematical)\",\n      \"Authority escalation detection at runtime (separate concern)\",\n      \"Filtration construction (separate contract)\",\n      \"Graded ring or module theory beyond morphism preservation\"\n    ]\n  },\n  \"wip\": [\n    \"Should strict preservation (grade(f(a)) = grade(a)) be a separate FactEnvelope?\",\n    \"How to handle morphisms that strictly decrease authority (contractive maps)?\",\n    \"Should the contract support multi-graded structures?\",\n    \"Currently models single grading by a totally ordered set\",\n    \"Multi-graded and multi-filtered extensions deferred\",\n    \"Composition of authority-preserving morphisms is automatically authority-preserving\",\n    \"The 'authority' in the name refers to a mathematical grading, not system authority\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"bounded_derived\",\n    \"symbols\": [\n      \"BoundedComplex\",\n      \"CohomologyBoundValidator\"\n    ],\n    \"required_tests\": [\n      \"test_bounded_derived_category_and_truncation\"\n    ]\n  }\n}\n",
