    "doctrine": {
      "summary": "An authority-preserving morphism is a map f: A -> B between graded or filtered objects such that f respects the grading: if a has authority level k, then f(a) has authority level at most k. This models the principle that transformations cannot escalate authority. The morphism must also preserve the underlying algebraic structure (e.g., linearity, module homomorphism). This contract validates the mathematical structure only and confers no actual authority.",
