mega.canonical_json.v1 serialization of the instance\"\n    ],\n    \"codomain\": {\n      \"description\": \"Versioned Finite QM contract instance with four non-collapsing fence types (FiniteCarrier, FiniteDimension, FiniteCertificate, ContinuumDebt/FiniteDimContinuumScalars), an import ledger of declared external slots, and a deterministic content-addressed hash. AuthorityEffect is always None; never GlobalGreen.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"schema_version must equal \\\"FiniteQMContractV1\\\"\",\n      \"FiniteCarrier, FiniteDimension, FiniteCertificate, and ContinuumDebt are distinct newtypes (no type alias collapse)\",\n      {\n        \"Non-inference fence (mandatory)\": \"FiniteCarrier does not imply FiniteDimension; FiniteDimension does not imply FiniteCertificate; FiniteCertificate does not imply ContinuumDebt / FiniteDimContinuumScalars; ContinuumDebt does not imply FiniteCarrier\"\n      },\n      \"continuum scalars (FiniteDimContinuumScalars) does not imply finite certificate; finite certificate does not imply finite-dim Hilbert; finite carrier does not imply continuum object is finite as a set\",\n      \"Import ledger slots use status enum OPEN | DECLARED | WITNESSED only\",\n      \"authority_effect must be None; customer claims and GlobalGreen are forbidden\",\n      \"Canonical hash is SHA-256 of the deterministic compact key-sorted JSON serialization\"\n    ]\n  },\n  \"laws\": [\n    \"FiniteQMContractV1 is a pure structural schema (AuthorityEffect none)\",\n    \"Four fence types never collapse by alias or automatic coercion\",\n    \"Import slots may only advance OPEN -> DECLARED -> WITNESSED; no silent discharge\",\n    \"Canonical hash is deterministic: no external state, no randomness, no wall-clock\",\n    \"This contract does not mint customer claims, certificates of authority, or GlobalGreen\",\n    \"Full QM math (rungs, channels, path-sum, interference) is out of scope for this schema shell\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Import ledger slot order is sorted by slot_id before hashing\",\n      \"Same instance bytes always produce the same SHA-256 digest\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Alias-collapsing FiniteCarrier into FiniteDimension must be rejected\",\n    \"Artifact with authority_effect other than None must be rejected\",\n    \"Artifact claiming GlobalGreen or PROVED from this contract alone must be rejected\",\n    \"Import slot with status outside OPEN|DECLARED|WITNESSED must be rejected\",\n    \"Missing required fence field (carrier, dimension, certificate, continuum_debt) must be rejected\",\n    \"Non-deterministic or external-state-dependent hash construction must be rejected\",\n    \"Treating continuum scalars as a finite certificate must be rejected\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_wdp\",\n    \"module\": \"coda::q::finite_qm_types\",\n    \"symbols\": [\n      \"FiniteCarrier\",\n      \"FiniteDimension\",\n      \"FiniteCertificate\",\n      \"FiniteDimContinuumScalars\",\n      \"ContinuumDebt\",\n      \"ImportSlotStatus\",\n      \"ImportSlot\",\n      \"ImportLedger\",\n      \"FiniteQmContractV1\",\n      \"SCHEMA_VERSION\",\n      \"CONTRACT_URN\"\n    ],\n    \"required_tests\": [\n      \"rejects_alias_collapse_of_fence_types\",\n      \"rejects_authority_effect_other_than_none\",\n      \"rejects_import_slot_status_outside_vocabulary\",\n      \"rejects_missing_required_fence_field\",\n      \"canonical_hash_is_independent_of_slot_insert_order\",\n      \"rejects_continuum_scalars_as_finite_certificate\"\n    ]\n  },\n  \"doctrine\": {\n    \"summary\": \"FiniteQMContractV1 is the versioned JSON schema shell for the finite QM ingredient ladder boundary (qm_12