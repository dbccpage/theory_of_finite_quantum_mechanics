rt_cardinality\": \"non_negative_integer\"\n          }\n        },\n        \"dimension\": {\n          \"type\": \"FiniteDimension\",\n          \"fields\": {\n            \"dimension_id\": \"string\",\n            \"rank\": \"non_negative_integer\"\n          }\n        },\n        \"certificate\": {\n          \"type\": \"FiniteCertificate\",\n          \"fields\": {\n            \"certificate_id\": \"string\",\n            \"kind\": \"string\",\n            \"payload_digest_sha256\": \"string\"\n          }\n        },\n        \"continuum_debt\": {\n          \"type\": \"ContinuumDebt\",\n          \"note\": \"Finite-QM continuum-debt sense (FiniteDimContinuumScalars); not omega_q::continuum::ContinuumDebt\",\n          \"fields\": {\n            \"scalars\": {\n              \"type\": \"FiniteDimContinuumScalars\",\n              \"fields\": {\n                \"declaration_id\": \"string\",\n                \"matrix_algebra_note\": \"string\",\n                \"scalar_field\": \"string\"\n              }\n            },\n            \"notes\": {\n              \"type\": \"array\",\n              \"items\": \"string\"\n            }\n          }\n        },\n        \"import_ledger\": {\n          \"type\": \"ImportLedger\",\n          \"fields\": {\n            \"slots\": {\n              \"type\": \"array\",\n              \"items\": {\n                \"type\": \"ImportSlot\",\n                \"fields\": {\n                  \"slot_id\": \"string\",\n                  \"label\": \"string\",\n                  \"status\": {\n                    \"enum\": [\n                      \"OPEN\",\n                      \"DECLARED\",\n                      \"WITNESSED\"\n                    ]\n                  },\n                  \"witness_ref\": {\n                    \"type\": \"string\",\n                    \"optional\": true\n                  }\n                }\n              }\n            }\n          }\n        }\n      },\n      \"non_inferences\": 