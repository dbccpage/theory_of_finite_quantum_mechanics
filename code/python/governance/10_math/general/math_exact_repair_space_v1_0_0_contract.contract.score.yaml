      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_repair_space:v1.0.0\",\n  \"title\": \"Exact repair space\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:cochain_layer:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"B¹ is the space of exact repairs and coboundary shifts inside C¹.\",\n    \"symbol\": \"B¹\",\n    \"ascii_symbol\": \"B1\",\n    \"formula\": \"B¹ = im(d₀)\",\n    \"1. Contract metadata\": {\n      \"title\": \"Exact repair space\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"subspace_or_submodule_of_C1\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"B¹ is the space of exact repairs and coboundary shifts inside C¹.\",\n      \"purpose\": \"Defines the denominator of Q¹ = C¹ / B¹.\",\n      \"non_role\": [\n        \"Does not by itself select a repaired representative.\",\n        \"Does not imply an arbitrary x ∈ C¹ is exact.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"C⁰ with ordered basis and d₀:C⁰→C¹\",\n      \"codomain\": \"subspace/submodule B¹ ⊆ C¹\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"valid cochain layer\",\n        \"d₀:C⁰→C¹\",\n        \"C⁰ basis\",\n        \"C¹ basis\",\n        \"coefficient domain R\"\n      ],\n      \"optional_materialization\": [\n        \"image basis for B¹\",\n        \"membership solver for B¹\",\n        \"kernel basis for ker(d₀)\"\n      ]\n    },\n    \"5. Definition\": {\n      \"image\": \"B¹ = { d₀α | α ∈ C⁰ }\",\n      \"exact_repair_action\": \"For α ∈ C⁰, E_α(x) = x + d₀α.\",\n      \"equality_mod_B1\": \"x ~ y iff y - x ∈ B¹ iff ∃α ∈ C⁰ such that y = x + d₀α.\",\n      \"sign_convention\": \"Uses plus convention y = x + d₀α; equivalent minus conventions must be declared explicitly.\",\n      \"coset_warning\": \"B¹ is linear/submodule data; x + B¹ is the affine coset of representatives equivalent to x.\"\n    },\n    \"6. Laws and invariants\": {\n      \"subspace\": \"B¹ is an R-submodule/subspace of C¹.\",\n      \"contained_in_closed_sector\": \"If d₁d₀ = 0, then B¹ ⊆ Z¹.\",\n      \"quotient_kernel\": \"B¹ is the kernel of the projection π:C¹→Q¹.\",\n      \"exact_repair_identity\": \"Adding an element of B¹ does not change the Q¹ class.\",\n      \"zero_class\": \"x represents the zero class in Q¹ iff x ∈ B¹.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"equal_repairs\": \"d₀α = d₀β iff α-β ∈ ker(d₀).\",\n      \"alpha_equivalence\": \"α values differing by ker(d₀) produce the same exact repair vector.\",\n      \"quotient_equality\": \"x and y are equal in Q¹ iff y-x has a witness α with y-x=d₀α.\",\n      \"membership\": \"b ∈ B¹ iff ∃α ∈ C⁰ such that b=d₀α.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"Image basis construction must be deterministic if materialized.\",\n        \"α witnesses must be replayable.\",\n        \"Membership in B¹ must use exact linear solve or declared tolerance profile.\",\n        \"C⁰/C¹ basis ordering must be fixed.\",\n        \"d₀ hash must be fixed.\",\n        \"Layer hash must be fixed.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"CochainLayer\": \"B¹ depends on d₀ from the valid cochain layer.\",\n        \"Z1\": \"B¹ ⊆ Z¹ when d₁d₀ = 0.\",\n        \"Q1\": \"B¹ is the denominator of Q¹.\",\n        \"H1\": \"B¹ is the quotient denominator inside Z¹.\",\n        \"E\": \"Exact repair operators act by adding elements of B¹.\",\n        \"Phi1\": \"Φ₁ is zero exactly when the represented class lies in B¹.\",\n        \"R\": \"Residual projection minimizes distance to B¹.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ExactRepairSpaceDescriptor {\\n    pub layer_hash: String,\\n    pub d0_hash: String,\\n    pub c0_basis_hash: String,\\n    pub c1_basis_hash: String,\\n    pub coefficient_domain_hash: String,\\n    pub image_basis_hash: Option<String>,\\n    pub kernel_d0_basis_hash: Option<String>,\\n    pub membership_mode: MembershipMode,\\n    pub tolerance_profile_hash: Option<String>,\\n}\\n\\npub enum MembershipMode {\\n    ExactLinearSolve,\\n    ToleranceBounded,\\n    SymbolicWitness,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Exact repair claimed without α witness.\",\n        \"Exact repair changes quotient class.\",\n        \"d₀ dimension mismatch.\",\n        \"B¹ constructed without valid cochain layer.\",\n        \"Membership in B¹ claimed without solve or witness.\",\n        \"B¹ treated as affine repair target x+B¹.\",\n        \"α values treated as distinct repairs despite α-β∈ker(d₀).\",\n        \"Approximate membership used without tolerance profile.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Canonical image basis policy.\",\n        \"Approximate B¹ membership requires tolerance profile.\",\n        \"Submodule/image representation over non-field coefficient domains.\",\n        \"Normal form for α modulo ker(d₀).\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"EXACT_REPAIR_SPACE_CONTRACT\": {\n        \"symbol\": \"B¹\",\n        \"ascii_symbol\": \"B1\",\n        \"formula\": \"B¹=im(d₀)\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"C⁰,C¹,d₀\",\n        \"codomain\": \"B¹⊆C¹\",\n        \"required_structures\": [\n          \"valid layer\",\n          \"d₀\",\n          \"C⁰ basis\",\n          \"C¹ basis\",\n          \"coefficient domain R\"\n        ],\n        \"definition\": \"B¹={d₀α | α∈C⁰}; x~y iff y-x∈B¹\",\n        \"laws\": [\n          \"B¹⊆Z¹ when d₁d₀=0\",\n          \"B¹=ker(π:C¹→Q¹)\",\n          \"adding B¹ preserves Q¹ class\",\n          \"x is zero in Q¹ iff x∈B¹\"\n        ],\n        \"forbidden_interpretations\": [\n          \"affine repair target for arbitrary defect\",\n          \"repair without α witness\",\n          \"policy decision\",\n          \"B¹ alone selects canonical representative\"\n        ],\n        \"relationships\": [\n          \"denominator of Q¹\",\n          \"denominator inside H¹\",\n          \"exact repair action E_α\",\n          \"Φ₁=0 iff class lies in B¹\",\n          \"R minimizes distance to B¹\"\n        ],\n        \"negative_tests\": [\n          \"missing α\",\n          \"quotient class changed\",\n          \"d₀ dimension mismatch\",\n          \"membership without witness\",\n          \"approximate membership without tolerance\"\n        ],\n        \"open_questions\": [\n          \"canonical image basis policy\",\n          \"non-field image representation\",\n          \"α modulo ker(d₀) normal form\"\n        ]\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
