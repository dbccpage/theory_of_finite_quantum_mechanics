      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_repair:v1.0.0\",\n  \"title\": \"Exact repair (α reducing residual mass)\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"exact_repair\",\n    \"symbol\": \"α ∈ C⁰\",\n    \"ascii_symbol\": \"ExactRepair\",\n    \"notation\": \"h' = ω − d₀α  (repair of representative ω)\",\n    \"domain\": [\n      \"representative residual ω ∈ C¹\",\n      \"repair map d₀ : C⁰ → C¹\",\n      \"repair element α ∈ C⁰\"\n    ],\n    \"codomain\": {\n      \"description\": \"A cochain α that adjusts ω by an exact coboundary/image term d₀α. Exact repair of a class means Φ₁([ω]) = 0 (some α achieves residual 0).\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"C⁰, C¹, d₀\",\n      \"α ∈ C⁰\",\n      \"Residual transform h' = ω − d₀α well-typed in C¹\",\n      \"Optional optimality witness when α is claimed Φ₁-minimizing\"\n    ]\n  },\n  \"laws\": [\n    \"Repair law: applying α yields h' = ω − d₀α ∈ C¹.\",\n    \"Exact-class law: a class is exactly repairable iff ∃α with h' = 0 (equivalently Φ₁=0).\",\n    \"Mass non-increase: for Φ₁ metric, Φ₁([h']) ≤ Φ₁([ω]) with equality of class in Q¹.\",\n    \"Object fence: ExactRepair is a cochain α (or repair certificate), not Φ₁ itself.\",\n    \"Authority law: repair success is not ActionLicense / GlobalGreen / PROVED.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"Deterministic d₀α evaluation\",\n      \"Certificate replay when optimality claimed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_linear_algebra\",\n    \"module\": \"exact_repair\",\n    \"symbols\": [\n      \"ExactRepair\"\n    ],\n    \"required_tests\": [\n      \"alpha_not_in_c0_must_be_rejected\",\n      \"repair_map_shape_mismatch_must_be_rejected\",\n      \"nonzero_residual_cannot_claim_exact_class\"\n    ]\n  },\n  \"negative_tests\": [\n    \"α not in C⁰ must be rejected\",\n    \"Repair map degree/type mismatch must be rejected\",\n    \"Claiming exact class repair with nonzero residual must be rejected\",\n    \"Repair used as authority mint must be rejected\",\n    \"Claiming PROVED / GlobalGreen / HoTT from this contract alone must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Exact repair is an α ∈ C⁰ adjusting residuals by d₀α. Exact class repair means Φ₁=0. Nonclaim: not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Computing Γ₂\",\n      \"Policy admissibility\",\n      \"Authority / PROVED / GlobalGreen / HoTT\"\n    ]\n  },\n  \"wip\": [\n    \"Canonical optimal-repair certificates\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"METH_B4_FOC_RESIDUAL\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Meth B4: exact repair as α-object; link to Φ₁=0 class.\",\n        \"recommendation\": \"Stage-2 symbol surface audit.\",\n        \"pass\": \"meth_b4_foc_residual\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"HAS_RS_BINDING\",\n        \"severity\": \"low\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"exact_repair module present.\",\n        \"file\": \"omega_engine/crates_rs/omega_linear_algebra/src/exact_repair.rs\",\n        \"delta\": \"MATCH\"\n      },\n      {\n        \"reviewer\": \"techne-master-of-proofs-and-derivations\",\n        \"role\": \"PROOF_META_REVIEW\",\n        \"code\": \"PANEL_CONSISTENT\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"detail\": \"Not PROVED.\"\n      }\n    ]\n  }\n}\n",
