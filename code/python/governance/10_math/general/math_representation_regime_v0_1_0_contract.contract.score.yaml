      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:representation_regime:v0.1.0\",\n  \"title\": \"Representation Regime Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"representation_regime\",\n    \"symbol\": \"R = (G, k, C, Sigma)\",\n    \"ascii_symbol\": \"representation_regime\",\n    \"notation\": \"R = (G, k, C, Sigma)\",\n    \"domain\": [\n      \"algebraic_object: G (group, algebra, or Lie algebra)\",\n      \"coefficient_field: k (field or ring of coefficients)\",\n      \"target_category: C (category of target modules)\",\n      \"structural_constraints: Sigma (set of required properties)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A tuple R = (G, k, C, Sigma) specifying the algebraic context for representations.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Algebraic object G must have a content-addressed hash\",\n      \"Coefficient field k must have a content-addressed hash\",\n      \"Target category C must be explicitly specified\",\n      \"All structural constraints in Sigma must be mutually consistent\",\n      \"If Sigma requires char(k) not dividing |G|, this must be verifiable\"\n    ]\n  },\n  \"laws\": [\n    \"G is a well-defined algebraic object with specified structure\",\n    \"k is a valid field (or ring) with required properties\",\n    \"C is a valid abelian category with specified properties\",\n    \"Structural constraints Sigma are mutually consistent\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Regime specification is deterministic\",\n      \"Constraint checking is deterministic\",\n      \"All components use canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Algebraic object that is not a valid group/algebra must be rejected\",\n    \"Coefficient object that is not a valid field must be rejected\",\n    \"Contradictory structural constraints must be rejected\",\n    \"Regime where char(k) | |G| but semisimplicity is required must be rejected\",\n    \"Regime artifact claiming authority must be rejected\",\n    \"Regime artifact claiming admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A RepresentationRegime specifies the algebraic context for representations: the acting algebraic object (group G, algebra A, or Lie algebra g), the coefficient field k, the target category (finite-dimensional k-vector spaces, modules over a ring, etc.), and any structural constraints (semisimplicity, characteristic restrictions). The regime is a passive configuration that parameterizes representation operations but does not itself classify or decide anything.\",\n    \"non_role\": [\n      \"Deciding which regime is correct for a given problem\",\n      \"Policy on which regimes are allowed\",\n      \"Authority over regime selection\",\n      \"Customer-facing claims about regime suitability\"\n    ]\n  },\n  \"wip\": [\n    \"Should regimes support derived categories as target categories?\",\n    \"How to handle modular representation theory regimes (char(k) | |G|)?\",\n    \"Should regimes track available decomposition algorithms?\",\n    \"Currently supports finite groups, associative algebras, and Lie algebras\",\n    \"Modular representation regimes need special handling for non-semisimple cases\",\n    \"Derived category targets deferred to future version\"\n  ]\n}\n",
