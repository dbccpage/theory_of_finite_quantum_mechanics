      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:derived_scheme:v0.1.0\",\n  \"title\": \"Derived Scheme Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"derived_scheme\",\n    \"symbol\": \"X = (X_space, O_X) with Spec(A) affine opens\",\n    \"ascii_symbol\": \"derived_scheme\",\n    \"notation\": \"X = (X_space, O_X) with Spec(A) affine opens\",\n    \"domain\": [\n      \"underlying_space: topological_space_or_infinity_topos\",\n      \"structure_sheaf: sheaf_of_cdgas_or_simplicial_rings\",\n      \"affine_cover: atlas_of_derived_affine_opens\"\n    ],\n    \"codomain\": {\n      \"description\": \"Derived stack with local affine structure\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Underlying space is well-defined topological space or ∞-topos\",\n      \"Structure sheaf is a sheaf of cdga's or simplicial rings\",\n      \"Each open in the cover is derived affine\",\n      \"The cover glues correctly with compatible transition maps\",\n      \"StructureArtifact hash is deterministic from inputs\"\n    ]\n  },\n  \"laws\": [\n    \"Each open in the cover is derived affine (Spec of cdga or simplicial ring)\",\n    \"O_X is a sheaf of cdga's or simplicial rings\",\n    \"The affine cover glues correctly with transition maps\",\n    \"L_X is a perfect complex (implied, not enforced structurally)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All structure sheaf and cover data are fixed byte arrays\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid underlying space must be rejected\",\n    \"Structure sheaf not cdga/simplicial must be rejected\",\n    \"Cover with non-affine opens must be rejected\",\n    \"Incoherent gluing data must be rejected\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A derived scheme is a derived stack that is \\\"schematic\\\" — locally equivalent to Spec of a cdga or simplicial ring. Derived schemes extend algebraic geometry to handle non-transverse intersections and deformation theory intrinsically. The truncation π_0(O_X) gives an ordinary scheme, while higher homotopy π_i(O_X) captures \\\"derived\\\" structure. The cotangent complex L_X is a perfect complex. Derived tensor products X ×^L_Z Y capture correct intersection even when not transverse. This contract is purely structural and does not confer authority.\",\n    \"non_role\": [\n      \"Derived algebraic stacks as groupoid objects (separate contract)\",\n      \"Virtual structure sheaves and Donaldson-Thomas invariants (future)\",\n      \"Specific computations of cotangent complexes (separate operations)\",\n      \"DAG vs SAG distinction (deferred to future versions)\"\n    ]\n  },\n  \"wip\": [\n    \"Relation between DAG (cdga's) and SAG (E_∞-rings)\",\n    \"Derived algebraic stacks as groupoid objects\",\n    \"Virtual structure sheaf and Donaldson-Thomas invariants\",\n    \"Currently targets derived schemes with cdga or simplicial ring structure sheaves\",\n    \"DAG vs SAG distinction deferred to future versions\",\n    \"Derived stacks as groupoid objects will be a separate contract\",\n    \"Virtual structure sheaves and DT invariants are future work\"\n  ]\n}\n",
