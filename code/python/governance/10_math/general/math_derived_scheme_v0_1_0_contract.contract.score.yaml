    "doctrine": {
      "summary": "A derived scheme is a derived stack that is \"schematic\" — locally equivalent to Spec of a cdga or simplicial ring. Derived schemes extend algebraic geometry to handle non-transverse intersections and deformation theory intrinsically. The truncation π_0(O_X) gives an ordinary scheme, while higher homotopy π_i(O_X) captures \"derived\" structure. The cotangent complex L_X is a perfect complex. Derived tensor products X ×^L_Z Y capture correct intersection even when not transverse. This contract is purely structural and does not confer authority.",
      "non_role": [
        "Derived algebraic stacks as groupoid objects (separate contract)",
        "Virtual structure sheaves and Donaldson-Thomas invariants (future)",
        "Specific computations of cotangent complexes (separate operations)",
        "DAG vs SAG distinction (deferred to future versions)"
      ]
    },
    "wip": [
      "Relation between DAG (cdga's) and SAG (E_∞-rings)",
      "Derived algebraic stacks as groupoid objects",
      "Virtual structure sheaf and Donaldson-Thomas invariants",
      "Currently targets derived schemes with cdga or simplicial ring structure sheaves",
      "DAG vs SAG distinction deferred to future versions",
      "Derived stacks as groupoid objects will be a separate contract",
      "Virtual structure sheaves and DT invariants are future work"
    ]
