      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:closed_sector:v1.0.0\",\n  \"title\": \"Closed degree-1 sector\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:cochain_layer:v1.0.0\",\n        \"urn:omega:math:gamma2_closure_defect:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Z¹ is the subspace of degree-1 cochains whose degree-1 coboundary vanishes.\",\n    \"symbol\": \"Z¹\",\n    \"ascii_symbol\": \"Z1\",\n    \"formula\": \"Z¹ = ker(d₁)\",\n    \"1. Contract metadata\": {\n      \"title\": \"Closed degree-1 sector\",\n      \"version\": \"0.1.0\",\n      \"object_type\": \"kernel_subspace\"\n    },\n    \"2. Mathematical object / functional role\": {\n      \"role\": \"Z¹ is the subspace of degree-1 cochains whose degree-1 coboundary vanishes.\",\n      \"purpose\": \"Separates closed residuals from open obstruction residuals.\",\n      \"non_role\": [\n        \"Does not imply exact repair.\",\n        \"Does not imply Φ₁ = 0.\",\n        \"Does not classify policy admissibility.\",\n        \"Does not issue certificates.\",\n        \"Does not terminalize.\",\n        \"Does not produce customer-facing claims.\"\n      ]\n    },\n    \"3. Domain and codomain\": {\n      \"domain\": \"C¹ with d₁: C¹ → C²\",\n      \"codomain\": \"subspace Z¹ ⊆ C¹\"\n    },\n    \"4. Required structures\": {\n      \"required\": [\n        \"d₁: C¹ → C²\",\n        \"C¹ basis\",\n        \"C² basis\",\n        \"coefficient domain R\"\n      ],\n      \"optional_materialization\": [\n        \"kernel basis for Z¹\",\n        \"kernel basis normalization policy\"\n      ]\n    },\n    \"5. Definition\": {\n      \"closed_condition\": \"h ∈ Z¹ iff d₁h = 0.\",\n      \"closure_mode\": {\n        \"exact\": \"Closed iff d₁h = 0 exactly.\",\n        \"tolerance\": \"Closed within tolerance iff ||d₁h|| <= ε under a declared tolerance profile.\"\n      },\n      \"closure_defect\": \"Γ₂([h]) = ||d₁h||₁; Γ₂ = 0 iff h is closed in exact mode.\"\n    },\n    \"6. Laws and invariants\": {\n      \"kernel\": \"Z¹ = ker(d₁).\",\n      \"subspace\": \"Z¹ is a subspace/submodule of C¹ over the declared coefficient domain.\",\n      \"exacts_are_closed\": \"B¹ ⊆ Z¹ whenever d₁ ∘ d₀ = 0.\",\n      \"degree_requirement\": \"Z¹ is undefined without C² and d₁ data.\",\n      \"closed_not_exact\": \"h ∈ Z¹ does not imply h ∈ B¹.\"\n    },\n    \"7. Equality / equivalence rules\": {\n      \"element_equality\": \"Closed elements are equal as C¹ vectors under the fixed basis.\",\n      \"closed_sector_equivalence\": \"Closed sectors are identified only under strict layer equality or a declared layer equivalence.\",\n      \"tolerance_equality\": \"Approximate closure requires declared tolerance profile and does not equal exact closure.\"\n    },\n    \"8. Replay / determinism requirements\": {\n      \"requirements\": [\n        \"d₁h computation must replay exactly or under declared tolerance profile.\",\n        \"Kernel basis policy must be deterministic if Z¹ basis is materialized.\",\n        \"Layer, d₁, C¹ basis, and C² basis must be frozen for replay.\"\n      ]\n    },\n    \"9. Relationship to other Omega primitives\": {\n      \"relationships\": {\n        \"B1\": \"B¹ ⊆ Z¹ when d₁d₀ = 0.\",\n        \"Q1\": \"A closed representative may still define a nonzero class in Q¹.\",\n        \"H1\": \"H¹ = Z¹ / B¹.\",\n        \"Gamma2\": \"Γ₂ detects failure to lie in Z¹.\",\n        \"Phi1\": \"Φ₁ distinguishes exact from non-exact closed residuals.\",\n        \"StabilizedSurvivor\": \"Φ₁ > 0 and Γ₂ = 0 means closed non-exact residual.\",\n        \"OpenObstruction\": \"Φ₁ > 0 and Γ₂ > 0 means residual is not closed.\"\n      }\n    },\n    \"10. Rust descriptor shape\": {\n      \"sketch\": \"pub struct ClosedSectorDescriptor {\\n    pub layer_hash: String,\\n    pub d1_hash: String,\\n    pub c1_basis_hash: String,\\n    pub c2_basis_hash: String,\\n    pub coefficient_domain_hash: String,\\n    pub kernel_basis_hash: Option<String>,\\n    pub kernel_basis_policy_hash: Option<String>,\\n    pub tolerance_profile_hash: Option<String>,\\n}\\n\"\n    },\n    \"11. Negative definition tests\": {\n      \"tests\": [\n        \"Closed claim with d₁h != 0 in exact mode.\",\n        \"Closed claim with ||d₁h|| > ε in tolerance mode.\",\n        \"Missing d₁.\",\n        \"Degree-2 structure absent.\",\n        \"h ∈ Z¹ interpreted as h ∈ B¹.\",\n        \"h ∈ Z¹ interpreted as Φ₁ = 0.\",\n        \"Kernel basis materialized without deterministic basis policy.\"\n      ]\n    },\n    \"12. Open questions / WIP status\": {\n      \"wip\": [\n        \"Kernel basis normalization policy.\",\n        \"Exact-vs-tolerance closure modes.\",\n        \"Submodule handling when coefficient domain is not a field.\"\n      ]\n    },\n    \"compact_yaml\": {\n      \"CLOSED_SECTOR_CONTRACT\": {\n        \"symbol\": \"Z¹\",\n        \"ascii_symbol\": \"Z1\",\n        \"formula\": \"Z¹=ker(d₁)\",\n        \"status\": \"mathematical_definition_wip\",\n        \"authority_effect\": \"none\",\n        \"customer_claim_allowed\": false,\n        \"domain\": \"C¹ with d₁:C¹→C²\",\n        \"codomain\": \"Z¹⊆C¹\",\n        \"required_structures\": [\n          \"d₁\",\n          \"C¹ basis\",\n          \"C² basis\",\n          \"coefficient domain R\"\n        ],\n        \"definition\": \"h∈Z¹ iff d₁h=0\",\n        \"laws\": [\n          \"Z¹ is kernel of d₁\",\n          \"B¹⊆Z¹ when d₁d₀=0\",\n          \"closed does not imply exact\"\n        ],\n        \"forbidden_interpretations\": [\n          \"closed sector without C²/d₁\",\n          \"Γ₂ without degree-2 data\",\n          \"closed means exact\",\n          \"h∈Z¹ implies Φ₁=0\"\n        ],\n        \"relationships\": [\n          \"H¹=Z¹/B¹\",\n          \"Γ₂ detects nonclosure\",\n          \"Φ₁ distinguishes exact from non-exact closed residuals\",\n          \"stabilized survivor requires Φ₁>0 and Γ₂=0\"\n        ],\n        \"negative_tests\": [\n          \"d₁h nonzero\",\n          \"missing d₁\",\n          \"missing C²\",\n          \"closed treated as exact\",\n          \"kernel basis without policy\"\n        ],\n        \"open_questions\": [\n          \"kernel basis policy\",\n          \"tolerance closure mode\",\n          \"non-field coefficient domains\"\n        ]\n      }\n    }\n  },\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; do not read as certification.\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"NO_DEDICATED_REALIZATION\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"detail\": \"No dedicated Rust realization resolved for this math contract (rust_binding missing or non-resolving; no unambiguous matching .rs module).\\n\",\n        \"recommendation\": \"Land a one-YAML-one-file realization under ADR-007a, or keep DEFERRED explicitly.\\n\",\n        \"file\": null,\n        \"delta\": \"YAML_AHEAD_OF_CODE\"\n      }\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
