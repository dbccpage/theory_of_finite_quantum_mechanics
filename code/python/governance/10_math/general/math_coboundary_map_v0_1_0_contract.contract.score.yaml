      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:coboundary_map:v0.1.0\",\n  \"title\": \"CoboundaryMap Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"linear_map\",\n    \"symbol\": \"delta_n: C^n -> C^{n+1}\",\n    \"ascii_symbol\": \"coboundary_map\",\n    \"notation\": \"delta_n: C^n -> C^{n+1}\",\n    \"domain\": [\n      \"source: C^n (cochain group at degree n)\",\n      \"target: C^{n+1} (cochain group at degree n+1)\",\n      \"matrix: Linear transformation matrix\",\n      \"coefficient_domain: Ring or field for coefficients\"\n    ],\n    \"codomain\": {\n      \"description\": \"Linear map delta_n: C^n -> C^{n+1} between cochain groups. Represented by matrix relative to source and target bases.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Target degree equals source degree plus 1\",\n      \"Source and target are valid cochain groups from same complex\",\n      \"Matrix dimensions match source/target basis dimensions\",\n      \"Source, target, and matrix use compatible coefficient domains\",\n      \"Artifact hash correctly identifies coboundary map structure\",\n      \"Composition delta_{n+1} ∘ delta_n = 0 (zero map)\"\n    ]\n  },\n  \"laws\": [\n    \"delta_n raises degree by exactly 1: deg(delta_n(c)) = deg(c) + 1\",\n    \"delta_n(a*c1 + b*c2) = a*delta_n(c1) + b*delta_n(c2) for scalars a,b\",\n    \"delta_{n+1} ∘ delta_n = 0 (composition is zero map)\",\n    \"Domain is C^n, codomain is C^{n+1} from same cochain complex\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state or global variables\",\n      \"No randomness or probabilistic operations\",\n      \"No time-dependent data\",\n      \"Matrix operations must be numerically stable and deterministic\",\n      \"Same cochain input must produce same coboundary output hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_homology\",\n    \"module\": \"coboundary\",\n    \"symbols\": [\n      \"CoboundaryMap\"\n    ],\n    \"required_tests\": [\n      \"apply_rejects_coefficient_length_mismatch\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject if target degree ≠ source degree + 1\",\n    \"Reject if matrix dimensions don't match basis dimensions\",\n    \"Reject if coefficient domains incompatible\",\n    \"Reject if coboundary output lies outside target cochain group\",\n    \"Reject artifact attempting to claim authority or admissibility\",\n    \"Reject operations with randomness or external state\",\n    \"Reject if delta_{n+1} ∘ delta_n ≠ 0\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Degree-raising map delta_n: C^n -> C^{n+1} in a cochain complex. Coboundary maps are linear transformations that increase degree by 1, produce coboundaries (image of delta_n), define cocycles (kernel of delta_n), and satisfy the fundamental cochain complex law: delta_{n+1} ∘ delta_n = 0.\\nThis contract ensures that coboundary maps are properly constructed with validated source/target cochain groups, correct degree shift, compatible coefficient domains, and appropriate matrix representations.\",\n    \"non_role\": [\n      \"Computing cohomology groups (H^n computed separately)\",\n      \"Chain complexes (use BoundaryMap for homological version)\",\n      \"Implementing cup products or cohomological operations\",\n      \"Computing spectral sequences\",\n      \"Providing geometric or topological interpretations\",\n      \"Authority or certification of mathematical results\"\n    ]\n  },\n  \"wip\": [\n    \"Decide sign conventions relative to dual boundary maps (orientation compatibility)\",\n    \"Determine strategy for numerical stability in matrix operations (floating point vs exact arithmetic)\",\n    \"Define relationship to spectral sequences and filtrations\",\n    \"Clarify how cup products and cohomological ring structure interact with coboundary maps\",\n    \"Initial version focuses on basic cochain complex structure\",\n    \"Cochain law validation requires access to adjacent coboundary maps\",\n    \"Kernel/image computation may need specialized algorithms for large matrices\",\n    \"Consider caching kernel/image generators for performance\",\n    \"Sign conventions must align with boundary map contract for duality\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; do not read as certification.\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"STAGE1_MECHANICAL_PASS\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Mechanical GTLA field gates passed (authority/math/non_role/structures/laws-or-requirements/negative_tests). Not PROVED.\",\n        \"recommendation\": \"Repair under meth-level math re-review (ADR-007); not GlobalGreen.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"MODULE_PATH_DRIFT\",\n        \"severity\": \"medium\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"Symbol CoboundaryMap exists; declared module path has no dedicated .rs. Resolved via symbol home coboundary.rs.\\n\",\n        \"recommendation\": \"Align rust_binding.module to coboundary (or rename module).\\n\",\n        \"file\": \"omega_engine/crates/omega_homology/src/coboundary.rs\",\n        \"yaml_law\": \"rust_binding.module = coboundary_map\",\n        \"code_behavior\": \"CoboundaryMap lives in mod coboundary (coboundary.rs), not coboundary_map.\",\n        \"delta\": \"BINDING_PATH_MISMATCH\"\n      },\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"DEGREE_SHIFT_NOT_ENFORCED_AT_NEW\",\n        \"severity\": \"high\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"detail\": \"Core apply/hash/shape present; degree-shift negative test not enforced at construction.\\n\",\n        \"recommendation\": \"Code-follows-YAML: gate new() on to_degree == from_degree + 1.\\n\",\n        \"file\": \"omega_engine/crates/omega_homology/src/coboundary.rs\",\n        \"yaml_law\": \"Reject if target degree ≠ source degree + 1\",\n        \"code_behavior\": \"CoboundaryMap::new stores from_degree/to_degree without +1 check.\",\n        \"delta\": \"CODE_MORE_PERMISSIVE_THAN_YAML\"\n      }\n    ]\n  }\n}\n",
