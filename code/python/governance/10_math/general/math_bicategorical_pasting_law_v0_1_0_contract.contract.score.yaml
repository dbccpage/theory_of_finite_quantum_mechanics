      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bicategorical_pasting_law:v0.1.0\",\n  \"title\": \"BicategoricalPastingLaw Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"bicategorical_pasting_law\",\n    \"symbol\": \"D: top_path => bottom_path (pasting of 2-cells)\",\n    \"ascii_symbol\": \"bicategorical_pasting_law\",\n    \"notation\": \"D: top_path => bottom_path (pasting of 2-cells)\",\n    \"domain\": [\n      \"zero_cells: sequence of objects A_0, ..., A_n\",\n      \"top_path: sequence of 1-cells forming top boundary\",\n      \"bottom_path: sequence of 1-cells forming bottom boundary\",\n      \"two_cells: filling 2-cells for each region\",\n      \"composite: resulting composite 2-cell from top to bottom\",\n      \"evaluation_witness: proof that two evaluation orders agree\"\n    ],\n    \"codomain\": {\n      \"description\": \"A pasting diagram witness consisting of 0-cells, boundary 1-cells (top and bottom paths), interior 2-cells, and the resulting composite 2-cell, together with a proof that different evaluation orders yield the same composite.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Top and bottom paths are well-formed sequences of composable 1-cells\",\n      \"Each region has a valid 2-cell from the top 1-cell to the bottom 1-cell\",\n      \"Two different evaluation orders produce the same composite 2-cell\",\n      \"Interchange law holds for all involved compositions\",\n      \"Artifact hash is deterministically computed\"\n    ]\n  },\n  \"laws\": [\n    \"Top and bottom paths share the same source and target 0-cells\",\n    \"Each region between consecutive 0-cells has a valid 2-cell\",\n    \"Any two valid evaluation orders yield the same composite 2-cell\",\n    \"Horizontal and vertical compositions satisfy the interchange law\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Compositions from canonical bicategory structure\",\n      \"Rechecking must reproduce evaluation_witness_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Top and bottom paths with different endpoints must be rejected\",\n    \"Region without a filling 2-cell must be rejected\",\n    \"Compositions violating interchange law must be rejected\",\n    \"Different evaluation orders yielding different composites must be rejected\",\n    \"Artifact claiming authority must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The bicategorical pasting law states that in a bicategory, any pasting diagram of 2-cells (a planar arrangement of 2-morphisms sharing boundaries) has a unique composite 2-cell. The composite is independent of the order in which binary horizontal and vertical compositions are performed. This is guaranteed by the interchange law, associator and unitor coherence (pentagon and triangle axioms). A pasting law witness records a specific pasting diagram, its boundary 1-cells, the constituent 2-cells, and the resulting composite.\",\n    \"non_role\": [\n      \"Full bicategory construction (separate contract)\",\n      \"Strict 2-category pasting (trivially holds, no witness needed)\",\n      \"3-categorical pasting (Gray categories, separate concern)\",\n      \"Automated pasting diagram parsing\"\n    ]\n  },\n  \"wip\": [\n    \"How to handle non-planar pasting diagrams?\",\n    \"Should the contract support pasting in strict 2-categories (trivial case)?\",\n    \"How to efficiently represent large pasting diagrams?\",\n    \"Relationship to string diagrams and graphical calculus?\",\n    \"Currently handles planar pasting diagrams with explicit region filling\",\n    \"Power's pasting theorem provides the theoretical foundation\",\n    \"String diagram representation may be more efficient for large diagrams\",\n    \"Connection to Joyal-Street graphical calculus is structural\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"two_category\",\n    \"symbols\": [\n      \"Strict2Category\",\n      \"TwoCategory\"\n    ],\n    \"required_tests\": [\n      \"prop_middle_four_interchange_law\",\n      \"test_challenge_mut_02_interchange_vertical_inversion\"\n    ]\n  }\n}\n",
