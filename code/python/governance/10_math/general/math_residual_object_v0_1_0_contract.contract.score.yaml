    ],
    "doctrine": {
      "summary": "A ResidualObject represents an algebraic element that remains after a computation stage has processed what it can. In homological algebra, this corresponds to a cokernel element in coker(d) = C_n / im(d_{n+1}), or more generally an element of a quotient module that witnesses incomplete resolution. The residual object carries its algebraic data (representative element, ambient module, quotient structure), its provenance (which computation produced it), and its status (open, handed_off, resolved).",
