      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:residual_object:v0.1.0\",\n  \"title\": \"Residual Object Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"residual_object\",\n    \"symbol\": \"[b] in Q = M / im(f), [b] != 0\",\n    \"ascii_symbol\": \"residual_object\",\n    \"notation\": \"[b] in Q = M / im(f), [b] != 0\",\n    \"domain\": [\n      \"representative: b (element of ambient module M)\",\n      \"ambient_module: M (module containing the representative)\",\n      \"quotient_module: Q = M / im(f) (cokernel or homology group)\",\n      \"projection: pi: M -> Q (canonical quotient projection)\",\n      \"nontriviality_witness: w: proof that [b] != 0 in Q\"\n    ],\n    \"codomain\": {\n      \"description\": \"A tuple R = (b, M, Q, pi, w) where b is the representative element, M is the ambient module, Q is the quotient module, pi: M -> Q is the projection, and w is the non-triviality witness.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Representative element b must be a valid member of ambient module M\",\n      \"Ambient module M must be well-defined with content-addressed hash\",\n      \"Quotient module Q must be well-defined\",\n      \"Non-triviality witness must prove [b] != 0 in Q\",\n      \"Provenance (which computation produced this residual) must be recorded\"\n    ]\n  },\n  \"laws\": [\n    \"Representative b is a valid element of ambient module M\",\n    \"Quotient Q = M / im(f) is well-defined\",\n    \"[b] != 0 in Q (b is not in im(f))\",\n    \"pi(b) = [b] in Q\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Nontriviality checking is deterministic\",\n      \"Quotient projection is deterministic\",\n      \"All modules use canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Representative not in ambient module M must be rejected\",\n    \"Residual where [b] = 0 in Q must be rejected\",\n    \"Quotient module that is not well-defined must be rejected\",\n    \"Residual with no provenance record must be rejected\",\n    \"Residual object artifact claiming authority must be rejected\",\n    \"Residual object artifact claiming admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A ResidualObject represents an algebraic element that remains after a computation stage has processed what it can. In homological algebra, this corresponds to a cokernel element in coker(d) = C_n / im(d_{n+1}), or more generally an element of a quotient module that witnesses incomplete resolution. The residual object carries its algebraic data (representative element, ambient module, quotient structure), its provenance (which computation produced it), and its status (open, handed_off, resolved).\",\n    \"non_role\": [\n      \"Resolving residuals (separate resolution contract)\",\n      \"Policy on residual handling\",\n      \"Authority over residual significance\",\n      \"Customer-facing claims about residual meaning\"\n    ]\n  },\n  \"wip\": [\n    \"Should residual objects track their 'resolution distance' estimate?\",\n    \"How to handle residual objects from spectral sequence computations?\",\n    \"Should residual objects support algebraic operations (addition, scalar multiplication)?\",\n    \"Currently assumes finitely generated modules\",\n    \"Spectral sequence residuals deferred to future version\",\n    \"Algebraic operations on residuals deferred\",\n    \"Status transitions are recorded but not enforced by this contract\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"dg_category\",\n    \"symbols\": [\n      \"CohomologyCategoryH0\",\n      \"GradedHomComplex\"\n    ],\n    \"required_tests\": [\n      \"test_dg_category_basic_lifecycle\"\n    ]\n  }\n}\n",
