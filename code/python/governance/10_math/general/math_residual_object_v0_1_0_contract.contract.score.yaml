      ]
    },
    "laws": [
      "Representative b is a valid element of ambient module M",
      "Quotient Q = M / im(f) is well-defined",
      "[b] != 0 in Q (b is not in im(f))",
      "pi(b) = [b] in Q"
    ],
    "replay": {
      "requirements": [
        "No external state",
