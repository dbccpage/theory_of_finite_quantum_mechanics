      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_anyon_model:v0.1.0\",\n  \"title\": \"Exact Anyon Models and Fusion Spaces\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_anyon_model\",\n    \"symbol\": \"finite_anyon_model\",\n    \"ascii_symbol\": \"finite_anyon_model\",\n    \"notation\": \"Exact Anyon Models and Fusion Spaces\",\n    \"domain\": [\n      \"Checked Ising, Fibonacci, semion, toric-code and three-fermion categories, or an admitted SU(2)_k carrier.\",\n      \"Finite charge words and admitted fusion totals.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::anyon_model; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Every admitted model replays pentagon, both hexagons and ribbon balance.\",\n    \"Fusion-space dimensions count actual admissible fusion paths with arbitrary-precision integers.\",\n    \"Exchange matrices use the checked F and R symbols, and monodromy equals theta_c/(theta_a theta_b).\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"anyon_model\",\n    \"symbols\": [\n      \"AnyonModel\"\n    ],\n    \"required_tests\": [\n      \"declared_models_satisfy_pentagon_and_both_hexagons\",\n      \"ising_fusion_spaces_and_monodromy_are_computed\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Invalid charges, totals, word sizes and unavailable field roots are typed refusals.\",\n    \"A fusion-space label alone never supplies an associator or braiding.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Every admitted model replays pentagon, both hexagons and ribbon balance.; Fusion-space dimensions count actual admissible fusion paths with arbitrary-precision integers.; Exchange matrices use the checked F and R symbols, and monodromy equals theta_c/(theta_a theta_b)..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"No extension beyond the declared finite carrier and exact computation budgets.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
