      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:checked_diagnostic_observables:v0.1.0\",\n  \"title\": \"Checked numerical observable diagnostics\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"checked_diagnostic_observables\",\n    \"symbol\": \"checked_diagnostic_observables\",\n    \"ascii_symbol\": \"checked_diagnostic_observables\",\n    \"notation\": \"Checked numerical observable diagnostics\",\n    \"domain\": [\n      \"Bounded finite f64 matrices; finite nonnegative construction tolerance; expectation operations use fixed default Hermiticity replay and a scaled default realness threshold\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::observable; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Public storage is rechecked before dependent matrix products\",\n    \"NaN/Inf, invalid tolerances and preallocation dimension overflow refuse\",\n    \"A loose construction tolerance never relaxes operation Hermiticity replay or permits imaginary expectation values to be truncated\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"observable\",\n    \"symbols\": [\n      \"Observable::try_new\",\n      \"Observable::expectation_value_state\",\n      \"Observable::expectation_value_density\"\n    ],\n    \"required_tests\": [\n      \"states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage\",\n      \"quantum_channel::tests::depolarizing_channel_applies_to_a_diagonal_state_with_trace_one\",\n      \"observable::tests::an_expectation_with_an_imaginary_part_is_refused_not_truncated\"\n    ]\n  },\n  \"negative_tests\": [\n    \"states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage\",\n    \"observable::tests::an_expectation_with_an_imaginary_part_is_refused_not_truncated\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Public storage is rechecked before dependent matrix products; NaN/Inf, invalid tolerances and preallocation dimension overflow refuse; A loose construction tolerance never relaxes operation Hermiticity replay or permits imaginary expectation values to be truncated.\",\n    \"non_role\": [\n      \"Diagnostic tolerance-based observations never create exact or theorem authority\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
