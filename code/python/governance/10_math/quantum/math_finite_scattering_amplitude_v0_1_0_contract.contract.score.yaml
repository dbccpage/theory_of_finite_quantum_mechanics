s and probabilities are entries of the actual T matrix.\",\n    \"The optical theorem is T-T dagger = 2i T dagger T.\",\n    \"The finite Lippmann-Schwinger equation is T=V+V G0 T and the resolvent identity is G-G0=G0 T G0.\",\n    \"The Born remainder is the exact difference from the bounded partial series, with a sufficient norm convergence check.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"scattering_amplitude\",\n    \"symbols\": [\n      \"ScatteringAmplitude\",\n      \"ScatteringProblem\"\n    ],\n    \"required_tests\": [\n      \"scattering_optical_theorem_and_channel_probabilities_follow_unitarity\",\n      \"lippmann_schwinger_resolvent_and_born_remainder_are_exact\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Poles, nonsquare or non-Hermitian interactions, channel bounds and Born order excess are typed refusals.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Channel amplitudes and probabilities are entries of the actual T matrix.; The optical theorem is T-T dagger = 2i T dagger T.; The finite Lippmann-Schwinger equation is T=V+V G0 T and the resolvent identity is G-G0=G0 T G0.; The Born remainder is the exact difference from the bounded partial series, with a sufficient norm convergence check..\",\n    \"non_role\": [\n      \"No continuum scattering asymptotics or cross-section normalization beyond the declared finite channel convention.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
