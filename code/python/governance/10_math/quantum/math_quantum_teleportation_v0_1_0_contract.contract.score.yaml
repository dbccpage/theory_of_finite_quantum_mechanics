      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quantum_teleportation:v0.1.0\",\n  \"title\": \"Quantum Teleportation of a Qubit Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"active\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"protocol\",\n    \"symbol\": \"Teleportation of |psi> = alpha|0> + beta|1> through |Phi+>_BC with a Bell measurement on AB\",\n    \"ascii_symbol\": \"quantum_teleportation\",\n    \"notation\": \"v_mu = (<mu|_AB (x) I_C)(|psi>_A (x) |Phi+>_BC); p_mu = |v_mu|^2; v_mu = sigma_mu |psi> / 2 with sigma_mu in {I, Z, X, XZ}\",\n    \"domain\": [\n      \"psi: a unit-norm one-qubit state (f64 amplitudes)\",\n      \"mu: one of the four Bell states on AB (Phi+, Phi-, Psi+, Psi-)\"\n    ],\n    \"codomain\": {\n      \"description\": \"For each outcome mu, Bob conditional state v_mu and Born probability p_mu computed from the three-qubit amplitudes; after the Pauli correction named by mu Bob holds psi up to a global phase\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The conditional states are computed from the amplitudes of |psi>_A (x) |Phi+>_BC and the Bell vectors, not written down from the textbook table\",\n      \"The four Born probabilities must sum to 1 within the stated tolerance, else the run is refused\",\n      \"Fidelity |<psi|recovered>|^2 must be 1 within the tolerance for every outcome\",\n      \"An input that is not a qubit is refused\"\n    ]\n  },\n  \"laws\": [\n    \"Bob conditional state for outcome mu equals sigma_mu |psi> / 2, so every outcome has probability 1/4 for a unit-norm psi\",\n    \"The Born probabilities of the four Bell outcomes sum to 1 for every input (completeness of the Bell basis)\",\n    \"Applying sigma_mu to v_mu returns psi up to a global phase, because each Pauli squares to plus or minus the identity\",\n    \"Without the correction Bob holds sigma_mu |psi>, which is orthogonal to |psi> for psi = |0> and mu = Psi+; the identity correction does not repair it\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"f64 amplitudes; results are diagnostics with an explicit tolerance and never certify\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"teleportation\",\n    \"symbols\": [\n      \"Teleportation\",\n      \"AliceBellMeasurementOutcome\",\n      \"TeleportationResult\",\n      \"TeleportationError\"\n    ],\n    \"required_tests\": [\n      \"bobs_conditional_states_are_the_paulis_applied_to_psi_over_two\",\n      \"the_four_born_probabilities_sum_to_one_for_every_input\",\n      \"the_wrong_or_missing_correction_does_not_recover_the_input\",\n      \"teleport_superposition_state\",\n      \"teleport_computational_zero\",\n      \"a_non_qubit_input_is_refused\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A state that is not a qubit must be refused\",\n    \"Born probabilities that do not sum to 1 must be refused\",\n    \"A fidelity below 1 minus the tolerance must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The protocol is computed from the three-qubit state: conditional states and probabilities come from the amplitudes, and the Pauli table is an independent expectation in the tests, not an input.\",\n    \"non_role\": [\n      \"Noisy channels or imperfect resource pairs\",\n      \"Qudit or continuous-variable teleportation\",\n      \"Classical communication cost or no-signalling arguments\"\n    ]\n  },\n  \"wip\": [\n    \"The arithmetic is f64; an exact version over Q(i) for rational inputs is not written\",\n    \"Alice measurement is modelled by projecting onto a Bell vector, not by a full measurement update with state collapse on the three qubits\"\n  ]\n}\n",
