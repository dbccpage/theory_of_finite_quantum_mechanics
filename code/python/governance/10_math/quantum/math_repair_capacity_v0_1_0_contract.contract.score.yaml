      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:repair_capacity:v0.1.0\",\n  \"title\": \"Conditional Repair Capacity and Concatenation Bounds\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"repair_capacity\",\n    \"symbol\": \"repair_capacity\",\n    \"ascii_symbol\": \"repair_capacity\",\n    \"notation\": \"Conditional Repair Capacity and Concatenation Bounds\",\n    \"domain\": [\n      \"Nonnegative rational production, repair and mixing rates.\",\n      \"A declared positive malignant-pair count C, initial probability at most 1/C and bounded concatenation levels.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::repair_capacity; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The recurrence gives rho_k >= max(0,rho_0+k(lambda-mu-epsilon)).\",\n    \"A positive persistent gap forces strict threshold crossing at the exact integer floor formula; a nonpositive gap does not yield that conclusion.\",\n    \"The concatenation threshold is 1/C and exact upper iterates obey p_l=(C p_0)^(2^l)/C.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"repair_capacity\",\n    \"symbols\": [\n      \"RepairBudget\",\n      \"residual_lower_bounds\",\n      \"windows_to_exceed\",\n      \"concatenated_threshold\",\n      \"concatenated_repair_scaling\"\n    ],\n    \"required_tests\": [\n      \"conditional_concatenation_has_a_fixed_threshold_and_double_exponential_decay\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Negative rates, nonpositive C, rates above the admitted threshold, level excess and rational bit growth are refused.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The recurrence gives rho_k >= max(0,rho_0+k(lambda-mu-epsilon)).; A positive persistent gap forces strict threshold crossing at the exact integer floor formula; a nonpositive gap does not yield that conclusion.; The concatenation threshold is 1/C and exact upper iterates obey p_l=(C p_0)^(2^l)/C..\",\n    \"non_role\": [\n      \"Declared rate and malignant-pair hypotheses are not inferred device properties.\",\n      \"No refutation of fault-tolerance threshold theorems.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
