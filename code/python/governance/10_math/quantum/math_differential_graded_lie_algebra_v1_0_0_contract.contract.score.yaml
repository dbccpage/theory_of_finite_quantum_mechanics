      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:differential_graded_lie_algebra:v1.0.0\",\n  \"title\": \"Differential Graded Lie Algebra Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"deprecated\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"algebra\",\n    \"symbol\": \"(L, d, [-,-])\",\n    \"ascii_symbol\": \"dgla\",\n    \"notation\": \"(L, d, [-,-])\",\n    \"domain\": [\n      \"graded_space: Z-graded vector space L\",\n      \"differential: linear map d of degree 1 (cohomological convention)\",\n      \"bracket: graded Lie bracket [-,-] : L ⊗ L → L\"\n    ],\n    \"codomain\": {\n      \"description\": \"A graded vector space with a differential d and a graded bracket [-, -] satisfying the four laws below.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Status vocabulary for law checks is Exact | Invalid | NotComputed | BudgetExceeded | Refused\",\n      \"An Invalid law check carries a structured counter-witness, never a bare boolean\",\n      \"Coefficients that claim Exact status are exact rationals or exact field elements, never floats\",\n      \"The grading convention is declared (d raises degree by +1)\"\n    ]\n  },\n  \"laws\": [\n    \"d² = 0\",\n    \"[x, y] = -(-1)^{|x||y|} [y, x] (graded skew-symmetry)\",\n    \"[x, [y, z]] = [[x, y], z] + (-1)^{|x||y|} [y, [x, z]] (graded Jacobi)\",\n    \"d[x, y] = [dx, y] + (-1)^{|x|} [x, dy] (graded Leibniz rule)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Deterministic digest (SHA-256) over the canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A differential with d² != 0 returns Invalid with a witness\",\n    \"A bracket violating skew-symmetry, Jacobi or Leibniz returns Invalid with a witness\",\n    \"A float path requesting Exact status is refused\",\n    \"The exact budget is exhausted before the law is decided, which returns BudgetExceeded and not Exact\",\n    \"The grading convention is undeclared, which is refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A differential graded Lie algebra is a Z-graded vector space with a degree-one differential d and a graded Lie bracket satisfying the graded Jacobi identity and the graded Leibniz rule. DGLAs govern derived deformation theory: the Maurer-Cartan equation d a + 1/2 [a, a] = 0 controls formal moduli problems, and the deformation complexes of other algebraic structures are DGLAs.\",\n    \"non_role\": [\n      \"General L-infinity algebras (l_infinity_algebra contract)\",\n      \"Storing is_dgla = true without runtime law validation\",\n      \"Authority of any kind; the contract is purely mathematical\",\n      \"Customer-facing claims\"\n    ]\n  },\n  \"wip\": [\n    \"Legacy status `superseded` named no successor contract; it is mapped to `deprecated`, the nearest status the v1 schema admits.\",\n    \"Legacy id urn:math:contract:DifferentialGradedLieAlgebra:v1.0.0; legacy owner block named promotion target omega_deformation_theory::dglie.rs (symbols DifferentialGradedLieAlgebra, DGLAOps). No such crate exists under omega_engine/crates_rs, so no rust_binding is declared.\",\n    \"The historical comment on the legacy file says not to re-own this in omega_homological / homology dgla; omega_homology/src/dgla.rs is presently compiled out (cfg(any())), so there is no live implementation.\",\n    \"Lie-algebra structure constants, Jacobi checks and the Chevalley-Eilenberg complex are being built in omega_lie_theory; this contract is to be revived against that crate or replaced by it.\",\n    \"Conventions reference (legacy): anomalon/omega_engine/MATHEMATICAL_CONVENTIONS.md. Last audited (legacy record): 2026-08-06.\"\n  ]\n}\n",
