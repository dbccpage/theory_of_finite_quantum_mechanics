      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:l_infinity_algebra:v0.1.0\",\n  \"title\": \"L-Infinity Algebra Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"graded_algebraic_structure\",\n    \"symbol\": \"(g, {l_n})\",\n    \"ascii_symbol\": \"l_infinity_algebra\",\n    \"notation\": \"(g, {l_n})\",\n    \"domain\": [\n      \"graded_module: ⊕_{i∈ℤ} g_i\",\n      \"brackets: {l_n : Sym^n(g) → g | n ≥ 1}\",\n      \"max_arity: N (possibly ∞)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A graded k-module g = ⊕_{i∈ℤ} g_i with multilinear brackets l_n: Sym^n(g) → g for n = 1, 2, ..., N (possibly infinite).\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Each bracket l_n must have degree 2-n\",\n      \"l_n is graded symmetric with sign conventions\",\n      \"Generalized Jacobi identities hold at each arity\",\n      \"Structure must be content-addressed via SHA-256\"\n    ]\n  },\n  \"laws\": [\n    \"g is a graded k-module and l_n has degree 2-n\",\n    \"l_n is graded symmetric with appropriate signs\",\n    \"Generalized Jacobi identities: For all n, the sum over all ways to partition n elements and apply brackets vanishes. Specifically: Σ_{i+j=n+1} Σ_{σ} (-1)^ε l_j(l_i(x_{σ(1)},...),...)=0\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Brackets serialized in arity order\",\n      \"Identical input produces identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"l_n doesn't have degree 2-n\",\n    \"Bracket violates graded symmetry\",\n    \"L_∞ relations fail at some arity\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An L_∞-algebra (strong homotopy Lie algebra) is a graded vector space with multilinear brackets [-, ..., -]_n satisfying generalized Jacobi identities up to coherent homotopy. The contract validates the L_∞ structure equations.\",\n    \"non_role\": [\n      \"L_∞-morphisms (separate contract)\",\n      \"Quasi-isomorphisms between L_∞-algebras\",\n      \"Complete deformation theory apparatus\",\n      \"Integration to L_∞-groups\"\n    ]\n  },\n  \"wip\": [\n    \"Maurer-Cartan elements and deformation theory integration\",\n    \"L_∞-morphisms and quasi-isomorphisms\",\n    \"Koszul duality: L_∞ dual to cocommutative coalgebras\",\n    \"Homotopy transfer theorem implementation\",\n    \"Minimal model construction\",\n    \"Currently focusing on core structure validation\",\n    \"Deformation theory integration planned for v0.2.0\",\n    \"L_∞-morphisms will be separate contract\",\n    \"Consider finite vs infinite arity implementations\"\n  ]\n}\n",
