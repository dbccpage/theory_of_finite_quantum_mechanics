      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_path_integral:v0.1.0\",\n  \"title\": \"Exact Finite Path Sums and Gaussian Integrals\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_path_integral\",\n    \"symbol\": \"finite_path_integral\",\n    \"ascii_symbol\": \"finite_path_integral\",\n    \"notation\": \"Exact Finite Path Sums and Gaussian Integrals\",\n    \"domain\": [\n      \"Declared finite time-sliced semiring kernels.\",\n      \"A positive-definite rational Gaussian precision matrix on at most eight coordinates, with bounded moment and perturbation order.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::path_integral; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The finite partition value is the trace of the actual transfer product.\",\n    \"Positive definiteness is certified by exact LDL and covariance is the canonical exact inverse.\",\n    \"Moments satisfy Isserlis recurrence over actual covariance entries.\",\n    \"Zero-dimensional phi4 partition, log-partition and two-point formal series reproduce the exact Wick and connected coefficients.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"path_integral\",\n    \"symbols\": [\n      \"PathIntegral\",\n      \"GaussianMeasure\"\n    ],\n    \"required_tests\": [\n      \"gaussian_moments_and_phi4_integrals_match_exact_wick_coefficients\",\n      \"finite_chain_partition_is_the_trace_of_the_transfer_product\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Indefinite or singular precision, carrier mismatch and moment/series resource excess are refused.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The finite partition value is the trace of the actual transfer product.; Positive definiteness is certified by exact LDL and covariance is the canonical exact inverse.; Moments satisfy Isserlis recurrence over actual covariance entries.; Zero-dimensional phi4 partition, log-partition and two-point formal series reproduce the exact Wick and connected coefficients..\",\n    \"non_role\": [\n      \"No continuum path measure or measure-convergence assertion.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
