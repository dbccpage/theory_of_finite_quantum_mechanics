      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_discrete_wigner:v0.1.0\",\n  \"title\": \"Exact Odd-Prime Discrete Wigner Phase Space\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_discrete_wigner\",\n    \"symbol\": \"exact_discrete_wigner\",\n    \"ascii_symbol\": \"exact_discrete_wigner\",\n    \"notation\": \"Exact Odd-Prime Discrete Wigner Phase Space\",\n    \"domain\": [\n      \"Odd proven prime P<=128 over Q(zeta_P), with a declared Hermitian P-by-P operator\",\n      \"D5 serialized carrier geometry is checked at every public query\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::wigner; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Phase-point operators are displaced parity and W(q,p)=Tr(rho A(q,p))/P\",\n    \"Full real cyclotomic coefficients are preserved\",\n    \"All P(P+1) stabilizer states at P=3,5,7 have nonnegative exact Wigner values, unit total mass and correct line-projector marginals\",\n    \"The exact L1 norm uses the declared real embedding\",\n    \"The retained five-level magic-state law evaluates every exact Wigner entry, preserves total mass one and origin -1/5, and explicitly refuses a whole-grid rational projection when entries are nonrational.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"wigner\",\n    \"symbols\": [\n      \"DiscreteWigner\",\n      \"DiscreteWignerSystemD5\",\n      \"WignerError\",\n      \"DiscreteWigner::stabilizer_projector\",\n      \"DiscreteWigner::line_marginal\",\n      \"DiscreteWigner::l1_norm\",\n      \"DiscreteWignerSystemD5::evaluate_exact\"\n    ],\n    \"required_tests\": [\n      \"non_rational_real_wigner_values_are_retained_and_rational_projection_is_refused\",\n      \"all_stabilizer_states_at_primes_three_five_and_seven_have_nonnegative_wigner_marginals\",\n      \"test_d5_magic_state_point_negativity\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Nonrational values refuse rational projection instead of retaining only the constant coefficient\",\n    \"Malformed serialized grids, wrong operator shape, non-Hermitian inputs and invalid coordinates are refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Phase-point operators are displaced parity and W(q,p)=Tr(rho A(q,p))/P; Full real cyclotomic coefficients are preserved; All P(P+1) stabilizer states at P=3,5,7 have nonnegative exact Wigner values, unit total mass and correct line-projector marginals; The exact L1 norm uses the declared real embedding; The retained five-level magic-state law evaluates every exact Wigner entry, preserves total mass one and origin -1/5, and explicitly refuses a whole-grid rational projection when entries are nonrational..\",\n    \"non_role\": [\n      \"No default density admission for an arbitrary Hermitian operator\",\n      \"No extension to even-dimensional Gross phase space or continuum Wigner theory\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
