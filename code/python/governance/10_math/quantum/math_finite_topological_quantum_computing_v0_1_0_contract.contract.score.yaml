      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_topological_quantum_computing:v0.1.0\",\n  \"title\": \"Exact Braids and Bounded Projective Gate Images\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_topological_quantum_computing\",\n    \"symbol\": \"finite_topological_quantum_computing\",\n    \"ascii_symbol\": \"finite_topological_quantum_computing\",\n    \"notation\": \"Exact Braids and Bounded Projective Gate Images\",\n    \"domain\": [\n      \"An actual fusion space and its exact braid generators.\",\n      \"Signed braid words and an explicit finite image-enumeration budget.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::topological_quantum_computing; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Adjacent generators obey the braid relation and distant generators commute.\",\n    \"Negative word letters use the inverse braid matrix.\",\n    \"The four-sigma Ising qubit has projective image size twenty-four, excluding the T gate after complete closure.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"topological_quantum_computing\",\n    \"symbols\": [\n      \"TopologicalQuantumComputing\"\n    ],\n    \"required_tests\": [\n      \"ising_braid_image_is_projectively_clifford_and_excludes_t\",\n      \"gate_words_refuse_aggregate_dense_work_before_products\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A search budget exhaustion yields undecided membership.\",\n    \"Invalid braid letters and oversized words are refused.\",\n    \"Excessive aggregate dense-word work and oversized path or generator materialization are typed budget refusals before allocation or products.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Adjacent generators obey the braid relation and distant generators commute.; Negative word letters use the inverse braid matrix.; The four-sigma Ising qubit has projective image size twenty-four, excluding the T gate after complete closure..\",\n    \"non_role\": [\n      \"No universality claim follows from a model name or a partial image search.\",\n      \"No operational authority or device-performance claim.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
