      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:a_infinity_algebra:v0.1.0\",\n  \"title\": \"A-Infinity Algebra Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"a_infinity_algebra\",\n    \"symbol\": \"(A, {m_n}_{n≥1})\",\n    \"ascii_symbol\": \"a_infinity_algebra\",\n    \"notation\": \"(A, {m_n}_{n≥1})\",\n    \"domain\": [\n      \"graded_module: graded_k_module\",\n      \"operations: sequence_of_multilinear_maps\",\n      \"max_arity: natural_number_or_infinity\",\n      \"coefficient_field: field\"\n    ],\n    \"codomain\": {\n      \"description\": \"Graded module with higher operations\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"A is properly graded and each m_n has degree 2-n\",\n      \"A_∞ relations hold for each arity k\",\n      \"If strictly unital, verify unit conditions for m_2 and higher\",\n      \"StructureArtifact hash is deterministic from inputs\"\n    ]\n  },\n  \"laws\": [\n    \"m_1: A → A is a differential (m_1² = 0)\",\n    \"m_n: A^⊗n → A has degree 2-n\",\n    \"Σ_{i+j=k+1} Σ_s (-1)^ε m_i(a_1,...,m_j(a_s,...),...)= 0\",\n    \"A is a graded module over coefficient field k\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Operations serialized in arity order\",\n      \"Validators and computation functions are content-addressed\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"m_n doesn't have degree 2-n. grading_validator fails.\",\n    \"A_∞ relation fails at some arity. a_infinity_relation_validator fails.\",\n    \"If claimed unital, unit conditions fail. unitality_validator fails.\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An A_∞-algebra is a graded vector space A with a sequence of operations m_n: A^⊗n → A of degree 2-n satisfying the A_∞ relations (generalizing associativity up to coherent homotopy). The contract validates the A_∞ structure equations. A_∞-algebras up to quasi-isomorphism are equivalent to DG-algebras up to quasi-isomorphism. This contract is purely structural and does not confer authority.\",\n    \"non_role\": [\n      \"A_∞-morphisms (separate contract)\",\n      \"Homotopy transfer theorem (separate contract)\",\n      \"Bar-cobar duality (separate contract)\",\n      \"Specific computations of Massey products (computation contract)\"\n    ]\n  },\n  \"wip\": [\n    \"Minimal A_∞ structures (m_1 = 0) exist on cohomology\",\n    \"A_∞-morphisms and homotopy transfer theorem\",\n    \"Bar-cobar duality: BA is a DG-coalgebra\",\n    \"Currently targets finite-arity A_∞-algebras\",\n    \"Infinite-arity structures deferred to future versions\",\n    \"A_∞-morphisms will be separate contract\",\n    \"Homotopy transfer theorem will be separate contract\",\n    \"Bar-cobar duality will be separate contract\"\n  ]\n}\n",
