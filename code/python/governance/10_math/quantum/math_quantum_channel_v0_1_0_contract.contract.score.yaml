      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quantum_channel:v0.1.0\",\n  \"title\": \"QuantumChannel Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"quantum_channel\",\n    \"symbol\": \"quantum_channel\",\n    \"ascii_symbol\": \"quantum_channel\",\n    \"notation\": \"Exact Finite Quantum Channel\",\n    \"domain\": [\n      \"Finite input/output operator spaces over Q(i), with weighted exact Kraus or Choi data\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::exact_channel; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The full Choi operator is positive semidefinite and its output partial trace is input identity\",\n    \"The weighted Kraus completeness relation is sum w K dagger K=I\",\n    \"Application is linear, trace preserving and retains complex coherences\",\n    \"Rectangular Kraus, Choi and Stinespring routes replay the same channel\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject wrong Choi dimension, nonpositive Choi data, non-Hermitian candidates and failed trace preservation\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The full Choi operator is positive semidefinite and its output partial trace is input identity; The weighted Kraus completeness relation is sum w K dagger K=I; Application is linear, trace preserving and retains complex coherences; Rectangular Kraus, Choi and Stinespring routes replay the same channel.\",\n    \"non_role\": [\n      \"Unrelated artifact-addressing protocols\",\n      \"General continuum channels or customer-facing authority\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\",\n    \"The former generic metadata scaffold remains outside this explicitly declared finite executable domain; its unsupported hash obligations are not claimed discharged.\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"exact_channel\",\n    \"symbols\": [\n      \"ExactKrausChannel\",\n      \"ExactChoiMatrix\",\n      \"ExactKrausChannel::try_weighted\",\n      \"ExactChoiMatrix::try_new\"\n    ],\n    \"required_tests\": [\n      \"channels_have_choi_kraus_metric_stinespring_and_ordinary_routes\",\n      \"rectangular_channel_factorization_and_malformed_choi_refusals\",\n      \"generalized_amplitude_damping_has_the_exact_thermal_fixed_state\"\n    ]\n  }\n}\n",
