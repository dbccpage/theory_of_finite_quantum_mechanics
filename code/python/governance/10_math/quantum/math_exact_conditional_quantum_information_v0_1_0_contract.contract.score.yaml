ons return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Bell conditional entropy is negative and mutual information is twice marginal entropy\",\n    \"Conditional mutual information uses actual three-party reductions\",\n    \"Araki-Lieb gaps use actual full density reductions\",\n    \"Diagnostic mutual and conditional entropy reject nonfinite and nonpositive tolerances through canonical checked density configuration\",\n    \"The diagnostic caller trace tolerance controls admission without renormalization; strict rejection and loose acceptance retain Bell entropy controls\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"quantum_mutual_information\",\n    \"symbols\": [\n      \"QuantumMutualInformation::conditional_mutual_exact\",\n      \"QuantumMutualInformation::araki_lieb_gaps\",\n      \"QuantumMutualInformation::mutual_information_matrix\",\n      \"QuantumMutualInformation::conditional_entropy_matrix\"\n    ],\n    \"required_tests\": [\n      \"states_channels_exact_tests::coherent_information_and_relative_entropy_use_full_operators\",\n      \"states_channels_exact_tests::diagnostic_matrix_information_rejects_invalid_tolerances_and_retains_bell_values\",\n      \"states_channels_exact_tests::diagnostic_matrix_information_uses_the_supplied_trace_tolerance\"\n    ]\n  },\n  \"negative_tests\": [\n    \"states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage\",\n    \"states_channels_exact_tests::diagnostic_matrix_information_rejects_invalid_tolerances_and_retains_bell_values\",\n    \"states_channels_exact_tests::diagnostic_matrix_information_uses_the_supplied_trace_tolerance\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Bell conditional entropy is negative and mutual information is twice marginal entropy; Conditional mutual information uses actual three-party reductions; Araki-Lieb gaps use actual full density reductions; Diagnostic mutual and conditional entropy reject nonfinite and nonpositive tolerances through canonical checked density configuration; The diagnostic caller trace tolerance controls admission without renormalization; strict rejection and loose acceptance retain Bell entropy controls.\",\n    \"non_role\": [\n      \"No diagonal population entropy is presented as full-operator entanglement entropy\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
