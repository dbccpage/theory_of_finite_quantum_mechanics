K^dagger K=I\",\n    \"Composition retains the translation term\",\n    \"Fujiwara-Algoet comparisons retain both unsquared nonnegative left sides\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"qubit_bloch_map\",\n    \"symbols\": [\n      \"QubitBlochMap\",\n      \"BlochMapError\",\n      \"QubitBlochMap::from_affine\",\n      \"QubitBlochMap::from_kraus\",\n      \"QubitBlochMap::choi_matrix\",\n      \"QubitBlochMap::compose\",\n      \"QubitBlochMap::unital_diagonal_is_cp\"\n    ],\n    \"required_tests\": [\n      \"choi_positivity_matches_kraus_damping_and_keeps_fujiwara_left_sides\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A perturbation of size 2^-128 below the depolarizing CP boundary is refused\",\n    \"A squared-only Fujiwara comparison is excluded by lambda=(0,0,3)\",\n    \"Empty/nonqubit/non-TP Kraus families are refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Complete positivity is exact Choi positivity via rational realification; Kraus extraction agrees with the affine map and checks sum K^dagger K=I; Composition retains the translation term; Fujiwara-Algoet comparisons retain both unsquared nonnegative left sides.\",\n    \"non_role\": [\n      \"Bloch contraction alone does not certify complete positivity\",\n      \"No floating or approximate Choi eigenvalue test\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
