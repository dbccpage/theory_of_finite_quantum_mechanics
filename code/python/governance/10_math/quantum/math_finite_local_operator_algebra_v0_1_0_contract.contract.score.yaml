      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_local_operator_algebra:v0.1.0\",\n  \"title\": \"Exact Finite Unital Star Algebras\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_local_operator_algebra\",\n    \"symbol\": \"finite_local_operator_algebra\",\n    \"ascii_symbol\": \"finite_local_operator_algebra\",\n    \"notation\": \"Exact Finite Unital Star Algebras\",\n    \"domain\": [\n      \"Finite Gaussian-rational square operator generators on Hilbert dimension at most sixteen.\",\n      \"Declared closure and exact field operation budgets.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::local_operator_algebra; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The retained independent basis contains the identity and is closed under multiplication and dagger.\",\n    \"The commutant is the simultaneous commutator kernel; the center is its intersection with the algebra.\",\n    \"The even two-mode Majorana algebra has dimension eight and center and commutant dimension two.\",\n    \"A local Pauli tensor algebra has the complementary tensor algebra as commutant.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"local_operator_algebra\",\n    \"symbols\": [\n      \"LocalOperatorAlgebra\"\n    ],\n    \"required_tests\": [\n      \"even_fermion_algebra_has_dimension_eight_and_two_dimensional_center\",\n      \"pauli_local_algebra_commutant_is_the_complement_region\",\n      \"oversized_algebra_constraint_packets_refuse_before_dense_materialization\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Ragged, rectangular, carrier-mismatched and over-budget generators are refused.\",\n    \"Dense center and commutant constraint packets above canonical storage or scalar-operation budgets refuse before materialization.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The retained independent basis contains the identity and is closed under multiplication and dagger.; The commutant is the simultaneous commutator kernel; the center is its intersection with the algebra.; The even two-mode Majorana algebra has dimension eight and center and commutant dimension two.; A local Pauli tensor algebra has the complementary tensor algebra as commutant..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"No extension beyond the declared finite carrier and exact computation budgets.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
