      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:shor_topos:v1.0.0\",\n  \"title\": \"Shor Topos Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"topos\",\n    \"symbol\": \"\\\\mathcal{E}_{Shor}\",\n    \"ascii_symbol\": \"shor_topos\",\n    \"notation\": \"\\\\mathcal{E}_{Shor}\",\n    \"domain\": [\n      \"category: a category with finite limits\",\n      \"exponentials: exponential objects\",\n      \"subobject_classifier: a subobject classifier\"\n    ],\n    \"codomain\": {\n      \"description\": \"A topos in which the logic of Shor-style quantum algorithms can be stated constructively.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The category has finite limits\",\n      \"The category has exponentials\",\n      \"The category has a subobject classifier\"\n    ]\n  },\n  \"laws\": [\n    \"Topos axioms: finite limits, exponentials and a subobject classifier\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Deterministic digest (SHA-256) over the canonical serialization\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A category missing a subobject classifier is refused\",\n    \"A category missing finite limits or exponentials is refused\",\n    \"An artifact claiming authority or admissibility is refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A specialized topos model intended to encapsulate Shor-algorithm logic and quantum circuit topologies in a categorical setting. It is the logical universe in which quantum algorithms could be reasoned about constructively: a category with finite limits, power objects and a quantum-specific subobject classifier.\",\n    \"non_role\": [\n      \"Shor's factoring algorithm itself; omega_quantum_physics::shor is the [[9,1,3]] error-correcting code, a different object\",\n      \"Authority of any kind; the contract is purely mathematical\",\n      \"Customer-facing claims\"\n    ]\n  },\n  \"wip\": [\n    \"Legacy id urn:math:contract:ShorTopos:v1.0.0 with status `staged`, mapped to `mathematical_wip`.\",\n    \"Legacy owner named crate omega_topos, module shor_topos.rs, symbols ShorTopos and ShorToposLogic. No such crate exists under omega_engine/crates_rs, so no rust_binding is declared.\",\n    \"The legacy contract declared no validators and no tests; this is a statement of intent only. No module of the estate implements Shor factoring: omega_quantum_physics::shor is the [[9,1,3]] error-correcting code.\",\n    \"Last audited (legacy record): 2026-06-15.\"\n  ]\n}\n",
