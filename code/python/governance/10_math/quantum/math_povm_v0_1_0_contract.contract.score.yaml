      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:povm:v0.1.0\",\n  \"title\": \"POVM Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"povm\",\n    \"symbol\": \"povm\",\n    \"ascii_symbol\": \"povm\",\n    \"notation\": \"Exact Finite POVM\",\n    \"domain\": [\n      \"A nonempty finite family of equal-size positive Hermitian Q(i) effects resolving identity\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::instruments; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Each effect is Hermitian positive semidefinite and their exact sum is identity\",\n    \"For an admitted density operator probabilities are Tr(E_i rho), nonnegative, and sum to one\",\n    \"Outcome indices are precisely the checked effect-family positions\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject malformed dimensions, non-Hermitian effects, nonpositive effects and failed completeness\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Each effect is Hermitian positive semidefinite and their exact sum is identity; For an admitted density operator probabilities are Tr(E_i rho), nonnegative, and sum to one; Outcome indices are precisely the checked effect-family positions.\",\n    \"non_role\": [\n      \"A POVM does not determine its instrument or physical implementation\",\n      \"Continuous outcome carriers\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\",\n    \"The former generic metadata scaffold remains outside this explicitly declared finite executable domain; its unsupported hash obligations are not claimed discharged.\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"instruments\",\n    \"symbols\": [\n      \"ExactPovm\",\n      \"ExactPovm::try_new\",\n      \"ExactPovm::probabilities\"\n    ],\n    \"required_tests\": [\n      \"spectral_projective_measurements_are_repeatable_and_refuse_noncommuting_joint\",\n      \"measurement_exact_laws::naimark_compression_replays_a_nonprojective_povm_without_rational_square_roots\"\n    ]\n  }\n}\n",
