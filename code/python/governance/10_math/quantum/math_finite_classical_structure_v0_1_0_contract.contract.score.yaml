      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_classical_structure:v0.1.0\",\n  \"title\": \"Exact Classical Copying Structures\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_classical_structure\",\n    \"symbol\": \"finite_classical_structure\",\n    \"ascii_symbol\": \"finite_classical_structure\",\n    \"notation\": \"Exact Classical Copying Structures\",\n    \"domain\": [\n      \"A complete Gaussian-rational orthonormal basis on a finite Hilbert space.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::classical_structure; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Delta equals sum_b (b tensor b) b dagger and epsilon equals sum_b b dagger.\",\n    \"The maps form a special commutative dagger Frobenius algebra.\",\n    \"Copyable coalgebra points satisfy Delta(v)=v tensor v and epsilon(v)=1; zero is excluded.\",\n    \"Mutual unbiasedness is exactly |inner(b,c)| squared = 1/d for every cross-basis pair.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"classical_structure\",\n    \"symbols\": [\n      \"ClassicalStructure\"\n    ],\n    \"required_tests\": [\n      \"rational_rotated_basis_is_a_classical_structure_with_only_basis_points_copyable\",\n      \"complex_rational_unbiased_basis_is_complementary\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Incomplete or nonorthonormal bases and mismatched dimensions are refused.\",\n    \"Zero is not a classical point despite satisfying the copying equation alone.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Delta equals sum_b (b tensor b) b dagger and epsilon equals sum_b b dagger.; The maps form a special commutative dagger Frobenius algebra.; Copyable coalgebra points satisfy Delta(v)=v tensor v and epsilon(v)=1; zero is excluded.; Mutual unbiasedness is exactly |inner(b,c)| squared = 1/d for every cross-basis pair..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"No extension beyond the declared finite carrier and exact computation budgets.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
