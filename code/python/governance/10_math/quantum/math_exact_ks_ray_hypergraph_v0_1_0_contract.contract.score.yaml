      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_ks_ray_hypergraph:v0.1.0\",\n  \"title\": \"Exact Kochen-Specker ray and pair constraints\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_ks_ray_hypergraph\",\n    \"symbol\": \"exact_ks_ray_hypergraph\",\n    \"ascii_symbol\": \"exact_ks_ray_hypergraph\",\n    \"notation\": \"Exact Kochen-Specker ray and pair constraints\",\n    \"domain\": [\n      \"Finite exact-field rays dimension1..16, up to512 rays, bounded Boolean fuel\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::kochen_specker; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Every context is a genuine full orthogonal frame\",\n    \"All orthogonal pair exclusions remain independent of context exact-one constraints\",\n    \"Public ray and pair mutations are revalidated\",\n    \"Primitive Pythagorean rational rays have a unique odd-coordinate colour\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"kochen_specker\",\n    \"symbols\": [\n      \"RaySystem\",\n      \"RaySystem::problem\",\n      \"RaySystem::decide\",\n      \"RaySystem::deletion_minimal_core\",\n      \"cabello_18\",\n      \"peres_33\",\n      \"pythagorean_colour\"\n    ],\n    \"required_tests\": [\n      \"measurement_exact_laws::kochen_specker_rays_preserve_field_pair_and_context_constraints\"\n    ]\n  },\n  \"negative_tests\": [\n    \"measurement_exact_laws::kochen_specker_rays_preserve_field_pair_and_context_constraints\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Every context is a genuine full orthogonal frame; All orthogonal pair exclusions remain independent of context exact-one constraints; Public ray and pair mutations are revalidated; Primitive Pythagorean rational rays have a unique odd-coordinate colour.\",\n    \"non_role\": [\n      \"Finite KS uncolourability is distinct from Bell locality and no dense/infinite ray theorem is claimed\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
