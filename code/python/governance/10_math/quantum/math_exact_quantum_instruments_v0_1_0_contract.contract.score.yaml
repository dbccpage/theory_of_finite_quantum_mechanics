      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:exact_quantum_instruments:v0.1.0\",\n  \"title\": \"Exact full-operator POVMs and measurement updates\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"exact_quantum_instruments\",\n    \"symbol\": \"exact_quantum_instruments\",\n    \"ascii_symbol\": \"exact_quantum_instruments\",\n    \"notation\": \"Exact full-operator POVMs and measurement updates\",\n    \"domain\": [\n      \"Bounded finite PSD effects, exact completeness, checked rational spectral declarations or supplied PSD square roots\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::instruments; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Outcome probabilities are exact traces of effects against states\",\n    \"Zero probability has no normalized conditional state\",\n    \"Nonselective sum and classical-register channel are CPTP\",\n    \"Projective outcomes are repeatable; joint projectors require commuting effects\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"instruments\",\n    \"symbols\": [\n      \"ExactPovm::try_new\",\n      \"ExactPovm::luders\",\n      \"ExactInstrument::try_new\",\n      \"ExactInstrument::outcome\",\n      \"ExactInstrument::classical_register_channel\",\n      \"ExactProjectiveMeasurement::from_observable\",\n      \"ExactProjectiveMeasurement::joint\"\n    ],\n    \"required_tests\": [\n      \"states_channels_exact_tests::spectral_projective_measurements_are_repeatable_and_refuse_noncommuting_joint\"\n    ]\n  },\n  \"negative_tests\": [\n    \"states_channels_exact_tests::spectral_projective_measurements_are_repeatable_and_refuse_noncommuting_joint\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Outcome probabilities are exact traces of effects against states; Zero probability has no normalized conditional state; Nonselective sum and classical-register channel are CPTP; Projective outcomes are repeatable; joint projectors require commuting effects.\",\n    \"non_role\": [\n      \"No Lüders root is fabricated when absent from the coefficient field\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
