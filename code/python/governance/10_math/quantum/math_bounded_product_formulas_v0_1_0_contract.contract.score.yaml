      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:bounded_product_formulas:v0.1.0\",\n  \"title\": \"Computed product-formula bounds\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"bounded_product_formulas\",\n    \"symbol\": \"bounded_product_formulas\",\n    \"ascii_symbol\": \"bounded_product_formulas\",\n    \"notation\": \"Computed product-formula bounds\",\n    \"domain\": [\n      \"Equal Hermitian matrices of dimension<=64, exact rational time and positive step count; separate conditional norm-input functions require positive BigInt steps and nonnegative BigRational norm hypotheses. Interaction cones use an admitted directed graph with<=4096 vertices and<=8192 undirected bonds plus caller-declared nonnegative velocity.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::continuous_time_locality_limit; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Commutator and double commutators are computed on supplied operators.\",\n    \"The entrywise absolute-value bound dominates operator norm.\",\n    \"First-order error scales as t^2/(2n); Strang error as |t|^3/n^2 with weights1/24 and1/12.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"continuous_time_locality_limit\",\n    \"symbols\": [\n      \"product_formula_bounds\",\n      \"ProductFormulaCertificate\",\n      \"DeclaredInteractionGraph\",\n      \"trotter_first_order_error_bound\",\n      \"trotter_second_order_error_bound\"\n    ],\n    \"required_tests\": [\n      \"product_formula_bounds_use_actual_noncommutation_and_step_count\",\n      \"interaction_cones_use_actual_graph_distance_and_typed_bounds\"\n    ]\n  },\n  \"negative_tests\": [\n    \"product_formula_bounds_use_actual_noncommutation_and_step_count\",\n    \"interaction_cones_use_actual_graph_distance_and_typed_bounds\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Commutator and double commutators are computed on supplied operators.; The entrywise absolute-value bound dominates operator norm.; First-order error scales as t^2/(2n); Strang error as |t|^3/n^2 with weights1/24 and1/12..\",\n    \"non_role\": [\n      \"Finite physical declarations do not confer program admission or certify an undeclared continuum limit.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
