      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_feynman_diagram:v0.1.0\",\n  \"title\": \"Exact Wick Contractions and Diagram Symmetry Factors\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_feynman_diagram\",\n    \"symbol\": \"finite_feynman_diagram\",\n    \"ascii_symbol\": \"finite_feynman_diagram\",\n    \"notation\": \"Exact Wick Contractions and Diagram Symmetry Factors\",\n    \"domain\": [\n      \"At most twenty Gaussian legs for exact pairing counts, with at most 65536 materialized pairings.\",\n      \"Finite half-edge pairings, at most eight bounded-valence vertices, and phi4 vacuum order at most three.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::feynman_diagram; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The exact pairing count is the odd double factorial for even leg counts.\",\n    \"Every half-edge occurs once, and pairing incidence determines loops, components and connectivity.\",\n    \"Symmetry factors use exact vertex automorphisms, parallel-edge factorials and loop reversal factors.\",\n    \"Phi4 vacuum sums through order three are 1/8,35/384,385/3072; connected sums are 1/8,1/12,11/96.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"feynman_diagram\",\n    \"symbols\": [\n      \"FeynmanDiagram\",\n      \"wick_pairing_count\",\n      \"wick_pairings\",\n      \"phi4_vacuum_diagrams\"\n    ],\n    \"required_tests\": [\n      \"wick_pairings_count_is_the_double_factorial\",\n      \"vacuum_symmetry_factors_and_connected_sums_match_phi4_coefficients\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Odd leg counts, reused or missing half-edges, malformed valences and materialization/permutation budget excess are refused.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The exact pairing count is the odd double factorial for even leg counts.; Every half-edge occurs once, and pairing incidence determines loops, components and connectivity.; Symmetry factors use exact vertex automorphisms, parallel-edge factorials and loop reversal factors.; Phi4 vacuum sums through order three are 1/8,35/384,385/3072; connected sums are 1/8,1/12,11/96..\",\n    \"non_role\": [\n      \"No continuum renormalization or momentum-space amplitude claim.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
