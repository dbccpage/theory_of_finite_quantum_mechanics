      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:stabilizer_code_distance:v0.1.0\",\n  \"title\": \"Exact Stabilizer Codes, States and Coding Bounds\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"stabilizer_code_distance\",\n    \"symbol\": \"stabilizer_code_distance\",\n    \"ascii_symbol\": \"stabilizer_code_distance\",\n    \"notation\": \"Exact Stabilizer Codes, States and Coding Bounds\",\n    \"domain\": [\n      \"Finite symplectic F2 Pauli data, with separate phase-free code and signed pure-state carriers.\",\n      \"Declared finite weight-search and enumeration bounds.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::stabilizer_code_distance; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Code dimension uses the independent stabilizer rank; logical pairs have the canonical symplectic form.\",\n    \"Minimum-weight logical operators exclude stabilizers and determine the reported exact distance.\",\n    \"A signed pure stabilizer state rejects minus identity and has subset entropy rank(restriction_A(G))-|A|, equivalently |A|-rank(the stabilizers wholly supported in A).\",\n    \"Stabilizer and normalizer enumerators obey the quantum MacWilliams transform; Singleton and conditional nondegenerate Hamming bounds are exact.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"stabilizer_code_distance\",\n    \"symbols\": [\n      \"StabilizerCode\",\n      \"SignedStabilizerState\"\n    ],\n    \"required_tests\": [\n      \"shor_code_is_9_1_3\",\n      \"five_qubit_code_is_5_1_3\",\n      \"dependent_generators_use_the_rank\",\n      \"stabilizers_are_excluded_from_the_search\",\n      \"refusals_are_typed\",\n      \"correction_radius_needs_a_product_closed_alphabet\",\n      \"large_weight_classes_are_refused\",\n      \"signed_stabilizer_states_refuse_minus_identity_and_compute_bell_entropy\",\n      \"five_qubit_weight_enumerators_obey_macwilliams_and_coding_bounds\",\n      \"macwilliams_recurrence_matches_full_pauli_weight_counts_beyond_small_code_search\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Noncommuting generators, invalid Pauli alphabets, inconsistent signed phases and exhausted weight searches are refused.\",\n    \"A phase-free code is not rejected solely for lacking a signed minus-identity test.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Code dimension uses the independent stabilizer rank; logical pairs have the canonical symplectic form.; Minimum-weight logical operators exclude stabilizers and determine the reported exact distance.; A signed pure stabilizer state rejects minus identity and has subset entropy rank(restriction_A(G))-|A|, equivalently |A|-rank(the stabilizers wholly supported in A).; Stabilizer and normalizer enumerators obey the quantum MacWilliams transform; Singleton and conditional nondegenerate Hamming bounds are exact..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"No extension beyond the declared finite carrier and exact computation budgets.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
