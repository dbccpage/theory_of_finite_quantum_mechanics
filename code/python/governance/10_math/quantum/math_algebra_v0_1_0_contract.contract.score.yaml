      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:algebra:v0.1.0\",\n  \"title\": \"Algebra Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"algebra\",\n    \"symbol\": \"(A, +, mu, R) or (A, +, *, 1_A, R)\",\n    \"ascii_symbol\": \"algebra\",\n    \"notation\": \"(A, +, mu, R) or (A, +, *, 1_A, R)\",\n    \"domain\": [\n      \"underlying_module: r_module\",\n      \"base_ring: commutative_ring_R\",\n      \"multiplication: bilinear_map A x A -> A\",\n      \"unit: optional_element_1_A\"\n    ],\n    \"codomain\": {\n      \"description\": \"An R-module A with a bilinear multiplication mu: A x A -> A, optional unit element, and the underlying ring R of scalars.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"A satisfies R-module axioms (abelian group + scalar multiplication)\",\n      \"Multiplication is R-bilinear\",\n      \"Multiplication is associative (if declared associative)\",\n      \"Unit element satisfies mu(1,a) = mu(a,1) = a (if declared unital)\",\n      \"Artifact hash is deterministically computed from structural data\"\n    ]\n  },\n  \"laws\": [\n    \"A is an R-module under addition and scalar multiplication\",\n    \"mu(ra + sb, c) = r*mu(a,c) + s*mu(b,c) and mu(a, rb + sc) = r*mu(a,b) + s*mu(a,c)\",\n    \"mu(mu(a,b), c) = mu(a, mu(b,c)) for all a, b, c in A\",\n    \"mu(1_A, a) = mu(a, 1_A) = a for all a in A (if unital)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"All algebra operations from canonical structure tables\",\n      \"Rechecking must reproduce axiom_witness_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Multiplication that is not R-bilinear must be rejected\",\n    \"Declared associative but mu(mu(a,b),c) != mu(a,mu(b,c))\",\n    \"Declared unital but unit axiom fails\",\n    \"Underlying module axioms violated\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An algebra over a ring R is an R-module A equipped with an R-bilinear multiplication mu: A x A -> A. In the unital associative case, this multiplication is associative and has a unit element 1_A. Algebras unify ring theory and module theory, serving as the foundation for operator algebras, Lie algebras, Clifford algebras, and DG-algebras.\",\n    \"non_role\": [\n      \"Lie algebras (non-associative, separate contract)\",\n      \"DG-algebras (graded with differential, separate contract)\",\n      \"C*-algebras and operator algebras (topological extensions)\",\n      \"Coalgebras and bialgebras (dual structure, separate contract)\"\n    ]\n  },\n  \"wip\": [\n    \"Should commutative algebras be a separate contract or a FactEnvelope?\",\n    \"How to handle graded algebras (separate contract vs parametric extension)?\",\n    \"Should the algebra contract support non-associative algebras like Lie algebras?\",\n    \"Relationship to operad algebras and E_n-algebras?\",\n    \"Currently targets finite-dimensional associative unital algebras\",\n    \"Non-associative and non-unital variants need flags\",\n    \"Graded algebras, filtered algebras, and DG-algebras are separate contracts\",\n    \"Tensor algebra, symmetric algebra, exterior algebra are constructors on modules\"\n  ]\n}\n",
