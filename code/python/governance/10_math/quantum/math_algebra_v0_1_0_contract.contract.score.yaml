    "doctrine": {
      "summary": "An algebra over a ring R is an R-module A equipped with an R-bilinear multiplication mu: A x A -> A. In the unital associative case, this multiplication is associative and has a unit element 1_A. Algebras unify ring theory and module theory, serving as the foundation for operator algebras, Lie algebras, Clifford algebras, and DG-algebras.",
