      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_toric_code:v0.1.0\",\n  \"title\": \"Cellular Toric Codes and Topological Entropy\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_toric_code\",\n    \"symbol\": \"finite_toric_code\",\n    \"ascii_symbol\": \"finite_toric_code\",\n    \"notation\": \"Cellular Toric Codes and Topological Entropy\",\n    \"domain\": [\n      \"A periodic rectangular square lattice with both axes at least two and area at most 256.\",\n      \"Its exact F2 chain/cochain complex and pure ground-state stabilizers.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::toric_code; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Homology and cohomology supply dual logical bases with identity intersection pairing.\",\n    \"The CSS code has k=2, ground-state degeneracy four and distance min(rows,cols).\",\n    \"An electric loop enclosing one magnetic defect has phase minus one, and a loop enclosing none has phase plus one.\",\n    \"The declared contractible Kitaev-Preskill wedges of a pure toric ground state give topological entropy one bit.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"toric_code\",\n    \"symbols\": [\n      \"ToricCode\"\n    ],\n    \"required_tests\": [\n      \"toric_code_parameters_and_intersection_form_are_derived_from_homology\",\n      \"moving_e_around_an_m_and_away_from_it_have_opposite_phases\",\n      \"toric_code_kitaev_preskill_entropy_is_one_bit\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Malformed defect chains, invalid loops and lattice budget excess are refused.\",\n    \"Distance certification uses winding bounds with small exhaustive cross-checks.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Homology and cohomology supply dual logical bases with identity intersection pairing.; The CSS code has k=2, ground-state degeneracy four and distance min(rows,cols).; An electric loop enclosing one magnetic defect has phase minus one, and a loop enclosing none has phase plus one.; The declared contractible Kitaev-Preskill wedges of a pure toric ground state give topological entropy one bit..\",\n    \"non_role\": [\n      \"No PROVED, GlobalGreen, customer claim, or operational authority.\",\n      \"No extension beyond the declared finite carrier and exact computation budgets.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
