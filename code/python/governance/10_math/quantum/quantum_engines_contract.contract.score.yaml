      "raw_utf8": "{\n  \"name\": \"quantum_engines\",\n  \"description\": \"Diagnostic density engine boundaries (Phase 0.5 strictness)\",\n  \"modules\": [\n    {\n      \"name\": \"density_from_h1.rs\",\n      \"type\": \"functional_diagnostic\",\n      \"rules\": [\n        {\n          \"rule\": \"QM-D1\",\n          \"description\": \"Constructors are split. Raw L1 density is distinguished from L2 amplitude and phase-witness lifts.\"\n        },\n        {\n          \"rule\": \"QM-D2\",\n          \"description\": \"Diagnostic outputs explicitly forbid canonical authority and must never certify AuthorityEffect::Certified.\"\n        },\n        {\n          \"rule\": \"QM-D3\",\n          \"description\": \"Represents masses as raw_l1_mass rather than phi1 to avoid ambiguity with verified Phi1 certificates.\"\n        }\n      ]\n    },\n    {\n      \"name\": \"residual_density_bridge.rs\",\n      \"type\": \"functional_diagnostic\",\n      \"rules\": [\n        {\n          \"rule\": \"QM-D4\",\n          \"description\": \"Wraps H1 sector decomposition and attaches explicit AuthorityEffect::None.\"\n        },\n        {\n          \"rule\": \"QM-D5\",\n          \"description\": \"Does not rank, accept, reward, certify, or provide physical quantum authority.\"\n        },\n        {\n          \"rule\": \"QM-D6\",\n          \"description\": \"Branch ranking and candidate evaluation are purely stochastic diagnostics.\"\n        }\n      ]\n    },\n    {\n      \"name\": \"gomc_diagnostics.rs\",\n      \"type\": \"reporting\",\n      \"rules\": [\n        {\n          \"rule\": \"QM-D7\",\n          \"description\": \"Provides Monte Carlo summary heuristics over density distributions. Uses raw_l1_mass instead of phi1.\"\n        }\n      ]\n    },\n    {\n      \"name\": \"quantum_density_engine.rs\",\n      \"type\": \"facade\",\n      \"rules\": [\n        {\n          \"rule\": \"QM-D8\",\n          \"description\": \"Orchestrates diagnostic queries without leaking internal structures or asserting canonical rank bounds.\"\n        },\n        {\n          \"rule\": \"QM-D9\",\n          \"description\": \"Entropy and mixture queries return Results indicating potential rank/density violations.\"\n        }\n      ]\n    },\n    {\n      \"name\": \"reasoning_density.rs\",\n      \"type\": \"functional_diagnostic\",\n      \"rules\": [\n        {\n          \"rule\": \"QM-D10\",\n          \"description\": \"Exposes reasoning state covariances purely as heuristics.\"\n        }\n      ]\n    }\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "record": {
        "description": "Diagnostic density engine boundaries (Phase 0.5 strictness)",
        "modules": [
          {
            "name": "density_from_h1.rs",
