      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:finite_perturbation_theory:v0.1.0\",\n  \"title\": \"Exact Finite Perturbative Eigenseries\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"finite_perturbation_theory\",\n    \"symbol\": \"finite_perturbation_theory\",\n    \"ascii_symbol\": \"finite_perturbation_theory\",\n    \"notation\": \"Exact Finite Perturbative Eigenseries\",\n    \"domain\": [\n      \"A finite Gaussian-rational Hermitian perturbation around a declared diagonal rational Hamiltonian.\",\n      \"A simple selected unperturbed eigenvalue, dimension at most eight and series order at most sixty-four.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::perturbation_theory; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"Rayleigh-Schrodinger recursion uses intermediate normalization and exact spectral gaps.\",\n    \"Independent characteristic-polynomial substitution has zero coefficients through the retained order.\",\n    \"Hellmann-Feynman coefficients agree through the highest derivative order available.\",\n    \"The two-level energy coefficients are the signed Catalan sequence; a degenerate first-order block uses its actual compressed spectrum.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"perturbation_theory\",\n    \"symbols\": [\n      \"PerturbationTheory\"\n    ],\n    \"required_tests\": [\n      \"two_level_energy_series_is_the_signed_catalan_sequence\",\n      \"three_level_series_matches_the_independent_determinant_and_degenerate_block\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Degenerate simple-state input, unavailable rational compressed spectra, shape mismatch and order excess are refused.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"Rayleigh-Schrodinger recursion uses intermediate normalization and exact spectral gaps.; Independent characteristic-polynomial substitution has zero coefficients through the retained order.; Hellmann-Feynman coefficients agree through the highest derivative order available.; The two-level energy coefficients are the signed Catalan sequence; a degenerate first-order block uses its actual compressed spectrum..\",\n    \"non_role\": [\n      \"A truncated formal series is not an unconditional analytic convergence proof.\",\n      \"The Gershgorin radius is sufficient and conservative.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
