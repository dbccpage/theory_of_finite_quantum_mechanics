      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:experience_memory_bridge:v1.0.0\",\n  \"title\": \"Redacted Experience Memory Bridge\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"ExperienceMemoryBridge\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:artifact_ref:v1.0.0\",\n        \"urn:omega:oeos:database_adapter:v1.0.0\",\n        \"urn:omega:oeos:telemetry_sink:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"EMB-INV-001\",\n          \"statement\": \"Only verified sealed governed receipts may produce redacted typed experience projections.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"EMB-INV-002\",\n          \"statement\": \"Disposable indexes are deterministically reproducible from canonical receipts and never become evidence authorities.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"EMB-INV-003\",\n          \"statement\": \"Retrieved material remains untrusted context and grants no tool, policy, license, or execution authority.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"MEMORY_INDEX_REFUSED\",\n        \"MEMORY_RECEIPT_REFUSED\",\n        \"MEMORY_REDACTION_REFUSED\",\n        \"MEMORY_RETRIEVAL_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"sealed_governed_receipt\",\n        \"type\": \"urn:omega:oeos:type:harness_run_receipt:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"memory_index_receipt\",\n        \"type\": \"urn:omega:oeos:type:memory_index_receipt:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"MEMORY_INDEX_REFUSED\",\n      \"MEMORY_RECEIPT_REFUSED\",\n      \"MEMORY_REDACTION_REFUSED\",\n      \"MEMORY_RETRIEVAL_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"local_redacted_disposable_index\",\n        \"requirements\": [\n          \"canonical_receipt_replay\",\n          \"deterministic_lexical_and_graph_retrieval\",\n          \"raw_artifact_exclusion\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares an OEOS adapter from canonical DAG receipts to a disposable redacted retrieval index.\",\n    \"non_role\": [\n      \"canonical_execution_evidence\",\n      \"insight_or_skill_admission\",\n      \"vector_memory_authority\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"retrieval_rank_does_not_establish_truth_or_authority\"\n    ],\n    \"invariants\": [\n      \"raw_prompts_responses_credentials_and_file_contents_are_excluded\",\n      \"source_and_redaction_profile_digests_bind_every_hit\"\n    ],\n    \"allowed_operations\": [\n      \"ingest_verified_redacted_projection\",\n      \"rebuild_disposable_index\",\n      \"retrieve_bounded_untrusted_context\"\n    ],\n    \"forbidden_operations\": [\n      \"ingest_unsealed_or_corrupt_receipt\",\n      \"store_raw_worker_artifacts_in_index\",\n      \"self_admit_model_distillation\"\n    ]\n  }\n}\n",
