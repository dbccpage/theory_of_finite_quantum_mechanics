      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:solver_arena_policy_bridge:v1.0.0\",\n  \"title\": \"Solver Arena Policy Bridge\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"SolverArenaPolicyBridge\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:experience_memory_bridge:v1.0.0\",\n        \"urn:omega:oeos:worker_host:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"SAP-INV-001\",\n          \"statement\": \"Every competitor and corpus case binds exact implementation, lineage, route, budget, memory, and anti-skill digests.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"SAP-INV-002\",\n          \"statement\": \"Holdout scoring uses independent deterministic tests and mutation-sensitive gates rather than an LLM judge.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"SAP-INV-003\",\n          \"statement\": \"Arena output remains a proposal until a human admits one exact scoped and expiring policy digest.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"ARENA_CORPUS_REFUSED\",\n        \"ARENA_EVIDENCE_REFUSED\",\n        \"ARENA_POLICY_REFUSED\",\n        \"ARENA_TRIAL_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"frozen_arena_trial\",\n        \"type\": \"urn:omega:oeos:type:frozen_arena_trial:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"routing_policy_proposal\",\n        \"type\": \"urn:omega:oeos:type:routing_policy_proposal:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"ARENA_CORPUS_REFUSED\",\n      \"ARENA_EVIDENCE_REFUSED\",\n      \"ARENA_POLICY_REFUSED\",\n      \"ARENA_TRIAL_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"local_frozen_solver_arena\",\n        \"requirements\": [\n          \"lineage_disjoint_holdout_manifest\",\n          \"independent_replayable_scorer\",\n          \"exact_human_policy_admission\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares the OEOS host bridge into AG Arena trials and exact routing-policy proposals without owning evaluation or admission semantics.\",\n    \"non_role\": [\n      \"arena_evaluation_authority\",\n      \"autonomous_policy_promoter\",\n      \"online_learning_controller\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"a_pareto_scorecard_does_not_admit_a_runtime_policy\"\n    ],\n    \"invariants\": [\n      \"holdout_cases_never_enter_memory_or_training_projection\",\n      \"proposed_routes_cannot_widen_eligibility\"\n    ],\n    \"allowed_operations\": [\n      \"dispatch_isolated_arena_trial\",\n      \"record_independent_trial_receipt\",\n      \"emit_exact_policy_proposal\"\n    ],\n    \"forbidden_operations\": [\n      \"self_admit_policy_or_candidate\",\n      \"use_llm_judgment_as_success_oracle\",\n      \"update_runtime_policy_online\"\n    ]\n  }\n}\n",
