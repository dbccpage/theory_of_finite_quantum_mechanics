      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:telemetry_sink:v1.0.0\",\n  \"title\": \"Non-Authoritative Telemetry Sink\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"TelemetrySink\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": [\n        {\n          \"id\": \"TLM-INV-001\",\n          \"statement\": \"Telemetry buffers, field sizes, and export work are bounded by a declared profile.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"TLM-INV-002\",\n          \"statement\": \"Telemetry failure is non-authoritative and does not change mathematical, evaluator, licensing, or Engine outcomes.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"TLM-INV-003\",\n          \"statement\": \"Redaction and payload-exclusion policies are explicit and independently tested.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"TELEMETRY_BOUNDS_REFUSED\",\n        \"TELEMETRY_EXPORT_REFUSED\",\n        \"TELEMETRY_REDACTION_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"bounded_telemetry_event\",\n        \"type\": \"urn:omega:oeos:type:bounded_telemetry_event:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"telemetry_delivery_status\",\n        \"type\": \"urn:omega:oeos:type:telemetry_delivery_status:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"TELEMETRY_BOUNDS_REFUSED\",\n      \"TELEMETRY_EXPORT_REFUSED\",\n      \"TELEMETRY_REDACTION_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"bounded_non_blocking_buffer\",\n        \"requirements\": [\n          \"finite_ring_buffer\",\n          \"bounded_export_deadline\",\n          \"drop_policy_declared\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded operational observability separate from authoritative trace artifacts.\",\n    \"non_role\": [\n      \"authoritative_trace\",\n      \"decision_input\",\n      \"control_flow_policy\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"telemetry_is_not_claimed_zero_cost\",\n      \"telemetry_delivery_is_not_authoritative_evidence\"\n    ],\n    \"invariants\": [\n      \"emission_work_is_bounded_by_profile\",\n      \"dropped_telemetry_never_changes_run_semantics\"\n    ],\n    \"allowed_operations\": [\n      \"enqueue_bounded_telemetry\",\n      \"export_bounded_telemetry_batch\"\n    ],\n    \"forbidden_operations\": [\n      \"drive_control_flow_from_telemetry\",\n      \"store_unredacted_credentials\",\n      \"claim_telemetry_as_trace_receipt\"\n    ]\n  }\n}\n",
