      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:projector\",\n  \"name\": \"Projector Contract\",\n  \"version\": \"1.0.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"enforced\",\n  \"description\": \"A Projector is a deterministic, stateless, single-step typed Operator that maps a Carrier space onto a well-defined residual subspace or quotient space. It satisfies idempotency (P(P(x)) = P(x)) under a specific TiePolicy and is Phi-nonincreasing.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"operators::projector\",\n  \"governs\": [\n    \"operators/projectors/**\"\n  ],\n  \"does_not_govern\": [\n    \"omega_functional/**\",\n    \"omega_certifiers/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"PROJ-L1\",\n      \"description\": \"Projectors map from a carrier space onto a valid subspace with deterministic loss of information.\",\n      \"status\": \"active\",\n      \"provenance\": \"Projector OS Doctrine PROJ-L1\"\n    },\n    {\n      \"id\": \"PROJ-L2\",\n      \"description\": \"Projectors are idempotent: repeated application yields the identical residual representative.\",\n      \"status\": \"active\",\n      \"provenance\": \"Projector OS Doctrine PROJ-L2\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"phi_nonincrease_required\": true,\n    \"deterministic\": true,\n    \"stateless\": true,\n    \"idempotent\": true\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_file_contract:file:v1.0.0\"\n    ]\n  }\n}\n",
