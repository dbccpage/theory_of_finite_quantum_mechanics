      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:operator\",\n  \"name\": \"Root Operator Contract\",\n  \"version\": \"1.0.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"partial\",\n  \"enforcement_scope\": \"General operator doctrine. The finite Genesis report profile checks a detached partition-copy operation and its external rank witness; no claim is made that every legacy Operator obeys these rules.\",\n  \"description\": \"An Operator is a deterministic, stateless, single-step typed transformation over admitted BaseTypes. Every admitted Operator is Phi-nonincreasing over its admitted domain (Phi(output) <= Phi(input)), established externally by a witness or declared theorem. An Operator maps input to output through one structural transformation without search, iteration over alternatives, runtime orchestration, hidden carrier lift, authority minting, or canonical functional computation.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"operators::operator_identity\",\n  \"governs\": [\n    \"operators/**\",\n    \"operators/lambdas/**\",\n    \"operators/reducers/**\",\n    \"operators/transforms/**\"\n  ],\n  \"does_not_govern\": [\n    \"omega_functional/**\",\n    \"omega_homological/**\",\n    \"omega_lifts/**\",\n    \"omega_certifiers/**\",\n    \"omega_replay/**\",\n    \"omega_id_run/**\",\n    \"omega_pipeline/**\",\n    \"omega_engines/**\",\n    \"meta/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"OP-L0\",\n      \"description\": \"Operator purity model: deterministic stateless map with typed failure.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L0\"\n    },\n    {\n      \"id\": \"OP-L2\",\n      \"description\": \"Every admitted Operator is Phi-nonincreasing over its admitted domain: externally established Phi(output) <= Phi(input).\\n\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L2\"\n    },\n    {\n      \"id\": \"OP-L6\",\n      \"description\": \"Typed operator composition requires exact domain/codomain match or an explicit Adapter/MetaLift.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L6\"\n    },\n    {\n      \"id\": \"OP-L7\",\n      \"description\": \"Operators are single-step; repetition and sequencing belong to Pipeline/Runner orchestration. Each durable step is committed through Engine.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L7\"\n    },\n    {\n      \"id\": \"OP-L8\",\n      \"description\": \"Authority firewall: operator composition cannot mint authority.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L8\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"hidden_lift\": \"forbidden\",\n    \"search\": \"forbidden\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"side_effects\": \"forbidden\",\n    \"operator_calls_operator\": \"forbidden\",\n    \"phi_nonincrease_required\": true,\n    \"typed_failure_required\": true,\n    \"deterministic\": true,\n    \"stateless\": true,\n    \"single_step\": true\n  },\n  \"phi_law\": {\n    \"operator_may_compute_phi\": false,\n    \"phi_nonincrease_required\": true,\n    \"relation\": \"Phi(output) <= Phi(input)\",\n    \"witness_source\": \"canonical_functional_or_replay_layer\",\n    \"admission_requires\": [\n      \"declared theorem/certificate covering admitted domain\",\n      \"or external application witness\"\n    ]\n  },\n  \"allowed\": [\n    \"read immutable input\",\n    \"perform one deterministic structural transformation\",\n    \"return typed output\",\n    \"return typed failure\",\n    \"expose declared metadata\",\n    \"declare local non-authoritative estimates\"\n  ],\n  \"forbidden\": [\n    \"compute Φ₁\",\n    \"compute Γ₂\",\n    \"compute R_cl\",\n    \"compute Ξ\",\n    \"mint CertifiedAuthority\",\n    \"call terminalize\",\n    \"call authority_from_outcome_f13\",\n    \"call CertifiedAuthority::certify\",\n    \"perform search over candidates\",\n    \"rank alternatives\",\n    \"iterate until convergence\",\n    \"orchestrate multiple operators\",\n    \"mutate global state\",\n    \"perform IO\",\n    \"silently enlarge carrier\",\n    \"reinterpret carrier to make an operation executable\",\n    \"return opaque string-only failure\",\n    \"return None as failure\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "record": {
