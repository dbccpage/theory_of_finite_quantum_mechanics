      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:cas_store:v1.0.0\",\n  \"title\": \"Immutable Content-Addressed Store\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"ContentAddressableStorage\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\",\n        \"urn:omega:oeos:filesystem_adapter:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"CAS-INV-001\",\n          \"statement\": \"Stored objects are addressed only by SHA-256 of their exact stored bytes within one declared CAS root.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CAS-INV-002\",\n          \"statement\": \"The immutable CAS interface exposes put, get, has, and verify operations but no deletion operation.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CAS-INV-003\",\n          \"statement\": \"Reads independently recompute byte length and raw digest before returning an object.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CAS-INV-004\",\n          \"statement\": \"Refusal leaves the admitted CAS tree census byte-for-byte unchanged for the verified transaction profile.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"CAS_COLLISION_REFUSED\",\n        \"CAS_CORRUPTION_REFUSED\",\n        \"CAS_OBJECT_LIMIT_REFUSED\",\n        \"CAS_REDIRECT_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"exact_object_bytes\",\n        \"type\": \"urn:omega:oeos:type:exact_bytes:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"raw_sha256_artifact_ref\",\n        \"type\": \"urn:omega:oeos:type:artifact_ref:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"CAS_COLLISION_REFUSED\",\n      \"CAS_CORRUPTION_REFUSED\",\n      \"CAS_OBJECT_LIMIT_REFUSED\",\n      \"CAS_REDIRECT_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"windows_filesystem_cas\",\n        \"requirements\": [\n          \"exclusive_creation\",\n          \"static_reparse_point_refusal\",\n          \"verified_short_read_write_loops\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      },\n      {\n        \"profile\": \"posix_filesystem_cas\",\n        \"requirements\": [\n          \"exclusive_creation\",\n          \"static_symlink_refusal\",\n          \"verified_short_read_write_loops\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares a write-once exact-byte store scoped to one configured CAS root.\",\n    \"non_role\": [\n      \"payload_execution\",\n      \"artifact_semantic_interpretation\",\n      \"evidence_promotion\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"deduplication_is_not_claimed_beyond_one_declared_cas_root\",\n      \"static_redirect_checks_do_not_establish_general_toctou_safety\"\n    ],\n    \"invariants\": [\n      \"object_key_is_sha256_of_exact_stored_bytes\",\n      \"immutable_interface_has_no_delete_operation\"\n    ],\n    \"allowed_operations\": [\n      \"put_exact_bytes_exclusively\",\n      \"get_and_verify_exact_bytes\",\n      \"test_object_presence\"\n    ],\n    \"forbidden_operations\": [\n      \"delete_object\",\n      \"mutate_object_in_place\",\n      \"execute_stored_payload\"\n    ]\n  }\n}\n",
