      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:process_manager:v1.0.0\",\n  \"title\": \"Bounded Process Manager\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"ProcessManager\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\",\n        \"urn:omega:oeos:resource_quota:v1.0.0\",\n        \"urn:omega:oeos:sandbox:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"PROC-INV-001\",\n          \"statement\": \"Process launch binds an exact executable identity, argument vector, environment allowlist, workspace, quota, and sandbox profile.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"PROC-INV-002\",\n          \"statement\": \"Cancellation has a declared graceful deadline and a declared platform-specific hard-kill deadline.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"PROC-INV-003\",\n          \"statement\": \"Exit, stdout, stderr, timeout, and termination mode are captured without claiming deterministic process internals.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"PROC-INV-004\",\n          \"statement\": \"Cleanup failures and orphaned process handles produce typed refusals.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"PROCESS_CANCELLATION_REFUSED\",\n        \"PROCESS_LAUNCH_REFUSED\",\n        \"PROCESS_OUTPUT_LIMIT_REFUSED\",\n        \"PROCESS_TIMEOUT_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"bounded_process_request\",\n        \"type\": \"urn:omega:oeos:type:bounded_process_request:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"process_exit_record\",\n        \"type\": \"urn:omega:oeos:type:process_exit_record:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"PROCESS_CANCELLATION_REFUSED\",\n      \"PROCESS_LAUNCH_REFUSED\",\n      \"PROCESS_OUTPUT_LIMIT_REFUSED\",\n      \"PROCESS_TIMEOUT_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"windows_process\",\n        \"requirements\": [\n          \"job_object_tree_termination\",\n          \"bounded_graceful_and_hard_kill_deadlines\",\n          \"checked_pipe_io\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      },\n      {\n        \"profile\": \"posix_process\",\n        \"requirements\": [\n          \"signal_sequence_declared\",\n          \"bounded_graceful_and_sigkill_deadlines\",\n          \"checked_pipe_io\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded subprocess supervision with platform-specific cancellation behavior.\",\n    \"non_role\": [\n      \"task_semantics\",\n      \"solver_evaluation\",\n      \"policy_judgment\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"cancellation_is_bounded_not_instantaneous\",\n      \"sigkill_is_not_a_cross_platform_operation\"\n    ],\n    \"invariants\": [\n      \"hard_kill_deadline_is_finite_and_declared\",\n      \"output_capture_is_bounded\"\n    ],\n    \"allowed_operations\": [\n      \"spawn_declared_subprocess\",\n      \"await_bounded_exit\",\n      \"request_then_force_platform_termination\"\n    ],\n    \"forbidden_operations\": [\n      \"dynamic_executable_injection\",\n      \"unbounded_output_capture\",\n      \"report_timeout_as_success\"\n    ]\n  }\n}\n",
