      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:database_adapter:v1.0.0\",\n  \"title\": \"Database Host Adapter\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"DatabaseAdapter\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"DB-INV-001\",\n          \"statement\": \"Database operations require exact read or write host permissions scoped to a named resource.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"DB-INV-002\",\n          \"statement\": \"Parameter binding, transaction, isolation, timeout, and connection ceilings are explicit per adapter profile.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"DB-INV-003\",\n          \"statement\": \"A failed write transaction rolls back or returns a typed refusal without claiming universal cross-database atomicity.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"DATABASE_CAPABILITY_REFUSED\",\n        \"DATABASE_QUERY_REFUSED\",\n        \"DATABASE_TIMEOUT_REFUSED\",\n        \"DATABASE_TRANSACTION_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"typed_database_request\",\n        \"type\": \"urn:omega:oeos:type:typed_database_request:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"bounded_database_result\",\n        \"type\": \"urn:omega:oeos:type:bounded_database_result:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"DATABASE_CAPABILITY_REFUSED\",\n      \"DATABASE_QUERY_REFUSED\",\n      \"DATABASE_TIMEOUT_REFUSED\",\n      \"DATABASE_TRANSACTION_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"transactional_database\",\n        \"requirements\": [\n          \"parameterized_queries\",\n          \"bounded_connection_pool\",\n          \"declared_isolation_level\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded database effects through typed requests and named transactional profiles.\",\n    \"non_role\": [\n      \"domain_schema_meaning\",\n      \"query_result_truth\",\n      \"migration_authority\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"no_cross_database_atomicity_or_isolation_equivalence_is_claimed\"\n    ],\n    \"invariants\": [\n      \"query_text_and_parameters_are_separate\",\n      \"connection_and_result_counts_are_bounded\"\n    ],\n    \"allowed_operations\": [\n      \"execute_typed_read\",\n      \"execute_scoped_transaction\",\n      \"rollback_failed_transaction\"\n    ],\n    \"forbidden_operations\": [\n      \"interpolate_untrusted_query_text\",\n      \"bypass_declared_transaction_profile\",\n      \"promote_query_result_to_fact\"\n    ]\n  }\n}\n",
