      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:network_adapter:v1.0.0\",\n  \"title\": \"Network Host Adapter\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"NetworkAdapter\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"NET-INV-001\",\n          \"statement\": \"Network egress requires an exact host capability naming the destination and operation.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"NET-INV-002\",\n          \"statement\": \"Connect, read, write, response-size, retry, and total wall-clock ceilings are explicit.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"NET-INV-003\",\n          \"statement\": \"TLS verification and credential-redaction requirements are bound to the declared transport profile.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"NETWORK_DESTINATION_REFUSED\",\n        \"NETWORK_RESPONSE_LIMIT_REFUSED\",\n        \"NETWORK_TIMEOUT_REFUSED\",\n        \"NETWORK_TLS_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"bounded_network_request\",\n        \"type\": \"urn:omega:oeos:type:bounded_network_request:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"bounded_network_response\",\n        \"type\": \"urn:omega:oeos:type:bounded_network_response:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"NETWORK_DESTINATION_REFUSED\",\n      \"NETWORK_RESPONSE_LIMIT_REFUSED\",\n      \"NETWORK_TIMEOUT_REFUSED\",\n      \"NETWORK_TLS_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"tls_client\",\n        \"requirements\": [\n          \"destination_allowlist\",\n          \"strict_certificate_validation\",\n          \"bounded_response_body\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded network effects below a destination-scoped host port.\",\n    \"non_role\": [\n      \"remote_content_trust\",\n      \"provider_semantics\",\n      \"research_admission\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"successful_transport_does_not_certify_remote_content\"\n    ],\n    \"invariants\": [\n      \"retries_remain_inside_total_request_budget\",\n      \"response_bytes_are_bounded_before_materialization\"\n    ],\n    \"allowed_operations\": [\n      \"execute_allowlisted_http_request\",\n      \"execute_allowlisted_rpc_request\"\n    ],\n    \"forbidden_operations\": [\n      \"unrestricted_network_probe\",\n      \"disable_tls_verification_silently\",\n      \"expose_unredacted_credentials\"\n    ]\n  }\n}\n",
