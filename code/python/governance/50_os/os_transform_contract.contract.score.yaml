    "status": "active_doctrine",
    "enforcement_status": "enforced",
    "description": "A TransformOp is a deterministic, stateless, unary, same-carrier structural mapping over admitted BaseType/Obstruction state. It maps S -> S by rearranging, relabeling, transporting, reindexing, or representation-shifting structure while preserving declared invariants. As an admitted Operator under os:operator, every Transform satisfies the inherited Phi non-increase law: Phi(T(s)) <= Phi(s) (or Phi(T(s)) = Phi(s) for structure-preserving relabelings). A Transform does not compute canonical functionals, search, rank, lift, repair, terminalize, certify, authorize, orchestrate, or mutate runtime state.\n",
    "layer": "OS",
    "module_path": "operators::transform",
    "governs": [
      "operators/transforms/**",
      "operators/transform/**"
    ],
    "does_not_govern": [
      "constructors/**",
      "generators/**",
      "operators/lambdas/**",
      "operators/reducers/**",
      "omega_functional/**",
      "omega_homological/**",
      "omega_lifts/**",
      "omega_certifiers/**",
      "omega_replay/**",
      "omega_id_run/**",
      "omega_pipeline/**",
      "omega_engines/**",
      "meta/**"
    ],
    "claims": [
      {
        "id": "OP-L0-TRANSFORM",
        "description": "Transform is structure-preserving and Phi-nonincreasing over its admitted domain.",
        "status": "active",
        "provenance": "Operator OS Doctrine"
      },
      {
        "id": "OP-L2-TRANSFORM",
        "description": "Transform inherited Phi non-increase theorem: externally established Phi(T(s)) <= Phi(s).",
        "status": "active",
        "provenance": "Operator OS Doctrine OP-L2"
      },
      {
        "id": "TRANSFORM-SAME-CARRIER",
        "description": "Transform preserves carrier family, carrier rank, carrier universe, and admissible execution geometry.",
        "status": "active",
        "provenance": "Operator OS Doctrine"
      },
      {
        "id": "OP-L7",
        "description": "Operators are single-step; repeated execution belongs to Pipeline/Runner trace.",
        "status": "active",
        "provenance": "Operator OS Doctrine OP-L7"
      }
    ],
    "rules": {
