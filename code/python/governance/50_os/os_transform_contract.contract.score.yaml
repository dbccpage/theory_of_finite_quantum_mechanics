        "description": "A TransformOp is a deterministic, stateless, unary, same-carrier structural mapping over admitted BaseType/Obstruction state. It maps S -> S by rearranging, relabeling, transporting, reindexing, or representation-shifting structure while preserving declared invariants. As an admitted Operator under os:operator, every Transform satisfies the inherited Phi non-increase law: Phi(T(s)) <= Phi(s) (or Phi(T(s)) = Phi(s) for structure-preserving relabelings). A Transform does not compute canonical functionals, search, rank, lift, repair, terminalize, certify, authorize, orchestrate, or mutate runtime state.\n",
