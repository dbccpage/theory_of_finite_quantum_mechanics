      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:capability_guard:v1.0.0\",\n  \"title\": \"Host Capability Guard\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"CapabilityGuard\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": [\n        {\n          \"id\": \"CAP-INV-001\",\n          \"statement\": \"Host capabilities are integrity-bound under an explicitly declared key-custody profile.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CAP-INV-002\",\n          \"statement\": \"Delegation can only attenuate permissions, resource scope, quota, and lifetime.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CAP-INV-003\",\n          \"statement\": \"A host capability has no parser, coercion, or constructor path into a kernel ActionLicense.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"CAPABILITY_EXPIRED\",\n        \"CAPABILITY_INTEGRITY_REFUSED\",\n        \"CAPABILITY_SCOPE_REFUSED\",\n        \"CAPABILITY_WIDENING_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"capability_request\",\n        \"type\": \"urn:omega:oeos:type:host_capability_request:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"host_capability\",\n        \"type\": \"urn:omega:oeos:type:host_capability:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"CAPABILITY_EXPIRED\",\n      \"CAPABILITY_INTEGRITY_REFUSED\",\n      \"CAPABILITY_SCOPE_REFUSED\",\n      \"CAPABILITY_WIDENING_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"process_local_hmac_reference\",\n        \"requirements\": [\n          \"declared_key_custody_lifetime\",\n          \"constant_time_integrity_comparison\",\n          \"nonce_replay_tracking\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares attenuation-only host permissions for enumerated machine effects under a named integrity profile.\",\n    \"non_role\": [\n      \"action_license_issuance\",\n      \"evaluator_decision\",\n      \"semantic_authorization\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"integrity_binding_is_not_claimed_unforgeable\"\n    ],\n    \"invariants\": [\n      \"child_permissions_are_a_subset_of_parent_permissions\",\n      \"capability_and_action_license_are_disjoint_types\"\n    ],\n    \"allowed_operations\": [\n      \"issue_process_local_root_capability\",\n      \"attenuate_host_capability\",\n      \"verify_host_capability_integrity\"\n    ],\n    \"forbidden_operations\": [\n      \"widen_permissions\",\n      \"convert_to_action_license\"\n    ]\n  }\n}\n",
