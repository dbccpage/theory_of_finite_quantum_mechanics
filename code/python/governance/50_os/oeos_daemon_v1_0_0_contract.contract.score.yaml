      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:daemon:v1.0.0\",\n  \"title\": \"Bounded Daemon Host\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"DaemonHost\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\",\n        \"urn:omega:oeos:composition_root:v1.0.0\",\n        \"urn:omega:oeos:telemetry_sink:v1.0.0\",\n        \"urn:omega:oeos:worker_host:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"DMN-INV-001\",\n          \"statement\": \"A daemon binds only declared listeners after the composition root is complete and frozen.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"DMN-INV-002\",\n          \"statement\": \"Startup, drain, cancellation, hard-stop, and cleanup deadlines are finite and platform-specific.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"DMN-INV-003\",\n          \"statement\": \"Health and telemetry surfaces are bounded operational signals and never authoritative evidence.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"DAEMON_BIND_REFUSED\",\n        \"DAEMON_SHUTDOWN_REFUSED\",\n        \"DAEMON_STARTUP_REFUSED\",\n        \"DAEMON_WORKER_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"frozen_daemon_configuration\",\n        \"type\": \"urn:omega:oeos:type:frozen_daemon_configuration:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"daemon_lifecycle_result\",\n        \"type\": \"urn:omega:oeos:type:daemon_lifecycle_result:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"DAEMON_BIND_REFUSED\",\n      \"DAEMON_SHUTDOWN_REFUSED\",\n      \"DAEMON_STARTUP_REFUSED\",\n      \"DAEMON_WORKER_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"portable_service_host\",\n        \"requirements\": [\n          \"bounded_listener_count\",\n          \"declared_signal_or_service_control_mapping\",\n          \"bounded_shutdown_sequence\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares a bounded long-running host around a frozen composition root.\",\n    \"non_role\": [\n      \"background_solver_semantics\",\n      \"health_based_authority\",\n      \"worker_result_evaluation\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"liveness_does_not_certify_semantic_correctness\"\n    ],\n    \"invariants\": [\n      \"listener_and_worker_counts_are_bounded\",\n      \"shutdown_deadlines_are_finite\"\n    ],\n    \"allowed_operations\": [\n      \"start_frozen_service_host\",\n      \"report_bounded_liveness\",\n      \"drain_and_stop_service_host\"\n    ],\n    \"forbidden_operations\": [\n      \"dynamic_listener_registration\",\n      \"unbounded_session_accumulation\",\n      \"promote_health_status_to_evidence\"\n    ]\n  }\n}\n",
