      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:meta\",\n  \"name\": \"Meta Contract\",\n  \"version\": \"1.1.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"partially_enforced\",\n  \"description\": \"Meta is the stateless deterministic higher-order planner that consumes externally produced measurements (M) and judgments (J) plus the admitted operator ecology (O) and trace/fixed-point history (H), and returns a detached lawful next-morphism selection (OperatorSelection), an explicit regime-lift proposal (MetaLiftPlan), or typed no-continuation (NoLawfulContinuation). Formally, M: (S, J, O, H) -> Plan(O) | MetaLiftPlan | Refusal. It acts as a higher-order 2-morphism (O_i ==> O_j or C_n ==> MetaLiftPlan(C_{n+1})) by applying declared higher-order MetaRules over admitted operators. It never measures, computes canonical functionals, evaluates evidence, executes operators, mutates carrier state, licenses, certifies, or terminalizes.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"meta\",\n  \"governs\": [\n    \"meta/**\",\n    \"operator/meta/**\",\n    \"omega_*/*meta*.rs\"\n  ],\n  \"does_not_govern\": [\n    \"operator/lambda/**\",\n    \"operator/reducer/**\",\n    \"operator/transform/**\",\n    \"generator/**\",\n    \"constructor/**\",\n    \"functional/**\",\n    \"homological/**\",\n    \"lift/**\",\n    \"certifier/**\",\n    \"replay/**\",\n    \"id_run/**\",\n    \"pipeline/**\",\n    \"engines/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"OP-L0-META\",\n      \"description\": \"Meta is a deterministic, read-only higher-order planning layer over admitted operator descriptors, immutable measurements, evaluation judgments, traces, and carrier descriptions. It selects a lawful next Operator, proposes an explicit MetaLiftPlan, or returns typed no-continuation. It does not execute, measure, evaluate evidence, or orchestrate runtime control flow.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"META-NO-EXECUTION\",\n      \"description\": \"Meta emits judgments or plans; it does not execute operators, engines, repairs, or lifts.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"META-LIFT-PLAN-ONLY\",\n      \"description\": \"Meta may propose a detached MetaLiftPlan, but carrier extension is executed only by the lift subsystem and committed by the engine.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"META-NO-AUTH\",\n      \"description\": \"Meta judgments, rewrites, plans, and lift proposals cannot mint authority.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"META-SELECTION-ONLY\",\n      \"description\": \"Meta selects an OperatorKey from admitted operators based on declared MetaRules and existing evidence; it does not instantiate or execute operators.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"certify\": \"forbidden\",\n    \"execute\": \"forbidden\",\n    \"carrier_mutation\": \"forbidden\",\n    \"lift_execution\": \"forbidden\",\n    \"engine_loop\": \"forbidden\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"search\": \"forbidden_except_declared_finite_structural_classification\",\n    \"deterministic\": true,\n    \"total_over_admitted_domain\": true,\n    \"stateless\": true,\n    \"read_only\": true,\n    \"typed_failure_required\": true,\n    \"detached_plan_output_required\": true\n  },\n  \"allowed\": [\n    \"read admitted operator descriptors\",\n    \"read immutable MeasurementRefs\",\n    \"read immutable EvaluationResults\",\n    \"read externally checked functional evidence\",\n    \"read immutable traces and attempt history\",\n    \"read declared carrier descriptions\",\n    \"apply declared deterministic MetaRules over finite admitted operator set\",\n    \"classify structural admissibility\",\n    \"classify typed composability\",\n    \"classify rewrite admissibility\",\n    \"emit OperatorSelection\",\n    \"emit CompositionPlan\",\n    \"emit RewritePlan\",\n    \"emit detached MetaLiftPlan\",\n    \"emit NoLawfulContinuation\",\n    \"emit typed refusal\",\n    \"emit structural rejection reason\",\n    \"emit TraceSignal\",\n    \"attach non-authoritative provenance\"\n  ],\n  \"forbidden\": [\n    \"compute Φ₁\",\n    \"compute Γ₂\",\n    \"compute R_cl\",\n    \"compute Ξ\",\n    \"call Phi1Functional\",\n    \"call Gamma2Functional\",\n    \"call XiFunctional\",\n    \"classify trichotomy\",\n    \"mint CertifiedAuthority\",\n    \"call CertifiedAuthority::certify\",\n    \"call authority_from_outcome_f13\",\n    \"call terminalize\",\n    \"emit AuthorityEffect::Authorize\",\n    \"execute operator\",\n    \"execute engine\",\n    \"apply lift\",\n    \"mutate carrier\",\n    \"mutate state\",\n    \"accept candidate as runtime state\",\n    \"rank by canonical functionals\",\n    \"run adaptive search\",\n    \"perform MCTS\",\n    \"invoke Phi repeatedly over operators\",\n    \"score candidates itself\",\n    \"learn a reward model\",\n    \"try operators until one works\",\n    \"optimize over the operator space\",\n    \"instantiate operator implementations\",\n    \"perform IO\",\n    \"return opaque string-only failure\",\n    \"return None as failure\"\n  ],\n  \"judgment_shape\": {\n    \"preferred\": \"Result<MetaResult, MetaFailure>\",\n    \"allowed_meta_result_variants\": [\n      \"OperatorSelection\",\n      \"CompositionPlan\",\n      \"RewritePlan\",\n      \"MetaLiftPlan\",\n      \"NoLawfulContinuation\",\n      \"MetaFailure\"\n    ],\n    \"subordinate_structural_judgments\": [\n      \"Admissible\",\n      \"Inadmissible\",\n      \"Composable\",\n      \"NotComposable\",\n      \"RewriteAllowed\",\n      \"RewriteRejected\",\n      \"TypedRefusal\"\n    ],\n    \"notes\": [\n      \"OperatorSelection returns an OperatorKey, not an Operator instance.\",\n      \"Admissible does not mean executed.\",\n      \"Composable does not mean composed.\",\n      \"MetaLiftPlan does not mean lift executed.\",\n      \"RewriteAllowed does not mean authority.\",\n      \"Meta plans control flow; Pipeline enacts control flow.\"\n    ]\n  },\n  \"operator_selection\": {\n    \"detached\": true,\n    \"authority_effect\": \"none\",\n    \"required_fields\": [\n      \"selection_id\",\n      \"operator_key\",\n      \"operator_descriptor_ref\",\n      \"state_ref\",\n      \"evaluation_refs\",\n      \"measurement_refs\",\n      \"precondition_refs\",\n      \"selection_rule_id\",\n      \"selection_basis_refs\",\n      \"authority_effect_none\"\n    ]\n  },\n  \"meta_lift_plan\": {\n    \"detached\": true,\n    \"semantic_execution_owner\": \"omega_lifts\",\n    \"durable_commit_owner\": \"Engine\",\n    \"required_fields\": [\n      \"source_ref\",\n      \"obstruction_ref\",\n      \"carrier_before_ref\",\n      \"proposed_carrier_after_descriptor\",\n      \"declared_lift_rule\",\n      \"rollback_requirements\",\n      \"validation_requirements\",\n      \"authority_effect_none\"\n    ],\n    \"must_not_include\": [\n      \"executed_state\",\n      \"CertifiedAuthority\",\n      \"terminal_status_authorized\"\n    ]\n  },\n  \"exhaustion_inputs\": {\n    \"stateless\": true,\n    \"allowed_references\": [\n      \"OperatorAttemptRef\",\n      \"OperatorFixedPointRef\",\n      \"OperatorFailureRef\",\n      \"EvaluationRef\",\n      \"MeasurementRef\"\n    ],\n    \"notes\": [\n      \"History is provided via immutable external Trace/Replay or RunState.\",\n      \"Meta maintains no mutable hidden state.\"\n    ]\n  },\n  \"trace_signal_rule\": {\n    \"emits_trace_signal\": true,\n    \"emits_trace_artifact\": false,\n    \"allowed_signals\": [\n      \"META_SELECTED_OPERATOR\",\n      \"META_PROPOSED_LIFT\",\n      \"META_REFUSED_CONTINUATION\",\n      \"META_CLASSIFIED_COMPOSITION\"\n    ],\n    \"notes\": [\n      \"TraceSignal is sent to Trace Coordinator.\",\n      \"MetaResult is sent to Pipeline/RunCoordinator for execution decision.\",\n      \"TraceSignal must not drive execution.\"\n    ]\n  },\n  \"failure_shape\": {\n    \"enum\": \"MetaFailure\",\n    \"required_variants\": [\n      \"OutsideAdmittedDomain\",\n      \"MalformedOperatorDescriptor\",\n      \"MalformedTrace\",\n      \"MalformedCandidate\",\n      \"CompositionTypeMismatch\",\n      \"CarrierChangeRequiresLiftPlan\",\n      \"LiftPlanPreconditionsMissing\",\n      \"RewriteRuleNotApplicable\",\n      \"NonFiniteInput\"\n    ]\n  },\n  \"composition_firewall\": {\n    \"closure_claim_status\": \"not_proven\",\n    \"generativity_claim_status\": \"not_proven\",\n    \"notes\": [\n      \"Meta may classify typed composition.\",\n      \"Meta does not prove operator closure.\",\n      \"Meta does not prove operators arise from obstruction management.\",\n      \"Meta does not execute generator tapes.\",\n      \"String-level composition is not executable composition.\"\n    ]\n  },\n  \"validator_requirements\": {\n    \"forbidden_substrings\": [\n      \"CertifiedAuthority\",\n      \"authority_from_outcome_f13\",\n      \"terminalize\",\n      \"mint_authority\",\n      \"Phi1Functional\",\n      \"Gamma2Functional\",\n      \"XiFunctional\",\n      \"classify_exact\",\n      \"ExactRepair\",\n      \"AuthorityEffect::Authorize\",\n      \"apply_lift\",\n      \"execute_lift\",\n      \"mutate_state\",\n      \"mutate_carrier\",\n      \"run_engine\",\n      \"while \",\n      \"loop \",\n      \"thread_rng\",\n      \"rand::\",\n      \"std::fs\",\n      \"File::\",\n      \"unwrap()\",\n      \"expect(\"\n    ],\n    \"required_patterns\": [\n      \"Result<\",\n      \"MetaFailure\"\n    ],\n    \"required_tests\": [\n      \"meta_is_deterministic\",\n      \"meta_is_read_only\",\n      \"meta_outputs_judgment_or_plan\",\n      \"meta_does_not_execute_plan\",\n      \"meta_lift_is_detached_plan_only\",\n      \"meta_does_not_compute_functionals\",\n      \"meta_does_not_mint_authority\",\n      \"meta_rejects_type_mismatch\"\n    ]\n  },\n  \"lean_obligations\": [\n    {\n      \"id\": \"META-L0\",\n      \"theorem\": \"Meta judgments are read-only classifications over admitted descriptors/traces/candidates.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L1\",\n      \"theorem\": \"MetaLiftPlan is detached and does not mutate carrier.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L2\",\n      \"theorem\": \"Meta composability judgment does not imply execution.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L3\",\n      \"theorem\": \"Meta rewrite admissibility does not imply authority.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L4\",\n      \"theorem\": \"Meta cannot mint authority.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L5\",\n      \"theorem\": \"Meta does not prove operator closure or generativity.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L6\",\n      \"theorem\": \"Meta operator selection does not imply operator execution.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L7\",\n      \"theorem\": \"Meta selection depends only on admitted immutable inputs and declared MetaRule.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L8\",\n      \"theorem\": \"Meta cannot compute or alter functional measurements used in selection.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L9\",\n      \"theorem\": \"Selected Operator must belong to the admitted operator ecology supplied to Meta.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L10\",\n      \"theorem\": \"Meta cannot select an Operator whose declared preconditions are unsatisfied.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L11\",\n      \"theorem\": \"If no same-regime Operator is lawfully selectable, Meta returns either MetaLiftPlan or NoLawfulContinuation; it may not synthesize a hidden Operator.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L12\",\n      \"theorem\": \"MetaLiftPlan does not imply carrier extension.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"META-L13\",\n      \"theorem\": \"Repeated identical MetaInput under identical MetaRule produces identical MetaResult.\",\n      \"status\": \"needed\"\n    }\n  ],\n  \"notes\": [\n    \"Meta is not an Engine.\",\n    \"Meta is not a Generator.\",\n    \"Meta is not a Certifier.\",\n    \"Meta is not a Functional.\",\n    \"Meta selects the next OperatorKey, but Pipeline enacts execution.\",\n    \"Meta may propose lift plans, but it may not execute lifts.\",\n    \"Lift computes; Engine commits.\",\n    \"Carrier extension requires explicit lift/engine validation and rollback.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ]\n  }\n}\n",
