      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:generator\",\n  \"name\": \"Generator Contract\",\n  \"version\": \"1.0.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"partially_enforced\",\n  \"description\": \"Generators are deterministic proposal mechanisms. They apply a declared syntactic, algebraic, structural, or topological proposal rule to an existing admitted Operator, Carrier, Obstruction, Packet, or Trace and emit detached candidate representations. A Generator does not execute an Engine state transition, does not accept or rank candidates, does not certify, does not authorize, does not terminalize, and does not compute canonical functionals.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"generators\",\n  \"governs\": [\n    \"generators/**\",\n    \"operators/generators/**\",\n    \"omega_*/*generator*.rs\"\n  ],\n  \"does_not_govern\": [\n    \"operators/lambdas/**\",\n    \"operators/reducers/**\",\n    \"operators/transforms/**\",\n    \"omega_functional/**\",\n    \"omega_homological/**\",\n    \"omega_lifts/**\",\n    \"omega_certifiers/**\",\n    \"omega_replay/**\",\n    \"omega_id_run/**\",\n    \"omega_pipeline/**\",\n    \"omega_engines/**\",\n    \"meta/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"OP-GENERATOR\",\n      \"description\": \"A Generator only proposes detached candidates and never executes an Engine state transformation.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-GENERATOR-DETACHED\",\n      \"description\": \"Generated candidates are detached proposals, not admitted runtime state changes.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-GENERATOR-NO-EVAL\",\n      \"description\": \"A Generator does not rank, score, accept, reject, or select candidates.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-GENERATOR-NO-AUTH\",\n      \"description\": \"Generation does not mint authority, closure, repair, or lift license.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-GENERATOR-NO-OPERAD-CLAIM\",\n      \"description\": \"A Generator may emit operator-shaped candidates but does not prove operad closure or generativity.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"certify\": \"forbidden\",\n    \"execute\": \"forbidden\",\n    \"accept_candidate\": \"forbidden\",\n    \"rank_candidate\": \"forbidden\",\n    \"search\": \"forbidden_except_declared_finite_enumeration\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"side_effects\": \"forbidden\",\n    \"deterministic\": true,\n    \"stateless\": true,\n    \"typed_failure_required\": true,\n    \"detached_output_required\": true\n  },\n  \"allowed\": [\n    \"read admitted immutable input\",\n    \"apply one declared proposal rule\",\n    \"emit detached candidate\",\n    \"emit finite deterministic candidate set if bounded and declared\",\n    \"attach proposal provenance\",\n    \"attach precondition notes\",\n    \"attach non-authoritative local metadata\",\n    \"return typed generation failure\"\n  ],\n  \"forbidden\": [\n    \"compute Φ₁\",\n    \"compute Γ₂\",\n    \"compute R_cl\",\n    \"compute Ξ\",\n    \"classify trichotomy\",\n    \"mint CertifiedAuthority\",\n    \"call CertifiedAuthority::certify\",\n    \"call authority_from_outcome_f13\",\n    \"call terminalize\",\n    \"emit AuthorityEffect::Authorize\",\n    \"execute candidate\",\n    \"admit candidate as state\",\n    \"mark candidate as accepted\",\n    \"rank candidate alternatives\",\n    \"score candidate alternatives with canonical functionals\",\n    \"perform adaptive search\",\n    \"iterate until convergence\",\n    \"perform MCTS\",\n    \"mutate carrier in place\",\n    \"hide carrier enlargement\",\n    \"declare lift success\",\n    \"declare repair success\",\n    \"declare operad closure\",\n    \"claim generated operators compose unless executable composition law exists\",\n    \"return opaque string-only failure\",\n    \"return None as failure\"\n  ],\n  \"candidate_shape\": {\n    \"preferred\": \"Result<GeneratedCandidate<T>, GenerationFailure>\",\n    \"detached_wrapper_required\": true,\n    \"admitted_state_output_forbidden\": true,\n    \"candidate_must_include\": [\n      \"source_ref\",\n      \"generator_id\",\n      \"proposal_rule_id\",\n      \"candidate_kind\",\n      \"declared_preconditions\",\n      \"authority_effect_none\"\n    ]\n  },\n  \"candidate_kinds\": {\n    \"allowed\": [\n      \"SameCarrierCandidate\",\n      \"OperatorCandidate\",\n      \"ReducerCandidate\",\n      \"LambdaCandidate\",\n      \"TransformCandidate\",\n      \"AdapterCandidate\",\n      \"LiftCandidateDetached\"\n    ],\n    \"notes\": [\n      \"LiftCandidateDetached is only a proposal. Execution belongs to omega_lifts or Engine under explicit lift law.\",\n      \"OperatorCandidate is not admitted until registry validation succeeds.\"\n    ]\n  },\n  \"failure_shape\": {\n    \"enum\": \"GenerationFailure\",\n    \"required_variants\": [\n      \"OutsideAdmissibleDomain\",\n      \"UnsupportedInputKind\",\n      \"ProposalRuleNotApplicable\",\n      \"FiniteEnumerationBoundExceeded\",\n      \"CarrierChangeNotDeclared\",\n      \"InvariantPreconditionMissing\",\n      \"MalformedCandidate\",\n      \"NonFiniteInput\"\n    ]\n  },\n  \"composition_and_operad_firewall\": {\n    \"closure_claim_status\": \"not_proven\",\n    \"generativity_claim_status\": \"not_proven\",\n    \"executable_apply_required_for_operator_claim\": true,\n    \"notes\": [\n      \"A generator tape is evidence of proposal history, not executable operad composition.\",\n      \"String labels are not operators.\",\n      \"Generated candidates must pass registry/admission before execution.\",\n      \"Obstruction management may motivate generators, but this contract does not assert that generators arise from obstruction management.\"\n    ]\n  },\n  \"validator_requirements\": {\n    \"forbidden_substrings\": [\n      \"CertifiedAuthority\",\n      \"authority_from_outcome_f13\",\n      \"terminalize\",\n      \"mint_authority\",\n      \"Phi1Functional\",\n      \"Gamma2Functional\",\n      \"XiFunctional\",\n      \"classify_exact\",\n      \"ExactRepair\",\n      \"AuthorityEffect::Authorize\",\n      \"Accepted\",\n      \"accept_candidate\",\n      \"rank_candidates\",\n      \"score_candidates\",\n      \"while \",\n      \"loop \",\n      \"thread_rng\",\n      \"rand::\",\n      \"unwrap()\",\n      \"expect(\"\n    ],\n    \"required_patterns\": [\n      \"Result<\",\n      \"GenerationFailure\",\n      \"GeneratedCandidate\"\n    ],\n    \"required_tests\": [\n      \"generator_is_deterministic\",\n      \"generator_outputs_detached_candidate\",\n      \"generator_does_not_execute_candidate\",\n      \"generator_does_not_mint_authority\",\n      \"generator_does_not_compute_functionals\",\n      \"generator_rejects_undeclared_carrier_change\",\n      \"generator_finite_enumeration_is_bounded\"\n    ]\n  },\n  \"lean_obligations\": [\n    {\n      \"id\": \"GEN-L0\",\n      \"theorem\": \"Generation produces detached candidates, not state transitions.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"GEN-L1\",\n      \"theorem\": \"Generation does not imply candidate admissibility.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"GEN-L2\",\n      \"theorem\": \"Generation does not imply lift license, repair, closure, or authority.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"GEN-L3\",\n      \"theorem\": \"Finite declared enumeration terminates and preserves candidate detachment.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"GEN-L4\",\n      \"theorem\": \"Operator-shaped candidate requires registry admission before execution.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"GEN-L5\",\n      \"theorem\": \"Generator tape is not executable composition without typed apply and composition law.\",\n      \"status\": \"needed\"\n    }\n  ],\n  \"notes\": [\n    \"Generators are proposal boundaries, not Engines.\",\n    \"Generators are not Evaluators.\",\n    \"Generators are not Certifiers.\",\n    \"Generators are not proof that operads arise from obstruction management.\",\n    \"If a generator grows carrier structure, its output must be a detached LiftCandidate, not an executed lift.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ]\n  }\n}\n",
