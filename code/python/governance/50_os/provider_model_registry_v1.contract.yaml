schema_version: omega.contract.v2
contract_id: urn:omega:packet:providers:model_registry_v1:v1.0.0
title: Model Registry v1
kind: packet_contract
layer: 50_os
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit:
    - MODEL_NOT_REGISTERED
    - MODEL_SIZE_UNDISCLOSED
    - MODEL_OVER_PARAMETER_CEILING
    - MODEL_NOT_OPEN_WEIGHTS
    - PARAM_UNSUPPORTED_BY_PROVIDER
doctrine:
  summary: ModelRegistryV1 provides a fail-closed lookup of model deployments, published
    parameter counts, and open-weights certification.
  invariants:
  - Model parameter ceilings are enforced from an explicit registry table, never inferred
    from model IDs.
  - Mixture-of-experts models count nominal total parameters, not active parameters.
  - Models with undisclosed size or closed weights are refused under open-weight ceiling
    policies.
  - Models exceeding 70B total parameters are strictly refused for open-weight challenge
    tracks.
  non_roles:
  - truth_oracle
  - unbounded_proposer
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  python_module: omega_engine_providers.domain.model_registry
  python_type: ModelRegistry
  form: class
  fields:
  - name: provider
    type: Provider
  - name: model_id
    type: str
  - name: total_parameters
    type: int | None
  - name: open_weights
    type: bool
  - name: architecture
    type: str
  - name: source
    type: str
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
