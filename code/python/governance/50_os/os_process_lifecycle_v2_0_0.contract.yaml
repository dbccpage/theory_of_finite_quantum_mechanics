schema_version: omega.contract.v2
contract_id: urn:omega:os:process_lifecycle:v2.0.0
title: Process Lifecycle & State Machine
kind: os_contract
layer: 20_os_kernel
role: OperatingSystemKernel
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  clean_architecture_layer: domain
  dependencies:
    contracts: []
    lean4_theorems: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit:
    - REFUSAL_INVALID_ARGUMENTS
    - REFUSAL_GATE_FAILED
    - REFUSAL_INVARIANT_BREACH
doctrine:
  summary: Process lifecycle manager enforcing valid transitions (INIT -> RUN -> HALT
    -> COMPOST).
  invariants:
  - Invalid state transitions are rejected with Refusal.
  - Halted processes clean up all allocated child resources.
  non_roles:
  - authority_source
  - promotion_granter
  - implicit_coercion
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
  - no_undeclared_state_transition
specification:
  algebraic_structure:
    carrier_type: ProcessLifecycleCarrier
    operations: []
  ports:
    input_packet: urn:omega:packet:work_packet:v1.0.0
    output_packet: urn:omega:packet:swarm_run_receipt:v1.0.0
    error_type: Refusal
  verification:
    fitness_test: null
    lean4_file: null
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
