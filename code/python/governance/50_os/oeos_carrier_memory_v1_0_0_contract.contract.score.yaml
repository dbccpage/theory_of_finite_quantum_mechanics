      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:carrier_memory:v1.0.0\",\n  \"title\": \"Host Buffer and Memory Boundary\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"CarrierMemory\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:resource_quota:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"MEM-INV-001\",\n          \"statement\": \"Host buffers are bounded by the request quota and never define the mathematical carrier they encode.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"MEM-INV-002\",\n          \"statement\": \"Canonical input bytes are exposed read-only or copied before candidate mutation.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"MEM-INV-003\",\n          \"statement\": \"Buffer release and accounting are explicit and independently testable for the declared implementation profile.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"BUFFER_BOUNDS_REFUSED\",\n        \"BUFFER_QUOTA_REFUSED\",\n        \"READ_ONLY_BUFFER_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"exact_payload_bytes\",\n        \"type\": \"urn:omega:oeos:type:exact_bytes:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"bounded_buffer_handle\",\n        \"type\": \"urn:omega:oeos:type:bounded_buffer_handle:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"BUFFER_BOUNDS_REFUSED\",\n      \"BUFFER_QUOTA_REFUSED\",\n      \"READ_ONLY_BUFFER_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"portable_process_memory\",\n        \"requirements\": [\n          \"allocation_accounting\",\n          \"explicit_buffer_lifetime\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded host-memory handling for exact bytes while leaving all carrier semantics inward.\",\n    \"non_role\": [\n      \"mathematical_carrier_definition\",\n      \"schema_admission\",\n      \"candidate_evaluation\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"process_memory_does_not_define_carrier_identity\"\n    ],\n    \"invariants\": [\n      \"canonical_input_buffers_are_not_mutated_in_place\",\n      \"allocation_is_charged_to_one_declared_quota\"\n    ],\n    \"allowed_operations\": [\n      \"allocate_bounded_buffer\",\n      \"expose_read_only_bytes\",\n      \"copy_for_host_task\"\n    ],\n    \"forbidden_operations\": [\n      \"mutate_canonical_input_in_place\",\n      \"infer_mathematical_type_from_memory_layout\"\n    ]\n  }\n}\n",
