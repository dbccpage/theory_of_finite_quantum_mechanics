      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:worker_host:v1.0.0\",\n  \"title\": \"Bounded Worker Host\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"WorkerHost\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:process_manager:v1.0.0\",\n        \"urn:omega:oeos:resource_quota:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"WRK-INV-001\",\n          \"statement\": \"Active workers and queued tasks remain within declared finite bounds.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"WRK-INV-002\",\n          \"statement\": \"Backpressure refuses excess work rather than silently dropping or accumulating it.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"WRK-INV-003\",\n          \"statement\": \"Thread and process worker profiles state their different memory and fault-isolation ceilings.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"WORKER_BACKPRESSURE_REFUSED\",\n        \"WORKER_POOL_REFUSED\",\n        \"WORKER_PROFILE_REFUSED\",\n        \"WORKER_TASK_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"frozen_host_task_request\",\n        \"type\": \"urn:omega:oeos:type:host_task_request:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"bounded_worker_result\",\n        \"type\": \"urn:omega:oeos:type:bounded_worker_result:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"WORKER_BACKPRESSURE_REFUSED\",\n      \"WORKER_POOL_REFUSED\",\n      \"WORKER_PROFILE_REFUSED\",\n      \"WORKER_TASK_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"thread_worker\",\n        \"requirements\": [\n          \"bounded_queue\",\n          \"shared_memory_is_explicitly_possible\",\n          \"cooperative_cancellation\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      },\n      {\n        \"profile\": \"process_worker\",\n        \"requirements\": [\n          \"bounded_queue\",\n          \"process_manager_delegation\",\n          \"serialized_task_boundary\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares bounded dispatch and backpressure without conflating thread workers with process isolation.\",\n    \"non_role\": [\n      \"task_registration\",\n      \"candidate_ranking\",\n      \"functional_aggregation\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"thread_workers_do_not_claim_absence_of_shared_memory\"\n    ],\n    \"invariants\": [\n      \"queue_and_active_worker_counts_are_bounded\",\n      \"task_failures_are_explicit_results_or_refusals\"\n    ],\n    \"allowed_operations\": [\n      \"dispatch_frozen_task\",\n      \"apply_queue_backpressure\",\n      \"drain_bounded_worker_pool\"\n    ],\n    \"forbidden_operations\": [\n      \"accept_arbitrary_callable\",\n      \"unbounded_queue_growth\",\n      \"claim_thread_process_equivalence\"\n    ]\n  }\n}\n",
