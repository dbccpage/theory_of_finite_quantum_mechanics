      "raw_utf8": "schema_version: 1.0.0\ncontract_id: os:constructor\nname: Constructor Contract\nversion: 1.0.0\nkind: os_doctrine_contract\nstatus: active_doctrine\nenforcement_status: partially_enforced\ndescription: 'Constructors are deterministic admission-boundary builders. They ingest\n  raw, unstructured, heterogeneous, or external material and either reject it with\n  a typed construction failure or produce an immutable admitted Carrier, Obstruction,\n  Packet, or other declared Omega Engine structure. Constructors do not evaluate,\n  certify, authorize, terminalize, repair, search, rank, lift, or compute canonical\n  functionals.\n\n  '\nlayer: OS\nmodule_path: constructors\ngoverns:\n- constructors/**\n- adapters/constructors/**\n- omega_*/*constructor*.rs\ndoes_not_govern:\n- operators/lambdas/**\n- operators/reducers/**\n- operators/transforms/**\n- omega_functional/**\n- omega_homological/**\n- omega_lifts/**\n- omega_certifiers/**\n- omega_replay/**\n- omega_id_run/**\n- omega_pipeline/**\n- omega_engines/**\nclaims:\n- id: OP-CONSTRUCTOR\n  description: Constructor output must be an admitted typed structure or a typed failure.\n  status: active\n  provenance: Operator OS Doctrine\n- id: OP-CONSTRUCTOR-RAW-QUARANTINE\n  description: Raw input remains untrusted until constructor admission succeeds.\n  status: active\n  provenance: Operator OS Doctrine\n- id: OP-CONSTRUCTOR-NO-AUTH\n  description: Construction/admission does not mint authority.\n  status: active\n  provenance: Operator OS Doctrine\nrules:\n  authority_effect: none\n  mutation: forbidden\n  canonical_functional_computation: forbidden\n  terminalize: forbidden\n  certify: forbidden\n  repair: forbidden\n  lift: forbidden\n  search: forbidden\n  rank: forbidden\n  runtime_orchestration: forbidden\n  side_effects: forbidden_except_declared_hashing_or_parsing\n  deterministic: true\n  typed_failure_required: true\n  admitted_output_required: true\n  raw_input_quarantine_required: true\nallowed:\n- parse raw input\n- normalize representation into a declared canonical form\n- validate schema and dimensions\n- validate finite carrier membership\n- validate decidable typing/admission predicates\n- attach source provenance\n- attach content hashes\n- return admitted immutable structure\n- return typed construction failure\nforbidden:\n- compute Φ₁\n- compute Γ₂\n- compute R_cl\n- compute Ξ\n- classify trichotomy\n- mint CertifiedAuthority\n- call CertifiedAuthority::certify\n- call authority_from_outcome_f13\n- call terminalize\n- emit AuthorityEffect::Authorize\n- perform repair\n- generate lift candidates\n- rank candidate states\n- execute operators\n- orchestrate engines\n- hide lossy coercion\n- silently enlarge carrier\n- accept malformed finite complexes\n- accept non-finite numeric values\n- return opaque string-only failure\n- return None as failure\noutput_shape:\n  preferred: Result<Admitted<T>, ConstructionFailure>\n  admitted_wrapper_required: true\n  raw_output_forbidden: true\nfailure_shape:\n  enum: ConstructionFailure\n  required_variants:\n  - MalformedInput\n  - SchemaViolation\n  - CarrierAdmissionFailure\n  - DimensionMismatch\n  - NonFiniteInput\n  - UndeclaredCoercion\n  - UnsupportedRepresentation\n  - HashMismatch\n  - ProvenanceMissing\nvalidator_requirements:\n  forbidden_substrings:\n  - CertifiedAuthority\n  - authority_from_outcome_f13\n  - terminalize\n  - mint_authority\n  - Phi1Functional\n  - Gamma2Functional\n  - XiFunctional\n  - classify_exact\n  - ExactRepair\n  - AuthorityEffect::Authorize\n  - unwrap()\n  - expect(\n  required_patterns:\n  - Result<\n  - ConstructionFailure\n  required_tests:\n  - constructor_rejects_malformed_input\n  - constructor_rejects_non_finite_input\n  - constructor_rejects_dimension_mismatch\n  - constructor_outputs_admitted_structure\n  - constructor_does_not_mint_authority\n  - constructor_does_not_compute_functionals\nlean_obligations:\n- id: CON-L0\n  theorem: Constructor admission produces an object satisfying declared carrier predicates.\n  status: needed\n- id: CON-L1\n  theorem: Rejected raw input cannot enter admitted operator execution.\n  status: needed\n- id: CON-L2\n  theorem: Construction/admission does not imply authority.\n  status: needed\n- id: CON-L3\n  theorem: Constructor normalization preserves declared structural invariants.\n  status: needed\nnotes:\n- Constructors are admission-boundary builders, not Operators in the strict admitted-input\n  sense.\n- A constructor may create an admitted object, but it may not certify that the object\n  is true, repaired, authoritative, or optimal.\n- Lossy coercions must be explicit and reflected in typed output or typed failure.\n- If construction requires carrier enlargement from an already-admitted object, that\n  is a MetaLift or lift operation, not a constructor.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - os:base_legacy_contract\n",
