      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:constructor\",\n  \"name\": \"Constructor Contract\",\n  \"version\": \"1.0.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"partially_enforced\",\n  \"description\": \"Constructors are deterministic admission-boundary builders. They ingest raw, unstructured, heterogeneous, or external material and either reject it with a typed construction failure or produce an immutable admitted Carrier, Obstruction, Packet, or other declared Omega Engine structure. Constructors do not evaluate, certify, authorize, terminalize, repair, search, rank, lift, or compute canonical functionals.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"constructors\",\n  \"governs\": [\n    \"constructors/**\",\n    \"adapters/constructors/**\",\n    \"omega_*/*constructor*.rs\"\n  ],\n  \"does_not_govern\": [\n    \"operators/lambdas/**\",\n    \"operators/reducers/**\",\n    \"operators/transforms/**\",\n    \"omega_functional/**\",\n    \"omega_homological/**\",\n    \"omega_lifts/**\",\n    \"omega_certifiers/**\",\n    \"omega_replay/**\",\n    \"omega_id_run/**\",\n    \"omega_pipeline/**\",\n    \"omega_engines/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"OP-CONSTRUCTOR\",\n      \"description\": \"Constructor output must be an admitted typed structure or a typed failure.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-CONSTRUCTOR-RAW-QUARANTINE\",\n      \"description\": \"Raw input remains untrusted until constructor admission succeeds.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    },\n    {\n      \"id\": \"OP-CONSTRUCTOR-NO-AUTH\",\n      \"description\": \"Construction/admission does not mint authority.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"certify\": \"forbidden\",\n    \"repair\": \"forbidden\",\n    \"lift\": \"forbidden\",\n    \"search\": \"forbidden\",\n    \"rank\": \"forbidden\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"side_effects\": \"forbidden_except_declared_hashing_or_parsing\",\n    \"deterministic\": true,\n    \"typed_failure_required\": true,\n    \"admitted_output_required\": true,\n    \"raw_input_quarantine_required\": true\n  },\n  \"allowed\": [\n    \"parse raw input\",\n    \"normalize representation into a declared canonical form\",\n    \"validate schema and dimensions\",\n    \"validate finite carrier membership\",\n    \"validate decidable typing/admission predicates\",\n    \"attach source provenance\",\n    \"attach content hashes\",\n    \"return admitted immutable structure\",\n    \"return typed construction failure\"\n  ],\n  \"forbidden\": [\n    \"compute Φ₁\",\n    \"compute Γ₂\",\n    \"compute R_cl\",\n    \"compute Ξ\",\n    \"classify trichotomy\",\n    \"mint CertifiedAuthority\",\n    \"call CertifiedAuthority::certify\",\n    \"call authority_from_outcome_f13\",\n    \"call terminalize\",\n    \"emit AuthorityEffect::Authorize\",\n    \"perform repair\",\n    \"generate lift candidates\",\n    \"rank candidate states\",\n    \"execute operators\",\n    \"orchestrate engines\",\n    \"hide lossy coercion\",\n    \"silently enlarge carrier\",\n    \"accept malformed finite complexes\",\n    \"accept non-finite numeric values\",\n    \"return opaque string-only failure\",\n    \"return None as failure\"\n  ],\n  \"output_shape\": {\n    \"preferred\": \"Result<Admitted<T>, ConstructionFailure>\",\n    \"admitted_wrapper_required\": true,\n    \"raw_output_forbidden\": true\n  },\n  \"failure_shape\": {\n    \"enum\": \"ConstructionFailure\",\n    \"required_variants\": [\n      \"MalformedInput\",\n      \"SchemaViolation\",\n      \"CarrierAdmissionFailure\",\n      \"DimensionMismatch\",\n      \"NonFiniteInput\",\n      \"UndeclaredCoercion\",\n      \"UnsupportedRepresentation\",\n      \"HashMismatch\",\n      \"ProvenanceMissing\"\n    ]\n  },\n  \"validator_requirements\": {\n    \"forbidden_substrings\": [\n      \"CertifiedAuthority\",\n      \"authority_from_outcome_f13\",\n      \"terminalize\",\n      \"mint_authority\",\n      \"Phi1Functional\",\n      \"Gamma2Functional\",\n      \"XiFunctional\",\n      \"classify_exact\",\n      \"ExactRepair\",\n      \"AuthorityEffect::Authorize\",\n      \"unwrap()\",\n      \"expect(\"\n    ],\n    \"required_patterns\": [\n      \"Result<\",\n      \"ConstructionFailure\"\n    ],\n    \"required_tests\": [\n      \"constructor_rejects_malformed_input\",\n      \"constructor_rejects_non_finite_input\",\n      \"constructor_rejects_dimension_mismatch\",\n      \"constructor_outputs_admitted_structure\",\n      \"constructor_does_not_mint_authority\",\n      \"constructor_does_not_compute_functionals\"\n    ]\n  },\n  \"lean_obligations\": [\n    {\n      \"id\": \"CON-L0\",\n      \"theorem\": \"Constructor admission produces an object satisfying declared carrier predicates.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"CON-L1\",\n      \"theorem\": \"Rejected raw input cannot enter admitted operator execution.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"CON-L2\",\n      \"theorem\": \"Construction/admission does not imply authority.\",\n      \"status\": \"needed\"\n    },\n    {\n      \"id\": \"CON-L3\",\n      \"theorem\": \"Constructor normalization preserves declared structural invariants.\",\n      \"status\": \"needed\"\n    }\n  ],\n  \"notes\": [\n    \"Constructors are admission-boundary builders, not Operators in the strict admitted-input sense.\",\n    \"A constructor may create an admitted object, but it may not certify that the object is true, repaired, authoritative, or optimal.\",\n    \"Lossy coercions must be explicit and reflected in typed output or typed failure.\",\n    \"If construction requires carrier enlargement from an already-admitted object, that is a MetaLift or lift operation, not a constructor.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ]\n  }\n}\n",
