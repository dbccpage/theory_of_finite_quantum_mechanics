      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:oeos:composition_root:v1.0.0\",\n  \"title\": \"Immutable OEOS Composition Root\",\n  \"kind\": \"host_contract\",\n  \"status\": \"proposed\",\n  \"layer\": \"09_host\",\n  \"role\": \"CompositionRoot\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"RequirementsOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:oeos:capability_guard:v1.0.0\",\n        \"urn:omega:oeos:cas_store:v1.0.0\",\n        \"urn:omega:oeos:filesystem_adapter:v1.0.0\",\n        \"urn:omega:oeos:process_manager:v1.0.0\",\n        \"urn:omega:oeos:worker_host:v1.0.0\"\n      ],\n      \"proof_obligations\": [\n        {\n          \"id\": \"CMP-INV-001\",\n          \"statement\": \"Required bindings are exact, unique, complete, and acyclic before the root freezes.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CMP-INV-002\",\n          \"statement\": \"Missing, duplicate, partial, dynamically injected, or cyclic bindings fail startup closed.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CMP-INV-003\",\n          \"statement\": \"Freezing host bindings neither activates proposed contracts nor grants inward authority.\",\n          \"verification_status\": \"open\"\n        },\n        {\n          \"id\": \"CMP-INV-004\",\n          \"statement\": \"Configuration and task implementation identities are bound before any host request executes.\",\n          \"verification_status\": \"open\"\n        }\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"COMPOSITION_CYCLE_REFUSED\",\n        \"COMPOSITION_DUPLICATE_REFUSED\",\n        \"COMPOSITION_MISSING_REFUSED\",\n        \"COMPOSITION_UNFROZEN_REFUSED\"\n      ]\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"abstract\": false,\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_host_contract:v1.0.0\"\n    ]\n  },\n  \"requirements\": {\n    \"inputs\": [\n      {\n        \"name\": \"exact_host_bindings\",\n        \"type\": \"urn:omega:oeos:type:exact_host_bindings:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"outputs\": [\n      {\n        \"name\": \"frozen_composition_root\",\n        \"type\": \"urn:omega:oeos:type:frozen_composition_root:v1.0.0\",\n        \"required\": true\n      }\n    ],\n    \"typed_refusals\": [\n      \"COMPOSITION_CYCLE_REFUSED\",\n      \"COMPOSITION_DUPLICATE_REFUSED\",\n      \"COMPOSITION_MISSING_REFUSED\",\n      \"COMPOSITION_UNFROZEN_REFUSED\"\n    ],\n    \"platform_requirements\": [\n      {\n        \"profile\": \"immutable_process_composition\",\n        \"requirements\": [\n          \"exact_port_protocol_checks\",\n          \"complete_dependency_graph\",\n          \"freeze_before_dispatch\"\n        ],\n        \"verification_status\": \"requirements_only\"\n      }\n    ],\n    \"evidence_ceiling\": \"RequirementsOnly\"\n  },\n  \"doctrine\": {\n    \"summary\": \"Declares the outer wiring boundary that binds concrete host ports without owning inward semantics.\",\n    \"non_role\": [\n      \"service_locator_for_domain_code\",\n      \"dynamic_plugin_loader\",\n      \"action_license_boundary\"\n    ],\n    \"nonclaims\": [\n      \"does_not_create_mathematical_facts_or_witnesses\",\n      \"does_not_issue_action_licenses\",\n      \"does_not_authorize_engine_state_transitions\",\n      \"successful_composition_does_not_activate_all_proposed_contracts\"\n    ],\n    \"invariants\": [\n      \"bindings_are_unique_and_acyclic\",\n      \"frozen_root_rejects_runtime_registration\"\n    ],\n    \"allowed_operations\": [\n      \"validate_exact_bindings\",\n      \"freeze_complete_composition\",\n      \"resolve_declared_host_port\"\n    ],\n    \"forbidden_operations\": [\n      \"dynamic_runtime_registration\",\n      \"partial_startup\",\n      \"infer_inward_authority_from_host_binding\"\n    ]\n  }\n}\n",
