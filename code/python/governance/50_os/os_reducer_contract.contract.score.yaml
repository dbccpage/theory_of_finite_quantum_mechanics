      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"os:reducer\",\n  \"name\": \"Reducer Operator Contract\",\n  \"version\": \"1.0.0\",\n  \"kind\": \"os_doctrine_contract\",\n  \"status\": \"active_doctrine\",\n  \"enforcement_status\": \"enforced\",\n  \"description\": \"A Reducer is a deterministic, stateless, unary, same-carrier structural canonicalization operator over admitted Obstruction/BaseType state. It maps S -> S, removes declared redundancy or normalizes representation, is idempotent, does not increase its declared reduction measure κ (κ(R(s)) <= κ(s)), and satisfies the inherited root Operator law Phi(R(s)) <= Phi(s). A Reducer does not compute canonical functionals, search, loop to convergence, enlarge carrier, repair by hidden lift, terminalize, certify, authorize, or mutate runtime state.\\n\",\n  \"layer\": \"OS\",\n  \"module_path\": \"operators::reducer\",\n  \"governs\": [\n    \"operators/reducers/**\",\n    \"operators/reducer/**\"\n  ],\n  \"does_not_govern\": [\n    \"constructors/**\",\n    \"generators/**\",\n    \"operators/lambdas/**\",\n    \"operators/transforms/**\",\n    \"omega_functional/**\",\n    \"omega_homological/**\",\n    \"omega_lifts/**\",\n    \"omega_certifiers/**\",\n    \"omega_replay/**\",\n    \"omega_id_run/**\",\n    \"omega_pipeline/**\",\n    \"omega_engines/**\",\n    \"meta/**\"\n  ],\n  \"claims\": [\n    {\n      \"id\": \"OP-L3\",\n      \"description\": \"Reducer idempotence theorem: R(R(s)) = R(s) over the admitted domain.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L3\"\n    },\n    {\n      \"id\": \"OP-L4\",\n      \"description\": \"Reducer non-expansion theorem: κ(R(s)) <= κ(s) for the declared reduction measure κ.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L4\"\n    },\n    {\n      \"id\": \"OP-L2-REDUCER\",\n      \"description\": \"Reducer inherited Phi non-increase theorem: Phi(R(s)) <= Phi(s) over the admitted domain.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L2\"\n    },\n    {\n      \"id\": \"OP-L7\",\n      \"description\": \"Operators are single-step; repeated execution belongs to Pipeline/Runner trace.\",\n      \"status\": \"active\",\n      \"provenance\": \"Operator OS Doctrine OP-L7\"\n    }\n  ],\n  \"rules\": {\n    \"authority_effect\": \"none\",\n    \"mutation\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"certify\": \"forbidden\",\n    \"carrier_enlargement\": \"forbidden\",\n    \"hidden_lift\": \"forbidden\",\n    \"search\": \"forbidden\",\n    \"rank\": \"forbidden\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"side_effects\": \"forbidden\",\n    \"phi_nonincrease_required\": true,\n    \"kappa_nonincrease_required\": true,\n    \"idempotent\": true,\n    \"deterministic\": true,\n    \"stateless\": true\n  },\n  \"phi_law\": {\n    \"operator_may_compute_phi\": false,\n    \"phi_nonincrease_required\": true,\n    \"relation\": \"Phi(R(s)) <= Phi(s)\",\n    \"kappa_relation\": \"kappa(R(s)) <= kappa(s)\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:operator\"\n    ]\n  }\n}\n",
