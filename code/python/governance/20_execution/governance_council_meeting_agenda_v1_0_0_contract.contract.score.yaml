      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:council_meeting_agenda:v1.0.0\",\n  \"title\": \"CouncilMeetingAgenda\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"Policy\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"AuthInterface\",\n        \"PolicyContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"binding_review_20261014\": \"The declared Rust crate/module is absent from the active Cargo workspace. Withdraw this realization binding; the retained specification has no executable implementation credit from it.\",\n    \"summary\": \"A CouncilMeetingAgenda specifies the structure, counterargument topics, and deliberative focus for a scheduled council meeting (daily during bring-up, weekly in standard operation). Agendas provide the human embodiment and oppositional processing framework for the system. An agenda confers NO math-layer terminal authority; it guides LLM-generated deliberative theater and counterargument.\\n\",\n    \"mathematical_role\": \"The AgendaCat mapping `prepare_agenda : Cadence × CouncilID → Agenda` formats the oppositional debate topics before a meeting convenes.\\n\",\n    \"non_role\": [\n      \"Minting or upgrading math-layer authority\",\n      \"Signing or wrapping certificates\",\n      \"Terminalizing or executing an operator\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM-generated agenda items and counterargument prompts serve as deliberative, dialectic, and oppositional theater. They guide human/agent debate but never authorize state mutations or mathematical terminals.\\n\"\n    },\n    \"authority_boundary\": {\n      \"may\": [\n        \"Formulate debate topics, counterargument prompts, and deliberative agendas\",\n        \"Schedule daily bring-up or weekly standing meetings\"\n      ],\n      \"must_not\": [\n        \"Mint or upgrade math-layer authority\",\n        \"Override math-layer proof obligations or certificate gates\"\n      ]\n    },\n    \"required_tests\": [\n      \"agenda_requires_council_id_and_cadence\",\n      \"agenda_confers_no_math_authority\"\n    ],\n    \"canonical_invariant\": \"A CouncilMeetingAgenda structures deliberative debate and oppositional processing; it confers zero math-layer authority and is bound to a declared council cadence.\\n\",\n    \"references\": [\n      \"omega_engine/crates/anomalon_councils/councils/council_governance.md\",\n      \"omega_engine/crates/anomalon_councils/src/cadence.rs\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
