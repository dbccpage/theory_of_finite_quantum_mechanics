      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:execution:solver_kernel:v1.0.0\",\n  \"title\": \"SolverKernel\",\n  \"kind\": \"execution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"06_execution\",\n  \"role\": \"SolverKernel\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"CertificateKernel\",\n        \"ReplayKernel\",\n        \"MeasurementKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"SolverKernel performs declared computation. Raw solver outputs are EvidenceOnly. Checked\\nsolver outputs may support FactOnly computational claims only after independent checking,\\nreplay, exact arithmetic, certificate, or tolerance-bound validation. Solver output does not\\nauthorize transitions and does not become canonical measurement output unless routed through\\nMeasurementKernel.\\n\",\n    \"non_role\": [\n      \"evaluation\",\n      \"search\",\n      \"policy_definition\",\n      \"certification_authority\",\n      \"terminal_mapping\",\n      \"execution\",\n      \"mutation\",\n      \"transition_authorization\",\n      \"action_licensing\"\n    ],\n    \"authority_defaults\": {\n      \"solver_output\": \"EvidenceOnly\",\n      \"checked_solver_output\": \"FactOnly only after declared checking/replay/certificate boundary.\",\n      \"evaluator_routing\": \"RequiresEvaluator may be used by consumers after checking when a judgment is needed.\"\n    },\n    \"structural_representation\": {\n      \"raw\": {\n        \"struct_name\": \"SolverOutput\",\n        \"fields\": [\n          {\n            \"name\": \"solver_id\",\n            \"type\": \"SolverId\"\n          },\n          {\n            \"name\": \"problem_ref\",\n            \"type\": \"ProblemRef\"\n          },\n          {\n            \"name\": \"output_payload_ref\",\n            \"type\": \"EvidenceRef\"\n          },\n          {\n            \"name\": \"arithmetic_mode\",\n            \"type\": \"ArithmeticMode\"\n          },\n          {\n            \"name\": \"tolerance_profile_ref\",\n            \"type\": \"Option<ToleranceProfileRef>\"\n          },\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"Option<ReplayRef>\"\n          },\n          {\n            \"name\": \"output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedSolverOutput\",\n        \"fields\": [\n          {\n            \"name\": \"solver_output_ref\",\n            \"type\": \"SolverOutputRef\"\n          },\n          {\n            \"name\": \"checker_ref\",\n            \"type\": \"CheckerRef\"\n          },\n          {\n            \"name\": \"checked_problem_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"checked_output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"ProblemRef\\n-> SolverKernel\\n-> SolverOutput\\n-> Checker / ReplayKernel / CertificateKernel\\n-> CheckedSolverOutput or EvidenceEnvelope\\n-> MeasurementKernel if canonical measurement is needed\\n-> Evaluator if judgment is needed\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"solver_output_defaults_to_evidence_only\",\n      \"checked_solver_output_may_be_factonly_after_checks\",\n      \"solver_does_not_evaluate\",\n      \"solver_does_not_search\",\n      \"solver_does_not_certify_itself\",\n      \"solver_does_not_emit_action_license\",\n      \"solver_does_not_authorize_transition\",\n      \"solver_does_not_execute\",\n      \"solver_output_not_canonical_measurement_without_measurement_kernel\"\n    ],\n    \"canonical_invariant\": \"Solver computes only. It does not decide, certify itself, measure canonically, license,\\nauthorize, execute, mutate, or define policy.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"SolverKernel\",\n      \"source_file\": \"non-math/06_execution/solver_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Mathematical computation kernel\",\n      \"version\": \"2.0\",\n      \"classification\": \"computation\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"CertificateKernel\",\n        \"ReplayKernel\",\n        \"MeasurementKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"evaluation\",\n        \"search\",\n        \"policy_definition\",\n        \"certification_authority\",\n        \"terminal_mapping\",\n        \"execution\",\n        \"mutation\",\n        \"transition_authorization\",\n        \"action_licensing\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"Record\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_execution_contract:v1.0.0\"\n    ]\n  }\n}\n",
