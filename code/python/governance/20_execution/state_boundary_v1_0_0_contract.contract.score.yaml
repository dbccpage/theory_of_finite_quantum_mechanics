      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:state:boundary:v1.0.0\",\n  \"title\": \"Boundary\",\n  \"kind\": \"state_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"01_state\",\n  \"role\": \"Boundary\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Carrier\",\n        \"TypeAndKindContract\",\n        \"GlobalContractTaxonomy\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Boundary boundary.\\n\\nA Boundary is a typed structural interface between a local candidate space and a global\\ncarrier reference. It declares the shape of crossing, admissibility predicates, and required\\nevidence references.\\n\\nA Boundary does not apply the crossing. It does not decide admissibility. It does not transport\\nstate. It does not mutate carriers.\\n\",\n    \"non_role\": [\n      \"execution\",\n      \"evaluation\",\n      \"certification\",\n      \"mutation\",\n      \"terminalization\",\n      \"semantic truth claim\",\n      \"authority promotion\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\\nauthorize transitions, execute transitions, or upgrade evidence authority.\\n\\nLLM output may propose Boundary specifications, but those proposals are EvidenceOnly until\\nchecked against the Boundary contract and Carrier contract.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Cohomological Semantics\",\n      \"role\": \"Typed structural interface between local candidate spaces and global carrier state.\",\n      \"classification\": \"State layer -- structure declaration.\"\n    },\n    \"structural_representation\": {\n      \"boundary_spec\": {\n        \"struct_name\": \"BoundarySpec\",\n        \"fields\": [\n          {\n            \"name\": \"boundary_id\",\n            \"type\": \"BoundaryId\"\n          },\n          {\n            \"name\": \"local_space\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"global_space\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"crossing_type\",\n            \"type\": \"CrossingType\"\n          },\n          {\n            \"name\": \"admissibility_predicate_ref\",\n            \"type\": \"PredicateRef\"\n          },\n          {\n            \"name\": \"required_evidence\",\n            \"type\": \"Vec<EvidenceKind>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"boundary_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"schema_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"CrossingType\",\n          \"variants\": [\n            \"LocalToGlobalInjection\",\n            \"GlobalToLocalProjection\",\n            \"DeclaredEquivalence\"\n          ],\n          \"note\": \"CrossingType::DeclaredEquivalence is a boundary declaration. It is not the fixed-layer operator class QuotientIsometry.\"\n        }\n      ]\n    },\n    \"authority_boundary\": {\n      \"may\": [\n        \"Declare the shape of local-to-global and global-to-local crossings\",\n        \"Specify admissibility predicates for crossing\",\n        \"Require specific evidence kinds for crossing\"\n      ],\n      \"must_not\": [\n        \"Compute metrics or measurements\",\n        \"Evaluate admissibility (that is the Evaluator's role; Boundary defines the predicate, not applies it)\",\n        \"Execute state transitions\",\n        \"Certify anything\",\n        \"Terminalize\"\n      ]\n    },\n    \"admissibility_checklist\": [\n      \"Local and global carrier refs must be valid\",\n      \"Crossing type must be declared\",\n      \"Admissibility predicate must be total (defined for all inputs)\",\n      \"Required evidence kinds must be satisfiable\"\n    ],\n    \"refusal_conditions\": [\n      {\n        \"name\": \"BoundaryRefusal\",\n        \"variants\": [\n          \"InvalidCarrierRef\",\n          \"CrossingTypeUndeclared\",\n          \"AdmissibilityPredicatePartial\",\n          \"RequiredEvidenceUnsatisfiable\"\n        ]\n      }\n    ],\n    \"checking_and_replay_obligation\": \"Boundary declarations are structural and immutable. Creating or changing a BoundarySpec does\\nnot execute a transition by itself.\\n\\nIf a boundary is added, removed, or changed in the carrier state, that change must occur through\\na licensed carrier transition and be recorded by the Trace boundary.\\n\\nBoundary itself does not write trace records.\\n\",\n    \"certificate_note\": \"CertificateKernel may seal certificates over checked evidence; this contract does not create certificates.\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"evaluate(\",\n        \"certify(\",\n        \"terminalize(\",\n        \"mutate_carrier\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"sign_certificate\",\n        \"authorize_transition\"\n      ]\n    },\n    \"required_tests\": [\n      \"boundary_default_authority_is_evidence_only\",\n      \"boundary_does_not_apply_crossing\",\n      \"boundary_does_not_mutate_carrier\",\n      \"boundary_does_not_certify\",\n      \"boundary_predicate_is_reference_not_executor\",\n      \"boundary_change_requires_licensed_carrier_transition\",\n      \"boundary_declared_equivalence_is_not_quotient_isometry_operator\"\n    ],\n    \"canonical_invariant\": \"Boundary declares the structural crossing surface between local candidate space and global\\ncarrier reference. It may name predicates and required evidence, but it does not apply crossings,\\nevaluate admissibility, certify evidence, mutate carriers, terminalize, authorize, or execute.\\nBoundary declarations are EvidenceOnly until checked.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Boundary\",\n      \"role\": \"interface between local candidate spaces and global carrier state\",\n      \"classification\": \"structure\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"Carrier\",\n        \"TypeAndKindContract\",\n        \"GlobalContractTaxonomy\"\n      ],\n      \"forbidden_authority\": [\n        \"execution\",\n        \"evaluation\",\n        \"certification\",\n        \"mutation\",\n        \"terminalization\",\n        \"semantic truth claim\",\n        \"authority promotion\"\n      ],\n      \"primary_output_family\": \"StructureArtifact\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_state_contract:v1.0.0\"\n    ]\n  }\n}\n",
