      "raw_utf8": "{\n  \"schema_version\": \"omega.file_contract.v1\",\n  \"kind\": \"rust_file_contract\",\n  \"contract_id\": \"urn:omega:rust:omega_kernel:obligation:v1.0.0\",\n  \"title\": \"Obligation\",\n  \"status\": \"active\",\n  \"crate\": \"omega_kernel\",\n  \"file\": \"crates_rs/omega_kernel/src/obligation.rs\",\n  \"role\": \"substrate\",\n  \"authority_effect\": \"none\",\n  \"evidence_ceiling\": \"LocalReplay\",\n  \"customer_claim_allowed\": false,\n  \"runtime_enforcement\": false,\n  \"owns\": [\n    \"the free commutative monoid on obligation ids\",\n    \"the generated and discharged vectors of a transition, and the difference\"\n  ],\n  \"does_not_own\": [\n    \"what any particular obligation means\",\n    \"whether an obligation ought to have been generated\",\n    \"any authority; a settled ledger is not a certificate\"\n  ],\n  \"may_call\": [],\n  \"must_not\": [\n    \"discharge an obligation that was never generated\",\n    \"discharge more instances than are outstanding\",\n    \"expose the generated or discharged vectors for direct assignment\"\n  ],\n  \"exactness\": {\n    \"mode\": \"exact_only\",\n    \"exact_constructor_required\": false,\n    \"approximate_modes_allowed\": false\n  },\n  \"laws\": [\n    \"Monoid law: combine is associative and commutative with empty as its unit, which is what makes the obligation vector a free commutative monoid rather than a list. Counts add; they do not replace.\",\n    \"Whole-count law: an obligation is generated a whole number of times. Counts are u64 and overflow is refused, never wrapped and never saturated. total() returns None past the ceiling rather than u64::MAX, for the same reason approximate() refuses NAN: a lost value that still looks like a value is worse than no value.\",\n    \"Debt law: an obligation that was never generated cannot be discharged, and no obligation can be discharged more times than it is outstanding. A transition claiming otherwise claims to have settled a debt no one was owed.\",\n    \"Difference law: outstanding is generated minus discharged, per id. A ledger is settled exactly when nothing is outstanding.\",\n    \"Canonical wire law: the multiset is unordered but its serialization is not. A BTreeMap keyed by id means two equal vectors produce identical bytes, so a digest over an obligation vector is stable.\",\n    \"Construction law: the ledger's fields are private and Deserialize re-checks the debt law, so a forged pair discharging what was never generated cannot enter -- not from a caller and not from JSON.\",\n    \"Narrow grammar law: an obligation id admits . _ - : and not the / and @ that ObserverId allows. The two are deliberately not interchangeable -- an obligation names a debt, not a scoped resource path.\",\n    \"Authority law: settling every obligation confers nothing. It records that the declared debts were paid, not that the result is true.\"\n  ],\n  \"forbidden_substrings\": [\n    \"f64\",\n    \"f32\",\n    \"tolerance\",\n    \"pub generated\",\n    \"pub discharged\",\n    \"HashMap\",\n    \"saturating_add\"\n  ],\n  \"required_substrings\": [\n    \"pub struct Obligations\",\n    \"pub struct ObligationLedger\",\n    \"pub fn combine\",\n    \"pub fn discharge\",\n    \"pub fn outstanding\",\n    \"BTreeMap\"\n  ],\n  \"required_tests\": [\n    \"an_obligation_id_must_be_canonical\",\n    \"combine_is_commutative\",\n    \"combine_is_associative\",\n    \"empty_is_the_identity\",\n    \"counts_add_rather_than_replace\",\n    \"an_obligation_never_generated_cannot_be_discharged\",\n    \"discharging_more_than_outstanding_is_refused\",\n    \"outstanding_is_generated_minus_discharged\",\n    \"a_ledger_is_settled_only_when_nothing_is_outstanding\",\n    \"a_forged_ledger_is_refused_on_deserialize\",\n    \"the_wire_form_is_ordered_so_equal_multisets_serialize_alike\",\n    \"combining_past_the_count_ceiling_is_refused_not_wrapped\",\n    \"a_total_that_would_overflow_is_none_rather_than_saturated\"\n  ],\n  \"lean_obligations\": [],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
