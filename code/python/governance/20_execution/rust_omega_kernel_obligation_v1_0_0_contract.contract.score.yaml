        "laws": [
          "Monoid law: combine is associative and commutative with empty as its unit, which is what makes the obligation vector a free commutative monoid rather than a list. Counts add; they do not replace.",
          "Whole-count law: an obligation is generated a whole number of times. Counts are u64 and overflow is refused, never wrapped and never saturated. total() returns None past the ceiling rather than u64::MAX, for the same reason approximate() refuses NAN: a lost value that still looks like a value is worse than no value.",
          "Debt law: an obligation that was never generated cannot be discharged, and no obligation can be discharged more times than it is outstanding. A transition claiming otherwise claims to have settled a debt no one was owed.",
