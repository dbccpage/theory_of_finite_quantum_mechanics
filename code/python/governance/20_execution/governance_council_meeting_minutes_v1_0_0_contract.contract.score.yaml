      "summary": "CouncilMeetingMinutes record the deliberative outcomes, decisions, action items, and dissents from a council meeting. Generated LLM theater provides oppositional counterargument logs and human embodiment for the system. Minutes confer zero math-layer authority; they record governance deliberation and route code-change action items to Blackrod for enforcement.\n",
