        "Minting or upgrading math-layer authority",
        "Signing or wrapping certificates",
        "Terminalizing or executing an operator"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "LLM-generated meeting minutes and oppositional dialogue capture deliberative theater and counterarguments. They serve as diagnostic/deliberative material only and never mint math-layer authority.\n"
      },
      "authority_boundary": {
        "may": [
          "Format meeting decisions, dissents, action items, and oppositional minutes",
          "Consolidate council reports and route action items to Blackrod"
        ],
        "must_not": [
          "Mint or upgrade math-layer authority",
          "Override math-layer certificate gates"
        ]
      },
      "required_tests": [
        "minutes_require_meeting_id_and_council_id",
        "minutes_confers_no_math_authority"
      ],
      "canonical_invariant": "CouncilMeetingMinutes capture governance decisions, dissents, and LLM-generated counterargument theater; they confer zero math-layer authority and route action items without voting power transfer.\n",
