      "raw_utf8": "{\n  \"paper_identity\": \"CODA-A\",\n  \"legacy_file_identity\": \"005_gtta.md\",\n  \"canonical_version\": \"v1.0\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 6 (A — Anomalon Register)\",\n  \"primitives\": {\n    \"ambient_category\": \"Category C with finite limits and pushouts\",\n    \"closure_discipline\": \"Lambda = (Close_Lambda, c_Lambda, Cofib, tau_res, T_res)\",\n    \"closure_unit\": \"c_{Lambda, X} : X -> Close_Lambda(X)\",\n    \"residual_object\": \"R_Lambda(X) = Cofib(c_{Lambda, X}) ~= Close_Lambda(X) union_X *\",\n    \"anomalon_terminal\": \"Omega_{LambdaOmega}(X) = tau_res(R_Lambda(X))\",\n    \"canonical_residual\": \"A-frak(X) = cofib(epsilon_X) via shadow reflection U_3\"\n  },\n  \"equations\": {\n    \"residual_handoff_pipeline\": {\n      \"latex\": \"X \\\\xrightarrow{c_\\\\Lambda} \\\\operatorname{Close}_\\\\Lambda(X) \\\\xrightarrow{\\\\operatorname{cofib}} R_\\\\Lambda(X) \\\\xrightarrow{\\\\tau_{\\\\mathrm{res}}} \\\\Omega_{\\\\Lambda\\\\Omega}(X)\",\n      \"description\": \"Pipeline mapping failed closure attempt into typed residual cofiber terminal\"\n    },\n    \"homological_classification\": {\n      \"resolved_exact\": \"[r] = 0 \\\\implies \\\\mathsf{ResolvedExact}\",\n      \"closed_residual\": \"[r] \\\\neq 0 \\\\land \\\\bar{d}_1[r] = 0 \\\\implies \\\\mathsf{ClosedResidual} / \\\\mathsf{Anomalon}\",\n      \"open_residual\": \"\\\\bar{d}_1[r] \\\\neq 0 \\\\implies \\\\mathsf{OpenResidual}\"\n    },\n    \"first_unresolved_index\": {\n      \"latex\": \"n_0 := \\\\min \\\\{ n \\\\in \\\\mathbb{N} : R^{(n)}_\\\\Lambda \\\\not\\\\simeq 0 \\\\}\",\n      \"description\": \"First unresolved coherence level acting as dependency cut for higher-dimensional checks\"\n    },\n    \"lift_transition_ledger\": {\n      \"latex\": \"\\\\mathsf{Trans}_F(R) = \\\\mathsf{Split?} + \\\\bigoplus_i \\\\mathsf{AtomTrans}(R_i)\",\n      \"description\": \"Transition outcomes under lift F: Kill, Close, Raise, PersistOpen, Refused, Split\"\n    },\n    \"residual_non_creation_theorem\": {\n      \"latex\": \"\\\\operatorname{Nat}(\\\\Omega_{\\\\Lambda\\\\Omega}, \\\\mathsf{Auth}) = \\\\varnothing\",\n      \"description\": \"Theorem proving no natural transformation exists from residual terminal to authority\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"CODA-A-RULE-001\",\n      \"name\": \"Doctrine of Residual Honesty\",\n      \"statement\": \"Failed closure must be terminalized as typed residual (ClosureAbsorbed, ClosedResidual, OpenResidual, LiftRequired, RefusedClosure), never hidden or passed as authority.\"\n    },\n    {\n      \"id\": \"CODA-A-RULE-002\",\n      \"name\": \"Evidence Is Not Authority\",\n      \"statement\": \"CertifiedResidual(r) does not equal Auth(claim). Exposing residue organizes boundaries but mints no authority.\"\n    },\n    {\n      \"id\": \"CODA-A-RULE-003\",\n      \"name\": \"No Silent Mutation on Lift\",\n      \"statement\": \"If lift F mutates protected skeleton U F(q) != q, it must return a LossLedger. Silent mutation invalidates authority preservation.\"\n    },\n    {\n      \"id\": \"CODA-A-RULE-004\",\n      \"name\": \"n_0 Dependency Cut\",\n      \"statement\": \"Higher-dimensional coherence checks (n > n_0) are conditional until the first unresolved residual n_0 is resolved or terminalized.\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports homological typing of unabsorbed residuals, cofiber formation, and lift transition ledgers.\",\n    \"does_not_support\": \"Does not support treating residuals as authority, origin of difference claims, or uncertified closure pass.\",\n    \"narrowest_defensible_claim\": \"Classifies residual cofiber outcomes into exact, closed, open, lift-required, or refused terminals.\",\n    \"next_test_needed\": \"Mechanized verification of atomic lift transition outcomes (Kill/Close/Raise/Split) on synthetic cofiber complexes.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
