      "raw_utf8": "{\n  \"schema_version\": \"omega.file_contract.v1\",\n  \"kind\": \"rust_file_contract\",\n  \"contract_id\": \"urn:omega:rust:omega_types:tolerant_float:v1.0.0\",\n  \"title\": \"TolerantFloat\",\n  \"status\": \"active\",\n  \"crate\": \"omega_types\",\n  \"file\": \"crates_rs/omega_types/src/tolerant_float.rs\",\n  \"role\": \"utility\",\n  \"authority_effect\": \"none\",\n  \"evidence_ceiling\": \"DiagnosticOnly\",\n  \"customer_claim_allowed\": false,\n  \"runtime_enforcement\": false,\n  \"owns\": [\n    \"a finite float carried together with the epsilon it is meaningful to\",\n    \"tolerant comparison, spelled out at the call site\"\n  ],\n  \"does_not_own\": [\n    \"equality\",\n    \"any residual, diagnostic, or terminal\",\n    \"exact arithmetic, which is omega_kernel::exact\"\n  ],\n  \"may_call\": [],\n  \"must_not\": [\n    \"implement PartialEq, Eq, Hash or Ord\",\n    \"admit a non-finite value\",\n    \"be used to decide a diagnostic class or a terminal\"\n  ],\n  \"exactness\": {\n    \"mode\": \"approximate_by_declaration\",\n    \"exact_constructor_required\": false,\n    \"approximate_modes_allowed\": true\n  },\n  \"laws\": [\n    \"Finiteness law: construction refuses NaN and both infinities, so no downstream arithmetic has to test for them.\",\n    \"Epsilon locality law: convergence is measured against the value's own declared epsilon, never a global constant.\",\n    \"No-equality law: tolerant equality is not transitive -- with epsilon 1, 0 ~ 1 and 1 ~ 2 but 0 !~ 2 -- and PartialEq is specified to be transitive. Implementing it made every HashMap, sort, dedup and assert_eq! over this type unsound. A tolerant comparison must be spelled tolerant_eq where the epsilon is visible.\",\n    \"Scope law: this type is for quantities that are genuinely approximate. A residual, a diagnostic class, and a terminal are none of those.\"\n  ],\n  \"forbidden_substrings\": [\n    \"impl PartialEq for TolerantFloat\",\n    \"derive(PartialEq\",\n    \"impl Eq for TolerantFloat\",\n    \"impl Hash for TolerantFloat\"\n  ],\n  \"required_substrings\": [\n    \"pub fn tolerant_eq\",\n    \"value: f64\"\n  ],\n  \"required_tests\": [\n    \"rejects_nan\",\n    \"rejects_infinity\",\n    \"rejects_negative_epsilon\",\n    \"bounded_enforces_limits\",\n    \"tolerant_equality_is_not_transitive_which_is_why_it_is_not_partial_eq\",\n    \"convergence_is_measured_against_the_declared_epsilon_not_a_global_one\"\n  ],\n  \"lean_obligations\": [],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
