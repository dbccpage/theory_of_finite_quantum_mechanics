      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:obstruction:residual_projection:v1.0.0\",\n  \"title\": \"ResidualProjection\",\n  \"kind\": \"obstruction_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"03_obstruction\",\n  \"role\": \"FixedLayerOperatorAlgebra\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"FixedLayerOperatorAlgebra\",\n        \"CarrierContract\",\n        \"ObstructionContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"A checked ResidualProjection may instantiate R = residual projection in the fixed-layer\\noperator algebra: a deterministic projection to a residual representative under declared\\nTiePolicy, preserving required invariants and recording discarded information.\\n\\nResidual Projection is one of the five fixed-layer effect-classes in the obstruction algebra.\\n\\nResidualProjectionCandidate is EvidenceOnly.\\nCheckedResidualProjection may become FactOnly after surjectivity, TiePolicy, invariant\\npreservation, discarded-information evidence, and replay checks.\\nResidualProjectionLicense, if emitted, is AuthorizesTransition.\\nEngine-executed projection is StateTransition.\\n\",\n    \"non_role\": [\n      \"Reconstructing discarded information\",\n      \"Certifying that discarded information was irrelevant without evidence\",\n      \"Executing state transitions\",\n      \"Evaluating admissibility\"\n    ],\n    \"effect_class_designation\": {\n      \"effect_class\": \"R\",\n      \"name\": \"Residual Projection\",\n      \"composition_laws\": [\n        \"R . R may normalize to R only when source/target compatibility, deterministic TiePolicy composition, invariant preservation, replay support, and explicit RewriteLaw or certificate are present.\",\n        \"R . M or M . R targets M only under checked composition; malformed refusal records are invalid evidence, not automatically M.\",\n        \"C . R != identity in general (information loss in R is irreversible)\"\n      ]\n    },\n    \"structural_representation\": {\n      \"candidate\": {\n        \"struct_name\": \"ResidualProjectionCandidate\",\n        \"fields\": [\n          {\n            \"name\": \"projection_id\",\n            \"type\": \"ProjectionId\"\n          },\n          {\n            \"name\": \"source_carrier\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"target_carrier_schema\",\n            \"type\": \"CarrierSchemaRef\"\n          },\n          {\n            \"name\": \"projection_map_ref\",\n            \"type\": \"ProjectionWitnessId\"\n          },\n          {\n            \"name\": \"tie_policy\",\n            \"type\": \"TiePolicyId\"\n          },\n          {\n            \"name\": \"discarded_dimensions\",\n            \"type\": \"Vec<DimensionId>\"\n          },\n          {\n            \"name\": \"invariants_preserved\",\n            \"type\": \"Vec<InvariantId>\"\n          },\n          {\n            \"name\": \"invariants_discarded\",\n            \"type\": \"Vec<InvariantId>\"\n          },\n          {\n            \"name\": \"evidence_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"projection_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedResidualProjection\",\n        \"fields\": [\n          {\n            \"name\": \"projection_id\",\n            \"type\": \"ProjectionId\"\n          },\n          {\n            \"name\": \"candidate_ref\",\n            \"type\": \"ProjectionId\"\n          },\n          {\n            \"name\": \"surjectivity_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"tie_policy_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"preservation_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"discarded_information_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"checked_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"ResidualProjectionRefusal\",\n          \"variants\": [\n            \"SourceMalformed\",\n            \"TargetNotSubspace\",\n            \"ProjectionNotSurjective\",\n            {\n              \"name\": \"RequiredInvariantDiscarded\",\n              \"fields\": {\n                \"invariant\": \"InvariantId\"\n              }\n            },\n            {\n              \"name\": \"NoEvidenceForIrrelevance\",\n              \"fields\": {\n                \"dimension\": \"DimensionId\"\n              }\n            },\n            \"AuthorityExceedsEvidence\"\n          ]\n        }\n      ]\n    },\n    \"authority_boundary\": {\n      \"may\": [\n        \"Project a carrier to a lower-dimensional subspace\",\n        \"Discard dimensions that are certified as irrelevant\",\n        \"Produce a residual carrier with preserved invariants\"\n      ],\n      \"must_not\": [\n        \"Reconstruct discarded information\",\n        \"Certify relevance/irrelevance without evidence\",\n        \"Execute state transitions\",\n        \"Evaluate admissibility (that is the Evaluator's role)\",\n        \"Terminalize\",\n        \"Create certificates\"\n      ]\n    },\n    \"admissibility_checklist\": [\n      \"Source carrier must be well-formed\",\n      \"Target carrier must be a valid subspace of source\",\n      \"Projection map must be surjective\",\n      \"All invariants required by the target must be preserved\",\n      \"Discarded dimensions must be certified as irrelevant by attached evidence\",\n      \"Candidate authority effect is EvidenceOnly. Evaluation may be required before licensing or execution. The checked projection fact may be FactOnly if all certificates verify.\"\n    ],\n    \"tie_policy_law\": \"Residual projection requires a deterministic TiePolicy.\\n\\nIf multiple residual representatives are possible, the projection is invalid unless the\\nTiePolicy selects one deterministically and replayably.\\n\\nR without declared TiePolicy is refused.\\n\",\n    \"refusal_conditions\": \"If any refusal condition triggers, the candidate is refused. The attempted mutation may be\\nclassified as M = refused mutation only by the fixed-layer operator classifier/checker.\\nThe ResidualProjection contract itself does not self-assign M.\\n\",\n    \"replay_and_certificate_obligation\": \"- Every residual projection MUST be replayable from its ProjectionWitness\\n- The projection map, discarded dimensions, TiePolicy, evidence refs, and certificate refs\\n  must be replayable and recordable by Trace when execution occurs. Trace records execution;\\n  it does not certify the projection.\\n- A certificate wrapping a residual projection inherits the authority of the weakest evidence\\n  it references (Doctrine 6)\\n\",\n    \"cross_subsystem_interfaces\": [\n      {\n        \"subsystem\": \"Carrier\",\n        \"interface\": \"Source and target are Carrier instances\"\n      },\n      {\n        \"subsystem\": \"Obstruction\",\n        \"interface\": \"R may be generated in response to an obstruction\"\n      },\n      {\n        \"subsystem\": \"Certificate\",\n        \"interface\": \"R's evidence refs must reference valid certificates\"\n      },\n      {\n        \"subsystem\": \"Evaluator\",\n        \"interface\": \"candidate authority is EvidenceOnly; evaluator judges admissibility\"\n      },\n      {\n        \"subsystem\": \"Engine\",\n        \"interface\": \"Engine executes a residual projection only after a valid ActionLicense is present and required evaluator/certificate/replay checks have passed.\"\n      },\n      {\n        \"subsystem\": \"Trace\",\n        \"interface\": \"R is recorded in the execution trace\"\n      }\n    ],\n    \"llm_exclusion\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is candidate generator only. An LLM may propose a residual projection as a\\ncandidate, but the candidate carries no authority until certified by the obstruction\\nkernel and judged admissible by the Evaluator.\\n\"\n    },\n    \"certificate_authority_bound\": {\n      \"doctrine\": 6,\n      \"text\": \"Certificate authority wrapping a residual projection MUST NOT exceed the authority of\\nthe evidence certifying that the discarded dimensions were irrelevant.\\n\"\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute_now(\",\n        \"certify_now(\",\n        \"evaluate_admissibility(\",\n        \"terminalize(\",\n        \"reconstruct_discarded(\",\n        \"authority_upgrade(\",\n        \"sign_certificate(\",\n        \"apply_operator_now(\",\n        \"self_declare_effect_class\",\n        \"missing_tie_policy\",\n        \"allow_nondeterministic_projection\",\n        \"skip_tie_policy_check\"\n      ]\n    },\n    \"required_tests\": [\n      \"residual_projection_is_surjective\",\n      \"residual_projection_preserves_required_invariants\",\n      \"residual_projection_cannot_reconstruct_discarded\",\n      \"residual_projection_candidate_defaults_to_evidence_only\",\n      \"residual_projection_checked_fact_requires_certificates\",\n      \"residual_projection_evidence_bound\",\n      \"residual_projection_composes_to_residual\",\n      \"residual_projection_absorbed_by_refusal\",\n      \"residual_projection_replayable\",\n      \"residual_projection_candidate_defaults_to_evidence_only\",\n      \"checked_residual_projection_may_be_factonly_after_certificates\",\n      \"residual_projection_requires_deterministic_tie_policy\",\n      \"residual_projection_without_tie_policy_refused\",\n      \"residual_projection_cannot_self_assign_m_refusal\",\n      \"residual_projection_does_not_emit_action\",\n      \"residual_projection_execution_requires_action_license\",\n      \"residual_projection_records_discarded_information_certificate\"\n    ],\n    \"canonical_invariant\": \"ResidualProjection candidates are EvidenceOnly. A checked ResidualProjection may instantiate\\nR = residual projection only with surjectivity evidence, deterministic TiePolicy,\\ninvariant-preservation evidence, discarded-information evidence, and replay support.\\nR does not reconstruct discarded information, certify itself, evaluate admissibility,\\nterminalize, authorize, mutate, or execute. Engine execution requires a separate ActionLicense.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"ResidualProjection\",\n      \"role\": \"Effect-class R candidate/check: deterministic residual projection with explicit discarded-information evidence\",\n      \"version\": \"2.0\",\n      \"classification\": \"operator\",\n      \"effect_class_target\": \"R\",\n      \"effect_class_authority\": \"checker_only\",\n      \"depends_on\": [\n        \"FixedLayerOperatorAlgebra\",\n        \"CarrierContract\",\n        \"ObstructionContract\"\n      ],\n      \"forbidden_authority\": [\n        \"Reconstructing discarded information\",\n        \"Certifying that discarded information was irrelevant without evidence\",\n        \"Executing state transitions\",\n        \"Evaluating admissibility\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"WitnessEnvelope\",\n        \"CertificateEnvelope\"\n      ],\n      \"supports_downstream\": [\n        \"LicensingBoundary\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_obstruction_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "original_paths": [
