gruentOn\n    holds (the property DeltaFactor::apply relies on).\n  lean_name: OmegaCore.PrimitiveDifferenceFinite.deltaFactorOn_classOf_classOf\n  status: lean_source_missing\n  prior_status: proved_in_lean\n  axioms: axiom-free\n- id: PD-L7\n  theorem: 'Finite LGGR pair-obstruction on the sub-carrier {x // S x}: φ descends\n    but the pair (φ,ψ) does not — soundness of the Rust local_green_global_red checker\n    (general thm + witness form).'\n  lean_name: OmegaCore.PrimitiveDifferenceFinite.localGreenGlobalRedOn_pair_obstruction\n    (+ localGreenGlobalRedOn_pair_witness)\n  status: lean_source_missing\n  prior_status: proved_in_lean\n  axioms: '[Quot.sound]'\nnotes:\n- This file is below omega_homological. Homology may depend on PrimitiveDifference;\n  PrimitiveDifference must not depend on homology.\n- This file is a finite computational shadow of the CORE Lean primitive difference\n  kernel, not the full Lean file (see lean_anchor.not_yet_modeled).\n- This file creates no authority, no transition license, no terminal status, and no\n  functional measurement.\n- Boolean/Result checks are evidence over the declared finite domain. They are not\n  global Lean theorems over arbitrary Carrier unless bridged by a finite-domain Lean\n  proof (PD-L4/L5/L6).\n- Enforcement is DEFERRED and is build.rs + compile-time macros, not CI (operator\n  ruling 2026-06-16). This contract is diagnostic for now.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - os:base_legacy_contract\n",
