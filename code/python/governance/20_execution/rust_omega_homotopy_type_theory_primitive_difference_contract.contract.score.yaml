      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"rust:omega_homotopy_type_theory:primitive_difference\",\n  \"kind\": \"rust_file_contract\",\n  \"name\": \"Primitive Difference Finite Quotient Kernel\",\n  \"version\": \"1.0.0\",\n  \"crate\": \"omega_homotopy_type_theory\",\n  \"file\": \"crates_rs/omega_homotopy_type_theory/src/primitive_difference.rs\",\n  \"module_path\": \"omega_homotopy_type_theory::primitive_difference\",\n  \"role\": \"canonical_primitive_difference_kernel\",\n  \"status\": \"active_provisional\",\n  \"authority_effect\": \"EvidenceOnly\",\n  \"transition_authority\": \"none\",\n  \"description\": \"Finite Rust implementation of the CORE PrimitiveDifference quotient/descent kernel. It models a primitive difference δ : A -> A -> B with a Zero predicate, checks that ZeroRel(x,y) := Zero(δ(x,y)) is an equivalence over a declared finite domain, constructs finite quotient-class representatives, checks finite DeltaCongruent, and exposes the finite computational shadow of the Lean theorem deltaFactor_exists_iff_deltaCongruent. It does not compute homology, functionals, authority, lift policy, replay, or engine execution. It is below homology.\\n\",\n  \"placement\": {\n    \"current_home\": \"omega_homotopy_type_theory (provisional — quotient/setoid/type-level primitive)\",\n    \"long_term_home\": \"a root primitive crate, e.g. omega_core::difference / omega_primitive_difference\",\n    \"dependency_law\": \"primitive_difference <- homological <- functional <- certifier/replay/runner (never the reverse)\"\n  },\n  \"lean_anchor\": {\n    \"file\": \"lean4/PrimitiveDifference.lean\",\n    \"repointed_from\": \"omega_engine/lean4/…/OmegaCosmology/Primitives/PrimitiveDifference.lean (never present in this repository)\",\n    \"in_tree_build\": \"Root `PrimitiveDifference` of lean_lib MssnSnTower in lean4/lakefile.lean (leanprover/lean4:v4.34.0); core Lean, no imports.\",\n    \"replay\": \"2026-09-29: compiled with Lean 4.34.0, exit 0. Every name under modeled_definitions and not_yet_modeled is declared here under OmegaCore / OmegaCore.PrimitiveDifference. zeroRel_equivalence is axiom-free; deltaFactor_exists_iff_deltaCongruent, deltaFactor_no_factor_of_not_deltaCongruent and localGreenGlobalRed_pair_obstruction print axioms [Quot.sound].\\n\",\n    \"missing_namespace\": \"OmegaCore.PrimitiveDifferenceFinite (PD-L4..PD-L7) is declared in no .lean file in this repository or at any branch or pull-request tip of its remote, and no file named PrimitiveDifferenceFinite* appears in its history (checked 2026-09-29). Those obligations keep their theorem text; their earlier proved_in_lean status and axiom lists are kept as prior_status / axioms but cannot be replayed here.\\n\",\n    \"modeled_definitions\": [\n      \"PrimitiveDifference\",\n      \"ZeroRel\",\n      \"zeroRel_equivalence\",\n      \"ResidualQuotient\",\n      \"classOf\",\n      \"DeltaCongruent\",\n      \"deltaFactor\",\n      \"deltaFactor_exists_iff_deltaCongruent\",\n      \"deltaFactor_no_factor_of_not_deltaCongruent\",\n      \"InvariantCongruent\",\n      \"localGreenGlobalRed_pair_obstruction\"\n    ],\n    \"not_yet_modeled\": [\n      \"DeltaCongruentMod\",\n      \"deltaFactorMod\",\n      \"invariantFactor\",\n      \"pair invariant factorization (factored pair observable accessor)\",\n      \"InvariantCongruentMod\",\n      \"PointedPrimitiveDifference\",\n      \"QuotientCompatiblePrimitiveDifference\"\n    ]\n  },\n  \"owns\": [\n    \"primitive_difference_trait\",\n    \"zero_relation\",\n    \"finite_zero_law_check\",\n    \"finite_residual_quotient_representatives\",\n    \"finite_class_of\",\n    \"finite_delta_congruence_check\",\n    \"finite_delta_descent_decision\",\n    \"finite_delta_factor_access_when_congruent\",\n    \"finite_observable_descent_check\",\n    \"finite_pair_congruence_check\",\n    \"finite_local_global_pair_obstruction_witness\"\n  ],\n  \"does_not_own\": [\n    \"cochain_complex\",\n    \"homology\",\n    \"cohomology\",\n    \"H0\",\n    \"H1\",\n    \"d0\",\n    \"d1\",\n    \"d1d0_zero\",\n    \"phi1\",\n    \"gamma2\",\n    \"r_cl\",\n    \"xi\",\n    \"trichotomy\",\n    \"authority_minting\",\n    \"terminalization\",\n    \"certification\",\n    \"replay\",\n    \"lift_policy\",\n    \"engine_execution\",\n    \"pipeline_scheduling\",\n    \"operator_algebra\",\n    \"operad_generation\",\n    \"evaluator_policy\"\n  ],\n  \"may_call\": [\n    \"std\",\n    \"core\",\n    \"alloc\"\n  ],\n  \"must_not_call\": [\n    \"omega_functional\",\n    \"omega_homological\",\n    \"omega_certifiers\",\n    \"omega_replay\",\n    \"omega_lifts\",\n    \"omega_id_run\",\n    \"omega_pipeline\",\n    \"omega_engines\"\n  ],\n  \"rules\": {\n    \"mutation\": \"local_data_construction_only\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"authority_minting\": \"forbidden\",\n    \"terminalize\": \"forbidden\",\n    \"certify_authority\": \"forbidden\",\n    \"execute_transition\": \"forbidden\",\n    \"lift_policy\": \"forbidden\",\n    \"search\": \"forbidden\",\n    \"runtime_orchestration\": \"forbidden\",\n    \"finite_domain_scope_required\": true,\n    \"quotient_operations_require_validated_zero_laws\": true,\n    \"delta_factor_requires_delta_congruence\": true\n  },\n  \"exactness\": {\n    \"certified_outputs_must_be_exact\": true,\n    \"f64_allowed\": false,\n    \"f32_allowed\": false,\n    \"approximate_tolerance_allowed\": false,\n    \"finite_domain_required\": true\n  },\n  \"outputs\": {\n    \"allowed\": [\n      \"ZeroLawWitness\",\n      \"DeltaCongruenceWitness\",\n      \"QuotientClass\",\n      \"ValidatedFiniteCarrier\",\n      \"DeltaFactor\",\n      \"PrimitiveDifferenceError\"\n    ],\n    \"forbidden\": [\n      \"CertifiedAuthority\",\n      \"AuthorityEffect::Authorize\",\n      \"ExactRepair\",\n      \"CheckedPacket\",\n      \"ActionLicense\",\n      \"StateTransition\"\n    ]\n  },\n  \"forbidden_substrings\": [\n    \"Phi1Functional\",\n    \"Gamma2Functional\",\n    \"XiFunctional\",\n    \"classify_exact\",\n    \"CertifiedAuthority\",\n    \"authority_from_outcome_f13\",\n    \"terminalize\",\n    \"mint_authority\",\n    \"AuthorityEffect::Authorize\",\n    \"ExactRepair\",\n    \"LiftCandidate\",\n    \"f64\",\n    \"f32\"\n  ],\n  \"required_substrings\": [\n    \"trait PrimitiveDifference\",\n    \"fn delta\",\n    \"fn zero\",\n    \"zero_rel\",\n    \"validate_zero_laws\",\n    \"delta_congruent\",\n    \"observable_descends_on_domain\",\n    \"local_green_global_red\"\n  ],\n  \"required_types\": [\n    \"PrimitiveDifference\",\n    \"FiniteCarrier\",\n    \"ValidatedFiniteCarrier\",\n    \"QuotientClass\",\n    \"PrimitiveDifferenceError\",\n    \"DeltaFactor\"\n  ],\n  \"required_tests\": [\n    \"bool_all_zero_nonconstant_has_no_factorization\",\n    \"parity_difference_descends\",\n    \"zero_rel_not_reflexive_rejected\",\n    \"zero_rel_not_symmetric_rejected\",\n    \"zero_rel_not_transitive_rejected\",\n    \"delta_congruence_counterexample_reported\",\n    \"delta_factor_returns_same_value_for_representatives\",\n    \"quotient_class_is_opaque_and_well_formed\",\n    \"finite_domain_scope_not_global_claim\",\n    \"class_of_index_is_domain_scoped\",\n    \"cross_carrier_quotient_class_rejected\",\n    \"observable_descends_iff_congruent_on_domain\",\n    \"lggr_local_green_global_red_pair_obstruction\",\n    \"lggr_both_descend_pair_descends\"\n  ],\n  \"import_purity\": {\n    \"note\": \"Enforced structurally: the module has no `use` of any sibling crate (pure std/core).\"\n  },\n  \"lean_obligations\": [\n    {\n      \"id\": \"PD-L0\",\n      \"theorem\": \"ZeroRel equivalence follows from zero_refl, zero_symm, and zero_trans.\",\n      \"lean_name\": \"zeroRel_equivalence\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"PD-L1\",\n      \"theorem\": \"ResidualQuotient is the quotient by ZeroRel.\",\n      \"lean_name\": \"ResidualQuotient\",\n      \"status\": \"defined_in_lean\"\n    },\n    {\n      \"id\": \"PD-L2\",\n      \"theorem\": \"Delta factorization exists iff DeltaCongruent.\",\n      \"lean_name\": \"deltaFactor_exists_iff_deltaCongruent\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"PD-L3\",\n      \"theorem\": \"If DeltaCongruent fails, no delta factorization exists.\",\n      \"lean_name\": \"deltaFactor_no_factor_of_not_deltaCongruent\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"PD-L4\",\n      \"theorem\": \"Delta factorization exists on the finite sub-carrier {x // S x} iff DeltaCongruentOn — soundness of the Rust delta_factors_through_quotient_on_domain decision.\",\n      \"lean_name\": \"OmegaCore.PrimitiveDifferenceFinite.deltaFactorOn_exists_iff_deltaCongruentOn\",\n      \"status\": \"lean_source_missing\",\n      \"prior_status\": \"proved_in_lean\",\n      \"axioms\": \"[Quot.sound]\"\n    },\n    {\n      \"id\": \"PD-L5\",\n      \"theorem\": \"Finite Rust quotient-class representatives (reps / residual_quotient) enumerate exactly the Lean quotient classes of the declared finite domain (a List): the classOf-mapped reps are Nodup (each class at most once) and their membership coincides with the domain's classes (onto). No Fintype needed — the finite domain IS the list.\",\n      \"lean_name\": \"OmegaCore.PrimitiveDifferenceFinite.residualQuotient_reps_enumerate (via classReps + classReps_classOf_nodup / classReps_classOf_mem_iff)\",\n      \"status\": \"lean_source_missing\",\n      \"prior_status\": \"proved_in_lean\",\n      \"axioms\": \"[propext, Quot.sound]\"\n    },\n    {\n      \"id\": \"PD-L6\",\n      \"theorem\": \"The descended delta is representative-independent when DeltaCongruentOn holds (the property DeltaFactor::apply relies on).\",\n      \"lean_name\": \"OmegaCore.PrimitiveDifferenceFinite.deltaFactorOn_classOf_classOf\",\n      \"status\": \"lean_source_missing\",\n      \"prior_status\": \"proved_in_lean\",\n      \"axioms\": \"axiom-free\"\n    },\n    {\n      \"id\": \"PD-L7\",\n      \"theorem\": \"Finite LGGR pair-obstruction on the sub-carrier {x // S x}: φ descends but the pair (φ,ψ) does not — soundness of the Rust local_green_global_red checker (general thm + witness form).\",\n      \"lean_name\": \"OmegaCore.PrimitiveDifferenceFinite.localGreenGlobalRedOn_pair_obstruction (+ localGreenGlobalRedOn_pair_witness)\",\n      \"status\": \"lean_source_missing\",\n      \"prior_status\": \"proved_in_lean\",\n      \"axioms\": \"[Quot.sound]\"\n    }\n  ],\n  \"notes\": [\n    \"This file is below omega_homological. Homology may depend on PrimitiveDifference; PrimitiveDifference must not depend on homology.\",\n    \"This file is a finite computational shadow of the CORE Lean primitive difference kernel, not the full Lean file (see lean_anchor.not_yet_modeled).\",\n    \"This file creates no authority, no transition license, no terminal status, and no functional measurement.\",\n    \"Boolean/Result checks are evidence over the declared finite domain. They are not global Lean theorems over arbitrary Carrier unless bridged by a finite-domain Lean proof (PD-L4/L5/L6).\",\n    \"Enforcement is DEFERRED and is build.rs + compile-time macros, not CI (operator ruling 2026-06-16). This contract is diagnostic for now.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ]\n  }\n}\n",
