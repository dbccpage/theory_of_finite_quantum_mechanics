      "raw_utf8": "schema_version: 1.0.0\ncontract_id: rust:omega_homotopy_type_theory:primitive_difference\nkind: rust_file_contract\nname: Primitive Difference Finite Quotient Kernel\nversion: 1.0.0\ncrate: omega_homotopy_type_theory\nfile: crates_rs/omega_homotopy_type_theory/src/primitive_difference.rs\nmodule_path: omega_homotopy_type_theory::primitive_difference\nrole: canonical_primitive_difference_kernel\nstatus: active_provisional\nauthority_effect: EvidenceOnly\ntransition_authority: none\ndescription: 'Finite Rust implementation of the CORE PrimitiveDifference quotient/descent\n  kernel. It models a primitive difference δ : A -> A -> B with a Zero predicate,\n  checks that ZeroRel(x,y) := Zero(δ(x,y)) is an equivalence over a declared finite\n  domain, constructs finite quotient-class representatives, checks finite DeltaCongruent,\n  and exposes the finite computational shadow of the Lean theorem deltaFactor_exists_iff_deltaCongruent.\n  It does not compute homology, functionals, authority, lift policy, replay, or engine\n  execution. It is below homology.\n\n  '\nplacement:\n  current_home: omega_homotopy_type_theory (provisional — quotient/setoid/type-level\n    primitive)\n  long_term_home: a root primitive crate, e.g. omega_core::difference / omega_primitive_difference\n  dependency_law: primitive_difference <- homological <- functional <- certifier/replay/runner\n    (never the reverse)\nlean_anchor:\n  file: lean4/PrimitiveDifference.lean\n  repointed_from: omega_engine/lean4/…/OmegaCosmology/Primitives/PrimitiveDifference.lean\n    (never present in this repository)\n  in_tree_build: Root `PrimitiveDifference` of lean_lib MssnSnTower in lean4/lakefile.lean\n    (leanprover/lean4:v4.34.0); core Lean, no imports.\n  replay: '2026-09-29: compiled with Lean 4.34.0, exit 0. Every name under modeled_definitions\n    and not_yet_modeled is declared here under OmegaCore / OmegaCore.PrimitiveDifference.\n    zeroRel_equivalence is axiom-free; deltaFactor_exists_iff_deltaCongruent, deltaFactor_no_factor_of_not_deltaCongruent\n    and localGreenGlobalRed_pair_obstruction print axioms [Quot.sound].\n\n    '\n  missing_namespace: 'OmegaCore.PrimitiveDifferenceFinite (PD-L4..PD-L7) is declared\n    in no .lean file in this repository or at any branch or pull-request tip of its\n    remote, and no file named PrimitiveDifferenceFinite* appears in its history (checked\n    2026-09-29). Those obligations keep their theorem text; their earlier proved_in_lean\n    status and axiom lists are kept as prior_status / axioms but cannot be replayed\n    here.\n\n    '\n  modeled_definitions:\n  - PrimitiveDifference\n  - ZeroRel\n  - zeroRel_equivalence\n  - ResidualQuotient\n  - classOf\n  - DeltaCongruent\n  - deltaFactor\n  - deltaFactor_exists_iff_deltaCongruent\n  - deltaFactor_no_factor_of_not_deltaCongruent\n  - InvariantCongruent\n  - localGreenGlobalRed_pair_obstruction\n  not_yet_modeled:\n  - DeltaCongruentMod\n  - deltaFactorMod\n  - invariantFactor\n  - pair invariant factorization (factored pair observable accessor)\n  - InvariantCongruentMod\n  - PointedPrimitiveDifference\n  - QuotientCompatiblePrimitiveDifference\nowns:\n- primitive_difference_trait\n- zero_relation\n- finite_zero_law_check\n- finite_residual_quotient_representatives\n- finite_class_of\n- finite_delta_congruence_check\n- finite_delta_descent_decision\n- finite_delta_factor_access_when_congruent\n- finite_observable_descent_check\n- finite_pair_congruence_check\n- finite_local_global_pair_obstruction_witness\ndoes_not_own:\n- cochain_complex\n- homology\n- cohomology\n- H0\n- H1\n- d0\n- d1\n- d1d0_zero\n- phi1\n- gamma2\n- r_cl\n- xi\n- trichotomy\n- authority_minting\n- terminalization\n- certification\n- replay\n- lift_policy\n- engine_execution\n- pipeline_scheduling\n- operator_algebra\n- operad_generation\n- evaluator_policy\nmay_call:\n- std\n- core\n- alloc\nmust_not_call:\n- omega_functional\n- omega_homological\n- omega_certifiers\n- omega_re