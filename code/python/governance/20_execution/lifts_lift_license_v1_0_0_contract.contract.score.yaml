          "Committed",
          "Recorded"
        ],
        "separation_law": "Licensed and Committed are distinct. Licensed authorizes via LicensingBoundary. Committed changes state through Engine. Recorded writes Trace via Runtime Trace Coordinator.\n",
        "contract_law": "LiftLicense authorizes. Engine commits already-computed ProposedCarrier. Runtime Trace Coordinator assembles and persists canonical TraceArtifacts.\n"
      },
