    "doctrine": {
      "summary": "This contract defines the LiftLicense boundary. LiftLicense is a specialized ActionLicense profile for structural carrier ascent (transition_kind = CarrierLift). It authorizes only the declared carrier/schema transition and binds the exact already-computed ProposedCarrier hash. LiftLicense does not execute, mutate, repair, certify itself, terminalize, or transfer across scope. Engine alone commits the exact licensed ProposedCarrier.\n",
      "non_role": [
        "execution",
        "state mutation",
        "self-licensing",
        "self-certification",
        "llm candidate license generation",
        "lift without checked obstruction",
        "lift without context witness",
        "lift without repair exhaustion evidence",
        "lift without delta-minimality evidence",
        "lift without replay manifest",
        "authority above attached evidence"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, license lifts, prove minimality, or upgrade evidence authority. An LLM may propose MetaLiftRequest candidates, LiftPlan candidates, or evidence candidates, but those proposals are EvidenceOnly. ONLY the LicensingBoundary constructs LiftLicense objects.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "LiftLicense authority MUST NOT exceed the authority of its attached evidence, declared checker capability, MetaLiftJudgment decision, and governing contract. A LiftLicense authorizes only the specific structural ascent described by its checked contract and evidence references.\n"
      },
      "classification": {
        "subsystem": "Obstruction Resolution / Structural Ascent",
        "role": "Scoped ActionLicense for structural ascent authorization.",
        "classification": "Lifts layer -- licensing boundary."
      },
      "governing_rule": "No structural lift C_n -> C_{n+1} or carrier/schema expansion may occur without a replayable LiftLicense. A LiftLicense authorizes the Engine to commit the declared transition. It is not the transition, does not mutate the carrier, and does not execute itself. The exact pre-carrier and post-carrier (ProposedCarrier) hashes MUST match the licensed contract.\n",
      "exact_commit_invariant": "hash(committed carrier) == hash(licensed ProposedCarrier) == proposed_carrier_hash.\n",
      "artifact_authority_ladder": {
        "levels": [
          "Generated",
          "Parsed",
