roposedCarrier.\n\n    '\n  non_role:\n  - execution\n  - state mutation\n  - self-licensing\n  - self-certification\n  - llm candidate license generation\n  - lift without checked obstruction\n  - lift without context witness\n  - lift without repair exhaustion evidence\n  - lift without delta-minimality evidence\n  - lift without replay manifest\n  - authority above attached evidence\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\n      terminalize, authorize transitions, execute transitions, license lifts, prove\n      minimality, or upgrade evidence authority. An LLM may propose MetaLiftRequest\n      candidates, LiftPlan candidates, or evidence candidates, but those proposals\n      are EvidenceOnly. ONLY the LicensingBoundary constructs LiftLicense objects.\n\n      '\n  certificate_authority_bound:\n    doctrine: 6\n    text: 'LiftLicense authority MUST NOT exceed the authority of its attached evidence,\n      declared checker capability, MetaLiftJudgment decision, and governing contract.\n      A LiftLicense authorizes only the specific structural ascent described by its\n      checked contract and evidence references.\n\n      '\n  classification:\n    subsystem: Obstruction Resolution / Structural Ascent\n    role: Scoped ActionLicense for structural ascent authorization.\n    classification: Lifts layer -- licensing boundary.\n  governing_rule: 'No structural lift C_n -> C_{n+1} or carrier/schema expansion may\n    occur without a replayable LiftLicense. A LiftLicense authorizes the Engine to\n    commit the declared transition. It is not the transition, does not mutate the\n    carrier, and does not execute itself. The exact pre-carrier and post-carrier (ProposedCarrier)\n    hashes MUST match the licensed contract.\n\n    '\n  exact_commit_invariant: 'hash(committed carrier) == hash(licensed ProposedCarrier)\n    == proposed_carrier_hash.\n\n    '\n  artifact_authority_ladder:\n    levels:\n    - Generated\n    - Parsed\n    - Checked\n    - Evaluated\n    - Licensed\n    - Committed\n    - Recorded\n    separation_law: 'Licensed and Committed are distinct. Licensed authorizes via\n      LicensingBoundary. Committed changes state through Engine. Recorded writes Trace\n      via Runtime Trace Coordinator.\n\n      '\n    contract_law: 'LiftLicense authorizes. Engine commits already-computed ProposedCarrier.\n      Runtime Trace Coordinator assembles and persists canonical TraceArtifacts.\n\n      '\n  structural_representation:\n    lift_license:\n      struct_name: LiftLicense\n      specializes: ActionLicense\n      fields:\n      - name: license_id\n        type: LiftLicenseId\n      - name: transition_kind\n        type: String\n        default: CarrierLift\n      - name: level\n        type: LevelRef\n      - name: source_carrier_ref\n        type: CarrierRef\n      - name: expected_pre_carrier_hash\n        type: Hash256\n      - name: expected_pre_carrier_version\n        type: String\n      - name: target_carrier_schema_ref\n        type: CarrierSchemaRef\n      - name: lift_plan_ref\n        type: PlanId\n      - name: proposed_carrier_ref\n        type: ProposedCarrierRef\n      - name: proposed_carrier_hash\n        type: Hash256\n      - name: meta_lift_judgment_ref\n        type: JudgmentId\n      - name: checked_obstruction_ref\n        type: ObstructionId\n      - name: checked_packet_ref\n        type: CheckedPacketRef\n      - name: context_witness_ref\n        type: WitnessId\n      - name: repair_exhaustion_certificate\n        type: CertificateId\n      - name: persistence_certificate\n        type: CertificateId\n      - name: minimality_certificate\n        type: CertificateId\n      - name: constructor_set_hash\n        type: Hash256\n      - name: delta\n        type: CarrierExtensionDelta\n      - name: delta_minimality_ref\n        type: CertificateId\n      - name: after_manifest_ref\n        type: CarrierM