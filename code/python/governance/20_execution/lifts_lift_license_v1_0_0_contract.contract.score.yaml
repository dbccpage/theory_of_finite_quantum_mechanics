      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:lifts:lift_license:v1.0.0\",\n  \"title\": \"LiftLicense\",\n  \"kind\": \"lift_contract\",\n  \"status\": \"active_doctrine\",\n  \"layer\": \"08_lifts\",\n  \"role\": \"LiftLicense\",\n  \"descriptor\": {\n    \"authority_effect\": \"authorizes_transition\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"MetaLiftJudgment\",\n        \"Lift\",\n        \"Obstruction\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"ReplayKernel\",\n        \"Trace\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"MetaLiftJudgment\",\n        \"Lift\",\n        \"Obstruction\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"ReplayKernel\",\n        \"Trace\"\n      ],\n      \"specializes\": \"ActionLicense\",\n      \"profile_type\": \"ActionLicense[transition_kind = CarrierLift]\",\n      \"authority_layer\": \"Action\",\n      \"replay_certificates\": [\n        \"schema_hash\",\n        \"license_hash\",\n        \"proposed_carrier_hash\",\n        \"replay_manifest_ref\"\n      ]\n    },\n    \"constraints\": {\n      \"scope_bound\": true,\n      \"non_transferable\": true,\n      \"authority_does_not_exceed_evidence\": true,\n      \"mutation_forbidden\": true,\n      \"exact_proposed_carrier_bound\": true\n    },\n    \"replay\": {\n      \"required\": [\n        \"replayable post-lift manifest\",\n        \"replay manifest ref\",\n        \"license hash\",\n        \"proposed carrier hash\"\n      ]\n    },\n    \"witnesses\": {\n      \"required\": [\n        \"checked obstruction\",\n        \"context witness\",\n        \"repair exhaustion evidence\",\n        \"minimality certificate\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the LiftLicense boundary. LiftLicense is a specialized ActionLicense profile for structural carrier ascent (transition_kind = CarrierLift). It authorizes only the declared carrier/schema transition and binds the exact already-computed ProposedCarrier hash. LiftLicense does not execute, mutate, repair, certify itself, terminalize, or transfer across scope. Engine alone commits the exact licensed ProposedCarrier.\\n\",\n    \"non_role\": [\n      \"execution\",\n      \"state mutation\",\n      \"self-licensing\",\n      \"self-certification\",\n      \"llm candidate license generation\",\n      \"lift without checked obstruction\",\n      \"lift without context witness\",\n      \"lift without repair exhaustion evidence\",\n      \"lift without delta-minimality evidence\",\n      \"lift without replay manifest\",\n      \"authority above attached evidence\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, license lifts, prove minimality, or upgrade evidence authority. An LLM may propose MetaLiftRequest candidates, LiftPlan candidates, or evidence candidates, but those proposals are EvidenceOnly. ONLY the LicensingBoundary constructs LiftLicense objects.\\n\"\n    },\n    \"certificate_authority_bound\": {\n      \"doctrine\": 6,\n      \"text\": \"LiftLicense authority MUST NOT exceed the authority of its attached evidence, declared checker capability, MetaLiftJudgment decision, and governing contract. A LiftLicense authorizes only the specific structural ascent described by its checked contract and evidence references.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Obstruction Resolution / Structural Ascent\",\n      \"role\": \"Scoped ActionLicense for structural ascent authorization.\",\n      \"classification\": \"Lifts layer -- licensing boundary.\"\n    },\n    \"governing_rule\": \"No structural lift C_n -> C_{n+1} or carrier/schema expansion may occur without a replayable LiftLicense. A LiftLicense authorizes the Engine to commit the declared transition. It is not the transition, does not mutate the carrier, and does not execute itself. The exact pre-carrier and post-carrier (ProposedCarrier) hashes MUST match the licensed contract.\\n\",\n    \"exact_commit_invariant\": \"hash(committed carrier) == hash(licensed ProposedCarrier) == proposed_carrier_hash.\\n\",\n    \"artifact_authority_ladder\": {\n      \"levels\": [\n        \"Generated\",\n        \"Parsed\",\n        \"Checked\",\n        \"Evaluated\",\n        \"Licensed\",\n        \"Committed\",\n        \"Recorded\"\n      ],\n      \"separation_law\": \"Licensed and Committed are distinct. Licensed authorizes via LicensingBoundary. Committed changes state through Engine. Recorded writes Trace via Runtime Trace Coordinator.\\n\",\n      \"contract_law\": \"LiftLicense authorizes. Engine commits already-computed ProposedCarrier. Runtime Trace Coordinator assembles and persists canonical TraceArtifacts.\\n\"\n    },\n    \"structural_representation\": {\n      \"lift_license\": {\n        \"struct_name\": \"LiftLicense\",\n        \"specializes\": \"ActionLicense\",\n        \"fields\": [\n          {\n            \"name\": \"license_id\",\n            \"type\": \"LiftLicenseId\"\n          },\n          {\n            \"name\": \"transition_kind\",\n            \"type\": \"String\",\n            \"default\": \"CarrierLift\"\n          },\n          {\n            \"name\": \"level\",\n            \"type\": \"LevelRef\"\n          },\n          {\n            \"name\": \"source_carrier_ref\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"expected_pre_carrier_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"expected_pre_carrier_version\",\n            \"type\": \"String\"\n          },\n          {\n            \"name\": \"target_carrier_schema_ref\",\n            \"type\": \"CarrierSchemaRef\"\n          },\n          {\n            \"name\": \"lift_plan_ref\",\n            \"type\": \"PlanId\"\n          },\n          {\n            \"name\": \"proposed_carrier_ref\",\n            \"type\": \"ProposedCarrierRef\"\n          },\n          {\n            \"name\": \"proposed_carrier_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"meta_lift_judgment_ref\",\n            \"type\": \"JudgmentId\"\n          },\n          {\n            \"name\": \"checked_obstruction_ref\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"checked_packet_ref\",\n            \"type\": \"CheckedPacketRef\"\n          },\n          {\n            \"name\": \"context_witness_ref\",\n            \"type\": \"WitnessId\"\n          },\n          {\n            \"name\": \"repair_exhaustion_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"persistence_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"minimality_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"constructor_set_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"delta\",\n            \"type\": \"CarrierExtensionDelta\"\n          },\n          {\n            \"name\": \"delta_minimality_ref\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"after_manifest_ref\",\n            \"type\": \"CarrierManifestRef\"\n          },\n          {\n            \"name\": \"replay_manifest_ref\",\n            \"type\": \"ReplayManifestId\"\n          },\n          {\n            \"name\": \"replay_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"evidence_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"expiry\",\n            \"type\": \"Option<Epoch>\"\n          },\n          {\n            \"name\": \"license_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"AuthorizesTransition\"\n          }\n        ]\n      }\n    },\n    \"execution_boundary\": \"LiftLicense is authorized by LicensingBoundary only after MetaLiftJudgment emits RequestsDecision. Engine commits the exact ProposedCarrier matching proposed_carrier_hash. Runtime Trace Coordinator assembles and persists canonical TraceArtifacts.\\n\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
