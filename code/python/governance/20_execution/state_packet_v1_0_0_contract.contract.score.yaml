      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:state:packet:v1.0.0\",\n  \"title\": \"Packet\",\n  \"kind\": \"state_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"01_state\",\n  \"role\": \"Packet\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Carrier\",\n        \"Boundary\",\n        \"TypeAndKind\",\n        \"GlobalContractTaxonomy\",\n        \"SymbolGame\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Packet boundary.\\n\\nA Packet is a typed, hashed transport payload wrapper for Symbol Game payloads, observer\\ndiagnostics, and candidate responses. It may contain structured mathematical intent, diagnostic\\nevidence, or proposed actions, but it does not itself execute or authorize any action.\\n\\nA packet proves at most transport integrity, grammar/schema identity, and provenance linkage after\\nchecking. It does not prove semantic truth.\\n\\nPackets do not have agency. They do not propagate themselves, certify, evaluate, or execute. The\\npipeline propagates packets; the packet is passive cargo.\\n\",\n    \"non_role\": [\n      \"execution\",\n      \"evaluation\",\n      \"certification\",\n      \"mutation\",\n      \"authority upgrade\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\\nauthorize transitions, execute transitions, or upgrade evidence authority.\\n\\nLLM output may be wrapped in a Packet, but Packet wrapping does not upgrade the authority of\\nLLM output.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Symbol Game / Observer Diagnostics\",\n      \"role\": \"Typed transport payload wrapper.\",\n      \"classification\": \"State layer -- passive cargo.\"\n    },\n    \"structural_representation\": {\n      \"packet\": {\n        \"struct_name\": \"Packet\",\n        \"fields\": [\n          {\n            \"name\": \"packet_id\",\n            \"type\": \"PacketId\"\n          },\n          {\n            \"name\": \"packet_kind\",\n            \"type\": \"PacketKind\"\n          },\n          {\n            \"name\": \"payload\",\n            \"type\": \"PacketPayload\"\n          },\n          {\n            \"name\": \"payload_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"packet_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"grammar_id\",\n            \"type\": \"GrammarId\"\n          },\n          {\n            \"name\": \"schema_ref\",\n            \"type\": \"SchemaRef\"\n          },\n          {\n            \"name\": \"schema_version\",\n            \"type\": \"SchemaVersion\"\n          },\n          {\n            \"name\": \"signature\",\n            \"type\": \"Option<PacketSignature>\"\n          },\n          {\n            \"name\": \"provenance\",\n            \"type\": \"PacketProvenance\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"packet_kind\": {\n        \"enum_name\": \"PacketKind\",\n        \"variants\": [\n          \"SymbolGameMove\",\n          \"MathIntent\",\n          \"GameAction\",\n          \"ObserverDiagnostic\",\n          \"CandidateResponse\"\n        ]\n      },\n      \"packet_provenance\": {\n        \"struct_name\": \"PacketProvenance\",\n        \"fields\": [\n          {\n            \"name\": \"source\",\n            \"type\": \"ProvenanceSource\"\n          },\n          {\n            \"name\": \"created_at\",\n            \"type\": \"Timestamp\"\n          },\n          {\n            \"name\": \"trace_ref\",\n            \"type\": \"Option<TraceRef>\"\n          }\n        ]\n      },\n      \"signature_requirement\": {\n        \"enum_name\": \"SignatureRequirement\",\n        \"variants\": [\n          \"Required\",\n          \"Optional\",\n          \"Forbidden\"\n        ]\n      },\n      \"parsed_packet\": {\n        \"struct_name\": \"ParsedPacket\",\n        \"fields\": [\n          {\n            \"name\": \"packet\",\n            \"type\": \"Packet\"\n          },\n          {\n            \"name\": \"parsed_ast_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked_packet\": {\n        \"struct_name\": \"CheckedPacket\",\n        \"fields\": [\n          {\n            \"name\": \"parsed_packet_ref\",\n            \"type\": \"ParsedPacketRef\"\n          },\n          {\n            \"name\": \"check_refs\",\n            \"type\": \"Vec<CheckRef>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      }\n    },\n    \"authority_boundary\": {\n      \"may\": [\n        \"Wrap a typed payload for transport\",\n        \"Carry a payload hash and signature for integrity verification\",\n        \"Reference a trace for provenance\"\n      ],\n      \"must_not\": [\n        \"Execute any computation\",\n        \"Evaluate admissibility\",\n        \"Certify anything\",\n        \"Mutate carrier state\",\n        \"Upgrade evidence authority\",\n        \"Self-propagate (the pipeline propagates packets)\"\n      ]\n    },\n    \"admissibility_condition\": [\n      \"It parses correctly according to the symbolic grammar of the target S(n) context level\",\n      \"If a signature is required by packet kind, source, or policy, it must verify. Unsigned packet kinds must explicitly declare that signature is not required.\",\n      \"Grammar ID and schema version are declared\",\n      \"Payload uses allowed alphabet\",\n      \"Payload hash matches actual payload content\"\n    ],\n    \"refusal_condition\": {\n      \"enum_name\": \"PacketRefusal\",\n      \"note\": \"Any malformed, out-of-order, unauthorized, or schema-invalid packet payload is refused as\\nPacketRefusal.\\n\\nIf the packet attempted to request an unlicensed mutation, a later operator or transition\\nclassifier may classify the attempted mutation as M = refused mutation. The packet refusal\\nitself is not an operator effect-class assignment.\\n\",\n      \"variants\": [\n        \"Malformed\",\n        \"OutOfOrder\",\n        \"UnauthorizedPayload\",\n        \"UnlicensedTransitionRequest\",\n        \"PayloadHashMismatch\",\n        \"PacketHashMismatch\",\n        \"GrammarViolation\",\n        \"SchemaUnknown\",\n        \"SchemaVersionMismatch\",\n        \"SchemaHashMismatch\",\n        \"UnknownPacketKind\",\n        \"PayloadKindMismatch\",\n        \"SignatureRequiredMissing\",\n        \"SignatureInvalid\",\n        \"SemanticClaimNotChecked\"\n      ]\n    },\n    \"observer_packet_specialization\": {\n      \"description\": \"An Observer Packet is a Packet with `packet_kind: ObserverDiagnostic`. It references coordinate\\nmeasurements and diagnostics observed at a specific state transition. It may carry diagnostic\\npayloads, but canonical measurements must come from the Functional / Measurement boundary.\\n\",\n      \"admissibility\": [\n        \"It contains a valid trace reference\",\n        \"Its carrier state hash matches the state at the referenced transition\",\n        \"Measurement references are checked or explicitly marked as uncertified diagnostics.\"\n      ],\n      \"refusal\": \"Refuse any Observer Packet with mismatched state hashes or uncertified measurement values presented as certified.\",\n      \"certificate_obligation\": \"The pipeline may route measurement and certificate references from Observer Packets to the\\nevaluator. The packet itself does not propagate or certify them.\\n\"\n    },\n    \"packet_witness_and_replay_obligation\": {\n      \"description\": \"Every Packet must be signed and hashed. Replay verification must reproduce identical parsed\\nAST state.\\n\",\n      \"required_replay_witness\": [\n        \"packet_id\",\n        \"packet_kind\",\n        \"payload_hash\",\n        \"packet_hash\",\n        \"grammar_id\",\n        \"schema_ref\",\n        \"schema_version\",\n        \"signature_status\",\n        \"parsed_ast_hash\",\n        \"provenance\",\n        \"source_trace_ref\"\n      ]\n    },\n    \"certificate_note\": \"CertificateKernel may seal certificates over checked evidence; this contract does not create certificates.\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"evaluate(\",\n        \"certify(\",\n        \"terminalize(\",\n        \"mutate_carrier\",\n        \"sign_certificate\",\n        \"authority_upgrade\",\n        \"self_propagate\",\n        \"promote_authority\",\n        \"semantic_truth_verified_by_packet\"\n      ]\n    },\n    \"required_tests\": [\n      \"packet_carries_no_execution_authority\",\n      \"packet_payload_hash_matches\",\n      \"packet_malformed_refused_as_packet_refusal_not_operator_m\",\n      \"packet_replay_produces_identical_ast\",\n      \"observer_packet_requires_trace_ref\",\n      \"observer_packet_state_hash_matches\",\n      \"packet_does_not_self_propagate\",\n      \"packet_default_authority_is_evidence_only\",\n      \"packet_wrapping_does_not_upgrade_llm_output\",\n      \"packet_does_not_claim_semantic_truth\",\n      \"packet_signature_requirement_is_declared\",\n      \"unsigned_packet_refused_when_signature_required\",\n      \"packet_schema_ref_is_declared\",\n      \"packet_hash_matches_canonical_packet_bytes\",\n      \"checked_packet_is_evidence_boundary_not_fact_boundary\",\n      \"observer_packet_does_not_emit_canonical_measurements\"\n    ],\n    \"canonical_invariant\": \"A Packet is passive typed transport evidence. It may carry or reference structured payloads,\\nhashes, signatures, grammar IDs, schema IDs, and provenance, but it does not execute, evaluate,\\ncertify, terminalize, propagate itself, authorize transitions, or prove semantic truth. Packet\\nwrapping never upgrades LLM output. CheckedPacket is an evidence boundary, not a fact, decision,\\nlicense, or action.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Packet\",\n      \"role\": \"Compressed transport payload wrapper for the Symbol Game and observer diagnostics\",\n      \"classification\": \"state\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"Carrier\",\n        \"Boundary\",\n        \"TypeAndKind\",\n        \"GlobalContractTaxonomy\",\n        \"SymbolGame\"\n      ],\n      \"forbidden_authority\": [\n        \"execution\",\n        \"evaluation\",\n        \"certification\",\n        \"mutation\",\n        \"authority upgrade\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"PacketEnvelope\",\n      \"referenced_output_families\": [\n        \"StructureArtifact\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_state_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "original_paths": [
