              "Degraded",
              "InvariantThreat",
              "BoundaryFailure",
              "Unknown"
            ]
          }
        ]
      },
      "flow": "Diagnostic / Measurement / Certificate refs\n-> HealthReport\n-> CheckedHealthReport when checked\n-> EvidenceEnvelope or FactEnvelope\n-> Evaluator / Policy if decision is needed\n",
