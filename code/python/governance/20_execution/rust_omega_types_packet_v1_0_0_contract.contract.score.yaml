    "laws": [
      "Passive cargo law: a packet is data. It does not execute, evaluate, certify, terminalize, or propagate itself; the pipeline propagates packets.",
      "Hash integrity law: seal recomputes both hashes and Packet's fields are private, so a packet whose hashes disagree with its bytes cannot be constructed. PacketDraft carries public fields deliberately -- it is the unsealed input, and seal derives every hash from it, so nothing a caller writes there can survive unchecked.",
      "Boundary law: identity bytes are length-delimited, so no field boundary can shift into its neighbour -- grammar_id \"ab\" with schema_ref \"c\" must not hash as \"a\" with \"bc\".",
      "No-upgrade law: sealing, parsing and checking all leave the authority effect at Uncertified. Certified requires a CertifiedAuthority, whose sole constructor demands a DescentWitness and an IsAuth token, so wrapping LLM output in a packet cannot raise it.",
      "Declaration law: grammar_id, schema_ref and schema_version are required, and the signature requirement is a property of the packet kind rather than of the caller.",
      "Observer law: an ObserverDiagnostic packet without a trace reference is refused."
    ],
    "forbidden_substrings": [
