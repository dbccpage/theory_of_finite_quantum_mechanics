      "raw_utf8": "{\n  \"schema_version\": \"omega.file_contract.v1\",\n  \"kind\": \"rust_file_contract\",\n  \"contract_id\": \"urn:omega:rust:omega_types:packet:v1.0.0\",\n  \"title\": \"Packet\",\n  \"status\": \"active\",\n  \"crate\": \"omega_types\",\n  \"file\": \"crates_rs/omega_types/src/packet.rs\",\n  \"role\": \"state\",\n  \"authority_effect\": \"none\",\n  \"evidence_ceiling\": \"LocalReplay\",\n  \"customer_claim_allowed\": false,\n  \"runtime_enforcement\": false,\n  \"implements\": \"urn:omega:state:packet:v1.0.0\",\n  \"owns\": [\n    \"the typed transport wrapper and its two hashes\",\n    \"the packet refusal taxonomy\",\n    \"the parsed and checked evidence boundaries\"\n  ],\n  \"does_not_own\": [\n    \"execution, evaluation, certification, or terminalization\",\n    \"the canonical measurement, which is the Functional / Measurement boundary\",\n    \"any authority; Certified requires a CertifiedAuthority this file cannot mint\"\n  ],\n  \"may_call\": [],\n  \"must_not\": [\n    \"execute, evaluate, certify, or terminalize\",\n    \"propagate itself\",\n    \"mint or upgrade authority\",\n    \"claim semantic truth\"\n  ],\n  \"exactness\": {\n    \"mode\": \"not_applicable\",\n    \"exact_constructor_required\": false,\n    \"approximate_modes_allowed\": false\n  },\n  \"laws\": [\n    \"Passive cargo law: a packet is data. It does not execute, evaluate, certify, terminalize, or propagate itself; the pipeline propagates packets.\",\n    \"Hash integrity law: seal recomputes both hashes and Packet's fields are private, so a packet whose hashes disagree with its bytes cannot be constructed. PacketDraft carries public fields deliberately -- it is the unsealed input, and seal derives every hash from it, so nothing a caller writes there can survive unchecked.\",\n    \"Boundary law: identity bytes are length-delimited, so no field boundary can shift into its neighbour -- grammar_id \\\"ab\\\" with schema_ref \\\"c\\\" must not hash as \\\"a\\\"