      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:obstruction:admissible_repair:v1.0.0\ntitle: AdmissibleRepair\nkind: obstruction_contract\nstatus: mathematical_wip\nlayer: 03_obstruction\nrole: AnalysisUnit\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: LocalReplay\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - Carrier\n    - Coboundary\n    - GaugeEquivalence\n    - Reducer\n    - Witness\n    - CertificateKernel\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This contract defines the AdmissibleRepair boundary.\n\n\n    AdmissibleRepair is a same-carrier local displacement candidate. A checked AdmissibleRepair\n\n    may support E = exact repair classification. A separate license is required before\n    Engine execution.\n\n    AdmissibleRepair does not lift, adapt, reinterpret, terminalize, mutate runtime\n    state, or execute.\n\n    '\n  non_role: &id002\n  - lift\n  - adapter_conversion\n  - reinterpretation\n  - semantic_repair\n  - terminalization\n  - execution\n  - transition_authorization\n  - action_licensing\n  - state_mutation\n  - candidate_ranking\n  - candidate_scoring\n  - effect_class_self_assignment\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\n\n      terminalize, authorize transitions, execute transitions, assign effect classes,\n\n      or upgrade evidence authority.\n\n\n      LLM output may propose AdmissibleRepair candidates, but those proposals are\n\n      EvidenceOnly until checked by the declared repair, replay, certificate, and\n\n      fixed-layer operator classifier/checker boundaries.\n\n      '\n  effect_class_binding:\n    doctrine: 6\n    text: 'A checked AdmissibleRepair may