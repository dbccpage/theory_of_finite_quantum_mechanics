      "core_definition": "An AdmissibleRepair is a same-carrier local displacement candidate generated by d_0 or\ndeclared gauge-equivalence/reducer action inside the current carrier. A separate license\nis required before Engine execution.\n",
      "same_carrier_law": "An AdmissibleRepair MUST preserve:\n  - carrier identity\n  - schema identity\n  - universe identity\n  - coefficient semantics\n\nSame-carrier preservation must be checked against carrier identity, schema hash, universe\nidentity, coefficient semantics, and declared boundary references.\n\nAny carrier extension, schema expansion, added generator, added context, or layer transition\nis Lift, not AdmissibleRepair.\n",
