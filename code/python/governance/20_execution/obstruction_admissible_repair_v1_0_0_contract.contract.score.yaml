        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\nterminalize, authorize transitions, execute transitions, assign effect classes,\nor upgrade evidence authority.\n\nLLM output may propose AdmissibleRepair candidates, but those proposals are\nEvidenceOnly until checked by the declared repair, replay, certificate, and\nfixed-layer operator classifier/checker boundaries.\n"
      },
      "effect_class_binding": {
        "doctrine": 6,
        "text": "A checked AdmissibleRepair may instantiate the E = exact repair effect-class in the\nfixed-layer operator algebra.\n\nA candidate AdmissibleRepair does not self-declare E authority. E classification must be\nevidence-based and produced by the fixed-layer operator classifier/checker.\n",
        "connection_to_fixed_layer_operator_algebra": "- AdmissibleRepair implements the E effect-class: a same-carrier local displacement that\n  restores a broken invariant to its canonical form.\n- The repair is exact: the post-state satisfies the invariant that the pre-state violated.\n- Composition law: E . E may normalize to E only when the composition is same-carrier,\n  invariant-preserving, replayable, and justified by an explicit RewriteLaw or certificate.\n- Candidate authority: EvidenceOnly.\n- Checked classification authority: FactOnly for checked structural claims.\n- Licensing authority: AuthorizesTransition, emitted only by LicensingBoundary.\n- Execution authority: StateTransition, emitted only by Engine.\n",
        "authority_defaults": "An AdmissibleRepair candidate is EvidenceOnly by default.\n\nA checked exact-repair fact may become FactOnly only after same-carrier preservation,\ninvariant restoration, replayability, witness references, and certificate references are checked.\n\nA repair license, if emitted by a later licensing boundary, uses AuthorizesTransition.\n\nEngine execution of the licensed repair uses StateTransition.\n",
        "operator_note": "Only E, I, C, R, M are operators. A checked AdmissibleRepair may instantiate E after\nevidence-based classification. A candidate AdmissibleRepair must not self-declare E.\nAll other entities (Lambda, Reducer, Adapter, etc.) are action candidates or boundaries,\nnever operators. See fixed_layer_operator_algebra_contract.md.\n"
      },
