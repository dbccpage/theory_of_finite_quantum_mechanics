t.md.\n\n      '\n  classification:\n    subsystem: Cohomological Semantics / Obstruction Algebra\n    role: 'Same-carrier local displacement candidate (effect-class E: Exact Repair\n      after checking).'\n    classification: Obstruction layer -- same-carrier repair.\n  structural_representation:\n    candidate:\n      struct_name: AdmissibleRepairCandidate\n      fields:\n      - name: repair_id\n        type: RepairId\n      - name: carrier_ref\n        type: CarrierRef\n      - name: carrier_schema_hash\n        type: Hash256\n      - name: source_hash\n        type: Hash256\n      - name: target_hash\n        type: Hash256\n      - name: repair_kind\n        type: RepairKind\n      - name: generator_ref\n        type: Option<GeneratorId>\n      - name: component_ref\n        type: Option<ComponentId>\n      - name: witness_refs\n        type: Vec<WitnessId>\n      - name: certificate_refs\n        type: Vec<CertificateId>\n      - name: replay_refs\n        type: Vec<ReplayRef>\n      - name: repair_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n    checked:\n      struct_name: CheckedAdmissibleRepair\n      fields:\n      - name: repair_id\n        type: RepairId\n      - name: candidate_ref\n        type: RepairId\n      - name: same_carrier_certificate\n        type: CertificateId\n      - name: invariant_restoration_certificate\n        type: CertificateId\n      - name: replay_ref\n        type: ReplayRef\n      - name: authority_effect\n        type: AuthorityEffect\n        default: FactOnly\n    enums:\n    - name: RepairKind\n      variants:\n      - D0Displacement\n      - GaugeEquivalenceWitnessed\n      - ReducerCandidate\n  core_definition: 'An AdmissibleRepair is a same-carrier local displacement candidate\n    generated by d_0 or\n\n    declared gauge-equivalence/reducer action inside the current carrier. A separate\n    license\n\n    is required before Engine execution.\n\n    '\n  same_carrier_law: \"An AdmissibleRepair MUST preserve:\\n  - carrier identity\\n  -\\\n    \\ schema identity\\n  - universe identity\\n  - coefficient semantics\\n\\nSame-carrier\\\n    \\ preservation must be checked against carrier identity, schema hash, universe\\n\\\n    identity, coefficient semantics, and declared boundary references.\\n\\nAny carrier\\\n    \\ extension, schema expansion, added generator, added context, or layer transition\\n\\\n    is Lift, not AdmissibleRepair.\\n\"\n  must_be:\n  - Same-carrier\n  - Typed\n  - Finite\n  - Replayable\n  - Non-lifting\n  - Non-semantic\n  must_not_be:\n  - Optimization trick\n  - Solver improvement\n  - Explanation\n  - Reinterpretation\n  - Lift\n  - Adapter conversion\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - lift_carrier\n    - adapter_conversion\n    - reinterpret_semantics\n    - semantic_repair\n    - PolicyDecision\n    - EngineDecision\n    - TerminalEnvelope\n    - ALLOW_OUTPUT\n    - BLOCK_OUTPUT\n    - terminalize(\n    - execute_now(\n    - mutate_runtime\n    - rank_candidates\n    - score_candidate\n    - authorize_transition(\n    - license_transition(\n    - GaugeOp\n    - AdapterOp\n    - ForgetfulOp\n    - OperatorFactEnvelope\n    - OperatorId\n    - BasisOperator\n    - self_declare_effect_class\n    - apply_operator_now(\n  required_tests:\n  - admissible_repair_requires_carrier_ref\n  - admissible_repair_is_same_carrier\n  - admissible_repair_is_finite\n  - admissible_repair_is_replayable\n  - admissible_repair_is_not_lift\n  - admissible_repair_is_not_adapter\n  - admissible_repair_requires_witness_or_certificate\n  - admissible_repair_candidate_defaults_to_evidence_only\n  - checked_admissible_repair_may_be_factonly_after_certificates\n  - admissible_repair_cannot_self_declare_effect_class_e\n  - admissible_repair_requires_same_carrier_certificate\n  - admissible_repair_requires_invariant_restoration_certificate\n  - admissible_repair_composition_requires_rewrite_law_or_certificate\n  - admissible_repair_does_not_emit_action_license\n  - admissible_repair_does_not_authorize_transition\n  - admissible_repair_does_not_execute\n  canonical_invariant: 'AdmissibleRepair candidates are EvidenceOnly same-carrier\n    repair proposals. A checked\n\n    AdmissibleRepair may instantiate E = exact repair only through evidence-based\n    classification,\n\n    same-carrier checking, invariant-restoration certificates, and replay evidence.\n    It does not\n\n    lift, adapt, reinterpret, terminalize, license, authorize, mutate, or execute.\n\n    '\n  legacy_metadata:\n    name: AdmissibleRepair\n    role: Same-carrier local displacement candidate supporting effect-class E after\n      checking\n    version: '2.0'\n    classification: obstruction\n    effect_class_target: E\n    effect_class_authority: checker_only\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: EvidenceEnvelope\n    referenced_output_families:\n    - FactEnvelope\n    - EvidenceEnvelope\n    - Record\n    referenced_domain_kinds:\n    - WitnessEnvelope\n    - CertificateEnvelope\n    - ReplayReport\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - urn:omega:constitution:base_obstruction_contract:v1.0.0\n",
