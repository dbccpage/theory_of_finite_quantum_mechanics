      "summary": "This contract defines the AdmissibleRepair boundary.\n\nAdmissibleRepair is a same-carrier local displacement candidate. A checked AdmissibleRepair\nmay support E = exact repair classification. A separate license is required before Engine execution.\nAdmissibleRepair does not lift, adapt, reinterpret, terminalize, mutate runtime state, or execute.\n",
