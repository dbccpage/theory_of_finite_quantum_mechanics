      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:obstruction:admissible_repair:v1.0.0\",\n  \"title\": \"AdmissibleRepair\",\n  \"kind\": \"obstruction_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"03_obstruction\",\n  \"role\": \"AnalysisUnit\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Carrier\",\n        \"Coboundary\",\n        \"GaugeEquivalence\",\n        \"Reducer\",\n        \"Witness\",\n        \"CertificateKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the AdmissibleRepair boundary.\\n\\nAdmissibleRepair is a same-carrier local displacement candidate. A checked AdmissibleRepair\\nmay support E = exact repair classification. A separate license is required before Engine execution.\\nAdmissibleRepair does not lift, adapt, reinterpret, terminalize, mutate runtime state, or execute.\\n\",\n    \"non_role\": [\n      \"lift\",\n      \"adapter_conversion\",\n      \"reinterpretation\",\n      \"semantic_repair\",\n      \"terminalization\",\n      \"execution\",\n      \"transition_authorization\",\n      \"action_licensing\",\n      \"state_mutation\",\n      \"candidate_ranking\",\n      \"candidate_scoring\",\n      \"effect_class_self_assignment\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\\nterminalize, authorize transitions, execute transitions, assign effect classes,\\nor upgrade evidence authority.\\n\\nLLM output may propose AdmissibleRepair candidates, but those proposals are\\nEvidenceOnly until checked by the declared repair, replay, certificate, and\\nfixed-layer operator classifier/checker boundaries.\\n\"\n    },\n    \"effect_class_binding\": {\n      \"doctrine\": 6,\n      \"text\": \"A checked AdmissibleRepair may instantiate the E = exact repair effect-class in the\\nfixed-layer operator algebra.\\n\\nA candidate AdmissibleRepair does not self-declare E authority. E classification must be\\nevidence-based and produced by the fixed-layer operator classifier/checker.\\n\",\n      \"connection_to_fixed_layer_operator_algebra\": \"- AdmissibleRepair implements the E effect-class: a same-carrier local displacement that\\n  restores a broken invariant to its canonical form.\\n- The repair is exact: the post-state satisfies the invariant that the pre-state violated.\\n- Composition law: E . E may normalize to E only when the composition is same-carrier,\\n  invariant-preserving, replayable, and justified by an explicit RewriteLaw or certificate.\\n- Candidate authority: EvidenceOnly.\\n- Checked classification authority: FactOnly for checked structural claims.\\n- Licensing authority: AuthorizesTransition, emitted only by LicensingBoundary.\\n- Execution authority: StateTransition, emitted only by Engine.\\n\",\n      \"authority_defaults\": \"An AdmissibleRepair candidate is EvidenceOnly by default.\\n\\nA checked exact-repair fact may become FactOnly only after same-carrier preservation,\\ninvariant restoration, replayability, witness references, and certificate references are checked.\\n\\nA repair license, if emitted by a later licensing boundary, uses AuthorizesTransition.\\n\\nEngine execution of the licensed repair uses StateTransition.\\n\",\n      \"operator_note\": \"Only E, I, C, R, M are operators. A checked AdmissibleRepair may instantiate E after\\nevidence-based classification. A candidate AdmissibleRepair must not self-declare E.\\nAll other entities (Lambda, Reducer, Adapter, etc.) are action candidates or boundaries,\\nnever operators. See fixed_layer_operator_algebra_contract.md.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Cohomological Semantics / Obstruction Algebra\",\n      \"role\": \"Same-carrier local displacement candidate (effect-class E: Exact Repair after checking).\",\n      \"classification\": \"Obstruction layer -- same-carrier repair.\"\n    },\n    \"structural_representation\": {\n      \"candidate\": {\n        \"struct_name\": \"AdmissibleRepairCandidate\",\n        \"fields\": [\n          {\n            \"name\": \"repair_id\",\n            \"type\": \"RepairId\"\n          },\n          {\n            \"name\": \"carrier_ref\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"carrier_schema_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"source_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"target_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"repair_kind\",\n            \"type\": \"RepairKind\"\n          },\n          {\n            \"name\": \"generator_ref\",\n            \"type\": \"Option<GeneratorId>\"\n          },\n          {\n            \"name\": \"component_ref\",\n            \"type\": \"Option<ComponentId>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"repair_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedAdmissibleRepair\",\n        \"fields\": [\n          {\n            \"name\": \"repair_id\",\n            \"type\": \"RepairId\"\n          },\n          {\n            \"name\": \"candidate_ref\",\n            \"type\": \"RepairId\"\n          },\n          {\n            \"name\": \"same_carrier_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"invariant_restoration_certificate\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"ReplayRef\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"RepairKind\",\n          \"variants\": [\n            \"D0Displacement\",\n            \"GaugeEquivalenceWitnessed\",\n            \"ReducerCandidate\"\n          ]\n        }\n      ]\n    },\n    \"core_definition\": \"An AdmissibleRepair is a same-carrier local displacement candidate generated by d_0 or\\ndeclared gauge-equivalence/reducer action inside the current carrier. A separate license\\nis required before Engine execution.\\n\",\n    \"same_carrier_law\": \"An AdmissibleRepair MUST preserve:\\n  - carrier identity\\n  - schema identity\\n  - universe identity\\n  - coefficient semantics\\n\\nSame-carrier preservation must be checked against carrier identity, schema hash, universe\\nidentity, coefficient semantics, and declared boundary references.\\n\\nAny carrier extension, schema expansion, added generator, added context, or layer transition\\nis Lift, not AdmissibleRepair.\\n\",\n    \"must_be\": [\n      \"Same-carrier\",\n      \"Typed\",\n      \"Finite\",\n      \"Replayable\",\n      \"Non-lifting\",\n      \"Non-semantic\"\n    ],\n    \"must_not_be\": [\n      \"Optimization trick\",\n      \"Solver improvement\",\n      \"Explanation\",\n      \"Reinterpretation\",\n      \"Lift\",\n      \"Adapter conversion\"\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"lift_carrier\",\n        \"adapter_conversion\",\n        \"reinterpret_semantics\",\n        \"semantic_repair\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute_now(\",\n        \"mutate_runtime\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"authorize_transition(\",\n        \"license_transition(\",\n        \"GaugeOp\",\n        \"AdapterOp\",\n        \"ForgetfulOp\",\n        \"OperatorFactEnvelope\",\n        \"OperatorId\",\n        \"BasisOperator\",\n        \"self_declare_effect_class\",\n        \"apply_operator_now(\"\n      ]\n    },\n    \"required_tests\": [\n      \"admissible_repair_requires_carrier_ref\",\n      \"admissible_repair_is_same_carrier\",\n      \"admissible_repair_is_finite\",\n      \"admissible_repair_is_replayable\",\n      \"admissible_repair_is_not_lift\",\n      \"admissible_repair_is_not_adapter\",\n      \"admissible_repair_requires_witness_or_certificate\",\n      \"admissible_repair_candidate_defaults_to_evidence_only\",\n      \"checked_admissible_repair_may_be_factonly_after_certificates\",\n      \"admissible_repair_cannot_self_declare_effect_class_e\",\n      \"admissible_repair_requires_same_carrier_certificate\",\n      \"admissible_repair_requires_invariant_restoration_certificate\",\n      \"admissible_repair_composition_requires_rewrite_law_or_certificate\",\n      \"admissible_repair_does_not_emit_action_license\",\n      \"admissible_repair_does_not_authorize_transition\",\n      \"admissible_repair_does_not_execute\"\n    ],\n    \"canonical_invariant\": \"AdmissibleRepair candidates are EvidenceOnly same-carrier repair proposals. A checked\\nAdmissibleRepair may instantiate E = exact repair only through evidence-based classification,\\nsame-carrier checking, invariant-restoration certificates, and replay evidence. It does not\\nlift, adapt, reinterpret, terminalize, license, authorize, mutate, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"AdmissibleRepair\",\n      \"role\": \"Same-carrier local displacement candidate supporting effect-class E after checking\",\n      \"version\": \"2.0\",\n      \"classification\": \"obstruction\",\n      \"effect_class_target\": \"E\",\n      \"effect_class_authority\": \"checker_only\",\n      \"depends_on\": [\n        \"Carrier\",\n        \"Coboundary\",\n        \"GaugeEquivalence\",\n        \"Reducer\",\n        \"Witness\",\n        \"CertificateKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"lift\",\n        \"adapter_conversion\",\n        \"reinterpretation\",\n        \"semantic_repair\",\n        \"terminalization\",\n        \"execution\",\n        \"transition_authorization\",\n        \"action_licensing\",\n        \"state_mutation\",\n        \"candidate_ranking\",\n        \"candidate_scoring\",\n        \"effect_class_self_assignment\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"WitnessEnvelope\",\n        \"CertificateEnvelope\",\n        \"ReplayReport\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_obstruction_contract:v1.0.0\"\n    ]\n  }\n}\n",
