      "raw_utf8": "{\n  \"paper_identity\": \"CODA-Q\",\n  \"legacy_file_identity\": \"008_coda_q.md\",\n  \"canonical_version\": \"v1.0.2\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 5 (Q — The Continuum)\",\n  \"primitives\": {\n    \"q_box\": \"Q = (question, scope, forbidden_promotions)\",\n    \"q_probe\": \"p_Q = (Q, claim, budget, representation)\",\n    \"q_packet\": \"P_Q = (definitions, observer, representation, allowed_moves, verifier, terminalizer, budget)\",\n    \"q_obstruction\": \"Omega_Q(P_Q) = locate(AttemptedDescent(P_Q) not in T_auth)\",\n    \"q_residual\": \"R_Q = Residual(Q, P_Q, Omega_Q)\",\n    \"q_status\": [\n      \"toy_descent\",\n      \"partial_descent\",\n      \"representation_only\",\n      \"obstruction_found\",\n      \"no_known_lift\",\n      \"survivor\",\n      \"refuted\",\n      \"do_not_publish_as_claim\"\n    ]\n  },\n  \"equations\": {\n    \"q_receipt_pipeline\": {\n      \"latex\": \"Q \\\\longrightarrow P_Q \\\\longrightarrow D(P_Q) \\\\longrightarrow \\\\Omega_Q \\\\longrightarrow R_Q \\\\longrightarrow P_{\\\\mathrm{next}}\",\n      \"description\": \"Quarantine probe pipeline mapping large question into obstruction receipt and next probe\"\n    },\n    \"q_firewall\": {\n      \"latex\": \"\\\\mathsf{QStatus}(P_Q) \\\\not\\\\implies \\\\mathsf{Authority}(Q)\",\n      \"description\": \"Q receipt status does not confer authority over the frontier question\"\n    },\n    \"primitive_descent\": {\n      \"latex\": \"\\\\mathsf{PrimitiveDescent}_M(x) := \\\\mathsf{noticed}_M(x) \\\\wedge \\\\mathsf{measured}_M(x) \\\\wedge \\\\mathsf{repeated}_M(x) \\\\wedge \\\\mathsf{compared}_M(x) \\\\wedge \\\\mathsf{shared}_M(x)\",\n      \"description\": \"Multi-aspect primitive descent replacing unindexed being\"\n    },\n    \"mode_being\": {\n      \"latex\": \"\\\\mathsf{ModeBeing}_M(x) := \\\\mathsf{PrimitiveDescent}_M(x) \\\\wedge \\\\mathsf{terminalized}_M(x)\",\n      \"description\": \"Mode-indexed being defined as primitive descent plus terminalization\"\n    },\n    \"finite_descent_permission\": {\n      \"latex\": \"\\\\mathsf{FiniteDescentPermission}_{\\\\mathsf{shadow}}(\\\\mathsf{target}) := \\\\exists F:\\\\mathsf{Profile}\\\\to\\\\mathsf{Target},\\\\; \\\\forall x,\\\\ F(\\\\operatorname{prof}(x))=\\\\mathsf{target}(x)\",\n      \"description\": \"Permission to assert a target claim requires explicit decoder factorization through declared profile\"\n    },\n    \"disjoint_coproduct_q_or_authority\": {\n      \"latex\": \"\\\\mathsf{QOrAuthority} := \\\\mathsf{q}(\\\\mathsf{QStatus}) \\\\sqcup \\\\mathsf{authority}(\\\\mathsf{AuthorityTerminal})\",\n      \"description\": \"Pointwise constructor disjointness of Q receipt statuses and authority terminals\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"CODA-Q-RULE-001\",\n      \"name\": \"Quarantine Discipline\",\n      \"statement\": \"Level Q publishes frontier probes and obstruction receipts; it does not mint authority or solve frontier questions.\"\n    },\n    {\n      \"id\": \"CODA-Q-RULE-002\",\n      \"name\": \"Profile Collision Blocks Factorization\",\n      \"statement\": \"If two worlds share a profile prof(a) = prof(b) but have target(a) != target(b), decoder factorization is impossible.\"\n    },\n    {\n      \"id\": \"CODA-Q-RULE-003\",\n      \"name\": \"Descent Is Primitive\",\n      \"statement\": \"Being is not primitive; primitive descent under a declared engagement mode is primitive.\"\n    },\n    {\n      \"id\": \"CODA-Q-RULE-004\",\n      \"name\": \"Q Admission Debt Completeness\",\n      \"statement\": \"QHeld requires complete debt: finite shadow, refinement relation, declared topology, convergence route, descent trigger.\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports frontier question quarantine, obstruction receipt emission, and profile collision identification.\",\n    \"does_not_support\": \"Does not support quantum ontology, consciousness claims, RH proofs, or uncertified authority promotion.\",\n    \"narrowest_defensible_claim\": \"Localizes specific obstruction classes preventing finite descent of frontier probes.\",\n    \"next_test_needed\": \"Automated verification of QAdmissionDebt gap detection on incomplete Q probe submissions.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
