ibility and lossiness at once.\",\n    \"Honest scope law: attest establishes that three distinct replays were recorded. It does NOT re-run the observer map, which is not stored here, so it does not establish that the laws hold. Whoever produced the replays vouches for that, and the type must not be read as more than that.\",\n    \"Erasure law: observers erase distinctions and never create them. Nothing in this file may add structure to a quotient.\",\n    \"Authority law: an attested observer carries no authority.\"\n  ],\n  \"forbidden_substrings\": [\n    \"pub observer:\",\n    \"pub witness:\",\n    \"id: String\",\n    \"f64\",\n    \"unwrap_or_default\"\n  ],\n  \"required_substrings\": [\n    \"pub struct VerifiedObserver\",\n    \"pub fn attest\",\n    \"#[serde(try_from = \\\"UntrustedVerifiedObserverWire\\\")]\",\n    \"omega_kernel::ObserverId\"\n  ],\n  \"required_tests\": [\n    \"an_observer_id_must_be_canonical\",\n    \"three_distinct_replays_attest\",\n    \"an_unset_replay_is_refused_for_each_law\",\n    \"one_replay_cannot_witness_two_laws\",\n    \"all_three_laws_sharing_one_replay_is_refused\",\n    \"a_malformed_observer_id_is_refused_on_the_wire\",\n    \"an_observer_survives_a_serde_round_trip\",\n    \"an_unset_replay_cannot_deserialize_as_verified\",\n    \"a_reused_replay_cannot_deserialize_as_verified\",\n    \"a_verified_observer_survives_a_serde_round_trip\"\n  ],\n  \"lean_obligations\": [],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
