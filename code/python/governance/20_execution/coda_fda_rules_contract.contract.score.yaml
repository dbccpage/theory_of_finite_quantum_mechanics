      "raw_utf8": "{\n  \"paper_identity\": \"CODA-FDA\",\n  \"legacy_file_identity\": \"001_coda_fda.md\",\n  \"canonical_version\": \"v1.0\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 8 (FDA — Finite Descent Authority)\",\n  \"primitives\": {\n    \"descent_packet\": \"P_s = (K_s, E_s, V_s, tau_s, Lambda_s)\",\n    \"pipeline\": \"P -> rho -> G -> eta -> R -> D -> C_fin -> V -> Fib -> tau -> Term\",\n    \"authority_type\": \"AuthStanding_S(p) := Sigma(t:T_S) (Pi_S#(p) = inl(t) and IsAuth_S(t))\",\n    \"verifier_fiber\": \"R_p = { r in E_s : V_s(r, z_p) = 1 }\",\n    \"output_fiber\": \"O_p = { o(r, z_p) : r in R_p }\"\n  },\n  \"equations\": {\n    \"authority_standing_dependent_pair\": {\n      \"latex\": \"\\\\mathsf{AuthStanding}_S(p) := \\\\Sigma(t:\\\\mathbb{T}_S) \\\\left( \\\\Pi_S^\\\\sharp(p) = \\\\mathsf{inl}(t) \\\\wedge \\\\mathsf{IsAuth}_S(t) \\\\right)\",\n      \"description\": \"Dependent pair type for finite standing authority under system S\"\n    },\n    \"refusal_law\": {\n      \"latex\": \"\\\\neg D(p) \\\\implies \\\\neg \\\\mathsf{Auth}(p)\",\n      \"description\": \"Absence of accepted finite descent forces refusal of authority\"\n    },\n    \"terminal_taxonomy\": {\n      \"no_rule\": \"R_p = \\\\varnothing (exhaustive search)\",\n      \"budget_unknown\": \"R_p = \\\\varnothing (non-exhaustive / budget limit)\",\n      \"unique_rule\": \"|R_p| = 1\",\n      \"unique_output\": \"|R_p| > 1, |O_p| = 1\",\n      \"non_unique\": \"|R_p| > 1, |O_p| > 1\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"FDA-RULE-001\",\n      \"name\": \"Refusal Law Enforcement\",\n      \"statement\": \"Any claim lacking an accepted finite descent packet D(p) = inl(c) must be refused authority.\"\n    },\n    {\n      \"id\": \"FDA-RULE-002\",\n      \"name\": \"Seven-Guard Verification\",\n      \"statement\": \"IsAuth_S(t) requires verifying all 7 guards (packet completeness, verifier replay, terminal alignment, budget, lift, scope, trust root).\"\n    },\n    {\n      \"id\": \"FDA-RULE-003\",\n      \"name\": \"Exhaustive Search Classification\",\n      \"statement\": \"Empty candidate fiber R_p must be classified as NoRule if search was exhaustive, or BudgetUnknown if search was truncated.\"\n    },\n    {\n      \"id\": \"FDA-RULE-004\",\n      \"name\": \"Terminal Non-Bypass\",\n      \"statement\": \"Observation-side evidence or transport certificates alone cannot bypass explicit terminalization tau_s.\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports 5-field packet verification, candidate fiber classification, and authority refusal for unverified proposals.\",\n    \"does_not_support\": \"Does not support uncertified authority creation, global green claims, or infinite-horizon authorization without finite shadows.\",\n    \"narrowest_defensible_claim\": \"Calculates candidate fiber cardinality and enforces 7-guard validation over finite descent packets.\",\n    \"next_test_needed\": \"Automated replay test of 7-guard validation suite against synthetic non-unique and budget-exhausted descent packets.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
