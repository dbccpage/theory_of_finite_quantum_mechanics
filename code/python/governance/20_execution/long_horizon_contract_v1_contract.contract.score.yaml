        "MAP_LAG_FICTION": "Prompt table contradicts disk and was about to be used as truth",
        "GATE_FAILED": "Host gate red; residualize, do not package READY",
        "EXTERNAL_ROLE_REQUIRED": "Human author/review/promotion/credentials only",
        "SECOND_PRIMARY_REFUSED": "Attempted multi-target cycle",
        "MISSING_PACKET_FIELDS": "Residual/packet incomplete",
        "SIBLING_HANDOFF": "Work belongs to another loop"
      },
      "L10_paper_review_and_extension_engine": [
        "Load existing paper or research document under published/ or library/.",
        "Evaluate claim ledger, proof steps, and test evidence against active control law.",
        "Propose next-level extension (v1.0 -> v2.0 pre-print).",
        "All edits remain under AuthorityEffect: None and require human authorization."
      ],
      "L11_anti_halt_law": [
        "NO SILENT HALTS: A campaign loop MUST NEVER stop without an explicit stated reason.",
        "Must explicitly emit Next Best Recommended Action / Change at cycle end.",
        "If target closed, select and emit next legal primary target.",
        "If true halt occurs, state exact typed halt code from L9 and precise unblock action."
      ]
    },
