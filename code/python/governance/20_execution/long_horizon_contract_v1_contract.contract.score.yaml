    "scope": "Shared multi-session campaign law for all domain looping goal prompts under omega_engine/research/prompts/. Domain loops MUST point here or paste L0–L11.",
    "rules": {
      "L0_authority_and_promotion": [
        "Every agent output, receipt, test green, Lean green, and packet has AuthorityEffect: None.",
