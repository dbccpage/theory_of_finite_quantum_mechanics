      "proof_obligations": [
        {
          "id": "ENG-INV-001",
          "statement": "No transition occurs without a valid ActionLicense."
        },
        {
          "id": "ENG-INV-002",
          "statement": "The ActionLicense binds the executed decision and target carrier."
        },
        {
          "id": "ENG-INV-003",
          "statement": "A refused execution produces no durable carrier mutation."
        },
        {
          "id": "ENG-INV-004",
          "statement": "Every durable transition has exactly one authoritative EngineAction."
        },
        {
          "id": "ENG-INV-005",
          "statement": "Every durable transition has a durable trace record."
        },
        {
          "id": "ENG-INV-006",
          "statement": "Pre-state and post-state hashes bind canonical carrier states."
        },
        {
          "id": "ENG-INV-007",
          "statement": "Engine cannot mint, modify, widen, or reinterpret ActionLicense authority."
        },
        {
          "id": "ENG-INV-008",
          "statement": "Engine cannot evaluate candidate merit or policy."
        },
        {
          "id": "ENG-INV-009",
          "statement": "Subclasses cannot bypass the constitutional execution envelope."
        },
        {
          "id": "ENG-INV-010",
          "statement": "Engine identity and governing contract identity are immutable during lifetime."
        },
        {
          "id": "ENG-INV-011",
          "statement": "State version conflicts fail closed before commit."
        },
        {
          "id": "ENG-INV-012",
          "statement": "Trace ancestry is preserved from input through emitted trace."
        },
        {
          "id": "ENG-INV-013",
          "statement": "The ActionLicense binds the exact transition specification executed by the Engine; no unlicensed operation or payload may influence carrier mutation."
        },
        {
          "id": "ENG-INV-014",
          "statement": "Replaying an already committed ActionLicense cannot produce a second durable StateTransition."
        },
        {
          "id": "ENG-INV-015",
          "statement": "Durable carrier mutation and authoritative transition recording are atomic or recoverably coupled; EngineRefusal implies that no carrier mutation became durable."
        },
        {
          "id": "ENG-INV-016",
          "statement": "License bindings, preconditions, and transition execution are based on the same pre-state version whose version is conditionally committed."
        },
        {
          "id": "ENG-OP-001",
          "statement": "Engine never implements or invokes Operator transformation semantics."
        },
        {
          "id": "ENG-OP-002",
          "statement": "Engine commits only a detached transition artifact exactly bound by a valid ActionLicense."
        },
        {
          "id": "ENG-OP-003",
          "statement": "Engine never computes, estimates, compares, or interprets Phi."
        },
        {
          "id": "ENG-OP-004",
          "statement": "Engine never selects, ranks, composes, or repeats Operators."
        },
        {
          "id": "ENG-OP-005",
          "statement": "Engine does not derive post-state; it validates and commits an already licensed post-state artifact."
        }
      ],
