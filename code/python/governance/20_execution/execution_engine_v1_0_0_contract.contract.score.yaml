and commits an already-computed detached transition artifact bound by a valid ActionLicense against the validated version of the licensed target carrier. \",\n    \"non_role\": [\n      \"measurement\",\n      \"solution_computation\",\n      \"candidate_generation\",\n      \"domain_inference\",\n      \"certification\",\n      \"evaluation\",\n      \"policy_definition\",\n      \"solver_reimplementation\",\n      \"license_creation\",\n      \"terminal_mapping\",\n      \"evidence_authority_upgrade\"\n    ],\n    \"authority_defaults\": {\n      \"engine_input_license\": \"AuthorizesTransition\",\n      \"engine_action\": \"StateTransition\",\n      \"engine_trace\": \"Record\"\n    },\n    \"structural_representation\": {\n      \"input\": {\n        \"struct_name\": \"LicensedTransitionInput\",\n        \"fields\": [\n          {\n            \"name\": \"license_ref\",\n            \"type\": \"ActionLicenseId\"\n          },\n          {\n            \"name\": \"decision_ref\",\n            \"type\": \"DecisionEnvelopeRef\"\n          },\n          {\n            \"name\": \"target_state_ref\",\n            \"type\": \"StateRef\"\n          },\n          {\n            \"name\": \"expected_state_version\",\n            \"type\": \"StateVersion\"\n          },\n          {\n            \"name\": \"expected_pre_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"operator_ref\",\n            \"type\": \"OperatorRef\"\n          },\n          {\n            \"name\": \"proposed_state_ref\",\n            \"type\": \"ArtifactRef\"\n          },\n          {\n            \"name\": \"expected_post_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"precondition_refs\",\n            \"type\": \"Vec<FactEnvelopeRef>\"\n          },\n          {\n            \"name\": \"trace_parent_refs\",\n            \"type\": \"Vec<TraceId>\"\n          }\n        ]\n      },\n      \"out