      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:execution:engine:v1.0.0\",\n  \"title\": \"Engine\",\n  \"kind\": \"execution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"06_execution\",\n  \"role\": \"Engine\",\n  \"descriptor\": {\n    \"authority_effect\": \"state_transition\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"proof_obligations\": [],\n      \"contracts\": [\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\",\n        \"ActionLicense\",\n        \"Trace\",\n        \"CarrierStore\"\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\",\n        \"ActionLicense\",\n        \"Trace\"\n      ],\n      \"emits\": \"Action\",\n      \"authority_layer\": \"Action\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"constraints\": {\n      \"action_license_required\": true\n    },\n    \"runtime_state_type\": \"Carrier\",\n    \"capabilities\": {\n      \"forbidden\": [\n        \"ComputePhi\",\n        \"ComputeGamma\",\n        \"PolicyInterpretation\",\n        \"Evaluation\",\n        \"CertificateSigning\",\n        \"EmitCertificate\"\n      ],\n      \"required\": []\n    },\n    \"laws\": {\n      \"effect\": \"Stateful\"\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Engine is the uniquely authorized execution-layer mechanism by which an already licensed transition happens. Engine does not derive post-state. It validates and commits an already-computed detached transition artifact bound by a valid ActionLicense against the validated version of the licensed target carrier. \",\n    \"non_role\": [\n      \"measurement\",\n      \"solution_computation\",\n      \"candidate_generation\",\n      \"domain_inference\",\n      \"certification\",\n      \"evaluation\",\n      \"policy_definition\",\n      \"solver_reimplementation\",\n      \"license_creation\",\n      \"terminal_mapping\",\n      \"evidence_authority_upgrade\"\n    ],\n    \"authority_defaults\": {\n      \"engine_input_license\": \"AuthorizesTransition\",\n      \"engine_action\": \"StateTransition\",\n      \"engine_trace\": \"Record\"\n    },\n    \"structural_representation\": {\n      \"input\": {\n        \"struct_name\": \"LicensedTransitionInput\",\n        \"fields\": [\n          {\n            \"name\": \"license_ref\",\n            \"type\": \"ActionLicenseId\"\n          },\n          {\n            \"name\": \"decision_ref\",\n            \"type\": \"DecisionEnvelopeRef\"\n          },\n          {\n            \"name\": \"target_state_ref\",\n            \"type\": \"StateRef\"\n          },\n          {\n            \"name\": \"expected_state_version\",\n            \"type\": \"StateVersion\"\n          },\n          {\n            \"name\": \"expected_pre_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"operator_ref\",\n            \"type\": \"OperatorRef\"\n          },\n          {\n            \"name\": \"proposed_state_ref\",\n            \"type\": \"ArtifactRef\"\n          },\n          {\n            \"name\": \"expected_post_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"precondition_refs\",\n            \"type\": \"Vec<FactEnvelopeRef>\"\n          },\n          {\n            \"name\": \"trace_parent_refs\",\n            \"type\": \"Vec<TraceId>\"\n          }\n        ]\n      },\n      \"output\": {\n        \"struct_name\": \"EngineAction\",\n        \"fields\": [\n          {\n            \"name\": \"action_id\",\n            \"type\": \"ActionId\"\n          },\n          {\n            \"name\": \"license_ref\",\n            \"type\": \"ActionLicenseId\"\n          },\n          {\n            \"name\": \"pre_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"post_state_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"emitted_trace_ref\",\n            \"type\": \"TraceId\"\n          },\n          {\n            \"name\": \"action_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"StateTransition\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"EvidenceEnvelope / FactEnvelope -> Evaluator / Policy -> TerminalMapper -> LicensingBoundary emits ActionLicense -> Engine executes licensed transition -> EngineAction -> TraceArtifact / Record \",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"mutate_without_action_license\",\n        \"mutate_outside_licensed_target\",\n        \"bypass_execution_envelope\",\n        \"terminalize(\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"apply_operator\"\n      ]\n    },\n    \"required_tests\": [\n      \"engine_requires_action_license\",\n      \"engine_executes_only_licensed_transitions\",\n      \"engine_output_authority_effect_is_state_transition\",\n      \"engine_does_not_create_action_license\",\n      \"engine_does_not_evaluate_policy_internally\",\n      \"engine_does_not_compute_phi\",\n      \"engine_does_not_sign_certificate\",\n      \"engine_records_trace_for_each_transition\",\n      \"engine_license_binds_exact_transition\",\n      \"engine_idempotent_replay\",\n      \"engine_atomic_carrier_trace_commit\",\n      \"engine_state_version_cas_coupling\",\n      \"engine_does_not_derive_post_state\"\n    ],\n    \"canonical_invariant\": \"Engine executes licensed transitions only. StateTransition authority appears only on EngineAction artifacts produced from valid ActionLicense inputs. \",\n    \"legacy_metadata\": {\n      \"normative\": false,\n      \"name\": \"Engine\",\n      \"source_file\": \"non_math/06_execution/engine_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Licensed transition executor\",\n      \"version\": \"1.0.0\",\n      \"classification\": \"execution\",\n      \"effect_class\": \"StateTransition\",\n      \"depends_on\": [\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\"\n      ],\n      \"forbidden_authority\": [\n        \"measurement\",\n        \"solution_computation\",\n        \"candidate_generation\",\n        \"domain_inference\",\n        \"certification\",\n        \"evaluation\",\n        \"policy_definition\",\n        \"solver_reimplementation\",\n        \"license_creation\",\n        \"terminal_mapping\",\n        \"evidence_authority_upgrade\"\n      ],\n      \"primary_output_family\": \"Action\",\n      \"referenced_output_families\": [\n        \"ActionLicense\",\n        \"DecisionEnvelope\",\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"Record\"\n      ]\n    },\n    \"enforcement_scope\": \"This general doctrine is not enforced across all engines. The finite Genesis report profile has an executable license-bound committer and host CAS tests.\",\n    \"operator_boundary\": {\n      \"engine_may_implement_operator_semantics\": false,\n      \"engine_may_select_operator\": false,\n      \"engine_may_apply_operator\": false,\n      \"engine_may_recompute_transition\": false,\n      \"engine_may_commit_licensed_operator_result\": true,\n      \"committed_result_must_match_license\": true\n    },\n    \"hashing\": {\n      \"digest\": \"SHA-256\",\n      \"canonical_encoding\": \"JSON-NFC\",\n      \"domain_separation\": \"required\",\n      \"domains\": {\n        \"action_hash\": \"omega.engine.action.v1\",\n        \"descriptor_hash\": \"omega.engine.descriptor.v1\"\n      }\n    },\n    \"declared_authority_effect\": \"StateTransition\",\n    \"declared_capabilities\": {\n      \"forbidden\": [\n        \"mutate_without_action_license\",\n        \"mutate_outside_licensed_target\",\n        \"bypass_execution_envelope\",\n        \"ComputePhi\",\n        \"ComputeGamma\",\n        \"OperatorImplementation\",\n        \"OperatorSelection\",\n        \"OperatorApplication\",\n        \"CandidateGeneration\",\n        \"CandidateRanking\",\n        \"PolicyInterpretation\",\n        \"Evaluation\",\n        \"CertificateSigning\",\n        \"EmitCertificate\"\n      ],\n      \"required\": []\n    },\n    \"declared_constitution\": {\n      \"contract_dependencies\": [\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\"\n      ],\n      \"emits\": \"Action\",\n      \"authority_layer\": \"Action\",\n      \"replay_certificates\": [\n        \"contract_hash\",\n        \"descriptor_hash\"\n      ]\n    },\n    \"declared_constraints\": {\n      \"action_license_required\": true\n    },\n    \"declared_laws\": {\n      \"effect\": \"Stateful\"\n    },\n    \"declared_runtime_state_type\": \"Carrier\",\n    \"proof_obligations\": [\n      {\n        \"id\": \"ENG-INV-001\",\n        \"statement\": \"No transition occurs without a valid ActionLicense.\"\n      },\n      {\n        \"id\": \"ENG-INV-002\",\n        \"statement\": \"The ActionLicense binds the executed decision and target carrier.\"\n      },\n      {\n        \"id\": \"ENG-INV-003\",\n        \"statement\": \"A refused execution produces no durable carrier mutation.\"\n      },\n      {\n        \"id\": \"ENG-INV-004\",\n        \"statement\": \"Every durable transition has exactly one authoritative EngineAction.\"\n      },\n      {\n        \"id\": \"ENG-INV-005\",\n        \"statement\": \"Every durable transition has a durable trace record.\"\n      },\n      {\n        \"id\": \"ENG-INV-006\",\n        \"statement\": \"Pre-state and post-state hashes bind canonical carrier states.\"\n      },\n      {\n        \"id\": \"ENG-INV-007\",\n        \"statement\": \"Engine cannot mint, modify, widen, or reinterpret ActionLicense authority.\"\n      },\n      {\n        \"id\": \"ENG-INV-008\",\n        \"statement\": \"Engine cannot evaluate candidate merit or policy.\"\n      },\n      {\n        \"id\": \"ENG-INV-009\",\n        \"statement\": \"Subclasses cannot bypass the constitutional execution envelope.\"\n      },\n      {\n        \"id\": \"ENG-INV-010\",\n        \"statement\": \"Engine identity and governing contract identity are immutable during lifetime.\"\n      },\n      {\n        \"id\": \"ENG-INV-011\",\n        \"statement\": \"State version conflicts fail closed before commit.\"\n      },\n      {\n        \"id\": \"ENG-INV-012\",\n        \"statement\": \"Trace ancestry is preserved from input through emitted trace.\"\n      },\n      {\n        \"id\": \"ENG-INV-013\",\n        \"statement\": \"The ActionLicense binds the exact transition specification executed by the Engine; no unlicensed operation or payload may influence carrier mutation.\"\n      },\n      {\n        \"id\": \"ENG-INV-014\",\n        \"statement\": \"Replaying an already committed ActionLicense cannot produce a second durable StateTransition.\"\n      },\n      {\n        \"id\": \"ENG-INV-015\",\n        \"statement\": \"Durable carrier mutation and authoritative transition recording are atomic or recoverably coupled; EngineRefusal implies that no carrier mutation became durable.\"\n      },\n      {\n        \"id\": \"ENG-INV-016\",\n        \"statement\": \"License bindings, preconditions, and transition execution are based on the same pre-state version whose version is conditionally committed.\"\n      },\n      {\n        \"id\": \"ENG-OP-001\",\n        \"statement\": \"Engine never implements or invokes Operator transformation semantics.\"\n      },\n      {\n        \"id\": \"ENG-OP-002\",\n        \"statement\": \"Engine commits only a detached transition artifact exactly bound by a valid ActionLicense.\"\n      },\n      {\n        \"id\": \"ENG-OP-003\",\n        \"statement\": \"Engine never computes, estimates, compares, or interprets Phi.\"\n      },\n      {\n        \"id\": \"ENG-OP-004\",\n        \"statement\": \"Engine never selects, ranks, composes, or repeats Operators.\"\n      },\n      {\n        \"id\": \"ENG-OP-005\",\n        \"statement\": \"Engine does not derive post-state; it validates and commits an already licensed post-state artifact.\"\n      }\n    ],\n    \"declared_refusals\": [\n      \"MissingActionLicense\",\n      \"InvalidActionLicense\",\n      \"LicenseTargetMismatch\",\n      \"LicenseExpired\",\n      \"PreconditionsUnsatisfied\",\n      \"StateVersionMismatch\",\n      \"TransitionExecutionFailure\",\n      \"InvalidInputFormat\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_execution_contract:v1.0.0\"\n    ]\n  }\n}\n",
