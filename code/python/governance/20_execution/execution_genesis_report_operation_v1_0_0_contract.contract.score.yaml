      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:execution:genesis_report_operation:v1.0.0\",\n  \"title\": \"Finite Genesis report installation\",\n  \"kind\": \"execution_contract\",\n  \"status\": \"active\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"customer_claim_allowed\": false\n  },\n  \"definition\": {\n    \"scope\": \"One source-bound finite history table and declared continuation language.\",\n    \"operator\": \"Copy a checked partition into a detached state; no search or I/O.\",\n    \"pipeline\": \"Typed manifest only; the native host sequences the stages.\",\n    \"engine\": \"Commit the exact detached state using omega_policy ActionLicense.\",\n    \"host_persistence\": \"SQLite compare-and-swap stores state and trace atomically.\",\n    \"immutable_episode\": [\n      \"target\",\n      \"request\",\n      \"source\",\n      \"binary\",\n      \"contract\",\n      \"allowance\"\n    ],\n    \"valuation_profile\": {\n      \"phi\": \"Remaining finite report-partition rank, computed by omega_wdp.\",\n      \"gamma2_is_zero\": \"Legacy policy field used here for passed finite descent/global admission; no numerical cochain Gamma2 is claimed.\"\n    },\n    \"required_checks\": [\n      \"Every stage binds the same carrier, questions, request and contract.\",\n      \"Native evaluation and replay use the original retained request.\",\n      \"Selected repair prefix has zero remaining report rank.\",\n      \"Every requested continuation descends to the declared quotient.\",\n      \"Any requested global fact is Certified on the original histories.\",\n      \"Failed proposals consume a durable attempt before native computation.\",\n      \"Native licenses never deserialize from a Python or model-produced record.\",\n      \"Carrier and trace commit against the same pre-state, once per target.\"\n    ],\n    \"exclusions\": [\n      \"No claim of arbitrary-history closure or full Genesis passage semantics.\",\n      \"No repair of an empty or ambiguous global fiber by splitting report labels.\",\n      \"No external tool, repository, publication or provider-call permission.\",\n      \"A JSON trace is evidence, not a reusable ActionLicense capability.\"\n    ],\n    \"updated\": \"2026-10-14\"\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_symbol_game\",\n    \"module\": \"report_operation\",\n    \"symbols\": [\n      \"describe\",\n      \"execute\"\n    ]\n  },\n  \"role\": \"Runtime\",\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
