      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:execution:fsr_retrieval:v1.0.0\",\n  \"title\": \"FsrRetrieval\",\n  \"kind\": \"execution_contract\",\n  \"status\": \"active\",\n  \"layer\": \"06_execution\",\n  \"role\": \"Search\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"SearchKernel\",\n        \"Trace\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"Terminalization\",\n        \"CertificateSigning\",\n        \"Evaluation\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"FsrRetrieval traverses a shard index over a declared estate by opaque membership and returns the reached frontier as evidence. It does not rank or score candidates, evaluate admissibility, certify, terminalize, authorize, license, execute, or mutate. Relevance is decided by the caller, never by this contract's implementation.\\n\",\n    \"non_role\": [\n      \"candidate_scoring\",\n      \"candidate_ranking\",\n      \"evaluation\",\n      \"certification\",\n      \"terminal_mapping\",\n      \"execution\",\n      \"mutation\",\n      \"policy_interpretation\",\n      \"transition_authorization\",\n      \"action_licensing\"\n    ],\n    \"structural_representation\": {\n      \"raw\": {\n        \"struct_name\": \"FsrFrontierStep\",\n        \"fields\": [\n          {\n            \"name\": \"estate_root\",\n            \"type\": \"EstateRootRef\"\n          },\n          {\n            \"name\": \"index_snapshot\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"descent_path\",\n            \"type\": \"Vec<NodeRef>\"\n          },\n          {\n            \"name\": \"page_costs\",\n            \"type\": \"Vec<u64>\"\n          },\n          {\n            \"name\": \"reached_leaves\",\n            \"type\": \"Vec<LeafRef>\"\n          },\n          {\n            \"name\": \"frontier_loci\",\n            \"type\": \"u64\"\n          },\n          {\n            \"name\": \"delivered_loci\",\n            \"type\": \"u64\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"EstateSnapshot\\n-> shard index (bounded pages, opaque membership filter)\\n-> FsrFrontierStep\\n-> caller-side relevance decision outside this contract\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"fsr_does_not_rank_candidates\",\n      \"fsr_does_not_score_candidate\",\n      \"fsr_locus_outside_declared_estate_root_is_refused\",\n      \"fsr_absent_content_digest_is_refused_not_bypassed\",\n      \"fsr_descent_budget_is_global_not_per_node\",\n      \"fsr_read_budget_is_a_hard_bound\",\n      \"fsr_emits_only_licensed_stop_codes\"\n    ],\n    \"canonical_invariant\": \"Frontier evidence only. The implementation selects which index pages to open by opaque membership and reports what it reached; it never orders loci by relevance and never claims to have identified an answer.\\n\",\n    \"non_claims\": [\n      \"Discovery cost is NOT claimed to be logarithmic in estate size; the persisted index is parsed per query and the receipt reports MEASURED pages opened, never a derived bound.\",\n      \"Def 007C.1 is NOT evaluated; that requires J = (P_index, c, m) and a two-sided page-cost bound the implementation does not carry. Only structural invariants are reported.\",\n      \"The full 18-code stop alphabet is NOT implemented; a named subset is emitted and no code outside the licensed union is ever produced.\",\n      \"No RouteReceipt and no evidence-indexed OutputStatus are emitted.\",\n      \"No cross-language parity is claimed; there is no Rust implementation of this contract.\"\n    ]\n  },\n  \"definition\": {\n    \"emitted_stop_codes\": {\n      \"note\": \"Product alphabet, held here rather than in descriptor.terminals/refusals because the v1 terminal and refusal vocabularies are closed. These are a SUBSET of the licensed union (OE-005 section 13 plus OE-006 Def 007C.10); the implementation asserts membership before returning.\\n\",\n      \"codes\": [\n        \"DISCOVERY_OK\",\n        \"UNREACHABLE_LOCUS\",\n        \"CONTEXT_BUDGET_EXCEEDED\",\n        \"STALE_INDEX\",\n        \"ROUTE_INVALID\",\n        \"RECEIPT_INVALID\",\n        \"MANIFEST_PARSE_ERROR\",\n        \"SCHEMA_INVALID\",\n        \"INDEX_MISSING\"\n      ]\n    },\n    \"implementation\": {\n      \"language\": \"python\",\n      \"package\": \"omega_engine_py/omega_retrieval\",\n      \"entry_point\": \"python -m omega_retrieval\",\n      \"tests\": \"omega_engine_py/omega_retrieval/tests/test_retrieval.py\",\n      \"rust_twin\": \"none\"\n    },\n    \"estate_binding\": {\n      \"rule\": \"Every locus is resolved against the DECLARED ESTATE ROOT recorded in the index, not merely against the repository root. A locus resolving outside that root is refused. An absent or empty content digest is refused, never treated as fresh.\\n\"\n    },\n    \"legacy_metadata\": {\n      \"name\": \"FsrRetrieval\",\n      \"active\": true,\n      \"machine_authority\": false,\n      \"role\": \"Opaque estate frontier traversal\",\n      \"version\": \"1.0\",\n      \"classification\": \"proposal_traversal\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"SearchKernel\",\n        \"Trace\"\n      ],\n      \"forbidden_authority\": [\n        \"candidate_scoring\",\n        \"candidate_ranking\",\n        \"evaluation\",\n        \"certification\",\n        \"terminal_mapping\",\n        \"execution\",\n        \"mutation\",\n        \"policy_interpretation\",\n        \"transition_authorization\",\n        \"action_licensing\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"Record\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
