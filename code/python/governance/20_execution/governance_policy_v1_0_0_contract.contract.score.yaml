      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:policy:v1.0.0\",\n  \"title\": \"PolicyArtifact\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"Policy\",\n  \"descriptor\": {\n    \"authority_effect\": \"requests_decision\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"CertificateContract\",\n        \"DiagnosticContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Policy boundary.\\n\\nPolicy classifies typed admissibility requests.\\nPolicy does not measure, evaluate alternatives, rank candidates, terminalize, mutate,\\nor execute.\\n\",\n    \"non_role\": [\n      \"measurement\",\n      \"computation\",\n      \"certification\",\n      \"terminalization\",\n      \"execution\",\n      \"mutation\",\n      \"ranking\",\n      \"solver_invocation\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM-generated content carries zero authority in the Policy boundary. LLM output is\\ncandidate material only. All policy classifications are deterministic functions of typed\\nrequests and declared clauses. No LLM output may influence policy interpretation,\\nclause evaluation, or decision derivation.\\n\"\n    },\n    \"classification\": \"Policy is NOT an operator in the five-effect-class algebra (E, I, C, R, M). It is a\\nclassification function. Policy output is a fact about classification. Downstream\\nconsumption of policy output requires the Evaluator to judge admissibility in context.\\n\",\n    \"core_definition\": \"A PolicyArtifact is a deterministic, immutable, typed constraint function over declared\\ndecision requests that classifies admissibility without computing metrics, evaluating\\nalternatives, executing actions, or mutating system state.\\n\",\n    \"final_boundary\": \"Policy:     request -> admissibility classification\\nEvaluator:  evidence + evaluation policy -> accept/reject/escalate\\nEngine:     verified decisions + certificates -> transition\\nPipeline:   engine orchestration\\nMeta:       structural admissibility\\nAnalysis:   measurement\\nObservable: extraction\\nFunctional: aggregation\\n\",\n    \"trait_shape\": {\n      \"rust\": \"pub trait Policy {\\n    fn id(&self) -> &PolicyId;\\n    fn version(&self) -> &PolicyVersion;\\n    fn policy_hash(&self) -> &PolicyHash;\\n\\n    fn interpret(\\n        &self,\\n        request: &PolicyRequest,\\n    ) -> Result<PolicyDecisionEnvelope, PolicyError>;\\n}\\n\"\n    },\n    \"structural_representation\": {\n      \"policy_manifest\": {\n        \"struct_name\": \"PolicyManifest\",\n        \"fields\": [\n          {\n            \"name\": \"policy_id\",\n            \"type\": \"PolicyId\"\n          },\n          {\n            \"name\": \"clauses\",\n            \"type\": \"Vec<PolicyClause>\"\n          },\n          {\n            \"name\": \"requirements\",\n            \"type\": \"Vec<EvidenceRequirement>\"\n          },\n          {\n            \"name\": \"tolerances\",\n            \"type\": \"Vec<ToleranceSpec>\"\n          },\n          {\n            \"name\": \"policy_version\",\n            \"type\": \"PolicyVersion\"\n          },\n          {\n            \"name\": \"policy_hash\",\n            \"type\": \"PolicyHash\"\n          },\n          {\n            \"name\": \"governed_layers\",\n            \"type\": \"Vec<GovernedLayer>\"\n          }\n        ]\n      },\n      \"policy_clause\": {\n        \"struct_name\": \"PolicyClause\",\n        \"fields\": [\n          {\n            \"name\": \"clause_id\",\n            \"type\": \"ClauseId\"\n          },\n          {\n            \"name\": \"scope\",\n            \"type\": \"DecisionScope\"\n          },\n          {\n            \"name\": \"action\",\n            \"type\": \"ActionKind\"\n          },\n          {\n            \"name\": \"predicate_ref\",\n            \"type\": \"PredicateId\"\n          },\n          {\n            \"name\": \"decision_kind\",\n            \"type\": \"PolicyDecisionKind\"\n          },\n          {\n            \"name\": \"reason_code\",\n            \"type\": \"ReasonCode\"\n          }\n        ]\n      },\n      \"policy_request\": {\n        \"struct_name\": \"PolicyRequest\",\n        \"fields\": [\n          {\n            \"name\": \"layer\",\n            \"type\": \"GovernedLayer\"\n          },\n          {\n            \"name\": \"scope\",\n            \"type\": \"DecisionScope\"\n          },\n          {\n            \"name\": \"action\",\n            \"type\": \"ActionKind\"\n          },\n          {\n            \"name\": \"context\",\n            \"type\": \"PolicyContext\"\n          },\n          {\n            \"name\": \"request_id\",\n            \"type\": \"RequestId\"\n          },\n          {\n            \"name\": \"request_hash\",\n            \"type\": \"RequestHash\"\n          }\n        ]\n      },\n      \"policy_context\": {\n        \"struct_name\": \"PolicyContext\",\n        \"fields\": [\n          {\n            \"name\": \"identifiers\",\n            \"type\": \"Vec<ContextId>\"\n          },\n          {\n            \"name\": \"attributes\",\n            \"type\": \"Vec<PolicyAttribute>\"\n          }\n        ]\n      },\n      \"policy_decision_envelope\": {\n        \"struct_name\": \"PolicyDecisionEnvelope\",\n        \"fields\": [\n          {\n            \"name\": \"policy_id\",\n            \"type\": \"PolicyId\"\n          },\n          {\n            \"name\": \"policy_version\",\n            \"type\": \"PolicyVersion\"\n          },\n          {\n            \"name\": \"policy_hash\",\n            \"type\": \"PolicyHash\"\n          },\n          {\n            \"name\": \"request_hash\",\n            \"type\": \"RequestHash\"\n          },\n          {\n            \"name\": \"decision\",\n            \"type\": \"PolicyDecision\"\n          },\n          {\n            \"name\": \"derivation\",\n            \"type\": \"VerdictDerivation\"\n          },\n          {\n            \"name\": \"origin\",\n            \"type\": \"DecisionOrigin\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"RequestsDecision\"\n          }\n        ]\n      },\n      \"bound_constraint\": {\n        \"struct_name\": \"BoundConstraint\",\n        \"fields\": [\n          {\n            \"name\": \"target\",\n            \"type\": \"ActionKind\"\n          },\n          {\n            \"name\": \"limit\",\n            \"type\": \"BoundValue\"\n          },\n          {\n            \"name\": \"enforcement\",\n            \"type\": \"BoundEnforcement\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"PolicyDecision\",\n          \"variants\": [\n            \"Allowed\",\n            {\n              \"name\": \"Forbidden\",\n              \"fields\": {\n                \"reason\": \"PolicyReason\"\n              }\n            },\n            {\n              \"name\": \"Bounded\",\n              \"fields\": {\n                \"constraints\": \"Vec<BoundConstraint>\"\n              }\n            },\n            {\n              \"name\": \"Undetermined\",\n              \"fields\": {\n                \"reason\": \"PolicyReason\"\n              }\n            }\n          ]\n        },\n        {\n          \"name\": \"DecisionOrigin\",\n          \"variants\": [\n            \"PolicyInterpretation\",\n            \"PolicySetResolution\",\n            \"EvaluatorGate\",\n            \"EngineTransition\"\n          ]\n        },\n        {\n          \"name\": \"PolicyError\",\n          \"variants\": [\n            \"LayerViolation\",\n            \"ScopeViolation\",\n            \"MalformedRequest\",\n            \"MissingRequiredEvidence\",\n            \"UnsupportedAction\",\n            \"PolicyVersionMismatch\"\n          ]\n        },\n        {\n          \"name\": \"BoundEnforcement\",\n          \"variants\": [\n            \"Hard\",\n            \"Soft\"\n          ]\n        },\n        {\n          \"name\": \"PolicyInputKind\",\n          \"variants\": [\n            \"DeclaredAttribute\",\n            \"EvaluatorFinding\",\n            \"CertificateRef\",\n            \"WitnessRef\",\n            \"MeasurementRef\"\n          ]\n        }\n      ],\n      \"policy_attribute\": {\n        \"struct_name\": \"PolicyAttribute\",\n        \"fields\": [\n          {\n            \"name\": \"key\",\n            \"type\": \"AttributeKey\"\n          },\n          {\n            \"name\": \"value\",\n            \"type\": \"PolicyValue\"\n          },\n          {\n            \"name\": \"input_kind\",\n            \"type\": \"PolicyInputKind\"\n          },\n          {\n            \"name\": \"source_ref\",\n            \"type\": \"Option<ArtifactRef>\"\n          }\n        ]\n      },\n      \"policy_set\": {\n        \"struct_name\": \"PolicySet\",\n        \"fields\": [\n          {\n            \"name\": \"policies\",\n            \"type\": \"Vec<PolicyArtifact>\"\n          },\n          {\n            \"name\": \"resolution\",\n            \"type\": \"ConflictResolution\"\n          }\n        ]\n      }\n    },\n    \"architectural_mandates\": [\n      {\n        \"name\": \"Explicit Typed Requests\",\n        \"text\": \"A Policy must govern typed PolicyRequest inputs. It MUST NOT access undeclared context or evaluate global state directly.\"\n      },\n      {\n        \"name\": \"Totality Over Declared Scope\",\n        \"text\": \"For any (layer, scope) declared in the policy, interpret MUST return a PolicyDecision. There is no silent 'not applicable' state allowed for in-scope requests.\"\n      },\n      {\n        \"name\": \"Absolute Determinism\",\n        \"text\": \"Given identical PolicyRequest and policy version, interpret MUST return an identical PolicyDecision. A Policy MUST NOT contain randomness, time-based variation, or trace-based drift.\"\n      },\n      {\n        \"name\": \"No Metric Computation\",\n        \"text\": \"Policy must not compute metrics (e.g. Phi obstruction). Allowed: uses precomputed classification. Forbidden: if Phi(state) > threshold -> Forbidden.\"\n      },\n      {\n        \"name\": \"No Search or Ranking\",\n        \"text\": \"Policy classifies ONE request at a time. A Policy MUST NOT rank candidates, compare alternatives, choose a 'best' option, or perform multi-option evaluation.\"\n      },\n      {\n        \"name\": \"Strict Immutability\",\n        \"text\": \"A PolicyArtifact MUST NOT depend on mutable external data (registry, cache, runtime state) during interpretation.\"\n      },\n      {\n        \"name\": \"Explicit Bounds Semantics\",\n        \"text\": \"Bounds are not ambiguous. If an action is bounded, it must provide specific limits and enforcement models.\"\n      },\n      {\n        \"name\": \"Layer Boundary Enforcement\",\n        \"text\": \"Policies must mechanically reject out-of-scope requests.\"\n      },\n      {\n        \"name\": \"Composition Semantics (PolicySet)\",\n        \"text\": \"When multiple policies apply, they must all be interpreted independently before any resolution logic. No short-circuit evaluation is permitted.\"\n      },\n      {\n        \"name\": \"No Observation Law\",\n        \"text\": \"A Policy must not call Observables, AnalysisUnits, Diagnostics, Solvers, Search, or Trace queries. It may only inspect fields explicitly present in PolicyRequest.\"\n      },\n      {\n        \"name\": \"Decision Origin\",\n        \"text\": \"Every policy decision MUST indicate its origin. Policy implementations MUST set origin: DecisionOrigin::PolicyInterpretation.\"\n      },\n      {\n        \"name\": \"Fail-closed Semantics\",\n        \"text\": \"PolicyError indicates a contract violation and is not equivalent to PolicyDecision::Undetermined. Errors mean the request failed the policy contract; Undetermined means the request is well-formed but cannot be classified by policy.\"\n      }\n    ],\n    \"shared_canonical_flow\": \"Raw -> Observable -> Measurement/Witness -> Certificate -> Policy -> Evaluator -> Terminalizer -> Engine -> Ledger\\n\\nor, for pure governance requests:\\n\\nPolicyRequest -> Policy -> PolicyDecisionEnvelope -> Evaluator/PolicySet -> Terminalizer -> Engine\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"solve_\",\n        \"Observable\",\n        \"Solver\",\n        \"SearchKernel\",\n        \"EngineResult\",\n        \"TerminalEnvelope\",\n        \"DecisionCertificate\",\n        \"sign_certificate\",\n        \"save_certificate\",\n        \"terminalize\",\n        \"execute\",\n        \"mutate\",\n        \"rank\",\n        \"score\"\n      ]\n    },\n    \"required_tests\": [\n      \"policy_does_not_compute_metrics\",\n      \"policy_does_not_call_solver\",\n      \"policy_does_not_call_observable\",\n      \"policy_does_not_rank_candidates\",\n      \"policy_does_not_terminalize\",\n      \"policy_does_not_create_certificate\",\n      \"policy_total_for_declared_scope\",\n      \"policy_rejects_out_of_scope_layer\",\n      \"same_request_same_policy_same_decision\",\n      \"policy_hash_recorded_in_envelope\",\n      \"policy_output_origin_is_policy_interpretation\",\n      \"policy_authority_effect_is_requests_decision\"\n    ],\n    \"negative_capability_tests\": [\n      {\n        \"name\": \"test_policy_cannot_call_metric_computer\",\n        \"language\": \"python\",\n        \"code\": \"def test_policy_cannot_call_metric_computer(monkeypatch):\\n  called = False\\n\\n  def fake_metric(*args, **kwargs):\\n    nonlocal called\\n    called = True\\n    return 0.1\\n\\n  decision = policy.interpret(request_with_precomputed_risk)\\n  assert called is False\\n  assert decision.origin == DecisionOrigin.PolicyInterpretation\\n\"\n      }\n    ],\n    \"canonical_invariant\": \"Policy classifies typed admissibility requests. It does not measure, evaluate\\nalternatives, rank, certify, terminalize, mutate, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"PolicyArtifact\",\n      \"role\": \"Deterministic, immutable classification function over typed admissibility requests\",\n      \"version\": \"1.0\",\n      \"classification\": \"governance\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"CertificateContract\",\n        \"DiagnosticContract\"\n      ],\n      \"forbidden_authority\": [\n        \"measurement\",\n        \"computation\",\n        \"certification\",\n        \"terminalization\",\n        \"execution\",\n        \"mutation\",\n        \"ranking\",\n        \"solver_invocation\"\n      ],\n      \"primary_output_family\": \"DecisionEnvelope\",\n      \"domain_output_kind\": \"PolicyDecision\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"PolicyDecisionEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
