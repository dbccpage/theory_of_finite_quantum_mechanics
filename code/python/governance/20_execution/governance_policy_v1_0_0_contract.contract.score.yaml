    "doctrine": {
      "summary": "This contract defines the Policy boundary.\n\nPolicy classifies typed admissibility requests.\nPolicy does not measure, evaluate alternatives, rank candidates, terminalize, mutate,\nor execute.\n",
      "non_role": [
        "measurement",
        "computation",
        "certification",
        "terminalization",
        "execution",
        "mutation",
        "ranking",
        "solver_invocation"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "LLM-generated content carries zero authority in the Policy boundary. LLM output is\ncandidate material only. All policy classifications are deterministic functions of typed\nrequests and declared clauses. No LLM output may influence policy interpretation,\nclause evaluation, or decision derivation.\n"
      },
      "classification": "Policy is NOT an operator in the five-effect-class algebra (E, I, C, R, M). It is a\nclassification function. Policy output is a fact about classification. Downstream\nconsumption of policy output requires the Evaluator to judge admissibility in context.\n",
      "core_definition": "A PolicyArtifact is a deterministic, immutable, typed constraint function over declared\ndecision requests that classifies admissibility without computing metrics, evaluating\nalternatives, executing actions, or mutating system state.\n",
      "final_boundary": "Policy:     request -> admissibility classification\nEvaluator:  evidence + evaluation policy -> accept/reject/escalate\nEngine:     verified decisions + certificates -> transition\nPipeline:   engine orchestration\nMeta:       structural admissibility\nAnalysis:   measurement\nObservable: extraction\nFunctional: aggregation\n",
      "trait_shape": {
        "rust": "pub trait Policy {\n    fn id(&self) -> &PolicyId;\n    fn version(&self) -> &PolicyVersion;\n    fn policy_hash(&self) -> &PolicyHash;\n\n    fn interpret(\n        &self,\n        request: &PolicyRequest,\n    ) -> Result<PolicyDecisionEnvelope, PolicyError>;\n}\n"
      },
