      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:governance:policy:v1.0.0\ntitle: PolicyArtifact\nkind: governance_contract\nstatus: mathematical_wip\nlayer: 05_governance\nrole: Policy\ndescriptor:\n  authority_effect: requests_decision\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - CertificateContract\n    - DiagnosticContract\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This contract defines the Policy boundary.\n\n\n    Policy classifies typed admissibility requests.\n\n    Policy does not measure, evaluate alternatives, rank candidates, terminalize,\n    mutate,\n\n    or execute.\n\n    '\n  non_role: &id002\n  - measurement\n  - computation\n  - certification\n  - terminalization\n  - execution\n  - mutation\n  - ranking\n  - solver_invocation\n  llm_boundary_law:\n    doctrine: 5\n    text: 'LLM-generated content carries zero authority in the Policy boundary. LLM\n      output is\n\n      candidate material only. All policy classifications are deterministic functions\n      of typed\n\n      requests and declared clauses. No LLM output may influence policy interpretation,\n\n      clause evaluation, or decision derivation.\n\n      '\n  classification: 'Policy is NOT an operator in the five-effect-class algebra (E,\n    I, C, R, M). It is a\n\n    classification function. Policy output is a fact about classification. Downstream\n\n    consumption of policy output requires the Evaluator to judge admissibility in\n    context.\n\n    '\n  core_definition: 'A PolicyArtifact is a deterministic, immutable, typed constraint\n    function over declared\n\n    decision requests that classifies admissibility without computing metrics, evaluating\n\n    alternatives, executing actions, or mutating system state.\n\n    '\n  final_boundary: 'Policy:     request -> admissibility classification\n\n    Evaluator:  evidence + evaluation policy -> accept/reject/escalate\n\n    Engine:     verified decisions + certificates -> transition\n\n    Pipeline:   engine orchestration\n\n    Meta:       structural admissibility\n\n    Analysis:   measurement\n\n    Observable: extraction\n\n    Functional: aggregation\n\n    '\n  trait_shape:\n    rust: \"pub trait Policy {\\n    fn id(&self) -> &PolicyId;\\n    fn version(&self)\\\n      \\ -> &PolicyVersion;\\n    fn policy_hash(&self) -> &PolicyHash;\\n\\n    fn interpret(\\n\\\n      \\        &self,\\n        request: &PolicyRequest,\\n    ) -> Result<PolicyDecisionEnvelope,\\\n      \\ PolicyError>;\\n}\\n\"\n  structural_representation:\n    policy_manifest:\n      struct_name: PolicyManifest\n      fields:\n      - name: policy_id\n        type: PolicyId\n      - name: clauses\n        type: Vec<PolicyClause>\n      - name: requirements\n        type: Vec<EvidenceRequirement>\n      - name: tolerances\n        type: Vec<ToleranceSpec>\n      - name: policy_version\n        type: PolicyVersion\n      - name: policy_hash\n        type: PolicyHash\n      - name: governed_layers\n        type: Vec<GovernedLayer>\n    policy_clause:\n      struct_name: PolicyClause\n      fields:\n      - name: clause_id\n        type: ClauseId\n      - name: scope\n        type: DecisionScope\n      - name: action\n        type: ActionKind\n      - name: predicate_ref\n        type: PredicateId\n      - name: decision_kind\n        type: PolicyDecisionKind\n      - name: reason_code\n        type: ReasonCode\n    policy_request:\n      struct_name: PolicyRequest\n      fields:\n      - name: layer\n        type: GovernedLayer\n      - name: scope\n        type: DecisionScope\n      - name: action\n        type: ActionKind\n      - name: context\n        type: PolicyContext\n      - name: request_id\n        type: RequestId\n      - name: request_hash\n        type: RequestHash\n    policy_context:\n      struct_name: PolicyContext\n      fields:\n      - name: identifiers\n        type: Vec<ContextId>\n      - name: attributes\n        type: Vec<PolicyAttribute>\n    policy_decision_envelope:\n      struct_name: PolicyDecisionEnvelope\n      fields:\n      - name: policy_id\n        type: PolicyId\n      - name: policy_version\n        type: PolicyVersion\n      - name: policy_hash\n        type: PolicyHash\n      - name: request_hash\n        type: RequestHash\n      - name: decision\n        type: PolicyDecision\n      - name: derivation\n        type: VerdictDerivation\n      - name: origin\n        type: DecisionOrigin\n      - name: authority_effect\n        type: AuthorityEffect\n        default: RequestsDecision\n    bound_constraint:\n      struct_name: BoundConstraint\n      fields:\n      - name: target\n        type: ActionKind\n      - name: limit\n        type: BoundValue\n      - name: enforcement\n        type: BoundEnforcement\n    enums:\n    - name: PolicyDecision\n      variants:\n      - Allowed\n      - name: Forbidden\n        fields:\n          reason: PolicyReason\n      - name: Bounded\n        fields:\n          constraints: Vec<BoundConstraint>\n      - name: Undetermined\n        fields:\n          reason: PolicyReason\n    - name: DecisionOrigin\n      variants:\n      - PolicyInterpretation\n      - PolicySetResolution\n      - EvaluatorGate\n      - EngineTransition\n    - name: PolicyError\n      variants:\n      - LayerViolation\n      - ScopeViolation\n      - MalformedRequest\n      - MissingRequiredEvidence\n      - UnsupportedAction\n      - PolicyVersionMismatch\n    - name: BoundEnforcement\n      variants:\n      - Hard\n      - Soft\n    - name: PolicyInputKind\n      variants:\n      - DeclaredAttribute\n      - EvaluatorFinding\n      - CertificateRef\n      - WitnessRef\n      - MeasurementRef\n    policy_attribute:\n      struct_name: PolicyAttribute\n      fields:\n      - name: key\n        type: AttributeKey\n      - name: value\n        type: PolicyValue\n      - name: input_kind\n        type: PolicyInputKind\n      - name: source_ref\n        type: Option<ArtifactRef>\n    policy_set:\n      struct_name: PolicySet\n      fields:\n      - name: policies\n        type: Vec<PolicyArtifact>\n      - name: resolution\n        type: ConflictResolution\n  architectural_mandates:\n  - name: Explicit Typed Requests\n    text: A Policy must govern typed PolicyRequest inputs. It MUST NOT access undeclared\n      context or evaluate global state directly.\n  - name: Totality Over Declared Scope\n    text: For any (layer, scope) declared in the policy, interpret MUST return a PolicyDecision.\n      There is no silent 'not applicable' state allowed for in-scope requests.\n  - name: Absolute Determinism\n    text: Given identical PolicyRequest and policy version, interpret MUST return\n      an identical PolicyDecision. A Policy MUST NOT contain randomness, time-based\n      variation, or trace-based drift.\n  - name: No Metric Computation\n    text: 'Policy must not compute metrics (e.g. Phi obstruction). Allowed: uses precomputed\n      classification. Forbidden: if Phi(state) > threshold -> Forbidden.'\n  - name: No Search or Ranking\n    text: Policy classifies ONE request at a time. A Policy MUST NOT rank candidates,\n      compare alternatives, choose a 'best' option, or perform multi-option evaluation.\n  - name: Strict Immutability\n    text: A PolicyArtifact MUST NOT depend on mutable external data (registry, cache,\n      runtime state) during interpretation.\n  - name: Explicit Bounds Semantics\n    text: Bounds are not ambiguous. If an action is bounded, it must provide specific\n      limits and enforcement models.\n  - name: Layer Boundary Enforcement\n    text: Policies must mechanically reject out-of-scope requests.\n  - name: Composition Semantics (PolicySet)\n    text: When multiple policies apply, they must all be interpreted independently\n      before any resolution logic. No short-circuit evaluation is permitted.\n  - name: No Observation Law\n    text: A Policy must not call Observables, AnalysisUnits, Diagnostics, Solvers,\n      Search, or Trace queries. It may only inspect fields explicitly present in PolicyRequest.\n  - name: Decision Origin\n    text: 'Every policy decision MUST indicate its origin. Policy implementations\n      MUST set origin: DecisionOrigin::PolicyInterpretation.'\n  - name: Fail-closed Semantics\n    text: PolicyError indicates a contract violation and is not equivalent to PolicyDecision::Undetermined.\n      Errors mean the request failed the policy contract; Undetermined means the request\n      is well-formed but cannot be classified by policy.\n  shared_canonical_flow: 'Raw -> Observable -> Measurement/Witness -> Certificate\n    -> Policy -> Evaluator -> Terminalizer -> Engine -> Ledger\n\n\n    or, for pure governance requests:\n\n\n    PolicyRequest -> Policy -> PolicyDecisionEnvelope -> Evaluator/PolicySet -> Terminalizer\n    -> Engine\n\n    '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - compute_phi\n    - compute_gamma\n    - solve_\n    - Observable\n    - Solver\n    - SearchKernel\n    - EngineResult\n    - TerminalEnvelope\n    - DecisionCertificate\n    - sign_certificate\n    - save_certificate\n    - terminalize\n    - execute\n    - mutate\n    - rank\n    - score\n  required_tests:\n  - policy_does_not_compute_metrics\n  - policy_does_not_call_solver\n  - policy_does_not_call_observable\n  - policy_does_not_rank_candidates\n  - policy_does_not_terminalize\n  - policy_does_not_create_certificate\n  - policy_total_for_declared_scope\n  - policy_rejects_out_of_scope_layer\n  - same_request_same_policy_same_decision\n  - policy_hash_recorded_in_envelope\n  - policy_output_origin_is_policy_interpretation\n  - policy_authority_effect_is_requests_decision\n  negative_capability_tests:\n  - name: test_policy_cannot_call_metric_computer\n    language: python\n    code: \"def test_policy_cannot_call_metric_computer(monkeypatch):\\n  called = False\\n\\\n      \\n  def fake_metric(*args, **kwargs):\\n    nonlocal called\\n    called = True\\n\\\n      \\    return 0.1\\n\\n  decision = policy.interpret(request_with_precomputed_risk)\\n\\\n      \\  assert called is False\\n  assert decision.origin == DecisionOrigin.PolicyInterpretation\\n\"\n  canonical_invariant: 'Policy classifies typed admissibility requests. It does not\n    measure, evaluate\n\n    alternatives, rank, certify, terminalize, mutate, or execute.\n\n    '\n  legacy_metadata:\n    name: PolicyArtifact\n    role: Deterministic, immutable classification function over typed admissibility\n      requests\n    version: '1.0'\n    classification: governance\n    effect_class: none\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: DecisionEnvelope\n    domain_output_kind: PolicyDecision\n    referenced_output_families:\n    - EvidenceEnvelope\n    - FactEnvelope\n    referenced_domain_kinds:\n    - PolicyDecisionEnvelope\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - urn:omega:constitution:base_governance_contract:v1.0.0\n",
