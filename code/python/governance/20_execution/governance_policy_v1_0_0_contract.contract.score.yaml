          "code": "def test_policy_cannot_call_metric_computer(monkeypatch):\n  called = False\n\n  def fake_metric(*args, **kwargs):\n    nonlocal called\n    called = True\n    return 0.1\n\n  decision = policy.interpret(request_with_precomputed_risk)\n  assert called is False\n  assert decision.origin == DecisionOrigin.PolicyInterpretation\n"
        }
      ],
      "canonical_invariant": "Policy classifies typed admissibility requests. It does not measure, evaluate\nalternatives, rank, certify, terminalize, mutate, or execute.\n",
