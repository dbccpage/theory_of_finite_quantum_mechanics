alRef>\"\n          },\n          {\n            \"name\": \"traversal_policy_ref\",\n            \"type\": \"TraversalPolicyRef\"\n          },\n          {\n            \"name\": \"step_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedSearchTraceStep\",\n        \"fields\": [\n          {\n            \"name\": \"step_ref\",\n            \"type\": \"SearchTraceStepRef\"\n          },\n          {\n            \"name\": \"checker_ref\",\n            \"type\": \"CheckerRef\"\n          },\n          {\n            \"name\": \"checked_frontier_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"ProposalGenerator / candidate refs\\n-> SearchTraceStep\\n-> CheckedSearchTraceStep when checked\\n-> Evaluator only after separate checked evidence boundary\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"search_trace_step_defaults_to_evidence_only\",\n      \"checked_search_trace_step_may_be_factonly_for_frontier_claims\",\n      \"search_does_not_rank_candidates\",\n      \"search_does_not_score_candidate\",\n      \"search_does_not_evaluate\",\n      \"search_does_not_invoke_solver\",\n      \"search_does_not_schedule_transition\",\n      \"search_does_not_emit_action_license\",\n      \"search_does_not_execute\"\n    ],\n    \"canonical_invariant\": \"Search proposes traversal evidence only. It explores or orders proposals but does not\\nevaluate, rank, score, authorize, license, execute, mutate, or certify.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"SearchKernel\",\n      \"source_file\": \"non-math/06_execution/search_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Semantically opaque proposal frontier traversal\",\n      \"version\": \"2.0\",\n      \"classification\": \"proposal_traversal\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"ProposalGenerator\",\n        \"TraversalPolicy\",\n        \"Trace\"\n      ],\n      \"forbidden_authority\": [\n        \"evaluation\",\n        \"computation\",\n        \"certification\",\n        \"terminal_mapping\",\n        \"execution\",\n        \"mutation\",\n        \"policy_interpretation\",\n        \"solver_invocation\",\n        \"candidate_scoring\",\n        \"candidate_ranking\",\n        \"transition_authorization\",\n        \"action_licensing\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"Record\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_execution_contract:v1.0.0\"\n    ]\n  }\n}\n",
