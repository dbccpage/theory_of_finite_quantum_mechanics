      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:state:type_and_kind:v1.0.0\ntitle: TypeAndKind\nkind: state_contract\nstatus: mathematical_wip\nlayer: 01_state\nrole: BaseType\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - ContractConstitution\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This contract defines the BaseType boundary.\n\n\n    BaseTypes are inert schema-bound data.\n\n    BaseTypes do not validate themselves, repair themselves, compute heavy derived\n    values, mutate\n\n    external state, terminalize, or execute.\n\n    '\n  non_role: &id002\n  - validation\n  - repair\n  - computation\n  - solver invocation\n  - search invocation\n  - policy interpretation\n  - terminalization\n  - execution\n  - authority promotion\n  - hidden service handles\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\n      terminalize,\n\n      authorize transitions, execute transitions, or upgrade evidence authority.\n\n\n      LLM output may propose BaseType or kind definitions, but those proposals are\n      EvidenceOnly until\n\n      checked against this contract and the SchemaKernel.\n\n      '\n  certificate_authority_bound:\n    doctrine: 6\n    text: 'Certificate authority MUST NOT exceed attached evidence authority. No type\n      certificate may claim\n\n      authority beyond the evidence it binds.\n\n      '\n  classification:\n    subsystem: Type System\n    role: Inert schema-bound data definition.\n    classification: 'State layer -- TypeAndKind is NOT an operator. It defines the\n      type system and kind hierarchy that operators and state spaces are built upon.\n      TypeAndKind has no effect-class assignment (effect_class: none). Only the five\n      canonical effect-classes (E, I, C, R, M) are operators.'\n  core_definition: 'A BaseType is a non-executable, schema-bound structural data object\n    with explicit fields and\n\n    declared invariants, supporting only field access, declared invariant listing,\n    canonical\n\n    serialization, and trivial bounded projection, and containing no embedded execution\n    logic,\n\n    orchestration, search, policy behavior, or external dependencies.\n\n\n    BaseType may expose declared invariants as data references, but it must not decide\n    whether those\n\n    invariants hold for itself.\n\n    '\n  architectural_mandate:\n  - name: Formally Enforced Non-Executable Restriction\n    description: 'A BaseType MUST NOT expose any method that:\n\n      - Mutates external state\n\n      - Performs IO\n\n      - Invokes operators, engines, or solvers\n\n      - Performs iteration over alternative states\n\n\n      Allowed methods must be strictly restricted to:\n\n      - Field accessors\n\n      - Pure projections (O(1) or bounded structural computation)\n\n      - Declared invariant accessors\n\n      '\n  - name: Separation of Invariants vs Validation Logic\n    description: 'BaseType declares invariants; Validators enforce them.\n\n      A BaseType MUST NOT validate itself. It MUST NOT silently \"fix\" or repair invalid\n      data.\n\n      '\n  - name: Strict Mutability Semantics\n    enum_name: MutabilityMode\n    default: Immutable\n    variants:\n    - Immutable\n    - Controlled:\n        allowed_fields: '&''static [&''static str]'\n    - FrozenAfterConstruction\n    description: 'Mutability is tightly restricted and structurally typed.\n\n      - Mutation must not violate declared invariants.\n\n      - Mutation must not trigger external side effects.\n\n      Controlled mutability is allowed only during construction or within explicitly\n      declared\n\n      builder/initialization boundaries. Runtime mutation of authority-bearing state\n      requires a\n\n      licensed transition outside BaseType.\n\n      '\n  - name: Boundary Law (Representation Identity)\n    description: 'Two BaseTypes are identical if and only if:\n\n      - They share the same SchemaRef\n\n      - They share the same field structure\n\n      - They share the same invariant set\n\n\n      Any change in SchemaRef implies a fundamentally different type, thus requiring\n      an Adapter\n\n      to map between them. Schema version changes require Adapter unless the change\n      is explicitly\n\n      declared backward-compatible by SchemaKernel.\n\n      '\n  - name: No Lazy Computation\n    description: 'A BaseType MUST NOT contain lazy-evaluated fields that trigger computation\n      when accessed.\n\n      All heavy derivation belongs in declared Functional, Observable, Solver, Evaluator,\n      or other\n\n      appropriate boundary—not in type accessors.\n\n      '\n  - name: No Internal Caching\n    description: 'A BaseType MUST NOT maintain internal caches that affect observable\n      outputs. Same input must\n\n      guarantee identical observable behavior to preserve determinism.\n\n      '\n  - name: Explicit Fields\n    description: 'All fields within a BaseType MUST be:\n\n      - Declared\n\n      - Typed\n\n      - Serializable\n\n\n      Forbidden patterns include:\n\n      - Hidden metadata\n\n      - Implicit derived fields\n\n      - Runtime-only shadow fields\n\n      '\n  - name: Serialization Law\n    description: 'A BaseType MUST support canonical serialization. Serialization must\n      preserve all invariants\n\n      and type identity, which is critical for tracing, persistence, and mathematical\n      reproducibility.\n\n      Canonical serialization MUST produce stable bytes for hashing.\n\n\n      Serialization proves stable representation only. It does not validate invariants\n      or prove\n\n      semantic truth.\n\n      '\n  - name: Strict Role Classification\n    description: 'A BaseType MUST declare exactly ONE primary role (e.g. State, Artifact,\n      Value). Secondary roles\n\n      must be explicit extensions to prevent semantic ambiguity.\n\n      '\n  - name: No Dependency Handles\n    description: 'A BaseType MUST NOT contain:\n\n      - Arc<...> to engine services\n\n      - Database handles\n\n      - Runtime schedulers\n\n      - Policy engines\n\n      - Registries\n\n\n      Even if the handle is \"unused,\" it violates the strictly pure data boundary\n      of the type.\n\n      '\n  canonical_rust_boundary:\n    trait_name: BaseType\n    sealed: true\n    methods:\n    - name: schema_ref\n      return_type: '&''static SchemaRef'\n    - name: schema_version\n      return_type: '&''static SchemaVersion'\n    - name: kind_id\n      return_type: '&''static KindId'\n    - name: declared_invariants\n      return_type: '&''static [InvariantRef]'\n    - name: role_id\n      return_type: '&''static RoleId'\n    - name: canonical_serialization_id\n      return_type: '&''static CanonicalSerializationId'\n    note: This interface cleanly separates schema identity and invariant declarations\n      from enforcement. BaseType must not enforce its own invariants.\n  authority_effect:\n    description: 'A BaseType instance is inert data. A TypeDefinition artifact describing\n      a BaseType is\n\n      StructureArtifact and may be EvidenceOnly until schema-checked. The BaseType\n      value itself\n\n      carries no authority effect.\n\n      '\n    default: AuthorityEffect::None\n    forbidden_emissions:\n    - EvidenceOnly\n    - FactOnly\n    - RequiresEvaluator\n    - RequestsDecision\n    - AuthorizesTransition\n    - StateTransition\n    typedef_note: A TypeDefinition artifact describing a BaseType may be EvidenceOnly\n      until schema-checked.\n  required_subsystems:\n    description: 'The BaseType cannot carry the burden of schema identity alone. It\n      requires a dedicated SchemaKernel:\n\n      '\n    subsystems:\n    - SchemaKernel\n    - KindKernel\n    - RoleKernel\n    - InvariantKernel\n    - ValidationKernel\n    - AdapterKernel\n    - SerializationKernel\n    explicit_structures:\n    - SchemaRef\n    - SchemaVersion\n    - KindId\n    - InvariantRef\n    - CanonicalSerializationId\n    - RoleId\n  admissibility_checklist:\n  - No executable logic beyond accessors\n  - Invariants declared, not enforced internally\n  - Mutability is explicit and bounded\n  - Schema identity is explicit\n  - No lazy computation\n  - No internal caches\n  - All fields are explicit and serializable\n  - Canonical serialization exists\n  - Exactly one primary semantic role\n  - No dependency handles\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - execute(\n    - terminalize(\n    - interpret_policy\n    - EngineDecision\n    - PolicyDecision\n    - TerminalEnvelope\n    - solve_\n    - search_\n    - generate_candidates\n    - apply_operator\n    - mutate_runtime\n    - database_handle\n    - scheduler_handle\n    - registry_handle\n    - engine_handle\n    - policy_handle\n    - solver_handle\n  required_tests:\n    purity_tests:\n    - basetype_has_no_io\n    - basetype_has_no_operator_handles\n    - basetype_has_no_lazy_fields\n    - basetype_has_no_internal_cache\n    - schema_change_requires_adapter\n    - canonical_serialization_roundtrip_preserves_identity\n    - validation_unit_enforces_invariants_not_basetype\n    - basetype_declares_exactly_one_primary_role\n    integration_tests:\n    - pipeline_handoff_rejects_different_schema_ref\n    - adapter_required_when_schema_versions_differ\n    - trace_hash_stable_under_canonical_serialization\n    - engine_cannot_store_runtime_services_inside_state_basetypes\n    - analysis_can_read_basetype_but_cannot_mutate_or_repair\n    required_tests:\n    - basetype_authority_effect_is_none\n    - basetype_does_not_validate_itself\n    - basetype_does_not_mutate_external_state\n    - basetype_has_no_solver_handles\n    - basetype_has_no_policy_handles\n    - basetype_has_no_runtime_handles\n    - canonical_serialization_bytes_stable\n    - schema_version_change_requires_adapter\n    - basetype_value_has_no_authority_effect\n    - typedef_artifact_is_structure_not_fact\n    - basetype_declares_kind_id\n    - basetype_declares_invariants_but_does_not_enforce\n    - serialization_does_not_validate_invariants\n    - controlled_mutability_is_construction_scoped\n    - basetype_contains_no_engine_policy_solver_or_registry_handles\n  target_architecture:\n    note: 'The type layer relies on a clear separation of kernels:'\n    layers:\n    - name: BaseType\n      role: inert data only\n    - name: SchemaKernel\n      role: schema identity and versioning\n    - name: InvariantKernel\n      role: invariant declarations\n    - name: ValidationKernel\n      role: invariant enforcement\n    - name: AdapterKernel\n      role: schema migration and representation conversion\n    - name: SerializationKernel\n      role: canonical bytes and hashing\n  canonical_invariant: 'BaseType is inert schema-bound data. It declares schema, kind,\n    role, invariants, and canonical\n\n    serialization identity, but it does not validate, repair, search, solve, evaluate,\n    terminalize,\n\n    authorize, mutate external state, or execute. BaseType values carry no authority\n    effect;\n\n    TypeDefinition artifacts are StructureArtifact.\n\n    '\n  legacy_metadata:\n    name: TypeAndKind\n    role: Defines the type system and kind hierarchy for all typed entities in the\n      Omega Engine\n    classification: state\n    effect_class: none\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: StructureArtifact\n    referenced_output_families:\n    - EvidenceEnvelope\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - urn:omega:constitution:base_state_contract:v1.0.0\n",
      "original_paths": [
