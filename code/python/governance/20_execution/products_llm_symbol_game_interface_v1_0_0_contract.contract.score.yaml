      \"interface_does_not_create_symbol_authority\",\n      \"interface_does_not_authorize_transition\",\n      \"interface_does_not_emit_action_license\",\n      \"interface_intake_witness_is_complete\",\n      \"interface_records_request_and_response_hashes\"\n    ],\n    \"canonical_invariant\": \"LLMSymbolGameInterface is an EvidenceOnly intake boundary. It receives LLMAdapter candidate output,\\nstrips authority claims, records provenance, checks Symbol Game intake preconditions, and forwards\\nonly untrusted candidate material. It does not validate symbol correctness, define grammar authority,\\ncreate symbol authority, certify, evaluate, license, authorize, terminalize, mutate, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"LLMSymbolGameInterface\",\n      \"role\": \"Interface boundary between LLM candidate output and Symbol Game intake\",\n      \"classification\": \"product\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"LLMAdapterContract\",\n        \"SymbolGameContract\",\n        \"PacketContract\"\n      ],\n      \"forbidden_authority\": [\n        \"certification\",\n        \"validation\",\n        \"evaluation\",\n        \"terminalization\",\n        \"execution\",\n        \"transition authorization\",\n        \"action licensing\",\n        \"authority upgrade\",\n        \"operator classification\",\n        \"evidence authority creation\",\n        \"grammar authority creation\",\n        \"symbol authority creation\",\n        \"policy interpretation\",\n        \"tool/oracle authority claim\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"StructureArtifact\",\n        \"EvidenceEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"WitnessEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
