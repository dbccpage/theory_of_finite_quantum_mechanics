            },
            {
              "name": "authority_effect",
              "type": "AuthorityEffect",
              "default": "EvidenceOnly"
            }
          ]
        }
      },
      "authority_bound": "No authority is created at this interface. LLM output enters as untrusted candidate material with\nEvidenceOnly intake provenance.\n\nAny downstream certificate, validation result, or Symbol Game fact derives authority exclusively\nfrom the declared downstream boundary, not from the LLM source or this interface.\n",
      "no_bypass_law": "LLM-originated material MUST NOT enter Symbol Game directly.\n\nIt must pass through:\n  LLMAdapter -> LLMSymbolGameInterface -> Packet / SymbolGame intake\n\nAny direct LLM-to-SymbolGame submission is refused.\n",
      "admissibility_checklist": [
        "LLM output is parseable into a known candidate type",
