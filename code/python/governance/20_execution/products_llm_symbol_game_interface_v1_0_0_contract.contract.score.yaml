              "type": "CandidateType"
            },
            {
              "name": "grammar_ref",
              "type": "GrammarId"
            },
            {
              "name": "alphabet_ref",
              "type": "AlphabetId"
            },
            {
              "name": "request_hash",
              "type": "Hash256"
            },
            {
              "name": "raw_response_hash",
              "type": "Hash256"
            },
            {
              "name": "adapter_output_ref",
              "type": "LlmAdapterOutputRef"
            },
            {
              "name": "provenance_ref",
              "type": "WitnessId"
            },
            {
              "name": "intake_witness_ref",
              "type": "WitnessId"
            },
            {
              "name": "token_count",
              "type": "usize"
            },
            {
              "name": "token_budget",
              "type": "usize"
            },
            {
