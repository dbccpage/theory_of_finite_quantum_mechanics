      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:products:llm_symbol_game_interface:v1.0.0\ntitle: LLMSymbolGameInterface\nkind: product_contract\nstatus: mathematical_wip\nlayer: 07_products\nrole: RepresentationBoundary\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - LLMAdapterContract\n    - SymbolGameContract\n    - PacketContract\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This contract defines the interface boundary where LLM candidate output\n    enters the Symbol Game.\n\n\n    The LLMSymbolGameInterface receives parsed candidate output from the LLM Adapter\n    and submits it to\n\n    the Symbol Game as untrusted candidate material. The interface strips any authority\n    claims present\n\n    in LLM output, records LLM provenance for auditability, and checks intake preconditions\n    for grammar\n\n    declaration, token budget, candidate envelope shape, and parseability before forwarding\n    to the\n\n    Symbol Game.\n\n\n    These intake checks do not validate symbol correctness or grant grammar authority.\n    Symbol Game owns\n\n    grammar parsing and local symbol-rule validation. This interface only ensures\n    the candidate is fit\n\n    for Symbol Game intake.\n\n    '\n  non_role: &id002\n  - certification\n  - validation\n  - evaluation\n  - terminalization\n  - execution\n  - transition authorization\n  - action licensing\n  - authority upgrade\n  - operator classification\n  - evidence authority creation\n  - grammar authority creation\n  - symbol authority creation\n  - policy interpretation\n  - tool/oracle authority claim\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\n      terminalize,\n\n      authorize transitions, execute transitions, classify operators, define grammar\n      authority, define\n\n      symbol authority, claim tool/oracle authority, or upgrade evidence authority.\n\n\n      LLM output entering the Symbol Game must pass through the LLMAdapter and this\n      interface as\n\n      untrusted candidate material.\n\n\n      No LLM output may bypass this interface to enter the Symbol Game as certified,\n      validated, checked,\n\n      terminal, licensed, or authoritative material.\n\n      '\n  classification:\n    subsystem: Product Layer\n    role: Interface boundary between LLM Adapter output and Symbol Game input.\n    classification: 'Product layer -- LLMSymbolGameInterface is NOT an operator in\n      the five-effect-class algebra (E, I, C, R, M). It is an intake interface that\n      bridges two product boundaries: LLM Adapter output and Symbol Game input. It\n      strips, tags, and forwards candidate material.'\n  structural_representation:\n    llm_symbol_game_intake:\n      struct_name: LlmSymbolGameIntake\n      fields:\n      - name: intake_id\n        type: IntakeId\n      - name: packet_id\n        type: PacketId\n      - name: candidate_id\n        type: CandidateId\n      - name: candidate_type\n        type: CandidateType\n      - name: grammar_ref\n        type: GrammarId\n      - name: alphabet_ref\n        type: AlphabetId\n      - name: request_hash\n        type: Hash256\n      - name: raw_response_hash\n        type: Hash256\n      - name: adapter_output_ref\n        type: LlmAdapterOutputRef\n      - name: provenance_ref\n        type: WitnessId\n      - name: intake_witness_ref\n        type: WitnessId\n      - name: token_count\n        type: usize\n      - name: token_budget\n        type: usize\n      - name: intake_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n  authority_bound: 'No authority is created at this interface. LLM output enters as\n    untrusted candidate material with\n\n    EvidenceOnly intake provenance.\n\n\n    Any downstream certificate, validation result, or Symbol Game fact derives authority\n    exclusively\n\n    from the declared downstream boundary, not from the LLM source or this interface.\n\n    '\n  no_bypass_law: \"LLM-originated material MUST NOT enter Symbol Game directly.\\n\\n\\\n    It must pass through:\\n  LLMAdapter -> LLMSymbolGameInterface -> Packet / SymbolGame\\\n    \\ intake\\n\\nAny direct LLM-to-SymbolGame submission is refused.\\n\"\n  admissibility_checklist:\n  - LLM output is parseable into a known candidate type\n  - Grammar is declared in the candidate envelope\n  - Symbols are drawn from the declared alphabet\n  - Token budget is not exceeded\n  - LLM provenance metadata is attached (model_id, request_hash, adapter_version)\n  - Authority claims are absent or have been stripped\n  - Candidate type matches a Symbol Game input kind\n  refusal_conditions:\n  - unparseable LLM output\n  - undeclared grammar\n  - undeclared symbols outside allowed alphabet\n  - token budget exceeded\n  - missing LLM provenance metadata\n  - authority claims present in LLM output after stripping\n  - unknown candidate type for Symbol Game\n  - prompt/response hash mismatch\n  - malformed candidate envelope\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - certify(\n    - validate_as_authority\n    - evaluate_admissibility\n    - terminalize(\n    - authority_upgrade\n    - sign_certificate\n    - create_certificate\n    - execute_transition\n    - authorize_transition\n    - license_transition\n    - classify_operator\n    - create_grammar_authority\n    - create_symbol_authority\n    - claim_oracle_authority\n    - self_certify\n  required_tests:\n  - interface_strips_authority_claims_from_llm_output\n  - interface_records_llm_provenance\n  - interface_rejects_unparseable_output\n  - interface_rejects_undeclared_grammar\n  - interface_rejects_undeclared_symbols\n  - interface_rejects_token_budget_exceeded\n  - interface_output_is_candidate_only\n  - interface_rejects_authority_claims_in_llm_output\n  - interface_output_defaults_to_evidence_only\n  - interface_requires_llm_adapter_output_ref\n  - interface_refuses_direct_llm_to_symbol_game_bypass\n  - interface_does_not_validate_symbol_correctness\n  - interface_does_not_create_grammar_authority\n  - interface_does_not_create_symbol_authority\n  - interface_does_not_authorize_transition\n  - interface_does_not_emit_action_license\n  - interface_intake_witness_is_complete\n  - interface_records_request_and_response_hashes\n  canonical_invariant: 'LLMSymbolGameInterface is an EvidenceOnly intake boundary.\n    It receives LLMAdapter candidate output,\n\n    strips authority claims, records provenance, checks Symbol Game intake preconditions,\n    and forwards\n\n    only untrusted candidate material. It does not validate symbol correctness, define\n    grammar authority,\n\n    create symbol authority, certify, evaluate, license, authorize, terminalize, mutate,\n    or execute.\n\n    '\n  legacy_metadata:\n    name: LLMSymbolGameInterface\n    role: Interface boundary between LLM candidate output and Symbol Game intake\n    classification: product\n    effect_class: none\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: EvidenceEnvelope\n    referenced_output_families:\n    - StructureArtifact\n    - EvidenceEnvelope\n    - Record\n    referenced_domain_kinds:\n    - WitnessEnvelope\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n",
