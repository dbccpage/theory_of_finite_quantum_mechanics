    "doctrine": {
      "summary": "This contract defines the interface boundary where LLM candidate output enters the Symbol Game.\n\nThe LLMSymbolGameInterface receives parsed candidate output from the LLM Adapter and submits it to\nthe Symbol Game as untrusted candidate material. The interface strips any authority claims present\nin LLM output, records LLM provenance for auditability, and checks intake preconditions for grammar\ndeclaration, token budget, candidate envelope shape, and parseability before forwarding to the\nSymbol Game.\n\nThese intake checks do not validate symbol correctness or grant grammar authority. Symbol Game owns\ngrammar parsing and local symbol-rule validation. This interface only ensures the candidate is fit\nfor Symbol Game intake.\n",
      "non_role": [
        "certification",
        "validation",
        "evaluation",
        "terminalization",
        "execution",
        "transition authorization",
        "action licensing",
        "authority upgrade",
        "operator classification",
        "evidence authority creation",
        "grammar authority creation",
        "symbol authority creation",
        "policy interpretation",
        "tool/oracle authority claim"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, classify operators, define grammar authority, define\nsymbol authority, claim tool/oracle authority, or upgrade evidence authority.\n\nLLM output entering the Symbol Game must pass through the LLMAdapter and this interface as\nuntrusted candidate material.\n\nNo LLM output may bypass this interface to enter the Symbol Game as certified, validated, checked,\nterminal, licensed, or authoritative material.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Interface boundary between LLM Adapter output and Symbol Game input.",
        "classification": "Product layer -- LLMSymbolGameInterface is NOT an operator in the five-effect-class algebra (E, I, C, R, M). It is an intake interface that bridges two product boundaries: LLM Adapter output and Symbol Game input. It strips, tags, and forwards candidate material."
      },
      "structural_representation": {
        "llm_symbol_game_intake": {
          "struct_name": "LlmSymbolGameIntake",
          "fields": [
            {
              "name": "intake_id",
              "type": "IntakeId"
            },
            {
              "name": "packet_id",
              "type": "PacketId"
            },
            {
