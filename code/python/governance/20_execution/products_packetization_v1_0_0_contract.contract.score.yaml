    "doctrine": {
      "summary": "This contract defines the Packetization product boundary.\n\nPacketization translates between:\n- external envelope: JSON / markdown / API payload\n- symbol payload: terse Symbol Game grammar\n- internal packet: typed AST / checked packet representation\n\nPacketization does not prove the mathematical claim inside a packet. It emits EvidenceOnly witness\ndata that the payload was parsed, normalized, typed, and round-tripped according to the declared\ngrammar and schema.\n",
      "non_role": [
        "proving mathematical claims",
        "semantic truth claim",
        "certification",
        "validation of semantic correctness",
        "evaluation",
        "terminalization",
        "execution",
        "mutation",
        "authority upgrade",
        "action licensing",
        "transition authorization",
        "grammar authority creation",
        "schema authority creation"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, define grammar authority, define schema authority,\nor upgrade evidence authority.\n\nAn LLM may produce payloads that are packetized, but packetization only emits parse, normalization,\ntype, schema, and roundtrip evidence.\n\nLLM output carries no authority; downstream boundaries determine semantic validity, evaluation\nstatus, certificates, licenses, and actions.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Translation between external envelopes, symbol payloads, and internal typed packets.",
        "classification": "Product layer -- representation and transport boundary."
      },
