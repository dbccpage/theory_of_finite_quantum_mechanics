      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:validator:v1.0.0\",\n  \"title\": \"Validator\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"Validator\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"CertificateContract\",\n        \"TraceContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constraints\": {\n      \"mutation_forbidden\": true,\n      \"read_only\": true,\n      \"typed_output_required\": true\n    },\n    \"subject_type\": \"ConstructedObject\"\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Validator boundary.\\n\\nValidators check well-formedness, invariants, and admissibility boundaries.\\nValidators check structure. Validators do not transform, normalize, repair, certify,\\nterminalize, execute, or mutate state.\\n\",\n    \"non_role\": [\n      \"repair\",\n      \"certification\",\n      \"execution\",\n      \"evaluation\",\n      \"mutation\",\n      \"normalization\",\n      \"terminalization\",\n      \"transition_authorization\",\n      \"action_licensing\",\n      \"invariant_definition_from_llm_output\",\n      \"trace_writing\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\\nterminalize, authorize transitions, execute transitions, define invariants, or upgrade\\nevidence authority.\\n\\nLLM output may propose validator code, invariant candidates, countermodels, or test\\ncases, but those proposals are EvidenceOnly until checked by the declared Validator,\\nSchema, Replay, and Contract boundaries.\\n\"\n    },\n    \"classification\": \"Validator is NOT an operator in the five-effect-class algebra (E, I, C, R, M). It is a\\nstructural well-formedness checker that inspects objects against declared invariants and\\nreports validity.\\n\",\n    \"core_definition\": \"Validator checks structural well-formedness against declared invariants. It does not\\nrepair, certify, evaluate admissibility, mutate, or execute.\\n\\nA Validator is a deterministic, non-mutating component that inspects an already-constructed\\nobject and emits a validation report.\\n\\nInput object -> Validator -> ValidationReport\\n\\nA Validator may reject malformed or inadmissible structure.\\nA Validator may not create a repaired replacement.\\n\",\n    \"tower_placement\": \"Validators sit at structural boundaries to protect the downstream engine and solvers from\\nmalformed syntax or out-of-bound representations.\\n\\nInput T -> Validator -> [ValidationReport: Valid / Invalid / Indeterminate]\\n\\nUnlike Constructors, which create objects, Validators act on already-instantiated objects T.\\nUnlike Evaluators, which judge operational admissibility based on computed diagnostics,\\nValidators judge strict structural conformance.\\n\",\n    \"trait_shape\": {\n      \"rust\": \"pub trait Validator<T> {\\n    type Report;\\n\\n    fn validate(&self, target: &T) -> Result<Self::Report, ValidationError>;\\n\\n    fn authority_effect(&self) -> AuthorityEffect {\\n        AuthorityEffect::EvidenceOnly\\n    }\\n}\\n\"\n    },\n    \"structural_representation\": {\n      \"validation_report\": {\n        \"struct_name\": \"ValidationReport\",\n        \"fields\": [\n          {\n            \"name\": \"target_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"validator_id\",\n            \"type\": \"ValidatorId\"\n          },\n          {\n            \"name\": \"invariants_checked\",\n            \"type\": \"Vec<InvariantId>\"\n          },\n          {\n            \"name\": \"status\",\n            \"type\": \"ValidationStatus\"\n          },\n          {\n            \"name\": \"violations\",\n            \"type\": \"Vec<ValidationViolation>\"\n          },\n          {\n            \"name\": \"report_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked_validation_report\": {\n        \"struct_name\": \"CheckedValidationReport\",\n        \"fields\": [\n          {\n            \"name\": \"report_ref\",\n            \"type\": \"ValidationReportRef\"\n          },\n          {\n            \"name\": \"schema_ref\",\n            \"type\": \"SchemaRef\"\n          },\n          {\n            \"name\": \"validation_certificate_ref\",\n            \"type\": \"Option<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"Option<ReplayRef>\"\n          },\n          {\n            \"name\": \"checked_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"ValidationStatus\",\n          \"variants\": [\n            \"Valid\",\n            \"Invalid\",\n            \"Indeterminate\"\n          ]\n        },\n        {\n          \"name\": \"ValidationError\",\n          \"variants\": [\n            {\n              \"name\": \"InvalidStructure\",\n              \"fields\": {\n                \"violation\": \"ValidationViolation\"\n              }\n            },\n            {\n              \"name\": \"OutOfBoundsValue\",\n              \"fields\": {\n                \"invariant_id\": \"InvariantId\",\n                \"detail\": \"String\"\n              }\n            },\n            {\n              \"name\": \"InvariantViolated\",\n              \"fields\": {\n                \"invariant_id\": \"InvariantId\",\n                \"detail\": \"String\"\n              }\n            },\n            {\n              \"name\": \"SchemaMismatch\",\n              \"fields\": {\n                \"expected\": \"SchemaRef\",\n                \"actual\": \"SchemaRef\"\n              }\n            },\n            {\n              \"name\": \"HashMismatch\",\n              \"fields\": {\n                \"expected\": \"Hash256\",\n                \"actual\": \"Hash256\"\n              }\n            },\n            {\n              \"name\": \"UndeclaredInvariant\",\n              \"fields\": {\n                \"invariant_id\": \"InvariantId\"\n              }\n            },\n            {\n              \"name\": \"ValidatorInternalError\",\n              \"fields\": {\n                \"detail\": \"String\"\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"architectural_mandates\": [\n      {\n        \"name\": \"Non-Mutating Verification\",\n        \"text\": \"A Validator MUST NOT mutate the target object, external state, or intermediate representations. Its receiver is always immutable (&self, &T).\"\n      },\n      {\n        \"name\": \"Zero Repair or Correction\",\n        \"text\": \"A Validator MUST NOT attempt to normalize, repair, or resolve an anomaly. It returns either a successful validation report or an explicit validation error. Any repair behavior belongs to Normalizers or Reducers under explicit Engine orchestration.\"\n      },\n      {\n        \"name\": \"Invariant Bound Checks\",\n        \"text\": \"Every validation check must map directly to a declared invariant of the carrier or domain schema.\"\n      },\n      {\n        \"name\": \"No Certification Authority\",\n        \"text\": \"A Validator reports structural well-formedness. It does not sign, create, or verify certificates. If certification is required, CertificateKernel may seal a certificate over a ValidationReport.\"\n      },\n      {\n        \"name\": \"No Evaluation Authority\",\n        \"text\": \"A Validator checks structure, not admissibility. Admissibility judgment belongs to the Evaluator.\"\n      }\n    ],\n    \"authority_levels\": \"A raw ValidationReport is EvidenceOnly.\\n\\nA CheckedValidationReport may become FactOnly only for the claim that the target\\nsatisfied or violated the declared structural invariants under the declared validator,\\nschema, input hash, and replay/checking boundary.\\n\",\n    \"evidence_integration\": \"When a ValidationReport is emitted within traced execution or audit flow, the report\\nmust record: target_hash, validator_id, schema_ref, invariants_checked, validation status,\\nviolation refs or details, report_hash, replay refs when replayable, certificate refs\\nonly if produced by CertificateKernel.\\n\",\n    \"symsys_integration\": \"Validators are used to verify the outputs of all symbolic stages:\\n  Stage 1 (Ideation): Emits structures that must immediately be validated.\\n  Stage 2 (Audit): Audits the validator itself for potential bypasses.\\n  Stage 3 (Extraction): Generates the invariant checking code.\\n  Stage 4 (Countermodel): Attempts to generate models that bypass validator checks.\\n  Stage 5 (Evidence Plan): Validates that all candidate models adhere to invariants.\\n\\nSymSys use of validators does not expand validator authority. Validator reports remain\\nEvidenceOnly until checked or certified by the declared boundary.\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"repair_target\",\n        \"normalize_target\",\n        \"fix_target\",\n        \"EngineResult\",\n        \"PolicyDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"sign_certificate\",\n        \"save_certificate\",\n        \"create_certificate\",\n        \"execute(\",\n        \"mutate_state\",\n        \"mutate_runtime\",\n        \"certify(\",\n        \"terminalize(\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"evaluate_admissibility\",\n        \"authorize_transition\",\n        \"license_transition\"\n      ]\n    },\n    \"required_tests\": [\n      \"validator_report_defaults_to_evidence_only\",\n      \"checked_validation_report_may_be_factonly_after_declared_checks\",\n      \"validator_does_not_define_invariants_from_llm_output\",\n      \"validator_does_not_emit_action_license\",\n      \"validator_does_not_authorize_transition\",\n      \"validator_does_not_terminalize\",\n      \"validator_does_not_create_certificates\",\n      \"validator_uses_valid_invalid_indeterminate_not_accept_reject\",\n      \"validator_does_not_write_trace_directly\",\n      \"validator_certificate_refs_are_external\",\n      \"validator_errors_are_typed\"\n    ],\n    \"python_poc_shape\": \"@dataclass(frozen=True)\\nclass ValidationReport:\\n    target_hash: str\\n    validator_id: str\\n    schema_ref: str\\n    invariants_checked: List[str]\\n    status: str  # \\\"Valid\\\", \\\"Invalid\\\", or \\\"Indeterminate\\\"\\n    violations: List[str]\\n    authority_effect: str = \\\"EvidenceOnly\\\"\\n\",\n    \"canonical_invariant\": \"Validator is an EvidenceOnly structural checking boundary. It checks already-constructed\\nobjects against declared schemas and invariants, emits ValidationReport evidence, and does\\nnot repair, normalize, certify, define invariants, evaluate admissibility, terminalize,\\nauthorize, mutate, write Trace directly, or execute. Checked validation facts require a\\ndeclared checking, replay, or certificate boundary.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Validator\",\n      \"role\": \"Deterministic structural well-formedness checker against declared invariants\",\n      \"version\": \"1.0\",\n      \"classification\": \"governance\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"CertificateContract\",\n        \"TraceContract\"\n      ],\n      \"forbidden_authority\": [\n        \"repair\",\n        \"certification\",\n        \"execution\",\n        \"evaluation\",\n        \"mutation\",\n        \"normalization\",\n        \"terminalization\",\n        \"transition_authorization\",\n        \"action_licensing\",\n        \"invariant_definition_from_llm_output\",\n        \"trace_writing\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"ValidationReport\",\n      \"checked_domain_output_kind\": \"CheckedValidationReport\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"CertificateEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
