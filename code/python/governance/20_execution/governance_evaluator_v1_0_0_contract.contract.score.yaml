      "escalation_mechanics": "Escalation is a Verdict, not an Action and not a StateTransition.\n\n1. Evaluator returns Escalate.\n2. Engine receives the verdict and decides whether to trigger a Lift or a Solver change.\n3. Evaluator remains pure and read-only.\n",
      "evaluator_vs_policy_boundary": "Policy defines admissibility clauses.\nEvaluator applies those clauses to evidence.\nEvaluator MUST NOT create, edit, or reinterpret policy.\n",
