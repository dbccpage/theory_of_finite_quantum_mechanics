    "doctrine": {
      "summary": "This contract defines the Evaluator boundary.\n\nEvaluator applies declared evaluation policy to already-computed facts.\nEvaluator does not measure, discover, mutate, terminalize, or execute.\n",
      "non_role": [
        "measurement",
        "computation",
        "certification",
        "terminalization",
        "execution",
        "mutation",
        "structural discovery",
        "operator execution",
        "state mutation"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "LLM-generated content carries zero authority in the Evaluator boundary. LLM output is\ncandidate material only. All evaluation decisions are deterministic functions of typed\nevidence and declared policy. No LLM output may influence verdict derivation, policy\ninterpretation, or evidence weighting.\n"
      },
      "core_definition": "An Evaluator is a deterministic, read-only decision layer that consumes FactEnvelopes\n(from Analysis) and DiagnosticReports (from Diagnostics), applies explicit EvaluationPolicy,\nand returns a typed EvaluationResult. It is the critical semantic bridge where factual\nobservations are classified as admissibility judgments.\n\nAn Evaluator is a deterministic judgment function over already-computed facts.\nIt does not measure. It does not search. It does not execute.\nIt does not discover obstruction structure.\nIt applies declared admissibility policy to evidence.\n",
      "trait_shape": {
        "rust": "pub trait Evaluator<C> {\n    fn evaluator_id(&self) -> EvaluatorId;\n    fn evaluator_version(&self) -> EvaluatorVersion;\n\n    fn evaluate(\n        &self,\n        input: &EvaluationInput<C>,\n        policy: &EvaluationPolicy,\n    ) -> Result<EvaluationResult, EvaluationError>;\n}\n",
        "properties": [
          "&self: No mutation of evaluator.",
          "&EvaluationInput<C>: Read-only input containing candidates and pre-computed fact envelopes.",
          "&EvaluationPolicy: Explicit thresholds using ToleranceSpec or MeasurementValue."
        ]
      },
