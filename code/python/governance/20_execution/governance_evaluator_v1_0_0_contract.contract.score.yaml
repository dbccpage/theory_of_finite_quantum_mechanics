      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:governance:evaluator:v1.0.0\ntitle: Evaluator\nkind: governance_contract\nstatus: mathematical_wip\nlayer: 05_governance\nrole: Evaluator\ndescriptor:\n  authority_effect: requests_decision\n  evidence_ceiling: LocalReplay\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - PolicyContract\n    - CertificateContract\n    - DiagnosticContract\n    - AnalysisUnit\n    - HealthModelKernel\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\n  constitution:\n    contract_dependencies: *id001\n    emits: DecisionEnvelope\n    authority_layer: Judgment\n    replay_certificates:\n    - schema_hash\n  constraints:\n    mutation_forbidden: true\n    runtime_orchestration_forbidden: true\n    typed_output_required: true\n  subject_type: EvaluationInput\n  capabilities:\n    forbidden:\n    - ComputePhi\n    - ComputeGamma\n    required: []\ndoctrine:\n  summary: 'This contract defines the Evaluator boundary.\n\n\n    Evaluator applies declared evaluation policy to already-computed facts.\n\n    Evaluator does not measure, discover, mutate, terminalize, or execute.\n\n    '\n  non_role: &id002\n  - measurement\n  - computation\n  - certification\n  - terminalization\n  - execution\n  - mutation\n  - structural discovery\n  - operator execution\n  - state mutation\n  llm_boundary_law:\n    doctrine: 5\n    text: 'LLM-generated content carries zero authority in the Evaluator boundary.\n      LLM output is\n\n      candidate material only. All evaluation decisions are deterministic functions\n      of typed\n\n      evidence and declared policy. No LLM output may influence verdict derivation,\n      policy\n\n      interpretation, or evidence weighting.\n\n      '\n  core_definition: 'An Evaluator is a deterministic, read-only decision layer that\n    consumes FactEnvelopes\n\n    (from Analysis) and DiagnosticReports (from Diagnostics), applies explicit EvaluationPolicy,\n\n    and returns a typed EvaluationResult. It is the critical semantic bridge where\n    factual\n\n    observations are classified as admissibility judgments.\n\n\n    An Evaluator is a deterministic judgment function over already-computed facts.\n\n    It does not measure. It does not search. It does not execute.\n\n    It does not discover obstruction structure.\n\n    It applies declared admissibility policy to evidence.\n\n    '\n  trait_shape:\n    rust: \"pub trait Evaluator<C> {\\n    fn evaluator_id(&self) -> EvaluatorId;\\n\\\n      \\    fn evaluator_version(&self) -> EvaluatorVersion;\\n\\n    fn evaluate(\\n\\\n      \\        &self,\\n        input: &EvaluationInput<C>,\\n        policy: &EvaluationPolicy,\\n\\\n      \\    ) -> Result<EvaluationResult, EvaluationError>;\\n}\\n\"\n    properties:\n    - '&self: No mutation of evaluator.'\n    - '&EvaluationInput<C>: Read-only input containing candidates and pre-computed\n      fact envelopes.'\n    - '&EvaluationPolicy: Explicit thresholds using ToleranceSpec or MeasurementValue.'\n  structural_representation:\n    evaluation_input:\n      struct_name: EvaluationInput\n      type_params:\n      - C\n      fields:\n      - name: parent\n        type: C\n      - name: candidate\n        type: C\n      - name: facts\n        type: Vec<FactEnvelope>\n      - name: health\n        type: DiagnosticReport\n      - name: input_hash\n        type: Hash256\n      - name: fact_refs\n        type: Vec<FactId>\n    evaluation_policy:\n      struct_name: EvaluationPolicy\n      fields:\n      - name: policy_id\n        type: PolicyId\n      - name: clauses\n        type: Vec<EvaluationClause>\n      - name: precedence\n        type: ClausePrecedence\n      - name: evidence_requirements\n        type: EvidenceRequirements\n    evaluation_result:\n      struct_name: EvaluationResult\n      fields:\n      - name: verdict\n        type: EvaluationVerdict\n      - name: policy_id\n        type: PolicyId\n      - name: clauses_fired\n        type: Vec<ClauseId>\n      - name: evidence_used\n        type: Vec<EvidenceRef>\n      - name: evaluator_id\n        type: EvaluatorId\n      - name: evaluator_version\n        type: EvaluatorVersion\n      - name: input_hash\n        type: Hash256\n      - name: output_hash\n        type: Hash256\n      - name: policy_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: RequiresEvaluator\n    enums:\n    - name: EvaluationVerdict\n      variants:\n      - name: Accept\n        fields:\n          evidence: EvidenceRef\n      - name: Reject\n        fields:\n          reason: RejectionReason\n          evidence: EvidenceRef\n      - name: Escalate\n        fields:\n          route: EscalationRoute\n          witness: WitnessId\n  escalation_mechanics: 'Escalation is a Verdict, not an Action and not a StateTransition.\n\n\n    1. Evaluator returns Escalate.\n\n    2. Engine receives the verdict and decides whether to trigger a Lift or a Solver\n    change.\n\n    3. Evaluator remains pure and read-only.\n\n    '\n  evaluator_vs_policy_boundary: 'Policy defines admissibility clauses.\n\n    Evaluator applies those clauses to evidence.\n\n    Evaluator MUST NOT create, edit, or reinterpret policy.\n\n    '\n  evaluator_vs_terminalizer_boundary:\n    evaluator_may_emit:\n    - Accept\n    - Reject\n    - Escalate\n    evaluator_must_not_emit:\n    - Exact\n    - Refused\n    - Survivor\n    - Open\n    - AllowOutput\n    - BlockOutput\n  separation_from_discovery:\n    must_not:\n    - Discover new critical pairs\n    - Propose structural repairs\n    - Invoke MetaLift\n    - Call Adapters\n    - Terminalize state\n    - Create certificates\n    - Sign certificates\n    - Mutate storage\n    - Emit Engine actions\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - EngineResult\n    - TerminalEnvelope\n    - DecisionCertificate\n    - sign_certificate\n    - save_certificate\n    - terminalize\n    - ALLOW_OUTPUT\n    - BLOCK_OUTPUT\n    - mutate\n    - execute\n  target_architecture:\n    evaluator_kernel:\n    - VerdictDeriver\n    - EvidenceChecker\n    - PolicyApplier\n    policy_kernel:\n    - PolicyManifest\n    - ClauseEvaluator\n    - ToleranceSemantics\n    - EvidenceRequirements\n  required_tests:\n    purity_and_separation:\n    - evaluator_cannot_compute_phi\n    - evaluator_cannot_call_solver\n    - evaluator_cannot_call_adapter\n    - evaluator_cannot_emit_lift\n    - evaluator_does_not_terminalize\n    - evaluator_does_not_create_certificate\n    - evaluator_does_not_mutate_storage\n    determinism_and_traceability:\n    - same_facts_same_policy_same_verdict\n    - reject_requires_evidence_ref\n    - escalate_requires_witness\n    - raw_f64_threshold_rejected\n    - policy_hash_recorded_in_verdict\n    - evaluation_result_records_policy_hash\n    - evaluation_result_records_authority_effect\n  integration_tests:\n    pipeline: Analysis -> Diagnostic -> Evaluator -> Engine\n    invariants:\n    - Analysis computes facts.\n    - Diagnostic reports health.\n    - Evaluator emits verdict.\n    - Engine executes consequence.\n    - The Evaluator must never mutate state or trigger control flow directly.\n  canonical_invariant: 'Evaluator applies declared evaluation policy to evidence;\n    it does not measure, certify,\n\n    terminalize, mutate, or execute.\n\n    '\n  legacy_metadata:\n    name: Evaluator\n    role: Deterministic admissibility judgment gate over evidence and policy\n    version: '1.0'\n    classification: governance\n    effect_class: none\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: DecisionEnvelope\n    domain_output_kind: EvaluationResult\n    referenced_output_families:\n    - EvidenceEnvelope\n    - FactEnvelope\n    referenced_domain_kinds:\n    - EvaluationVerdict\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n",
