      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:evaluator:v1.0.0\",\n  \"title\": \"Evaluator\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"Evaluator\",\n  \"descriptor\": {\n    \"authority_effect\": \"requests_decision\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"PolicyContract\",\n        \"CertificateContract\",\n        \"DiagnosticContract\",\n        \"AnalysisUnit\",\n        \"HealthModelKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"PolicyContract\",\n        \"CertificateContract\",\n        \"DiagnosticContract\",\n        \"AnalysisUnit\",\n        \"HealthModelKernel\"\n      ],\n      \"emits\": \"DecisionEnvelope\",\n      \"authority_layer\": \"Judgment\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"constraints\": {\n      \"mutation_forbidden\": true,\n      \"runtime_orchestration_forbidden\": true,\n      \"typed_output_required\": true\n    },\n    \"subject_type\": \"EvaluationInput\",\n    \"capabilities\": {\n      \"forbidden\": [\n        \"ComputePhi\",\n        \"ComputeGamma\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Evaluator boundary.\\n\\nEvaluator applies declared evaluation policy to already-computed facts.\\nEvaluator does not measure, discover, mutate, terminalize, or execute.\\n\",\n    \"non_role\": [\n      \"measurement\",\n      \"computation\",\n      \"certification\",\n      \"terminalization\",\n      \"execution\",\n      \"mutation\",\n      \"structural discovery\",\n      \"operator execution\",\n      \"state mutation\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM-generated content carries zero authority in the Evaluator boundary. LLM output is\\ncandidate material only. All evaluation decisions are deterministic functions of typed\\nevidence and declared policy. No LLM output may influence verdict derivation, policy\\ninterpretation, or evidence weighting.\\n\"\n    },\n    \"core_definition\": \"An Evaluator is a deterministic, read-only decision layer that consumes FactEnvelopes\\n(from Analysis) and DiagnosticReports (from Diagnostics), applies explicit EvaluationPolicy,\\nand returns a typed EvaluationResult. It is the critical semantic bridge where factual\\nobservations are classified as admissibility judgments.\\n\\nAn Evaluator is a deterministic judgment function over already-computed facts.\\nIt does not measure. It does not search. It does not execute.\\nIt does not discover obstruction structure.\\nIt applies declared admissibility policy to evidence.\\n\",\n    \"trait_shape\": {\n      \"rust\": \"pub trait Evaluator<C> {\\n    fn evaluator_id(&self) -> EvaluatorId;\\n    fn evaluator_version(&self) -> EvaluatorVersion;\\n\\n    fn evaluate(\\n        &self,\\n        input: &EvaluationInput<C>,\\n        policy: &EvaluationPolicy,\\n    ) -> Result<EvaluationResult, EvaluationError>;\\n}\\n\",\n      \"properties\": [\n        \"&self: No mutation of evaluator.\",\n        \"&EvaluationInput<C>: Read-only input containing candidates and pre-computed fact envelopes.\",\n        \"&EvaluationPolicy: Explicit thresholds using ToleranceSpec or MeasurementValue.\"\n      ]\n    },\n    \"structural_representation\": {\n      \"evaluation_input\": {\n        \"struct_name\": \"EvaluationInput\",\n        \"type_params\": [\n          \"C\"\n        ],\n        \"fields\": [\n          {\n            \"name\": \"parent\",\n            \"type\": \"C\"\n          },\n          {\n            \"name\": \"candidate\",\n            \"type\": \"C\"\n          },\n          {\n            \"name\": \"facts\",\n            \"type\": \"Vec<FactEnvelope>\"\n          },\n          {\n            \"name\": \"health\",\n            \"type\": \"DiagnosticReport\"\n          },\n          {\n            \"name\": \"input_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"fact_refs\",\n            \"type\": \"Vec<FactId>\"\n          }\n        ]\n      },\n      \"evaluation_policy\": {\n        \"struct_name\": \"EvaluationPolicy\",\n        \"fields\": [\n          {\n            \"name\": \"policy_id\",\n            \"type\": \"PolicyId\"\n          },\n          {\n            \"name\": \"clauses\",\n            \"type\": \"Vec<EvaluationClause>\"\n          },\n          {\n            \"name\": \"precedence\",\n            \"type\": \"ClausePrecedence\"\n          },\n          {\n            \"name\": \"evidence_requirements\",\n            \"type\": \"EvidenceRequirements\"\n          }\n        ]\n      },\n      \"evaluation_result\": {\n        \"struct_name\": \"EvaluationResult\",\n        \"fields\": [\n          {\n            \"name\": \"verdict\",\n            \"type\": \"EvaluationVerdict\"\n          },\n          {\n            \"name\": \"policy_id\",\n            \"type\": \"PolicyId\"\n          },\n          {\n            \"name\": \"clauses_fired\",\n            \"type\": \"Vec<ClauseId>\"\n          },\n          {\n            \"name\": \"evidence_used\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"evaluator_id\",\n            \"type\": \"EvaluatorId\"\n          },\n          {\n            \"name\": \"evaluator_version\",\n            \"type\": \"EvaluatorVersion\"\n          },\n          {\n            \"name\": \"input_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"policy_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"RequiresEvaluator\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"EvaluationVerdict\",\n          \"variants\": [\n            {\n              \"name\": \"Accept\",\n              \"fields\": {\n                \"evidence\": \"EvidenceRef\"\n              }\n            },\n            {\n              \"name\": \"Reject\",\n              \"fields\": {\n                \"reason\": \"RejectionReason\",\n                \"evidence\": \"EvidenceRef\"\n              }\n            },\n            {\n              \"name\": \"Escalate\",\n              \"fields\": {\n                \"route\": \"EscalationRoute\",\n                \"witness\": \"WitnessId\"\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"escalation_mechanics\": \"Escalation is a Verdict, not an Action and not a StateTransition.\\n\\n1. Evaluator returns Escalate.\\n2. Engine receives the verdict and decides whether to trigger a Lift or a Solver change.\\n3. Evaluator remains pure and read-only.\\n\",\n    \"evaluator_vs_policy_boundary\": \"Policy defines admissibility clauses.\\nEvaluator applies those clauses to evidence.\\nEvaluator MUST NOT create, edit, or reinterpret policy.\\n\",\n    \"evaluator_vs_terminalizer_boundary\": {\n      \"evaluator_may_emit\": [\n        \"Accept\",\n        \"Reject\",\n        \"Escalate\"\n      ],\n      \"evaluator_must_not_emit\": [\n        \"Exact\",\n        \"Refused\",\n        \"Survivor\",\n        \"Open\",\n        \"AllowOutput\",\n        \"BlockOutput\"\n      ]\n    },\n    \"separation_from_discovery\": {\n      \"must_not\": [\n        \"Discover new critical pairs\",\n        \"Propose structural repairs\",\n        \"Invoke MetaLift\",\n        \"Call Adapters\",\n        \"Terminalize state\",\n        \"Create certificates\",\n        \"Sign certificates\",\n        \"Mutate storage\",\n        \"Emit Engine actions\"\n      ]\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"EngineResult\",\n        \"TerminalEnvelope\",\n        \"DecisionCertificate\",\n        \"sign_certificate\",\n        \"save_certificate\",\n        \"terminalize\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"mutate\",\n        \"execute\"\n      ]\n    },\n    \"target_architecture\": {\n      \"evaluator_kernel\": [\n        \"VerdictDeriver\",\n        \"EvidenceChecker\",\n        \"PolicyApplier\"\n      ],\n      \"policy_kernel\": [\n        \"PolicyManifest\",\n        \"ClauseEvaluator\",\n        \"ToleranceSemantics\",\n        \"EvidenceRequirements\"\n      ]\n    },\n    \"required_tests\": {\n      \"purity_and_separation\": [\n        \"evaluator_cannot_compute_phi\",\n        \"evaluator_cannot_call_solver\",\n        \"evaluator_cannot_call_adapter\",\n        \"evaluator_cannot_emit_lift\",\n        \"evaluator_does_not_terminalize\",\n        \"evaluator_does_not_create_certificate\",\n        \"evaluator_does_not_mutate_storage\"\n      ],\n      \"determinism_and_traceability\": [\n        \"same_facts_same_policy_same_verdict\",\n        \"reject_requires_evidence_ref\",\n        \"escalate_requires_witness\",\n        \"raw_f64_threshold_rejected\",\n        \"policy_hash_recorded_in_verdict\",\n        \"evaluation_result_records_policy_hash\",\n        \"evaluation_result_records_authority_effect\"\n      ]\n    },\n    \"integration_tests\": {\n      \"pipeline\": \"Analysis -> Diagnostic -> Evaluator -> Engine\",\n      \"invariants\": [\n        \"Analysis computes facts.\",\n        \"Diagnostic reports health.\",\n        \"Evaluator emits verdict.\",\n        \"Engine executes consequence.\",\n        \"The Evaluator must never mutate state or trigger control flow directly.\"\n      ]\n    },\n    \"canonical_invariant\": \"Evaluator applies declared evaluation policy to evidence; it does not measure, certify,\\nterminalize, mutate, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Evaluator\",\n      \"role\": \"Deterministic admissibility judgment gate over evidence and policy\",\n      \"version\": \"1.0\",\n      \"classification\": \"governance\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"PolicyContract\",\n        \"CertificateContract\",\n        \"DiagnosticContract\",\n        \"AnalysisUnit\",\n        \"HealthModelKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"measurement\",\n        \"computation\",\n        \"certification\",\n        \"terminalization\",\n        \"execution\",\n        \"mutation\",\n        \"structural discovery\",\n        \"operator execution\",\n        \"state mutation\"\n      ],\n      \"primary_output_family\": \"DecisionEnvelope\",\n      \"domain_output_kind\": \"EvaluationResult\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"EvaluationVerdict\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
