      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:kleisli_refusal_pipeline:v0.1.0\",\n  \"title\": \"Kleisli Refusal Pipeline Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"kleisli_refusal_pipeline\",\n    \"symbol\": \"f_n >=> f_{n-1} >=> ... >=> f_1 : A_0 -> T(A_n)\",\n    \"ascii_symbol\": \"kleisli_refusal_pipeline\",\n    \"notation\": \"f_n >=> f_{n-1} >=> ... >=> f_1 : A_0 -> T(A_n)\",\n    \"domain\": [\n      \"monad_id: Identifier of the refusal monad T\",\n      \"stages: Ordered sequence of Kleisli arrows f_1, ..., f_n\",\n      \"stage_count: Number of stages n\",\n      \"input_type: Type A_0 (domain of the pipeline)\",\n      \"output_type: Type A_n (codomain of the pipeline, wrapped in T)\",\n      \"composed_hash: Content-addressed hash of the full composed pipeline\"\n    ],\n    \"codomain\": {\n      \"description\": \"A Kleisli refusal pipeline consists of: (1) a refusal monad T (typically Result<_, RefusalReason>), (2) a sequence of stages (Kleisli arrows) f_1, ..., f_n with compatible domain/codomain types, (3) the composed pipeline f_n >=> ... >=> f_1, and (4) content-addressed hashes for each stage and the pipeline.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Adjacent stages must have compatible domain/codomain types\",\n      \"Pipeline must produce deterministic output for the same input\",\n      \"Refusals must include stage index, validator name, and reason\",\n      \"Artifact hash must be correctly computed\"\n    ]\n  },\n  \"laws\": [\n    \"Adjacent stages must have compatible types: the codomain (unwrapped from T) of stage f_i must equal the domain of stage f_{i+1}.  That is, if f_i: A_{i-1} -> T(A_i), then f_{i+1}: A_i -> T(A_{i+1}).\\n\",\n    \"Kleisli composition is associative: (h >=> g) >=> f = h >=> (g >=> f). Regrouping stages does not change the pipeline's input-output behavior.\\n\",\n    \"If stage f_i produces a refusal T_fail(reason), stages f_{i+1} through f_n are not executed, and the pipeline returns T_fail(reason) with provenance information.\\n\",\n    \"Given the same input, the pipeline must produce the same output (same success value or same refusal reason at the same stage).\\n\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Stages ordered by pipeline index\",\n      \"Stage functions content-addressed by their algorithm hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Pipeline with no stages\",\n    \"Adjacent stages have incompatible domain/codomain types\",\n    \"Input to execute has wrong type\",\n    \"A stage produces different outputs for the same input\",\n    \"Refusal lacks stage index or validator name\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A Kleisli refusal pipeline is a sequence of validation stages composed using Kleisli composition for a refusal monad T.  Each stage is a Kleisli arrow f_i: A_i -> T(A_{i+1}) that either produces a valid output wrapped in T (success) or short-circuits with a refusal reason (failure).  The full pipeline f_n >=> ... >=> f_1: A_0 -> T(A_n) runs each stage in sequence; if stage i refuses, stages i+1 through n are not executed, and the refusal propagates.  The refusal monad T carries structured refusal reasons, enabling precise diagnosis of which stage refused and why.  This models the contract validation pipeline where inputs pass through dimension checks, type checks, axiom verification, and hash validation, any of which may refuse.  The pipeline is associative (by the monad laws) and deterministic.\",\n    \"non_role\": [\n      \"Does not implement specific validation logic (that is per-contract)\",\n      \"Does not handle parallel validation (stages are strictly sequential)\",\n      \"Does not implement the refusal monad itself (that is a separate type)\",\n      \"General Kleisli categories are handled by a separate contract\",\n      \"Does not make policy decisions about what constitutes a valid refusal\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_pipelines\",\n    \"module\": \"kleisli\",\n    \"symbols\": [\n      \"id_k\",\n      \"compose_k\",\n      \"then\"\n    ],\n    \"required_tests\": [\n      \"refusal_short_circuits_downstream_arrow\"\n    ]\n  },\n  \"wip\": [\n    \"Should the pipeline support conditional branching (monadic choice) or stay strictly linear?\",\n    \"Whether to support pipeline inspection (extracting individual stage behavior)\",\n    \"How to handle stages that produce warnings alongside success\",\n    \"Whether to formalize the connection to the Kleisli category explicitly\",\n    \"Error accumulation mode (collecting all refusals vs short-circuit) as a pipeline parameter\",\n    \"The refusal monad is typically Result<T, RefusalReason> in Rust\",\n    \"Short-circuit semantics match Rust's ? operator and monadic bind\",\n    \"Pipeline composition is associative by the monad laws, verified structurally\",\n    \"Each stage corresponds to a validator in the contract validation framework\",\n    \"Provenance data enables precise debugging of which stage refused and why\"\n  ],\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; never promote from this block alone\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"STAGE1_MECHANICAL_PASS\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Mechanical GTLA field gates passed (authority/math/non_role/structures/laws-or-requirements/negative_tests). Not PROVED.\",\n        \"recommendation\": \"Repair under meth-level math re-review (ADR-007); not GlobalGreen.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"KLEISLI_PRIMITIVES_MATCH\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_pipelines/src/kleisli.rs\",\n        \"yaml_law\": \"id_k, compose_k, then; associative short-circuit refusal monad\",\n        \"code_behavior\": \"id_k / compose_k / then over Refusable bind; tests for left/right identity, associativity, short-circuit.\\n\",\n        \"detail\": \"Primitives match binding. YAML pipeline artifact (stage hashes, provenance fields) is richer than this module — composition kernel only. Shape-level MATCH on monadic laws.\\n\",\n        \"delta\": \"MATCH\"\n      },\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"PIPELINE_CARRIER_ABSENT\",\n        \"severity\": \"low\",\n        \"claim_class\": \"[SCOPE FENCE]\",\n        \"file\": \"omega_pipelines/src/kleisli.rs\",\n        \"yaml_law\": \"stages, composed_hash, stage index in refusal provenance\",\n        \"code_behavior\": \"No named pipeline carrier type; only free functions on Refusable arrows.\",\n        \"detail\": \"Contract describes a full staged pipeline object; code is Kleisli combinator layer only.\\n\",\n        \"delta\": \"YAML_AHEAD_OF_CODE\"\n      }\n    ]\n  }\n}\n",
