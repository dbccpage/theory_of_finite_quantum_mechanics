      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:products:symbol_game:v1.0.0\",\n  \"title\": \"SymbolGame\",\n  \"kind\": \"product_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"07_products\",\n  \"role\": \"SymbolGame\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"PacketContract\",\n        \"BoundaryContract\",\n        \"Packetization\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Symbol Game product boundary.\\n\\nThe Symbol Game is a finite-symbol reasoning wrapper. It converts math intents, prompts, proof\\nsketches, solver requests, or model responses into constrained symbolic packets that can be parsed,\\nlocally checked, globally boundary-checked, refused, or traced.\\n\\nThe Symbol Game does not prove correctness by itself. It produces replayable traces, validation\\nreports, terminal statuses, and certificate material.\\n\\nIt may use S(n) context levels internally, but the public product boundary is not a tower-height claim.\\n\",\n    \"non_role\": [\n      \"proving correctness by itself\",\n      \"certification\",\n      \"execution of state transitions\",\n      \"authority upgrade\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM output entering the Symbol Game is treated as candidate material only (Doctrine 5). The Symbol\\nGame parses, validates, and traces LLM-generated moves using the same rules as any other input\\nsource. LLM provenance is recorded in the trace but confers no authority.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Product Layer\",\n      \"role\": \"Finite-symbol reasoning wrapper producing replayable traces and validation reports.\",\n      \"classification\": \"Product layer -- Symbol Game is a product boundary that wraps symbolic reasoning.\"\n    },\n    \"admissibility_checklist\": [\n      \"Packet grammar is declared\",\n      \"Allowed alphabet is declared\",\n      \"Symbol payload parses unambiguously\",\n      \"Local rules are declared\",\n      \"Global boundary is declared\",\n      \"Terminal target is declared\",\n      \"Authority ceiling is declared\",\n      \"Seed / replay mode is declared\"\n    ],\n    \"refusal_conditions\": [\n      \"parse fails\",\n      \"undeclared symbol appears\",\n      \"local rule violation\",\n      \"global boundary violation\",\n      \"hidden problem mutation\",\n      \"unsupported lift\",\n      \"LLM self-certification attempt\",\n      \"unreplayable trace\",\n      \"authority claim exceeds evidence\",\n      \"seeded replay diverges\"\n    ],\n    \"replay_obligation\": {\n      \"description\": \"A completed Symbol Game run must produce a complete replay package.\\n\",\n      \"required_fields\": [\n        \"packet_id\",\n        \"grammar_id\",\n        \"seed / replay metadata\",\n        \"raw input hash\",\n        \"symbol payload hash\",\n        \"parsed AST hash\",\n        \"move trace\",\n        \"local validation report\",\n        \"global boundary report\",\n        \"adversarial objections, if enabled\",\n        \"terminal status\",\n        \"certificate references\"\n      ],\n      \"note\": \"A Symbol Game trace attests only what the validators, replay trace, solver, proof checker,\\nor oracle attest.\\n\"\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"certify\",\n        \"execute\",\n        \"evaluate\",\n        \"prove\",\n        \"terminalize\",\n        \"authority_upgrade\",\n        \"sign_certificate\"\n      ]\n    },\n    \"required_tests\": [\n      \"symbol_game_trace_is_replayable\",\n      \"symbol_game_rejects_undeclared_symbol\",\n      \"symbol_game_rejects_llm_self_certification\",\n      \"symbol_game_authority_does_not_exceed_evidence\",\n      \"symbol_game_seeded_replay_is_deterministic\",\n      \"symbol_game_records_llm_provenance\"\n    ],\n    \"canonical_invariant\": \"Symbol Game is a finite-symbol reasoning wrapper that produces replayable traces, validation reports,\\nterminal statuses, and certificate material. It does not prove correctness by itself. It parses,\\nvalidates, and traces symbolic moves, recording LLM provenance when applicable, but treating all input\\nas candidate material. Authority derives from attached validators, replay traces, solver results, proof\\ncheckers, or declared external oracles.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"SymbolGame\",\n      \"role\": \"Finite-symbol reasoning wrapper producing replayable traces and validation reports\",\n      \"classification\": \"product\",\n      \"effect_class\": \"none\",\n      \"raw_output_authority_effect\": \"EvidenceOnly\",\n      \"checked_output_authority_effect\": \"FactOnly\",\n      \"promotion_condition\": \"grammar_rule_trace_and_replay_checks_pass\",\n      \"depends_on\": [\n        \"PacketContract\",\n        \"BoundaryContract\",\n        \"Packetization\"\n      ],\n      \"forbidden_authority\": [\n        \"proving correctness by itself\",\n        \"certification\",\n        \"execution of state transitions\",\n        \"authority upgrade\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"SymbolGameOutput\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"Trace\",\n        \"ReplayReport\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_product_contract:v1.0.0\"\n    ]\n  }\n}\n",
