        "hidden problem mutation",
        "unsupported lift",
        "LLM self-certification attempt",
        "unreplayable trace",
        "authority claim exceeds evidence",
        "seeded replay diverges"
      ],
      "replay_obligation": {
        "description": "A completed Symbol Game run must produce a complete replay package.\n",
        "required_fields": [
          "packet_id",
          "grammar_id",
          "seed / replay metadata",
          "raw input hash",
