      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:obstruction:obstruction:v1.0.0\ntitle: Obstruction\nkind: obstruction_contract\nstatus: mathematical_wip\nlayer: 03_obstruction\nrole: AnalysisUnit\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: LocalReplay\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - Carrier\n    - MeasurementKernel\n    - Witness\n    - CertificateKernel\n    - Replay\n    - Evaluator\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'This contract defines the Obstruction boundary.\n\n\n    Obstruction records typed persistent structural incompatibility.\n\n    Obstruction does not represent ordinary runtime failure, solver failure, low confidence,\n\n    policy violation, terminal mapping, mutation, or execution.\n\n\n    An ObstructionCandidate is EvidenceOnly. A checked ObstructionArtifact may become\n    FactOnly\n\n    only after declared carrier, equivalence, context family, measurement references,\n    witness\n\n    references, persistence evidence, reducibility evidence, and certificate/replay\n    references\n\n    are checked.\n\n    '\n  non_role: &id002\n  - runtime error handling\n  - policy interpretation\n  - terminalization\n  - state mutation\n  - execution\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is candidate generator only. It MUST NOT certify, validate, terminalize,\n      or\n\n      upgrade evidence authority. An LLM may report candidate obstructions, but those\n      reports\n\n      are EvidenceOnly proposals until checked against declared carrier, equivalence,\n      context,\n\n      measurement, witness, certificate, and replay boundaries.\n\n      '\n  effect_class_binding:\n    doctrine: 6\n    text: 'A checked ObstructionArtifact may be a structural fact. An obstruction\n      report or candidate\n\n      is evidence only.\n\n      '\n    operator_note: 'Only E (exact repair), I (quotient isometry), C (context embedding),\n      R (residual projection),\n\n      and M (refused mutation) are operators. Obstruction is not an operator.\n\n      See fixed_layer_operator_algebra_contract.md.\n\n      '\n  classification:\n    subsystem: Cohomological Semantics / Obstruction Detection\n    role: Typed persistent structural incompatibility record.\n    classification: Obstruction layer -- evidence emission; checked artifacts may\n      support facts.\n  core_definition: 'An ObstructionArtifact records checked evidence of a persistent\n    structural incompatibility\n\n    relative to a declared carrier, equivalence, context family, and measurement regime.\n\n    '\n  what_obstruction_is_not:\n  - an error\n  - an exception\n  - a bad score\n  - low confidence\n  - solver failure\n  - LLM uncertainty\n  what_obstruction_is: 'A typed, persistent structural incompatibility relative to\n    a declared carrier, equivalence,\n\n    context family, and measurement regime.\n\n    '\n  core_invariant: Operational failure is not mathematical obstruction.\n  typed_obstruction_artifact:\n    example:\n      id: obs_uuid\n      carrier_ref: carrier_n\n      equivalence_ref: equiv_class_id\n      support: topological_boundary\n      obstruction_kind: BoundaryFailure\n      measurement_refs:\n      - phi_1\n      - gamma_2\n      witness_refs:\n      - context_witness_id\n      persistence_status: Persistent\n      reducibility_status: Irreducible\n  structural_representation:\n    candidate:\n      struct_name: ObstructionCandidate\n      fields:\n      - name: obstruction_id\n        type: ObstructionId\n      - name: carrier_ref\n        type: CarrierRef\n      - name: equivalence_ref\n        type: EquivalenceRef\n      - name: context_family_ref\n        type: ContextFamilyRef\n      - name: obstruction_kind\n        type: ObstructionKind\n      - name: measurement_refs\n        type: Vec<MeasurementId>\n      - name: witness_refs\n        type: Vec<WitnessId>\n      - name: certificate_refs\n        type: Vec<CertificateId>\n      - name: replay_refs\n        type: Vec<ReplayRef>\n      - name: obstruction_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n    checked:\n      struct_name: CheckedObstructionArtifact\n      fields:\n      - name: obstruction_id\n        type: ObstructionId\n      - name: candidate_ref\n        type: ObstructionId\n      - name: persistence_status\n        type: PersistenceStatus\n      - name: reducibility_status\n        type: ReducibilityStatus\n      - name: evidence_refs\n        type: Vec<EvidenceRef>\n      - name: certificate_refs\n        type: Vec<CertificateId>\n      - name: terminal_status_ref\n        type: Option<TerminalStatusRef>\n      - name: checked_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: FactOnly\n        promotion_condition: checked_evidence_boundary_passed\n    enums:\n    - name: ObstructionKind\n      variants:\n      - BoundaryFailure\n      - ClosureDefect\n      - NonCongruentQuotient\n      - DescentBlocked\n      - GovernanceAuthorityConflict\n      - EvidencePersistenceFailure\n      - RepresentationFailure\n    - name: PersistenceStatus\n      variants:\n      - NotTested\n      - Transient\n      - Persistent\n    - name: ReducibilityStatus\n      variants:\n      - NotTested\n      - Reducible\n      - Irreducible\n    terminal_status_ref:\n      type: Option<TerminalStatusRef>\n      owner: TerminalMapper\n      note: TerminalStatus enum is owned by TerminalMapper, not by Obstruction.\n  obstruction_emission_rule: \"An ObstructionArtifact may be emitted only when all\\\n    \\ are present:\\n  - declared carrier\\n  - declared equivalence\\n  - declared context\\\n    \\ family\\n  - measurement references\\n  - witness references\\n  - persistence\\\n    \\ evidence\\n  - reducibility evidence\\n  - terminal-mapped evaluation reference\\\n    \\ (if applicable)\\n\\nOperational failure alone MUST NOT emit an ObstructionArtifact.\\n\"\n  obstruction_proof_threshold: 'A checked ObstructionArtifact may be emitted only\n    after declared evidence supports\n\n    persistence or irreducibility relative to the carrier and context family.\n\n\n    Terminal outcomes may be referenced as evidence when applicable, but terminal\n    mapping\n\n    is not the universal source of obstruction truth.\n\n    '\n  terminal_mapper_note: '\"Terminalizer\" has been renamed to \"TerminalMapper\" across\n    the system. The dependency\n\n    listed in metadata uses the new name. The filename terminalizer_contract.md is\n    retained\n\n    for backward compatibility, but all code and contract references should use TerminalMapper.\n\n    '\n  shared_kernel_envelope_pattern: 'All kernel outputs should follow the shared envelope\n    interface. Outputs are EvidenceOnly\n\n    by default and may become FactOnly only through the declared checking or certificate\n    boundary.\n\n    '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - solver_failed_is_obstruction\n    - timeout_is_obstruction\n    - low_confidence_is_obstruction\n    - bad_score_is_obstruction\n    - PolicyDecision\n    - EngineDecision\n    - TerminalEnvelope\n    - ActionLicense\n    - ALLOW_OUTPUT\n    - BLOCK_OUTPUT\n    - terminalize(\n    - execute_now(\n    - mutate_state(\n    - rank_candidates(\n    - score_candidate(\n    - authorize_transition(\n    - GaugeOp\n    - AdapterOp\n    - ForgetfulOp\n    - OperatorFactEnvelope\n    - OperatorId\n    - BasisOperator\n    - runtime_error_is_obstruction\n  required_tests:\n  - solver_failure_is_not_obstruction\n  - timeout_is_not_obstruction\n  - low_confidence_is_not_obstruction\n  - obstruction_requires_declared_carrier\n  - obstruction_requires_context_family\n  - obstruction_requires_measurement_refs\n  - obstruction_requires_witness_refs\n  - obstruction_requires_persistence_status\n  - obstruction_requires_reducibility_status\n  - obstruction_candidate_defaults_to_evidence_only\n  - checked_obstruction_may_be_factonly_after_evidence_checks\n  - obstruction_does_not_require_terminal_mapping_universally\n  - obstruction_report_from_llm_is_evidence_only\n  - obstruction_requires_declared_equivalence\n  - obstruction_requires_replay_or_certificate_refs_when_checked\n  - runtime_error_is_not_obstruction\n  - policy_violation_is_not_obstruction_without_governance_obstruction_evidence\n  - checked_obstruction_does_not_emit_action_license\n  - checked_obstruction_does_not_authorize_transition\n  - no_forbidden_op_suffix_tokens\n  negative_capability_tests:\n  - name: test_solver_failure_is_not_obstruction\n    language: python\n    code: \"def test_solver_failure_is_not_obstruction():\\n  # solver failed during\\\n      \\ analysis; should not produce obstruction artifact\\n  obs = maybe_emit_obstruction_from_solver_failure(solver_result)\\n\\\n      \\  assert obs is None\\n\"\n  - name: test_obstruction_requires_persistence\n    language: python\n    code: \"def test_obstruction_requires_persistence():\\n  # Obstruction must include\\\n      \\ persistence proof\\n  with pytest.raises(ValueError):\\n    create_obstruction(ObstructionArtifact\\\n      \\ { persistence_status: PersistenceStatus::NotTested, .. })\\n\"\n  canonical_invariant: 'Obstruction records checked evidence of persistent structural\n    incompatibility relative to a\n\n    declared carrier, equivalence, context family, and measurement regime. Obstruction\n    candidates\n\n    are EvidenceOnly; checked obstruction artifacts may become FactOnly after evidence\n    checks.\n\n    Obstruction does not handle runtime errors, decide policy, terminalize, license,\n    mutate,\n\n    authorize, or execute.\n\n    '\n  legacy_metadata:\n    name: Obstruction\n    role: Typed persistent structural incompatibility\n    version: '2.0'\n    classification: obstruction\n    effect_class: none\n    depends_on: *id001\n    optional_depends_on:\n    - TerminalMapper\n    forbidden_authority: *id002\n    primary_output_family: EvidenceEnvelope\n    referenced_output_families:\n    - FactEnvelope\n    - EvidenceEnvelope\n    - DecisionEnvelope\n    referenced_domain_kinds:\n    - MeasurementEnvelope\n    - WitnessEnvelope\n    - CertificateEnvelope\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\nrelationships:\n  extends:\n  - urn:omega:governance:base_contract:v1.0.0\n  - urn:omega:constitution:base_obstruction_contract:v1.0.0\n",
