          "language": "python",
          "code": "def test_solver_failure_is_not_obstruction():\n  # solver failed during analysis; should not produce obstruction artifact\n  obs = maybe_emit_obstruction_from_solver_failure(solver_result)\n  assert obs is None\n"
        },
