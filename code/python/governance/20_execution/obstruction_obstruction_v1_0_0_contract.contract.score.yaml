      "obstruction_emission_rule": "An ObstructionArtifact may be emitted only when all are present:\n  - declared carrier\n  - declared equivalence\n  - declared context family\n  - measurement references\n  - witness references\n  - persistence evidence\n  - reducibility evidence\n  - terminal-mapped evaluation reference (if applicable)\n\nOperational failure alone MUST NOT emit an ObstructionArtifact.\n",
      "obstruction_proof_threshold": "A checked ObstructionArtifact may be emitted only after declared evidence supports\npersistence or irreducibility relative to the carrier and context family.\n\nTerminal outcomes may be referenced as evidence when applicable, but terminal mapping\nis not the universal source of obstruction truth.\n",
      "terminal_mapper_note": "\"Terminalizer\" has been renamed to \"TerminalMapper\" across the system. The dependency\nlisted in metadata uses the new name. The filename terminalizer_contract.md is retained\nfor backward compatibility, but all code and contract references should use TerminalMapper.\n",
      "shared_kernel_envelope_pattern": "All kernel outputs should follow the shared envelope interface. Outputs are EvidenceOnly\nby default and may become FactOnly only through the declared checking or certificate boundary.\n",
