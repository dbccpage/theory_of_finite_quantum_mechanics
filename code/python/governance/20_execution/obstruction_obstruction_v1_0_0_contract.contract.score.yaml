        }
      ],
      "canonical_invariant": "Obstruction records checked evidence of persistent structural incompatibility relative to a\ndeclared carrier, equivalence, context family, and measurement regime. Obstruction candidates\nare EvidenceOnly; checked obstruction artifacts may become FactOnly after evidence checks.\nObstruction does not handle runtime errors, decide policy, terminalize, license, mutate,\nauthorize, or execute.\n",
