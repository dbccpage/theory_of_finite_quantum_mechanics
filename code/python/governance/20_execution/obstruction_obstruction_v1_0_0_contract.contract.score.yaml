    "doctrine": {
      "summary": "This contract defines the Obstruction boundary.\n\nObstruction records typed persistent structural incompatibility.\nObstruction does not represent ordinary runtime failure, solver failure, low confidence,\npolicy violation, terminal mapping, mutation, or execution.\n\nAn ObstructionCandidate is EvidenceOnly. A checked ObstructionArtifact may become FactOnly\nonly after declared carrier, equivalence, context family, measurement references, witness\nreferences, persistence evidence, reducibility evidence, and certificate/replay references\nare checked.\n",
      "non_role": [
        "runtime error handling",
        "policy interpretation",
        "terminalization",
        "state mutation",
        "execution"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is candidate generator only. It MUST NOT certify, validate, terminalize, or\nupgrade evidence authority. An LLM may report candidate obstructions, but those reports\nare EvidenceOnly proposals until checked against declared carrier, equivalence, context,\nmeasurement, witness, certificate, and replay boundaries.\n"
      },
      "effect_class_binding": {
        "doctrine": 6,
        "text": "A checked ObstructionArtifact may be a structural fact. An obstruction report or candidate\nis evidence only.\n",
        "operator_note": "Only E (exact repair), I (quotient isometry), C (context embedding), R (residual projection),\nand M (refused mutation) are operators. Obstruction is not an operator.\nSee fixed_layer_operator_algebra_contract.md.\n"
      },
      "classification": {
        "subsystem": "Cohomological Semantics / Obstruction Detection",
        "role": "Typed persistent structural incompatibility record.",
        "classification": "Obstruction layer -- evidence emission; checked artifacts may support facts."
      },
      "core_definition": "An ObstructionArtifact records checked evidence of a persistent structural incompatibility\nrelative to a declared carrier, equivalence, context family, and measurement regime.\n",
      "what_obstruction_is_not": [
        "an error",
        "an exception",
        "a bad score",
        "low confidence",
        "solver failure",
        "LLM uncertainty"
      ],
      "what_obstruction_is": "A typed, persistent structural incompatibility relative to a declared carrier, equivalence,\ncontext family, and measurement regime.\n",
      "core_invariant": "Operational failure is not mathematical obstruction.",
      "typed_obstruction_artifact": {
        "example": {
          "id": "obs_uuid",
          "carrier_ref": "carrier_n",
          "equivalence_ref": "equiv_class_id",
          "support": "topological_boundary",
          "obstruction_kind": "BoundaryFailure",
          "measurement_refs": [
            "phi_1",
            "gamma_2"
          ],
          "witness_refs": [
            "context_witness_id"
          ],
          "persistence_status": "Persistent",
