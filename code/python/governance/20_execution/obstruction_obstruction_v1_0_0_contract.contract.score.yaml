      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:obstruction:obstruction:v1.0.0\",\n  \"title\": \"Obstruction\",\n  \"kind\": \"obstruction_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"03_obstruction\",\n  \"role\": \"AnalysisUnit\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Carrier\",\n        \"MeasurementKernel\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"Replay\",\n        \"Evaluator\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Obstruction boundary.\\n\\nObstruction records typed persistent structural incompatibility.\\nObstruction does not represent ordinary runtime failure, solver failure, low confidence,\\npolicy violation, terminal mapping, mutation, or execution.\\n\\nAn ObstructionCandidate is EvidenceOnly. A checked ObstructionArtifact may become FactOnly\\nonly after declared carrier, equivalence, context family, measurement references, witness\\nreferences, persistence evidence, reducibility evidence, and certificate/replay references\\nare checked.\\n\",\n    \"non_role\": [\n      \"runtime error handling\",\n      \"policy interpretation\",\n      \"terminalization\",\n      \"state mutation\",\n      \"execution\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is candidate generator only. It MUST NOT certify, validate, terminalize, or\\nupgrade evidence authority. An LLM may report candidate obstructions, but those reports\\nare EvidenceOnly proposals until checked against declared carrier, equivalence, context,\\nmeasurement, witness, certificate, and replay boundaries.\\n\"\n    },\n    \"effect_class_binding\": {\n      \"doctrine\": 6,\n      \"text\": \"A checked ObstructionArtifact may be a structural fact. An obstruction report or candidate\\nis evidence only.\\n\",\n      \"operator_note\": \"Only E (exact repair), I (quotient isometry), C (context embedding), R (residual projection),\\nand M (refused mutation) are operators. Obstruction is not an operator.\\nSee fixed_layer_operator_algebra_contract.md.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Cohomological Semantics / Obstruction Detection\",\n      \"role\": \"Typed persistent structural incompatibility record.\",\n      \"classification\": \"Obstruction layer -- evidence emission; checked artifacts may support facts.\"\n    },\n    \"core_definition\": \"An ObstructionArtifact records checked evidence of a persistent structural incompatibility\\nrelative to a declared carrier, equivalence, context family, and measurement regime.\\n\",\n    \"what_obstruction_is_not\": [\n      \"an error\",\n      \"an exception\",\n      \"a bad score\",\n      \"low confidence\",\n      \"solver failure\",\n      \"LLM uncertainty\"\n    ],\n    \"what_obstruction_is\": \"A typed, persistent structural incompatibility relative to a declared carrier, equivalence,\\ncontext family, and measurement regime.\\n\",\n    \"core_invariant\": \"Operational failure is not mathematical obstruction.\",\n    \"typed_obstruction_artifact\": {\n      \"example\": {\n        \"id\": \"obs_uuid\",\n        \"carrier_ref\": \"carrier_n\",\n        \"equivalence_ref\": \"equiv_class_id\",\n        \"support\": \"topological_boundary\",\n        \"obstruction_kind\": \"BoundaryFailure\",\n        \"measurement_refs\": [\n          \"phi_1\",\n          \"gamma_2\"\n        ],\n        \"witness_refs\": [\n          \"context_witness_id\"\n        ],\n        \"persistence_status\": \"Persistent\",\n        \"reducibility_status\": \"Irreducible\"\n      }\n    },\n    \"structural_representation\": {\n      \"candidate\": {\n        \"struct_name\": \"ObstructionCandidate\",\n        \"fields\": [\n          {\n            \"name\": \"obstruction_id\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"carrier_ref\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"equivalence_ref\",\n            \"type\": \"EquivalenceRef\"\n          },\n          {\n            \"name\": \"context_family_ref\",\n            \"type\": \"ContextFamilyRef\"\n          },\n          {\n            \"name\": \"obstruction_kind\",\n            \"type\": \"ObstructionKind\"\n          },\n          {\n            \"name\": \"measurement_refs\",\n            \"type\": \"Vec<MeasurementId>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"obstruction_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedObstructionArtifact\",\n        \"fields\": [\n          {\n            \"name\": \"obstruction_id\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"candidate_ref\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"persistence_status\",\n            \"type\": \"PersistenceStatus\"\n          },\n          {\n            \"name\": \"reducibility_status\",\n            \"type\": \"ReducibilityStatus\"\n          },\n          {\n            \"name\": \"evidence_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"terminal_status_ref\",\n            \"type\": \"Option<TerminalStatusRef>\"\n          },\n          {\n            \"name\": \"checked_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\",\n            \"promotion_condition\": \"checked_evidence_boundary_passed\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"ObstructionKind\",\n          \"variants\": [\n            \"BoundaryFailure\",\n            \"ClosureDefect\",\n            \"NonCongruentQuotient\",\n            \"DescentBlocked\",\n            \"GovernanceAuthorityConflict\",\n            \"EvidencePersistenceFailure\",\n            \"RepresentationFailure\"\n          ]\n        },\n        {\n          \"name\": \"PersistenceStatus\",\n          \"variants\": [\n            \"NotTested\",\n            \"Transient\",\n            \"Persistent\"\n          ]\n        },\n        {\n          \"name\": \"ReducibilityStatus\",\n          \"variants\": [\n            \"NotTested\",\n            \"Reducible\",\n            \"Irreducible\"\n          ]\n        }\n      ],\n      \"terminal_status_ref\": {\n        \"type\": \"Option<TerminalStatusRef>\",\n        \"owner\": \"TerminalMapper\",\n        \"note\": \"TerminalStatus enum is owned by TerminalMapper, not by Obstruction.\"\n      }\n    },\n    \"obstruction_emission_rule\": \"An ObstructionArtifact may be emitted only when all are present:\\n  - declared carrier\\n  - declared equivalence\\n  - declared context family\\n  - measurement references\\n  - witness references\\n  - persistence evidence\\n  - reducibility evidence\\n  - terminal-mapped evaluation reference (if applicable)\\n\\nOperational failure alone MUST NOT emit an ObstructionArtifact.\\n\",\n    \"obstruction_proof_threshold\": \"A checked ObstructionArtifact may be emitted only after declared evidence supports\\npersistence or irreducibility relative to the carrier and context family.\\n\\nTerminal outcomes may be referenced as evidence when applicable, but terminal mapping\\nis not the universal source of obstruction truth.\\n\",\n    \"terminal_mapper_note\": \"\\\"Terminalizer\\\" has been renamed to \\\"TerminalMapper\\\" across the system. The dependency\\nlisted in metadata uses the new name. The filename terminalizer_contract.md is retained\\nfor backward compatibility, but all code and contract references should use TerminalMapper.\\n\",\n    \"shared_kernel_envelope_pattern\": \"All kernel outputs should follow the shared envelope interface. Outputs are EvidenceOnly\\nby default and may become FactOnly only through the declared checking or certificate boundary.\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"solver_failed_is_obstruction\",\n        \"timeout_is_obstruction\",\n        \"low_confidence_is_obstruction\",\n        \"bad_score_is_obstruction\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute_now(\",\n        \"mutate_state(\",\n        \"rank_candidates(\",\n        \"score_candidate(\",\n        \"authorize_transition(\",\n        \"GaugeOp\",\n        \"AdapterOp\",\n        \"ForgetfulOp\",\n        \"OperatorFactEnvelope\",\n        \"OperatorId\",\n        \"BasisOperator\",\n        \"runtime_error_is_obstruction\"\n      ]\n    },\n    \"required_tests\": [\n      \"solver_failure_is_not_obstruction\",\n      \"timeout_is_not_obstruction\",\n      \"low_confidence_is_not_obstruction\",\n      \"obstruction_requires_declared_carrier\",\n      \"obstruction_requires_context_family\",\n      \"obstruction_requires_measurement_refs\",\n      \"obstruction_requires_witness_refs\",\n      \"obstruction_requires_persistence_status\",\n      \"obstruction_requires_reducibility_status\",\n      \"obstruction_candidate_defaults_to_evidence_only\",\n      \"checked_obstruction_may_be_factonly_after_evidence_checks\",\n      \"obstruction_does_not_require_terminal_mapping_universally\",\n      \"obstruction_report_from_llm_is_evidence_only\",\n      \"obstruction_requires_declared_equivalence\",\n      \"obstruction_requires_replay_or_certificate_refs_when_checked\",\n      \"runtime_error_is_not_obstruction\",\n      \"policy_violation_is_not_obstruction_without_governance_obstruction_evidence\",\n      \"checked_obstruction_does_not_emit_action_license\",\n      \"checked_obstruction_does_not_authorize_transition\",\n      \"no_forbidden_op_suffix_tokens\"\n    ],\n    \"negative_capability_tests\": [\n      {\n        \"name\": \"test_solver_failure_is_not_obstruction\",\n        \"language\": \"python\",\n        \"code\": \"def test_solver_failure_is_not_obstruction():\\n  # solver failed during analysis; should not produce obstruction artifact\\n  obs = maybe_emit_obstruction_from_solver_failure(solver_result)\\n  assert obs is None\\n\"\n      },\n      {\n        \"name\": \"test_obstruction_requires_persistence\",\n        \"language\": \"python\",\n        \"code\": \"def test_obstruction_requires_persistence():\\n  # Obstruction must include persistence proof\\n  with pytest.raises(ValueError):\\n    create_obstruction(ObstructionArtifact { persistence_status: PersistenceStatus::NotTested, .. })\\n\"\n      }\n    ],\n    \"canonical_invariant\": \"Obstruction records checked evidence of persistent structural incompatibility relative to a\\ndeclared carrier, equivalence, context family, and measurement regime. Obstruction candidates\\nare EvidenceOnly; checked obstruction artifacts may become FactOnly after evidence checks.\\nObstruction does not handle runtime errors, decide policy, terminalize, license, mutate,\\nauthorize, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Obstruction\",\n      \"role\": \"Typed persistent structural incompatibility\",\n      \"version\": \"2.0\",\n      \"classification\": \"obstruction\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"Carrier\",\n        \"MeasurementKernel\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"Replay\",\n        \"Evaluator\"\n      ],\n      \"optional_depends_on\": [\n        \"TerminalMapper\"\n      ],\n      \"forbidden_authority\": [\n        \"runtime error handling\",\n        \"policy interpretation\",\n        \"terminalization\",\n        \"state mutation\",\n        \"execution\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\",\n        \"DecisionEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"MeasurementEnvelope\",\n        \"WitnessEnvelope\",\n        \"CertificateEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_obstruction_contract:v1.0.0\"\n    ]\n  }\n}\n",
