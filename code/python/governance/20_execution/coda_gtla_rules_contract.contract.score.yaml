      "raw_utf8": "{\n  \"paper_identity\": \"CODA-GTLA\",\n  \"legacy_file_identity\": \"009_coda_gtla.md\",\n  \"canonical_version\": \"v1.0\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 9 (GTLA — General Theory of Layered Authority)\",\n  \"primitives\": {\n    \"pipeline\": \"Pi^# = tau^# o_K V^# o_K D^# o_K eta^# o_K rho^#\",\n    \"terminal_partition\": \"T = T_auth u+ T_res u+ F_term\",\n    \"firewall\": \"GTLA-T9 Non-Promotion Firewall\",\n    \"normal_form\": \"MasterNormalFormOutcome = (diagnostic, routing, authority)\"\n  },\n  \"equations\": {\n    \"terminal_coproduct_disjointness\": {\n      \"latex\": \"\\\\mathbb{T} = \\\\mathbb{T}_{\\\\mathrm{auth}} \\\\sqcup \\\\mathbb{T}_{\\\\mathrm{res}} \\\\sqcup \\\\mathbb{F}_{\\\\mathrm{term}}\",\n      \"description\": \"Strictly disjoint three-way terminal partition\"\n    },\n    \"non_promotion_firewall\": {\n      \"latex\": \"(\\\\Phi_1 = 0 \\\\wedge \\\\neg \\\\mathsf{Licensed}) \\\\implies \\\\mathbb{F}_{\\\\mathrm{term}}\",\n      \"description\": \"GTLA-T9: an unlicensed zero defect routes to F_term (Refused)\"\n    },\n    \"kleisli_composition\": {\n      \"latex\": \"\\\\Pi_S^\\\\sharp = \\\\tau_S^\\\\sharp \\\\circ_K \\\\mathcal{V}_S^\\\\sharp \\\\circ_K \\\\mathcal{D}_S^\\\\sharp \\\\circ_K \\\\eta_S^\\\\sharp \\\\circ_K \\\\rho_S^\\\\sharp\",\n      \"description\": \"Master Normal Form Kleisli composition over the refusal monad\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"GTLA-RULE-001\",\n      \"name\": \"Terminal Partition Disjointness\",\n      \"statement\": \"Every pipeline terminal must inhabit exactly one of T_auth, T_res, or F_term; cross-partition inhabitation is prohibited.\"\n    },\n    {\n      \"id\": \"GTLA-RULE-002\",\n      \"name\": \"Non-Promotion Firewall Enforcement\",\n      \"statement\": \"Zero defect evidence (Phi_1 = 0) without a verified external license must route to F_term (Refused); it must never route to T_auth or T_res.\"\n    },\n    {\n      \"id\": \"GTLA-RULE-003\",\n      \"name\": \"Three-Axis Factorization\",\n      \"statement\": \"Outputs must factor into three explicit orthogonal axes: diagnostic class, routing terminal, and authority outcome.\"\n    },\n    {\n      \"id\": \"GTLA-RULE-004\",\n      \"name\": \"Refusal Monad Propagation\",\n      \"statement\": \"Any refusal encountered during pipeline stage evaluation short-circuits to F_term without minting authority.\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports Master Normal Form pipeline evaluation, three-axis outcome factoring, and GTLA-T9 firewall enforcement.\",\n    \"does_not_support\": \"Does not support unearned authority upgrade, semantic correctness from zero defect alone, or bypass of external cryptographic license.\",\n    \"narrowest_defensible_claim\": \"Terminalizes 9-layer pipeline execution into pairwise disjoint partitions and enforces non-promotion firewalling.\",\n    \"next_test_needed\": \"Automated verification of GTLA pipeline stage transitions against adversarial unsealed evaluation inputs.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
