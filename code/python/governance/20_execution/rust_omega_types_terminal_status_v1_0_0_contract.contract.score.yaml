      "raw_utf8": "{\n  \"schema_version\": \"omega.file_contract.v1\",\n  \"kind\": \"rust_file_contract\",\n  \"contract_id\": \"urn:omega:rust:omega_types:terminal_status:v1.0.0\",\n  \"title\": \"TerminalStatus\",\n  \"status\": \"active\",\n  \"crate\": \"omega_types\",\n  \"file\": \"crates_rs/omega_types/src/terminal_status.rs\",\n  \"role\": \"state\",\n  \"authority_effect\": \"none\",\n  \"evidence_ceiling\": \"LocalReplay\",\n  \"customer_claim_allowed\": false,\n  \"runtime_enforcement\": false,\n  \"owns\": [\n    \"the general derivation and search terminal taxonomy\",\n    \"the total mapping from a terminal to its authority level and residual class\",\n    \"the T_auth projection, which is the only terminal-to-AuthorityTerminal path\"\n  ],\n  \"does_not_own\": [\n    \"the Q-continuum terminal vocabulary, which its own doc scopes to that layer\",\n    \"the obstruction trichotomy, which is omega_policy::trichotomy\",\n    \"authority itself; a tag reaches Certifiable and stops there\"\n  ],\n  \"may_call\": [],\n  \"must_not\": [\n    \"return Certified from a terminal tag alone\",\n    \"decide a terminal by a floating-point tolerance\",\n    \"leave a variant out of the enumerated taxonomy\"\n  ],\n  \"exactness\": {\n    \"mode\": \"not_applicable\",\n    \"exact_constructor_required\": false,\n    \"approximate_modes_allowed\": false\n  },\n  \"laws\": [\n    \"Exhaustive taxonomy law: ALL_TERMINAL_STATUSES lists every variant exactly once. A gate that iterates the list would otherwise skip a terminal in silence, which is the ambiguous terminal state rubric section 6 prohibits.\",\n    \"No-authority-from-a-tag law: authority_level reaches Certifiable and no further. Promotion needs a CertifiedAuthority, and this file cannot mint one.\",\n    \"Projection law: authority_terminal is the sole mapping into AuthorityTerminal, and only ExactRuleDerived and UniqueOutputDerived project at all.\",\n    \"Totality law: authority_level and residual_class 