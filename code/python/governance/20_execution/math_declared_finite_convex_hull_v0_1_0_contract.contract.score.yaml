      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:declared_finite_convex_hull:v0.1.0\",\n  \"title\": \"Independent exact convex decompositions, separating witnesses and transport\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"declared_finite_convex_hull\",\n    \"symbol\": \"declared_finite_convex_hull\",\n    \"ascii_symbol\": \"declared_finite_convex_hull\",\n    \"notation\": \"Independent exact convex decompositions, separating witnesses and transport\",\n    \"domain\": [\n      \"A nonempty declared rational family with at most256 members and256 coordinates; finite computed pivot budget; canonical BasicMatrix<Q> linear maps\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_solvers::finite_convex_hull; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"A decomposition replays nonnegativity, normalization and reconstruction\",\n    \"A separating witness checks every declared member and a strict target gap\",\n    \"Exact weighted-L1 primal and dual equality prove the finite membership decision\",\n    \"Transport verifies every family image then replays the resulting decomposition\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_solvers\",\n    \"module\": \"solver_convex_finite_hull\",\n    \"symbols\": [\n      \"DeclaredFamily::new\",\n      \"ConvexDecomposition::verify\",\n      \"SeparatingWitness::verify\",\n      \"decide_membership\",\n      \"transport_decomposition\"\n    ],\n    \"required_tests\": [\n      \"solver_convex_finite_hull::tests::membership_separation_and_transport_replay_both_sides\"\n    ]\n  },\n  \"negative_tests\": [\n    \"solver_convex_finite_hull::tests::membership_separation_and_transport_replay_both_sides\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A decomposition replays nonnegativity, normalization and reconstruction; A separating witness checks every declared member and a strict target gap; Exact weighted-L1 primal and dual equality prove the finite membership decision; Transport verifies every family image then replays the resulting decomposition.\",\n    \"non_role\": [\n      \"Declared-family hull membership is not unrestricted quantum-state separability; malformed rationals and exhausted pivots refuse\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
