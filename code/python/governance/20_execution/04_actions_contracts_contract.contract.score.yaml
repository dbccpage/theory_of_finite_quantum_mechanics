                "note": "A raw ReducerOutput is EvidenceOnly. A checked ReducerOutput may become FactOnly only for the claim that the reducer satisfied same-carrier, kappa-monotonicity, idempotence, and replay requirements. If later admissibility judgment is needed, consumers may route the checked output to an Evaluator. ReducerAction itself does not emit RequiresEvaluator unless a specific reducer contract explicitly owns that boundary.\n"
              },
