            "quote_non_execution_law": "Quoted structure is inert. A quote may be inspected, hashed, replayed, decoded through a declared decode boundary, or evaluated by a later layer. A quote MUST NOT execute, schedule itself, authorize execution, mutate runtime state, or inherit the authority of the quoted object.\n",
            "no_authority_inheritance_law": "Reflecting an object does not copy that object's authority. A quoted ActionLicense is not an ActionLicense. A quoted Action is not an Action. A quoted DecisionEnvelope is not a live decision. A quoted certificate is quote evidence unless dereferenced and verified through the declared certificate boundary.\n",
            "rust_types": {
