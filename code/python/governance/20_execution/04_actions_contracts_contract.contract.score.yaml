              "python_poc": "def validate_reflection_output(reflection: dict) -> None:\n    if reflection.get(\"executed\") is True:\n        raise ValueError(\"Reflector may quote but must not execute quoted objects.\")\n    if reflection.get(\"quote_depth\", 0) > reflection.get(\"max_quote_depth\", 1):\n        raise ValueError(\"Reflection recursion guard violated.\")\n    if reflection.get(\"authority_effect\") != \"EvidenceOnly\":\n        raise ValueError(\"Reflector output must be EvidenceOnly before checking.\")\n    if reflection.get(\"decode_attempted\") is True and not reflection.get(\"decode_license\"):\n        raise ValueError(\"Reflector decode attempted without license.\")\n"
            }
