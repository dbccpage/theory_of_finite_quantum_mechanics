            "llm_boundary_law": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, or upgrade evidence authority. LLM output may propose ReducerAction candidates, ReducerLaw descriptors, migration patches, or tests, but those proposals are EvidenceOnly until checked by the declared ReducerAction, Measurement, Replay, Evaluator, and component-boundary checks.\n",
