                "code": "pub trait Constructor<Raw, T> {\n    fn constructor_id(&self) -> ConstructorId;\n    fn parse(&self, raw: &Raw) -> Result<IntermediateSyntax, ParseError>;\n    fn construct(&self, syntax: IntermediateSyntax) -> Result<ConstructorOutput<T>, ConstructorError>;\n}\n"
