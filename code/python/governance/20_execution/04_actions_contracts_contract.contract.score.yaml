                "note": "generate is accepted as a legacy implementation name. Contract-canonical APIs should use propose to emphasize detached candidate creation rather than search or execution. GeneratorContext is configuration evidence only. It MUST NOT contain evaluator metrics, policy verdicts, live Engine handles, terminal outcomes, or raw cohomological measurements.\n"
