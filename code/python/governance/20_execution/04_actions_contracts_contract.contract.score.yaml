            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is a CANDIDATE, not a fixed-layer operator. A Reflector reifies the structure of a state into quote-level structure that can be inspected or reasoned about by later layers. It does not execute quoted objects. The Evaluator judges admissibility.\n",
