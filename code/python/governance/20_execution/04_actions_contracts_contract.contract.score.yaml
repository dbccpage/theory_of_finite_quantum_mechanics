        }
      },
      "raw_utf8": "{\n  \"collection_metadata\": {\n    \"source_directory\": \"non-math/04_actions\",\n    \"doctrine_version\": \"2026-05\",\n    \"total_contracts\": 15,\n    \"active_contracts\": 13,\n    \"superseded_contracts\": 2,\n    \"categories\": {\n      \"boundaries\": [\n        \"adapter_boundary\",\n        \"component_shared_boundary\",\n        \"encoder_boundary\",\n        \"intake_constructor\"\n      ],\n      \"candidates\": [\n        \"forgetful_action\",\n        \"lambda_action_candidate\",\n        \"normalizer_action_candidate\",\n        \"projector_candidate\",\n        \"proposal_generator\",\n        \"reducer_action_candidate\",\n        \"reflector_candidate\",\n        \"transform_action_candidate\"\n      ],\n      \"taxonomy\": [\n        \"fixed_layer_operator_algebra\"\n      ],\n      \"superseded\": [\n        \"declared_action_candidate_redirect\",\n        \"representation_boundary_redirect\"\n      ]\n    },\n    \"validation_rules\": {\n      \"yaml_must_parse\": true,\n      \"no_action_fact_envelope\": true,\n      \"no_operator_fact_envelope\": true,\n      \"non_certifier_contracts_emit_evidence_not_certificates\": true,\n      \"candidates_default_to_evidence_only\": true,\n      \"checked_outputs_require_boundary_for_factonly\": true,\n      \"action_license_only_from_licensing_boundary\": true,\n      \"state_transition_only_from_engine\": true,\n      \"engine_executes_only_licensed_transitions\": true,\n      \"primary_output_family_must_be_canonical\": true,\n      \"referenced_output_families_must_be_canonical\": true,\n      \"domain_specific_output_kinds_must_use_domain_output_kind\": true,\n      \"non_certifier_contracts_must_not_emit_certificate_named_structs\": true,\n      \"candidates_must_not_emit_requires_evaluator_by_default\": true,\n      \"composition_laws_must_be_conditional_unless_explicit_rewrite_law\": true,\n      \"constructor_must_not_emit_validation_certificate_directly\": true,\n      \"encoding_evidence_is_allowed_encoding_certificate_is_forbidden\": true\n    }\n  },\n  \"contracts\": {\n    \"declared_action_candidate_redirect\": {\n      \"source_file\": \"declared_action_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"DeclaredActionCandidateRedirect\",\n        \"status\": \"superseded\",\n        \"active\": false,\n        \"machine_authority\": false,\n        \"role\": \"redirect to split action-candidate contracts\",\n        \"superseded_by\": [\n          \"lambda_action_candidate_contract.md\",\n          \"reducer_action_candidate_contract.md\",\n          \"normalizer_action_candidate_contract.md\",\n          \"transform_action_candidate_contract.md\"\n        ],\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"title\": \"Declared Action Candidate Contract (SUPERSEDED)\",\n      \"notice\": \"This file is not an active contract and MUST NOT be imported by validators, build scripts, contract generators, or implementation crates as doctrine. If this redirect conflicts with any split action-candidate contract, the split contract controls.\\n\",\n      \"decomposition_table\": [\n        {\n          \"original_section\": \"Lambda\",\n          \"new_contract_file\": \"lambda_action_candidate_contract.md\",\n          \"classification\": \"Action Candidate\"\n        },\n        {\n          \"original_section\": \"Reducer\",\n          \"new_contract_file\": \"reducer_action_candidate_contract.md\",\n          \"classification\": \"Action Candidate\"\n        },\n        {\n          \"original_section\": \"Normalizer\",\n          \"new_contract_file\": \"normalizer_action_candidate_contract.md\",\n          \"classification\": \"Action Candidate\"\n        },\n        {\n          \"original_section\": \"Transform\",\n          \"new_contract_file\": \"transform_action_candidate_contract.md\",\n          \"classification\": \"Action Candidate\"\n        }\n      ],\n      \"migration_notes\": [\n        \"All LambdaOp references renamed to LambdaAction\",\n        \"All ReducerOp references renamed to ReducerAction\",\n        \"All TransformOp references renamed to TransformAction\",\n        \"All OperatorIdentity references renamed to ComponentIdentity\",\n        \"All OperatorFactEnvelope references must migrate to ComponentEvidenceEnvelope or role-specific envelope\",\n        \"All OperatorKernel references must migrate to specific component boundary\",\n        \"Inheritance from operator_family_shared_law.md replaced with component_shared_boundary_contract.md\",\n        \"Boxed canonical invariants calling non-operators 'operators' have been removed\",\n        \"Each contract now includes explicit classification as ACTION CANDIDATE\"\n      ],\n      \"clarification\": \"Action candidates are proposals or checked facts about possible transformations. They are not Actions. Engine execution of a licensed transformation is the Action.\\n\"\n    },\n    \"representation_boundary_redirect\": {\n      \"source_file\": \"representation_boundary_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"RepresentationBoundaryRedirect\",\n        \"status\": \"superseded\",\n        \"active\": false,\n        \"machine_authority\": false,\n        \"role\": \"redirect to split representation boundary and candidate contracts\",\n        \"superseded_by\": [\n          \"adapter_boundary_contract.md\",\n          \"encoder_boundary_contract.md\",\n          \"decoder_boundary_contract.md\",\n          \"projector_candidate_contract.md\",\n          \"reflector_candidate_contract.md\",\n          \"forgetful_action_contract.md\"\n        ],\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"title\": \"Representation Boundary Contract (SUPERSEDED)\",\n      \"notice\": \"This file is not an active contract and MUST NOT be imported by validators, build scripts, contract generators, or implementation crates as doctrine. If this redirect conflicts with any split representation boundary or candidate contract, the split contract controls.\\n\",\n      \"decomposition_table\": [\n        {\n          \"original_section\": \"Adapter\",\n          \"new_contract_file\": \"adapter_boundary_contract.md\",\n          \"classification\": \"Boundary\"\n        },\n        {\n          \"original_section\": \"Decoder\",\n          \"new_contract_file\": \"decoder_boundary_contract.md\",\n          \"classification\": \"Boundary - pending split\"\n        },\n        {\n          \"original_section\": \"Encoder\",\n          \"new_contract_file\": \"encoder_boundary_contract.md\",\n          \"classification\": \"Boundary\"\n        },\n        {\n          \"original_section\": \"Projector\",\n          \"new_contract_file\": \"projector_candidate_contract.md\",\n          \"classification\": \"Candidate\"\n        },\n        {\n          \"original_section\": \"Reflector\",\n          \"new_contract_file\": \"reflector_candidate_contract.md\",\n          \"classification\": \"Candidate\"\n        },\n        {\n          \"original_section\": \"Forgetful\",\n          \"new_contract_file\": \"forgetful_action_contract.md\",\n          \"classification\": \"Candidate\"\n        }\n      ],\n      \"migration_notes\": [\n        \"All ForgetfulOp references renamed to ForgetfulAction\",\n        \"All ForgetfulOperator references renamed to ForgetfulAction\",\n        \"All OperatorFactEnvelope references must migrate to ComponentEvidenceEnvelope or role-specific envelope\",\n        \"ActionFactEnvelope is forbidden because it collapses action and fact authority\",\n        \"All OperatorVersion references renamed to ComponentVersion\",\n        \"'representation-boundary operators' replaced with 'representation boundaries'\",\n        \"'Projector Operator Contract' replaced with 'Projector Candidate Contract'\",\n        \"'Reflector Operator Contract' replaced with 'Reflector Candidate Contract'\",\n        \"Inheritance from operator_family_shared_law.md replaced with component_shared_boundary_contract.md\",\n        \"Each contract now includes explicit classification as BOUNDARY or CANDIDATE\",\n        \"Decoder content should be split into decoder_boundary_contract.md; until then, any Decoder section inside adapter_boundary_contract.md is transitional and non-canonical\"\n      ],\n      \"clarification\": \"Representation boundaries and representation candidates do not authorize or execute transitions. They emit EvidenceOnly artifacts unless checked by their declared boundary. Engine execution requires a separate ActionLicense.\\n\"\n    },\n    \"component_shared_boundary\": {\n      \"source_file\": \"component_shared_boundary_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ComponentSharedBoundary\",\n        \"role\": \"Defines shared boundary law for all non-operator component families\",\n        \"classification\": \"boundary\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ContractConstitution\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"claiming operator status for non-E/I/C/R/M entities\",\n          \"using Op suffix or Operator name for non-effect-class components\",\n          \"authorizing transitions without ActionLicense authority\",\n          \"executing without Engine boundary\",\n          \"mutating global state without licensed Engine transition\",\n          \"ranking candidates outside Evaluator/Search policy boundary\",\n          \"searching outside SearchGenerator boundary\",\n          \"scheduling execution outside declared orchestration boundary\",\n          \"collapsing evidence, fact, decision, license, action, and record\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"DecisionEnvelope\",\n          \"ActionLicense\",\n          \"Action\",\n          \"Record\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, or upgrade evidence authority. LLM output may propose component definitions, mappings, or patches, but those proposals are EvidenceOnly until checked by the relevant component boundary.\\n\",\n      \"shared_component_law\": \"Component-family members emit artifacts under their declared artifact family. Most component outputs are EvidenceOnly by default. They may become FactOnly, DecisionEnvelope, ActionLicense, Action, or Record only through the declared boundary that owns that authority. A component-family member may not authorize, execute, certify, terminalize, search, rank, mutate global state, or change carrier expressivity unless its specific contract declares that role and authority.\\n\",\n      \"canonical_separation\": {\n        \"Constructor\": \"declares or builds structured intake artifacts; Validator checks them\",\n        \"Adapter\": \"changes representation without changing meaning\",\n        \"Encoder\": \"embeds into constrained representation\",\n        \"Decoder\": \"reconstructs only what the encoding evidence permits\",\n        \"Generator_Search\": \"proposes detached candidates\",\n        \"Lambda\": \"proposes local transformation\",\n        \"Reducer\": \"proposes same-carrier deflation\",\n        \"Transform\": \"proposes same-carrier rearrangement\",\n        \"Projector\": \"proposes explicit-loss projection\",\n        \"Reflector\": \"quotes or reflects; it does not execute\",\n        \"Normalizer\": \"proposes canonical form\",\n        \"Solver\": \"computes\",\n        \"Functional\": \"composes measurements\",\n        \"Observable\": \"extracts primitive quantities\",\n        \"Analysis\": \"checks factual evidence\",\n        \"Certifier\": \"binds claims to evidence\",\n        \"Evaluator\": \"judges\",\n        \"Policy\": \"decides policy\",\n        \"Terminalizer\": \"seals terminal outcomes or licenses\",\n        \"LicensingBoundary\": \"emits ActionLicense\",\n        \"Engine\": \"executes licensed transitions\",\n        \"Trace\": \"records\",\n        \"Replay\": \"verifies reconstruction\",\n        \"MetaJudgment\": \"judges lift admissibility\",\n        \"LiftLicense\": \"authorizes carrier/schema extension\"\n      },\n      \"reclassification_table\": [\n        {\n          \"entity\": \"Lambda\",\n          \"classification\": \"Action candidate\",\n          \"role\": \"proposes pure local endomorphism\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Reducer\",\n          \"classification\": \"Action candidate\",\n          \"role\": \"proposes same-carrier deflation\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Normalizer\",\n          \"classification\": \"Action candidate\",\n          \"role\": \"proposes canonical-form mapping\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Transform\",\n          \"classification\": \"Action candidate\",\n          \"role\": \"proposes same-carrier rearrangement\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Constructor\",\n          \"classification\": \"Boundary / intake\",\n          \"role\": \"builds or declares structured intake\",\n          \"default_family\": \"StructureArtifact / EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Adapter\",\n          \"classification\": \"Boundary / representation\",\n          \"role\": \"changes representation without changing meaning\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Encoder\",\n          \"classification\": \"Boundary / representation\",\n          \"role\": \"maps to compressed/canonical representation\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Decoder\",\n          \"classification\": \"Boundary / representation\",\n          \"role\": \"reconstructs only what encoding evidence permits\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Projector\",\n          \"classification\": \"Action candidate\",\n          \"role\": \"proposes explicit-loss projection\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Reflector\",\n          \"classification\": \"Boundary / quotation\",\n          \"role\": \"quotes or reflects without execution\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Forgetful\",\n          \"classification\": \"Boundary / projection\",\n          \"role\": \"discards structure with explicit loss\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Generator\",\n          \"classification\": \"Proposal system\",\n          \"role\": \"produces candidates\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"SearchGenerator\",\n          \"classification\": \"Proposal system\",\n          \"role\": \"traverses/generates candidate frontier\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Solver\",\n          \"classification\": \"Computation\",\n          \"role\": \"computes declared results\",\n          \"default_family\": \"EvidenceEnvelope; FactEnvelope after checking\"\n        },\n        {\n          \"entity\": \"Functional\",\n          \"classification\": \"Measurement composition\",\n          \"role\": \"composes canonical measurements\",\n          \"default_family\": \"EvidenceEnvelope; FactEnvelope after checking\"\n        },\n        {\n          \"entity\": \"Observable\",\n          \"classification\": \"Measurement extraction\",\n          \"role\": \"extracts primitive quantities\",\n          \"default_family\": \"EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Analysis\",\n          \"classification\": \"Fact checking\",\n          \"role\": \"checks declared artifact evidence\",\n          \"default_family\": \"EvidenceEnvelope; FactEnvelope after checking\"\n        },\n        {\n          \"entity\": \"Certifier\",\n          \"classification\": \"Certification\",\n          \"role\": \"binds claim to evidence\",\n          \"default_family\": \"EvidenceEnvelope; FactEnvelope after verification\"\n        },\n        {\n          \"entity\": \"Validator\",\n          \"classification\": \"Checking\",\n          \"role\": \"checks well-formedness/domain\",\n          \"default_family\": \"EvidenceEnvelope; FactOnly only if declared\"\n        },\n        {\n          \"entity\": \"Evaluator\",\n          \"classification\": \"Governance / judgment\",\n          \"role\": \"judges evidence within contract\",\n          \"default_family\": \"DecisionEnvelope or FactEnvelope depending contract\"\n        },\n        {\n          \"entity\": \"Policy\",\n          \"classification\": \"Governance / policy\",\n          \"role\": \"classifies or decides policy\",\n          \"default_family\": \"DecisionEnvelope\"\n        },\n        {\n          \"entity\": \"Terminalizer\",\n          \"classification\": \"Governance / terminal mapping\",\n          \"role\": \"seals terminal outcomes or licenses\",\n          \"default_family\": \"DecisionEnvelope / ActionLicense\"\n        },\n        {\n          \"entity\": \"LicensingBoundary\",\n          \"classification\": \"Authorization\",\n          \"role\": \"emits scoped transition license\",\n          \"default_family\": \"ActionLicense\"\n        },\n        {\n          \"entity\": \"MetaJudgment\",\n          \"classification\": \"Governance / lift admissibility\",\n          \"role\": \"judges lift admissibility\",\n          \"default_family\": \"DecisionEnvelope\"\n        },\n        {\n          \"entity\": \"LiftLicense\",\n          \"classification\": \"Lift authorization\",\n          \"role\": \"authorizes carrier/schema extension\",\n          \"default_family\": \"ActionLicense\"\n        },\n        {\n          \"entity\": \"Engine\",\n          \"classification\": \"Execution\",\n          \"role\": \"executes licensed transitions\",\n          \"default_family\": \"Action\"\n        },\n        {\n          \"entity\": \"Pipeline\",\n          \"classification\": \"Orchestration\",\n          \"role\": \"routes declared stages\",\n          \"default_family\": \"None / Record / EvidenceEnvelope\"\n        },\n        {\n          \"entity\": \"Trace\",\n          \"classification\": \"Record\",\n          \"role\": \"records immutable event evidence\",\n          \"default_family\": \"Record\"\n        },\n        {\n          \"entity\": \"Replay\",\n          \"classification\": \"Replay checking\",\n          \"role\": \"reconstructs declared history\",\n          \"default_family\": \"EvidenceEnvelope; FactEnvelope after verified replay\"\n        }\n      ],\n      \"operator_exclusion_note\": \"None of these entities are operators. Only E (exact repair), I (quotient isometry), C (context embedding), R (residual projection), and M (refused mutation) are operators. See fixed_layer_operator_algebra_contract.md.\\n\",\n      \"role_separation_matrix_note\": \"This contract does not duplicate the full matrix. Use kernel_authority_matrix_contract.md as the canonical shared reference. Component-specific contracts MAY narrow authority further, but MUST NOT exceed the shared matrix.\\n\",\n      \"shared_envelope_pattern\": {\n        \"authority_effect_enum\": {\n          \"source\": \"GlobalContractTaxonomy / omega-contracts\",\n          \"note\": \"Component contracts MUST NOT define local authority-effect enums\",\n          \"values\": [\n            \"None\",\n            \"EvidenceOnly\",\n            \"FactOnly\",\n            \"RequiresEvaluator\",\n            \"RequestsDecision\",\n            \"AuthorizesTransition\",\n            \"StateTransition\"\n          ]\n        },\n        \"component_evidence_envelope\": {\n          \"rust_code\": \"pub struct ComponentEvidenceEnvelope<R> {\\n    pub component_id: ComponentId,\\n    pub component_version: ComponentVersion,\\n    pub input_hash: Hash256,\\n    pub output_hash: Hash256,\\n    pub result: R,\\n    pub law_refs: Vec<LawId>,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"note\": \"ComponentEvidenceEnvelope is not a fact by name. Fact, decision, license, action, and record envelopes must use their own canonical artifact families and owning boundaries.\\n\"\n        }\n      },\n      \"default_authority_effect\": \"AuthorityEffect::EvidenceOnly\",\n      \"default_authority_note\": \"Only components whose contracts explicitly own judgment or decision boundaries may emit RequiresEvaluator or RequestsDecision. Only licensing boundaries emit AuthorizesTransition. Only Engine emits StateTransition.\\n\",\n      \"negative_capability_tests\": {\n        \"forbidden_component_tokens\": [\n          \"EngineDecision\",\n          \"PipelineEvent\",\n          \"PolicyDecision\",\n          \"TerminalEnvelope\",\n          \"ActionLicense\",\n          \"accepted = true\",\n          \"rejected = true\",\n          \"verdict: Accept\",\n          \"verdict: Reject\",\n          \"quality_score\",\n          \"reward_score\",\n          \"should_apply\",\n          \"authorize_transition\",\n          \"license_transition\",\n          \"execute_transition\",\n          \"mutate_global_state\",\n          \"solve_cnf\",\n          \"solve_l1_hodge\",\n          \"phi1(\",\n          \"gamma2(\"\n        ],\n        \"forbidden_naming_tokens\": [\n          \"LambdaOp\",\n          \"ReducerOp\",\n          \"TransformOp\",\n          \"ForgetfulOp\",\n          \"AdapterOp\",\n          \"GaugeOp\",\n          \"ReflectorOp\",\n          \"OperatorFactEnvelope\",\n          \"BasisOperator\",\n          \"ActionFactEnvelope\"\n        ],\n        \"python_guard\": \"from pathlib import Path\\n\\nFORBIDDEN_COMPONENT_TOKENS = [\\n    \\\"EngineDecision\\\", \\\"PipelineEvent\\\", \\\"PolicyDecision\\\", \\\"TerminalEnvelope\\\",\\n    \\\"ActionLicense\\\", \\\"accepted = true\\\", \\\"rejected = true\\\", \\\"verdict: Accept\\\",\\n    \\\"verdict: Reject\\\", \\\"quality_score\\\", \\\"reward_score\\\", \\\"should_apply\\\",\\n    \\\"authorize_transition\\\", \\\"license_transition\\\", \\\"execute_transition\\\",\\n    \\\"mutate_global_state\\\", \\\"solve_cnf\\\", \\\"solve_l1_hodge\\\", \\\"phi1(\\\", \\\"gamma2(\\\",\\n]\\n\\nFORBIDDEN_NAMING_TOKENS = [\\n    \\\"LambdaOp\\\", \\\"ReducerOp\\\", \\\"TransformOp\\\", \\\"ForgetfulOp\\\",\\n    \\\"AdapterOp\\\", \\\"GaugeOp\\\", \\\"ReflectorOp\\\",\\n    \\\"OperatorFactEnvelope\\\", \\\"BasisOperator\\\", \\\"ActionFactEnvelope\\\",\\n]\\n\\ndef assert_no_forbidden_tokens(root: str):\\n    violations = []\\n    for path in Path(root).rglob(\\\"*.rs\\\"):\\n        text = path.read_text(encoding=\\\"utf-8\\\")\\n        for token in FORBIDDEN_COMPONENT_TOKENS + FORBIDDEN_NAMING_TOKENS:\\n            if token in text:\\n                violations.append((str(path), token))\\n    assert not violations, violations\\n\"\n      },\n      \"required_tests\": [\n        \"shared_boundary_uses_canonical_authority_effect_enum\",\n        \"shared_boundary_removes_action_fact_envelope\",\n        \"component_outputs_default_to_evidence_only\",\n        \"search_and_solver_are_not_execution\",\n        \"pipeline_is_orchestration_not_execution\",\n        \"only_engine_emits_action\",\n        \"only_licensing_boundary_emits_action_license\",\n        \"component_evidence_envelope_is_not_fact_by_name\",\n        \"adapter_outputs_evidence_not_fact\",\n        \"no_component_self_declares_operator_status\",\n        \"no_legacy_op_suffix_tokens\",\n        \"component_specific_contract_cannot_exceed_kernel_authority_matrix\"\n      ],\n      \"canonical_invariant\": \"ComponentSharedBoundary defines evidence-first boundaries for non-operator components. Only E/I/C/R/M are fixed-layer operator classes. Components emit artifacts under declared families; most outputs are EvidenceOnly until checked. Components do not gain authority from names, envelopes, or placement. Only licensing boundaries authorize transitions, only Engine executes, Trace records, and no shared component envelope is a fact by default.\\n\",\n      \"file_naming_law\": \"All component-family implementation files MUST obey operator_file_naming_contract.md\"\n    },\n    \"fixed_layer_operator_algebra\": {\n      \"source_file\": \"fixed_layer_operator_algebra_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"FixedLayerOperatorAlgebra\",\n        \"role\": \"defines the five and only five fixed-layer effect classes in the obstruction algebra\",\n        \"version\": \"2.0\",\n        \"classification\": \"operator-taxonomy\",\n        \"effect_class\": \"all\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ContractConstitution\",\n          \"GlobalContractTaxonomy\",\n          \"KernelAuthorityMatrix\"\n        ],\n        \"forbidden_authority\": [\n          \"creating new effect-classes beyond E/I/C/R/M\",\n          \"calling non-operator entities operators\",\n          \"candidate self-declaring effect class\",\n          \"operator artifact emitting Action directly\",\n          \"operator artifact emitting ActionLicense directly\",\n          \"composition without RewriteLaw or certificate\",\n          \"authority upgrade without checker boundary\"\n        ],\n        \"primary_output_family\": \"StructureArtifact\",\n        \"domain_output_kind\": \"TaxonomyRule\",\n        \"referenced_output_families\": [\n          \"EvidenceEnvelope\",\n          \"FactEnvelope\",\n          \"ActionLicense\",\n          \"Action\"\n        ],\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, prove operator composition, or upgrade evidence authority. LLM output may propose operator candidates or algebra patches, but those proposals are EvidenceOnly until checked by the fixed-layer operator classifier/checker.\\n\",\n      \"core_doctrine\": \"The strict fixed-layer obstruction algebra has exactly five effect-classes. No more may be added without constitutional amendment.\\n\",\n      \"operator_authority_boundary\": {\n        \"candidate_authority\": \"EvidenceOnly\",\n        \"checked_classification_authority\": \"FactOnly if checker/certifier verifies\",\n        \"licensing_authority\": \"AuthorizesTransition, emitted only by LicensingBoundary\",\n        \"execution_authority\": \"StateTransition, emitted only by Engine\",\n        \"notes\": [\n          \"E/I/C/R/M are effect classes, not execution authority\",\n          \"An operator candidate is EvidenceOnly\",\n          \"An operator artifact does not emit ActionLicense, Action, StateTransition, or EngineResult\",\n          \"A licensed operator application requires a separate ActionLicense\",\n          \"Engine execution of a licensed operator application is the Action\"\n        ]\n      },\n      \"effect_classes\": {\n        \"E_exact_repair\": {\n          \"definition\": \"A same-carrier local displacement that restores a broken invariant to its canonical form. The repair is exact: the post-state satisfies the invariant that the pre-state violated.\\n\",\n          \"rust_candidate\": \"pub struct ExactRepairCandidate {\\n    pub candidate_id: OperatorCandidateId,\\n    pub obstruction_ref: ObstructionId,\\n    pub carrier_ref: CarrierRef,\\n    pub pre_state_hash: Hash256,\\n    pub post_state_hash: Hash256,\\n    pub invariant_restored: InvariantId,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub candidate_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"rust_checked\": \"pub struct CheckedExactRepair {\\n    pub checked_id: CheckedOperatorId,\\n    pub candidate_ref: OperatorCandidateId,\\n    pub same_carrier_certificate: CertificateId,\\n    pub invariant_restoration_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"composition_law\": \"E . E may normalize to E only when same-carrier preservation, invariant restoration, replayability, and an explicit RewriteLaw or certificate justify compression\",\n          \"admissibility\": \"Pre-state must violate the declared invariant; post-state must satisfy it\",\n          \"refusal\": \"If no invariant is violated, E is inadmissible (repair without breakage is identity, not E)\"\n        },\n        \"I_quotient_isometry\": {\n          \"definition\": \"A representation-preserving equivalence map that identifies states differing only by gauge freedom. The quotient isometry collapses a gauge orbit to its canonical representative without information loss relevant to the declared invariants.\\n\",\n          \"rust_candidate\": \"pub struct QuotientIsometryCandidate {\\n    pub candidate_id: OperatorCandidateId,\\n    pub source_carrier: CarrierRef,\\n    pub target_carrier: CarrierRef,\\n    pub source_hash: Hash256,\\n    pub target_hash: Hash256,\\n    pub equivalence_class: GaugeOrbitId,\\n    pub isometry_witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub candidate_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"rust_checked\": \"pub struct CheckedQuotientIsometry {\\n    pub checked_id: CheckedOperatorId,\\n    pub candidate_ref: OperatorCandidateId,\\n    pub quotient_preservation_certificate: CertificateId,\\n    pub invariant_preservation_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"identity_note\": \"Identity may be classified as I only when a declared identity or quotient-equivalence law applies. Identity by naming alone is not an operator fact.\",\n          \"composition_law\": \"I . I = I (quotient isometries compose)\",\n          \"admissibility\": \"Source and target must be in the same gauge orbit\",\n          \"refusal\": \"If source and target differ in invariant-relevant structure, I is inadmissible\"\n        },\n        \"C_context_embedding\": {\n          \"definition\": \"A context embedding maps a local structure into a declared admissible context within the current fixed layer, preserving declared local invariants and recording the context relation. It does not perform carrier/schema expansion unless a separate LiftLicense exists.\\n\",\n          \"rust_candidate\": \"pub struct ContextEmbeddingCandidate {\\n    pub candidate_id: OperatorCandidateId,\\n    pub source_carrier: CarrierRef,\\n    pub context_family_ref: ContextFamilyRef,\\n    pub target_context_ref: ContextRef,\\n    pub embedding_witness_refs: Vec<WitnessId>,\\n    pub preservation_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub candidate_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"rust_checked\": \"pub struct CheckedContextEmbedding {\\n    pub checked_id: CheckedOperatorId,\\n    pub candidate_ref: OperatorCandidateId,\\n    pub injectivity_certificate: CertificateId,\\n    pub invariant_preservation_certificate: CertificateId,\\n    pub context_admissibility_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"carrier_note\": \"C does not create new carrier expressivity by itself. If carrier/schema expressivity changes, the operation requires Lift machinery and a LiftLicense.\",\n          \"composition_law\": \"C . C may normalize to C only when declared context composition exists and the composed embedding has replay/certificate support\",\n          \"admissibility\": \"Embedding must be injective; source invariants must be preserved in target\",\n          \"refusal\": \"If embedding is not injective or destroys source invariants\"\n        },\n        \"R_residual_projection\": {\n          \"definition\": \"A residual projection maps a structure to a deterministic residual representative under a declared TiePolicy, preserving required invariants and recording discarded information. R is irreversible unless a separate checked witness proves otherwise.\\n\",\n          \"rust_candidate\": \"pub struct ResidualProjectionCandidate {\\n    pub candidate_id: OperatorCandidateId,\\n    pub source_carrier: CarrierRef,\\n    pub target_carrier_schema: CarrierSchemaRef,\\n    pub projection_map_ref: ProjectionWitnessId,\\n    pub tie_policy: TiePolicyId,\\n    pub discarded_dimensions: Vec<DimensionId>,\\n    pub invariants_preserved: Vec<InvariantId>,\\n    pub invariants_discarded: Vec<InvariantId>,\\n    pub evidence_refs: Vec<EvidenceRef>,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub candidate_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"rust_checked\": \"pub struct CheckedResidualProjection {\\n    pub checked_id: CheckedOperatorId,\\n    pub candidate_ref: OperatorCandidateId,\\n    pub surjectivity_certificate: CertificateId,\\n    pub tie_policy_certificate: CertificateId,\\n    pub preservation_certificate: CertificateId,\\n    pub discarded_information_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"tie_policy_note\": \"R requires deterministic TiePolicy. Without TiePolicy, R is invalid.\",\n          \"composition_law\": \"R . R may normalize to R only when source/target compatibility, deterministic TiePolicy composition, invariant preservation, discarded-information evidence, replay support, and explicit RewriteLaw or certificate are present.\",\n          \"admissibility\": \"Projection must be surjective; target invariants must hold\",\n          \"refusal\": \"If projection destroys required invariants in the target\"\n        },\n        \"M_refused_mutation\": {\n          \"definition\": \"M is an absorbing refusal class for invalid, unlicensed, authority-insufficient, or inadmissible attempted mutations. M is valid only when it records the proposed mutation, refusal reason, refusing boundary, and evidence.\\n\",\n          \"rust_candidate\": \"pub struct RefusedMutationCandidate {\\n    pub refusal_id: RefusalId,\\n    pub attempted_mutation_ref: EvidenceRef,\\n    pub current_state_hash: Hash256,\\n    pub proposed_state_hash: Hash256,\\n    pub refusal_reason: RefusalReason,\\n    pub refusing_boundary: BoundaryId,\\n    pub evidence_refs: Vec<EvidenceRef>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub refusal_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"rust_checked\": \"pub struct CheckedRefusedMutation {\\n    pub checked_id: CheckedOperatorId,\\n    pub refusal_ref: RefusalId,\\n    pub refusal_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"composition_law\": \"M . X = M for any X (refusal absorbs subsequent operations)\",\n          \"admissibility\": \"Always admissible (any proposed mutation may be refused)\",\n          \"refusal\": \"A checked M is absorbing under declared composition. A malformed or unsupported refusal record is rejected as invalid evidence, not classified as another M.\"\n        }\n      },\n      \"conditional_composition_table\": {\n        \"description\": \"Type-level target for checked composition. Not automatic rewrite authority. A composition result is valid only when: (1) both operands are checked; (2) source/target boundaries match; (3) required carrier/context compatibility holds; (4) no authority is upgraded; (5) required RewriteLaw or certificate exists; (6) replay trace can be emitted.\\n\",\n        \"matrix\": {\n          \"E\": [\n            \"E\",\n            \"E\",\n            \"C\",\n            \"R\",\n            \"M\"\n          ],\n          \"I\": [\n            \"E\",\n            \"I\",\n            \"C\",\n            \"R\",\n            \"M\"\n          ],\n          \"C\": [\n            \"C\",\n            \"C\",\n            \"C\",\n            \"R\",\n            \"M\"\n          ],\n          \"R\": [\n            \"R\",\n            \"R\",\n            \"R\",\n            \"R\",\n            \"M\"\n          ],\n          \"M\": [\n            \"M\",\n            \"M\",\n            \"M\",\n            \"M\",\n            \"M\"\n          ]\n        },\n        \"notes\": [\n          \"M is absorbing: any composition with M yields M\",\n          \"E and I are 'light' effects that preserve carrier structure\",\n          \"C and R change context or residual representation within the declared fixed layer. Carrier/schema expressivity changes require Lift machinery and a valid LiftLicense.\",\n          \"C . R != identity in general (information loss in R is irreversible)\"\n        ]\n      },\n      \"algebraic_closure_properties\": {\n        \"closure\": \"The set {E, I, C, R, M} is closed under composition\",\n        \"associativity\": \"Associativity is a law obligation for checked composition, not an assumed implementation property. Any implementation that relies on associativity must provide a RewriteLaw, finite checker, or certificate.\",\n        \"identity\": \"Identity may be represented as a quotient isometry only when a declared identity/equivalence witness exists. Otherwise it is an inert no-change relation, not an operator fact.\",\n        \"absorption\": \"M is the zero element: M . X = X . M = M\",\n        \"no_inverse_for_R\": \"Residual projection is not invertible. Lost information cannot be recovered.\"\n      },\n      \"non_operator_entities\": [\n        {\n          \"entity\": \"Lambda\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Pure local endomorphism proposing transformation\"\n        },\n        {\n          \"entity\": \"Reducer\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Same-carrier deflation proposing reduction\"\n        },\n        {\n          \"entity\": \"Normalizer\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Canonical-form mapping proposing normalization\"\n        },\n        {\n          \"entity\": \"Transform\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Same-carrier rearrangement proposing transformation\"\n        },\n        {\n          \"entity\": \"Constructor\",\n          \"correct_classification\": \"Boundary (intake)\",\n          \"role\": \"Converts raw input to validated BaseType\"\n        },\n        {\n          \"entity\": \"Adapter\",\n          \"correct_classification\": \"Boundary (representation)\",\n          \"role\": \"Changes representation without changing meaning\"\n        },\n        {\n          \"entity\": \"Encoder\",\n          \"correct_classification\": \"Boundary (representation)\",\n          \"role\": \"Maps to compressed/canonical representation\"\n        },\n        {\n          \"entity\": \"Decoder\",\n          \"correct_classification\": \"Boundary (representation)\",\n          \"role\": \"Inverse of encoder\"\n        },\n        {\n          \"entity\": \"Projector\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Projects carrier to lower-dimensional subspace\"\n        },\n        {\n          \"entity\": \"Reflector\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Quotation/reflection boundary\"\n        },\n        {\n          \"entity\": \"Forgetful\",\n          \"correct_classification\": \"Action candidate\",\n          \"role\": \"Discards structure while preserving invariants\"\n        },\n        {\n          \"entity\": \"Generator\",\n          \"correct_classification\": \"Candidate (proposal)\",\n          \"role\": \"Pure proposal morphism\"\n        },\n        {\n          \"entity\": \"Evaluator\",\n          \"correct_classification\": \"Governance (judgment)\",\n          \"role\": \"Admissibility judgment gate\"\n        },\n        {\n          \"entity\": \"Validator\",\n          \"correct_classification\": \"Governance (well-formedness)\",\n          \"role\": \"Structural conformance checker\"\n        },\n        {\n          \"entity\": \"Terminalizer\",\n          \"correct_classification\": \"Governance / terminal mapping\",\n          \"role\": \"Seals terminal outcomes or licenses; does not execute\"\n        },\n        {\n          \"entity\": \"MetaLift\",\n          \"correct_classification\": \"Lift machinery\",\n          \"role\": \"Licensed carrier extension\"\n        },\n        {\n          \"entity\": \"Engine\",\n          \"correct_classification\": \"Execution\",\n          \"role\": \"Executes licensed transitions only\"\n        },\n        {\n          \"entity\": \"Pipeline\",\n          \"correct_classification\": \"Orchestration\",\n          \"role\": \"Routes declared stages; does not execute\"\n        },\n        {\n          \"entity\": \"Search\",\n          \"correct_classification\": \"Proposal system\",\n          \"role\": \"Generates/traverses candidate frontier only\"\n        },\n        {\n          \"entity\": \"Solver\",\n          \"correct_classification\": \"Computation\",\n          \"role\": \"Computes declared mathematical results; does not authorize transitions\"\n        }\n      ],\n      \"candidate_note\": \"Action candidates may GENERATE proposals for E, I, C, R, or M effects. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. The candidate itself is never an operator.\\n\",\n      \"forbidden_tokens\": {\n        \"naming\": [\n          \"LambdaOp\",\n          \"ReducerOp\",\n          \"TransformOp\",\n          \"ForgetfulOp\",\n          \"AdapterOp\",\n          \"GaugeOp\",\n          \"ReflectorOp\",\n          \"OperatorFactEnvelope\",\n          \"ActionFactEnvelope\",\n          \"BasisOperator\"\n        ],\n        \"behavior\": [\n          \"self_declare_effect_class\",\n          \"emit_action\",\n          \"emit_action_license\",\n          \"execute_transition\",\n          \"authorize_transition\",\n          \"license_transition\",\n          \"compose_without_rewrite_law\",\n          \"normalize_without_certificate\",\n          \"commute_without_certificate\"\n        ],\n        \"notes\": [\n          \"Any *Op suffix or *Operator name on non-E/I/C/R/M entities is forbidden\",\n          \"OperatorFactEnvelope is forbidden. Use ComponentEvidenceEnvelope or the role-specific canonical envelope\",\n          \"ActionFactEnvelope is forbidden because it collapses action and fact authority\"\n        ]\n      },\n      \"required_tests\": [\n        \"only_five_effect_classes_exist\",\n        \"effect_class_composition_is_closed\",\n        \"effect_class_composition_is_associative\",\n        \"refused_mutation_is_absorbing\",\n        \"exact_repair_requires_broken_invariant\",\n        \"quotient_isometry_preserves_invariants\",\n        \"context_embedding_is_injective\",\n        \"residual_projection_is_surjective\",\n        \"no_op_suffix_on_non_effect_class\",\n        \"no_operator_name_on_non_effect_class\",\n        \"operator_candidates_default_to_evidence_only\",\n        \"checked_operator_classification_may_be_factonly\",\n        \"operator_candidate_cannot_self_declare_effect_class\",\n        \"operator_artifact_does_not_emit_action\",\n        \"operator_artifact_does_not_emit_action_license\",\n        \"operator_execution_requires_action_license\",\n        \"composition_requires_rewrite_law_or_certificate\",\n        \"context_embedding_does_not_extend_carrier_without_lift_license\",\n        \"residual_projection_requires_tie_policy\",\n        \"malformed_refusal_record_is_not_checked_m\",\n        \"action_fact_envelope_forbidden\",\n        \"search_and_solver_not_classified_as_execution\"\n      ],\n      \"canonical_invariant\": \"The fixed-layer obstruction algebra has exactly five effect classes: E = exact repair, I = quotient isometry, C = context embedding, R = residual projection, and M = refused mutation. Operator candidates are EvidenceOnly. Checked operator classifications may become FactOnly only through classifier/checker evidence. Operator artifacts do not authorize or execute transitions. LicensingBoundary authorizes; Engine executes. Everything else is a candidate, boundary, computation, governance gate, orchestration layer, record, replay, or lift machinery -- never an operator.\\n\"\n    },\n    \"adapter_boundary\": {\n      \"source_file\": \"adapter_boundary_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"AdapterBoundary\",\n        \"role\": \"Pure representation morphism crossing schema boundaries\",\n        \"classification\": \"boundary\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"semantic creation\",\n          \"hidden inference\",\n          \"policy interpretation\",\n          \"search\",\n          \"solver invocation\",\n          \"state mutation\",\n          \"lift licensing\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"Record\"\n        ],\n        \"referenced_domain_kinds\": [\n          \"WitnessEnvelope\",\n          \"CertificateEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, adapt schemas, or upgrade evidence authority. LLM output may propose adapter definitions or migration mappings, but those proposals are EvidenceOnly until checked by the Adapter / Schema / InvariantTransport boundary.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is a BOUNDARY, not a fixed-layer operator. An Adapter is a pure representation morphism. It crosses schema boundaries without semantic computation, solver invocation, evaluation, or authority promotion. Adapters change representation, not meaning. Adapter artifacts are EvidenceOnly by default. A checked adaptation result may become FactOnly only after schema-bound totality, deterministic hashing, invariant transport, loss declaration, and replay checks pass. Adapter never emits ActionLicense, Action, DecisionEnvelope, or StateTransition.\\n\",\n      \"core_definition\": \"An Adapter is a pure, total, non-executive transformation that maps one BaseType to another BaseType with a different SchemaRef, preserving declared invariants up to an explicitly stated correspondence, and performing no orchestration, search, policy, or side-effectful computation. An Adapter is the lawful representation-boundary mechanism for schema-changing representation conversion. Carrier/schema expressivity changes are lifts, not adaptations.\\n\",\n      \"architectural_role\": {\n        \"description\": \"Adapters exist to cross representation boundaries safely and explicitly.\",\n        \"is\": \"representation boundaries\",\n        \"is_not\": [\n          \"computational components\",\n          \"evaluators\",\n          \"engines\",\n          \"pipelines\",\n          \"policies\",\n          \"solvers\",\n          \"search components\"\n        ],\n        \"summary\": \"They are representation morphisms, nothing more.\"\n      },\n      \"rules\": {\n        \"explicit_schema_boundary\": {\n          \"section_number\": 1,\n          \"requirements\": [\n            \"Every Adapter MUST declare a source schema SchemaRef_src\",\n            \"Every Adapter MUST declare a target schema SchemaRef_dst\",\n            \"If SchemaRef_src == SchemaRef_dst, an Adapter is forbidden. Identity is handled by the BaseType itself.\"\n          ]\n        },\n        \"totality_and_determinism\": {\n          \"section_number\": 2,\n          \"must_be\": [\n            \"Total over admissible source domain -- defined for all valid instances of the source BaseType that meet the explicitly declared admissibility conditions\",\n            \"Deterministic -- identical inputs produce identical outputs\",\n            \"Pure -- no side effects, no IO, no external state\"\n          ],\n          \"must_not\": [\n            \"branch on runtime policy\",\n            \"consult external registries\",\n            \"depend on time, randomness, or environment\"\n          ],\n          \"allowed\": \"Bounded structural field mapping, renaming, canonical serialization, and declared loss accounting\",\n          \"forbidden\": \"Search, optimization, inference, solver calls, policy branching, and semantic repair\"\n        },\n        \"invariant_transport_law\": {\n          \"section_number\": 3,\n          \"description\": \"Adapters must explicitly declare how invariants are transported via a dedicated InvariantTransportKernel\",\n          \"rust_code\": \"struct InvariantTransport {\\n    source: InvariantId,\\n    target: Vec<InvariantId>,\\n    mode: TransportMode,\\n}\\n\\nenum TransportMode {\\n    Preserved,\\n    Refined,\\n    Weakened,\\n    ForgottenExplicitly,\\n}\\n\",\n          \"invariant_correspondence\": \"For each invariant I_src of the source schema, the Adapter MUST specify the TransportMode. Dropping an invariant without explicit declaration is forbidden.\",\n          \"no_invariant_repair\": [\n            \"An Adapter MUST NOT silently repair invariant violations\",\n            \"An Adapter MUST NOT coerce invalid source data into valid target data\",\n            \"If an invariant cannot be transported, the Adapter MUST fail explicitly\"\n          ]\n        },\n        \"no_new_information_law\": {\n          \"section_number\": 4,\n          \"formal\": \"Info(Dst) <= Closure(Info(Src)) under declared transport semantics\",\n          \"allowed\": [\n            \"renaming fields\",\n            \"regrouping structure\",\n            \"changing coordinate systems (ONLY IF invertibility, invariant transport, and quotient preservation are explicitly declared)\",\n            \"forgetting fields (with explicit loss declaration)\"\n          ],\n          \"forbidden\": [\n            \"inference\",\n            \"estimation\",\n            \"optimization\",\n            \"default filling of missing data\"\n          ]\n        },\n        \"loss_declaration\": {\n          \"section_number\": 5,\n          \"rust_code\": \"pub enum LossClass {\\n    Structural,\\n    Semantic,\\n    QuotientRelevant,\\n}\\n\\npub enum LossMode {\\n    None,\\n    Explicit {\\n        lost_fields: &'static [&'static str],\\n        loss_class: LossClass,\\n    },\\n}\\n\",\n          \"requirements\": [\n            \"Loss MUST be explicit\",\n            \"Loss MUST be auditable\",\n            \"Loss MUST be invariant-compatible\",\n            \"Silent loss is forbidden\",\n            \"Every adaptation must produce AdaptationEvidence detailing transported invariants, lost invariants, quotient impact, and support mapping\"\n          ]\n        },\n        \"phi_and_quotient_geometry\": {\n          \"section_number\": 6,\n          \"requirements\": [\n            \"Adapter may change representation-level quotient references only through declared invariant transport and explicit loss\",\n            \"MUST NOT compute or recompute canonical Phi1, Gamma2, Xi, quotient mass, closure defect, or cohomological status\",\n            \"MUST NOT mix supports or introduce Phi-coupling between previously independent components\"\n          ],\n          \"formal\": \"If [a] perp [b] in source, then Adapter(a) perp Adapter(b) in target, unless loss is explicitly declared\",\n          \"note\": \"Strictly distinguish between representation-preserving adapters and quotient-altering projection adapters. They are different categories.\"\n        }\n      },\n      \"rust_types\": {\n        \"adaptation_output\": {\n          \"code\": \"pub struct AdaptationOutput<Dst> {\\n    pub adapter_id: AdapterId,\\n    pub source_schema: SchemaRef,\\n    pub target_schema: SchemaRef,\\n    pub source_hash: Hash256,\\n    pub target_hash: Hash256,\\n    pub output: Dst,\\n    pub evidence: AdaptationEvidence,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"adapter_trait\": {\n          \"code\": \"pub trait Adapter<Src: BaseType, Dst: BaseType> {\\n    fn source_schema(&self) -> SchemaRef;\\n    fn target_schema(&self) -> SchemaRef;\\n    fn adapt(&self, src: &Src) -> Result<AdaptationOutput<Dst>, AdaptationError>;\\n}\\n\",\n          \"note\": \"AdaptationError MUST be structural (never policy- or execution-based). Adapter output is evidence, not an action fact.\"\n        },\n        \"checked_adaptation_output\": {\n          \"code\": \"pub struct CheckedAdaptationOutput<Dst> {\\n    pub output_ref: AdaptationOutputRef,\\n    pub checked_target_hash: Hash256,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"note\": \"Only a checking boundary may produce CheckedAdaptationOutput. Adapter itself emits AdaptationOutput.\"\n        }\n      },\n      \"forbidden_behaviors_hard_errors\": [\n        \"call computational components, engines, evaluators, policies, searches, or solvers\",\n        \"perform search or branching over alternatives\",\n        \"mutate global or external state\",\n        \"depend on policy, budgets, or runtime context\",\n        \"cache results that affect observable behavior\"\n      ],\n      \"forbidden_behaviors_note\": \"If any of these occur, the component is not an Adapter.\",\n      \"pipeline_engine_relationship\": [\n        \"Pipeline or declared orchestration selects when an adapter boundary is invoked\",\n        \"Adapter defines how representation fields map\",\n        \"Engine does not adapt implicitly and does not execute adapters as state transitions unless a separate licensed transition applies\"\n      ],\n      \"admissibility_checklist\": [\n        \"Source and target schemas differ\",\n        \"Transformation is total over the admissible domain and deterministic\",\n        \"No new information is introduced\",\n        \"All invariant transport is explicit\",\n        \"Any information loss is declared\",\n        \"Phi-separability is preserved\",\n        \"No execution, search, or policy logic exists\",\n        \"No external dependencies or side effects\"\n      ],\n      \"admissibility_note\": \"If any condition fails, the Adapter is invalid.\",\n      \"required_tests\": {\n        \"purity\": [\n          \"adapter_has_no_io\",\n          \"adapter_has_no_external_dependencies\",\n          \"adapter_has_no_policy_branching\",\n          \"adapter_has_no_runtime_context\"\n        ],\n        \"transport\": [\n          \"all_source_invariants_accounted_for\",\n          \"undeclared_invariant_drop_rejected\",\n          \"loss_mode_required_for_forgetting\"\n        ],\n        \"quotient\": [\n          \"adapter_preserves_support_separability\",\n          \"adapter_does_not_merge_independent_components\",\n          \"quotient_collapse_requires_explicit_loss\"\n        ],\n        \"replay\": [\n          \"same_input_same_output\",\n          \"same_input_same_loss_certificate\",\n          \"canonical_serialization_stable_under_adaptation\"\n        ],\n        \"composition\": [\n          \"adapter_chain_preserves_transport_laws\",\n          \"loss_accumulates_explicitly\"\n        ],\n        \"authority\": [\n          \"adapter_output_defaults_to_evidence_only\",\n          \"checked_adaptation_output_may_be_factonly_after_checks\",\n          \"adapter_does_not_emit_action_fact_envelope\",\n          \"adapter_does_not_create_adaptation_certificate\",\n          \"adapter_evidence_is_not_certificate\",\n          \"adapter_does_not_compute_canonical_cohomological_values\",\n          \"adapter_does_not_infer_missing_fields\",\n          \"adapter_does_not_default_fill_missing_data\",\n          \"adapter_does_not_call_solver_or_search\",\n          \"adapter_does_not_authorize_transition\",\n          \"adapter_same_schema_forbidden\",\n          \"adapter_schema_change_requires_explicit_invariant_transport\"\n        ]\n      },\n      \"target_architecture\": {\n        \"kernels\": [\n          \"SchemaKernel\",\n          \"BaseTypeKernel\",\n          \"InvariantTransportKernel\",\n          \"AdapterKernel\",\n          \"SerializationKernel\",\n          \"ReplayKernel\"\n        ],\n        \"note\": \"Adapters should remain tiny: map representation, transport invariants, declare loss, and stop.\"\n      },\n      \"theorem_level_infrastructure\": [\n        \"NoSemanticCreationInsideAdapter\",\n        \"InvariantTransportCompleteness\",\n        \"ExplicitLossLaw\",\n        \"QuotientSeparabilityPreservation\",\n        \"AdapterDeterminism\",\n        \"NoImplicitAdaptationInsideEngine\",\n        \"SchemaBoundaryIntegrity\",\n        \"ReplayStableAdaptation\"\n      ],\n      \"canonical_invariant\": \"Adapter is an EvidenceOnly representation boundary. It maps between different schema-bound BaseTypes through total, deterministic, pure structural transformation with explicit invariant transport and explicit loss. It changes representation, not meaning. It does not certify, validate, infer, repair, compute canonical measurements, terminalize, authorize, mutate, execute, or emit action facts. If meaning or carrier expressivity changes, the boundary is not Adapter; it is lift or another declared authority boundary.\\n\",\n      \"upgrade_v02\": {\n        \"adaptation_evidence\": {\n          \"description\": \"Adapters need an explicit loss and invariant transport evidence record\",\n          \"rust_code\": \"pub struct AdaptationEvidence {\\n    pub adapter_id: AdapterId,\\n    pub source_schema: SchemaRef,\\n    pub target_schema: SchemaRef,\\n    pub source_hash: Hash256,\\n    pub target_hash: Hash256,\\n    pub invariant_transport: Vec<InvariantTransport>,\\n    pub loss_ledger: LossLedger,\\n    pub quotient_impact: QuotientImpact,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\\npub enum QuotientImpact {\\n    Preserved,\\n    Weakened { reason: &'static str },\\n    Collapsed { loss_certificate: CertificateId },\\n}\\n\\npub struct LossLedger {\\n    pub lost_fields: Vec<FieldId>,\\n    pub loss_class: LossClass,\\n    pub semantic_loss_declared: bool,\\n}\\n\",\n          \"note\": \"If certification is required, CertificateKernel may seal a certificate over AdaptationEvidence. Adapter itself does not create certificates.\"\n        },\n        \"python_poc\": \"from dataclasses import dataclass\\n\\n@dataclass(frozen=True)\\nclass Handoff:\\n    source_schema: str\\n    target_schema: str\\n    adapter_id: str | None\\n\\ndef validate_adapter_boundary(h: Handoff) -> None:\\n    if h.source_schema == h.target_schema and h.adapter_id is not None:\\n        raise ValueError(\\\"Adapter forbidden when schemas are identical.\\\")\\n    if h.source_schema != h.target_schema and h.adapter_id is None:\\n        raise ValueError(\\\"Adapter required for schema-changing handoff.\\\")\\n\"\n      },\n      \"paired_boundary\": {\n        \"decoder\": \"Decoder is the inverse or partial-inverse representation boundary paired with Encoder. Its governing contract is decoder_boundary_contract.md. Adapter does not define Decoder authority.\\n\"\n      }\n    },\n    \"encoder_boundary\": {\n      \"source_file\": \"encoder_boundary_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"EncoderBoundary\",\n        \"role\": \"Typed representation functor mapping structured domain to admissible density representation\",\n        \"classification\": \"boundary\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"evaluation\",\n          \"ranking\",\n          \"policy interpretation\",\n          \"search\",\n          \"solver invocation unless declared\",\n          \"physical interpretation without license\",\n          \"semantic creation\",\n          \"state mutation\",\n          \"action licensing\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"Record\"\n        ],\n        \"referenced_domain_kinds\": [\n          \"WitnessEnvelope\",\n          \"CertificateEnvelope\",\n          \"MeasurementEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, encode authoritative representations, or upgrade evidence authority. LLM output may propose Encoder definitions or tests, but those proposals are EvidenceOnly until checked by the Encoder / Representation / Certificate boundary.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is a BOUNDARY, not a fixed-layer operator. An Encoder is a typed representation functor at the representation boundary. It shapes the representation space but does not decide candidate acceptance, evaluate, or execute. Encoder output is EvidenceOnly by default. A checked encoded representation may become FactOnly only after codomain invariants, deterministic hashing, schema identity, replayability, and required certificate references are checked. Encoder does not emit DecisionEnvelope, ActionLicense, Action, or StateTransition.\\n\",\n      \"core_definition\": \"An Encoder is a typed representation functor mapping a structured domain to an admissible density representation under strict codomain invariants. Encoders shape the representation space but do not decide candidate acceptance.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"representation boundary / admissible embedding morphism\",\n        \"not\": [\n          \"adapter\",\n          \"decoder\",\n          \"evaluator\",\n          \"physics engine\",\n          \"solver\",\n          \"policy\",\n          \"terminalizer\",\n          \"engine\"\n        ]\n      },\n      \"encoding_domain\": \"Encoders map structured domain to admissible density representation under strict codomain invariants: PSD, trace-one, Hermitian, and finite.\\n\",\n      \"tower_placement\": \"Encoders sit at the representation boundary between the structural domain (graphs, text, embeddings) and the density-representation layer. They are closely related to Adapters but distinguished by their postcondition: every encoder output MUST be a valid density matrix. An Encoder is distinct from an Adapter. An Adapter converts between already-declared representations. An Encoder crosses the representation boundary from an unstructured/heterogeneous domain into a strictly constrained physical representation.\\n\",\n      \"actual_implementation_note\": \"The TextDensityEncoder is the canonical example of an encoder that maps raw text -> Bigram Gram matrix -> PSD trace-one density matrix. It was deliberately named \\\"encoder\\\" rather than \\\"quantum\\\" to enforce the epistemic firewall: text does not become quantum by being encoded as a density matrix. The density matrix is a diagnostic formalism, not a physical ontology.\\n\",\n      \"rust_types\": {\n        \"encoding_evidence\": {\n          \"code\": \"pub struct EncodingEvidence {\\n    pub encoder_id: EncoderId,\\n    pub source_schema: SchemaRef,\\n    pub target_schema: SchemaRef,\\n    pub source_hash: Hash256,\\n    pub encoded_hash: Hash256,\\n    pub basis_construction: BasisId,\\n    pub normalization_rule: RuleId,\\n    pub psd_witness_ref: Option<WitnessId>,\\n    pub trace_one_witness_ref: Option<WitnessId>,\\n    pub hermitian_witness_ref: Option<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub semantics: RepresentationSemantics,\\n    pub physical_interpretation_license: PhysicalInterpretationLicense,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"encoding_output\": {\n          \"code\": \"pub struct EncodingOutput<Encoded> {\\n    pub encoded: Encoded,\\n    pub evidence: EncodingEvidence,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"encoder_trait\": {\n          \"code\": \"pub trait Encoder<S, Encoded> {\\n    fn source_schema(&self) -> SchemaRef;\\n    fn target_schema(&self) -> SchemaRef;\\n\\n    fn encode(&self, input: &S) -> Result<EncodingOutput<Encoded>, EncoderError>;\\n}\\n\",\n          \"note\": \"Encoder produces EncodingEvidence. CertificateKernel may seal a certificate over that evidence. Encoder itself does not create certificates.\"\n        },\n        \"checked_encoding_output\": {\n          \"code\": \"pub struct CheckedEncodingOutput<Encoded> {\\n    pub output_ref: EncodingOutputRef,\\n    pub checked_encoded_hash: Hash256,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\",\n          \"note\": \"Only a RepresentationLawKernel, CertificateKernel, or declared checking boundary may produce CheckedEncodingOutput.\"\n        },\n        \"encoder_error\": {\n          \"code\": \"pub enum EncoderError {\\n    EmptyInput,\\n    NonFiniteInput { index: usize },\\n    DegenerateInput { reason: &'static str },\\n    DimensionMismatch { expected: usize, actual: usize },\\n    EncodingFailed { reason: String },\\n    PsdViolation,\\n    MissingPsdEvidence,\\n    MissingTraceOneEvidence,\\n    MissingHermitianEvidence,\\n    PhysicalInterpretationUnlicensed,\\n    ForbiddenEvaluationLogic,\\n    ForbiddenRankingLogic,\\n}\\n\"\n        },\n        \"representation_semantics\": {\n          \"code\": \"pub struct RepresentationSemantics {\\n    pub basis_meaning: BasisMeaning,\\n    pub admissible_metrics: Vec<MetricId>,\\n}\\n\"\n        }\n      },\n      \"postconditions\": {\n        \"description\": \"Every Ok output from an encoder MUST provide evidence references for codomain validity\",\n        \"requirements\": [\n          \"PSD: witness or certificate reference\",\n          \"Trace-one: witness or certificate reference\",\n          \"Hermitian: witness or certificate reference\",\n          \"Finite: checked by representation boundary\"\n        ],\n        \"note\": \"If certificates are absent, the output remains EvidenceOnly and must not be treated as a checked density representation.\"\n      },\n      \"preconditions\": {\n        \"description\": \"An encoder MUST reject inputs that cannot be mapped to a valid density matrix\",\n        \"rejections\": [\n          \"Empty inputs (zero-length text, empty graph)\",\n          \"Non-finite inputs (NaN embeddings)\",\n          \"Degenerate inputs (all-zero vectors that would produce a zero matrix)\"\n        ]\n      },\n      \"constraints_and_exclusions\": [\n        \"Deterministic -- same input always produces identical output\",\n        \"Stateless -- no mutable state, no caches, no external bindings\",\n        \"No evaluation -- encoders do not score, rank, or accept/reject\",\n        \"Epistemic Firewall -- encoding data as a density matrix does not make it quantum\",\n        \"No repair -- if the input cannot be encoded, return EncoderError, do not fix the input\",\n        \"No Hidden Weights -- Encoders must not smuggle ranking or feature selection via EncodingEvidence\"\n      ],\n      \"evaluation_integration\": {\n        \"description\": \"Encoders produce encoded representation evidence. Diagnostics such as entropy, purity, coherence, or SBE telemetry are produced by declared Measurement / Observable / Functional / Analysis boundaries over the encoded representation.\\n\",\n        \"flow\": \"Raw domain state\\n-> Encoder\\n-> EncodingOutput / EncodingEvidence\\n-> RepresentationLawKernel / CertificateKernel\\n-> Measurement or Analysis boundary\\n-> telemetry or evaluator input\\n\",\n        \"note\": \"The encoder itself is not evaluated by the evaluation layer. Its output (the density matrix) is what the evaluator measures.\"\n      },\n      \"epistemic_firewall\": \"Encoding a representation as a density matrix does not promote the representation to physical quantum mechanics. The density matrix formalism provides useful mathematical properties (PSD, trace-one, eigendecomposition, entropy) that serve as diagnostic tools. The encoder contract does not license claims about quantum entanglement, quantum coherence, or quantum computation over the encoded data.\\n\",\n      \"forbidden_tokens\": [\n        \"ActionFactEnvelope\",\n        \"EncodingCertificate\",\n        \"certify(\",\n        \"validate(\",\n        \"terminalize(\",\n        \"execute(\",\n        \"accepted = true\",\n        \"rejected = true\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"quantum_claim\",\n        \"physical_quantum\",\n        \"entanglement_claim\",\n        \"authority_upgrade\"\n      ],\n      \"required_tests\": [\n        \"encoder_psd_verified\",\n        \"encoder_trace_one_verified\",\n        \"encoder_hermitian_verified\",\n        \"encoder_deterministic_replay\",\n        \"encoder_rejects_empty_input\",\n        \"encoder_has_no_evaluation_logic\",\n        \"encoder_cannot_rank_candidates\",\n        \"representation_semantics_declared\",\n        \"encoder_output_defaults_to_evidence_only\",\n        \"checked_encoding_output_may_be_factonly_after_checks\",\n        \"encoder_does_not_emit_action_fact_envelope\",\n        \"encoder_produces_encoding_evidence_not_certificate\",\n        \"encoder_does_not_create_certificates\",\n        \"encoder_does_not_emit_measurements_or_diagnostics\",\n        \"encoder_does_not_rank_or_score_candidates\",\n        \"physical_interpretation_license_is_not_action_license\",\n        \"density_encoding_does_not_create_quantum_physical_claim\",\n        \"missing_psd_evidence_keeps_output_evidence_only\"\n      ],\n      \"target_architecture\": {\n        \"kernels\": [\n          \"EncoderKernel\",\n          \"RepresentationKernel\",\n          \"RepresentationLawKernel\",\n          \"MetricExtractionKernel\"\n        ]\n      },\n      \"theorem_level_infrastructure\": [\n        \"EncoderCodomainValidity\",\n        \"RepresentationBoundaryIntegrity\",\n        \"NoPhysicsFromEncoding\"\n      ],\n      \"canonical_invariant\": \"Encoder is an EvidenceOnly representation boundary. It maps structured input into a constrained encoded representation and emits EncodingEvidence. It does not certify, validate, measure, evaluate, rank, terminalize, authorize, mutate, execute, or create physical ontology. Checked encoded representations require a declared checking or Certificate boundary.\\n\",\n      \"upgrade_v02\": {\n        \"basis_meaning\": {\n          \"description\": \"Encoding into density form must produce codomain validity evidence, not physical claims\",\n          \"rust_code\": \"pub enum BasisMeaning {\\n    TokenBigram,\\n    GraphAdjacency,\\n    EmbeddingGram,\\n    DeclaredDomain(BasisId),\\n}\\n\"\n        },\n        \"no_physics_field\": {\n          \"description\": \"Add an explicit field to prevent ontology laundering\",\n          \"rust_code\": \"pub enum PhysicalInterpretationLicense {\\n    None,\\n    Licensed { license_id: LicenseId },\\n}\\n\",\n          \"note\": \"A PhysicalInterpretationLicense permits interpretation claims only. It does not authorize Engine transitions and is not an ActionLicense. Default value: PhysicalInterpretationLicense::None\\n\"\n        },\n        \"python_poc\": \"import numpy as np\\n\\n\\ndef validate_density_matrix(rho: np.ndarray, tol: float = 1e-9) -> None:\\n    if rho.shape[0] != rho.shape[1]:\\n        raise ValueError(\\\"Density matrix must be square.\\\")\\n    if not np.allclose(rho, rho.conj().T, atol=tol):\\n        raise ValueError(\\\"Hermitian violation.\\\")\\n    if not np.isclose(np.trace(rho).real, 1.0, atol=tol):\\n        raise ValueError(\\\"Trace-one violation.\\\")\\n    eigvals = np.linalg.eigvalsh(rho)\\n    if np.min(eigvals) < -tol:\\n        raise ValueError(\\\"PSD violation.\\\")\\n\"\n      }\n    },\n    \"intake_constructor\": {\n      \"source_file\": \"intake_constructor_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"IntakeConstructor\",\n        \"role\": \"Deterministic intake boundary converting raw input to typed construction evidence\",\n        \"version\": \"2.0\",\n        \"classification\": \"boundary\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation_override\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"repair\",\n          \"solving\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"Record\"\n        ],\n        \"referenced_domain_kinds\": [\n          \"WitnessEnvelope\",\n          \"CertificateEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"This contract is a governance artifact. LLM-generated content carries no authority within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"Constructor is a BOUNDARY (intake boundary), not a fixed-layer operator. A Constructor sits at the intake boundary of the Omega Engine. It validates and converts raw input into typed internal structures. It does not compute, evaluate, repair, or execute.\\n\",\n      \"core_definition\": \"A Constructor is a deterministic boundary unit that converts raw or heterogeneous input into a validated internal BaseType. It may parse, decode, type-check, and validate. It may not repair, solve, optimize, search, register with the engine, or mutate runtime state. Constructor outputs are EvidenceOnly by default. A checked construction result may become FactOnly only after validation certificate verification, schema conformance checking, and replay verification.\\n\",\n      \"tower_placement\": {\n        \"description\": \"Constructors are the intake boundary of the Omega Engine. They sit at the outermost edge, accepting untrusted data and producing validated mathematical objects.\\n\",\n        \"flow\": \"Untrusted external data -> Constructor -> validated BaseType -> Engine pipeline\",\n        \"critical_note\": \"Constructors are NOT Adapters. Constructors ingest untrusted/raw data and create lawful internal objects. Adapters convert between already-declared, already-validated representations.\\n\"\n      },\n      \"known_implementation_locations\": [\n        {\n          \"location\": \"engines/quantum/core/density_matrix.rs\",\n          \"constructs\": \"DensityMatrix::new(), DensityMatrix::pure()\"\n        },\n        {\n          \"location\": \"engines/quantum/adapters/quantum_density_engine.rs\",\n          \"constructs\": \"from_prompt_embedding_checked(), from_states_checked()\"\n        },\n        {\n          \"location\": \"engines/quantum/adapters/text_density_encoder.rs\",\n          \"constructs\": \"TextDensityEncoder::encode()\"\n        },\n        {\n          \"location\": \"engines/quantum/adapters/graph_density.rs\",\n          \"constructs\": \"GraphDensityMatrix construction\"\n        },\n        {\n          \"location\": \"engines/quantum/channels/quantum_channel.rs\",\n          \"constructs\": \"QuantumChannel::try_new()\"\n        },\n        {\n          \"location\": \"engines/prompt_intake_engine.rs\",\n          \"constructs\": \"PromptIntakeEngine::parse_cot_record(), parse_jsonl_record()\"\n        },\n        {\n          \"location\": \"types/trace_step.rs\",\n          \"constructs\": \"TraceStep::new_validated()\"\n        },\n        {\n          \"location\": \"types/trace_dependency.rs\",\n          \"constructs\": \"TraceDependency::new_validated()\"\n        },\n        {\n          \"location\": \"types/section.rs\",\n          \"constructs\": \"Section::new_validated()\"\n        },\n        {\n          \"location\": \"trace/replay_ledger.rs\",\n          \"constructs\": \"ReplayLedger::from_payloads()\"\n        },\n        {\n          \"location\": \"trace/witness.rs\",\n          \"constructs\": \"ExecutionWitness::from_execution()\"\n        }\n      ],\n      \"architectural_mandate\": {\n        \"mandatory_validation\": {\n          \"section_number\": 1,\n          \"description\": \"Constructor output MUST be impossible without validation\",\n          \"invariant\": \"Ok(T) => T.validate().is_ok()\",\n          \"example_rust_code\": \"pub fn new(dim: usize, data: Vec<C64>) -> Result<Self, DensityMatrixError> {\\n    if dim == 0 { return Err(DensityMatrixError::ZeroDimension); }\\n    if data.len() != dim * dim {\\n        return Err(DensityMatrixError::ShapeMismatch { ... });\\n    }\\n    // ... additional validation\\n    Ok(Self { dim, data })\\n}\\n\"\n        },\n        \"separate_parsing_from_construction\": {\n          \"section_number\": 2,\n          \"description\": \"Parser: bytes/text -> intermediate syntax. Constructor: intermediate/raw structure -> validated BaseType. Parsing errors and invariant violations MUST remain distinct error types.\\n\"\n        },\n        \"zero_mathematical_solving_or_repair\": {\n          \"section_number\": 3,\n          \"forbidden\": [\n            \"no filling missing fields\",\n            \"no guessing defaults\",\n            \"no normalizing invalid topology\",\n            \"no deleting bad nodes/edges\",\n            \"no solving constraints to make input valid\"\n          ],\n          \"allowed\": [\n            \"canonical decoding\",\n            \"type conversion\",\n            \"invariant checking\",\n            \"explicit default only if schema declares it\"\n          ]\n        },\n        \"pure_owned_instantiation\": {\n          \"section_number\": 4,\n          \"must_not\": [\n            \"take &mut Engine\",\n            \"maintain own state\",\n            \"register, schedule, attach, or mutate global state\"\n          ]\n        }\n      },\n      \"evidence_integration\": {\n        \"description\": \"When a constructor creates an object within a traced execution\",\n        \"steps\": [\n          \"The constructed object's state hash is recorded in the ReplayLedger\",\n          \"If the constructor is the first step, its output hash becomes the genesis_hash\",\n          \"The EvidencePacket records initial_state, constructor_morphism, hypothesis_invariant\"\n        ],\n        \"rust_code\": \"// trace/evidence.rs\\npub struct EvidencePacket {\\n    pub claim_id: Uuid,\\n    pub initial_state: String,\\n    pub constructor_morphism: String,\\n    pub hypothesis_invariant: String,\\n    pub formal_translation: String,\\n    pub oracle_execution_trace: Option<String>,\\n    pub proof: Option<OracleProof>,\\n}\\n\"\n      },\n      \"symsys_integration\": {\n        \"description\": \"Constructors can be proposed by the SymSys pipeline\",\n        \"stages\": [\n          \"Stage 1 (Ideation): Propose a new constructor for a raw data format\",\n          \"Stage 2 (Audit): Red-team the constructor for repair smuggling\",\n          \"Stage 3 (L2 Extraction): Generate the Rust skeleton with validation checks\",\n          \"Stage 4 (Countermodel): Find inputs that bypass validation\",\n          \"Stage 5 (Evidence Plan): Write #[test] functions verifying all rejection paths\"\n        ]\n      },\n      \"required_boundary_flow\": {\n        \"lawful\": \"Raw input -> Constructor -> validated BaseType\",\n        \"forbidden\": \"Raw input -> Constructor -> repaired candidate\"\n      },\n      \"rust_types\": {\n        \"constructor_output\": {\n          \"code\": \"pub struct ConstructorOutput<T> {\\n    pub value: T,\\n    pub constructor_id: ConstructorId,\\n    pub input_hash: Hash256,\\n    pub value_hash: Hash256,\\n    pub validation_report_ref: Option<ValidationReportRef>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"constructor_trait\": {\n          \"code\": \"pub trait Constructor<Raw, T> {\\n    fn constructor_id(&self) -> ConstructorId;\\n    fn parse(&self, raw: &Raw) -> Result<IntermediateSyntax, ParseError>;\\n    fn construct(&self, syntax: IntermediateSyntax) -> Result<ConstructorOutput<T>, ConstructorError>;\\n}\\n\"\n        },\n        \"constructor_error\": {\n          \"code\": \"pub enum ConstructorError {\\n    Parse(ParseError),\\n    MissingRequiredField { field: &'static str },\\n    InvariantViolation { invariant: InvariantId },\\n    RepairRequiredButForbidden,\\n}\\n\",\n          \"note\": \"Constructors must reject incomplete input rather than fill it. A constructor MUST fail closed when required input is absent, ambiguous, or structurally incomplete.\"\n        }\n      },\n      \"canonical_invariant\": \"Constructor may perform intake precondition checks and schema-directed parsing. Validator owns validation. CertificateKernel owns certificates. Encoder encodes. LambdaAction bridges. ReducerAction deflates. TransformAction rearranges. Generator proposes. Engine executes licensed transitions. Boundaries shape and validate; only Evaluators accept; only Engines execute; only MetaLift changes carrier expressivity. No boundary is allowed to become an Engine in disguise.\\n\",\n      \"upgrade_v02\": {\n        \"constructor_output_contract\": {\n          \"description\": \"A constructor MUST emit a validated object plus a validation certificate, not just T\"\n        },\n        \"repair_smuggling_guard\": {\n          \"description\": \"Constructors must reject incomplete input rather than fill it\"\n        },\n        \"python_poc\": \"from dataclasses import dataclass\\nfrom typing import Any\\nimport hashlib, json\\n\\n@dataclass(frozen=True)\\nclass ConstructorOutput:\\n    value: Any\\n    constructor_id: str\\n    input_hash: str\\n    value_hash: str\\n    validation_certificate_ref: str\\n\\n\\ndef stable_hash(obj: Any) -> str:\\n    raw = json.dumps(obj, sort_keys=True, default=str).encode()\\n    return hashlib.sha256(raw).hexdigest()\\n\\n\\ndef construct_required_record(raw: dict) -> ConstructorOutput:\\n    required = [\\\"id\\\", \\\"prompt\\\"]\\n    for field in required:\\n        if field not in raw:\\n            raise ValueError(f\\\"MissingRequiredField:{field}\\\")\\n\\n    # No default filling. No repair.\\n    value = {\\\"id\\\": raw[\\\"id\\\"], \\\"prompt\\\": raw[\\\"prompt\\\"]}\\n    return ConstructorOutput(\\n        value=value,\\n        constructor_id=\\\"prompt_record_constructor_v1\\\",\\n        input_hash=stable_hash(raw),\\n        value_hash=stable_hash(value),\\n        validation_certificate_ref=\\\"cert_prompt_record_schema_v1\\\",\\n    )\\n\"\n      }\n    },\n    \"forgetful_action\": {\n      \"source_file\": \"forgetful_action_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ForgetfulAction\",\n        \"role\": \"Lawful information forgetting with explicit loss ledger\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none; may support R classification after fixed-layer checker\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\",\n          \"Type\",\n          \"Witness\",\n          \"CertificateKernel\"\n        ],\n        \"forbidden_authority\": [\n          \"silent compression\",\n          \"hidden equivalence claim\",\n          \"undeclared information loss\",\n          \"terminalization\",\n          \"runtime mutation\",\n          \"engine execution\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"CertificateEnvelope\",\n          \"WitnessEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, or upgrade evidence authority. LLM output may propose ForgetfulAction candidates, loss ledgers, or contract edits, but those proposals are EvidenceOnly until checked by the declared ForgetfulAction, Witness, Certificate, Replay, and Evaluator boundaries.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is a CANDIDATE, not a fixed-layer operator. A ForgetfulAction lawfully forgets declared structure and emits explicit loss evidence. A checked forgetful result may support FactOnly loss claims only after loss verification, certificate binding, and replay checking. It may support later classification as R = residual projection only if the fixed-layer operator classifier/checker verifies deterministic TiePolicy, residual target, invariant preservation, discarded-information evidence, and replay support. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. ForgetfulAction lawfully forgets declared structure. ForgetfulAction emits explicit loss evidence. ForgetfulAction does not compress silently, claim equivalence, terminalize, mutate runtime state, or execute engine actions.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"representation / projection / forgetting candidate\",\n        \"signature\": \"RichStructure -> PoorerStructure\",\n        \"role\": \"lawfully forgets declared structure with explicit loss ledger\"\n      },\n      \"core_definition\": \"A ForgetfulAction maps a richer declared structure to a poorer declared structure by forgetting explicitly named fields, invariants, or structure.\\n\",\n      \"obligations\": {\n        \"must\": [\n          \"Forget structure lawfully\",\n          \"Issue a loss ledger and evidence sufficient for later certificate binding\",\n          \"Declare source and target schemas\",\n          \"Emit a loss ledger\",\n          \"Preserve declared surviving invariants\",\n          \"Record source and target hashes\",\n          \"Validate that target is a subset of source projection\"\n        ],\n        \"must_not\": [\n          \"Destroy structure without producing a cryptographic/traceable certificate of what was forgotten\",\n          \"Claim the source and target are equivalent\",\n          \"Hide non-recoverable loss\",\n          \"Act as a Projector unless registered under projector law\",\n          \"Act as a ReducerAction unless reduction law is separately declared\",\n          \"Act as an Adapter unless representation conversion is separately declared\"\n        ]\n      },\n      \"kernel_authority_matrix_note\": \"This contract does not duplicate the shared authority matrix. ForgetfulAction follows kernel_authority_matrix_contract.md and component_shared_boundary_contract.md. Component-specific authority here may narrow the shared matrix but MUST NOT exceed it.\\n\",\n      \"rust_types\": {\n        \"forgetful_request\": {\n          \"code\": \"pub struct ForgetfulRequest {\\n    pub request_id: ForgetfulRequestId,\\n    pub source_structure: StructureRef,\\n    pub target_structure: StructureRef,\\n    pub source_schema: SchemaRef,\\n    pub target_schema: SchemaRef,\\n    pub forgotten_fields: Vec<StructureField>,\\n    pub preserved_invariants: Vec<InvariantId>,\\n    pub source_replay_ref: Option<ReplayRef>,\\n    pub request_hash: Hash256,\\n}\\n\"\n        },\n        \"forgetful_result\": {\n          \"code\": \"pub struct ForgetfulResult {\\n    pub forgetful_action_id: ForgetfulActionId,\\n    pub forgetful_action_version: ComponentVersion,\\n    pub source_hash: Hash256,\\n    pub target_hash: Hash256,\\n    pub loss_ledger: LossLedger,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub result_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"checked_forgetful_result\": {\n          \"code\": \"pub struct CheckedForgetfulResult {\\n    pub result_ref: ForgetfulResultRef,\\n    pub loss_verification_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly\\n}\\n\"\n        },\n        \"loss_ledger\": {\n          \"code\": \"pub struct LossLedger {\\n    pub source_hash: Hash256,\\n    pub target_hash: Hash256,\\n    pub forgotten: Vec<LostStructure>,\\n    pub preserved: Vec<InvariantId>,\\n    pub non_recoverable: bool,\\n    pub ledger_hash: Hash256,\\n}\\n\",\n          \"note\": \"A checked forgetful result may become FactOnly only after loss verification, certificate binding, and replay checking.\"\n        },\n        \"forgetful_action_trait\": {\n          \"code\": \"pub trait ForgetfulAction {\\n    fn forgetful_action_id(&self) -> ForgetfulActionId;\\n    fn forgetful_action_version(&self) -> ComponentVersion;\\n\\n    fn forget(\\n        &self,\\n        request: ForgetfulRequest,\\n    ) -> Result<EvidenceEnvelope<ForgetfulResult>, ForgetfulError>;\\n}\\n\",\n          \"note\": \"EvidenceEnvelope MUST be imported from the canonical artifact taxonomy. This contract MUST NOT define a local EvidenceEnvelope type.\"\n        }\n      },\n      \"default_authority_effect\": \"AuthorityEffect::EvidenceOnly\",\n      \"compression_rule\": \"ForgetfulAction must never be used as compression unless the loss_certificate proves which invariants survived.\",\n      \"forgetful_vs_projector\": {\n        \"description\": \"ForgetfulAction is not automatically Projector. ForgetfulAction forgets declared structure. Projector projects to a declared quotient, subspace, support, or coordinate subset. If a ForgetfulAction induces a quotient, it MUST also satisfy projector_candidate_contract.md. If a ForgetfulAction induces a residual projection, it MUST declare a deterministic TiePolicy and satisfy the ResidualProjection contract. Without TiePolicy, it cannot support R classification.\\n\"\n      },\n      \"forbidden_tokens\": [\n        \"silent_compress\",\n        \"equivalent_after_forget\",\n        \"lossless\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute(\",\n        \"mutate_runtime\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_declare_effect_class\",\n        \"EncodingEvidence\"\n      ],\n      \"required_tests\": [\n        \"checked_forgetful_requires_loss_verification_certificate\",\n        \"forgetful_requires_loss_ledger\",\n        \"forgetful_requires_loss_evidence\",\n        \"forgetful_records_source_and_target_hash\",\n        \"forgetful_declares_preserved_invariants\",\n        \"forgetful_rejects_hidden_loss\",\n        \"forgetful_does_not_claim_equivalence\",\n        \"forgetful_output_defaults_to_evidence_only\",\n        \"checked_forgetful_may_be_factonly_after_verification\",\n        \"forgetful_does_not_emit_action_fact_envelope\",\n        \"same_forgetful_input_same_result_hash\",\n        \"forgetful_result_does_not_create_certificate\",\n        \"forgetful_checked_result_uses_certificate_boundary\",\n        \"forgetful_does_not_self_declare_effect_class_r\",\n        \"forgetful_induced_residual_requires_tie_policy\",\n        \"forgetful_does_not_emit_action_license\",\n        \"forgetful_does_not_authorize_transition\",\n        \"forgetful_does_not_execute\",\n        \"forgetful_evidence_envelope_is_canonical_import\"\n      ],\n      \"negative_capability_test_example\": {\n        \"python_code\": \"def test_forgetful_requires_loss_ledger():\\n    op = {\\\"source\\\": \\\"metric_space\\\", \\\"target\\\": \\\"topological_space\\\", \\\"loss_ledger\\\": None}\\n    with pytest.raises(ValueError):\\n        validate_forgetful_action(op)\\n\"\n      },\n      \"canonical_invariant\": \"ForgetfulAction is an EvidenceOnly action candidate that lawfully forgets declared structure with explicit loss ledger, preserved-invariant declarations, source/target hashes, and replayable evidence. It emits loss evidence, not equivalence, authority, license, action, or execution. Checked loss facts require a declared checking or certificate boundary. If it induces residual projection, R classification requires the fixed-layer checker and deterministic TiePolicy. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes; Trace records; MetaLift changes carrier/schema expressivity only through license.\\n\"\n    },\n    \"lambda_action_candidate\": {\n      \"source_file\": \"lambda_action_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"LambdaActionCandidate\",\n        \"role\": \"Pure local endomorphism proposing same-carrier transformation\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"DecisionEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"This contract is a governance artifact. LLM-generated content carries no authority within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is an ACTION CANDIDATE, not a fixed-layer operator. A LambdaAction may generate proposals for E (exact repair) or I (quotient isometry) effects. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. LambdaAction outputs are EvidenceOnly by default. A raw LambdaOutput is EvidenceOnly.\\nA checked LambdaOutput may become FactOnly only for checked structural claims.\\nIf admissibility judgment is needed, consumers may route the checked output to Evaluator. LambdaAction itself does not emit RequiresEvaluator.\\n\",\n      \"core_definition\": \"A LambdaAction is a pure local endomorphism over an admitted carrier. It is a deterministic, stateless, unary morphism that preserves declared structure and may declare claims about diagnostic constraints over its admitted domain, subject to evaluator verification. It performs no search, candidate exploration, ranking, orchestration, hidden lift, or repair.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"action candidate / deterministic transformation layer\",\n        \"not\": [\n          \"generator\",\n          \"search\",\n          \"evaluator\",\n          \"solver\",\n          \"policy\",\n          \"terminalizer\",\n          \"engine\",\n          \"pipeline\",\n          \"MetaLift\"\n        ]\n      },\n      \"internal_descent_requirements\": [\n        \"Must not enlarge the carrier\",\n        \"Must not silently reinterpret the carrier\",\n        \"Must return typed failure rather than hide a lift\",\n        \"Must not change carrier rank, universe, or admissible execution geometry\"\n      ],\n      \"rust_types\": {\n        \"lambda_action_trait_current\": {\n          \"description\": \"Current working implementation (operators/lambdas/mod.rs)\",\n          \"code\": \"pub trait LambdaAction<S: BaseType, T: BaseType>: Send + Sync {\\n    fn name(&self) -> &'static str;\\n    fn apply(&self, input: &S) -> Result<T, LambdaFailure>;\\n    fn preserved_structure(&self) -> Vec<PreservedStructure>;\\n    fn law_declaration(&self) -> LawDeclarationId;\\n}\\n\\npub enum PreservedStructure {\\n    Topology,\\n    Cohomology,\\n    Typing,\\n    QuotientClass,\\n    GaugeClass,\\n}\\n\\npub struct DeclaredLaw {\\n    pub law_id: LawId,\\n    pub expected_behavior: ExpectedBehavior,\\n}\\n\",\n          \"note\": \"This is the active definition. All 53 lambda implementations use NemotronValue as both input and output (endomorphic). Law witnesses are self-reported booleans. These booleans are declarations only; the Evaluator must verify the actual before/after diagnostics. The runtime law is: declared law != accepted law.\\n\"\n        },\n        \"lambda_action_trait_deprecated\": {\n          \"description\": \"Deprecated contract-layer definition\",\n          \"code\": \"pub trait LambdaAction<S: BaseType, T: BaseType>: ComponentIdentity {\\n    fn apply(&self, input: &S) -> Result<T, LambdaFailure>;\\n    fn law(&self) -> &'static LambdaLaw;\\n}\\n\",\n          \"note\": \"This generic S -> T shape with ComponentIdentity and LambdaLaw is the design target but is not used by any implementation.\"\n        },\n        \"lambda_action_trait_migration_target\": {\n          \"description\": \"Migration target (base_contracts)\",\n          \"code\": \"pub trait LambdaAction<S: BaseType, T: BaseType>: BoundContract {\\n    fn apply(&self, input: &S) -> Result<T, LambdaFailure>;\\n    fn law(&self) -> &'static LambdaLaw;\\n}\\n\"\n        },\n        \"lambda_failure\": {\n          \"code\": \"pub enum LambdaFailure {\\n    OutsideAdmissibleDomain(AdmissibleDomainCertificate),\\n    InvariantViolation { invariant: InvariantId },\\n    UndefinedTransformation { reason: &'static str },\\n    NonFiniteInput,\\n}\\n\"\n        }\n      },\n      \"algebraic_contract\": {\n        \"declared_law\": \"Phi(apply(s)) <= Phi(s)\",\n        \"note\": \"This is a declaration by the LambdaAction. It is not accepted until verified by the Evaluator layer.\",\n        \"admissible_noise_gating\": \"Where numerical precision is an issue, action candidates must provide a Typed Admissible Numerical Tolerance Certificate rather than using naked floating-point epsilon. Replay equivalence must be hardware-independent via exact symbolic regime comparison.\\n\",\n        \"composability\": \"LambdaActions compose when the codomain of one matches the admitted domain of the next. Since the current implementation is endomorphic (NemotronValue -> NemotronValue), all lambdas are naively composable. The codensity.rs and transport.rs modules in operators/ provide the algebraic infrastructure for lawful composition.\\n\",\n        \"composition_example\": \"f: NemotronValue -> NemotronValue\\ng: NemotronValue -> NemotronValue\\ng . f: NemotronValue -> NemotronValue (lawful if both are structure-preserving)\\n\",\n        \"forbidden\": \"candidate-space search, adaptive traversal, convergence-driven exploration, ranking, runtime orchestration, hidden normalization, hidden carrier extension, policy branching, terminal action\",\n        \"allowed\": \"finite deterministic traversal over input structure, fixed-iteration algebraic computation\",\n        \"static_bound_rule\": \"Action candidate branching factor must be statically bounded, and the execution path must be independent of evaluation outcomes.\"\n      },\n      \"evaluation_integration\": {\n        \"description\": \"Lambda steps produce EvaluationDiagnostics snapshots that the evaluator bridge checks\",\n        \"check\": \"evaluator_accepts(before, after, r_cl_max)\",\n        \"note\": \"The Phi non-increase claim is enforced structurally: the evaluator rejects any step where after.phi > before.phi.\"\n      },\n      \"witness_integration\": {\n        \"description\": \"When a LambdaAction is applied within a traced execution\",\n        \"records\": [\n          \"Exactly one attempt per step\",\n          \"State hash before and after application\",\n          \"The LambdaAction's component identity in the ReplayLedger payload\"\n        ],\n        \"note\": \"If a LambdaAction internally retries or branches, the witness will fail with NonDeterministicReplay.\"\n      },\n      \"required_tests\": {\n        \"action_purity\": [\n          \"lambda_has_single_execution_path\",\n          \"lambda_has_no_retry_logic\",\n          \"lambda_has_no_hidden_cache\",\n          \"lambda_has_no_candidate_generation\"\n        ],\n        \"replay\": [\n          \"same_input_same_output_hash\",\n          \"same_input_same_trace\",\n          \"no_branching_under_replay\"\n        ],\n        \"structural_preservation\": [\n          \"preserved_structure_declared\",\n          \"preserved_structure_verified_by_evaluator\"\n        ],\n        \"admissibility\": [\n          \"outside_domain_returns_typed_failure\",\n          \"invalid_carrier_rejected\"\n        ],\n        \"composition\": [\n          \"typed_composition_required\",\n          \"illegal_codomain_composition_rejected\"\n        ]\n      },\n      \"target_architecture\": {\n        \"kernels\": [\n          \"ActionKernel\",\n          \"ActionLawKernel\",\n          \"CompositionKernel\",\n          \"ReplayKernel\"\n        ],\n        \"note\": \"The action candidate itself remains a tiny deterministic bridge between states.\"\n      },\n      \"theorem_level_infrastructure\": [\n        \"ActionDeterminism\",\n        \"NoHiddenSearchInsideAction\",\n        \"ReplayDeterminism\",\n        \"TypedCompositionLaw\",\n        \"NoImplicitCarrierExtension\",\n        \"EvaluatorSeparatesDeclaredFromAcceptedLaw\",\n        \"AdmissibilityPreservation\"\n      ],\n      \"canonical_invariant\": \"LambdaAction bridges. ReducerAction deflates. TransformAction rearranges. Encoder encodes. Generator proposes. Constructor builds/intakes; Validator validates. Engine executes licensed transitions. Action candidates propose transformations; only Evaluators accept; only Engines execute; only MetaLift changes carrier expressivity. No action candidate is allowed to become an Engine in disguise.\\n\",\n      \"upgrade_v02\": {\n        \"declared_law_not_accepted_law\": {\n          \"description\": \"The current document correctly notes that law witnesses may be self-reported booleans and must be verified by the Evaluator. Make this mechanical.\\n\",\n          \"rust_code\": \"pub struct LambdaLawDeclaration {\\n    pub law_id: LawId,\\n    pub preserves: Vec<PreservedStructure>,\\n    pub phi_claim: PhiClaim,\\n    pub carrier_change: CarrierChange,\\n}\\n\\npub enum CarrierChange {\\n    SameCarrier,\\n    DeclaredHomomorphism { source: SchemaRef, target: SchemaRef },\\n    HiddenLiftDetected,\\n}\\n\\npub enum PhiClaim {\\n    NonIncreasing,\\n    Preserved,\\n    Unclaimed,\\n}\\n\"\n        },\n        \"lambda_output\": {\n          \"rust_code\": \"pub struct LambdaResult<T> {\\n    pub output: T,\\n    pub law_declaration: LambdaLawDeclaration,\\n    pub replay_witness: WitnessId,\\n    pub authority_effect: AuthorityEffect,\\n}\\n\",\n          \"note\": \"Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked lambda result may escalate to RequiresEvaluator or FactOnly depending on verification completeness.\"\n        },\n        \"python_poc\": \"def validate_lambda_no_hidden_lift(before_schema: str, after_schema: str, declared_target: str) -> None:\\n    if after_schema != declared_target:\\n        raise ValueError(\\\"HiddenLiftDetected: undeclared target schema.\\\")\\n    if before_schema != after_schema and declared_target == before_schema:\\n        raise ValueError(\\\"HiddenLiftDetected: carrier changed without declared target.\\\")\\n\"\n      }\n    },\n    \"normalizer_action_candidate\": {\n      \"source_file\": \"normalizer_action_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"NormalizerActionCandidate\",\n        \"role\": \"Canonical-form action mapping admitted state to declared normal form\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"effect_class_self_assignment\",\n          \"action_licensing\",\n          \"evaluator_acceptance\",\n          \"hidden_projection\",\n          \"hidden_carrier_change\",\n          \"hidden_semantic_loss\",\n          \"search\",\n          \"ranking\",\n          \"measurement_computation\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"CertificateEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, or upgrade evidence authority. LLM output may propose NormalizerAction candidates, NormalizerLaw descriptors, normal-form predicates, migration patches, or tests, but those proposals are EvidenceOnly until checked by the declared NormalizerAction, Replay, Certificate, Evaluator, and component-boundary checks.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is an ACTION CANDIDATE, not a fixed-layer operator. A NormalizerAction maps admitted state to its declared unique normal form. It may be treated as a strict subtype of ReducerAction only when uniqueness, idempotence, and termination are certified. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"canonical-form action candidate\",\n        \"signature\": \"S -> Canonical(S)\",\n        \"role\": \"maps admitted state to declared normal form\"\n      },\n      \"core_definition\": \"A NormalizerAction transforms an admitted state into its declared unique normal form. A NormalizerAction may be treated as a strict subtype of ReducerAction only when uniqueness, idempotence, termination, same-carrier preservation, and replay evidence are checked by the declared boundary. This subtype relation is a checked structural claim, not execution authority.\\n\",\n      \"obligations\": {\n        \"must\": [\n          \"Be strongly normalizing (always terminates at a unique normal form)\",\n          \"Be idempotent\",\n          \"Declare the normal-form predicate\",\n          \"Emit normal-form evidence\",\n          \"Preserve source semantics unless explicit projection loss is declared\"\n        ],\n        \"must_not\": [\n          \"Hallucinate normal forms that lose semantic meaning unless governed by a projection license\",\n          \"Hide projection or quotient loss\",\n          \"Repair malformed input\",\n          \"Act as an evaluator\",\n          \"Claim semantic equivalence without verification support\"\n        ]\n      },\n      \"same_carrier_law\": {\n        \"description\": \"NormalizerAction MUST preserve\",\n        \"preserves\": [\n          \"carrier identity\",\n          \"carrier type\",\n          \"carrier rank\",\n          \"schema reference\",\n          \"universe reference\",\n          \"coefficient semantics\",\n          \"carrier schema hash\",\n          \"admissible domain\"\n        ],\n        \"note\": \"Any schema change, carrier identity change, universe change, coefficient-domain change, projection loss, or expressivity expansion is not NormalizerAction unless separately governed by Adapter, Projector, ResidualProjection, or Lift.\\n\"\n      },\n      \"rust_types\": {\n        \"normal_form_evidence\": {\n          \"code\": \"pub struct NormalFormEvidence {\\n    pub normalizer_id: NormalizerId,\\n    pub source_schema: SchemaRef,\\n    pub normal_form_schema: SchemaRef,\\n    pub uniqueness_witness_ref: WitnessId,\\n    pub idempotence_witness_ref: WitnessId,\\n    pub termination_argument_ref: TerminationArgumentId,\\n    pub source_hash: Hash256,\\n    pub normal_form_hash: Hash256,\\n    pub normal_form_predicate: PredicateId,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"note\": \"If certification is required, CertificateKernel may seal a certificate over NormalFormEvidence. NormalizerAction itself does not create certificates.\"\n        },\n        \"normalizer_output\": {\n          \"code\": \"pub struct NormalizerOutput<S> {\\n    pub normalizer_id: NormalizerId,\\n    pub normalizer_version: ComponentVersion,\\n    pub input_hash: Hash256,\\n    pub output_hash: Hash256,\\n    pub carrier_ref: CarrierRef,\\n    pub normal_form_evidence: NormalFormEvidence,\\n    pub output: S,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"normalizer_action_trait\": {\n          \"code\": \"pub trait NormalizerAction<S: BaseType>: BoundContract {\\n    fn propose_normal_form(\\n        &self,\\n        input: &S,\\n    ) -> Result<EvidenceEnvelope<NormalizerOutput<S>>, NormalizerError>;\\n\\n    fn normalizer_law(&self) -> &'static NormalizerLaw;\\n}\\n\",\n          \"note\": \"Avoid is_normal_form(&self, input) -> bool as a contract method. That is a local validator/evaluator-style claim. Use a declared predicate reference instead.\"\n        },\n        \"checked_normalizer_output\": {\n          \"code\": \"pub struct CheckedNormalizerOutput {\\n    pub output_ref: NormalizerOutputRef,\\n    pub uniqueness_certificate: CertificateId,\\n    pub idempotence_certificate: CertificateId,\\n    pub termination_certificate: CertificateId,\\n    pub normal_form_predicate_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly for checked structural claims\\n}\\n\",\n          \"note\": \"A raw NormalizerOutput is EvidenceOnly. A checked NormalizerOutput may become FactOnly only for the claim that the output satisfies declared normal-form, uniqueness, idempotence, termination, and replay requirements. NormalizerAction itself does not emit RequiresEvaluator. If later admissibility judgment is required, consumers may route the checked output to an Evaluator.\\n\"\n        }\n      },\n      \"default_authority_effect\": \"AuthorityEffect::EvidenceOnly\",\n      \"checked_authority_note\": \"A checked normalizer result may become FactOnly for checked structural claims. It does not become RequiresEvaluator merely by being checked.\\n\",\n      \"forbidden_tokens\": [\n        \"NormalFormEvidence\",\n        \"ActionFactEnvelope\",\n        \"OperatorFactEnvelope\",\n        \"NormalizerOp\",\n        \"self_declare_effect_class\",\n        \"emit_action\",\n        \"emit_action_license\",\n        \"execute_transition\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_runtime\",\n        \"hidden_projection\",\n        \"hidden_lift\"\n      ],\n      \"required_tests\": [\n        \"normalizer_output_defaults_to_evidence_only\",\n        \"normalizer_produces_normal_form_evidence_not_certificate\",\n        \"checked_normalizer_output_may_be_factonly_after_uniqueness_idempotence_termination_and_replay_checks\",\n        \"normalizer_does_not_emit_requires_evaluator_by_default\",\n        \"normalizer_does_not_create_certificates\",\n        \"normalizer_does_not_emit_action_license\",\n        \"normalizer_does_not_authorize_transition\",\n        \"normalizer_does_not_execute\",\n        \"normalizer_does_not_self_declare_effect_class\",\n        \"normalizer_preserves_schema_ref\",\n        \"normalizer_preserves_universe_ref\",\n        \"normalizer_preserves_coefficient_semantics\",\n        \"normalizer_rejects_hidden_projection_loss\",\n        \"normalizer_rejects_hidden_carrier_change\",\n        \"normalizer_is_reducer_subtype_only_after_checked_laws\"\n      ],\n      \"canonical_invariant\": \"NormalizerAction is an EvidenceOnly same-carrier action candidate. It proposes a deterministic mapping to a declared normal form under explicit normal-form predicate, uniqueness, idempotence, termination, and replay evidence. It does not certify, validate, evaluate, license, authorize, mutate, execute, hide projection loss, or change carrier/schema expressivity. Checked normalizer facts require a declared checking or certificate boundary. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift changes carrier/schema expressivity only through license.\\n\",\n      \"upgrade_v02\": {\n        \"normal_form_evidence\": {\n          \"description\": \"A NormalizerAction is a strict subtype of ReducerAction only when it proves unique normal form and idempotence\"\n        },\n        \"normalizer_action_trait\": {\n          \"description\": \"NormalizerAction trait with explicit EvidenceEnvelope wrapping\"\n        },\n        \"checked_wrapper\": {\n          \"description\": \"CheckedNormalizerOutput with full certificate suite for uniqueness, idempotence, termination, and normal-form predicate\"\n        },\n        \"python_poc\": \"def assert_normalizer_laws(normalizer, value):\\n    n1 = normalizer.propose_normal_form(value)\\n    assert getattr(n1, \\\"authority_effect\\\", \\\"EvidenceOnly\\\") == \\\"EvidenceOnly\\\"\\n    n2 = normalizer.propose_normal_form(n1.output if hasattr(n1, \\\"output\\\") else n1)\\n    assert n1.output == n2.output, \\\"Normalizer must be idempotent.\\\"\\n\\ndef assert_checked_normalizer_result(checked):\\n    assert checked.authority_effect == \\\"FactOnly\\\"\\n    assert checked.uniqueness_certificate is not None\\n    assert checked.idempotence_certificate is not None\\n    assert checked.termination_certificate is not None\\n\"\n      }\n    },\n    \"projector_candidate\": {\n      \"source_file\": \"projector_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ProjectorCandidate\",\n        \"role\": \"Lawful forgetting via projection onto declared subspace or quotient\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"equivalence_claim\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"CertificateEnvelope\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"This contract is a governance artifact. LLM-generated content carries no authority within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is a CANDIDATE, not a fixed-layer operator. A Projector explicitly maps a rich structure into a declared quotient, subspace, support, or substructure. It is a candidate for lawful forgetting, not a certified authority. The Evaluator judges admissibility.\\n\",\n      \"core_definition\": \"A Projector explicitly maps a rich structure into a declared quotient, subspace, support, or substructure.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"projection / lawful forgetting candidate\",\n        \"signature\": \"S -> Substructure(S) | Quotient(S)\",\n        \"role\": \"projects onto declared subspace, quotient, basis, support, or coordinate subset with explicit loss\"\n      },\n      \"obligations\": {\n        \"must\": [\n          \"Declare projection target\",\n          \"Declare kernel declaration\",\n          \"Emit loss ledger\",\n          \"Declare quotient impact\",\n          \"Reference source and target schemas\"\n        ],\n        \"must_not\": [\n          \"Hide information loss\",\n          \"Pretend projection is equivalence\",\n          \"Use projection as acceptance\",\n          \"Act as an evaluator\",\n          \"Treat quotient equality as source equality\",\n          \"Erase quotient-relevant information without explicit loss\"\n        ]\n      },\n      \"rust_types\": {\n        \"projection_certificate\": {\n          \"code\": \"pub struct ProjectionCertificate {\\n    pub projector_id: ProjectorId,\\n    pub source_schema: SchemaRef,\\n    pub target_schema: SchemaRef,\\n    pub projection_target: ProjectionTarget,\\n    pub kernel_declaration: KernelDeclaration,\\n    pub loss_ledger: LossLedger,\\n    pub quotient_impact: QuotientImpact,\\n    pub source_hash: Hash256,\\n    pub projected_hash: Hash256,\\n    pub authority_effect: AuthorityEffect,\\n}\\n\\npub enum ProjectionTarget {\\n    Subspace(BasisId),\\n    Quotient(EquivalenceRef),\\n    Support(SupportRef),\\n    CoordinateSubset(Vec<CoordinateId>),\\n    NormalForm(NormalFormId),\\n}\\n\",\n          \"note\": \"Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked projector result may become RequiresEvaluator or FactOnly after projection target verification, kernel checking, loss ledger validation, and quotient impact assessment.\"\n        },\n        \"projector_trait\": {\n          \"code\": \"pub trait Projector<S, P> {\\n    fn project(\\n        &self,\\n        input: &S,\\n    ) -> Result<EvidenceEnvelope<(P, ProjectionCertificate)>, ProjectorError>;\\n}\\n\"\n        }\n      },\n      \"forbidden_tokens\": [],\n      \"required_tests\": [],\n      \"canonical_invariant\": \"Projector projects with explicit loss. It never pretends projection is equivalence. Candidates propose transformations; only Evaluators accept; only Engines execute; only MetaLift changes carrier expressivity.\\n\",\n      \"upgrade_v02\": {\n        \"projection_certificate\": {\n          \"description\": \"Projection is lawful forgetting. It must never pretend lossless equivalence.\"\n        },\n        \"python_poc\": \"def validate_projection_certificate(cert: dict) -> None:\\n    for required in [\\n        \\\"projection_target\\\",\\n        \\\"kernel_declaration\\\",\\n        \\\"loss_ledger\\\",\\n        \\\"quotient_impact\\\",\\n        \\\"source_schema\\\",\\n        \\\"target_schema\\\",\\n        \\\"source_hash\\\",\\n        \\\"projected_hash\\\",\\n    ]:\\n        if required not in cert:\\n            raise ValueError(f\\\"Projection missing {required}\\\")\\n    if cert[\\\"quotient_impact\\\"] == \\\"Collapsed\\\" and not cert.get(\\\"loss_ledger\\\"):\\n        raise ValueError(\\\"Quotient collapse requires explicit loss ledger.\\\")\\n\"\n      }\n    },\n    \"proposal_generator\": {\n      \"source_file\": \"proposal_generator_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ProposalGenerator\",\n        \"role\": \"Pure proposal morphism producing detached candidate states with transition metadata\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"evaluation\",\n          \"ranking\",\n          \"scoring\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\",\n        \"doctrine_5_reference\": \"Doctrine 5 (Action/Candidate/Boundary Classification) governs this contract. Generators are candidates that produce sub-candidates.\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, rank candidates, schedule search, or upgrade evidence authority. LLM output may propose Generator implementations, candidate schemas, generation rules, or tests, but those proposals are EvidenceOnly until checked by the declared Generator, Search, Replay, and component-boundary checks.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"Generator is a CANDIDATE, not a fixed-layer operator. A Generator applies domain-specific transformation schemas to produce detached candidate states. It does not evaluate, schedule, or execute. The Evaluator may judge candidate admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\\n\",\n      \"core_definition\": \"A Generator is a pure proposal morphism. It is a mechanism that applies domain-specific transformation schemas to an immutable input state and returns detached candidate states with transition metadata. Generators propose transitions. They do not evaluate, schedule, or execute them.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"proposal kernel / candidate synthesis layer\",\n        \"not\": [\n          \"evaluator\",\n          \"search kernel\",\n          \"solver\",\n          \"policy\",\n          \"terminalizer\",\n          \"engine\",\n          \"pipeline\"\n        ]\n      },\n      \"architectural_distinction\": {\n        \"Generator\": \"proposes transitions\",\n        \"Evaluator\": \"accepts/rejects transitions\",\n        \"SearchKernel\": \"orders, bounds, or explores candidate proposals under declared search policy\",\n        \"Engine\": \"executes transitions\"\n      },\n      \"tower_placement\": {\n        \"description\": \"Generators sit at the proposal layer, below Engines (which orchestrate) and the Evaluator (which accepts/rejects). They produce raw material for the search pipeline.\\n\",\n        \"flow\": \"Generator\\n-> detached Candidate artifacts\\n-> SearchKernel / Search policy\\n-> Evaluator\\n-> Terminalizer / LicensingBoundary\\n-> Engine\\n-> Trace\\n\"\n      },\n      \"actual_trait_shape\": {\n        \"note\": \"There is no unified Generator trait in the working codebase. Generators are implemented as standalone functions or structs with ad-hoc generate() methods. The contract-layer definition exists only in this document.\\n\"\n      },\n      \"rust_types\": {\n        \"proposal_generator_trait\": {\n          \"description\": \"Historical design target\",\n          \"code\": \"pub trait ProposalGenerator<State, Metadata> {\\n    fn propose(\\n        &self,\\n        state: &State,\\n        ctx: &GeneratorContext,\\n    ) -> Result<Vec<Candidate<State, Metadata>>, GeneratorError>;\\n}\\n\\npub struct GeneratorContext {\\n    pub grammar_ref: GrammarId,\\n    pub admissible_components: Vec<ComponentId>,\\n    pub deterministic_seed: Option<u64>,\\n    pub branch_limit: Option<usize>,\\n    pub proposal_depth_bound: Option<usize>,\\n    pub context_hash: Hash256,\\n}\\n\",\n          \"note\": \"generate is accepted as a legacy implementation name. Contract-canonical APIs should use propose to emphasize detached candidate creation rather than search or execution. GeneratorContext is configuration evidence only. It MUST NOT contain evaluator metrics, policy verdicts, live Engine handles, terminal outcomes, or raw cohomological measurements.\\n\"\n        },\n        \"candidate\": {\n          \"code\": \"pub struct Candidate<State, Metadata> {\\n    pub candidate_id: CandidateId,\\n    pub source_state_hash: Hash256,\\n    pub proposed_state: State,\\n    pub component_id: ComponentId,\\n    pub metadata: Metadata,\\n    pub proposal_evidence: ProposalEvidence,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"actual_patterns\": {\n          \"pattern_a\": \"pub fn generate(input: &NemotronValue) -> Vec<NemotronValue> { ... }\\n\",\n          \"pattern_b\": \"pub struct GraphTopologyGenerator;\\nimpl GraphTopologyGenerator {\\n    pub fn generate(&self, graph: &FiniteDirectedGraph) -> Vec<FiniteDirectedGraph> { ... }\\n}\\n\"\n        },\n        \"proposal_evidence\": {\n          \"code\": \"pub struct ProposalEvidence {\\n    pub generator_id: GeneratorId,\\n    pub generation_rule: RuleId,\\n    pub deterministic_seed: Option<u64>,\\n    pub enumeration_policy: EnumerationPolicy,\\n    pub branch_index: usize,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"note\": \"If certification is required, CertificateKernel may seal a certificate over ProposalEvidence. Generator itself does not create certificates.\"\n        },\n        \"generator_error\": {\n          \"code\": \"pub enum GeneratorError {\\n    InvalidDomain(String),\\n    DimensionMismatch { expected: usize, got: usize },\\n    UndefinedOperation(String),\\n    NonFiniteInput,\\n    InternalInvariantViolation(String),\\n    GenerationLimitExceeded,\\n}\\n\"\n        }\n      },\n      \"rules\": {\n        \"blind_proposal_generation\": {\n          \"section_number\": 1,\n          \"description\": \"A Generator MUST apply a specific transformation rule to an immutable input state.\",\n          \"may_return\": [\n            \"zero candidates (defined but no applicable transitions)\",\n            \"one or more candidates\",\n            \"a typed error (input violated generator's domain)\"\n          ]\n        },\n        \"zero_evaluation\": {\n          \"section_number\": 2,\n          \"description\": \"Generators MUST NOT: score, rank, accept, reject, prune for quality, compare by expected usefulness, inspect evaluator metrics, or call functionals/observables for decision-making.\",\n          \"forbidden_fields\": \"score, fitness, quality, rank, accepted, rejected, should_keep, confidence, priority\",\n          \"allowed_fields\": \"component_id, source_state_id, parameters, preconditions, postconditions, semantic_tags\",\n          \"strict_metadata_rule\": \"semantic_tags must be descriptive only. They must not encode ranking hints or hidden evaluation metrics.\"\n        },\n        \"pure_state_immutability\": {\n          \"section_number\": 3,\n          \"description\": \"Generators MUST receive state by immutable reference and return new owned candidates.\"\n        },\n        \"mandatory_transition_metadata\": {\n          \"section_number\": 4,\n          \"description\": \"Every candidate MUST contain TransitionMetadata identifying the component, source, parameters, and pre/postconditions.\"\n        },\n        \"no_measurement_access\": {\n          \"section_number\": 5,\n          \"description\": \"Generator MUST NOT compute, read, or reconstruct canonical Phi1, Gamma2, Xi, quotient mass, closure defect, closure regime, cohomological status, evaluator scores, policy scores, or terminal outcomes. If generation needs bounded structural context, it may consume opaque non-semantic configuration or grammar refs only.\\n\"\n        }\n      },\n      \"search_coupling\": {\n        \"description\": \"The SearchCatalog aggregates multiple generators. However, the catalog's implementation is currently underdefined and risks hiding search policy.\\n\",\n        \"missing_subsystem\": \"The Generator subsystem must delegate all scheduling, breadth control, and exploration bias to a formal SearchKernel. Current Search logic leaks across Generator (proposing too many/few candidates), Engine (deciding which path to take), and SearchCatalog (ordering generators). Without a dedicated SearchKernel contract, search remains ambient behavior rather than a governed subsystem.\\n\"\n      },\n      \"trace_integration\": {\n        \"description\": \"When generators produce candidates within a traced execution\",\n        \"rules\": [\n          \"Only candidates selected by SearchKernel and accepted by Evaluator may become TraceGraph edges\",\n          \"Each accepted transition is recorded in the ReplayLedger with a payload hash\",\n          \"The generator's component identity is preserved for auditability\",\n          \"Non-selected or refused candidates do not become state-transition edges. They may be recorded as proposal/evaluation evidence when required by audit policy.\"\n        ],\n        \"flow\": \"Generator.propose(state) -> Candidate artifacts\\n  -> SearchKernel orders/bounds proposals\\n  -> Evaluator judges candidate evidence\\n  -> LicensingBoundary emits ActionLicense when permitted\\n  -> Engine executes licensed transition\\n  -> Trace records executed action and relevant proposal/evaluation/license refs\\n\"\n      },\n      \"evaluation_integration\": \"Generators do not directly interact with the evaluation layer. Evaluator may consume detached Candidate artifacts and checked proposal evidence through declared interfaces. Generator MUST NOT call evaluator functions, inspect evaluator metrics, encode acceptance hints, or emit accepted/rejected fields.\\n\",\n      \"bounded_description_complexity\": {\n        \"description\": \"Generators are bounded transformation systems acting over an existing grammar and carrier.\\n\",\n        \"synthesis_modes\": [\n          \"LLM-mediated synthesis: Proposes new generator implementations (external to Generator semantics)\",\n          \"Solver-mediated synthesis: Evolves generator parameters\",\n          \"Complexity Reduction: A generator that produces candidates with lower description complexity under a declared encoding contributes to the system's compression objective\"\n        ],\n        \"warning\": \"Kolmogorov complexity is not computable. Self-compression must be operationalized as bounded description complexity or compression heuristics, and must never reintroduce hidden evaluation inside the generator. Generators remain epistemically blind to the productivity of their output. Bounded description complexity may be recorded as descriptive proposal metadata only if computed by a declared non-governance encoding rule and not used by Generator to rank, prune, accept, or reject candidates. Any compression objective used for selection belongs to Search/Evaluator/Policy, not Generator.\\n\"\n      },\n      \"generator_governance\": {\n        \"description\": \"To prevent search explosion, Generators must receive externally declared bounds\",\n        \"bounds\": [\n          \"GeneratorBudget: CPU/Memory limits\",\n          \"GeneratorBranchLimit: Max candidates per state\",\n          \"ProposalDepthBound: Max recursive generation depth\"\n        ],\n        \"note\": \"SearchKernel owns scheduling, exploration bias, and global budget policy.\"\n      },\n      \"reclassification_warning\": {\n        \"description\": \"Several listed files may not be valid ProposalGenerator implementations under this contract\",\n        \"files\": [\n          {\n            \"file\": \"operator_evolution_generator.rs\",\n            \"concern\": \"must not evolve operator authority or self-classify effect classes\"\n          },\n          {\n            \"file\": \"immune_projector.rs\",\n            \"concern\": \"likely Projector / ResidualProjection candidate if it performs projection\"\n          },\n          {\n            \"file\": \"semantic_dag_planner.rs\",\n            \"concern\": \"likely SearchKernel / Planner, not blind Generator, if it orders or plans by goal\"\n          },\n          {\n            \"file\": \"critical_graph_lift_generator.rs\",\n            \"concern\": \"LiftRequest generator only; must not license or justify lift\"\n          },\n          {\n            \"file\": \"vertex_flip_history.rs\",\n            \"concern\": \"Trace/History evidence or generator depending behavior\"\n          },\n          {\n            \"file\": \"dirichlet_arm_proposal.rs\",\n            \"concern\": \"may be Search policy / stochastic proposal; requires deterministic seed and no reward/priority semantics\"\n          }\n        ],\n        \"note\": \"Before registry admission, every generator file must be classified as ProposalGenerator, SearchKernel, Solver, Projector, LiftRequestGenerator, Trace/History evidence, or forbidden.\"\n      },\n      \"forbidden_tokens\": [\n        \"ProposalEvidence\",\n        \"score\",\n        \"fitness\",\n        \"quality\",\n        \"rank\",\n        \"accepted\",\n        \"rejected\",\n        \"should_keep\",\n        \"confidence\",\n        \"priority\",\n        \"reward\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"evaluate_candidate\",\n        \"evaluator_step\",\n        \"eeda_accepts\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"read_measurement\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"execute_transition\",\n        \"terminalize(\",\n        \"execute(\",\n        \"mutate_runtime\",\n        \"self_certify\",\n        \"self_declare_effect_class\"\n      ],\n      \"required_tests\": {\n        \"purity\": [\n          \"generator_does_not_mutate_input\",\n          \"generator_has_no_runtime_state\",\n          \"generator_has_no_hidden_cache\"\n        ],\n        \"evaluation_isolation\": [\n          \"generator_cannot_access_phi\",\n          \"generator_cannot_rank_candidates\",\n          \"generator_cannot_emit_confidence\"\n        ],\n        \"search_separation\": [\n          \"search_orders_candidates_not_generator\",\n          \"catalog_contains_no_evaluation_logic\"\n        ],\n        \"metadata_integrity\": [\n          \"candidate_contains_transition_metadata\",\n          \"candidate_preserves_component_identity\"\n        ],\n        \"determinism\": [\n          \"deterministic_sampling_replayable\",\n          \"same_seed_same_candidates\"\n        ],\n        \"governance_and_boundary\": [\n          \"generator_candidates_default_to_evidence_only\",\n          \"generator_produces_proposal_evidence_not_certificate\",\n          \"generator_does_not_create_certificates\",\n          \"generator_context_contains_no_evaluator_metrics\",\n          \"generator_context_contains_no_engine_handles\",\n          \"generator_context_contains_no_terminal_outcomes\",\n          \"generator_does_not_read_canonical_measurements\",\n          \"generator_does_not_call_evaluator_step\",\n          \"generator_does_not_emit_action_license\",\n          \"generator_does_not_authorize_transition\",\n          \"generator_does_not_execute\",\n          \"generator_does_not_self_declare_effect_class\",\n          \"legacy_generate_name_is_not_execution_or_search\",\n          \"searchkernel_orders_candidates_not_generator\",\n          \"proposal_certificate_name_forbidden\",\n          \"suspicious_generator_files_require_reclassification_before_admission\"\n        ]\n      },\n      \"best_future_architecture\": [\n        \"ProposalKernel (The Generator): transformation application\",\n        \"SearchKernel: Exploration scheduling and bias\",\n        \"EvaluationKernel: Acceptance judgment\",\n        \"ExecutionKernel: State updates and trace emission\",\n        \"MetaKernel: Congruence restoration and lift authority\"\n      ],\n      \"theorem_level_infrastructure\": [\n        \"NoEvaluationInsideGenerator\",\n        \"GeneratorPurity\",\n        \"ProposalReplayInvariant\",\n        \"ImmutableInputLaw\",\n        \"NoHiddenSchedulingInsideGenerator\",\n        \"ProposalMetadataCompleteness\",\n        \"SearchGeneratorSeparation\"\n      ],\n      \"canonical_invariant\": \"ProposalGenerator emits detached EvidenceOnly Candidate artifacts and ProposalEvidence under declared grammar, bounds, and deterministic replay context. It does not evaluate, score, rank, prune for quality, schedule execution, certify, validate, terminalize, license, authorize, mutate, read canonical measurements, or execute. SearchKernel orders or explores proposals; Evaluator judges; LicensingBoundary authorizes; Engine executes licensed transitions; Trace records.\\n\",\n      \"upgrade_v02\": {\n        \"candidate_shape\": {\n          \"description\": \"Candidates must be detached proposal objects with no score, verdict, or priority.\",\n          \"rust_code\": \"pub struct Candidate<State, Metadata> {\\n    pub candidate_id: CandidateId,\\n    pub source_state_hash: Hash256,\\n    pub proposed_state: State,\\n    pub component_id: ComponentId,\\n    pub metadata: Metadata,\\n    pub proposal_evidence: ProposalEvidence,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\\npub struct ProposalEvidence {\\n    pub generator_id: GeneratorId,\\n    pub generation_rule: RuleId,\\n    pub deterministic_seed: Option<u64>,\\n    pub enumeration_policy: EnumerationPolicy,\\n    pub branch_index: usize,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"note\": \"If certification is required, CertificateKernel may seal a certificate over ProposalEvidence. Generator itself does not create certificates. Default: authority_effect: AuthorityEffect::EvidenceOnly\"\n        },\n        \"forbidden_candidate_fields\": {\n          \"description\": \"Add a schema test forbidding these fields\",\n          \"fields\": \"score, fitness, quality, rank, accepted, rejected, should_keep, confidence, priority, reward\"\n        },\n        \"python_poc\": \"FORBIDDEN_CANDIDATE_KEYS = {\\n    \\\"score\\\", \\\"fitness\\\", \\\"quality\\\", \\\"rank\\\", \\\"accepted\\\", \\\"rejected\\\",\\n    \\\"should_keep\\\", \\\"confidence\\\", \\\"priority\\\", \\\"reward\\\",\\n}\\n\\n\\ndef validate_candidate_payload(candidate: dict) -> None:\\n    leaked = FORBIDDEN_CANDIDATE_KEYS.intersection(candidate.keys())\\n    if leaked:\\n        raise ValueError(f\\\"Generator leaked evaluation fields: {sorted(leaked)}\\\")\\n    for required in [\\\"candidate_id\\\", \\\"source_state_hash\\\", \\\"proposed_state\\\", \\\"component_id\\\", \\\"proposal_evidence\\\"]:\\n        if required not in candidate:\\n            raise ValueError(f\\\"Missing candidate field: {required}\\\")\\n\"\n      }\n    },\n    \"reducer_action_candidate\": {\n      \"source_file\": \"reducer_action_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ReducerActionCandidate\",\n        \"role\": \"Pure idempotent same-carrier deflation proposing structural reduction\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"effect_class_self_assignment\",\n          \"measurement_computation\",\n          \"evaluator_acceptance\",\n          \"action_licensing\",\n          \"hidden_carrier_change\",\n          \"search\",\n          \"ranking\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"FactEnvelope\",\n          \"DecisionEnvelope\"\n        ],\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, or upgrade evidence authority. LLM output may propose ReducerAction candidates, ReducerLaw descriptors, migration patches, or tests, but those proposals are EvidenceOnly until checked by the declared ReducerAction, Measurement, Replay, Evaluator, and component-boundary checks.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is an ACTION CANDIDATE, not a fixed-layer operator. A ReducerAction may produce evidence that later supports E = exact repair or R = residual projection classification. It MUST NOT self-declare E or R. Only the fixed-layer operator classifier/checker may classify an effect. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\\n\",\n      \"core_definition\": \"A ReducerAction is a pure, deterministic, unary, idempotent same-carrier action candidate S -> S that removes declared structural redundancy or normalizes admitted state without increasing the declared reduction measure.\\n\",\n      \"tower_placement\": \"A ReducerAction is same-carrier canonicalization inside internal repair. It may remove redundancy, project to canonical form, or collapse noise, but it may not add basis elements, vertices, dimensions, or carrier structure. If obstruction survives every admissible reducer, exhaustion has been reached on the current carrier. The next lawful move is explicit Meta lift, not a stronger reducer with hidden carrier growth.\\n\",\n      \"rust_types\": {\n        \"reducer_action_trait\": {\n          \"description\": \"Canonical contract shape\",\n          \"code\": \"pub trait ReducerAction<S: BaseType>: BoundContract {\\n    fn propose_reduction(\\n        &self,\\n        input: &S,\\n    ) -> Result<ReducerOutput<S>, ReducerFailure>;\\n\\n    fn law(&self) -> &'static ReducerLaw;\\n}\\n\",\n          \"note\": \"apply is a legacy implementation name. Contract-canonical APIs should use propose_reduction to avoid implying execution authority.\"\n        },\n        \"reducer_output\": {\n          \"code\": \"pub struct ReducerOutput<S> {\\n    pub reducer_id: ComponentId,\\n    pub reducer_version: ComponentVersion,\\n    pub input_hash: Hash256,\\n    pub output_hash: Hash256,\\n    pub carrier_ref: CarrierRef,\\n    pub law_ref: LawId,\\n    pub kappa_measure_ref: MeasurementId,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n    pub output: S,\\n}\\n\\npub struct CheckedReducerOutput {\\n    pub output_ref: ReducerOutputRef,\\n    pub same_carrier_certificate: CertificateId,\\n    pub kappa_monotonicity_certificate: CertificateId,\\n    pub idempotence_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly for checked structural claims\\n}\\n\",\n          \"note\": \"A raw ReducerOutput is EvidenceOnly. A checked ReducerOutput may become FactOnly only for the claim that the reducer satisfied same-carrier, kappa-monotonicity, idempotence, and replay requirements. If later admissibility judgment is needed, consumers may route the checked output to an Evaluator. ReducerAction itself does not emit RequiresEvaluator unless a specific reducer contract explicitly owns that boundary.\\n\"\n        },\n        \"reducer_failure\": {\n          \"code\": \"pub enum ReducerFailure {\\n    OutsideAdmissibleDomain,\\n    InvariantViolation { invariant: InvariantId },\\n    ReductionUndefined { reason: &'static str },\\n    NonFiniteInput,\\n    InternalLoopForbidden,\\n    HiddenCarrierChange,\\n}\\n\"\n        }\n      },\n      \"existing_implementations\": [\n        {\n          \"file\": \"reducer.rs\",\n          \"status\": \"Active\",\n          \"kappa_measure\": \"--\",\n          \"description\": \"Base reducer infrastructure\"\n        },\n        {\n          \"file\": \"reducer_clip_dual.rs\",\n          \"status\": \"Active\",\n          \"kappa_measure\": \"Magnitude exceeding bounds\",\n          \"description\": \"Clips edge weights to declared bounds\"\n        },\n        {\n          \"file\": \"reducer_h1.rs\",\n          \"status\": \"Active\",\n          \"kappa_measure\": \"H1 cohomology rank\",\n          \"description\": \"Projects to H1-reduced representative\"\n        },\n        {\n          \"file\": \"reducer_partial_trace.rs\",\n          \"status\": \"Active\",\n          \"kappa_measure\": \"Subsystem dimension\",\n          \"description\": \"Traces out declared subsystem\"\n        },\n        {\n          \"file\": \"reducer_support_predicates.rs\",\n          \"status\": \"Active\",\n          \"kappa_measure\": \"Support cardinality\",\n          \"description\": \"Removes edges failing declared predicates\"\n        },\n        {\n          \"file\": \"reducer_l1_projector.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"L1 norm\",\n          \"description\": \"Projects to L1-minimal representative\"\n        },\n        {\n          \"file\": \"reducer_observables.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"Observable count\",\n          \"description\": \"Reduces to essential observable set\"\n        },\n        {\n          \"file\": \"reducer_series_truncate.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"Series length\",\n          \"description\": \"Truncates power series to finite order\"\n        },\n        {\n          \"file\": \"reducer_synthesis_generate.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"Synthesis complexity\",\n          \"description\": \"Generates reduced synthesis candidates\"\n        },\n        {\n          \"file\": \"reducer_threshold.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"Values below threshold\",\n          \"description\": \"Zero-out small values\"\n        },\n        {\n          \"file\": \"reducer_tqc_optimization.rs\",\n          \"status\": \"Disabled\",\n          \"kappa_measure\": \"TQC circuit depth\",\n          \"description\": \"Optimizes topological quantum circuits\"\n        }\n      ],\n      \"reclassification_warning\": {\n        \"description\": \"Some reducer files may require reclassification before admission\",\n        \"files\": [\n          {\n            \"file\": \"reducer_partial_trace.rs\",\n            \"concern\": \"likely ResidualProjection / explicit-loss projection, not ordinary same-carrier reducer unless the carrier identity and schema remain unchanged\"\n          },\n          {\n            \"file\": \"reducer_synthesis_generate.rs\",\n            \"concern\": \"Generator/Search, not ReducerAction\"\n          },\n          {\n            \"file\": \"reducer_tqc_optimization.rs\",\n            \"concern\": \"Solver/Optimizer or domain-specific computation, not ReducerAction unless bounded, deterministic, same-carrier, and non-search\"\n          },\n          {\n            \"file\": \"reducer_observables.rs\",\n            \"concern\": \"Measurement/Observable selection boundary, not ReducerAction unless it only reduces an already-declared same-carrier structure\"\n          },\n          {\n            \"file\": \"reducer_threshold.rs\",\n            \"concern\": \"may be ReducerAction only with declared kappa, deterministic threshold, invariant preservation, and replay evidence\"\n          }\n        ],\n        \"note\": \"Before registry admission, every reducer file must be classified as ReducerAction, ResidualProjection, Generator, Solver, Functional, Observable, or forbidden.\"\n      },\n      \"registry_admission_warning\": \"Implemented reducer does not equal admitted reducer. Only reducers explicitly admitted by the reducer registry count toward exhaustion, area-lock claims, or current-carrier closure.\\n\",\n      \"algebraic_contract\": {\n        \"declared_law\": \"kappa(R(s)) <= kappa(s)\",\n        \"note\": \"This declaration is not accepted until verified by the Evaluator layer. If R(s) = s, then s is reduced with respect to this ReducerAction's declared kappa.\",\n        \"constraints\": [\n          \"Unary & Endomorphic -- S -> S only\",\n          \"Pure & Deterministic -- no random side-effects\",\n          \"Idempotent -- propose_reduction(propose_reduction(x)) == Ok(propose_reduction(x))\",\n          \"Structure-Reducing -- kappa-monotone\",\n          \"Single Application -- repeated application until stability is Engine orchestration, not reducer semantics\",\n          \"No Hidden Normalization -- normalization belongs to NormalizerAction unless explicitly declared as part of the reducer law\",\n          \"No Hidden Carrier Change -- carrier type, rank, schema, and universe must remain unchanged\"\n        ],\n        \"preserves\": [\n          \"carrier identity\",\n          \"carrier type\",\n          \"carrier rank\",\n          \"schema reference\",\n          \"universe reference\",\n          \"coefficient semantics\",\n          \"carrier schema hash\",\n          \"admissible domain\"\n        ],\n        \"note_schema\": \"Any schema change, carrier identity change, universe change, coefficient-domain change, or expressivity expansion is not ReducerAction.\\n\",\n        \"engine_isolation_limit\": \"If a ReducerAction performs search, iterative convergence, ranking, or external IO, it is an Engine, not a reducer.\\n\"\n      },\n      \"measurement_evaluation_integration\": \"ReducerAction does not compute Phi1, Gamma2, Xi, quotient mass, closure defect, closure regime, cohomological status, or evaluation diagnostics. ReducerAction may reference a declared kappa_measure_ref produced by the Functional / Measurement boundary. Any monotonicity, non-increase, budget, acceptance, or admissibility claim is outside ReducerAction and must be verified by the declared Measurement, Replay, Evaluator, or Certificate boundary.\\n\",\n      \"witness_integration\": {\n        \"description\": \"When a ReducerAction proposal is executed by Engine through a licensed transition\",\n        \"records\": [\n          \"reducer output reference\",\n          \"state hash before and after\",\n          \"license reference, if execution occurred\",\n          \"replay binding\",\n          \"exactly one declared reduction proposal for the candidate step\"\n        ],\n        \"note\": \"If a reducer introduces hidden branching (attempting multiple reduction strategies internally), the witness will fail at NonDeterministicReplay.\"\n      },\n      \"forbidden_tokens\": [\n        \"ActionFactEnvelope\",\n        \"OperatorFactEnvelope\",\n        \"ReducerOp\",\n        \"self_declare_effect_class\",\n        \"emit_action\",\n        \"emit_action_license\",\n        \"execute_transition\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"evaluator_accepts\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_runtime\"\n      ],\n      \"required_tests\": [\n        \"reducer_output_defaults_to_evidence_only\",\n        \"checked_reducer_output_may_be_factonly_after_same_carrier_kappa_idempotence_and_replay_checks\",\n        \"reducer_does_not_emit_action_license\",\n        \"reducer_does_not_authorize_transition\",\n        \"reducer_does_not_execute\",\n        \"reducer_does_not_compute_measurements\",\n        \"reducer_does_not_call_evaluator_accepts\",\n        \"reducer_does_not_self_declare_effect_class_e_or_r\",\n        \"reducer_preserves_schema_ref\",\n        \"reducer_preserves_universe_ref\",\n        \"reducer_preserves_coefficient_semantics\",\n        \"legacy_apply_name_is_not_execution\",\n        \"disabled_or_legacy_reducer_files_require_reclassification_before_admission\",\n        \"synthesis_generate_reducer_reclassified_as_generator_or_forbidden\",\n        \"partial_trace_reducer_requires_residual_projection_contract_if_lossy\"\n      ],\n      \"canonical_invariant\": \"ReducerAction is an EvidenceOnly same-carrier action candidate. It proposes one deterministic, idempotent reduction step under a declared ReducerLaw and kappa measurement reference. It does not compute measurements, evaluate acceptance, search, rank, certify, license, authorize, mutate, or execute. Checked reducer facts require same-carrier, kappa-monotonicity, idempotence, law, and replay verification. LicensingBoundary authorizes execution when required; Engine executes licensed transitions only. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift changes carrier/schema expressivity only through license.\\n\",\n      \"upgrade_v02\": {\n        \"registry_admission_warning\": {\n          \"description\": \"The current registry returns an empty reducer set. Any theorem using reducers must be conditional on registry admission.\",\n          \"text\": \"Implemented reducer does not equal admitted reducer.\\nOnly admitted reducers count toward exhaustion or area-lock claims.\\n\"\n        },\n        \"reducer_law\": {\n          \"rust_code\": \"pub struct ReducerLaw {\\n    pub law_id: LawId,\\n    pub kappa_measure_ref: MeasurementId,\\n    pub same_carrier_required: bool,\\n    pub idempotence_required: bool,\\n    pub support_reduction_claim: SupportReductionClaim,\\n    pub invariant_refs: Vec<InvariantId>,\\n    pub replay_required: bool,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\\npub enum SupportReductionClaim {\\n    StrictlyReduces,\\n    NonIncreasing,\\n    CanonicalizesOnly,\\n}\\n\",\n          \"note\": \"Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked reducer result may become RequiresEvaluator or FactOnly after kappa-measure verification, idempotence checking, and replay verification.\"\n        },\n        \"no_internal_loop_rule\": \"ReducerAction applies once. Repeated application until stable belongs to Engine orchestration. A ReducerAction MUST perform one declared reduction step. Fixed-point iteration is Engine orchestration.\\n\",\n        \"python_poc\": \"def assert_reducer_idempotent(reducer, value):\\n    once = reducer.propose_reduction(value)\\n    twice = reducer.propose_reduction(once)\\n    assert once == twice, \\\"Reducer must be idempotent: R(R(x)) == R(x)\\\"\\n\"\n      }\n    },\n    \"reflector_candidate\": {\n      \"source_file\": \"reflector_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"ReflectorCandidate\",\n        \"role\": \"Quotation and reflection creating quote-level structure without execution\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\",\n          \"quote_execution\",\n          \"authority_inheritance_from_quoted_object\",\n          \"hidden_recursion\",\n          \"runtime_mutation\",\n          \"scheduling_quoted_content\",\n          \"decoding_without_declared_boundary\",\n          \"decoding_without_required_license\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"EvidenceEnvelope\",\n          \"FactEnvelope\",\n          \"WitnessEnvelope\",\n          \"CertificateEnvelope\",\n          \"ReplayReport\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, execute quoted objects, or upgrade evidence authority. LLM output may propose Reflector candidates, quote schemas, recursion guards, or tests, but those proposals are EvidenceOnly until checked by the declared Reflector, Schema, Replay, and Evaluator boundaries.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is a CANDIDATE, not a fixed-layer operator. A Reflector reifies the structure of a state into quote-level structure that can be inspected or reasoned about by later layers. It does not execute quoted objects. The Evaluator judges admissibility.\\n\",\n      \"core_definition\": \"A Reflector reifies the structure of a state into quote-level structure that can be inspected or reasoned about by later layers.\\n\",\n      \"subsystem_classification\": {\n        \"subsystem\": \"quotation / reflection candidate\",\n        \"signature\": \"S -> Quote(S) | Reflection(S)\",\n        \"role\": \"creates quote-level structure or internal representation without execution\"\n      },\n      \"obligations\": {\n        \"must\": [\n          \"Declare reflection scope\",\n          \"Declare quote schema\",\n          \"Declare source schema\",\n          \"Provide recursion guard\",\n          \"Provide execution-forbidden declaration\",\n          \"Provide decode boundary reference, if decoding is supported\",\n          \"Provide decode license reference, only if decode is attempted\"\n        ],\n        \"must_not\": [\n          \"Execute quoted objects\",\n          \"Grant authority\",\n          \"Create hidden recursion\",\n          \"Evaluate quoted content\",\n          \"Schedule quoted content\",\n          \"Mutate runtime state through reflection\",\n          \"Exceed declared quote depth\"\n        ]\n      },\n      \"quote_non_execution_law\": \"Quoted structure is inert. A quote may be inspected, hashed, replayed, decoded through a declared decode boundary, or evaluated by a later layer. A quote MUST NOT execute, schedule itself, authorize execution, mutate runtime state, or inherit the authority of the quoted object.\\n\",\n      \"no_authority_inheritance_law\": \"Reflecting an object does not copy that object's authority. A quoted ActionLicense is not an ActionLicense. A quoted Action is not an Action. A quoted DecisionEnvelope is not a live decision. A quoted certificate is quote evidence unless dereferenced and verified through the declared certificate boundary.\\n\",\n      \"rust_types\": {\n        \"reflection_evidence\": {\n          \"code\": \"pub struct ReflectionEvidence {\\n    pub reflector_id: ReflectorId,\\n    pub source_schema: SchemaRef,\\n    pub quote_schema: SchemaRef,\\n    pub reflection_scope: ReflectionScope,\\n    pub decode_boundary_ref: Option<DecodeBoundaryId>,\\n    pub decode_license_ref: Option<LicenseId>,\\n    pub recursion_guard: RecursionGuard,\\n    pub source_hash: Hash256,\\n    pub quote_hash: Hash256,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub evidence_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\",\n          \"note\": \"If certification is required, CertificateKernel may seal a certificate over ReflectionEvidence. Reflector itself does not create certificates.\"\n        },\n        \"recursion_guard\": {\n          \"code\": \"pub struct RecursionGuard {\\n    pub max_quote_depth: usize,\\n    pub execution_forbidden: bool,\\n    pub decode_forbidden_without_license: bool,\\n}\\n\",\n          \"note\": \"Default: authority_effect: AuthorityEffect::EvidenceOnly. A raw ReflectionOutput is EvidenceOnly. A checked reflection result may become FactOnly only for the claim that quote construction satisfied the declared quote schema, recursion guard, and replay requirements. If later interpretation or admissibility judgment is needed, consumers may route the checked result to an Evaluator. Reflector itself does not emit RequiresEvaluator unless a specific reflector contract explicitly owns that boundary.\\n\"\n        },\n        \"reflection_output\": {\n          \"code\": \"pub struct ReflectionOutput<Q> {\\n    pub quote: Q,\\n    pub evidence: ReflectionEvidence,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n}\\n\"\n        },\n        \"reflector_trait\": {\n          \"code\": \"pub trait Reflector<S, Q> {\\n    fn reflect(\\n        &self,\\n        input: &S,\\n    ) -> Result<EvidenceEnvelope<ReflectionOutput<Q>>, ReflectorError>;\\n}\\n\",\n          \"note\": \"EvidenceEnvelope MUST be imported from the canonical artifact taxonomy. This contract MUST NOT define a local EvidenceEnvelope type.\"\n        }\n      },\n      \"forbidden_tokens\": [\n        \"ReflectionEvidence\",\n        \"execute_quote\",\n        \"run_quote\",\n        \"eval_quote\",\n        \"schedule_quote\",\n        \"quote_authority\",\n        \"inherit_authority\",\n        \"copy_authority\",\n        \"ActionLicense\",\n        \"StateTransition\",\n        \"EngineDecision\",\n        \"PolicyDecision\",\n        \"TerminalEnvelope\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_runtime\",\n        \"self_certify\"\n      ],\n      \"required_tests\": [\n        \"reflector_output_defaults_to_evidence_only\",\n        \"checked_reflection_may_be_factonly_after_quote_schema_recursion_and_replay_checks\",\n        \"reflector_produces_reflection_evidence_not_certificate\",\n        \"reflector_does_not_execute_quote\",\n        \"reflector_does_not_schedule_quote\",\n        \"reflector_does_not_inherit_authority_from_quoted_object\",\n        \"quoted_action_license_is_not_live_action_license\",\n        \"quoted_action_is_not_live_action\",\n        \"quoted_decision_is_not_live_decision\",\n        \"reflector_requires_recursion_guard\",\n        \"reflector_rejects_quote_depth_overflow\",\n        \"reflector_decode_requires_declared_decode_boundary\",\n        \"reflector_decode_requires_license_when_required\",\n        \"reflector_does_not_emit_action_license\",\n        \"reflector_does_not_authorize_transition\"\n      ],\n      \"canonical_invariant\": \"Reflector is an EvidenceOnly quotation candidate. It creates inert quote-level structure under declared source schema, quote schema, recursion guard, and replay evidence. It does not certify, validate, decode without boundary, inherit authority from quoted objects, schedule quoted content, terminalize, authorize, mutate, or execute. Checked reflection facts require a declared checking or certificate boundary. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift changes carrier/schema expressivity only through license.\\n\",\n      \"upgrade_v02\": {\n        \"reflection_evidence\": {\n          \"description\": \"Reflection creates quote-level structure. It must not execute the quote.\"\n        },\n        \"reflector_trait\": {\n          \"description\": \"Reflector trait with explicit EvidenceEnvelope wrapping\"\n        },\n        \"recursion_guard\": {\n          \"description\": \"RecursionGuard struct with max_quote_depth, execution_forbidden, and decode_forbidden_without_license\"\n        },\n        \"python_poc\": \"def validate_reflection_output(reflection: dict) -> None:\\n    if reflection.get(\\\"executed\\\") is True:\\n        raise ValueError(\\\"Reflector may quote but must not execute quoted objects.\\\")\\n    if reflection.get(\\\"quote_depth\\\", 0) > reflection.get(\\\"max_quote_depth\\\", 1):\\n        raise ValueError(\\\"Reflection recursion guard violated.\\\")\\n    if reflection.get(\\\"authority_effect\\\") != \\\"EvidenceOnly\\\":\\n        raise ValueError(\\\"Reflector output must be EvidenceOnly before checking.\\\")\\n    if reflection.get(\\\"decode_attempted\\\") is True and not reflection.get(\\\"decode_license\\\"):\\n        raise ValueError(\\\"Reflector decode attempted without license.\\\")\\n\"\n      }\n    },\n    \"transform_action_candidate\": {\n      \"source_file\": \"transform_action_candidate_contract.md\",\n      \"frontmatter\": {\n        \"name\": \"TransformActionCandidate\",\n        \"role\": \"Deterministic same-carrier rearrangement proposing structural permutation\",\n        \"version\": \"2.0\",\n        \"classification\": \"candidate\",\n        \"effect_class\": \"none\",\n        \"authority_effect\": \"EvidenceOnly\",\n        \"depends_on\": [\n          \"ComponentSharedBoundary\",\n          \"FixedLayerOperatorAlgebra\"\n        ],\n        \"forbidden_authority\": [\n          \"certification\",\n          \"validation\",\n          \"terminalization\",\n          \"execution\",\n          \"authority_upgrade\"\n        ],\n        \"primary_output_family\": \"EvidenceEnvelope\",\n        \"referenced_output_families\": [\n          \"StructureArtifact\",\n          \"EvidenceEnvelope\",\n          \"FactEnvelope\",\n          \"WitnessEnvelope\",\n          \"CertificateEnvelope\",\n          \"ReplayReport\"\n        ],\n        \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n        \"doctrine_version\": \"2026-05\"\n      },\n      \"llm_boundary_law\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, or upgrade evidence authority. LLM output may propose TransformAction candidates, TransformLaw descriptors, migration patches, or tests, but those proposals are EvidenceOnly until checked by the declared TransformAction, Replay, Evaluator, and component-boundary checks.\\n\",\n      \"inherits\": \"component_shared_boundary_contract.md\",\n      \"classification_statement\": \"This is an ACTION CANDIDATE, not a fixed-layer operator. A TransformAction rearranges structure within the same carrier. It makes no default Phi monotonicity claim. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\\n\",\n      \"status_warning\": \"STATUS: DISABLED. The operators/transforms/ module is currently commented out in operators/mod.rs (line 15: // pub mod transforms;). The 19 transform implementations exist on disk but do not compile into the binary. This document describes the architectural intent for when the module is resurrected or its contents are migrated.\\n\",\n      \"core_definition\": \"A TransformAction is a deterministic, stateless, unary same-carrier action candidate S -> S that rearranges or modifies admitted state within the same carrier, without Phi guarantees, search, ranking, orchestration, repair, representation conversion, or hidden lift.\\n\",\n      \"tower_placement\": \"A TransformAction is the tower kind for same-carrier rearrangement. It may change arrangement, parameterization, or internal structure, but it stays inside the declared carrier. A TransformAction may not resolve an inadmissible request by reinterpreting the carrier. Converting a discrete support into a continuous interval, or otherwise switching geometry so the operation type-checks, is hidden lift/coercion and is forbidden. That boundary belongs to explicit Meta lift.\\n\",\n      \"rust_types\": {\n        \"transform_action_trait_current\": {\n          \"description\": \"Current working implementation (operators/transforms/mod.rs)\",\n          \"code\": \"pub trait TransformAction: Send + Sync {\\n    fn name(&self) -> &'static str;\\n    fn apply(&self, input: &NemotronValue) -> Result<NemotronValue, TransformFailure>;\\n    fn is_invertible(&self) -> bool { true }\\n    fn preserves_dimension(&self) -> bool { true }\\n}\\n\",\n          \"note\": \"This is the active definition (when the module is enabled). It operates on NemotronValue and has no generic type parameters. Law witnesses are self-reported booleans.\"\n        },\n        \"transform_action_trait_deprecated\": {\n          \"description\": \"Deprecated contract-layer definition\",\n          \"code\": \"pub trait TransformAction<S: BaseType>: ComponentIdentity {\\n    fn propose_transform(&self, input: &S) -> Result<TransformOutput<S>, TransformFailure>;\\n    fn law(&self) -> &'static TransformLaw;\\n}\\n\",\n          \"note\": \"This is the design target. It is generic over BaseType, requires ComponentIdentity, and demands a TransformLaw descriptor. Neither ComponentIdentity nor TransformLaw are used by any transform implementation.\"\n        },\n        \"transform_action_trait_migration_target\": {\n          \"description\": \"Migration target\",\n          \"code\": \"pub trait TransformAction<S: BaseType>: BoundContract {\\n    fn propose_transform(&self, input: &S) -> Result<TransformOutput<S>, TransformFailure>;\\n    fn law(&self) -> &'static TransformLaw;\\n}\\n\",\n          \"note\": \"apply is a legacy implementation name. Contract-canonical APIs should use propose_transform or transform_candidate to avoid implying execution authority. Uses BoundContract from contracts::base_contracts::binding.\"\n        },\n        \"transform_output\": {\n          \"code\": \"pub struct TransformOutput<S> {\\n    pub transform_id: ComponentId,\\n    pub transform_version: ComponentVersion,\\n    pub input_hash: Hash256,\\n    pub output_hash: Hash256,\\n    pub carrier_ref: CarrierRef,\\n    pub law_ref: LawId,\\n    pub witness_refs: Vec<WitnessId>,\\n    pub certificate_refs: Vec<CertificateId>,\\n    pub replay_refs: Vec<ReplayRef>,\\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\\n    pub output: S,\\n}\\n\\npub struct CheckedTransformOutput {\\n    pub output_ref: TransformOutputRef,\\n    pub same_carrier_certificate: CertificateId,\\n    pub law_check_certificate: CertificateId,\\n    pub replay_ref: ReplayRef,\\n    pub checked_hash: Hash256,\\n    pub authority_effect: AuthorityEffect, // FactOnly or RequiresEvaluator depending contract\\n}\\n\"\n        },\n        \"phi_claim\": {\n          \"code\": \"pub enum PhiClaim {\\n    Unrestricted,         // default\\n    Preserved,            // Phi(T(s)) = Phi(s)\\n    NonIncreasing,        // Phi(T(s)) <= Phi(s)\\n    Bounded { factor: f64 }, // Phi(T(s)) <= factor * Phi(s)\\n}\\n\"\n        }\n      },\n      \"existing_implementations\": {\n        \"description\": \"19 files, all disabled\",\n        \"reclassification_candidates\": [\n          {\n            \"file\": \"transform_base2_to10.rs\",\n            \"concern\": \"Decoder / representation conversion\"\n          },\n          {\n            \"file\": \"transform_roman_to_int.rs\",\n            \"concern\": \"Decoder / parser boundary\"\n          },\n          {\n            \"file\": \"transform_complex_numbers.rs\",\n            \"concern\": \"domain-specific computation or representation boundary\"\n          },\n          {\n            \"file\": \"transform_op_remap_plus_is_mult.rs\",\n            \"concern\": \"semantic reinterpretation; likely forbidden or lift/evaluator-governed\"\n          },\n          {\n            \"file\": \"transform_op_remap_mult_is_pow.rs\",\n            \"concern\": \"semantic reinterpretation; likely forbidden or lift/evaluator-governed\"\n          }\n        ],\n        \"note\": \"Before re-enabling operators/transforms, each file must be classified as TransformAction, Adapter, Decoder, Functional, Solver, or forbidden.\"\n      },\n      \"same_carrier_law\": {\n        \"preserves\": [\n          \"carrier identity\",\n          \"carrier type\",\n          \"carrier rank\",\n          \"schema reference\",\n          \"universe reference\",\n          \"coefficient semantics\",\n          \"carrier schema hash\",\n          \"admissible domain\"\n        ],\n        \"note\": \"Any schema change, carrier identity change, universe change, coefficient-domain change, or expressivity expansion is not TransformAction. Transformations must declare a TransformLaw preventing hidden adapters/lifts (e.g., kappa-preserving, kappa-bounded, or same-carrier).\\n\",\n        \"may_change\": [\n          \"arrangement, labels, parameters\",\n          \"internal edge/weight/data layout\"\n        ],\n        \"must_not_change\": \"cardinality or introduce/remove structure unless explicitly declared in its TransformLaw\",\n        \"failure_rule\": \"A TransformAction MUST fail if the operation requires a representation change, carrier lift, schema change, or policy-dependent reinterpretation.\"\n      },\n      \"phi_behavior\": \"TransformAction makes no default Phi monotonicity claim. Any Phi claim is a declaration only and must be verified by the Evaluator layer.\\n\",\n      \"measurement_evaluation_integration\": \"TransformAction does not compute Phi1, Gamma2, Xi, closure defect, quotient mass, or cohomological status. If a transform result is later evaluated, the Evaluator may consume checked MeasurementEnvelope references produced by the Functional / Measurement boundary. Any monotonicity, non-increase, or admissibility claim is outside TransformAction and must be verified by the declared Evaluator or Measurement boundary.\\n\",\n      \"forbidden_tokens\": [\n        \"ActionFactEnvelope\",\n        \"OperatorFactEnvelope\",\n        \"TransformOp\",\n        \"apply_lift\",\n        \"hidden_lift\",\n        \"reinterpret_carrier\",\n        \"change_schema\",\n        \"change_universe\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"rank_candidates\",\n        \"score_candidate\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ActionLicense\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_runtime\",\n        \"self_declare_effect_class\"\n      ],\n      \"required_tests\": [\n        \"transform_output_defaults_to_evidence_only\",\n        \"checked_transform_output_may_be_factonly_after_same_carrier_law_and_replay_checks\",\n        \"transform_does_not_emit_action_license\",\n        \"transform_does_not_authorize_transition\",\n        \"transform_does_not_execute\",\n        \"transform_does_not_compute_measurements\",\n        \"transform_does_not_self_declare_effect_class\",\n        \"transform_preserves_schema_ref\",\n        \"transform_preserves_universe_ref\",\n        \"transform_preserves_coefficient_semantics\",\n        \"legacy_apply_name_is_not_execution\",\n        \"disabled_transform_files_require_reclassification_before_enablement\",\n        \"semantic_reinterpretation_transform_is_forbidden_or_reclassified\"\n      ],\n      \"differentiators_table\": [\n        {\n          \"kind\": \"TransformAction\",\n          \"domain\": \"S -> S\",\n          \"guarantee\": \"Prevents hidden lifts (declared TransformLaw)\",\n          \"phi\": \"Unrestricted (unless declared)\"\n        },\n        {\n          \"kind\": \"ReducerAction\",\n          \"domain\": \"S -> S\",\n          \"guarantee\": \"Idempotent + kappa-monotone: kappa(R(s)) <= kappa(s)\",\n          \"phi\": \"Reducing\"\n        },\n        {\n          \"kind\": \"LambdaAction\",\n          \"domain\": \"admitted carrier morphism\",\n          \"guarantee\": \"local declared law, no hidden lift\",\n          \"phi\": \"declared Phi behavior\"\n        },\n        {\n          \"kind\": \"Encoder\",\n          \"domain\": \"S -> DensityMatrix\",\n          \"guarantee\": \"PSD, trace-one postcondition\",\n          \"phi\": \"Representation boundary\"\n        },\n        {\n          \"kind\": \"Generator\",\n          \"domain\": \"S -> Vec<Candidate<S>>\",\n          \"guarantee\": \"Blind proposal, zero evaluation\",\n          \"phi\": \"N/A\"\n        },\n        {\n          \"kind\": \"Constructor\",\n          \"domain\": \"Raw -> BaseType\",\n          \"guarantee\": \"Validation-gated instantiation\",\n          \"phi\": \"N/A\"\n        }\n      ],\n      \"canonical_invariant\": \"TransformAction is an EvidenceOnly same-carrier action candidate. It proposes deterministic structural rearrangement under a declared TransformLaw. It does not repair, reduce, encode, adapt, search, rank, measure, evaluate, license, mutate, authorize, or execute. Checked transform facts require same-carrier, law, and replay verification. LicensingBoundary authorizes execution when required; Engine executes licensed transitions only.\\n\",\n      \"upgrade_v02\": {\n        \"transform_law\": {\n          \"description\": \"TransformActions are same-carrier rearrangements. They make no default Phi claim.\",\n          \"rust_code\": \"pub struct TransformLaw {\\n    pub law_id: LawId,\\n    pub same_carrier_required: bool,\\n    pub invertibility: InvertibilityClaim,\\n    pub phi_claim: PhiClaim,\\n    pub carrier_invariants: Vec<InvariantId>,\\n    pub authority_effect: AuthorityEffect,\\n}\\n\\npub enum InvertibilityClaim {\\n    Invertible { inverse: ComponentId },\\n    NotInvertibleDeclared,\\n    Unknown,\\n}\\n\",\n          \"note\": \"Default: authority_effect: AuthorityEffect::EvidenceOnly. A raw TransformOutput is EvidenceOnly. A checked same-carrier TransformOutput may become FactOnly only for the claim that the transform satisfied its declared structural law. If later admissibility judgment is needed, consumers may route the checked output to an Evaluator. The TransformAction itself does not emit RequiresEvaluator unless its specific contract declares that boundary. If invertibility is Unknown, no theorem may depend on invertibility for that TransformAction.\\n\"\n        },\n        \"disabled_module_rule\": \"Since transforms are disabled in the binary, mark every theorem depending on them as conditional: Transform theorem applies only when operators/transforms is compiled, registered, and admitted by the component registry.\\n\",\n        \"python_poc\": \"def validate_transform_same_carrier(before: dict, after: dict) -> None:\\n    if before.get(\\\"carrier_id\\\") != after.get(\\\"carrier_id\\\"):\\n        raise ValueError(\\\"Transform changed carrier identity.\\\")\\n    keys = [\\\"carrier_type\\\", \\\"carrier_rank\\\", \\\"schema_ref\\\", \\\"universe_ref\\\"]\\n    for key in keys:\\n        if before.get(key) != after.get(key):\\n            raise ValueError(f\\\"Transform changed carrier field: {key}\\\")\\n\"\n      }\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
