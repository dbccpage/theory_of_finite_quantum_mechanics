            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is a BOUNDARY, not a fixed-layer operator. An Adapter is a pure representation morphism. It crosses schema boundaries without semantic computation, solver invocation, evaluation, or authority promotion. Adapters change representation, not meaning. Adapter artifacts are EvidenceOnly by default. A checked adaptation result may become FactOnly only after schema-bound totality, deterministic hashing, invariant transport, loss declaration, and replay checks pass. Adapter never emits ActionLicense, Action, DecisionEnvelope, or StateTransition.\n",
            "core_definition": "An Adapter is a pure, total, non-executive transformation that maps one BaseType to another BaseType with a different SchemaRef, preserving declared invariants up to an explicitly stated correspondence, and performing no orchestration, search, policy, or side-effectful computation. An Adapter is the lawful representation-boundary mechanism for schema-changing representation conversion. Carrier/schema expressivity changes are lifts, not adaptations.\n",
            "architectural_role": {
              "description": "Adapters exist to cross representation boundaries safely and explicitly.",
              "is": "representation boundaries",
              "is_not": [
