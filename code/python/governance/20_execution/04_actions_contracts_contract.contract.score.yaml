              "missing_subsystem": "The Generator subsystem must delegate all scheduling, breadth control, and exploration bias to a formal SearchKernel. Current Search logic leaks across Generator (proposing too many/few candidates), Engine (deciding which path to take), and SearchCatalog (ordering generators). Without a dedicated SearchKernel contract, search remains ambient behavior rather than a governed subsystem.\n"
