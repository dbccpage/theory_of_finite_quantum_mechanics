                "code": "pub struct CheckedNormalizerOutput {\n    pub output_ref: NormalizerOutputRef,\n    pub uniqueness_certificate: CertificateId,\n    pub idempotence_certificate: CertificateId,\n    pub termination_certificate: CertificateId,\n    pub normal_form_predicate_certificate: CertificateId,\n    pub replay_ref: ReplayRef,\n    pub checked_hash: Hash256,\n    pub authority_effect: AuthorityEffect, // FactOnly for checked structural claims\n}\n",
                "note": "A raw NormalizerOutput is EvidenceOnly. A checked NormalizerOutput may become FactOnly only for the claim that the output satisfies declared normal-form, uniqueness, idempotence, termination, and replay requirements. NormalizerAction itself does not emit RequiresEvaluator. If later admissibility judgment is required, consumers may route the checked output to an Evaluator.\n"
              }
            },
            "default_authority_effect": "AuthorityEffect::EvidenceOnly",
            "checked_authority_note": "A checked normalizer result may become FactOnly for checked structural claims. It does not become RequiresEvaluator merely by being checked.\n",
