            "tower_placement": "A TransformAction is the tower kind for same-carrier rearrangement. It may change arrangement, parameterization, or internal structure, but it stays inside the declared carrier. A TransformAction may not resolve an inadmissible request by reinterpreting the carrier. Converting a discrete support into a continuous interval, or otherwise switching geometry so the operation type-checks, is hidden lift/coercion and is forbidden. That boundary belongs to explicit Meta lift.\n",
