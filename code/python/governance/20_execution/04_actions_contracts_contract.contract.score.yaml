              "flow": "Untrusted external data -> Constructor -> validated BaseType -> Engine pipeline",
              "critical_note": "Constructors are NOT Adapters. Constructors ingest untrusted/raw data and create lawful internal objects. Adapters convert between already-declared, already-validated representations.\n"
