            "canonical_invariant": "LambdaAction bridges. ReducerAction deflates. TransformAction rearranges. Encoder encodes. Generator proposes. Constructor builds/intakes; Validator validates. Engine executes licensed transitions. Action candidates propose transformations; only Evaluators accept; only Engines execute; only MetaLift changes carrier expressivity. No action candidate is allowed to become an Engine in disguise.\n",
