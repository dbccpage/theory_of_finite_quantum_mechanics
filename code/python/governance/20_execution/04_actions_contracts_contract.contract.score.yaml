                "universe reference",
                "coefficient semantics",
                "carrier schema hash",
                "admissible domain"
              ],
              "note": "Any schema change, carrier identity change, universe change, coefficient-domain change, projection loss, or expressivity expansion is not NormalizerAction unless separately governed by Adapter, Projector, ResidualProjection, or Lift.\n"
            },
            "rust_types": {
              "normal_form_evidence": {
                "code": "pub struct NormalFormEvidence {\n    pub normalizer_id: NormalizerId,\n    pub source_schema: SchemaRef,\n    pub normal_form_schema: SchemaRef,\n    pub uniqueness_witness_ref: WitnessId,\n    pub idempotence_witness_ref: WitnessId,\n    pub termination_argument_ref: TerminationArgumentId,\n    pub source_hash: Hash256,\n    pub normal_form_hash: Hash256,\n    pub normal_form_predicate: PredicateId,\n    pub witness_refs: Vec<WitnessId>,\n    pub certificate_refs: Vec<CertificateId>,\n    pub replay_refs: Vec<ReplayRef>,\n    pub evidence_hash: Hash256,\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\n}\n",
                "note": "If certification is required, CertificateKernel may seal a certificate over NormalFormEvidence. NormalizerAction itself does not create certificates."
              },
              "normalizer_output": {
                "code": "pub struct NormalizerOutput<S> {\n    pub normalizer_id: NormalizerId,\n    pub normalizer_version: ComponentVersion,\n    pub input_hash: Hash256,\n    pub output_hash: Hash256,\n    pub carrier_ref: CarrierRef,\n    pub normal_form_evidence: NormalFormEvidence,\n    pub output: S,\n    pub authority_effect: AuthorityEffect, // EvidenceOnly\n}\n"
              },
              "normalizer_action_trait": {
                "code": "pub trait NormalizerAction<S: BaseType>: BoundContract {\n    fn propose_normal_form(\n        &self,\n        input: &S,\n    ) -> Result<EvidenceEnvelope<NormalizerOutput<S>>, NormalizerError>;\n\n    fn normalizer_law(&self) -> &'static NormalizerLaw;\n}\n",
                "note": "Avoid is_normal_form(&self, input) -> bool as a contract method. That is a local validator/evaluator-style claim. Use a declared predicate reference instead."
              },
