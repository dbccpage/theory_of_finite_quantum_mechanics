            "classification_statement": "This is an ACTION CANDIDATE, not a fixed-layer operator. A ReducerAction may produce evidence that later supports E = exact repair or R = residual projection classification. It MUST NOT self-declare E or R. Only the fixed-layer operator classifier/checker may classify an effect. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\n",
            "core_definition": "A ReducerAction is a pure, deterministic, unary, idempotent same-carrier action candidate S -> S that removes declared structural redundancy or normalizes admitted state without increasing the declared reduction measure.\n",
            "tower_placement": "A ReducerAction is same-carrier canonicalization inside internal repair. It may remove redundancy, project to canonical form, or collapse noise, but it may not add basis elements, vertices, dimensions, or carrier structure. If obstruction survives every admissible reducer, exhaustion has been reached on the current carrier. The next lawful move is explicit Meta lift, not a stronger reducer with hidden carrier growth.\n",
