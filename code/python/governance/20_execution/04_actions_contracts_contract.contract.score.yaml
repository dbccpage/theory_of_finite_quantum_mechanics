                "code": "pub trait ReducerAction<S: BaseType>: BoundContract {\n    fn propose_reduction(\n        &self,\n        input: &S,\n    ) -> Result<ReducerOutput<S>, ReducerFailure>;\n\n    fn law(&self) -> &'static ReducerLaw;\n}\n",
