                "description": "Constructors must reject incomplete input rather than fill it"
              },
              "python_poc": "from dataclasses import dataclass\nfrom typing import Any\nimport hashlib, json\n\n@dataclass(frozen=True)\nclass ConstructorOutput:\n    value: Any\n    constructor_id: str\n    input_hash: str\n    value_hash: str\n    validation_certificate_ref: str\n\n\ndef stable_hash(obj: Any) -> str:\n    raw = json.dumps(obj, sort_keys=True, default=str).encode()\n    return hashlib.sha256(raw).hexdigest()\n\n\ndef construct_required_record(raw: dict) -> ConstructorOutput:\n    required = [\"id\", \"prompt\"]\n    for field in required:\n        if field not in raw:\n            raise ValueError(f\"MissingRequiredField:{field}\")\n\n    # No default filling. No repair.\n    value = {\"id\": raw[\"id\"], \"prompt\": raw[\"prompt\"]}\n    return ConstructorOutput(\n        value=value,\n        constructor_id=\"prompt_record_constructor_v1\",\n        input_hash=stable_hash(raw),\n        value_hash=stable_hash(value),\n        validation_certificate_ref=\"cert_prompt_record_schema_v1\",\n    )\n"
