              "declared_law_not_accepted_law": {
                "description": "The current document correctly notes that law witnesses may be self-reported booleans and must be verified by the Evaluator. Make this mechanical.\n",
                "rust_code": "pub struct LambdaLawDeclaration {\n    pub law_id: LawId,\n    pub preserves: Vec<PreservedStructure>,\n    pub phi_claim: PhiClaim,\n    pub carrier_change: CarrierChange,\n}\n\npub enum CarrierChange {\n    SameCarrier,\n    DeclaredHomomorphism { source: SchemaRef, target: SchemaRef },\n    HiddenLiftDetected,\n}\n\npub enum PhiClaim {\n    NonIncreasing,\n    Preserved,\n    Unclaimed,\n}\n"
