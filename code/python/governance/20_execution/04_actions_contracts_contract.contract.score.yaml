            "encoding_domain": "Encoders map structured domain to admissible density representation under strict codomain invariants: PSD, trace-one, Hermitian, and finite.\n",
            "tower_placement": "Encoders sit at the representation boundary between the structural domain (graphs, text, embeddings) and the density-representation layer. They are closely related to Adapters but distinguished by their postcondition: every encoder output MUST be a valid density matrix. An Encoder is distinct from an Adapter. An Adapter converts between already-declared representations. An Encoder crosses the representation boundary from an unstructured/heterogeneous domain into a strictly constrained physical representation.\n",
            "actual_implementation_note": "The TextDensityEncoder is the canonical example of an encoder that maps raw text -> Bigram Gram matrix -> PSD trace-one density matrix. It was deliberately named \"encoder\" rather than \"quantum\" to enforce the epistemic firewall: text does not become quantum by being encoded as a density matrix. The density matrix is a diagnostic formalism, not a physical ontology.\n",
