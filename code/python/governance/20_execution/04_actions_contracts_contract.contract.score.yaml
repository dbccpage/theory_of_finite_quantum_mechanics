            "canonical_invariant": "Constructor may perform intake precondition checks and schema-directed parsing. Validator owns validation. CertificateKernel owns certificates. Encoder encodes. LambdaAction bridges. ReducerAction deflates. TransformAction rearranges. Generator proposes. Engine executes licensed transitions. Boundaries shape and validate; only Evaluators accept; only Engines execute; only MetaLift changes carrier expressivity. No boundary is allowed to become an Engine in disguise.\n",
