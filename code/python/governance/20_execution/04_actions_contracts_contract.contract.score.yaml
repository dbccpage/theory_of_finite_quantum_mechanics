            "llm_boundary_law": "This contract is a governance artifact. LLM-generated content carries no authority within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.\n",
            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is an ACTION CANDIDATE, not a fixed-layer operator. A LambdaAction may generate proposals for E (exact repair) or I (quotient isometry) effects. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. LambdaAction outputs are EvidenceOnly by default. A raw LambdaOutput is EvidenceOnly.\nA checked LambdaOutput may become FactOnly only for checked structural claims.\nIf admissibility judgment is needed, consumers may route the checked output to Evaluator. LambdaAction itself does not emit RequiresEvaluator.\n",
            "core_definition": "A LambdaAction is a pure local endomorphism over an admitted carrier. It is a deterministic, stateless, unary morphism that preserves declared structure and may declare claims about diagnostic constraints over its admitted domain, subject to evaluator verification. It performs no search, candidate exploration, ranking, orchestration, hidden lift, or repair.\n",
