            "canonical_invariant": "NormalizerAction is an EvidenceOnly same-carrier action candidate. It proposes a deterministic mapping to a declared normal form under explicit normal-form predicate, uniqueness, idempotence, termination, and replay evidence. It does not certify, validate, evaluate, license, authorize, mutate, execute, hide projection loss, or change carrier/schema expressivity. Checked normalizer facts require a declared checking or certificate boundary. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift changes carrier/schema expressivity only through license.\n",
