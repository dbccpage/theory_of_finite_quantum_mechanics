            "core_definition": "A NormalizerAction transforms an admitted state into its declared unique normal form. A NormalizerAction may be treated as a strict subtype of ReducerAction only when uniqueness, idempotence, termination, same-carrier preservation, and replay evidence are checked by the declared boundary. This subtype relation is a checked structural claim, not execution authority.\n",
            "obligations": {
              "must": [
                "Be strongly normalizing (always terminates at a unique normal form)",
                "Be idempotent",
                "Declare the normal-form predicate",
                "Emit normal-form evidence",
                "Preserve source semantics unless explicit projection loss is declared"
              ],
              "must_not": [
                "Hallucinate normal forms that lose semantic meaning unless governed by a projection license",
                "Hide projection or quotient loss",
                "Repair malformed input",
                "Act as an evaluator",
                "Claim semantic equivalence without verification support"
              ]
