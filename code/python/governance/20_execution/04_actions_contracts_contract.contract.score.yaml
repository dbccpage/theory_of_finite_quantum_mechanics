            "llm_boundary_law": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, rank candidates, schedule search, or upgrade evidence authority. LLM output may propose Generator implementations, candidate schemas, generation rules, or tests, but those proposals are EvidenceOnly until checked by the declared Generator, Search, Replay, and component-boundary checks.\n",
            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "Generator is a CANDIDATE, not a fixed-layer operator. A Generator applies domain-specific transformation schemas to produce detached candidate states. It does not evaluate, schedule, or execute. The Evaluator may judge candidate admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\n",
            "core_definition": "A Generator is a pure proposal morphism. It is a mechanism that applies domain-specific transformation schemas to an immutable input state and returns detached candidate states with transition metadata. Generators propose transitions. They do not evaluate, schedule, or execute them.\n",
            "subsystem_classification": {
              "subsystem": "proposal kernel / candidate synthesis layer",
              "not": [
                "evaluator",
                "search kernel",
                "solver",
                "policy",
                "terminalizer",
                "engine",
                "pipeline"
              ]
            },
