            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is an ACTION CANDIDATE, not a fixed-layer operator. A TransformAction rearranges structure within the same carrier. It makes no default Phi monotonicity claim. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\n",
