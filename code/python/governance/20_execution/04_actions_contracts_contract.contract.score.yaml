            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is a BOUNDARY, not a fixed-layer operator. An Encoder is a typed representation functor at the representation boundary. It shapes the representation space but does not decide candidate acceptance, evaluate, or execute. Encoder output is EvidenceOnly by default. A checked encoded representation may become FactOnly only after codomain invariants, deterministic hashing, schema identity, replayability, and required certificate references are checked. Encoder does not emit DecisionEnvelope, ActionLicense, Action, or StateTransition.\n",
