            "rules": {
              "blind_proposal_generation": {
                "section_number": 1,
                "description": "A Generator MUST apply a specific transformation rule to an immutable input state.",
                "may_return": [
                  "zero candidates (defined but no applicable transitions)",
                  "one or more candidates",
                  "a typed error (input violated generator's domain)"
