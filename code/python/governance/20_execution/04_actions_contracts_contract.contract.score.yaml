            "llm_boundary_law": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, assign effect classes, or upgrade evidence authority. LLM output may propose NormalizerAction candidates, NormalizerLaw descriptors, normal-form predicates, migration patches, or tests, but those proposals are EvidenceOnly until checked by the declared NormalizerAction, Replay, Certificate, Evaluator, and component-boundary checks.\n",
            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is an ACTION CANDIDATE, not a fixed-layer operator. A NormalizerAction maps admitted state to its declared unique normal form. It may be treated as a strict subtype of ReducerAction only when uniqueness, idempotence, and termination are certified. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. The Engine executes only licensed transitions.\n",
