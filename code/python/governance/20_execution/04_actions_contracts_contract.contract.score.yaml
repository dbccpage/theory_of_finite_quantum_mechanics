            "canonical_invariant": "Adapter is an EvidenceOnly representation boundary. It maps between different schema-bound BaseTypes through total, deterministic, pure structural transformation with explicit invariant transport and explicit loss. It changes representation, not meaning. It does not certify, validate, infer, repair, compute canonical measurements, terminalize, authorize, mutate, execute, or emit action facts. If meaning or carrier expressivity changes, the boundary is not Adapter; it is lift or another declared authority boundary.\n",
