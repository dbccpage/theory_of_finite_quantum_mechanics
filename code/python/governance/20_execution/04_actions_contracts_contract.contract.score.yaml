            "llm_boundary_law": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize, authorize transitions, execute transitions, or upgrade evidence authority. LLM output may propose ForgetfulAction candidates, loss ledgers, or contract edits, but those proposals are EvidenceOnly until checked by the declared ForgetfulAction, Witness, Certificate, Replay, and Evaluator boundaries.\n",
            "inherits": "component_shared_boundary_contract.md",
            "classification_statement": "This is a CANDIDATE, not a fixed-layer operator. A ForgetfulAction lawfully forgets declared structure and emits explicit loss evidence. A checked forgetful result may support FactOnly loss claims only after loss verification, certificate binding, and replay checking. It may support later classification as R = residual projection only if the fixed-layer operator classifier/checker verifies deterministic TiePolicy, residual target, invariant preservation, discarded-information evidence, and replay support. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. ForgetfulAction lawfully forgets declared structure. ForgetfulAction emits explicit loss evidence. ForgetfulAction does not compress silently, claim equivalence, terminalize, mutate runtime state, or execute engine actions.\n",
            "subsystem_classification": {
              "subsystem": "representation / projection / forgetting candidate",
              "signature": "RichStructure -> PoorerStructure",
              "role": "lawfully forgets declared structure with explicit loss ledger"
            },
            "core_definition": "A ForgetfulAction maps a richer declared structure to a poorer declared structure by forgetting explicitly named fields, invariants, or structure.\n",
