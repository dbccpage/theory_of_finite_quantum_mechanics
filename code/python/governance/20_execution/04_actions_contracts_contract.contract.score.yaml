            "canonical_invariant": "Reflector is an EvidenceOnly quotation candidate. It creates inert quote-level structure under declared source schema, quote schema, recursion guard, and replay evidence. It does not certify, validate, decode without boundary, inherit authority from quoted objects, schedule quoted content, terminalize, authorize, mutate, or execute. Checked reflection facts require a declared checking or certificate boundary. Candidates propose transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift changes carrier/schema expressivity only through license.\n",
