            "canonical_invariant": "Encoder is an EvidenceOnly representation boundary. It maps structured input into a constrained encoded representation and emits EncodingEvidence. It does not certify, validate, measure, evaluate, rank, terminalize, authorize, mutate, execute, or create physical ontology. Checked encoded representations require a declared checking or Certificate boundary.\n",
            "upgrade_v02": {
