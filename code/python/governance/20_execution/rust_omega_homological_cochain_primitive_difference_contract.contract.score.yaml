      "raw_utf8": "{\n  \"schema_version\": \"1.0.0\",\n  \"contract_id\": \"rust:omega_homological:cochain_primitive_difference\",\n  \"kind\": \"rust_file_contract\",\n  \"name\": \"Cochain -> PrimitiveDifference Adapter\",\n  \"version\": \"1.0.0\",\n  \"crate\": \"omega_homology\",\n  \"file\": \"crates_rs/omega_homology/src/cochain_primitive_difference.rs\",\n  \"module_path\": \"omega_homology::cochain_primitive_difference\",\n  \"role\": \"cochain_primitive_difference_adapter\",\n  \"status\": \"active\",\n  \"authority_effect\": \"EvidenceOnly\",\n  \"transition_authority\": \"none\",\n  \"description\": \"Realizes a finite cochain complex as a PrimitiveDifference on its C^1 cochains, mirroring the Lean OmegaCore.cochainDifference: delta(x,y) = x - y and Zero(d) := d in im(d0) (d is a coboundary), membership decided exactly over Q by linear_algebra::linear_algebra::image_kernel::solve_in_image. It implements the HoTT primitive trait for cochain complexes; it computes no Phi1/Gamma2, runs no evaluator, mints no authority.\\n\",\n  \"exactness\": {\n    \"level\": \"bigrational_exact\",\n    \"f64_allowed\": false,\n    \"bigrational_followup\": \"EXACT-LA-001 completed by ADR-001 (BigRational canonical Q)\"\n  },\n  \"lean_anchor\": {\n    \"file\": \"lean4/original_lean_20260809/finite_cochain_complex.lean\",\n    \"repointed_from\": \"omega_engine/lean4/…/OmegaCosmology/Primitives/FiniteCochainComplex.lean (never present in this repository)\",\n    \"in_tree_build\": \"None. The file is not a root of any Lake package in this repository, and its imports primitive_difference, «lg006_pointed_obstruction_classifier» and «lg006_primitive_obstruction_pipeline» do not resolve here.\\n\",\n    \"replay\": \"2026-09-29 scratch replay, not committed: Lean 4.34.0 + Mathlib v4.34.0, the three imports rewritten to PrimitiveDifference / PointedObstructionClassifier / PrimitiveObstructionPipeline from omega_engine_atlas/coda_atlas/F004_papers/006_finite_qm/lean4/, body unchanged; exit 0. cochainDifference, gammaL1_congruent_of_cochain, cochainDifference_zero_iff_mem_range, d0LinearMap and range_d0_finiteDimensional elaborate; the theorems print axioms [propext, Classical.choice, Quot.sound].\\n\",\n    \"modeled_definitions\": [\n      \"cochainDifference\"\n    ],\n    \"related\": [\n      \"gammaL1 / gammaL1_congruent_of_cochain (Gamma2 magnitude descent)\"\n    ],\n    \"orientation\": \"delta(x,y) = x - y (matches Lean cochainDifference)\"\n  },\n  \"owns\": [\n    \"cochain_as_primitive_difference\",\n    \"coboundary_zero_predicate (Zero(d) := d in im(d0))\"\n  ],\n  \"does_not_own\": [\n    \"phi1\",\n    \"gamma2\",\n    \"trichotomy\",\n    \"cochain_complex (owned by cochain_complex.rs)\",\n    \"exact_image_membership (owned by omega_linear_algebra::image_kernel)\",\n    \"primitive_difference_trait (defined in omega_homotopy_type_theory)\",\n    \"authority_minting\",\n    \"evaluator_policy\",\n    \"lift_policy\",\n    \"operad_generation\"\n  ],\n  \"may_call\": [\n    \"std\",\n    \"omega_homotopy_type_theory::primitive_difference (the trait)\",\n    \"omega_homology::cochain_complex (the carrier)\",\n    \"linear_algebra::linear_algebra::image_kernel::solve_in_image (exact membership)\"\n  ],\n  \"must_not_call\": [\n    \"omega_functional\",\n    \"omega_certifiers\",\n    \"omega_id_run\",\n    \"omega_pipelines\",\n    \"omega_engines\"\n  ],\n  \"rules\": {\n    \"authority_minting\": \"forbidden\",\n    \"canonical_functional_computation\": \"forbidden\",\n    \"f64\": \"forbidden\",\n    \"delta_orientation\": \"x_minus_y_matches_lean\",\n    \"zero_predicate\": \"d_in_image_d0_exact\"\n  },\n  \"required_types\": [\n    \"CochainPrimitiveDifference\"\n  ],\n  \"required_tests\": [\n    \"cochain_zero_accepts_exact_boundary\",\n    \"cochain_zero_rejects_non_boundary\",\n    \"cochain_primitive_difference_matches_lean_orientation\",\n    \"cochain_zero_rel_equivalence_on_validated_domain\"\n  ],\n  \"lean_obligations\": [\n    {\n      \"id\": \"CPD-L0\",\n      \"theorem\": \"delta = x - y, Zero = is-coboundary realizes a PrimitiveDifference (zero laws hold).\",\n      \"lean_name\": \"OmegaCore.cochainDifference (zero_refl/zero_symm/zero_trans)\",\n      \"status\": \"proved_in_lean\"\n    },\n    {\n      \"id\": \"CPD-L1\",\n      \"theorem\": \"The cochain Zero predicate (Zero d := exists pot, d0 pot = d) is exactly membership in the Q-linear range of d0 (a genuine Mathlib LinearMap), and im(d0) is a finite-dimensional Q-subspace of C^1 -- the image-membership predicate solve_in_image decides. Soundness (Rust InImage => Lean Zero) is definitional: the replay-verified pot witness IS the existential.\",\n      \"lean_name\": \"OmegaCore.cochainDifference_zero_iff_mem_range (+ d0LinearMap / range_d0_finiteDimensional)\",\n      \"status\": \"proved_in_lean\",\n      \"axioms\": \"[propext, Classical.choice, Quot.sound]\",\n      \"scope\": \"bounded anchor: spec correspondence + finite-dimensionality. Completeness split out as CPD-L1b.\"\n    },\n    {\n      \"id\": \"CPD-L1b\",\n      \"theorem\": \"Completeness of the Rust rank decision: solve_in_image returns NotInImage (rank([d0|v]) > rank d0) only when v is genuinely NOT a coboundary (Rouche-Capelli over finite-dim Q).\",\n      \"lean_name\": \"rust_verified_not_yet_in_lean\",\n      \"status\": \"rust_verified\",\n      \"note\": \"Verified Rust-side by exact rank-augmentation + matvec replay; a false InImage witness is impossible. A full Lean derivation would require porting rank/RREF consistency (Rouche-Capelli) into Mathlib -- deferred.\"\n    }\n  ],\n  \"notes\": [\n    \"This adapter is BELOW the functional layer; it produces the residual quotient C^1/im(d0), not Phi1 or Gamma2.\",\n    \"ADR-001 widened Q to BigRational. Consumers recording evidence must retain the solve_in_image Result; PrimitiveDifference::zero maps solver errors to false.\",\n    \"Do not claim operads, physics, or global generativity from this -- it is the delta->cochain realization only.\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"os:base_legacy_contract\"\n    ]\n  }\n}\n",
