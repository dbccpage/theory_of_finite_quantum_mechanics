          "summary": "This contract defines the TerminalMapper boundary.\n\nTerminalMapper is NOT an operator in the five-effect-class algebra (E, I, C, R, M).\nIt is a record finalization gate that maps completed execution states to typed terminal\nenvelopes.\n\nTerminalMappers declare terminal outcomes or terminal reports only. They do not declare\nactions, execute actions, or mutate state.\n",
