      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:terminal_mapper:v1.0.0\",\n  \"title\": \"TerminalMapper\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"TerminalMapper\",\n  \"descriptor\": {\n    \"authority_effect\": \"requests_decision\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"KernelAuthorityMatrix\",\n        \"Evaluator\",\n        \"Policy\",\n        \"CertificateKernel\",\n        \"Replay\",\n        \"Trace\",\n        \"Engine\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"KernelAuthorityMatrix\",\n        \"Evaluator\",\n        \"Policy\",\n        \"CertificateKernel\",\n        \"Replay\",\n        \"Trace\",\n        \"Engine\"\n      ],\n      \"emits\": \"DecisionEnvelope\",\n      \"authority_layer\": \"Judgment\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"constraints\": {\n      \"typed_output_required\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"ExecuteStateTransition\",\n        \"ActionLicensing\",\n        \"MeasurementComputation\",\n        \"CertificateSigning\",\n        \"RuntimeMutation\",\n        \"ComputePhi\",\n        \"ComputeGamma\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the TerminalMapper boundary.\\n\\nTerminalMapper is NOT an operator in the five-effect-class algebra (E, I, C, R, M).\\nIt is a record finalization gate that maps completed execution states to typed terminal\\nenvelopes.\\n\\nTerminalMappers declare terminal outcomes or terminal reports only. They do not declare\\nactions, execute actions, or mutate state.\\n\",\n    \"non_role\": [\n      \"certification\",\n      \"execution\",\n      \"evaluation\",\n      \"mutation\",\n      \"policy_definition\",\n      \"measurement_computation\",\n      \"solver_invocation\",\n      \"search\",\n      \"trace_mutation\",\n      \"certificate_creation\",\n      \"evidence_fabrication\",\n      \"state_transition\",\n      \"policy_reinterpretation\",\n      \"action_licensing\",\n      \"transition_authorization\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\\nterminalize, authorize transitions, execute transitions, assign terminal categories,\\ncreate terminal envelopes, or upgrade evidence authority.\\n\\nLLM output may propose terminal category definitions, report text, mapping rules,\\nor tests, but those proposals are EvidenceOnly until checked by the declared\\nTerminalMapper, Policy, Replay, Certificate, and Contract boundaries.\\n\"\n    },\n    \"core_definition\": \"Terminal Mapper maps final states to typed terminal envelopes. It does not certify,\\nevaluate, mutate, or execute.\\n\\nA TerminalMapper is a deterministic factory component that converts a finalized execution\\ntrace or carrier state into a typed terminal envelope.\\n\\nFinal State + Trace -> TerminalMapper -> TerminalEnvelope\\n\\nA TerminalMapper must declare the termination condition and category.\\n\",\n    \"trait_shape\": {\n      \"rust\": \"pub trait TerminalMapper<State, Trace> {\\n    type Envelope;\\n\\n    fn map_terminal(\\n        &self,\\n        state_ref: StateRef,\\n        trace_ref: TraceRef,\\n        evidence_refs: Vec<EvidenceRef>,\\n    ) -> Result<Self::Envelope, TerminalMappingError>;\\n\\n    fn authority_effect(&self) -> AuthorityEffect {\\n        AuthorityEffect::RequestsDecision\\n    }\\n}\\n\"\n    },\n    \"structural_representation\": {\n      \"terminal_envelope\": {\n        \"struct_name\": \"TerminalEnvelope\",\n        \"fields\": [\n          {\n            \"name\": \"terminal_id\",\n            \"type\": \"TerminalEnvelopeId\"\n          },\n          {\n            \"name\": \"terminal_category\",\n            \"type\": \"TerminalCategory\"\n          },\n          {\n            \"name\": \"state_ref\",\n            \"type\": \"StateRef\"\n          },\n          {\n            \"name\": \"trace_ref\",\n            \"type\": \"TraceRef\"\n          },\n          {\n            \"name\": \"evaluator_decision_refs\",\n            \"type\": \"Vec<DecisionEnvelopeRef>\"\n          },\n          {\n            \"name\": \"policy_decision_refs\",\n            \"type\": \"Vec<DecisionEnvelopeRef>\"\n          },\n          {\n            \"name\": \"evidence_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"clauses_fired\",\n            \"type\": \"Vec<ClauseId>\"\n          },\n          {\n            \"name\": \"envelope_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"RequestsDecision\"\n          }\n        ]\n      },\n      \"checked_terminal_envelope\": {\n        \"struct_name\": \"CheckedTerminalEnvelope\",\n        \"fields\": [\n          {\n            \"name\": \"envelope_ref\",\n            \"type\": \"TerminalEnvelopeId\"\n          },\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"ReplayRef\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"checked_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"TerminalCategory\",\n          \"variants\": [\n            \"VerifiedComplete\",\n            \"Refused\",\n            \"Fallback\",\n            \"UnverifiedComplete\",\n            \"Indeterminate\"\n          ]\n        },\n        {\n          \"name\": \"TerminalMappingError\",\n          \"variants\": [\n            {\n              \"name\": \"MissingEvidence\",\n              \"fields\": {\n                \"detail\": \"String\"\n              }\n            },\n            {\n              \"name\": \"MissingClauses\",\n              \"fields\": {\n                \"detail\": \"String\"\n              }\n            },\n            {\n              \"name\": \"InvalidTerminalCategory\",\n              \"fields\": {\n                \"detail\": \"String\"\n              }\n            },\n            {\n              \"name\": \"EmptyPayload\",\n              \"fields\": {\n                \"detail\": \"String\"\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"terminal_categories\": {\n      \"VerifiedComplete\": \"Execution completed with full certificate chain. Required verified certificate/replay/evidence references are present. It does not mean TerminalMapper created or verified certificates.\",\n      \"Refused\": \"Execution completed with an explicit Reject verdict. Records a refusal outcome. It is not the fixed-layer operator class M by itself.\",\n      \"Fallback\": \"Execution completed under degraded conditions (e.g., budget exhaustion, solver timeout). Records degraded completion. It is not a repair instruction.\",\n      \"UnverifiedComplete\": \"Execution completed but without sufficient certificate chain for full verification. It is not FactOnly by default.\",\n      \"Indeterminate\": \"State or trace analysis is inconclusive or indeterminate.\"\n    },\n    \"architectural_mandates\": [\n      {\n        \"name\": \"Terminal Outcomes Only\",\n        \"text\": \"A TerminalMapper MUST NOT execute transitions or apply state changes. It solely declares the terminal mapping and packs the evidence into a terminal report.\"\n      },\n      {\n        \"name\": \"Mandatory Evidence and Clauses\",\n        \"text\": \"A TerminalMapper MUST NOT synthesize or assume evidence. It requires explicit records of evidence used and policy clauses fired to build the terminal report.\"\n      },\n      {\n        \"name\": \"Terminal Decision Authority\",\n        \"text\": \"A TerminalEnvelope uses RequestsDecision by default. A CheckedTerminalEnvelope may support FactOnly claims only about the recorded terminal report after replay, evidence, and certificate references are checked. TerminalMapper does not emit StateTransition.\"\n      },\n      {\n        \"name\": \"No Certification Authority\",\n        \"text\": \"A TerminalMapper packages evidence references into envelopes. It does not sign, create, or verify certificates.\"\n      },\n      {\n        \"name\": \"No Evaluation Authority\",\n        \"text\": \"A TerminalMapper does not judge whether evidence is admissible. That is the Evaluator's role.\"\n      }\n    ],\n    \"record_integration\": \"TerminalEnvelope is a terminal report artifact. Trace records TerminalEnvelope references\\nthrough the Trace boundary.\\n\\nTerminalMapper MUST NOT write Trace directly unless explicitly invoked through the\\nTrace boundary.\\n\\nTerminalMapper MUST NOT emit ActionLicense. LicensingBoundary consumes TerminalEnvelope\\nreferences and emits ActionLicense when permitted.\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"EngineResult\",\n        \"PolicyDecision\",\n        \"ActionLicense\",\n        \"StateTransition\",\n        \"sign_certificate\",\n        \"save_certificate\",\n        \"create_certificate\",\n        \"execute(\",\n        \"mutate_state\",\n        \"mutate_runtime\",\n        \"evaluate_admissibility\",\n        \"certify(\",\n        \"compute_phi\",\n        \"compute_gamma\",\n        \"compute_xi\",\n        \"run_solver\",\n        \"search_for\",\n        \"write_trace_directly\",\n        \"authorize_transition\",\n        \"license_transition\"\n      ]\n    },\n    \"required_tests\": [\n      \"terminal_mapper_authority_effect_is_requests_decision\",\n      \"checked_terminal_envelope_may_be_factonly_after_replay_and_evidence_checks\",\n      \"terminal_mapper_does_not_create_certificates\",\n      \"terminal_mapper_does_not_emit_state_transition\",\n      \"terminal_mapper_does_not_emit_action_license_unless_explicitly_licensed_boundary\",\n      \"terminal_envelope_is_not_action_license\",\n      \"terminal_envelope_is_not_trace_record_by_itself\",\n      \"terminal_mapper_does_not_write_trace_directly\",\n      \"terminal_mapper_consumes_refs_not_mutable_engine_state\",\n      \"terminal_category_verified_complete_does_not_create_certificate\",\n      \"fallback_terminal_status_is_not_repair_instruction\",\n      \"refused_terminal_status_is_not_operator_m\",\n      \"terminalizer_name_is_migration_alias_only\"\n    ],\n    \"python_poc_shape\": \"@dataclass(frozen=True)\\nclass TerminalEnvelope:\\n    row_id: str\\n    terminal_category: str  # VerifiedComplete, Refused, Fallback, UnverifiedComplete, Indeterminate\\n    state_ref: str\\n    trace_ref: str\\n    evidence_used: Sequence[str]\\n    clauses_fired: Sequence[str]\\n    authority_effect: str = \\\"RequestsDecision\\\"\\n\",\n    \"canonical_invariant\": \"TerminalMapper is a terminal outcome mapping boundary. It maps finalized state and trace\\nreferences plus evidence references into a typed TerminalEnvelope. It does not certify,\\nevaluate admissibility, define policy, compute measurements, mutate, write Trace directly,\\nauthorize transitions, or execute. TerminalEnvelope is not an ActionLicense, Action,\\nEngineResult, or Trace record by itself. Checked terminal report facts require\\nreplay/evidence/certificate checking.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"TerminalMapper\",\n      \"role\": \"Maps finalized execution states to typed terminal envelopes\",\n      \"version\": \"1.0\",\n      \"classification\": \"governance\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"KernelAuthorityMatrix\",\n        \"Evaluator\",\n        \"Policy\",\n        \"CertificateKernel\",\n        \"Replay\",\n        \"Trace\",\n        \"Engine\"\n      ],\n      \"forbidden_authority\": [\n        \"certification\",\n        \"execution\",\n        \"evaluation\",\n        \"mutation\",\n        \"policy_definition\",\n        \"measurement_computation\",\n        \"solver_invocation\",\n        \"search\",\n        \"trace_mutation\",\n        \"certificate_creation\",\n        \"evidence_fabrication\",\n        \"state_transition\",\n        \"policy_reinterpretation\",\n        \"action_licensing\",\n        \"transition_authorization\"\n      ],\n      \"primary_output_family\": \"DecisionEnvelope\",\n      \"domain_output_kind\": \"TerminalEnvelope\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"Record\"\n      ],\n      \"supports_downstream\": [\n        \"LicensingBoundary\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\",\n      \"migration_note\": \"The filename terminalizer_contract.md is retained only for migration compatibility. New code should use TerminalMapper.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
