      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:phi1_exact_certificate_solver:v1.0.0\",\n  \"title\": \"Φ₁ primal-dual certificate construction by exact two-phase simplex\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1:v1.0.0\",\n        \"urn:omega:math:l1_seminorm:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"phi1_exact_certificate_solver\",\n    \"symbol\": \"Φ₁\",\n    \"ascii_symbol\": \"Phi1Solve\",\n    \"notation\": \"Φ₁([ω]) = min_α ‖ω − Bα‖_{1,w} = max { ⟨ω, y⟩ : Bᵀy = 0, |y_i| ≤ w_i }\",\n    \"domain\": [\n      \"an L1Seminorm presentation (B, w): a rectangular rational matrix B and strictly positive rational weights w, admitted by L1Seminorm::new\",\n      \"a representative ω ∈ ℚ^m with one coordinate per weight\"\n    ],\n    \"codomain\": {\n      \"description\": \"VerifiedExactPhi1, produced only by L1Seminorm::evaluate replaying the solved primal-dual pair, or a typed Phi1SolveError.\"\n    },\n    \"definition\": {\n      \"primal\": \"min Σ_i w_i (r⁺_i + r⁻_i) subject to B(α⁺ − α⁻) + r⁺ − r⁻ = ω, all variables ≥ 0\",\n      \"dual\": \"min −⟨ω, y⁺⟩ + ⟨ω, y⁻⟩ subject to Bᵀ(y⁺ − y⁻) = 0, y⁺ + s⁺ = w, y⁻ + s⁻ = w, all variables ≥ 0\",\n      \"method\": \"Each program is solved independently by exact two-phase simplex with Bland's rule. The primal optimum, α = α⁺ − α⁻, the residual ω − Bα and the dual y = y⁺ − y⁻ form an ExactPhi1Certificate that is submitted to L1Seminorm::evaluate.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"A presentation admitted by L1Seminorm::new\",\n      \"Exact rational representative coordinates with nonzero denominators\"\n    ]\n  },\n  \"laws\": [\n    \"Replay law: the solver never constructs VerifiedExactPhi1; every result passes the shared primal-dual verifier and its boundary and weight binding, so a solver defect is a typed refusal, not a sealed value.\",\n    \"Duality law: a returned value equals the weighted primal residual mass and the dual pairing ⟨ω, y⟩ with Bᵀy = 0 and |y_i| ≤ w_i, so the duality gap is zero by construction of the sealed type.\",\n    \"Termination law: Bland's least-index rule prevents cycling on degenerate and rank-deficient presentations.\",\n    \"Refusal law: a representative of the wrong dimension, a zero denominator, an infeasible or unbounded program, and a certificate the verifier refuses are distinct typed errors. There is no fallback solver.\",\n    \"Exactness law: all arithmetic is BigRational; there is no floating-point path and no tolerance.\",\n    \"Separation fence: this constructs degree-1 Φ₁ only. It computes no Γ₂ and no trichotomy class.\",\n    \"Authority law: the result mints no AuthorityEffect, PROVED, GlobalGreen or ActionLicense.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state, randomness or wall-clock\",\n      \"Exact rational arithmetic only\",\n      \"Deterministic pivoting order\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_solvers\",\n    \"module\": \"solver_lp_phi1_quotient\",\n    \"symbols\": [\n      \"Phi1LinearProgram\",\n      \"SimplexRefusal\",\n      \"Phi1SolveError\",\n      \"solve_exact_phi1\"\n    ],\n    \"required_tests\": [\n      \"malformed_representatives_are_typed_refusals\",\n      \"solved_triangle_certificates_replay_with_zero_duality_gap\",\n      \"solver_agrees_with_independent_spanning_forest_enumeration\",\n      \"values_beyond_i64_stay_exact\",\n      \"degenerate_and_empty_presentations_terminate\"\n    ]\n  },\n  \"negative_tests\": [\n    \"A representative with the wrong dimension or a zero denominator must be refused\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"solve_exact_phi1 constructs the primal-dual witness for the weighted ℓ¹ quotient distance on a checked presentation and returns it only after the shared Φ₁ verifier has replayed it. Nonclaim: not Γ₂; not a trichotomy class; not authority; not PROVED; not GlobalGreen.\",\n    \"non_role\": [\n      \"Certificate verification without construction (see urn:omega:math:phi1:v1.0.0)\",\n      \"Γ₂ or any 2-cell closure defect\",\n      \"Floating-point or tolerance-based optimisation\",\n      \"Authority minting, ActionLicense, PROVED or GlobalGreen\"\n    ]\n  },\n  \"wip\": [\n    \"OPEN_OBLIGATION complexity: two-phase simplex over BigRational is exponential in the worst case; no size bound is declared; AuthorityEffect: None.\",\n    \"OPEN_OBLIGATION untested_refusals: the Infeasible and Unbounded LP refusals are unreachable for admitted presentations and have no dedicated unit test; AuthorityEffect: None.\"\n  ]\n}\n",
