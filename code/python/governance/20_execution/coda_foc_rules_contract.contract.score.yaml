      "raw_utf8": "{\n  \"paper_identity\": \"CODA-FOC\",\n  \"legacy_file_identity\": \"000_coda_foc.md\",\n  \"canonical_version\": \"v1.0\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 1 (FOC — Finite Obstruction Calculus)\",\n  \"primitives\": {\n    \"difference\": \"Primitive cochain differences C_1\",\n    \"complex\": \"C_0 -> d_0 -> C_1 -> d_1 -> C_2 with nilpotency d_1 o d_0 = 0\",\n    \"repairs\": {\n      \"stage_1\": \"M_1 = im(d_0) subseteq C_1\",\n      \"stage_2\": \"M_2 = im(a_2) subseteq C_2\"\n    },\n    \"quotients\": {\n      \"Q_1\": \"C_1 / M_1\",\n      \"Q_2\": \"C_2 / M_2\"\n    }\n  },\n  \"equations\": {\n    \"stage_1_quotient_norm\": {\n      \"latex\": \"\\\\Phi_1([x]) = \\\\min_f \\\\|x + d_0 f\\\\|_{(1, w_1)}\",\n      \"description\": \"Stage-1 L1 quotient norm measuring unrepairable defect mass\"\n    },\n    \"stage_2_quotient_norm\": {\n      \"latex\": \"\\\\Gamma_2([d_1 x]) = \\\\min_u \\\\|d_1 x + a_2 u\\\\|_{(1, w_2)}\",\n      \"description\": \"Stage-2 L1 quotient norm measuring unrepairable boundary tear\"\n    },\n    \"lp_dual_witness_theorem\": {\n      \"latex\": \"\\\\min_y \\\\|x + A y\\\\|_{(1,w)} = \\\\max_z \\\\{ z^T x : A^T z = 0, |z_i| \\\\le w_i \\\\}\",\n      \"description\": \"L1 quotient norm equals LP dual witness certificate\"\n    },\n    \"diagnostic_trichotomy\": {\n      \"exact_repair\": \"\\\\Phi_1([x]) = 0\",\n      \"coherent_residual\": \"\\\\Phi_1([x]) > 0 \\\\land \\\\Gamma_2([d_1 x]) = 0\",\n      \"nonclosed_defect\": \"\\\\Phi_1([x]) > 0 \\\\land \\\\Gamma_2([d_1 x]) > 0\"\n    },\n    \"additive_composition\": {\n      \"latex\": \"\\\\Phi_1([x, x']) = \\\\Phi_1([x]) + \\\\Phi_1([x'])\",\n      \"description\": \"Additive L1 composition under direct sum of cochain complexes\"\n    },\n    \"transport_lipschitz_bound\": {\n      \"latex\": \"\\\\Phi_1'([T_1 x]) \\\\le L_1 \\\\Phi_1([x])\",\n      \"description\": \"Transport morphism bound under chain map T_1\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"FOC-RULE-001\",\n      \"name\": \"No Anonymous Repair\",\n      \"statement\": \"No defect x in C_1 may be claimed repaired without an explicit cochain primitive f in C_0 producing exact boundary d_0 f.\"\n    },\n    {\n      \"id\": \"FOC-RULE-002\",\n      \"name\": \"No Unrecomputed Binding\",\n      \"statement\": \"Any modification to cochain values or weights requires complete re-computation of dual witnesses and quotient norms.\"\n    },\n    {\n      \"id\": \"FOC-RULE-003\",\n      \"name\": \"Trichotomy Categorization Discipline\",\n      \"statement\": \"Every cochain defect must be classified into exactly one of ExactRepair, CoherentResidual, or NonclosedDefect.\"\n    },\n    {\n      \"id\": \"FOC-RULE-004\",\n      \"name\": \"Authority Fireward\",\n      \"statement\": \"Zero residual norm (Phi_1 = 0) is a diagnostic pass only; it does not mint authority.\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports finite L1 quotient norm calculations and dual LP witness bounds in declared finite complexes.\",\n    \"does_not_support\": \"Does not support authority minting, continuum limit claims, or unpriced operator definitions.\",\n    \"narrowest_defensible_claim\": \"Calculates exact L1 defect norms and dual linear programming witness certificates over finite cochain complexes.\",\n    \"next_test_needed\": \"Automated verification of LP dual witness certificates against primal bounds across synthetic test complexes.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
