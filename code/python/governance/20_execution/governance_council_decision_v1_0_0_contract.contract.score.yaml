      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:governance:council_decision:v1.0.0\",\n  \"title\": \"CouncilDecision\",\n  \"kind\": \"governance_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"05_governance\",\n  \"role\": \"Policy\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"AuthInterface\",\n        \"PolicyContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"binding_review_20261014\": \"The declared Rust crate/module is absent from the active Cargo workspace. Withdraw this realization binding; the retained specification has no executable implementation credit from it.\",\n    \"summary\": \"A CouncilDecision is the unit of deliberative governance: a council, meeting on its declared cadence, accepts evidence and resolves a motion into a decision. A decision is credit-bearing ONLY when it carries (1) a QuorumWitness with quorum met, (2) an EvidenceBundle (no evidence ⇒ no credit), and (3) a citation of the omega_contract it is taken under (C8 — a decision with no governing contract is unrouted authority and is refused). Blackrod witnesses a meeting but never votes and never counts toward quorum; enforcement is Blackrod's, deliberation the council's. A council decision confers NO math-layer terminal authority (authority_effect: none); terminal authority arrives only via Pi-sharp + IsAuth, Anomalon-rooted. The decision is governance, not computation.\\n\",\n    \"mathematical_role\": \"The MeetingCat morphism `deliberate : Motion(seconded, evidenced) → Decision` is defined only when the quorum witness is present and quorum_met holds; a credit-bearing (Approved) decision in its image must factor through both an EvidenceBundle reference and a contract citation, else it is rejected by validate_decision. Acceptance of a guardian's report (e.g. Pontius Pilate's contract↔code verdict) is such a decision: the verdict is the evidence; the council's act is to accept and route it, never to certify integrity that the verdict did not establish.\\n\",\n    \"non_role\": [\n      \"Minting or upgrading math-layer authority (arrives only via Pi-sharp + IsAuth)\",\n      \"Signing or wrapping certificates\",\n      \"Terminalizing or executing an operator\",\n      \"Enforcing its own decisions (that is Blackrod's role)\",\n      \"Granting credit without an evidence path\",\n      \"Approving a decision with no cited governing contract\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"LLM-generated content carries zero authority in a council decision. LLM output (e.g. a Retinue performance, an advisory draft) is candidate/diagnostic material only; it may inform deliberation but never constitutes evidence authority, quorum, or the decision itself. Decisions are functions of present members, witnessed quorum, and cited evidence + contract.\\n\"\n    },\n    \"authority_boundary\": {\n      \"may\": [\n        \"Resolve a seconded, evidenced motion into a decision under a cited contract\",\n        \"Record dissent, minutes, and action items\",\n        \"Route action items to Blackrod (enforcement) without voting power transfer\"\n      ],\n      \"must_not\": [\n        \"Mint, upgrade, or launder math-layer authority\",\n        \"Grant credit without an evidence bundle\",\n        \"Approve without a QuorumWitness (quorum_met)\",\n        \"Approve without citing the governing omega_contract (C8)\",\n        \"Certify a property the submitted evidence did not establish\"\n      ]\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"mint_authority\",\n        \"terminalize(\",\n        \"sign_certificate\",\n        \"certify_now(\",\n        \"waive_evidence\",\n        \"waive_quorum\",\n        \"blackrod_votes\"\n      ]\n    },\n    \"required_tests\": [\n      \"council_decision_requires_quorum_witness\",\n      \"council_decision_requires_evidence_bundle\",\n      \"council_decision_requires_cited_contract\",\n      \"council_decision_confers_no_math_authority\",\n      \"blackrod_witnesses_but_never_votes_or_counts_to_quorum\"\n    ],\n    \"canonical_invariant\": \"A CouncilDecision is credit-bearing only with quorum + evidence + a cited governing contract; it confers no math-layer authority, is witnessed (not voted) by Blackrod, and never certifies a property its evidence did not establish.\\n\",\n    \"references\": [\n      \"omega_engine/crates/anomalon_councils/councils/council_governance.md\",\n      \"omega_engine/crates/anomalon_councils/src/governance/meeting.rs (validate_decision, C8)\",\n      \"omega_engine/crates/anomalon_councils/councils/councils.yaml (Rule Prime 0-0)\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_governance_contract:v1.0.0\"\n    ]\n  }\n}\n",
