      "raw_utf8": "{\n  \"paper_identity\": \"CODA-CS\",\n  \"legacy_file_identity\": \"004_gttc.md\",\n  \"canonical_version\": \"v1.0\",\n  \"authority_effect\": \"None\",\n  \"layer\": \"Layer 3 (CS — Continuum Shadow)\",\n  \"primitives\": {\n    \"shadow_tower\": \"Cofinal finite shadow tower (Lambda_0, A_lambda)\",\n    \"shadow_projection\": \"pi_lambda : X -> A_lambda with F_{lambda mu} o pi_lambda = pi_mu\",\n    \"query_projection\": \"q_lambda(X) = q o pi_lambda\",\n    \"query_relative_authority\": \"Auth_kappa(X; q)\",\n    \"certificate_compatibility\": \"Compat_chi(X, Lambda_0)\"\n  },\n  \"equations\": {\n    \"shadow_projection_compatibility\": {\n      \"latex\": \"F_{\\\\lambda\\\\mu} \\\\circ \\\\pi_\\\\lambda = \\\\pi_\\\\mu \\\\quad (\\\\forall \\\\lambda \\\\le \\\\mu)\",\n      \"description\": \"Compatibility condition for shadow projections across cofiltered transitions\"\n    },\n    \"query_relative_authority_definition\": {\n      \"latex\": \"\\\\mathsf{Auth}_{\\\\kappa}(X;\\\\, q) := \\\\Sigma(\\\\Lambda_0:\\\\mathsf{CofinalSubcat}(\\\\Lambda)) \\\\left[ \\\\prod_{\\\\lambda\\\\in\\\\Lambda_0}\\\\mathsf{Auth}_\\\\lambda(q_\\\\lambda(X)) \\\\times \\\\mathsf{Compat}_\\\\chi(X,\\\\Lambda_0) \\\\right]\",\n      \"description\": \"Dependent pair type defining authority for a continuum query over a cofinal shadow family\"\n    },\n    \"certificate_compatibility_definition\": {\n      \"latex\": \"\\\\mathsf{Compat}_\\\\chi(X, \\\\Lambda_0) := \\\\prod_{\\\\lambda \\\\le \\\\mu} \\\\Sigma(\\\\chi_{\\\\lambda\\\\mu}) \\\\times \\\\prod_{\\\\lambda \\\\le \\\\mu \\\\le \\\\nu} \\\\mathsf{Paste}_\\\\chi(\\\\lambda, \\\\mu, \\\\nu, \\\\chi_{\\\\lambda\\\\mu}, \\\\chi_{\\\\mu\\\\nu}, \\\\chi_{\\\\lambda\\\\nu})\",\n      \"description\": \"Pairwise certificates and triple pasting coherence across shadow tower\"\n    },\n    \"renormalized_shadow_transport_law\": {\n      \"latex\": \"\\\\tau_\\\\mu V_\\\\mu D_\\\\mu(q_\\\\mu(R_{\\\\lambda\\\\mu}A_\\\\lambda)) = \\\\rho_{\\\\lambda\\\\mu} \\\\left( \\\\tau_\\\\lambda V_\\\\lambda D_\\\\lambda(q_\\\\lambda(A_\\\\lambda)) \\\\right)\",\n      \"description\": \"GTTC-R1 terminal-refinement equivariance condition across scale transitions\"\n    },\n    \"continuum_residual_interface\": {\n      \"latex\": \"\\\\operatorname{Resid}_\\\\Lambda([\\\\delta]) := \\\\tau_{\\\\mathrm{res}}(\\\\operatorname{cofib}(c_{\\\\Lambda, [\\\\delta]}))\",\n      \"description\": \"Handoff mapping non-absorbed shadow coherence defects into CODA-A cofiber terminals\"\n    }\n  },\n  \"enforcement_rules\": [\n    {\n      \"id\": \"CS-RULE-001\",\n      \"name\": \"Finite-Shadow Discipline\",\n      \"statement\": \"Continuum limits or tower coherence alone do not construct authority: X in Omega_kappa does not imply Auth_kappa(X; q).\"\n    },\n    {\n      \"id\": \"CS-RULE-002\",\n      \"name\": \"Query-Relative Authority Scoping\",\n      \"statement\": \"Authority is strictly query-relative. Authorizing query q does not grant object-level authority over X.\"\n    },\n    {\n      \"id\": \"CS-RULE-003\",\n      \"name\": \"Cofinal Authorized Support Requirement\",\n      \"statement\": \"Every admitted continuum query must factor through a cofinal family of authorized finite shadows.\"\n    },\n    {\n      \"id\": \"CS-RULE-004\",\n      \"name\": \"Typed Refusal Protocol\",\n      \"statement\": \"Tower failure must return typed refusal (NoFiniteShadow, NoCofinalAuthorizedShadow, ShadowCoherenceFailure, UnreflectedContinuumClaim, TransportViolation, BudgetUnknown, NoTerminal).\"\n    }\n  ],\n  \"claim_discipline\": {\n    \"supports\": \"Supports query-relative authorization of continuum models through cofinal finite shadow profiles.\",\n    \"does_not_support\": \"Does not support unreflected continuum claims, infinite-horizon authority without finite shadows, or global green status.\",\n    \"narrowest_defensible_claim\": \"Verifies profile factorization and cofinal shadow certificate pasting for specific declared queries.\",\n    \"next_test_needed\": \"Automated verification of cofinal shadow profile factorization for multi-scale grid queries.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
