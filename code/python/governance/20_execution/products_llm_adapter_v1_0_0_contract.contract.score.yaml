    "doctrine": {
      "summary": "This contract defines the LLM Adapter product boundary.\n\nThe LLM Adapter is an intake boundary for untrusted model output. It may submit model output as\nCandidateResponse, CandidateTrace, DeclaredActionCandidate, CandidateRepairProposal, or\nOracleCandidateSuggestion.\n\nIt may not certify, validate, terminalize, classify itself as an operator, or upgrade evidence\nauthority.\n\nThe LLM is a candidate generator only. All authority belongs to parsers, validators, evaluators,\nreplay systems, solvers, proof checkers, or declared external oracles.\n",
      "non_role": [
        "certification",
        "validation",
        "terminalization",
        "operator classification",
        "evidence authority upgrade",
        "evaluation",
        "execution",
        "transition authorization",
        "action licensing",
        "policy interpretation",
        "tool/oracle authority claim",
        "schema authority creation"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, classify operators, claim tool/oracle authority,\nor upgrade evidence authority.\n\nThe LLM Adapter enforces this boundary: all LLM output enters only as untrusted candidate material,\nsuch as CandidateResponse, CandidateTrace, DeclaredActionCandidate, CandidateRepairProposal, or\nOracleCandidateSuggestion.\n\nNo LLM output may bypass the adapter to enter as certified, validated, checked, terminal, licensed,\nor authoritative material.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Intake boundary for untrusted model output.",
        "classification": "Product layer -- LLM Adapter is the entry gate for all LLM-generated content."
      },
      "candidate_types": [
        "CandidateResponse",
        "CandidateTrace",
        "DeclaredActionCandidate",
        "CandidateRepairProposal",
        "OracleCandidateSuggestion"
      ],
      "structural_representation": {
        "llm_adapter_output": {
          "struct_name": "LlmAdapterOutput",
          "fields": [
            {
              "name": "packet_id",
              "type": "PacketId"
            },
            {
              "name": "candidate_id",
              "type": "CandidateId"
            },
            {
              "name": "candidate_type",
              "type": "CandidateType"
            },
            {
              "name": "request_hash",
              "type": "Hash256"
            },
            {
              "name": "raw_response_hash",
              "type": "Hash256"
            },
            {
              "name": "mapping_witness_ref",
              "type": "WitnessId"
            },
            {
              "name": "schema_ref",
              "type": "SchemaRef"
            },
            {
              "name": "parser_version",
              "type": "ParserVersion"
            },
            {
              "name": "adapter_version",
              "type": "ComponentVersion"
            },
            {
              "name": "authority_effect",
              "type": "AuthorityEffect",
              "default": "EvidenceOnly"
            }
          ]
        }
      },
      "admissibility_checklist": [
        "Raw output is captured and hashed",
        "Source model and request metadata are recorded",
        "Output matches a declared response schema",
        "Output parses into a known candidate type",
        "Candidate provenance is preserved",
        "No self-certification claim is accepted"
      ],
      "refusal_conditions": [
        "unstructured output",
        "schema mismatch",
        "natural-language escape outside allowed field",
        "unknown candidate type",
        "missing provenance",
        "prompt/response hash mismatch",
        "self-certification attempt",
        "tool/oracle claim without evidence",
        "hidden schema change",
        "unsafe or unsupported payload"
      ],
      "mapping_witness_obligation": {
        "description": "The adapter must generate a mapping witness that proves provenance and parse mapping only.\nIt does not prove candidate correctness.\n",
        "required_fields": [
          "request_hash",
          "raw_response_hash",
          "parsed_candidate_id",
          "packet_id",
          "model_metadata",
          "adapter_version",
          "parser_version",
          "schema_version",
          "timestamp",
          "mapping_witness_hash"
        ]
      },
      "core_rule": "LLM output may enter the system only as untrusted candidate material.\n",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "certify(",
          "validate_as_authority",
          "evaluate_admissibility",
          "terminalize(",
