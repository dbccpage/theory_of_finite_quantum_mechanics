      "canonical_invariant": "LLM Adapter is an EvidenceOnly intake boundary for untrusted model output. All LLM output enters\nas untrusted candidate material. The adapter does not certify, validate, evaluate, terminalize,\nclassify operators, claim tool/oracle authority, or upgrade evidence authority.\n",
