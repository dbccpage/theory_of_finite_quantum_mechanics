      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:obstruction:lift:v1.0.0\",\n  \"title\": \"Lift\",\n  \"kind\": \"obstruction_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"03_obstruction\",\n  \"role\": \"Lift\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"Obstruction\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"Meta\",\n        \"Engine\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Lift boundary.\\n\\nLift defines licensed carrier extension.\\nLift does not repair, retry, adapt, search, override policy, terminalize, mutate by itself,\\nor execute by itself.\\n\",\n    \"non_role\": [\n      \"repair\",\n      \"retry\",\n      \"adapter conversion\",\n      \"operator application\",\n      \"search expansion\",\n      \"policy override\",\n      \"direct execution\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\\nauthorize transitions, execute transitions, license lifts, prove minimality, or upgrade\\nevidence authority.\\n\\nAn LLM may propose a LiftRequest or MetaLiftContract candidate, but that proposal is\\nEvidenceOnly until checked by MetaJudgment, CertificateKernel, and the Licensing boundary.\\n\"\n    },\n    \"effect_class_binding\": {\n      \"doctrine\": 6,\n      \"text\": \"Lift is NOT an effect-class (E/I/C/R/M). Lift is lift machinery -- it defines how the\\nstructural carrier expands to internalize an irreducible obstruction. The effect-classes\\nE, I, C, R, M operate within a fixed carrier; Lift changes the carrier itself.\\n\",\n      \"operator_note\": \"Only E (exact repair), I (quotient isometry), C (context embedding), R (residual projection),\\nand M (refused mutation) are operators. Lift is not an operator.\\nSee fixed_layer_operator_algebra_contract.md.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Obstruction Resolution\",\n      \"role\": \"Licensed carrier extension (lift machinery).\",\n      \"classification\": \"Obstruction layer -- carrier expansion.\"\n    },\n    \"core_definition\": \"A Lift defines exactly how the structural carrier expands to internalize an irreducible\\nobstruction. It is not an arbitrary modification.\\n\",\n    \"what_lift_is_not\": [\n      \"repair\",\n      \"retry\",\n      \"adapter conversion\",\n      \"operator application\",\n      \"search expansion\",\n      \"policy override\"\n    ],\n    \"what_lift_is\": \"A typed licensed transition schema from C_N to C_{N+1}, executable only by Engine after a\\nvalid LiftLicense is present.\\n\",\n    \"core_invariant\": \"No lift without inhabited LiftLicense.\",\n    \"lift_artifact\": {\n      \"description\": \"Every lift requires a rigorous structural derivation.\",\n      \"schema\": {\n        \"source_carrier\": \"C_N\",\n        \"target_carrier\": \"C_{N+1}\",\n        \"delta\": \"schema_extension\",\n        \"obstruction_witness\": \"witness_id\",\n        \"descent_blocked_witness\": \"exhaustion_witness_id\",\n        \"persistence_witness\": \"persistence_witness_id\",\n        \"authority_license\": \"license_id\",\n        \"cost_derivation\": \"eta_cost_struct\",\n        \"minimality_argument\": \"congruence_restoration_proof\"\n      },\n      \"artifact_envelopes\": {\n        \"LiftRequest\": \"EvidenceEnvelope\",\n        \"MetaLiftDecision\": \"DecisionEnvelope\",\n        \"MetaLiftContract\": \"EvidenceEnvelope or FactEnvelope after checking\",\n        \"LiftLicense\": \"ActionLicense\",\n        \"EngineAppliedLift\": \"Action\"\n      }\n    },\n    \"structural_representation\": {\n      \"lift_request\": {\n        \"struct_name\": \"LiftRequest\",\n        \"fields\": [\n          {\n            \"name\": \"request_id\",\n            \"type\": \"LiftRequestId\"\n          },\n          {\n            \"name\": \"source_carrier\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"target_carrier_schema\",\n            \"type\": \"CarrierSchemaRef\"\n          },\n          {\n            \"name\": \"obstruction_ref\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"requested_delta\",\n            \"type\": \"CarrierDelta\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"request_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"lift_license\": {\n        \"struct_name\": \"LiftLicense\",\n        \"fields\": [\n          {\n            \"name\": \"license_id\",\n            \"type\": \"LiftLicenseId\"\n          },\n          {\n            \"name\": \"contract_ref\",\n            \"type\": \"MetaLiftContractId\"\n          },\n          {\n            \"name\": \"source_carrier\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"target_carrier_schema\",\n            \"type\": \"CarrierSchemaRef\"\n          },\n          {\n            \"name\": \"obstruction_ref\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"allowed_delta\",\n            \"type\": \"CarrierDelta\"\n          },\n          {\n            \"name\": \"authority_refs\",\n            \"type\": \"Vec<AuthorityRef>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"expiry\",\n            \"type\": \"Option<Epoch>\"\n          },\n          {\n            \"name\": \"license_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"AuthorizesTransition\"\n          }\n        ]\n      },\n      \"meta_lift_contract\": {\n        \"struct_name\": \"MetaLiftContract\",\n        \"fields\": [\n          {\n            \"name\": \"contract_id\",\n            \"type\": \"MetaLiftContractId\"\n          },\n          {\n            \"name\": \"source_carrier\",\n            \"type\": \"CarrierRef\"\n          },\n          {\n            \"name\": \"target_carrier_schema\",\n            \"type\": \"CarrierSchemaRef\"\n          },\n          {\n            \"name\": \"obstruction_ref\",\n            \"type\": \"ObstructionId\"\n          },\n          {\n            \"name\": \"carrier_delta\",\n            \"type\": \"CarrierDelta\"\n          },\n          {\n            \"name\": \"minimality_witness\",\n            \"type\": \"WitnessId\"\n          },\n          {\n            \"name\": \"persistence_witness\",\n            \"type\": \"WitnessId\"\n          },\n          {\n            \"name\": \"descent_blocked_witness\",\n            \"type\": \"WitnessId\"\n          },\n          {\n            \"name\": \"preservation_requirements\",\n            \"type\": \"Vec<InvariantId>\"\n          },\n          {\n            \"name\": \"forbidden_losses\",\n            \"type\": \"Vec<InvariantId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"contract_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\",\n            \"promotion_condition\": \"checked_evidence_boundary_passed\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"CarrierDelta\",\n          \"variants\": [\n            {\n              \"name\": \"AddGenerator\",\n              \"fields\": {\n                \"generator_kind\": \"GeneratorKind\"\n              }\n            },\n            {\n              \"name\": \"AddContext\",\n              \"fields\": {\n                \"context_kind\": \"ContextKind\"\n              }\n            },\n            {\n              \"name\": \"AddObservable\",\n              \"fields\": {\n                \"observable_kind\": \"ObservableKind\"\n              }\n            },\n            {\n              \"name\": \"AddRelation\",\n              \"fields\": {\n                \"relation_kind\": \"RelationKind\"\n              }\n            },\n            {\n              \"name\": \"AddCell\",\n              \"fields\": {\n                \"cell_kind\": \"CellKind\"\n              }\n            },\n            {\n              \"name\": \"AddBoundary\",\n              \"fields\": {\n                \"boundary_kind\": \"BoundaryKind\"\n              }\n            },\n            {\n              \"name\": \"ChangeRepresentation\",\n              \"fields\": {\n                \"representation_kind\": \"RepresentationKind\"\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"execution_boundary\": \"Lift artifacts do not execute carrier extension.\\n\\nOnly Engine may execute a lift, and only after a valid LiftLicense is present.\\n\\nRequired flow:\\n  ObstructionArtifact / checked obstruction evidence\\n  -> LiftRequest\\n  -> MetaJudgment\\n  -> MetaLiftDecision\\n  -> checked MetaLiftContract\\n  -> LiftLicense\\n  -> Engine executes licensed lift\\n  -> Trace records action\\n\",\n    \"decision_boundary\": \"Lift defines licensed carrier expansion. Engine executes lift only after a valid\\nLiftLicense authorizes the checked MetaLiftContract and required replay/certificate\\nchecks pass.\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"apply_lift_now(\",\n        \"execute_lift(\",\n        \"mutate_carrier(\",\n        \"override_policy(\",\n        \"retry_lift(\",\n        \"repair_via_lift\",\n        \"search_expansion(\",\n        \"PolicyDecision\",\n        \"TerminalEnvelope\",\n        \"EngineResult\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"GaugeOp\",\n        \"AdapterOp\",\n        \"ForgetfulOp\",\n        \"OperatorFactEnvelope\",\n        \"OperatorId\",\n        \"OperatorKind\",\n        \"BasisOperator\",\n        \"ExtendOperatorClass\",\n        \"ExtendEffectClass\",\n        \"self_license(\",\n        \"self_execute(\",\n        \"embed_license_in_contract\"\n      ]\n    },\n    \"required_tests\": [\n      \"lift_without_license_fails\",\n      \"lift_without_obstruction_fails\",\n      \"lift_without_minimality_witness_fails\",\n      \"lift_without_persistence_witness_fails\",\n      \"lift_does_not_execute\",\n      \"lift_does_not_mutate_carrier\",\n      \"lift_does_not_override_policy\",\n      \"lift_license_hash_is_stable\",\n      \"lift_request_defaults_to_evidence_only\",\n      \"metalift_contract_defaults_to_evidence_only\",\n      \"lift_license_authority_effect_is_authorizes_transition\",\n      \"engine_lift_action_authority_effect_is_state_transition\",\n      \"carrier_delta_cannot_extend_effect_class\",\n      \"lift_request_does_not_contain_own_license\",\n      \"lift_license_references_checked_contract\",\n      \"metalift_contract_does_not_embed_license\",\n      \"lift_license_authorizes_but_does_not_execute\",\n      \"lift_without_engine_execution_does_not_mutate_carrier\",\n      \"lift_requires_obstruction_witness_persistence_and_minimality_evidence\",\n      \"new_effect_class_requires_constitutional_amendment\",\n      \"no_forbidden_op_suffix_tokens\"\n    ],\n    \"negative_capability_tests\": [\n      {\n        \"name\": \"test_lift_without_license_fails\",\n        \"language\": \"python\",\n        \"code\": \"def test_lift_without_license_fails():\\n  req = LiftRequest(\\n    source_carrier=\\\"C0\\\",\\n    target_carrier=\\\"C1\\\",\\n    obstruction_ref=\\\"obs1\\\",\\n    license_ref=None,\\n  )\\n  with pytest.raises(ValueError):\\n    validate_lift_request(req, {})\\n\"\n      }\n    ],\n    \"canonical_invariant\": \"Lift machinery separates request, decision, contract, license, and execution. LiftRequest\\nis EvidenceOnly. MetaJudgment decides admissibility. MetaLiftContract describes the\\ncarrier-extension schema. LiftLicense authorizes the Engine to attempt the transition.\\nEngine alone executes the lift. Lift does not repair, adapt, search, override policy,\\nterminalize, mutate, or execute by itself.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Lift\",\n      \"role\": \"Licensed carrier extension\",\n      \"version\": \"2.0\",\n      \"classification\": \"obstruction\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"Obstruction\",\n        \"Witness\",\n        \"CertificateKernel\",\n        \"Meta\",\n        \"Engine\"\n      ],\n      \"forbidden_authority\": [\n        \"repair\",\n        \"retry\",\n        \"adapter conversion\",\n        \"operator application\",\n        \"search expansion\",\n        \"policy override\",\n        \"direct execution\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"DecisionEnvelope\",\n        \"ActionLicense\",\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"WitnessEnvelope\",\n        \"CertificateEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
