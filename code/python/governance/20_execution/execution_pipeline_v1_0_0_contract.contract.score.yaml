          \"type\": \"PipelineId\"\n          },\n          {\n            \"name\": \"stage_refs\",\n            \"type\": \"Vec<BoundaryRef>\"\n          },\n          {\n            \"name\": \"edge_refs\",\n            \"type\": \"Vec<PipelineEdgeRef>\"\n          },\n          {\n            \"name\": \"manifest_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"None\"\n          }\n        ]\n      },\n      \"record\": {\n        \"struct_name\": \"PipelineTraceStep\",\n        \"fields\": [\n          {\n            \"name\": \"pipeline_id\",\n            \"type\": \"PipelineId\"\n          },\n          {\n            \"name\": \"stage_ref\",\n            \"type\": \"BoundaryRef\"\n          },\n          {\n            \"name\": \"input_ref\",\n            \"type\": \"ArtifactRef\"\n          },\n          {\n            \"name\": \"output_ref\",\n            \"type\": \"ArtifactRef\"\n          },\n          {\n            \"name\": \"trace_ref\",\n            \"type\": \"TraceId\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"None\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"Declared stage refs\\n-> PipelineManifest\\n-> PipelineTraceStep records\\n-> declared boundary outputs\\n-> Engine only when an ActionLicense is already present\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"pipeline_authority_effect_is_none\",\n      \"pipeline_does_not_invoke_solver\",\n      \"pipeline_does_not_calculate_observables\",\n      \"pipeline_does_not_certify\",\n      \"pipeline_does_not_emit_action_license\",\n      \"pipeline_does_not_execute\",\n      \"pipeline_records_declared_flow_only\"\n    ],\n    \"canonical_invariant\": \"Pipeline routes and records declared flow only. It does not create authority, execute,\\ncertify, terminalize, license, or mutate state.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Pipeline\",\n      \"source_file\": \"non-math/06_execution/pipeline_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Typed routing category over declared boundaries\",\n      \"version\": \"2.0\",\n      \"classification\": \"orchestration\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"TypeContract\",\n        \"CertificateKernel\",\n        \"Engine\",\n        \"Trace\"\n      ],\n      \"forbidden_authority\": [\n        \"operator_execution\",\n        \"solver_invocation\",\n        \"observable_calculation\",\n        \"engine_state_redefinition\",\n        \"state_transition\",\n        \"terminal_mapping\",\n        \"certification\",\n        \"action_licensing\"\n      ],\n      \"primary_output_family\": \"Record\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"DecisionEnvelope\",\n        \"ActionLicense\",\n        \"Record\"\n      ]\n    },\n    \"enforcement_scope\": \"The finite report manifest validates exact intermediate identities and effects in omega_pipelines::report_route; other pipeline implementations require separate checks.\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_execution_contract:v1.0.0\"\n    ]\n  }\n}\n",
