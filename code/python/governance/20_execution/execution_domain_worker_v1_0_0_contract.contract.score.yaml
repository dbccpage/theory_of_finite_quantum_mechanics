    "doctrine": {
      "summary": "DomainWorker is an EvidenceOnly compute orchestrator for domain tasks (linear algebra, homology, QM diagnostics, residual repair staging). It may call SolverKernel stages, SearchKernel frontiers, and FunctionalKernel residual geometry. It must not claim Engine v1 StateTransition authority, mint ActionLicense, terminalize, certify, or reimplement Φ₁/Γ₂/Ξ outside omega_functional / playpen functional.\n",
      "non_role": [
        "state_transition",
        "action_license_mint",
        "engine_role_impersonation",
        "residual_geometry_reimplementation",
        "phi_gamma_xi_body_definition",
        "policy_definition",
        "terminal_mapping",
        "certificate_signing"
      ],
      "authority_defaults": {
        "domain_worker_output": "EvidenceOnly",
        "checked_output": "FactOnly only after independent checker/replay/certificate boundary"
      },
      "must_delegate_math_to": [
        "omega_linear_algebra",
        "omega_functional",
        "omega_homology",
        "omega_solvers",
        "playpen dual-home packages under omega_engine.crates"
      ],
      "relation_to_engine_contract": "not_engine",
      "relation_to_pipeline_contract": "may_be_recorded_by_pipeline_must_not_be_invoked_as_pipeline",
      "relation_to_solver_kernel": "may_sequence_solver_kernel_evidence_only",
      "relation_to_functional_kernel": "must_call_not_reimplement",
      "structural_representation": {
        "input": {
          "struct_name": "DomainWorkerInput",
          "fields": [
            {
              "name": "task_id",
              "type": "TaskId"
            },
            {
              "name": "task_kind",
              "type": "TaskKind"
            },
            {
              "name": "payload_ref",
              "type": "EvidenceRef"
            },
            {
              "name": "math_surface_refs",
              "type": "Vec<MathSurfaceRef>"
            }
          ]
        },
        "output": {
          "struct_name": "DomainWorkerOutput",
          "fields": [
            {
              "name": "task_id",
              "type": "TaskId"
            },
            {
              "name": "status",
              "type": "WorkerStatus"
            },
            {
              "name": "result_ref",
              "type": "EvidenceRef"
            },
            {
              "name": "residual_ref",
              "type": "Option<EvidenceRef>"
            },
            {
              "name": "math_path",
              "type": "Vec<String>"
            },
