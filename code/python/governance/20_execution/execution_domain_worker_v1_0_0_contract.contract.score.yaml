          "authorize_transition",
          "license_transition",
          "self_certify",
          "terminalize(",
          "redefine_phi1",
          "redefine_gamma2",
          "redefine_xi"
        ]
      },
      "required_tests": [
        "domain_worker_authority_effect_is_evidence_only",
