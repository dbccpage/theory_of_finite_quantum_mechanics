      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:execution:domain_worker:v1.0.0\",\n  \"title\": \"DomainWorker\",\n  \"kind\": \"execution_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"06_execution\",\n  \"role\": \"DomainWorker\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"SolverKernel\",\n        \"FunctionalKernel\",\n        \"SearchKernel\",\n        \"Trace\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"StateTransition\",\n        \"ActionLicensing\",\n        \"CertificateSigning\",\n        \"PolicyInterpretation\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"DomainWorker is an EvidenceOnly compute orchestrator for domain tasks (linear algebra, homology, QM diagnostics, residual repair staging). It may call SolverKernel stages, SearchKernel frontiers, and FunctionalKernel residual geometry. It must not claim Engine v1 StateTransition authority, mint ActionLicense, terminalize, certify, or reimplement Φ₁/Γ₂/Ξ outside omega_functional / playpen functional.\\n\",\n    \"non_role\": [\n      \"state_transition\",\n      \"action_license_mint\",\n      \"engine_role_impersonation\",\n      \"residual_geometry_reimplementation\",\n      \"phi_gamma_xi_body_definition\",\n      \"policy_definition\",\n      \"terminal_mapping\",\n      \"certificate_signing\"\n    ],\n    \"authority_defaults\": {\n      \"domain_worker_output\": \"EvidenceOnly\",\n      \"checked_output\": \"FactOnly only after independent checker/replay/certificate boundary\"\n    },\n    \"must_delegate_math_to\": [\n      \"omega_linear_algebra\",\n      \"omega_functional\",\n      \"omega_homology\",\n      \"omega_solvers\",\n      \"playpen dual-home packages under omega_engine.crates\"\n    ],\n    \"relation_to_engine_contract\": \"not_engine\",\n    \"relation_to_pipeline_contract\": \"may_be_recorded_by_pipeline_must_not_be_invoked_as_pipeline\",\n    \"relation_to_solver_kernel\": \"may_sequence_solver_kernel_evidence_only\",\n    \"relation_to_functional_kernel\": \"must_call_not_reimplement\",\n    \"structural_representation\": {\n      \"input\": {\n        \"struct_name\": \"DomainWorkerInput\",\n        \"fields\": [\n          {\n            \"name\": \"task_id\",\n            \"type\": \"TaskId\"\n          },\n          {\n            \"name\": \"task_kind\",\n            \"type\": \"TaskKind\"\n          },\n          {\n            \"name\": \"payload_ref\",\n            \"type\": \"EvidenceRef\"\n          },\n          {\n            \"name\": \"math_surface_refs\",\n            \"type\": \"Vec<MathSurfaceRef>\"\n          }\n        ]\n      },\n      \"output\": {\n        \"struct_name\": \"DomainWorkerOutput\",\n        \"fields\": [\n          {\n            \"name\": \"task_id\",\n            \"type\": \"TaskId\"\n          },\n          {\n            \"name\": \"status\",\n            \"type\": \"WorkerStatus\"\n          },\n          {\n            \"name\": \"result_ref\",\n            \"type\": \"EvidenceRef\"\n          },\n          {\n            \"name\": \"residual_ref\",\n            \"type\": \"Option<EvidenceRef>\"\n          },\n          {\n            \"name\": \"math_path\",\n            \"type\": \"Vec<String>\"\n          },\n          {\n            \"name\": \"output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"DomainWorkerInput -> math crate / playpen PROTO -> FunctionalKernel residual (if needed) -> DomainWorkerOutput (EvidenceOnly) -> optional Checker / Replay / Certificate -> Evaluator only if policy judgment required -> Engine only if ActionLicense already present\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"terminalize(\",\n        \"redefine_phi1\",\n        \"redefine_gamma2\",\n        \"redefine_xi\"\n      ]\n    },\n    \"required_tests\": [\n      \"domain_worker_authority_effect_is_evidence_only\",\n      \"domain_worker_does_not_emit_state_transition\",\n      \"domain_worker_does_not_reimplement_phi1_body\",\n      \"domain_worker_records_math_path\",\n      \"linear_algebra_domain_worker_matmul\",\n      \"linear_algebra_domain_worker_gram_schmidt\"\n    ],\n    \"canonical_invariant\": \"DomainWorker orchestrates EvidenceOnly domain computation and must delegate higher math to declared math crates and functionals. It is never Engine v1.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"DomainWorker\",\n      \"active\": true,\n      \"classification\": \"execution\",\n      \"effect_class\": \"evidence_only\",\n      \"version\": \"1.0.0\",\n      \"note\": \"Extension role; does not mutate urn:omega:execution:engine:v1.0.0\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_execution_contract:v1.0.0\"\n    ]\n  }\n}\n",
