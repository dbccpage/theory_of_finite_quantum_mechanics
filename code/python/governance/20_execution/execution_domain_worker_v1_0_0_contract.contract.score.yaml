              "name": "output_hash",
              "type": "Hash256"
            },
            {
              "name": "authority_effect",
              "type": "AuthorityEffect",
              "default": "EvidenceOnly"
            }
          ]
        }
      },
      "flow": "DomainWorkerInput -> math crate / playpen PROTO -> FunctionalKernel residual (if needed) -> DomainWorkerOutput (EvidenceOnly) -> optional Checker / Replay / Certificate -> Evaluator only if policy judgment required -> Engine only if ActionLicense already present\n",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
