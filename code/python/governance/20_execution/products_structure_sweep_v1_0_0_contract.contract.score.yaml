    "doctrine": {
      "summary": "This contract defines the Omega Structure Sweep product boundary.\n\nThe Structure Sweep takes a mathematical corpus (a paper or encyclopedia slice), has LLM authors\npropose structure-correspondence packets against known mathematics, gates every claim through an\nauthor-blind LLM adjudicator, and routes everything through deterministic host code: a schema\nvalidator, a phase-aware lane router, and a terminalizer. Survivors, kills, obligations, and Lean4\ntargets accumulate in append-only lane files; a final synthesis may cite ONLY filtered survivor\nfacts.\n\nAll authority is host-side and deterministic. The product's `host_terminal_status: Certificate`\nis a PRODUCT-INTERNAL LANE STAMP at evidence_only / LocalReplay ceiling -- NOT an omega Certificate\nartifact. Its sole minting site is `omega_sweep_kernel::terminalize` (Rust rail; the Python rail's\n`scripts/terminalize_rows.py` is the dual-rail equivalent until cutover). A row is stamped IFF\nstrict re-validation is clean AND gated_verdict is ISO|EQUIV|ADJOINT|EMBED AND the witness is\nnonempty AND the host-stamped author_model differs from gate_model. The bridge onto the canonical\nauthority surface maps refusal statuses to the omega_types refusal coproduct and maps the lane\nstamp to NO canonical claim; lifting to Terminal requires the omega_certifiers route (a verified\nreplay), which this product does not take.\n",
      "non_role": [
        "proving correctness by itself",
        "certification (omega-level)",
        "authority upgrade",
        "evaluating mathematical truth inside the validator"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "All LLM output in the sweep is candidate material only (Doctrine 5): authored packets are\nvalidated deterministically before any lane write; gate adjudications pass through\nnormalize_gate_row, which BLANKS every host-owned routing field (status, host_terminal_status,\noutput_lane) before ingest; provenance (author_model, gate_model, worker, provider) is\nhost-stamped from the dispatch manifest and worker identity -- packet bodies can lie and are\nnever trusted for provenance.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Corpus-scale structure-correspondence sweep with deterministic authority rail.",
        "classification": "Product layer -- the Structure Sweep wraps paper-scale claim adjudication."
      },
      "admissibility_checklist": [
        "Pass input bundle is deterministic (fixed file order, sha256 echo contract)",
        "Authors receive ONLY the declared bundle (clean context; citation closure over declared_ids)",
        "Gate is author-blind (manifest-level author_model != gate_model, host-verified)",
        "Lane files are append-only (content-hash dedupe; same id + different content = conflict)",
        "Ingest is idempotent (packet_id@phase index; same-phase re-ingest with new content quarantines)",
        "Pause-before-synthesis gate requires operator approval",
        "Synthesis reads ONLY the four allowed lanes; survived rows without Certificate are filtered"
      ],
      "refusal_conditions": [
        "ForbiddenAnalogyTerm",
        "UndeclaredSymbol",
        "TypeDrift",
        "OpenPromotedToSurvived",
        "AuthorBlindGateViolation",
        "ModelSelfCertificationAttempt",
        "TerminalStatusMismatch",
        "OracleRequiredButClaimedCertificate",
        "LocalGreenGlobalRed",
        "UndeclaredSourceId",
        "UnterminalizedPostGateRow",
        "RunIdEchoMismatch",
        "BundleHashEchoMismatch"
      ],
      "replay_obligation": {
        "description": "Every certified row must be replayable from recorded artifacts.\n",
        "required_fields": [
          "packet_id",
          "run_id + bundle_sha256 echo",
          "author_model / gate_model (host-stamped)",
          "gated_verdict + required_witness",
          "host_terminal_status + output_lane + authority_ceiling",
          "ingest index entry (content_sha256, pass_id, lane)"
        ],
        "note": "Tier A replay parity (re-terminalize committed survivors) and the hostile fixture suite\nare the standing acceptance evidence; see required_tests.\n"
      },
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "certify",
          "terminalize",
          "authority_upgrade",
          "sign_certificate"
        ]
      },
      "required_tests": [
        "hostile_validator_frozen_fixtures_pass",
        "hostile_terminalizer_tf_fixtures_pass",
        "hostile_router_rt_fixtures_pass",
        "hostile_ingest_ig_fixtures_pass",
        "canon_hash_known_answers",
        "replay_parity_tier_a"
      ],
      "canonical_invariant": "The Structure Sweep's only authority is deterministic host code. The validator\nnever emits Certificate or OracleNeeded; gate workers are forbidden to assign routing; the router\nonly moves rows whose terminal status is already stamped and fails closed on anything unstamped;\nthe terminalizer is the sole Certificate-minting site and certifies only strict-clean, witnessed,\nauthor-blind survivor verdicts. The Certificate stamp is product-internal evidence at LocalReplay\nceiling and confers no omega-level authority.\n",
