      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:products:structure_sweep:v1.0.0\",\n  \"title\": \"StructureSweep\",\n  \"kind\": \"product_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"07_products\",\n  \"role\": \"StructureSweep\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"PacketContract\",\n        \"Packetization\",\n        \"SymbolGame\",\n        \"LlmSymbolGameInterface\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Omega Structure Sweep product boundary.\\n\\nThe Structure Sweep takes a mathematical corpus (a paper or encyclopedia slice), has LLM authors\\npropose structure-correspondence packets against known mathematics, gates every claim through an\\nauthor-blind LLM adjudicator, and routes everything through deterministic host code: a schema\\nvalidator, a phase-aware lane router, and a terminalizer. Survivors, kills, obligations, and Lean4\\ntargets accumulate in append-only lane files; a final synthesis may cite ONLY filtered survivor\\nfacts.\\n\\nAll authority is host-side and deterministic. The product's `host_terminal_status: Certificate`\\nis a PRODUCT-INTERNAL LANE STAMP at evidence_only / LocalReplay ceiling -- NOT an omega Certificate\\nartifact. Its sole minting site is `omega_sweep_kernel::terminalize` (Rust rail; the Python rail's\\n`scripts/terminalize_rows.py` is the dual-rail equivalent until cutover). A row is stamped IFF\\nstrict re-validation is clean AND gated_verdict is ISO|EQUIV|ADJOINT|EMBED AND the witness is\\nnonempty AND the host-stamped author_model differs from gate_model. The bridge onto the canonical\\nauthority surface maps refusal statuses to the omega_types refusal coproduct and maps the lane\\nstamp to NO canonical claim; lifting to Terminal requires the omega_certifiers route (a verified\\nreplay), which this product does not take.\\n\",\n    \"non_role\": [\n      \"proving correctness by itself\",\n      \"certification (omega-level)\",\n      \"authority upgrade\",\n      \"evaluating mathematical truth inside the validator\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"All LLM output in the sweep is candidate material only (Doctrine 5): authored packets are\\nvalidated deterministically before any lane write; gate adjudications pass through\\nnormalize_gate_row, which BLANKS every host-owned routing field (status, host_terminal_status,\\noutput_lane) before ingest; provenance (author_model, gate_model, worker, provider) is\\nhost-stamped from the dispatch manifest and worker identity -- packet bodies can lie and are\\nnever trusted for provenance.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Product Layer\",\n      \"role\": \"Corpus-scale structure-correspondence sweep with deterministic authority rail.\",\n      \"classification\": \"Product layer -- the Structure Sweep wraps paper-scale claim adjudication.\"\n    },\n    \"admissibility_checklist\": [\n      \"Pass input bundle is deterministic (fixed file order, sha256 echo contract)\",\n      \"Authors receive ONLY the declared bundle (clean context; citation closure over declared_ids)\",\n      \"Gate is author-blind (manifest-level author_model != gate_model, host-verified)\",\n      \"Lane files are append-only (content-hash dedupe; same id + different content = conflict)\",\n      \"Ingest is idempotent (packet_id@phase index; same-phase re-ingest with new content quarantines)\",\n      \"Pause-before-synthesis gate requires operator approval\",\n      \"Synthesis reads ONLY the four allowed lanes; survived rows without Certificate are filtered\"\n    ],\n    \"refusal_conditions\": [\n      \"ForbiddenAnalogyTerm\",\n      \"UndeclaredSymbol\",\n      \"TypeDrift\",\n      \"OpenPromotedToSurvived\",\n      \"AuthorBlindGateViolation\",\n      \"ModelSelfCertificationAttempt\",\n      \"TerminalStatusMismatch\",\n      \"OracleRequiredButClaimedCertificate\",\n      \"LocalGreenGlobalRed\",\n      \"UndeclaredSourceId\",\n      \"UnterminalizedPostGateRow\",\n      \"RunIdEchoMismatch\",\n      \"BundleHashEchoMismatch\"\n    ],\n    \"replay_obligation\": {\n      \"description\": \"Every certified row must be replayable from recorded artifacts.\\n\",\n      \"required_fields\": [\n        \"packet_id\",\n        \"run_id + bundle_sha256 echo\",\n        \"author_model / gate_model (host-stamped)\",\n        \"gated_verdict + required_witness\",\n        \"host_terminal_status + output_lane + authority_ceiling\",\n        \"ingest index entry (content_sha256, pass_id, lane)\"\n      ],\n      \"note\": \"Tier A replay parity (re-terminalize committed survivors) and the hostile fixture suite\\nare the standing acceptance evidence; see required_tests.\\n\"\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"certify\",\n        \"terminalize\",\n        \"authority_upgrade\",\n        \"sign_certificate\"\n      ]\n    },\n    \"required_tests\": [\n      \"hostile_validator_frozen_fixtures_pass\",\n      \"hostile_terminalizer_tf_fixtures_pass\",\n      \"hostile_router_rt_fixtures_pass\",\n      \"hostile_ingest_ig_fixtures_pass\",\n      \"canon_hash_known_answers\",\n      \"replay_parity_tier_a\"\n    ],\n    \"canonical_invariant\": \"The Structure Sweep's only authority is deterministic host code. The validator\\nnever emits Certificate or OracleNeeded; gate workers are forbidden to assign routing; the router\\nonly moves rows whose terminal status is already stamped and fails closed on anything unstamped;\\nthe terminalizer is the sole Certificate-minting site and certifies only strict-clean, witnessed,\\nauthor-blind survivor verdicts. The Certificate stamp is product-internal evidence at LocalReplay\\nceiling and confers no omega-level authority.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"StructureSweep\",\n      \"role\": \"Corpus-scale structure-correspondence sweep with deterministic authority rail\",\n      \"classification\": \"product\",\n      \"effect_class\": \"none\",\n      \"raw_output_authority_effect\": \"EvidenceOnly\",\n      \"checked_output_authority_effect\": \"FactOnly\",\n      \"promotion_condition\": \"strict_validation_witness_and_author_blind_checks_pass\",\n      \"depends_on\": [\n        \"PacketContract\",\n        \"Packetization\",\n        \"SymbolGame\",\n        \"LlmSymbolGameInterface\"\n      ],\n      \"forbidden_authority\": [\n        \"proving correctness by itself\",\n        \"certification (omega-level)\",\n        \"authority upgrade\",\n        \"evaluating mathematical truth inside the validator\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"StructureSweepLanes\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"Trace\",\n        \"ReplayReport\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator and candidate adjudicator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
