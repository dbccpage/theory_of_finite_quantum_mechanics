        "carrier_does_not_treat_operator_certificate_as_mutation"
      ],
      "canonical_invariant": "Carrier is finite declared cohomological structure. It is not world, ontology, semantic domain,\nembedding space, terminalizer, or executor. Carrier artifacts are EvidenceOnly until checked.\nCarrier mutation requires a licensed Engine transition; certificates and operators do not mutate\ncarrier state by themselves.\n",
