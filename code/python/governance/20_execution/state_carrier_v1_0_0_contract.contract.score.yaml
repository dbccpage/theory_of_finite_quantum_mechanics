            },
            {
              "name": "witness_refs",
              "type": "Vec<WitnessId>"
            },
            {
              "name": "certificate_refs",
              "type": "Vec<CertificateId>"
            },
            {
              "name": "authority_effect",
              "type": "AuthorityEffect",
              "default": "EvidenceOnly"
            }
          ]
        },
        "layer_split_note": "Computational carrier implementations are not authority-bearing by themselves. The intended\nlayer split is:\n\nCarrier\n  exact in-memory computational cochain complex\n  no authority effect\n  no contract promotion\n\nCarrierManifest\n  serializable identity/evidence for exact Carrier\n\nCarrierArtifact\n  contract-level declared carrier record\n  EvidenceOnly by default\n\nCheckedCarrierArtifact\n  checked contract wrapper\n  FactOnly only after validation/certificate refs\n"
      },
      "chain_cochain_law": "A Carrier MUST declare:\n\nd1 ∘ d0 = 0\n\nThe law must be witnessed or certified.\n\nA structure without a declared and checked `d1 ∘ d0 = 0` witness or certificate is not a valid\nchecked cohomological carrier. It may exist only as an unchecked carrier proposal.\n",
      "requires": [
        "$C^0$, $C^1$, $C^2$",
        "$d_0: C^0 \\to C^1$",
        "$d_1: C^1 \\to C^2$",
        "$d_1 \\circ d_0 = 0$",
        "admissible_repair_set",
        "context_family",
        "coefficient_semantics",
        "carrier hash",
        "declared schema",
        "declared repair image",
        "declared context family",
        "chain/cochain law witness or certificate"
      ],
      "must_not": [
        "Be defined as \"world\", \"model\", \"ontology\", \"semantic domain\", or \"embedding space\".",
        "Hide topology in labels.",
        "Infer faces from cycles without declared 2-cells.",
        "Treat embeddings as carrier structure.",
        "Treat LLM latent space as carrier structure."
      ],
      "admissibility_checklist": [
        "Carrier type is declared",
        "Carrier algebra is well-formed (d1 compose d0 = 0)",
        "Dimension/rank is bounded and explicit",
        "Base field is specified",
        "Carrier transitions require a licensed transition executed by Engine. The transition may be supported by a certified fixed-layer effect-class application, but the operator certificate is not itself the state transition.",
        "Admissible repair set is declared",
        "Context family is declared",
        "Coefficient semantics are declared",
        "Carrier hash is deterministic and stable",
        "Chain/cochain law is witnessed or certified"
      ],
      "refusal_conditions": [
        "Untyped carrier (carrier without declared type)",
        "Undeclared carrier transition (state change without certified path)",
        "Carrier mutation without licensed Engine transition",
        "Implicit expressivity change (carrier dimension or rank change without declaration)",
        "Dimension mismatch (declared dimension does not match structure)",
        "Carrier without chain/cochain law witness",
        "Carrier self-modification (carrier acting on itself)",
        {
          "note": "Checked E/I/C/R/M evidence may support a transition license, but cannot mutate carrier state by itself."
        }
      ],
