        "layer_split_note": "Computational carrier implementations are not authority-bearing by themselves. The intended\nlayer split is:\n\nCarrier\n  exact in-memory computational cochain complex\n  no authority effect\n  no contract promotion\n\nCarrierManifest\n  serializable identity/evidence for exact Carrier\n\nCarrierArtifact\n  contract-level declared carrier record\n  EvidenceOnly by default\n\nCheckedCarrierArtifact\n  checked contract wrapper\n  FactOnly only after validation/certificate refs\n"
      },
      "chain_cochain_law": "A Carrier MUST declare:\n\nd1 ∘ d0 = 0\n\nThe law must be witnessed or certified.\n\nA structure without a declared and checked `d1 ∘ d0 = 0` witness or certificate is not a valid\nchecked cohomological carrier. It may exist only as an unchecked carrier proposal.\n",
