            },
            {
              "name": "admissible_repair_set",
              "type": "RepairSetRef"
            },
            {
              "name": "context_family",
              "type": "ContextFamilyRef"
            },
            {
              "name": "coefficient_semantics",
              "type": "CoefficientDomainId"
            },
            {
              "name": "schema_hash",
              "type": "Hash256"
            },
            {
              "name": "carrier_hash",
              "type": "Hash256"
            },
            {
              "name": "chain_law_witness",
              "type": "Option<WitnessId>"
            },
            {
