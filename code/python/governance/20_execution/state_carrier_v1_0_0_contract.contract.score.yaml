    "doctrine": {
      "summary": "This contract defines the Carrier boundary.\n\nCarrier is declared structure, not a live mutable object. Carrier changes require a licensed\ntransition executed by Engine and recorded by Trace.\n\nCarrier is finite declared structure.\nCarrier does not act as world, model, ontology, semantic domain, embedding space, terminalizer,\nor executor.\n",
      "non_role": [
        "mutation without certified transition",
        "self-modification",
        "implicit carrier change"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, or upgrade evidence authority.\n\nLLM output may propose carrier schemas or carrier declarations, but those proposals are\nEvidenceOnly until checked against this contract.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "Certificate authority MUST NOT exceed attached evidence authority. No carrier certificate may\nclaim authority beyond the evidence it binds.\n"
      },
      "classification": {
        "subsystem": "Cohomological Semantics",
        "role": "Finite declared structure.",
        "classification": "State layer -- carrier is NOT an operator. It is the state space that operators act upon. Carrier has no effect-class assignment (effect_class: none). Only the five canonical effect-classes (E, I, C, R, M) are operators."
      },
      "structural_representation": {
        "carrier_artifact": {
          "struct_name": "CarrierArtifact",
          "fields": [
