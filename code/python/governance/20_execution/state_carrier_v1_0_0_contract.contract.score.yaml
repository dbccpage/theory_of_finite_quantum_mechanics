      \"Treat embeddings as carrier structure.\",\n      \"Treat LLM latent space as carrier structure.\"\n    ],\n    \"admissibility_checklist\": [\n      \"Carrier type is declared\",\n      \"Carrier algebra is well-formed (d1 compose d0 = 0)\",\n      \"Dimension/rank is bounded and explicit\",\n      \"Base field is specified\",\n      \"Carrier transitions require a licensed transition executed by Engine. The transition may be supported by a certified fixed-layer effect-class application, but the operator certificate is not itself the state transition.\",\n      \"Admissible repair set is declared\",\n      \"Context family is declared\",\n      \"Coefficient semantics are declared\",\n      \"Carrier hash is deterministic and stable\",\n      \"Chain/cochain law is witnessed or certified\"\n    ],\n    \"refusal_conditions\": [\n      \"Untyped carrier (carrier without declared type)\",\n      \"Undeclared carrier transition (state change without certified path)\",\n      \"Carrier mutation without licensed Engine transition\",\n      \"Implicit expressivity change (carrier dimension or rank change without declaration)\",\n      \"Dimension mismatch (declared dimension does not match structure)\",\n      \"Carrier without chain/cochain law witness\",\n      \"Carrier self-modification (carrier acting on itself)\",\n      {\n        \"note\": \"Checked E/I/C/R/M evidence may support a transition license, but cannot mutate carrier state by itself.\"\n      }\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"world_model\",\n        \"ontology\",\n        \"semantic_domain\",\n        \"embedding_space\",\n        \"latent_space\",\n        \"infer_faces_from_cycles\",\n        \"PolicyDecision\",\n        \"EngineDecision\",\n        \"TerminalEnvelope\",\n        \"ALLOW_OUTPUT\",\n        \"BLOCK_OUTPUT\",\n        \"terminalize(\",\n        \"execute(\",\n        \"mutate_runtime\",\n        \"authorize_transition\",\n        \"score_candidate\",\n        \"quality_score\"\n      ]\n    },\n    \"required_tests\": [\n      \"carrier_authority_effect_defaults_to_evidence_only\",\n      \"checked_carrier_may_promote_to_factonly\",\n      \"carrier_requires_c0_c1_c2\",\n      \"carrier_requires_d0_d1\",\n      \"carrier_verifies_d1_d0_zero\",\n      \"carrier_requires_admissible_repair_set\",\n      \"carrier_requires_context_family\",\n      \"carrier_rejects_world_model_label\",\n      \"carrier_rejects_embedding_space_claim\",\n      \"carrier_rejects_cycles_as_faces_without_declared_2cells\",\n      \"same_carrier_same_hash\",\n      \"carrier_transition_requires_engine_license\",\n      \"carrier_certificate_does_not_execute_transition\",\n      \"carrier_requires_schema_hash\",\n      \"carrier_requires_chain_law_witness_or_certificate\",\n      \"carrier_does_not_treat_operator_certificate_as_mutation\"\n    ],\n    \"canonical_invariant\": \"Carrier is finite declared cohomological structure. It is not world, ontology, semantic domain,\\nembedding space, terminalizer, or executor. Carrier artifacts are EvidenceOnly until checked.\\nCarrier mutation requires a licensed Engine transition; certificates and operators do not mutate\\ncarrier state by themselves.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Carrier\",\n      \"role\": \"Typed algebraic state space over which all computations, measurements, and transformations operate\",\n      \"classification\": \"state\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"TypeAndKindContract\"\n      ],\n      \"forbidden_authority\": [\n        \"mutation without certified transition\",\n        \"self-modification\",\n        \"implicit carrier change\"\n      ],\n      \"primary_output_family\": \"StructureArtifact\",\n      \"domain_output_kind\": \"CarrierArtifact\",\n      \"checked_domain_output_kind\": \"CheckedCarrierArtifact\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
