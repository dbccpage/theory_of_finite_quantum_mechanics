      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:packet:symbol_game:py_presentation_pins:v1.0.0\",\n  \"title\": \"Presentation Pin Registry (Python)\",\n  \"kind\": \"packet_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PacketSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"clean_architecture_layer\": \"domain\",\n    \"refusals\": {\n      \"may_emit\": [\n        \"FW-UNKNOWN-FIELD\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Every rewrite presentation this host recognises, by name. The registry a packet's presentation_ref is resolved against, and the only place a decider may obtain rules.\",\n    \"invariants\": [\n      \"Built in the entrypoint layer from the governance pin file. This type reads no file and accepts no presentation from a packet: a pin set the producer can extend is not a pin set. The Rust side gets the same guarantee from PresentationPins deriving no Deserialize.\",\n      \"resolve() returning None is a statement about THIS HOST, not about the name. A decider must then report UNCHECKABLE with the blind spot named, never a refusal -- the row may be about something legitimate this estate does not pin.\",\n      \"from_wire refuses undeclared fields and duplicate names. Two presentations under one key make every lookup ambiguous, and the key is what presentation_ref resolves against.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"promotion_granter\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\"\n    ]\n  },\n  \"structure\": {\n    \"language\": \"python\",\n    \"python_module\": \"omega_engine_pfp.domain.presentation_pins\",\n    \"python_type\": \"PresentationPins\",\n    \"form\": \"dataclass\",\n    \"fields\": [\n      {\n        \"name\": \"by_name\"\n      }\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "record": {
        "contract_id": "urn:omega:packet:symbol_game:py_presentation_pins:v1.0.0",
        "council_owner": "L3_logos_techne",
        "descriptor": {
          "authority_effect": "None",
          "clean_architecture_layer": "domain",
          "evidence_ceiling": "LocalReplay",
          "refusals": {
            "may_emit": [
              "FW-UNKNOWN-FIELD"
            ]
          },
          "runtime_enforcement": true
        },
        "doctrine": {
          "invariants": [
            "Built in the entrypoint layer from the governance pin file. This type reads no file and accepts no presentation from a packet: a pin set the producer can extend is not a pin set. The Rust side gets the same guarantee from PresentationPins deriving no Deserialize.",
            "resolve() returning None is a statement about THIS HOST, not about the name. A decider must then report UNCHECKABLE with the blind spot named, never a refusal -- the row may be about something legitimate this estate does not pin.",
            "from_wire refuses undeclared fields and duplicate names. Two presentations under one key make every lookup ambiguous, and the key is what presentation_ref resolves against."
          ],
          "non_roles": [
            "authority_source",
            "promotion_granter"
          ],
