      "raw_utf8": "{\n  \"schema_version\": \"v1.0.0\",\n  \"packet_id\": \"urn:omega:packet:omega:pcc_obstruction:v1.0.0\",\n  \"title\": \"Returning Projection-Obstruction Witness & Core Quotient (PCC Setting C)\",\n  \"kind\": \"obstruction_contract\",\n  \"status\": \"Active\",\n  \"layer\": \"Governance / Obstruction Theory\",\n  \"authority_effect\": \"None\",\n  \"formal_anchor\": {\n    \"lean_module\": \"PCC\",\n    \"source_document\": \"lean4/pcc_obstruction.lean\",\n    \"proof_packet\": \"PCC-20260730\",\n    \"frozen_statements\": \"research/proof_packets/pcc_projection_congruence_core/001_frozen_formal_statements.md\",\n    \"estate_anchor\": \"ENC-0209 (Primitive Axiomatics v2.6 §1.8), PO-000 §4.6\"\n  },\n  \"definition\": {\n    \"summary\": \"State-level returning projection-obstruction witness (RPWitness) and core quotient classification (Coarsest Exact Refinement).\",\n    \"witness_structure\": {\n      \"name\": \"RPWitness(M, p)\",\n      \"estate_alias\": \"Critical Context Witness (ENC-0209)\",\n      \"witness_type\": \"State-level witness (WD fork W1)\",\n      \"tuple\": \"(x, y, c)\",\n      \"base_condition\": \"p(x) = p(y)\",\n      \"returning_condition\": \"p(c . x) != p(c . y)\"\n    }\n  },\n  \"theorems\": [\n    {\n      \"id\": \"C1_descends_iff_no_witness\",\n      \"statement\": \"For surjective projection p, action M descends through p iff no RPWitness exists.\"\n    },\n    {\n      \"id\": \"C2_witness_no_reduced\",\n      \"statement\": \"The existence of an RPWitness defeats every memoryless reduced family T (no reduction square can commute).\"\n    },\n    {\n      \"id\": \"C2_invariant_no_witness\",\n      \"statement\": \"A C-invariant kernel admits no returning witness.\"\n    },\n    {\n      \"id\": \"C3_core_quotient\",\n      \"statement\": \"CoreQ(M, p) = X / Core_C(ker p) is the coarsest exact refinement of p.\"\n    },\n    {\n      \"id\": \"C4_universal_property\",\n      \"statement\": \"Every invariant refinement of p factors uniquely through CoreQ(M, p).\"\n    },\n    {\n      \"id\": \"C5_witness_fence\",\n      \"statement\": \"RPWitness is proof-relevant structure. It is a trigger for consideration, NOT authority to lift (lift trigger != lift license, GTOC-3).\"\n    }\n  ],\n  \"laws\": [\n    {\n      \"id\": \"PCC_LAW_01_WITNESS_FENCE\",\n      \"statement\": \"An RPWitness triggers lift consideration but does not mint authority tokens or lift licenses.\"\n    },\n    {\n      \"id\": \"PCC_LAW_02_COARSEST_REFINEMENT\",\n      \"statement\": \"Reductions violating Core_C(ker p) invariance are non-canonical and produce returning defects.\"\n    }\n  ],\n  \"runtime_bindings\": [\n    \"omega_engine.crates.obstruction_theory\",\n    \"omega_engine.crates.projection_obstruction\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
