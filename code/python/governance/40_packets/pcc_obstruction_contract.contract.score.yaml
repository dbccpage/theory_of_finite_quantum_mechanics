    "title": "Returning Projection-Obstruction Witness & Core Quotient (PCC Setting C)",
    "kind": "obstruction_contract",
    "status": "Active",
    "layer": "Governance / Obstruction Theory",
    "authority_effect": "None",
    "formal_anchor": {
      "lean_module": "PCC",
      "source_document": "lean4/pcc_obstruction.lean",
      "proof_packet": "PCC-20260730",
      "frozen_statements": "research/proof_packets/pcc_projection_congruence_core/001_frozen_formal_statements.md",
      "estate_anchor": "ENC-0209 (Primitive Axiomatics v2.6 §1.8), PO-000 §4.6"
    },
    "definition": {
      "summary": "State-level returning projection-obstruction witness (RPWitness) and core quotient classification (Coarsest Exact Refinement).",
      "witness_structure": {
        "name": "RPWitness(M, p)",
        "estate_alias": "Critical Context Witness (ENC-0209)",
        "witness_type": "State-level witness (WD fork W1)",
        "tuple": "(x, y, c)",
        "base_condition": "p(x) = p(y)",
        "returning_condition": "p(c . x) != p(c . y)"
      }
    },
    "theorems": [
      {
        "id": "C1_descends_iff_no_witness",
        "statement": "For surjective projection p, action M descends through p iff no RPWitness exists."
      },
      {
        "id": "C2_witness_no_reduced",
        "statement": "The existence of an RPWitness defeats every memoryless reduced family T (no reduction square can commute)."
      },
      {
        "id": "C2_invariant_no_witness",
        "statement": "A C-invariant kernel admits no returning witness."
      },
      {
        "id": "C3_core_quotient",
        "statement": "CoreQ(M, p) = X / Core_C(ker p) is the coarsest exact refinement of p."
      },
      {
        "id": "C4_universal_property",
        "statement": "Every invariant refinement of p factors uniquely through CoreQ(M, p)."
      },
      {
        "id": "C5_witness_fence",
        "statement": "RPWitness is proof-relevant structure. It is a trigger for consideration, NOT authority to lift (lift trigger != lift license, GTOC-3)."
      }
    ],
    "laws": [
      {
        "id": "PCC_LAW_01_WITNESS_FENCE",
        "statement": "An RPWitness triggers lift consideration but does not mint authority tokens or lift licenses."
      },
      {
        "id": "PCC_LAW_02_COARSEST_REFINEMENT",
        "statement": "Reductions violating Core_C(ker p) invariance are non-canonical and produce returning defects."
      }
    ],
    "runtime_bindings": [
      "omega_engine.crates.obstruction_theory",
      "omega_engine.crates.projection_obstruction"
    ],
    "relationships": {
      "extends": [
        "urn:omega:governance:base_contract:v1.0.0"
      ]
    }
  },
