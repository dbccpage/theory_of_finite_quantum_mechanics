schema_version: omega.contract.v2
contract_id: urn:omega:packet:symbol_game:coda_evaluate_receipt_v1:v1.0.0
title: CODA Evaluate Receipt v1
kind: packet_contract
layer: 40_packets
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit:
    - FW-UNKNOWN-FIELD
    - FW-DUPLICATE-KEY
doctrine:
  summary: 'CodaEvaluateReceiptV1, the answer of the coda_evaluate runtime action:
    diagnostic, routing, and authority axes produced by the Master Normal Form pipeline
    evaluator, bound to the request by input_digest.'
  invariants:
  - The shape declared here is the shape in coda.rs, enforced at compile time by an
    exhaustive destructure.
  - input_digest is framed SHA-256 over the sorted, whitespace-free request JSON under
    domain omega.symbol-game.coda-evaluate-request.v1.
  - 'Carries three distinct axes: diagnostic, routing, and authority.'
  non_roles:
  - authority_source
  - promotion_granter
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  rust_crate: omega_symbol_game
  rust_module: coda
  rust_type: CodaEvaluateReceiptV1
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
  - name: schema_version
  - name: input_digest
  - name: input_id
  - name: diagnostic
  - name: routing
  - name: authority
  - name: detail
  - name: authority_effect
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
