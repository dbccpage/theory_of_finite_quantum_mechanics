  rust_crate: omega_symbol_game
  rust_module: protocol
  rust_type: AdmissionSummaryV1
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
  - name: kind
    rust_type: String
  - name: codes
    rust_type: Vec<String>
  - name: reason_commitment_sha256
    rust_type: String
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
