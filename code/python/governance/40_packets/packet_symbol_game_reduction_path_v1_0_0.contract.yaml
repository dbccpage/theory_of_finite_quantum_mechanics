schema_version: omega.contract.v2
contract_id: urn:omega:packet:symbol_game:reduction_path:v1.0.0
title: Reduction Path
kind: packet_contract
layer: 40_packets
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit:
    - FW-UNKNOWN-FIELD
    - FW-DUPLICATE-KEY
doctrine:
  summary: An ordered sequence of rule applications from a source term to an endpoint.
  invariants:
  - endpoint is producer testimony and is re-derived by the host before use.
  non_roles:
  - authority_source
  - promotion_granter
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  rust_crate: omega_symbol_game_runtime
  rust_module: rewriting
  rust_type: ReductionPath
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
  - name: steps
    rust_type: Vec<ReductionStep>
  - name: endpoint
    rust_type: String
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
