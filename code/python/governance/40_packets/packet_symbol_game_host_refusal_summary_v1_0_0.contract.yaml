schema_version: omega.contract.v2
contract_id: urn:omega:packet:symbol_game:host_refusal_summary:v1.0.0
title: Refusal Summary (Host Wire)
kind: packet_contract
layer: 40_packets
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: infrastructure
  refusals:
    may_emit:
    - FW-UNKNOWN-FIELD
doctrine:
  summary: A typed refusal with the laws it cites.
  invariants:
  - code plus laws is the shape an FW-MOVE refusal needs; it exists already and requires
    no schema change.
  non_roles:
  - authority_source
  - promotion_granter
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  language: rust
  rust_crate: omega_symbol_game
  rust_module: protocol
  rust_type: RefusalSummaryV1
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
  - name: stage
    rust_type: String
  - name: code
    rust_type: String
  - name: detail
    rust_type: String
  - name: laws
    rust_type: Vec<String>
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
