      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:packet:symbol_game:py_derivation:v1.0.0\",\n  \"title\": \"Row Derivation (Python)\",\n  \"kind\": \"packet_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PacketSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"clean_architecture_layer\": \"domain\",\n    \"refusals\": {\n      \"may_emit\": [\n        \"FW-STATEMENT-ILL-FORMED\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"What the host established about one ledger row's statement, on its own and exactly. The type that makes the receipt's terminal ladder reachable: with no decider every admitted row was UNCHECKABLE, so PASS, SELF_CONSISTENT_ONLY and any non-zero hallucination count were structurally unreachable outcomes.\",\n    \"invariants\": [\n      \"A decider is a claim that the host KNOWS the answer, so it must be exactly decidable from the row alone -- no model, no network, no heuristic. A wrong REDERIVED is far worse than an honest blind spot.\",\n      \"REDERIVED and CONTRADICTED both carry host_value. A reader must be able to see what the host held, not merely that it disagreed.\",\n      \"UNCHECKABLE always names its blind spot in missing_fields. 'We did not check that' and 'we cannot know what we did not check' are different admissions, and only the first is auditable.\",\n      \"A statement with no truth value is REFUSED, not CONTRADICTED. `17 mod 0` names no value, so the host holds no contrary answer; charging the producer for it would inflate the hallucination count with the host's own admission policy.\",\n      \"mod is the LEAST NON-NEGATIVE RESIDUE, so -17 mod 5 = 3. Rust, C, C++, Java and Go truncate toward zero and give -2. A Rust re-derivation of the same row would disagree, and would surface as a CONTRADICTED row -- the producer blamed for a difference between two hosts. Pinned by test.\",\n      \"The operator word is matched case-insensitively, which is the OPPOSITE polarity from the op linter and deliberately so. Loosening a closed op set silently enlarges it; loosening a form marker only admits more statements to be checked. Refusing `17 MOD 5 = 99` would file a false claim as UNCHECKABLE and let it escape the hallucination count on a capitalisation.\",\n      \"Deciding is keyed on the statement's FORM, never on the row's op. What the host can compute does not depend on what the producer called it.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"promotion_granter\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\"\n    ]\n  },\n  \"structure\": {\n    \"language\": \"python\",\n    \"python_module\": \"omega_engine_pfp.domain.row_rederivation\",\n    \"python_type\": \"Derivation\",\n    \"form\": \"dataclass\",\n    \"fields\": [\n      {\n        \"name\": \"outcome\"\n      },\n      {\n        \"name\": \"host_value\"\n      },\n      {\n        \"name\": \"missing_fields\"\n      },\n      {\n        \"name\": \"refusal_code\"\n      },\n      {\n        \"name\": \"detail\"\n      }\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
