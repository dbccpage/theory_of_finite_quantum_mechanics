      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:packet:symbol_game:host_pinned_permutation_evaluation:v1.0.0\",\n  \"title\": \"Pinned permutation evaluation alternatives (native runtime)\",\n  \"kind\": \"packet_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PacketSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"clean_architecture_layer\": \"infrastructure\",\n    \"refusals\": {\n      \"may_emit\": [\n        \"FW-UNKNOWN-FIELD\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Separates exact agreement, exact contradiction and an unresolved host-presentation obligation. This is an inner evaluation, not subprocess or workload completion.\",\n    \"invariants\": [\n      \"Wire status uses REDERIVED, CONTRADICTED or OPEN_RESIDUAL. Both REDERIVED and CONTRADICTED retain the independently computed evidence; an unresolved branch does not invent a period or cycles.\",\n      \"An unknown compiled pin emits PRESENTATION_NOT_PINNED. A host-selected presentation outside the finite total-permutation profile emits PINNED_PRESENTATION_NOT_A_TOTAL_PERMUTATION.\",\n      \"All three alternatives are valid successful native dispatches. Neither CONTRADICTED nor OPEN_RESIDUAL may be promoted to a passed workload merely because the runtime envelope has success=true.\",\n      \"The shared build engine checks exhaustive enum alternatives. The serde field and mathematical behavior laws require the actual finite tests; the build engine alone is not their proof.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"promotion_granter\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\"\n    ]\n  },\n  \"structure\": {\n    \"language\": \"rust\