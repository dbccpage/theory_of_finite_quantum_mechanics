      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:products:packetization:v1.0.0\",\n  \"title\": \"Packetization\",\n  \"kind\": \"product_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"07_products\",\n  \"role\": \"Packetization\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"SymbolGame\",\n        \"PacketContract\",\n        \"BoundaryContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"SemanticTruthClaim\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the Packetization product boundary.\\n\\nPacketization translates between:\\n- external envelope: JSON / markdown / API payload\\n- symbol payload: terse Symbol Game grammar\\n- internal packet: typed AST / checked packet representation\\n\\nPacketization does not prove the mathematical claim inside a packet. It emits EvidenceOnly witness\\ndata that the payload was parsed, normalized, typed, and round-tripped according to the declared\\ngrammar and schema.\\n\",\n    \"non_role\": [\n      \"proving mathematical claims\",\n      \"semantic truth claim\",\n      \"certification\",\n      \"validation of semantic correctness\",\n      \"evaluation\",\n      \"terminalization\",\n      \"execution\",\n      \"mutation\",\n      \"authority upgrade\",\n      \"action licensing\",\n      \"transition authorization\",\n      \"grammar authority creation\",\n      \"schema authority creation\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\\nauthorize transitions, execute transitions, define grammar authority, define schema authority,\\nor upgrade evidence authority.\\n\\nAn LLM may produce payloads that are packetized, but packetization only emits parse, normalization,\\ntype, schema, and roundtrip evidence.\\n\\nLLM output carries no authority; downstream boundaries determine semantic validity, evaluation\\nstatus, certificates, licenses, and actions.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Product Layer\",\n      \"role\": \"Translation between external envelopes, symbol payloads, and internal typed packets.\",\n      \"classification\": \"Product layer -- representation and transport boundary.\"\n    },\n    \"translation_types\": [\n      {\n        \"external_envelope\": \"JSON / markdown / API payload\"\n      },\n      {\n        \"symbol_payload\": \"terse Symbol Game grammar\"\n      },\n      {\n        \"internal_packet\": \"typed AST / checked packet representation\"\n      }\n    ],\n    \"structural_representation\": {\n      \"packetization_witness\": {\n        \"struct_name\": \"PacketizationWitness\",\n        \"fields\": [\n          {\n            \"name\": \"packet_id\",\n            \"type\": \"PacketId\"\n          },\n          {\n            \"name\": \"grammar_id\",\n            \"type\": \"GrammarId\"\n          },\n          {\n            \"name\": \"schema_ref\",\n            \"type\": \"SchemaRef\"\n          },\n          {\n            \"name\": \"schema_version\",\n            \"type\": \"SchemaVersion\"\n          },\n          {\n            \"name\": \"raw_payload_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"normalized_payload_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"ast_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"parser_version\",\n            \"type\": \"ParserVersion\"\n          },\n          {\n            \"name\": \"renderer_version\",\n            \"type\": \"RendererVersion\"\n          },\n          {\n            \"name\": \"roundtrip_status\",\n            \"type\": \"RoundtripStatus\"\n          },\n          {\n            \"name\": \"witness_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"packetization_output\": {\n        \"struct_name\": \"PacketizationOutput\",\n        \"fields\": [\n          {\n            \"name\": \"packet_id\",\n            \"type\": \"PacketId\"\n          },\n          {\n            \"name\": \"packet_kind\",\n            \"type\": \"PacketKind\"\n          },\n          {\n            \"name\": \"ast_ref\",\n            \"type\": \"AstRef\"\n          },\n          {\n            \"name\": \"witness_ref\",\n            \"type\": \"WitnessId\"\n          },\n          {\n            \"name\": \"packet_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      }\n    },\n    \"admissibility_checklist\": [\n      \"Grammar ID is declared\",\n      \"Schema version is declared\",\n      \"Payload uses allowed alphabet\",\n      \"Payload parses unambiguously\",\n      \"Parsed AST matches packet kind\",\n      \"Normal form is deterministic\",\n      \"Roundtrip is lossless\",\n      \"Budgets are respected\",\n      \"Packetization witness hash is computed\",\n      \"Packet hash is computed\"\n    ],\n    \"admissibility_note\": \"Admissibility here means admissible for packet intake, not semantically valid, true, accepted, licensed, or executable.\",\n    \"refusal_conditions\": [\n      \"invalid character\",\n      \"grammar violation\",\n      \"ambiguous parse\",\n      \"unknown packet kind\",\n      \"schema mismatch\",\n      \"roundtrip mismatch\",\n      \"noncanonical normal form\",\n      \"payload exceeds budget\",\n      \"hidden natural-language escape\"\n    ],\n    \"roundtrip_obligation\": {\n      \"description\": \"Packetization must support deterministic lossless roundtrip:\\n  payload -> parse -> AST -> normalize -> render -> parse -> same AST\\n\",\n      \"required_witness_fields\": [\n        \"packet_id\",\n        \"grammar_id\",\n        \"schema_version\",\n        \"raw_payload_hash\",\n        \"normalized_payload_hash\",\n        \"ast_hash\",\n        \"parser_version\",\n        \"renderer_version\",\n        \"roundtrip_status\"\n      ],\n      \"note\": \"A packetization witness proves grammar and representation integrity only. It does not prove\\nsemantic correctness. If certification is required, CertificateKernel may seal a certificate\\nover the packetization witness. Packetization itself does not create certificates.\\n\"\n    },\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"certify(\",\n        \"validate_semantics\",\n        \"evaluate_admissibility\",\n        \"execute_transition\",\n        \"prove_claim\",\n        \"terminalize(\",\n        \"authority_upgrade\",\n        \"sign_certificate\",\n        \"create_certificate\",\n        \"mutate_carrier\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"create_grammar_authority\",\n        \"create_schema_authority\"\n      ]\n    },\n    \"required_tests\": [\n      \"packetization_roundtrip_is_lossless\",\n      \"packetization_rejects_ambiguous_parse\",\n      \"packetization_witness_does_not_certify\",\n      \"packetization_rejects_undeclared_grammar\",\n      \"packetization_rejects_budget_exceeded\",\n      \"packetization_normal_form_is_deterministic\",\n      \"packetization_output_defaults_to_evidence_only\",\n      \"packetization_witness_defaults_to_evidence_only\",\n      \"packetization_does_not_validate_semantic_correctness\",\n      \"packetization_does_not_create_certificates\",\n      \"packetization_does_not_create_grammar_authority\",\n      \"packetization_does_not_create_schema_authority\",\n      \"packetization_does_not_authorize_transition\",\n      \"packetization_does_not_emit_action_license\",\n      \"packetization_witness_hash_is_computed\",\n      \"packetization_packet_hash_is_computed\"\n    ],\n    \"canonical_invariant\": \"Packetization is an EvidenceOnly representation/transport boundary. It translates external envelopes,\\nsymbol payloads, and internal typed packets through declared grammar, schema, parsing, normalization,\\nand deterministic roundtrip evidence. It does not prove semantic truth, certify, evaluate, license,\\nauthorize, mutate, terminalize, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Packetization\",\n      \"role\": \"Translation between external envelopes, symbol payloads, and internal typed packets\",\n      \"classification\": \"product\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"SymbolGame\",\n        \"PacketContract\",\n        \"BoundaryContract\"\n      ],\n      \"forbidden_authority\": [\n        \"proving mathematical claims\",\n        \"semantic truth claim\",\n        \"certification\",\n        \"validation of semantic correctness\",\n        \"evaluation\",\n        \"terminalization\",\n        \"execution\",\n        \"mutation\",\n        \"authority upgrade\",\n        \"action licensing\",\n        \"transition authorization\",\n        \"grammar authority creation\",\n        \"schema authority creation\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"referenced_output_families\": [\n        \"StructureArtifact\",\n        \"EvidenceEnvelope\",\n        \"Record\"\n      ],\n      \"referenced_domain_kinds\": [\n        \"WitnessEnvelope\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_product_contract:v1.0.0\"\n    ]\n  }\n}\n",
