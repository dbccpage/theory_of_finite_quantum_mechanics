      "summary": "This contract defines the Packetization product boundary.\n\nPacketization translates between:\n- external envelope: JSON / markdown / API payload\n- symbol payload: terse Symbol Game grammar\n- internal packet: typed AST / checked packet representation\n\nPacketization does not prove the mathematical claim inside a packet. It emits EvidenceOnly witness\ndata that the payload was parsed, normalized, typed, and round-tripped according to the declared\ngrammar and schema.\n",
