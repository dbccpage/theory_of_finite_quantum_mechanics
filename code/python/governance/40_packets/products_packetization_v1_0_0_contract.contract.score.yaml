tization only emits\n      parse, normalization,\n\n      type, schema, and roundtrip evidence.\n\n\n      LLM output carries no authority; downstream boundaries determine semantic validity,\n      evaluation\n\n      status, certificates, licenses, and actions.\n\n      '\n  classification:\n    subsystem: Product Layer\n    role: Translation between external envelopes, symbol payloads, and internal typed\n      packets.\n    classification: Product layer -- representation and transport boundary.\n  translation_types:\n  - external_envelope: JSON / markdown / API payload\n  - symbol_payload: terse Symbol Game grammar\n  - internal_packet: typed AST / checked packet representation\n  structural_representation:\n    packetization_witness:\n      struct_name: PacketizationWitness\n      fields:\n      - name: packet_id\n        type: PacketId\n      - name: grammar_id\n        type: GrammarId\n      - name: schema_ref\n        type: SchemaRef\n      - name: schema_version\n        type: SchemaVersion\n      - name: raw_payload_hash\n        type: Hash256\n      - name: normalized_payload_hash\n        type: Hash256\n      - name: ast_hash\n        type: Hash256\n      - name: parser_version\n        type: ParserVersion\n      - name: renderer_version\n        type: RendererVersion\n      - name: roundtrip_status\n        type: RoundtripStatus\n      - name: witness_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n    packetization_output:\n      struct_name: PacketizationOutput\n      fields:\n      - name: packet_id\n        type: PacketId\n      - name: packet_kind\n        type: PacketKind\n      - name: ast_ref\n        type: AstRef\n      - name: witness_ref\n        type: WitnessId\n      - name: packet_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n  admissibility_checklist:\n  - Grammar ID is declared\n  - Schema version is declared\n  - Payload uses allowed alphabet\n  - Payload parses unambiguously\n  - Parsed AST matches packet kind\n  - Normal form is deterministic\n  - Roundtrip is lossless\n  - Budgets are respected\n  - Packetization witness hash is computed\n  - Packet hash is computed\n  admissibility_note: Admissibility here means admissible for packet intake, not semantically\n    valid, true, accepted, licensed, or executable.\n  refusal_conditions:\n  - invalid character\n  - grammar violation\n  - ambiguous parse\n  - unknown packet kind\n  - schema mismatch\n  - roundtrip mismatch\n  - noncanonical normal form\n  - payload exceeds budget\n  - hidden natural-language escape\n  roundtrip_obligation:\n    description: \"Packetization must support deterministic lossless roundtrip:\\n \\\n      \\ payload -> parse -> AST -> normalize -> render -> parse -> same AST\\n\"\n    required_witness_fields:\n    - packet_id\n    - grammar_id\n    - schema_version\n    - raw_payload_hash\n    - normalized_payload_hash\n    - ast_hash\n    - parser_version\n    - renderer_version\n    - roundtrip_status\n    note: 'A packetization witness proves grammar and representation integrity only.\n      It does not prove\n\n      semantic correctness. If certification is required, CertificateKernel may seal\n      a certificate\n\n      over the packetization witness. Packetization itself does not create certificates.\n\n      '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - certify(\n    - validate_semantics\n    - evaluate_admissibility\n    - execute_transition\n    - prove_claim\n    - terminalize(\n    - authority_upgrade\n    - sign_certificate\n    - create_certificate\n    - mutate_carrier\n    - authorize_transition\n    - license_transition\n    - create_grammar_authority\n    - create_schema_authority\n  required_tests:\n  - packetization_roundtrip_is_lossless\n  - packetization_rejects_ambiguous_parse\n  - packetization_witness