      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, define grammar authority, define schema authority,\nor upgrade evidence authority.\n\nAn LLM may produce payloads that are packetized, but packetization only emits parse, normalization,\ntype, schema, and roundtrip evidence.\n\nLLM output carries no authority; downstream boundaries determine semantic validity, evaluation\nstatus, certificates, licenses, and actions.\n"
      },
