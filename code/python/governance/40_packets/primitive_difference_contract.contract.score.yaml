      "raw_utf8": "{\n  \"schema_version\": \"v1.0.0\",\n  \"packet_id\": \"urn:omega:packet:omega:primitive_difference:v1.0.0\",\n  \"title\": \"Primitive Difference & Residual Quotient Complex\",\n  \"kind\": \"math_contract\",\n  \"status\": \"Active\",\n  \"layer\": \"Governance / Core Axiomatics\",\n  \"authority_effect\": \"None\",\n  \"formal_anchor\": {\n    \"lean_module\": \"OmegaCore.PrimitiveDifference\",\n    \"source_document\": \"lean4/primitive_difference.lean\"\n  },\n  \"definition\": {\n    \"summary\": \"Minimum data and algebraic machinery for zero-difference relations, residual quotients, and delta descent.\",\n    \"tuple_specification\": {\n      \"alpha\": \"Base state space or object domain.\",\n      \"beta\": \"Difference codomain space.\",\n      \"delta\": \"Primitive difference operator delta: alpha -> alpha -> beta.\",\n      \"Zero\": \"Typed zero predicate Zero: beta -> Prop on difference codomain.\"\n    },\n    \"axioms\": {\n      \"zero_refl\": \"forall x in alpha, Zero(delta(x, x))\",\n      \"zero_symm\": \"forall x, y in alpha, Zero(delta(x, y)) -> Zero(delta(y, x))\",\n      \"zero_trans\": \"forall x, y, z in alpha, Zero(delta(x, y)) -> Zero(delta(y, z)) -> Zero(delta(x, z))\"\n    }\n  },\n  \"core_structures\": {\n    \"ZeroRel\": \"Equivalence relation x ~ y iff Zero(delta(x, y)).\",\n    \"ResidualQuotient\": \"Canonical quotient space alpha / ZeroRel.\",\n    \"classOf\": \"Canonical class projection map alpha -> ResidualQuotient.\",\n    \"DeltaCongruent\": \"Congruence condition under which delta(x, y) = delta(x', y') for all x ~ x' and y ~ y'.\",\n    \"deltaFactor\": \"Descended difference operator delta_bar: ResidualQuotient x ResidualQuotient -> beta.\"\n  },\n  \"theorems\": [\n    {\n      \"id\": \"classOf_eq_iff_zeroRel\",\n      \"statement\": \"classOf(x) = classOf(y) iff ZeroRel(x, y).\"\n    },\n    {\n      \"id\": \"deltaFactor_requires_congruence\",\n      \"statement\": \"delta factors through ResidualQuotient iff DeltaCongruent holds.\"\n    },\n    {\n      \"id\": \"invariantFactor_exists_iff_invariantCongruent\",\n      \"statement\": \"Single-relation factorization machinery for action-invariant primitive differences.\"\n    }\n  ],\n  \"laws\": [\n    {\n      \"id\": \"PD_LAW_01_NO_EQUIVALENCE_WITHOUT_ZERO\",\n      \"statement\": \"Equivalence classes in ResidualQuotient require explicit Zero predicate certification.\"\n    },\n    {\n      \"id\": \"PD_LAW_02_DELTA_DESCENT\",\n      \"statement\": \"Difference operators shall not descend to quotient spaces unless DeltaCongruent is proven.\"\n    }\n  ],\n  \"runtime_bindings\": [\n    \"omega_engine.crates.type.primitive_difference\",\n    \"omega_engine.crates.homotopy_type_theory.primitive_difference\"\n  ],\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
