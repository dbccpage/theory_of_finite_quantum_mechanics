      "record": {
        "schema_version": "v1.0.0",
        "packet_id": "urn:omega:packet:omega:primitive_difference:v1.0.0",
        "title": "Primitive Difference & Residual Quotient Complex",
        "kind": "math_contract",
        "status": "Active",
        "layer": "Governance / Core Axiomatics",
        "authority_effect": "None",
        "formal_anchor": {
          "lean_module": "OmegaCore.PrimitiveDifference",
          "source_document": "lean4/primitive_difference.lean"
        },
        "definition": {
          "summary": "Minimum data and algebraic machinery for zero-difference relations, residual quotients, and delta descent.",
          "tuple_specification": {
            "alpha": "Base state space or object domain.",
            "beta": "Difference codomain space.",
            "delta": "Primitive difference operator delta: alpha -> alpha -> beta.",
            "Zero": "Typed zero predicate Zero: beta -> Prop on difference codomain."
          },
          "axioms": {
            "zero_refl": "forall x in alpha, Zero(delta(x, x))",
            "zero_symm": "forall x, y in alpha, Zero(delta(x, y)) -> Zero(delta(y, x))",
            "zero_trans": "forall x, y, z in alpha, Zero(delta(x, y)) -> Zero(delta(y, z)) -> Zero(delta(x, z))"
          }
        },
        "core_structures": {
          "ZeroRel": "Equivalence relation x ~ y iff Zero(delta(x, y)).",
          "ResidualQuotient": "Canonical quotient space alpha / ZeroRel.",
          "classOf": "Canonical class projection map alpha -> ResidualQuotient.",
          "DeltaCongruent": "Congruence condition under which delta(x, y) = delta(x', y') for all x ~ x' and y ~ y'.",
          "deltaFactor": "Descended difference operator delta_bar: ResidualQuotient x ResidualQuotient -> beta."
        },
        "theorems": [
          {
            "id": "classOf_eq_iff_zeroRel",
            "statement": "classOf(x) = classOf(y) iff ZeroRel(x, y)."
          },
          {
            "id": "deltaFactor_requires_congruence",
            "statement": "delta factors through ResidualQuotient iff DeltaCongruent holds."
          },
          {
            "id": "invariantFactor_exists_iff_invariantCongruent",
            "statement": "Single-relation factorization machinery for action-invariant primitive differences."
          }
        ],
        "laws": [
          {
            "id": "PD_LAW_01_NO_EQUIVALENCE_WITHOUT_ZERO",
            "statement": "Equivalence classes in ResidualQuotient require explicit Zero predicate certification."
          },
          {
            "id": "PD_LAW_02_DELTA_DESCENT",
            "statement": "Difference operators shall not descend to quotient spaces unless DeltaCongruent is proven."
          }
        ],
        "runtime_bindings": [
          "omega_engine.crates.type.primitive_difference",
          "omega_engine.crates.homotopy_type_theory.primitive_difference"
        ],
        "relationships": {
          "extends": [
            "urn:omega:governance:base_contract:v1.0.0"
          ]
        }
      },
