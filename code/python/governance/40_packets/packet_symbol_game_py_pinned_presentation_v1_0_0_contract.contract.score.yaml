    "doctrine": {
      "summary": "A finite rewrite presentation this host recognises, under a name. The name is the lookup key a row's presentation_ref and the period(NAME) decider resolve against, so it is part of the wire contract and renaming one is not cosmetic.",
      "invariants": [
        "successor_map returns None unless the rules form a TOTAL PERMUTATION of the signature. Four failures are checked rather than assumed: a rule whose sides are not single symbols, two rules sharing a left-hand side, a signature symbol with no rule, and right-hand sides that are not onto.",
        "period is the ORDER of the permutation -- the lowest common multiple of the cycle lengths -- not the size of the signature. Those coincide for c5 and diverge the moment a presentation has two orbits, so returning len(signature) would be right for the one pin this estate has and wrong in general.",
        "apply_successor indexes into the orbit rather than iterating. The PRODUCER chooses the exponent, so iterating would hand it a lever on the host's running time."
      ],
      "non_roles": [
        "authority_source",
        "promotion_granter"
      ],
      "required_negative_capabilities": [
        "no_self_certification",
        "no_implicit_authority_upgrade"
      ]
    },
