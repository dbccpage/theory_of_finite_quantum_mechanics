schema_version: omega.contract.v2
contract_id: urn:omega:packet:symbol_game:stop_reason:v1.0.0
title: Stop Reason
kind: packet_contract
layer: 40_packets
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit:
    - FW-UNKNOWN-FIELD
    - FW-DUPLICATE-KEY
doctrine:
  summary: 'Why a search stopped. The distinction merge spec acceptance criterion
    14 turns on: a budget that ran out is `BoundedWithOpenFrontier`, never `Exhausted`.
    Only a search that actually inspected every branch may claim exhaustion.'
  invariants:
  - The shape declared here is the shape in packets.rs, enforced at compile time by
    an exhaustive match.
  - This type does NOT declare deny_unknown_fields, so an undeclared field on the
    wire is silently dropped. Recorded here as a known gap rather than implied to
    be closed.
  non_roles:
  - authority_source
  - promotion_granter
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  rust_crate: omega_symbol_game_runtime
  rust_module: packets
  rust_type: StopReason
  form: enum
  variants:
  - Exhausted
  - BoundedWithOpenFrontier
  - TerminalProposed
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
