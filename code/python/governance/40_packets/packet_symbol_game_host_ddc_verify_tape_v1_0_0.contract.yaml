schema_version: omega.contract.v2
contract_id: urn:omega:packet:symbol_game:host_ddc_verify_tape:v1.0.0
title: Host DDC Verify Tape Request
kind: packet_contract
layer: 40_packets
role: PacketSpecification
status: active
council_owner: L3_logos_techne
descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: infrastructure
  refusals:
    may_emit:
    - FW-UNKNOWN-FIELD
doctrine:
  summary: Replays a DDC tape through letter step laws and the tape control automaton,
    returning lawful status, receipt head, and violations.
  invariants:
  - AuthorityEffect is strictly None.
  non_roles:
  - authority_source
  - promotion_granter
  required_negative_capabilities:
  - no_self_certification
  - no_implicit_authority_upgrade
structure:
  language: rust
  rust_crate: omega_symbol_game
  rust_module: ddc
  rust_type: DdcVerifyTapeRequestV1
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
  - name: initial_state
    rust_type: DdcTapeStateWire
  - name: steps
    rust_type: Vec<DdcTapeStepWire>
  - name: genesis_root
    rust_type: Option<String>
relationships:
  extends:
  - urn:omega:governance:base_contract:v1.0.0
