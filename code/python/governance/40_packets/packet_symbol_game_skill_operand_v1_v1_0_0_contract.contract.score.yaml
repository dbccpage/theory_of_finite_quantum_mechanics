      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:packet:symbol_game:skill_operand_v1:v1.0.0\",\n  \"title\": \"Skill Operand v1\",\n  \"kind\": \"packet_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PacketSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"clean_architecture_layer\": \"infrastructure\",\n    \"refusals\": {\n      \"may_emit\": [\n        \"OPERAND_TOO_LARGE\",\n        \"COLOUR_MISMATCH\",\n        \"UNPROMOTED_OPERAND_REFUSED\",\n        \"PRECONDITION_UNMET\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"SkillOperandV1 represents a learned, modular operadic rewrite or prompt composition block that can be injected into candidate generation prompts. Operands must satisfy size constraints (<= 400 tokens, <= 1600 bytes) and must be promoted via the admission pipeline before injection.\",\n    \"invariants\": [\n      \"Operands are injected if and only if status is 'promoted', colours match under partial_compose, and preconditions hold.\",\n      \"Candidate or suppressed operands are strictly prohibited from prompt injection.\",\n      \"Total size of a single operand must not exceed 1600 bytes and 400 estimated tokens.\",\n      \"At most 3 promoted operands (<= 1200 tokens) may be injected into a single prompt.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"truth_oracle\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\"\n    ]\n  },\n  \"structure\": {\n    \"rust_crate\": \"omega_symbol_game_runtime\",\n    \"rust_module\": \"operand\",\n    \"rust_type\": \"SkillOperandV1\",\n    \"form\": \"struct\",\n    \"serde\": {\n      \"deny_unknown_fields\": true\n    },\n    \"fields\": [\n      {\n        \"name\": \"operand_id\"\n      },\n      {\n        \"name\": \"title\"\n      },\n      {\n        \"name\": \"description\"\n      },\n      {\n        \"name\": \"source_colour\"\n      },\n      {\n        \"name\": \"target_colour\"\n      },\n      {\n        \"name\": \"ddc_motif\"\n      },\n      {\n        \"name\": \"content_bytes_len\"\n      },\n      {\n        \"name\": \"token_estimate\"\n      },\n      {\n        \"name\": \"status\"\n      },\n      {\n        \"name\": \"prompt_injection_text\"\n      },\n      {\n        \"name\": \"replay_evidence_hash\"\n      },\n      {\n        \"name\": \"authority_effect\"\n      }\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
