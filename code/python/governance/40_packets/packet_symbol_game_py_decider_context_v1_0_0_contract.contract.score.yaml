    "doctrine": {
      "summary": "Everything a row decider may consult, and every part of it host-side. Never on a wire; contracted because its shape is the boundary between what the host knows and what the packet said.",
      "invariants": [
        "presentation is already RESOLVED when this object is built. The packet contributed a name and the lookup happened against the host pins beforehand, so no decider can be handed rules a producer wrote.",
        "presentation_ref records the name the packet asked for even when it resolved to nothing, so a blind spot can say WHICH name went unfound.",
        "Empty is the honest default. A decider needing something absent reports UNCHECKABLE and names what was missing; it never falls back to whatever single presentation happens to be pinned, which would report REDERIVED having guessed the subject of the sentence."
      ],
