      "summary": "A peak verdict together with the provenance of the rules that produced it. The verdict alone is presentation-relative and reads as a host guarantee it is not; this packet is what makes the difference visible on the wire.",
      "invariants": [
        "presentation_digest is derived by the host from the presentation it evaluated, never copied from the claim.",
        "A decision verdict (Joined or NotJoinable) reached under a ProducerDeclared presentation is reported by token() as SELF_CONSISTENT_ONLY, never as JOINED or NOT_JOINABLE.",
        "NeedsEvidence and BoundedWithUnjoinedPeak decide nothing, so provenance does not change their token.",
        "The FW-PRESENTATION-UNKNOWN obligation is raised whenever the presentation is unpinned, whatever the verdict is: it is a fact about the rules, not about the claim.",
        "The verdict is never suppressed. The join really does exist under the declared rules; what is withheld is the host's endorsement of it."
      ],
      "non_roles": [
