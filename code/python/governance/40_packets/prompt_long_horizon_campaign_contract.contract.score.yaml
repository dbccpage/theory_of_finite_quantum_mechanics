      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:prompt:long_horizon_campaign:v1.0.0\",\n  \"title\": \"Long Horizon Shared Campaign Contract\",\n  \"kind\": \"prompt_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PromptSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_nous_glossa\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"clean_architecture_layer\": \"domain\",\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:governance:base_contract:v1.0.0\"\n      ],\n      \"lean4_theorems\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": [\n        \"REFUSAL_INVALID_ARGUMENTS\",\n        \"REFUSAL_GATE_FAILED\",\n        \"REFUSAL_INVARIANT_BREACH\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ],\n    \"realizes\": []\n  },\n  \"doctrine\": {\n    \"summary\": \"Shared multi-session campaign law for all domain looping goal prompts under omega_engine/research/prompts/. Domain loops MUST point here or paste L0–L11.\",\n    \"invariants\": [\n      \"Every agent output, receipt, test green, Lean green, and packet has AuthorityEffect: None.\",\n      \"Human-only transition: READY_FOR_AUTHOR_REVIEW -> PROMOTED (/human-promotion-firewall).\",\n      \"Close exactly one primary target / story / residual ID per cycle.\",\n      \"No silent halts: A campaign loop must never stop without an explicit stated reason.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"promotion_granter\",\n      \"implicit_coercion\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\",\n      \"no_silent_halt\"\n    ]\n  },\n  \"specification\": {\n    \"rules\": {\n      \"L0_authority_and_promotion\": [\n        \"Every agent output, receipt, test green, Lean green, and packet has AuthorityEffect: None.\",\n        \"Human-only transition: READY_FOR_AUTHOR_REVIEW -> PROMOTED (/human-promotion-firewall).\",\n        \"No GlobalGreen from agent packaging. Green referee / host gate results are evidence-class only.\",\n        \"Prefer pointers to live files over copying doctrine into prompts. Live control law wins over embedded snapshots.\"\n      ],\n      \"L1_one_primary_target_per_cycle\": [\n        \"Close exactly one primary target / story / residual ID per cycle (or one documented blocking dependency).\",\n        \"Side effects (ledger notes, index fixes, map-lag reports) are allowed; a second primary target is not.\",\n        \"Where DERIV-MASTER / derivation order applies: serial waves. Parallel only within a wave on disjoint targets.\"\n      ],\n      \"L2_dual_channel_packet_discipline\": [\n        \"Load-bearing work ships as a named packet or residual row under support / proof_packets root — not as chat-only conclusions.\",\n        \"Packets may request terminals; they do not self-certify TerminalWithinScope or wave exit.\",\n        \"ODP law: no promotion of governed artifacts without a declared obstruction / residual packet.\"\n      ],\n      \"L3_resume_protocol\": {\n        \"cold_start\": \"No active RUN_ID directory under support root -> Stage 0A\",\n        \"resume\": \"Active RUN_ID with incomplete handoff card -> L3.1\",\n        \"re_admit\": \"Caller pins a different residual/target -> Stage 0A with new RUN_ID\",\n        \"l3_1_steps\": [\n          \"Read <SUPPORT_ROOT>/<RUN_ID>/00_history_snapshot.json.\",\n          \"Read SESSION_HANDOFF_CARD.md. If missing -> reconstruct from receipts only; mark prior PASS as STALE_UNTIL_REHOST.\",\n          \"Rehash control-law / freeze / roadmap bytes cited in handoff card. Invalidate any PASS whose carrier hash drifted.\",\n          \"Re-run Black Host gates that close open stage.\",\n          \"State exactly one next legal action; refuse multi-target catch-up.\"\n        ]\n      },\n      \"L4_session_handoff_card_receipt\": {\n        \"handoff_card_path\": \"<SUPPORT_ROOT>/<RUN_ID>/SESSION_HANDOFF_CARD.md\",\n        \"evidence_receipt_path\": \".agents/rip_runs_evidence/rip-programs/<domain>/<RUN_ID>_receipt.yaml\"\n      },\n      \"L5_anti_collapse_rules\": [\n        {\n          \"failure\": \"Finish the whole estate this session\",\n          \"behavior\": \"Select one primary ID; list rest as disposition only\"\n        },\n        {\n          \"failure\": \"Re-proving closed capital as dream debt\",\n          \"behavior\": \"Cite live map/freeze; skip re-walk\"\n        },\n        {\n          \"failure\": \"Baking snapshot tables as current truth\",\n          \"behavior\": \"Run status refresh; report map_lag\"\n        },\n        {\n          \"failure\": \"Silent multi-wave / multi-target advance\",\n          \"behavior\": \"Serial gate; one ID\"\n        },\n        {\n          \"failure\": \"Chat conclusion without receipt path\",\n          \"behavior\": \"Write handoff card + named receipt\"\n        },\n        {\n          \"failure\": \"Agent self-promotion / GlobalGreen\",\n          \"behavior\": \"/human-promotion-firewall refuse\"\n        },\n        {\n          \"failure\": \"Inventing parallel crates/trees\",\n          \"behavior\": \"Use declared surfaces only\"\n        }\n      ],\n      \"L6_status_snapshot_policy\": [\n        \"Embedded capital tables in domain prompts are illustrative at prompt-revision date only.\",\n        \"Each invocation must re-read live control law / roadmap / freeze and report map_lag = NONE | DRIFT | FICTION.\"\n      ],\n      \"L7_receipt_and_run_identity\": [\n        \"Freeze RUN_ID before Stage 0A writes (RUN_<DOMAIN>_<TARGET_OR_WAVE>_<YYYYMMDD>).\",\n        \"Do not reuse a closed RUN_ID directory for a different primary target.\",\n        \"All Rust gates: cargo ... -j 1 (LLVM OOM law).\"\n      ],\n      \"L8_end_of_cycle_mandatory_box\": [\n        \"1. What it supports\",\n        \"2. What it does not support\",\n        \"3. Narrowest defensible claim\",\n        \"4. Next test / gate\",\n        \"5. Target ID + terminal requested (not derived)\",\n        \"6. AuthorityEffect: None\",\n        \"7. Path to SESSION_HANDOFF_CARD.md\"\n      ],\n      \"L9_typed_halt_reasons\": {\n        \"BUDGET_EXHAUSTED\": \"Repair/dialogue budget hit; write residual packet for next session\",\n        \"UNAUTHORIZED_CONTINUE\": \"Next step would mint authority, promote, or cross freeze\",\n        \"MAP_LAG_FICTION\": \"Prompt table contradicts disk and was about to be used as truth\",\n        \"GATE_FAILED\": \"Host gate red; residualize, do not package READY\",\n        \"EXTERNAL_ROLE_REQUIRED\": \"Human author/review/promotion/credentials only\",\n        \"SECOND_PRIMARY_REFUSED\": \"Attempted multi-target cycle\",\n        \"MISSING_PACKET_FIELDS\": \"Residual/packet incomplete\",\n        \"SIBLING_HANDOFF\": \"Work belongs to another loop\"\n      },\n      \"L10_paper_review_and_extension_engine\": [\n        \"Load existing paper or research document under published/ or library/.\",\n        \"Evaluate claim ledger, proof steps, and test evidence against active control law.\",\n        \"Propose next-level extension (v1.0 -> v2.0 pre-print).\",\n        \"All edits remain under AuthorityEffect: None and require human authorization.\"\n      ],\n      \"L11_anti_halt_law\": [\n        \"NO SILENT HALTS: A campaign loop MUST NEVER stop without an explicit stated reason.\",\n        \"Must explicitly emit Next Best Recommended Action / Change at cycle end.\",\n        \"If target closed, select and emit next legal primary target.\",\n        \"If true halt occurs, state exact typed halt code from L9 and precise unblock action.\"\n      ]\n    }\n  }\n}\n",
