      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v2\",\n  \"contract_id\": \"urn:omega:packet:symbol_game:run_folder_v1:v1.0.0\",\n  \"title\": \"Run Folder v1\",\n  \"kind\": \"packet_contract\",\n  \"layer\": \"40_packets\",\n  \"role\": \"PacketSpecification\",\n  \"status\": \"active\",\n  \"council_owner\": \"L3_logos_techne\",\n  \"descriptor\": {\n    \"authority_effect\": \"None\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"clean_architecture_layer\": \"infrastructure\",\n    \"refusals\": {\n      \"may_emit\": [\n        \"RUN_FOLDER_EXISTS\",\n        \"MANIFEST_MISSING\",\n        \"RECEIPT_MISSING\",\n        \"DIGEST_MISMATCH\",\n        \"UNBOUND_FILE\",\n        \"CHAIN_TAMPERED\"\n      ]\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"RunFolderV1 encapsulates an immutable, content-addressed execution directory under _ic/darpa/symbol_game/runs/ sealed with a receipt binding all files and stream heads.\",\n    \"invariants\": [\n      \"Every execution produces exactly one sealed folder whose receipt.json binds all SHA-256 digests.\",\n      \"No file within a sealed run folder is modified after atomic rename.\",\n      \"A crashed run is sealed as ABORTED and never deleted.\",\n      \"Scrubbed plaintext is kept for packets.jsonl while secrets are redacted.\"\n    ],\n    \"non_roles\": [\n      \"authority_source\",\n      \"truth_oracle\"\n    ],\n    \"required_negative_capabilities\": [\n      \"no_self_certification\",\n      \"no_implicit_authority_upgrade\"\n    ]\n  },\n  \"structure\": {\n    \"rust_crate\": \"omega_replay\",\n    \"rust_module\": \"run_folder\",\n    \"rust_type\": \"RunReceiptV1\",\n    \"form\": \"struct\",\n    \"serde\": {\n      \"deny_unknown_fields\": true\n    },\n    \"fields\": [\n      {\n        \"name\": \"schema_version\"\n      },\n      {\n        \"name\": \"run_id\"\n      },\n      {\n        \"name\": \"status\"\n      },\n      {\n        \"name\": \"reason\"\n      },\n      {\n        \"name\": \"files\"\n      },\n      {\n        \"name\": \"chain_heads\"\n      },\n      {\n        \"name\": \"sealed_at_utc\"\n      },\n      {\n        \"name\": \"authority_effect\"\n      }\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
