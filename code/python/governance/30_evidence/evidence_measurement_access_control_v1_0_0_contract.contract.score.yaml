      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:measurement_access_control:v1.0.0\",\n  \"title\": \"MeasurementAccessControl\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"Boundary\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"FunctionalMeasurementAuthority\",\n        \"MeasurementKernel\",\n        \"Functional\",\n        \"Search\",\n        \"Solver\",\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\",\n        \"Engine\",\n        \"GlobalContractTaxonomy\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"MeasurementAccessControl prevents raw cohomological semantics from leaking into Search,\\nSolver, Evaluator, Policy, TerminalMapper, LicensingBoundary, or Engine. Canonical\\ncohomological measurement artifacts require admitted Functional emission and Measurement\\nboundary checking.\\n\",\n    \"non_role\": [\n      \"search_access_to_raw_cohomological_semantics\",\n      \"solver_emission_of_canonical_cohomological_values\",\n      \"evaluator_recomputation\",\n      \"evaluator_canonical_measurement_emission\",\n      \"policy_reinterpretation\",\n      \"terminal_mapper_recomputation\",\n      \"engine_recomputation\",\n      \"engine_reinterpretation\",\n      \"measurement_authority_promotion_without_checking\",\n      \"cohomological_scalarization_outside_functional_boundary\"\n    ],\n    \"authority_defaults\": {\n      \"access_report\": \"EvidenceOnly\",\n      \"checked_access_fact\": \"FactOnly only for checked access-boundary claims.\"\n    },\n    \"access_rules\": {\n      \"search\": \"May consume opaque non-semantic hints only; does not rank or score candidates from raw measurements.\",\n      \"solver\": \"Computes only; solver artifacts are not canonical measurements.\",\n      \"evaluator\": \"May consume checked measurement references; must not recompute measurements.\",\n      \"policy\": \"May consume checked references only under schema permission.\",\n      \"terminal_mapper\": \"Maps terminal outcomes; must not recompute or reinterpret measurements.\",\n      \"licensing_boundary\": \"May consume checked decision/evidence refs; emits ActionLicense only under its own contract.\",\n      \"engine\": \"Executes licensed transitions only; must not branch on raw cohomological values.\"\n    },\n    \"flow\": \"Functional / Observable / Solver / Analysis\\n-> MeasurementKernel checked reference\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine executes licensed transition\\n-> Trace\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"search_has_no_raw_cohomological_measurement_access\",\n      \"solver_output_is_not_canonical_measurement\",\n      \"evaluator_consumes_checked_measurement_refs_only\",\n      \"policy_cannot_reinterpret_measurements\",\n      \"terminal_mapper_cannot_recompute_measurements\",\n      \"licensing_boundary_precedes_engine\",\n      \"engine_does_not_branch_on_raw_measurements\"\n    ],\n    \"canonical_invariant\": \"Canonical measurements are boundary-controlled evidence. Downstream governance consumes\\nchecked references only and cannot recompute, reinterpret, scalarize, authorize, or execute\\nfrom raw cohomological values.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"MeasurementAccessControl\",\n      \"source_file\": \"non-math/02_evidence/measurement_access_control_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Cohomological measurement boundary enforcement\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"FunctionalMeasurementAuthority\",\n        \"MeasurementKernel\",\n        \"Functional\",\n        \"Search\",\n        \"Solver\",\n        \"Evaluator\",\n        \"Policy\",\n        \"TerminalMapper\",\n        \"LicensingBoundary\",\n        \"Engine\",\n        \"GlobalContractTaxonomy\"\n      ],\n      \"forbidden_authority\": [\n        \"search_access_to_raw_cohomological_semantics\",\n        \"solver_emission_of_canonical_cohomological_values\",\n        \"evaluator_recomputation\",\n        \"evaluator_canonical_measurement_emission\",\n        \"policy_reinterpretation\",\n        \"terminal_mapper_recomputation\",\n        \"engine_recomputation\",\n        \"engine_reinterpretation\",\n        \"measurement_authority_promotion_without_checking\",\n        \"cohomological_scalarization_outside_functional_boundary\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"MeasurementAccessReport\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"Record\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ],\n    \"coalescence_mode\": \"specializes\",\n    \"coalesces_with\": [\n      \"urn:om