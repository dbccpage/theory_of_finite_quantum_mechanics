      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:products:certificate_api_interface:v1.0.0\",\n  \"title\": \"CertificateAPIInterface\",\n  \"kind\": \"product_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"07_products\",\n  \"role\": \"CertificateApiInterface\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"AnomalonCertificateContract\",\n        \"WebsiteAPIContract\",\n        \"CertificateContract\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constraints\": {\n      \"mutation_forbidden\": true,\n      \"public_signing_forbidden\": true,\n      \"raw_payload_forbidden\": true,\n      \"read_only\": true\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"CertificateSigning\",\n        \"EmitCertificate\",\n        \"Evaluation\",\n        \"Terminalization\",\n        \"AuthorityPromotion\",\n        \"RuntimeMutation\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"This contract defines the interface boundary where certificates are exposed through the Website API.\\n\\nThe CertificateAPIInterface receives certificate queries from the Website API, delegates verification\\nto the CertificateVerifier, and returns structured certificate presentations. The API does NOT verify\\ncertificates itself -- it requests verification and displays the result. Certificate authority is read\\nand presented, never created or modified at this boundary.\\n\",\n    \"non_role\": [\n      \"certificate verification\",\n      \"certification\",\n      \"evaluation\",\n      \"terminalization\",\n      \"authority upgrade\",\n      \"certificate creation\",\n      \"evidence authority creation\"\n    ],\n    \"llm_boundary_law\": {\n      \"doctrine\": 5,\n      \"text\": \"The LLM is a candidate generator only. It MUST NOT certify, validate, verify certificates,\\nevaluate, terminalize, authorize transitions, execute transitions, alter certificate displays,\\nor upgrade evidence authority.\\n\\nLLM-generated content displayed through this interface retains its candidate status and MUST be\\nlabeled accordingly.\\n\\nNo LLM output may influence certificate verification, authority level display, verification status\\nreporting, request authorization, or response shaping except as inert display content.\\n\"\n    },\n    \"certificate_authority_bound\": {\n      \"doctrine\": 6,\n      \"text\": \"Certificate authority MUST NOT be inflated, created, or modified at this interface. The API\\npresents exactly the authority level that the CertificateVerifier reports. A DiagnosticCertificate\\nmust not be displayed as a ProofCertificate. The presented authority must never exceed the attached\\nevidence authority.\\n\"\n    },\n    \"classification\": {\n      \"subsystem\": \"Product Layer\",\n      \"role\": \"Interface boundary between certificate subsystem and Website API.\",\n      \"classification\": \"Product layer -- CertificateAPIInterface is NOT an operator in the five-effect-class algebra (E, I, C, R, M). It is a presentation interface that bridges the certificate subsystem and the Website API. It requests verification from CertificateVerifier and displays results. It does not verify certificates itself.\"\n    },\n    \"presentation_non_authority_law\": \"A CertificateAPIInterface response is a presentation structure.\\n\\nIt does not create certificate authority, verify a certificate, certify a claim, or promote evidence.\\n\\nThe response may include verifier-reported authority and verification status, but those fields are\\nread-only projections of CertificateVerifier output.\\n\\nCertificate API responses carry AuthorityEffect::None unless wrapped by a separate audit/reporting\\nboundary. They are presentation structures, not evidence or facts by themselves.\\n\",\n    \"required_response_fields\": {\n      \"required\": [\n        \"certificate_id\",\n        \"certificate_hash\",\n        \"subject_hash\",\n        \"terminal_status\",\n        \"authority_level\",\n        \"verification_status\",\n        \"verifier_id\",\n        \"verification_report_hash\"\n      ],\n      \"optional\": [\n        \"created_at\",\n        \"issuer\",\n        \"trace_bundle_refs\",\n        \"obstruction_summary\",\n        \"certificate_version\"\n      ]\n    },\n    \"admissibility_checklist\": [\n      \"Certificate exists in the certificate store\",\n      \"Requester is authenticated and authorized for the query scope\",\n      \"Query is bounded (specific certificate_id or bounded search parameters)\",\n      \"Request schema validates\",\n      \"Endpoint is declared\"\n    ],\n    \"refusal_conditions\": [\n      \"nonexistent certificate (certificate_id not found)\",\n      \"unauthorized requester (identity not verified or insufficient permissions)\",\n      \"unbounded query (no certificate_id, no search bounds)\",\n      \"schema mismatch on request\",\n      \"unknown endpoint\",\n      \"certificate hash mismatch during verification\",\n      \"attempted authority upgrade in response\",\n      \"mutation request through read-only interface\"\n    ],\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"verify_certificate\",\n        \"certify(\",\n        \"evaluate(\",\n        \"terminalize(\",\n        \"authority_upgrade\",\n        \"sign_certificate\",\n        \"create_certificate\",\n        \"mutate_certificate_state\",\n        \"execute_transition\",\n        \"authorize_transition\",\n        \"license_transition\"\n      ]\n    },\n    \"required_tests\": [\n      \"api_interface_delegates_verification_to_verifier\",\n      \"api_interface_does_not_verify_certificates_itself\",\n      \"api_interface_response_includes_required_fields\",\n      \"api_interface_refuses_nonexistent_certificate\",\n      \"api_interface_refuses_unauthorized_request\",\n      \"api_interface_refuses_unbounded_query\",\n      \"api_interface_does_not_inflate_authority_level\",\n      \"api_interface_labels_llm_content_as_candidate\",\n      \"api_interface_response_includes_verifier_id\",\n      \"api_interface_response_includes_verification_report_hash\",\n      \"api_interface_response_is_presentation_not_authority\",\n      \"api_interface_does_not_authorize_request_from_llm_output\"\n    ],\n    \"canonical_invariant\": \"The Certificate API interface presents certificate data by delegating verification to\\nCertificateVerifier. It does not verify, create, modify, or inflate certificate authority.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"CertificateAPIInterface\",\n      \"role\": \"Interface boundary between certificate subsystem and Website API\",\n      \"classification\": \"product\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"AnomalonCertificateContract\",\n        \"WebsiteAPIContract\",\n        \"CertificateContract\"\n      ],\n      \"forbidden_authority\": [\n        \"certificate verification\",\n        \"certification\",\n        \"evaluation\",\n        \"terminalization\",\n        \"authority upgrade\",\n        \"certificate creation\",\n        \"evidence authority creation\"\n      ],\n      \"primary_output_family\": \"StructureArtifact\",\n      \"domain_output_kind\": \"CertificatePresentation\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"FactEnvelope\",\n        \"Record\"\n      ],\n      \"llm_boundary\": \"LLM is candidate generator only. LLM output carries no authority.\"\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_product_contract:v1.0.0\"\n    ]\n  }\n}\n",
