      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:products:anomalon_certificate:v1.0.0\ntitle: AnomalonCertificate\nkind: product_contract\nstatus: mathematical_wip\nlayer: 07_products\nrole: Certificate\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: LocalReplay\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - CertificateKernel\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\n  constitution:\n    contract_dependencies: *id001\n    emits: EvidenceEnvelope\n    authority_layer: Evidence\n    replay_certificates:\n    - schema_hash\n  constraints:\n    certificate_hash_required: true\n    immutable_after_emit: true\n    mutation_forbidden: true\n    policy_hash_required: true\n    policy_version_required: true\n    replay_required: true\n    request_hash_required: true\n    signature_required: true\n    typed_output_required: true\n  replay:\n    required:\n    - certificate replay manifest\n    - request hash replay\n  witnesses:\n    required:\n    - evidence envelope\n    - diagnostic report\n  capabilities:\n    forbidden:\n    - Terminalization\n    - SolverExecution\n    - PolicyInterpretation\n    required: []\ndoctrine:\n  summary: 'This contract defines the Anomalon Certificate product boundary.\n\n\n    An Anomalon Certificate is a sealed diagnostic and evidence packet for a prompt,\n    response,\n\n    reasoning trace, solver run, or system session.\n\n\n    It does not by itself prove mathematical truth, algebraic correctness, empirical\n    correctness,\n\n    or product safety.\n\n\n    It binds claims to evidence for only the claims explicitly supported by attached\n    sub-certificates,\n\n    replay traces, validators, witnesses, solver results, or declared external oracles.\n\n    '\n  non_role: &id002\n  - proving mathematical truth\n  - upgrading evidence authority beyond attached sub-certificates\n  - execution\n  - evaluation\n  - mutation\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. An LLM may produce content that\n      is packaged into a\n\n      certificate, but the certificate''s authority derives exclusively from the attached\n      evidence,\n\n      not from the LLM. LLM output carries no authority.\n\n      '\n  certificate_authority_bound:\n    doctrine: 6\n    text: 'Certificate authority MUST NOT exceed the authority of the attached evidence.\n      A\n\n      DiagnosticCertificate with only diagnostic evidence cannot be upgraded to a\n      ProofCertificate\n\n      without proof evidence.\n\n      '\n  classification:\n    subsystem: Product Layer\n    role: Sealed diagnostic and evidence packet.\n    classification: Product layer -- certificate envelope for traces and evidence.\n  authority_levels:\n    default: DiagnosticCertificate\n    allowed_levels:\n    - DiagnosticCertificate\n    - ReplayCertificate\n    - SolverCertificate\n    - ProofCertificate\n    - ExternalOracleCertificate\n    - CompositeEvidenceCertificate\n    note: 'The terminal_status describes what happened.\n\n      The authority_level describes what kind of evidence supports the claim.\n\n      '\n  terminal_statuses:\n    allowed_statuses:\n    - Certificate\n    - DiagnosticOnly\n    - RepairRecommended\n    - Refusal\n    - OracleNeeded\n    - ReplayUnavailable\n    - EvidenceDiverged\n    - AuthorityDowngraded\n    note: 'Terminal statuses describe diagnostic outcomes of the certificate compilation/analysis.\n\n      They must not imply action, repair instructions, policy decisions, or execution\n      authority.\n\n      For example, RepairRecommended indicates a diagnostic assessment that a repair\n      candidate\n\n      could be generated; it is not a repair instruction or execution authorization.\n\n      '\n  required_fields:\n  - certificate_id\n  - certificate_version\n  - subject_type\n  - subject_hash\n  - created_at\n  - terminal_status\n  - authority_level\n  - obstruction_summary\n  - validator_results\n  - replay_metadata\n  - issuer\n  - signature_or_hash\n  admissibility_checklist:\n  - Certificate contains all required fields\n  - Subject hash matches claimed subject\n  - Terminal status is declared\n  - Authority level is declared and supported by evidence\n  - Validator results are attached when required\n  - Sub-certificates are attached when authority level requires them\n  - Replay trace is available when authority level requires it\n  - Signature or hash is valid\n  refusal_conditions:\n  - required field missing\n  - subject hash mismatch\n  - validator result missing\n  - sub-certificate missing\n  - sub-certificate invalid\n  - replay trace unavailable\n  - terminal status diverged\n  - authority level exceeds evidence\n  - external oracle unavailable\n  - signature/hash invalid\n  replay_obligation: 'A certificate must be externally inspectable. At minimum, a\n    verifier must be able to check:\n\n    - certificate schema validity\n\n    - subject hash\n\n    - terminal status\n\n    - authority level\n\n    - validator results\n\n    - attached sub-certificate references\n\n    - issuer/signature/hash\n\n\n    A certificate is self-verifiable only for its envelope and attached evidence references.\n    It is\n\n    not self-verifying for mathematical truth unless the relevant proof, solver, replay,\n    or oracle\n\n    certificate is included.\n\n    '\n  core_rule: 'Declared certificate authority must never exceed attached evidence authority.\n\n    '\n  product_kernel_reconciliation: 'The product CertificateKind enum (DiagnosticCertificate,\n    ReplayCertificate, SolverCertificate,\n\n    ProofCertificate, ExternalOracleCertificate, CompositeEvidenceCertificate) is\n    the product-facing\n\n    projection of the kernel''s CertificateKind. The product MUST N