    "doctrine": {
      "summary": "This contract defines the Anomalon Certificate product boundary.\n\nAn Anomalon Certificate is a sealed diagnostic and evidence packet for a prompt, response,\nreasoning trace, solver run, or system session.\n\nIt does not by itself prove mathematical truth, algebraic correctness, empirical correctness,\nor product safety.\n\nIt binds claims to evidence for only the claims explicitly supported by attached sub-certificates,\nreplay traces, validators, witnesses, solver results, or declared external oracles.\n",
      "non_role": [
        "proving mathematical truth",
        "upgrading evidence authority beyond attached sub-certificates",
        "execution",
        "evaluation",
        "mutation"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. An LLM may produce content that is packaged into a\ncertificate, but the certificate's authority derives exclusively from the attached evidence,\nnot from the LLM. LLM output carries no authority.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "Certificate authority MUST NOT exceed the authority of the attached evidence. A\nDiagnosticCertificate with only diagnostic evidence cannot be upgraded to a ProofCertificate\nwithout proof evidence.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Sealed diagnostic and evidence packet.",
        "classification": "Product layer -- certificate envelope for traces and evidence."
      },
      "authority_levels": {
        "default": "DiagnosticCertificate",
        "allowed_levels": [
          "DiagnosticCertificate",
          "ReplayCertificate",
          "SolverCertificate",
          "ProofCertificate",
          "ExternalOracleCertificate",
          "CompositeEvidenceCertificate"
        ],
        "note": "The terminal_status describes what happened.\nThe authority_level describes what kind of evidence supports the claim.\n"
      },
      "terminal_statuses": {
        "allowed_statuses": [
          "Certificate",
          "DiagnosticOnly",
          "RepairRecommended",
          "Refusal",
          "OracleNeeded",
          "ReplayUnavailable",
          "EvidenceDiverged",
          "AuthorityDowngraded"
        ],
        "note": "Terminal statuses describe diagnostic outcomes of the certificate compilation/analysis.\nThey must not imply action, repair instructions, policy decisions, or execution authority.\nFor example, RepairRecommended indicates a diagnostic assessment that a repair candidate\ncould be generated; it is not a repair instruction or execution authorization.\n"
      },
      "required_fields": [
        "certificate_id",
        "certificate_version",
        "subject_type",
        "subject_hash",
        "created_at",
        "terminal_status",
        "authority_level",
        "obstruction_summary",
        "validator_results",
        "replay_metadata",
        "issuer",
        "signature_or_hash"
      ],
      "admissibility_checklist": [
        "Certificate contains all required fields",
        "Subject hash matches claimed subject",
        "Terminal status is declared",
        "Authority level is declared and supported by evidence",
        "Validator results are attached when required",
        "Sub-certificates are attached when authority level requires them",
        "Replay trace is available when authority level requires it",
        "Signature or hash is valid"
      ],
      "refusal_conditions": [
        "required field missing",
        "subject hash mismatch",
        "validator result missing",
        "sub-certificate missing",
        "sub-certificate invalid",
        "replay trace unavailable",
        "terminal status diverged",
        "authority level exceeds evidence",
        "external oracle unavailable",
        "signature/hash invalid"
      ],
      "replay_obligation": "A certificate must be externally inspectable. At minimum, a verifier must be able to check:\n- certificate schema validity\n- subject hash\n- terminal status\n- authority level\n- validator results\n- attached sub-certificate references\n- issuer/signature/hash\n\nA certificate is self-verifiable only for its envelope and attached evidence references. It is\nnot self-verifying for mathematical truth unless the relevant proof, solver, replay, or oracle\ncertificate is included.\n",
      "core_rule": "Declared certificate authority must never exceed attached evidence authority.\n",
      "product_kernel_reconciliation": "The product CertificateKind enum (DiagnosticCertificate, ReplayCertificate, SolverCertificate,\nProofCertificate, ExternalOracleCertificate, CompositeEvidenceCertificate) is the product-facing\nprojection of the kernel's CertificateKind. The product MUST NOT define certificate kinds that do\nnot exist in the kernel. Any new certificate kind must be added to the kernel first, then\nprojected to the product.\n",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "execute(",
          "evaluate(",
          "mutate(",
          "terminalize(",
          "authority_upgrade",
          "sign_certificate",
          "prove("
        ]
      },
      "required_tests": [
        "certificate_authority_does_not_exceed_evidence",
        "certificate_rejects_missing_required_fields",
        "certificate_downgrades_on_missing_sub_certificate",
        "certificate_envelope_is_externally_inspectable",
        "certificate_kind_matches_kernel_certificate_kind",
        "certificate_llm_output_carries_no_authority"
      ],
      "canonical_invariant": "Anomalon Certificates are sealed diagnostic and evidence packets. They bind claims to evidence\nonly for claims explicitly supported by attached sub-certificates, replay traces, validators,\nwitnesses, solver results, or declared external oracles. Certificate authority never exceeds\nattached evidence authority.\n",
      "legacy_metadata": {
        "name": "AnomalonCertificate",
        "role": "Sealed diagnostic and evidence packet for prompts, responses, traces, solver runs, or sessions",
        "classification": "product",
        "effect_class": "none",
        "depends_on": [
          "CertificateKernel"
        ],
        "forbidden_authority": [
          "proving mathematical truth",
          "upgrading evidence authority beyond attached sub-certificates",
          "execution",
          "evaluation",
          "mutation"
        ],
        "primary_output_family": "EvidenceEnvelope",
        "domain_output_kind": "AnomalonCertificate",
        "referenced_output_families": [
          "FactEnvelope",
          "EvidenceEnvelope",
          "Record"
        ],
        "referenced_domain_kinds": [
          "CertificateEnvelope",
          "ReplayReport"
        ],
        "llm_boundary": "LLM is candidate generator only. LLM output carries no authority."
      }
    },
