      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:published_paper_carrier:v1.0.0\",\n  \"title\": \"PublishedPaperCarrier\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"Carrier\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"definition\": {\n    \"claim_ledger_marker\": \"Claim_Ledger\",\n    \"claim_ledger_marker_lower\": \"claim_ledger\",\n    \"proof_ledger_prefix\": \"proof_ledger_\",\n    \"paper_id_grammar\": {\n      \"digits\": 3,\n      \"optional_lowercase_suffix\": true,\n      \"separators\": [\n        \"_\",\n        \" \",\n        \"-\"\n      ]\n    },\n    \"scoped_paper_id\": {\n      \"separator\": \".\",\n      \"root_scope_is_self\": true\n    },\n    \"gt_tower_prefix\": {\n      \"first\": 993,\n      \"last\": 999\n    },\n    \"programme_nesting_depth\": 1\n  },\n  \"doctrine\": {\n    \"summary\": \"Filename and folder grammar of the published paper carrier.\\nThese were magic constants inside omega_rip_papers::carrier, which is why the PR #1191 programme\\nreorganization silently broke enumeration: the grammar had no way to express that a folder may\\ngroup papers rather than be one.\\n\",\n    \"authority_defaults\": {\n      \"grammar\": \"EvidenceOnly. Parsing a folder name is a shape observation. Recognising a paper id grants no authority over the paper and upgrades no claim.\"\n    },\n    \"consumers\": [\n      {\n        \"crate\": \"omega_rip_papers\",\n        \"module\": \"carrier\",\n        \"use\": \"enumerate_papers, paper_id_of, is_claim_ledger_name, programme descent.\\npaper_id_of returns the LOCAL leaf key only. A ledger key for a paper is the scoped\\nkey, scope + scoped_paper_id.separator + leaf, composed from the enclosing programme\\nfolder; a paper with no paper-shaped parent is self-scoped.\\n\"\n      }\n    ],\n    \"required_tests\": [\n      \"programme_folder_is_not_emitted_as_a_paper\",\n      \"papers_inside_a_programme_are_enumerated\"\n    ],\n    \"canonical_invariant\": \"A folder matching the paper-id grammar is a programme if it contains at least one child\\nfolder that also matches the grammar; otherwise it is a paper. Enumeration descends exactly one\\nlevel into a programme and never emits the programme itself as a paper. A GT-tower folder is never\\na programme.\\nA paper is named by its SCOPED key: the enclosing programme's local id, then scoped_paper_id.separator,\\nthen the paper's own local id. A paper with no paper-shaped enclosing folder is self-scoped, so its\\nscope and leaf coincide. scoped_paper_id.separator is disjoint from paper_id_grammar.separators, which is\\nwhat makes a scoped key REFUSE the local grammar instead of truncating to its scope; GT-tower-ness is a\\nproperty of the LEAF id and is decided before scoping.\\n\"\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
      "record": {
        "contract_id": "urn:omega:evidence:published_paper_carrier:v1.0.0",
        "definition": {
          "claim_ledger_marker": "Claim_Ledger",
          "claim_ledger_marker_lower": "claim_ledger",
          "gt_tower_prefix": {
            "first": 993,
            "last": 999
          },
          "paper_id_grammar": {
            "digits": 3,
            "optional_lowercase_suffix": true,
            "separators": [
              "_",
              " ",
              "-"
            ]
          },
          "programme_nesting_depth": 1,
          "proof_ledger_prefix": "proof_ledger_",
          "scoped_paper_id": {
            "root_scope_is_self": true,
            "separator": "."
          }
        },
        "descriptor": {
          "authority_effect": "evidence_only",
          "customer_claim_allowed": false,
          "dependencies": {
            "contracts": [],
            "proof_obligations": []
          },
          "evidence_ceiling": "ShapeOnly",
          "operator_classes": {
            "may_support": [],
            "must_not_self_assign": true
          },
          "refusals": {
            "may_emit": []
          },
          "runtime_enforcement": false,
          "terminals": {
            "may_emit": [],
            "may_support": []
          }
        },
        "doctrine": {
          "authority_defaults": {
            "grammar": "EvidenceOnly. Parsing a folder name is a shape observation. Recognising a paper id grants no authority over the paper and upgrades no claim."
          },
          "canonical_invariant": "A folder matching the paper-id grammar is a programme if it contains at least one child\nfolder that also matches the grammar; otherwise it is a paper. Enumeration descends exactly one\nlevel into a programme and never emits the programme itself as a paper. A GT-tower folder is never\na programme.\nA paper is named by its SCOPED key: the enclosing programme's local id, then scoped_paper_id.separator,\nthen the paper's own local id. A paper with no paper-shaped enclosing folder is self-scoped, so its\nscope and leaf coincide. scoped_paper_id.separator is disjoint from paper_id_grammar.separators, which is\nwhat makes a scoped key REFUSE the local grammar instead of truncating to its scope; GT-tower-ness is a\nproperty of the LEAF id and is decided before scoping.\n",
          "consumers": [
            {
              "crate": "omega_rip_papers",
              "module": "carrier",
              "use": "enumerate_papers, paper_id_of, is_claim_ledger_name, programme descent.\npaper_id_of returns the LOCAL leaf key only. A ledger key for a paper is the scoped\nkey, scope + scoped_paper_id.separator + leaf, composed from the enclosing programme\nfolder; a paper with no paper-shaped parent is self-scoped.\n"
            }
          ],
          "required_tests": [
            "programme_folder_is_not_emitted_as_a_paper",
            "papers_inside_a_programme_are_enumerated"
          ],
          "summary": "Filename and folder grammar of the published paper carrier.\nThese were magic constants inside omega_rip_papers::carrier, which is why the PR #1191 programme\nreorganization silently broke enumeration: the grammar had no way to express that a folder may\ngroup papers rather than be one.\n"
        },
