      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:replay_trace_containers:v1.0.0\",\n  \"title\": \"Replay trace containers\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"active\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"Trace\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:evidence:trace_artifact:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"urn:omega:evidence:trace_artifact:v1.0.0\"\n      ],\n      \"emits\": \"EvidenceEnvelope\",\n      \"authority_layer\": \"Evidence\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"constraints\": {\n      \"immutable_after_emit\": true,\n      \"mutation_forbidden\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"The two concrete replay-side trace containers. StepTrace<T> holds an ordered list of step records; LayeredTrace<T> holds a flat collection of layer records. Both keep their backing Vec private and expose it only through borrowing and consuming accessors, and both implement the TraceArtifact and ImmutableTrace traits defined by the foundation contract.\",\n    \"vocabulary_ownership\": \"This module re-exports the trace-artifact vocabulary (TraceArtifact, ImmutableTrace, VoidTrace, and the Decision/Analysis/Validation/ActionResult artifact markers) from omega_types::trace_artifact so that existing omega_replay::trace::* paths keep resolving. That vocabulary is OWNED by urn:omega:evidence:trace_artifact:v1.0.0 and is deliberately NOT listed in this contract's symbols; the foundation crate holds it so governance law in omega_contracts can depend on it without depending on this verification crate (SG-LAYER-001 / PO-LAYER). Listing it here would create a second canonical owner for one vocabulary.\",\n    \"reexport_shim_ruling\": \"Operator ruling (2026-07-18), recorded here because this module was first mistaken for a pure shim: a pure re-export shim is NOT exempt from file inventory or contract coverage. It is exempt only from independent semantic ownership, and only when it contains no behavior beyond `pub use` of a separately contracted canonical owner; the canonical owner then retains all mathematical, validation, serialization, terminalization and authority obligations. THIS MODULE DOES NOT MEET THAT CONDITION -- alongside the re-exports it defines StepTrace<T> and LayeredTrace<T> with constructors, accessors, Serialize/Deserialize derives and trait impls -- so it is contracted as a hybrid: canonical owner of those two containers (see symbols) and a non-owning re-export surface for the foundation vocabulary (see vocabulary_ownership). If the containers are ever relocated and only `pub use` remains, narrow this contract to the shim form.\",\n    \"non_role\": [\n      \"Does not verify a trace. These are containers; replay verification is urn:omega:evidence:replay_kernel:v1.0.0.\",\n      \"Does not decide admissibility, terminalize, or emit authority. A trace records what happened; it does not license anything.\",\n      \"Does not define the trace-artifact vocabulary it re-exports.\",\n      \"Does not enforce immutability at the type level. `immutable_after_emit` is a contract obligation on callers, not a property of the types. The containers derive Clone, Serialize and Deserialize, so a caller can deserialize or clone-and-rebuild one. The private fields prevent in-place mutation, not reconstruction.\",\n      \"Not the linear-algebra trace operator. urn:omega:math:trace:v0.1.0 is the diagonal sum of a matrix, an unrelated object that shares the name.\"\n    ]\n  },\n  \"wip\": [\n    \"The containers are generic over T with no bound at construction. The TraceArtifact and ImmutableTrace impls apply only where T is Clone plus Serialize plus Deserialize, so a StepTrace of some other T is constructible but is not a trace artifact.\",\n    \"No replay certificate binds a container instance to the run that produced it. schema_hash is declared but nothing in this module computes or checks it.\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_replay\",\n    \"module\": \"trace\",\n    \"symbols\": [\n      \"StepTrace\",\n      \"LayeredTrace\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ],\n    \"coalescence_mode\": \"specializes\",\n    \"coalesces_with\": [\n      \"urn:omega:evidence:replay_kernel:v1.0.0\"\n    ]\n  }\n}\n",
