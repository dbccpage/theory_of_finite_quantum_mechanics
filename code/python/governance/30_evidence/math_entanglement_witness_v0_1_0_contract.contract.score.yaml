      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:entanglement_witness:v0.1.0\",\n  \"title\": \"Entanglement Witness Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"entanglement_witness\",\n    \"symbol\": \"entanglement_witness\",\n    \"ascii_symbol\": \"entanglement_witness\",\n    \"notation\": \"Exact Decomposable Entanglement Witness\",\n    \"domain\": [\n      \"A declared finite bipartite Q(i) carrier and positive Hermitian Q defining W=partial_transpose_B(Q)\",\n      \"Validated density operators for entanglement classification\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_quantum_physics::bipartite_operator; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"W is Hermitian and its expectation on every product state is nonnegative\",\n    \"A negative Tr(W rho) on an admitted density operator certifies entanglement within the declared bipartition\",\n    \"Bell coherence is detected while a same-population separable mixture is not\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject wrong bipartitions, nonpositive defining operators and non-density classification candidates\",\n    \"Equal population shadows cannot replace full operator evaluation\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"W is Hermitian and its expectation on every product state is nonnegative; A negative Tr(W rho) on an admitted density operator certifies entanglement within the declared bipartition; Bell coherence is detected while a same-population separable mixture is not.\",\n    \"non_role\": [\n      \"A complete witness classification or arbitrary separability decision\",\n      \"Abstract witness hash protocols\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\",\n    \"The former generic metadata scaffold remains outside this explicitly declared finite executable domain; its unsupported hash obligations are not claimed discharged.\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_quantum_physics\",\n    \"module\": \"bipartite_operator\",\n    \"symbols\": [\n      \"DecomposableWitness\",\n      \"DecomposableWitness::new\",\n      \"DecomposableWitness::value\",\n      \"DecomposableWitness::certifies_entanglement\"\n    ],\n    \"required_tests\": [\n      \"the_decomposable_witness_is_nonnegative_on_declared_product_states\",\n      \"bell_state_and_classical_mixture_share_a_table_but_not_entanglement\",\n      \"the_descent_and_the_witness_refuse_malformed_inputs\"\n    ]\n  }\n}\n",
