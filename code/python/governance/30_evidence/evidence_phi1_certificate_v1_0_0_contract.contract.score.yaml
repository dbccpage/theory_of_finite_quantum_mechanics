      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:phi1_certificate:v1.0.0\",\n  \"title\": \"Phi1Certificate\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"active\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"CertificateKernel\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": true,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": [\n        \"PO-PHI1-PRIMAL-FEASIBILITY\",\n        \"PO-PHI1-DUAL-FEASIBILITY\",\n        \"PO-PHI1-WEAK-DUALITY-EQUALITY\"\n      ]\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [],\n      \"emits\": \"EvidenceEnvelope\",\n      \"authority_layer\": \"Evidence\",\n      \"replay_certificates\": [\n        \"schema_hash\",\n        \"exact_rational_inputs\",\n        \"lean_theorem_reference\"\n      ]\n    },\n    \"constraints\": {\n      \"checker_boundary_required\": true,\n      \"mutation_forbidden\": true,\n      \"typed_output_required\": true,\n      \"authority_does_not_exceed_evidence\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Phi1Certificate is an exact BigRational primal-dual equality witness. It checks A x <= b, x >= 0, A^T y >= c, y >= 0, and c^T x = b^T y. The certificate is algebraic evidence only and cannot authorize a contract transition, mint CertifiedAuthority, or grant release authority.\",\n    \"non_role\": [\n      \"authority_promotion\",\n      \"transition_authorization\",\n      \"release_authorization\",\n      \"approximate_optimization\"\n    ],\n    \"authority_ladder\": {\n      \"sequence\": [\n        \"Generated\",\n        \"Checked\",\n        \"Verified\"\n      ],\n      \"law\": \"Exact verification raises evidence status only; normative, operational, and release dimensions remain independently non-authorizing.\"\n    },\n    \"required_tests\": [\n      \"test_valid_phi1_certificate_passes\",\n      \"test_duality_gap_refused\",\n      \"test_infeasible_pair_refused\",\n      \"test_authority_effect_no_implicit_promotion\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_certifiers\",\n    \"module\": \"phi1_certifier\",\n    \"symbols\": [\n      \"Phi1Certificate\",\n      \"Phi1CertificateMetadata\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
