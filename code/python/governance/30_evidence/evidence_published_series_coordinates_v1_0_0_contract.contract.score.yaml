    "doctrine": {
      "summary": "Canonical on-disk coordinates for the S07-005 published-series agreement matrix (papers 000-010).\nRepository paths are data, not Rust literals: a path buried in a const drifts silently because the\nagreement matrix is compared field-wise and never resolved against the filesystem. That is how the\nPR #1191 programme reorganization left every coordinate stale while the crate still compiled and\nevery test still passed.\n",
      "authority_defaults": {
        "coordinates": "EvidenceOnly. Locating a paper is not a claim about it. This contract pins where a manuscript and its claim ledger live and how many claim rows the ledger declares; it grants no authority over their content and upgrades no status."
      },
      "consumers": [
        {
          "crate": "omega_state",
          "module": "published_series_agreement",
          "use": "validate_published_series_matrix_v1 compares packet rows against these coordinates"
        }
      ],
      "required_tests": [
        "manifest_parses_and_is_ordered",
        "every_coordinate_resolves_on_disk"
      ],
      "canonical_invariant": "Every coordinate resolves to a file that exists in the published tree, rows are ascending by\npaper_id, and no row points its manuscript and its claim ledger at the same file.\n"
