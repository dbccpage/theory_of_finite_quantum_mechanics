     {\n            \"name\": \"status\",\n            \"type\": \"WitnessVerificationStatus\"\n          },\n          {\n            \"name\": \"result_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"certificate_ref\",\n            \"type\": \"Option<CertificateId>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"WitnessVerificationStatus\",\n          \"variants\": [\n            \"Verified\",\n            \"Failed\",\n            \"Indeterminate\",\n            \"Inapplicable\"\n          ]\n        }\n      ]\n    },\n    \"flow\": \"Raw / Trace / Measurement / Solver / Analysis\\n-> WitnessEnvelope\\n-> WitnessVerifier / ReplayVerifier / CertificateKernel\\n-> verified evidence reference or FactEnvelope\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n-> Trace / Ledger\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"witness_authority_effect_defaults_to_evidence_only\",\n      \"witness_does_not_verify_itself\",\n      \"witness_does_not_seal_certificate\",\n      \"witness_does_not_emit_action_license\",\n      \"witness_does_not_authorize_transition\",\n      \"witness_does_not_execute\",\n      \"witness_canonical_hash_stable\",\n      \"witness_requires_source_artifacts\",\n      \"witness_rejects_self_attestation\",\n      \"verified_witness_may_support_factonly_only_through_boundary\"\n    ],\n    \"canonical