      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:certificate_kernel:v1.0.0\",\n  \"title\": \"CertificateKernel\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"CertificateKernel\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"Witness\",\n        \"TraceArtifact\",\n        \"MeasurementKernel\",\n        \"ReplayKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"CertificateKernel binds typed claims to attached evidence under a declared verifier\\ncapability. Unchecked certificates and proof witnesses are EvidenceOnly. Verified\\ncertificates may support FactOnly claims only within the authority bound of attached\\nevidence, declared verifier capability, and governing contract.\\n\",\n    \"non_role\": [\n      \"creating_authority_beyond_evidence\",\n      \"self_certification\",\n      \"authority_upgrade_without_check\",\n      \"transition_authorization\",\n      \"terminal_mapping\",\n      \"execution\",\n      \"policy_interpretation\",\n      \"evidence_fabrication\",\n      \"replay_replacement\",\n      \"signing_unchecked_claims\"\n    ],\n    \"authority_defaults\": {\n      \"proof_witness\": \"EvidenceOnly\",\n      \"unchecked_certificate\": \"EvidenceOnly\",\n      \"verified_certificate_claim\": \"FactOnly only within evidence_authority_bound and verifier capability.\",\n      \"transition_authority\": \"Never. LicensingBoundary emits ActionLicense separately.\"\n    },\n    \"structural_representation\": {\n      \"raw\": {\n        \"struct_name\": \"CertificateEnvelope\",\n        \"fields\": [\n          {\n            \"name\": \"certificate_id\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"claim\",\n            \"type\": \"CertificateClaim\"\n          },\n          {\n            \"name\": \"evidence_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"measurement_refs\",\n            \"type\": \"Vec<MeasurementId>\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"certificate_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"VerifiedCertificateClaim\",\n        \"fields\": [\n          {\n            \"name\": \"certificate_ref\",\n            \"type\": \"CertificateId\"\n          },\n          {\n            \"name\": \"verifier_ref\",\n            \"type\": \"VerifierId\"\n          },\n          {\n            \"name\": \"evidence_authority_bound\",\n            \"type\": \"AuthorityEffect\"\n          },\n          {\n            \"name\": \"verified_claim_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"CertificateKind\",\n          \"variants\": [\n            \"AnalysisCertificate\",\n            \"ReplayCertificate\",\n            \"WitnessCertificate\",\n            \"LiftLicenseEvidence\",\n            \"TraceCertificate\"\n          ]\n        }\n      ]\n    },\n    \"flow\": \"EvidenceEnvelope / WitnessId / MeasurementId / ReplayRef\\n-> CertificateEnvelope\\n-> CertificateVerifier\\n-> VerifiedCertificateClaim or refused evidence\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n-> Trace / Ledger\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"certificate_defaults_to_evidence_only\",\n      \"certificate_verification_may_support_factonly_only_with_bound\",\n      \"certificate_authority_never_exceeds_attached_evidence\",\n      \"certificate_does_not_emit_action_license\",\n      \"certificate_does_not_authorize_transition\",\n      \"certificate_does_not_execute\",\n      \"certificate_does_not_replace_replay\",\n      \"certificate_rejects_self_certification\"\n    ],\n    \"canonical_invariant\": \"Certificate binds claims to evidence. It does not create authority beyond evidence,\\ndoes not authorize transitions, and does not execute. Verification can support FactOnly\\nfactual claims only inside the declared evidence bound.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"CertificateKernel\",\n      \"source_file\": \"non-math/02_evidence/certificate_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Typed evidence-binding envelope with declared verifier capability\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"ContractConstitution\",\n        \"GlobalContractTaxonomy\",\n        \"Witness\",\n        \"TraceArtifact\",\n        \"MeasurementKernel\",\n        \"ReplayKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"creating_authority_beyond_evidence\",\n        \"self_certification\",\n        \"authority_upgrade_without_check\",\n        \"transition_authorization\",\n        \"terminal_mapping\",\n        \"execution\",\n        \"policy_interpretation\",\n        \"evidence_fabrication\",\n        \"replay_replacement\",\n        \"signing_unchecked_claims\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"CertificateEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\",\n        \"Record\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
