lue_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"checked_source_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"MeasurementValue\",\n          \"variants\": [\n            \"ExactRational\",\n            \"Integer\",\n            \"Interval\",\n            \"CertificateBackedApproximation\",\n            \"DiagnosticFloat\"\n          ]\n        }\n      ]\n    },\n    \"flow\": \"Raw value / Observable / Functional / Solver / Analysis\\n-> MeasurementEnvelope\\n-> MeasurementKernel / CertificateKernel / ReplayVerifier\\n-> FactEnvelope or verified evidence reference\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n-> Trace / Ledger\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"measurement_envelope_defaults_to_evidence_only\",\n      \"checked_measurement_requires_source_method_tolerance_and_hashes\",\n      \"measurement_value_does_not_self_certify\",\n      \"diagnostic_float_not_used_for_governance\",\n      \"measurement_does_not_emit_action_license\",\n      \"measurement_does_not_authorize_transition\",\n      \"measurement_does_not_execute\"\n    ],\n    \"canonical_invariant\": \"Measurement carries value evidence. It does not judge, rank, scalarize governance,\\nterminalize, license, mutate, authorize, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"MeasurementKernel\",\n      \"source_file\": \"non-math/02_evidence/measurement_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Exact or certified numerical/symbolic value envelope\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"Observable\",\n        \"Solver\",\n        \"CertificateKernel\",\n        \"ReplayKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"evaluator_judgment\",\n        \"policy_interpretation\",\n        \"terminal_mapping\",\n        \"state_mutation\",\n        \"execution\",\n        \"governance_scalarization_without_explicit_conversion\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"MeasurementEnvelope\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
