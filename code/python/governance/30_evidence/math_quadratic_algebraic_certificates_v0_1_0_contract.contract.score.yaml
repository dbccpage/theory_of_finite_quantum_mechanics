      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:quadratic_algebraic_certificates:v0.1.0\",\n  \"title\": \"Exact Quadratic Minimal Polynomials and Enclosures\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"math\": {\n    \"object_kind\": \"quadratic_algebraic_certificates\",\n    \"symbol\": \"quadratic_algebraic_certificates\",\n    \"ascii_symbol\": \"quadratic_algebraic_certificates\",\n    \"notation\": \"Exact Quadratic Minimal Polynomials and Enclosures\",\n    \"domain\": [\n      \"A canonical runtime quadratic field element; enclosures require a real radicand and positive rational width.\"\n    ],\n    \"codomain\": {\n      \"description\": \"Declared finite results of omega_number_theory::quadratic; exact and diagnostic routes retain their stated arithmetic, limits and refusals.\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Declared finite carriers, basis order, dimensions and coefficient domain\",\n      \"Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared\",\n      \"Unsupported inputs and exhausted computations return their declared refusal\"\n    ]\n  },\n  \"laws\": [\n    \"The primitive minimal polynomial is degree one for rationals and degree two for genuine quadratic values.\",\n    \"The element annihilates its returned minimal polynomial.\",\n    \"Exact integer-square-root bounds produce an enclosure containing the real element with the requested maximum width.\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No time-dependent data\",\n      \"Deterministic mathematical replay on identical inputs\",\n      \"Independent operator or witness replay where a certificate is returned\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_number_theory\",\n    \"module\": \"quadratic\",\n    \"symbols\": [\n      \"QuadraticNumber\",\n      \"QuadraticNumber::minimal_polynomial\",\n      \"QuadraticNumber::enclosure\"\n    ],\n    \"required_tests\": [\n      \"runtime_quadratics_have_minimal_polynomials_and_certified_bounded_enclosures\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Imaginary fields, nonpositive widths and oversized refinement-bit requests are typed refusals.\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"The primitive minimal polynomial is degree one for rationals and degree two for genuine quadratic values.; The element annihilates its returned minimal polynomial.; Exact integer-square-root bounds produce an enclosure containing the real element with the requested maximum width..\",\n    \"non_role\": [\n      \"Complex conjugation for a real field remains identity and is distinct from the Galois involution.\",\n      \"No operational authority.\",\n      \"PROVED, GlobalGreen, operational authority or human mathematics acceptance\"\n    ]\n  },\n  \"wip\": [\n    \"Executable finite laws remain local implementation evidence pending human mathematics review\",\n    \"No mechanized theorem discharge or lifecycle acceptance is asserted\"\n  ]\n}\n",
