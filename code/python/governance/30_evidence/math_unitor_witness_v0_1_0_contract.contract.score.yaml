      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:unitor_witness:v0.1.0\",\n  \"title\": \"UnitorWitness Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"witness-record\",\n    \"symbol\": \"W_unitor(A, lambda_A) or W_unitor(A, rho_A)\",\n    \"ascii_symbol\": \"unitor_witness\",\n    \"notation\": \"W_unitor(A, lambda_A) or W_unitor(A, rho_A)\",\n    \"domain\": [\n      \"object_hash: SHA-256 hash of the object A\",\n      \"unit_object_hash: SHA-256 hash of the monoidal unit I\",\n      \"monoidal_structure_hash: SHA-256 hash of the monoidal category structure\",\n      \"unitor_direction: left | right\",\n      \"forward_map_hash: SHA-256 hash of lambda_A or rho_A\",\n      \"inverse_map_hash: SHA-256 hash of lambda_A^{-1} or rho_A^{-1}\",\n      \"composition_identity_hash: SHA-256 hash proving forward . inverse = id\",\n      \"inverse_composition_identity_hash: SHA-256 hash proving inverse . forward = id\",\n      \"triangle_identity_witness_hash: SHA-256 hash of triangle identity check (optional)\"\n    ],\n    \"codomain\": {\n      \"description\": \"A structured record containing the object identifier, the unitor direction (left or right), the forward map, the inverse map, composition identity proofs, and triangle identity coherence data.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"Unitor direction must be exactly 'left' or 'right'\",\n      \"Domain and codomain of the forward map match the expected tensor product with the unit\",\n      \"forward . inverse = id on the codomain\",\n      \"inverse . forward = id on the domain\",\n      \"Triangle identity coherence condition is satisfied (when witnessing both left and right)\",\n      \"Witness hash is deterministic from inputs\"\n    ]\n  },\n  \"laws\": [\n    \"The unitor map is an isomorphism: forward . inverse = id and inverse . forward = id\",\n    \"Domain of left unitor is I tensor A, codomain is A (vice versa for right)\",\n    \"The triangle identity relating associator, left unitor, and right unitor holds\",\n    \"The witness is consistent with the natural transformation structure at object A\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"No random numbers\",\n      \"No wall-clock data\",\n      \"No network calls\",\n      \"All map and composition data are fixed byte arrays\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Reject unitor direction that is not 'left' or 'right'\",\n    \"Reject witness where domain/codomain do not match monoidal structure\",\n    \"Reject witness where forward . inverse does not yield identity\",\n    \"Reject witness where triangle identity fails\",\n    \"Reject witness that claims policy approval or terminal success\",\n    \"Reject witness with invalid SHA-256 hash format\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"UnitorWitness records verifiable evidence that the left or right unitor isomorphism of a monoidal category holds for a given object A. The left unitor lambda_A : I tensor A -> A and the right unitor rho_A : A tensor I -> A are natural isomorphisms required by the monoidal structure. This witness captures the map, its inverse, the composition checks (lambda_A composed with lambda_A^{-1} = id, and vice versa), and the triangle identity coherence condition. It is purely structural and confers no authority.\",\n    \"non_role\": [\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates\",\n      \"Does not terminalize operations\",\n      \"Does not produce customer-facing claims\",\n      \"Does not define the monoidal category itself (see MonoidalCategory contract)\",\n      \"Does not verify naturality across all objects (only witnesses one object at a time)\"\n    ]\n  },\n  \"wip\": [\n    \"Should the triangle identity witness be mandatory or optional?\",\n    \"Extend to bicategorical unitors (lax/oplax)?\",\n    \"Define interaction with Pentagon identity witness for associator\",\n    \"Currently witnesses one object at a time; naturality across all objects is not checked\",\n    \"Triangle identity verification requires associator data from a separate contract\",\n    \"May need parametrization over different monoidal structures (strict, non-strict)\",\n    \"Consider adding support for symmetric monoidal unitors\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"bicategory\",\n    \"symbols\": [\n      \"Invertible2Cell\",\n      \"FiniteBicategory\",\n      \"Bicategory\"\n    ],\n    \"required_tests\": [\n      \"test_invertibility_violation_caught\",\n      \"test_triangle_coherence_verified\"\n    ]\n  }\n}\n",
