      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:dual_witness:v0.1.0\",\n  \"title\": \"DualWitness Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"urn:omega:math:phi1:v1.0.0\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"dual-certificate\",\n    \"symbol\": \"||x|| >= |y(x)| when ||y||* <= 1\",\n    \"ascii_symbol\": \"dual_witness\",\n    \"notation\": \"||x|| >= |y(x)| when ||y||* <= 1\",\n    \"domain\": [\n      \"dual_element: Covector y in V*\",\n      \"primal_element: Element x in V (the element being witnessed)\",\n      \"dual_norm_value: ||y||* (must be <= 1 for valid witness)\",\n      \"evaluation_value: |y(x)| (the certified lower bound)\",\n      \"primal_space: Normed vector space V\",\n      \"dual_space: Dual space V*\"\n    ],\n    \"codomain\": {\n      \"description\": \"A covector y in V* witnessing a lower bound on a primal element\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"dual_element_hash must resolve to a valid covector in V*\",\n      \"primal_element_hash must resolve to a valid element of V\",\n      \"||y||* <= 1\",\n      \"The evaluation y(x) must be correctly computed\",\n      \"Witness hash must be deterministic from all components\"\n    ]\n  },\n  \"laws\": [\n    \"||y||* <= 1 (the witness has unit dual norm or less)\",\n    \"||x|| >= |y(x)| follows from ||y||* <= 1\",\n    \"y(x) is correctly computed from the evaluation pairing\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Evaluation pairing is deterministic from covector and vector data\",\n      \"Dual norm computation is deterministic\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"dual_element_hash does not resolve to valid covector\",\n    \"primal_element_hash does not resolve to valid vector\",\n    \"||y||* > 1 (dual norm exceeds unit bound)\",\n    \"Evaluation y(x) is incorrectly computed\",\n    \"Artifact claiming authority or admissibility must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"DualWitness is a covector y in the dual space V* that certifies properties of primal elements via the evaluation pairing. Given a primal element x and a dual witness y with ||y||* <= 1, the value |y(x)| provides a certified lower bound on ||x||. When ||y||* = 1 and y(x) = ||x||, the witness is optimal (Hahn-Banach witness). The contract validates the dual norm bound, the evaluation computation, and the resulting lower bound certificate.\",\n    \"non_role\": [\n      \"Does not classify admissibility\",\n      \"Does not emit policy decisions\",\n      \"Does not emit certificates\",\n      \"Does not terminalize\",\n      \"Does not produce customer-facing claims\",\n      \"Does not solve optimization problems\",\n      \"Does not construct Hahn-Banach extensions\"\n    ]\n  },\n  \"wip\": [\n    \"Should dual witnesses support approximate optimality (|y(x)| >= (1-epsilon)||x||)?\",\n    \"Relationship to primal-dual certificates for LP/SDP feasibility\",\n    \"How to construct optimal witnesses algorithmically in finite dimensions\",\n    \"Connection to annihilator constraints and complementary slackness\",\n    \"Currently targets finite-dimensional normed vector spaces\",\n    \"Hahn-Banach extension for infinite dimensions is deferred\",\n    \"Primal-dual pairing with PrimalResidual for complete certificates\",\n    \"May need approximate witness for numerical computation\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_types\",\n    \"module\": \"dual_witness\",\n    \"symbols\": [\n      \"DualWitness\"\n    ],\n    \"required_tests\": [\n      \"dual_norm_exceeds_unit_bound\",\n      \"evaluation_pairing_mismatch_must_be_rejected\"\n    ]\n  },\n  \"nomos_debate_NOT_CANONICAL\": {\n    \"banner\": \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none\",\n    \"not_part_of_contract_law\": true,\n    \"authority_effect\": \"none\",\n    \"potential_defects\": [\n      {\n        \"reviewer\": \"panepistimion-math-prof\",\n        \"role\": \"MATH_CANONICAL_REVIEW\",\n        \"code\": \"STAGE1_MECHANICAL_PASS\",\n        \"severity\": \"info\",\n        \"claim_class\": \"[STANDARD]\",\n        \"detail\": \"Mechanical GTLA field gates passed (authority/math/non_role/structures/laws-or-requirements/negative_tests). Not PROVED.\",\n        \"recommendation\": \"Repair under meth-level math re-review (ADR-007); not GlobalGreen.\"\n      }\n    ],\n    \"realization_delta_vs_implemented_math_file\": [\n      {\n        \"reviewer\": \"panepistimion-cs-prof-ml-ai-info\",\n        \"role\": \"CS_IMPL_DELTA_REVIEW\",\n        \"code\": \"REALIZATION_PRESENT_SCOPE_NARROWER\",\n        \"severity\": \"high\",\n        \"claim_class\": \"[CODE_DEMO_RUST]\",\n        \"file\": \"omega_engine/crates_rs/omega_types/src/dual_witness.rs\",\n        \"yaml_law\": \"Hahn-Banach-style dual certificate ||x|| >= |y(x)| when ||y||* <= 1 over general normed V\",\n        \"code_behavior\": \"DualWitness is a display-only f64 view of VerifiedExactPhi1 (phi vector, dual_value, is_circulation/is_bounded inherited, not recomputed). No general dual-norm certificate construction or evaluation pairing API.\\n\",\n        \"delta\": \"YAML_OVERCLAIMS\",\n        \"detail\": \"rust_binding resolves; symbols exist. Code is a diagnostic projection of Phi1 dual evidence, not a general dual-witness object matching the YAML math object.\\n\",\n        \"recommendation\": \"Either narrow YAML to Phi1 display dual-witness scope, or split a second contract for general dual certificates. Code must not mint authority. No PROVED/GlobalGreen.\\n\"\n      }\n    ]\n  }\n}\n",
