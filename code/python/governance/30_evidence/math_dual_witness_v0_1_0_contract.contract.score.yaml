      "Artifact claiming authority or admissibility must be rejected"
    ],
    "doctrine": {
      "summary": "DualWitness is a covector y in the dual space V* that certifies properties of primal elements via the evaluation pairing. Given a primal element x and a dual witness y with ||y||* <= 1, the value |y(x)| provides a certified lower bound on ||x||. When ||y||* = 1 and y(x) = ||x||, the witness is optimal (Hahn-Banach witness). The contract validates the dual norm bound, the evaluation computation, and the resulting lower bound certificate.",
      "non_role": [
        "Does not classify admissibility",
        "Does not emit policy decisions",
