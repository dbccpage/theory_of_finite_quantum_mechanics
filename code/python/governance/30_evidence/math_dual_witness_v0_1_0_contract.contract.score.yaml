    "laws": [
      "||y||* <= 1 (the witness has unit dual norm or less)",
      "||x|| >= |y(x)| follows from ||y||* <= 1",
      "y(x) is correctly computed from the evaluation pairing"
    ],
    "replay": {
      "requirements": [
        "No external state",
