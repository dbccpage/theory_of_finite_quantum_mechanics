      "Connection to annihilator constraints and complementary slackness",
      "Currently targets finite-dimensional normed vector spaces",
      "Hahn-Banach extension for infinite dimensions is deferred",
      "Primal-dual pairing with PrimalResidual for complete certificates",
      "May need approximate witness for numerical computation"
    ],
    "rust_binding": {
