    "doctrine": {
      "summary": "CheckedPacket is the universal boundary that admits generated, parsed, or solved material\ninto evaluator-facing factual form. Nothing is true because it was generated or solved.\nA checked-packet certificate remains evidence-only after independent checking, tolerance or exact arithmetic bounds, typed sealing, and replayable manifests/hashes. A scoped local result can be authorized only by the separate authenticated host promotion contract after receipt-DAG, authority-witness, and human-decision verification.\nCheckedPacket may be FactOnly only for the specific checked claim under the declared checker, schema, input hash, evidence refs, replay refs, and certificate refs. It does not upgrade unrelated payload authority.\n",
