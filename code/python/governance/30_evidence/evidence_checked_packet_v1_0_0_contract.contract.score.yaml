ionManifest\",\n        \"fields\": [\n          {\n            \"name\": \"support_partition_policy\",\n            \"type\": \"PartitionPolicy\"\n          },\n          {\n            \"name\": \"quotient_separability_checks\",\n            \"type\": \"Vec<SeparabilityCheck>\"\n          },\n          {\n            \"name\": \"phi_additivity_certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"split_enumeration_budget\",\n            \"type\": \"Budget\"\n          },\n          {\n            \"name\": \"uniqueness_status\",\n            \"type\": \"UniquenessStatus\"\n          },\n          {\n            \"name\": \"replay_hash\",\n            \"type\": \"Hash\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"ProposedArtifact\\n-> UncheckedPacket\\n-> CertificateChecker / Validator / ReplayKernel\\n-> CheckedPacket\\n-> Evaluator emits DecisionEnvelope\\n-> LicensingBoundary emits ActionLicense\\n-> Engine executes only licensed transitions\\n-> Trace records\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"checked_packet_requires_independent_checker\",\n      \"checked_packet_rejects_raw_solver_float_authority\",\n      \"checked_packet_requires_replay_hash\",\n      \"unchecked_packet_cannot_enter_evaluator\",\n      \"checked_packet_does_not_emit_action_license\",\n      \"licensing_boundary_required_before_engine\",\n      \"phi_additivity_uses_certificate_refs_not_embedded_certificates\"\n    ],\n    \"canonical_invariant\": \"Generate freely, parse explicitly, check independently, seal immutably, evaluate only sealed\\npackets, license separately, and execute only licensed transitions.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"CheckedPacket\",\n      \"source_file\": \"non-math/02_evidence/checked_packet_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Universal evidence-promotion packet boundary\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"CertificateKernel\",\n        \"ReplayKernel\",\n        \"Validator\",\n        \"Evaluator\",\n        \"LicensingBoundary\"\n      ],\n      \"forbidden_authority\": [\n        \"self_certification\",\n        \"unchecked_promotion\",\n        \"transition_authorization\",\n        \"engine_execution\",\n        \"local_authority_effect_override\"\n      ],\n      \"primary_output_family\": \"FactEnvelope\",\n      \"domain_output_kind\": \"CheckedPacket\",\n      \"referenced_output_families\": [\n        \"EvidenceEnvelope\",\n        \"DecisionEnvelope\",\n        \"ActionLicense\",\n        \"Record\"\n      ]\n    }\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_certifiers\",\n    \"module\": \"checked_packet\",\n    \"symbols\": [\n      \"CheckedPacket\",\n      \"CheckedPacketArgs\",\n      \"CheckedClaimScope\",\n      \"CheckedClaimKind\",\n      \"CertificateRef\",\n      \"CheckerRef\",\n      \"CarrierManifestHash\",\n      \"BoundaryMapsHash\",\n      \"WeightsAndGaugesHash\",\n      \"DefectFieldHash\",\n      \"ObserverBoundaryHash\",\n      \"ToleranceProfileHash\",\n      \"ReplayHash\",\n      \"EvidenceRef\",\n      \"CertificateVerdict\",\n      \"Hash256\",\n      \"CheckedPacketCertificateError\",\n      \"CheckedPacketCertificateV1\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
