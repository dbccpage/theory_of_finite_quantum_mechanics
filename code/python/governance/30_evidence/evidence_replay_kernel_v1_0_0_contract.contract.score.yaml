      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:replay_kernel:v1.0.0\",\n  \"title\": \"ReplayKernel\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"Replay\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"TraceArtifact\",\n        \"CertificateKernel\",\n        \"Witness\",\n        \"MeasurementKernel\",\n        \"GlobalContractTaxonomy\",\n        \"ContractConstitution\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [\n        \"TraceArtifact\",\n        \"CertificateKernel\",\n        \"Witness\",\n        \"MeasurementKernel\",\n        \"GlobalContractTaxonomy\",\n        \"ContractConstitution\"\n      ],\n      \"emits\": \"EvidenceEnvelope\",\n      \"authority_layer\": \"Evidence\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"capabilities\": {\n      \"forbidden\": [\n        \"RuntimeMutation\",\n        \"Terminalization\"\n      ],\n      \"required\": []\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Replay reconstructs declared historical execution from trace, manifest, schema, seed,\\nwitness, measurement, and certificate references. Replay artifacts are EvidenceOnly\\nuntil verified. Verified replay may support FactOnly history claims but does not repair,\\nauthorize, terminalize, license, mutate, or execute live control flow.\\n\",\n    \"non_role\": [\n      \"live_execution_control\",\n      \"speculative_execution\",\n      \"active_search\",\n      \"state_mutation\",\n      \"terminal_mapping\",\n      \"policy_interpretation\",\n      \"authority_promotion_without_check\",\n      \"trace_repair\",\n      \"certificate_creation\",\n      \"certificate_authority_upgrade\",\n      \"action_licensing\",\n      \"transition_authorization\"\n    ],\n    \"authority_defaults\": {\n      \"replay_bundle\": \"EvidenceOnly\",\n      \"replay_report\": \"EvidenceOnly\",\n      \"verified_replay_fact\": \"FactOnly only after manifest integrity, trace availability, certificate validity, seed, schema, environment, and output hash checks succeed.\"\n    },\n    \"structural_representation\": {\n      \"raw\": {\n        \"struct_name\": \"ReplayReport\",\n        \"fields\": [\n          {\n            \"name\": \"replay_id\",\n            \"type\": \"ReplayId\"\n          },\n          {\n            \"name\": \"trace_refs\",\n            \"type\": \"Vec<TraceId>\"\n          },\n          {\n            \"name\": \"manifest_ref\",\n            \"type\": \"ReplayManifestRef\"\n          },\n          {\n            \"name\": \"status\",\n            \"type\": \"ReplayStatus\"\n          },\n          {\n            \"name\": \"output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"VerifiedReplayReport\",\n        \"fields\": [\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"ReplayId\"\n          },\n          {\n            \"name\": \"verifier_ref\",\n            \"type\": \"VerifierId\"\n          },\n          {\n            \"name\": \"checked_trace_hashes\",\n            \"type\": \"Vec<Hash256>\"\n          },\n          {\n            \"name\": \"checked_output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"ReplayStatus\",\n          \"variants\": [\n            \"Verified\",\n            \"Diverged\",\n            \"Impossible\",\n            \"Indeterminate\"\n          ]\n        }\n      ]\n    },\n    \"flow\": \"TraceArtifact / Manifest / Seed / Schema / Environment\\n-> ReplayReport\\n-> VerifiedReplayReport when checks pass\\n-> FactEnvelope or EvidenceEnvelope\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"replay_report_defaults_to_evidence_only\",\n      \"verified_replay_may_support_factonly_history_claim\",\n      \"replay_does_not_mutate_trace_bundle\",\n      \"replay_does_not_repair_missing_trace\",\n      \"replay_does_not_create_certificate\",\n      \"replay_does_not_emit_action_license\",\n      \"replay_does_not_authorize_transition\",\n      \"replay_does_not_execute_live_control_flow\"\n    ],\n    \"canonical_invariant\": \"Replay verifies reconstruction only. It records divergence or verified reconstruction,\\nbut does not repair, authorize, license, terminalize, mutate, or execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"ReplayKernel\",\n      \"source_file\": \"non-math/02_evidence/replay_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Deterministic reconstruction and replay verification\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"TraceArtifact\",\n        \"CertificateKernel\",\n        \"Witness\",\n        \"MeasurementKernel\",\n        \"GlobalContractTaxonomy\",\n        \"ContractConstitution\"\n      ],\n      \"forbidden_authority\": [\n        \"live_execution_control\",\n        \"speculative_execution\",\n        \"active_search\",\n        \"state_mutation\",\n        \"terminal_mapping\",\n        \"policy_interpretation\",\n        \"authority_promotion_without_check\",\n        \"trace_repair\",\n        \"certificate_creation\",\n        \"certificate_authority_upgrade\",\n        \"action_licensing\",\n        \"transition_authorization\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"ReplayReport\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"Record\",\n        \"EvidenceEnvelope\"\n      ]\n    }\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_replay\",\n    \"module\": \"replay_harness\",\n    \"symbols\": [\n      \"ReplayPacket\",\n      \"VerificationAudit\",\n      \"VerificationStatus\",\n      \"ReplayPacketValidationError\",\n      \"T3Verifier\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
