      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:univalence_witness:v0.1.0\",\n  \"title\": \"Univalence Witness Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"axiom_witness\",\n    \"symbol\": \"UA(U) : Π(A B : U). isEquiv(idtoeqv_{A,B})\",\n    \"ascii_symbol\": \"univalence_witness\",\n    \"notation\": \"UA(U) : Π(A B : U). isEquiv(idtoeqv_{A,B})\",\n    \"domain\": [\n      \"universe_id: Reference to TypeUniverse artifact\",\n      \"proof_id: Reference to univalence proof artifact\"\n    ],\n    \"codomain\": {\n      \"description\": \"A UnivalenceWitness consists of a reference to a TypeUniverse U and a proof that for all types A, B : U, the canonical map idtoeqv : (A = B) → (A ≃ B) is an equivalence.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"The universe_id must resolve to a valid TypeUniverse artifact\",\n      \"The proof_id must resolve to a valid univalence proof\",\n      \"The proof term must be well-typed with correct univalence statement type\",\n      \"The artifact hash is deterministic SHA-256 over contract components\"\n    ]\n  },\n  \"laws\": [\n    \"For all A, B : U, the map (A = B) → (A ≃ B) is an equivalence\",\n    \"The witness applies to a valid TypeUniverse\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Validators are content-addressed\",\n      \"Same inputs must produce identical artifact hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"universe_id does not resolve to TypeUniverse\",\n    \"proof_id does not resolve to proof artifact\",\n    \"proof does not have univalence statement type\",\n    \"proof term is not valid univalence witness\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"A UnivalenceWitness demonstrates that the univalence axiom holds for a given universe: the canonical map from type identity to type equivalence is itself an equivalence. The contract validates the universe and the univalence proof.\",\n    \"non_role\": [\n      \"Does not construct the univalence axiom (takes proof as input)\",\n      \"Does not implement cubical type theory proofs\",\n      \"Does not provide computational transport algorithms\"\n    ]\n  },\n  \"wip\": [\n    \"Univalence is an axiom in standard HoTT; in cubical type theory, it is provable. How should we support both axiomatic and cubical approaches?\",\n    \"The computational content of univalence (transport) is complex. What level of computational detail should be tracked?\",\n    \"Univalence implies function extensionality. Should we validate this implication?\",\n    \"Different model constructions (simplicial sets, cubical sets) validate univalence. Should we track which model is used?\",\n    \"This contract accepts univalence proofs as inputs rather than constructing them\",\n    \"Transport along ua(e) requires careful algorithmic specification\",\n    \"The ua operation converts equivalences to paths, enabling powerful reasoning\",\n    \"Future versions may include cubical type theory proof construction\"\n  ]\n}\n",
