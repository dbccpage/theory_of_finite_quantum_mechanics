      "Source/target not matching (A*B)*C and A*(B*C) must be rejected",
      "Non-natural associator must be rejected",
      "Artifact claiming authority must be rejected"
    ],
    "doctrine": {
      "summary": "An associator witness records the coherence isomorphism alpha_{a,b,c}: (a * b) * c -> a * (b * c) for a triple of composable morphisms (or objects in a monoidal category). The witness includes the source triple, the two bracketings, and the invertible 2-cell mediating between them. It must satisfy the pentagon coherence condition when composed with other associator witnesses.",
      "non_role": [
        "Full monoidal category validation (separate contract)",
        "Pentagon axiom global verification (that requires all associators)",
        "Unitor witnesses (separate left/right unitor contracts)",
        "Mac Lane coherence theorem proof (meta-theorem)"
      ]
    },
    "wip": [
      "Should the pentagon axiom be checked here or only at the monoidal category level?",
      "How to handle lax associators (non-invertible) for lax monoidal functors?",
      "Should the contract track which coherence theorem applies (Mac Lane)?",
      "Currently records a single associator instance, not the full natural family",
      "Pentagon axiom verification requires all four-fold associators (separate contract)",
      "Mac Lane coherence theorem asserts all diagrams commute but is not checked here",
      "Lax associators (non-invertible) may need a separate contract"
    ],
    "rust_binding": {
      "crate": "omega_higher_category_theory",
