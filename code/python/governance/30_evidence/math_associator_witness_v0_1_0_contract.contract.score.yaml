      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:math:associator_witness:v0.1.0\",\n  \"title\": \"AssociatorWitness Contract\",\n  \"kind\": \"math_contract\",\n  \"status\": \"exact_rational_classifier_implemented\",\n  \"layer\": \"math\",\n  \"descriptor\": {\n    \"authority_effect\": \"none\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"math\": {\n    \"object_kind\": \"associator_witness\",\n    \"symbol\": \"alpha_{A,B,C}: (A * B) * C -> A * (B * C)\",\n    \"ascii_symbol\": \"associator_witness\",\n    \"notation\": \"alpha_{A,B,C}: (A * B) * C -> A * (B * C)\",\n    \"domain\": [\n      \"left_object: object_or_morphism_A\",\n      \"middle_object: object_or_morphism_B\",\n      \"right_object: object_or_morphism_C\",\n      \"source_bracketing: (A * B) * C\",\n      \"target_bracketing: A * (B * C)\",\n      \"associator_morphism: invertible_map alpha: source -> target\",\n      \"inverse_morphism: alpha_inverse: target -> source\"\n    ],\n    \"codomain\": {\n      \"description\": \"A tuple (A, B, C, alpha_{A,B,C}) where A, B, C are composable objects or morphisms and alpha is the invertible coherence map from the left bracketing to the right bracketing.\\n\"\n    }\n  },\n  \"requirements\": {\n    \"required_structures\": [\n      \"alpha_inverse . alpha = id on source, alpha . alpha_inverse = id on target\",\n      \"Source is (A * B) * C and target is A * (B * C)\",\n      \"Associator is natural with respect to morphisms in A, B, C\",\n      \"Artifact hash is deterministically computed from structural data\"\n    ]\n  },\n  \"laws\": [\n    \"alpha is an isomorphism: alpha_inverse . alpha = id and alpha . alpha_inverse = id\",\n    \"alpha is natural in A, B, C\",\n    \"Source is (A * B) * C and target is A * (B * C)\"\n  ],\n  \"replay\": {\n    \"requirements\": [\n      \"No external state\",\n      \"No randomness\",\n      \"No time-dependent data\",\n      \"Associator and inverse application from canonical morphism tables\",\n      \"Rechecking must reproduce invertibility_witness_hash\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  },\n  \"negative_tests\": [\n    \"Associator morphism without valid inverse must be rejected\",\n    \"Source/target not matching (A*B)*C and A*(B*C) must be rejected\",\n    \"Non-natural associator must be rejected\",\n    \"Artifact claiming authority must be rejected\"\n  ],\n  \"doctrine\": {\n    \"summary\": \"An associator witness records the coherence isomorphism alpha_{a,b,c}: (a * b) * c -> a * (b * c) for a triple of composable morphisms (or objects in a monoidal category). The witness includes the source triple, the two bracketings, and the invertible 2-cell mediating between them. It must satisfy the pentagon coherence condition when composed with other associator witnesses.\",\n    \"non_role\": [\n      \"Full monoidal category validation (separate contract)\",\n      \"Pentagon axiom global verification (that requires all associators)\",\n      \"Unitor witnesses (separate left/right unitor contracts)\",\n      \"Mac Lane coherence theorem proof (meta-theorem)\"\n    ]\n  },\n  \"wip\": [\n    \"Should the pentagon axiom be checked here or only at the monoidal category level?\",\n    \"How to handle lax associators (non-invertible) for lax monoidal functors?\",\n    \"Should the contract track which coherence theorem applies (Mac Lane)?\",\n    \"Currently records a single associator instance, not the full natural family\",\n    \"Pentagon axiom verification requires all four-fold associators (separate contract)\",\n    \"Mac Lane coherence theorem asserts all diagrams commute but is not checked here\",\n    \"Lax associators (non-invertible) may need a separate contract\"\n  ],\n  \"rust_binding\": {\n    \"crate\": \"omega_higher_category_theory\",\n    \"module\": \"bicategory\",\n    \"symbols\": [\n      \"Invertible2Cell\",\n      \"FiniteBicategory\",\n      \"Bicategory\"\n    ],\n    \"required_tests\": [\n      \"test_invertibility_violation_caught\",\n      \"test_triangle_coherence_verified\"\n    ]\n  }\n}\n",
