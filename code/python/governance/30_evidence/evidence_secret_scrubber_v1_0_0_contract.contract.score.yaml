      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:secret_scrubber:v1.0.0\",\n  \"title\": \"SecretScrubber\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"active\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"Trace\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"LocalReplay\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    },\n    \"constitution\": {\n      \"contract_dependencies\": [],\n      \"emits\": \"EvidenceEnvelope\",\n      \"authority_layer\": \"Evidence\",\n      \"replay_certificates\": [\n        \"schema_hash\"\n      ]\n    },\n    \"constraints\": {\n      \"immutable_after_emit\": true,\n      \"mutation_forbidden\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"Bounded credential redaction applied to trace payloads BEFORE sealing. Ordering is load-bearing - event_sha256 is taken over event content, so a payload scrubbed after sealing would leave a hash that no longer matches itself and the chain would fail replay. Redacts known vendor key prefixes, Bearer header values, and the value side of named secret environment variables. Reduces the blast radius of an accidental capture; it does NOT claim the output is free of secrets and is not a confidentiality boundary.\",\n    \"non_role\": [\n      \"Confidentiality guarantee over arbitrary payloads.\",\n      \"Post-seal mutation of any trace event.\"\n    ]\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_replay\",\n    \"module\": \"secret_scrubber\",\n    \"symbols\": [\n      \"SecretScrubber\",\n      \"ScrubReport\"\n    ]\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\"\n    ]\n  }\n}\n",
