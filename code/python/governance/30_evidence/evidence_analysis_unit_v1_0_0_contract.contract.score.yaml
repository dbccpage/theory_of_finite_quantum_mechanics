      "raw_utf8": "{\n  \"schema_version\": \"omega.contract.v1\",\n  \"contract_id\": \"urn:omega:evidence:analysis_unit:v1.0.0\",\n  \"title\": \"AnalysisUnit\",\n  \"kind\": \"evidence_contract\",\n  \"status\": \"mathematical_wip\",\n  \"layer\": \"02_evidence\",\n  \"role\": \"AnalysisUnit\",\n  \"descriptor\": {\n    \"authority_effect\": \"evidence_only\",\n    \"evidence_ceiling\": \"ShapeOnly\",\n    \"runtime_enforcement\": false,\n    \"customer_claim_allowed\": false,\n    \"dependencies\": {\n      \"contracts\": [\n        \"MeasurementKernel\",\n        \"CertificateKernel\",\n        \"Witness\",\n        \"ReplayKernel\",\n        \"HealthModelKernel\"\n      ],\n      \"proof_obligations\": []\n    },\n    \"terminals\": {\n      \"may_emit\": [],\n      \"may_support\": []\n    },\n    \"refusals\": {\n      \"may_emit\": []\n    },\n    \"operator_classes\": {\n      \"may_support\": [],\n      \"must_not_self_assign\": true\n    }\n  },\n  \"doctrine\": {\n    \"summary\": \"AnalysisUnit computes or checks factual evidence over declared artifacts.\\nIt may produce analysis evidence and checked factual claims, but it does not\\ndecide admissibility, rank candidates, terminalize, license, mutate, or execute.\\n\",\n    \"non_role\": [\n      \"evaluator_judgment\",\n      \"policy_interpretation\",\n      \"terminal_mapping\",\n      \"action_licensing\",\n      \"transition_authorization\",\n      \"state_transition\",\n      \"state_mutation\",\n      \"search_scheduling\",\n      \"candidate_generation\",\n      \"operator_execution\",\n      \"certificate_sealing_without_certificate_kernel\",\n      \"evidence_authority_upgrade\"\n    ],\n    \"authority_defaults\": {\n      \"raw_analysis_output\": \"EvidenceOnly\",\n      \"checked_analysis_output\": \"FactOnly only after input type, hashes, tolerance semantics, and evidence references are checked.\",\n      \"later_judgment\": \"Consumers may route checked facts to Evaluator; AnalysisUnit itself does not request decisions.\"\n    },\n    \"structural_representation\": {\n      \"raw\": {\n        \"struct_name\": \"AnalysisOutput\",\n        \"fields\": [\n          {\n            \"name\": \"subject_ref\",\n            \"type\": \"BoundaryRef\"\n          },\n          {\n            \"name\": \"input_refs\",\n            \"type\": \"Vec<ArtifactRef>\"\n          },\n          {\n            \"name\": \"analysis_kind\",\n            \"type\": \"AnalysisKind\"\n          },\n          {\n            \"name\": \"output_refs\",\n            \"type\": \"Vec<EvidenceRef>\"\n          },\n          {\n            \"name\": \"witness_refs\",\n            \"type\": \"Vec<WitnessId>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedAnalysisOutput\",\n        \"fields\": [\n          {\n            \"name\": \"analysis_ref\",\n            \"type\": \"AnalysisOutputRef\"\n          },\n          {\n            \"name\": \"checker_ref\",\n            \"type\": \"CheckerRef\"\n          },\n          {\n            \"name\": \"checked_input_hashes\",\n            \"type\": \"Vec<Hash256>\"\n          },\n          {\n            \"name\": \"checked_output_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"replay_refs\",\n            \"type\": \"Vec<ReplayRef>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      },\n      \"enums\": [\n        {\n          \"name\": \"AnalysisKind\",\n          \"variants\": [\n            \"MeasurementCheck\",\n            \"DecompositionCheck\",\n            \"ValidationFactCheck\",\n            \"CertificateCheck\",\n            \"WitnessReferenceCheck\"\n          ]\n        }\n      ]\n    },\n    \"flow\": \"ArtifactRef / EvidenceEnvelope / Record\\n-> AnalysisOutput\\n-> CheckedAnalysisOutput or EvidenceEnvelope\\n-> Evaluator / Policy\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n-> Trace / Ledger\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"analysis_output_defaults_to_evidence_only\",\n      \"analysis_output_requires_checking_for_factonly\",\n      \"analysis_does_not_emit_action_license\",\n      \"analysis_does_not_authorize_transition\",\n      \"analysis_does_not_execute\",\n      \"analysis_does_not_seal_certificate_without_certificate_kernel\",\n      \"analysis_does_not_emit_canonical_cohomological_measurements\",\n      \"analysis_records_input_and_output_hash\",\n      \"same_input_same_analysis_output\"\n    ],\n    \"canonical_invariant\": \"Analysis computes or checks factual evidence over declared artifacts. Its outputs are\\nEvidenceOnly until checked into FactOnly. It does not judge admissibility, rank candidates,\\nsearch, seal certificates without CertificateKernel authority, terminalize, license, mutate,\\nor execute.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"AnalysisUnit\",\n      \"source_file\": \"non-math/02_evidence/analysis_unit_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Read-only factual analysis over declared artifacts\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"MeasurementKernel\",\n        \"CertificateKernel\",\n        \"Witness\",\n        \"ReplayKernel\",\n        \"HealthModelKernel\"\n      ],\n      \"forbidden_authority\": [\n        \"evaluator_judgment\",\n        \"policy_interpretation\",\n        \"terminal_mapping\",\n        \"action_licensing\",\n        \"transition_authorization\",\n        \"state_transition\",\n        \"state_mutation\",\n        \"search_scheduling\",\n        \"candidate_generation\",\n        \"operator_execution\",\n        \"certificate_sealing_without_certificate_kernel\",\n        \"evidence_authority_upgrade\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"AnalysisOutput\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"EvidenceEnvelope\"\n      ]\n    }\n  },\n  \"relationships\": {\n    \"extends\": [\n      \"urn:omega:governance:base_contract:v1.0.0\",\n      \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n    ]\n  }\n}\n",
