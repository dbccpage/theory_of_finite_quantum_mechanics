  \"name\": \"subject\",\n            \"type\": \"BoundaryRef\"\n          },\n          {\n            \"name\": \"findings\",\n            \"type\": \"Vec<DiagnosticFinding>\"\n          },\n          {\n            \"name\": \"measurements\",\n            \"type\": \"Vec<MeasurementRef>\"\n          },\n          {\n            \"name\": \"certificate_refs\",\n            \"type\": \"Vec<CertificateId>\"\n          },\n          {\n            \"name\": \"diagnostic_id\",\n            \"type\": \"DiagnosticId\"\n          },\n          {\n            \"name\": \"report_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"EvidenceOnly\"\n          }\n        ]\n      },\n      \"checked\": {\n        \"struct_name\": \"CheckedDiagnosticReport\",\n        \"fields\": [\n          {\n            \"name\": \"report_ref\",\n            \"type\": \"DiagnosticReportRef\"\n          },\n          {\n            \"name\": \"checked_subject_hash\",\n            \"type\": \"Hash256\"\n          },\n          {\n            \"name\": \"checked_finding_hashes\",\n            \"type\": \"Vec<Hash256>\"\n          },\n          {\n            \"name\": \"checker_ref\",\n            \"type\": \"CheckerRef\"\n          },\n          {\n            \"name\": \"replay_ref\",\n            \"type\": \"Option<ReplayRef>\"\n          },\n          {\n            \"name\": \"authority_effect\",\n            \"type\": \"AuthorityEffect\",\n            \"default\": \"FactOnly\"\n          }\n        ]\n      }\n    },\n    \"flow\": \"Declared subject / checked measurement refs\\n-> DiagnosticReport\\n-> CheckedDiagnosticReport when checked\\n-> Evaluator / Policy if decision is needed\\n-> TerminalMapper\\n-> LicensingBoundary\\n-> Engine\\n\",\n    \"forbidden_implementation_tokens\": {\n      \"scope\": \"behavior, not substring\",\n      \"tokens\": [\n        \"execute(\",\n        \"terminalize(\",\n        \"mutate_state\",\n        \"authorize_transition\",\n        \"license_transition\",\n        \"self_certify\",\n        \"compute_phi\",\n        \"rank_candidates\",\n        \"score_candidate\"\n      ]\n    },\n    \"required_tests\": [\n      \"diagnostic_does_not_mutate_input\",\n      \"diagnostic_does_not_prescribe_action\",\n      \"diagnostic_report_defaults_to_evidence_only\",\n      \"checked_diagnostic_report_may_be_factonly_after_checks\",\n      \"diagnostic_does_not_emit_policy_decision\",\n      \"diagnostic_does_not_authorize_transition\",\n      \"diagnostic_does_not_execute\",\n      \"diagnostic_report_is_evidence_addressable\"\n    ],\n    \"canonical_invariant\": \"Diagnostics report health evidence. Checked diagnostics can support factual health claims,\\nbut never action prescriptions, licenses, or transitions.\\n\",\n    \"legacy_metadata\": {\n      \"name\": \"Diagnostic\",\n      \"source_file\": \"non-math/02_evidence/diagnostic_contract.md\",\n      \"active\": true,\n      \"machine_authority\": true,\n      \"role\": \"Health reporting over declared subjects\",\n      \"version\": \"2.0\",\n      \"classification\": \"evidence\",\n      \"effect_class\": \"none\",\n      \"depends_on\": [\n        \"HealthModelKernel\",\n        \"AnalysisUnit\"\n      ],\n      \"forbidden_authority\": [\n        \"action_prescription\",\n        \"escalation\",\n        \"policy_interpretation\",\n        \"terminal_mapping\",\n        \"transition_authorization\",\n        \"execution\"\n      ],\n      \"primary_output_family\": \"EvidenceEnvelope\",\n      \"domain_output_kind\": \"DiagnosticReport\",\n      \"referenced_output_families\": [\n        \"FactEnvelope\",\n        \"Record\"\n      ]\n    }\n  },\n  \"rust_binding\": {\n    \"crate\": \"omega_id_run\",\n    \"module\": \"run\",\n    \"symbols\": [\n      \"GeneratorEntry\",\n      \"GeneratorTape\",\n      \"RunResult\",\n  