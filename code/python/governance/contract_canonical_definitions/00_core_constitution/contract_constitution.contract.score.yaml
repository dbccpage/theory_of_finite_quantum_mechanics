    "layer": "00_constitution",
    "role": "Constitution",
    "descriptor": {
      "authority_effect": "none",
      "evidence_ceiling": "ShapeOnly",
      "runtime_enforcement": false,
      "customer_claim_allowed": false,
      "dependencies": {
        "contracts": [],
        "proof_obligations": []
      },
      "terminals": {
        "may_emit": [],
