      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:constitution:contract_constitution:v1.0.0\ntitle: ContractConstitution\nkind: constitution_contract\nstatus: mathematical_wip\nlayer: 00_constitution\nrole: Constitution\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: []\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'Root governance law for the Omega Engine contract system. Governs every contract\n\n    under the contract_canonical_definitions hierarchy.\n\n    '\n  non_role: &id001\n  - artifact-family collapse\n  - evidence emitting facts without checking\n  - facts emitting decisions\n  - decisions executing actions\n  - action licenses executing themselves\n  - records controlling execution\n  - unlicensed lifts\n  - implicit trace control\n  - certificate authority exceeding evidence authority\n  - llm self-certification\n  - search authority claims\n  - solver transition authorization\n  llm_boundary_law:\n    doctrine: 5\n    text: 'The LLM is a candidate generator only. It MAY propose candidate text, packets,\n\n      structures, patches, or explanations.\n\n\n      The LLM MUST NOT certify, validate, evaluate, terminalize, authorize transitions,\n\n      execute transitions, or upgrade evidence authority.\n\n\n      LLM output enters the system as Generated evidence only. It must pass through\n\n      parsing, checking, evaluation, and licensing boundaries before it can support any\n\n      FactEnvelope, DecisionEnvelope, ActionLicense, Action, or Record.\n\n      '\n  role_boundary_law:\n    text: 'Search proposes candidates only.\n\n      Solvers compute results only.\n\n      Certifiers check evidence only.\n\n      Evaluators judge facts or candidate quality only within declared evaluator authority.\n\n      Terminalizers seal terminal outcomes or licenses only.\n\n      The Engine executes licensed transitions only.\n\n      None of these roles may silently assume the authority of another role.\n\n      '\n  health_model_law:\n    text: 'HealthModel reports invariant-relative health only.\n\n      HealthModel MUST NOT prescribe action, select policy, authorize repair, license a\n\n      lift, or execute transition.\n\n      HealthModel default AuthorityEffect is EvidenceOnly before invariant/source checking\n\n      and FactOnly after invariant/source checking.\n\n      '\n  certificate_authority_bound:\n    doctrine: 6\n    text: 'Certificate authority MUST NOT exceed attached evidence authority.\n\n      A certificate MAY bind, check, replay, summarize, or attest to attached evidence\n\n      within its declared certifier capability.\n\n      A certificate MUST NOT create authority absent from the attached evidence, declared\n\n      checker capability, replay boundary, or governing contract.\n\n      '\n  declarations_required:\n  - paper-level concept dependencies\n  - primary artifact family\n  - referenced artifact families (may not emit)\n  - output authority layer\n  - default AuthorityEffect\n  - forbidden later-layer concepts\n  - required certificates for replay/audit\n  - forbidden implementation tokens\n  - required negative-capability tests\n  - service vs reference consumption\n  - emitted artifact type\n  - implementation boundary crate/module\n  artifact_family_law:\n    text: 'A contract MUST emit exactly one primary artifact family.\n\n      Allowed families: StructureArtifact, EvidenceEnvelope, FactEnvelope,\n\n      DecisionEnvelope, ActionLicense, Action, Record.\n\n      '\n    invalid_combinations:\n    - EvidenceEnvelope + FactEnvelope from one unchecked interface\n    - FactEnvelope + DecisionEnvelope from one interface\n    - DecisionEnvelope + ActionLicense from one interface\n    - ActionLicense + Action from one interface\n    - Record + Action from one interface\n    - StructureArtifact + semantic DecisionEnvelope from one interface\n  checked_packet_boundary_law: 'CheckedPacket is the universal evidence-promotion boundary.\n\n    Generated output MUST NOT become FactEnvelope, DecisionEnvelope, ActionLicense,\n\n    Action, or Record without passing the required parsing and checking boundary.\n\n    Packetization proves grammar, carrier, schema, and representation integrity only.\n\n    It does not prove semantic truth.\n\n    '\n  authority_effect_law:\n    canonical_enum:\n    - None\n    - EvidenceOnly\n    - FactOnly\n    - RequiresEvaluator\n    - RequestsDecision\n    - AuthorizesTransition\n    - StateTransition\n    default_mapping:\n      StructureArtifact: None or EvidenceOnly\n      EvidenceEnvelope: EvidenceOnly\n      FactEnvelope: EvidenceOnly, FactOnly, or RequiresEvaluator\n      DecisionEnvelope: RequestsDecision\n      ActionLicense: AuthorizesTransition\n      Action: StateTransition\n      Record: EvidenceOnly or FactOnly\n    rule: No contract may invent a local AuthorityEffect enum.\n  family_flow_law:\n    valid_upward: StructureArtifact -> EvidenceEnvelope -> FactEnvelope -> DecisionEnvelope -> ActionLicense\n      -> Action\n    valid_recording: Record records StructureArtifact, EvidenceEnvelope, FactEnvelope, DecisionEnvelope,\n      ActionLicense, and Action.\n    invalid_downward:\n    - EvidenceEnvelope -> FactEnvelope without checking\n    - FactEnvelope -> EvidenceEnvelope by erasing judgment\n    - DecisionEnvelope -> FactEnvelope\n    - ActionLicense -> DecisionEnvelope\n    - Action -> ActionLicense\n    - Action -> DecisionEnvelope\n    - Record -> Action\n    - Record -> Policy\n    - Trace -> implicit execution\n    - Certificate -> authority above attached evidence\n  representation_meaning_split:\n    required_split:\n      representation_change: RepresentationBoundary / Projector / ForgetfulBoundary\n      shape_checking: Parser / PacketValidator / CheckedPacket boundary\n      meaning_judgment: Evaluator\n      policy_decision: Policy / MetaJudgment\n      transition_license: Terminalizer / Licensing boundary\n      state_transition: Engine\n  operator_authority_law:\n    effect_classes:\n      E: exact repair\n      I: quotient isometry\n      C: context embedding\n      R: residual projection\n      M: refused mutation\n    rules:\n    - No candidate may self-declare its operator class.\n    - Operator classification must be evidence-based.\n    - M is absorbing refusal and is never composable.\n    - No commutation, compression, or normalization without explicit RewriteLaw or certificate.\n    - R requires deterministic TiePolicy.\n    - C . C requires declared context composition.\n    - Normal form must emit rewrite trace and certificate references.\n  lift_law: 'A lift requires: obstruction reference, witness references, certificate references,\n\n    lift license, MetaJudgment approval when governance or layer authority changes,\n\n    Engine execution boundary.\n\n    A lift license authorizes a lift but does not execute it.\n\n    Any structural ascent, carrier/schema expansion, or layer transition without a\n\n    lift license is invalid.\n\n    '\n  trace_law:\n    allows:\n    - replay\n    - audit\n    - debugging\n    - provenance\n    must_not:\n    - trigger execution\n    - encode hidden policy\n    - mutate runtime state\n    - enrich records post-hoc\n    - act as cache\n    - control future behavior without a declared TraceConsumerContract\n  constitutional_laws:\n  - NoJudgmentInsideFacts\n  - NoDecisionInsideFacts\n  - NoActionInsideRecords\n  - NoExecutionInsideLicenses\n  - NoLiftWithoutWitness\n  - NoLiftWithoutLicense\n  - NoAuthorityAboveEvidence\n  - NoSemanticCreationInsideRepresentationBoundaries\n  - NoTruthClaimInsidePacketization\n  - NoLLMSelfCertification\n  - NoSearchAuthority\n  - NoSolverTransitionAuthorization\n  - NoEnginePolicyEvaluation\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - facts_and_decisions\n    - evidence_and_fact_without_checking\n    - decision_executes_action\n    - license_executes_action\n    - record_controls_execution\n    - unlicensed_lift\n    - implicit_trace_control\n    - local_authority_effect_enum\n    - local_artifact_family_enum\n    - semantic_creation_without_lift\n    - semantic_creation_inside_representation\n    - packetization_claims_truth\n    - certificate_creates_authority\n    - certificate_authority_exceeds_evidence\n    - llm_certifies_output\n    - search_selects_best\n    - search_certifies_candidate\n    - solver_authorizes_transition\n    - engine_evaluates_policy\n    - terminalizer_executes_action\n    - evaluator_mutates_state\n    - health_model_prescribes_action\n    - god_object\n  required_tests:\n  - contract_declares_primary_artifact_family\n  - contract_declares_referenced_artifact_families\n  - contract_declares_authority_effect\n  - contract_declares_implementation_boundary\n  - contract_does_not_emit_evidence_and_fact_from_unchecked_interface\n  - contract_does_not_emit_fact_and_decision_from_same_interface\n  - contract_does_not_emit_decision_and_action_license_from_same_interface\n  - contract_does_not_emit_action_license_and_action_from_same_interface\n  - contract_does_not_emit_record_and_action_from_same_interface\n  - contract_does_not_define_local_authority_enum\n  - contract_does_not_define_local_artifact_family_enum\n  - contract_declares_forbidden_authority\n  - contract_declares_required_tests\n  - contract_rejects_unlicensed_lift\n  - contract_rejects_trace_execution_control\n  - contract_rejects_certificate_authority_above_evidence\n  - contract_rejects_llm_self_certification\n  - contract_rejects_search_claiming_authority\n  - contract_rejects_solver_authorizing_transition\n  - contract_rejects_engine_internal_evaluation\n  - contract_rejects_packetization_semantic_truth_claim\n  - contract_rejects_health_model_action_prescription\n  - contract_distinguishes_action_license_from_action\n  - contract_distinguishes_evidence_from_fact\n  canonical_invariant: 'Structure, Evidence, Fact, Decision, ActionLicense, Action, and Record are separate\n\n    artifact families. Evidence may support facts only through checking. Facts may support\n\n    decisions only through evaluation or policy. Decisions may support action licenses only\n\n    through terminalization or licensing. Action licenses may authorize actions but may not\n\n    execute themselves. Records may record all and control none.\n\n    '\n  legacy_metadata:\n    name: ContractConstitution\n    role: Root governance law for all contracts\n    version: '2.0'\n    classification: constitution\n    doctrine_version: 2026-05\n    depends_on: []\n    forbidden_authority: *id001\n    primary_output_family: StructureArtifact\n    domain_output_kind: ConstitutionalLaw\n    referenced_output_families:\n    - StructureArtifact\n    referenced_domain_kinds:\n    - ContractRule\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\n\nrelationships:\n  extends:\n    - \"urn:omega:constitution:base_constitution_contract:v1.0.0\"\n",
      "original_paths": [
