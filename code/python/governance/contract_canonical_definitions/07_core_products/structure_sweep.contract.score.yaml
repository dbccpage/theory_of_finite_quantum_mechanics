l\n  - TypeDrift\n  - OpenPromotedToSurvived\n  - AuthorBlindGateViolation\n  - ModelSelfCertificationAttempt\n  - TerminalStatusMismatch\n  - OracleRequiredButClaimedCertificate\n  - LocalGreenGlobalRed\n  - UndeclaredSourceId\n  - UnterminalizedPostGateRow\n  - RunIdEchoMismatch\n  - BundleHashEchoMismatch\n  replay_obligation:\n    description: 'Every certified row must be replayable from recorded artifacts.\n\n      '\n    required_fields:\n    - packet_id\n    - run_id + bundle_sha256 echo\n    - author_model / gate_model (host-stamped)\n    - gated_verdict + required_witness\n    - host_terminal_status + output_lane + authority_ceiling\n    - ingest index entry (content_sha256, pass_id, lane)\n    note: 'Tier A replay parity (re-terminalize committed survivors) and the hostile fixture suite\n\n      are the standing acceptance evidence; see required_tests.\n\n      '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - certify\n    - terminalize\n    - authority_upgrade\n    - sign_certificate\n  required_tests:\n  - hostile_validator_frozen_fixtures_pass\n  - hostile_terminalizer_tf_fixtures_pass\n  - hostile_router_rt_fixtures_pass\n  - hostile_ingest_ig_fixtures_pass\n  - canon_hash_known_answers\n  - replay_parity_tier_a\n  canonical_invariant: 'The Structure Sweep''s only authority is deterministic host code. The validator\n\n    never emits Certificate or OracleNeeded; gate workers are forbidden to assign routing; the router\n\n    only moves rows whose terminal status is already stamped and fails closed on anything unstamped;\n\n    the terminalizer is the sole Certificate-minting site and certifies only strict-clean, witnessed,\n\n    author-blind survivor verdicts. The Certificate stamp is product-internal evidence at LocalReplay\n\n    ceiling and confers no omega-level authority.\n\n    '\n  legacy_metadata:\n    name: StructureSweep\n    role: Corpus-scale structure-correspondence sweep with deterministic auth