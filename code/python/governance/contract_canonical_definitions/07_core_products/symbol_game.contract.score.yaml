    "doctrine": {
      "summary": "This contract defines the Symbol Game product boundary.\n\nThe Symbol Game is a finite-symbol reasoning wrapper. It converts math intents, prompts, proof\nsketches, solver requests, or model responses into constrained symbolic packets that can be parsed,\nlocally checked, globally boundary-checked, refused, or traced.\n\nThe Symbol Game does not prove correctness by itself. It produces replayable traces, validation\nreports, terminal statuses, and certificate material.\n\nIt may use S(n) context levels internally, but the public product boundary is not a tower-height claim.\n",
      "non_role": [
        "proving correctness by itself",
        "certification",
        "execution of state transitions",
        "authority upgrade"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "LLM output entering the Symbol Game is treated as candidate material only (Doctrine 5). The Symbol\nGame parses, validates, and traces LLM-generated moves using the same rules as any other input\nsource. LLM provenance is recorded in the trace but confers no authority.\n"
      },
      "classification": {
        "subsystem": "Product Layer",
        "role": "Finite-symbol reasoning wrapper producing replayable traces and validation reports.",
        "classification": "Product layer -- Symbol Game is a product boundary that wraps symbolic reasoning."
      },
      "admissibility_checklist": [
        "Packet grammar is declared",
        "Allowed alphabet is declared",
        "Symbol payload parses unambiguously",
        "Local rules are declared",
        "Global boundary is declared",
