    "doctrine": {
      "summary": "Age-based retention that destroys trace CONTENT while preserving the hash ledger. Redaction is never an in-place edit - replay recomputes event_sha256 per event, so no edit removes the text and still satisfies verify(). Retention therefore emits a distinct RedactedTraceV1 and leaves the source trace unmutated. Preserved across redaction - every recorded event_sha256 and parent_sha256, the run replay_sha256, and therefore the linkage invariant, which stays checkable with no content present. Not preserved - the ability to re-derive those digests. A redacted artifact is NOT replay-verified and must not be described as such. LegalHold outranks any window and the redactor refuses outright on a held record.",
