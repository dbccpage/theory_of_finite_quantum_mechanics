      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:evidence:published_paper_carrier:v1.0.0\ntitle: PublishedPaperCarrier\nkind: evidence_contract\nstatus: mathematical_wip\nlayer: 02_evidence\nrole: Carrier\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: []\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndefinition:\n  # Canonical Title_Case marker this repository emits. Matching is\n  # case-INSENSITIVE on the marker so the lowercase `*_claim_ledger.md` form\n  # mandated by the file-naming rule is recognised too.\n  claim_ledger_marker: Claim_Ledger\n  claim_ledger_marker_lower: claim_ledger\n  # Files with this prefix at the corpus root are global proof ledgers, not papers.\n  proof_ledger_prefix: proof_ledger_\n  paper_id_grammar:\n    digits: 3\n    optional_lowercase_suffix: true\n    separators:\n    - _\n    - ' '\n    - '-'\n  # A ledger key names a paper by its ENCLOSING PROGRAMME plus its own leaf id,\n  # because a leaf id alone is ambiguous across programmes: `PL-012-1` already\n  # exists in the ledgers and denotes 002_finite_obstruction_calculus/\n  # 006_degree_wise_dsl, NOT the root folder 012_mutually_unbiased_bases.\n  #\n  # The separator is `.` and MUST NOT be a member of paper_id_grammar.separators\n  # above. Disjointness is what makes a scoped key refuse rather than truncate\n  # when it is fed back through the local grammar: paper_id_of(\"009.000\") is\n  # None, while paper_id_of(\"009_000\") and paper_id_of(\"009-000\") would both\n  # answer Some(\"009\") -- silently collapsing the key onto its scope. build.rs\n  # asserts the disjointness at build time.\n  #\n  # A paper with no enclosing programme (a corpus-root folder, or one whose\n  # parent is not itself paper-shaped) is SELF-SCOPED: 999_published_in_general_media\n  # keys as `999.999`.\n  scoped_paper_id:\n    separator: '.'\n    root_scope_is_self: true\n  # Folders prefixed 993-999 are GT-tower variants carrying a theorem ledger and\n  # math spine instead of a manuscript plus claim ledger.\n  gt_tower_prefix:\n    first: 993\n    last: 999\n  # Papers live one level below the corpus root, inside a programme folder.\n  # A programme folder itself matches the paper-id grammar. It is distinguished\n  # from a paper by CONTAINING paper folders -- NOT by lacking a manuscript:\n  # programmes routinely carry index and overview documents at their root\n  # (001_gtoc_gtla/gt_tower_master_design.md, 003_quantum_foundations/qm_atlas.md,\n  # 000_witnessed_difference/000_witnessed_difference.md), so \"has no .md\" would\n  # misclassify them as papers and reintroduce id collisions.\n  programme_nesting_depth: 1\ndoctrine:\n  summary: 'Filename and folder grammar of the published paper carrier.\n\n    These were magic constants inside omega_rip_papers::carrier, which is why the\n    PR #1191 programme\n\n    reorganization silently broke enumeration: the grammar had no way to express\n    that a folder may\n\n    group papers rather than be one.\n\n    '\n  authority_defaults:\n    grammar: EvidenceOnly. Parsing a folder name is a shape observation. Recognising\n      a paper id grants no authority over the paper and upgrades no claim.\n  consumers:\n  - crate: omega_rip_papers\n    module: carrier\n    use: 'enumerate_papers, paper_id_of, is_claim_ledger_name, programme descent.\n\n      paper_id_of returns the LOCAL leaf key only. A ledger key for a paper is the\n      scoped\n\n      key, scope + scoped_paper_id.separator + leaf, composed from the enclosing\n      programme\n\n      folder; a paper with no paper-shaped parent is self-scoped.\n\n      '\n  required_tests:\n  - programme_folder_is_not_emitted_as_a_paper\n  - papers_inside_a_programme_are_enumerated\n  canonical_invariant: 'A folder matching the paper-id grammar is a programme if it\n    contains at least one child\n\n    folder that also matches the grammar; otherwise it is a paper. Enumeration descends\n    exactly one\n\n    level into a programme and never emits the programme itself as a paper. A GT-tower\n    folder is never\n\n    a programme.\n\n    A paper is named by its SCOPED key: the enclosing programme''s local id, then\n    scoped_paper_id.separator,\n\n    then the paper''s own local id. A paper with no paper-shaped enclosing folder\n    is self-scoped, so its\n\n    scope and leaf coincide. scoped_paper_id.separator is disjoint from paper_id_grammar.separators,\n    which is\n\n    what makes a scoped key REFUSE the local grammar instead of truncating to its\n    scope; GT-tower-ness is a\n\n    property of the LEAF id and is decided before scoping.\n\n    '\n\nrelationships:\n  extends:\n    - \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n",
