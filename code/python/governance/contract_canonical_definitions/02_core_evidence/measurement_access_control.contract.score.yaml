    "doctrine": {
      "summary": "MeasurementAccessControl prevents raw cohomological semantics from leaking into Search,\nSolver, Evaluator, Policy, TerminalMapper, LicensingBoundary, or Engine. Canonical\ncohomological measurement artifacts require admitted Functional emission and Measurement\nboundary checking.\n",
      "non_role": [
        "search_access_to_raw_cohomological_semantics",
        "solver_emission_of_canonical_cohomological_values",
        "evaluator_recomputation",
        "evaluator_canonical_measurement_emission",
        "policy_reinterpretation",
        "terminal_mapper_recomputation",
        "engine_recomputation",
        "engine_reinterpretation",
        "measurement_authority_promotion_without_checking",
        "cohomological_scalarization_outside_functional_boundary"
      ],
      "authority_defaults": {
        "access_report": "EvidenceOnly",
        "checked_access_fact": "FactOnly only for checked access-boundary claims."
      },
      "access_rules": {
        "search": "May consume opaque non-semantic hints only; does not rank or score candidates from raw measurements.",
        "solver": "Computes only; solver artifacts are not canonical measurements.",
        "evaluator": "May consume checked measurement references; must not recompute measurements.",
        "policy": "May consume checked references only under schema permission.",
        "terminal_mapper": "Maps terminal outcomes; must not recompute or reinterpret measurements.",
        "licensing_boundary": "May consume checked decision/evidence refs; emits ActionLicense only under its own contract.",
        "engine": "Executes licensed transitions only; must not branch on raw cohomological values."
      },
      "flow": "Functional / Observable / Solver / Analysis\n-> MeasurementKernel checked reference\n-> Evaluator / Policy\n-> TerminalMapper\n-> LicensingBoundary\n-> Engine executes licensed transition\n-> Trace\n",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "execute(",
          "terminalize(",
          "mutate_state",
          "authorize_transition",
          "license_transition",
          "self_certify",
          "compute_phi",
          "rank_candidates",
          "score_candidate"
        ]
      },
      "required_tests": [
        "search_has_no_raw_cohomological_measurement_access",
        "solver_output_is_not_canonical_measurement",
        "evaluator_consumes_checked_measurement_refs_only",
        "policy_cannot_reinterpret_measurements",
        "terminal_mapper_cannot_recompute_measurements",
        "licensing_boundary_precedes_engine",
        "engine_does_not_branch_on_raw_measurements"
      ],
      "canonical_invariant": "Canonical measurements are boundary-controlled evidence. Downstream governance consumes\nchecked references only and cannot recompute, reinterpret, scalarize, authorize, or execute\nfrom raw cohomological values.\n",
