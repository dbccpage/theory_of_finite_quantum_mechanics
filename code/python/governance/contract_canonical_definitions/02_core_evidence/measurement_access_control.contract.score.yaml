ces; must not recompute measurements.\n    policy: May consume checked references only under schema permission.\n    terminal_mapper: Maps terminal outcomes; must not recompute or reinterpret measurements.\n    licensing_boundary: May consume checked decision/evidence refs; emits ActionLicense only under its\n      own contract.\n    engine: Executes licensed transitions only; must not branch on raw cohomological values.\n  flow: 'Functional / Observable / Solver / Analysis\n\n    -> MeasurementKernel checked reference\n\n    -> Evaluator / Policy\n\n    -> TerminalMapper\n\n    -> LicensingBoundary\n\n    -> Engine executes licensed transition\n\n    -> Trace\n\n    '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - execute(\n    - terminalize(\n    - mutate_state\n    - authorize_transition\n    - license_transition\n    - self_certify\n    - compute_phi\n    - rank_candidates\n    - score_candidate\n  required_tests:\n  - search_has_no_raw_cohomological_measurement_access\n  - solver_output_is_not_canonical_measurement\n  - evaluator_consumes_checked_measurement_refs_only\n  - policy_cannot_reinterpret_measurements\n  - terminal_mapper_cannot_recompute_measurements\n  - licensing_boundary_precedes_engine\n  - engine_does_not_branch_on_raw_measurements\n  canonical_invariant: 'Canonical measurements are boundary-controlled evidence. Downstream governance\n    consumes\n\n    checked references only and cannot recompute, reinterpret, scalarize, authorize, or execute\n\n    from raw cohomological values.\n\n    '\n  legacy_metadata:\n    name: MeasurementAccessControl\n    source_file: non-math/02_evidence/measurement_access_control_contract.md\n    active: true\n    machine_authority: true\n    role: Cohomological measurement boundary enforcement\n    version: '2.0'\n    classification: evidence\n    effect_class: none\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: EvidenceEnvelope\n    domain_output_kind: MeasurementAccessReport\n    referenced_output_families:\n    - FactEnvelope\n    - Record\n\nrelationships:\n  extends:\n    - \"urn:omega:constitution:base_evidence_contract:v1.0.0\"\n  coalescence_mode: \"specializes\"\n  coalesces_with:\n    - \"urn:omega:evidence:measurement_kernel:v1.0.0\"\n",
