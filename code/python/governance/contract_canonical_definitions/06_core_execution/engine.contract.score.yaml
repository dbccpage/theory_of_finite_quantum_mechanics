      "flow": "EvidenceEnvelope / FactEnvelope -> Evaluator / Policy -> TerminalMapper -> LicensingBoundary emits ActionLicense -> Engine executes licensed transition -> EngineAction -> TraceArtifact / Record ",
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "mutate_without_action_license",
