    "doctrine": {
      "summary": "Engine is the uniquely authorized execution-layer mechanism by which an already licensed transition happens. Engine does not derive post-state. It validates and commits an already-computed detached transition artifact bound by a valid ActionLicense against the validated version of the licensed target carrier. ",
      "non_role": [
        "measurement",
        "solution_computation",
