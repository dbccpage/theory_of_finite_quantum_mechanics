      },
      "terminal_categories": {
        "VerifiedComplete": "Execution completed with full certificate chain. Required verified certificate/replay/evidence references are present. It does not mean TerminalMapper created or verified certificates.",
        "Refused": "Execution completed with an explicit Reject verdict. Records a refusal outcome. It is not the fixed-layer operator class M by itself.",
        "Fallback": "Execution completed under degraded conditions (e.g., budget exhaustion, solver timeout). Records degraded completion. It is not a repair instruction.",
        "UnverifiedComplete": "Execution completed but without sufficient certificate chain for full verification. It is not FactOnly by default.",
        "Indeterminate": "State or trace analysis is inconclusive or indeterminate."
      },
      "architectural_mandates": [
        {
          "name": "Terminal Outcomes Only",
          "text": "A TerminalMapper MUST NOT execute transitions or apply state changes. It solely declares the terminal mapping and packs the evidence into a terminal report."
        },
        {
          "name": "Mandatory Evidence and Clauses",
          "text": "A TerminalMapper MUST NOT synthesize or assume evidence. It requires explicit records of evidence used and policy clauses fired to build the terminal report."
        },
        {
          "name": "Terminal Decision Authority",
          "text": "A TerminalEnvelope uses RequestsDecision by default. A CheckedTerminalEnvelope may support FactOnly claims only about the recorded terminal report after replay, evidence, and certificate references are checked. TerminalMapper does not emit StateTransition."
        },
        {
          "name": "No Certification Authority",
          "text": "A TerminalMapper packages evidence references into envelopes. It does not sign, create, or verify certificates."
        },
        {
          "name": "No Evaluation Authority",
          "text": "A TerminalMapper does not judge whether evidence is admissible. That is the Evaluator's role."
        }
      ],
      "record_integration": "TerminalEnvelope is a terminal report artifact. Trace records TerminalEnvelope references\nthrough the Trace boundary.\n\nTerminalMapper MUST NOT write Trace directly unless explicitly invoked through the\nTrace boundary.\n\nTerminalMapper MUST NOT emit ActionLicense. LicensingBoundary consumes TerminalEnvelope\nreferences and emits ActionLicense when permitted.\n",
