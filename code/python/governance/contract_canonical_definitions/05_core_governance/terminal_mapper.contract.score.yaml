        "terminal_mapper_does_not_emit_state_transition",
        "terminal_mapper_does_not_emit_action_license_unless_explicitly_licensed_boundary",
        "terminal_envelope_is_not_action_license",
        "terminal_envelope_is_not_trace_record_by_itself",
        "terminal_mapper_does_not_write_trace_directly",
        "terminal_mapper_consumes_refs_not_mutable_engine_state",
        "terminal_category_verified_complete_does_not_create_certificate",
        "fallback_terminal_status_is_not_repair_instruction",
        "refused_terminal_status_is_not_operator_m",
        "terminalizer_name_is_migration_alias_only"
      ],
      "python_poc_shape": "@dataclass(frozen=True)\nclass TerminalEnvelope:\n    row_id: str\n    terminal_category: str  # VerifiedComplete, Refused, Fallback, UnverifiedComplete, Indeterminate\n    state_ref: str\n    trace_ref: str\n    evidence_used: Sequence[str]\n    clauses_fired: Sequence[str]\n    authority_effect: str = \"RequestsDecision\"\n",
      "canonical_invariant": "TerminalMapper is a terminal outcome mapping boundary. It maps finalized state and trace\nreferences plus evidence references into a typed TerminalEnvelope. It does not certify,\nevaluate admissibility, define policy, compute measurements, mutate, write Trace directly,\nauthorize transitions, or execute. TerminalEnvelope is not an ActionLicense, Action,\nEngineResult, or Trace record by itself. Checked terminal report facts require\nreplay/evidence/certificate checking.\n",
