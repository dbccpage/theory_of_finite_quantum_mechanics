        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n        promotion_condition: checked_evidence_boundary_passed\n    enums:\n    - name: CarrierDelta\n      variants:\n      - name: AddGenerator\n        fields:\n          generator_kind: GeneratorKind\n      - name: AddContext\n        fields:\n          context_kind: ContextKind\n      - name: AddObservable\n        fields:\n          observable_kind: ObservableKind\n      - name: AddRelation\n        fields:\n          relation_kind: RelationKind\n      - name: AddCell\n        fields:\n          cell_kind: CellKind\n      - name: AddBoundary\n        fields:\n          boundary_kind: BoundaryKind\n      - name: ChangeRepresentation\n        fields:\n          representation_kind: RepresentationKind\n  execution_boundary: \"Lift artifacts do not execute carrier extension.\\n\\nOnly Engine may execute a lift,\\\n    \\ and only after a valid LiftLicense is present.\\n\\nRequired flow:\\n  ObstructionArtifact / checked\\\n    \\ obstruction evidence\\n  -> LiftRequest\\n  -> MetaJudgment\\n  -> MetaLiftDecision\\n  -> checked MetaLiftContract\\n\\\n    \\  -> LiftLicense\\n  -> Engine executes licensed lift\\n  -> Trace records action\\n\"\n  decision_boundary: 'Lift defines licensed carrier expansion. Engine executes lift only after a valid\n\n    LiftLicense authorizes the checked MetaLiftContract and required replay/certificate\n\n    checks pass.\n\n    '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - apply_lift_now(\n    - execute_lift(\n    - mutate_carrier(\n    - override_policy(\n    - retry_lift(\n    - repair_via_lift\n    - search_expansion(\n    - PolicyDecision\n    - TerminalEnvelope\n    - EngineResult\n    - ALLOW_OUTPUT\n    - BLOCK_OUTPUT\n    - GaugeOp\n    - AdapterOp\n    - ForgetfulOp\n    - OperatorFactEnvelope\n    - OperatorId\n    - OperatorKind\n    - BasisOperator\n    - Exten