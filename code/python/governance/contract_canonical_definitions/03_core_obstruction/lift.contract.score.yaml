      "execution_boundary": "Lift artifacts do not execute carrier extension.\n\nOnly Engine may execute a lift, and only after a valid LiftLicense is present.\n\nRequired flow:\n  ObstructionArtifact / checked obstruction evidence\n  -> LiftRequest\n  -> MetaJudgment\n  -> MetaLiftDecision\n  -> checked MetaLiftContract\n  -> LiftLicense\n  -> Engine executes licensed lift\n  -> Trace records action\n",
