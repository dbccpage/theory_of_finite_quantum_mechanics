          "code": "def test_lift_without_license_fails():\n  req = LiftRequest(\n    source_carrier=\"C0\",\n    target_carrier=\"C1\",\n    obstruction_ref=\"obs1\",\n    license_ref=None,\n  )\n  with pytest.raises(ValueError):\n    validate_lift_request(req, {})\n"
