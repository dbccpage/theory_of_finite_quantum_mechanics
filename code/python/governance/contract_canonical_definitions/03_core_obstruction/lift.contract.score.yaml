      "canonical_invariant": "Lift machinery separates request, decision, contract, license, and execution. LiftRequest\nis EvidenceOnly. MetaJudgment decides admissibility. MetaLiftContract describes the\ncarrier-extension schema. LiftLicense authorizes the Engine to attempt the transition.\nEngine alone executes the lift. Lift does not repair, adapt, search, override policy,\nterminalize, mutate, or execute by itself.\n",
