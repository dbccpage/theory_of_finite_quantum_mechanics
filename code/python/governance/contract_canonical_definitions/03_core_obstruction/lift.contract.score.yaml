        "repair",
        "retry",
        "adapter conversion",
        "operator application",
        "search expansion",
        "policy override",
        "direct execution"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate, terminalize,\nauthorize transitions, execute transitions, license lifts, prove minimality, or upgrade\nevidence authority.\n\nAn LLM may propose a LiftRequest or MetaLiftContract candidate, but that proposal is\nEvidenceOnly until checked by MetaJudgment, CertificateKernel, and the Licensing boundary.\n"
      },
      "effect_class_binding": {
        "doctrine": 6,
        "text": "Lift is NOT an effect-class (E/I/C/R/M). Lift is lift machinery -- it defines how the\nstructural carrier expands to internalize an irreducible obstruction. The effect-classes\nE, I, C, R, M operate within a fixed carrier; Lift changes the carrier itself.\n",
        "operator_note": "Only E (exact repair), I (quotient isometry), C (context embedding), R (residual projection),\nand M (refused mutation) are operators. Lift is not an operator.\nSee fixed_layer_operator_algebra_contract.md.\n"
      },
      "classification": {
        "subsystem": "Obstruction Resolution",
        "role": "Licensed carrier extension (lift machinery).",
        "classification": "Obstruction layer -- carrier expansion."
      },
      "core_definition": "A Lift defines exactly how the structural carrier expands to internalize an irreducible\nobstruction. It is not an arbitrary modification.\n",
