        "retry",
        "adapter conversion",
        "operator application",
        "search expansion",
        "policy override"
      ],
      "what_lift_is": "A typed licensed transition schema from C_N to C_{N+1}, executable only by Engine after a\nvalid LiftLicense is present.\n",
