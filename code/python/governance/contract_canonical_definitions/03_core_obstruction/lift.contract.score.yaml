    and M (refused mutation) are operators. Lift is not an operator.\n\n      See fixed_layer_operator_algebra_contract.md.\n\n      '\n  classification:\n    subsystem: Obstruction Resolution\n    role: Licensed carrier extension (lift machinery).\n    classification: Obstruction layer -- carrier expansion.\n  core_definition: 'A Lift defines exactly how the structural carrier expands to internalize an irreducible\n\n    obstruction. It is not an arbitrary modification.\n\n    '\n  what_lift_is_not:\n  - repair\n  - retry\n  - adapter conversion\n  - operator application\n  - search expansion\n  - policy override\n  what_lift_is: 'A typed licensed transition schema from C_N to C_{N+1}, executable only by Engine after\n    a\n\n    valid LiftLicense is present.\n\n    '\n  core_invariant: No lift without inhabited LiftLicense.\n  lift_artifact:\n    description: Every lift requires a rigorous structural derivation.\n    schema:\n      source_carrier: C_N\n      target_carrier: C_{N+1}\n      delta: schema_extension\n      obstruction_witness: witness_id\n      descent_blocked_witness: exhaustion_witness_id\n      persistence_witness: persistence_witness_id\n      authority_license: license_id\n      cost_derivation: eta_cost_struct\n      minimality_argument: congruence_restoration_proof\n    artifact_envelopes:\n      LiftRequest: EvidenceEnvelope\n      MetaLiftDecision: DecisionEnvelope\n      MetaLiftContract: EvidenceEnvelope or FactEnvelope after checking\n      LiftLicense: ActionLicense\n      EngineAppliedLift: Action\n  structural_representation:\n    lift_request:\n      struct_name: LiftRequest\n      fields:\n      - name: request_id\n        type: LiftRequestId\n      - name: source_carrier\n        type: CarrierRef\n      - name: target_carrier_schema\n        type: CarrierSchemaRef\n      - name: obstruction_ref\n        type: ObstructionId\n      - name: requested_delta\n        type: CarrierDelta\n      - name: witness_refs\n        type: Vec<Witne