      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:obstruction:residual_projection:v1.0.0\ntitle: ResidualProjection\nkind: obstruction_contract\nstatus: mathematical_wip\nlayer: 03_obstruction\nrole: FixedLayerOperatorAlgebra\ndescriptor:\n  authority_effect: evidence_only\n  evidence_ceiling: LocalReplay\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: &id001\n    - FixedLayerOperatorAlgebra\n    - CarrierContract\n    - ObstructionContract\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\ndoctrine:\n  summary: 'A checked ResidualProjection may instantiate R = residual projection in the fixed-layer\n\n    operator algebra: a deterministic projection to a residual representative under declared\n\n    TiePolicy, preserving required invariants and recording discarded information.\n\n\n    Residual Projection is one of the five fixed-layer effect-classes in the obstruction algebra.\n\n\n    ResidualProjectionCandidate is EvidenceOnly.\n\n    CheckedResidualProjection may become FactOnly after surjectivity, TiePolicy, invariant\n\n    preservation, discarded-information evidence, and replay checks.\n\n    ResidualProjectionLicense, if emitted, is AuthorizesTransition.\n\n    Engine-executed projection is StateTransition.\n\n    '\n  non_role: &id002\n  - Reconstructing discarded information\n  - Certifying that discarded information was irrelevant without evidence\n  - Executing state transitions\n  - Evaluating admissibility\n  effect_class_designation:\n    effect_class: R\n    name: Residual Projection\n    composition_laws:\n    - R . R may normalize to R only when source/target compatibility, deterministic TiePolicy composition,\n      invariant preservation, replay support, and explicit RewriteLaw or certificate are present.\n    - R . M or M . R targets M only under checked composition; malformed refusal records are invalid evidence,\n      not automatically M.\n    - C . R != identity in general (information loss in R is irreversible)\n  structural_representation:\n    candidate:\n      struct_name: ResidualProjectionCandidate\n      fields:\n      - name: projection_id\n        type: ProjectionId\n      - name: source_carrier\n        type: CarrierRef\n      - name: target_carrier_schema\n        type: CarrierSchemaRef\n      - name: projection_map_ref\n        type: ProjectionWitnessId\n      - name: tie_policy\n        type: TiePolicyId\n      - name: discarded_dimensions\n        type: Vec<DimensionId>\n      - name: invariants_preserved\n        type: Vec<InvariantId>\n      - name: invariants_discarded\n        type: Vec<InvariantId>\n      - name: evidence_refs\n        type: Vec<EvidenceRef>\n      - name: witness_refs\n        type: Vec<WitnessId>\n      - name: certificate_refs\n        type: Vec<CertificateId>\n      - name: replay_refs\n        type: Vec<ReplayRef>\n      - name: projection_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: EvidenceOnly\n    checked:\n      struct_name: CheckedResidualProjection\n      fields:\n      - name: projection_id\n        type: ProjectionId\n      - name: candidate_ref\n        type: ProjectionId\n      - name: surjectivity_certificate\n        type: CertificateId\n      - name: tie_policy_certificate\n        type: CertificateId\n      - name: preservation_certificate\n        type: CertificateId\n      - name: discarded_information_certificate\n        type: CertificateId\n      - name: checked_hash\n        type: Hash256\n      - name: authority_effect\n        type: AuthorityEffect\n        default: FactOnly\n    enums:\n    - name: ResidualProjectionRefusal\n      variants:\n      - SourceMalformed\n      - TargetNotSubspace\n      - ProjectionNotSurjective\n      - name: RequiredInvariantDiscarded\n        fields:\n          invariant: InvariantId\n      - name: NoEvidenceForIrrelevance\n        fields:\n          dimension: DimensionId\n      - AuthorityExceedsEvidence\n  authority_boundary:\n    may:\n    - Project a carrier to a lower-dimensional subspace\n    - Discard dimensions that are certified as irrelevant\n    - Produce a residual carrier with preserved invariants\n    must_not:\n    - Reconstruct discarded information\n    - Certify relevance/irrelevance without evidence\n    - Execute state transitions\n    - Evaluate admissibility (that is the Evaluator's role)\n    - Terminalize\n    - Create certificates\n  admissibility_checklist:\n  - Source carrier must be well-formed\n  - Target carrier must be a valid subspace of source\n  - Projection map must be surjective\n  - All invariants required by the target must be preserved\n  - Discarded dimensions must be certified as irrelevant by attached evidence\n  - Candidate authority effect is EvidenceOnly. Evaluation may be required before licensing or execution.\n    The checked projection fact may be FactOnly if all certificates verify.\n  tie_policy_law: 'Residual projection requires a deterministic TiePolicy.\n\n\n    If multiple residual representatives are possible, the projection is invalid unless the\n\n    TiePolicy selects one deterministically and replayably.\n\n\n    R without declared TiePolicy is refused.\n\n    '\n  refusal_conditions: 'If any refusal condition triggers, the candidate is refused. The attempted mutation\n    may be\n\n    classified as M = refused mutation only by the fixed-layer operator classifier/checker.\n\n    The ResidualProjection contract itself does not self-assign M.\n\n    '\n  replay_and_certificate_obligation: \"- Every residual projection MUST be replayable from its ProjectionWitness\\n\\\n    - The projection map, discarded dimensions, TiePolicy, evidence refs, and certificate refs\\n  must\\\n    \\ be replayable and recordable by Trace when execution occurs. Trace records execution;\\n  it does\\\n    \\ not certify the projection.\\n- A certificate wrapping a residual projection inherits the authority\\\n    \\ of the weakest evidence\\n  it references (Doctrine 6)\\n\"\n  cross_subsystem_interfaces:\n  - subsystem: Carrier\n    interface: Source and target are Carrier instances\n  - subsystem: Obstruction\n    interface: R may be generated in response to an obstruction\n  - subsystem: Certificate\n    interface: R's evidence refs must reference valid certificates\n  - subsystem: Evaluator\n    interface: candidate authority is EvidenceOnly; evaluator judges admissibility\n  - subsystem: Engine\n    interface: Engine executes a residual projection only after a valid ActionLicense is present and required\n      evaluator/certificate/replay checks have passed.\n  - subsystem: Trace\n    interface: R is recorded in the execution trace\n  llm_exclusion:\n    doctrine: 5\n    text: 'The LLM is candidate generator only. An LLM may propose a residual projection as a\n\n      candidate, but the candidate carries no authority until certified by the obstruction\n\n      kernel and judged admissible by the Evaluator.\n\n      '\n  certificate_authority_bound:\n    doctrine: 6\n    text: 'Certificate authority wrapping a residual projection MUST NOT exceed the authority of\n\n      the evidence certifying that the discarded dimensions were irrelevant.\n\n      '\n  forbidden_implementation_tokens:\n    scope: behavior, not substring\n    tokens:\n    - execute_now(\n    - certify_now(\n    - evaluate_admissibility(\n    - terminalize(\n    - reconstruct_discarded(\n    - authority_upgrade(\n    - sign_certificate(\n    - apply_operator_now(\n    - self_declare_effect_class\n    - missing_tie_policy\n    - allow_nondeterministic_projection\n    - skip_tie_policy_check\n  required_tests:\n  - residual_projection_is_surjective\n  - residual_projection_preserves_required_invariants\n  - residual_projection_cannot_reconstruct_discarded\n  - residual_projection_candidate_defaults_to_evidence_only\n  - residual_projection_checked_fact_requires_certificates\n  - residual_projection_evidence_bound\n  - residual_projection_composes_to_residual\n  - residual_projection_absorbed_by_refusal\n  - residual_projection_replayable\n  - residual_projection_candidate_defaults_to_evidence_only\n  - checked_residual_projection_may_be_factonly_after_certificates\n  - residual_projection_requires_deterministic_tie_policy\n  - residual_projection_without_tie_policy_refused\n  - residual_projection_cannot_self_assign_m_refusal\n  - residual_projection_does_not_emit_action\n  - residual_projection_execution_requires_action_license\n  - residual_projection_records_discarded_information_certificate\n  canonical_invariant: 'ResidualProjection candidates are EvidenceOnly. A checked ResidualProjection may\n    instantiate\n\n    R = residual projection only with surjectivity evidence, deterministic TiePolicy,\n\n    invariant-preservation evidence, discarded-information evidence, and replay support.\n\n    R does not reconstruct discarded information, certify itself, evaluate admissibility,\n\n    terminalize, authorize, mutate, or execute. Engine execution requires a separate ActionLicense.\n\n    '\n  legacy_metadata:\n    name: ResidualProjection\n    role: 'Effect-class R candidate/check: deterministic residual projection with explicit discarded-information\n      evidence'\n    version: '2.0'\n    classification: operator\n    effect_class_target: R\n    effect_class_authority: checker_only\n    depends_on: *id001\n    forbidden_authority: *id002\n    primary_output_family: EvidenceEnvelope\n    referenced_output_families:\n    - FactEnvelope\n    - EvidenceEnvelope\n    referenced_domain_kinds:\n    - WitnessEnvelope\n    - CertificateEnvelope\n    supports_downstream:\n    - LicensingBoundary\n    llm_boundary: LLM is candidate generator only. LLM output carries no authority.\n\nrelationships:\n  extends:\n    - \"urn:omega:constitution:base_obstruction_contract:v1.0.0\"\n",
