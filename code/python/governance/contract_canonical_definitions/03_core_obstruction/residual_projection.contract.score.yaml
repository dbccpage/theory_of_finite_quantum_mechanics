          "self_declare_effect_class",
          "missing_tie_policy",
          "allow_nondeterministic_projection",
          "skip_tie_policy_check"
        ]
      },
      "required_tests": [
        "residual_projection_is_surjective",
        "residual_projection_preserves_required_invariants",
