                  "dimension": "DimensionId"
                }
              },
              "AuthorityExceedsEvidence"
            ]
          }
        ]
      },
      "authority_boundary": {
        "may": [
          "Project a carrier to a lower-dimensional subspace",
          "Discard dimensions that are certified as irrelevant",
          "Produce a residual carrier with preserved invariants"
        ],
        "must_not": [
          "Reconstruct discarded information",
          "Certify relevance/irrelevance without evidence",
          "Execute state transitions",
          "Evaluate admissibility (that is the Evaluator's role)",
          "Terminalize",
          "Create certificates"
        ]
      },
      "admissibility_checklist": [
        "Source carrier must be well-formed",
        "Target carrier must be a valid subspace of source",
        "Projection map must be surjective",
        "All invariants required by the target must be preserved",
        "Discarded dimensions must be certified as irrelevant by attached evidence",
        "Candidate authority effect is EvidenceOnly. Evaluation may be required before licensing or execution. The checked projection fact may be FactOnly if all certificates verify."
      ],
      "tie_policy_law": "Residual projection requires a deterministic TiePolicy.\n\nIf multiple residual representatives are possible, the projection is invalid unless the\nTiePolicy selects one deterministically and replayably.\n\nR without declared TiePolicy is refused.\n",
      "refusal_conditions": "If any refusal condition triggers, the candidate is refused. The attempted mutation may be\nclassified as M = refused mutation only by the fixed-layer operator classifier/checker.\nThe ResidualProjection contract itself does not self-assign M.\n",
      "replay_and_certificate_obligation": "- Every residual projection MUST be replayable from its ProjectionWitness\n- The projection map, discarded dimensions, TiePolicy, evidence refs, and certificate refs\n  must be replayable and recordable by Trace when execution occurs. Trace records execution;\n  it does not certify the projection.\n- A certificate wrapping a residual projection inherits the authority of the weakest evidence\n  it references (Doctrine 6)\n",
      "cross_subsystem_interfaces": [
        {
          "subsystem": "Carrier",
          "interface": "Source and target are Carrier instances"
        },
        {
          "subsystem": "Obstruction",
          "interface": "R may be generated in response to an obstruction"
        },
        {
          "subsystem": "Certificate",
          "interface": "R's evidence refs must reference valid certificates"
        },
        {
          "subsystem": "Evaluator",
          "interface": "candidate authority is EvidenceOnly; evaluator judges admissibility"
        },
        {
          "subsystem": "Engine",
          "interface": "Engine executes a residual projection only after a valid ActionLicense is present and required evaluator/certificate/replay checks have passed."
        },
        {
          "subsystem": "Trace",
          "interface": "R is recorded in the execution trace"
        }
      ],
      "llm_exclusion": {
        "doctrine": 5,
        "text": "The LLM is candidate generator only. An LLM may propose a residual projection as a\ncandidate, but the candidate carries no authority until certified by the obstruction\nkernel and judged admissible by the Evaluator.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "Certificate authority wrapping a residual projection MUST NOT exceed the authority of\nthe evidence certifying that the discarded dimensions were irrelevant.\n"
      },
      "forbidden_implementation_tokens": {
        "scope": "behavior, not substring",
        "tokens": [
          "execute_now(",
