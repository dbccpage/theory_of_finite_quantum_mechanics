schema_version: omega.file_contract.v1
kind: rust_file_contract
contract_id: urn:omega:engine:obstruction_runtime_engine:file:v1.0.0
crate: omega_engines
file: crates_rs/omega_engines/src/obstruction_runtime.rs
role: obstruction_runtime_environment
status: active_provisional
authority_effect: none
customer_claim_allowed: false
runtime_enforcement: required
owns:
  - obstruction_execution_pipeline
  - defect_accumulation_logging
does_not_own:
  - global_proof_verifier
  - authority
may_call:
  - omega_engine_core
must_not:
  - claim complete proof resolution
  - mint authority
exactness:
  numeric_mode: runtime_execution_records
  exact_certificate_allowed: false
forbidden_substrings:
  - "CertifiedAuthority"
  - "AuthorityEffect::Authorize"
required_substrings:
  - "AuthorityEffect::None"
required_tests:
  - test_obstruction_runtime_execution
