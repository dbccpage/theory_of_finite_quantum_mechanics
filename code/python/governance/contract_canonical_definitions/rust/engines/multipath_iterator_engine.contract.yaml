schema_version: omega.file_contract.v1
kind: rust_file_contract
contract_id: urn:omega:engine:multipath_iterator_engine:file:v1.0.0
crate: omega_engines
file: crates_rs/omega_engines/src/multipath_iterator.rs
role: multipath_execution_iterator_engine
status: active_provisional
authority_effect: none
customer_claim_allowed: false
runtime_enforcement: required
owns:
  - multipath_branch_enumeration
  - path_scoring_and_pruning
does_not_own:
  - global_optimality_oracle
  - authority
may_call:
  - omega_engine_core
must_not:
  - claim global optimality
  - mint authority
exactness:
  numeric_mode: f64_bounded_evaluation
  exact_certificate_allowed: false
forbidden_substrings:
  - "CertifiedAuthority"
  - "AuthorityEffect::Authorize"
required_substrings:
  - "AuthorityEffect::None"
required_tests:
  - test_multipath_iterator_execution
