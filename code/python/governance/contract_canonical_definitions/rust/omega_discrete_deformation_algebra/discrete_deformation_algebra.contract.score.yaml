    "notes": [
      "This contract enforces the Rust exact algebraic shadow of the Lean Lambda surface operations and the finite C0 -> C1 -> C2 diagnostic spine. Lean owns edge-valued boundary theorems, ontology-to-primitive bridge theorems, and FOC proof obligations. This crate owns checked same-face scalar operations, a declared oriented triangle boundary projection into C1, canonical edge-boundary merging, primitive differences from C0 potentials, C2 closure-defect/Gamma2 shadows, finite-window C0 -> C1 -> C2 scans, finite-window quotient diagnostic bridges, L1 edge tension, declared-scalar Q1 irreducibility consistency checks, PaperFOC005 finite Lambda step preservation certificates, observer passivity shadow certificates, PaperQF001 Xi hierarchy certificates, PaperQF002 Born-normalization redundancy certificates, Pub010 cross-term involution obstruction certificates, Paper015 proof-carrying AI proposal gates, PaperFOC000c claim-packet authority boundaries, and a non-authoritative diagnostic license gate. Cross-domain evidence is recorded in paper000c_claim_packet_evidence.md.",
      "PaperFOC003-Paper015 alignment: the crate may accept replayed quotient certificates and typed refusals, but it must not perform evaluator acceptance, quotient minimization, dual-witness synthesis, Xi ranking, observer authority creation, cross-term promotion without witnesses, AI lift acceptance without proof-carrying finite certificates, representation-only claim authority, trace-density representation, Hilbert-space derivation, Born-rule ontology, quantum-measurement derivation, or domain-trace certification."
    ]
