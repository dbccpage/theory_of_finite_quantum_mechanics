    "laws": [
      "Vector survival law: the differential acts on the vector, never on the norm, so both are carried and the caller chooses. Collapsing r into ||r||_1 loses the defect.",
      "Derived norm law: l1 is computed, never supplied. The fields are private and Deserialize recomputes, so a norm that disagrees with its vector is refused rather than admitted.",
      "Exact zero law: is_zero is exact. A residual of 1/1000000000 falls inside any 1e-8 tolerance gate, and reporting it closed would downgrade a witnessed open obstruction -- the Witness Dominance violation this file exists to prevent.",
      "Authority law: a residual is a measurement. It carries no verdict."
    ],
