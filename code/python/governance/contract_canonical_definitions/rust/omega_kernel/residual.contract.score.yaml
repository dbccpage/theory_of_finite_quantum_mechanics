      "pub fn is_zero"
    ],
    "required_tests": [
      "the_vector_survives_alongside_its_norm",
      "an_empty_residual_is_zero",
      "a_tiny_nonzero_residual_is_not_zero",
      "cancelling_entries_do_not_cancel_in_the_l1_norm",
