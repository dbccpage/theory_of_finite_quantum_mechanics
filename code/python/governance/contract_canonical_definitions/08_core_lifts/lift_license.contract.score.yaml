      "canonical_invariant": "LiftLicense is a scoped ActionLicense for structural ascent. It authorizes only the\ndeclared carrier/schema/level transition and only with attached checked obstruction,\ncontext witness, repair exhaustion, persistence, delta-minimality, constructor-set,\nreplay, and authority evidence. LiftLicense does not execute, mutate, repair, certify\nitself, terminalize, or transfer across scope. Engine alone executes the licensed\ntransition.\n",
