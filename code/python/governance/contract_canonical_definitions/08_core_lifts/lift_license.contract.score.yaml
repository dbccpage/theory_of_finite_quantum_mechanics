      "scope_binding": "A LiftLicense is scope-bound.\n\nIt authorizes only:\n  - the declared source carrier;\n  - the declared target carrier schema;\n  - the declared carrier delta;\n  - the declared obstruction;\n  - the declared level transition;\n  - the declared replay manifest;\n  - the declared evidence and certificate set.\n\nIt MUST NOT be reused for a different carrier, obstruction, packet, constructor family,\nlevel, schema, or delta.\n",
      "licensability_conditions": [
        "The obstruction packet is checked",
        "The obstruction is attached to a declared carrier, equivalence, and context family",
        "Admissible same-carrier repair is exhausted or blocked under declared budget",
        "A context witness supports non-congruence",
        "Persistence and irreducibility evidence are attached",
        "The constructor family is declared and hashed",
        "Delta-minimality is checked inside declared grammar and budget",
        "The post-lift carrier manifest is replayable",
        "Authority references permit this class of lift",
        "Certificate authority does not exceed attached evidence authority"
      ],
      "verdict_and_licensing_authority": "Evaluator may evaluate lower-level facts, exhaustion metrics, measurements, and\ncandidate quality within declared evaluator authority.\n\nMetaJudgment judges lift admissibility from submitted evidence.\n\nTerminalMapper / LicensingBoundary may seal terminal lift outcomes or issue a\nLiftLicense when its contract permits.\n\nLiftLicense authorizes ascent.\n\nEngine executes the licensed transition.\n\nTrace records what happened.\n\nAdmissibleForLicensing is not a LiftLicense. It is a decision result that may support\nlicense issuance by the licensing boundary.\n",
      "non_transferability_law": "A LiftLicense is not transferable across carriers, schemas, levels, contexts,\nobstruction IDs, packets, constructor sets, or replay manifests.\n\nAny mismatch between the license scope and the attempted Engine transition invalidates\nthe license for that transition.\n",
      "expiry_and_revocation_law": "A LiftLicense MAY expire or be revoked according to declared governance rules.\n\nExpired or revoked licenses MUST NOT authorize Engine execution.\n\nRevocation does not rewrite history. Trace records prior use; future execution must\nfail closed.\n",
      "engine_consumption_law": {
        "description": "Engine may consume a LiftLicense only as an authorization input.",
        "verification_checklist": [
          "license hash",
          "scope match",
          "expiry/revocation status",
          "required certificate refs",
          "replay manifest ref",
          "target carrier schema",
          "allowed delta",
          "authority effect is AuthorizesTransition"
        ],
        "constraint": "Engine MUST NOT repair missing license evidence."
      },
      "forbidden_authority_shortcuts": {
        "doctrine": "Authority can only be promoted by typed evidence, never by fluency, solver\nconfidence, or convenience.\n",
        "shortcuts": [
          "lift because search timed out",
          "lift because solver confidence is high",
          "lift because LLM explanation is fluent",
          "lift because a dashboard score is low",
          "lift because a candidate looks minimal",
          "lift without checked obstruction",
          "lift without context witness",
          "lift without repair exhaustion evidence",
          "lift without replayable post-lift manifest",
          "lift by reusing a license from a different scope"
        ]
      },
      "forbidden_implementation_tokens": {
