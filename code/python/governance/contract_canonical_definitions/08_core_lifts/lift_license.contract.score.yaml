    "doctrine": {
      "summary": "This contract defines the LiftLicense boundary.\n\nLiftLicense is a scoped ActionLicense for structural ascent. It authorizes only the\ndeclared carrier/schema/level transition and only with attached checked obstruction,\ncontext witness, repair exhaustion, persistence, delta-minimality, constructor-set,\nreplay, and authority evidence.\n\nLiftLicense does not execute, mutate, repair, certify itself, terminalize, or transfer\nacross scope. Engine alone executes the licensed transition.\n",
      "non_role": [
        "execution",
        "state mutation",
        "self-licensing",
        "self-certification",
        "lift without checked obstruction",
        "lift without context witness",
        "lift without repair exhaustion evidence",
        "lift without delta-minimality evidence",
        "lift without replay manifest",
        "authority above attached evidence"
      ],
      "llm_boundary_law": {
        "doctrine": 5,
        "text": "The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,\nterminalize, authorize transitions, execute transitions, license lifts, prove\nminimality, or upgrade evidence authority.\n\nLLM output may propose LiftRequest, LiftLicense, or MetaLiftContract candidates,\nbut those proposals are EvidenceOnly until checked by MetaJudgment, CertificateKernel,\nReplayKernel, and the licensing boundary.\n"
      },
      "certificate_authority_bound": {
        "doctrine": 6,
        "text": "LiftLicense authority MUST NOT exceed the authority of its attached evidence,\ndeclared checker capability, MetaJudgment decision, and governing contract.\n\nA LiftLicense may authorize only the specific structural ascent described by its\nchecked contract and evidence references.\n"
      },
      "classification": {
        "subsystem": "Obstruction Resolution / Structural Ascent",
        "role": "Scoped ActionLicense for structural ascent authorization.",
        "classification": "Lifts layer -- licensing boundary."
      },
      "governing_rule": "No structural lift L_n -> L_{n+1}, S(n) -> S(n+1), or carrier/schema expansion may\noccur without a replayable LiftLicense.\n\nA LiftLicense authorizes the Engine to attempt the declared transition. It is not the\ntransition, does not mutate the carrier, and does not execute itself.\n\nA LiftLicense authorizes a state transition into a higher structural complexity. It\nrequires independent checking, proof of non-congruence, and delta-minimality before\ntransition.\n",
      "artifact_authority_ladder": {
        "levels": [
          "Generated",
          "Parsed",
          "Checked",
          "Evaluated",
          "Licensed",
          "Executed",
          "Recorded"
        ],
        "separation_law": "Licensed and Executed are distinct. Licensed authorizes. Executed changes state\nthrough Engine. Recorded writes Trace.\n\nTerminal outcomes may exist alongside licensing, but terminalization is not execution.\n",
        "contract_law": "LiftLicense does not execute.\nEngine executes.\nTrace records.\n"
      },
