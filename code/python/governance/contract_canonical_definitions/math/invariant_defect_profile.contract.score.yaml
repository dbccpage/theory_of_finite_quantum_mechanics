    "doctrine": {
      "binding_review_20261014": "The declared Rust crate/module is absent from the active Cargo workspace. Withdraw this realization binding; the retained specification has no executable implementation credit from it.",
      "summary": "An InvariantDefectProfile is the ORDER-SENSITIVE per-invariant effect word recorded along an operator's normal form: for each declared invariant (e.g. Phi_1, Q^1, Gamma_2) it states whether the operator preserves, mutates, exposes, or destroys that invariant, in composition order. It is the realized \"Operator-Shadow\" classifier of the Invariant-Defect Discovery spine (invariant_discovery_theory.md Theorem 7.1): operators are classified by their invariant-defect signature under composition, NOT by their formula. The profile is a pure mathematical/diagnostic structure. It confers NO authority (authority_effect: none) and is NOT itself an operator.\n Nonclaim: this contract does not claim HoTT/Univalence discharge, PROVED status, or GlobalGreen.",
      "mathematical_role": "For an operator word w = o_1 . o_2 . ... . o_k normalized under the fixed-layer operator algebra (E < I < C < R; M non-composable), the profile is the sequence of per-invariant effect classes induced by each step, read in composition order. Two operators are profile-equivalent iff they induce the same effect word on the declared invariant family under the same authority packet. Order is significant: operator composition is non-commutative (IX-rewrite reorder rules; W2' is counterexampled), so the profile is a word, never a commutative aggregate.\n",
      "non_role": [
        "Minting or upgrading authority (authority arrives only via Pi-sharp + IsAuth)",
        "Classifying admissibility (that is the Evaluator's role)",
        "Executing or applying an operator",
        "Creating, signing, or wrapping certificates",
        "Claiming operator status for itself (it is the SIGNATURE of an operator, not one)"
      ],
      "distinct_from": {
        "obstruction_signature": "DIFFERENT object. ObstructionSignature (urn:math:contract:ObstructionSignature) is a SHA-256 content-address fingerprint of an obstruction CLASS (carrier group, degree, vanishing status). InvariantDefectProfile is the per-operator, order-sensitive effect word. They must not be conflated or merged.\n",
        "invariant_defect_severity_aggregate": "DIFFERENT object. The severity aggregate is documented by the archived snapshot research/archive/lean4_orphans/2026-07-22/OmegaCore/InvariantDefectMonoid.lean.txt. It is an ORDER-FREE commutative join (\"worst-case damage to an invariant\") used as a safety/damage bound in the feedback layer. The snapshot has no live Lean owner and is not proof evidence. The profile is the ORDER-SENSITIVE classifier; a commutative aggregate cannot classify non-commutative operators.\n"
      },
      "authority_boundary": {
        "may": [
          "Record the per-invariant effect word induced by an operator's normal form",
          "Compare two operators by profile equivalence",
          "Serve as a diagnostic lookup key (AuthorityEffect::None)"
        ],
        "must_not": [
          "Mint, upgrade, or launder authority",
