      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:math:xi_tie_breaker:v1.0.0\ntitle: Ξ representative-alignment diagnostic\nkind: math_contract\nstatus: mathematical_wip\nlayer: math\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts:\n    - urn:omega:math:phi1:v1.0.0\n    - urn:omega:math:phi1_obstruction_mass:v1.0.0\n    - urn:omega:math:gamma2_closure_defect:v1.0.0\n    - urn:omega:math:residual_projection:v1.0.0\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\nmath:\n  object_kind: xi_tie_breaker\n  ascii_symbol: xi_tie_breaker\n  symbol: xi_tie_breaker\n  notation: xi_tie_breaker\n  domain:\n  - 'carrier: instance of xi_tie_breaker'\n  codomain:\n    description: Mathematical object declared by Ξ representative-alignment diagnostic (structural shell).\nrequirements:\n  required_structures:\n  - Carrier for xi_tie_breaker must be finite/explicit where claimed\n  - Object kind and domain/codomain (or equivalent) must be declared\n  - Operations, if any, must preserve declared structure\n  - No authority effect may be self-assigned by the structure\nlaws:\n- Ξ representative-alignment diagnostic is a pure mathematical structure (AuthorityEffect none)\n- All declared required_structures must hold for a valid instance\n- 'Replay is deterministic: no external state, no randomness, no wall-clock'\n- This contract does not mint customer claims or GlobalGreen\nrust_binding:\n  crate: omega_functional\n  module: xi\n  symbols:\n  - DensityLift\n  - XiValidity\n  - XiResult\n  - XiComputation\n  - XiError\n  - XiFunctional\n  required_tests:\n  - test_saturation_failure_blocks_xi_admission\n  - test_density_lift_rejects_zero_mass\n  - test_density_lift_rejects_nan_entries\n  - compute_rejects_primal_dual_length_mismatch\n  - test_xi_cannot_decide_when_phi_worsens\n  - test_xi_cannot_decide_when_gamma_worsens\nnegative_tests:\n- Artifact claiming Ξ representative-alignment diagnostic without required structures must be rejected\n- Empty or ill-typed carrier for xi_tie_breaker must be rejected\n- Artifact claiming authority or admissibility must be rejected\n- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected\n- Non-deterministic or external-state-dependent construction must be rejected\ndoctrine:\n  summary: 'Tertiary representative-alignment diagnostic. Nonclaim: this contract does not claim HoTT/Univalence\n    discharge, PROVED status, or GlobalGreen.'\n  symbol: Ξ\n  ascii_symbol: Xi\n  formula: Ξ = ||ρ(h₁*) - ρ(φ*)||_tr\n  1. Contract metadata:\n    title: Ξ representative-alignment diagnostic\n    version: 0.1.0\n    object_type: tertiary_diagnostic\n  2. Mathematical object / functional role:\n    role: Tertiary representative-alignment diagnostic.\n    purpose: Compares deterministic density lifts of tied optimal primal residual and dual witness.\n    non_role:\n    - Does not measure obstruction magnitude.\n    - Does not replace Φ₁.\n    - Does not replace Γ₂.\n    - Does not classify policy admissibility.\n    - Does not issue certificates.\n    - Does not terminalize.\n    - Does not produce customer-facing claims.\n  3. Domain and codomain:\n    domain: 'Deterministic h₁* and φ* after Φ₁ and Γ₂ have been computed, with Φ₁ and Γ₂ tied under the declared\n      comparison mode if Ξ is used to decide.\n\n      '\n    codomain: nonnegative trace-distance scalar under declared normalization convention\n  4. Required structures:\n    required:\n    - Φ₁ result\n    - Γ₂ result\n    - deterministic TieR for h₁*\n    - deterministic dual tie policy for φ*\n    - 'saturation verification: <φ*, h₁*> = Φ₁'\n    - density lift ρ\n    - trace-distance definition\n    - trace-distance normalization convention\n  5. Definition:\n    formula: Ξ = ||ρ(h₁*) - ρ(φ*)||_tr\n    exact_repair_case: Ξ = 0 when Φ₁ = 0.\n    density_lift: 'ρ(v) is the declared conditional density lift. Zero-mass cases are undefined except through the\n      Φ₁ = 0 rule, where Ξ is forced to 0.\n\n      '\n    replayability_condition: 'Without deterministic TieR for h₁* and deterministic dual tie policy for φ*, Ξ is\n      not a replayable functional value.\n\n      '\n    trace_distance_convention:\n      required: true\n      allowed:\n      - half_normalized_range_0_1\n      - unhalved_range_0_2\n  6. Laws and invariants:\n    scale_invariant: ρ(λv) = ρ(v) for nonzero scalar λ under the declared scalar/sign/phase convention.\n    magnitude_blind: Ξ forgets obstruction magnitude.\n    nonnegativity: Ξ >= 0.\n    boundedness: Bounded according to declared trace-distance convention.\n    hierarchy: Ξ cannot override Φ₁ or Γ₂.\n    tie_only: Ξ may decide only among candidates after Φ₁ and Γ₂ are tied under declared mode.\n    saturation_required: Ξ is admissible as a diagnostic only when primal-dual saturation is replayed.\n  7. Equality / equivalence rules:\n    scalar_equality: Exact/tolerance comparison follows declared comparison mode.\n    density_equality: Depends on declared density-lift and trace-distance convention.\n    phase_equivalence: Global sign/phase changes of state vectors must not change ρ.\n  8. Replay / determinism requirements:\n    requirements:\n    - TieR replay for h₁*.\n    - Dual tie policy replay for φ*.\n    - Saturation replay.\n    - Density lift replay.\n    - Trace-distance replay.\n    - Normalization convention is hash-bound or schema-bound.\n    - Approximate trace distance must be labeled approximate and cannot masquerade as exact.\n  9. Relationship to other Omega primitives:\n    relationships:\n      Phi1: Ξ is zero when Φ₁ = 0 and cannot override Φ₁.\n      Gamma2: Ξ cannot override Γ₂.\n      R: Ξ depends on the deterministic residual selected by R/TieR.\n      EvaluationHierarchy: Ξ is the third lexicographic key only.\n      Trichotomy: Ξ does not change ExactRepair / StabilizedSurvivor / OpenObstruction classification.\n  10. Rust descriptor shape:\n    sketch: \"pub struct XiDescriptor {\\n    pub phi1_result_hash: String,\\n    pub gamma2_result_hash: String,\\n\\\n      \\    pub primal_tie_policy_hash: String,\\n    pub dual_tie_policy_hash: String,\\n    pub density_lift_definition_hash:\\\n      \\ String,\\n    pub trace_distance_definition_hash: String,\\n    pub trace_distance_convention: TraceDistanceConvention,\\n\\\n      \\    pub comparison_mode_hash: String,\\n}\\n\\npub enum TraceDistanceConvention {\\n    HalfNormalizedRangeZeroToOne,\\n\\\n      \\    UnhalvedRangeZeroToTwo,\\n}\\n\"\n  11. Negative definition tests:\n    tests:\n    - Ξ improves but Φ₁ worsens.\n    - Ξ improves but Γ₂ worsens.\n    - Ξ used when Φ₁ and Γ₂ are not tied.\n    - Ξ computed without deterministic TieR.\n    - Ξ computed without deterministic dual tie policy.\n    - Saturation identity fails.\n    - Trace norm replaced by entrywise matrix norm without declaring approximation.\n    - Zero-mass density lift used outside Φ₁ = 0 rule.\n    - Trace-distance normalization convention omitted.\n    - Ξ interpreted as obstruction magnitude.\n    - Ξ interpreted as observer-independent truth.\n  12. Open questions / WIP status:\n    wip:\n    - Trace norm normalization convention.\n    - Density lift behavior for signed/weighted domains.\n    - Exact scalar field and phase convention for density lift.\n    - Whether approximate numerical trace distance is allowed outside display/debug mode.\n  compact_yaml:\n    XI_TIE_BREAKER_CONTRACT:\n      symbol: Ξ\n      ascii_symbol: Xi\n      formula: Ξ=||ρ(h₁*)-ρ(φ*)||tr\n      status: mathematical_definition_wip\n      authority_effect: none\n      customer_claim_allowed: false\n      domain: deterministic tied optimal h₁*, φ* after Φ₁/Γ₂\n      codomain: nonnegative trace-distance scalar\n      required_structures:\n      - Φ₁\n      - Γ₂\n      - TieR\n      - dual tie policy\n      - saturation\n      - ρ\n      - trace distance\n      - normalization convention\n      definition: tertiary density-lift trace distance; Ξ=0 when Φ₁=0\n      laws:\n      - scale-invariant\n      - magnitude-blind\n      - nonnegative\n      - bounded by convention\n      - cannot override Φ₁/Γ₂\n      - tie-only\n      forbidden_interpretations:\n      - obstruction norm\n      - quantum score\n      - observer-independent truth\n      - authority signal\n      - replacement for Φ₁\n      - replacement for Γ₂\n      relationships:\n      - third evaluation key only\n      - depends on R/TieR\n      - does not alter trichotomy\n      negative_tests:\n      - Φ₁ worsens\n      - Γ₂ worsens\n      - Φ₁/Γ₂ not tied\n      - missing TieR\n      - missing dual tie policy\n      - saturation fails\n      - undeclared norm approximation\n      - zero-mass density misuse\n      - missing normalization convention\n      open_questions:\n      - normalization convention\n      - signed/weighted density lift\n      - phase convention\n      - approximate numerical mode\n  non_role:\n  - Authority minting or GlobalGreen discharge\n  - Customer-facing claims or product assurances\n  - Full encyclopedia mechanization of xi_tie_breaker (deferred)\n  - HoTT/Univalence theorem discharge from this contract alone\n  - Runtime enforcement as proof of mathematical truth\nnomos_debate_NOT_CANONICAL:\n  banner: NON-CANONICAL DEBATE ONLY — not contract law; not enforced; AuthorityEffect None\n  not_part_of_contract_law: true\n  authority_effect: none\n  potential_defects:\n  - reviewer: panepistimion-math-prof\n    role: MATH_CANONICAL_REVIEW\n    code: G_MATH_BLOCK\n    severity: medium\n    claim_class: '[STANDARD]'\n    detail: Missing or not detected field gate G_MATH_BLOCK\n    recommendation: Repair under meth-level math re-review (ADR-007); not GlobalGreen.\n  - reviewer: panepistimion-math-prof\n    role