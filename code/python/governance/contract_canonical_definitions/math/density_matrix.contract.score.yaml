        "partial_trace_rejects_dimension_mismatch",
        "mixture_rejects_negative_weight",
        "mixture_rejects_weight_sum_not_one",
        "config_try_new_rejects_negative_tolerance",
        "config_try_new_rejects_nan_tolerance",
        "config_try_new_rejects_psd_smaller_than_hermitian",
        "amplitudes_rejects_unnormalized_state"
      ]
    },
    "negative_tests": [
      "Construction with dimension=0 must fail",
      "Matrix with trace != 1 must fail validation",
      "Matrix with ρ != ρ† must fail validation",
      "Matrix with negative eigenvalues must fail validation",
      "NaN entries must be rejected immediately",
      "Data length != dimension² must fail",
      "Negative diagonal probabilities must fail",
      "Bloch vector with |r| > 1 must fail",
      "NaN in Bloch vector must fail",
      "Access beyond dimension must fail",
      "Incorrect subsystem dimensions must fail",
      "Negative mixture weights must fail",
      "Mixture weights not summing to 1 must fail",
      "Negative tolerance values must fail",
      "NaN tolerance values must fail",
      "psd_tol < hermitian_tol must fail consistency check",
      "State vector with ||ψ|| != 1 must fail"
    ],
    "doctrine": {
      "summary": "This contract specifies the mathematical structure and validation requirements for quantum density matrices. A density matrix is a positive semidefinite, Hermitian operator with trace one that represents the quantum state of a system. This contract covers both pure states (rank-1 projectors) and mixed states (convex combinations of pure states).\nThe contract enforces physical consistency through configurable numerical tolerances for trace, Hermiticity, and positive semidefiniteness checks. All operations are deterministic and replay-compatible.\nDensity matrices are fundamental to quantum information theory, quantum computing, and statistical quantum mechanics. They enable representation of both pure and mixed states, partial trace operations for subsystems, quantum channels via Kraus operators, and entropy calculations.",
      "non_role": [
        "Symbolic manipulation of density matrices",
