      "raw_utf8": "schema_version: omega.contract.v1\ncontract_id: urn:omega:math:combinatorial_chain_functor:v0.1.0\ntitle: Combinatorial Chain Functor Contract\nkind: math_contract\nstatus: mathematical_wip\nlayer: math\ndescriptor:\n  authority_effect: none\n  evidence_ceiling: ShapeOnly\n  runtime_enforcement: false\n  customer_claim_allowed: false\n  dependencies:\n    contracts: []\n    proof_obligations: []\n  terminals:\n    may_emit: []\n    may_support: []\n  refusals:\n    may_emit: []\n  operator_classes:\n    may_support: []\n    must_not_self_assign: true\nmath:\n  object_kind: construction_functor\n  symbol: 'F: FinGraph -> Ch_*(R)'\n  ascii_symbol: combinatorial_chain_functor\n  notation: 'F: FinGraph -> Ch_*(R)'\n  domain:\n  - 'finite_directed_graph: {''vertices'': ''finite_set V'', ''edges'': ''finite_set E'', ''source_map'': ''s: E -> V'', ''target_map'': ''t: E -> V'', ''orientation'': ''canonical_ordering on V and E''}'\n  - 'carrier: {''coefficient_ring'': ''R (commutative ring with unity)'', ''free_module_construction'': ''Set -> R-Mod (free R-module functor)''}'\n  - 'graph_carrier: {''chain_groups'': {''C_0'': ''R^V (free R-module on vertices)'', ''C_1'': ''R^E (free R-module on edges)'', ''C_n'': ''0 for n >= 2 and n < 0''}, ''boundary_maps'': {''d_1'': ''d_1(e) = t(e) - s(e) for each edge e in E'', ''d_n'': ''zero map for n != 1''}, ''basis_correspondence'': ''canonical bijection between graph elements and module generators''}'\n  codomain:\n    description: \"The carrier consists of three interlinked components: (1) finite_directed_graph: A finite directed graph G = (V, E, s, t)\\n    where V is a finite set of vertices, E is a finite set of directed\\n    edges, and s, t: E -> V are the source and target maps respectively.\\n(2) carrier: The free R-module construction that maps finite sets to\\n    free modules over the coefficient ring R.\\n(3) graph_carrier: The composite carrier that binds the graph structure\\n    to its chain complex representation, tracking the canonical basis\\n    correspondence between graph elements and module generators.\\n\"\nrequirements:\n  required_structures:\n  - d_n . d_{n+1} = 0 for all adjacent degree pairs in the output complex\n  - Graph orientation (vertex/edge ordering) must be fixed and canonical before construction\n  - Input graph must have finite vertex and edge sets\n  - d_1(e) = t(e) - s(e) must be computed solely from the source/target maps\n  - Graph morphisms must map to chain maps that commute with boundary operators\n  - Each chain group must be a free R-module with basis elements corresponding to graph cells\n  - Coefficient ring R must be a commutative ring with unity\n  - 'For graph morphism f: G -> H, the induced chain map must have compatible dimensions'\nlaws:\n- d_n . d_{n+1} = 0 for all n (boundary-of-a-boundary is zero)\n- F(id_G) = id_{F(G)} for every graph G\n- F(g . f) = F(g) . F(f) for composable graph morphisms f, g\n- d_1(e) = t(e) - s(e) is uniquely determined by the graph orientation\n- C_n(G; R) is the free R-module on the n-dimensional cells of G\n- 'For graph morphism f: G -> H, F(f) . d^G = d^H . F(f)'\n- C_n(G; R) = 0 for n >= 2 and n < 0 (graph complex is 2-term)\nreplay:\n  requirements:\n  - No external state\n  - No randomness\n  - No time-dependent data\n  - Graph serialization must use canonical vertex/edge ordering\n  - Boundary map construction must be deterministic from orientation\n  - Same graph with same orientation and same ring must produce identical complex hash\n  - Chain map construction must be deterministic from graph morphism\n  - Rechecking must reproduce all witness hashes identically\nrelationships:\n- urn:math:contract:ChainComplex:v0.1.0 serves as target_category_object\n- urn:math:contract:BoundaryMap:v0.1.0 serves as differential_maps_in_output_complex\n- urn:math:contract:Functor:v0.1.0 serves as functor_axiom_framework\n- urn:math:contract:LinearMap:v1.0.0 serves as structure_of_boundary_and_chain_maps\n- urn:math:contract:Category:v0.1.0 serves as source_category_FinGraph_and_target_category_Ch\n- urn:math:contract:ChainGroup:v0.1.0 serves as chain_group_construction_from_free_modules\nrust_binding:\n  crate: omega_homology\n  module: finite_directed_graph\n  realization_scope: partial_carrier\n  symbols:\n  - FiniteDirectedGraph\n  # Graph carrier only; not F: FinGraph -> Ch_*(R). This test discharges only\n  # the endpoint-membership negative_test. Every other obligation stays named\n  # below as an OPEN_OBLIGATION and the gate keeps this partial binding in the\n  # baseline worklist.\n  required_tests:\n  - new_rejects_edge_endpoint_outside_vertex_set\nnegative_tests:\n- 'A graph submitted without a canonical vertex/edge ordering must be rejected. The boundary map cannot be constructed without a fixed orientation determining the signs.\n\n  '\n- 'A purported chain complex where d_0 . d_1 != 0 must be rejected. This violates the fundamental chain complex law.\n\n  '\n- 'A graph with an unbounded or infinite vertex or edge set must be rejected. This contract covers only finite directed graphs.\n\n  '\n- 'A graph morphism that does not preserve source/target maps (f(s(e)) != s(f(e)) or f(t(e)) != t(f(e))) must be rejected. The induced chain map would not commute with boundary operators.\n\n  '\n- 'A coefficient ring that is not commutative or lacks a multiplicative identity must be rejected. Free module construction requires commutativity for well-defined scalar action.\n\n  '\n- 'Any artifact claiming authority, admissibility, trust, or certification must be rejected. This contract is purely mathematical.\n\n  '\n- 'A chain map whose matrix dimensions do not match the ranks of the source and target chain groups must be rejected.\n\n  '\n- 'A boundary map where d_1(e) != t(e) - s(e) for some edge e must be rejected. The boundary must be canonically determined by orientation.\n\n  '\n- 'A graph where the source or target map references a vertex not in V must be rejected. Source and target maps must be well-defined functions s, t: E -> V.\n\n  '\n- 'A construction where the provided vertex_basis_hash or edge_basis_hash does not match the canonical basis derived from the graph orientation must be rejected.\n\n  '\ndoctrine:\n  summary: 'Formally defines the construction functor F: FinGraph -> Ch_*(R) over a coefficient ring R. Given a finite directed graph G = (V, E, s, t) where s, t: E -> V are the source and target maps, the functor produces a chain complex C_*(G; R) with C_0 = R^V (free R-module on vertices), C_1 = R^E (free R-module on edges), and boundary map d_1(e) = t(e) - s(e). The differential boundary maps d_n must be canonically generated from the orientations of the graph''s vertices, edges, and directed cycles. Graph morphisms are mapped to chain maps, preserving the chain complex structure. This contract covers the carriers finite_directed_graph, carrier, and graph_carrier.'\n  non_role:\n  - Simplicial complex chain functors (separate contract)\n  - CW complex chain functors (separate contract)\n  - Infinite graphs or graphs with infinite vertex/edge sets\n  - Weighted or labeled graph homology (separate extension)\n  - Persistent homology filtrations (separate contract)\n  - Cohomology or cochain complex construction (dual contract)\n  - Spectral sequences arising from graph filtrations\nwip:\n- \"OPEN_OBLIGATION canonical_ordering: reject graphs without canonical vertex and edge orderings; owner: omega_homology functor implementer; disposition: add a dedicated functor-level validator and paired required_test.\"\n- \"OPEN_OBLIGATION boundary_squared_zero: reject outputs where adjacent boundary maps do not compose to zero; owner: omega_homology functor implementer; disposition: add chain-complex construction and paired required_test.\"\n- \"OPEN_OBLIGATION finite_input: reject unbounded or infinite graph carriers; owner: omega_homology functor implementer; disposition: specify the finite input API and pair it with a required_test.\"\n- \"OPEN_OBLIGATION graph_morphism: reject maps that do not preserve source and target; owner: omega_homology functor implementer; disposition: implement induced chain maps and a paired required_test.\"\n- \"OPEN_OBLIGATION coefficient_ring: reject noncommutative or nonunital coefficient structures; owner: omega_homology functor implementer; disposition: implement the coefficient-ring boundary and a paired required_test.\"\n- \"OPEN_OBLIGATION authority_claim_fence: reject authority, admissibility, trust, or certification claims; owner: Council Nomos and human authority review; disposition: no mechanical unit-test discharge at the ShapeOnly layer; AuthorityEffect: None.\"\n- \"OPEN_OBLIGATION chain_map_dimensions: reject induced chain maps with incompatible source and target ranks; owner: omega_homology functor implementer; disposition: implement dimension validation and a paired required_test.\"\n- \"OPEN_OBLIGATION boundary_formula: reject any d_1(e) other than t(e)-s(e); owner: omega_homology functor implementer; disposition: implement boundary construction and a paired required_test.\"\n- \"OPEN_OBLIGATION canonical_basis_hash: reject vertex or edge basis hashes that disagree with canonical graph order; owner: omega_homology functor implementer; disposition: implement canonical hashing and a paired required_test.\"\n- 'How should the functor extend to simplicial complexes? The clique complex or flag complex of a graph provides a natural simplicial structure with higher-dimensional cells (triangles, tetrahedra, etc.), yielding nontrivial C_n for n >= 2. Should this be a separate contract or a parameterized extension?\n\n  '\n- 'CW complex generalization: Can the functor be extended to CW complexes attached to graphs, where higher cells are glued along boundary maps? What additional orientation data is needed for attaching maps?\n\n  '\n- 'Higher cells from directed paths: Should directed paths of length k generate k-chains? This would give a path-homology theory distinct from simplicial homology. What is the correct boundary formula?\n\n  '\n- 'Coefficient ring generality: Should we support non-commutative rings (e.g., group rings) for equivariant graph homology? This would require distinguishing left and right modules.\n\n  '\n- 'Relationship to persistent homology: When a graph comes with a filtration (e.g., by edge weight), the functor should compose with persistence to yield a persistence module. Should this composition be part of this contract or a separate persistence contract?\n\n  '\n- 'Signed graphs and orientations: For undirected graphs, an orientation must be chosen. Different orientations yield isomorphic homology but different chain complexes. Should we canonicalize the choice or track orientation equivalence classes?\n\n  '\n- Currently targets finite directed graphs only; undirected graphs require orientation choice\n- Higher-dimensional extensions (simplicial, CW) deferred to future contracts\n- Validators referenced but not yet implemented in omega-homological crate\n- Chain map construction for graph morphisms needs concrete matrix algorithm specification\n- Homology computation method included for completeness but may belong in a separate HomologyGroup contract\n- Performance bounds for large graphs (|V| + |E| > 10^6) not yet characterized\n- Sparse matrix representation for boundary maps not yet specified (dense assumed)\n\n# === CANONICAL CONTRACT ABOVE ===\n# Debate below is NON-CANONICAL. AuthorityEffect: none. Not contract law.\n\nnomos_debate_NOT_CANONICAL:\n  banner: \"NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; do not read as certification.\"\n  not_part_of_contract_law: true\n  authority_effect: none\n  potential_defects: []\n  realization_delta_vs_implemented_math_file:\n  - reviewer: panepistimion-cs-prof-ml-ai-info\n    role: CS_IMPL_DELTA_REVIEW\n    code: PARTIAL_REALIZATION_ONLY\n    severity: info\n    claim_class: \"[SCOPE FENCE]\"\n    detail: >\n      rust_binding.module finite_directed_graph exists and the binding is explicitly\n      marked partial_carrier. FiniteDirectedGraph is a graph carrier only — not the\n      functor F: FinGraph → Ch_*(R) / boundary construction this YAML defines.\n    recommendation: >\n      Land dedicated combinatorial_chain_functor realization (or rebind to a true functor\n      module under ADR-007a); graph carrier alone is not sufficient.\n    file: omega_engine/crates_rs/omega_homology/src/finite_directed_graph.rs\n    delta: YAML_AHEAD_OF_CODE\n",
