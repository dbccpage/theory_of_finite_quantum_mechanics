      "definition": {
        "cochain_complex": "Graded object C^• with maps δ_n of degree +1 and δ_{n+1} ∘ δ_n = 0.",
        "cocycles": "Z^n = ker(δ_n)",
        "coboundaries": "B^n = im(δ_{n−1})",
        "cohomology": "H^n = Z^n / B^n when B^n ⊆ Z^n (follows from δ² = 0)",
        "finite_scope": "This contract version covers finite declared degree sets only."
      }
    },
    "requirements": {
      "required_structures": [
        "Coefficient domain R declared and shared by all C^n",
        "Finite degree index set I",
        "Finite C^n for each n ∈ I (presentation or ordered basis)",
        "Coboundary map δ_n for each adjacent degree pair present in I",
        "Complex-law witness / check that δ_{n+1} ∘ δ_n = 0 on all adjacent pairs",
        "Degree shift +1 (source degree n, target degree n+1)"
      ]
    },
    "laws": [
      "Complex law: δ_{n+1} ∘ δ_n = 0 for every adjacent declared pair.",
      "Degree-shift law: each δ_n raises degree by exactly one.",
      "Coefficient uniformity: every C^n is an R-module for the same declared R.",
      "Presentation compatibility: each δ_n has source/target matching declared C^n presentations.",
      "Cohomology well-definedness: B^n ⊆ Z^n follows from the complex law.",
      "Finite-scope law: only finitely many degrees and finite C^n ranks are in-scope for this version.",
      "Authority law: no PROVED / GlobalGreen / HoTT discharge from this contract alone."
    ],
    "replay": {
      "requirements": [
