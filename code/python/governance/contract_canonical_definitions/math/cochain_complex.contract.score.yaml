      "notation": "… → C^{n−1} --δ_{n−1}→ C^n --δ_n→ C^{n+1} → …",
      "domain": [
        "coefficient domain R (ring or field)",
        "finite degree index set I ⊂ ℤ (or ℕ)",
        "for each n ∈ I: finite R-module C^n with finite presentation/basis",
        "for each adjacent pair: coboundary map δ_n : C^n → C^{n+1}"
      ],
      "codomain": {
        "description": "A finite graded cochain complex over R with degree-raising coboundaries satisfying δ² = 0. Structural only; does not mint cohomology classes or FOC authority."
