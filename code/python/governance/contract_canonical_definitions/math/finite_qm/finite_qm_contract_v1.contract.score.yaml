imension when rank and inner product are supplied\n- urn:omega:math:canonical_hash_domain:v0.1.0 defines hash domain parameters for canonical_hash\n- urn:omega:rust:omega_q:finite_qm_types:v1.0.0 is the Rust realization of the schema types\n- finite_vocabulary_fence.md (CODA-CS–Q bridge) is the authoritative non-inference fence\n- qm_121_the_finite_qm_ingredient_ladder supplies the imported-ceiling inventory for default import slots\nnegative_tests:\n- Alias-collapsing FiniteCarrier into FiniteDimension must be rejected\n- Artifact with authority_effect other than None must be rejected\n- Artifact claiming GlobalGreen or PROVED from this contract alone must be rejected\n- Import slot with status outside OPEN|DECLARED|WITNESSED must be rejected\n- Missing required fence field (carrier, dimension, certificate, continuum_debt) must be rejected\n- Non-deterministic or external-state-dependent hash construction must be rejected\n- Treating continuum scalars as a finite certificate must be rejected\nrust_binding:\n  crate: omega_wdp\n  module: coda::q::finite_qm_types\n  symbols:\n  - FiniteCarrier\n  - FiniteDimension\n  - FiniteCertificate\n  - FiniteDimContinuumScalars\n  - ContinuumDebt\n  - ImportSlotStatus\n  - ImportSlot\n  - ImportLedger\n  - FiniteQmContractV1\n  - SCHEMA_VERSION\n  - CONTRACT_URN\n  # One test per mechanically-checkable negative_test, in declaration order.\n  # The GlobalGreen/PROVED-from-this-contract-alone negative_test is doctrinal\n  # and has no unit test.\n  required_tests:\n  - rejects_alias_collapse_of_fence_types\n  - rejects_authority_effect_other_than_none\n  - rejects_import_slot_status_outside_vocabulary\n  - rejects_missing_required_fence_field\n  - canonical_hash_is_independent_of_slot_insert_order\n  - rejects_continuum_scalars_as_finite_certificate\ndoctrine:\n  summary: >\n    FiniteQMContractV1 is the versioned JSON schema shell for the finite QM ingredient\n    ladder boundary (qm_121). It binds four non-collapsing fence type