      "notation": "B ∈ {-1,0,+1}^{m×n}",
      "domain": [
        "rows: edges or k-cells",
        "cols: vertices or (k-1)-cells",
        "entries: integers from {-1, 0, +1}"
      ],
      "codomain": {
        "description": "A finite rectangular matrix with integer entries from {-1, 0, +1}. Rows index edges/k-cells, columns index vertices/(k-1)-cells.\n"
      }
    },
    "requirements": {
      "required_structures": [
        "For each edge (source, target), matrix entry (edge_index, source) = -1 and entry (edge_index, target) = +1\n",
        "All vertex indices must be in range [0, num_nodes)",
        "No edge may have source == target",
        "All matrix entries must be in {-1, 0, +1}",
        "Number of matrix rows equals number of edges",
        "Number of matrix columns equals number of vertices",
        "Edge list order determines row order (no implicit reordering)"
      ]
    },
    "laws": [
      "For edge e = (source, target), entry (e, source) = -1 and entry (e, target) = +1, all other entries in row e are 0.\n",
      "No edge may connect a vertex to itself (source ≠ target)",
      "Number of edges/cells and vertices/cells are finite",
      "For chain complexes, B_{n-1} · B_n = 0 (d² = 0)",
      "Same graph/complex yields same matrix (deterministic edge ordering)"
    ],
    "replay": {
      "requirements": [
        "No external state",
        "No randomness",
        "No time-dependent data",
        "Edge ordering must be deterministic",
        "Same graph yields same matrix hash"
      ]
    },
    "relationships": [
