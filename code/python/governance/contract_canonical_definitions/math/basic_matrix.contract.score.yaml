ct of matrix.contract.yaml.'\n- 'Authority law: this contract confers no authority and mints no GlobalGreen/PROVED.'\nreplay:\n  requirements:\n  - No external state\n  - No randomness\n  - No wall-clock dependence\n  - Row-major entry order is canonical for serialization\n  - Deterministic pure functions only\nrelationships:\n- urn:omega:math:scalar:v0.1.0 — entry scalar language (aspirational type story)\n- 'urn:omega:math:matrix:v0.1.0 — distinct linear-map object (007a: do not smash)'\n- urn:omega:math:field:v0.1.0 — field language deferred to linear-map / field contracts\nrust_binding:\n  crate: omega_linear_algebra\n  module: backend::basic_matrix\n  symbols:\n  - BasicMatrix\n  - MatrixError\n  # One test per mechanically-checkable negative_test, in declaration order.\n  # The last two negative_tests are doctrinal and are tracked as OPEN_OBLIGATION\n  # entries under wip. A named gap is honest; silence is invisible debt.\n  required_tests:\n  - test_from_row_major_mismatch\n  - test_out_of_bounds\n  - test_add_sub_mismatch\n  - test_mul_dimension_mismatch\n  - test_shape_preserved\nnegative_tests:\n- Data length not equal to m*n must be rejected\n- Access with i ≥ m or j ≥ n must fail (including any access on empty shape)\n- Add/sub of unequal shapes must be rejected\n- Matmul with lhs.cols ≠ rhs.rows must be rejected\n- Implicit shape coercion (e.g. broadcast) must be rejected\n- Artifact claiming to be the linear-map matrix object solely via BasicMatrix storage must be rejected\n- Artifact claiming PROVED/GlobalGreen/HoTT discharge from this contract alone must be rejected\ndoctrine:\n  summary: 'BasicMatrix is the canonical finite rectangular *storage* matrix used by numeric backends,\n    cochain maps, and incidence data. Shapes may be zero (empty free modules / zero maps) per ADR-007a\n    meth decision 2026-08-01. Not a basis-aware linear map; not authority. Nonclaim: does not claim PROVED;\n    does not claim GlobalGreen; does not claim HoTT discharge.