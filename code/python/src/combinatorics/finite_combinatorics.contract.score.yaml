      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/combinatorics/finite_combinatorics.py\",\n    \"sha256\": \"7d416d6492b79160287a68c003ef5e47c47ee7ef5e07363e9a138b3fbe60944e\"\n  },\n  \"claim\": \"urn:omega:fqm:combinatorics:exact-binomial-and-counts:v1\",\n  \"profile\": \"Exact\",\n  \"role\": \"library\",\n  \"purpose\": \"Bounded exact binomial/counting operations and preflighted finite enumerators.\",\n  \"operations\": {\n    \"binomial_exact\": \"Admit built-in integer inputs under the bit policy; negative or k>n gives 0, otherwise use symmetric multiplicative exact division. Refuse more than 4096 effective steps or a result component exceeding 8192 bits.\",\n    \"enumerate_cartesian_words\": \"Nonnegative built-in alphabet size, length and budget. Effective result limit is min(caller budget,4096); length <=256 and total stored coordinates <=65536. Empty words and empty alphabets are handled before constructing a range pool. Refuse before enumeration.\",\n    \"integer_partitions\": \"Nonnegative built-in n<=256; preflight a capped partition-count DP before allocating results. At most 4096 partitions, generated by an explicit stack in descending lexicographic order, including [()] at zero.\",\n    \"FiniteProjectivePlaneParams\": \"Frozen validated integer counting record. Check the q>=2 counting polynomials before committing fields; refuse repeated initialization and subclasses.\",\n    \"finite_plane_parameters\": \"Evaluate q^2+q+1, q+1, q^2 and q(q+1) at admitted integer q>=2; return the validated record.\",\n    \"weyl_heisenberg_displacement_count\": \"For admitted integer d>=2 return (d^2,d^2-1).\"\n  },\n  \"engineering_policy\": \"All input integers <=1024 bits. Binomial steps/result, word length/count/cells and partition input/count have explicit separate envelopes. Capped counts beyond their envelope are lower-bound sentinels, never claimed exact counts.\",\n  \"policy_origin\": \"Declared engineering limits, not empirical measurements or derived physical constants.\",\n  \"failure_boundary\": \"CombinatoricsError for invalid types/domains/record relations; CombinatoricsBudgetError for engineering envelope refusal. Records commit only after validation and remain detached immutable integers.\",\n  \"cost_model\": \"Binomial O(min(k,n-k)) rational/integer steps under caps; word comparison <=256 steps and output bounded by cell policy; partition preflight O(n^2) capped small-integer work and explicit bounded-result DFS. No peak-allocation benchmark or formal complexity proof.\",\n  \"scope_ceiling\": \"Counting polynomials do not establish projective-plane existence; displacement counts do not prove Weyl commutation. No arbitrary-size enumeration or infinity claim.\",\n  \"trust\": \"Pinned CPython and providers in the challenge inputs. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Tests may deliberately supply binary floats only as rejection probes under SCORING.md.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T212331Z-combinatorics-challenge/receipt.json\",\n      \"sha256\": \"eb98c17b2090d295d16e187db544b4926e706e016bb5f37b5b954e1d308d6b76\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T212358Z-source-metrics/receipt.json\",\n      \"sha256\": \"395b619a318a5b519b9b2b11f24b7bc76ae1a373c3f2fb16220d13ad69b52d68\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch2-baseline.log\",\n      \"sha256\": \"ac4614164e22c790103ce4db5a662da099a1027b7b96a131e748f88b9a843169\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch2-atlas.log\",\n      \"sha256\": \"45425bc105e799841cffa39d959410b2947cb7f8fb62879199a2fa95f302b7f3\"\n    }\n  ]\n}\n",
