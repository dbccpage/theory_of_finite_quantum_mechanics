      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/functional/l1_seminorm.py\",\n    \"sha256\": \"5fe24751b1a39de648a0ef273c1485f08384973f2b8a11f9a6b1bb30d43ca38b\"\n  },\n  \"profile\": \"Exact\",\n  \"status\": \"historical_defect_review\",\n  \"purpose\": \"Earlier captured implementation only; later contracts and budgets are not retroactive.\",\n  \"source_claims_verbatim\": \"Exact weighted L1 quotient seminorm certificate on Q^n / im(B).\\n\\nOrigin: dag/derivation_dag.json node L1-WDP-WINDOW-PHI1-GAMMA2, and\\nlean4/DerivationDagQMClosure.lean theorem\\nl1_gs001_replica_and_phi1_quotient_invariance.\\nClaim: urn:omega:fqm:phi1:weighted-l1-quotient-certificate:v1\\nAuthorityEffect: None\\nMutation-Kills: 9 non-equivalent source mutants, executed by code/python/tests/test_l1_seminorm.py.\\nGate 5 measurement: radon 6.0.1 cyclomatic complexity max 7; AST Sonar cognitive complexity max 6; AST nesting depth max 2; lizard 1.24.1 cyclomatic complexity max 7.\\nScope Fence: This file does not claim that the weighted l1 form is derived\\nfrom MSS-0, does not compute Gamma2 or R_cl, does not select L1 over rival\\nseminorms, and does not inherit an authority grant from a passing certificate.\\n\\nPhi1([omega]) is certified exactly when a primal residual\\nr = omega - B alpha and a dual witness z satisfy B^T z = 0, |z_i| <= w_i,\\nand sum_i w_i |r_i| = z \\u00b7 omega = the reported value. The scalar field is Q.\",\n  \"source_claims_status\": \"Captured claims only, not endorsed measurements, verification or capability grades.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T215305Z-functional-before/receipt.json\",\n      \"sha256\": \"fd245f1d621260d2bf07c56d0b326176885c5684eab090b477a467d0cd2beda3\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T215305Z-functional-before/sources/code/python/src/functional/l1_seminorm.py\",\n      \"sha256\": \"5fe24751b1a39de648a0ef273c1485f08384973f2b8a11f9a6b1bb30d43ca38b\"\n    }\n  ]\n}\n",
