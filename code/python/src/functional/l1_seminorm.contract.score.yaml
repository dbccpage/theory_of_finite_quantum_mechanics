      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/functional/l1_seminorm.py\",\n    \"sha256\": \"4f766eac90126b09f535da4fc645c326425da90c847adf4abb793d2928bd43b8\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:phi1:weighted-l1-quotient-certificate:v1\",\n  \"role\": \"certificate-checking library\",\n  \"purpose\": \"Exact rational weighted L1 quotient optimality checker with immutable verified context and explicit admission/work envelopes.\",\n  \"operations\": {\n    \"admission\": \"Built-in int, Fraction or integer ratio-pair only; built-in list/tuple vectors only. Normalize to owned tuples after size/type checks. Weights strictly positive, matrix rectangular; empty zero-dimensional presentation admitted.\",\n    \"ExactPhi1Certificate\": \"Unverified input DTO. Mutable or malformed list contents can be submitted, but this constructor grants no verified status.\",\n    \"VerifiedExactPhi1\": \"Every public construction validates all fields, primal identity, dual annihilation/box and closed primal-dual gap; optionally bind to an admitted immutable L1Seminorm. Own canonical tuples and return fresh mutable DTO/list copies to callers. No subclass or reinitialization bypass.\",\n    \"evaluate_weighted_l1_quotient\": \"Return the exact reported optimum only after presentation binding and the full certificate checks; no search/solver is supplied.\"\n  },\n  \"engineering_policy\": \"Vectors<=4096, coordinates<=256, boundary columns<=256, boundary entries<=16384, input integer/rational components<=1024 bits, accumulated arithmetic components<=8192 bits. Diagnostic role<=256 characters; vector role<=240 leaves index suffix space. Policies are engineering choices.\",\n  \"failure_boundary\": \"L1SeminormError with invariant and bounded role/shape/bit context. Refuse floats/subclasses/bool, zero denominator, oversized or inconsistent data, invalid witnesses and reinitialization. Only commit verified tuples after all checks. Arithmetic may create a temporary larger value before the work-bit refusal; no rounding.\",\n  \"cost_model\": \"O(n*k) rational work for primal and dual boundary checks plus O(n) optimality work and O(n*k) owned data. n<=256,k<=256, entries<=16384. Bit arithmetic and temporary growth are explicit; no peak-memory or wall-clock proof.\",\n  \"scope_ceiling\": \"Conditional certificate of the declared weighted rational L1 optimum only. No solver completeness, MSS derivation, choice of L1 over rivals, Gamma2, R_cl, Born uniqueness, Lean extraction or authority promotion.\",\n  \"trust\": \"Pinned CPython and provider/test bytes in the challenge inputs. Ordinary scalar/container override and __class__ callbacks are refused. No security sandbox for malicious metaclasses, reflection, monkeypatching, concurrent mutation or host exhaustion.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T220419Z-functional-challenge/receipt.json\",\n      \"sha256\": \"c4c3952ca582382759111b912d389ead3543fae7d28075176a70831b49a25eac\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T220628Z-source-metrics/receipt.json\",\n      \"sha256\": \"f34e67ed55564d869eaa265f9d0fe95ae1befb32571970512cd9919d9d537513\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch3-baseline.log\",\n      \"sha256\": \"200e1a9c21589275b437ecef1398cb2f2866b44364a9536908c4fa85ed3aa984\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch3-atlas.log\",\n      \"sha256\": \"45425bc105e799841cffa39d959410b2947cb7f8fb62879199a2fa95f302b7f3\"\n    },\n    {\n      \"path\": \"code/rust/quality/expanded_scope/batch3_reviews.json\",\n      \"sha256\": \"d6f250373c550e41fb36d58bc06ffe3a584a41e662c546176c0a33e6ac4e98bd\"\n    }\n  ]\n}\n",
