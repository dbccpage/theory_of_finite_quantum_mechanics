      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/clock_tower_control.py\",\n    \"sha256\": \"0e36e9fee43252c74b717c17c2dcb982863a72f845d1774adb7f352990b67410\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:qm:clock-tower-control:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"QM-211 finite map: continuous unitary dynamics from finite clock towers. What the L1 shadow provides: discrete stochastic transport along edges. The import\",\n  \"operations\": {\n    \"ClockControlRefusal\": \"Typed refusal for malformed clock-tower inputs.\",\n    \"matrix_order\": \"Smallest m >= 1 with u^m = I; refuses beyond max_order.\",\n    \"mat_scale\": \"Function mat_scale operation.\",\n    \"mat_add\": \"Function mat_add operation.\",\n    \"trace\": \"Function trace operation.\",\n    \"spectral_projectors\": \"P_k = (1/m) sum_j lambda_k^{-j} U^j for lambda_k = zeta_m^k, k in Z/m (needs m | N).\",\n    \"finite_spectral_theorem\": \"Exact spectral decomposition of a unitary of finite order, with the discrete steps.\",\n    \"clock_square_roots\": \"All V in the algebra generated by U with V^2 = U: one sign per occupied eigenspace.\",\n    \"refines\": \"k with zeta_fine^k = zeta_coarse, if any: exists exactly when coarse | fine.\",\n    \"tower_chain_condition\": \"Z/3 and Z/4 refine neither the other; Z/12 refines both: the limit is over divisibility.\",\n    \"stochastic_negative_control\": \"The swap matrix: a unitary square root over Q(i), no real or stochastic one.\",\n    \"residual_import_ledger\": \"Function residual_import_ledger operation.\",\n    \"evaluate_clock_tower_control\": \"Run the QM-211 control exactly and return JSON-serializable results.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
