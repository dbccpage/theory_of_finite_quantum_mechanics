      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/primitives.py\",\n    \"sha256\": \"322e963643c6a02a96a9076289863b6bcfdff82ca6f772660f0514d14d3f866d\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:domain:primitives:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Finite matrix primitives for quantum physics. Canonical Implementation: omega_engine_projects.ms_majorana.code.tests.support.finite_qm.domain.primitives\",\n  \"operations\": {\n    \"kron_all\": \"Computes Kronecker product of an arbitrary sequence or list of matrices.\",\n    \"trace_norm\": \"Schatten 1-norm :math:`\\\\|M\\\\|_1 = \\\\operatorname{Tr}\\\\sqrt{M^\\\\dagger M}`.\",\n    \"operator_norm\": \"Schatten :math:`\\\\infty`-norm :math:`\\\\|M\\\\|_\\\\infty`.\",\n    \"partial_trace_b\": \":math:`\\\\operatorname{Tr}_b : B(H_a \\\\otimes H_b) \\\\to B(H_a)`.\",\n    \"partial_trace_a\": \":math:`\\\\operatorname{Tr}_a : B(H_a \\\\otimes H_b) \\\\to B(H_b)`.\",\n    \"commutator\": \":math:`[A, B] = AB - BA`.\",\n    \"dagger\": \":math:`M^\\\\dagger`.\",\n    \"to_exact_matrix\": \"Convert a 2D matrix structure into a square list of lists of Gaussian rationals.\",\n    \"exact_dagger\": \"Exact conjugate transpose over Q(i): (M^dagger)_{ij} = conj(M_{ji}).\",\n    \"exact_trace\": \"Exact trace over Q(i): Tr(M) = sum_i M_{ii}.\",\n    \"exact_is_psd\": \"Determine exact positive semidefiniteness (M >= 0) over Q(i).\",\n    \"is_exact_rational_density_matrix\": \"Exact rational density operator predicate.\",\n    \"exact_purity\": \"Exact purity Tr(rho^2) in Q for an exact density operator.\",\n    \"is_density_matrix\": \"True iff ``rho`` is Hermitian, positive semidefinite, and has unit trace.\",\n    \"purity\": \":math:`\\\\operatorname{Tr}(\\\\rho^2) \\\\in (0, 1]`.\",\n    \"von_neumann_entropy\": \":math:`S(\\\\rho) = -\\\\sum_i \\\\lambda_i \\\\log \\\\lambda_i`.\",\n    \"mutual_information\": \":math:`I(A{:}B) = S(\\\\rho_a) + S(\\\\rho_b) - S(\\\\rho_{ab})`.\",\n    \"marginals\": \"``(Tr_b rho, Tr_a rho)``.\",\n    \"pure_state\": \":math:`|\\\\psi\\\\rangle\\\\langle\\\\psi|`.\",\n    \"ket00\": \"The product state :math:`|00\\\\rangle\\\\langle 00|`.\",\n    \"bell_state\": \"The maximally entangled :math:`(|00\\\\rangle + |11\\\\rangle)/\\\\sqrt 2`.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
