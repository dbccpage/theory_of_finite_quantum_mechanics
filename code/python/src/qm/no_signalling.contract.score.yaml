 matrices A in M_{d_a}.\",\n    \"prove_partial_trace_uniqueness\": \"Target C1000-T831: Prove that Tr_B is the UNIQUE linear map satisfying local statistics.\",\n    \"apply_alice_local_unitary\": \"Unitary operation on Alice: rho' = (U_A (x) I_B) rho (U_A^dagger (x) I_B).\",\n    \"apply_alice_hadamard\": \"Hadamard on Alice: H = 1/sqrt(2) H0, so rho' = 1/2 (H0 (x) I) rho (H0 (x) I).\",\n    \"apply_alice_unselective_measurement\": \"Unselective measurement on Alice in computational basis: rho' = P0 rho P0 + P1 rho P1.\",\n    \"check_no_signalling_on_bell_states\": \"Target C1000-T837: Verify no-signalling exactly on every Bell state under local operations on Alice.\",\n    \"cnot_matrix\": \"Function cnot_matrix operation.\",\n    \"cz_matrix\": \"Function cz_matrix operation.\",\n    \"swap_matrix\": \"Function swap_matrix operation.\",\n    \"RivalComposition\": \"Class RivalComposition domain record and methods.\",\n    \"declared_rival_compositions\": \"Target C1000-T829: Declared rival-composition search space containing >= 4 non-tensor bilinear maps.\",\n    \"verify_bilinearity\": \"Verify (A1 + A2) * B = A1 * B + A2 * B and A * (B1 + B2) = A * B1 + A * B2 and scalar scaling.\",\n    \"enumerate_rival_composition_search\": \"Target C1000-T834 & T838: Search declared rival-composition space for a signalling rival.\",\n    \"emit_no_signalling_receipt\": \"Target C1000-T847: Generate comprehensive canonical JSON evidence receipt.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
