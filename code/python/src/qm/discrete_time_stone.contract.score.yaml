      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/discrete_time_stone.py\",\n    \"sha256\": \"a2b55f4d0b4dda49c4ad976cebd3feddd08d9426ee3853204da193d2a0093558\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:qm:discrete-time-stone:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Discrete time on the finite carrier: the Z-action k -> U^k of one rational rotation step, and the exact obstruction to a Q-parameter group through it. Replays in exact rational arithmetic the Lean specification\",\n  \"operations\": {\n    \"matrix2\": \"Function matrix2 operation.\",\n    \"identity\": \"Function identity operation.\",\n    \"zero\": \"Function zero operation.\",\n    \"mul\": \"Function mul operation.\",\n    \"transpose\": \"Function transpose operation.\",\n    \"neg\": \"Function neg operation.\",\n    \"trace\": \"Function trace operation.\",\n    \"det\": \"Function det operation.\",\n    \"is_orthogonal\": \"Function is_orthogonal operation.\",\n    \"rotation\": \"[[c,-s],[s,c]] for a rational point (c,s) of the unit circle; any other (c,s) is refused.\",\n    \"rotation_point\": \"(c,s) with R == rotation(c,s); refuses every other matrix.\",\n    \"zpow\": \"R^k for an integer k; R^-1 = R^T, so a negative k needs an orthogonal R (refused otherwise). Lean: discreteEvolution, discreteEvolution_neg.\",\n    \"discrete_evolution\": \"The exact Z-orbit U^k, -kmax <= k <= kmax, of one orthogonal step U = R: every power is orthogonal (U^k^T U^k = I), U^i U^j = U^(i+j) on the window, and U^-k = (U^k)^T. Lean: discreteEvolution_add, discreteEvolution_zero, discreteEvolution_neg, R345_pow_orthogonal.\",\n    \"rational_sqrt\": \"The nonnegative rational r with r^2 = x, or None (negative x included); decided by math.isqrt on the reduced numerator and denominator. Lean: four_fifths_not_rat_square via four_fifths_den and nat_mul_self_ne_five.\",\n    \"is_rational_square\": \"Function is_rational_square operation.\",\n    \"half_step\": \"The rational rotations V with V^2 = rotation(c,s): None unless (1+c)/2 is a rational square p^2, and then exactly the pair +-rotation(p, s/(2p)) (with s/(2p) read as 1 when p = 0: rotation(-1,0) = rotation(0,+-1)^2). Lean: no_rational_half_step for R345.\",\n    \"has_rational_half_step\": \"Function has_rational_half_step operation.\",\n    \"qparam_necessary_roots\": \"A Q-parameter group U with U(1) = R restricts to k -> R^k on Z and needs U(1/m) with U(1/m)^m = R. For a rational rotation R and m = 2^j this is decided exactly by iterating half_step on every branch: either the 2^j rational m-th roots (as circle points) or the depth and the rotation at which no rational square root exists. Lean: QParamGroup, U_eq_discreteEvolution, U_inv_nat, roots_of_all_orders.\",\n    \"irreducible_char_poly\": \"x^2 - tr(R) x + det(R) is irreducible over Q iff tr(R)^2 - 4 det(R) is not a rational square.\",\n    \"commutant_half_step_candidates\": \"Every V with V^2 = R commutes with R; when the characteristic polynomial of R is irreducible the commutant is Q[R] = span{I,J} with J = R - (tr R/2) I and J^2 = kappa I, kappa = (tr R)^2/4 - det R. For V = pI + rJ: V^2 = R <=> p^2 + kappa r^2 = tr R/2 and 2pr = 1 <=> p^2 = (tr R/2 +- sqrt(det R))/2 and r = 1/(2p). Returns the candidate values of p^2 and every rational square root V of R, each replayed as V V = R (for a rotation, p^2 = (1+c)/2: the half-angle criterion, independent of the rotation structure). Lean: the commutation step of no_rational_half_step (V R345 = R345 V forces V = [[p,-r],[r,p]]).\",\n    \"no_rational_half_step_certificate\": \"For R = rotation(c,s): V = [[p,-r],[r,p]] (the commutant form) squares to R iff p^2 - r^2 = c and 2pr = s, which forces p^2 + r^2 = 1 and p^2 = (1+c)/2; the required square is reported with its exact decision. For R345 it is 4/5, not a rational square. Lean: no_rational_half_step, four_fifths_not_rat_square.\",\n    \"square_root_pairs\": \"With U = V V: (-V)(-V) = U as well and -V != V whenever V != 0, so a square root of a step is never unique. Lean: sq_root_neg, neg_ne_self_of_ne_zero, half_step_not_unique, matrix_half_step_not_unique.\",\n    \"rotation_order\": \"The least k in 1..max_k with rotation(c,s)^k = I, or None; rotation(0,1) has order 4 while R345 never returns on any finite window. Lean: U1PowerMapInjectivity.u345_infinite_order (cited by the specification); kernel: fq_gap_stone_rational_rotation_infinite_order_and_zi_non_field_obstruction.\",\n    \"specification\": \"What node FQ-GAP-STONE-CONTINUOUS-TIME specifies, what this module derives, and what stays open; nothing here is a theorem about a continuum. Lean: QParamGroup, no_qparam_group_through_R345, and the open obligation in the module header.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
