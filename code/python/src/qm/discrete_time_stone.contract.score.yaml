    "role": "library",
    "purpose": "Discrete time on the finite carrier: the Z-action k -> U^k of one rational rotation step, and the exact obstruction to a Q-parameter group through it. Replays in exact rational arithmetic the Lean specification",
    "operations": {
      "matrix2": "Function matrix2 operation.",
      "identity": "Function identity operation.",
      "zero": "Function zero operation.",
      "mul": "Function mul operation.",
      "transpose": "Function transpose operation.",
      "neg": "Function neg operation.",
      "trace": "Function trace operation.",
      "det": "Function det operation.",
      "is_orthogonal": "Function is_orthogonal operation.",
      "rotation": "[[c,-s],[s,c]] for a rational point (c,s) of the unit circle; any other (c,s) is refused.",
      "rotation_point": "(c,s) with R == rotation(c,s); refuses every other matrix.",
      "zpow": "R^k for an integer k; R^-1 = R^T, so a negative k needs an orthogonal R (refused otherwise). Lean: discreteEvolution, discreteEvolution_neg.",
      "discrete_evolution": "The exact Z-orbit U^k, -kmax <= k <= kmax, of one orthogonal step U = R: every power is orthogonal (U^k^T U^k = I), U^i U^j = U^(i+j) on the window, and U^-k = (U^k)^T. Lean: discreteEvolution_add, discreteEvolution_zero, discreteEvolution_neg, R345_pow_orthogonal.",
      "rational_sqrt": "The nonnegative rational r with r^2 = x, or None (negative x included); decided by math.isqrt on the reduced numerator and denominator. Lean: four_fifths_not_rat_square via four_fifths_den and nat_mul_self_ne_five.",
      "is_rational_square": "Function is_rational_square operation.",
      "half_step": "The rational rotations V with V^2 = rotation(c,s): None unless (1+c)/2 is a rational square p^2, and then exactly the pair +-rotation(p, s/(2p)) (with s/(2p) read as 1 when p = 0: rotation(-1,0) = rotation(0,+-1)^2). Lean: no_rational_half_step for R345.",
      "has_rational_half_step": "Function has_rational_half_step operation.",
      "qparam_necessary_roots": "A Q-parameter group U with U(1) = R restricts to k -> R^k on Z and needs U(1/m) with U(1/m)^m = R. For a rational rotation R and m = 2^j this is decided exactly by iterating half_step on every branch: either the 2^j rational m-th roots (as circle points) or the depth and the rotation at which no rational square root exists. Lean: QParamGroup, U_eq_discreteEvolution, U_inv_nat, roots_of_all_orders.",
      "irreducible_char_poly": "x^2 - tr(R) x + det(R) is irreducible over Q iff tr(R)^2 - 4 det(R) is not a rational square.",
      "commutant_half_step_candidates": "Every V with V^2 = R commutes with R; when the characteristic polynomial of R is irreducible the commutant is Q[R] = span{I,J} with J = R - (tr R/2) I and J^2 = kappa I, kappa = (tr R)^2/4 - det R. For V = pI + rJ: V^2 = R <=> p^2 + kappa r^2 = tr R/2 and 2pr = 1 <=> p^2 = (tr R/2 +- sqrt(det R))/2 and r = 1/(2p). Returns the candidate values of p^2 and every rational square root V of R, each replayed as V V = R (for a rotation, p^2 = (1+c)/2: the half-angle criterion, independent of the rotation structure). Lean: the commutation step of no_rational_half_step (V R345 = R345 V forces V = [[p,-r],[r,p]]).",
      "no_rational_half_step_certificate": "For R = rotation(c,s): V = [[p,-r],[r,p]] (the commutant form) squares to R iff p^2 - r^2 = c and 2pr = s, which forces p^2 + r^2 = 1 and p^2 = (1+c)/2; the required square is reported with its exact decision. For R345 it is 4/5, not a rational square. Lean: no_rational_half_step, four_fifths_not_rat_square.",
      "square_root_pairs": "With U = V V: (-V)(-V) = U as well and -V != V whenever V != 0, so a square root of a step is never unique. Lean: sq_root_neg, neg_ne_self_of_ne_zero, half_step_not_unique, matrix_half_step_not_unique.",
      "rotation_order": "The least k in 1..max_k with rotation(c,s)^k = I, or None; rotation(0,1) has order 4 while R345 never returns on any finite window. Lean: U1PowerMapInjectivity.u345_infinite_order (cited by the specification); kernel: fq_gap_stone_rational_rotation_infinite_order_and_zi_non_field_obstruction.",
      "specification": "What node FQ-GAP-STONE-CONTINUOUS-TIME specifies, what this module derives, and what stays open; nothing here is a theorem about a continuum. Lean: QParamGroup, no_qparam_group_through_R345, and the open obligation in the module header."
    },
