    "purpose": "Exact rational Cayley circle parameterization, 5-adic half-angle obstruction, Gaussian power injectivity, quadratic half-angle restoration, cyclotomic torsion",
    "operations": {
      "is_unit_circle": "Return True when (re, im) lies on the rational unit circle re^2 + im^2 == 1.",
      "circle_mul": "Multiply two points on S^1(Q) via Gaussian multiplication.",
      "affine_cayley": "Map rational parameter t to ((1 - t^2)/(1 + t^2), 2t/(1 + t^2)) on S^1(Q).",
      "inverse_cayley": "Invert the affine Cayley map via im / (re + 1); refuses (-1, 0) and non-unit points.",
      "affine_cayley_mul_param": "Return (t1 + t2)/(1 - t1*t2) when t1*t2 != 1, or None at the south-pole collision.",
      "projective_cayley": "Map homogeneous coordinates [u : v] in P^1(Q) to S^1(Q), sending [0 : 1] to (-1, 0).",
      "inverse_projective_cayley": "Map every point of S^1(Q) to a representative [u : v] in P^1(Q).",
      "projective_mul": "Multiply homogeneous projective coordinates via (u1*u2 - v1*v2, u1*v2 + v1*u2).",
      "five_adic_valuation": "Factor nonzero integer n = 5^v5 * unit_part with unit_part % 5 != 0.",
      "certify_four_fifths_not_square": "Certify (num/den)^2 != 4/5 via 5-adic valuation parity on 5*num^2 vs 4*den^2.",
      "certify_u345_no_rational_sqrt": "Certify that no (re, im) in Q^2 satisfies both (re + i*im)^2 = (3 + 4i)/5 and re^2 + im^2 = 1.",
      "gauss_pow_34": "Compute exact integer coordinates (A_n, B_n) of (3 + 4i)^n for n >= 0.",
      "u345_power": "Compute exact rational coordinates of ((3 + 4i)/5)^k for any integer k.",
      "certify_power_injectivity_window": "Check mod-5 idempotence (A_n, B_n) == (3, 4) mod 5 and pairwise distinct powers on [-max_n, max_n].",
      "QuadSqrt5": "Element a + b*sqrt(5) of the real quadratic extension Q(sqrt(5)).",
      "CircleQuadSqrt5": "Element re + i*im in Q(sqrt(5))(i).",
      "quad_add": "Return x + y in Q(sqrt(5)).",
      "quad_sub": "Return x - y in Q(sqrt(5)).",
      "quad_mul": "Return x * y in Q(sqrt(5)) using (sqrt(5))^2 = 5.",
      "quad_conj": "Return the Galois conjugate a - b*sqrt(5).",
      "quad_norm": "Return the field norm N(a + b*sqrt(5)) = a^2 - 5*b^2.",
      "quad_inv": "Return the multiplicative inverse in Q(sqrt(5)); refuses 0 + 0*sqrt(5).",
      "circle_quad_mul": "Multiply two elements in Q(sqrt(5))(i).",
      "circle_quad_norm_sq": "Return re^2 + im^2 in Q(sqrt(5)).",
      "u345_quad_sqrt_certificate": "Certify that w = (2/5*sqrt(5), 1/5*sqrt(5)) in S^1(Q(sqrt(5))) satisfies w^2 = (3/5, 4/5).",
      "refine_torsion_phase": "Refine a_index mod n_level to (k_factor * a_index) mod (k_factor * n_level) in Q/Z.",
      "divide_rat_phase_mod_one": "Return the m_divisor distinct m-th division phases of q_phase in Q/Z cap [0, 1).",
      "fourth_roots_haar_certificate": "Evaluate 1/4 * sum_{j=0}^3 i^(j * character_power) over mu_4 in Q(i).",
      "torsion_grid_cover_certificate": "Certify that q_phase in [0, 1] lies within 1/n_grid of k/n_grid for k = floor(n_grid * q_phase).",
      "dyadic_sqrt5_interval_step": "Bisect a rational interval [lo, hi] bracketing sqrt(5) and map to half-angle cosine 2*sqrt(5)/5.",
      "negative_controls_certificate": "Certify the 3 rival / boundary failure modes for FQ-GAP-U1-CIRCLE.",
      "chebyshev_t": "Evaluate the Chebyshev polynomial T_n(x) of the first kind over Q.",
      "chebyshev_u": "Evaluate the Chebyshev polynomial U_n(x) of the second kind over Q.",
      "chebyshev_circle_certificate": "Certify that (T_n(re), im * U_{n-1}(re)) equals (re + i*im)^n on S^1(Q) for 1 <= n <= max_n.",
      "taylor_trig_enclosure_certificate": "Certify alternating Taylor cosine/sine enclosures and degree-6 Pythagorean defect on 0 <= theta <= 1.",
      "cayley_dyadic_approx_certificate": "Subdivide theta by 2^(k+1), apply Cayley map, and square k_depth times on S^1(Q).",
      "hermitian_qi_born_certificate": "Certify 4D Hermitian Q(i) rank-1 projectors, sigma_y orthogonality, and Born inner-product modulus squared.",
      "u345_quadratic_tower_certificate": "Certify the iterated real quadratic square-root tower K_{m+1} = K_m(sqrt((1+c_m)/2)) for 2^m-divisions of u345.",
      "cayley_hermitian_stone_certificate": "Certify the discrete Cayley unitary step U_H(t) = (I - i t H)(I + i t H)^{-1} on TracelessHerm2Qi."
