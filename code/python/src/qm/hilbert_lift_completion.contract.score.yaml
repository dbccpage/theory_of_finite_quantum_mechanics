ion_holds\": \"finInner_trunc_le: finInner (trunc n f) (trunc n f) <= qinner f f.\",\n    \"harmonic_term\": \"harmonicTerm i = 1/(i+1).\",\n    \"harmonic\": \"harmonic N = sum_{i<N} (1/(i+1)) e_i.\",\n    \"harmonic_modulus\": \"The explicit ℓ² modulus of harmonic_hasModulus: mu k = k + 1.\",\n    \"telescoping_bound_holds\": \"sum_harmonicTerm_sq_le: for 1 <= n <= m, sum_{n<=i<m} 1/(i+1)^2 <= 1/n - 1/m.\",\n    \"harmonic_sqdist_bound_holds\": \"sqdist_harmonic_lt: for 1 <= n <= m, sqdist (harmonic m) (harmonic n) < 1/n.\",\n    \"harmonic_l1_lower_bound_holds\": \"sum_harmonicTerm_Ico_ge / l1dist_harmonic: for n >= 1, l1dist (harmonic 2n) (harmonic n) >= 1/2.\",\n    \"harmonic_nonconvergence_bound_holds\": \"harmonic_not_tendsTo: with M the support bound of f and N > M,\",\n    \"modulus_holds\": \"HasModulusL2 on a finite window: for all mu k <= m, n <= horizon,\",\n    \"l1_cauchy_fails\": \"A finite refutation of IsCauchyL1: a pair (m, n) beyond every candidate stage with\",\n    \"CauchyPoint\": \"A point of the completion represented constructively: an exact sequence with an explicit\",\n    \"inner_fluctuation_sq_bound\": \"Exact square-root-free bound: (qinner xm ym - qinner xn yn)^2\",\n    \"inner_fluctuation_holds\": \"Function inner_fluctuation_holds operation.\",\n    \"grid_approximation\": \"The density step of denseRange_castSeq_real with exact data: for a finitely supported\",\n    \"unit_vector\": \"Function unit_vector operation.\",\n    \"unit_vectors_not_cauchy\": \"e_m, e_n with m != n have sqdist 2: the sequence of unit vectors is not ℓ²-Cauchy.\",\n    \"shifted_modulus_fails\": \"The modulus k -> k (one stage too early) fails for the harmonic witness at k = 0:\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse inv