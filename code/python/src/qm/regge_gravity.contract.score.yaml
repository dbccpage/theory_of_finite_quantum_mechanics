li_z\": \"Function pauli_z operation.\",\n    \"kron3\": \"Function kron3 operation.\",\n    \"ghz_unnormalized\": \"|000> + |111> over Q(i); the 1/sqrt(2) is omitted and never needed.\",\n    \"rayleigh_quotient\": \"<v, A v> / <v, v>; the denominator is a positive rational for v != 0.\",\n    \"exact_eigenvalue\": \"lambda with A v = lambda v exactly.  Refuses the zero vector and any v that\",\n    \"mermin_operators\": \"A1 = X Y Y, A2 = Y X Y, A3 = Y Y X and B = X X X.\",\n    \"mermin_operator\": \"M = B - A1 - A2 - A3.\",\n    \"mermin_deterministic_values\": \"x1 x2 x3 - x1 y2 y3 - y1 x2 y3 - y1 y2 x3 over all 64 assignments in {-1, +1}^6.\",\n    \"GhzMerminAudit\": \"QM-230 (a) values: the 8x8 operators, the GHZ vector, their exact\",\n    \"build_ghz_mermin_audit\": \"Function build_ghz_mermin_audit operation.\",\n    \"clock_shift\": \"S |t> = |t + step mod dim>.\",\n    \"rational_gaussian_step_unitary\": \"U = W diag(1, i) W^dagger with W = (1/5) [[3, 4i], [4i, 3]]: a non-diagonal\",\n    \"history_state\": \"|Psi> = sum_t |t> (x) U^t |psi0> on Q(i)^(ticks * dim).\",\n    \"page_wootters_residual\": \"(I_C (x) U - S_step (x) I_S) |Psi>.\",\n    \"PageWoottersAudit\": \"QM-230 (b) values: the step unitary, the initial state, the history and the\",\n    \"build_page_wootters_audit\": \"Function build_page_wootters_audit operation.\",\n    \"phase_damping_kraus\": \"K0 = diag(1, p/q), K1 = diag(0, r/q) for a Pythagorean triple p^2 + r^2 = q^2.\",\n    \"apply_kraus\": \"Function apply_kraus operation.\",\n    \"plus_state_density\": \"|+><+| = (1/2) [[1, 1], [1, 1]].\",\n    \"PhaseDampingRun\": \"One triple: its Kraus pair and the states rho_0 = |+><+|, rho_1, rho_2, rho_3,\",\n    \"PhaseDampingAudit\": \"QM-230 (c) values: one run per Pythagorean triple.\",\n    \"build_phase_damping_audit\": \"Function build_phase_damping_audit operation.\",\n    \"sgn\": \"Function sgn operation.\",\n    \"qwz_dirac_masses\": \"At the four time-reversal-invariant momenta k = (n_x pi, n_y pi) the QWZ\",\n    \"qwz_chern_number\": \"C_1(m) = (1/2) sum_{n_x, n_y} (-1)^(n_x + n_y) sgn(m + (-1)^n_x + (-1)^n_y);\",\n    \"haldane_chern_number\": \"Haldane Dirac masses M -/+ 3 sqrt(3) t_2 s at K and K' (opposite chirality):\",\n    \"ChernParityAudit\": \"QM-231 values: (sample, C) pairs.  The checks are properties over them.\",\n    \"build_chern_parity_audit\": \"Function build_chern_parity_audit operation.\",\n    \"ReggeGravityGhzChernControlReport\": \"Combined QM-229 / QM-230 / QM-231 control report over Q and Q(i).\",\n    \"evaluate_regge_gravity_ghz_chern_control\": \"Function evaluate_regge_gravity_ghz_chern_control operation.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
