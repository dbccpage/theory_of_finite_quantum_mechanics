      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/dressed_qed.py\",\n    \"sha256\": \"49b15cf53db65ae2a670d42cd912c19437ffb7084ad6ab6b756c1239f6005fe8\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:qm:dressed-qed:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"QM-212 finite map: dressed graph polynomials (DFM) and rational QED g-2 enclosure. This control connects three finite mechanisms in exact rational and cyclotomic\",\n  \"operations\": {\n    \"DressedQedControlRefusal\": \"Typed refusal for malformed dressed-graph or rational-interval inputs.\",\n    \"RationalInterval\": \"Closed rational interval [lo, hi] subset Q with exact arithmetic.\",\n    \"enumerate_spanning_trees\": \"Return all (tree_edges, cotree_edges) pairs of the connected carrier graph.\",\n    \"symanzik_u_polynomial\": \"First Symanzik polynomial U_G(alpha) = sum_{T in T(G)} prod_{e not in T} alpha_e.\",\n    \"kirchhoff_dual_symanzik_u\": \"Compute (prod_{e in E} alpha_e) * det L_G^(0)(1 / alpha_e) exactly over Q.\",\n    \"tree_path_on_custom_tree\": \"Unique vertex path from u to v along an arbitrary spanning tree of graph.\",\n    \"dress_cochain_on_tree\": \"Ravera DFM retraction Pi_{dress, T}(A): transport from root 0 along tree_edges.\",\n    \"cycle_basis_change_det\": \"Determinant of the H_1(G; Z) basis-change matrix between two spanning trees.\",\n    \"evaluate_dfm_symanzik_bridge\": \"Verify (a) Symanzik U_G == Kirchhoff dual and (b) DFM gauge & tree invariance.\",\n    \"pi_interval\": \"Machin's formula pi = 16 arctan(1/5) - 4 arctan(1/239) enclosed in Q.\",\n    \"polylog_half_interval\": \"Li_s(1/2) = sum_{k=1}^infty 1 / (k^s 2^k) enclosed in Q (s=1 is ln 2).\",\n    \"zeta3_interval\": \"Apery's alternating series zeta(3) = (5/2) sum_{k>=1} (-1)^{k-1} / (k^3 C(2k, k)).\",\n    \"zeta5_interval\": \"Euler-Maclaurin rational enclosure of zeta(5) with remainder in [0, 5 / (8 N^10)].\",\n    \"qed_loop_coefficients\": \"Compute exact rational intervals for C_1 (1-loop), C_2 (2-loop), and C_3 (3-loop).\",\n    \"evaluate_qed_g2_enclosure\": \"Enclose the L=1,2,3 and L=1..4 QED anomalous magnetic moment a_e to 12 decimals.\",\n    \"residual_import_ledger\": \"Function residual_import_ledger operation.\",\n    \"evaluate_dressed_qed_g2_control\": \"Run the full QM-212 dressed-graph and rational QED g-2 control.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
