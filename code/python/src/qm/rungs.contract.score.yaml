      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/rungs.py\",\n    \"sha256\": \"26661ccd2f7c4d2027e77d1ac3f7e00f983e3c6461c80ee2d09e2eae536a25b5\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:campaigns:rungs:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Rungs 1 through 8 foundational walk for finite quantum mechanics. Decomposed from foundations.py monolith. Integrates with omega_engine crates.\",\n  \"operations\": {\n    \"RungFrameError\": \"A rational frame or a rational cocycle failed an exact check.\",\n    \"primitive_difference\": \"Float helper. The certificate is exact_cocycle_defect.\",\n    \"exact_primitive_difference\": \"D(x, y) = y - x over the rationals.\",\n    \"exact_cocycle_defect\": \"(y - x) + (z - y) minus the direct step (z - x).\",\n    \"is_same\": \"Sameness is equality of the rational values. `tol` is not consulted.\",\n    \"check_difference_cocycle\": \"Cocycle identity on 0-simplexes, decided by exact_cocycle_defect.\",\n    \"check_difference_antisymmetry\": \"Antisymmetry: D(x, y) + D(y, x) == 0 over the rationals.\",\n    \"triangle_boundary_rank\": \"Rank of the triangle coboundary over Fraction, by Gaussian elimination.\",\n    \"CochainPacket\": \"Finite cochain packet over a declared 2-complex.\",\n    \"build_triangle_packet\": \"Builds standard oriented 3-cycle triangle packet.\",\n    \"weights_to_probabilities\": \"Rung 3: L^1 normalization of positive residual weights into probabilities.\",\n    \"verify_ray_invariance\": \"Rung 3: Probabilities are ray invariant under positive scaling w -> c*w.\",\n    \"amplitudes_to_probabilities\": \"Rung 3: Quadratic Born rule mapping complex state amplitudes to probabilities.\",\n    \"born_normalization\": \"Rung 3: Normalizes a state vector psi to unit L^2 norm and constructs rank-1 Born projector P = |psi><psi|.\",\n    \"verify_born_normalization_redundancy\": \"Rung 3: Verifies that sum_k Tr(E_k rho) == 1 is an algebraic redundancy under complete POVM resolution.\",\n    \"weights_to_born_density\": \"Rung 3: L^1 positive residual weights lifted to a pure state Born projector P = |psi><psi|.\",\n    \"compute_cycle_holonomy\": \"Rung 4: Computes U(1) holonomy phase around a directed closed cycle.\",\n    \"two_path_interference\": \"Rung 4: Evaluates two-path interference via canonical interference crate.\",\n    \"sorkin_3slit_parameter\": \"Rung 4: Sorkin 3-slit interference parameter I_3(A, B, C) via canonical interference crate.\",\n    \"superposition_quotient_fiber\": \"Rung 4: Analyzes superposition as the quotient fiber over classical probability.\",\n    \"superposition_interference_test\": \"Rung 4: Demonstrates 2-state superposition interference fringes under a beam splitter.\",\n    \"schmidt_decomposition\": \"Rung 5: Computes Schmidt coefficients of a bipartite pure state in H_A ⊗ H_B.\",\n    \"is_entangled_pure_state\": \"Rung 5: Entanglement as an obstruction to product factorization (Schmidt rank > 1).\",\n    \"verify_mermin_peres_contextuality\": \"Rung 5: Verifies Mermin-Peres 3x3 contextuality obstruction on C^2 ⊗ C^2 via contextuality_f2.\",\n    \"partial_trace\": \"Rung 5: Partial trace of bipartite density matrix rho_AB over subsystem B.\",\n    \"bipartite_linear_entropy\": \"Rung 5: Computes linear entropy S_L(rho_A) = 1 - Tr(rho_A^2) of the reduced state.\",\n    \"bipartite_von_neumann_entropy\": \"Rung 5: Computes von Neumann entanglement entropy S(rho_A) = -Tr(rho_A log(rho_A)).\",\n    \"bell_state\": \"Rung 5: Returns one of the four canonical maximally entangled Bell states (indices 0..3).\",\n    \"verify_non_signaling\": \"Rung 5: Verifies the non-signaling theorem Tr_B((I_A ⊗ U_B) rho_AB (I_A ⊗ U_B^dagger)) == Tr_B(rho_AB).\",\n    \"is_unitary\": \"Rung 6: Verifies U^dagger U = I.\",\n    \"discrete_unitary_step\": \"Rung 6: Discrete time evolution psi(t+1) = U psi(t) or rho(t+1) = U rho(t) U^dagger.\",\n    \"continuous_generator_branch_count\": \"Rung 6: Exhibits the continuous-time generator obstruction.\",\n    \"is_valid_povm\": \"Rung 7: Verifies that a collection of matrices forms a valid POVM (E_m >= 0, sum E_m = I).\",\n    \"povm_probabilities\": \"Rung 7: Computes Born probabilities p(m) = Tr(E_m rho) for a POVM.\",\n    \"non_selective_measurement_decoherence\": \"Rung 7: Non-selective measurement state update rho' = sum_m P_m rho P_m (decoherence).\",\n    \"verify_cptp_contractivity\": \"Rung 7: Verifies monotonicity of trace distance under depolarizing CPTP channel.\",\n    \"BoundaryDefense\": \"Rung 8: Exact defended statement of where the finite presentation stops.\",\n    \"get_boundary_defense\": \"Rung 8: Constructs the boundary defense object for a given carrier dimension.\",\n    \"is_orthonormal_frame\": \"Checks whether a set of d vectors forms an orthonormal basis for C^d or R^d.\",\n    \"evaluate_frame_function\": \"Evaluates the sum of a candidate frame function f over an orthonormal frame.\",\n    \"density_matrix_frame_function\": \"Constructs the canonical Gleason frame function f_rho(v) = <v| rho |v>.\",\n    \"verify_gleason_frame_additivity\": \"Verifies that f_rho(v) = <v|rho|v> sums to 1.0 across all supplied orthonormal frames.\",\n    \"gleason_dimension_2_counterexample\": \"Exhibits the failure of Gleason's Theorem in dimension d = 2.\",\n    \"discrete_gleason_triads_d3\": \"Returns a collection of orthogonal triad frames in R^3 for testing discrete Gleason.\",\n    \"rational_pythagorean_frames_d2\": \"Constructs exact rational orthonormal 2-frames in Q^2 via primitive Pythagorean triples.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
