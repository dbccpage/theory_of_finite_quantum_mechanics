      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/holonomy_bridge.py\",\n    \"sha256\": \"f910a80a350da11d4a70c9b21aedd2022923da8232539d0ed95d83b2ffa8ee0b\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:campaigns:holonomy-bridge:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Finite multi-report holonomy bridge control for QM-207 through QM-211. Every quantity here is computed exactly in a cyclotomic field Q(zeta_N) using\",\n  \"operations\": {\n    \"HolonomyControlRefusal\": \"Typed refusal: the supplied data is outside the declared finite model.\",\n    \"root_of_unity\": \"zeta_N^k as an exact element of Q(zeta_N).\",\n    \"is_root_of_unity\": \"x is a unit (x conj(x) = 1) of finite order dividing the conductor.\",\n    \"root_exponent\": \"The k with x = zeta_N^k. Refuses if x is not a root of unity of conductor N.\",\n    \"FiniteCarrierGraph\": \"Finite connected graph with a BFS spanning tree and fundamental cycles.\",\n    \"U1Cochain\": \"A U(1) 1-cochain with values in the roots of unity of conductor N.\",\n    \"holonomy_factorizes\": \"Hol(walk) == product over fundamental invariants^(winding coefficient). Exact.\",\n    \"gauge_orbit_census\": \"Enumerate every mu_N cochain, group by cycle invariants, check the orbit count.\",\n    \"gauge_equivalence_matches_invariants\": \"Both directions, by enumeration: same invariants <=> some gauge maps one to the other.\",\n    \"l1_weights\": \"Phase-blind diagonal weights w_i = c_i conj(c_i).\",\n    \"l1_phase_blind\": \"Weights are invariant under every locus gauge chi: the L1 shadow cannot see phase.\",\n    \"report_amplitudes\": \"Transport one source amplitude along each report (a path) to the common sink.\",\n    \"relative_report_phase\": \"Hol(p1 . p2^{-1}) = U(p1) conj(U(p2)); gauge invariant.\",\n    \"l1_readout\": \"Function l1_readout operation.\",\n    \"quadratic_readout\": \"Function quadratic_readout operation.\",\n    \"quartic_readout\": \"Negative control: a non-quadratic readout |sum c|^4.\",\n    \"second_order_interference\": \"I_2 = quadratic readout minus L1 readout = sum_{i<j} 2 Re(c_i conj c_j).\",\n    \"third_order_interference\": \"Sorkin I_3 for an arbitrary readout rule on three amplitudes.\",\n    \"identity\": \"Function identity operation.\",\n    \"matmul\": \"Function matmul operation.\",\n    \"dagger\": \"Function dagger operation.\",\n    \"mat_eq\": \"Function mat_eq operation.\",\n    \"is_unitary\": \"Function is_unitary operation.\",\n    \"scalar_multiple_of_identity\": \"Return c with a = c I, else refuse.\",\n    \"weyl_shift\": \"Function weyl_shift operation.\",\n    \"weyl_clock\": \"Function weyl_clock operation.\",\n    \"group_commutator\": \"a b a^dagger b^dagger: the holonomy around the 4-cycle of context transitions.\",\n    \"commutator_holonomy\": \"Central U(1) holonomy of the commutator cycle; refuses if it is not central.\",\n    \"fourier_matrix_d4\": \"The d=4 Fourier matrix (1/2) i^{jk}: exact since sqrt(4) = 2.\",\n    \"apply\": \"Function apply operation.\",\n    \"born_in_context\": \"Born weights read in the context reached by the transition: |U c|^2 componentwise.\",\n    \"pauli_2qubit\": \"Function pauli_2qubit operation.\",\n    \"peres_mermin_parity_holonomy\": \"Z/2 holonomy of the Peres-Mermin context cycle, computed exactly over Q(i).\",\n    \"clock_refinement_tower\": \"Finite clocks U_k = diag(zeta_{d 2^k}^j) with U_{k+1}^2 = U_k, all inside Q(zeta_N).\",\n    \"residual_import_ledger\": \"Per import: what is exactly computed, what completion carries it, what remains imported.\",\n    \"evaluate_holonomy_bridge_control\": \"Run the whole finite control exactly and return JSON-serializable results.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
