 \"quartic_readout\": \"Negative control: a non-quadratic readout |sum c|^4.\",\n    \"second_order_interference\": \"I_2 = quadratic readout minus L1 readout = sum_{i<j} 2 Re(c_i conj c_j).\",\n    \"third_order_interference\": \"Sorkin I_3 for an arbitrary readout rule on three amplitudes.\",\n    \"identity\": \"Function identity operation.\",\n    \"matmul\": \"Function matmul operation.\",\n    \"dagger\": \"Function dagger operation.\",\n    \"mat_eq\": \"Function mat_eq operation.\",\n    \"is_unitary\": \"Function is_unitary operation.\",\n    \"scalar_multiple_of_identity\": \"Return c with a = c I, else refuse.\",\n    \"weyl_shift\": \"Function weyl_shift operation.\",\n    \"weyl_clock\": \"Function weyl_clock operation.\",\n    \"group_commutator\": \"a b a^dagger b^dagger: the holonomy around the 4-cycle of context transitions.\",\n    \"commutator_holonomy\": \"Central U(1) holonomy of the commutator cycle; refuses if it is not central.\",\n    \"fourier_matrix_d4\": \"The d=4 Fourier matrix (1/2) i^{jk}: exact since sqrt(4) = 2.\",\n    \"apply\": \"Function apply operation.\",\n    \"born_in_context\": \"Born weights read in the context reached by the transition: |U c|^2 componentwise.\",\n    \"pauli_2qubit\": \"Function pauli_2qubit operation.\",\n    \"peres_mermin_parity_holonomy\": \"Z/2 holonomy of the Peres-Mermin context cycle, computed exactly over Q(i).\",\n    \"clock_refinement_tower\": \"Finite clocks U_k = diag(zeta_{d 2^k}^j) with U_{k+1}^2 = U_k, all inside Q(zeta_N).\",\n    \"residual_import_ledger\": \"Per import: what is exactly computed, what completion carries it, what remains imported.\",\n    \"evaluate_holonomy_bridge_control\": \"Run the whole finite control exactly and return JSON-serializable results.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",