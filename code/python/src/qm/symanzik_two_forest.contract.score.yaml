 matrix over Q.\",\n    \"kirchhoff_schur_symanzik_f0\": \"Dual Kirchhoff-Schur complement formula for F_0(alpha; q) over Q:\",\n    \"tree_routed_edge_momenta\": \"Compute the unique tree-supported edge momentum flow p_T in C_1(G; Q^d) such that\",\n    \"vertex_divergence_of_edge_flow\": \"Compute (d_0^T p)(v) = sum_{e=(u->v)} p(e) - sum_{e=(v->w)} p(e) at each vertex v.\",\n    \"fundamental_cycle_matrix\": \"Return (cotree_edges, C_T) where C_T is the b_1 x |E| fundamental cycle matrix\",\n    \"dfm_loop_eliminated_f0\": \"Evaluate (U_G, F_0) from the DFM spanning-tree momentum routing p_T and the\",\n    \"DivergentSubgraph\": \"A UV-divergent 1PI subgraph gamma with edge set E(gamma) and degree omega(gamma) >= 0.\",\n    \"are_subgraphs_compatible\": \"Two 1PI subgraphs are Zimmermann-compatible (non-overlapping) iff\",\n    \"enumerate_zimmermann_forests\": \"Enumerate all Zimmermann forests F in F(G) (subsets of pairwise compatible subgraphs).\",\n    \"bphz_two_loop_nested_sector_integrand\": \"Evaluate the 4 Zimmermann forest terms on the 2-loop nested self-energy\",\n    \"evaluate_symanzik_two_forest_bphz_control\": \"Run all three parts of the QM-214 control and return an exact dictionary receipt.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.