      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/qm/inner_product_uniqueness.py\",\n    \"sha256\": \"deae64d0a7e48045791aff0a505223e3dc22653606f49c87c4e9d5fa7591536d\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:qm:inner-product-uniqueness:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Exact replay of the sector-form uniqueness chain: an inner product on the sector carrier is forced, up to scale, by sector additivity and transitive sector symmetry. Replays in exact rational and Gaussian-rational arithmetic the Lean modules of\",\n  \"operations\": {\n    \"unit_vector\": \"Function unit_vector operation.\",\n    \"disjoint_support\": \"No sector carries both: for every k, u[k] == 0 or v[k] == 0.\",\n    \"permutation\": \"Admit sigma as a list of images 0..n-1 (a bijection); the input is materialised once, so one-shot iterables are checked too.\",\n    \"inverse_permutation\": \"Function inverse_permutation operation.\",\n    \"permute\": \"(permute sigma x)[i] = x[sigma^{-1}(i)]; the coordinate action with permute(sigma, e_j) = e_{sigma(j)} (entries of any scalar type).\",\n    \"orbits\": \"Orbits of the sectors under the group generated by perms (as sorted lists); inverses are formed once.\",\n    \"generated_transitivity_certificate\": \"Transitivity of the group generated by perms, decided from its orbits (the replay of TransitiveOn (Generated S) without materialising the group): ('transitive',None) or ('not_transitive',(i,j,orbits)) with i and j in different orbits.\",\n    \"closure\": \"The group generated by perms (sorted image lists; identity, products and inverses), the replay of Generated.\",\n    \"transitivity_certificate\": \"('transitive',None) when every pair (i,j) with i != j has sigma in perms with sigma[i]==j, else ('not_transitive',(i,j,orbits)).\",\n    \"pairing\": \"Function pairing operation.\",\n    \"sector_additivity_defect\": \"qf(u+v) - qf(u) - qf(v) for disjointly supported u, v (equal to pair(u,v) + pair(v,u)).\",\n    \"sector_additivity_defects\": \"The pair sums G_ij + G_ji for i < j; all zero iff the readout is sector additive.\",\n    \"sector_additivity_certificate\": \"('sector_additive',diag) with qf(x) = sum diag[i]*x[i]^2, or ('not_sector_additive',(i,j,u,v,defect)) with u = e_i, v = e_j.\",\n    \"diagonal_readout\": \"sum G_ii x_i^2: equals qf(G, x) exactly when G is sector additive (symmetry not required).\",\n    \"invariance_defects\": \"For i <= j the symmetric-part defects (G_{si,sj} + G_{sj,si}) - (G_ij + G_ji), on the diagonal G_{si,si} - G_ii; all zero iff the readout is invariant under sigma, for any G (the readout sees exactly the symmetric part).\",\n    \"invariance_certificate\": \"('invariant',None) or ('not_invariant',(i,j,x,qf(permute sigma x),qf(x))) with x = e_i for a diagonal defect and x = e_i + e_j for an off-diagonal one.\",\n    \"derive_scale\": \"The selection theorem replayed on a supplied symmetric Gram matrix and permutation set.\",\n    \"scale_is_positive\": \"True when the derived scale is positive, i.e. the selected form is positive definite.\",\n    \"uniqueness_certificate\": \"Two selected forms with equal diagonal entry i0 are equal; in general G2 = (G2_i0i0/G_i0i0) G.\",\n    \"all_permutations\": \"Function all_permutations operation.\",\n    \"swap\": \"Function swap operation.\",\n    \"hunit_vector\": \"Function hunit_vector operation.\",\n    \"hdisjoint_support\": \"Function hdisjoint_support operation.\",\n    \"hermitian_sector_additivity_defect\": \"re(x*(u+v))-re(u*Hu)-re(v*Hv) for disjointly supported Gaussian vectors.\",\n    \"hermitian_sector_additivity_defects\": \"For i < j the two defects read along the directions 1 and i: (re(H_ij + H_ji), im(H_ji - H_ij)).\",\n    \"hermitian_sector_additivity_certificate\": \"('sector_additive',real_diag) or ('not_sector_additive',(i,j,u,v,defect)) with v = e_j or v = i*e_j.\",\n    \"hermitian_invariance_defects\": \"For i <= j the defects H_{si,sj} - H_ij of a Hermitian H (the readout sees exactly the Hermitian part); all zero iff the readout is invariant under sigma. Hermitian input required.\",\n    \"hermitian_invariance_certificate\": \"('invariant',None) or ('not_invariant',(i,j,x,hf(permute sigma x),hf(x))) with x = e_i, x = e_i + e_j (real part of the defect) or x = e_i + i*e_j (imaginary part).\",\n    \"hermitian_derive_scale\": \"The Hermitian selection theorem replayed: ('scalar',c,I) with real c = re H_00 and H == c*I, or the first failing hypothesis.\",\n    \"diag12\": \"Function diag12 operation.\",\n    \"unif12\": \"Function unif12 operation.\",\n    \"imag_leak12\": \"Function imag_leak12 operation.\",\n    \"s2\": \"Function s2 operation.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
