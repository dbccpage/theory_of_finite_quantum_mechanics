 \"QedTreeLevelAudit\": \"QM-226 audit record: computed Compton, Thomson, Bhabha and Moller values over Q.\",\n    \"build_qed_tree_level_audit\": \"Function build_qed_tree_level_audit operation.\",\n    \"dirac_to_weyl_blocks\": \"V = [[I, -I], [I, I]] and V^T with V V^T = 2 I.  V / sqrt(2) is orthogonal; its two\",\n    \"dirac_gammas_weyl\": \"gamma_W = (1/2) V gamma_D V^T from the Dirac-basis ``dirac_gamma_matrices()``:\",\n    \"clifford_anticommutator\": \"gamma^mu gamma^nu + gamma^nu gamma^mu.\",\n    \"gamma5\": \"gamma_5 = i gamma^0 gamma^1 gamma^2 gamma^3.\",\n    \"chiral_projectors\": \"P_L = (I - gamma_5) / 2 and P_R = (I + gamma_5) / 2.\",\n    \"chiral_test_spinor\": \"The fixed spinor used for the V-A current check.\",\n    \"ChiralProjectorAudit\": \"QM-227 (a) audit record: the Weyl gammas, gamma_5 and the V-A projectors.\",\n    \"build_chiral_projector_audit\": \"Function build_chiral_projector_audit operation.\",\n    \"MuonDecayInputs\": \"Declared rational inputs (CODATA 2018 electron mass and constants, PDG muon mass and lifetime).\",\n    \"muon_recoil_polynomial\": \"f_0(x) = 1 - 8x + 8x^3 - x^4, the polynomial part of the muon phase-space factor.\",\n    \"MuonDecayFermiConstantAudit\": \"QM-227 (b) audit record: f(x) and G_F / (hbar c)^3 as rational enclosures.\",\n    \"build_muon_decay_audit\": \"Function build_muon_decay_audit operation.\",\n    \"ckm_skew_hermitian_generator\": \"Skew-Hermitian generator tuned so that V = (I - A)(I + A)^(-1) sits near the\",\n    \"cayley_transform\": \"V = (I - A)(I + A)^(-1) over Q(i); unitary whenever A is skew-Hermitian.\",\n    \"jarlskog_invariant\": \"J = Im(V_{a c} V_{b d} V_{a d}^* V_{b c}^*) for row pair (a, b) and column pair (c, d).\",\n    \"ckm_db_triangle\": \"Unitarity-triangle sides z_k = V_{k d} V_{k b}^* for k in {u, c, t}.\",\n    \"CkmUnitarityAudit\": \"QM-227 (c) audit record: the generator, the Cayley transform and its Jarlskog invariant.\",\n    \"build_ckm_unitarity_audit\": 