nal covers into the canonical global partition tree.\",\n    \"verify_volume_conservation\": \"Verifies exact rational volume conservation across all 6 regional covers.\",\n    \"BoundaryInterface\": \"Exact transition interface between two adjacent regional charts.\",\n    \"build_canonical_boundary_interfaces\": \"Builds the 6 canonical boundary interfaces forming the closed nerve cycle.\",\n    \"verify_boundary_interface_adjacency\": \"Verifies that the multi-chart boundary interfaces form an exact adjacent cover.\",\n    \"GlobalNetworkSimplexVerifier\": \"Network Simplex cycle circulation check on the multi-chart nerve cycle.\",\n    \"generate_target_a10_receipt\": \"Generates an exact rational certificate receipt for Target A10.\",\n    \"audit_target_a10_receipt\": \"Audits and validates an exact rational Target A10 certificate receipt.\",\n    \"audit_missing_cell_tree\": \"Negative control: audits rejection of a tree missing a region or leaf cell.\",\n    \"audit_volume_discrepancy\": \"Negative control: audits rejection when total cell volume != expected volume.\",\n    \"audit_boundary_gap\": \"Negative control: audits rejection of boundary interfaces with non-zero gap.\",\n    \"audit_overlapping_cells\": \"Negative control: audits rejection of overlapping uncertified cells.\",\n    \"audit_non_positive_margin\": \"Negative control: audits rejection of cell with non-positive obstruction margin.\",\n    \"audit_corrupted_receipt_schema\": \"Negative control: audits rejection of corrupted receipt schemas, bad firewall, or injected floats.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
