\"Typed certificate for exact algebraic quadratic-module identity verification.\",\n    \"ExactProjectorPolynomial\": \"Non-commutative polynomial in formal projector generators over Fraction.\",\n    \"verify_quadratic_module_identity\": \"Verify algebraic identity 25*1 - sum_{i, a} Pi^2_{i, a} = 21*1 in projector quotient ring.\",\n    \"FlatExtensionReceipt\": \"Receipt certifying the Curto-Fialkow flat extension rank gap at degree 1.\",\n    \"certify_flat_extension_rank_gap\": \"Compute and certify the flat extension rank gap at the specified moment level.\",\n    \"ArchimedeanDegreeBoundReceipt\": \"Receipt evaluating the Archimedean Positivstellensatz degree bound and scope.\",\n    \"evaluate_archimedean_degree_bound\": \"Evaluate Archimedean Positivstellensatz degree bound and certificate scope.\",\n    \"QSoundnessReceipt\": \"Comprehensive typed receipt certifying all three Q-Soundness obligations.\",\n    \"generate_q_soundness_receipt\": \"Generate the canonical typed receipt certifying all three Q-Soundness obligations.\",\n    \"claim_universal_mub6_nonexistence\": \"Fail-closed enforcement rejecting any claim of universal MUB(6) non-existence.\",\n    \"certify_universal_mub6_nonexistence\": \"Fail-closed endpoint rejecting universal certification.\",\n    \"build_degree_k_moment_matrix\": \"Fail-closed moment matrix builder for degree k.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of 