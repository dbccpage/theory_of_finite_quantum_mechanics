ion\": \"Verify that (S6, S6) cannot form an MU pair (extending I6) for tested gauge partners.\",\n    \"verify_same_orbit_b6_b6_obstruction\": \"Verify that (B6, B6) cannot form an MU pair (extending I6) for distinct tested parameter points.\",\n    \"verify_t05_10_cross_orbit_triad_obstruction\": \"Execute complete T05_10 verification:\",\n    \"combinations_exact\": \"Exact integer binomial coefficient binom(n, k).\",\n    \"reindexed_pigeonhole_dita_count\": \"Evaluate exact pigeonhole bounds for the 6 non-identity bases in a putative 7-MUB.\",\n    \"verify_t05_11_pigeonhole_lemma\": \"Execute complete T05_11 verification:\",\n    \"verify_pigeonhole_global_cover_bridge_integration\": \"Verify combinatorial consequence of reindexed pigeonhole lemma under explicit premises.\",\n    \"evaluate_tao_gauge_partner_transitions\": \"Test transition unimodularity for S6 against a comprehensive battery of gauge partners.\",\n    \"verify_t02_07_tao_unimodularity_failure\": \"Execute complete T02_07 verification.\",\n    \"evaluate_szollosi_parameter_pair_transition\": \"Evaluate U = B6(pt1)^dag B6(pt2) and verify scale-6 MU condition failure.\",\n    \"verify_t03_06_szollosi_unimodularity_obstruction\": \"Execute complete T03_06 verification:\",\n    \"generate_target_g1_orbit_incompatibilities_receipt\": \"Execute all 5 Target G1 vector verifiers and generate the certified receipt.\",\n    \"audit_target_g1_orbit_incompatibilities_receipt\": \"Audit an existing Target G1 receipt against schema, firewall, and exactness.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds und