      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/mub/target_a4_gram_certifier.py\",\n    \"sha256\": \"e5143bd21002295682b80aa5f7180821e4db91e9983a760786f17663ea8d4070\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:mub:target-a4-gram-certifier:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Target A4 Python Exact Rational & Cyclotomic Certifier for 24x24 Gramian Matrix. Firewall Line: stated region only; mints no authority.\",\n  \"operations\": {\n    \"assert_no_float\": \"Recursively verify that no float types exist in any certifier data structure.\",\n    \"exact_rational\": \"Extract exact rational value from Cyc24 element, ensuring it lies in Q.\",\n    \"sqrt6_cyc\": \"sqrt(6) = sqrt(2) * sqrt(3) in Q(zeta_24).\",\n    \"omega3_pow\": \"omega_3^exp = zeta_24^{8 * (exp % 3)} in Q(zeta_24).\",\n    \"qubit_x_columns\": \"Qubit basis X2: columns are (1/sqrt2)[1, 1]^T and (1/sqrt2)[1, -1]^T.\",\n    \"canonical_triple_exact\": \"The 18 exact column vectors of canonical triple T0 = {Z2(x)Z3, X2(x)Q0, Y2(x)Q1} in C^6.\",\n    \"tao_s6_block\": \"Construct the 6x6 Tao Hadamard matrix S6 with entries S6[j][k] = omega_3^{phases[j][k]} / sqrt(6).\",\n    \"canonical_quad_gramian\": \"Construct the 24x24 Gramian overlap matrix G for the candidate 4-basis configuration.\",\n    \"compute_gram_matrix_cyc\": \"Construct exact cyclotomic Gram matrix G_ij = <v_i, v_j> = sum_k conj(v_i[k]) * v_j[k].\",\n    \"GramianStructureReport\": \"Report on the exact block structure of the 24x24 Gramian matrix.\",\n    \"verify_gramian_structure\": \"Verify that a 24x24 matrix has the exact structure of a 4-MUB Gramian:\",\n    \"ldlt_pivots_rational\": \"Exact rational LDL^T pivots of a Hermitian matrix over Q(zeta_24).\",\n    \"ldlt_decomposition_cyc\": \"Exact rational LDL^dagger decomposition of a Hermitian matrix over Q(zeta_24).\",\n    \"is_psd_cyc\": \"Return True iff Hermitian matrix G over Q(zeta_24) is positive semidefinite.\",\n    \"DualWitnessCyc\": \"Factored dual witness matrix W = L * D * L^dagger over Q(zeta_24) with D in Q.\",\n    \"trace_inner_product\": \"Compute Tr(W * G) = sum_{i,j} W_{ij} * G_{ji} for full matrices.\",\n    \"dual_witness_vector\": \"Construct the canonical 24-dimensional dual witness vector v from mub6_quad_sdp.rs.\",\n    \"dual_certificate_matrix\": \"Construct the canonical dual witness matrix W = v * v^dagger (+ eps * I if strict).\",\n    \"MubQuadSdpCertificate\": \"Full exact verification certificate for the 24x24 Gramian matrix.\",\n    \"solve_quad_sdp_certificate\": \"Generate the full exact rational/cyclotomic certificate solving the quad SDP problem.\",\n    \"verify_dual_obstruction_cyc\": \"Verify regional dual obstruction Tr(W * G) < 0 on a set of candidate Gram matrices.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
