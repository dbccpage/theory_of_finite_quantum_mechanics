,\n    \"analyze_cross_ratio_spectrum\": \"Perform exact spectral decomposition of all 225 cross-ratios for matrix m.\",\n    \"OrbitClassificationReport\": \"Exact report produced by deterministic decision-tree orbit classifier.\",\n    \"classify_orbit\": \"Deterministic decision-tree orbit classifier mapping any valid 6x6 CHM into M_6.\",\n    \"verify_orbit_membership\": \"Verify that a given matrix m strictly belongs to the expected orbit.\",\n    \"OrbitReductionCertificate\": \"Certificate linking an equivalence orbit to a certified Target A10 partition cell.\",\n    \"certify_orbit_reduction\": \"Certifies orbit reduction for matrix m by mapping it into a certified Target A10 partition cell.\",\n    \"verify_all_canonical_orbits_reduction\": \"Certify all 4 canonical matrices (F_6, S_6, H_6, B_6) against Target A10.\",\n    \"audit_perturbed_matrix\": \"Negative control: Verify that perturbing a single entry breaks CHM and is rejected.\",\n    \"audit_misclassified_orbit_claim\": \"Negative control: Verify that claiming a false orbit is strictly rejected.\",\n    \"audit_incomplete_catalog_proposal\": \"Negative control: Verify that any proposed catalog missing required orbits is rejected.\",\n    \"audit_float_injection_rejection\": \"Negative control: Verify that floating point types are strictly rejected by assert_no_float.\",\n    \"generate_target_a11_receipt\": \"Generates an exact rational certificate receipt for Target A11.\",\n    \"audit_target_a11_receipt\": \"Audits and validates an exact rational Target A11 certificate receipt.\",\n    \"audit_corrupted_receipt_schema\": \"Negative control: Verify that corrupted receipt schemas are strictly rejected.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
