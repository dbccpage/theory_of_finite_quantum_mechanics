      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/bin/finite_cli.py\",\n    \"sha256\": \"ad4fb1d167f67a1f09f19e53d606e1910ba859f167ac1c93044510cfc9863f80\"\n  },\n  \"claim\": \"urn:omega:fqm:linear-algebra:cli-identity-trace:v1\",\n  \"profile\": \"Exact\",\n  \"role\": \"provider adapter and entrypoint\",\n  \"purpose\": \"Bounded identity-trace composition and command argument/status adapter.\",\n  \"operations\": {\n    \"cli_identity_trace\": \"Require a built-in integer dimension in [0,256], request the real ExactMatrix identity, admit only built-in rational/int diagonal entries, sum and check trace equals dimension.\",\n    \"main\": \"Detach at most 64 built-in string arguments, each at most 4096 characters; delegate to qm.cli and admit only built-in integer statuses 0,1,2. Parser exits, local admission failures and IO failures become status 2 (help status 0 is preserved). Module execution exits with main's result.\",\n    \"ExactMatrix\": \"Compatibility-visible imported provider. Its full arithmetic API is a separate source assessment, not certified by this adapter.\",\n    \"_require_diagonal/_sum_diagonal\": \"Internal provider-output trust boundary retained for compatibility tests; reject non-rational and overriding scalar values before trace arithmetic.\"\n  },\n  \"engineering_policy\": \"Identity at most 256x256 cells; command vector 64x4096 characters. Scientific suite computations, evidence checks and filesystem reads remain delegated; this file imposes no aggregate provider deadline or file-size ceiling.\",\n  \"policy_origin\": \"Declared engineering limits, not empirical measurements or derived physical constants.\",\n  \"failure_boundary\": \"CliTraceError for local admission/trace and translated MatrixError provider failures, preserving the original cause. main returns 2 for admitted failure classes and rejects malformed dispatcher statuses.\",\n  \"cost_model\": \"Local argument work O(count*length), trace provider construction O(d^2) storage plus O(d) diagonal reads; all local dimensions bounded. Delegated suite cost is not bounded here.\",\n  \"scope_ceiling\": \"No arbitrary-matrix theorem, continuum obstruction, full qm.cli suite certification or production deadline guarantee.\",\n  \"trust\": \"Pinned CPython and providers in the challenge inputs. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Tests may deliberately supply binary floats only as rejection probes under SCORING.md.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T212330Z-entrypoints-challenge/receipt.json\",\n      \"sha256\": \"b7c426b9fb3b58c0f80ca3a6af8bbe82db83333f8046af728dcb10f22d684a49\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T212358Z-source-metrics/receipt.json\",\n      \"sha256\": \"395b619a318a5b519b9b2b11f24b7bc76ae1a373c3f2fb16220d13ad69b52d68\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch2-baseline.log\",\n      \"sha256\": \"ac4614164e22c790103ce4db5a662da099a1027b7b96a131e748f88b9a843169\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch2-atlas.log\",\n      \"sha256\": \"45425bc105e799841cffa39d959410b2947cb7f8fb62879199a2fa95f302b7f3\"\n    }\n  ]\n}\n",
