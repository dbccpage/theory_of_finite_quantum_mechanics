    "failure_boundary": "CliTraceError for local admission/trace and translated MatrixError provider failures, preserving the original cause. main returns 2 for admitted failure classes and rejects malformed dispatcher statuses.",
    "cost_model": "Local argument work O(count*length), trace provider construction O(d^2) storage plus O(d) diagonal reads; all local dimensions bounded. Delegated suite cost is not bounded here.",
    "scope_ceiling": "No arbitrary-matrix theorem, continuum obstruction, full qm.cli suite certification or production deadline guarantee.",
    "trust": "Pinned CPython and providers in the challenge inputs. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.",
