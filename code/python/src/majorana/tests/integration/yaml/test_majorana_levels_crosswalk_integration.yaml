test_suite: test_majorana_levels_crosswalk_integration
category: integration_test
description: Integration test specifications for Majorana cohomology, Levels 0-3 crosswalk, retraction geometry, and EPK overlay.

tests:
  - test_name: test_integration_cross_01_evaluate_majorana_parity
    route: anomalon.coda.majorana_cohomology_bridge.evaluate_network_majorana_parity
    input:
      edges: [[0, 1], [1, 2], [2, 0]]
      num_nodes: 3
    expected_output:
      cert_non_null: true

  - test_name: test_integration_cross_02_level0_witnessed_difference
    route: anomalon.coda.levels_crosswalk.Level0WitnessedDifference
    input:
      difference_norm: Fraction(1, 2)
    expected_output:
      difference_norm: Fraction(1, 2)

  - test_name: test_integration_cross_03_level1_finite_obstruction
    route: anomalon.coda.levels_crosswalk.Level1FiniteObstruction
    input:
      obstruction_norm: Fraction(3, 4)
    expected_output:
      obstruction_norm: Fraction(3, 4)

  - test_name: test_integration_cross_04_level2_projection_obstruction
    route: anomalon.coda.levels_crosswalk.Level2ProjectionObstruction
    input:
      projection_defect: Fraction(1, 8)
    expected_output:
      projection_defect: Fraction(1, 8)

  - test_name: test_integration_cross_05_level3_residual_composition
    route: anomalon.coda.residual_composition.Level3ResidualComposition
    input:
      class_check: true
    expected_output:
      class_exists: true

  - test_name: test_integration_cross_06_retraction_geometry_lift
    route: anomalon.coda.retraction_geometry
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_cross_07_epk_overlay_math_spine
    route: anomalon.coda.epk_overlay
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_cross_08_observer_carriers_surface_pairing
    route: anomalon.coda.observer_carriers
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_cross_09_tetron_carrier_homology
    route: anomalon.coda.tetron_carrier
    input:
      module_load: true
    expected_output:
      has_name_attribute: true

  - test_name: test_integration_cross_10_presheaf_colimit_aggregation
    route: anomalon.coda.presheaf_colimit_benchmark
    input:
      module_load: true
    expected_output:
      has_name_attribute: true


