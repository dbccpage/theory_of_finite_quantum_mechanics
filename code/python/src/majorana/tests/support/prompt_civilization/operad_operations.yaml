# Operad Operations Manifest for Prompt Civilization
# Declares typed 1-operations, port signatures, and schema references.
# AuthorityEffect: None.

schema: "omega.prompt-civilization.operad-manifest.v1"
authority_effect: "None"

colours:
  - colour_id: "PromptArtifact"
    family: "prompt"
    schema_ref: "omega.prompt.source-bytes.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"
  - colour_id: "FindingSet"
    family: "prompt"
    schema_ref: "omega.prompt.finding-set.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"
  - colour_id: "PromptCandidate"
    family: "prompt"
    schema_ref: "omega.prompt.typed.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"
  - colour_id: "ReviewReceipt"
    family: "receipt"
    schema_ref: "omega.prompt.review-receipt.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"
  - colour_id: "OperatorDecision"
    family: "receipt"
    schema_ref: "omega.prompt.operator-decision.v1"
    validator_ref: "omega.prompt-civilization.review.v1"
    digest_source: "review"
  - colour_id: "ApprovedPrompt"
    family: "prompt"
    schema_ref: "omega.prompt.approved.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"
  - colour_id: "PacketEnvelope"
    family: "packet"
    schema_ref: "omega.symbol-game.packet-envelope.v2"
    validator_ref: "omega.symbol-game.packets.v2"
    digest_source: "packet"
  - colour_id: "RawDialogue"
    family: "dialogue"
    schema_ref: "omega.dialogue.source-bytes.v1"
    validator_ref: "omega.prompt-civilization.dialogue.v1"
    digest_source: "dialogue"
  - colour_id: "EpisodeSet"
    family: "dialogue"
    schema_ref: "omega.antiskill.episode-set.v1"
    validator_ref: "omega.prompt-civilization.dialogue.v1"
    digest_source: "dialogue"
  - colour_id: "AntiSkillCandidateSet"
    family: "antiskill"
    schema_ref: "omega.antiskill.candidate-set.v1"
    validator_ref: "omega.prompt-civilization.models.v1"
    digest_source: "models"

operations:
  - operation_id: "omega-prompt-detect"
    inputs: ["PromptArtifact"]
    output: "FindingSet"
    executor_ref: "omega.prompt-civilization.review.core-findings.v1"
    digest_source: "review"
  - operation_id: "omega-prompt-repair-proposal"
    inputs: ["PromptArtifact", "FindingSet"]
    output: "PromptCandidate"
    executor_ref: "omega.prompt-civilization.review.build-typed-prompt.v1"
    digest_source: "review"
  - operation_id: "omega-prompt-verify"
    inputs: ["PromptArtifact", "PromptCandidate"]
    output: "ReviewReceipt"
    executor_ref: "omega.prompt-civilization.review.review-prompt.v1"
    digest_source: "review"
  - operation_id: "omega-prompt-approve"
    inputs: ["PromptCandidate", "ReviewReceipt", "OperatorDecision"]
    output: "ApprovedPrompt"
    executor_ref: "omega.prompt-civilization.review.approve-prompt.v1"
    digest_source: "review"
  - operation_id: "omega-prompt-packetize"
    inputs: ["ApprovedPrompt"]
    output: "PacketEnvelope"
    executor_ref: "omega.prompt-civilization.review.packetize-prompt.v1"
    digest_source: "review"
  - operation_id: "auto-antiskill-segment"
    inputs: ["RawDialogue"]
    output: "EpisodeSet"
    executor_ref: "omega.prompt-civilization.dialogue.segment.v1"
    digest_source: "dialogue"
  - operation_id: "auto-antiskill-mine-candidate"
    inputs: ["EpisodeSet"]
    output: "AntiSkillCandidateSet"
    executor_ref: "omega.prompt-civilization.dialogue.mine.v1"
    digest_source: "dialogue"
