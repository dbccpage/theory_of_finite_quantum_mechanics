      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/majorana_fock_algebra.py\",\n    \"sha256\": \"762b2601988a361b69ff1fcd117a0f6c90318fe65f5f8081785c6d41fb8c62a2\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:finite-fock-occupation:v1\",\n  \"role\": \"exact bounded occupation-matrix provider\",\n  \"operations\": {\n    \"GaussianRat\": \"Owned exact Fraction pair; addition/subtraction/product and zero test use exact Gaussian rational arithmetic. Reinitialization, subclasses, float/bool and overriding numeric values refuse.\",\n    \"FockCarrier\": \"1..5 modes, first mode most significant bit, odd gamma=Z...ZX and even gamma=Z...ZY with Y|0>=i|1>. c=(odd+i even)/2 lowers occupation; number is the occupied-bit projector; parity is (-1)^popcount.\",\n    \"braid_unitary\": \"For adjacent gamma indices, (1+i)/2 times (I+gamma_(a+1) gamma_a); finite unitarity/braid/remote commutation checks cover modes 1..3. No complete representation theorem inferred.\",\n    \"first_anticommutation_failure\": \"Fully admit a built-in family of equal-sized square Gaussian matrices, then return the first one-based failed pair or None. Empty families and 0x0 matrices satisfy equations vacuously; None does not certify a nonzero or faithful representation.\",\n    \"restrict_to_sector\": \"Require the carrier dimension, a built-in boolean selector and zero cross-parity blocks before returning a detached sector matrix. Refuse sector-mixing operators.\"\n  },\n  \"engineering_policy\": \"Carrier modes<=5, matrix dimension<=32, family length<=32 and CAR product bound family*(family+1)*dimension^3<=4000000. Gaussian components use the shared 1024-bit stored rational policy. Declared limits are not empirical physics values.\",\n  \"failure_boundary\": \"MajoranaError for invalid scalar/container/shape/index/sector/resource values. Immutable exact scalars and carrier, detached returned matrices, no external handles or writes. A resource refusal may occur during exact arithmetic before a result is returned; inputs remain unchanged.\",\n  \"cost_model\": \"Matrices use O(4^m) entries with m<=5; sparse gamma generation still returns dense matrices. CAR and braid products have finite cubic dimension cost; CAR explicitly preflights relation products. Fraction operations remain exact and refuse component growth beyond the stored bound.\",\n  \"scope_ceiling\": \"Python finite exact local model with a named Rust owner as origin, not a compiled cross-language equivalence receipt. No native host execution, arbitrary mode counts, continuum field, faithful-representation proof or device certification.\",\n  \"origin\": \"Exact pre-repair workspace source snapshot and literal source origin annotation retained in the historical contract. Fock names the Rust owner; this run does not compile or prove cross-language equivalence.\",\n  \"trust\": \"Pinned provider/test and rubric bytes, CPython 3.14 and installed SymPy/Fraction semantics. Closed built-in/canonical types avoid ordinary user hooks. Other conftest/provider transitive code, OS/interpreter state, hostile metaclasses, deliberate reflection, monkeypatching, hostile concurrent mutation and host exhaustion are not independently certified or sandboxed.\",\n  \"negative_float_fixture_policy\": \"Binary floats are used only in deliberate rejection or detached-export probes; no admitted exact arithmetic uses them.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T233919Z-majorana-challenge/receipt.json\",\n      \"sha256\": \"3a77fe22970507f5373a00a27389a2c2132838edff60538bd938532d13959cf6\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T234424Z-majorana-followup-challenge/receipt.json\",\n      \"sha256\": \"a134386f99288db8f5d5b84e5502756d95a0f80e3d32650c8472a9ad55e5be7b\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch6-challenge-rev