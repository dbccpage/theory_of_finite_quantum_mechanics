      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/network_residual.py\",\n    \"sha256\": \"d6613ea22a2f1150b03c8193d3067ff829d1aa44ec38d3f5671b80ea4f0ebdf3\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:network-residual:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Network residual analysis module. Implements discrete Hodge 1-chain gauge fixing, L1/L2 residual extraction,\",\n  \"operations\": {\n    \"Network\": \"Directed network topology with optional 2-cell faces and 3-cell tetrahedra.\",\n    \"GaugeFixResult\": \"Result of a gauge-fixing optimization.\",\n    \"build_incidence\": \"Build boundary operator matrix d0 mapping 0-potentials to 1-chain edge differences.\",\n    \"build_face_boundary\": \"Build boundary operator matrix d1 mapping 2-cell face coefficients to 1-chain edge values.\",\n    \"detect_tetrahedra\": \"Detect or construct 3-cell tetrahedra (u,v,w,x) from network topology.\",\n    \"build_tetrahedron_boundary\": \"Build boundary operator matrix d2 mapping 3-cell tetrahedra to 2-cell faces.\",\n    \"residual_c2_after_gauge_fix\": \"Extract 1-cochain potential beta minimizing ||c2 - d1^T @ beta|| under L1 norm.\",\n    \"gradient\": \"Compute exact potential differences along directed edges.\",\n    \"curl\": \"Compute 2-cell boundary sums around faces (d1 applied to 1-cochains).\",\n    \"tetrahedral_boundary_sum\": \"Compute 3-cell boundary sums over tetrahedra (d2 applied to 2-cochains).\",\n    \"four_simplex_boundary_sum\": \"Compute 4-cell boundary sums over 4-simplices (d3 applied to 3-cochains).\",\n    \"five_simplex_boundary_sum\": \"Compute 5-cell boundary sums over 5-simplices (d4 applied to 4-cochains).\",\n    \"six_simplex_boundary_sum\": \"Compute 6-cell boundary sums over 6-simplices (d5 applied to 5-cochains).\",\n    \"residual_after_gauge_fix\": \"Extract potential field alpha minimizing ||h - d0 @ alpha|| under L1 or L2 norm.\",\n    \"multi_cycle_l1_joint\": \"Joint multi-cycle L1 descent minimizing ||h - d0 @ alpha - d1 @ beta||_1.\",\n    \"vector_residual_after_gauge_fix\": \"Extract vector potential field alpha minimizing edge residuals under SO(k) Euclidean norms.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
