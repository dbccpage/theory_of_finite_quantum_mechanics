      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/test_exactness_sweep.py\",\n    \"sha256\": \"2a66061b97cffb2c9e9c90cb36527344676b4f7015a0226c516b1606f4e66903\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:test-exactness-sweep:v1\",\n  \"role\": \"test checker\",\n  \"purpose\": \"SPRINT-001: exactness is a decision, not a tolerance. Four sites decided a mathematical question with an epsilon. Each test below\",\n  \"operations\": {\n    \"test_a_residual_below_the_old_tolerance_is_not_exact\": \"Mutation: restore `post_norm < 1e-9` at scoring.py:373 -> this flips to exact.\",\n    \"test_many_small_components_do_not_vanish_when_summed\": \"Mutation: restore the `if abs(value) > 1e-9` filter at scoring.py:363.\",\n    \"test_an_exactly_cancelled_cochain_is_exact\": \"A genuinely zero residual is exact. 3/7 is not representable in binary.\",\n    \"test_thirds_sum_to_one_where_binary_floats_do_not\": \"0.1+0.2 != 0.3 in f64; 1/3 three times is exactly 1 over Q.\",\n    \"test_zero_residual_without_a_dual_witness_is_still_not_exact\": \"Exactness is residual-zero AND a named witness. Neither alone.\",\n    \"test_discrete_counts_are_carried_exactly_not_as_floats\": \"Mutation: restore `float(len(current))` -> the norm is a float again.\",\n    \"test_a_float_in_the_cochain_is_refused_not_converted\": \"Mutation: coerce with `Fraction(value)` instead of refusing -> becomes legal.\",\n    \"test_a_float_cochain_delta_is_refused_at_construction\": \"Mutation: drop the coerce_exact loop in CandidateProposal.__post_init__.\",\n    \"test_an_exactness_claim_over_a_float_is_refused\": \"STORY-001-002's decisive mutation, stated directly.\",\n    \"test_a_tiny_exact_residual_cannot_be_claimed_exact\": \"Mutation: restore `> 1e-9` at coboundary_score.py:84 -> construction succeeds.\",\n    \"test_score_result_still_asserts_authority_effect_none\": \"The exactness work must not have loosened the authority fence.\",\n    \"test_exact_norms_cross_the_wire_as_canonical_strings\": \"Mutation: `float(self.post_residual_norm)` in to_dict -> 1/3 stops round-tripping.\",\n    \"test_noncanonical_exact_wire_spellings_are_refused\": \"A rational has one wire spelling.  Otherwise equal values can acquire\",\n    \"test_the_exact_wire_renderer_refuses_a_float\": \"The renderer is another boundary: accepting 0.1 here would preserve an\",\n    \"test_a_non_exact_score_is_refused_at_construction\": \"The exact boundary applies before serialization too; a float must not\",\n    \"test_a_gamma2_excess_below_the_old_epsilon_is_a_violation\": \"STORY-001-003's decisive mutation.\",\n    \"test_an_uncertified_phi1_leaves_the_bound_undetermined_not_satisfied\": \"Mutation: `return True` when phi1 is None -> a fail-open.\",\n    \"test_the_frozen_fixtures_project_exactly\": \"The projector could not previously run at all: it imported a module that\",\n    \"test_phi1_is_refused_where_only_a_bound_is_carried\": \"OpenObstruction names Phi1 = 1 but carries no dual witness pinning it.\",\n    \"test_no_epsilon_literal_survives_in_a_swept_file\": \"STORY-001-004's decisive mutation: add one back and the scan names the line.\",\n    \"test_the_scan_would_actually_catch_a_reintroduced_epsilon\": \"A negative control for the scan above.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"CheckError or assertion failure on mismatched invariants or unadmitted values; expected test exceptions caught and verified.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
