      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/test_majorana_control.py\",\n    \"sha256\": \"c926c77f36fcf1ef4b6fa7c5b92dd7339c909e0c373afd9ef56f2b69357e35f1\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:car-nilpotency-witness:v1\",\n  \"role\": \"CAR provider/package and self-checking regression harness\",\n  \"operations\": {\n    \"checked_int/harness_seal\": \"Refuse float, bool, non-built-in/overriding and oversized integers, then check the finite integer seal.\",\n    \"baseline\": \"Load the owned finite configured source fixture, demand exactly True from the oracle and restore the previous sys.modules binding on all exits.\",\n    \"_killed_one\": \"Require a unique candidate site and callable oracle; a syntax/import/load exception is a CheckError explicitly not counted as a kill. Return a kill only for an oracle result exactly False; unexpected oracle failures propagate. Restore prior/absent module state even on failures.\",\n    \"suites\": \"Eight declared finite faults each for local library, package seal and harness. Full focused regression executes these legacy suites; external source-bound challenge adds invalid-candidate/module-custody/bit-budget failures.\"\n  },\n  \"engineering_policy\": \"Scalar bit cap 1024 inherited from the reviewed provider. In-process legacy execution is limited by its owned fixed source fixtures/configured eight faults, not a service accepting arbitrary external programs. The external evidence runner supervises each candidate with a 60-second process timeout and six explicit outcomes.\",\n  \"failure_boundary\": \"CheckError for protocol/admission/baseline failures. Invalid load is never promoted to successful detection; arbitrary oracle infrastructure errors escape and invalidate assessment. Existing module bindings restored in finally; no host processes/remote services invoked by the in-process protocol.\",\n  \"cost_model\": \"Finite configured source compilation and predicate checks; no global bounded-runtime theorem. In-process exec is not OS isolation and is not safe for arbitrary untrusted or nonterminating source. The 60-second external supervisor bounds receipt generation, not the functions' arbitrary-input runtime.\",\n  \"scope_ceiling\": \"Finite CAR/package-seal/self-oracle adequacy only. No full Majorana package, native deployment, complete Lean theorem build, all-module regression or arbitrary-code sandbox certification.\",\n  \"origin\": \"Exact pre-repair workspace source snapshot and literal source origin annotation retained in the historical contract. Fock names the Rust owner; this run does not compile or prove cross-language equivalence.\",\n  \"trust\": \"Pinned provider/test and rubric bytes, CPython 3.14 and installed SymPy/Fraction semantics. Closed built-in/canonical types avoid ordinary user hooks. Other conftest/provider transitive code, OS/interpreter state, hostile metaclasses, deliberate reflection, monkeypatching, hostile concurrent mutation and host exhaustion are not independently certified or sandboxed.\",\n  \"negative_float_fixture_policy\": \"Binary floats are used only in deliberate rejection or detached-export probes; no admitted exact arithmetic uses them.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T233919Z-majorana-challenge/receipt.json\",\n      \"sha256\": \"3a77fe22970507f5373a00a27389a2c2132838edff60538bd938532d13959cf6\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T234424Z-majorana-followup-challenge/receipt.json\",\n      \"sha256\": \"a134386f99288db8f5d5b84e5502756d95a0f80e3d32650c8472a9ad55e5be7b\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch6-challenge-review.json\",\n      \"sha256\": \"614d17a0a704ba90a797752d715651f7aa502c6af928f41c3017840aedc80659\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T233818Z-s