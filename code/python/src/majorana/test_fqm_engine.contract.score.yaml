      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/test_fqm_engine.py\",\n    \"sha256\": \"76e4a800472c4c30d9826691df714aeffc4ee2696085f8617ab7d8dedf0c1c06\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:test-fqm-engine:v1\",\n  \"role\": \"test checker\",\n  \"purpose\": \"Tests for the AnomalonicQAM finite-QM reference engine. Every test below states the invariant it defends and is written so that a real mutation of\",\n  \"operations\": {\n    \"test_trace_norm_is_sum_of_absolute_eigenvalues_on_a_known_matrix\": \"||diag(1,-1)||_1 = 2, not |1 + (-1)| = 0. Kills any use of |trace|.\",\n    \"test_trace_norm_of_a_density_matrix_is_one\": \"Function test_trace_norm_of_a_density_matrix_is_one operation.\",\n    \"test_partial_traces_invert_a_product\": \"Tr_b(rho_a (x) rho_b) = rho_a and Tr_a(...) = rho_b. Kills swapped index conventions.\",\n    \"test_partial_trace_b_is_not_partial_trace_a\": \"Guards against both helpers collapsing to the same einsum.\",\n    \"test_P_e_is_idempotent\": \"P_e is the differential of a retraction at a fixed point, so P_e o P_e = P_e.\",\n    \"test_Q_e_annihilates_the_tangent_component\": \"Q_e = I - P_e, so Q_e(P_e Z) = 0.\",\n    \"test_nu_e_vanishes_on_the_product_manifold\": \"For a non-interacting Hamiltonian the product manifold is invariant, so nu_e = 0.\",\n    \"test_product_edge_stays_product_under_evolution\": \"Function test_product_edge_stays_product_under_evolution operation.\",\n    \"test_interacting_edge_has_strictly_positive_nu_e\": \"Function test_interacting_edge_has_strictly_positive_nu_e operation.\",\n    \"test_a_e_as_defined_is_not_the_second_order_coefficient\": \"Defect D1: a_e := 0.5*||Q_e rho_ddot||_1 omits the cross term 2 rho_dot_a (x) rho_dot_b.\",\n    \"test_cross_term_is_genuinely_omitted_from_the_defined_a_e\": \"f''(0) and Q_e rho_ddot(0) differ by exactly the cross term.\",\n    \"test_cross_term_is_not_small\": \"A term of norm 5.76 against a_e = 6.89 cannot be dismissed as higher order.\",\n    \"test_short_time_lower_bound_with_true_coefficient_does_not_exceed_the_exact_defect\": \"D_e(t) >= nu_e t - a_e_true t^2 must not be violated by the exact defect.\",\n    \"test_first_order_slope_matches_nu_e\": \"D_e(t)/t -> nu_e as t -> 0. Ties the projected definition to observable behaviour.\",\n    \"test_engine_declares_its_host_as_an_import\": \"The finite complex host is supplied by numpy, not derived. No tensor product is\",\n    \"test_solve_phi1_dual_witness\": \"Function test_solve_phi1_dual_witness operation.\",\n    \"test_bar_a_e_corrected_bound_holds\": \"The bound must use the RIGOROUS coefficient; the 20-point sample is not one.\",\n    \"test_gleason_d2_falsifier\": \"Function test_gleason_d2_falsifier operation.\",\n    \"test_composition_sandbox_cartesian_vs_tensor\": \"Function test_composition_sandbox_cartesian_vs_tensor operation.\",\n    \"test_import_necessity_countermodels\": \"Function test_import_necessity_countermodels operation.\",\n    \"test_sealed_matrix_recovery_suite\": \"Function test_sealed_matrix_recovery_suite operation.\",\n    \"test_qam_001_covariant_wigner_yanase_monotonicity\": \"Narrowed TWICE 2026-08-04: the hypothesis is COVARIANCE, not unitality.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"CheckError or assertion failure on mismatched invariants or unadmitted values; expected test exceptions caught and verified.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\"