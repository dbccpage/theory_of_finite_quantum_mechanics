      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/test_engines_residual.py\",\n    \"sha256\": \"69cb0d1c107df870190a914d784ef5604e2941f2de9594303d73e646821f232c\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:test-engines-residual:v1\",\n  \"role\": \"test checker\",\n  \"purpose\": \"Tests for the residual-geometry engines: phi1_lp, trace_norm_quotient, snf_betti, l1_l2_boundary.\",\n  \"operations\": {\n    \"unfilled_cycle\": \"Function unfilled_cycle operation.\",\n    \"test_phi1_vanishes_on_a_tree\": \"A tree has no cycles, so every cochain is exact and Phi_1 = 0.\",\n    \"test_phi1_equals_cycle_mass_on_a_harmonic_cochain\": \"The all-ones cochain on a 3-cycle is pure circulation: no gauge can reduce it.\",\n    \"test_phi1_is_invariant_under_adding_a_coboundary\": \"Phi_1 is a function of the CLASS. Adding d0(alpha) must not move it.\",\n    \"test_phi1_dual_certificate_closes_the_gap\": \"A primal value without a dual witness is an estimate, not a certificate.\",\n    \"test_dual_witness_is_actually_feasible\": \"|phi_e| <= w_e and d0^T phi = 0. Kills a 'dual' that is just the primal residual.\",\n    \"test_constant_gauge_sweep_provably_finds_nothing\": \"The sibling engine's Phi_1 'minimization' is a no-op, and this shows why.\",\n    \"test_trace_norm_quotient_is_zero_on_an_exact_coboundary\": \"If delta IS d0(alpha), the residual is exactly repairable.\",\n    \"test_trace_norm_quotient_certifies_with_a_feasible_dual\": \"Primal and dual must meet, with the dual genuinely inside its ball.\",\n    \"test_the_two_dual_ball_conventions_differ_by_exactly_two\": \"qm_080 states lambda_max - lambda_min <= 1 (trace DISTANCE); the plain trace norm\",\n    \"test_betti_of_a_filled_triangle_is_contractible\": \"A 2-cell fills the loop: b0=1, b1=0, b2=0. Kills a b1 that ignores d1.\",\n    \"test_betti_of_an_unfilled_cycle_has_b1_one\": \"Remove the face and the cycle survives as homology. Kills a b1 pinned to zero.\",\n    \"test_betti_counts_components\": \"Two disjoint cycles: b0 = 2, b1 = 2. Kills a b0 hardcoded to 1.\",\n    \"test_snf_recovers_invariant_factors_exactly\": \"SNF of diag-equivalent integer data must give integer invariant factors.\",\n    \"test_torsion_is_reported_not_silently_dropped\": \"diag(2,3) has invariant factors (1, 6): the homology carries a Z/6, not Z/2 + Z/3\",\n    \"test_prop_e2_bounds_hold_and_both_are_attained\": \"||x||_2 <= ||x||_1 <= sqrt(d)||x||_2, tight on the axes and on equal moduli.\",\n    \"test_prop_e3_quotient_comparison_holds\": \"Phi_2 <= Phi_1 <= sqrt(m) Phi_2 on a real carrier. Kills a swapped inequality.\",\n    \"test_hodge_inflation_matches_foc004_analytic_value\": \"FOC_004 §1.1 item 4 predicts 3 - 2/n on the n-cycle. Measured must match.\",\n    \"test_delta_is_representative_dependent_but_phi_is_not\": \"The whole dispute in one test: delta moves within a class, Phi_1 and Phi_2 do not.\",\n    \"test_snf_refuses_non_integral_input_instead_of_rounding\": \"'Exact integer SNF' must not silently answer for a different matrix.\",\n    \"test_phi1_does_not_certify_off_a_failed_solve\": \"is_certified must require BOTH solves to succeed.\",\n    \"test_phi1_surfaces_a_weak_duality_violation_instead_of_clamping\": \"dual > primal is impossible; if it happens a solve is wrong and must be visible.\",\n    \"test_normalize_refuses_zero_total_mass\": \"W = 0 has no state to normalize to. Kills a silent uniform-distribution fallback.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"CheckError or assertion failure on mismatched invariants or unadmitted values; expected test exceptions caught and verified.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
