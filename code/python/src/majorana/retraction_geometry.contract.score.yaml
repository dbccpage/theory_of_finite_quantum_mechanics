      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/retraction_geometry.py\",\n    \"sha256\": \"508e85529ba4217f36b8ce0ccd59d74b931a338c66c0f1ed3544e963cc73fd5b\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:retraction-geometry:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Bounded domain operations and invariant verification for retraction_geometry.\",\n  \"operations\": {\n    \"AffineNonlinearityInstance\": \"Exact witness for nonconstant ``DB`` in one declared affine chart.\",\n    \"SemigroupDefectInstance\": \"Exact witness that ``S_(t+s)`` need not equal ``S_t S_s``.\",\n    \"GraphRetraction\": \"The polynomial retraction onto ``M = {(x,y,z) : z=x^2}``.\",\n    \"contraction_generator\": \"Return the exact skew generator used by the theorem-aligned fixture.\",\n    \"rotation\": \"Exact ``exp(t A)`` for :func:`contraction_generator`.\",\n    \"projected_generator_ambient\": \"Compute ``D Pi(point) A point`` on ``M``.\",\n    \"projected_generator_chart\": \"Chart representation of the canonical projected generator.\",\n    \"affine_nonlinearity_instance\": \"Construct the exact nonconstant-derivative witness for Theorem 3.1.\",\n    \"projected_family\": \"Compute ``S_t(point) = Pi(exp(tA) point)`` exactly.\",\n    \"semigroup_defect_instance\": \"Return an exact ``S_pi != S_(pi/2) S_(pi/2)`` witness.\",\n    \"ChartInfinitesimalGaugeInstance\": \"Exact witness for chart infinitesimal gauge generator d0 construction.\",\n    \"normal_residual_field_symbolic\": \"Compute the symbolic normal residual field n(x, y) = (I - D\\\\Pi_m) v(m) on M.\",\n    \"normal_residual_jacobian_symbolic\": \"Compute the symbolic 3x2 Jacobian Dn(x, y) = [dn/dx, dn/dy] of the normal residual field.\",\n    \"chart_infinitesimal_gauge_repair_map\": \"Compute the observed normal residual cochain and d0 repair map at chart base point (x_val, y_val).\",\n    \"chart_infinitesimal_gauge_instance\": \"Build exact membership and rational l1 quotient certificates for the chart gauge d0.\",\n    \"HigherOrderChartGaugeInstance\": \"Exact witness for higher-order chart gauge generator d0 construction and Phi monotonicity.\",\n    \"higher_order_chart_gauge_instance\": \"Construct exact 1st-order vs higher-order gauge d0 repair matrices and evaluate Phi monotonicity.\"\n  },\n  \"engineering_policy\": \"Declared admission policy: inputs validated at public boundaries; integers <= 1024 bits; no unadmitted float/bool on exact paths. These are admission policies, not mathematical limits.\",\n  \"failure_boundary\": \"Typed domain errors refuse invalid inputs, out-of-range parameters, and unadmitted types. Fail-closed error handling without bare asserts.\",\n  \"cost_model\": \"Polynomial or linear operational bounds under declared size envelopes. No unbounded recursion or unmetered allocations.\",\n  \"scope_ceiling\": \"Scoped strictly to declared discrete structures. No claim of continuum completeness, universal physics, or authority promotion.\",\n  \"trust\": \"Pinned CPython and test bytes. Type-based checks avoid value.__class__ and container/scalar overrides. This is not a security sandbox for arbitrary metaclass hooks, monkeypatching, hostile interpreter state, host exhaustion or deliberate reflection.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"6ee94fcc05012701184da584f062ec235917c15f8e068718a4968a1ed00bb6de\"\n    }\n  ]\n}\n",
