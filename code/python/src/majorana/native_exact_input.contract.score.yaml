      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/majorana/native_exact_input.py\",\n    \"sha256\": \"e7bc2fcf062e33e856abbdbfb4d0a52ad3229f4bf99b5aec6a1072ee7ff21ca3\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:majorana:bounded-native-exact-codec:v1\",\n  \"role\": \"bounded exact native-wire codec, no native invocation\",\n  \"operations\": {\n    \"as_rational\": \"Accept built-in int/str/Fraction and six canonical SymPy rational classes. Finite decimal/exponent atoms and at most one rational slash are normalized with Fraction, preserving the observed original Rational text grammar; no general symbolic evaluator/sympify hook is invoked on arbitrary input.\",\n    \"exact_vector\": \"Admit a built-in list/tuple/range or one of four canonical SymPy dense/sparse matrix classes. Require a column except the explicitly normalized empty 0x0/0x1/1x0 shapes. Return a new mutable canonical SymPy column.\",\n    \"matrix_wire\": \"Preflight canonical matrix dimensions and each exact scalar, then return a detached {rows,cols,data} dictionary with rational strings. Preserve 0xn and nx0 shape instead of guessing from entry lists.\"\n  },\n  \"engineering_policy\": \"Scalar components<=1024 bits, text<=1024 chars, decimal exponent magnitude<=1024, decimal atom work<=8192 bits; label<=256 chars, dimensions<=1024 and entries<=65536. Input SymPy component bits are inspected before Fraction normalization. Limits are declared policies, not provider maximums or physics constants.\",\n  \"failure_boundary\": \"TypeError for disallowed closed types/symbolic/approximate entries, ValueError for malformed grammar, zero divisor, shape and resource bounds. User-defined scalar/container/matrix subclass callbacks are not admitted. No process or native request occurs here.\",\n  \"cost_model\": \"Bounded text parse/decimal powers; at most two atom normalizations and a quotient before reduced output admission. Matrix traversal O(rows*cols) and vector traversal O(length) after shape/length preflight. Output allocation is detached; canonical SymPy internals remain trusted.\",\n  \"scope_ceiling\": \"Python exact normalization and codec behavior only. The bounded diagnostic Majorana collection stops on five missing-native-package imports; these are not passed integrations or demonstrated mathematical failures. No Python fallback is introduced for delegated native algorithms.\",\n  \"origin\": \"Exact pre-repair workspace source snapshot and literal source origin annotation retained in the historical contract. Fock names the Rust owner; this run does not compile or prove cross-language equivalence.\",\n  \"trust\": \"Pinned provider/test and rubric bytes, CPython 3.14 and installed SymPy/Fraction semantics. Closed built-in/canonical types avoid ordinary user hooks. Other conftest/provider transitive code, OS/interpreter state, hostile metaclasses, deliberate reflection, monkeypatching, hostile concurrent mutation and host exhaustion are not independently certified or sandboxed.\",\n  \"negative_float_fixture_policy\": \"Binary floats are used only in deliberate rejection or detached-export probes; no admitted exact arithmetic uses them.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T233919Z-majorana-challenge/receipt.json\",\n      \"sha256\": \"3a77fe22970507f5373a00a27389a2c2132838edff60538bd938532d13959cf6\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T234424Z-majorana-followup-challenge/receipt.json\",\n      \"sha256\": \"a134386f99288db8f5d5b84e5502756d95a0f80e3d32650c8472a9ad55e5be7b\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch6-challenge-review.json\",\n      \"sha256\": \"614d17a0a704ba90a797752d715651f7aa502c6af928f41c3017840aedc80659\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T233818Z-source-metrics/receipt.json\",\n      \"sha256\": \"1f3e