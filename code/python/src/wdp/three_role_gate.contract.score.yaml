reeRoleGate.separation_failures\": \"Pairwise identifier equality and shared-principal failures in a fixed order.\"\n  },\n  \"owned_invariants\": [\n    \"Every GateVerdict carries authority_effect \\\"None\\\"; any other value raises ValueError at construction.\",\n    \"A packet that cannot be read is a REJECTED verdict naming one RefusalReason; no exception from reading escapes evaluate_mapping.\",\n    \"ADMITTED_FOR_AUTHORIZATION requires matching scope, an admitted root, a declared observer and pairwise-distinct identifiers and principals under the pairwise_distinct policy.\"\n  ],\n  \"profile\": \"Non-Numeric\",\n  \"purpose\": \"Fail-closed check of a provenance packet (proposer, evaluator, authorizer, observer, authority root, policy): shape, scope, admitted root and pairwise separation of identifiers and principals. It never promotes anything.\",\n  \"role\": \"library\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"scope_ceiling\": \"Scoped to the 17-case fixture and the mutation campaign recorded in the receipt. No claim beyond that.\",\n  \"source_sha256\": \"8ab1e3557ac46b7ab6dcc17c77191482e53c484076760dc2476e8c4bde0adcf1\",\n  \"subject\": \"code/python/src/wdp/three_role_gate.py\",\n  \"trust\": \"Pinned CPython 3.14.2 and pytest 9.1.1. Type checks use type(x) is str so a str subclass or bool is refused. Not a sandbox against hostile interpreter state.\"\n}\n",
