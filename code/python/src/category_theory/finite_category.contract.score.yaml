      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"path\": \"code/python/src/category_theory/finite_category.py\",\n    \"sha256\": \"9a0d6b42dba38c6e291cbc85bee2928df7d7ce528f034d8c5b660796202ded8b\"\n  },\n  \"profile\": \"Exact\",\n  \"claim\": \"urn:omega:fqm:category:finite-arrow-factorization:v1\",\n  \"role\": \"library\",\n  \"purpose\": \"Bounded immutable presentation and exact finite-category law checker, with total report-query factorization on a common source carrier.\",\n  \"operations\": {\n    \"FiniteCategory\": \"Admit a built-in frozenset and built-in dict tables with bounded built-in string labels and tuple endpoints; detach all state. A structurally admitted presentation can be law-invalid. Reinitialization and subclassing are refused; the object is unhashable.\",\n    \"verify_axioms\": \"Check endpoints, exact domain and codomain typing of composition, identities, both units and associativity. Return False for law-invalid presentations, including undeclared composites. The empty category is admitted.\",\n    \"factor_report_query\": \"Require nonempty built-in dicts with the same source set, exact bounded integer keys and values; return a detached decoder iff the query is constant on each report fibre.\",\n    \"verify_report_query_factorization\": \"Only CategoryLawError becomes (False, {}); unexpected infrastructure errors propagate.\"\n  },\n  \"engineering_policy\": \"64 objects, 64 morphisms, 4096 composition entries, labels at most 256 characters. Factor maps at most 4096 sources and integer labels at most 1024 bits. These are declared admission policies, not mathematical cardinality results.\",\n  \"failure_boundary\": \"CategoryLawError for malformed containers, labels, endpoints representations, quotas, different carriers or conflicting fibres. Law-invalid but structurally admitted presentations return False. No caller dictionary alias remains in a committed category.\",\n  \"cost_model\": \"For m arrows, at most O(m^3) associativity lookups and O(m^2) typing work, with m<=64. Factorization uses O(n) bounded exact entries/storage. Labels and integers have explicit size envelopes; no measured real-time guarantee.\",\n  \"scope_ceiling\": \"No classification of categories, free-category construction, general theorem prover or assertion that every query factors.\",\n  \"trust\": \"Pinned CPython and provider/test bytes in the challenge inputs. Ordinary scalar/container override and __class__ callbacks are refused. No security sandbox for malicious metaclasses, reflection, monkeypatching, concurrent mutation or host exhaustion.\",\n  \"negative_float_fixture_policy\": \"Binary floats occur only as deliberate negative/refusal probes, not admitted Exact arithmetic.\",\n  \"evidence\": [\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T221038Z-category-challenge/receipt.json\",\n      \"sha256\": \"cb8a2dec3b6bab12424d0fbed21ab4ed78e43c74288ecd53d8ae6dcf172c55c7\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/20261020T220628Z-source-metrics/receipt.json\",\n      \"sha256\": \"f34e67ed55564d869eaa265f9d0fe95ae1befb32571970512cd9919d9d537513\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch3-baseline.log\",\n      \"sha256\": \"200e1a9c21589275b437ecef1398cb2f2866b44364a9536908c4fa85ed3aa984\"\n    },\n    {\n      \"path\": \"evidence/quality/expanded_scope/batch3-atlas.log\",\n      \"sha256\": \"45425bc105e799841cffa39d959410b2947cb7f8fb62879199a2fa95f302b7f3\"\n    },\n    {\n      \"path\": \"code/rust/quality/expanded_scope/batch3_reviews.json\",\n      \"sha256\": \"d6f250373c550e41fb36d58bc06ffe3a584a41e662c546176c0a33e6ac4e98bd\"\n    }\n  ]\n}\n",
