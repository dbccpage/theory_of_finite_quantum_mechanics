    "operations": {
      "QuadraticRational": "Canonical built-in rational a+b*sqrt(d) with positive d: absorb square factors, represent every rational with d=1, and preserve the non-rational operand's field for mixed arithmetic. Reject mismatched non-rational fields and unadmitted operands. Immutable, hash-coherent, no reinitialization or subclassing.",
      "AbelianGroup": "Nonempty mixed-radix product with moduli>=2 and order<=32. Return detached digits/moduli, exact addition and inverse; admit only built-in finite sequences and bounded built-in integers.",
      "FusionTable": "Own rank-cubed nonnegative integer constants and bounded display names. Constructor admits presentations without asserting ring laws. Law checking returns the first unit, commutativity, associativity, duality or reciprocity defect, or an explicit work-budget refusal.",
