    },
    "engineering_policy": "Rank<=32; word length<=16384; group factors<=5; input and stored quadratic components<=1024 bits; discriminant<=1000000 before trial division; names<=256 characters. Preflight bounds of 2*r^5 law products and len(word)*r^2 path products must each be<=2000000. Path accumulator components<=8192 bits. All are declared engineering policies; a rank-admitted table can still exceed the law-check budget.",
    "failure_boundary": "FusionError with phase/shape/bit context for invalid ordinary scalars/containers/fields, quotas, invalid tables, unsupported dimensions or reinitialization. State commits after validation, and returned lists do not mutate owned tables. Oversized intermediate arithmetic refuses after exact temporary construction; no rounding. Output IO failures return 2.",
    "cost_model": "Canonical square absorption uses bounded trial division under d<=1000000. Table input/storage O(r^3), law verification O(r^5), path count O(length*r^2), with explicit product limits. Integer dimension search is bounded by 6^(r-1)*O(r^3) at r<=4; larger unsupported families refuse. No wall-clock/peak-memory proof.",
    "scope_ceiling": "Finite commutative based-ring and selected exact dimension controls only. No categorification, F/R symbols, anyon Hilbert space, continuum SU(2), complete dimension solver or general mathematical proof.",
    "trust": "Pinned CPython and provider/test bytes in the challenge inputs. Ordinary scalar/container override and __class__ callbacks are refused. No security sandbox for malicious metaclasses, reflection, monkeypatching, concurrent mutation or host exhaustion.",
