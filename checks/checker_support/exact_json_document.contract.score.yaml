        "failure_policy": "Native closed schemas, whole collection/index admission and bounded exact numbers precede geometry. Constructors/private workers raise typed Violation; public fallible queries use Outcome and CLI returns nonzero for expected refusal. IO streams, temporary directories and test patches close/restore. RuntimeError, KeyboardInterrupt and SystemExit propagate. A resource refusal is not a mathematical disproof.",
        "nested_declaration_ownership": {},
        "operational_cost": "At most1MiB raw bytes and16 nested containers. One linear byte scan before decoding; JSON integers have at most1234 decimal digits and4096 bits. Bounded read requests1MiB+1 to detect truncation. Parse creates a fresh tree in O(bytes) work/storage; duplicate object names refuse. Host JSON decoder is a declared dependency; expected recursion/encoding/syntax/IO errors are typed and unexpected failures propagate.",
        "origins": [
          {
            "path": "SCORING.md",
