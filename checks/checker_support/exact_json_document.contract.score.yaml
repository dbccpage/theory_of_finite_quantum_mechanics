              "GaussianExtensionTests.test_document_depth_size_hash_and_ownership",
              "GaussianExtensionTests.test_isolated_admission_terms_prescriptions_and_parser_guards"
            ]
          },
          {
            "requirement": "Own exact immutable bytes, admit at most1MiB before scanning, expose SHA256 of those bytes without claiming authentication. Parse fresh caller-owned values with strictUTF8 and exact-number hooks; recursion refusal is resource, malformed syntax/encoding input. Read only Path objects and close streams on every exit; read1MiB+1 rather than silently truncate. Public reads/parse use Outcome.",
            "requirement_id": "TFQM-EXTENSION-REVIEW-EXACT-JSON-DOCUMENT-2",
