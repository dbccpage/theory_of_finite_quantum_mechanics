        "owned_invariants": [
          "ExactJsonDocument owns immutable bytes up to1MiB, enforces16container nesting outside strings, and parses strictUTF8/exact4096-bit integers with duplicate/float/nonstandard-token rejection into detached trees.",
          "GaussianExtensionCertificate owns nonzero content-one literal vectors, complete indexed nonzero-weight constraints and closed target/normalization metadata before geometry; no projective or symmetry quotient is assumed.",
          "All three conjugate-left Hermitian frame products, prescribed real exotic values, literal-vector coefficient cancellation, RHS32 and f-to-g constant cancellation are replayed exactly.",
          "Every arithmetic product, term, prefix and accumulator is checked within4096 bits before later cancellation. Ray/frame/prescription counts are bounded512/1024/512.",
          "The four negative controls use detached copies; imports are quiet, state is per invocation, and existing CLI labels/default counts remain compatible."
        ],
        "requirements": [
          {
            "requirement": "Track JSON quoted strings and escapes before enforcing depth16; reject oversized decimal tokens before integer conversion, then check actual4096-bit size. Reject float/exponent/NaN/Infinity tokens and duplicate object names.",
            "requirement_id": "TFQM-EXTENSION-REVIEW-EXACT-JSON-DOCUMENT-1",
            "symbols": [
              "_depth",
