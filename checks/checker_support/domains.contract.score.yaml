      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/checker_support/domains.py\",\n    \"sha256\": \"eda1a8c3119462269574e2045d1af908061db2df23a9d1dc9e8f25aa17b33c73\"\n  },\n  \"assessment_id\": \"checker-infrastructure-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Complete source-bound contract, bidirectional symbol/requirement/test mapping, named origins, dependencies and audited consumer boundaries. AuthorityEffect None; fixture scope retained.\",\n    \"G2\": \"Runtime schema/value-object admission, exact arithmetic or explicitly nonnumeric protocol semantics, immutable snapshots and tested endpoint/invalid-type handling. Independent oracles and generated properties cover the declared finite models.\",\n    \"G3\": \"Enumerated input, budget, duplicate, check and OS failures; typed Railway translation and nonzero CLI refusal, validated indexing and finite loop bounds, preserved cancellation and context-managed process/file cleanup. Unexpected programmer failures are not hidden.\",\n    \"G4\": \"Complete normal/optimized contract and integration runs, pinned strict typing, negative paths and generated properties. 70 source mutants executed: 69 killed, one domain-proven equivalent with raw survivor retained. Five separate accounting-replacement mutants are killed. The assertion-only final test amendment is source-hash reconstructed and retested.\",\n    \"G5\": \"CCN maximum 7, cognitive maximum 6, nesting maximum 2; one class or fewer, no production asserts. O(n) admission; 4096 collection entries, 4096-bit rational components and 64-bit words; integer comparison depends on bit length.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T05:46:43.538873+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-checker-infrastructure.md\",\n      \"sha256\": \"513c66bcb4425d16dfcca24c6a0d70cc1eca9fc5e8d38