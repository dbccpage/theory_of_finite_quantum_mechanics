    "failure_policy": "Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.",
    "operational_cost": "Expression preflight has at most 64 nodes and depth 8, with exponent magnitude at most 16. Matrix dimensions are 1..18; products/determinants use O(n^3) completed Gaussian operations and O(n^2) workspace. Stored Gaussian components are 4096-bit rationals; raw native Gaussian arithmetic can use up to 20481-bit components before reduction/admission. Cycles have at most six three-color sites. Laurent state has seven coefficients; convolution has at most 49 products, boundary construction six permutations, and evaluation seven operations over the fixed degree-four exact field using 21 fixed phases. Normal field coordinates are admitted at 4096 bits; trusted SymPy arithmetic has its own temporary representation. The fixed application has 27 cases and 140 controls. CLI/selected-fault subprocesses have 30-second timeouts and full mutation baselines 180 seconds.",
