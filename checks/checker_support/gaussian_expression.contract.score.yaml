7d09267504c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-original-fsp-imaginary-mu-real-det.py.txt\",\n      \"sha256\": \"ac19770608212101081358398a29af59f440a541d91f29fe233e5eaf62c2d81d\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Decode native int/Fraction/GaussianRational or trusted exact SymPy rational/I expressions with Add, Mul and integer powers. Reject text, bytes, floats, bool, foreign conversion hooks, symbols and unadmitted functions before evaluation. Preflight at most 64 nodes, depth 8 and powers -16..16; prescreen rational components before Fraction construction.\",\n    \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n    \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\"\n  ],\n  \"requirements\": {\n    \"budgets\": {\n      \"requirement\": \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n      \"tests\": [\n        \"test_node_depth_power_and_component_budgets\",\n        \"test_shape_preflight_before_expression_evaluation\",\n        \"test_gaussian_matrix_shape_domain_preflight\",\n        \"test_gaussian_matrix_intermediate_budget_cancellation\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_legacy_booleans_matrix_comparison_and_rejection_adapters\"\n      ]\n    },\n    \"lifecycle\": {\n      \"requirement\": \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\",\n      \"tests\": [\n        \"test_owned_values_reentrancy_and_refusal_helper\",\n        \"test_unexpected_failures_and_cancellation_propagate\",\n        \"test_gaussian_matrix_boundaries_and_ownership\",\n        \"test_cycle_input_domains_preflight_and_immutable_state\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_application_original_payload_and_live_case_counter\",\n        \"test_application_failure_translation_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"scalar\": {\n      \"requirement\": \"Decode native int/Fraction/GaussianRational or trusted exact SymPy rational/I expressions with Add, Mul and integer powers. Reject text, bytes, floats, bool, foreign conversion hooks, symbols and unadmitted functions before evaluation. Preflight at most 64 nodes, depth 8 and powers -16..16; prescreen rational components before Fraction construction.\",\n      \"tests\": [\n        \"test_native_and_symbolic_exact_atoms\",\n        \"test_text_and_foreign_hooks_are_never_executed\",\n        \"test_expression_arithmetic_against_symbolic_oracle\",\n        \"test_grammar_refusals_and_zero_negative_power\",\n        \"test_shape_preflight_before_expression_evaluation\",\n        \"test_node_depth_power_and_component_budgets\"\n      ]\n    }\n  },\n  \"role\": \"Production exact-expression codec with bounded syntax, scalar admission and typed query boundaries.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": {\n    \"_atom\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_decode\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_encode\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_power\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_shape\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_value\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"decode\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"encode\": [\n      \"scalar\",\n      \"budgets\",\n      \"lifecycle\"\n    ]\n  }\n}\n",
