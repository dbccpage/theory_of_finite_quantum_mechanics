m or physical theorems.\",\n    \"Shared helper use is not independent mathematical confirmation; the separately implemented oracles supply that check.\",\n    \"Source/test versions and bounded populations in the receipts delimit the assessment; no hosted-CI run or higher engineering grade is inferred.\",\n    \"Callbacks and mutation recipes are trusted synchronous repository code, not an untrusted-code security boundary.\"\n  ],\n  \"bounded_context\": \"Independent finite checking and verification; no production implementation or scientific authority is imported.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:boundary\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-checker-infrastructure.md\",\n      \"sha256\": \"513c66bcb4425d16dfcca24c6a0d70cc1eca9fc5e8d38d5c3a716419af73584b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-requirements.json\",\n      \"sha256\": \"f35bc30bc1c7251fa92dae0adfddd6c7d694781fc3eb4bcbbeeba3db5847cafd\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-composed.json\",\n      \"sha256\": \"90fe9ad62d24997d73c0062bcf90ed8490a8096754308b9af5db9b75a9567961\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-swap-equivalence.md\",\n      \"sha256\": \"737f0bb2b6f63cc40181ccefc569ab55b473e08db23dce0d7a61fb27f46f2a24\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"failure_policy\": \"Input/resource/duplicate/check refusals are explicit; public evaluation returns Outcome. Internal Violation transfers validated Failure. Unexpected programming exceptions and cancellation propagate; the admitted finite computations have validated indexing and bounded loops. Test-owned filesystem/process resources use context-managed cleanup.\",\n  \"operational_cost\": \"Constant boundary work plus trusted callback cost; owns no callback resources.\",\n  \"owned_invariants\": [\n    \"Current source and the completed score bind exactly the artifact SHA-256.\",\n    \"Requirements map to every declared top-level function/class and class method; verification and consumers are named.\",\n    \"No production assert is used, no module has multiple classes, and pinned strict mypy succeeds.\",\n    \"Exact paths exclude bool/float inputs; deliberate invalid-input tests do not relax admission.\",\n    \"Generated and independent-oracle tests run in normal and optimized Python; mutation accounting retains every explicit candidate.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Translate declared synchronous domain failures to typed results; propagate cancellation and unexpected programmer failures. OS failures are resource refusals.\",\n      \"requirement_id\": \"TFQM-CHECKER-BOUNDARY-1\",\n      \"symbols\": [\n        \"evaluate\"\n      ],\n      \"tests\": [\n        \"CheckerSupportTests.test_boundary_errors_cancellation_and_required_boolean\",\n        \"CheckerSupportTests.test_failure_value_and_exception_bridge\"\n      ]\n    },\n    {\n      \"requirement\": \"Only a real bool and a nonblank description form an obligation; false fails under normal and optimized Python.\",\n      \"requirement_id\": \"TFQM-CHECKER-BOUNDARY-2\",\n      \"symbols\": [\n        \"require\"\n      ],\n      \"tests\": [\n        \"CheckerSupportTests.test_boundary_errors_cancellation_and_required_boolean\"\n      ]\n    },\n    {\n      \"requirement\": \"Preserve exact integer exit status 0..255 or None as zero; invalid status or failure emits a JSON diagnostic and exits one. A closed diagnostic stream still yields a nonzero exit status.\",\n      \"requirement_id\": \"TFQM-CHECKER-BOUNDARY-3\",\n      \"symbols\": [\n        \"cli\",\n        \"_write_failure\"\n      ],\n      \"tests\": [\n        \"CheckerSupportTests.test_cli_exit_domain_and_failure_wire_format\"\n      ]\n    },\n    {\n      \"requirement\": \"Validate the closed Failure schema and preserve its typed cause while using Python exception control transfer internally; evaluation returns the cause without reporting success.\",\n      \"requirement_id\": \"TFQM-CHECKER-BOUNDARY-4\",\n      \"symbols\": [\n        \"Violation\",\n        \"Violation.__init__\"\n      ],\n      \"tests\": [\n        \"CheckerSupportTests.test_failure_value_and_exception_bridge\",\n        \"CheckerSupportTests.test_boundary_errors_cancellation_and_required_boolean\"\n      ]\n    }\n  ],\n  \"role\": \"Railway application boundary\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"Violation\",\n    \"Violation.__init__\",\n    \"_write_failure\",\n    \"cli\",\n    \"evaluate\",\n    \"require\"\n  ]\n}\n",
