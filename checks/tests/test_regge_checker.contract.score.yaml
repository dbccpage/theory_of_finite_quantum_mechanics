        "failure_policy": "Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.",
