rty. Generated vector components-16..16 and nonzero scales-20..20; exact projective Fraction ratios, power-of-two normalization and explicit mod4 sign table. Raw box oracles radius1..3 enumerate/deduplicate orthogonal pairs; all1854 original non-all-even radius6 vectors checked. Independent4096-tuple modulo4 filter and symbolic7x6 rank/nullspace/augmented-rank checks. Fixed4096-bit boundaries, repeated default CLI20872 count, scoped patches/captures and30-second subprocess timeout.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T13:09:14.576288+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-checker.md\",\n      \"sha256\": \"96449f9955e8abfbd04f19eecd9803acd41ba6943c6daea1698a328fdc40a100\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-closure-inputs.json\",\n      \"sha256\": \"e3c0a853ba4a09512cdf11d35b3ccaafd2fb6267de25cdd16eb70532959bfba0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-initial-manifest.json\",\n      \"sha256\": \"17353c02345159ac8560da95635236c832100c5bdfa08df96f6d56206b3b30cc\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-initial-review.json\",\n      \"sha256\": \"5f274d19fccf1affa8689833fad12cbbcd599886a99f96ec833bafe064d69934\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-initial-test_rational_ray_obstruction.py.txt\",\n      \"sha256\": \"7eb35e0964a3e6117b96816e7063005f57383311e35f7aa9ff887124bc531eb1\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-mutations-adjudicated.json\",\n      \"sha256\": \"6d6e494c981f35f7b66fde9446349f43523d3e5de2003bcf02ca1748742ff9c1\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-rational-rays-mutations-final.json\",\n      \"sha256\": \"c70de6ecccd3990609f2d553fe7424