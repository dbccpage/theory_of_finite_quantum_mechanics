pendent/comp-c8-minimality-fence.py\",\n      \"sha256\": \"9570416adc29d2823d9ff760a3fcb8d2be1ebb09d0765dffd381a282aa8c3ef5\",\n      \"state\": \"pre-migration audit; historical records retained\"\n    },\n    {\n      \"path\": \"checks/tests/test_computation_controls.py\",\n      \"sha256\": \"1d8b39fb1306b118a853044b9fbb10ac63e68f1328d12dfeb5856e191fa361e9\",\n      \"state\": \"current composition consumer\"\n    },\n    {\n      \"path\": \"checks/tests/test_review_repairs.py\",\n      \"sha256\": \"6bb0b7602707a2ee0c7277558cb8cb74eb6d986d2cc0ffb1be6a9df23fe0c6a4\",\n      \"state\": \"current composition consumer\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"713b8a4f4f13c3e03be46be206f44f679938650d75f12e656e4d453c7d84caf2\",\n      \"state\": \"current composition consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"Bounded graph exhaustion does not decide an unbounded rewrite language.\",\n    \"No Genesis Step3 encoding, TM0/Code.eval identification, infinite computable reduction, full R0-prime construction or minimality theorem follows.\",\n    \"No Lean rebuild, hosted CI or physical/continuum result is inferred. Shared infrastructure is a dependency, not a second independent oracle.\",\n    \"The old six executable entry paths are deliberately removed; archive mappings preserve historical references. Label 5 is a retention decision.\"\n  ],\n  \"bounded_context\": \"Finite word rewriting and literal computation controls, with independent context-graph verification and restricted integration-source lifecycle ownership.\",\n  \"consumer_boundary\": \"The six retired executable entry paths are intentionally removed and mapped to byte-preserved archives. Historical DAG/review references keep their original provenance. Current regression loads the composed application and current workflow runs its suite. Default combined receipt uses 50 executed obligations; old six receipt schemas remain historical. Public source loader remains restricted to the current named alphabetical population.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:test_computation_controls\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-checkers.md\",\n      \"sha256\": \"faf134919c3f25dcd0879bc4f6a037cab61ef0a15e3b7aeb19ef8ea5d3a50af3\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-requirements.json\",\n      \"sha256\": \"9526b1b79ecceabb5561912e4806d7bf1ba58f0b242d6cabc2bd80749036004a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-quality.json\",\n      \"sha256\": \"c41c2566df79967520aca05db04e965a29066757527dfbd0abd5b79c4dbdca4e\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-mutations.json\",\n      \"sha256\": \"bd826f2ed00e0a4444ef6828d4af45f4c4ccdb7e70c7bfa46db955216dd8625e\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-mutations-initial-manifest.json\",\n      \"sha256\": \"a604f4f63bf7bdeb3189ad03658b3dcb686480e76d6cb0d8a67037a1c479bdca\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-mutations-closure.json\",\n      \"sha256\": \"081dfa2b10ab25637bb1878350c51f1a9d584749a75cb9735a8bf631d9808fd9\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-retirement.json\",\n      \"sha256\": \"ceddeb1a02bcb05e24cc550343e386c911a3a0385eaa3ef6ad4d45d9e03e6751\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-computation-regression-migration.json\",\n      \"sha256\": \"e21734ef4f544ef056fcf176efd71633608f9089980ec7338a430247f146ee68\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ads-requirements.json\",\n      \"sha256\": \"92c085b11b41e10d4b95d7223fd1334bcd14b2f463a3c7148c9f8e616e15e501\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ads-quality.json\",\n      \"sha256\": \"8debfd31806d6ffc9134925303b88b72beffa44e60bb4aa7cb7be5a8c594a672\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ads-mutations-closure.json\",\n      \"sha256\": \"6efa8e202cc749e2a518b1463405d8518c5be2511c2cc54c5bb801bc29266ddb\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/computation_mutations.json\",\n      \"sha256\": \"abbfc14bc94fc2a5accda574488f180d3eb4b7fd9cb41117083106476c656d1c\"\n    }\n  ],\n  \"failure_policy\": \"Exact input/schema gates admit all parameters and owned snapshots before dependent use. Outcome distinguishes finite completed negative search from input/resource/check/duplicate refusal. A budget failure never certifies unreachability. Cases preserves individual failed obligations. Typed failures become nonzero CLI diagnostics; cancellation and unexpected programming errors propagate. Test imports, captures, mocks and bounded subprocesses have scoped ownership.\",\n  \"operational_cost\": \"16 test groups, 80 deterministic cases per generated property. Independent context oracle admits binary words of length <=3 (15 words), <=4 rules and finite Cartesian context enumeration. Boundary tests use <=4097 trace rows and <=4096-bit values. Context-managed mocks/captures and isolated import ownership restore resources.\",\n  \"origins\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"FiniteWordSystem owns a frozen alphabet and distinct nested rule tuples. Search state is local and parent bindings never change.\",\n    \"Words <=64 symbols; alphabet/rule counts <=32; search states/trace rows <=4096; reserved rule-offset trials <=65536.\",\n    \"Raw apply enforces global word limits; search/trace enforce max_length. Empty sides and final-position insertion are part of the relation.\",\n    \"Every current declaration has a requirements/test map; six retired origins and byte-preserved histories remain explicit.\",\n    \"50 default obligations; current integration population 20; no production assert and at most one class per source.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Independent context-based graph edges and layer fixed-point distances cross-check production scanning/BFS. Explicit oracle metatests, failure-helper metatest, boundary/snapshot cases, generated functional and receipt properties and failure/cancellation tests reject semantic and lifecycle faults.\",\n      \"requirement_id\": \"TFQM-COMPUTATION-REVIEW-TEST-COMPUTATION-CONTROLS-1\",\n      \"symbols\": [\n        \"_context_graph\",\n        \"_distances\",\n        \"ComputationControlTests\",\n        \"ComputationControlTests.refused\",\n        \"ComputationControlTests.test_refusal_helper_requires_a_failure\",\n        \"ComputationControlTests.test_graph_oracles_on_explicit_small_relations\",\n        \"ComputationControlTests.test_bounded_search_against_context_fixed_point\",\n        \"ComputationControlTests.test_one_hole_replacement_uses_exact_context\",\n        \"ComputationControlTests.test_search_and_trace_budgets_never_mean_unreachable\",\n        \"ComputationControlTests.test_shortest_route_and_no_path_exhaustion\",\n        \"ComputationControlTests.test_empty_rules_cycles_insertion_deletion_and_trace_refusal\",\n        \"ComputationControlTests.test_model_owns_immutable_snapshots\",\n        \"ComputationControlTests.test_model_schema_and_word_boundaries\",\n        \"ComputationControlTests.test_search_parameter_refusals\",\n        \"ComputationControlTests.test_constant_writer_halt_persistence_and_natural_merge\",\n        \"ComputationControlTests.test_encoding_and_blank_extension\",\n        \"ComputationControlTests.test_literal_helper_domains\",\n        \"ComputationControlTests.test_six_original_controls_and_cli\",\n        \"ComputationControlTests.test_generated_receipt_accounting\",\n        \"ComputationControlTests.test_expected_failures_cancellation_and_repeated_invocations\"\n      ],\n      \"tests\": [\n        \"ComputationControlTests.test_refusal_helper_requires_a_failure\",\n        \"ComputationControlTests.test_graph_oracles_on_explicit_small_relations\",\n        \"ComputationControlTests.test_bounded_search_against_context_fixed_point\",\n        \"ComputationControlTests.test_one_hole_replacement_uses_exact_context\",\n        \"ComputationControlTests.test_search_and_trace_budgets_never_mean_unreachable\",\n        \"ComputationControlTests.test_shortest_route_and_no_path_exhaustion\",\n        \"ComputationControlTests.test_empty_rules_cycles_insertion_deletion_and_trace_refusal\",\n        \"ComputationControlTests.test_model_owns_immutable_snapshots\",\n        \"ComputationControlTests.test_model_schema_and_word_boundaries\",\n        \"ComputationControlTests.test_search_parameter_refusals\",\n        \"ComputationControlTests.test_constant_writer_halt_persistence_and_natural_merge\",\n        \"ComputationControlTests.test_encoding_and_blank_extension\",\n        \"ComputationControlTests.test_literal_helper_domains\",\n        \"ComputationControlTests.test_six_original_controls_and_cli\",\n        \"ComputationControlTests.test_generated_receipt_accounting\",\n        \"ComputationControlTests.test_expected_failures_cancellation_and_repeated_invocations\"\n      ]\n    }\n  ],\n  \"role\": \"Independent finite-graph verification application with separately formulated context and fixed-point oracles, generated properties, resource and lifecycle challenges and six-control integration\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"ComputationControlTests\",\n    \"ComputationControlTests.refused\",\n    \"ComputationControlTests.test_bounded_search_against_context_fixed_point\",\n    \"ComputationControlTests.test_constant_writer_halt_persistence_and_natural_merge\",\n    \"ComputationControlTests.test_empty_rules_cycles_insertion_deletion_and_trace_refusal\",\n    \"ComputationControlTests.test_encoding_and_blank_extension\",\n    \"ComputationControlTests.test_expected_failures_cancellation_and_repeated_invocations\",\n    \"ComputationControlTests.test_generated_receipt_accounting\",\n    \"ComputationControlTests.test_graph_oracles_on_explicit_small_relations\",\n    \"ComputationControlTests.test_literal_helper_domains\",\n    \"ComputationControlTests.test_model_owns_immutable_snapshots\",\n    \"ComputationControlTests.test_model_schema_and_word_boundaries\",\n    \"ComputationControlTests.test_one_hole_replacement_uses_exact_context\",\n    \"ComputationControlTests.test_refusal_helper_requires_a_failure\",\n    \"ComputationControlTests.test_search_and_trace_budgets_never_mean_unreachable\",\n    \"ComputationControlTests.test_search_parameter_refusals\",\n    \"ComputationControlTests.test_shortest_route_and_no_path_exhaustion\",\n    \"ComputationControlTests.test_six_original_controls_and_cli\",\n    \"_context_graph\",\n    \"_distances\"\n  ]\n}\n",
