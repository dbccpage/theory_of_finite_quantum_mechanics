      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/tests/test_positive_form_controls.py\",\n    \"sha256\": \"57f42e2e0f226319c34828b16b84eebeee3842190a3ee4c5e3e4606e02eba73b\"\n  },\n  \"assessment_id\": \"selection-composition-2026-11-05\",\n  \"basis\": {\n    \"G1\": \"Full Lean origin and current consumers audited; every declaration and nested ownership maps bidirectionally to tested requirements, with finite claim ceiling. All11old guard conditions map to named composed controls. The old selection script and companion are archived, and its live references are retargeted.\",\n    \"G2\": \"All prior symbolic Gram/incidence and normalization oracles retained. Added exact symbolic mass normalization, symbolic scaled rotations and independent complex multiplication; fixed signed linear shares, distinct quadratic/quartic shares and asymmetric rotation orientations. Zero totals, all exact domains and full budgets exercised. The1,2 and1,1 amplitudes are independently checked using symbolic power normalization. All prior declarations and mathematical domains remain intact.\",\n    \"G3\": \"Owned finite snapshots, explicit selected exponents and eager preflight before arithmetic; powered masses, total prefixes and rotation term/prefix limits refuse even when cancellation or normalization would fit. Public new queries return Outcome. Existing typed failures, per-run counters, nonzero exits and cancellation/programming-error propagation remain. The new verifier checks Cases admission and propagates cancellation. Per-run counters now record the11added controls.\",\n    \"G4\": \"Strict typing and21composed test groups plus24prior integration groups pass normally and optimized. The77fault campaign kills75and retains two previously proven equivalents. All12new composition/guard-removal faults are killed. Original raw outcomes, equivalence arguments and AST preservation evidence are retained.\",\n