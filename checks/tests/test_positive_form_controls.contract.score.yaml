ated property, M,N1..4, small integer features/vectors and scale0..5. Symbolic exact Gram/selector matrices independently verify bilinear, normalized event/trace and coarse values. Fixed16x16 identity tests full dimensions. Resource witnesses use4096/4097-bit terms/prefixes and denominator squares; executable timeout30s with scoped runpy/mocks/captures/subprocess. Six added groups include80 deterministic samples each for mass arrays1..16 with coefficients-8..8/exponent1,2,4 and rotation pairs-20..20. Fixed signed/zero-total/domain/4096-bit and16-entry boundaries; independent exact symbolic matrix and complex-product calculations. All14 prior groups retained except expanded CLI receipt.\",\n  \"origins\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"All prior owned Gram-form, bilinear/quadratic/event/partition and normalization invariants remain unchanged.\",\n    \"Mass normalization accepts1..16 exact bounded integer amplitudes and an explicit exact exponent from1,2,4; empty carrier, bool/float/Fraction aliases, unsupported exponent and zero total refuse.\",\n    \"Linear shares are algebraic and may be signed or have negative total; exact Fraction values sum1 without selecting an exponent or a probability interpretation.\",\n    \"Scaled rotation owns two exact integer pairs, admits both before arithmetic and computes the actual matrix [[r,-s],[s,r]] without a unit-norm assumption.\",\n    \"Every powered mass and accumulated sum, rotation product/prefix and input is at most4096 bits; cancellation or a later zero cannot excuse a prior budget failure.\",\n    \"All4017 prior positivity/decoherence checks remain separately counted;2533 Born-boundary checks add the121 pair and2401 rotation cases plus11 explicit separation/normalization witnesses, for6550 total.\",\n    \"Prior source/test/contract histories and mutation manifest are preserved; the original Born source is byte-archived and its two historical references remain mapped.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Retain every previous Gram/incidence, ownership, normalization, resource, admission and lifecycle obligation. Add independent symbolic normalized masses, scaled matrix and complex-product rotation oracles; fixed signed shares and asymmetric orientations; exact type/length/exponent/zero-total refusals; full output and intermediate arithmetic budgets; preflight mocks; reentrant section counts and exception propagation.\",\n      \"requirement_id\": \"TFQM-BORN-CONTROLS-REVIEW-TEST-POSITIVE-FORM-CONTROLS-1\",\n      \"symbols\": [\n        \"load\",\n        \"_rows\",\n        \"_partition\",\n        \"_selector\",\n        \"PositiveFormTests\",\n        \"PositiveFormTests.refused\",\n        \"PositiveFormTests.test_oracles_and_import_lifecycle\",\n        \"PositiveFormTests.test_gram_bilinear_quadratic_and_normalized_weights\",\n        \"PositiveFormTests.test_coarse_graining_against_incidence_matrix\",\n        \"PositiveFormTests.test_fixed_nondiagonal_and_multifeature_examples\",\n        \"PositiveFormTests.test_distinct_normalization_witnesses\",\n        \"PositiveFormTests.test_input_shapes_scalars_and_full_budgets\",\n        \"PositiveFormTests.test_vectors_events_and_denominator_refusals\",\n        \"PositiveFormTests.test_partition_refusals_and_canonical_group_order\",\n        \"PositiveFormTests.test_snapshot_ownership\",\n        \"PositiveFormTests.test_resource_boundaries_and_later_cancellation\",\n        \"PositiveFormTests.test_admission_precedes_dependent_arithmetic\",\n        \"PositiveFormTests.test_negative_pairing_and_nonnegative_products\",\n        \"PositiveFormTests.test_counts_faults_and_programming_error_lifecycle\",\n        \"PositiveFormTests.test_executable_receipt_and_failure_exit\",\n        \"PositiveFormTests.test_power_shares_against_symbolic_normalization\",\n 