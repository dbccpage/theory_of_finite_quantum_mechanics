      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/tests/test_temporal_cycles.py\",\n    \"sha256\": \"e9ff41886d14cd38e4a10ef1d14c5332c7c8529b50497de6cf4b4d329a295b11\"\n  },\n  \"assessment_id\": \"temporal-cycle-2026-11-05\",\n  \"basis\": {\n    \"G1\": \"Full original source and Lean module read; byte custody and historical contracts preserved; declaration/requirement/test mapping and consumer audit. Exact fields and imported physical assumptions remain explicit.\",\n    \"G2\": \"Independent symbolic scalar/matrix/block, full 6x6 boundary and root-sum oracles; generated and deterministic complex-phase, pivot, SU(3), zero-mass and real-fugacity cases. Exact syntax, type, shape and arithmetic domains enforced.\",\n    \"G3\": \"No untrusted text evaluation or conversion hooks; preflight, owned immutable state, bounded intermediates, detached exports, typed refusals and fresh counters. RuntimeError and cancellation propagate; expected CLI refusals are nonzero.\",\n    \"G4\": \"Strict typing; 25 new and 24 existing integration groups pass normally and optimized. All 86 final critical faults killed against final source hashes. Earlier timeouts remain inconclusive and are replayed with fixed witnesses; initial failures remain recorded.\",\n    \"G5\": \"CCN 7, cognitive 5, nesting 3; at most one class per file. Expression preflight has at most 64 nodes and depth 8, with exponent magnitude at most 16. Matrix dimensions are 1..18; products/determinants use O(n^3) completed Gaussian operations and O(n^2) workspace. Stored Gaussian components are 4096-bit rationals; raw native Gaussian arithmetic can use up to 20481-bit components before reduction/admission. Cycles have at most six three-color sites. Laurent state has seven coefficients; convolution has at most 49 products, boundary construction six permutations, and evaluation seven operations over the fixed degree-four exact field using 21 fixed phases. Normal field coordinates are admitted at 4096 bits; trusted SymPy arithmetic has its own temporary representation. The fixed application has 27 cases and 140 controls. CLI/selected-fault subprocesses have 30-second timeouts and full mutation baselines 180 seconds.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-05T06:53:30.423881+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-before-direct-embedding-quality.json\",\n      \"sha256\": \"fbb9426eca9d00871f56846d29e18b2dac73dab4b4629d6712edd10f36576265\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-before-direct-embedding.py.txt\",\n      \"sha256\": \"21133c34552e456d5109d4cf267da2f2e986b3deaed8d089df8fddac58e6acd8\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-before-fixed-fault-witnesses-quality.json\",\n      \"sha256\": \"19e3738112b84a8138bb593e79236be4ba3e94fc8f512290a4a88ad4383bce80\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-before-fixed-fault-witnesses.py.txt\",\n      \"sha256\": \"f817bb82681f6966ec0efe062e39d543a53ae0dbaf61fdb0d0db8bd182b8c67c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-before-fixed-hopping-test.py.txt\",\n      \"sha256\": \"f60a44d3753c2de3981303cbe9550daa1f047173efe080f0c946ef9e42bf332b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-center-before-phase-cache.py.txt\",\n      \"sha256\": \"f0ad3df7d8194ea7ba602f2e532812988b487abffee8dd7c0e9b0386e4c0ca48\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-center-normalization-failure.py.txt\",\n      \"sha256\": \"732c62dd725386c18a1ae1240e6eb95265d3f6c5d415a9ab3c1e24ba05db3c77\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-tempor