ecks/tests/temporal_cycle_mutations.json\",\n      \"sha256\": \"2b491b2b30576146868e81b11abc9920b252a7cec13eeafa5f52309f0f7d0571\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"lean4/FermionSignImaginaryMuRealDet.lean\",\n      \"sha256\": \"fa5f4b2f76560be37d6fccff11842fa7edf1504c4488dd8b1bb2b7d09267504c\"\n    }\n  ],\n  \"failure_policy\": \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\",\n  \"operational_cost\": \"Expression preflight has at most 64 nodes and depth 8, with exponent magnitude at most 16. Matrix dimensions are 1..18; products/determinants use O(n^3) completed Gaussian operations and O(n^2) workspace. Stored Gaussian components are 4096-bit rationals; raw native Gaussian arithmetic can use up to 20481-bit components before reduction/admission. Cycles have at most six three-color sites. Laurent state has seven coefficients; convolution has at most 49 products, boundary construction six permutations, and evaluation seven operations over the fixed degree-four exact field using 21 fixed phases. Normal field coordinates are admitted at 4096 bits; trusted SymPy arithmetic has its own temporary representation. The fixed application has 27 cases and 140 controls. CLI/selected-fault subprocesses have 30-second timeouts and full mutation baselines 180 seconds.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/FermionSignImaginaryMuRealDet.lean\",\n      \"sha256\": \"fa5f4b2f76560be37d6fccff11842fa7edf1504c4488dd8b1bb2b7d09267504c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-original-fsp-imaginary-mu-real-det.py.txt\",\n      \"sha256\": \"ac19770608212101081358398a29af59f440a541d91f29fe233e5eaf62c2d81d\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Decode native int/Fraction/GaussianRational or trusted exact SymPy rational/I expressions with Add, Mul and integer powers. Reject text, bytes, floats, bool, foreign conversion hooks, symbols and unadmitted functions before evaluation. Preflight at most 64 nodes, depth 8 and powers -16..16; prescreen rational components before Fraction construction.\",\n    \"Own immutable Gaussian rows with dimensions 1..18, complete shape preflight before scalar admission, exact addition/scaling/adjoint/products and row-pivoted determinants. Preserve swap signs, complex phases and singular zero. Public determinant queries return Outcome; internal value operations raise typed Violation.\",\n    \"Own an immutable tuple of 2, 4 or 6 three-color SU(3) links, with all link admissions before unitary arithmetic. Cache antiperiodic forward transport. Real mass and nonzero Q(i) fugacity define mI+(zT-T*/z)/2. Preserve legacy SymPy exports and provide typed native-matrix queries; nonunit fugacity remains available for explicit counterexamples.\",\n    \"Own seven Q(i) Laurent coefficients ordered by degrees -3..3. Bound convolution degrees and arithmetic. Evaluate at the three declared C3 roots in Q(i,sqrt(3)) using direct rational/imaginary-basis embedding and a fixed 21-element phase table. The unnormalized orbit sum retains multiples of three with factor three. Derive the boundary determinant from the checked SU(3) link through the 3x3 Schur expression and six signed permutations.\",\n    \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n    \"Preserve gaussian, TemporalCycle transport/dirac/links, matrix equality, rejection probes and exact original CLI fields/results. Guard conditions accept native bool or exact SymPy true/false; arbitrary truthy objects refuse. Rejection probes execute a callable and require an input/resource refusal. Mutable matrix comparisons are snapshotted only after shape admission.\",\n    \"Own the three fixed temporal cycles and boundary. Preserve the original 27 lattice cases, rational determinant examples, Schur checks, gamma-only negative witness, zero-mass and real-fugacity witnesses, center sum 345/32 and nine rejection names. Add independent native determinant and center comparisons. Report 140 actual per-run Cases guard calls separately from the 27 lattice cases, preserving byte-identical CLI output.\",\n    \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\"\n  ],\n  \"requirements\": {\n    \"adapters\": {\n      \"requirement\": \"Preserve gaussian, TemporalCycle transport/dirac/links, matrix equality, rejection probes and exact original CLI fields/results. Guard conditions accept native bool or exact SymPy true/false; arbitrary truthy objects refuse. Rejection probes execute a callable and require an input/resource refusal. Mutable matrix comparisons are snapshotted only after shape admission.\",\n      \"tests\": [\n        \"test_text_and_foreign_hooks_are_never_executed\",\n        \"test_cycle_transport_and_dirac_against_block_oracle\",\n        \"test_legacy_booleans_matrix_comparison_and_rejection_adapters\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"budgets\": {\n      \"requirement\": \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n      \"tests\": [\n        \"test_node_depth_power_and_component_budgets\",\n        \"test_shape_preflight_before_expression_evaluation\",\n        \"test_gaussian_matrix_shape_domain_preflight\",\n        \"test_gaussian_matrix_intermediate_budget_cancellation\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_legacy_booleans_matrix_comparison_and_rejection_adapters\"\n      ]\n    },\n    \"center\": {\n      \"requirement\": \"Own seven Q(i) Laurent coefficients ordered by degrees -3..3. Bound convolution degrees and arithmetic. Evaluate at the three declared C3 roots in Q(i,sqrt(3)) using direct rational/imaginary-basis embedding and a fixed 21-element phase table. The unnormalized orbit sum retains multiples of three with factor three. Derive the boundary determinant from the checked SU(3) link through the 3x3 Schur expression and six signed permutations.\",\n      \"tests\": [\n        \"test_center_projection_and_values_against_root_sum\",\n        \"test_boundary_polynomial_against_full_six_by_six_determinant\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_center_basis_phases_and_convolution\"\n      ]\n    },\n    \"certificate\": {\n      \"requirement\": \"Own the three fixed temporal cycles and boundary. Preserve the original 27 lattice cases, rational determinant examples, Schur checks, gamma-only negative witness, zero-mass and real-fugacity witnesses, center sum 345/32 and nine rejection names. Add independent native determinant and center comparisons. Report 140 actual per-run Cases guard calls separately from the 27 lattice cases, preserving byte-identical CLI output.\",\n      \"tests\": [\n        \"test_application_original_payload_and_live_case_counter\",\n        \"test_application_failure_translation_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"cycle\": {\n      \"requirement\": \"Own an immutable tuple of 2, 4 or 6 three-color SU(3) links, with all link admissions before unitary arithmetic. Cache antiperiodic forward transport. Real mass and nonzero Q(i) fugacity define mI+(zT-T*/z)/2. Preserve legacy SymPy exports and provide typed native-matrix queries; nonunit fugacity remains available for explicit counterexamples.\",\n      \"tests\": [\n        \"test_cycle_transport_and_dirac_against_block_oracle\",\n        \"test_cycle_input_domains_preflight_and_immutable_state\",\n        \"test_fixed_cycle_hopping_scale_and_activity\",\n        \"test_application_original_payload_and_live_case_counter\"\n      ]\n    },\n    \"lifecycle\": {\n      \"requirement\": \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\",\n      \"tests\": [\n        \"test_owned_values_reentrancy_and_refusal_helper\",\n        \"test_unexpected_failures_and_cancellation_propagate\",\n        \"test_gaussian_matrix_boundaries_and_ownership\",\n        \"test_cycle_input_domains_preflight_and_immutable_state\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_application_original_payload_and_live_case_counter\",\n        \"test_application_failure_translation_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"matrix\": {\n      \"requirement\": \"Own immutable Gaussian rows with dimensions 1..18, complete shape preflight before scalar admission, exact addition/scaling/adjoint/products and row-pivoted determinants. Preserve swap signs, complex phases and singular zero. Public determinant queries return Outcome; internal value operations raise typed Violation.\",\n      \"tests\": [\n        \"test_gaussian_matrix_determinant_and_adjoint\",\n        \"test_gaussian_matrix_products_and_scaling\",\n        \"test_gaussian_matrix_shape_domain_preflight\",\n        \"test_gaussian_matrix_boundaries_and_ownership\",\n        \"test_gaussian_matrix_intermediate_budget_cancellation\",\n        \"test_gaussian_matrix_pivots_and_complex_phase\"\n      ]\n    },\n    \"scalar\": {\n      \"requirement\": \"Decode native int/Fraction/GaussianRational or trusted exact SymPy rational/I expressions with Add, Mul and integer powers. Reject text, bytes, floats, bool, foreign conversion hooks, symbols and unadmitted functions before evaluation. Preflight at most 64 nodes, depth 8 and powers -16..16; prescreen rational components before Fraction construction.\",\n      \"tests\": [\n        \"test_native_and_symbolic_exact_atoms\",\n        \"test_text_and_foreign_hooks_are_never_executed\",\n        \"test_expression_arithmetic_against_symbolic_oracle\",\n        \"test_grammar_refusals_and_zero_negative_power\",\n        \"test_shape_preflight_before_expression_evaluation\",\n        \"test_node_depth_power_and_component_budgets\"\n      ]\n    }\n  },\n  \"role\": \"Independent symbolic/block/Bareiss/root-sum oracles with generated, exact-witness and lifecycle challenges.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": {\n    \"TemporalCycleTests\": [\n      \"lifecycle\"\n    ],\n    \"TemporalCycleTests.accepted\": [\n  