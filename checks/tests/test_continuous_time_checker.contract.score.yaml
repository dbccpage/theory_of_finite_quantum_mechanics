s, all small/final powers, generated0..4096 exponents against symbolic matrices and a four-state map cycle, exact negative/bool/resource refusals, preflight before any multiplication and injected section faults. Executable timeout30s and scoped runpy/mocks/captures/subprocess.\",\n  \"origins\": [\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"All previously assessed finite-map, Gaussian pair/matrix, polynomial/energy and nilpotent invariants remain, including same-carrier composition and bounded exhaustive roots.\",\n    \"Natural quarter-turn exponents are exact integers0..4096; bool/negative values refuse before dependent multiplication and larger values are resource failures.\",\n    \"Flat integer2x2 inputs are admitted and owned before shared RationalMatrix products; outputs are exact integer tuples with shape/integrality checked.\",\n    \"Quarter-turn powers use actual binary matrix multiplication independent of REPS; at most13 iterations/25 products per power.\",\n    \"All355 original root/branch checks and257 residue checks remain separately counted, for612 total; imports remain silent and state per invocation.\",\n    \"Every previous source/test/contract history and old mutation manifest remains intact; the residue-only source is byte-archived with historical-reference mapping.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Cross-check distinct row/column orientation and symbolic operator powers; exhaust every small root target and assert two4-state boundary witnesses. Compare generated map composition/action/iteration and Gaussian arithmetic independently, normalize both scaled square roots and check unitarity, derive Cayley norm via rational complex phase, invert the odd-branch parametrization and check the forced nilpotent candidate by actual matrix products. Test full resource/exact-input domains, snapshots, eager preflight, import silence, per-run counts and failure/cancellation exits.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-TEST-CONTINUOUS-TIME-CHECKER-1\",\n      \"symbols\": [\n        \"load\",\n        \"_operator\",\n        \"_matrix\",\n        \"_root_index\",\n        \"ContinuousTimeCheckerTests\",\n        \"ContinuousTimeCheckerTests.refused\",\n        \"ContinuousTimeCheckerTests.test_oracles_and_pure_import\",\n        \"ContinuousTimeCheckerTests.test_complete_small_root_censuses_and_four_state_witness\",\n        \"ContinuousTimeCheckerTests.test_composition_refuses_carrier_loss\",\n        \"ContinuousTimeCheckerTests.test_generated_composition_action_and_power\",\n        \"ContinuousTimeCheckerTests.test_finite_map_ownership_domains_and_full_power_budget\",\n        \"ContinuousTimeCheckerTests.test_gaussian_products_against_symbolic_oracle\",\n        \"ContinuousTimeCheckerTests.test_scaled_roots_are_distinct_unitary_half_steps\",\n        \"ContinuousTimeCheckerTests.test_exact_gaussian_domains_and_preflight\",\n        \"ContinuousTimeCheckerTests.test_cayley_and_odd_branch_oracles\",\n        \"ContinuousTimeCheckerTests.test_integer_domains_and_polynomial_resource_boundaries\",\n        \"ContinuousTimeCheckerTests.test_nilpotent_forced_candidate_against_matrix_oracle\",\n        \"ContinuousTimeCheckerTests.test_reentrant_counts_faults_and_cancellation\",\n        \"ContinuousTimeCheckerTests.test_integer_matrix_product_against_symbolic_oracle\",\n        \"ContinuousTimeCheckerTests.test_quarter_turn_powers_against_matrix_and_cycle\",\n        \"ContinuousTimeCheckerTests.test_fixed_nonsymmetric_integer_products_and_snapshots\",\n        \"ContinuousTimeCheckerTests.test_residue_exact_domains_and_resource_limits\",\n        \"ContinuousTimeCheckerTests.test_residue_preflight_before_multiplication\",\n        \"ContinuousTimeCheckerTests.test_residue_control_counts_and_injected_fault\",\n        \"ContinuousTimeChecke