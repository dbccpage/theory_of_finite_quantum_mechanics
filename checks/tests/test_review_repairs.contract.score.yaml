,\n  \"owned_invariants\": [\n    \"FiniteWordSystem owns a frozen alphabet and distinct nested rule tuples. Search state is local and parent bindings never change.\",\n    \"Words <=64 symbols; alphabet/rule counts <=32; search states/trace rows <=4096; reserved rule-offset trials <=65536.\",\n    \"Raw apply enforces global word limits; search/trace enforce max_length. Empty sides and final-position insertion are part of the relation.\",\n    \"Every current declaration has a requirements/test map; six retired origins and byte-preserved histories remain explicit.\",\n    \"50 default obligations; current integration population 20; no production assert and at most one class per source.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Load only reviewed local sources, restore sys.modules during success/errors/cancellation and preserve results while capturing output.\",\n      \"requirement_id\": \"TFQM-ADS-REVIEW-TEST-REVIEW-REPAIRS-1\",\n      \"symbols\": [\n        \"load\",\n        \"silent\"\n      ],\n      \"tests\": [\n        \"AdsCheckerTests.test_loader_restores_modules_on_success_failure_and_cancellation\",\n        \"AdsCheckerTests.test_silent_preserves_result_and_propagates_error\"\n      ]\n    },\n    {\n      \"requirement\": \"Independent collision oracle rejects coincidence and sign-crossing for simultaneous integer hops in the enumerated fixtures.\",\n      \"requirement_id\": \"TFQM-ADS-REVIEW-TEST-REVIEW-REPAIRS-2\",\n      \"symbols\": [\n        \"_collision_free\"\n      ],\n      \"tests\": [\n        \"ReviewedCheckerRegressionTests.test_lineon_8200_paths_against_collision_oracle\"\n      ]\n    },\n    {\n      \"requirement\": \"Provide one unittest suite with explicit failure helpers, independent arithmetic/finite enumerations, negative-path refusals and isolated CLI integration. Individual method names state each tested requirement; successful outcomes are never treated as typed refusals.\",\n      \"requirement_id\": 