/repository_file_review/2026-11-05-hubbard-original-fsp-hubbard-protected-representations.py.txt\",\n      \"sha256\": \"3f54d7bb5f8495a9732a4faa6ec799f9cfc73be699af0da3aa3be2b83ee55916\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-pre-admission-adapter.py.txt\",\n      \"sha256\": \"2880ade03fce273dd0b7dea2be1b2deb144cb1ed473d92877fd3cfc56dcbe60c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-pre-admission-quality.json\",\n      \"sha256\": \"1feb918c21eb53af9b0ba3d65b8ae839803d751265ae7ddb221e3be289ccb48f\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-pre-difference-quality.json\",\n      \"sha256\": \"92e4dfc66b6bf846d7dccb1ffd634318d50f5213760f55c27a78ac2ea3b9e3d8\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-pre-difference-tests.py.txt\",\n      \"sha256\": \"3e05fb625c36ea177452d5b114b0dace20d1ffa34a3147bd04a5e68df2824d6c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-quality.json\",\n      \"sha256\": \"78b11c0351eb45326a1e8ce5c8664ad54c00462123822f6b91ccd3da26b22fe3\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-requirements.json\",\n      \"sha256\": \"2a79cfc7ebfe03d3884cf478bd1bdcfc08b5beb07fec95eba289b4641856af33\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-review.md\",\n      \"sha256\": \"5c2fdb8d23e878f95606b00cef230b8836e16f670f5df77054dc56a906753c74\"\n    },\n    {\n      \"path\": \"checks/tests/hubbard_transfer_mutations.json\",\n      \"sha256\": \"7faaecf9c8a73d26791c6deaa7306575ce064995ee1bdc8203cc1de3623c63e7\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"lean4/FermionSignHubbardProtected.lean\",\n      \"sha256\": \"365483617d0e2261ff3450ab9e5a891e0c51a8bc2ee69bfecbb702d00544f2e9\"\n    }\n  ],\n  \"failure_policy\": \"Own immutable graphs, parameters, models and results; keep counters fresh, imports quiet and mutable exports detached. Expected input, duplicate, check and resource failures are typed. RuntimeError, KeyboardInterrupt and SystemExit propagate. CLI refusal returns nonzero and guards remain active under optimized Python.\",\n  \"operational_cost\": \"Graph has at most four sites and six edges. Kinetic construction uses at most 12 products of 4x4 matrices. A field has at most four time slices. Determinant accepts owned square dimensions 1..64, O(n^3) rational operations and O(n^2) workspace. All normalized rational components and named intermediates have at most 4096 bits. Raw binary rational products/divisions use at most 8192-bit components and addition/subtraction at most 8193-bit numerators before reduction/admission. The fixed application checks 320 fields and three witness/comparison fields. Each generated property has 60 deterministic examples; CLI/mutation subprocesses have 30-second timeouts.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/FermionSignHubbardProtected.lean\",\n      \"sha256\": \"365483617d0e2261ff3450ab9e5a891e0c51a8bc2ee69bfecbb702d00544f2e9\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-hubbard-original-fsp-hubbard-protected-representations.py.txt\",\n      \"sha256\": \"3f54d7bb5f8495a9732a4faa6ec799f9cfc73be699af0da3aa3be2b83ee55916\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Own 1..4 native integer sites and at most six simple undirected bonds, snapshot and normalize endpoints lexically, refuse duplicate edges and invalid shapes/domains before transfer arithmetic.\",\n    \"Own an admitted graph, 1..4 native integer slices, positive native integer/Fraction r, h, fugacity, and a bool channel. Cache the lexical forward/reverse kinetic product. Decode time-major masks of exactly sites*slices bits, accumulate spin propagators and return det(I+P) for each spin with the channel's field prefactor.\",\n    \"Accept an owned square RationalMatrix, dimension 1..64, and use row-pivoted exact elimination with swap signs and singular result zero. Preserve the input matrix. Public determinant queries return Outcome and admit every pivot product, factor, elimination product and difference under the rational budget.\",\n    \"Own rational up/down determinants, strictly positive prefactor and native integer field sum -16..16. Derive the weight from admitted products; callers cannot supply a contradictory weight. This is a value carrier; its constructor alone does not certify transfer-matrix provenance.\",\n    \"Stored rational components, each matrix dot term/prefix, scalar product/power and determinant elimination intermediate have at most 4096 bits per normalized numerator/denominator. Check terms and prefixes before later cancellation. Reject malformed masks before matrix allocation. Prescreen symbolic rational components before Fraction division.\",\n    \"Preserve the legacy validate_bonds, kinetic_matrix and compute_hubbard_determinants names and admitted list/SymPy result representations. Exact SymPy Integer/Rational scalars are admitted with component budgets; floats, bool, strings and irrational expressions are refused. Legacy helpers raise Violation on expected refusals, modern queries return Outcome.\",\n    \"Preserve every original fixture guard and stdout: 64 attractive triangle fields, 256 half-filled ring fields, doped ring 15721, frustrated triangle 1281, the ring half-filling comparison, exact determinant/weight fractions and denominator powers. Count 659 actual default guards from the live per-run Cases aggregate.\",\n    \"Own immutable graphs, parameters, models and results; keep counters fresh, imports quiet and mutable exports detached. Expected input, duplicate, check and resource failures are typed. RuntimeError, KeyboardInterrupt and SystemExit propagate. CLI refusal returns nonzero and guards remain active under optimized Python.\"\n  ],\n  \"requirements\": {\n    \"adapters\": {\n      \"requirement\": \"Preserve the legacy validate_bonds, kinetic_matrix and compute_hubbard_determinants names and admitted list/SymPy result representations. Exact SymPy Integer/Rational scalars are admitted with component budgets; floats, bool, strings and irrational expressions are refused. Legacy helpers raise Violation on expected refusals, modern queries return Outcome.\",\n      \"tests\": [\n        \"test_legacy_exact_adapters\",\n        \"test_empty_bonds_order_reversal_and_detached_queries\"\n      ]\n    },\n    \"budgets\": {\n      \"requirement\": \"Stored rational components, each matrix dot term/prefix, scalar product/power and determinant elimination intermediate have at most 4096 bits per normalized numerator/denominator. Check terms and prefixes before later cancellation. Reject malformed masks before matrix allocation. Prescreen symbolic rational components before Fraction division.\",\n      \"tests\": [\n        \"test_determinant_pivots_shape_and_resource_paths\",\n        \"test_result_invariants_and_power_budgets\",\n        \"test_model_domains_and_field_mask_preflight\",\n        \"test_model_preflight_and_refusal_helper_strength\",\n        \"test_legacy_exact_adapters\"\n      ]\n    },\n    \"certificate\": {\n      \"requirement\": \"Preserve every original fixture guard and stdout: 64 attractive triangle fields, 256 half-filled ring fields, doped ring 15721, frustrated triangle 1281, the ring half-filling comparison, exact determinant/weight fractions and denominator powers. Count 659 actual default guards from the live per-run Cases aggregate.\",\n      \"tests\": [\n        \"test_all_original_protected_fields_and_witnesses\",\n        \"test_original_guards_actual_counters_and_repeatability\",\n        \"test_check_failures_typed_resources_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"determinant\": {\n      \"requirement\": \"Accept an owned square RationalMatrix, dimension 1..64, and use row-pivoted exact elimination with swap signs and singular result zero. Preserve the input matrix. Public determinant queries return Outcome and admit every pivot product, factor, elimination product and difference under the rational budget.\",\n      \"tests\": [\n        \"test_determinant_against_bareiss\",\n        \"test_determinant_pivots_shape_and_resource_paths\"\n      ]\n    },\n    \"graph\": {\n      \"requirement\": \"Own 1..4 native integer sites and at most six simple undirected bonds, snapshot and normalize endpoints lexically, refuse duplicate edges and invalid shapes/domains before transfer arithmetic.\",\n      \"tests\": [\n        \"test_graph_domains_normalization_and_ownership\",\n        \"test_model_preflight_and_refusal_helper_strength\",\n        \"test_empty_bonds_order_reversal_and_detached_queries\"\n      ]\n    },\n    \"lifecycle\": {\n      \"requirement\": \"Own immutable graphs, parameters, models and results; keep counters fresh, imports quiet and mutable exports detached. Expected input, duplicate, check and resource failures are typed. RuntimeError, KeyboardInterrupt and SystemExit propagate. CLI refusal returns nonzero and guards remain active under optimized Python.\",\n      \"tests\": [\n        \"test_graph_domains_normalization_and_ownership\",\n        \"test_empty_bonds_order_reversal_and_detached_queries\",\n        \"test_result_invariants_and_power_budgets\",\n        \"test_original_guards_actual_counters_and_repeatability\",\n        \"test_check_failures_typed_resources_and_cancellation\",\n        \"test_quiet_import_and_original_cli\",\n        \"test_model_preflight_and_refusal_helper_strength\"\n      ]\n    },\n    \"result\": {\n      \"requirement\": \"Own rational up/down determinants, strictly positive prefactor and native integer field sum -16..16. Derive the weight from admitted products; callers cannot supply a contradictory weight. This is a value carrier; its constructor alone does not certify transfer-matrix provenance.\",\n      \"tests\": [\n        \"test_result_invariants_and_power_budgets\",\n        \"test_all_original_protected_fields_and_witnesses\",\n        \"test_generated_fields_against_independent_symbolic_model\"\n      ]\n    },\n    \"transfer\": {\n      \"requirement\": \"Own an admitted graph, 1..4 native integer slices, positive native integer/Fraction r, h, fugacity, and a bool channel. Cache the lexical forward/reverse kinetic product. Decode time-major masks of exactly sites*slices bits, accumulate spin propagators and return det(I+P) for each spin with the channel's field prefactor.\",\n      \"tests\": [\n        \"test_generated_fields_against_independent_symbolic_model\",\n        \"test_all_original_protected_fields_and_witnesses\",\n        \"test_model_domains_and_field_mask_preflight\",\n        \"test_empty_bonds_order_reversal_and_detached_queries\"\n      ]\n    }\n  },\n  \"role\": \"Independent symbolic transfer/Bareiss oracles with generated, complete-fixture and lifecycle challenges.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": {\n    \"HubbardTransferTests\": [\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.accepted\": [\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.check_field\": [\n      \"transfer\",\n      \"determinant\",\n      \"result\"\n    ],\n    \"HubbardTransferTests.refused\": [\n      \"graph\",\n      \"budgets\",\n      \"adapters\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_all_original_protected_fields_and_witnesses\": [\n      \"transfer\",\n      \"result\",\n      \"certificate\"\n    ],\n    \"HubbardTransferTests.test_check_failures_typed_resources_and_cancellation\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_determinant_against_bareiss\": [\n      \"determinant\"\n    ],\n    \"HubbardTransferTests.test_determinant_pivots_shape_and_resource_paths\": [\n      \"determinant\",\n      \"budgets\"\n    ],\n    \"HubbardTransferTests.test_empty_bonds_order_reversal_and_detached_queries\": [\n      \"graph\",\n      \"transfer\",\n      \"adapters\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_generated_fields_against_independent_symbolic_model\": [\n      \"transfer\",\n      \"result\"\n    ],\n    \"HubbardTransferTests.test_graph_domains_normalization_and_ownership\": [\n      \"graph\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_legacy_exact_adapters\": [\n      \"budgets\",\n      \"adapters\"\n    ],\n    \"HubbardTransferTests.test_model_domains_and_field_mask_preflight\": [\n      \"transfer\",\n      \"budgets\"\n    ],\n    \"HubbardTransferTests.test_model_preflight_and_refusal_helper_strength\": [\n      \"graph\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_original_guards_actual_counters_and_repeatability\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_original_guards_actual_counters_and_repeatability.record\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_quiet_import_and_original_cli\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_result_invariants_and_power_budgets\": [\n      \"result\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"exact\": [\n      \"transfer\",\n      \"determinant\",\n      \"result\"\n    ],\n    \"kinetic_oracle\": [\n      \"transfer\",\n      \"determinant\",\n      \"result\"\n    ],\n    \"load\": [\n      \"lifecycle\"\n    ],\n    \"oracle\": [\n      \"transfer\",\n      \"determinant\",\n      \"result\"\n    ]\n  }\n}\n",
