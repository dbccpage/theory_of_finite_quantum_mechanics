    "owned_invariants": [
      "Own 1..4 native integer sites and at most six simple undirected bonds, snapshot and normalize endpoints lexically, refuse duplicate edges and invalid shapes/domains before transfer arithmetic.",
      "Own an admitted graph, 1..4 native integer slices, positive native integer/Fraction r, h, fugacity, and a bool channel. Cache the lexical forward/reverse kinetic product. Decode time-major masks of exactly sites*slices bits, accumulate spin propagators and return det(I+P) for each spin with the channel's field prefactor.",
      "Accept an owned square RationalMatrix, dimension 1..64, and use row-pivoted exact elimination with swap signs and singular result zero. Preserve the input matrix. Public determinant queries return Outcome and admit every pivot product, factor, elimination product and difference under the rational budget.",
      "Own rational up/down determinants, strictly positive prefactor and native integer field sum -16..16. Derive the weight from admitted products; callers cannot supply a contradictory weight. This is a value carrier; its constructor alone does not certify transfer-matrix provenance.",
      "Stored rational components, each matrix dot term/prefix, scalar product/power and determinant elimination intermediate have at most 4096 bits per normalized numerator/denominator. Check terms and prefixes before later cancellation. Reject malformed masks before matrix allocation. Prescreen symbolic rational components before Fraction division.",
      "Preserve the legacy validate_bonds, kinetic_matrix and compute_hubbard_determinants names and admitted list/SymPy result representations. Exact SymPy Integer/Rational scalars are admitted with component budgets; floats, bool, strings and irrational expressions are refused. Legacy helpers raise Violation on expected refusals, modern queries return Outcome.",
      "Preserve every original fixture guard and stdout: 64 attractive triangle fields, 256 half-filled ring fields, doped ring 15721, frustrated triangle 1281, the ring half-filling comparison, exact determinant/weight fractions and denominator powers. Count 659 actual default guards from the live per-run Cases aggregate.",
      "Own immutable graphs, parameters, models and results; keep counters fresh, imports quiet and mutable exports detached. Expected input, duplicate, check and resource failures are typed. RuntimeError, KeyboardInterrupt and SystemExit propagate. CLI refusal returns nonzero and guards remain active under optimized Python."
