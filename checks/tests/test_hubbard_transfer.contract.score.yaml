; callers cannot supply a contradictory weight. This is a value carrier; its constructor alone does not certify transfer-matrix provenance.\",\n      \"tests\": [\n        \"test_result_invariants_and_power_budgets\",\n        \"test_all_original_protected_fields_and_witnesses\",\n        \"test_generated_fields_against_independent_symbolic_model\"\n      ]\n    },\n    \"transfer\": {\n      \"requirement\": \"Own an admitted graph, 1..4 native integer slices, positive native integer/Fraction r, h, fugacity, and a bool channel. Cache the lexical forward/reverse kinetic product. Decode time-major masks of exactly sites*slices bits, accumulate spin propagators and return det(I+P) for each spin with the channel's field prefactor.\",\n      \"tests\": [\n        \"test_generated_fields_against_independent_symbolic_model\",\n        \"test_all_original_protected_fields_and_witnesses\",\n        \"test_model_domains_and_field_mask_preflight\",\n        \"test_empty_bonds_order_reversal_and_detached_queries\"\n      ]\n    }\n  },\n  \"role\": \"Independent symbolic transfer/Bareiss oracles with generated, complete-fixture and lifecycle challenges.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": {\n    \"HubbardTransferTests\": [\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.accepted\": [\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.check_field\": [\n      \"transfer\",\n      \"determinant\",\n      \"result\"\n    ],\n    \"HubbardTransferTests.refused\": [\n      \"graph\",\n      \"budgets\",\n      \"adapters\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_all_original_protected_fields_and_witnesses\": [\n      \"transfer\",\n      \"result\",\n      \"certificate\"\n    ],\n    \"HubbardTransferTests.test_check_failures_typed_resources_and_cancellation\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"HubbardTransferTests.test_determinant_against_bareiss\": [\n      \"determinant\"\n    ],\n   