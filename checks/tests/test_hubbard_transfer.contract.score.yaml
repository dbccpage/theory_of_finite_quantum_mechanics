    "failure_policy": "Own immutable graphs, parameters, models and results; keep counters fresh, imports quiet and mutable exports detached. Expected input, duplicate, check and resource failures are typed. RuntimeError, KeyboardInterrupt and SystemExit propagate. CLI refusal returns nonzero and guards remain active under optimized Python.",
    "operational_cost": "Graph has at most four sites and six edges. Kinetic construction uses at most 12 products of 4x4 matrices. A field has at most four time slices. Determinant accepts owned square dimensions 1..64, O(n^3) rational operations and O(n^2) workspace. All normalized rational components and named intermediates have at most 4096 bits. Raw binary rational products/divisions use at most 8192-bit components and addition/subtraction at most 8193-bit numerators before reduction/admission. The fixed application checks 320 fields and three witness/comparison fields. Each generated property has 60 deterministic examples; CLI/mutation subprocesses have 30-second timeouts.",
