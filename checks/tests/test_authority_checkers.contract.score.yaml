      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/tests/test_authority_checkers.py\",\n    \"sha256\": \"8ef1bc0990d3f56dbed9c370a525e3488cab336a5d2018b49daacf474543d330\"\n  },\n  \"assessment_id\": \"authority-checker-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Every declaration is mapped to requirements/tests; exact origins and consumer references are audited, with finite/supplied-model boundaries and AuthorityEffect None.\",\n    \"G2\": \"Runtime schemas and immutable value objects enforce exact natural tokens, finite total tables, exact bool flags, typed status fields and source byte/container budgets. Independent layout and pairwise equivalence oracles support generated properties.\",\n    \"G3\": \"Expected failures are typed and nonzero at CLI; negative and injected-fault tests cover admitted boundaries. Finite bounded loops and valid matrix/tuple indices are reviewed. Imports/capture/process lifecycles preserve cancellation and restore state.\",\n    \"G4\": \"16 contract groups and 24 first-25 integration groups pass normal and optimized Python; pinned strict mypy passes. Of 43 retained critical-path mutants, 42 are killed and one is proven equivalent under the typed-result contract; the raw survivor stays visible. The atlas-path and additive-test amendments reconstruct prior hashes and final integration is retested.\",\n    \"G5\": \"CCN 11, cognitive 7, nesting 3; one class or fewer. 80 deterministic generated examples for each property, bounded exhaustive three-code predicates, max-size fixtures and time-bounded isolated CLI/mutation integration. Temporary source records are written only in context-managed test-owned directories and removed on completion/error.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T06:38:19.046147+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-autho