ysics claim is changed.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-ckm-physics-fence\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-checker.md\",\n      \"sha256\": \"7eccde192d4d6a058ab059d40c0ec1ca07c33c7eb232dd16fc3d6bab434366be\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-initial-tests.py.txt\",\n      \"sha256\": \"1bf55d76248c01953d083ad1d000a467d35656f2d6ea105a951367fd955def18\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-mutations-closure.json\",\n      \"sha256\": \"65e60b5ba9edecd06ec9327efe1df0da71a587abb17c6d2173b0993a74323703\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-mutations.json\",\n      \"sha256\": \"47ad6f40af72c5beb73bde073db1dda4103814fe7772e9bdcb0cb7c7915fa422\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-quality-before-preflight.json\",\n      \"sha256\": \"d9dcbf1a8bbb9a143d786425b027c04a66dd9c8e3f8e707862d2310f8774de38\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-quality-initial.json\",\n      \"sha256\": \"a4f8a2fe39872b9680d86876e296a21291bf8c436eb07ed2e4bb3a25d470ab61\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-quality.json\",\n      \"sha256\": \"ef13dcc1a5f457abe740409907449c268a8e0834a6a12bead4ba8a313d41fef5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ckm-requirements.json\",\n      \"sha256\": \"6d74c1ff4cca26bc99d186c6c0ec0ce72199e5d90b22c8831c644eb6073c7ac5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-norm-bound-amendment.json\",\n      \"sha256\": \"a39cd6c875e7b63956640da3ae72d81fa64ea055b42b4d009cb007253f7fc514\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/ckm_mutations.json\",\n      \"sha256\": \"aad7b8b16ba6cb36d46bb251e694a3d2f40a70e5a0227cfd74004fdaaf994e29\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Each table dimension1..64, at most4096 cells. Admission, normalization, action and witness are O(height*width) with a fixed number of bounded Gaussian operations per cell. Stored Gaussian components and each returned polynomial value have<=4096-bit numerator/denominator; shared Gaussian norm/inverse intermediates have their separately corrected fixed-operation bounds, and conservative refusals may precede cancellation. Sign enumeration requires dimensions1..6 and product<=6 before enumeration:<=64 tables,4096 pairs,128 gauge assignments per table. Default11381 obligations include2376 sign actions and4388 pair decisions.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldCkmPhysicsFence.lean\",\n    \"sha256\": \"8366d62e75f6c93527df44a35fa92ae53754237c9a7602f205b5279360f9acdf\"\n  },\n  \"owned_invariants\": [\n    \"Each table is an owned nonempty rectangular nonzero-Gaussian aggregate with dimensions1..64.\",\n    \"Stored Gaussian components and returned rational polynomials have4096-bit budgets; conservative intermediate refusal is explicit.\",\n    \"Quartets permit zero labels and validate all four operands; rephasing tables/gauges require nonzero labels.\",\n    \"Gauge action uses row multiplication and column division. Witness success with None is distinct from input/resource failure.\",\n    \"Sign dimensions/cell count and exact table shape are checked before enumeration/algebra; failed refusal tests fail the CLI.\",\n    \"Default11381 obligations include2376 sign actions and4388 pair decisions.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact rational parameters excluding bool/float/subclass coercion, enforce4096-bit input/output bounds and evaluate the three rational polynomials on signed/fractional inputs without interpreting them as measured physical counts.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-1\",\n      \"symbols\": [\n        \"exact_rational\",\n        \"cycle_count\",\n        \"constraint_count\",\n        \"cp_count\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_counting_against_polynomial_oracles\",\n        \"CkmCheckerTests.test_scalar_and_quartet_boundaries\"\n      ]\n    },\n    {\n      \"requirement\": \"Require actual GaussianRational values at every quartet position before accessing methods; zero is permitted in quartets. Rephasing labels and gauges require nonzero values. Compute a*b*conj(c)*conj(d) exactly using the reviewed bounded Gaussian value.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-2\",\n      \"symbols\": [\n        \"_gaussian\",\n        \"quartet\",\n        \"_gauges\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_quartets_against_complex_oracle\",\n        \"CkmCheckerTests.test_scalar_and_quartet_boundaries\",\n        \"CkmCheckerTests.test_table_gauge_and_witness_domains\"\n      ]\n    },\n    {\n      \"requirement\": \"Own a frozen nonempty rectangular table of nonzero Q(i) labels with dimensions<=64. Snapshot nested lists, preserve exact rectangular shape, and reject ragged/empty/zero/foreign entries before algebra.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-3\",\n      \"symbols\": [\n        \"GaussianRephasingTable\",\n        \"GaussianRephasingTable.__init__\",\n        \"GaussianRephasingTable.shape\",\n        \"shape\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_table_snapshots_singletons_and_maximum\",\n        \"CkmCheckerTests.test_table_gauge_and_witness_domains\",\n        \"CkmCheckerTests.test_sign_census_and_enumeration_preflight\"\n      ]\n    },\n    {\n      \"requirement\": \"Normalize relative to row0/column0 using all four cross-ratio factors. Gauge action divides by the admitted column gauge. Return Outcome from aggregate operations and retain the raw-success evaluated legacy interfaces. Typed resource refusal is distinct from a classification result.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-4\",\n      \"symbols\": [\n        \"GaussianRephasingTable._normalized\",\n        \"GaussianRephasingTable.normalized\",\n        \"GaussianRephasingTable._act\",\n        \"GaussianRephasingTable.act\",\n        \"normalize\",\n        \"act\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_gaussian_table_action_and_normalization_oracle\",\n        \"CkmCheckerTests.test_nonreal_fixed_normalization_action_and_witness\",\n        \"CkmCheckerTests.test_table_gauge_and_witness_domains\",\n        \"CkmCheckerTests.test_table_arithmetic_resource_failure\",\n        \"CkmCheckerTests.test_recorders_failure_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Require an admitted table of identical shape. If normalized tables differ, return successful None; otherwise construct row and column gauges and verify their interpretation through independent tests. Input/resource failure is an Outcome error, never None.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-5\",\n      \"symbols\": [\n        \"GaussianRephasingTable._witness\",\n        \"GaussianRephasingTable.witness\",\n        \"witness\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_witness_against_independent_gauge_equations\",\n        \"CkmCheckerTests.test_nonreal_fixed_normalization_action_and_witness\",\n        \"CkmCheckerTests.test_table_gauge_and_witness_domains\",\n        \"CkmCheckerTests.test_table_arithmetic_resource_failure\",\n        \"CkmCheckerTests.test_recorders_failure_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Preflight exact positive sign-enumeration dimensions and the six-cell budget, then enumerate every sign table. check_sign_actions additionally verifies the supplied table shape before a bounded gauge enumeration.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-6\",\n      \"symbols\": [\n        \"_sign_shape\",\n        \"sign_tables\",\n        \"check_sign_actions\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_sign_census_and_enumeration_preflight\",\n        \"CkmCheckerTests.test_default_counts_and_fixed_faults\",\n        \"CkmCheckerTests.test_recorders_failure_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Use fresh or explicitly admitted Cases recorders. Verify canonical boundary/idempotence, witness soundness and separation, nonreal controls, polynomial/quartet fixtures and the fixed sign-orbit census. Every expected invalid-input refusal must actually return an input Failure; otherwise raise a counted check failure instead of returning an ignored message. Main reports11381 actual obligations and uses nonzero CLI diagnostics.\",\n      \"requirement_id\": \"TFQM-CKM-REVIEW-DFM-CKM-PHYSICS-FENCE-7\",\n      \"symbols\": [\n        \"_cases\",\n        \"check_canonical\",\n        \"check_pair\",\n        \"check_nonreal\",\n        \"check_rephasing\",\n        \"check_invalid_inputs\",\n        \"check_counting_examples\",\n        \"check_quartet_examples\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"CkmCheckerTests.test_failed_refusal_is_a_failed_check\",\n        \"CkmCheckerTests.test_default_counts_and_fixed_faults\",\n        \"CkmCheckerTests.test_recorders_failure_and_cancellation\",\n        \"CkmCheckerTests.test_witness_against_independent_gauge_equations\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded exact Gaussian-rephasing verification application with owned nonzero-table aggregate, constructive gauge witnesses, typed operations and accounted CLI failures\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"GaussianRephasingTable\",\n    \"GaussianRephasingTable.__init__\",\n    \"GaussianRephasingTable._act\",\n    \"GaussianRephasingTable._normalized\",\n    \"GaussianRephasingTable._witness\",\n    \"GaussianRephasingTable.act\",\n    \"GaussianRephasingTable.normalized\",\n    \"GaussianRephasingTable.shape\",\n    \"GaussianRephasingTable.witness\",\n    \"_cases\",\n    \"_gauges\",\n    \"_gaussian\",\n    \"_sign_shape\",\n    \"act\",\n    \"check_canonical\",\n    \"check_counting_examples\",\n    \"check_invalid_inputs\",\n    \"check_nonreal\",\n    \"check_pair\",\n    \"check_quartet_examples\",\n    \"check_rephasing\",\n    \"check_sign_actions\",\n    \"constraint_count\",\n    \"cp_count\",\n    \"cycle_count\",\n    \"exact_rational\",\n    \"main\",\n    \"normalize\",\n    \"quartet\",\n    \"shape\",\n    \"sign_tables\",\n    \"witness\"\n  ]\n}\n",
