86b091689607fef659a9bbc4acf5bfccb26fa53adb2\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"docs/evidence/nodes/CT-INFORMATION-MEDIA-INTEROPERABILITY.md\",\n      \"sha256\": \"4815f7e2f69daffd9bf351ed725d06a995740b3d3080ebef713150296636d1b6\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"checks/independent/ct-local-mediator-entanglement-import.py\",\n      \"sha256\": \"d7b5914f0897035fb75fe5b07af0bfd735c05b5715b83f7eceaa5297f41fb5e5\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \"checks/tests/test_constructor_theory.py\",\n      \"sha256\": \"5bca112965a3eef178340e8fc65adfcb13cd4c9f9e1f68ff005a97232e98ce38\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \"checks/tests/test_review_repairs.py\",\n      \"sha256\": \"6bb0b7602707a2ee0c7277558cb8cb74eb6d986d2cc0ffb1be6a9df23fe0c6a4\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"d79941d88bda04e6c856075fef12b7f9b438331348c8b6ab5d9e3e86beb6d3b6\",\n      \"state\": \"current local consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"Blank-slice cloning is a predicate on finite functions, not physical availability.\",\n    \"The symbolic product branch assumes supplied local maps; no general LOCC or mediator model is constructed.\",\n    \"The deterministic rank sample does not replace a general theorem. Historical receipts retain their original scope and hashes.\",\n    \"No new Lean build, hosted CI or higher-tier assessment is claimed. Label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded finite task verification and exact pure-state algebra; no physical constructor, mediator dynamics or continuum theorem.\",\n  \"consumer_boundary\": \"Both executable paths and existing regression entry points remain. The small information script now exposes a bounded finite task API and18 executed controls. Mediator direct group calls remain valid; its trusted optional recorder allows actual318-obligation accounting. The internal check_locc_kraus_branch_preservation name is replaced by check_product_branch_preservation after a caller audit found no external use. Derived concurrence values now have explicit4096-bit resource gates. Historical DAG/evidence hashes and imported scientific statuses are unchanged.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:ct-information-media-interoperability\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-checkers.md\",\n      \"sha256\": \"86e2f113ef9870ee9d738fe4d425e9fc276754c60808b042b79b14deb94e3f51\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-initial-tests.py.txt\",\n      \"sha256\": \"6d8e89b3edbf1c1416b981e68c612f573d42abe1833b210f8ab8d889055bf5dc\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-mutation-tests.py.txt\",\n      \"sha256\": \"c8f622ee074b6f40415f653c1cfe904d45900e234706cc1b40a8406a89e0d1d4\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-mutations-closure.json\",\n      \"sha256\": \"6db2afe9ebf10698783c6559994644cafc150aeee19aff2c7ccd1d62f14150a4\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-norm-bound-amendment.json\",\n      \"sha256\": \"a39cd6c875e7b63956640da3ae72d81fa64ea055b42b4d009cb007253f7fc514\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality-before-norm-bound.json\",\n      \"sha256\": \"5694dbead8cd02a1c32d19fee4192748ed2852cfc10ff7ff01749ab1236bda57\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality-initial.json\",\n      \"sha256\": \"3c3c4dd736c159632994c2fb1860f6ce9f71359b5713fda2c591511bcc5bf8bf\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality.json\",\n      \"sha256\": \"83174820bfc49aa98b55b51e04ea71bbcaf69e40da00ed7cc56556d0f7d9bff6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-requirements.json\",\n      \"sha256\": \"66997304cadfb0f3290921d706c52e0f9479328eafd6c37ba9c0cc1f3a33a9e0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor_theory-mutations.json\",\n      \"sha256\": \"24e30263529a99ebe0e10494eac2f3c19d82a0d16f673cc2ca80dc972a34923a\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/constructor_theory_mutations.json\",\n      \"sha256\": \"4ddc767683ba0587cefbcb5c33644eff6d0b84289acb6626c602b7024da58f4a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-checker-infrastructure.md\",\n      \"sha256\": \"513c66bcb4425d16dfcca24c6a0d70cc1eca9fc5e8d38d5c3a716419af73584b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-requirements.json\",\n      \"sha256\": \"f35bc30bc1c7251fa92dae0adfddd6c7d694781fc3eb4bcbbeeba3db5847cafd\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-composed.json\",\n      \"sha256\": \"90fe9ad62d24997d73c0062bcf90ed8490a8096754308b9af5db9b75a9567961\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-swap-equivalence.md\",\n      \"sha256\": \"737f0bb2b6f63cc40181ccefc569ab55b473e08db23dce0d7a61fb27f46f2a24\"\n    }\n  ],\n  \"failure_policy\": \"Exact runtime input/shape/resource gates precede dependent indexing and arithmetic. Internal typed Violation is translated by evaluate into Outcome and by cli into a diagnostic/nonzero status. Task methods return Outcome; Gaussian operators remain internal typed-exception operations used through evaluation boundaries. Cases admits exact bool and unique identifiers. Expected input/resource/check/duplicate failures are distinct; cancellation and unexpected programming failures propagate. Test mocks, captures and import registration restore ownership.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Each carrier dimension1..64, table length1..4096. Admission, lookup-table composition, inverse and local-factor checks are O(left*right); apply is O(1) after fixed point validation. Parallel dimensions are checked before at most4096 lookups. Only the fixed4-state fixture enumerates permutations (24), never an arbitrary user carrier. Default18 obligations =5 controlled-permutation+13 cloning controls.\",\n  \"origin\": {\n    \"path\": \"lean4/InformationProductBoundary.lean\",\n    \"sha256\": \"b9fb0fc2e132c89a49c4068013d2e5e36de23d25b366bf9c6ea9e8f400780687\"\n  },\n  \"owned_invariants\": [\n    \"FiniteProductTask owns one frozen total row-major endofunction table; each dimension1..64 and at most4096 outputs.\",\n    \"Composition has exact ordered shape equality; inverse requires bijectivity; parallel carrier budgets are preflighted.\",\n    \"Gaussian stored components have at most4096-bit numerators and denominators; the exact squared norm is allowed the separately stated larger bit bound.\",\n    \"The concurrence consumer admits every derived rational to4096 bits and never clips a result.\",\n    \"Default information/mediator counts are18/318 actual require calls; the mediator has seven groups, not seven obligations.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Own a frozen, total row-major task table on the finite product carrier, admitting exact integer sizes1..64 and in-carrier output pairs. Snapshot caller lists and reject bool/float, missing/extra table entries and malformed pairs. Public application validates its point and returns Outcome; internal _at is used only on admitted points.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-INFORMATION-MEDIA-INTEROPERABILITY-1\",\n      \"symbols\": [\n        \"FiniteProductTask\",\n        \"FiniteProductTask.__init__\",\n        \"FiniteProductTask._at\",\n        \"FiniteProductTask._apply\",\n        \"FiniteProductTask.apply\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_task_domain_refusals_and_shape_equality\",\n        \"ConstructorTheoryTests.test_task_owns_snapshots_and_parallel_checks_budget_first\",\n        \"ConstructorTheoryTests.test_task_application_and_composition_dictionary_oracle\"\n      ]\n    },\n    {\n      \"requirement\": \"A task is reversible exactly when all output points are distinct. Return the two local component functions exactly when both output coordinates depend only on their own input coordinate. Inversion refuses a nonbijective task and correctly handles rectangular carriers.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-INFORMATION-MEDIA-INTEROPERABILITY-2\",\n      \"symbols\": [\n        \"FiniteProductTask.is_reversible\",\n        \"FiniteProductTask.local_factors\",\n        \"FiniteProductTask._inverse\",\n        \"FiniteProductTask.inverse\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_exhaustive_binary_tasks_factorization_and_inverse\",\n        \"ConstructorTheoryTests.test_task_owns_snapshots_and_parallel_checks_budget_first\",\n        \"ConstructorTheoryTests.test_cloning_only_constrains_blank_slice\"\n      ]\n    },\n    {\n      \"requirement\": \"Compose self after other only on equal ordered carrier dimensions. Parallel composition regroups paired carriers using explicit row-major encoding and checks both product dimensions before lookup/allocation. Require another admitted task, never an arbitrary callback, and preserve typed Outcome failures/cancellation.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-INFORMATION-MEDIA-INTEROPERABILITY-3\",\n      \"symbols\": [\n        \"FiniteProductTask._other\",\n        \"FiniteProductTask._compose\",\n        \"FiniteProductTask.compose\",\n        \"FiniteProductTask._parallel\",\n        \"FiniteProductTask.parallel\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_task_application_and_composition_dictionary_oracle\",\n        \"ConstructorTheoryTests.test_parallel_regrouping_and_cloning_dictionary_oracle\",\n        \"ConstructorTheoryTests.test_task_domain_refusals_and_shape_equality\",\n        \"ConstructorTheoryTests.test_task_owns_snapshots_and_parallel_checks_budget_first\",\n        \"ConstructorTheoryTests.test_cli_resources_cancellation_and_task_result_refusal\"\n      ]\n    },\n    {\n      \"requirement\": \"The cloning predicate requires equal carrier sizes and one admitted blank label. It constrains only (label,blank) inputs and does not imply global copying, physical availability or irreversibility.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-INFORMATION-MEDIA-INTEROPERABILITY-4\",\n      \"symbols\": [\n        \"FiniteProductTask._clones\",\n        \"FiniteProductTask.clones\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_exhaustive_binary_tasks_factorization_and_inverse\",\n        \"ConstructorTheoryTests.test_cloning_only_constrains_blank_slice\",\n        \"ConstructorTheoryTests.test_task_domain_refusals_and_shape_equality\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit exact binary point labels, check controlled flip/inverse/composition and its failure to factor locally, enumerate the four local permutations among24 composite permutations, and check12 product-cloning inputs plus their blank predicates. Use per-run named Cases accounting and retain main check refusal semantics used by existing regression callers.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-INFORMATION-MEDIA-INTEROPERABILITY-5\",\n      \"symbols\": [\n        \"controlled\",\n        \"check_controlled_permutation\",\n        \"check_product_cloning\",\n        \"run_checks\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_information_controls_cli_and_repeatability\",\n        \"ConstructorTheoryTests.test_information_generated_receipt_accounting\",\n        \"ConstructorTheoryTests.test_task_domain_refusals_and_shape_equality\",\n        \"ConstructorTheoryTests.test_cli_resources_cancellation_and_task_result_refusal\"\n      ]\n    }\n  ],\n  \"role\": \"Finite functional-task verification application with owned total endofunction tables, exact reversible/local-factor certificates, checked composition/product construction, blank-slice predicates and Railway results\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"FiniteProductTask\",\n    \"FiniteProductTask.__init__\",\n    \"FiniteProductTask._apply\",\n    \"FiniteProductTask._at\",\n    \"FiniteProductTask._clones\",\n    \"FiniteProductTask._compose\",\n    \"FiniteProductTask._inverse\",\n    \"FiniteProductTask._other\",\n    \"FiniteProductTask._parallel\",\n    \"FiniteProductTask.apply\",\n    \"FiniteProductTask.clones\",\n    \"FiniteProductTask.compose\",\n    \"FiniteProductTask.inverse\",\n    \"FiniteProductTask.is_reversible\",\n    \"FiniteProductTask.local_factors\",\n    \"FiniteProductTask.parallel\",\n    \"check_controlled_permutation\",\n    \"check_product_cloning\",\n    \"controlled\",\n    \"main\",\n    \"run_checks\"\n  ]\n}\n",
