    "failure_policy": "Exact runtime input/shape/resource gates precede dependent indexing and arithmetic. Internal typed Violation is translated by evaluate into Outcome and by cli into a diagnostic/nonzero status. Task methods return Outcome; Gaussian operators remain internal typed-exception operations used through evaluation boundaries. Cases admits exact bool and unique identifiers. Expected input/resource/check/duplicate failures are distinct; cancellation and unexpected programming failures propagate. Test mocks, captures and import registration restore ownership.",
    "nested_declaration_ownership": {},
    "operational_cost": "Each carrier dimension1..64, table length1..4096. Admission, lookup-table composition, inverse and local-factor checks are O(left*right); apply is O(1) after fixed point validation. Parallel dimensions are checked before at most4096 lookups. Only the fixed4-state fixture enumerates permutations (24), never an arbitrary user carrier. Default18 obligations =5 controlled-permutation+13 cloning controls.",
