      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/ct-information-media-interoperability.py\",\n    \"sha256\": \"567ebe8cb3559e645dcf449470b06102e5f8e232388d36d1644584eab40b46cd\"\n  },\n  \"assessment_id\": \"constructor-theory-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Every declaration and nested ownership maps to tested requirements. Lean origins and current/historical consumer boundaries audited; no physical or continuum promotion.\",\n    \"G2\": \"Exact finite carriers and bounded rational arithmetic; independent dictionary, complex-matrix and rational-elimination oracles exercise rectangular and degenerate cases.\",\n    \"G3\": \"Owned immutable snapshots, shape/domain/resource preflight, typed failure versus false predicate, cancellation propagation, and scoped test resources. Validated finite indexing and denominators exclude ordinary reachable runtime traps within admitted operations.\",\n    \"G4\": \"Strict typing and16 constructor-theory,24 integration and25 support groups pass normal/optimized runs. Deterministic80-example properties and exhaustive256-task census. All55 CT mutants retained:54 killed,1 proven equivalent. Unchanged Gaussian source retains its earlier mutation evidence; added norm test has exact additive custody.\",\n    \"G5\": \"CCN 12, cognitive 5, nesting 1; at most one class. Each carrier dimension1..64, table length1..4096. Admission, lookup-table composition, inverse and local-factor checks are O(left*right); apply is O(1) after fixed point validation. Parallel dimensions are checked before at most4096 lookups. Only the fixed4-state fixture enumerates permutations (24), never an arbitrary user carrier. Default18 obligations =5 controlled-permutation+13 cloning controls.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T08:50:53.579109+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"re