pleted pairs+5*865 values/scalings+33 congruence/census+8 obstruction checks.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/BornRationalRayObstruction.lean\",\n      \"sha256\": \"db82ac8f931e9f0d1c6870a141f3dac4e55f17d4feb437d0109df3ef51649ff0\"\n    },\n    {\n      \"path\": \"dag/derivations/independent/fq-gap-born-uniqueness-gleason-rays.md\",\n      \"sha256\": \"117b3b26afb3b5286eb706c59b1b4427e6aecc82d15289a90045cf78fd762132\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"IntegerRay3 owns a gcd-one integer triple with positive first nonzero coordinate. Every nonzero integer representative normalizes; zero, bool, float and Fraction inputs refuse.\",\n    \"The raw parity formula is evaluated only on the canonical primitive representative. A two-odd-coordinate sign uses exact modulo-four residues; all other patterns have value1/3.\",\n    \"Dot products, cross products, their terms/prefixes, scaling products and quadratic terms are checked within4096 bits before later cancellation or normalization.\",\n    \"Box radius1..6 is admitted before enumeration; at most2197 raw vectors and865 distinct rays. Completion requires two owned orthogonal rays and may leave the original box.\",\n    \"All64 parity-admitted modulo-four tuples are enumerated;32 compatible tuples satisfy sign cancellation. This replaces repeated sampled integer congruences.\",\n    \"The seven-ray obstruction composes a certified6x6 basis inverse, seventh-equation mismatch and independent left-null witness with residual-2.\",\n    \"Default20872 checks comprise3*5502 completed pairs,5*865 value/scaling checks,33 congruence/census and8 obstruction controls. Quiet imports and per-run counts replace process-global execution.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact non-bool integer3-vectors and4096-bit inputs before gcd or arithmetic. Bound every dot product/prefix and cross product/difference. Pair-sign API admits two odd integers and compares their mod4 residues without unnecessarily growing a difference. Public raw-value/box/verification operations use Outcome.\",\n      \"requirement_id\": \"TFQM-RATIONAL-RAYS-REVIEW-FQ-GAP-BORN-UNIQUENESS-GLEASON-RATIONAL-RAYS-1\",\n      \"symbols\": [\n        \"_integer\",\n        \"_coordinates\",\n        \"_dot\",\n        \"_cross\",\n        \"_pair_sign\",\n        \"pair_sign\"\n      ],\n      \"test_source\": \"checks/tests/test_rational_ray_obstruction.py\",\n      \"tests\": [\n        \"RationalRayObstructionTests.test_exact_domains_zero_even_representatives_and_ownership\",\n        \"RationalRayObstructionTests.test_input_product_prefix_and_scaling_resource_limits\",\n        \"RationalRayObstructionTests.test_original_raw_domain_and_full_mod4_congruence\",\n        \"RationalRayObstructionTests.test_isolated_intermediate_bounds_and_nonorthogonal_completion\"\n      ]\n    },\n    {\n      \"requirement\": \"IntegerRay3 owns a nonzero primitive integer representative, gcd1 and first nonzero entry positive. Thus equality/hash identify rational rays represented by integer vectors. Exotic value selects the two odd coordinates only and applies the stated modulo-four sign; other patterns give1/3. Accept nonzero even representatives by normalization, not by extending the old raw parity formula to even vectors. Scaling requires nonzero exact integer, bounds products before normalization, and returns the same canonical ray; no rational-valued input carrier is silently admitted.\",\n      \"requirement_id\": \"TFQM-RATIONAL-RAYS-REVIEW-FQ-GAP-BORN-UNIQUENESS-GLEASON-RATIONAL-RAYS-2\",\n      \"symbols\": [\n        \"IntegerRay3\",\n        \"IntegerRay3.__init__\",\n        \"IntegerRay3.value\",\n        \"IntegerRay3._other\",\n        \"IntegerRay3._scale\",\n        \"IntegerRay3.scale\",\n        \"exotic\"\n      ],\n      \"test_source\": \"checks/tests/test_rational_ray_obstruction.py\",\n      \"tests\": [\n        \"RationalRayObstructionTests.test_generated_canonical_ray_and_independent_residue_value\",\n        \"RationalRayObstructionTests.test_exact_domains_zero_even_representatives_and_ownership\",\n        \"RationalRayObstructionTests.test_operand_and_scaling_domains_and_preflight\",\n        \"RationalRayObstructionTests.test_input_product_prefix_and_scaling_resource_limits\"\n      ]\n    },\n    {\n      \"requirement\": \"Dot uses the canonical integer representatives. Frame completion requires two owned orthogonal rays and normalizes their cross product. The completing ray may leave the enumeration box. Quadratic rows contain a^2,b^2,c^2,2ab,2ac,2bc and exotic(v)*norm-square; squares, doubled cross terms and norm prefixes are checked before export.\",\n      \"requirement_id\": \"TFQM-RATIONAL-RAYS-REVIEW-FQ-GAP-BORN-UNIQUENESS-GLEASON-RATIONAL-RAYS-3\",\n      \"symbols\": [\n        \"IntegerRay3.dot\",\n        \"IntegerRay3._complete\",\n        \"IntegerRay3.complete\",\n        \"IntegerRay3._quadratic_row\",\n        \"IntegerRay3.quadratic_row\"\n      ],\n      \"test_source\": \"checks/tests/test_rational_ray_obstruction.py\",\n      \"tests\": [\n        \"RationalRayObstructionTests.test_generated_completion_against_symbolic_cross_product\",\n        \"RationalRayObstructionTests.test_generated_quadratic_rows_against_symbolic_polynomial\",\n        \"RationalRayObstructionTests.test_completion_orientation_and_quadratic_intermediate_preflight\",\n        \"RationalRayObstructionTests.test_operand_and_scaling_domains_and_preflight\",\n        \"RationalRayObstructionTests.test_input_product_prefix_and_scaling_resource_limits\",\n        \"RationalRayObstructionTests.test_isolated_intermediate_bounds_and_nonorthogonal_completion\"\n      ]\n    },\n    {\n      \"requirement\": \"Preflight radius1..6, enumerate all nonzero integer vectors, canonicalize/deduplicate and sort. For every distinct orthogonal pair check both completion dot products and exotic sum1. This covers ray pairs represented in the box, not a literal enumeration of all ordered triples in the box. Check every canonical ray value, negation and three original odd scalings.\",\n      \"requirement_id\": \"TFQM-RATIONAL-RAYS-REVIEW-FQ-GAP-BORN-UNIQUENESS-GLEASON-RATIONAL-RAYS-4\",\n      \"symbols\": [\n        \"_box\",\n        \"ray_box\",\n        \"_frames\",\n        \"_values\"\n      ],\n      \"test_source\": \"checks/tests/test_rational_ray_obstruction.py\",\n      \"tests\": [\n        \"RationalRayObstructionTests.test_all_small_box_rays_and_frame_pairs_against_raw_enumeration\",\n        \"RationalRayObstructionTests.test_import_reentrant_counts_and_cli_failure_lifecycle\",\n        \"RationalRayObstructionTests.test_generated_canonical_ray_and_independent_residue_value\"\n      ]\n    },\n    {\n      \"requirement\": \"Replace repeated bounded integer samples by all64 parity-admitted modulo-four tuples, enforcing the32 compatible tuple census. Compose a certified6x6 inverse to fit the first six quadratic equations, show the seventh contradiction, and independently verify a left-null witness with residual-2. Include explicit0,1/3,2/3 witnesses. Require a per-run recorder before work and emit precise counts with a nonzero failure exit.\",\n      \"requirement_id\": \"TFQM-RATIONAL-RAYS-REVIEW-FQ-GAP-BORN-UNIQUENESS-GLEASON-RATIONAL-RAYS-5\",\n      \"symbols\": [\n        \"_congruence\",\n        \"_obstruction\",\n        \"_verify\",\n        \"verify\",\n        \"main\"\n      ],\n      \"test_source\": \"checks/tests/test_rational_ray_obstruction.py\",\n      \"tests\": [\n        \"RationalRayObstructionTests.test_original_raw_domain_and_full_mod4_congruence\",\n        \"RationalRayObstructionTests.test_seven_ray_independent_rank_nullspace_and_residual\",\n        \"RationalRayObstructionTests.test_import_reentrant_counts_and_cli_failure_lifecycle\",\n        \"RationalRayObstructionTests.test_operand_and_scaling_domains_and_preflight\"\n      ]\n    }\n  ],\n  \"role\": \"Owned canonical integer-ray value and bounded rational-ray frame-obstruction verification application\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"IntegerRay3\",\n    \"IntegerRay3.__init__\",\n    \"IntegerRay3._complete\",\n    \"IntegerRay3._other\",\n    \"IntegerRay3._quadratic_row\",\n    \"IntegerRay3._scale\",\n    \"IntegerRay3.complete\",\n    \"IntegerRay3.dot\",\n    \"IntegerRay3.quadratic_row\",\n    \"IntegerRay3.scale\",\n    \"IntegerRay3.value\",\n    \"_box\",\n    \"_congruence\",\n    \"_coordinates\",\n    \"_cross\",\n    \"_dot\",\n    \"_frames\",\n    \"_integer\",\n    \"_obstruction\",\n    \"_pair_sign\",\n    \"_values\",\n    \"_verify\",\n    \"exotic\",\n    \"main\",\n    \"pair_sign\",\n    \"ray_box\",\n    \"verify\"\n  ]\n}\n",
