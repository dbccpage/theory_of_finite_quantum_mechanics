ence uses two form values and one bounded subtraction. Both difference operands are admitted before either evaluation. Work/storage are constant-size apart from bounded exact arithmetic. Default10 obligations split the former combined predicates; no enumeration or continuum construction.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldGribovContinuumFence.lean\",\n    \"sha256\": \"5fc39e796df35b9b985b8b6371a866c117a3c61f9671ee8a25f98b60a04b12b7\"\n  },\n  \"owned_invariants\": [\n    \"Exactly three list/tuple rows of three exact rational entries, with every row shape checked before entry conversion.\",\n    \"Input values, each multiplication/dot sum, each trace prefix and final form difference are bounded to4096-bit rational numerator/denominator.\",\n    \"TraceQuadraticForm owns an immutable RationalMatrix weight; evaluation computes Tr(weight*H^2) without symmetry or positivity assumptions.\",\n    \"Both generators are admitted before difference arithmetic; public aggregate methods return Outcome and distinguish zero from refusal.\",\n    \"Default10 obligations preserve both squares, weight involution/determinant, two traces, three form values and their difference.\",\n    \"The CLI returns a fresh JSON receipt per run and exits nonzero on failed verification; cancellation and programming errors propagate.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit only exact int/Fraction values and exactly3x3 list/tuple matrices; reject bool/float/foreign values, oversized rational inputs and malformed shapes before dependent arithmetic. Own all rows and compose multiplication through the shared bounded RationalMatrix, preserving legacy row-tuple output.\",\n      \"requirement_id\": \"TFQM-GRIBOV-REVIEW-DFM-GRIBOV-CONTINUUM-FENCE-1\",\n      \"symbols\": [\n        \"exact\",\n        \"_matrix\",\n        \"mat\",\n        \"mul\",\n        \"diag\"\n      ],\n      \"tests\": [\n        \"GribovCheckerTests.test_matrix_helpers_against_symbolic_algebra\",\n        \"GribovCheckerTests.test_nonsymmetric_fixed_oracle\",\n        \"GribovCheckerTests.test_shape_type_and_exact_scalar_boundaries\",\n        \"GribovCheckerTests.test_owned_snapshots_and_railway_refusals\",\n        \"GribovCheckerTests.test_exact_product_trace_and_difference_budgets\",\n        \"GribovCheckerTests.test_preflight_precedes_arithmetic\"\n      ]\n    },\n    {\n      \"requirement\": \"Compute the diagonal sum with a4096-bit check after every addition, including refusal of an oversized prefix even if a later negative term would cancel it. Validate public trace input as3x3 first.\",\n      \"requirement_id\": \"TFQM-GRIBOV-REVIEW-DFM-GRIBOV-CONTINUUM-FENCE-2\",\n      \"symbols\": [\n        \"_trace\",\n        \"trace\"\n      ],\n      \"tests\": [\n        \"GribovCheckerTests.test_matrix_helpers_against_symbolic_algebra\",\n        \"GribovCheckerTests.test_nonsymmetric_fixed_oracle\",\n        \"GribovCheckerTests.test_exact_product_trace_and_difference_budgets\",\n        \"GribovCheckerTests.test_shape_type_and_exact_scalar_boundaries\"\n      ]\n    },\n    {\n      \"requirement\": \"TraceQuadraticForm owns an immutable rational3x3 weight and evaluates Tr(weight*H^2) for any admitted rational3x3 generator, without symmetry or positivity assumptions. Return Outcome for expected input/resource failures; unexpected programming errors and cancellation propagate.\",\n      \"requirement_id\": \"TFQM-GRIBOV-REVIEW-DFM-GRIBOV-CONTINUUM-FENCE-3\",\n      \"symbols\": [\n        \"TraceQuadraticForm\",\n        \"TraceQuadraticForm.__init__\",\n        \"TraceQuadraticForm._on\",\n        \"TraceQuadraticForm._value\",\n        \"TraceQuadraticForm.value\"\n      ],\n      \"tests\": [\n        \"GribovCheckerTests.test_weighted_forms_and_differences\",\n        \"GribovCheckerTests.test_nonsymmetric_fixed_oracle\",\n        \"GribovCheckerTests.test_owned_snapshots_and_railway_refusals\",\n        \"GribovCheckerTests.test_exact_product_trace_and_difference_budgets\",\n        \"GribovCheckerTests.test_injected_failures_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit both generators before evaluating their weighted forms, then return the exact left-minus-right difference with a bounded output through Outcome. Resource refusal is distinct from a zero difference.\",\n      \"requirement_id\": \"TFQM-GRIBOV-REVIEW-DFM-GRIBOV-CONTINUUM-FENCE-4\",\n      \"symbols\": [\n        \"TraceQuadraticForm._difference\",\n        \"TraceQuadraticForm.difference\"\n      ],\n      \"tests\": [\n        \"GribovCheckerTests.test_weighted_forms_and_differences\",\n        \"GribovCheckerTests.test_nonsymmetric_fixed_oracle\",\n        \"GribovCheckerTests.test_owned_snapshots_and_railway_refusals\",\n        \"GribovCheckerTests.test_exact_product_trace_and_difference_budgets\",\n        \"GribovCheckerTests.test_preflight_precedes_arithmetic\"\n      ]\n    },\n    {\n      \"requirement\": \"Preserve both generator squares, weight involution/diagonal determinant, two traces, three form values and their unequal difference as10 counted obligations. Require an explicit Cases recorder, emit a per-run JSON receipt and exit nonzero on failed verification. Claims remain finite rational matrix identities.\",\n      \"requirement_id\": \"TFQM-GRIBOV-REVIEW-DFM-GRIBOV-CONTINUUM-FENCE-5\",\n      \"symbols\": [\n        \"run_checks\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"GribovCheckerTests.test_original_witnesses_and_counts\",\n        \"GribovCheckerTests.test_injected_failures_and_cancellation\",\n        \"GribovCheckerTests.test_executable_cli\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded rational3x3 weighted-trace verification application with owned weight aggregate, exact shape/resource admission, Railway value/difference operations and finite witness controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"TraceQuadraticForm\",\n    \"TraceQuadraticForm.__init__\",\n    \"TraceQuadraticForm._difference\",\n    \"TraceQuadraticForm._on\",\n    \"TraceQuadraticForm._value\",\n    \"TraceQuadraticForm.difference\",\n    \"TraceQuadraticForm.value\",\n    \"_matrix\",\n    \"_trace\",\n    \"diag\",\n    \"exact\",\n    \"main\",\n    \"mat\",\n    \"mul\",\n    \"run_checks\",\n    \"trace\"\n  ]\n}\n",
