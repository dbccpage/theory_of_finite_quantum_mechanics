odels use owned EmpiricalModel.\",\n      \"requirement_id\": \"TFQM-OBSERVER-REVIEW-FOC035-OBSERVER-PRESHEAF-1\",\n      \"symbols\": [\n        \"simplex_min\",\n        \"verify_lp\",\n        \"parity_dist\",\n        \"pr_box\",\n        \"noisy_pr\",\n        \"point_mass\",\n        \"mixture\",\n        \"_support\",\n        \"_optimal\"\n      ],\n      \"test_source\": \"checks/tests/test_observer_presheaf.py\",\n      \"tests\": [\n        \"ObserverPresheafTests.test_legacy_lp_adapter_and_probability_input_refusals\",\n        \"ObserverPresheafTests.test_bell_ncf_distance_and_signed_section_oracles\"\n      ]\n    },\n    {\n      \"requirement\": \"Preflight and independently certify noncontextual fraction and L1 distance, including objective/residual reconstruction; signed section composes positive/negative zero-objective variables and verifies exact reconstruction. Descent delegates to the full-cover model contract.\",\n      \"requirement_id\": \"TFQM-OBSERVER-REVIEW-FOC035-OBSERVER-PRESHEAF-2\",\n      \"symbols\": [\n        \"ncf\",\n        \"l1_defect\",\n        \"matching_families\",\n        \"_signed_section\"\n      ],\n      \"test_source\": \"checks/tests/test_observer_presheaf.py\",\n      \"tests\": [\n        \"ObserverPresheafTests.test_bell_ncf_distance_and_signed_section_oracles\",\n        \"ObserverPresheafTests.test_generated_single_context_models_are_noncontextual\",\n        \"ObserverPresheafTests.test_gluing_zero_overlap_mismatch_and_lp_size_preflight\"\n      ]\n    },\n    {\n      \"requirement\": \"Own finite hyperedges and reduce ears/contained edges until fixed point; never accept arbitrary iterables or aliased booleans. Glue admitted two-context probabilities only when overlap marginals agree, using the explicit zero-overlap convention and checking the reconstructed model.\",\n      \"requirement_id\": \"TFQM-OBSERVER-REVIEW-FOC035-OBSERVER-PRESHEAF-3\",\n      \"symbols\": [\n        \"_vertex\",\n        \"_hypered