    "owned_invariants": [
      "Exact non-bool integers/Fractions only; no float conversion. Numerator/denominator and each checked product, quotient and accumulated prefix are at most4096 bits.",
      "LP standard form has nonnegative RHS,1..32 rows and1..64 variables. Optimal/infeasible/unbounded variants have disjoint owned shapes and must pass associated-program replay before search success.",
      "Simplex has at most4096 pivots,32x97 tableau entries and deterministic entering/leaving choices; budget exhaustion never means infeasibility.",
      "Measurement carrier1..6 and1..16 distinct nonempty increasing contexts cover the carrier. Full binary cochains are admitted including entries irrelevant to an empty nerve; signed cochains and probability rows have separate contracts.",
      "Empirical rows are complete nonnegative mass-one distributions. General mixtures have equal scenarios; full-cover descent preflights4096 candidates and determines at most one joined assignment per family.",
      "Incidence allocation<=4096 entries; each Cech degree<=4096 coordinates. Oriented coboundaries use actual overlaps. Quotient witnesses require dual norm<=1, basis annihilation and equality with actual primal residual.",
      "Original50 named application groups and scalar DAG certificate interface remain. Per-run counters and actual parity census replace global/literal status bookkeeping."
    ],
