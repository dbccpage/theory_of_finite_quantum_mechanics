ound by this contract and the exact retest receipt.\",\n    \"Expected independent-checker input failures are represented by Failure/Outcome at the evaluate boundary; CLI refusals exit nonzero.\",\n    \"No executable assertions are relied on; regression verifies normal and optimized Python.\",\n    \"Exact numerical paths reject unadmitted floats and booleans at the repaired input boundaries.\"\n  ],\n  \"purpose\": \"Independent verification checker for Record TFQ-1052 (FQCD-STRONG-COUPLING-AREA-LAW).\\n\\nTarget node: FQCD-STRONG-COUPLING-AREA-LAW\\nAuthorityEffect: None\\nImports checker infrastructure only; no production implementation.\\n\\nChecks arithmetic conditional on supplied finite character/degree tables.\\nIt does not enumerate the groups, derive their tables, or prove the continuum area law.\\nAll uniqueness labels below concern only the displayed comparison set.\\n\\nVerifies:\\n1. Exact coordination numbers: Delta_d = 2d(d-1) for d >= 2.\\n2. Exact closed-form strong-coupling threshold: beta_0(N, d) = [8 e Delta_d (N-1)]^{-1} > 0\\n   and certified rational lower/upper bounds using 19/7 < e < 193/71.\\n3. Exact constants: K = 1, sigma_0 = ln(4) > 0 with exact rational decay bound (1/4)^Area.\\n4. Minimal spanning area Area(C) = L * T and perimeter Perimeter(C) = 2(L + T).\\n5. Geometric cluster series area-law bound:\\n   sum_{A >= Area(C)} (8 e Delta_d (N-1) beta)^A <= K exp(-sigma_0 Area(C)) for beta <= beta_0 / 5.\\n6. Finite group cubic invariants & screening vs center parity protection:\\n   - S_3 cubic character invariant sum_{g in S_3} chi_2(g)^3 / 6 = 1.0 (exact Fraction(1, 1));\\n     collar tube tensor contraction c_X = 2^{-E_off} > 0 mediating screening for L >= 17.\\n   - Q_8 cubic character invariant sum_{g in Q_8} chi_2(g)^3 / 8 = 0.0 (exact Fraction(0, 1));\\n     center parity {+1, -1} with chi_2(-1) = -2 protecting spanning surface against screening.\\n7. Exact 2D character decimation area law:\\n   <W_R(C)> = (dim R)^{1 - Area(C)} * (a_R(beta)/a_0(beta))^{Area(C)}.\",\n  \"role\": \"independent finite checker\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"direct_modified_chirality_square\",\n    \"delta_coordination\",\n    \"beta0_rational_midpoint\",\n    \"beta0_rational_bounds\",\n    \"spanning_area\",\n    \"perimeter\",\n    \"cluster_sum_rational\",\n    \"area_law_bound_rational\",\n    \"s3_cubic_sum_rational\",\n    \"q8_cubic_sum_rational\",\n    \"collar_contraction_rational\",\n    \"twod_decimation_rational\",\n    \"s4_cubic_invariants_rational\",\n    \"a5_cubic_invariants_rational\",\n    \"general_collar_contraction_rational\",\n    \"normal_directions\",\n    \"d4_multi_plaquette_collar_bound\",\n    \"binary_icosahedral_2i_invariants_rational\",\n    \"valentiner_sigma1080_invariants_rational\",\n    \"freezing_plaquette_defect_rational_bounds\",\n    \"su2_ade_binary_polyhedral_tower_rational\",\n    \"su3_subgroup_tower_and_freezing_scales_rational\",\n    \"theta_phase\",\n    \"check_coordination\",\n    \"check_thresholds\",\n    \"check_loop_geometry\",\n    \"check_cluster_bound\",\n    \"check_cubic_screening\",\n    \"check_decimation\",\n    \"check_higher_cubic_tables\",\n    \"check_collars\",\n    \"check_icosahedral_tables\",\n    \"check_subgroup_tables\",\n    \"check_freezing_separation\",\n    \"check_klein_table\",\n    \"check_quartic_tables\",\n    \"check_hessian_tables\",\n    \"check_higher_spin\",\n    \"check_crystal_hierarchy\",\n    \"check_mednykh_genus_two\",\n    \"check_mednykh_genus_three\",\n    \"check_casimir_ratios\",\n    \"check_pachner_counts\",\n    \"check_wilson_fixture\",\n    \"check_chemical_potential\",\n    \"check_overlap_fixture\",\n    \"check_theta_fixture\",\n    \"run_checks\",\n    \"main\"\n  ]\n}\n",
