es. Default run has 250 named obligations and fixed independent 8x8 determinant cases.\",\n  \"origin\": {\n    \"path\": \"lean4/FQCD/StrongCouplingAreaLaw.lean\",\n    \"sha256\": \"9f32c0851eac5b2326999627e68f6d35da1f73bb1f05cd001a998cc971d8108b\"\n  },\n  \"owned_invariants\": [\n    \"The strong-coupling beta0 enclosure uses factor 40, distinct from factor-8 beta0_OS and the separate formal freezing proxy.\",\n    \"Exactly 250 named default obligations; each conjunction is one obligation and every failed row remains visible.\",\n    \"Exact arithmetic and admitted input/component/combined power bounds; no float or bool coercion.\",\n    \"One class per file at most, no production assert, strict pinned typing and immutable validated table carriers.\",\n    \"Supplied character/degree data remain conditional fixtures, not independent group enumeration.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Validate exact scalar/interval rows, natural invariant values, unique bounded names and strict interval order; detach immutable snapshots and use distinct scalar/interval accessors with typed refusal.\",\n      \"requirement_id\": \"TFQM-STRONG-REVIEW-CHECK-TFQ-1052-FQCD-STRONG-COUPLING-AREA-LAW-1\",\n      \"symbols\": [\n        \"_invariant_name\",\n        \"SubgroupInvariantTable\",\n        \"SubgroupInvariantTable.__post_init__\",\n        \"SubgroupInvariantTable._claim_name\",\n        \"SubgroupInvariantTable.value\",\n        \"SubgroupInvariantTable.bounds\"\n      ],\n      \"tests\": [\n        \"StrongCouplingCheckerTests.test_invariant_table_refusals\",\n        \"StrongCouplingCheckerTests.test_invariant_table_snapshots_and_accessor_separation\",\n        \"StrongCouplingCheckerTests.test_supplied_tables_keep_exact_known_values\"\n      ]\n    },\n    {\n      \"requirement\": \"Compute the exact unit phase (c-i*s)^q using integer exponentiation by squaring. Admit |q| <= 4096 and reject combined numerator/denominator power estimates o