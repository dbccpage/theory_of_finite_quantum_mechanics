      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/check_tfq_1052_fqcd_strong_coupling_area_law.py\",\n    \"sha256\": \"77618e514855b104a320980f413fbd88e69eec35ce988f53b0ccb675510a4619\"\n  },\n  \"assessment_id\": \"strong-coupling-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Every declaration is mapped bidirectionally to tests/requirements. Formal scale definitions and physical assumptions are audited, supplied-table and consumer boundaries explicit, and origins/evidence digest-bound.\",\n    \"G2\": \"Exact integer/rational admission, factor-40 threshold matched to the formal definition, independently computed factorial/product/phase oracles, typed scalar/interval carriers, strict ordering and nonunit overlap properties.\",\n    \"G3\": \"Expected failures are typed; unsafe power work is refused before evaluation; zero divisors excluded; snapshots detach caller state. False checks, duplicate/malformed cases, recorder errors, resource failure and cancellation are exercised.\",\n    \"G4\": \"15 contract groups with deterministic generated properties, all 24 first-25 integration groups, strict pinned typing and normal/optimized runs pass. Of 73 retained mutants, 72 are killed and one is algebraically equivalent; raw survivors and test/manifest amendments remain auditable.\",\n    \"G5\": \"CCN 13, cognitive 6, nesting 2; at most one class. Integer parameters <=4096; rational input components <=4096 bits; combined exponent estimates <=65536 bits; phase uses O(log |q|) integer products. Direct overlap is fixed 2x2. Invariant tables admit <=32 scalar and <=32 interval rows with <=128-character unique names. Default run has 250 named obligations and fixed independent 8x8 determinant cases.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T07:14:21.627263+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_