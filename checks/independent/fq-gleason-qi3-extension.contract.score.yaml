014fc49a99fff244fcdae961db\"\n    }\n  ],\n  \"failure_policy\": \"Native closed schemas, whole collection/index admission and bounded exact numbers precede geometry. Constructors/private workers raise typed Violation; public fallible queries use Outcome and CLI returns nonzero for expected refusal. IO streams, temporary directories and test patches close/restore. RuntimeError, KeyboardInterrupt and SystemExit propagate. A resource refusal is not a mathematical disproof.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Closed7-field schema; at most512 rays of6 exact integers,1024 frames of4 integers and512 prescriptions of3 integers. All inputs, individual products, Hermitian terms/prefixes and certificate accumulators remain within4096 bits; temporary products at most8192bits before admission. O(rays+frames+prescriptions) fixed-width arithmetic work/storage, bounded gcd/hashing and three Hermitian products per frame. CLI file admission additionally uses1MiB/depth16 limits. Four negative controls use detached bounded records; no solver or model imports.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/BornGaussianRationalExtensionObstruction.lean\",\n      \"sha256\": \"aa68f3cdf925dcbe35b7aa2d23f51bc9bf1171963f060c8540988e5c77b1fb33\"\n    },\n    {\n      \"path\": \"dag/derivations/independent/fq-gleason-qi3-frame-functions.md\",\n      \"sha256\": \"0be4a26228d9d9291768f79efd128dbe918e7254a3919963d48a52696af4a9d0\"\n    },\n    {\n      \"path\": \"checks/independent/data/fq_gleason_qi3_extension.json\",\n      \"sha256\": \"fd0fd770fd92f7cb60203c2b813936717db74707e9e3ac5954fab3eaed0f226b\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"ExactJsonDocument owns immutable bytes up to1MiB, enforces16container nesting outside strings, and parses strictUTF8/exact4096-bit integers with duplicate/float/nonstandard-token rejection into detached trees.\",\n    \"GaussianExtensionCertificate owns nonzero content-one literal vectors, complete indexed nonzero-weight constraints and closed target/normalization metadata before geometry; no projective or symmetry quotient is assumed.\",\n    \"All three conjugate-left Hermitian frame products, prescribed real exotic values, literal-vector coefficient cancellation, RHS32 and f-to-g constant cancellation are replayed exactly.\",\n    \"Every arithmetic product, term, prefix and accumulator is checked within4096 bits before later cancellation. Ray/frame/prescription counts are bounded512/1024/512.\",\n    \"The four negative controls use detached copies; imports are quiet, state is per invocation, and existing CLI labels/default counts remain compatible.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit the closed native schema, exact target/normalization, syntactic40-lowercase-hex commit identifier and claimed RHS32. Primitive nonzero literal Gaussian integer6-vectors must be distinct. Preflight all constraint shapes, nonzero weights and indices before geometry; enforce finite collection and4096-bit bounds. No projective or symmetry identification is used.\",\n      \"requirement_id\": \"TFQM-EXTENSION-REVIEW-FQ-GLEASON-QI3-EXTENSION-1\",\n      \"symbols\": [\n        \"_bounded\",\n        \"_row\",\n        \"_schema\",\n        \"_rays\",\n        \"_records\",\n        \"GaussianExtensionCertificate\",\n        \"GaussianExtensionCertificate.__init__\",\n        \"GaussianExtensionCertificate.to_record\"\n      ],\n      \"test_source\": \"checks/tests/test_gaussian_extension_certificate.py\",\n      \"tests\": [\n        \"GaussianExtensionTests.test_closed_schema_metadata_and_exact_numbers\",\n        \"GaussianExtensionTests.test_whole_schema_admission_precedes_geometry\",\n        \"GaussianExtensionTests.test_owned_immutable_snapshot_and_detached_exports\",\n        \"GaussianExtensionTests.test_integer_products_prefixes_and_aggregate_budgets\",\n        \"GaussianExtensionTests.test_isolated_admission_terms_prescriptions_and_parser_guards\"\n      ]\n    },\n    {\n      \"requirement\": \"Compute conjugate-left Hermitian product with separately bounded products, terms and prefixes. For each owned primitive real ray, use the two-odd-coordinate modulo-four sign or zero. Replay all three orthogonality constraints per frame and exact prescribed exotic signs; accumulate literal-vector coefficients, constraint weight totals and weighted RHS.\",\n      \"requirement_id\": \"TFQM-EXTENSION-REVIEW-FQ-GLEASON-QI3-EXTENSION-2\",\n      \"symbols\": [\n        \"_inner\",\n        \"_sign\",\n        \"GaussianExtensionCertificate._frames\",\n        \"GaussianExtensionCertificate._prescriptions\"\n      ],\n      \"test_source\": \"checks/tests/test_gaussian_extension_certificate.py\",\n      \"tests\": [\n        \"GaussianExtensionTests.test_generated_hermitian_inner_matches_symbolic_algebra\",\n        \"GaussianExtensionTests.test_generated_real_sign_matches_residue_table\",\n        \"GaussianExtensionTests.test_full_symbolic_linear_certificate_and_geometry\",\n        \"GaussianExtensionTests.test_geometric_and_algebraic_forgery_refusals\",\n        \"GaussianExtensionTests.test_integer_products_prefixes_and_aggregate_budgets\",\n        \"GaussianExtensionTests.test_isolated_admission_terms_prescriptions_and_parser_guards\"\n      ]\n    },\n    {\n      \"requirement\": \"Require all literal-vector coefficients to cancel, RHS32, cancellation of the f-to-g constant term and allthree exotic signs. Verify using fresh per-call state and typed Outcome; independently compare every JSON frame,prescription and integer coefficient to Lean. The certificate proves only exclusion of the prescribed exotic extension, including signed functions.\",\n      \"requirement_id\": \"TFQM-EXTENSION-REVIEW-FQ-GLEASON-QI3-EXTENSION-3\",\n      \"symbols\": [\n        \"GaussianExtensionCertificate._verify\",\n        \"GaussianExtensionCertificate.verify\",\n        \"verify\"\n      ],\n      \"test_source\": \"checks/tests/test_gaussian_extension_certificate.py\",\n      \"tests\": [\n        \"GaussianExtensionTests.test_full_symbolic_linear_certificate_and_geometry\",\n        \"GaussianExtensionTests.test_all_lean_frame_prescription_and_weight_rows_match\",\n        \"GaussianExtensionTests.test_reindex_reorder_and_canceling_constraint_metamorphisms\",\n        \"GaussianExtensionTests.test_geometric_and_algebraic_forgery_refusals\",\n        \"GaussianExtensionTests.test_owned_immutable_snapshot_and_detached_exports\"\n      ]\n    },\n    {\n      \"requirement\": \"Compose bounded document read, exact parse and schema admission. Preserve CLIdefault/--certificate/--self-test and the four legacy rejection labels; all controls operate on detached copies and must refuse. Quiet import, repeatable invocation, nonzero expected failure, scoped file/capture/subprocess lifecycle and propagation of programming errors and cancellation.\",\n      \"requirement_id\": \"TFQM-EXTENSION-REVIEW-FQ-GLEASON-QI3-EXTENSION-4\",\n      \"symbols\": [\n        \"read_certificate\",\n        \"_negative_controls\",\n        \"_self_test\",\n        \"self_test\",\n        \"_main\",\n        \"main\"\n      ],\n      \"test_source\": \"checks/tests/test_gaussian_extension_certificate.py\",\n      \"tests\": [\n        \"GaussianExtensionTests.test_cli_legacy_fragments_repeated_runs_and_fail_closed\",\n        \"GaussianExtensionTests.test_expected_failure_and_cancellation_propagation\",\n        \"GaussianExtensionTests.test_owned_immutable_snapshot_and_detached_exports\",\n        \"GaussianExtensionTests.test_geometric_and_algebraic_forgery_refusals\"\n      ]\n    }\n  ],\n  \"role\": \"Owned Gaussian extension certificate aggregate and exact geometric/algebraic replay application\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"GaussianExtensionCertificate\",\n    \"GaussianExtensionCertificate.__init__\",\n    \"GaussianExtensionCertificate._frames\",\n    \"GaussianExtensionCertificate._prescriptions\",\n    \"GaussianExtensionCertificate._verify\",\n    \"GaussianExtensionCertificate.to_record\",\n    \"GaussianExtensionCertificate.verify\",\n    \"_bounded\",\n    \"_inner\",\n    \"_main\",\n    \"_negative_controls\",\n    \"_rays\",\n    \"_records\",\n    \"_row\",\n    \"_schema\",\n    \"_self_test\",\n    \"_sign\",\n    \"main\",\n    \"read_certificate\",\n    \"self_test\",\n    \"verify\"\n  ]\n}\n",
