      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/ads-cft-duality-import.py\",\n    \"sha256\": \"c67201bdad59b1460be9badf3517fe9f26bdf45f697c18fd96a5ef9422125e16\"\n  },\n  \"assessment_id\": \"ads-checker-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Every declaration is mapped to requirements/tests; exact origins and consumer references are audited, with finite/supplied-model boundaries and AuthorityEffect None.\",\n    \"G2\": \"Exact runtime admission, positive/nonnegative/integer and resource boundaries, signed-domain preservation, independent determinant/completed-square oracles and generated properties validate the stated model.\",\n    \"G3\": \"Expected failures are typed and nonzero at CLI; negative and injected-fault tests cover admitted boundaries. Finite bounded loops and valid matrix/tuple indices are reviewed. Imports/capture/process lifecycles preserve cancellation and restore state.\",\n    \"G4\": \"15 contract groups and 24 first-25 integration groups pass normal and optimized Python; pinned strict mypy passes. All 68 critical-path mutants are detected across the retained original run and two focused survivor reruns. The test-only amendment reconstructs the original hash and is explicitly retested.\",\n    \"G5\": \"CCN 3, cognitive 3, nesting 2; one class or fewer. Each rational input has at most 4096 numerator/denominator bits. Fixed-degree polynomial arithmetic uses polynomial bit complexity. The CLI has 829 executed check calls over a fixed 5 by 25 grid, five count triples and matrices no larger than 3 by 3; no input-controlled symbolic expression or loop is accepted.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T06:17:41.379608+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-ads-checkers.md\",\n      \"sha256\": \"82eb7de1859a056fc5d415e36690d070da624c94