ation.\",\n    \"Intermediate resource refusal can occur even when cancellation would produce a fitting exact result; this is a computational budget, not mathematical nonexistence.\",\n    \"No deficit angle, hinge holonomy,4-simplex, Regge complex, continuum equation, new Lean build or hosted CI is claimed. Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded exact cosine-law formulas and an independently supplied rational Cayley block; no Regge complex or continuum gravity.\",\n  \"consumer_boundary\": \"Executable path and exact/cos_num/cos_law/gamma/block_trace helper names remain. Signed/zero numerator inputs and all rational block parameters except+-1 retain their algebraic meaning, now under explicit4096-bit intermediate budgets. CayleyBlock owns the parameter and materializes the supplied4x4 matrix so trace is checked from entries; this is an explicit finite executable extension beyond the Lean scalar blockTrace definition, independently tested via a Cayley matrix oracle. The old compound prose checks are split into19 JSON-counted obligations. No external Python consumer of prose output was found. A cosine formula is not a triangle-admission function, the parameter is not derived from side lengths, and no deficit angle, hinge holonomy,4-simplex or continuum equation is claimed. Historical scientific receipts keep their original hashes.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-regge-gravity-fence\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-checker.md\",\n      \"sha256\": \"2c8a0cb010a3fb6472c939649bca4b52fc02545c0933b452f206d3ce4fee970f\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-initial-tests.py.txt\",\n      \"sha256\": \"2ec45545041a743fbcd14abef5ea3ed9198731566d035d2ce651638421e3635a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-mutations-closure.json\",\n      \"sha256\": \"49227191dee44786585b9dce0769ef8151858f978cf18545ab0e6d50dd4dc1bb\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-mutations.json\",\n      \"sha256\": \"fc94ba7d6c5bbbf0785e4ddb9eb6bdfc75e02acee5a21a600a673b8188288bc6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-quality-initial.json\",\n      \"sha256\": \"e0bd15ea3aca2dda61d4ec02ebe6aa1b449101b62ffc6a5ecd23c88e12a99ea3\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-quality.json\",\n      \"sha256\": \"249526b8a2afde6a39ae6516963e92f20b1e02e62ad84616dffd282a71bb544b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-requirements.json\",\n      \"sha256\": \"05c7efc8b779a1664ee7e60f9a33a9a69ef906e30cd09796e540d6b7fe8b2ba0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/regge_mutations.json\",\n      \"sha256\": \"2c140923e2631bb9e81e7ac2c50abd5d749b769436970f1ab022f9c96f53598a\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Exactly three rational scalar inputs and one rational block parameter, each numerator/denominator<=4096 bits. Each square, side product, denominator, sum, difference, quotient and trace prefix is admitted independently to that budget. Temporary rational binary arithmetic on admitted values is bounded before the next operation. A block owns three Fractions, constructs16 fixed matrix entries and accumulates4 diagonal entries; no variable-size enumeration. Fixed SymPy numerator expression has three variables and degree2. Default19 obligations =5 numerator identity/sample+8 length data+6 supplied-block checks.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldReggeGravityFence.lean\",\n    \"sha256\": \"09c0b7b66c1a4b90a66f96dc648c22a64ce5519a7a1f1401a217e0f05b6a6d80\"\n  },\n  \"owned_invariants\": [\n    \"Exact int/Fraction inputs exclude bool/float/foreign values; every square, product, denominator, sum, difference, quotient and trace prefix has4096-bit rational numerator/denominator limits.\",\n    \"Cosine-law computation is an algebraic signed-rational formula with nonzero2bc, admitted before numerator arithmetic; it does not validate triangles.\",\n    \"CayleyBlock owns a supplied rational parameter, bounded square and nonzero1-beta^2 denominator; both poles are rejected without a physical-velocity interpretation.\",\n    \"The supplied4x4 matrix consists of the rational symmetric2x2 Cayley block and two identity spectators; matrix and actual-diagonal trace operations return Outcome.\",\n    \"Default19 obligations preserve the numerator identity/samples,3-4-5 values, half-parameter block and both comparison inequalities.\",\n    \"Typed input/resource/check failures remain distinct from exact values, and cancellation/programming errors propagate.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact int/Fraction scalars, exclude bool/float/foreign values, and check every square, square sum and numerator difference. The cosine-law helper is the algebraic signed-rational formula, not a triangle validator; require nonzero2bc before numerator arithmetic and bound products, denominator and final quotient even if later cancellation would fit.\",\n      \"requirement_id\": \"TFQM-REGGE-REVIEW-DFM-REGGE-GRAVITY-FENCE-1\",\n      \"symbols\": [\n        \"exact\",\n        \"_numerator\",\n        \"cos_num\",\n        \"cos_law\"\n      ],\n      \"tests\": [\n        \"ReggeCheckerTests.test_cosine_formulas_against_gram_and_polynomial_oracles\",\n        \"ReggeCheckerTests.test_right_triangles_against_coordinate_projections\",\n        \"ReggeCheckerTests.test_fixed_values_signed_domain_and_parameter_separation\",\n        \"ReggeCheckerTests.test_invalid_domains_and_poles\",\n        \"ReggeCheckerTests.test_component_square_and_prefix_budgets\",\n        \"ReggeCheckerTests.test_denominator_budget_before_exact_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"CayleyBlock owns a supplied exact rational parameter, its bounded square and nonzero1-beta^2 denominator, excluding both poles but allowing signs and magnitudes above1. The parameter is not a velocity or a value inferred from lengths. Compute diagonal(1+beta^2)/(1-beta^2) and off-diagonal2beta/(1-beta^2) with checked intermediates.\",\n      \"requirement_id\": \"TFQM-REGGE-REVIEW-DFM-REGGE-GRAVITY-FENCE-2\",\n      \"symbols\": [\n        \"CayleyBlock\",\n        \"CayleyBlock.__init__\",\n        \"CayleyBlock._gamma\",\n        \"CayleyBlock._off_diagonal\",\n        \"gamma\"\n      ],\n      \"tests\": [\n        \"ReggeCheckerTests.test_cayley_matrix_trace_and_metric\",\n        \"ReggeCheckerTests.test_fixed_values_signed_domain_and_parameter_separation\",\n        \"ReggeCheckerTests.test_invalid_domains_and_poles\",\n        \"ReggeCheckerTests.test_component_square_and_prefix_budgets\",\n        \"ReggeCheckerTests.test_owned_parameter_and_railway_paths\"\n      ]\n    },\n    {\n      \"requirement\": \"Construct the supplied symmetric2x2 Cayley block plus two spectator identity entries as an owned4x4 RationalMatrix. Return matrix/trace through Outcome, accumulating the actual four diagonal entries with per-prefix budgets. Keep the legacy scalar block_trace helper. Cancellation and unexpected programming errors propagate.\",\n      \"requirement_id\": \"TFQM-REGGE-REVIEW-DFM-REGGE-GRAVITY-FENCE-3\",\n      \"symbols\": [\n        \"CayleyBlock._matrix\",\n        \"CayleyBlock.matrix\",\n        \"CayleyBlock._trace\",\n        \"CayleyBlock.trace\",\n        \"block_trace\"\n      ],\n      \"tests\": [\n        \"ReggeCheckerTests.test_cayley_matrix_trace_and_metric\",\n        \"ReggeCheckerTests.test_fixed_values_signed_domain_and_parameter_separation\",\n        \"ReggeCheckerTests.test_component_square_and_prefix_budgets\",\n        \"ReggeCheckerTests.test_owned_parameter_and_railway_paths\",\n        \"ReggeCheckerTests.test_actual_trace_accumulation_and_fault_propagation\"\n      ]\n    },\n    {\n      \"requirement\": \"Require Cases recorders and preserve the symbolic numerator identity, four signed/zero sample triples, the3-4-5 data, independently supplied half-parameter block and both inequality controls. Split former compound predicates into19 counted obligations and emit JSON with a nonzero executable failure exit. No hinge/deficit/simplex/continuum conclusion follows.\",\n      \"requirement_id\": \"TFQM-REGGE-REVIEW-DFM-REGGE-GRAVITY-FENCE-4\",\n      \"symbols\": [\n        \"_cases\",\n        \"check_numerator_identity\",\n        \"check_lengths\",\n        \"check_block\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ReggeCheckerTests.test_counts_guards_and_counterexample\",\n        \"ReggeCheckerTests.test_executable_cli_and_failure_exit\",\n        \"ReggeCheckerTests.test_fixed_values_signed_domain_and_parameter_separation\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded exact cosine-formula and supplied rational-block verification application with owned Cayley parameter, explicit intermediate budgets, Railway matrix/trace operations and scientific scope separation\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"CayleyBlock\",\n    \"CayleyBlock.__init__\",\n    \"CayleyBlock._gamma\",\n    \"CayleyBlock._matrix\",\n    \"CayleyBlock._off_diagonal\",\n    \"CayleyBlock._trace\",\n    \"CayleyBlock.matrix\",\n    \"CayleyBlock.trace\",\n    \"_cases\",\n    \"_numerator\",\n    \"block_trace\",\n    \"check_block\",\n    \"check_lengths\",\n    \"check_numerator_identity\",\n    \"cos_law\",\n    \"cos_num\",\n    \"exact\",\n    \"gamma\",\n    \"main\"\n  ]\n}\n",
