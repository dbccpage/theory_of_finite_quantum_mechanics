      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/dfm-regge-gravity-fence.py\",\n    \"sha256\": \"5d14869f19d5aa96dbd3a1cfc5a8e4b98839b1427663b33f880bde80ab83ca6b\"\n  },\n  \"assessment_id\": \"regge-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Full Lean origin and current consumers audited; every declaration and nested ownership maps bidirectionally to tested requirements, with finite claim ceiling.\",\n    \"G2\": \"Exact signed-rational formula domains and per-operation budgets; independent Cayley matrix inversion, generated coordinate-projection right triangles, fixed witness values and explicit poles/parameter separation.\",\n    \"G3\": \"Frozen owned parameter/matrix values, nonzero-denominator admission before dependent arithmetic, conservative square/denominator/trace-prefix limits, typed Railway operations and nonzero executable exits; scoped mocks/captures/runpy/subprocess lifecycle preserves cancellation and programming errors.\",\n    \"G4\": \"Strict pinned typing;12 Regge and24 integration groups pass normal/optimized runs;80 deterministic examples per property. All32 critical candidates detected. Original31 detections and one denominator-budget survivor remain; an exactly additive case has denominator4097 bits but reduced quotient4096/4096 bits, so it isolates the required intermediate refusal. Actual matrix trace and executable failure paths are challenged.\",\n    \"G5\": \"CCN 5, cognitive 2, nesting 1; at most one class. Exactly three rational scalar inputs and one rational block parameter, each numerator/denominator<=4096 bits. Each square, side product, denominator, sum, difference, quotient and trace prefix is admitted independently to that budget. Temporary rational binary arithmetic on admitted values is bounded before the next operation. A block owns three Fractions, constructs16 fixed matrix entries and accumulates4 diagonal entries; no variable-size enumeration. Fixed SymPy numerator expression has three variables and degree2. Default19 obligations =5 numerator identity/sample+8 length data+6 supplied-block checks.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T10:30:53.314844+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-checker.md\",\n      \"sha256\": \"2c8a0cb010a3fb6472c939649bca4b52fc02545c0933b452f206d3ce4fee970f\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-initial-tests.py.txt\",\n      \"sha256\": \"2ec45545041a743fbcd14abef5ea3ed9198731566d035d2ce651638421e3635a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-mutations-closure.json\",\n      \"sha256\": \"49227191dee44786585b9dce0769ef8151858f978cf18545ab0e6d50dd4dc1bb\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-mutations.json\",\n      \"sha256\": \"fc94ba7d6c5bbbf0785e4ddb9eb6bdfc75e02acee5a21a600a673b8188288bc6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-quality-initial.json\",\n      \"sha256\": \"e0bd15ea3aca2dda61d4ec02ebe6aa1b449101b62ffc6a5ecd23c88e12a99ea3\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-quality.json\",\n      \"sha256\": \"249526b8a2afde6a39ae6516963e92f20b1e02e62ad84616dffd282a71bb544b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-regge-requirements.json\",\n      \"sha256\": \"05c7efc8b779a1664ee7e60f9a33a9a69ef906e30cd09796e540d6b7fe8b2ba0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0