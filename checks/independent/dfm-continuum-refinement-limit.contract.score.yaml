      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/dfm-continuum-refinement-limit.py\",\n    \"sha256\": \"e61e1c31a0a2b6732464f85eccdebc86bcdd7ad9847cd8e5b867f4594ac633db\"\n  },\n  \"assessment_id\": \"refinement-limit-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Full Lean origin and current consumers audited; every declaration and nested ownership maps bidirectionally to tested requirements, with finite claim ceiling.\",\n    \"G2\": \"Exact bool-word/rational/permutation domains, checked callback results and accumulators, independent recursive partition/sum/group-action oracles and full S3 composition/inverse census.\",\n    \"G3\": \"Owned immutable dyadic words, depth/combined-length preflight before callbacks, conservative accumulator bounds, typed input/resource/check failures and explicit trusted-callback/cancellation lifecycle.\",\n    \"G4\": \"Strict pinned typing;13 refinement-limit and24 integration groups pass normal/optimized runs;80 deterministic examples per property. All35 mutation candidates detected. Initial34 detections and the coherent-inverse survivor remain; two added endpoint assignments use a non-involutive start to remove an accidental symmetry of the original fixture. Scope expansion and exact additive-test custody are recorded.\",\n    \"G5\": \"CCN 5, cognitive 4, nesting 2; at most one class. Input words<=64 bool bits; depth0..12 and total word length<=64. Refinement creates<=4096 immutable words, O(2^depth*(word_length+depth)) work/storage. Scalar/ordered transport invoke a trusted synchronous callback once per leaf, at most4096 times; callback execution cost is external to this bound. Exact scalar edges and every accumulation have<=4096-bit numerator/denominator; S3 operations use exactly three integer labels. Fixed fixture words have length<=3, scalar depths<=9, S3 depths<=6. Default14642 obligations =14336 scalar+306 noncommutative; no convergence search is performed.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T09:46:22.907434+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-checker.md\",\n      \"sha256\": \"41af1774de2e8b36cc9f0652fe3e5956e911bc3de6a32ee2f3a59ca6c711acb6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-initial-tests.py.txt\",\n      \"sha256\": \"d855b19b038c81e5dea19f8fba8d8e3ca313e91342ea6ac49d9a88edb7515313\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-mutations-closure.json\",\n      \"sha256\": \"47983ff917f673c21daba03d7c0e715d870a22c6bde7a854aad681d46bff93ec\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-mutations.json\",\n      \"sha256\": \"e34afdb9ca7db8bd9b5ce3464437a7f7a884b336cc6d74f198c5cbcd1c939f13\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-quality-initial.json\",\n      \"sha256\": \"a603637b35f6f76be66f6746be8054f86c76adee5ed271f8028deeb5adc455bc\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-quality.json\",\n      \"sha256\": \"30871fbd700f3da9bc6ca91cf54022c0035b016af46239fa1164bac3ba458810\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-requirements.json\",\n      \"sha256\": \"2947eb71eb46a7cfdfd377c2d4275e1e8328ebba5547b8b226473c53025fb861\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\