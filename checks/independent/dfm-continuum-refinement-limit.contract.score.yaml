    \"sha256\": \"176d4963a8b105acd0ce145ed477370fbb08de3269fd5f82f3811cf2ed2d3bd3\",\n      \"state\": \"current local consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"Callbacks are trusted synchronous repository functions; call counts are bounded, arbitrary callback execution time is not.\",\n    \"The complete metric, refinement family, geometric split bound and uniformity hypotheses are supplied to the separate Lean statements.\",\n    \"These finite controls do not prove completeness, convergence, continuity, smoothness or field dynamics.\",\n    \"Additional non-involutive endpoint fixtures challenge the coherent formula beyond the original fixed gauge family.\",\n    \"No new Lean build, hosted CI or higher-tier assurance is claimed. Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded exact dyadic-cell refinement with rational and S3 transport; separate analytic results require supplied completeness and decay hypotheses.\",\n  \"consumer_boundary\": \"Executable path and all prior callable entry points remain. Legacy leaf ordering and list format, little-endian words, permutation order and14642-obligation receipt remain. Scalar callbacks now exclude bool/float/foreign values and every exact accumulation has a4096-bit budget. DyadicCell owns immutable words and adds Outcome operations. Deep scalar/control loops are factored into small functions; fixed fixture generation has no arbitrary size argument. Callbacks are trusted synchronous repository functions, not untrusted code or a bounded-time service. The Lean origin supplies completeness, metric and geometric-decay hypotheses; no scientific DAG status is promoted.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-continuum-refinement-limit\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-checker.md\",\n      \"sha256\": \"41af1774de2e8b36cc9f0652fe3e5956e911bc3de6a32ee2f3a59ca6c711acb6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-initial-tests.py.txt\",\n      \"sha256\": \"d855b19b038c81e5dea19f8fba8d8e3ca313e91342ea6ac49d9a88edb7515313\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-mutations-closure.json\",\n      \"sha256\": \"47983ff917f673c21daba03d7c0e715d870a22c6bde7a854aad681d46bff93ec\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-mutations.json\",\n      \"sha256\": \"e34afdb9ca7db8bd9b5ce3464437a7f7a884b336cc6d74f198c5cbcd1c939f13\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-quality-initial.json\",\n      \"sha256\": \"a603637b35f6f76be66f6746be8054f86c76adee5ed271f8028deeb5adc455bc\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-quality.json\",\n      \"sha256\": \"30871fbd700f3da9bc6ca91cf54022c0035b016af46239fa1164bac3ba458810\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-refinement-limit-requirements.json\",\n      \"sha256\": \"2947eb71eb46a7cfdfd377c2d4275e1e8328ebba5547b8b226473c53025fb861\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/refinement_limit_mutations.json\",\n      \"sha256\": \"196d05f155757dbc7586ce7a8da95383d902d910765afa6cc10e9037483de608\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Input words<=64 bool bits; depth0..12 and total word length<=64. Refinement creates<=4096 immutable words, O(2^depth*(word_length+depth)) work/storage. Scalar/ordered transport invoke a trusted synchronous callback once per leaf, at most4096 times; callback execution cost is external to this bound. Exact scalar edges and every accumulation have<=4096-bit numerator/denominator; S3 operations use exactly three integer labels. Fixed fixture words have length<=3, scalar depths<=9, S3 depths<=6. Default14642 obligations =14336 scalar+306 noncommutative; no convergence search is performed.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldRefinementLimit.lean\",\n    \"sha256\": \"19ff11d132d403af3df0b05d760411a9394d25fc0b36b4e8b7fdb1f06309f1af\"\n  },\n  \"owned_invariants\": [\n    \"DyadicCell owns a little-endian bool word<=64 bits; refinement depth0..12 and combined word length<=64 are preflighted.\",\n    \"Refinement yields<=4096 immutable leaves in interval order; callback execution occurs once per leaf until refusal.\",\n    \"Scalar callback outputs and every accumulated sum must be exact int/Fraction values within4096-bit numerator/denominator budgets.\",\n    \"S3 labels are exactly the integers0,1,2; later factors compose on the left and invalid callback permutations are refused.\",\n    \"Aggregate refinement/scalar/ordered methods return Outcome; cancellation and unexpected programming failures propagate.\",\n    \"The original14642 obligations remain, split14336 scalar and306 noncommutative; no numerical search for a continuum limit occurs.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Own a little-endian bool word of at most64 bits, compute exact rational endpoints, and enumerate its binary descendants in increasing interval order. Preflight exact depth0..12 and combined64-bit length before allocating leaves. Return Outcome from refinement and preserve the legacy detached list-of-tuples export.\",\n      \"requirement_id\": \"TFQM-REFINEMENT-REVIEW-DFM-CONTINUUM-REFINEMENT-LIMIT-1\",\n      \"symbols\": [\n        \"DyadicCell\",\n        \"DyadicCell.__init__\",\n        \"DyadicCell.endpoints\",\n        \"DyadicCell._refined_words\",\n        \"DyadicCell.refine\",\n        \"endpoints\",\n        \"leaves\"\n      ],\n      \"tests\": [\n        \"RefinementLimitTests.test_cells_partition_against_recursive_oracle\",\n        \"RefinementLimitTests.test_cell_ownership_and_resource_boundaries\",\n        \"RefinementLimitTests.test_word_depth_and_callback_preflight\",\n        \"RefinementLimitTests.test_railway_callbacks_recorders_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Require a callable edge assignment, validate words/depth before invoking it, and call each leaf once. Scalar transport accepts only exact int/Fraction callback results and bounds each accumulation. Ordered transport validates each S3 callback result and multiplies later factors on the left. Aggregate methods return Outcome; expected failures/cancellation retain their declared behavior.\",\n      \"requirement_id\": \"TFQM-REFINEMENT-REVIEW-DFM-CONTINUUM-REFINEMENT-LIMIT-2\",\n      \"symbols\": [\n        \"_callback\",\n        \"DyadicCell._scalar\",\n        \"DyadicCell.scalar\",\n        \"DyadicCell._ordered\",\n        \"DyadicCell.ordered\",\n        \"scalar_transport\",\n        \"ordered_transport\"\n      ],\n      \"tests\": [\n        \"RefinementLimitTests.test_scalar_transport_against_recursive_oracle\",\n        \"RefinementLimitTests.test_ordered_transport_against_recursive_action\",\n        \"RefinementLimitTests.test_scalar_edge_exactness_and_accumulator_budget\",\n        \"RefinementLimitTests.test_ordered_edge_refusal_and_callback_snapshot\",\n        \"RefinementLimitTests.test_word_depth_and_callback_preflight\",\n        \"RefinementLimitTests.test_railway_callbacks_recorders_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit each permutation as exactly the three integer labels0,1,2, excluding bool/float/duplicates. Implement composition as function composition and inverse as the inverse permutation.\",\n      \"requirement_id\": \"TFQM-REFINEMENT-REVIEW-DFM-CONTINUUM-REFINEMENT-LIMIT-3\",\n      \"symbols\": [\n        \"mul\",\n        \"inv\"\n      ],\n      \"tests\": [\n        \"RefinementLimitTests.test_permutation_full_census_and_domains\",\n        \"RefinementLimitTests.test_ordered_transport_against_recursive_action\",\n        \"RefinementLimitTests.test_ordered_edge_refusal_and_callback_snapshot\"\n      ]\n    },\n    {\n      \"requirement\": \"Use the fixed15-word fixture population and explicit Cases recorders. Factor the original geometric grid into word/depth checks without changing obligations. Check exact leaf sums, split envelopes, binary2q accumulation and endpoint-gauge telescoping; preserve alternating perturbations, the omitted-binary-factor negative control and the excluded q=1/2 threshold. Private fixture parameters/callbacks are trusted exact values, not a new general convergence API.\",\n      \"requirement_id\": \"TFQM-REFINEMENT-REVIEW-DFM-CONTINUUM-REFINEMENT-LIMIT-4\",\n      \"symbols\": [\n        \"_cases\",\n        \"_words\",\n        \"_scalar_gauge\",\n        \"_geometric_edge\",\n        \"_scalar_dressed\",\n        \"_check_geometric_depth\",\n        \"_check_geometric_word\",\n        \"_check_geometric_family\",\n        \"_alternating_edge\",\n        \"_check_alternating_word\",\n        \"_critical_edge\",\n        \"_check_threshold\",\n        \"scalar_controls\"\n      ],\n      \"tests\": [\n        \"RefinementLimitTests.test_geometric_and_threshold_closed_forms\",\n        \"RefinementLimitTests.test_scalar_transport_against_recursive_oracle\",\n        \"RefinementLimitTests.test_fixed_controls_counts_receipt_and_negative_challenges\",\n        \"RefinementLimitTests.test_railway_callbacks_recorders_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Use the declared finite S3 endpoint and edge assignments to verify all216 associativity triples, six inverses,75 covariance cases, two explicit order/inverse counterexample detectors and seven zero-defect coherent-tower controls. Main counts14642 executed obligations and declares supplied analytic hypotheses rather than claiming finite tests prove completeness/continuity.\",\n      \"requirement_id\": \"TFQM-REFINEMENT-REVIEW-DFM-CONTINUUM-REFINEMENT-LIMIT-5\",\n      \"symbols\": [\n        \"_permutation_gauge\",\n        \"_permutation_edge\",\n        \"_permutation_dressed\",\n        \"_coherent_edge\",\n        \"_check_noncommutative_word\",\n        \"noncommutative_controls\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"RefinementLimitTests.test_ordered_transport_against_recursive_action\",\n        \"RefinementLimitTests.test_permutation_full_census_and_domains\",\n        \"RefinementLimitTests.test_coherent_fixture_with_noninvolutive_start_gauge\",\n        \"RefinementLimitTests.test_fixed_controls_counts_receipt_and_negative_challenges\",\n        \"RefinementLimitTests.test_railway_callbacks_recorders_and_cancellation\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded exact dyadic-cell transport verification application with an owned word value object, checked scalar/permutation callbacks, Railway operations and factored geometric/covariance controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"DyadicCell\",\n    \"DyadicCell.__init__\",\n    \"DyadicCell._ordered\",\n    \"DyadicCell._refi