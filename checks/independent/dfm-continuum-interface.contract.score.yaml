 ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Connection<=4096 named labels, each1..64 characters and exact integer2x2 determinant-one matrix. Signed/fixed-graph paths<=4096 steps. Admission and transport are O(labels+steps) fixed2x2 operations with4096-bit stored entries and product/dot/determinant budgets. Conservative intermediate refusal may reject a mathematically valid large SL2 matrix or product. Fixed-graph dressing uses the supplied paths of length<=2. Additive inputs/outputs<=4096 bits. Default511 executed obligations,85 loop words and255 append cases. Path-law fixture prefixes<=4095 to reserve one suffix step.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldContinuumInterface.lean\",\n    \"sha256\": \"3f1ecf2586d69c69db693eba7867a68daafea77f6834dfb26b6369f9125d3f9b\"\n  },\n  \"owned_invariants\": [\n    \"Connection owns<=4096 labels with bounded nonempty names and immutable integer2x2 determinant-one matrices.\",\n    \"Stored entries and matrix products/dot/determinant intermediates have4096-bit budgets; conservative refusal precedes possible cancellation.\",\n    \"Signed words<=4096 steps admit every orientation and label before multiplication; later factors stand on the left.\",\n    \"Fixed-graph walks must compose; dressing uses inverse target transport, edge and source transport in that order.\",\n    \"Graph maps are immutable supplied data. Footprints validate complete signed syntax; additive values exclude bool/float.\",\n    \"Fixture prefixes<=4095 reserve one suffix step; default511 obligations cover85 loop words and255 append cases.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Validate nonempty bounded edge names, fixed-graph membership and exact integer2x2 determinant-one matrices before algebra. Reject bool/float/symbolic/fractional entries, oversized arithmetic and determinant-1 matrices. Export detached immutable SymPy matrices while using the reviewed rational matrix value internally.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-1\",\n      \"symbols\": [\n        \"_name\",\n        \"_graph_edge\",\n        \"_det_one\",\n        \"_export\",\n        \"mat\",\n        \"_sl2\",\n        \"eye\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_matrix_and_scalar_domains\",\n        \"ContinuumInterfaceTests.test_label_admission_and_unused_matrices\",\n        \"ContinuumInterfaceTests.test_connection_and_export_snapshot_ownership\",\n        \"ContinuumInterfaceTests.test_resource_boundaries_and_conservative_arithmetic\"\n      ]\n    },\n    {\n      \"requirement\": \"Own the complete bounded label dict, including unused entries, as a frozen aggregate over a read-only mapping of immutable rational matrices. Legacy validated_labels returns a new dict of immutable exported values.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-2\",\n      \"symbols\": [\n        \"SL2Connection\",\n        \"SL2Connection.__init__\",\n        \"validated_labels\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_connection_and_export_snapshot_ownership\",\n        \"ContinuumInterfaceTests.test_label_admission_and_unused_matrices\",\n        \"ContinuumInterfaceTests.test_resource_boundaries_and_conservative_arithmetic\"\n      ]\n    },\n    {\n      \"requirement\": \"Snapshot each signed word, require exact integer orientation+1/-1, validate names/step shape/budget and reject any unlabelled step before multiplication. Later factors stand on the left; negative orientation inverts the factor. Footprint is the set of validated names and needs no connection. Public aggregate path returns Outcome; legacy path_transport exports exact matrices.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-3\",\n      \"symbols\": [\n        \"_signed_path\",\n        \"footprint\",\n        \"SL2Connection._path\",\n        \"SL2Connection.path\",\n        \"path_transport\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_signed_transport_group_and_footprint_oracle\",\n        \"ContinuumInterfaceTests.test_signed_path_and_footprint_refusals\",\n        \"ContinuumInterfaceTests.test_fixed_graph_admission_and_whole_word_preflight\",\n        \"ContinuumInterfaceTests.test_recorders_railway_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit only composable forward walks on the fixed four-edge graph, allowing any valid start vertex and the empty walk. Require all four labels for dressing. Use inverse target transport times edge label times source transport; keep a separate explicit chord formula. Fixed graph and root paths are immutable supplied data, not a spanning-tree proof.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-4\",\n      \"symbols\": [\n        \"SL2Connection._tree\",\n        \"SL2Connection.tree\",\n        \"SL2Connection._complete_graph\",\n        \"SL2Connection._dress\",\n        \"SL2Connection.dress\",\n        \"transport\",\n        \"dress\",\n        \"formula\",\n        \"incident\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_fixed_graph_dressing_and_tree_walk_oracle\",\n        \"ContinuumInterfaceTests.test_fixed_graph_admission_and_whole_word_preflight\",\n        \"ContinuumInterfaceTests.test_connection_and_export_snapshot_ownership\",\n        \"ContinuumInterfaceTests.test_recorders_railway_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit exact signed integer additive labels and bounded output, preserving the target minus sign and source/edge contributions. This is the abelian specialization only.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-5\",\n      \"symbols\": [\n        \"_bounded_integer\",\n        \"additive_dress\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_additive_specialization\",\n        \"ContinuumInterfaceTests.test_matrix_and_scalar_domains\"\n      ]\n    },\n    {\n      \"requirement\": \"Use exact Cases recorders and execute the retained fixed nonlocality witnesses. Path-law fixture helper explicitly admits x/y words with x/y/outside labels and reserves the suffix budget. Verify reverse, outside stability, changed-label certificate and append order on85 words; reject invalid paths. Main reports511 executed obligations and typed nonzero CLI failures; cancellation propagates.\",\n      \"requirement_id\": \"TFQM-CONTINUUM-REVIEW-DFM-CONTINUUM-INTERFACE-6\",\n      \"symbols\": [\n        \"_cases\",\n        \"check_additive\",\n        \"check_identity_matrices\",\n        \"check_noncommutative_order\",\n        \"check_star_enumeration\",\n        \"check_path_laws\",\n        \"check_general_dependencies\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ContinuumInterfaceTests.test_fixture_scope_and_guard_types\",\n        \"ContinuumInterfaceTests.test_default_counts_and_fixed_fault_detection\",\n        \"ContinuumInterfaceTests.test_recorders_railway_and_cancellation\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded finite SL2 connection verification application with owned immutable labels, typed signed/fixed-graph transport, rooted dressing and dependency controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"SL2Connection\",\n    \"SL2Connection.__init__\",\n    \"SL2Connection._complete_graph\",\n    \"SL2Connection._dress\",\n    \"SL2Connection._path\",\n 