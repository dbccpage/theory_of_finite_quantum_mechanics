nonzero.\",\n    \"No executable assertions are relied on; regression verifies normal and optimized Python.\",\n    \"Exact numerical paths reject unadmitted floats and booleans at the repaired input boundaries.\"\n  ],\n  \"purpose\": \"Independent verification script for CQFT-REEH-SCHLIEDER-THEOREM-IMPORT (TFQ-2106).\\n\\nAuthorityEffect: None.\\nVerifies all three finite/algebraic components and non-equivalence fences in\\nlean4/ReehSchliederImport.lean from first principles:\\n1. A recorded 2x4 integer matrix with a zero column keeps that column under left multiplication,\\n   and a recorded right-kernel vector is annihilated. The abstract cyclicity-to-separating proof\\n   stays in the Lean module.\\n2. Unnormalized integer representatives of 3-qubit states |000>, |GHZ_3>, and |W_3>, and unnormalized 4-qubit half-system matrices for\\n   |0000>, |GHZ_4>, and the 2-Bell-pair state: zero columns, pair left inverses, and full-algebra\\n   left inverses.\\nNonzero rescaling preserves ranks and zero columns, but changes left inverses.\\n3. The product vacuum |000> has the same single-site unfolding at every site. Modular aliasing\\n   remains a Lean theorem and is not repeated here. Continuum Stone and tube analyticity stay open.\",\n  \"role\": \"independent finite checker\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"mat_mul\",\n    \"mat_id\",\n    \"combine_single_site\",\n    \"single_site_matrix\",\n    \"pair_site_matrix\",\n    \"verify_commutant_duality_and_kernel_obstruction\",\n    \"check_three_qubit_unfoldings\",\n    \"check_full_system_inverses\",\n    \"check_four_qubit_unfoldings\",\n    \"verify_three_and_four_qubit_census\",\n    \"verify_discrete_translation_fence\",\n    \"main\"\n  ]\n}\n",
