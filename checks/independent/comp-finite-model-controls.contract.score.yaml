        ]
      },
      {
        "requirement": "Validate an exact one-hole context and rule index, returning its replacement under the global 64-symbol admission limit. apply is a raw witness operation: search max_length is enforced separately. Ordered successor enumeration includes empty-left insertion at the final position and only emits words within max_length.",
        "requirement_id": "TFQM-COMPUTATION-REVIEW-COMP-FINITE-MODEL-CONTROLS-2",
