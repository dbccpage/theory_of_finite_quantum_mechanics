          "ComputationControlTests.test_model_schema_and_word_boundaries"
        ]
      },
      {
        "requirement": "Breadth-first search returns an owned shortest path, successful None only for completed bounded exhaustion or an out-of-bound target, or a typed input/resource refusal. Validate source/target/budgets before identity. At most 4096 retained states and 65536 rule-offset trials; reserve each expansion before doing work, include the initial state, never overwrite a visited parent and return on first goal discovery.",
