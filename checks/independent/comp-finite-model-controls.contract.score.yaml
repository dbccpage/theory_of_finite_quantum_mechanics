        "requirement": "Own a frozen alphabet and distinct nested rule snapshots. Admit 1..32 distinct symbols in 0..4095, <=32 rules, words <=64 symbols and max_length 0..64. Empty rule sides are valid. Reject bool/float, malformed shapes, unknown symbols and over-budget sequences before use.",
