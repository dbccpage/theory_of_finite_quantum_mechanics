      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/comp-finite-model-controls.py\",\n    \"sha256\": \"b5d1b9e477bc32075c31e1db0f7ae4cba267e6c58fd5c7f3fb3233abc1b0556b\"\n  },\n  \"assessment_id\": \"computation-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Every declaration maps bidirectionally to requirements/tests; six finite origins and historical/current consumers audited. The source-retirement manifest and regression migration preserve provenance and finite claim boundaries.\",\n    \"G2\": \"Exact bounded integer words, immutable owned rules, validated one-hole replacement, BFS shortest paths and exact trace witnesses; independent context-graph and layer fixed-point oracles plus explicit oracle metatests.\",\n    \"G3\": \"Typed malformed/witness/resource failure distinctions, conservative pre-expansion budget reservation, no false unreachability on exhaustion, validated ignored parameters, local search state and scoped import/capture/mock/process ownership.\",\n    \"G4\": \"Strict pinned typing; 16 computation, 24 integration and 15 AdS/lifecycle groups pass normal and optimized execution. 64/64 retained critical-path mutants detected; raw 61/64 run and three selector-only reruns retained. Prior unchanged regression logic retains its independently recorded mutation evidence and exact migration diff.\",\n    \"G5\": \"CCN 13, cognitive 17, nesting 4; one class at most. Alphabet <=32, rules <=32, words <=64 symbols, retained search states <=4096, reserved rule-offset trials <=65536. Each trial compares/copies at most 128 symbols before filtering to 64. Search memory O(states * word length); trace snapshot <=4096 *64 symbols, then bounded rule trials. Helper naturals <=4096 bits. Default receipt executes 50 obligations.\"\n  },\n  \"composite_grade\": \"B\",\n  \"evaluation_timestamp\": \"2026-11-03T07:53:43.891635+00:00\",\n  \"evidence\": [\n    {\n    