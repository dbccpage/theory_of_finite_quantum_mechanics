,\n    \"Source mutation sensitivity is separate from four incorrect-expression mathematical witnesses.\",\n    \"No continuous-time generator, new Lean build, hosted CI or DAG promotion is claimed. Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Finite S3 clock schedules, endpoint coordinates and supplied rational matrix controls; no continuous-time generator.\",\n  \"consumer_boundary\": \"Executable path and matrix/S3 helper names remain; exact3-permutation and bounded matrix admission replaces unchecked generic indexing. Legacy frames/closure tuples/tags are preserved. PermutationSchedule owns links/frames and exposes Railway closure, blocks, histories, coordinate and endpoint-change operations. Internal regression helpers now require Cases; no external Python caller was found. Default CLI is JSON with347936 actual obligations. Removing the outer cycle-regression empty guard is typed-boundary equivalent because _blocks still refuses before checks, modulo or products; only noncanonical wrapper human text differs. Full Lean origin states arbitrary-group results; this executable checks bounded S3 and supplied rational matrices, without constructing a continuous-time generator or promoting DAG status. Historical scientific receipts retain original hashes.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-relational-time-fence\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-checker.md\",\n      \"sha256\": \"c8e8706f22387c46a04a2f95f5d921b619835c256f3f2fed52b4e69943135b16\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-initial-tests.py.txt\",\n      \"sha256\": \"763dcd1fa26df651f2dd747898c79341db1362284e87605f3899e91089bd9447\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-mutations-closure.json\",\n      \"sha256\": \"ec008ac00c736350a2508012949ca43750c9de2daa7bb35c61942f173673ae7f\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-mutations.json\",\n      \"sha256\": \"3c844a75a468ad134548e7d00a8301f95766fb03d6559a9d6e57b29c95004e53\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-quality-initial.json\",\n      \"sha256\": \"6758aebb9e70331cb2bf8cbb9714aedd4e2cfd88cc182ef9c92e14f229d8f6ee\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-quality.json\",\n      \"sha256\": \"0be4ad5d5a8fb5b286988fe099e7a93c345a330fa05855777007599e2472f983\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-relational-time-requirements.json\",\n      \"sha256\": \"c9687a8e20954729dc8e8a750b9ba1bc7f330c512beeab3a7a86633fe6445a0a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/relational_time_mutations.json\",\n      \"sha256\": \"ea2b1afd286850319a33b0f811b809b78ae470c833ae70dea27d67b90e152072\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"N=0..64 owned S3 links, N+1<=65 frames/gauges/states. Constructor and each schedule operation use O(N) time/storage with constant-size permutations. Each cycle control uses12 bounded gauge choices and3 state histories, O(N). Matrices have1..64 rows/columns and4096-bit rational components/products/dot prefixes via RationalMatrix; packed clock is fixed8x8. Default6+36+216+1296=1554 schedules,259 closed and1295 nonclosing,347936 actual obligations =15 matrix+347862 cycle+1 empty-period+54 constant-power+4 incorrect-expression witnesses.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldRelationalTimeFence.lean\",\n    \"sha256\": \"0a6ce2dcad77e401ace44109d9fa453443e03a418e10d79915181ad9dd1833d5\"\n  },\n  \"owned_invariants\": [\n    \"Exactly admitted S3 permutations and states0..2; owned immutable0..64 links and at most65 chronological frames/gauges/history states.\",\n    \"Identity-rooted frames place later links on the left; closure distinguishes empty period, nonidentity holonomy and closed nonempty schedule.\",\n    \"Cyclic blocks are interior identities and final holonomy; endpoint changes and history coordinates apply target gauge inverses with correct chronological orientation.\",\n    \"Valid nonevolving histories return successful false; closed/blocks refuse empty period while algebraic history/change operations remain meaningful.\",\n    \"RationalMatrix supplies bounded owned rectangular arithmetic with1..64 dimensions and4096-bit components/products/dot prefixes.\",\n    \"Default347936 checks cover1554 S3 schedules and the fixed rational packed clock; failures use Railway outcomes and executable nonzero exits.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Snapshot nonempty rectangular rational matrices through RationalMatrix, require matching dimensions and exact vector length, exclude bool/foreign scalar values and bound each component/product/dot prefix. Export immutable tuples. Fixed matrix helpers preserve rectangular semantics.\",\n      \"requirement_id\": \"TFQM-RELATIONAL-TIME-REVIEW-DFM-RELATIONAL-TIME-FENCE-1\",\n      \"symbols\": [\n        \"mat\",\n        \"mul\",\n        \"transp\",\n        \"apply\"\n      ],\n      \"tests\": [\n        \"RelationalTimeTests.test_matrix_vector_operations_against_symbolic_oracle\",\n        \"RelationalTimeTests.test_packed_clock_and_fixed_control_counts\",\n        \"RelationalTimeTests.test_guard_faults_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit exactly S3 permutations and exact integer states0..2. Compose a after b and invert bijectively. Own0..64 links before construction and chronological identity-rooted frames with later links on the left. Gauge/history inputs have exactly N+1 values, at most65.\",\n      \"requirement_id\": \"TFQM-RELATIONAL-TIME-REVIEW-DFM-RELATIONAL-TIME-FENCE-2\",\n      \"symbols\": [\n        \"_compose\",\n        \"compose\",\n        \"_inverse\",\n        \"inverse\",\n        \"_state\",\n        \"_gauges\",\n        \"_history\",\n        \"PermutationSchedule\",\n        \"PermutationSchedule.__init__\",\n        \"frames\"\n      ],\n      \"tests\": [\n        \"RelationalTimeTests.test_full_s3_census_and_exact_domains\",\n        \"RelationalTimeTests.test_frames_seams_closure_and_histories\",\n        \"RelationalTimeTests.test_snapshot_ownership_and_all_railway_refusals\",\n        \"RelationalTimeTests.test_empty_boundary_and_full_period_budget\",\n        \"RelationalTimeTests.test_noninvolutive_endpoint_fixture\"\n      ]\n    },\n    {\n      \"requirement\": \"Keep canonical closure tags emptyPeriod/nontrivialHolonomy/ok; closed returns the same owned schedule only for a nonempty identity holonomy. Blocks refuse an empty period and compute interior identities with final seam holonomy using cyclic frames. Nonclosing blocks remain valid values.\",\n      \"requirement_id\": \"TFQM-RELATIONAL-TIME-REVIEW-DFM-RELATIONAL-TIME-FENCE-3\",\n      \"symbols\": [\n        \"PermutationSchedule.closure_tag\",\n        \"PermutationSchedule._closed\",\n        \"PermutationSchedule.closed\",\n        \"PermutationSchedule._blocks\",\n        \"PermutationSchedule.blocks\",\n        \"closure\"\n      ],\n      \"tests\": [\n        \"RelationalTimeTests.test_frames_seams_closure_and_histories\",\n        \"RelationalTimeTests.test_empty_boundary_and_full_period_budget\",\n        \"RelationalTimeTests.test_noninvolutive_endpoint_fixture\",\n        \"RelationalTimeTests.test_noninvolutive_evolution_direction\"\n      ]\n    },\n    {\n      \"requirement\": \"Endpoint changes are target-gauge inverse * link * source gauge. Histories use frame action on an admitted initial state; evolves checks every chronological link including noninvolutions and returns successful false for valid nonevolving histories. Coordinates use inverse endpoint gauge, preserve evolution iff and yield stationary coordinates for evolving histories. Return all dependent operations through Outcome; empty algebraic histories/change remain meaningful.\",\n      \"requirement_id\": \"TFQM-RELATIONAL-TIME-REVIEW-DFM-RELATIONAL-TIME-FENCE-4\",\n      \"symbols\": [\n        \"PermutationSchedule._changed\",\n        \"PermutationSchedule.changed\",\n        \"PermutationSchedule._history\",\n        \"PermutationSchedule.history\",\n        \"PermutationSchedule._evolves\",\n        \"PermutationSchedule.evolves\",\n        \"PermutationSchedule._coordinates\",\n        \"PermutationSchedule.coordinates\"\n      ],\n      \"tests\": [\n        \"RelationalTimeTests.test_endpoint_gauges_preserve_arbitrary_history_evolution\",\n        \"RelationalTimeTests.test_noninvolutive_endpoint_fixture\",\n        \"RelationalTimeTests.test_noninvolutive_evolution_direction\",\n        \"RelationalTimeTests.test_frames_seams_closure_and_histories\",\n        \"RelationalTimeTests.test_snapshot_ownership_and_all_railway_refusals\",\n        \"RelationalTimeTests.test_empty_boundary_and_full_period_budget\"\n      ]\n    },\n    {\n      \"requirement\": \"Require Cases recorders; count every finite predicate. Separate packed8x8 D^TWD versus shift, vector recovery, all short schedules, obstruction iff, twelve gauge choices and incorrect-expression witnesses. Cycle/gauge regression wrappers refuse empty inputs before recording checks; wrapper human diagnostic text is not canonical. Cancellation/programming errors propagate and CLI failures exit nonzero.\",\n      \"requirement_id\": \"TFQM-RELATIONAL-TIME-REVIEW-DFM-RELATIONAL-TIME-FENCE-5\",\n      \"symbols\": [\n        \"_cases\",\n        \"_vector_controls\",\n        \"_packed_product\",\n        \"matrix_regression\",\n        \"_gauge_controls\",\n        \"gauge_regression\",\n        \"_cycle_controls\",\n        \"cycle_regression\",\n        \"fault_regression\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"RelationalTimeTests.test_packed_clock_and_fixed_control_counts\",\n        \"RelationalTimeTests.test_noninvolutive_endpoint_fixture\",\n        \"RelationalTimeTests.test_empty_boundary_and_full_period_budget\",\n        \"RelationalTimeTests.test_guard_faults_and_cancellation\",\n        \"RelationalTimeTests.test_full_enumeration_and_executable_failure_exit\"\n      ]\n    }\n  ],\n  \"role\": \"Finite-clock verification application with owned bounded S3 schedules, chronological frames, closure/seam decisions, reversible endpoint coordinates and exact rational packed-clock controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"PermutationSchedule\",\n    \"PermutationSchedule.__init__\",\n    \"PermutationSchedule._blocks\",\n    \"PermutationSchedule._changed\",\n    \"PermutationSchedule._closed\",\n    \"PermutationSchedule._coordinates\",\n    \"PermutationSchedule._evolves\",\n    \"PermutationSchedule._history\",\n    \"PermutationSchedule.blocks\",\n    \"PermutationSchedule.changed\",\n    \"PermutationSchedule.closed\",\n    \"PermutationSchedule.closure_tag\",\n    \"PermutationSchedule.coordinates\",\n    \"PermutationSchedule.evolves\",\n    \"PermutationSchedule.history\",\n    \"_cases\",\n    \"_compose\",\n    \"_cycle_controls\",\n    \"_gauge_controls\",\n    \"_gauges\",\n    \"_history\",\n    \"_inverse\",\n    \"_packed_product\",\n    \"_state\",\n    \"_vector_controls\",\n    \"apply\",\n    \"closure\",\n    \"compose\",\n    \"cycle_regression\",\n    \"fault_regression\",\n    \"frames\",\n    \"gauge_regression\",\n    \"inverse\",\n    \"main\",\n    \"mat\",\n    \"matrix_regression\",\n    \"mul\",\n    \"transp\"\n  ]\n}\n",
