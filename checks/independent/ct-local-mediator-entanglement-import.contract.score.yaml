\"sha256\": \"6db2afe9ebf10698783c6559994644cafc150aeee19aff2c7ccd1d62f14150a4\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-norm-bound-amendment.json\",\n      \"sha256\": \"a39cd6c875e7b63956640da3ae72d81fa64ea055b42b4d009cb007253f7fc514\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality-before-norm-bound.json\",\n      \"sha256\": \"5694dbead8cd02a1c32d19fee4192748ed2852cfc10ff7ff01749ab1236bda57\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality-initial.json\",\n      \"sha256\": \"3c3c4dd736c159632994c2fb1860f6ce9f71359b5713fda2c591511bcc5bf8bf\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-quality.json\",\n      \"sha256\": \"83174820bfc49aa98b55b51e04ea71bbcaf69e40da00ed7cc56556d0f7d9bff6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor-theory-requirements.json\",\n      \"sha256\": \"66997304cadfb0f3290921d706c52e0f9479328eafd6c37ba9c0cc1f3a33a9e0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-constructor_theory-mutations.json\",\n      \"sha256\": \"24e30263529a99ebe0e10494eac2f3c19d82a0d16f673cc2ca80dc972a34923a\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/constructor_theory_mutations.json\",\n      \"sha256\": \"4ddc767683ba0587cefbcb5c33644eff6d0b84289acb6626c602b7024da58f4a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-checker-infrastructure.md\",\n      \"sha256\": \"513c66bcb4425d16dfcca24c6a0d70cc1eca9fc5e8d38d5c3a716419af73584b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-requirements.json\",\n      \"sha256\": \"f35bc30bc1c7251fa92dae0adfddd6c7d694781fc3eb4bcbbeeba3db5847cafd\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-composed.json\",\n      \"sha256\": \"90fe9ad62d24997d73c0062bcf90ed8490a8096754308b9af5db9b75a9567961\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-swap-equivalence.md\",\n      \"sha256\": \"737f0bb2b6f63cc40181ccefc569ab55b473e08db23dce0d7a61fb27f46f2a24\"\n    }\n  ],\n  \"failure_policy\": \"Exact runtime input/shape/resource gates precede dependent indexing and arithmetic. Internal typed Violation is translated by evaluate into Outcome and by cli into a diagnostic/nonzero status. Task methods return Outcome; Gaussian operators remain internal typed-exception operations used through evaluation boundaries. Cases admits exact bool and unique identifiers. Expected input/resource/check/duplicate failures are distinct; cancellation and unexpected programming failures propagate. Test mocks, captures and import registration restore ownership.\",\n  \"nested_declaration_ownership\": {\n    \"check_kron_vectorisation_matches_AMBT.vec\": {\n      \"owned_by\": \"check_kron_vectorisation_matches_AMBT\",\n      \"requirements_via\": \"check_kron_vectorisation_matches_AMBT\"\n    },\n    \"check_rank_nonincrease_exact_family.nxt\": {\n      \"owned_by\": \"check_rank_nonincrease_exact_family\",\n      \"requirements_via\": \"check_rank_nonincrease_exact_family\"\n    },\n    \"check_rank_nonincrease_exact_family.rand\": {\n      \"owned_by\": \"check_rank_nonincrease_exact_family\",\n      \"requirements_via\": \"check_rank_nonincrease_exact_family\"\n    }\n  },\n  \"operational_cost\": \"Symbolic expressions have fixed2x2 dimensions and fixed variable sets, with no caller-supplied expressions. The deterministic rank family has300 matrices with dimensions<=5 and entries generated from -3..3, including rank-one products. Phase input components<=4096 bits; derived norm/defect/normalizer/denominator/result admitted to4096 bits. Intermediate Gaussian norm components are bounded by fixed operations on those inputs, with no unbounded iterative algebra. Default318 attempted require calls in seven groups; false obligations stop the run.\",\n  \"origin\": {\n    \"path\": \"lean4/ConstructorTheoryMediatorEntanglement.lean\",\n    \"sha256\": \"370825e363db8a2687c082c86b7038f8acb8a672ba9f367528f5d2eb5768d468\"\n  },\n  \"owned_invariants\": [\n    \"FiniteProductTask owns one frozen total row-major endofunction table; each dimension1..64 and at most4096 outputs.\",\n    \"Composition has exact ordered shape equality; inverse requires bijectivity; parallel carrier budgets are preflighted.\",\n    \"Gaussian stored components have at most4096-bit numerators and denominators; the exact squared norm is allowed the separately stated larger bit bound.\",\n    \"The concurrence consumer admits every derived rational to4096 bits and never clips a result.\",\n    \"Default information/mediator counts are18/318 actual require calls; the mediator has seven groups, not seven obligations.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Use an explicit Cases recorder or create one for a direct group invocation. Reject foreign recorder objects. Count actual require calls, preserve typed mathematical failure and cancellation, and print318 obligations across seven groups on the default successful run.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-LOCAL-MEDIATOR-ENTANGLEMENT-IMPORT-1\",\n      \"symbols\": [\n        \"_cases\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_mediator_counts_recorders_and_symbolic_failures\",\n        \"ConstructorTheoryTests.test_cli_resources_cancellation_and_task_result_refusal\"\n      ]\n    },\n    {\n      \"requirement\": \"Check fixed symbolic determinant multiplicativity and the nonzero/zero M00 charts, pure product determinant preservation and row-major Kronecker vectorisation. A supplied product-vector branch is a pair of local maps; it does not establish a mediator model or general LOCC behavior.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-LOCAL-MEDIATOR-ENTANGLEMENT-IMPORT-2\",\n      \"symbols\": [\n        \"check_symbolic_local_action_determinant\",\n        \"check_product_state_zero_determinant\",\n        \"check_product_branch_preservation\",\n        \"check_kron_vectorisation_matches_AMBT\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_mediator_counts_recorders_and_symbolic_failures\"\n      ]\n    },\n    {\n      \"requirement\": \"Use the correct norm for the general two-qubit phase family and its exact Pythagorean unit phase. The reusable API admits Gaussian-rational input, bounds derived values and returns exact normalized concurrence rather than a clipped number or an unnormalized determinant expression.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-LOCAL-MEDIATOR-ENTANGLEMENT-IMPORT-3\",\n      \"symbols\": [\n        \"check_phase_family_determinant_and_concurrence\",\n        \"check_exact_pythagorean_concurrence\",\n        \"normalized_concurrence_squared\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_concurrence_against_complex_matrix_normalization\",\n        \"ConstructorTheoryTests.test_unit_phase_concurrence\",\n        \"ConstructorTheoryTests.test_concurrence_domain_budget_and_extremes\",\n        \"ConstructorTheoryTests.test_mediator_counts_recorders_and_symbolic_failures\"\n      ]\n    },\n    {\n      \"requirement\": \"Recreate the deterministic300-case rank family locally per invocation, including rectangular and deficient matrices. Check rank(A M B^T)<=rank(M), count all300 attempts and report91 strict decreases. Independent forward elimination must reproduce all600 rank observations and both displayed counts.\",\n      \"requirement_id\": \"TFQM-CT-REVIEW-CT-LOCAL-MEDIATOR-ENTANGLEMENT-IMPORT-4\",\n      \"symbols\": [\n        \"check_rank_nonincrease_exact_family\"\n      ],\n      \"tests\": [\n        \"ConstructorTheoryTests.test_rank_family_against_independent_elimination\",\n        \"ConstructorTheoryTests.test_mediator_counts_recorders_and_symbolic_failures\"\n      ]\n    }\n  ],\n  \"role\": \"Exact symbolic and finite pure-state verification application with typed per-run recorders, normalized bounded Gaussian-phase concurrence, independently replayed rank cases and explicit mediator-claim boundaries\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"_cases\",\n    \"check_exact_pythagorean_concurrence\",\n    \"check_kron_vectorisation_matches_AMBT\",\n    \"check_phase_family_determinant_and_concurrence\",\n    \"check_product_branch_preservation\",\n    \"check_product_state_zero_determinant\",\n    \"check_rank_nonincrease_exact_family\",\n    \"check_symbolic_local_action_determinant\",\n    \"main\",\n    \"normalized_concurrence_squared\"\n  ]\n}\n",
