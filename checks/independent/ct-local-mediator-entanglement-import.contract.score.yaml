y; CLI refusals exit nonzero.\",\n    \"No executable assertions are relied on; regression verifies normal and optimized Python.\",\n    \"Exact numerical paths reject unadmitted floats and booleans at the repaired input boundaries.\"\n  ],\n  \"purpose\": \"Independent check for Campaign Target 3: CT-LOCAL-MEDIATOR-ENTANGLEMENT-IMPORT\\nAuthorityEffect: None.\\nOutcome: Narrowed (finite shadow; the node stays IMPORTED_ASSUMPTION).\\n\\nVerifies (exact arithmetic; no floats):\\n1. Exact symbolic multiplicativity of 2x2 determinant under local maps A M B^T.\\n2. Product state determinant vanishing: det(a (x) b) = 0, preserved under A (x) B.\\n3. The coefficient matrix of (A (x) B) psi is A M B^T (row-major vectorisation, via the\\n   Kronecker product), the formula the Lean module takes as its definition of a local map.\\n4. Exact phase family determinant det(M_u) = (u - 1)/4 and normalized C^2 = 4|u - 1|^2 / (3 + |u|^2)^2; for |u|=1 this is |u-1|^2/4.\\n5. Exact Pythagorean unit phase u = (3 + 4i)/5 has |u|^2 = 1 and C^2 = 1/5.\\n6. Product-vector Kraus branch A_i (x) B_j keeps determinant 0.\\n7. rank(A M B^T) <= rank(M) on a deterministic family of exact rational matrices of\\n   several (non-square) shapes, including rank-deficient M and singular A, B.\\n\\nNot checked (and not claimed): mixed states, channels with ancillas, mixtures, LOCC, any\\nmediating system, gravity. Items 1 to 7 are a finite spot-check and a symbolic identity, not a\\nproof of the general rank inequality; that is the Lean theorem schmidtRank_local_le.\\n\\nImports checker infrastructure only; no production implementation.\",\n  \"role\": \"independent finite checker\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"check_symbolic_local_action_determinant\",\n    \"check_product_state_zero_determinant\",\n    \"check_phase_family_determinant_and_concurrence\",\n    \"check_exact_pythagorean_concurrence\",\n    \"check_locc_kraus_branch_preservation\",\n    \"check_kron_vectorisation_matches_AMBT\",\n    \"check_rank_nonincrease_exact_family\",\n    \"normalized_concurrence_squared\",\n    \"main\"\n  ]\n}\n",
