ts/test_lineon_checker.py\",\n      \"sha256\": \"379f6ae72f3b11f769275f8be69074d1121e4dbf24d7a4768b912dbac9baf4fa\",\n      \"state\": \"new contract suite\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"246b22e4c2e7065b918d61c23d99b7a4c76c30faeb942c8487104dc81a985c8a\",\n      \"state\": \"proposed workflow\"\n    }\n  ],\n  \"boundaries\": [\n    \"No general negative-trace implication from noncommutation, no Hamiltonian sign-free theorem, no Lean build or hosted CI run is inferred.\",\n    \"Projection and mass are scalar toy rules; routing has two labels; the Y-junction negative sign is supplied convention.\",\n    \"The pinned SymPy boundary constructs exact symbolic expressions and supplies a separate matrix oracle. Shared Gaussian implementations are dependencies, not independent witnesses.\",\n    \"Historical records retain bytes and scope; label 5 is a retention decision.\"\n  ],\n  \"bounded_context\": \"Finite lineon path ownership, exact Gaussian holonomy, symbolic scalar angles and literal toy sign/routing rules; no physical sign-free promotion.\",\n  \"consumer_boundary\": \"Standalone path and JSON schema/count remain intact. Legacy tuple witness keeps site-priority and -1 semantics; validate_unit_trajectory now returns its immutable admitted snapshot. The Lean path configurations encode ordered endpoints, and its site-IVT theorem has a stronger relative-step bound than simultaneous unit hops. Toy scalar/routing rules and supplied Y sign do not establish the withdrawn physical sign-free claim. General symbolic angles are intentionally unevaluated exact expressions.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:check_tfq_1219_fsp_hinge_lineon_sign_claim\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-checker.md\",\n      \"sha256\": \"8752de13891c74dcb8caa98ef45ef5ff55765c69a6c8123aac363e608c210ce3\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-requirements.json\",\n      \"sha256\": \"f6e714e2a73a968c1a989b5ea220c8ef9c13754267e91ea536458c49bf9f2a93\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-quality.json\",\n      \"sha256\": \"203a011aff1d40b625e5832d4be603934a143497732a64e44840a8815632f6af\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-mutations.json\",\n      \"sha256\": \"f220f08ba26d4551bba16854d3ef85b9b15093f5198101dd4662590400b0b150\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-mutations-initial-manifest.json\",\n      \"sha256\": \"afbe8f3cfb5b30dd240ceab6261398c33586354cf8e8bb9cdcf44de42b443825\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-lineon-mutations-closure.json\",\n      \"sha256\": \"1aeae01d9c0374eaf9c01d3e04b3f9ca1e584464cbe4731df3dbfd20043cd7d6\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/lineon_mutations.json\",\n      \"sha256\": \"d18090d1c09ea16942e0e11bb55c718c184be9baf7a5beab7280663f0ad5375a\"\n    }\n  ],\n  \"failure_policy\": \"Exact input/schema gates admit positions, unit hops, matrices, flags and scalar traces before dependent operations. Paths own detached snapshots; mathematical no-witness/invalid order is distinct from malformed description and undefined parity. Cases rejects malformed/duplicate status rows. Expected input/resource/check/duplicate failures pass through evaluate/Outcome to nonzero CLI diagnostics. Cancellation and unexpected programming errors propagate; test captures/mocks restore state.\",\n  \"operational_cost\": \"Positions and rational input components <=4096 bits; <=4096 simultaneous hops or trajectory samples; O(n) validation and order/witness scans, intermediate positions need at most 4097 bits. Exact holonomy is fixed 2x2 with bounded shared Gaussian components. Symbolic curvature constructs one unevaluated acos or returns a fixed integral value. Default receipt has 77 obligations.\",\n  \"origin\": {\n    \"path\": \"lean4/FoliatedFracton2Gauge.lean\",\n    \"sha256\": \"94233fe48aa785080384879d7b92735fd6a03e7f4b90973f853c0a04b41c0bc9\"\n  },\n  \"owned_invariants\": [\n    \"LineonPath has exact bounded integer starts and immutable unit-hop tuples; no caller-owned list is used after admission.\",\n    \"Witness site/edge priority and -1 semantics are explicit; simultaneous unit hops are distinguished from the stronger Lean relative-step premise.\",\n    \"Trace/scalar operations are exact; flags require bool and general symbolic acos is not evaluated.\",\n    \"Exactly 77 default named obligations, one per conjunction; all failures are retained.\",\n    \"At most one class per source, no production assert, strict pinned typing.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact positions up to 4096 bits and at most 4096 simultaneous unit hops. The frozen LineonPath owns detached nested tuple snapshots. Mathematical order/collision failure is false; malformed paths and undefined permutation parity are typed refusals.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-1\",\n      \"symbols\": [\n        \"_position\",\n        \"LineonPath\",\n        \"LineonPath.__init__\",\n        \"LineonPath.preserves_order\",\n        \"verify_1d_lineon_collision_avoidance\",\n        \"compute_lineon_permutation_parity\"\n      ],\n      \"tests\": [\n        \"LineonCheckerTests.test_path_order_against_site_and_edge_oracle\",\n        \"LineonCheckerTests.test_snapshot_ownership_and_validation_use_the_same_data\",\n        \"LineonCheckerTests.test_path_domains_and_resource_extremes\"\n      ]\n    },\n    {\n      \"requirement\": \"Validate and snapshot unit trajectories before observation. Swapped ordered endpoints and equal nonzero lengths are required for an exchange witness. Preserve legacy (bool,index) result: prefer first site meeting, otherwise first left-to-right edge start; no exchange is (False,-1). Simultaneous unit hops permit edge crossings and are broader than the Lean relative-step<=1 site theorem.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-2\",\n      \"symbols\": [\n        \"validate_unit_trajectory\",\n        \"verify_discrete_ivt_collision_site\"\n      ],\n      \"tests\": [\n        \"LineonCheckerTests.test_unit_trajectory_and_ivt_input_refusals\",\n        \"LineonCheckerTests.test_ivt_site_edge_and_nonexchange_witness_semantics\",\n        \"LineonCheckerTests.test_ivt_generated_swaps_have_a_valid_witness\",\n        \"LineonCheckerTests.test_snapshot_ownership_and_validation_use_the_same_data\"\n      ]\n    },\n    {\n      \"requirement\": \"Validate both GaussianMatrix2 operands before inversion, use exact shared operations and return commutator trace. Singular or resource-exceeding operations refuse through the shared boundary. No inference from noncommutation to negative trace or from type alone to SU(2) membership.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-3\",\n      \"symbols\": [\n        \"compute_commutator_holonomy_trace\"\n      ],\n      \"tests\": [\n        \"LineonCheckerTests.test_commutator_against_symbolic_matrix_oracle\",\n        \"LineonCheckerTests.test_matrix_boundaries_and_singular_inverse\",\n        \"LineonCheckerTests.test_default_receipt_and_sections_have_unique_exact_statuses\"\n      ]\n    },\n    {\n      \"requirement\": \"Require exact bool flags and exact rational traces; projection is the literal identity/square toy rule, defect mass is a sign indicator and routing is a closed two-label truth table. Validate both flags before branch short circuit.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-4\",\n      \"symbols\": [\n        \"_flag\",\n        \"evaluate_foliated_projected_trace\",\n        \"compute_defect_mass_phi1\",\n        \"evaluate_terminal_routing\"\n      ],\n      \"tests\": [\n        \"LineonCheckerTests.test_projection_mass_and_routing_are_literal_toy_rules\",\n        \"LineonCheckerTests.test_trace_and_flag_refusals_precede_branching\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit a scalar exact trace in [-2,2]; return exact symbolic acos(trace/2), simplifying only five integral traces and suppressing general symbolic evaluation. The result alone does not certify any matrix domain.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-5\",\n      \"symbols\": [\n        \"compute_curvature_gamma2\"\n      ],\n      \"tests\": [\n        \"LineonCheckerTests.test_curvature_is_exact_bounded_symbolic_construction\",\n        \"LineonCheckerTests.test_trace_and_flag_refusals_precede_branching\"\n      ]\n    },\n    {\n      \"requirement\": \"Compose fixed path, matrix, trace-map and Y-junction cases through Cases. The default 77 unique obligations count each conjunction once. The Y exchange sign is supplied convention, no general fermionic weight result. Keep truthful JSON/nonzero CLI, invocation ownership, typed resources and cancellation.\",\n      \"requirement_id\": \"TFQM-LINEON-REVIEW-CHECK-TFQ-1219-FSP-HINGE-LINEON-SIGN-CLAIM-6\",\n      \"symbols\": [\n        \"check_lineon_paths\",\n        \"check_holonomy_examples\",\n        \"check_toy_projection_and_r