      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/check_tfq_1050_fqcd_wilson_dirac_gamma5_hermiticity.py\",\n    \"sha256\": \"b5aeeb696fb4f8901e0da3ca4f220fa385ab9c52023dfb9eee2d24d567028c52\"\n  },\n  \"audited_consumers\": [\n    {\n      \"path\": \"dag/theory_of_finite_qm.jsonl\",\n      \"sha256\": \"3f731a626fd2287ddb67a1ce3816cf1b897eb58eab5334950f3378d93662ae57\"\n    },\n    {\n      \"path\": \"docs/evidence/stages/FINITE_QCD.md\",\n      \"sha256\": \"6fa1a211fbea4cc6e90179510dd63fb15d9ff9178b714dc6f7c1dff3449c30b0\"\n    },\n    {\n      \"path\": \"docs/evidence/nodes/FQCD-WILSON-DIRAC-GAMMA5-HERMITICITY.md\",\n      \"sha256\": \"e1e725161414713d4d0d9b5478879c2d36ca68126838b1ac840eae202102f3dc\"\n    },\n    {\n      \"path\": \"dag/research/pr492_review/validation.json\",\n      \"sha256\": \"5c89279bb3254842e66b90270836ab537ff19a122b48ef846e6ee5288dfe6af0\"\n    },\n    {\n      \"path\": \"dag/fragments/unified_dag.json\",\n      \"sha256\": \"c7845b4f150f45fece1c97988789f0c2ea458b088cfa20db09f43bc6fff0d753\"\n    },\n    {\n      \"path\": \"dag/evidence/evidence_map.json\",\n      \"sha256\": \"6cbb3bb0a72c75d5b557f508ef8cf01fea3adea16db23c3e4e14725e2022e64f\"\n    },\n    {\n      \"path\": \"dag/derivation_dag.json\",\n      \"sha256\": \"7b656c2fa36e943f1cf821534ea60b6a953bd0f2aed82889e7f39e6dc4e6e586\"\n    },\n    {\n      \"path\": \"dag/derivations/17_finite_qcd/tfq_1050_fqcd_wilson_dirac_gamma5_hermiticity.md\",\n      \"sha256\": \"26c1314e31904912a4dd41eeec0e0ee278da464306f364e78882cf1ecd9ae4c8\"\n    },\n    {\n      \"path\": \"checks/tests/test_wilson_checker.py\",\n      \"sha256\": \"6ea7cb0a6408ea7b9860b90c3cffc9aa4c86411128581dcd6ba45b3470bc7e90\",\n      \"state\": \"new contract suite\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"be4626109deaabccf84379728081c8b1f865fdf88eed2f2fa86e15b9b00c0a58\",\n      \"state\": \"proposed workflow\"\n    }\n  ],\n  \"boundaries\": [\n    \"No continuum or arbitrary-carrier theorem, physical identification or hosted CI result is inferred.\",\n    \"The Lean origin supplies stated Clifford and algebraic facts; the Python finite operator check does not establish an unproved Lean theorem.\",\n    \"Shared helpers are dependencies; separate Bareiss/matrix oracles supply independent verification.\",\n    \"Historical evidence and scores retain their original bytes/scope. File label 5 is a retention decision.\"\n  ],\n  \"bounded_context\": \"Finite Wilson operator verification and truthful named-obligation receipts; no arbitrary-carrier or continuum promotion.\",\n  \"consumer_boundary\": \"Preserves the standalone TFQ-1050 script and its 110-obligation JSON schema. The Lean origin supplies Clifford and polynomial/block facts and explicitly does not state gamma5 D gamma5 = D adjoint. Finite Python checks do not close the arbitrary-carrier bridge.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:check_tfq_1050_fqcd_wilson_dirac_gamma5_hermiticity\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-checker.md\",\n      \"sha256\": \"43214f2f1c7cf7b0d649a475e439985ab9181cb2dc55c02b1f200fdc8ec85a69\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-requirements.json\",\n      \"sha256\": \"b2196232dec0ae1b00494515e472728515100a60c0a73717cce34a63caffbef0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-quality.json\",\n      \"sha256\": \"1384b66bbff2726185424052e81a466a2220c6c9e888b24c4953d79b660959a4\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-wilson-mutations.json\",\n      \"sha256\": \"5f89c8c419c54f77db52e99a2724d70ae14844785b4d13225a504fa8cc469a95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/wilson_mutations.json\",\n      \"sha256\": \"5cf81e0b6f066dd0e42079f27c5f2bf88f8b397ca38911d410e49ba9f62da000\"\n    }\n  ],\n  \"failure_policy\": \"Cases rejects malformed status/identity and duplicate IDs. The CLI maps expected input/resource/check/duplicate failures to nonzero typed diagnostics; false mathematical cases remain named failures in the receipt. Unexpected programming errors and cancellation propagate. No persistent mutable case state or external resource is owned by the checker; test mocks/captures are context-managed.\",\n  \"operational_cost\": \"Fixed 110 obligations: 92 chiral/link/onsite and 18 determinant/matrix cases. The imported support admits bounded exact rationals, fixed 8x8 determinants and one finite four-spin/two-color operator; there is no external input or unbounded search.\",\n  \"origin\": {\n    \"path\": \"lean4/FermionSignWilsonDiracGamma5.lean\",\n    \"sha256\": \"ff846e497a572038d084022f188dfb1ec05affba46ff2c8c652a2c4f1cd3664e\"\n  },\n  \"owned_invariants\": [\n    \"Exactly 110 named obligations for the default finite fixtures; each conjunction is one obligation, not many.\",\n    \"Exact Fraction computations and validated shared rational/matrix boundaries; no float coercion.\",\n    \"At most one class per file, no production assert and strict pinned typing.\",\n    \"The d=2/4 section checks chiral-sign identities; only the separately assembled fixture constructs four-dimensional gamma matrices.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Check only the declared chiral-sign, finite rational link grid and independently tabulated onsite coefficients; do not call the sign identities a Clifford construction.\",\n      \"requirement_id\": \"TFQM-WILSON-REVIEW-CHECK-TFQ-1050-FQCD-WILSON-DIRAC-GAMMA5-HERMITICITY-1\",\n      \"symbols\": [\n        \"check_chiral_links\"\n      ],\n      \"tests\": [\n        \"WilsonCheckerTests.test_section_obligations_are_exact_booleans_and_named\",\n        \"WilsonCheckerTests.test_complete_receipt_and_repeatability\"\n      ]\n    },\n    {\n      \"requirement\": \"Compare the general-r polynomial against an independent exact matrix determinant, retain a nonunit-r counterexample and assembled four-spin colored-operator check.\",\n      \"requirement_id\": \"TFQM-WILSON-REVIEW-CHECK-TFQ-1050-FQCD-WILSON-DIRAC-GAMMA5-HERMITICITY-2\",\n      \"symbols\": [\n        \"check_determinant_examples\"\n      ],\n      \"tests\": [\n        \"WilsonCheckerTests.test_direct_determinant_fault_cannot_hide_behind_polynomial\",\n        \"WilsonCheckerTests.test_assembled_matrix_fault_is_a_failed_case_and_nonzero_cli\",\n        \"WilsonCheckerTests.test_section_obligations_are_exact_booleans_and_named\"\n      ]\n    },\n    {\n      \"requirement\": \"Each invocation owns its Cases; reject duplicate IDs and non-bool statuses, retain every failed case and count exactly the executed named obligations.\",\n      \"requirement_id\": \"TFQM-WILSON-REVIEW-CHECK-TFQ-1050-FQCD-WILSON-DIRAC-GAMMA5-HERMITICITY-3\",\n      \"symbols\": [\n        \"check\"\n      ],\n      \"tests\": [\n        \"WilsonCheckerTests.test_generated_named_cases_are_counted_without_loss\",\n        \"WilsonCheckerTests.test_malformed_statuses_and_duplicate_ids_are_refused\",\n        \"WilsonCheckerTests.test_complete_receipt_and_repeatability\"\n      ]\n    },\n    {\n      \"requirement\": \"Emit a truthful JSON receipt and nonzero status on failure; convert expected resource failures to typed diagnostics while cancellation propagates.\",\n      \"requirement_id\": \"TFQM-WILSON-REVIEW-CHECK-TFQ-1050-FQCD-WILSON-DIRAC-GAMMA5-HERMITICITY-4\",\n      \"symbols\": [\n        \"main\"\n      ],\n      \"tests\": [\n        \"WilsonCheckerTests.test_assembled_matrix_fault_is_a_failed_case_and_nonzero_cli\",\n        \"WilsonCheckerTests.test_cancellation_and_resource_failures_keep_distinct_semantics\",\n        \"WilsonCheckerTests.test_complete_receipt_and_repeatability\"\n      ]\n    }\n  ],\n  \"role\": \"Exact finite Wilson verification application with named result ownership, validated case collection, independent matrix integration, and typed CLI failure semantics\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"check\",\n    \"check_chiral_links\",\n    \"check_determinant_examples\",\n    \"main\"\n  ]\n}\n",
