-qm062-u1-residues-import.py.txt\",\n      \"sha256\": \"d669032e35b188a5b468b87a72fd6b9ce367b836a0e022e2e759b32beadaeb42\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/discrete_dynamics_mutations.json\",\n      \"sha256\": \"d660b49334cb554f3343d2b921acb48abdc6f32babf2ab5ccef58f3fff818939\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Map carrier N1..4; each owned image/state exact0..N-1. Composition O(N); exponent0..4096 uses at most13 loop iterations and25 compositions. Root search enumerates at most4^4=256 candidate maps, O(N*N^N) time and at most256 owned results. Integer inputs/results and each polynomial square/product/prefix bounded to4096 bits; raw integer multiply/add at most8192/4097 bits. Shared Gaussian arithmetic admits each result component<=4096 bits with raw rational intermediate ceiling4B+1 numerator/4B denominator. Matrix operations fixed2x2; nilpotent candidate checks use shared bounded RationalMatrix. Existing355 root/branch obligations are unchanged. Additional257 order-four/residue obligations retain all original residue cases; total612. powj admits natural exponent0..4096 and uses actual2x2 rational-matrix binary multiplication, at most13 iterations/25 products per call. Flat integer matrices use4096-bit inputs and every shared product/dot-prefix bound.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/ContinuousTimeExpGenerator.lean\",\n      \"sha256\": \"03d58f4e60ab3368f101da133736a9ee3355d00973ffe3b90ca99bc1908f2da6\"\n    },\n    {\n      \"path\": \"lean4/U1ResiduesOrderFour.lean\",\n      \"sha256\": \"e0cea83454141a891b39b8f1276fd453ef959066755a4bcd6a9430b01fcf9e4d\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"All previously assessed finite-map, Gaussian pair/matrix, polynomial/energy and nilpotent invariants remain, including same-carrier composition and bounded exhaustive roots.\",\n    \"Natural quarter-turn exponents are exact integers0..4096; bool/negative values refuse before dependent multiplication and larger values are resource failures.\",\n    \"Flat integer2x2 inputs are admitted and owned before shared RationalMatrix products; outputs are exact integer tuples with shape/integrality checked.\",\n    \"Quarter-turn powers use actual binary matrix multiplication independent of REPS; at most13 iterations/25 products per power.\",\n    \"All355 original root/branch checks and257 residue checks remain separately counted, for612 total; imports remain silent and state per invocation.\",\n    \"Every previous source/test/contract history and old mutation manifest remains intact; the residue-only source is byte-archived with historical-reference mapping.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"FiniteEndomap owns an immutable nonempty table of1..4 exact integer images in its own indexed carrier. Apply admits exact states; composition requires the same owned type/carrier and computes self after other. Powers admit integer0..4096, preserve the identity at zero and use bounded binary iteration. Return public operations through Outcome, preserving successful values versus input/resource refusals.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-1\",\n      \"symbols\": [\n        \"_state\",\n        \"FiniteEndomap\",\n        \"FiniteEndomap.__init__\",\n        \"FiniteEndomap.apply\",\n        \"FiniteEndomap._compose\",\n        \"FiniteEndomap.compose\",\n        \"FiniteEndomap._power\",\n        \"FiniteEndomap.power\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_generated_composition_action_and_power\",\n        \"ContinuousTimeCheckerTests.test_finite_map_ownership_domains_and_full_power_budget\",\n        \"ContinuousTimeCheckerTests.test_composition_refuses_carrier_loss\",\n        \"ContinuousTimeCheckerTests.test_reentrant_counts_faults_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Enumerate every total map on the same finite carrier in lexicographic image order and return exactly those whose square is the target. An empty successful root tuple means exhaustive finite nonexistence. maps returns all four owned Boolean-carrier tables; toggle requires actual bool and refuses integer/text aliases.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-2\",\n      \"symbols\": [\n        \"FiniteEndomap._square_roots\",\n        \"FiniteEndomap.square_roots\",\n        \"toggle\",\n        \"maps\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_complete_small_root_censuses_and_four_state_witness\",\n        \"ContinuousTimeCheckerTests.test_finite_map_ownership_domains_and_full_power_budget\",\n        \"ContinuousTimeCheckerTests.test_oracles_and_pure_import\",\n        \"ContinuousTimeCheckerTests.test_reentrant_counts_faults_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Gaussian helpers admit exact bounded integer pairs and exactly four flat matrix entries, snapshot all inputs and compose shared GaussianRational/GaussianMatrix2 arithmetic. Return immutable integer pairs/flat matrices; numerator export is valid because admitted inputs and ring operations stay Gaussian integral. Invalid shapes/types refuse before multiplication.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-3\",\n      \"symbols\": [\n        \"_bounded\",\n        \"_gaussian\",\n        \"_pair\",\n        \"gadd\",\n        \"gmul\",\n        \"_matrix\",\n        \"mmul\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_gaussian_products_against_symbolic_oracle\",\n        \"ContinuousTimeCheckerTests.test_scaled_roots_are_distinct_unitary_half_steps\",\n        \"ContinuousTimeCheckerTests.test_exact_gaussian_domains_and_preflight\",\n        \"ContinuousTimeCheckerTests.test_integer_domains_and_polynomial_resource_boundaries\"\n      ]\n    },\n    {\n      \"requirement\": \"Evaluate the integer Cayley polynomial with checked square, plus/minus, products and sums. Energy is the exact bounded odd integer2k+1, accepting negative branches. The nilpotent predicate tests I+N=swap and N^2=0 via owned rational matrices after admitting all four bounded integers; it is only the square-zero logarithm candidate, not a general matrix-log theorem.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-4\",\n      \"symbols\": [\n        \"cayley\",\n        \"energy\",\n        \"nilpotent\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_cayley_and_odd_branch_oracles\",\n        \"ContinuousTimeCheckerTests.test_integer_domains_and_polynomial_resource_boundaries\",\n        \"ContinuousTimeCheckerTests.test_nilpotent_forced_candidate_against_matrix_oracle\"\n      ]\n    },\n    {\n      \"requirement\": \"Require Cases, remain silent on import and allocate per-run counters. Preserve Boolean obstruction, both scaled squares/distinctness, Gaussian examples,41 Cayley values,two branch values,300 distinct unordered branch pairs and the forced candidate corner/non-nilpotence; add both scaled-unitarity checks. Emit355 actual checks/4 Boolean maps and exit nonzero on expected failure; propagate cancellation/programming errors.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-5\",\n      \"symbols\": [\n        \"_map_controls\",\n        \"_matrix_controls\",\n        \"verify\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_reentrant_counts_faults_and_cancellation\",\n        \"ContinuousTimeCheckerTests.test_executable_receipt_and_failure_exit\",\n        \"ContinuousTimeCheckerTests.test_oracles_and_pure_import\",\n        \"ContinuousTimeCheckerTests.test_scaled_roots_are_distinct_unitary_half_steps\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit exact flat2 integer matrices and snapshot both operands before shared RationalMatrix multiplication; export exact ints with shape/integrality checked. powj admits natural exponent0..4096 and performs actual binary matrix multiplication, independently of REPS. Preserve all257 residue obligations, use actual matrix entries for former literal scalar steps, remove the vacuous residue<4 branch, and count612 combined obligations while retaining355 root/branch checks. Negative/bool exponents refuse before multiplication; cancellation propagates.\",\n      \"requirement_id\": \"TFQM-DISCRETE-DYNAMICS-REVIEW-DS-CONTINUOUS-TIME-EXP-GENERATOR-6\",\n      \"symbols\": [\n        \"_real_matrix\",\n        \"_real_flat\",\n        \"mm\",\n        \"powj\",\n        \"verify_residues\"\n      ],\n      \"tests\": [\n        \"ContinuousTimeCheckerTests.test_integer_matrix_product_against_symbolic_oracle\",\n        \"ContinuousTimeCheckerTests.test_quarter_turn_powers_against_matrix_and_cycle\",\n        \"ContinuousTimeCheckerTests.test_fixed_nonsymmetric_integer_products_and_snapshots\",\n        \"ContinuousTimeCheckerTests.test_residue_exact_domains_and_resource_limits\",\n        \"ContinuousTimeCheckerTests.test_residue_preflight_before_multiplication\",\n        \"ContinuousTimeCheckerTests.test_residue_control_counts_and_injected_fault\",\n        \"ContinuousTimeCheckerTests.test_executable_receipt_and_failure_exit\"\n      ]\n    }\n  ],\n  \"retired_inputs\": [\n    {\n      \"archive\": \"reviews/repository_file_review/retired_discrete_dynamics_sources/ds-qm062-u1-residues-import.py.txt\",\n      \"path\": \"checks/independent/ds-qm062-u1-residues-import.py\",\n      \"sha256\": \"d669032e35b188a5b468b87a72fd6b9ce367b836a0e022e2e759b32beadaeb42\"\n    }\n  ],\n  \"role\": \"Composed bounded discrete-dynamics verification application with owned finite maps, exact exhaustive roots/iteration, Gaussian branch witnesses and independent order-four integer-matrix powers/residue controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"FiniteEndomap\",\n    \"FiniteEndomap.__init__\",\n    \"FiniteEndomap._compose\",\n    \"FiniteEndomap._power\",\n    \"FiniteEndomap._square_roots\",\n    \"FiniteEndomap.apply\",\n    \"FiniteEndomap.compose\",\n    \"FiniteEndomap.power\",\n    \"FiniteEndomap.square_roots\",\n    \"_bounded\",\n    \"_gaussian\",\n    \"_map_controls\",\n    \"_matrix\",\n    \"_matrix_controls\",\n    \"_pair\",\n    \"_real_flat\",\n    \"_real_matrix\",\n    \"_state\",\n    \"cayley\",\n    \"energy\",\n    \"gadd\",\n    \"gmul\",\n    \"main\",\n    \"maps\",\n    \"mm\",\n    \"mmul\",\n    \"nilpotent\",\n    \"powj\",\n    \"toggle\",\n    \"verify\",\n    \"verify_residues\"\n  ]\n}\n",
