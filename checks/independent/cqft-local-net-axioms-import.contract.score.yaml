-order, local-operator and qubit-unfolding verification with owned exact rational matrix values; no continuum AQFT construction.\",\n  \"consumer_boundary\": \"Three executable paths and tested matrix/site helper interfaces are retained. Local-net CLI now emits an explicit84-case JSON receipt; causal total grows795->923 for112 second-family cocycles and16 C2 pair cases; Reeh total remains252. Internal local-net fixture helpers are composed; no external code callers were found. Integer matrices now have explicit64-dimension/4096-bit budgets. Local flat2 rational input remains supported. Historical scientific receipts retain their original source hashes and counts; no DAG status is promoted.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:cqft-local-net-axioms-import\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-checkers.md\",\n      \"sha256\": \"9141c355c371962b89b2fe116ea104130bca1d240c8f39609718661e3f9fec85\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-closure-tests.py.txt\",\n      \"sha256\": \"b4fff4cbed9d5d013e42371ab34b2d64ca132aed4e530cff7357da6ca9be24d7\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-initial-causal.py.txt\",\n      \"sha256\": \"9d49281ea6e3ac9d003f8520e836f40e4c3343bbe8ae589408b0c37c43b32b90\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-initial-tests.py.txt\",\n      \"sha256\": \"9e436f096cd854883604ca2dbfe5907ea9fd91156c831c5a36a38049d83dc344\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-closure.json\",\n      \"sha256\": \"f8297f6cd212ce6fc896111ea50e55fda636a87a5271d8325c4f5e9cc04c97d8\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-initial-manifest.json\",\n      \"sha256\": \"35fc6162eea86d4b09adaa06abcf72a37a7d55813a9d82978189ff0b5679cc8e\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations.json\",\n      \"sha256\": \"f53475c99c3b8c2aff7e467596f99a1f9aced3932275385e00c8ebad1895e6a8\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality-annotation-failure.json\",\n      \"sha256\": \"b0409e553350aaa446cde94c3e265f62ffb41196bdc9d20aad97d1e1c61d55dd\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality-initial.json\",\n      \"sha256\": \"724be9b4d444e6e22eb60ec260157191b49b66324caa1f2dd106830c9a214894\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-requirements.json\",\n      \"sha256\": \"000a9dfbc2d0735ca03dad016cd3aa23f640ae7ffee421b2b9f0f2c929c39273\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/cqft_mutations.json\",\n      \"sha256\": \"82b7e8ae9acf3c7909d5772b316b229b521ea0e835c5b6f5ef20aaa0f76389f1\"\n    }\n  ],\n  \"failure_policy\": \"Matrix/point/shape domains are admitted before dependent arithmetic and use detached snapshots. Expected input/resource/check/duplicate failures use Violation, Outcome/evaluate and the nonzero CLI boundary. Resource refusal is distinct from a false mathematical obligation; Cases rejects non-bool/duplicate status rows. Callback recorders are trusted typed interfaces, not untrusted plugin code. Cancellation and unexpected programming errors propagate; tests restore import/mock/capture state.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Fixed four-point carrier; 4 irreflexivity and64 transitivity obligations plus3 pair controls. 2x2 rational and4x4 integer operations use the bounded shared value. Default84 obligations =71 order+8 single-site+5 two-site. No continuum region index is constructed.\",\n  \"origin\": {\n    \"path\": \"lean4/LocalNetAxiomsImport.lean\",\n    \"sha256\": \"cade284a0f39f47108de8560e72198cf3dec3fcf6836f065c64d54b53ef99645\"\n  },\n  \"owned_invariants\": [\n    \"RationalMatrix is the sole immutable matrix value object in its file; rectangular rows and exact values are admitted and owned.\",\n    \"Each matrix dimension <=64, each stored rational component <=4096 bits; dot products admit each product and accumulator; tensor dimensions checked before output allocation.\",\n    \"Causal operations require integer2x2 matrices and ordered products have <=64 assigned points/factors; local flat2 operations preserve exact rational input.\",\n    \"Qubit coefficient snapshots have8 integers, site0..2, bit0..1, complement0..3; no raw caller list is used after validation.\",\n    \"Default causal/local/Reeh obligations are923/84/252; all are finite controls, one count per executed conjunction.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit each carrier point as an exact integer 0..3 before branching and compute the supplied N relation/spacelike predicate.\",\n      \"requirement_id\": \"TFQM-CQFT-REVIEW-CQFT-LOCAL-NET-AXIOMS-IMPORT-1\",\n      \"symbols\": [\n        \"rel\",\n        \"spacelike\"\n      ],\n      \"tests\": [\n        \"CqftCheckerTests.test_local_order_tensor_and_flat_boundaries\"\n      ]\n    },\n    {\n      \"requirement\": \"Keep existing exact rational flat2 inputs for multiplication/add/transpose/determinant, and exact integer4x4 boundaries for products/flattening. Tensor embedding requires integral inputs even if fractional factors could cancel.\",\n      \"requirement_id\": \"TFQM-CQFT-REVIEW-CQFT-LOCAL-NET-AXIOMS-IMPORT-2\",\n      \"symbols\": [\n        \"mm\",\n        \"add2\",\n        \"trp\",\n        \"det2\",\n        \"mm4\",\n        \"flat\",\n        \"kron_blocks\"\n      ],\n      \"tests\": [\n        \"CqftCheckerTests.test_local_two_by_two_api_against_symbolic_oracle\",\n        \"CqftCheckerTests.test_local_order_tensor_and_flat_boundaries\"\n      ]\n    },\n    {\n      \"requirement\": \"Aggregate named finite order/algebra/tensor controls with exact bool and unique IDs. Replace the former constant identity-cell sentinel with two full identity products. Preserve every failed case, actual counts, per-run ownership and typed nonzero CLI diagnostics.\",\n      \"requirement_id\": \"TFQM-CQFT-REVIEW-CQFT-LOCAL-NET-AXIOMS-IMPORT-3\",\n      \"symbols\": [\n        \"check_four_point_order\",\n        \"check_single_site_algebra\",\n        \"check_two_site_products\",\n        \"run_checks\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"CqftCheckerTests.test_all_finite_sections_and_default_counts\",\n        \"CqftCheckerTests.test_local_generated_receipt_accounting\",\n        \"CqftCheckerTests.test_injected_faults_cli_and_cancellation\"\n      ]\n    }\n  ],\n  \"role\": \"Finite local-operator verification application with exact point/matrix admission, composed rational algebra, integer tensor embeddings, explicit order/algebra case aggregation and typed JSON/CLI failure behavior\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"add2\",\n    \"check_four_point_order\",\n    \"check_single_site_algebra\",\n    \"check_two_site_products\",\n    \"det2\",\n    \"flat\",\n    \"kron_blocks\",\n    \"main\",\n    \"mm\",\n    \"mm4\",\n    \"rel\",\n    \"run_checks\",\n    \"spacelike\",\n    \"trp\"\n  ]\n}\n",
