      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/dfm-hierarchical-borel.py\",\n    \"sha256\": \"0c756ef227684efbaea2244f0bb85bcea37dd535219ebd524b34ae3115a27c82\"\n  },\n  \"audited_consumers\": [\n    {\n      \"path\": \"dag/derivation_dag.json\",\n      \"sha256\": \"7b656c2fa36e943f1cf821534ea60b6a953bd0f2aed82889e7f39e6dc4e6e586\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/evidence/evidence_map.json\",\n      \"sha256\": \"6cbb3bb0a72c75d5b557f508ef8cf01fea3adea16db23c3e4e14725e2022e64f\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/fragments/application_branches.json\",\n      \"sha256\": \"7569bc0053202d28d9d8d6c7cc9328884fd2ccfe0dc1c0a3e1770f4eb4a9d684\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/theory_of_finite_qm.jsonl\",\n      \"sha256\": \"3f731a626fd2287ddb67a1ce3816cf1b897eb58eab5334950f3378d93662ae57\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"docs/evidence/stages/DRESSING_FIELD.md\",\n      \"sha256\": \"83ac7ddd7480d115aadfe42ddeb3bd78094fb68c4f34a95916643351180adcb2\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/operads/dfm_hierarchical_borel.yaml\",\n      \"sha256\": \"5442afb1d332b369caa2e5d6465ad63841366a11d8ae734427b08dc6d8e1a983\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/derivations/24_dressing_field/tfq_0400_dfm_hierarchical_borel.md\",\n      \"sha256\": \"97cce5adfa884fce52e55214ad462ce5e0e74d7f905cf186a5ab8d0a34884cb7\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"docs/evidence/nodes/DFM-HIERARCHICAL-BOREL.md\",\n      \"sha256\": \"480fcdb68758c9c297edb366817a16aadfb0d2efdaf7a46ed0615f1e5791d652\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/research/campaign_dfm-hierarchical-borel_review_validation.json\",\n      \"sha256\": \"4a7ae1a49d59ba8e8833475190ab69e5936f281139f88784f354b878eb5b9e44\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/research/campaign_dfm-hierarchical-borel_review_pipeline.json\",\n      \"sha256\": \"b2dc80fa1fa7491b5f7bc4329fa7854e19dc8628ba3dd3074567a212247cfeee\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/research/campaign_dfm-hierarchical-borel_review_integration.json\",\n      \"sha256\": \"54dbff796c59e6d3c76a918562f836391c973d4c2c1b4574e5fa9ba111cd0a91\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"checks/tests/test_hierarchical_borel.py\",\n      \"sha256\": \"41f4cab654580a40ad9862fdc3259ec38a98297470d92433bdc1ecfda4c33ae6\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \"checks/tests/test_review_repairs.py\",\n      \"sha256\": \"6bb0b7602707a2ee0c7277558cb8cb74eb6d986d2cc0ffb1be6a9df23fe0c6a4\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"315809275e24512ff871d70e1c731aac193a2e84c760bad604570546c96da9b1\",\n      \"state\": \"current local consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"The finite parent-map validator is a bounded executable counterpart to a supplied abstract Lean rooted tree with decreasing depth; it does not create arbitrary infinite trees.\",\n    \"Fixed SymPy expressions are exact and pinned but do not constitute a general bounded-time CAS service; concrete arithmetic/tree algorithms are independently tested.\",\n    \"B2(Q) factors require nonzero diagonals; torus projection alone retains singular-upper support. Resource refusal may precede exact cancellation.\",\n    \"Source substring scans are not kernel admission; no new Lean build, hosted CI, continuum gauge theory or scientific DAG promotion is claimed.\",\n    \"Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded exact rooted B2(Q) trees and fixed commutative symbolic identities; no continuum gauge theory.\",\n  \"consumer_boundary\": \"Executable and matrix/transport helper names remain, with immutable flat2 and detached dict exports. Graph TypedDict and duplicate arithmetic/guard code are composed into BorelTree plus shared independent support. Controls require Cases; check_dimension_and_source is retired because literal2!=3 and lexical scans supply no mathematical/proof admission evidence. The new93-count JSON receipt replaces prose:99 old obligations minus7 retired sentinels plus1 general torus homomorphism. No external Python consumers of changed control signatures or prose output were found. Unipotent/stage-one APIs now explicitly require B2(Q); torus still supports singular upper matrices for the counterexample. The finite constructor checks acyclicity instead of accepting an unbounded abstract Lean depth witness. No new Lean build or scientific DAG status is claimed; historical hashes remain historical.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-hierarchical-borel\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-checker.md\",\n      \"sha256\": \"d0bcd1698db8ae78e0ab7475a370cc698b92682e60df367e411ae1981553ded1\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-initial-tests.py.txt\",\n      \"sha256\": \"156887d7e6497a19f061aad9919712aa3dcdc798a9ef7a748a7496aa9476241a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-mutations-closure.json\",\n      \"sha256\": \"8eb62c9b4afa88cef647f8b3c7c73c6eb0c815eff54cd4e8f1ef1fbe8ea4e5f2\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-mutations.json\",\n      \"sha256\": \"209c354fcc7e4d1edce95f438f0f8c00069e5e0b3ca516646f1e2800387a1406\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-original-audit.json\",\n      \"sha256\": \"28dd810953b46fe42ece6528cede2a1f12826e980f8ee80cc2637f002b289ab0\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-original-source.py.txt\",\n      \"sha256\": \"0fadffb5b1cff5acd5e6433bacc93e69fa1c04183f97b891eadef46ab8b4557a\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-quality-initial.json\",\n      \"sha256\": \"612cfc88b4ddf9ef0aec71bb5776b9ac10adf15b43ce18f8860a7ea198b737aa\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-quality.json\",\n      \"sha256\": \"b3288b1f6a4823147d73ddf259a87c05955faf485a99341057b35d3a3cb2cb57\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-hierarchical-borel-requirements.json\",\n      \"sha256\": \"77921de813135e43629bedc38d430897a73256eafb99c0d187d0642212aea121\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/hierarchical_borel_mutations.json\",\n      \"sha256\": \"9e26a6612229fa866b6a0c3ac61f2e9989d908a6bd81925218206ade63275cce\"\n    },\n    {\n      \"path\": \"checks/tests/hierarchical_borel_cycle_mutation.json\",\n      \"sha256\": \"5411db2b796d934f8d82d138ea373433522ac16bc1329bfc3943fa65eb58fb4b\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {\n    \"check_curvature.curv\": {\n      \"owned_by\": \"check_curvature\",\n      \"requirements_via\": \"check_curvature\"\n    },\n    \"check_curvature.entry\": {\n      \"owned_by\": \"check_curvature\",\n      \"requirements_via\": \"check_curvature\"\n    },\n    \"check_symbolic_factorization.bad\": {\n      \"owned_by\": \"check_symbolic_factorization\",\n      \"requirements_via\": \"check_symbolic_factorization\"\n    }\n  },\n  \"operational_cost\": \"Flat2x2 exact rational inputs/components and every shared matrix product/dot sum/determinant/output have4096-bit numerator/denominator budgets. Native dict/mappingproxy inputs have<=1024 entries; vertex identifiers are exact integers0..2^31-1. Topology validation/order construction visits each nonroot vertex once, O(N) work/storage; off-root cycles terminate by a visiting-set refusal before label arithmetic. Transport usesN-1 fixed2x2 products; edge residual recomputes one full transport plus two products and one inverse. Each product has8 scalar products and8 checked accumulations. Returned maps are immutable snapshots. Fixed SymPy controls use2x2 expressions, three factorization unknowns and a fixed commutative incidence identity; arbitrary symbolic input and a general bounded-time CAS service are outside scope. Default93 obligations =7 symbolic factorization+75 path/diamond+4 curvature+7 anchoring.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldHierarchicalBorel.lean\",\n    \"sha256\": \"d5366519d454b57ed1a436eb257ff615fd94998cdc4fdf9cd7e15ec355ef117e\"\n  },\n  \"owned_invariants\": [\n    \"Flat2 matrix inputs and every stored/intermediate exact rational use4096-bit numerator/denominator limits; raw integer inversion remains Fraction-valued.\",\n    \"Native dict/mappingproxy parent/label inputs have at most1024 entries and exact nonnegative31-bit identifiers, excluding bool/float aliases on all keys and values.\",\n    \"BorelTree owns one fixed root, complete parents, no off-root cycle, exactly nonroot invertible B2(Q) labels and immutable parent/label/topological-order snapshots.\",\n    \"Transport begins at identity with child labels multiplying on the left; public transport/residual methods return Outcome and immutable results.\",\n    \"Residual endpoints/label are admitted before transport; expected input/resource/check refusals remain distinct from identity and cancellation/programming errors propagate.\",\n    \"Default93 mathematical obligations replace99: seven literal/lexical sentinels retired, one general torus homomorphism check added. Original source/counts are retained.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact int/Fraction flat2 matrices, exclude bool/float/foreign values, and compose arithmetic into bounded RationalMatrix. Inversion always stays rational even for raw integer tuples and requires invertible upper-triangular inputs. Torus projection admits singular upper-triangular matrices; unipotent/stage-one factors require B2(Q). Predicates validate shape and examine all defining entries. Dress validates all three operands before arithmetic; its edge label may be singular upper-triangular.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-1\",\n      \"symbols\": [\n        \"M\",\n        \"mul\",\n        \"_upper\",\n        \"inv\",\n        \"eye\",\n        \"torus\",\n        \"unipotent\",\n        \"is_torus\",\n        \"is_unipotent\",\n        \"stage_one_field\",\n        \"dress\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_borel_algebra_and_two_stage_factors\",\n        \"HierarchicalBorelTests.test_noncommuting_integer_regression\",\n        \"HierarchicalBorelTests.test_matrix_admission_and_singular_fences\",\n        \"HierarchicalBorelTests.test_full_resource_limits_and_conservative_arithmetic\",\n        \"HierarchicalBorelTests.test_preflight_and_unexpected_errors\"\n      ]\n    },\n    {\n      \"requirement\": \"Own native bounded parent/label mappings and validate every root/key/parent as an exact nonnegative31-bit integer, including label keys that could otherwise alias integers via bool/float. Require one fixed root, complete parent membership and exactly non-root labels. Compute parent-before-child order with finite cycle detection before admitting invertible labels. Freeze all stored topology/label data.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-2\",\n      \"symbols\": [\n        \"_vertex\",\n        \"_mapping\",\n        \"_tree_order\",\n        \"BorelTree\",\n        \"BorelTree.__init__\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_tree_domains_cycles_and_boolean_aliases\",\n        \"HierarchicalBorelTests.test_tree_snapshot_ownership_and_railway_refusals\",\n        \"HierarchicalBorelTests.test_full_resource_limits_and_conservative_arithmetic\",\n        \"HierarchicalBorelTests.test_preflight_and_unexpected_errors\",\n        \"HierarchicalBorelTests.test_cycle_detection_lookup_bound\",\n        \"HierarchicalBorelTests.test_trees_against_independent_path_products\"\n      ]\n    },\n    {\n      \"requirement\": \"Start rooted transport at identity and multiply each child label on the left of its parent transport. Return immutable snapshots through Outcome, or a detached dict from the legacy helper. Validate residual endpoints and label before any transport, then compute inverse(target transport)*edge*source transport. Expected refusals stay typed and cancellation/programming errors propagate.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-3\",\n      \"symbols\": [\n        \"BorelTree._transport\",\n        \"BorelTree.transport\",\n        \"BorelTree._edge_residual\",\n        \"BorelTree.edge_residual\",\n        \"transport_of\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_trees_against_independent_path_products\",\n        \"HierarchicalBorelTests.test_noncommuting_integer_regression\",\n        \"HierarchicalBorelTests.test_tree_snapshot_ownership_and_railway_refusals\",\n        \"HierarchicalBorelTests.test_full_resource_limits_and_conservative_arithmetic\",\n        \"HierarchicalBorelTests.test_preflight_and_unexpected_errors\"\n      ]\n    },\n    {\n      \"requirement\": \"Require per-run Cases, and test the supplied path/diamond vertices, tree edges and chords through small helpers: Borel factorization, conjugate stage-one field, quotient preservation, two-stage inverse/residual, pure-gauge and non-pure-gauge chords. Retain explicit transport/chord/singular counterexamples and anchoring necessity through right multiplication by a constant.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-4\",\n      \"symbols\": [\n        \"_cases\",\n        \"_check_vertex\",\n        \"_check_tree_edge\",\n        \"_check_chord\",\n        \"_path_tree\",\n        \"_diamond_tree\",\n        \"check_path_and_diamond\",\n        \"check_anchored_uniqueness\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_fixed_control_sections_and_counts\",\n        \"HierarchicalBorelTests.test_noncommuting_integer_regression\",\n        \"HierarchicalBorelTests.test_borel_algebra_and_two_stage_factors\",\n        \"HierarchicalBorelTests.test_trees_against_independent_path_products\"\n      ]\n    },\n    {\n      \"requirement\": \"For fixed symbolic2x2 inputs, verify factorization, the entire unique-solution list, normality and both the correct torus projection homomorphism and bad-projection counterexample. Off-diagonal b is arbitrary, not assumed nonzero. Check commutative incidence covariance/Bianchi, source-only failure and a computed finite endpoint witness. SymPy is a pinned symbolic dependency for these fixed expressions; separate symbolic matrix calculations test the concrete rational matrix and tree algorithms.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-5\",\n      \"symbols\": [\n        \"check_symbolic_factorization\",\n        \"check_curvature\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_fixed_control_sections_and_counts\",\n        \"HierarchicalBorelTests.test_symbolic_failure_and_executable_exit\"\n      ]\n    },\n    {\n      \"requirement\": \"Emit93 actual mathematical obligations through typed CLI and nonzero failure exit. Retire seven literal/source-substring checks; preserve their original99-count receipt and source. Source provenance is in contracts, not claimed proved by substring absence, and no continuum result is asserted.\",\n      \"requirement_id\": \"TFQM-HIERARCHICAL-REVIEW-DFM-HIERARCHICAL-BOREL-6\",\n      \"symbols\": [\n        \"main\"\n      ],\n      \"tests\": [\n        \"HierarchicalBorelTests.test_fixed_control_sections_and_counts\",\n        \"HierarchicalBorelTests.test_symbolic_failure_and_executable_exit\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded exact rooted Borel-tree dressing application with immutable topology/labels, complete cycle and identifier admission, Railway transport/residual operations and fixed symbolic algebra controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"BorelTree\",\n    \"BorelTree.__init__\",\n    \"BorelTree._edge_residual\",\n    \"BorelTree._transport\",\n    \"BorelTree.edge_residual\",\n    \"BorelTree.transport\",\n    \"M\",\n    \"_cases\",\n    \"_check_chord\",\n    \"_check_tree_edge\",\n    \"_check_vertex\",\n    \"_diamond_tree\",\n    \"_mapping\",\n    \"_path_tree\",\n    \"_tree_order\",\n    \"_upper\",\n    \"_vertex\",\n    \"check_anchored_uniqueness\",\n    \"check_curvature\",\n    \"check_path_and_diamond\",\n    \"check_symbolic_factorization\",\n    \"dress\",\n    \"eye\",\n    \"inv\",\n    \"is_torus\",\n    \"is_unipotent\",\n    \"main\",\n    \"mul\",\n    \"stage_one_field\",\n    \"torus\",\n    \"transport_of\",\n    \"unipotent\"\n  ]\n}\n",
