      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/dfm-hierarchical-borel.py\",\n    \"sha256\": \"0c756ef227684efbaea2244f0bb85bcea37dd535219ebd524b34ae3115a27c82\"\n  },\n  \"assessment_id\": \"hierarchical-borel-production-review-2026-11-03\",\n  \"basis\": {\n    \"G1\": \"Full Lean origin and current consumers audited; every declaration and nested ownership maps bidirectionally to tested requirements, with finite claim ceiling.\",\n    \"G2\": \"Exact matrix/identifier admission repairs demonstrated raw-integer float inversion and bool label-key aliasing. Independent symbolic matrix and un-memoized path-product oracles verify factorization, order, residuals and anchoring; fixed commutative CAS controls have explicit hypotheses.\",\n    \"G3\": \"Frozen owned1024-vertex tree, complete topology/cycle/label admission, deterministic parent-before-child order, bounded exact arithmetic, typed Outcome methods and nonzero CLI failures; scoped captures/mocks/runpy/subprocess lifecycle preserves cancellation and programming errors.\",\n    \"G4\": \"Strict pinned typing;12 Borel and24 integration groups pass normal/optimized runs;80 deterministic examples per property and full1024-vertex chain. All45 candidates detected:44 original candidates plus a separate complete cycle-guard-removal challenge with a finite lookup sentinel and exact additive-test custody. Original99-count source/audit and all six mutation outcome categories remain explicit.\",\n    \"G5\": \"CCN 9, cognitive 8, nesting 3; at most one class. Flat2x2 exact rational inputs/components and every shared matrix product/dot sum/determinant/output have4096-bit numerator/denominator budgets. Native dict/mappingproxy inputs have<=1024 entries; vertex identifiers are exact integers0..2^31-1. Topology validation/order construction visits each nonroot vertex once, O(N) work/storage; off-root cycles terminate by a visiting-set 