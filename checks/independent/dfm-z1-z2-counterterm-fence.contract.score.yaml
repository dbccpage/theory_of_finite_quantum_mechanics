05a4f845dda2a1905c19b0a9ef3730e5dd387625da339148\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Four rational momentum coordinates and one rational mass, each<=4096-bit numerator/denominator. Stored4x4 Gaussian entries and every Gaussian product/dot-prefix result have4096-bit components; raw Gaussian binary intermediates before reduction/admission use at most4B+1 numerator and4B denominator bits, B=4096. Mass-shell squares and each signed prefix are independently bounded. Fixed matrix product has64 Gaussian products,16 length4 sums; Dirac contraction8 matrix products; factored vertex10; lowered contraction40. Collection admission snapshots at most4096 elements before exact4-shape refusal. Default25 obligations =16 Clifford pairs+2 inverse differences+4 two-sided inverse checks+1 sandwich+1 lowered contraction+1 entry matrix.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldZ1Z2CountertermFence.lean\",\n    \"sha256\": \"b659387aa156095a4c861ee8e922918cdf6b71a88529c5e23e2a26f5f62fafaf\"\n  },\n  \"owned_invariants\": [\n    \"DiracKernel owns four exact rational momentum components and signed rational mass, each with4096-bit numerator/denominator; no bool/float/text coercion.\",\n    \"Every matrix is an immutable admitted4x4 array of GaussianRational entries; full shape/type/index/vector preflight precedes arithmetic.\",\n    \"The fixed gamma representation has Minkowski(+---) signature; slash, Dirac contraction and lowered vertex use that same explicit metric.\",\n    \"Inverse operator remains defined on shell; propagator separately refuses zero mass-shell denominator, bounds each square/prefix and uses exact rational reciprocal.\",\n    \"Every Gaussian operation result and matrix dot prefix has bounded4096-bit components; shared arithmetic raw intermediates have an explicit finite bit-cost ceiling.\",\n    \"Factored vertex preserves left/insertion/right multiplication order; default25 obligations retain the original witness and add all Clifford pairs/two-sided inverses.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit complete4x4 list/tuple shapes before arithmetic and require exact GaussianRational entries; export immutable tuple rows. Admit exactly four rational momentum coordinates and mass, excluding bool/float/text. Lorentz index is exact integer0..3. Compose shared Gaussian arithmetic, with every resulting component bounded and no local duplicate scalar implementation.\",\n      \"requirement_id\": \"TFQM-COUNTERTERM-REVIEW-DFM-Z1-Z2-COUNTERTERM-FENCE-1\",\n      \"symbols\": [\n        \"_matrix\",\n        \"_entry\",\n        \"_momentum\",\n        \"_index\",\n        \"zero_matrix\",\n        \"eye\",\n        \"_combine\",\n        \"madd\",\n        \"msub\",\n        \"_scale\",\n        \"mscale\",\n        \"_dot\",\n        \"_multiply\",\n        \"mmul\"\n      ],\n      \"tests\": [\n        \"CountertermCheckerTests.test_gaussian_matrix_arithmetic_against_symbolic_oracle\",\n        \"CountertermCheckerTests.test_oracles_and_basis\",\n        \"CountertermCheckerTests.test_kernel_ownership_and_scalar_vector_domains\",\n        \"CountertermCheckerTests.test_matrix_index_domains_and_snapshot\",\n        \"CountertermCheckerTests.test_matrix_preflight_before_arithmetic\",\n        \"CountertermCheckerTests.test_resource_budgets_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Construct the immutable Dirac representation with gamma0 diagonal(+,+,-,-) and spatial Pauli off-diagonal blocks of opposite sign. Use signature(+---) for slash and lowered indices. Private gamma construction only receives0..3 from the fixed family initialization.\",\n      \"requirement_id\": \"TFQM-COUNTERTERM-REVIEW-DFM-Z1-Z2-COUNTERTERM-FENCE-2\",\n      \"symbols\": [\n        \"_gamma\",\n        \"_slash\",\n        \"slash\"\n      ],\n      \"tests\": [\n        \"CountertermCheckerTests.test_oracles_and_basis\",\n        \"CountertermCheckerTests.test_kernel_inverse_against_matrix_inversion\",\n        \"CountertermCheckerTests.test_generated_inverse_difference_and_sandwich\",\n        \"CountertermCheckerTests.test_nonreal_dirac_vertex_and_lowered_contraction\"\n      ]\n    },\n    {\n      \"requirement\": \"DiracKernel owns exact momentum and signed mass. Its inverse operator slash(p)-mI is defined also on shell. Propagator requires nonzero p0^2-p1^2-p2^2-p3^2-m^2, checks every square and prefix, and computes(slash(p)+mI)/denominator with a rational reciprocal. Return both operations through Outcome, with singular input and resource failure distinct. Legacy prop/prop_inv helpers retain matrix-valued semantics with typed failures via the outer boundary.\",\n      \"requirement_id\": \"TFQM-COUNTERTERM-REVIEW-DFM-Z1-Z2-COUNTERTERM-FENCE-3\",\n      \"symbols\": [\n        \"DiracKernel\",\n        \"DiracKernel.__init__\",\n        \"DiracKernel._inverse_operator\",\n        \"DiracKernel.inverse_operator\",\n        \"DiracKernel._denominator\",\n        \"DiracKernel._propagator\",\n        \"DiracKernel.propagator\",\n        \"prop_inv\",\n        \"prop\"\n      ],\n      \"tests\": [\n        \"CountertermCheckerTests.test_kernel_inverse_against_matrix_inversion\",\n        \"CountertermCheckerTests.test_integer_inputs_original_witness_and_mass_shell\",\n        \"CountertermCheckerTests.test_kernel_ownership_and_scalar_vector_domains\",\n        \"CountertermCheckerTests.test_resource_budgets_and_cancellation\",\n        \"CountertermCheckerTests.test_generated_inverse_difference_and_sandwich\",\n        \"CountertermCheckerTests.test_counts_faults_and_lifecycle\"\n      ]\n    },\n    {\n      \"requirement\": \"Dirac contraction sums gamma_nu A eta_nu gamma_nu. Factor vertex as dirac(left gamma_mu right), preserving order. Lower a supplied q with(+---) before summing four vertices. Admit every matrix/index/vector before dependent operations; test nonreal noncommuting matrices and nonzero spatial q, not just the original sparse witness.\",\n      \"requirement_id\": \"TFQM-COUNTERTERM-REVIEW-DFM-Z1-Z2-COUNTERTERM-FENCE-4\",\n      \"symbols\": [\n        \"_dirac\",\n        \"dirac\",\n        \"_vertex\",\n        \"vertex\",\n        \"contract\"\n      ],\n      \"tests\": [\n        \"CountertermCheckerTests.test_nonreal_dirac_vertex_and_lowered_contraction\",\n        \"CountertermCheckerTests.test_integer_inputs_original_witness_and_mass_shell\",\n        \"CountertermCheckerTests.test_matrix_index_domains_and_snapshot\",\n        \"CountertermCheckerTests.test_matrix_preflight_before_arithmetic\",\n        \"CountertermCheckerTests.test_counts_faults_and_lifecycle\"\n      ]\n    },\n    {\n      \"requirement\": \"Require Cases and record25 actual mathematical obligations, including all16 Clifford pairs and both sides of both supplied propagator inversions in addition to original inverse differences/sandwich/contraction/witness. Preserve exact witness fractions, emit JSON and nonzero expected failure exit; unexpected programming errors and cancellation propagate.\",\n      \"requirement_id\": \"TFQM-COUNTERTERM-REVIEW-DFM-Z1-Z2-COUNTERTERM-FENCE-5\",\n      \"symbols\": [\n        \"_basis_controls\",\n        \"_inverse_difference\",\n        \"verify\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"CountertermCheckerTests.test_counts_faults_and_lifecycle\",\n        \"CountertermCheckerTests.test_executable_receipt_and_failure_exit\",\n        \"CountertermCheckerTests.test_integer_inputs_original_witness_and_mass_shell\"\n      ]\n    }\n  ],\n  \"role\": \"Exact finite Dirac-kernel verification application with owned rational momentum/mass, immutable Gaussian4x4 operators, bounded mass-shell arithmetic, off-shell Railway propagators and composed lowered vertex contractions\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"DiracKernel\",\n    \"DiracKernel.__init__\",\n    \"DiracKernel._denominator\",\n    \"DiracKernel._inverse_operator\",\n    \"DiracKernel._propagator\",\n    \"DiracKernel.inverse_operator\",\n    \"DiracKernel.propagator\",\n    \"_basis_controls\",\n    \"_combine\",\n    \"_dirac\",\n    \"_dot\",\n    \"_entry\",\n    \"_gamma\",\n    \"_index\",\n    \"_inverse_difference\",\n    \"_matrix\",\n    \"_momentum\",\n    \"_multiply\",\n    \"_scale\",\n    \"_slash\",\n    \"_vertex\",\n    \"contract\",\n    \"dirac\",\n    \"eye\",\n    \"madd\",\n    \"main\",\n    \"mmul\",\n    \"mscale\",\n    \"msub\",\n    \"prop\",\n    \"prop_inv\",\n    \"slash\",\n    \"verify\",\n    \"vertex\",\n    \"zero_matrix\"\n  ]\n}\n",
