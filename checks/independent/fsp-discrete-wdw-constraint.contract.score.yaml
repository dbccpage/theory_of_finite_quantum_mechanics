      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/fsp-discrete-wdw-constraint.py\",\n    \"sha256\": \"02ffa1ea9c9499c659e38294266fd328ef7227cce9975b28b837ceac8ecf2790\"\n  },\n  \"boundaries\": [\n    \"This is a declared finite-dimensional integer model; its set of integer triples is infinite. It constructs no discrete Wheeler-DeWitt operator, triangulation dynamics, diffeomorphism action, physical state space or continuum limit. Its counterexample concerns an inference from symmetry and a nonzero kernel to positivity or idempotence, not a specified gravitational model.\"\n  ],\n  \"contract_urn\": \"urn:tfqm:next-five-2:fsp-discrete-wdw-constraint:fsp-discrete-wdw-constraint\",\n  \"evidence\": [\n    {\n      \"path\": \"dag/research/campaign_fsp-discrete-wdw-constraint_lean_replay.json\",\n      \"sha256\": \"039fd027ed60fb98aa3d5adcf76c6328fc8982740f3cd34ad3d9166881ab7156\"\n    },\n    {\n      \"path\": \"dag/derivations/independent/fsp-discrete-wdw-constraint.md\",\n      \"sha256\": \"9009d23304505e8486c5423f1d9dc88d99036f17379f457fae9e8e9e6129c153\"\n    },\n    {\n      \"path\": \"docs/overclaim/reviews/2026-10-26_next-five-2-fsp-discrete-wdw-constraint.md\",\n      \"sha256\": \"ab974734d49f18e15a1da6451c5e31148bbdf503480778005f47080fb8587f5f\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"On integer triples, the declared constraint H(x,y,z)=(0,2y,-z) is symmetric for the usual dot product and has kernel exactly the vectors with y=z=0. The map P(x,y,z)=(x,0,0) is idempotent, maps into that kernel, fixes exactly the kernel, and has residual orthogonal to every kernel vector. H has a nonzero kernel but is indefinite and is not idempotent. Thus this finite-dimensional constraint and its kernel projector are distinct operators.\"\n  ],\n  \"purpose\": \"Independent exact check of the declared model for FSP-DISCRETE-WDW-CONSTRAINT\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"main\"\n  ]\n}\n",
