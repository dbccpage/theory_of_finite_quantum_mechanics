   \"sha256\": \"6bb0b7602707a2ee0c7277558cb8cb74eb6d986d2cc0ffb1be6a9df23fe0c6a4\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"b7184079f9990f64a8dc4727ab01e88388fb8edfe8a2643b205803e9bfac1d94\",\n      \"state\": \"current local consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"Projectors and commutation are supplied and checked, not derived from Feynman data.\",\n    \"No noncommuting forest theorem, positive Taylor degree or continuum convergence is established.\",\n    \"Shared arithmetic is a dependency; separate bitmask/symbolic/partial-fraction/diagonal oracles support the tests.\",\n    \"No new Lean build, hosted CI or higher-tier assurance is claimed. Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded finite forest enumeration and supplied commuting rational-projector verification; no continuum renormalization construction.\",\n  \"consumer_boundary\": \"Executable path and all original helper names remain. Forest edges now have explicit labels, carrier and exact-index limits; unused malformed entries are refused. Scalar and matrix output/intermediate costs are bounded. check_family accepts the full64-projector domain without constructing an oversized duplicate family. New aggregate methods return Outcome; existing pure helpers retain their evaluated typed-exception interface. CLI now includes a575-obligation JSON receipt. Existing1925 joint-kernel regressions remain. Historical scientific/DAG receipt bytes and statuses are unchanged.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-bphz-continuum-fence\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-bphz-checker.md\",\n      \"sha256\": \"d44ea9b09dcdd9c88a6c1cda38fc2a577c77bc740fa086c93e71ba26d40c9c23\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-bphz-mutations.json\",\n      \"sha256\": \"8a94985a5d088b9bb8175187d5ecab0961adc04a7ae5197935567e24d58e1780\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-bphz-quality.json\",\n      \"sha256\": \"af0e775f17577696aba3879f236a7d027a1d03e3f557a5cabbc7b3bf7be84ca4\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-bphz-requirements.json\",\n      \"sha256\": \"1f3e1d2eb184d0c571e1dbdd802047dfac9b3be60c21154e76673210eb768b8d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-quality.json\",\n      \"sha256\": \"f531f9e11189a053da9fa1abe238e169a50008eee8681df7bd2935b746da7a37\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-cqft-mutations-adjudicated.json\",\n      \"sha256\": \"0112582c49fb176de79174d6a19af63fea21ff5c7e0eff55d25a34b04d879d95\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/bphz_mutations.json\",\n      \"sha256\": \"1980764dc282bf46304415d68862789fc0a4d88c8fc77f1a3072ff041bd7c1e4\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {\n    \"compatible.ok\": {\n      \"owned_by\": \"compatible\",\n      \"requirements_via\": \"compatible\"\n    }\n  },\n  \"operational_cost\": \"Forest labels<=12, each1..64 characters; each edge carrier<=64 exact indices0..4095. Enumeration<=4096 subsets, at most66 pair checks per subset, each set operation O(64). Projector family<=64; admission O(k^2) fixed2x2 matrix products and reduction O(k). Stored values and every matrix product/accumulator are admitted to4096 bits; conservative intermediate rejection may refuse mathematically cancellable expressions. Scalar formulas use a fixed number of bounded exact inputs and admit each returned value. Default575 executed obligations; fixed projector census12 projectors/77 compatible lists.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldBphzContinuumFence.lean\",\n    \"sha256\": \"878e25acc8ba9a63eec10dd9d436f8cb5b578fde0e0faca4e6d736b681a0fcaf\"\n  },\n  \"owned_invariants\": [\n    \"At most12 labels and4096 subsets; the complete edge map is validated and snapshotted.\",\n    \"At most64 Fraction-only rational2x2 idempotents, with all pair commutation checked.\",\n    \"Stored rationals and matrix product/accumulator results have4096-bit budgets; exact fixed scalar expressions admit their output.\",\n    \"Empty reduction is identity; duplicate-family controls do not shrink the admitted64-projector domain.\",\n    \"575 actual obligations in the default run, with no literal numerator coefficient sentinel.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit distinct nonempty bounded labels and the entire supplied finite edge mapping, including unused entries. Require frozenset carriers with exact nonnegative bounded integer indices. Own snapshots before returning the compatibility closure or powerset iterator; refuse missing labels even in singleton forests. Enumerate exactly the subsets whose pairs are nested or disjoint.\",\n      \"requirement_id\": \"TFQM-BPHZ-REVIEW-DFM-BPHZ-CONTINUUM-FENCE-1\",\n      \"symbols\": [\n        \"_label\",\n        \"_names\",\n        \"_edge_map\",\n        \"powerset\",\n        \"compatible\",\n        \"forests\"\n      ],\n      \"tests\": [\n        \"BphzCheckerTests.test_forests_against_bitmask_oracle\",\n        \"BphzCheckerTests.test_forest_snapshots_and_full_budget\",\n        \"BphzCheckerTests.test_forest_domains_and_unused_entries\"\n      ]\n    },\n    {\n      \"requirement\": \"Admit exact int/Fraction scalars excluding bool/float, enforce4096-bit input/output limits, compute the declared polynomial, six-term and inclusion subtractions, and sector ratio with both poles refused. These formulas have no Feynman or continuum interpretation beyond the supplied finite controls.\",\n      \"requirement_id\": \"TFQM-BPHZ-REVIEW-DFM-BPHZ-CONTINUUM-FENCE-2\",\n      \"symbols\": [\n        \"exact\",\n        \"N\",\n        \"six\",\n        \"inclusion\",\n        \"sector_k\"\n      ],\n      \"tests\": [\n        \"BphzCheckerTests.test_numerator_and_sector_exact_oracles\",\n        \"BphzCheckerTests.test_scalar_domains_and_derived_budgets\",\n        \"BphzCheckerTests.test_fixture_counts_numerator_challenge_and_cli\"\n      ]\n    },\n    {\n      \"requirement\": \"Compose the previously reviewed RationalMatrix value for exact flat2 multiplication and I-P; preserve malformed-shape and conservative intermediate resource refusals.\",\n      \"requirement_id\": \"TFQM-BPHZ-REVIEW-DFM-BPHZ-CONTINUUM-FENCE-3\",\n      \"symbols\": [\n        \"multiply\",\n        \"residual\"\n      ],\n      \"tests\": [\n        \"BphzCheckerTests.test_matrix_operations_against_symbolic_oracle\",\n        \"BphzCheckerTests.test_projector_domains_and_conservative_product_budget\"\n      ]\n    },\n    {\n      \"requirement\": \"Own a frozen tuple of<=64 Fraction-only rational2x2 projectors. Check every idempotence and distinct pair commutation before admission. Reduction is the right-recursive product of remainders; its public result and two-vector application use Outcome. The legacy checked_reduce boundary preserves raw-flat2 success and typed refusal for evaluated callers.\",\n      \"requirement_id\": \"TFQM-BPHZ-REVIEW-DFM-BPHZ-CONTINUUM-FENCE-4\",\n      \"symbols\": [\n        \"_projector\",\n        \"CommutingProjectorFamily\",\n        \"CommutingProjectorFamily.__init__\",\n        \"CommutingProjectorFamily._reduction\",\n        \"CommutingProjectorFamily.reduction\",\n        \"CommutingProjectorFamily._apply\",\n        \"CommutingProjectorFamily.apply\",\n        \"checked_reduce\"\n      ],\n      \"tests\": [\n        \"BphzCheckerTests.test_projector_reduction_and_joint_kernel\",\n        \"BphzCheckerTests.test_projector_snapshots_maximum_and_empty\",\n        \"BphzCheckerTests.test_projector_domains_and_conservative_product_budget\",\n        \"BphzCheckerTests.test_recorders_railway_and_cancellation\"\n      ]\n    },\n    {\n      \"requirement\": \"Use exact Cases recorders or fresh per-call recorders. Check reduction idempotence, supplied kernels and subfamily absorption on the entire admitted family; duplicate-family fixtures are separate and never cause valid64-projector check_family input to expand past its bound. Enumerate the fixed12-projector/77-family census and two invalid families. Recompute numerator coefficients from evaluations, retain all forest/grid/witness/sector controls, count575 executed obligations and expose nonzero typed CLI failure/cancellation.\",\n      \"requirement_id\": \"TFQM-BPHZ-REVIEW-DFM-BPHZ-CONTINUUM-FENCE-5\",\n      \"symbols\": [\n        \"_cases\",\n        \"check_family\",\n        \"check_projector_api\",\n        \"check_invalid_scalars\",\n        \"check_forest_carriers\",\n        \"check_numerator_examples\",\n        \"check_sector_example\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"BphzCheckerTests.test_projector_reduction_and_joint_kernel\",\n        \"BphzCheckerTests.test_projector_snapshots_maximum_and_empty\",\n        \"BphzCheckerTests.test_fixture_counts_numerator_challenge_and_cli\",\n        \"BphzCheckerTests.test_recorders_railway_and_cancellation\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded finite-forest and supplied-projector verification application with an owned commuting-projector aggregate, exact rational algebra, typed failures and counted CLI controls\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"CommutingProjectorFamily\",\n    \"CommutingProjectorFamily.__init__\",\n    \"CommutingProjectorFamily._apply\",\n    \"CommutingProjectorFamily._reduction\",\n    \"CommutingProjectorFamily.apply\",\n    \"CommutingProjectorFamily.reduction\",\n    \"N\",\n    \"_cases\",\n    \"_edge_map\",\n    \"_label\",\n    \"_names\",\n    \"_projector\",\n    \"check_family\",\n    \"check_forest_carriers\",\n    \"check_invalid_scalars\",\n    \"check_numerator_examples\",\n    \"check_projector_api\",\n    \"check_sector_example\",\n    \"checked_reduce\",\n    \"compatible\",\n    \"exact\",\n    \"forests\",\n    \"inclusion\",\n    \"main\",\n    \"multiply\",\n    \"powerset\",\n    \"residual\",\n    \"sector_k\",\n    \"six\"\n  ]\n}\n",
