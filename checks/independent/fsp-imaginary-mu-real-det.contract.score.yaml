        "basis": {
          "G1": "Full original source and Lean module read; byte custody and historical contracts preserved; declaration/requirement/test mapping and consumer audit. Exact fields and imported physical assumptions remain explicit.",
          "G2": "Independent symbolic scalar/matrix/block, full 6x6 boundary and root-sum oracles; generated and deterministic complex-phase, pivot, SU(3), zero-mass and real-fugacity cases. Exact syntax, type, shape and arithmetic domains enforced.",
          "G3": "No untrusted text evaluation or conversion hooks; preflight, owned immutable state, bounded intermediates, detached exports, typed refusals and fresh counters. RuntimeError and cancellation propagate; expected CLI refusals are nonzero.",
          "G4": "Strict typing; 25 new and 24 existing integration groups pass normally and optimized. All 86 final critical faults killed against final source hashes. Earlier timeouts remain inconclusive and are replayed with fixed witnesses; initial failures remain recorded.",
          "G5": "CCN 13, cognitive 6, nesting 3; at most one class per file. Expression preflight has at most 64 nodes and depth 8, with exponent magnitude at most 16. Matrix dimensions are 1..18; products/determinants use O(n^3) completed Gaussian operations and O(n^2) workspace. Stored Gaussian components are 4096-bit rationals; raw native Gaussian arithmetic can use up to 20481-bit components before reduction/admission. Cycles have at most six three-color sites. Laurent state has seven coefficients; convolution has at most 49 products, boundary construction six permutations, and evaluation seven operations over the fixed degree-four exact field using 21 fixed phases. Normal field coordinates are admitted at 4096 bits; trusted SymPy arithmetic has its own temporary representation. The fixed application has 27 cases and 140 controls. CLI/selected-fault subprocesses have 30-second timeouts and full mutation baselines 180 seconds."
        },
