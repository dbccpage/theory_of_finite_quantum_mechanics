"path\": \"checks/tests/temporal_cycle_mutations.json\",\n      \"sha256\": \"2b491b2b30576146868e81b11abc9920b252a7cec13eeafa5f52309f0f7d0571\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"lean4/FermionSignImaginaryMuRealDet.lean\",\n      \"sha256\": \"fa5f4b2f76560be37d6fccff11842fa7edf1504c4488dd8b1bb2b7d09267504c\"\n    }\n  ],\n  \"failure_policy\": \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\",\n  \"operational_cost\": \"Expression preflight has at most 64 nodes and depth 8, with exponent magnitude at most 16. Matrix dimensions are 1..18; products/determinants use O(n^3) completed Gaussian operations and O(n^2) workspace. Stored Gaussian components are 4096-bit rationals; raw native Gaussian arithmetic can use up to 20481-bit components before reduction/admission. Cycles have at most six three-color sites. Laurent state has seven coefficients; convolution has at most 49 products, boundary construction six permutations, and evaluation seven operations over the fixed degree-four exact field using 21 fixed phases. Normal field coordinates are admitted at 4096 bits; trusted SymPy arithmetic has its own temporary representation. The fixed application has 27 cases and 140 controls. CLI/selected-fault subprocesses have 30-second timeouts and full mutation baselines 180 seconds.\",\n  \"origins\": [\n    {\n      \"path\": \"lean4/FermionSignImaginaryMuRealDet.lean\",\n      \"sha256\": \"fa5f4b2f76560be37d6fccff11842fa7edf1504c4488dd8b1bb2b7d09267504c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-05-temporal-cycle-original-fsp-imaginary-mu-real-det.py.txt\",\n      \"sha256\": \"ac19770608212101081358398a29af59f440a541d91f29fe233e5eaf62c2d81d\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n    \"Preserve gaussian, TemporalCycle transport/dirac/links, matrix equality, rejection probes and exact original CLI fields/results. Guard conditions accept native bool or exact SymPy true/false; arbitrary truthy objects refuse. Rejection probes execute a callable and require an input/resource refusal. Mutable matrix comparisons are snapshotted only after shape admission.\",\n    \"Own the three fixed temporal cycles and boundary. Preserve the original 27 lattice cases, rational determinant examples, Schur checks, gamma-only negative witness, zero-mass and real-fugacity witnesses, center sum 345/32 and nine rejection names. Add independent native determinant and center comparisons. Report 140 actual per-run Cases guard calls separately from the 27 lattice cases, preserving byte-identical CLI output.\",\n    \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\"\n  ],\n  \"requirements\": {\n    \"adapters\": {\n      \"requirement\": \"Preserve gaussian, TemporalCycle transport/dirac/links, matrix equality, rejection probes and exact original CLI fields/results. Guard conditions accept native bool or exact SymPy true/false; arbitrary truthy objects refuse. Rejection probes execute a callable and require an input/resource refusal. Mutable matrix comparisons are snapshotted only after shape admission.\",\n      \"tests\": [\n        \"test_text_and_foreign_hooks_are_never_executed\",\n        \"test_cycle_transport_and_dirac_against_block_oracle\",\n        \"test_legacy_booleans_matrix_comparison_and_rejection_adapters\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"budgets\": {\n      \"requirement\": \"Each owned Gaussian component and every completed Gaussian operation has normalized rational components of at most 4096 bits. Check matrix/polynomial terms and prefixes before later cancellation. Each normal coordinate of the trusted degree-four algebraic field is also admitted at 4096 bits after embedding, multiplication and addition. Bound symbol syntax and dimensions before arithmetic or dense-matrix copies.\",\n      \"tests\": [\n        \"test_node_depth_power_and_component_budgets\",\n        \"test_shape_preflight_before_expression_evaluation\",\n        \"test_gaussian_matrix_shape_domain_preflight\",\n        \"test_gaussian_matrix_intermediate_budget_cancellation\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_legacy_booleans_matrix_comparison_and_rejection_adapters\"\n      ]\n    },\n    \"certificate\": {\n      \"requirement\": \"Own the three fixed temporal cycles and boundary. Preserve the original 27 lattice cases, rational determinant examples, Schur checks, gamma-only negative witness, zero-mass and real-fugacity witnesses, center sum 345/32 and nine rejection names. Add independent native determinant and center comparisons. Report 140 actual per-run Cases guard calls separately from the 27 lattice cases, preserving byte-identical CLI output.\",\n      \"tests\": [\n        \"test_application_original_payload_and_live_case_counter\",\n        \"test_application_failure_translation_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    },\n    \"lifecycle\": {\n      \"requirement\": \"Keep owned values immutable, exports detached, imports quiet and counters fresh. Constructors/internal operations raise typed Violation; public query/result boundaries return Outcome. RuntimeError, KeyboardInterrupt and SystemExit propagate. Expected CLI failures return nonzero. Tests use scoped patches/loaders/captures and time-bounded subprocesses; timeouts remain inconclusive in fault accounting.\",\n      \"tests\": [\n        \"test_owned_values_reentrancy_and_refusal_helper\",\n        \"test_unexpected_failures_and_cancellation_propagate\",\n        \"test_gaussian_matrix_boundaries_and_ownership\",\n        \"test_cycle_input_domains_preflight_and_immutable_state\",\n        \"test_center_domains_budgets_and_reentrancy\",\n        \"test_application_original_payload_and_live_case_counter\",\n        \"test_application_failure_translation_and_cancellation\",\n        \"test_quiet_import_and_original_cli\"\n      ]\n    }\n  },\n  \"role\": \"Finite verification application with owned fixtures, legacy adapters and live guard accounting.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": {\n    \"ImaginaryMuControls\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls.__init__\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._case\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._center\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._center.canonical\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._lattices\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._rejected\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._verify\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls._witnesses\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"ImaginaryMuControls.verify\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"_condition\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_guard\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"_main\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"_matrix\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"equal_matrix\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"expect_rejection\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"gaussian\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"main\": [\n      \"certificate\",\n      \"lifecycle\"\n    ],\n    \"matrix_equal\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ],\n    \"require\": [\n      \"adapters\",\n      \"budgets\",\n      \"lifecycle\"\n    ]\n  }\n}\n",
