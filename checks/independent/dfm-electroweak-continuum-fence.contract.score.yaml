erivations/24_dressing_field/tfq_1122_dfm_electroweak_continuum_fence.md\",\n      \"sha256\": \"6a0f49581ce9a46ea512eae2c0cfeeb2bfc3116cef41b7459a9dfff71ba5323c\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"dag/operads/dfm_electroweak_continuum_fence.yaml\",\n      \"sha256\": \"1c39dc2977ee5925ecefd20c3bf471f2cdb88ab265722fff91eea0cd2ca7c3e8\",\n      \"state\": \"pre-change consumer/provenance audit\"\n    },\n    {\n      \"path\": \"checks/tests/test_electroweak_checker.py\",\n      \"sha256\": \"4b3b9baf37cf6f0f78dd201aed961494e0a981b291cacdc72004be16e81d0ba1\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \"checks/tests/test_review_repairs.py\",\n      \"sha256\": \"6bb0b7602707a2ee0c7277558cb8cb74eb6d986d2cc0ffb1be6a9df23fe0c6a4\",\n      \"state\": \"current local consumer\"\n    },\n    {\n      \"path\": \".github/workflows/reviewed-checkers.yml\",\n      \"sha256\": \"5287fbe86896860940d9e97ec4c3145c50d78c46eafec613ae1b198ffbd621b7\",\n      \"state\": \"current local consumer\"\n    }\n  ],\n  \"boundaries\": [\n    \"Shared arithmetic is independent-checker infrastructure, not a production scientific oracle.\",\n    \"Lean algebraic division is total at zero; the executable matrix/scalar division API requires a nonzero denominator and checked normalization uses a positive root.\",\n    \"The finite controls do not derive continuum fields, a norm-root existence theorem or electroweak dynamics.\",\n    \"Prior local GR methods/NormalizationError and control signatures have no audited external Python callers; current control functions require Cases and the CLI emits JSON.\",\n    \"No new Lean build, hosted CI or higher-tier assurance is claimed. Retention label5 is not perfection.\"\n  ],\n  \"bounded_context\": \"Bounded exact electroweak doublet normalization and residual covariance with supplied rational roots; no continuum field dynamics.\",\n  \"consumer_boundary\": \"Executable path and mathematical helper pair/four-entry formats remain. GR now aliases the shared independent GaussianRational value; private duplicated GR methods and NormalizationError are composed into shared arithmetic and typed Violation. No external Python callers of those removed classes/methods or control signatures were found. Control functions now require a per-run Cases recorder; the prior prose-only CLI becomes a761-obligation JSON receipt with nonzero failure status. Shared code belongs to the independent-checking context, not the scientific implementation used as an oracle. Lean permits total rational division at zero in algebraic theorems; this executable explicitly rejects zero denominators. The checked normalization portion matches supplied positive-root conditions. Historical scientific evidence retains its original hashes; no DAG status or continuum claim is promoted.\",\n  \"contract_urn\": \"urn:tfqm:checker-review:2026-11-03:dfm-electroweak-continuum-fence\",\n  \"evidence\": [\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-checker.md\",\n      \"sha256\": \"ae515f287d7f2d753a9c0b5dc0c448f20aff131d9a40427bbc2835f77fb91b1b\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-initial-tests.py.txt\",\n      \"sha256\": \"7ee42dff513bfaf019c9f1686f9265a46f28964903187d1f4b8cb6ccc6a0f60d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-mutations-closure.json\",\n      \"sha256\": \"ffd3a28009a3def5851475aaddf5e4c8faab670c5dd534a9755f4f6d74e0a43c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-mutations.json\",\n      \"sha256\": \"379fd190c48574f8a81580c56a04ac0f93b5bae0609f614d419171b5effe4595\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-quality-initial.json\",\n      \"sha256\": \"4c8349a01fbbbce7eac65db1a74c5c05477b78d5ecc9a0c8fdbb223180781712\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-quality.json\",\n      \"sha256\": \"e8bd4a05d22a507339e0c7b4d86cf3b41f5dca844674cca74e39c5cc8f392ef8\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-electroweak-requirements.json\",\n      \"sha256\": \"35d1ca93c7732e67737815a5553d1c95d9ca4fe92375642d2906fb48e045d91c\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-quality-complete.json\",\n      \"sha256\": \"3e517dd1efc76d31b8837ceae9140b8c0aee30c133e327f62ef15ea1f6fa451d\"\n    },\n    {\n      \"path\": \"reviews/repository_file_review/2026-11-03-support-mutations-adjudicated.json\",\n      \"sha256\": \"a39e3e60d6390a792e1f2e99327a6cbbd1562a6174f26e36eda4e3078423bcb5\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    },\n    {\n      \"path\": \"checks/tests/electroweak_mutations.json\",\n      \"sha256\": \"7891fe03b8f20d4cd512e1bf120f362b797d23b04d107435ba77e270e2283f57\"\n    }\n  ],\n  \"failure_policy\": \"Owned finite inputs are admitted before dependent lookups and arithmetic. Expected input/resource/check/duplicate refusals use typed Violation, evaluate/Outcome and cli; aggregate operations return Outcome directly. Resource refusal differs from mathematical falsehood. Cancellation and unexpected programming errors propagate. Scoped test resources restore captures, mocks and module registration.\",\n  \"nested_declaration_ownership\": {},\n  \"operational_cost\": \"Two immutable Gaussian-rational components; each real/imaginary numerator and denominator has at most4096 bits. Each squared norm, their sum, supplied root square and returned components are admitted to4096 bits. Shared Gaussian arithmetic uses bounded temporary rational expressions (norm numerator<=4B+1 bits, denominator<=4B for B4096); stored components remain bounded. Constant-size matrices have four entries. Phase-census snapshots have0..64 unit phases; checks perform2+2n+n^2 obligations, at most4226. Default761 obligations =738 normalization/action+10 refused-input+2 unnormalized+11 witness/counterexample. No root search or continuum limit computation.\",\n  \"origin\": {\n    \"path\": \"lean4/DressingFieldElectroweakContinuumFence.lean\",\n    \"sha256\": \"e41bab58fa9c70e42c75c4a1536a733ec301adbccfa7673e33b6282c13a19a89\"\n  },\n  \"owned_invariants\": [\n    \"ElectroweakDoublet owns exactly two immutable GaussianRational values; foreign objects are refused before arithmetic.\",\n    \"Stored Gaussian components, checked squared norms/sums, root squares and returned rational components have4096-bit numerator/denominator limits.\",\n    \"Normalization requires a nonzero norm and supplied positive rational root with matching square; rational roots are not inferred to exist.\",\n    \"Unit-phase action admits only squared norm1 phase and doublet; aggregate operations return Outcome.\",\n    \"Matrix snapshots have exactly four Gaussian entries; phase-census snapshots contain0..64 unit phases and at most4226 obligations.\",\n    \"Default761 executed obligations are738 normalization/action+10 negative-input+2 unnormalized+11 witness checks; failed guards exit nonzero.\"\n  ],\n  \"requirements\": [\n    {\n      \"requirement\": \"Admit exact shared Gaussian values and int/Fraction scalars, excluding bool/float/foreign objects. Own two immutable components and validate both before arithmetic. Bound each squared norm and their sum, each root square and all produced components; return typed resource refusals instead of widening the admitted domain.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-1\",\n      \"symbols\": [\n        \"_gaussian\",\n        \"exact\",\n        \"ElectroweakDoublet\",\n        \"ElectroweakDoublet.__init__\",\n        \"ElectroweakDoublet.components\",\n        \"ElectroweakDoublet._norm_squared\",\n        \"ElectroweakDoublet.norm_squared\",\n        \"v2\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_all_public_domain_boundaries\",\n        \"ElectroweakCheckerTests.test_owned_immutable_values_and_railway_paths\",\n        \"ElectroweakCheckerTests.test_exact_size_and_intermediate_resource_refusals\",\n        \"ElectroweakCheckerTests.test_preflight_and_phase_census_budget\",\n        \"ElectroweakCheckerTests.test_gaussian_doublet_and_dressing_symbolic\"\n      ]\n    },\n    {\n      \"requirement\": \"Scale a doublet by any admitted Gaussian scalar; normalize only with a supplied exact positive rational root whose square matches its nonzero norm. Preserve zeroNorm, nonpositiveScale and mismatchedSquare ordering after scalar admission; do not assert roots exist for all Q(i)^2 inputs. Aggregate methods return Outcome; legacy helpers return pairs under evaluate.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-2\",\n      \"symbols\": [\n        \"_divide\",\n        \"ElectroweakDoublet._scaled\",\n        \"ElectroweakDoublet.scaled\",\n        \"ElectroweakDoublet._normalized\",\n        \"ElectroweakDoublet.normalized\",\n        \"scale\",\n        \"checked_normalize\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_normalization_refusal_order_and_rational_roots\",\n        \"ElectroweakCheckerTests.test_normalization_and_action_on_rational_sphere\",\n        \"ElectroweakCheckerTests.test_gaussian_doublet_and_dressing_symbolic\",\n        \"ElectroweakCheckerTests.test_exact_size_and_intermediate_resource_refusals\",\n        \"ElectroweakCheckerTests.test_owned_immutable_values_and_railway_paths\"\n      ]\n    },\n    {\n      \"requirement\": \"Unit-phase action requires both the phase and doublet to have squared norm1. Checked aggregate actions return Outcome, rejecting nonunit or invalid inputs; independent rational-sphere data exercise norm preservation and composition.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-3\",\n      \"symbols\": [\n        \"_unit_phase\",\n        \"ElectroweakDoublet._acted\",\n        \"ElectroweakDoublet.acted\",\n        \"unit_action\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_normalization_and_action_on_rational_sphere\",\n        \"ElectroweakCheckerTests.test_all_public_domain_boundaries\",\n        \"ElectroweakCheckerTests.test_owned_immutable_values_and_railway_paths\",\n        \"ElectroweakCheckerTests.test_exact_size_and_intermediate_resource_refusals\"\n      ]\n    },\n    {\n      \"requirement\": \"Construct the unnormalized dressing with entries conj(q),p,-conj(p),q. Admit all four matrix entries and both diagonal factors before arithmetic; multiply columns by their corresponding factor. Division uses a common supplied nonzero rational denominator and refuses component budget overflow.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-4\",\n      \"symbols\": [\n        \"ElectroweakDoublet.dressing\",\n        \"U\",\n        \"_entries\",\n        \"right_diag\",\n        \"scale_mat\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_nonreal_fixed_matrix_and_doublet\",\n        \"ElectroweakCheckerTests.test_gaussian_doublet_and_dressing_symbolic\",\n        \"ElectroweakCheckerTests.test_matrix_operations_symbolic\",\n        \"ElectroweakCheckerTests.test_all_public_domain_boundaries\",\n        \"ElectroweakCheckerTests.test_exact_size_and_intermediate_resource_refusals\",\n        \"ElectroweakCheckerTests.test_nonunit_own_root_counterexample\"\n      ]\n    },\n    {\n      \"requirement\": \"Validate recorder and bounded phase census before controls. Count actual obligations for unnormalized covariance/norm multiplicativity, normalization fixed points, phase covariance and composition. Evaluate every negative input and require its typed failure, so a missing guard cannot silently pass.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-5\",\n      \"symbols\": [\n        \"_cases\",\n        \"check_unnormalized\",\n        \"check_action_case\",\n        \"_invalid_controls\",\n        \"check_normalization_api\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_preflight_and_phase_census_budget\",\n        \"ElectroweakCheckerTests.test_gaussian_doublet_and_dressing_symbolic\",\n        \"ElectroweakCheckerTests.test_normalization_and_action_on_rational_sphere\",\n        \"ElectroweakCheckerTests.test_default_counts_and_actual_failure_detection\",\n        \"ElectroweakCheckerTests.test_recorders_cli_and_programming_errors\"\n      ]\n    },\n    {\n      \"requirement\": \"Retain the3/5+4/5i unit witness and the nonunit z=2 own-root counterexample. Emit761 actual obligations per independent run through the typed CLI; an injected failed invariant exits1. Finite normalization/covariance checks have no continuum dynamics authority.\",\n      \"requirement_id\": \"TFQM-ELECTROWEAK-REVIEW-DFM-ELECTROWEAK-CONTINUUM-FENCE-6\",\n      \"symbols\": [\n        \"_witness_controls\",\n        \"main\"\n      ],\n      \"tests\": [\n        \"ElectroweakCheckerTests.test_nonunit_own_root_counterexample\",\n        \"ElectroweakCheckerTests.test_default_counts_and_actual_failure_detection\",\n        \"ElectroweakCheckerTests.test_recorders_cli_and_programming_errors\",\n        \"ElectroweakCheckerTests.test_executable_cli_receipt\"\n      ]\n    }\n  ],\n  \"role\": \"Bounded exact doublet normalization application with immutable aggregate ownership, supplied positive-root validation, unit-phase actions, residual covariance controls and Railway operations\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"ElectroweakDoublet\",\n    \"ElectroweakDoublet.__init__\",\n    \"ElectroweakDoublet._acted\",\n    \"ElectroweakDoublet._norm_squared\",\n    \"ElectroweakDoublet._normalized\",\n    \"ElectroweakDoublet._scaled\",\n    \"ElectroweakDoublet.acted\",\n    \"ElectroweakDoublet.components\",\n    \"ElectroweakDoublet.dressing\",\n    \"ElectroweakDoublet.norm_squared\",\n    \"ElectroweakDoublet.normalized\",\n    \"ElectroweakDoublet.scaled\",\n    \"U\",\n    \"_cases\",\n    \"_divide\",\n    \"_entries\",\n    \"_gaussian\",\n    \"_invalid_controls\",\n    \"_unit_phase\",\n    \"_witness_controls\",\n    \"check_action_case\",\n    \"check_normalization_api\",\n    \"check_unnormalized\",\n    \"checked_normalize\",\n    \"exact\",\n    \"main\",\n    \"right_diag\",\n    \"scale\",\n    \"scale_mat\",\n    \"unit_action\",\n    \"v2\"\n  ]\n}\n",
