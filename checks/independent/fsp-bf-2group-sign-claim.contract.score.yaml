      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Python\",\n    \"path\": \"checks/independent/fsp-bf-2group-sign-claim.py\",\n    \"sha256\": \"9b1b7c5b3a3ba2735ff1e5bfa6bcd9e918f84c2281b0fa8d1c214e1fc1cf84dc\"\n  },\n  \"boundaries\": [\n    \"The result concerns the explicitly defined Z2 cochain model and normalized rephasings. It constructs no BF state sum, 2-group gauge dynamics, knotted-worldsheet amplitude or three-loop braiding observable. No general cancellation or sign-free theorem follows.\"\n  ],\n  \"contract_urn\": \"urn:tfqm:next-five-2:fsp-bf-2group-sign-claim:fsp-bf-2group-sign-claim\",\n  \"evidence\": [\n    {\n      \"path\": \"dag/research/campaign_fsp-bf-2group-sign-claim_lean_replay.json\",\n      \"sha256\": \"32863477287110540a374428dee4ee40cd271e0bfb3d087180df26adc18931c1\"\n    },\n    {\n      \"path\": \"dag/derivations/independent/fsp-bf-2group-sign-claim.md\",\n      \"sha256\": \"83f3aa9c7567ceab60d50adec7af32f9fdbb0dc6b69afebb759bbfe4ea0827fe\"\n    },\n    {\n      \"path\": \"docs/overclaim/reviews/2026-10-26_next-five-2-fsp-bf-2group-sign-claim.md\",\n      \"sha256\": \"a03b0e42243cce89bbd7865516e630382facdb8ba84eb78d5c756558d0dbb3f2\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"For the additive group Z2 with trivial Z2 coefficient action, the Boolean 3-cochain omega(a,b,c)=a*b*c is normalized and satisfies the cocycle identity. Every normalized 2-cochain beta has coboundary zero at (1,1,1), whereas omega is one there. Thus omega is not a normalized coboundary, and normalized 2-cochain rephasing leaves a negative sign at that triple.\"\n  ],\n  \"purpose\": \"Independent exact check of the declared model for FSP-BF-2GROUP-SIGN-CLAIM\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"symbols\": [\n    \"main\"\n  ]\n}\n",
