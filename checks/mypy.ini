[mypy]
python_version = 3.12
strict = True
namespace_packages = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR,$MYPY_CONFIG_FILE_DIR/tests
cache_dir = $MYPY_CONFIG_FILE_DIR/../.review_work/mypy-cache
show_error_codes = True
warn_unused_configs = True

[mypy-sympy.*]
ignore_missing_imports = True
