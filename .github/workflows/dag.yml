# Derivation DAG: the graph and every path it cites.
#
# validate_derivation_dag.py --repo-root . checks the graph (ids, stages, statuses, routes, acyclicity, views)
# and that every source, Lean, Rust and review path a node, route or record cites exists in this checkout.
name: dag

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the derivation DAG and its cited paths
        run: python -I -X utf8 dag/validate_derivation_dag.py --repo-root .
      - name: Evidence pages are current
        run: python -I -X utf8 dag/evidence/build_evidence.py --check
      - name: DAG and evidence tests (report only)
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check pytest && python -X utf8 -m pytest -q dag/tests dag/evidence/test_evidence.py
      - name: README facts are current (report only)
        continue-on-error: true
        run: python -I -X utf8 scripts/build_readme_facts.py --check
      - name: Repository types
        run: python -m pip install --disable-pip-version-check pyyaml pytest && python -I -X utf8 -m pytest scripts/test_check_repo_types.py -q -p no:cacheprovider && python -I -X utf8 scripts/check_repo_types.py --strict --summary "$GITHUB_STEP_SUMMARY"
      - name: Repository types, naming report (report only)
        continue-on-error: true
        run: python -I -X utf8 scripts/check_repo_types.py --report naming | tail -n 20
      - name: Repository types, public-text report (report only)
        continue-on-error: true
        run: python -I -X utf8 scripts/check_repo_types.py --report public-text | tail -n 1
