name: reviewed-checkers

on:
  pull_request:
    paths:
      - 'checks/**'
      - 'reviews/repository_file_review/**'
      - 'scripts/score_scope_contracts.py'
      - '.github/workflows/reviewed-checkers.yml'
  push:
    branches: [main]
    paths:
      - 'checks/**'
      - 'reviews/repository_file_review/**'
      - 'scripts/score_scope_contracts.py'
      - '.github/workflows/reviewed-checkers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r checks/tests/requirements.txt
      - name: Verify reviewed sources and companion histories
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          from score_scope_contracts import validate_document, valid_current_entry

          entries = json.loads(Path("reviews/repository_file_review/current_file_scores.json").read_bytes())["files"]
          rows = {row["path"]: row for row in entries}
          assessed = [row for row in entries if row.get("status") == "reviewed_repaired_verified" or row.get("scoring_token")]
          if len(rows) != len(entries) or not assessed:
              raise ValueError("The file ledger must contain unique paths and assessed sources")
          for row in assessed:
              source = Path(row["path"])
              companion = source.with_suffix(".contract.score.yaml")
              for artifact in (source, companion):
                  if hashlib.sha256(artifact.read_bytes()).hexdigest() != rows[artifact.as_posix()]["sha256"]:
                      raise ValueError(f"Ledger hash differs from checkout for {artifact}")
              document = json.loads(companion.read_bytes())
              score = validate_document(document, row["path"], row["sha256"], "Python")
              grades = {"B", "A", "A+"}
              if not score["is_complete"] or score["level"] not in {"L4", "L5"} or score["composite_grade"] not in grades:
                  raise ValueError(f"Assessment below L4B for {source}")
              if any(grade not in grades for grade in score["gates"].values()):
                  raise ValueError(f"Assessment gate below B for {source}")
              if score["score_token"] != score["level"] + score["composite_grade"] or score["score_token"] != row.get("scoring_token"):
                  raise ValueError(f"Score mismatch for {source}")
              for field in ("contract_history", "scoring_history"):
                  for entry in document[field]:
                      error = valid_current_entry(entry)
                      if error:
                          raise ValueError(f"{companion} {field}: {error}")
      - name: Strict checker infrastructure typing
        run: python -I -B -m mypy --config-file checks/mypy.ini checks/checker_support checks/tests/test_checker_support.py checks/tests/run_support_mutations.py checks/tests/test_mutation_campaign.py
      - name: Strict reviewed AdS and regression typing
