# Builds the five Gleason Lean targets (non-default Lake targets, so the default build never
# compiles them) and runs the fail-closed axiom audit of scripts/gleason_lean_audit.py.
# AuthorityEffect: None.
name: lean-gleason

on:
  pull_request:
    paths:
      - "lean4/BornGaussianParallelogramRigidity.lean"
      - "lean4/GleasonRealSphere.lean"
      - "lean4/GleasonComplexSphere.lean"
      - "lean4/GleasonGaussianBridge.lean"
      - "lean4/GleasonBornCompletion.lean"
      - "lean4/BornGaussRat.lean"
      - "lean4/BornGaussianRationalFrameObstruction.lean"
      - "lean4/BornGaussianFrameRays.lean"
      - "lean4/BornGaussianTomographyReduction.lean"
      - "lean4/lakefile.lean"
      - "lean4/lake-manifest.json"
      - "lean4/lean-toolchain"
      - "scripts/gleason_lean_audit.py"
      - "scripts/test_gleason_lean_audit.py"
      - "dag/research/gleason_lean_audit.json"
      - ".github/workflows/lean-gleason.yml"
  push:
    branches: [main]
    paths:
      - "lean4/**"
      - "scripts/gleason_lean_audit.py"
      - "dag/research/gleason_lean_audit.json"
      - ".github/workflows/lean-gleason.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-gleason-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: build and axiom-audit the Gleason modules
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test the audit tool (fail-closed cases)
        run: python -I -X utf8 -m pytest scripts/test_gleason_lean_audit.py -q -p no:cacheprovider

      - name: Emit the audit file from the current sources
        run: python -I -X utf8 scripts/gleason_lean_audit.py emit lean4/.audit/GleasonAudit.lean

      - name: Build the five Gleason targets (Mathlib from cache.mathlib.org)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean4
          auto-config: false
          build: true
          build-args: "BornGaussianParallelogramRigidity GleasonRealSphere GleasonComplexSphere GleasonGaussianBridge GleasonBornCompletion"
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Print axioms for every inventoried declaration
        working-directory: lean4
        run: lake env lean .audit/GleasonAudit.lean | tee ../gleason_audit_output.txt

      - name: Verify reports, pins and axioms against dag/research/gleason_lean_audit.json
        run: python -I -X utf8 scripts/gleason_lean_audit.py verify --lean-output gleason_audit_output.txt

      - name: Keep the raw audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gleason-audit-output
          path: gleason_audit_output.txt
          if-no-files-found: ignore
