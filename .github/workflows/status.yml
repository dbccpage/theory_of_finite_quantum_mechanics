# The status site is generated here and nowhere else.
#
# The workflow regenerates docs/status/ from the DAG, the campaign log and the git history; checks the generated
# files byte for byte against a rebuild (scripts/build_status.py --check --strict, which also fails if any
# generated file is committed); runs the generator's tests and the static DAG check; builds docs/ with Jekyll;
# and deploys the result to GitHub Pages. It commits nothing to main and deploys only what those checks passed.
# If listing open pull requests fails, the run fails and nothing is deployed.
#
# One-time setup by the maintainer: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: status

on:
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dbccpage/theory_of_finite_quantum_mechanics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Generate docs/status (digests end today, UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -X utf8 scripts/build_status.py --write --with-prs --as-of "$(date -u +%F)"

      - name: Check the generated files against a rebuild
        run: python -I -X utf8 scripts/build_status.py --check --strict --as-of "$(date -u +%F)"

      - name: Test the generator
        run: python -I -X utf8 -m pytest dag/test_build_status.py dag/test_docs_liquid_safe.py -q

      - name: Static check of the derivation DAG
        run: python -I -X utf8 dag/validate_derivation_dag.py --no-files

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site from docs/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
