# Daily status page.
#
# Regenerates docs/status/ from the DAG, the campaign log and the git history, runs the static DAG checks,
# builds docs/ with Jekyll and deploys it to GitHub Pages. It commits nothing to main: the generated files
# exist only in the runner's workspace and in the deployed site.
#
# One-time setup by the maintainer: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: status

on:
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dbccpage/theory_of_finite_quantum_mechanics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Generate docs/status (digests end today, UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -X utf8 scripts/build_status.py --write --with-prs --as-of "$(date -u +%F)"

      - name: Static check of the derivation DAG
        run: python -I -X utf8 dag/validate_derivation_dag.py --no-files

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site from docs/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
