file: "lean4/CampaignTfq0050FiniteTopological.lean"
module: "CampaignTfq0050FiniteTopological"
dag_node: "TFQ-0050"
tier: "L4D"
axioms: []
theorems:
  - name: "CampaignTfq0050FiniteTopological.catalog_ribbon_ranks_and_total_squared_dimensions"
    role: "proves total squared quantum dimensions and simple-object counts for Ising, semion, toric code, three-fermion, and D(Z_n)"
  - name: "CampaignTfq0050FiniteTopological.toric_code_vs_three_fermion_topological_spin_twists"
    role: "proves toric_code has 3 bosons + 1 fermion whereas three_fermion has 1 boson + 3 fermions on Z_2 x Z_2"
  - name: "CampaignTfq0050FiniteTopological.catalog_cyclotomic_field_admission_and_refusal"
    role: "proves exact root-of-unity divisibility admission and FieldTooSmall refusal for catalog models"
  - name: "CampaignTfq0050FiniteTopological.su3_level1_pointed_z3_fusion_vs_higher_level_nonpointed"
    role: "proves SU(3)_1 has rank 3 whereas SU(3)_k (k >= 2) has rank (k+1)(k+2)/2 >= 6 and non-pointed fusion"
  - name: "CampaignTfq0050FiniteTopological.quantum_double_z3_rank9_not_su3_level_k_fence"
    role: "proves D(Z_3) rank 9 never equals (k+1)(k+2)/2 for k = 1..6"
  - name: "CampaignTfq0050FiniteTopological.catalog_self_dual_models_not_su3_conjugate_pair_fence"
    role: "proves SU(3)_k fundamental weight (1,0) has distinct conjugate (0,1) != (1,0)"
  - name: "CampaignTfq0050FiniteTopological.su3_level2_fundamental_quantum_dimension_golden_ratio"
    role: "proves (d_(1,0))^2 = d_(0,1) + d_(2,0) = 1 + 2*phi in Q(phi) for SU(3)_2"
  - name: "CampaignTfq0050FiniteTopological.absence_of_su3_level_rs_is_open_obligation_not_impossibility_theorem_fence"
    role: "proves absence of su3_level.rs is an open implementation obligation, not a negative theorem"
  - name: "CampaignTfq0050FiniteTopological.catalog_ribbon_categories_do_not_assert_material_host_or_qcd_confinement_fence"
    role: "proves verified catalog ribbon categories assert no physical material host or QCD confinement"
  - name: "CampaignTfq0050FiniteTopological.tfq0050_catalog_and_su3_level_scope_ledger_fence"
    role: "proves the TFQ-0050 scope ledger separating catalog.rs and su2_level.rs from absent su3_level.rs"
