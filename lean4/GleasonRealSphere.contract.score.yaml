      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Lean 4\",\n    \"path\": \"lean4/GleasonRealSphere.lean\",\n    \"sha256\": \"92324a54ba4167f232a7ae6be72160b84553e2bf9f05dfd45624812f2221699d\"\n  },\n  \"boundaries\": [\n    \"The results are conditional on the declared input IsUniformlyRayContinuous f (uniform continuity on rays in the squared ray distance raySinSq u v = 1 - |<u,v>|^2/(<u,u><v,v>), whose square root is the ray metric), a mathematical input that requires justification and is not derived here; recorded as DAG nodes FQ-GLEASON-QI3-UNIFORM-RAY-CONTINUITY (TFQ-1056, CONDITIONAL) and FQ-BORN-QI3-CONTINUUM-COMPLETION (TFQ-1060, CONDITIONAL). Whether pointwise Archimedean continuity at every nonzero vector implies it for frame functions is FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM (TFQ-1057, OPEN); signed and nonnegative versions are distinguished there.\",\n    \"FQ-GLEASON-QI3-FRAME-FUNCTIONS (TFQ-1055) asks about unrestricted frame functions and its unrestricted rigidity assertion is REFUTED by the exotic Q(i)^3 frame function; nothing here changes that. FQ-GAP-BORN-UNIQUENESS-GLEASON (TFQ-0307) stays CONDITIONAL. The hypothesis class is not empty: isUniformlyRayContinuous_quadRay shows that the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays, with an existential modulus from compactness of the unit sphere of C^3 (no quantitative delta is computed). Rational-valued data determine Gaussian-rational coefficients only; arbitrary complex density matrices are not covered.\"\n  ],\n  \"claim\": \"Gleason's theorem for frame functions on nonzero vectors of (Fin 3 -> R) that are continuous away from the origin (Cooke-Keane-Moran with continuity): f v = (M <v,p>^2 + a <v,q>^2 + m <v,r>^2)/<v,v> in an orthonormal frame (p,q,r), together with Target 2 (TFQ-1059) nonnegativity bounds (IsNonnegFrameFunction, bounded_of_nonneg, ortho_add_le_weight_of_nonneg, eq_zero_on_perp_of_pole_eq_weight), general Piron tangent-step inequalities (tangentStep_le_add_equator_of_nonneg, tangentStep_sub_le_weight_sub_pole_of_nonneg), shared-normal latitude addition (exists_common_normal_lat_add), and continuity-free Proposition 1, quarter-turn, six-circle, and pure-state reductions (equator_const_is_min_of_max, prop1_pole_of_max, continuousOn_of_max_and_equator_const, prop1_of_max, sum_phat_of_max, sum_rhat_of_min, eq_stdQuad_on_six_circles_of_extrema, pure_state_nonneg_gleason_real).\",\n  \"contract_urn\": \"urn:tfqm:fq-gleason-qi3:gleasonrealsphere\",\n  \"evidence\": [\n    {\n      \"path\": \"dag/research/campaign_fq-born-qi3-continuum-completion_lean_replay.json\",\n      \"sha256\": \"d0019f55515b978b94d127467e5ece00baa85dc968bbc50f60b11422529c5660\"\n    },\n    {\n      \"path\": \"dag/research/gleason_lean_audit.json\",\n      \"sha256\": \"6ed822e49fe8f3af8713f1da94ad9a88970f7c59a7fcbb36c5f458d61222a56e\"\n    },\n    {\n      \"path\": \"lean4/GleasonRealSphere.lean\",\n      \"sha256\": \"92324a54ba4167f232a7ae6be72160b84553e2bf9f05dfd45624812f2221699d\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Gleason's theorem for frame functions on nonzero vectors of (Fin 3 -> R) that are continuous away from the origin (Cooke-Keane-Moran with continuity): f v = (M <v,p>^2 + a <v,q>^2 + m <v,r>^2)/<v,v> in an orthonormal frame (p,q,r), together with Target 2 (TFQ-1059) nonnegativity bounds (IsNonnegFrameFunction, bounded_of_nonneg, ortho_add_le_weight_of_nonneg, eq_zero_on_perp_of_pole_eq_weight), general Piron tangent-step inequalities (tangentStep_le_add_equator_of_nonneg, tangentStep_sub_le_weight_sub_pole_of_nonneg), shared-normal latitude addition (exists_common_normal_lat_add), and continuity-free Proposition 1, quarter-turn, six-circle, and pure-state reductions (equator_const_is_min_of_max, prop1_pole_of_max, continuousOn_of_max_and_equator_const, prop1_of_max, sum_phat_of_max, sum_rhat_of_min, eq_stdQuad_on_six_circles_of_extrema, pure_state_nonneg_gleaso