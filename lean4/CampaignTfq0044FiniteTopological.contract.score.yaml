module: "CampaignTfq0044FiniteTopological"
dag_node: "TFQ-0044"
tier: "L4D"
axioms: []
theorems:
  - name: "CampaignTfq0044FiniteTopological.su2_level_rank_and_root_order_bounds"
    role: "proves SU(2)_k simple-object counts k + 1 and cyclotomic root orders 8(k + 2) for k = 1..6"
  - name: "CampaignTfq0044FiniteTopological.su2_level_central_charge_and_level3_fibonacci_subring"
    role: "proves central charge 3k/(k + 2) for k = 1..6 and level-3 Fibonacci fusion 2 tensor 2 = 0 oplus 2"
  - name: "CampaignTfq0044FiniteTopological.qphi_golden_ratio_identities"
    role: "proves exact quadratic field Q(phi) identities phi^2 = 1 + phi and phi * (phi - 1) = 1"
  - name: "CampaignTfq0044FiniteTopological.racah_level3_fibonacci_f_matrix_not_euclidean_orthonormal"
    role: "proves the level-3 q-Racah F-matrix on [2,2,2,2] is not orthonormal under the Euclidean inner product"
  - name: "CampaignTfq0044FiniteTopological.racah_level3_fibonacci_f_matrix_weighted_metric_unitarity"
    role: "proves exact weighted metric unitarity F^T G F = G and det(F) = -phi^-1 in Q(phi)"
  - name: "CampaignTfq0044FiniteTopological.su2_level_quantum_dimensions_not_su3_casimirs_fence"
    role: "proves SU(3)_c Casimirs C_F = 4/3 and C_A = 3 are not SU(2)_k quantum dimensions"
  - name: "CampaignTfq0044FiniteTopological.su2_weight_lattice_rank1_not_su3_rank2_color_fusion_fence"
    role: "proves SU(2)_k labels are rank-1 self-dual whereas SU(3)_k weights are rank-2 non-self-dual"
  - name: "CampaignTfq0044FiniteTopological.su2_vs_su3_level_simple_object_count_separation"
    role: "proves k + 1 < (k + 1)(k + 2)/2 for all k = 1..6"
  - name: "CampaignTfq0044FiniteTopological.su2_level_budget_and_field_refusal_predicates"
    role: "proves budget and cyclotomic field refusal predicates for SU(2)_k"
  - name: "CampaignTfq0044FiniteTopological.tfq0044_su2_level_scope_ledger_fence"
    role: "proves the scope ledger separating su2_level.rs from absent su3_level.rs and color Casimirs"
