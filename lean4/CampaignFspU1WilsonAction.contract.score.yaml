      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Lean 4\",\n    \"path\": \"lean4/CampaignFspU1WilsonAction.lean\",\n    \"sha256\": \"5f78709a5e554f44dc52e0fe3bf79e80f34985c8c970e5128284ab7f53c3ecb0\"\n  },\n  \"assessment_id\": \"campaign-fsp-u1-wilson-action\",\n  \"assessment_status\": \"complete\",\n  \"basis\": {\n    \"G1\": \"Each claim of the narrowed node statement maps to a named declaration; fsp_u1_wilson_action states the full narrowed claim. The table is in docs/overclaim/reviews/2026-10-23_campaign-fsp-u1-wilson-action-precommit.md. Self-assessed; no independent human review yet.\",\n    \"G2\": \"Clean lake build in 51 s under Lean 4.35.0 and pinned Mathlib; twelve axiom audits report only propext, Classical.choice and Quot.sound. An exact-rational and SymPy check that imports no repository code agrees (checks=6159, failures=0).\",\n    \"G3\": \"No sorry, admit, axiom, native_decide or unsafe. Hypotheses are explicit (beta >= 0, beta > 0, closedness as a structure field); the necessity of beta >= 0 is a theorem. Empty paths and the one-vertex self-loop are handled.\",\n    \"G4\": \"Eight one-ingredient Lean mutants, all rejected by lake env lean (two consistent mutants kill through theorems, not restated definitions). The independent check includes 20 single-link non-gauge rotations and a wrong gauge rule, all detected. Not an exhaustive mutation campaign.\",\n    \"G5\": \"One module of about 320 lines in sections: group layer, commutative layer, Wilson action, angle form, hypercubic instance. Short proofs by induction and rewriting; no performance claim.\"\n  },\n  \"composite_grade\": \"D\",\n  \"evaluation_timestamp\": \"2026-10-23T19:39:36.736456+00:00\",\n  \"evidence\": [\n    {\n      \"path\": \"dag/research/campaign_fsp-u1-wilson-action_lean_replay.json\",\n      \"sha256\": \"9c81a77186fe5581abf6913a58a4c0e448a096393289d55c5b302b2b41ca3881\"\n    },\n    {\n      \"path\": \"dag/research/camp