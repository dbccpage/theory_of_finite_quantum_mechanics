  frozen_sources: Run snapshots under verification/ are immutable custody assets.
boundaries:
- The trace norm is the variational form; its equality with the Schatten-1 norm is cited.
- The noise is global depolarizing at a declared rate per step; it is not a model of independent per-qubit
  noise or of any device.
- The Aharonov-Ben-Or-Impagliazzo-Nisan 1996 theorem is cited as context only.
