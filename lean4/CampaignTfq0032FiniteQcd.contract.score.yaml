theorems:
  - name: "CampaignTfq0032FiniteQcd.suN_qqbar_casimir_channel_formulas"
    role: "proves exact rational SU(3) singlet (-4/3) and octet (+1/6) channel Casimir factors"
  - name: "CampaignTfq0032FiniteQcd.su3_qqbar_dimension_and_weighted_trace_sum_zero"
    role: "proves 3*3 = 1 + 8 and weighted color-trace cancellation 1*(-4/3) + 8*(1/6) = 0"
  - name: "CampaignTfq0032FiniteQcd.singlet_attractive_vs_octet_repulsive_sign_dichotomy"
    role: "proves singlet attraction (< 0), octet repulsion (> 0), and ratio -8"
  - name: "CampaignTfq0032FiniteQcd.su2_vs_su3_qqbar_casimir_channel_contrast"
    role: "contrasts SU(2) (-3/4, +1/4) with SU(3) (-4/3, +1/6) qqbar channel factors"
  - name: "CampaignTfq0032FiniteQcd.color_contraction_projector_idempotence_and_orthogonality"
    role: "proves trace preservation, tracelessness, completeness, idempotence, and orthogonality of 3x3 singletProj and octetProj"
  - name: "CampaignTfq0032FiniteQcd.finite_meson_composite_carrier_dimension"
    role: "proves declared finite meson carrier dimension 36 * L^d"
  - name: "CampaignTfq0032FiniteQcd.meson_mass_operator_requires_spatial_kinetic_and_potential_terms_fence"
    role: "proves channel Casimir alone does not fix the spatial mass operator determinant"
  - name: "CampaignTfq0032FiniteQcd.channel_casimir_ratio_not_spatial_wavefunction_fence"
    role: "contrasts fixed rational channel pair (-4/3, 1/6) with L^3 spatial orbital growth"
  - name: "CampaignTfq0032FiniteQcd.pseudoscalar_vs_vector_hyperfine_splitting_requires_spin_operator_fence"
    role: "proves spin-0 vs spin-1 splitting requires a non-zero spin-spin coupling"
  - name: "CampaignTfq0032FiniteQcd.tfq0032_meson_channel_scope_ledger_fence"
    role: "audits Tfq0032ScopeLedger flags"
