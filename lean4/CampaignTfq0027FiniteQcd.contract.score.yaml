theorems:
  - name: "CampaignTfq0027FiniteQcd.wilson_species_count_shell_selection"
    role: "proves exact rational 4D wilson_species_count selects binomial shells 1, 4, 6, 4, 1 at critical masses"
  - name: "CampaignTfq0027FiniteQcd.wilson_term_vanishes_only_at_origin_corner"
    role: "proves 2*r*c = 0 iff c = 0 for r > 0"
  - name: "CampaignTfq0027FiniteQcd.wilson_scalar_term_anticommutes_with_no_gamma_generator"
    role: "proves non-zero scalar Wilson term fails to anticommute with gamma1, gamma2, and gamma5"
  - name: "CampaignTfq0027FiniteQcd.zero_mode_count_rank_nullity_formula"
    role: "proves zero_mode_count + rank = s*N^d and 1D N=4 kernel dimension transitions"
  - name: "CampaignTfq0027FiniteQcd.antiperiodic_twist_excludes_zero_and_pi_corners"
    role: "proves odd half-integer antiperiodic modes never hit 0 or 2*m"
  - name: "CampaignTfq0027FiniteQcd.even_n_periodic_vs_antiperiodic_species_contrast"
    role: "proves even-N periodic vs antiperiodic species count contrast (16 vs 0 in 4D)"
  - name: "CampaignTfq0027FiniteQcd.c3_to_c6_naive_duplication_vs_block_last_refinement"
    role: "imports IntegralRefinementC3C6 and contrasts naiveDuplicate with blockLastRefine"
  - name: "CampaignTfq0027FiniteQcd.c3_c6_charge_refinement_not_lattice_dirac_obstruction_fence"
    role: "proves non-equivalence between C3->C6 scalar charge doubling and 2^d lattice Dirac doubling"
  - name: "CampaignTfq0027FiniteQcd.max_carrier_dimension_128_dense_operator_fence"
    role: "proves MAX_CARRIER_DIMENSION = 128 admission bound for dense operator rank"
  - name: "CampaignTfq0027FiniteQcd.tfq0027_scope_and_citation_fence"
    role: "audits Tfq0027ScopeLedger flags"
