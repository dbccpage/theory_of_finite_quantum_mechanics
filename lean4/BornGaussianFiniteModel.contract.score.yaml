      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Lean 4\",\n    \"path\": \"lean4/BornGaussianFiniteModel.lean\",\n    \"sha256\": \"2357f6304833adbabfa78461584c1ca451b798f06bcb49f1cc8565c0bbe86022\"\n  },\n  \"boundaries\": [\n    \"The results are conditional on the declared input IsUniformlyRayContinuous f (uniform continuity on rays in the squared ray distance raySinSq u v = 1 - |<u,v>|^2/(<u,u><v,v>), whose square root is the ray metric), a mathematical input that requires justification and is not derived here; recorded as DAG nodes FQ-GLEASON-QI3-UNIFORM-RAY-CONTINUITY (TFQ-1056, CONDITIONAL) and FQ-BORN-QI3-CONTINUUM-COMPLETION (TFQ-1060, CONDITIONAL). Whether pointwise Archimedean continuity at every nonzero vector implies it for frame functions is FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM (TFQ-1057, OPEN); signed and nonnegative versions are distinguished there.\",\n    \"FQ-GLEASON-QI3-FRAME-FUNCTIONS (TFQ-1055) asks about unrestricted frame functions and its unrestricted rigidity assertion is REFUTED by the exotic Q(i)^3 frame function; nothing here changes that. FQ-GAP-BORN-UNIQUENESS-GLEASON (TFQ-0307) stays CONDITIONAL. The hypothesis class is not empty: isUniformlyRayContinuous_quadRay shows that the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays, with an existential modulus from compactness of the unit sphere of C^3 (no quantitative delta is computed). Rational-valued data determine Gaussian-rational coefficients only; arbitrary complex density matrices are not covered.\"\n  ],\n  \"claim\": \"Density-matrix completion of the Gleason hinge on Q(i)^3 (FQ-BORN-QI3-CONTINUUM-COMPLETION). toMatrix rho is the complex 3 x 3 matrix of a rational Hermitian form: Hermitian, trace rho.tr, acting on iota g as rho.applyVec g. born_density_matrix_of_uniformlyRayContinuous: for every nonnegative frame function f on Q(i)^3 that is uniformly continuous on rays (declared input IsUniformlyRayContinuous f) there is a positive semidefinite trace-one complex matrix rhoC with F f v = Re <v, rhoC v>/<v,v> on every nonzero v in C^3 and f g = Re <g, rhoC g>/<g,g> on every nonzero g in Q(i)^3, and rhoC is the only Hermitian matrix with the first property (polarization, eq_of_re_dotC_mulVec_self). F_eq_QcRay is the signed version without positivity (continuous scale-invariant extensions agreeing on rational points agree, eq_on_nonzero_of_eq_on_\u03b9). isUniformlyRayContinuous_quadRay: the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays (compactness of the unit sphere of C^3 and phase alignment of unit representatives). uniformlyRayContinuous_frameFunction_iff: the frame functions on Q(i)^3 that are uniformly continuous on rays are exactly the Rayleigh quotients of trace-one rational Hermitian forms on nonzero vectors. Section 9 (TFQ-1057) formalizes the exact anatomy of HasBoundedAnchorAmplification (hasBoundedAnchorAmplificationOn_iff_zero_of_pointwise, hasBoundedAnchorAmplificationOn_of_bounded_and_discontinuous_at_anchor, s3_leadAll_hasBoundedAnchorAmplification), 15-ray bisector vanishing and 15-plane antisymmetry (fifteenAnchorBisector_zero_of_zeroWeight_and_nine, fifteen_plane_ortho_antisymmetry, one_step_collar_confinement_of_anchor_frame), finite ray-list collar blindness (minPosRaySinSqList, finite_ray_list_collar_blindness), and scale-invariant radial meridian-Kelvin transport and k-step linear amplification bounds (anchor_meridian_radial_scale_transport, radialScale_meridian_step_raySinSq_lt, meridian_chain_linear_amplification_bound). Section 10 (TFQ-1057) formalizes single-step meridian-Kelvin angular displacement bounds (anchorMeridianOrtho_raySinSq_lt_four_mul, radialScale_meridianOrtho_raySinSq_lt_four_mul, anchorMeridianStep_sub_raySinSq_eq_four_mul), the projective quadratic triangle inequality (raySinSq_le_two_mul_add), k-step chain displacement bounds (ChainAngularStepBounded, chain_raySinSq_endpoint_le), the k(delta) -> infinity no-go theorem for uniform step bounds K_0 (no_uniform_step_bound_for_delta_collar_meridian_chains, witness111_no_uniform_step_meridian_chain_from_nineAnchors, witness123_no_uniform_step_meridian_chain_from_fifteenAnchorBisector), and the sublinear vs. 1/k chain-drift dichotomy (HasSublinearChainDriftFrom, zero_of_hasSublinearChainDriftFrom, linearDriftChain_constant_gap_of_inv_k_step, sublinear_vs_inv_k_chain_drift_dichotomy).\",\n  \"contract_id\": \"phase2-finite-gleason-model-l4d-v1\",\n  \"contract_urn\": \"urn:tfqm:fq-born-qi3:gleasonborncompletion\",\n  \"evidence\": [\n    {\n      \"path\": \"lean4/BornGaussianFiniteModel.lean\",\n      \"role\": \"source\",\n      \"sha256\": \"2357f6304833adbabfa78461584c1ca451b798f06bcb49f1cc8565c0bbe86022\"\n    },\n    {\n      \"path\": \"dag/research/gleason_lean_audit.json\",\n      \"role\": \"axiom_and_build_audit\",\n      \"sha256\": \"13d13c7c8915c761d3d63465d36da08eb27dc945f037c814a15114b1f621ee91\"\n    },\n    {\n      \"path\": \"dag/research/gleason_finite_model_receipt.json\",\n      \"role\": \"phase2_certificate_and_counterexample_receipt\",\n      \"sha256\": \"c97e795d77f70ba1a3924f3c6a3fc579956faa302f615ff88a0ab2850561367c\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"role\": \"rubric\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Density-matrix completion of the Gleason hinge on Q(i)^3 (FQ-BORN-QI3-CONTINUUM-COMPLETION). toMatrix rho is the complex 3 x 3 matrix of a rational Hermitian form: Hermitian, trace rho.tr, acting on iota g as rho.applyVec g. born_density_matrix_of_uniformlyRayContinuous: for every nonnegative frame function f on Q(i)^3 that is uniformly continuous on rays (declared input IsUniformlyRayContinuous f) there is a positive semidefinite trace-one complex matrix rhoC with F f v = Re <v, rhoC v>/<v,v> on every nonzero v in C^3 and f g = Re <g, rhoC g>/<g,g> on every nonzero g in Q(i)^3, and rhoC is the only Hermitian matrix with the first property (polarization, eq_of_re_dotC_mulVec_self). F_eq_QcRay is the signed version without positivity (continuous scale-invariant extensions agreeing on rational points agree, eq_on_nonzero_of_eq_on_\u03b9). isUniformlyRayContinuous_quadRay: the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays (compactness of the unit sphere of C^3 and phase alignment of unit representatives). uniformlyRayContinuous_frameFunction_iff: the frame functions on Q(i)^3 that are uniformly continuous on rays are exactly the Rayleigh quotients of trace-one rational Hermitian forms on nonzero vectors. Section 9 (TFQ-1057) formalizes the exact anatomy of HasBoundedAnchorAmplification (hasBoundedAnchorAmplificationOn_iff_zero_of_pointwise, hasBoundedAnchorAmplificationOn_of_bounded_and_discontinuous_at_anchor, s3_leadAll_hasBoundedAnchorAmplification), 15-ray bisector vanishing and 15-plane antisymmetry (fifteenAnchorBisector_zero_of_zeroWeight_and_nine, fifteen_plane_ortho_antisymmetry, one_step_collar_confinement_of_anchor_frame), finite ray-list collar blindness (minPosRaySinSqList, finite_ray_list_collar_blindness), and scale-invariant radial meridian-Kelvin transport and k-step linear amplification bounds (anchor_meridian_radial_scale_transport, radialScale_meridian_step_raySinSq_lt, meridian_chain_linear_amplification_bound). Section 10 (TFQ-1057) formalizes single-step meridian-Kelvin angular displacement bounds (anchorMeridianOrtho_raySinSq_lt_four_mul, radialScale_meridianOrtho_raySinSq_lt_four_mul, anchorMeridianStep_sub_raySinSq_eq_four_mul), the projective quadratic triangle inequality (raySinSq_le_two_mul_add), k-step chain displacement bounds (ChainAngularStepBounded, chain_raySinSq_endpoint_le), the k(delta) -> infinity no-go theorem for uniform step bounds K_0 (no_uniform_step_bound_for_delta_collar_meridian_chains, witness111_no_uniform_step_meridian_chain_fro