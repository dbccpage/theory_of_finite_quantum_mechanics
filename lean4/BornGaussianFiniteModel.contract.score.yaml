        "owned_invariants": [
          "Density-matrix completion of the Gleason hinge on Q(i)^3 (FQ-BORN-QI3-CONTINUUM-COMPLETION). toMatrix rho is the complex 3 x 3 matrix of a rational Hermitian form: Hermitian, trace rho.tr, acting on iota g as rho.applyVec g. born_density_matrix_of_uniformlyRayContinuous: for every nonnegative frame function f on Q(i)^3 that is uniformly continuous on rays (declared input IsUniformlyRayContinuous f) there is a positive semidefinite trace-one complex matrix rhoC with F f v = Re <v, rhoC v>/<v,v> on every nonzero v in C^3 and f g = Re <g, rhoC g>/<g,g> on every nonzero g in Q(i)^3, and rhoC is the only Hermitian matrix with the first property (polarization, eq_of_re_dotC_mulVec_self). F_eq_QcRay is the signed version without positivity (continuous scale-invariant extensions agreeing on rational points agree, eq_on_nonzero_of_eq_on_ι). isUniformlyRayContinuous_quadRay: the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays (compactness of the unit sphere of C^3 and phase alignment of unit representatives). uniformlyRayContinuous_frameFunction_iff: the frame functions on Q(i)^3 that are uniformly continuous on rays are exactly the Rayleigh quotients of trace-one rational Hermitian forms on nonzero vectors.",
