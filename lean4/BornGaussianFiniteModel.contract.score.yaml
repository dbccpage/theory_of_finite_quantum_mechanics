      "raw_utf8": "{\n  \"AuthorityEffect\": \"None\",\n  \"artifact\": {\n    \"language\": \"Lean 4\",\n    \"path\": \"lean4/BornGaussianFiniteModel.lean\",\n    \"sha256\": \"c9966e756d0811ac7bc610983ba3f91f61a004c01014e6411fc6f8e17c44a717\"\n  },\n  \"boundaries\": [\n    \"The results are conditional on the declared input IsUniformlyRayContinuous f (uniform continuity on rays in the squared ray distance raySinSq u v = 1 - |<u,v>|^2/(<u,u><v,v>), whose square root is the ray metric), a mathematical input that requires justification and is not derived here; recorded as DAG nodes FQ-GLEASON-QI3-UNIFORM-RAY-CONTINUITY (TFQ-1056, CONDITIONAL) and FQ-BORN-QI3-CONTINUUM-COMPLETION (TFQ-1060, CONDITIONAL). Whether pointwise Archimedean continuity at every nonzero vector implies it for frame functions is FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM (TFQ-1057, OPEN); signed and nonnegative versions are distinguished there.\",\n    \"FQ-GLEASON-QI3-FRAME-FUNCTIONS (TFQ-1055) asks about unrestricted frame functions and its unrestricted rigidity assertion is REFUTED by the exotic Q(i)^3 frame function; nothing here changes that. FQ-GAP-BORN-UNIQUENESS-GLEASON (TFQ-0307) stays CONDITIONAL. The hypothesis class is not empty: isUniformlyRayContinuous_quadRay shows that the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays, with an existential modulus from compactness of the unit sphere of C^3 (no quantitative delta is computed). Rational-valued data determine Gaussian-rational coefficients only; arbitrary complex density matrices are not covered.\"\n  ],\n  \"claim\": \"Density-matrix completion of the Gleason hinge on Q(i)^3 (FQ-BORN-QI3-CONTINUUM-COMPLETION). toMatrix rho is the complex 3 x 3 matrix of a rational Hermitian form: Hermitian, trace rho.tr, acting on iota g as rho.applyVec g. born_density_matrix_of_uniformlyRayContinuous: for every nonnegative frame function f on Q(i)^3 that is uniformly continuous on rays (declared input IsUniformlyRayContinuous f) there is a positive semidefinite trace-one complex matrix rhoC with F f v = Re <v, rhoC v>/<v,v> on every nonzero v in C^3 and f g = Re <g, rhoC g>/<g,g> on every nonzero g in Q(i)^3, and rhoC is the only Hermitian matrix with the first property (polarization, eq_of_re_dotC_mulVec_self). F_eq_QcRay is the signed version without positivity (continuous scale-invariant extensions agreeing on rational points agree, eq_on_nonzero_of_eq_on_ι). isUniformlyRayContinuous_quadRay: the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays (compactness of the unit sphere of C^3 and phase alignment of unit representatives). uniformlyRayContinuous_frameFunction_iff: the frame functions on Q(i)^3 that are uniformly continuous on rays are exactly the Rayleigh quotients of trace-one rational Hermitian forms on nonzero vectors.\",\n  \"contract_id\": \"phase2-finite-gleason-model-l4d-v1\",\n  \"contract_urn\": \"urn:tfqm:fq-born-qi3:gleasonborncompletion\",\n  \"evidence\": [\n    {\n      \"path\": \"lean4/BornGaussianFiniteModel.lean\",\n      \"role\": \"source\",\n      \"sha256\": \"c9966e756d0811ac7bc610983ba3f91f61a004c01014e6411fc6f8e17c44a717\"\n    },\n    {\n      \"path\": \"dag/research/gleason_lean_audit.json\",\n      \"role\": \"axiom_and_build_audit\",\n      \"sha256\": \"37db40eb2ae0d2aea6b320db1997ca4bcb9cdd60bda03986a99fc44a619f1b7a\"\n    },\n    {\n      \"path\": \"dag/research/gleason_finite_model_receipt.json\",\n      \"role\": \"phase2_certificate_and_counterexample_receipt\",\n      \"sha256\": \"81364ee6802d304c80868a75ecb19d497309553f41cc940535d525228acbcdce\"\n    },\n    {\n      \"path\": \"SCORING.md\",\n      \"role\": \"rubric\",\n      \"sha256\": \"16f775f1135c3e8f6e72d05ef0249eb1b8dd7bdeec9b8dace15be4e6dbc4601a\"\n    }\n  ],\n  \"owned_invariants\": [\n    \"Density-matrix completion of the Gleason hinge on Q(i)^3 (FQ-BORN-QI3-CONTINUUM-COMPLETION). toMatrix rho is the complex 3 x 3 matrix of a rational Hermitian form: Hermitian, trace rho.tr, acting on iota g as rho.applyVec g. born_density_matrix_of_uniformlyRayContinuous: for every nonnegative frame function f on Q(i)^3 that is uniformly continuous on rays (declared input IsUniformlyRayContinuous f) there is a positive semidefinite trace-one complex matrix rhoC with F f v = Re <v, rhoC v>/<v,v> on every nonzero v in C^3 and f g = Re <g, rhoC g>/<g,g> on every nonzero g in Q(i)^3, and rhoC is the only Hermitian matrix with the first property (polarization, eq_of_re_dotC_mulVec_self). F_eq_QcRay is the signed version without positivity (continuous scale-invariant extensions agreeing on rational points agree, eq_on_nonzero_of_eq_on_ι). isUniformlyRayContinuous_quadRay: the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays (compactness of the unit sphere of C^3 and phase alignment of unit representatives). uniformlyRayContinuous_frameFunction_iff: the frame functions on Q(i)^3 that are uniformly continuous on rays are exactly the Rayleigh quotients of trace-one rational Hermitian forms on nonzero vectors.\",\n    \"AuthorityEffect is None; FQ-GLEASON-QI3-FRAME-FUNCTIONS stays REFUTED, FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM stays OPEN and FQ-GAP-BORN-UNIQUENESS-GLEASON stays CONDITIONAL.\"\n  ],\n  \"purpose\": \"Formalize the Phase 2 finite and exact-arithmetic Gleason model over Q(i)^3, connecting the 5 finiteness regimes, effect-additivity vs frame-additivity separation, boundedness of nonnegative frame functions, residual oscillations, and the fixed-anchor certificate inequality.\",\n  \"schema_id\": \"tfqm.source-contract.v1\",\n  \"source_sha256\": \"c9966e756d0811ac7bc610983ba3f91f61a004c01014e6411fc6f8e17c44a717\",\n  \"subject\": \"lean4/BornGaussianFiniteModel.lean\",\n  \"symbols\": [\n    \"BornFinite.GaussianFiniteModel.FiniteFrameScenario\",\n    \"BornFinite.GaussianFiniteModel.IsScenarioValuation\",\n    \"BornFinite.GaussianFiniteModel.IsNonnegScenarioValuation\",\n   