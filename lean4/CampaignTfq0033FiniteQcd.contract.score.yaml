theorems:
  - name: "CampaignTfq0033FiniteQcd.su3_qq_diquark_casimir_channels"
    role: "proves exact rational SU(3) antitriplet (-2/3) and sextet (+1/3) diquark Casimir factors and weighted trace zero"
  - name: "CampaignTfq0033FiniteQcd.diquark_to_qqbar_singlet_half_strength_rule"
    role: "proves -2/3 = (1/2)*(-4/3) and non-zero Casimir of 2-quark channels"
  - name: "CampaignTfq0033FiniteQcd.su3_three_quark_dimension_decomposition"
    role: "proves 3*3*3 = 27 = 1 + 8 + 8 + 10"
  - name: "CampaignTfq0033FiniteQcd.levi_civita_3d_antisymmetry_and_six_nonzero_permutations"
    role: "proves total antisymmetry and diagonal vanishing of 3-index Levi-Civita eps3"
  - name: "CampaignTfq0033FiniteQcd.levi_civita_contracted_square_and_norm_six"
    role: "proves sum (eps3 i j k)^2 = 6 and sum_{j,k} eps3 i j k * eps3 i' j k = 2 delta_{ii'}"
  - name: "CampaignTfq0033FiniteQcd.three_index_epsilon_contraction_equals_det3"
    role: "proves baryonEpsilonContract equals 3x3 determinant and evaluates to 1 on (R,G,B)"
  - name: "CampaignTfq0033FiniteQcd.baryon_contraction_vanishes_on_identical_color_states"
    role: "proves Pauli color exclusion and antisymmetry of baryonEpsilonContract"
  - name: "CampaignTfq0033FiniteQcd.baryon_singlet_total_pairwise_casimir_equals_minus_two"
    role: "proves 3 * (-2/3) = -2 = (0 - 3*C_2(3))/2 for a 3-quark color singlet"
  - name: "CampaignTfq0033FiniteQcd.two_index_diquark_not_three_index_baryon_singlet_fence"
    role: "fences 2-index diquark (dim 3, C_2 = 4/3) from 3-index baryon singlet (dim 1, C_2 = 0)"
  - name: "CampaignTfq0033FiniteQcd.tfq0033_baryon_contraction_scope_ledger_fence"
    role: "audits Tfq0033ScopeLedger flags"
