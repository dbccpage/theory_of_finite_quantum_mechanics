    "boundaries": [
      "The results are conditional on the declared input IsUniformlyRayContinuous f (uniform continuity on rays in the squared ray distance raySinSq u v = 1 - |<u,v>|^2/(<u,u><v,v>), whose square root is the ray metric), a mathematical input that requires justification and is not derived here; recorded as DAG nodes FQ-GLEASON-QI3-UNIFORM-RAY-CONTINUITY (TFQ-1056, CONDITIONAL) and FQ-BORN-QI3-CONTINUUM-COMPLETION (TFQ-1060, CONDITIONAL). Whether pointwise Archimedean continuity at every nonzero vector implies it for frame functions is FQ-GLEASON-QI3-POINTWISE-TO-UNIFORM (TFQ-1057, OPEN); signed and nonnegative versions are distinguished there.",
      "FQ-GLEASON-QI3-FRAME-FUNCTIONS (TFQ-1055) asks about unrestricted frame functions and its unrestricted rigidity assertion is REFUTED by the exotic Q(i)^3 frame function; nothing here changes that. FQ-GAP-BORN-UNIQUENESS-GLEASON (TFQ-0307) stays CONDITIONAL. The hypothesis class is not empty: isUniformlyRayContinuous_quadRay shows that the Rayleigh quotient of every rational Hermitian form is uniformly continuous on rays, with an existential modulus from compactness of the unit sphere of C^3 (no quantitative delta is computed). Rational-valued data determine Gaussian-rational coefficients only; arbitrary complex density matrices are not covered."
    ],
    "claim": "Phase 4 continuum Gleason development across S^2, C^3, and H_d(C). Part A formalizes factorized Gaussian-rational states factorizedState3 B = B B^* / tr(B B^*) on Q(i)^3, establishing positivity (factorizedState3_quadNum_nonneg), trace normalization (factorizedState3_tr_eq_one), complex PSD lift (toMatrix_factorizedState3_posSemidef_and_trace_one), uniform Rayleigh stability (abs_complexRayleigh_sub_le and factorizedState3_born_prob_error_le), and polarization uniqueness (complex_hermitian_unique_of_rayleigh_eq). Part B covers dimensions d = 0 (dim0_frameValuation_vacuously_unique), d = 1 (dim1_frameValuation_eq_one), d = 2 counterexamples (dim2AxisCounterexample_isNonnegFrameFunction2, dim2AxisCounterexample_not_quadratic, dim2_projection_measure_obstruction), and d >= 3 3D subspace compatibility and global polarization uniqueness (submatrix3D_isHermitian, submatrix3D_trace_eq_subspace_weight, compat_submatrix3D_overlap, eq_of_complexQuadFormD_eq). Part C establishes the Piron-Soler continuum regularity step on C^3 (exists_continuumFrame3_completion, nonneg_continuum_frameFunction_bounds, continuum_piron_subadditivity, continuum_eq_zero_on_perp_of_pole_one). Part D formalizes finite-cutoff compressions and tightness vs. rank-one basis escape (compressionTrace_mono, tail_weight_le_of_tight, basisEscapeState_escapes_to_zero_without_tightness). Part E formalizes the d = 3 to general finite dimension d >= 3 subspace restriction bridge (embed3D, isOrthonormalBasisD_single, replaceBasis3D, restrict3D, isFrameFunctionC_restrict3D_of_basis, gleason_subspace3D_of_continuousD, gleason_basis3D_of_continuousD, pure_state_nonneg_gleason_subspace3D, pure_state_nonneg_gleason_basis3D, complexQuadFormD_parallelogram, complexRayleighD_embed3D_single_eq_submatrix3D, subspaceMatrix3D_isHermitian, complexRayleighD_embed3D_eq_subspaceMatrix3D, hasSubspace3FrameAdditivityD_complexRayleighD, eq_of_complexRayleighD_eq).",
