      the positive factorization result on the report image. No host checker evaluated any reply. And the small grammar in the grammar folder
      is a notation for the inscriptions that occurred, not a finding.

  - id: s093
    chapter: "Where this leads"
    visual:
      kind: flow
      heading: "Next"
      nodes:
        - {text: "000 Pre-Genesis", colour: good}
        - "001 Genesis"
        - "002 S(n)"
        - "003 MSS-N"
      caption: "Genesis begins where the trials stopped: with an explicit, recorded act of supply."
    narration: >
      Where next? Genesis, strand zero zero one, begins exactly where these trials stopped. It does not ask a model what comes after the empty mark.
      It records explicit acts of supply and admission, and asks what each act forces. The lessons carry over. Presentation is not expressive power.
      A successful answer must retain the distinction the task requires. What a checker can establish depends on the task and its actual input.
      Thank you for watching. The curriculum file for this strand has exercises with answers for each of the eight parts.
