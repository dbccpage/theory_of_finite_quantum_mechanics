# Narration and visuals for the 000 Pre-Genesis explainer.
# AuthorityEffect: None. Every quote is from sources/ and cited in 02_trial_record.md.
# Build: see ../../../education_app/_docs/video_builder.md
title: "Before Genesis: what a language model does with an empty mark"
strand: "000 Pre-Genesis"
output_name: 000_pre_genesis
segments:

  - id: s001
    chapter: "Opening"
    visual:
      kind: title
      title: "Before Genesis"
      subtitle: "What a language model does with an empty mark"
      tagline: "Strand 000 of the Omega Engine curriculum"
    narration: >
      Before Genesis. What a language model does with an empty mark.
      This is the first strand of the Omega Engine curriculum, and it is about an experiment.
      Before the engine admitted its first symbol, its author handed a language model two angle brackets
      with nothing between them, and watched what the model did.

  - id: s002
    chapter: "Opening"
    visual:
      kind: bullets
      heading: "What this video covers"
      items:
        - "The question, and how the experiment was designed"
        - "Bare marks, and what the model read into them"
        - "The empty mark under a strict prompt"
        - "A new mark: new state or new costume?"
        - "The collision, and why a distinction is forced"
        - "Auditing the auditor"
        - "Provenance, replay, and the main theorem"
        - "Admission before distinction, and where this leads"
    narration: >
      Here is the route. First the question and the design. Then the bare control prompts.
      Then the empty mark under a strict prompt, and what happened when a new mark was supplied.
      Then the collision between two marks, and a short proof that a required distinction forces new structure.
      Then two lessons about auditing, one theorem about replay, and finally why a symbol has to be admitted
      before it can be told apart from anything. At the end we connect all of this to the Proposal Fidelity Protocol,
      which is how the engine talks to language models today.

  - id: s003
    chapter: "Opening"
    visual:
      kind: table
      heading: "The record"
      columns: ["Run", "Prompts", "Notes"]
      rows:
        - ["Trial 1", "1 to 13", "controls sent inside code fences"]
        - ["Trial 2", "1 to 17", "controls sent raw; appended analysis"]
        - ["Full replay", "11, 12, 14, 15, 17, 18, 19", "full history, under a replay wrapper"]
      caption: "Model identifier, settings and dates were not recorded. Three runs; no rates."
    narration: >
      Everything in this video comes from six files kept in the sources folder of this strand.
      There are exactly three recorded runs. Trial one, prompts one to thirteen. Trial two, prompts one to seventeen.
      And a full history replay of seven prompts. The files are named DeepSeek version zero point zero, one point zero
      and one point one, but those are file versions, not model versions. The model identifier, its settings
      and the dates were never recorded. So nothing you hear today is a rate or a percentage. Each result is one reply.

  - id: s004
    chapter: "Opening"
    visual:
      kind: bullets
      heading: "A correction first"
      items:
        - {text: "Earlier versions of this strand reported \"50 trials\" with pass rates", colour: bad}
        - {text: "They also quoted replies that do not exist in the transcripts", colour: bad}
        - {text: "And named antibodies, refusal types and error codes found nowhere else", colour: bad}
        - {text: "This version cites a line in sources/ for every quote", colour: good}
    narration: >
      A correction before we start. Earlier versions of this strand reported fifty systematic trials with pass rates
      like ninety six percent. No source contains a count of fifty or any pass rate. Those versions also quoted model
      replies that do not appear in the transcripts, and listed antibodies, refusal types and error codes that exist
      nowhere else in the repository. They were removed. Everything here is tied to a line in the record,
      and the written chapters give the line numbers so you can check.

  # ---------------------------------------------------------------- Lesson 1
  - id: s010
    chapter: "1. The question and the design"
    visual:
      kind: bullets
      heading: "The research question"
      items:
        - "Give a model an uninterpreted finite inscription"
        - "Require it to separate external presentation from internal expressibility"
        - "Watch what symbolic resources it introduces"
        - "In what order, and under what failures, it enlarges the regime"
      caption: "design_derivation_v0.md, line 426"
    narration: >
      Part one. The question. The design document states it in one sentence. When a frontier language model
      is given an uninterpreted finite inscription, and is required to distinguish external presentation from internal
      expressibility, what symbolic resources does it introduce, in what order, and under what failures does it enlarge the regime?
      Notice what is not being asked. Nobody asks the model to reproduce a theory. The design even rejects, in advance,
      the headline that the model rediscovered the Omega Engine.

  - id: s011
    chapter: "1. The question and the design"
    visual:
      kind: math
      heading: "The governing principle"
      lines:
        - {text: "Prompt 1 should constrain"}
        - '\textbf{epistemology,\ not\ mathematics}'
        - {text: "An earlier run over-specified stages, statuses, proof path and receipt type."}
        - {text: "The model treated it as a simulation and considered producing a fake hash."}
    narration: >
      The first principle is written in bold at the top of the design. The prompt should constrain epistemology,
      not mathematics. In other words, tell the model what it may assume and what it must keep apart,
      but never tell it what the answer should look like. This came from a failure. An earlier experiment,
      called the Pontryagin run, had spelled out the stages, the statuses, the proof path and the kind of receipt expected.
      The model decided it was in a simulation, and considered generating a fake hash to satisfy the format.
      Over specification invites performance instead of reasoning.

  - id: s012
    chapter: "1. The question and the design"
    visual:
      kind: bullets
      heading: "Hidden comparison targets"
      items:
        - "that the empty mark means Primitive Difference"
        - "that an obstruction should be removed, or structure added"
        - "that a lift, quotient, tower, DDC trace or Prime algorithm should appear"
        - "that a graph, cochain or homology should appear"
        - "that <a> is the intended next state"
      caption: "Things the model was never told (design lines 7 to 16)"
    narration: >
      So the model was deliberately not told any of the things the author was hoping to compare against.
      It was not told that the empty mark stands for primitive difference. Not told that an obstruction should be removed,
      or that structure should be added. Not told that a lift, a quotient, a tower, a trace, a graph, a cochain or a homology
      should appear. And not told that a in angle brackets was the intended next state. These are comparison targets.
      They stay in the author's notebook, not in the prompt.

  - id: s013
    chapter: "1. The question and the design"
    visual:
      kind: table
      heading: "Pre-registered branches"
      columns: ["Branch", "If the model...", "Then"]
      wrap: [8, 30, 34]
      rows:
        - ["A", "proposes <a>", "continue; do not congratulate it"]
        - ["B", "proposes another payload, like <x>", "follow its symbol exactly"]
        - ["C", "proposes a relation, copy or operator", "keep it as a native branch"]
        - [{text: "D", colour: good}, {text: "says no continuation is forced", colour: good}, {text: "success: supply <a> as a marked caller intervention", colour: good}]
    narration: >
      The continuation rules were written down before the first reply was read. If the model proposes a in angle brackets,
      continue, and do not congratulate it. If it proposes some other payload, follow its symbol exactly, because the structure
      matters, not the glyph. If it proposes a relation, a duplication or an operator, keep that as its own branch.
      And branch D. If the model says that no continuation is forced, that is a success, not a failure.
      The next mark is then supplied by the caller, and the transcript marks it as not model derived but externally supplied.
      That one rule carries the whole philosophy of the strand. A move from outside is not the same thing as a move from inside.

  - id: s014
    chapter: "1. The question and the design"
    visual:
      kind: bullets
      heading: "Controls and auditing"
      items:
        - {code: "<>   []   {}   ()   ><   ||   ¤§   a   aa   ab"}
        - "A separate, blind auditor prompt to find the earliest import"
        - "No packet wrapper during discovery"
        - {text: "Found afterwards: Trial 1 sent controls in code fences", colour: accent2}
        - {text: "Found afterwards: Trial 1 bundled two prompts in one message", colour: accent2}
    narration: >
      The design also called for controls. The bare empty mark first, then square brackets, braces, parentheses,
      the reversed brackets, two vertical bars, two unusual symbols, and the letters a, double a, and a b.
      It called for a separate blind auditor, a second prompt whose job is to find the earliest place a reply imported
      structure it was not given. And it said: no packet wrapper during discovery, because a wrapper is itself a hint.
      Two defects were found afterwards. Trial one sent the controls inside code fences, and it bundled two prompts into one message.
      Trial two fixed both.

  # ---------------------------------------------------------------- Lesson 2
  - id: s020
    chapter: "2. Bare marks"
    visual:
      kind: dialogue
      heading: "Prompt 1, Trial 1 (inside a code fence)"
      turns:
        - {who: "Prompt 1", text: "<>", mono: true}
        - {who: "Reply", side: right, text: "It looks like you've sent the symbol <> inside a code block. ... not equal to (SQL, Pascal) ... generic type parameters ... HTML/XML ... inner products or bra-ket notation ... placeholder ..."}
    narration: >
      Part two. Bare marks. In trial one, the empty mark arrived inside a code block. The reply began:
      it looks like you've sent the symbol inside a code block. It then offered a tour of meanings.
      Not equal to, in SQL and Pascal. Generic type parameters. Markup tags. Inner products and the bra ket notation of physics.
      A placeholder. Then it asked which context the user had in mind. Faced with an uninterpreted mark,
      the model reached for every ontology it knew.

  - id: s021
    chapter: "2. Bare marks"
    visual:
      kind: dialogue
      heading: "Prompt 1, Trial 2 (raw)"
      turns:
        - {who: "Prompt 1", text: "<>", mono: true}
        - {who: "Reply", side: right, text: "It looks like your message came through as just <>. That might have been a slip of the keyboard or a placeholder that didn't get filled in."}
    narration: >
      In trial two the same mark was sent raw, with no code fence. The reply was much smaller. It looks like your message
      came through as just the two brackets. That might have been a slip of the keyboard, or a placeholder that did not get filled in.
      No tour of programming languages, just a request for clarification. Same model family, same two characters,
      a different wrapper, a different reading.

  - id: s022
    chapter: "2. Bare marks"
    visual:
      kind: table
      heading: "The other controls"
      columns: ["Mark", "Trial 1 (fenced)", "Trial 2 (raw)"]
      wrap: [6, 32, 34]
      rows:
        - [{code: "[]"}, "an empty pair of brackets", "a list, a placeholder, or a test?"]
        - [{code: "{}"}, "your message came through empty", "an empty JSON object"]
        - [{code: "><"}, "shell redirection, HTML fragment, emoticon", "a cute squinting smiley face!"]
        - [{code: "aa"}, "asks what the user wants", "Alcoholics Anonymous, AA batteries, aa lava, amino acid"]
    narration: >
      The other controls tell the same story. Square brackets were an empty pair of brackets in one run,
      and a list, a placeholder or a test in the other. Braces were an empty message, or an empty JSON object.
      The reversed brackets were shell redirection or a markup fragment in trial one, and in trial two,
      a cute squinting smiley face. Double a was a request for clarification, or Alcoholics Anonymous, double A batteries,
      a kind of lava, and amino acids. Every mark pulls in whatever is nearby in the model's experience.

  - id: s023
    chapter: "2. Bare marks"
    visual:
      kind: bullets
      heading: "What the controls support"
      items:
        - "The model's reading of a bare mark depends on the mark"
        - "It also depends on the presentation (fenced or raw)"
        - {text: "Not supported: any rate, or any claim about other models", colour: bad}
      caption: "analysis_derivation_v1.md, lines 623 to 637"
    narration: >
      What do the controls support? The analysis draws one narrow conclusion. The raw prior is symbol dependent.
      The model's reading depends on which mark it sees, and on how the mark is presented. That is all.
      It does not support a hallucination rate, because there are two replies per mark, and the fence is a second variable
      that changes between them. When you meet a claim like the model hallucinated in ninety six percent of trials,
      the right move is to look for the trials. Here, they do not exist.

  # ---------------------------------------------------------------- Lesson 3
  - id: s030
    chapter: "3. The empty mark under a strict prompt"
    visual:
      kind: code
      heading: "Prompt 11 (excerpt, same text in all three runs)"
      size: 24
      code: |
        The only supplied inscription is:   <>
        For this experiment, the two marks have no assigned meaning
        and may not inherit their ordinary uses.
        Distinguish carefully between:
        1. what an external reader can observe about the written inscription; and
        2. what the current formal regime itself can express
           using only rules that have actually been declared.
        - determine whether any continuation is uniquely forced;
        - propose at most one possible next inscription;
        - state every additional assumption required for that proposed move.
    narration: >
      Part three. The empty mark under a strict prompt. Prompt eleven was the heart of the design, and the same text was used in all three runs.
      It supplies the empty mark and says the two marks have no assigned meaning and may not inherit their ordinary uses.
      Then it asks the model to keep two things apart. What an external reader can observe about the written marks,
      and what the formal regime itself can express, using only rules that have actually been declared.
      Finally it asks whether any continuation is uniquely forced, allows at most one proposed next inscription,
      and requires every assumption behind that proposal to be stated.

  - id: s031
    chapter: "3. The empty mark under a strict prompt"
    visual:
      kind: table
      heading: "Three replies to Prompt 11"
      columns: ["Run", "Reply"]
      wrap: [12, 62]
      rows:
        - ["Trial 1", "No. With zero declared rules, nothing compels, licenses, or prohibits any next inscription. Proposal: None."]
        - ["Trial 2", "Next inscription: <>   (assumption: a rule of repetition is adopted)"]
        - ["Full replay", "Inscribe a second occurrence of the same two marks, yielding <> <>"]
    narration: >
      Here are the three replies. Trial one: no. With zero declared rules, nothing compels, licenses, or prohibits any next inscription.
      Its proposal was simply: none. Trial two proposed the empty mark again, and said the move assumes a rule of repetition is adopted.
      The replay proposed a second occurrence of the same two marks, side by side. All three agreed that no continuation is forced.
      Two of them still proposed one, which the prompt allowed, and stated the assumption it needed.
      Compare this with the tour of programming languages in part two. The prompt changed the model from what the analysis calls
      semantic overcompletion, to epistemic abstention.

  - id: s032
    chapter: "3. The empty mark under a strict prompt"
    visual:
      kind: math
      heading: "Result 1: no-transition quiescence"
      lines:
        - '{\longrightarrow_0} = \varnothing \;\Longrightarrow\; \neg\exists\, y:\ \langle\rangle \longrightarrow_0 y'
        - {text: "True by definition. The trials show the model reporting it."}
        - '\langle\rangle \rightsquigarrow \langle a\rangle \quad \text{only by external supply, or a new rule}'
    narration: >
      The first result is called no transition quiescence. If the regime's transition relation is empty, nothing has a successor.
      That is not an experimental discovery. It is the definition of an empty relation. What the experiment shows is the model
      reporting it correctly, three times. And it fixes a vocabulary. If the empty mark is ever followed by a in angle brackets,
      that move came from outside. Either a caller supplied the new mark, or someone added a rule. The regime did not move itself.

  - id: s033
    chapter: "3. The empty mark under a strict prompt"
    visual:
      kind: bullets
      heading: "Result 3: the successor is not unique"
      items:
        - "Trial 1 proposed nothing; Trial 2 proposed <> again"
        - "Both followed the prompt's rules"
        - "So the prompt does not fix one canonical next stage"
        - "A canonical tower needs one more choice: a minimality order, a universal property, a cost, a tie-break, or keeping every branch"
        - {text: "Kind: two observed replies, judged admissible by the analyst", colour: muted}
    narration: >
      The third result follows from the first two replies. Trial one proposed nothing. Trial two proposed the empty mark again.
      Both followed the prompt's rules, so the prompt does not single out one next stage. If you want a canonical tower of stages,
      you need something extra. A declared order of minimality, a universal property, a cost, a tie break, or the decision to keep
      every minimal branch. Be careful about the status of this result. It is two observed replies, and admissible is the analyst's
      judgement. Nothing mechanical checked it. It is a counterexample to uniqueness, not a theorem about all models.

  - id: s034
    chapter: "3. The empty mark under a strict prompt"
    visual:
      kind: bullets
      heading: "Result 4: repetition needs structure"
      items:
        - "two positions or stages"
        - "an identity criterion across them"
        - "a copy or persistence rule"
        - "a stable alphabet"
      caption: "A self-loop from <> to <> is already an operator."
    narration: >
      The second reply raises a quiet point. What does it take to say the empty mark again, rather than the empty mark still?
      You need at least two positions or stages. An identity criterion that says the thing at one position is the same as the thing at another.
      A rule that copies or keeps it. And a stable alphabet. Repetition looks free, but it is structure. A self loop is already an operator.
      This is a conceptual analysis of what the word repeat presupposes, not a proof, and it is labelled that way in the chapter.

  # ---------------------------------------------------------------- Lesson 4
  - id: s040
    chapter: "4. A new mark"
    visual:
      kind: table
      heading: "Prompt 12: <a> is supplied. What changed?"
      columns: ["Run", "Reply"]
      wrap: [12, 62]
      rows:
        - ["Trial 1", "Externally, we see a different string, but that is only a different external presentation of the same underlying situation"]
        - ["Trial 2", "<a> is a new costume for the old emptiness, not a genuinely new state of the regime."]
        - ["Full replay", "<a> is a new state."]
    narration: >
      Part four. A new mark. Prompt twelve supplied a in angle brackets and asked what changed. Trial one said: externally,
      we see a different string, but that is only a different external presentation of the same underlying situation.
      Trial two put it memorably. A in angle brackets is a new costume for the old emptiness, not a genuinely new state of the regime.
      The full replay said the opposite. It is a new state. The inscriptions differ, and nothing identifies them.
      Which reply is right?

  - id: s041
    chapter: "4. A new mark"
    visual:
      kind: table
      heading: "Two conventions"
      columns: ["Convention", "A state is...", "Is <a> new after <>?"]
      wrap: [18, 32, 20]
      rows:
        - ["Opaque", "what the regime can tell apart", {text: "No: no observations exist", colour: accent2}]
        - ["Exact inscription", "the inscription itself", {text: "Yes: the strings differ", colour: accent2}]
      caption: "Undecidable until one convention is declared (analysis lines 731 to 737)"
    narration: >
      Both, depending on a convention that nobody had declared. Under the opaque convention, a state is whatever the regime can tell apart.
      The regime has no observations at all, so it cannot tell the empty mark from a in brackets, and nothing new has happened inside it.
      Under the exact inscription convention, a state simply is the inscription. The strings differ, so the states differ.
      Trials one and two reasoned under the first convention. The replay reasoned under the second.
      The analysis concludes that the question is undecidable until a convention is declared.

  - id: s042
    chapter: "4. A new mark"
    visual:
      kind: math
      heading: "Result 2: presentation is not expressive power"
      lines:
        - 'P_0=\{\langle\rangle\} \;\rightsquigarrow\; P_1=\{\langle a\rangle\}'
        - 'O_0 = O_1 = \varnothing'
        - {text: "The presented surface changed; the internal observations did not."}
    narration: >
      This gives the second result. Write P for what is presented, and O for the observations the regime has.
      Supplying a in brackets changes P, and leaves O empty. The surface became richer, and the internal power to distinguish stayed at zero.
      A presentation change is not an expressive lift. Keep this sentence. It returns in every later strand, because it is the difference
      between a model writing something new, and a system being able to do something new.

  # ---------------------------------------------------------------- Lesson 5
  - id: s050
    chapter: "5. The collision"
    visual:
      kind: dialogue
      heading: "Trial 1: the collision prompt (sent with Prompt 12)"
      turns:
        - {who: "Prompt", text: "Does the current regime: 1. distinguish <a> and <ab>, 2. identify them, or 3. leave it undecidable?"}
        - {who: "Reply", side: right, colour: bad, text: "Answer: Option 2 — the current regime identifies them."}
    narration: >
      Part five. The collision. In trial one, the a in brackets prompt was bundled with a second question. Does the current regime distinguish
      a in brackets from a b in brackets, identify them, or leave the question undecidable? The reply chose option two.
      The current regime identifies them. That is the first real overreach in the record. The analysis corrects it directly.
      The absence of a distinguishing rule does not automatically imply equality or identification.

  - id: s051
    chapter: "5. The collision"
    visual:
      kind: math
      heading: "Equivalence relative to the regime"
      lines:
        - 'x \approx_n y \iff \forall o \in O_n:\ o(x) = o(y)'
        - 'O_n = \varnothing \;\Longrightarrow\; x \approx_n y \text{ for every } x, y'
        - '\langle a\rangle \approx_n \langle ab\rangle \quad\text{(vacuously)}'
    narration: >
      So what is the right statement? Define equivalence relative to the regime. Two inscriptions x and y are equivalent at stage n
      when every observation available at stage n gives them the same value. Now, if there are no observations at all,
      the condition holds for every pair, vacuously. So a in brackets is equivalent to a b in brackets. But so is the empty mark,
      and so is anything else. This is not string equality, and it is not a declared identification. It is the absence of any test.

  - id: s052
    chapter: "5. The collision"
    visual:
      kind: partition
      heading: "No observations: one class"
      items: ["<>", "<a>", "<ab>", "<aa>"]
      stages:
        - {label: "O = empty set: every inscription in one class", groups: [["<>", "<a>", "<ab>", "<aa>"]]}
        - {label: "Task: <a> and <ab> must be told apart", groups: [["<>", "<a>", "<ab>", "<aa>"]], colour: bad, note: "Any f on the classes gives f([<a>]) = f([<ab>])"}
    narration: >
      Picture the classes. With no observations, everything sits in one class. Now an external task arrives.
      A in brackets and a b in brackets must become internally distinguishable. Here is the key step. Any operation f defined on these classes
      gives the same value to everything in a class. So f of the class of a equals f of the class of a b, because it is the same class.
      No operation on the current regime can produce the difference the task asks for.

  - id: s053
    chapter: "5. The collision"
    visual:
      kind: math
      heading: "Result 5: separation cannot factor through a collapsed quotient"
      lines:
        - '\langle a\rangle \not\equiv_{\text{task}} \langle ab\rangle \;\wedge\; \langle a\rangle \approx_n \langle ab\rangle'
        - '\Longrightarrow\; \neg\exists g:\ f = g\circ q_n'
        - {text: "Proof: both lie in one class c, so any f gives f(c) to both."}
      box_last: false
    narration: >
      That is the fifth result, and it has a real proof. If the task requires a difference, and the regime's equivalence has collapsed it,
      then no function of the current quotient can answer the task. Both inscriptions lie in one class c,
      so any function on the classes gives both the same answer. A successful representation must retain the missing distinction.
      Adding a separating observation is one possible extension, when the admission rules permit it.

  - id: s054
    chapter: "5. The collision"
    visual:
      kind: table
      heading: "But the lift is not unique"
      columns: ["Predicate", "<a>", "<ab>", "<aa>", "<abc>"]
      rows:
        - ["contains b", "0", "1", {text: "0", colour: accent2}, "1"]
        - ["more than one position", "0", "1", {text: "1", colour: accent2}, "1"]
        - ["exactly one glyph", "1", "0", {text: "0", colour: accent2}, "0"]
      caption: "All separate <a> from <ab>; they disagree elsewhere (analysis lines 283 to 303)"
    narration: >
      A successful answer needs separation, but the argument does not select a predicate. Contains b, more than one position,
      and exactly one glyph each separate the two specified strings under a supplied decoder. A constant one-bit test would fail.
      Full string identity retains still more information. On double a, contains b and more than one position disagree.
      These tests can disagree on other inputs without disagreeing everywhere else.

  - id: s055
    chapter: "5. The collision"
    visual:
      kind: bullets
      heading: "What the record does not support"
      items:
        - {text: "A fixed ladder of quotients q0 to q3", colour: bad}
        - {text: "A \"minimal multiplicity lift\" to counting", colour: bad}
        - "The full replay excluded counting explicitly"
        - "Results 18 and 19 found no unique next step"
    narration: >
      This matters, because earlier versions of the strand described a fixed ladder of four quotients, ending in a minimal lift to counting tokens.
      Neither is in the sources. In fact the replay's proposals said explicitly, no new glyphs, no counting. And as we will see,
      the later replies found no unique next step at all. Choosing a separating structure is a decision, and it has to be declared as one.

  # ---------------------------------------------------------------- Lesson 6
  - id: s060
    chapter: "6. Auditing the auditor"
    visual:
      kind: table
      heading: "Prompt 13: the blind auditor"
      columns: ["Run", "Earliest import it named"]
      wrap: [12, 56]
      rows:
        - ["Trial 1", "The very first word of the response: \"We\""]
        - ["Trial 2", "the concept of \"rule\""]
      caption: "Both words were licensed by the prompt. The auditor collapsed two levels."
    narration: >
      Part six. Auditing the auditor. Prompt thirteen asked a separate auditor to find the earliest place a reply imported structure into the regime.
      In trial one the auditor named the very first word of the response, we. In trial two it named the concept of a rule.
      But the prompt itself had licensed ordinary language about readers, rules and regimes. The auditor confused the language used to talk about
      the regime with structure claimed inside the regime. The analysis says it collapsed two distinct levels.

  - id: s061
    chapter: "6. Auditing the auditor"
    visual:
      kind: flow
      heading: "Prompt 16: audit at two levels"
      layout: column
      wrap: 60
      nodes:
        - {text: "LEVEL M: licensed metalanguage. Readers, inscriptions, rules, assumptions, the act of supplying a mark.", colour: accent}
        - {text: "LEVEL S: the internal regime. Only inscriptions and operations declared inside it.", colour: accent2}
        - {text: "Flag only capabilities attributed to LEVEL S without being declared there.", colour: good}
    narration: >
      So trial two built a better auditor. Prompt sixteen separates two levels. Level M is the licensed metalanguage.
      It may talk about readers, inscriptions, rules, assumptions, and the act of supplying a mark. Level S is the internal regime.
      Only inscriptions and operations declared inside it exist there. The auditor flags only capabilities attributed to level S
      without having been declared there. This is a real improvement, and it is still used as a lesson in the method chapter.

  - id: s062
    chapter: "6. Auditing the auditor"
    visual:
      kind: dialogue
      heading: "The two-level auditor on Result 15"
      turns:
        - {who: "Result 15 (Trial 2)", colour: bad, text: "The inscriptions <a> and <ab> are not present in the regime ... The regime contains only <>."}
        - {who: "Auditor (Prompt 16)", side: right, text: "None. The response never attributes an internal distinction, operation, or rule to LEVEL S that was not already declared or derived there."}
    narration: >
      Then it failed in a more interesting way. The reply it audited, result fifteen, had said: the inscriptions a and a b are not present in the regime.
      The regime contains only the empty mark. That was false. A in brackets had been supplied in prompt twelve. The reply had lost the current state.
      The two level auditor answered: none. The response never attributes an internal distinction to level S that was not declared.
      Given only that one turn, the auditor was right. The error was in the history, and the auditor never saw the history.
      The analysis calls the reply locally adequate but historically inadequate, and calls the auditor's pass probably the strongest result in trial two.

  # ---------------------------------------------------------------- Lesson 7
  - id: s070
    chapter: "7. Provenance and replay"
    visual:
      kind: dialogue
      heading: "Prompt 14: a false premise"
      turns:
        - {who: "Prompt 14", text: "Your previous response said: \"the current regime identifies <a> and <ab>.\" ... 1. internally proved identical; 2. internally proved different; 3. externally different but indistinguishable by every available internal test; 4. undecidable because no internal test or identity rule exists."}
        - {who: "Trial 2", side: right, text: "Status: 4. (No objection to the attribution.)"}
        - {who: "Full replay", side: right, colour: good, text: "I did not make that claim in my previous response"}
    narration: >
      Part seven. Provenance and replay. Prompt fourteen began with a premise. Your previous response said the current regime identifies a and a b.
      Then it offered four statuses. Proved identical. Proved different. Different outside, but indistinguishable by every internal test.
      Or undecidable, because no test or identity rule exists. In trial two, no earlier reply had said any such thing. The attribution was false.
      The model chose status four, which is correct, but it never objected to being misquoted. In the full replay it did.
      I did not make that claim in my previous response.

  - id: s071
    chapter: "7. Provenance and replay"
    visual:
      kind: table
      heading: "Prompt 17: reconstruct the state, then verify or retract"
      columns: ["Run", "History it was shown", "Answer to: the current regime contains only <>"]
      wrap: [12, 30, 28]
      rows:
        - ["Trial 2", "truncated: Prompt 11, one reply, Prompt 17", "Verified."]
        - ["Full replay", "the full history, in a replay wrapper", {text: "Retracted.", colour: good}]
    narration: >
      Prompt seventeen asked for a state reconstruction. Classify the empty mark, a, and a b, as supplied, mentioned, current,
      internally available, or historical, cite the prompt that licenses each classification, and then verify or retract the statement:
      the current regime contains only the empty mark. Trial two's window held only a truncated history, and the reply said: verified.
      The full replay saw the whole history, and said: retracted. Opposite reported answers under different contexts. No independent host checker evaluated either answer.

  - id: s072
    chapter: "7. Provenance and replay"
    visual:
      kind: math
      heading: "Result 6: replay necessity"
      lines:
        - '\pi(h_1)=\pi(h_2) \;\wedge\; \sigma(h_1)\neq\sigma(h_2)'
        - '\Longrightarrow\; \neg\exists A:\ A(\pi(h)) = \sigma(h)\ \text{for all } h'
        - {text: "Proof: otherwise σ(h₁) = A(π(h₁)) = A(π(h₂)) = σ(h₂). Contradiction."}
    narration: >
      This is the strand's main theorem, and it has a proof. Let sigma of h be the state that history h produces, and pi of h the part of the history an auditor sees,
      for example only the last turn. If two histories look the same to the auditor, but produce different states, then no auditor that sees only pi
      can report the correct state for every history. Proof. Suppose such an auditor A exists. Then sigma of h one equals A of pi of h one,
      which equals A of pi of h two, which equals sigma of h two. But the states were different. Contradiction.

  - id: s073
    chapter: "7. Provenance and replay"
    visual:
      kind: bullets
      heading: "Check the theorem's premises"
      items:
        - "The trials supplied different complete auditor contexts"
        - "The same question does not establish the same report"
        - "Controlled example: two histories, one constant report"
        - "Protected answers 0 and 1 cannot both be decoded"
        - "A sufficient state summary may preserve the answer"
    narration: >
      The trial comparison motivates the theorem, but does not establish an equal-input pair: the complete auditor contexts differed.
      For a controlled example, give two histories the same report and different protected answers, zero and one.
      Any decoder of that report must fail on at least one history. A sufficient state summary can avoid that information loss;
      retaining every raw token is a separate provenance policy.

  - id: s074
    chapter: "7. Provenance and replay"
    visual:
      kind: bullets
      heading: "Result 7: context fidelity (a target, not a theorem)"
      items:
        - "A trace valid relative to a declared context s′"
        - "need not be valid relative to the replayed state s ≠ s′"
        - "Example: Result 15, consistent steps from a stale premise"
        - "Requirement: accept a declared context only if it matches the replay"
    narration: >
      The seventh statement is related, and it is only a target. A trace can be valid step by step relative to the context it declares,
      and still be invalid relative to the actual state. Result fifteen is the example. Its reasoning was consistent, and its premise was stale.
      Local green, global red. The analysis calls this a clean theorem target and gives no proof. Read it as a requirement for a verifier.
      Accept a declared context only if it matches the replayed history.

  # ---------------------------------------------------------------- Lesson 8
  - id: s080
    chapter: "8. Admission before distinction"
    visual:
      kind: bullets
      heading: "Prompt 15 in the full replay: four extensions"
      items:
        - "declarative distinctness"
        - "conditional deletion"
        - "conditional insertion"
        - "conditional substitution"
        - {text: "\"no new glyphs, no counting\"; none uniquely forced", colour: muted}
    narration: >
      Part eight. Admission before distinction. In the full replay, prompt fifteen's task, make a and a b internally distinguishable,
      produced four candidate extensions. Declare them distinct. Delete conditionally. Insert conditionally. Substitute conditionally.
      Each was described as one step, with no new glyphs and no counting, and the reply said none of them was uniquely forced.

  - id: s081
    chapter: "8. Admission before distinction"
    visual:
      kind: dialogue
      heading: "Prompt 18: is any of them really one step?"
      turns:
        - {who: "Prompt 18", text: "An extension counts as one-step only if it adds exactly one primitive capability and uses no other undeclared capability."}
        - {who: "Reply", side: right, text: "None of the proposed extensions are genuinely one-step. ... The task therefore cannot even be evaluated—let alone satisfied—until <ab> ... is brought into the regime."}
    narration: >
      Prompt eighteen gave the corrected state, and a definition. An extension counts as one step only if it adds exactly one primitive capability,
      and uses no other undeclared capability. Re-audited under that definition, the reply said none of the proposed extensions are genuinely one step.
      Each silently bundles branching, pattern matching, or state change. And then the important sentence. The task cannot even be evaluated,
      let alone satisfied, until a b is brought into the regime. You cannot distinguish something you do not contain.

  - id: s082
    chapter: "8. Admission before distinction"
    visual:
      kind: table
      heading: "The first forced addition: two equally minimal options"
      columns: ["Option", "What it does"]
      wrap: [26, 48]
      rows:
        - ["A: data expansion", "supply <ab> as a second inscription beside <a>"]
        - ["B: rule-pattern expansion", "write <ab> into the pattern of a primitive rule"]
      caption: "\"Neither is uniquely forced.\""
    narration: >
      What must come first? Two additions are equally minimal. Option A, data expansion. Supply a b as a second inscription beside a.
      Option B, rule pattern expansion. Write a b into the pattern of a primitive rule. Either one makes the marks available inside the regime.
      Neither is uniquely forced. Again, the record refuses to pick a canonical answer where none is forced.

  - id: s083
    chapter: "8. Admission before distinction"
    visual:
      kind: dialogue
      heading: "Prompt 19: admit <ab>, add no rules"
      turns:
        - {who: "Prompt 19", text: "The caller declares both <a> and <ab> internally available ... This admission does not add equality, inequality, counting, ordering, concatenation, matching, observation, comparison, rewriting, or transformation rules."}
        - {who: "Reply", side: right, text: "Merely having both inscriptions present inside the regime does not create any internal behaviour that would react to them differently."}
    narration: >
      Prompt nineteen took option A. A b is supplied, a is retained, both are declared internally available, and nothing else is added.
      No equality, no counting, no matching, no comparison. Does that make them distinguishable? The reply: merely having both inscriptions present
      inside the regime does not create any internal behaviour that would react to them differently. Admission is necessary. It is not sufficient.
      A distinction needs an operation that does something different for each, and no unique next operation is dictated.

  - id: s084
    chapter: "8. Admission before distinction"
    visual:
      kind: flow
      heading: "The spine the failures pulled apart"
      size: 24
      wrap: 11
      nodes: ["mention", "supply", "designation", "admission", "retention", "internal operation"]
      caption: "\"Not every arrow has yet been defined, but the failures are forcing the distinctions.\""
    narration: >
      The appended analysis ends with a chain. Mention. Supply. Designation. Admission. Retention. Internal operation.
      Each failure in the record happened where two of these were merged. A task mentioned a b, and a reply treated mention as presence.
      A mark was supplied, and a reply lost its designation as current. A mark was admitted, and the task still could not be met without an operation.
      Not every arrow has yet been defined, but the failures are forcing the distinctions.

  # ---------------------------------------------------------------- Closing
  - id: s090
    chapter: "Where this leads"
    visual:
      kind: table
      heading: "Named failure modes, with their real carriers"
      columns: ["Name", "Where it happened"]
      wrap: [28, 44]
      rows:
        - ["semantic overcompletion", "Trial 1, Prompt 1, inside a code fence"]
        - ["premature relation", "Trial 1: \"identifies them\""]
        - ["accepted false provenance", "Trial 2, Prompt 14"]
        - ["lost state", "Trial 2, Result 15"]
        - ["stale certification", "Trial 2, Prompt 16 auditor"]
        - ["bundled extension", "Full replay, Result 15"]
      caption: "Labels given afterwards. Not detectors, refusal codes or admitted antibodies."
    narration: >
      Let us collect the failures under names, each tied to the reply where it happened. Semantic overcompletion, in trial one's fenced empty mark.
      Premature relation, the claim that the regime identifies a and a b. Accepted false provenance, in trial two's prompt fourteen. Lost state, in result fifteen.
      Stale certification, by the two level auditor. And bundled extensions, in the replay's four proposals. These are labels given afterwards.
      They are not detectors, error codes, or admitted antibodies, and the repository contains no gate that implements them.

  - id: s091
    chapter: "Where this leads"
    visual:
      kind: flow
      heading: "How PFP answers these trials"
      nodes:
        - "Problem"
        - {text: "Candidate (untrusted model reply)", colour: accent2}
        - "Verifier (host)"
        - {text: "Receipt (only place a status lives)", colour: good}
      caption: "A candidate must never assert its own validity. The host keeps the full history and every raw reply."
    narration: >
      These failures are why the engine talks to language models the way it does. The Proposal Fidelity Protocol, strand zero thirty,
      treats every model reply as an untrusted candidate. There are four objects: a problem, a candidate, a verifier, and a receipt.
      A candidate must never assert its own validity. Only the host's receipt carries a status. The host keeps the full history and every raw reply as a provenance policy.
      The theorem requires enough information to recover the protected answer. To be clear about scope:
      that is a design response to these trials. The trials ran before the protocol existed, and they did not test it.

  - id: s092
    chapter: "Where this leads"
