<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-06</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(6)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 6: Tower Extension &amp; Retraction Maps (MSS-6)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Unbounded stage hierarchy equipped with up-maps u_N, down-maps d_N, and retraction invariant</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;stage n&gt; &lt;up u_p&gt; &lt;down d_p&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Two Level Stage Towers -->
        <g transform="translate(40, 20)">
          <!-- Upper Stage S(n+1) -->
          <rect x="0" y="0" width="380" height="90" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
          <text x="20" y="30" fill="#818cf8" font-size="13" font-weight="700">Upper Presentation Stage S(n+1)</text>
          <text x="20" y="55" fill="#94a3b8" font-size="11">Expanded carrier with newly introduced generators</text>
          <text x="20" y="75" fill="#64748b" font-size="10">C_{n+1} &#8839; u_N(C_n)</text>

          <!-- Lower Stage S(n) -->
          <rect x="0" y="150" width="380" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="20" y="180" fill="#38bdf8" font-size="13" font-weight="700">Lower Presentation Stage S(n)</text>
          <text x="20" y="205" fill="#94a3b8" font-size="11">Original verified carrier and relations</text>
          <text x="20" y="225" fill="#64748b" font-size="10">Known base context</text>

          <!-- Up and Down Maps -->
          <line x1="310" y1="150" x2="310" y2="95" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
          <text x="325" y="125" fill="#38bdf8" font-size="12" font-weight="700">u_N (Up)</text>

          <line x1="220" y1="90" x2="220" y2="145" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
          <text x="160" y="125" fill="#10b981" font-size="12" font-weight="700">d_N (Down)</text>
        </g>

        <!-- Invariant Verification Panel -->
        <g transform="translate(450, 20)">
          <rect x="0" y="0" width="330" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="165" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Retraction Invariant</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="290" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
            <text x="145" y="30" fill="#10b981" font-size="14" font-family="ui-monospace, monospace" font-weight="700" text-anchor="middle">d_N(u_N(x)) = x</text>
            <text x="145" y="55" fill="#94a3b8" font-size="10" text-anchor="middle">Strict retract on admitted old elements</text>
          </g>

          <g transform="translate(20, 140)">
            <rect x="0" y="0" width="290" height="80" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="145" y="28" fill="#f43f5e" font-size="12" font-weight="600" text-anchor="middle">NON_DESCENT Firewall</text>
            <text x="145" y="50" fill="#94a3b8" font-size="10" text-anchor="middle">Terms lacking prior down-meaning return</text>
            <text x="145" y="68" fill="#f43f5e" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">typed NON_DESCENT, never self-assign</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::TerminalRouter</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_INVALID_ROUTING</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Static stage ladders lack time-dependent state evolution, shift dynamics, and orbits; forced lift to MSS-7.</text>
  </g>
</svg>