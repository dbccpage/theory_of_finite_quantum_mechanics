<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-14</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(14)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 14: Bounded Quantifier Alternation Grammar (MSS-14)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Delta_0 bounded arithmetic, first-order AST syntax trees, and quantifier polarity bitmasks</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;bnd_alt count polarity_mask &lt;ast expr&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- AST Syntax Tree (Left) -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="400" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="200" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Bounded Formula AST: &#10216;&#8704;x&#8804;B&#8321; &#10216;&#8707;y&#8804;B&#8322; &#966;(x,y)&#10217;&#10217;</text>

          <!-- Tree Root -->
          <circle cx="200" cy="65" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="200" y="70" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">&#8704;x</text>

          <!-- Left child (Bound 1) -->
          <circle cx="120" cy="130" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
          <text x="120" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">x &#8804; B&#8321;</text>

          <!-- Right child (Quantifier 2) -->
          <circle cx="280" cy="130" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
          <text x="280" y="135" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">&#8707;y</text>

          <!-- Leaves of Quantifier 2 -->
          <circle cx="230" cy="195" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
          <text x="230" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">y &#8804; B&#8322;</text>

          <circle cx="330" cy="195" r="18" fill="#059669" stroke="#10b981" stroke-width="2"/>
          <text x="330" y="200" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">&#966;</text>

          <!-- Tree Edges -->
          <line x1="185" y1="78" x2="135" y2="116" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="215" y1="78" x2="265" y2="116" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="268" y1="144" x2="242" y2="181" stroke="#818cf8" stroke-width="1.5"/>
          <line x1="292" y1="144" x2="318" y2="181" stroke="#818cf8" stroke-width="1.5"/>
        </g>

        <!-- Polarity Mask &amp; Arithmetic Fence (Right) -->
        <g transform="translate(470, 20)">
          <rect x="0" y="0" width="310" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="155" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Polarity Mask Register</text>

          <g transform="translate(20, 50)">
            <text x="0" y="16" fill="#94a3b8" font-size="11">Quantifier Polarity Bits:</text>
            <g transform="translate(0, 26)">
              <rect x="0" y="0" width="50" height="35" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
              <text x="25" y="22" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1 (&#8704;)</text>

              <rect x="60" y="0" width="50" height="35" rx="4" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
              <text x="85" y="22" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">0 (&#8707;)</text>

              <text x="130" y="22" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">mask = [1, 0]</text>
            </g>
          </g>

          <line x1="20" y1="135" x2="290" y2="135" stroke="#334155" stroke-width="1"/>
          <g transform="translate(20, 150)">
            <rect x="0" y="0" width="270" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="135" y="22" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">&#916;&#8320; Complexity Boundary</text>
            <text x="135" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">All domains are strictly finite and bounded</text>
            <text x="135" y="55" fill="#94a3b8" font-size="10" text-anchor="middle">Decidable evaluation guaranteed</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::PolarityPartitioner</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_POLARITY_MISMATCH</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Logical formulas lack a separation between generative proposals and host verification authority; forced lift to MSS-15.</text>
  </g>
</svg>