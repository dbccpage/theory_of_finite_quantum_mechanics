<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-21</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(21)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 21: Discrete 4D Regge Metric Deficit &amp; Simplicial Curvature (MSS-21)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">4-Simplex complexes with 10 edge lengths, triangle hinge deficit angles, and discrete Bianchi holonomy</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;regge4d id &lt;simplex4d lengths10&gt;... cm_det &lt;deficits&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- 4-Simplex &amp; Hinge Display (Left) -->
        <g transform="translate(30, 20)">
          <rect x="0" y="0" width="410" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="205" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">4-Simplex (10 Edges) &amp; Codimension-2 Triangle Hinge</text>

          <!-- 4-Simplex Pentachoron projection -->
          <g transform="translate(110, 110)">
            <!-- Outer pentagon vertices -->
            <!-- 5 vertices: 0, 72, 144, 216, 288 deg -->
            <polygon points="0,-50 48,-15 30,40 -30,40 -48,-15" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
            <!-- Inner cross edges -->
            <line x1="0" y1="-50" x2="30" y2="40" stroke="#818cf8" stroke-width="1"/>
            <line x1="0" y1="-50" x2="-30" y2="40" stroke="#818cf8" stroke-width="1"/>
            <line x1="48" y1="-15" x2="-30" y2="40" stroke="#818cf8" stroke-width="1"/>
            <line x1="-48" y1="-15" x2="30" y2="40" stroke="#818cf8" stroke-width="1"/>
            <line x1="48" y1="-15" x2="-48" y2="-15" stroke="#818cf8" stroke-width="1"/>

            <!-- Highlighted Triangle Hinge -->
            <polygon points="0,-50 48,-15 -48,-15" fill="#f59e0b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2"/>
            <circle cx="0" cy="-50" r="4" fill="#f59e0b"/>
            <circle cx="48" cy="-15" r="4" fill="#f59e0b"/>
            <circle cx="-48" cy="-15" r="4" fill="#f59e0b"/>
            <text x="0" y="-20" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">Hinge t</text>
          </g>

          <g transform="translate(230, 70)">
            <rect x="0" y="0" width="160" height="60" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
            <text x="80" y="24" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">10 Edge Lengths:</text>
            <text x="80" y="44" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">l_{ij}&#178; &#8712; &#8474;</text>
          </g>

          <g transform="translate(230, 145)">
            <rect x="0" y="0" width="160" height="60" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="80" y="24" fill="#f43f5e" font-size="10" font-weight="600" text-anchor="middle">Hinge Deficit:</text>
            <text x="80" y="44" fill="#f8fafc" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">&#948;_t = 2&#960; - &#8721; &amp;theta;_t</text>
          </g>
        </g>

        <!-- Bianchi Identity &amp; Operadic Gateway (Right) -->
        <g transform="translate(460, 20)">
          <rect x="0" y="0" width="350" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="175" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Discrete Bianchi Holonomy</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="310" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="155" y="26" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Closed Holonomy Contraction</text>
            <text x="155" y="50" fill="#f8fafc" font-size="12" font-family="ui-monospace, monospace" font-weight="700" text-anchor="middle">&#8719;_{t &#8834; c} R_t = I (Identity Matrix)</text>
          </g>

          <g transform="translate(20, 135)">
            <rect x="0" y="0" width="310" height="85" rx="6" fill="#311042" stroke="#c084fc" stroke-width="1.2"/>
            <text x="155" y="24" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">TRANS-BASE OPERADIC GATEWAY</text>
            <text x="155" y="46" fill="#e9d5ff" font-size="10" text-anchor="middle">Terminal geometric stage of classical base tower.</text>
            <text x="155" y="64" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">N &#8805; 22: Operads, Sheaves &amp; Quantum Epochs</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::Regge4DCurvature</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_BIANCHI_DEFICIT_NONZERO</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Terminal geometric stage of the classical base tower (S_0 -> S_21); N >= 22 enters trans-base operadic regime.</text>
  </g>
</svg>