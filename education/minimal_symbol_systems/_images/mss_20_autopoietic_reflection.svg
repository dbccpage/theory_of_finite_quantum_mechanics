<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-20</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(20)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 20: Autopoietic Reflection &amp; Expansion Cycle Detection (MSS-20)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Self-referential state comparison, recurrence detection s_t = s_{t+k}, and automated circuit breaker actions</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;autopoietic s_init s_repeat step_dist rule delta action&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Circular State Memory Buffer -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="410" height="240" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
          <text x="205" y="26" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">State Ring Buffer &amp; Recurrence Trip</text>

          <!-- Ring buffer nodes -->
          <circle cx="205" cy="120" r="50" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="2"/>
          
          <circle cx="205" cy="70" r="14" fill="#0284c7"/>
          <text x="205" y="74" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">s_0</text>

          <circle cx="255" cy="120" r="14" fill="#0284c7"/>
          <text x="255" y="124" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">s_1</text>

          <circle cx="205" cy="170" r="14" fill="#0284c7"/>
          <text x="205" y="174" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">s_2</text>

          <circle cx="155" cy="120" r="14" fill="#f43f5e" filter="url(#glowRed)"/>
          <text x="155" y="124" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">s_t</text>

          <!-- Recurrence match alert -->
          <path d="M 145 110 C 110 70, 110 170, 145 130" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowRed)"/>
          <text x="85" y="124" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">Repeat!</text>

          <text x="205" y="222" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Digest Match: s_t &#8801; s_{t+k} &amp; &#916;progress = 0</text>
        </g>

        <!-- Breaker Action Matrix -->
        <g transform="translate(470, 20)">
          <rect x="0" y="0" width="310" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="155" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Recursion Breaker Actions</text>

          <g transform="translate(15, 50)">
            <rect x="0" y="0" width="280" height="42" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="15" y="26" fill="#f43f5e" font-size="11" font-weight="700">ACTION 1: ABORT_LOOP</text>
            <text x="150" y="26" fill="#94a3b8" font-size="10">Emergency stop</text>
          </g>

          <g transform="translate(15, 102)">
            <rect x="0" y="0" width="280" height="42" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
            <text x="15" y="26" fill="#fbbf24" font-size="11" font-weight="700">ACTION 2: ROLLBACK</text>
            <text x="140" y="26" fill="#94a3b8" font-size="10">Revert to checkpoint</text>
          </g>

          <g transform="translate(15, 154)">
            <rect x="0" y="0" width="280" height="42" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="15" y="26" fill="#10b981" font-size="11" font-weight="700">ACTION 3: FORCE_LIFT</text>
            <text x="150" y="26" fill="#38bdf8" font-size="10">Ascent to MSS-21</text>
          </g>

          <text x="155" y="222" fill="#64748b" font-size="10" text-anchor="middle">Non-decreasing repeat trips breaker</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::RecursionBreaker</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_AUTOPOIETIC_LOOP</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Pure term reflection lacks 4-dimensional geometric spacetime curvature and constraints; forced lift to MSS-21.</text>
  </g>
</svg>