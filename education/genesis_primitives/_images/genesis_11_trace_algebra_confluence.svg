<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 11: Genesis 11</text>

    <rect x="140" y="0" width="175" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="227" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Rewriting: Trace Algebra</text>

    <rect x="325" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="407" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Property: rw_confluent</text>

    <rect x="500" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="570" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 11: Trace Algebra &amp; Rewrite Confluence Peaks</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Position-Keyed Polygraph Rewrites, Critical Peak Joinability, and Normal Form Uniqueness</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Confluence Diamond &amp; Normal Form Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">s &#8594;* t &#8743; s &#8594;* u</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">&#8707; j, (t &#8594;* j &#8743; u &#8594;* j)   [rw_confluent]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Unique Normal Forms (nf_unique):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">If an irreducible form exists along any reduction,</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">it is unique up to syntactic identity.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Incompleteness Boundary (rewrite_not_complete):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">The system does not claim termination on all words;</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">confluence holds on the declared bounded polygraph.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; 2-Cell Polygraph Structure:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Reductions are 2-cells between sequence paths,</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">forming a verified confluent rewrite system.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Confluence Diamond) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Critical Peak &amp; Diamond Join Topology</text>

    <g transform="translate(40, 50)">
      <!-- Apex Node: s -->
      <circle cx="180" cy="30" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="180" y="35" fill="#a5b4fc" font-size="14" font-weight="700" text-anchor="middle">s</text>
      <text x="180" y="65" fill="#94a3b8" font-size="10" text-anchor="middle">Critical Redex Apex</text>

      <!-- Left Branch: t -->
      <circle cx="80" cy="130" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="135" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">t</text>
      <text x="60" y="165" fill="#94a3b8" font-size="9.5" text-anchor="middle">Left Arm (&#963;_1)</text>

      <!-- Right Branch: u -->
      <circle cx="280" cy="130" r="22" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="280" y="135" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">u</text>
      <text x="300" y="165" fill="#94a3b8" font-size="9.5" text-anchor="middle">Right Arm (&#963;_2)</text>

      <!-- Arrows from s to t and u -->
      <line x1="162" y1="45" x2="98" y2="115" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <line x1="198" y1="45" x2="262" y2="115" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

      <!-- Join Node: j (Normal Form) -->
      <circle cx="180" cy="230" r="24" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="180" y="235" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">j</text>
      <text x="180" y="268" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">Unique Confluent Join</text>

      <!-- Arrows from t and u to j -->
      <line x1="98" y1="145" x2="162" y2="215" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowGreen)"/>
      <line x1="262" y1="145" x2="198" y2="215" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowGreen)"/>

      <!-- Central Badge -->
      <rect x="120" y="120" width="120" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="180" y="136" fill="#fbbf24" font-size="9.5" font-weight="600" text-anchor="middle">2-Cell Homotopy</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">CONFLUENCE_PROVED_LEAN</tspan> | Module: <tspan fill="#e2e8f0">TraceAlgebra.lean</tspan> | Normal Forms: <tspan fill="#38bdf8">Deterministic</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-011 Analog</tspan></text>
  </g>

</svg>
