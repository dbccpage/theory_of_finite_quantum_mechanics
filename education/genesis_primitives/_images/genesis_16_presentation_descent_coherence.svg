<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 16: Genesis 16</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Descent: Round-Trip Coherence</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Retraction: d &#8728; u = id</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 16: Presentation Descent &amp; Round-Trip Coherence</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Strict Functorial Retraction, Commuting Translation Squares, and Observation Invariance</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Retraction &amp; Faithful Descent Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">u : P_N &#8594; P_{N+1} &#8743; d : P_{N+1} &#8594; P_N &#8743; d(u(x)) = x</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">P_N &#8866; CoherentRetract(P_{N+1})   [PresentationDescent]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; The Retraction Invariant (d &#8728; u = id):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Old presentations embed conservatively.</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">Down-mapping an lifted old element exactly recovers it.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Typed Refusal on New Terms (NON_DESCENT):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Newly introduced terms with no prior meaning return</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11"><tspan fill="#f43f5e" font-family="monospace">NON_DESCENT</tspan> rather than silent self-assignment.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Observation-Preserving Transport (NB-16):</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">A valid translation must preserve internal observational</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">profiles, refuting cheap budget-write commuting squares.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Commuting Square) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Functorial Commuting Diagram &amp; Retract</text>

    <g transform="translate(50, 50)">
      <!-- Top-Left: P_N -->
      <rect x="20" y="20" width="110" height="50" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="75" y="42" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">P_N</text>
      <text x="75" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Base Presentation</text>

      <!-- Top-Right: P_{N+1} -->
      <rect x="220" y="20" width="110" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="275" y="42" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">P_{N+1}</text>
      <text x="275" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Lifted Context</text>

      <!-- Horizontal Up-Map (u) -->
      <line x1="130" y1="38" x2="215" y2="38" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <text x="175" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">u_N (Up)</text>

      <!-- Horizontal Down-Map (d) -->
      <line x1="220" y1="52" x2="135" y2="52" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrowGreen)"/>
      <text x="175" y="68" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">d_{N+1} (Down)</text>

      <!-- Bottom-Left: Obs(P_N) -->
      <rect x="20" y="160" width="110" height="50" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="75" y="182" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Obs(P_N)</text>
      <text x="75" y="198" fill="#a7f3d0" font-size="9" text-anchor="middle">Profile Signature</text>

      <!-- Bottom-Right: Obs(P_{N+1}) -->
      <rect x="220" y="160" width="110" height="50" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="275" y="182" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Obs(P_{N+1})</text>
      <text x="275" y="198" fill="#a7f3d0" font-size="9" text-anchor="middle">Lifted Profile</text>

      <!-- Vertical Arrows -->
      <line x1="75" y1="70" x2="75" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
      <text x="50" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">&#960;</text>

      <line x1="275" y1="70" x2="275" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
      <text x="300" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">&#960;'</text>

      <!-- Bottom Horizontal -->
      <line x1="130" y1="185" x2="215" y2="185" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
      <text x="175" y="178" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Isomorphic Obs</text>

      <!-- Central Badge -->
      <circle cx="175" cy="118" r="16" fill="#1e293b" stroke="#475569"/>
      <text x="175" y="122" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">&#8773;</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">RETRACTION_VERIFIED_LEAN</tspan> | Module: <tspan fill="#e2e8f0">PresentationDescent.lean</tspan> | Coherence: <tspan fill="#38bdf8">NB-16 Proved</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-016 Analog</tspan></text>
  </g>

</svg>
