<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 13: Genesis 13</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Routing: Primitive Passage</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Law: Two-Rule Bifurcation</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 13: Primitive Passage Routing &amp; Expansion Halting</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Deterministic Demarcation Between Same-Context Repair and Licensed Level-Ascent Extension</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Two-Rule Routing Inference</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Defect &#8712; Cochain &#8743; Exhausted(RepairClass)</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Route &#8594; LicensedLift(P_N &#8594; P_{N+1})   [two_rule]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Repair-Before-Ascent Mandate:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Before ascending, all same-level modifications</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">must be computationally and provably exhausted.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Cycle Detection (EXPANSION_CYCLE_DETECTED):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Detects non-productive autopoietic recursion</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">where repeated state visits yield zero progress.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Passage Invariant:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Ascent is not an unconstrained jump; it is an</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">auditable morphism with explicit retract down-maps.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Routing Fork) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Passage Router State Machine</text>

    <g transform="translate(30, 45)">
      <!-- Input State / Defect -->
      <rect x="110" y="10" width="180" height="50" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="200" y="30" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Detected Defect / Cochain</text>
      <text x="200" y="47" fill="#94a3b8" font-size="9" text-anchor="middle">Local Constraint Violation</text>

      <!-- Router Node -->
      <line x1="200" y1="60" x2="200" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
      <circle cx="200" cy="115" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="200" y="120" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">&#8869;</text>

      <!-- Fork Left: In-Context Repair -->
      <path d="M 180 115 L 75 115 L 75 160" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
      <rect x="10" y="165" width="145" height="70" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="82" y="187" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Branch 1: Repair</text>
      <text x="82" y="203" fill="#a7f3d0" font-size="9" text-anchor="middle">In-Carrier Resolution</text>
      <text x="82" y="218" fill="#a7f3d0" font-size="9" text-anchor="middle">Budget Remaining</text>

      <!-- Fork Right: Out-of-Context Lift -->
      <path d="M 220 115 L 325 115 L 325 160" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
      <rect x="250" y="165" width="150" height="70" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="325" y="187" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Branch 2: Lift</text>
      <text x="325" y="203" fill="#fde68a" font-size="9" text-anchor="middle">Exhaustion Witnessed</text>
      <text x="325" y="218" fill="#fde68a" font-size="9" text-anchor="middle">Extension Class E</text>

      <!-- Bottom Invariant Summary -->
      <rect x="20" y="260" width="370" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="205" y="278" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">PrimitivePassage.two_rule Formalized</text>
      <text x="205" y="293" fill="#94a3b8" font-size="9" text-anchor="middle">No Spontaneous Jumping · No Premature Extension</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">ROUTING_INVARIANT_LEAN</tspan> | Module: <tspan fill="#e2e8f0">PrimitivePassage.lean</tspan> | Halting: <tspan fill="#38bdf8">Guaranteed</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-013 Analog</tspan></text>
  </g>

</svg>
