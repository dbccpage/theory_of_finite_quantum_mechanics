<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 18: Genesis 18</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Arithmetic: Exact Cochains</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Firewall: Zero Floats</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 18: Discrete Rational Cochain Fencing &amp; Exact Arithmetic</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Strict Rational Arithmetic Over &#8474;, Float Error Trapping, and Discrete Hodge Demarcation</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Exact Rationality &amp; Float Rejection</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">c &#8712; Cochain &#8743; val(c) &#8712; &#8474; &#8743; &#172;HasFloat(c)</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">State &#8866; AdmittedExact(c)   [FloatProbabilityError]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Hard Rejection of Floats (FloatProbabilityError):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Attempting to pass IEEE floating-point values into</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">cochain calculations triggers an unbypassable exception.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Discrete Rational Carrier (&#8474;):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Weights, probabilities, and cost factors are represented</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">as exact irreducible fractions: p / q with gcd(p, q) = 1.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Zero Float Leaks into Lean Core:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Guarantees that constructive proofs in Lean remain</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">algebraically closed without rounding heuristics.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Arithmetic Firewall &amp; Cochain Gate</text>

    <g transform="translate(30, 45)">
      <!-- Input Value Stream -->
      <rect x="110" y="10" width="180" height="50" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="200" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Candidate Values</text>
      <text x="200" y="48" fill="#94a3b8" font-size="9" text-anchor="middle">Coefficients / Probabilities</text>

      <!-- Gate Decision -->
      <line x1="200" y1="60" x2="200" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
      <circle cx="200" cy="115" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="200" y="120" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">&#8712; &#8474;?</text>

      <!-- Left Path: Float Rejected -->
      <path d="M 180 115 L 75 115 L 75 160" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrowRose)"/>
      <rect x="10" y="165" width="150" height="75" rx="6" fill="#4c0519" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="85" y="187" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">Float Rejection</text>
      <text x="85" y="203" fill="#fca5a5" font-size="9" text-anchor="middle">IEEE 754 Detected</text>
      <text x="85" y="218" fill="#fca5a5" font-size="9.5" font-weight="700" text-anchor="middle">&#10140; FloatProbabilityError</text>

      <!-- Right Path: Exact Fraction Accepted -->
      <path d="M 220 115 L 325 115 L 325 160" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
      <rect x="250" y="165" width="150" height="75" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="325" y="187" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Exact Rational</text>
      <text x="325" y="203" fill="#a7f3d0" font-size="9" text-anchor="middle">Fractions.Fraction (p/q)</text>
      <text x="325" y="218" fill="#a7f3d0" font-size="9.5" font-weight="700" text-anchor="middle">&#10140; Admitted to Cochain</text>

      <!-- Bottom Banner -->
      <rect x="15" y="265" width="380" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="205" y="283" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">Discrete External Calculus Integrity</text>
      <text x="205" y="298" fill="#34d399" font-size="9" text-anchor="middle">&#10003; Zero Accumulation of Machine Precision Drift</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">EXACT_RATIONAL_FIREWALL</tspan> | Domain: <tspan fill="#e2e8f0">&#8474; (Fractions)</tspan> | Floats: <tspan fill="#f43f5e">HARD_REFUSAL</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-018 Analog</tspan></text>
  </g>

</svg>
