<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 15: Genesis 15</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Protocol: Alpha Contract</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Separation: Red-Blue-Green</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 15: Progress Licensing &amp; Alpha Reference Contract</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Strict Tripartite Separation: Untrusted Proposals, Host Evaluation, and Bound Authorized Admission</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Licensing Authorization Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">p &#8712; Proposal &#8743; HostAudit(p) = Clean &#8743; Licensed(p)</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">State &#8594; State &#8746; {p}   [progress_needs_license]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Proposals Confer Zero Authority:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">A model or agent candidate proposal has status</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11"><tspan fill="#f43f5e" font-family="monospace">AuthorityEffect: None</tspan> and cannot alter state.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Three Repaired Vulnerabilities (B1, B2, B3):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Alpha contract recomputes evaluation, verifies parent</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">history replay, and binds licenses to exact call digests.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Host Call is the Sole Authority:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Admission requires an explicit, verified authorization token</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">emitted strictly by the sovereign host evaluator.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Tripartite Flow) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Tripartite Authority Architecture (R-B-G)</text>

    <g transform="translate(30, 45)">
      <!-- Tier 1: Red (Untrusted Proposal) -->
      <rect x="15" y="10" width="370" height="65" rx="6" fill="#4c0519" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="35" y="32" fill="#f43f5e" font-size="11" font-weight="700">1. Red: Untrusted Proposal</text>
      <text x="35" y="50" fill="#fca5a5" font-size="9.5">Candidate delta stream &#183; AuthorityEffect: None &#183; Modifies zero state</text>

      <!-- Arrow down to Blue -->
      <line x1="200" y1="75" x2="200" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

      <!-- Tier 2: Blue (Host Audit & Evaluation) -->
      <rect x="15" y="105" width="370" height="75" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="35" y="127" fill="#38bdf8" font-size="11" font-weight="700">2. Blue: Host Evaluator (Alpha Engine)</text>
      <text x="35" y="145" fill="#93c5fd" font-size="9.5">Recomputes evaluation &#183; Checks replay history &#183; Quotients ties</text>
      <text x="35" y="162" fill="#93c5fd" font-size="9.5">Verifies B1 (key-member), B2 (history replay), B3 (source binding)</text>

      <!-- Arrow down to Green -->
      <line x1="200" y1="180" x2="200" y2="205" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

      <!-- Tier 3: Green (Authorized Admission) -->
      <rect x="15" y="210" width="370" height="65" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="35" y="232" fill="#34d399" font-size="11" font-weight="700">3. Green: Bound Authorized Admission</text>
      <text x="35" y="250" fill="#a7f3d0" font-size="9.5">State mutation applied &#183; Immutable commit &#183; Replay verified</text>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="290" width="370" height="32" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="200" y="310" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Separation Prevents Hallucinated or Self-Granted Authority</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">ALPHA_CONTRACT_READY</tspan> | Coverage: <tspan fill="#e2e8f0">&#8805; 95% Stmt/Branch</tspan> | Audited: <tspan fill="#38bdf8">B1, B2, B3 Proved</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-015 Analog</tspan></text>
  </g>

</svg>
