schema_version: smplx.nf.contract.v0
schema_ref: ./normal_form_contract_schema.yaml
contract_kind: form_contract
identity:
  id: nf.recursion.asrf
  name: Autopoietic Self-Reference Refusal Form
  short_name: ASRF
  version: v0
  theory_status: proposed
  contract_status: draft
  verification_status: absent
  family: recursion
  status: draft
classification:
  hierarchy_level: form
  subject_kind:
  - caller_identity
  - verification_target
  data_posture: in_motion
  mathematical_posture: operational
purpose:
  excludes_anomaly: a caller that certifies the state it just generated (self-certification cycle)
  preserves_invariant: the caller hash and the target hash differ, and a detected
    self-cycle is refused
  protected_skeleton:
  - caller_hash
  - target_hash
  erased_structure: []
  non_claims:
  - the check compares two declared hashes and a declared call graph. It is not an incompleteness theorem and
    it computes no cohomology group
  - this form verifies acyclic non-self-certification; the term "cohomology" does not apply to this contract
  - the source name for the refusal is a metaphor. The route in this contract is SelfReferenceRefusal
  - does not imply authorization
definition:
  source: coda_all_universe/mssn_sn_tower/definitions.md
  section: '3.7'
  formal_statement: 'A verification step records a caller hash and a target hash.
    The step is admitted when the two hashes differ. When they are equal, or when
    the declared call graph contains a cycle through the caller and the target, the
    step is refused. The refusal record is kept apart from the admitted evaluations.

    '
  quadrilateral:
    qualifies_as_true_normal_form: false
    qualification_gap: self_reference_cycle_refusal_is_an_evaluator_guard_not_a_relational_project_join_theorem
    qualifies_as_extended_form: true
    anomaly_exclusion: self-certification of a generated state
    lossless_join:
      status: refusal_separated
      statement: refused self-cycles are stored as refusals and are not folded into
        the admitted evaluations
    dependency_preservation:
      status: hash_inequality_retained
      statement: an admitted step keeps caller hash different from target hash
    syntactic_decision:
      status: declaration_decidable
      statement: the check compares the declared hashes and the declared call graph
declarations_required:
- caller_hash
- target_hash
- call_graph
evidence_required: []
validation_criteria:
- an admitted step has caller hash different from target hash
- a step with equal hashes is refused
- a cycle through the caller and the target in the declared call graph is refused
terminal_routes:
- Accept
- SelfReferenceRefusal
terminal_route_map:
  Accept: Preserve
  SelfReferenceRefusal: Refuse
certification:
  certificate_required: false
  certificate_kind: null
  obstruction_class_required: false
  loss_ledger_required: false
  verifier_required: false
  loss_ledger_trigger_id: null
authorization:
  authorized_by: null
  certified_implies_authorized: false
failure_modes:
- symptom: caller hash equals target hash
  diagnosis: the caller is the verification target
  terminal: SelfReferenceRefusal
examples:
- ref: coda_all_universe/mssn_sn_tower/definitions.md
  section: '3.7'
references:
- coda_all_universe/mssn_sn_tower/definitions.md
