<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-13</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(13)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 13: Alternation Ladders &amp; Expansion Cycle Detection (MSS-13)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Quantifier alternation depth tracking Sigma_k / Pi_k and autopoietic expansion cycle breaking</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;alt depth cycle_token route&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Alternation Ladder (Left) -->
        <g transform="translate(50, 20)">
          <rect x="0" y="0" width="360" height="240" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
          <text x="180" y="26" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">Quantifier Alternation Ladder &#931;_k &#8596; &#928;_k</text>

          <!-- Ladder rungs -->
          <g transform="translate(30, 45)">
            <rect x="0" y="0" width="300" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
            <text x="20" y="21" fill="#38bdf8" font-size="11" font-weight="700">Depth k=0:</text>
            <text x="100" y="21" fill="#f8fafc" font-size="11">&#916;&#8320; Quantifier-free base</text>

            <rect x="0" y="42" width="300" height="32" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
            <text x="20" y="21" fill="#818cf8" font-size="11" font-weight="700">Depth k=1:</text>
            <text x="100" y="21" fill="#f8fafc" font-size="11">&#931;&#8321; (&#8707; bounded) / &#928;&#8321; (&#8704; bounded)</text>

            <rect x="0" y="84" width="300" height="32" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
            <text x="20" y="21" fill="#c084fc" font-size="11" font-weight="700">Depth k=2:</text>
            <text x="100" y="21" fill="#f8fafc" font-size="11">&#931;&#8322; (&#8707;&#8704;) / &#928;&#8322; (&#8704;&#8707; alternation)</text>

            <rect x="0" y="126" width="300" height="32" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="20" y="21" fill="#f43f5e" font-size="11" font-weight="700">Depth k&#8804;12:</text>
            <text x="100" y="21" fill="#fca5a5" font-size="11">Primitive Recursive Halting Ceiling</text>
          </g>
        </g>

        <!-- Expansion Cycle Detector (Right) -->
        <g transform="translate(440, 20)">
          <rect x="0" y="0" width="340" height="240" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
          <text x="170" y="28" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle">Expansion Cycle Radar</text>

          <!-- Circular Recurrence Loop -->
          <circle cx="170" cy="110" r="45" fill="none" stroke="#f43f5e" stroke-dasharray="4 4" stroke-width="2"/>
          <path d="M 170 65 A 45 45 0 0 1 215 110" fill="none" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowRed)"/>
          <circle cx="170" cy="65" r="8" fill="#f43f5e"/>
          <circle cx="215" cy="110" r="8" fill="#f43f5e"/>
          <circle cx="170" cy="155" r="8" fill="#f43f5e"/>
          <circle cx="125" cy="110" r="8" fill="#f43f5e"/>

          <text x="170" y="114" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">s_t = s_{t+k}</text>

          <g transform="translate(20, 175)">
            <rect x="0" y="0" width="300" height="45" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
            <text x="150" y="22" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">CIRCUIT BREAKER ACTION</text>
            <text x="150" y="38" fill="#fca5a5" font-size="10" text-anchor="middle">EXPANSION_CYCLE_DETECTED: Force lift or abort</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::AlternationMonitor</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_CYCLE_DETECTED</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Quantifier alternation levels need explicit AST variable scoping and polarity masks; forced lift to MSS-14.</text>
  </g>
</svg>