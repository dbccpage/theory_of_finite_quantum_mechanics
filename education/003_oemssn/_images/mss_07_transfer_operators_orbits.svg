<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-07</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(7)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 7: Transfer Operators &amp; Periodic Orbits (MSS-7)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Discrete de Bruijn shift graphs B(k,m), transfer operator L, and primitive orbit certificates</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;shift &lt;k m&gt;&gt; &lt;orbit &lt;p flag v...&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- De Bruijn Shift Graph B(2,1) -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="370" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="185" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">de Bruijn Graph B(2,1) Transitions</text>

          <!-- 4 State Nodes in Circle -->
          <circle cx="100" cy="80" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="100" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">00</text>

          <circle cx="270" cy="80" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="270" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">01</text>

          <circle cx="270" cy="180" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="270" y="185" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">11</text>

          <circle cx="100" cy="180" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="100" y="185" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">10</text>

          <!-- Transition Edges -->
          <line x1="125" y1="80" x2="245" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="270" y1="105" x2="270" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="245" y1="180" x2="125" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="100" y1="155" x2="100" y2="105" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

          <!-- Self loops -->
          <path d="M 85 70 C 50 40, 50 110, 85 90" fill="none" stroke="#64748b" stroke-width="1.5"/>
          <path d="M 285 170 C 320 140, 320 210, 285 190" fill="none" stroke="#64748b" stroke-width="1.5"/>

          <text x="185" y="222" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Primitive Orbit &#10216;1&#10217;: 00 &#8594; 01 &#8594; 11 &#8594; 10 &#8594; 00</text>
        </g>

        <!-- Transfer Operator &amp; Invariant -->
        <g transform="translate(440, 20)">
          <rect x="0" y="0" width="340" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="170" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Transfer Operator L</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="300" height="75" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
            <text x="150" y="26" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Ruelle-Perron-Frobenius</text>
            <text x="150" y="50" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">(Lf)(x) = &#8721;_{y &#8712; &#963;&#8315;&#185;(x)} w(y) f(y)</text>
          </g>

          <g transform="translate(20, 140)">
            <rect x="0" y="0" width="300" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="150" y="24" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">12 Audit Conditions Validated</text>
            <text x="150" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Strict check of orbit closure, minimal period,</text>
            <text x="150" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">and lexicographic cyclic representative.</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::DeBruijnAuditor</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_AUDIT_CONDITION_FAILED</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Dynamic orbits lack exact rational potential cuts and dual witness certificates; forced lift to MSS-8.</text>
  </g>
</svg>