<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-10</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(10)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 10: Spectral Shadows &amp; Epistemic Quarantine (MSS-10)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Fencing unverified spectral, transcendental, or continuum claims from the exact discrete carrier</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;quarantine thm&gt; &lt;claims ...&gt; &lt;audit&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Safe Zone (Left) -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="310" height="240" rx="8" fill="#022c22" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
          <text x="155" y="28" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">CERTIFIED DISCRETE CARRIER</text>
          
          <rect x="25" y="55" width="260" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
          <text x="155" y="80" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Exact Rational Arithmetic &#8474;</text>

          <rect x="25" y="105" width="260" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
          <text x="155" y="130" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Finite Incidence Matrices</text>

          <rect x="25" y="155" width="260" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
          <text x="155" y="180" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Zero Duality Gap Certificates</text>

          <text x="155" y="222" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">VERDICT: &#10216;1&#10217; (Admitted)</text>
        </g>

        <!-- Central Quarantine Firewall -->
        <g transform="translate(370, 20)">
          <rect x="0" y="0" width="60" height="240" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="2" filter="url(#glowRed)"/>
          <text x="30" y="100" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 30 100)">FENCE</text>
        </g>

        <!-- Quarantined Zone (Right) -->
        <g transform="translate(450, 20)">
          <rect x="0" y="0" width="330" height="240" rx="8" fill="#1e1b4b" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.5"/>
          <text x="165" y="28" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle">QUARANTINED SPECTRAL SHADOWS</text>

          <g transform="translate(25, 55)">
            <rect x="0" y="0" width="280" height="35" rx="4" fill="#1f1d2b" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1"/>
            <text x="140" y="22" fill="#fca5a5" font-size="11" text-anchor="middle">Continuum Transcendentals (&#960;, e, &#8730;2)</text>
          </g>

          <g transform="translate(25, 100)">
            <rect x="0" y="0" width="280" height="35" rx="4" fill="#1f1d2b" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1"/>
            <text x="140" y="22" fill="#fca5a5" font-size="11" text-anchor="middle">Floating-Point Approximations</text>
          </g>

          <g transform="translate(25, 145)">
            <rect x="0" y="0" width="280" height="35" rx="4" fill="#1f1d2b" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1"/>
            <text x="140" y="22" fill="#fca5a5" font-size="11" text-anchor="middle">Uncertified Riemann Zeros / Poles</text>
          </g>

          <text x="165" y="222" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">VERDICT: &#10216;0&#10217; (Fenced / Quarantined)</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::SpectralFencer</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_SPECTRAL_LEAKAGE</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Quarantined terms lack formal syntactic rewrite rules and confluence join proofs; forced lift to MSS-11.</text>
  </g>
</svg>