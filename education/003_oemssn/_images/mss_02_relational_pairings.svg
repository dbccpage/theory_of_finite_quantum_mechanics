<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-02</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(2)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 2: Relational Pairings &amp; Obstructed Graphs (MSS-2)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">1D relations, irreflexive directed edges, reflexive loops, and pushforward collision obstructions</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;ab&gt; | &lt;aa&gt; | &lt;&lt;ab&gt;&lt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- 3 Cards: Directed Edge, Self-Loop, Obstructed Edge -->
        <g transform="translate(10, 20)">
          <!-- Card 1: Directed Edge <ab> -->
          <rect x="0" y="0" width="250" height="250" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
          <text x="125" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">&lt;ab&gt; (Directed Edge)</text>
          <circle cx="55" cy="110" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="55" y="115" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a</text>
          <circle cx="195" cy="110" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="195" y="115" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b</text>
          <line x1="75" y1="110" x2="175" y2="110" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
          <text x="125" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Irreflexive (a &#8800; b)</text>
          <text x="125" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">&#8706;&#10216;ab&#10217; = b - a &#8800; 0</text>
          <text x="125" y="220" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Non-vanishing boundary</text>
        </g>

        <g transform="translate(280, 20)">
          <!-- Card 2: Self-Loop <aa> -->
          <rect x="0" y="0" width="250" height="250" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1"/>
          <text x="125" y="28" fill="#818cf8" font-size="13" font-weight="700" text-anchor="middle">&lt;aa&gt; (Reflexive Loop)</text>
          <circle cx="125" cy="125" r="18" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
          <text x="125" y="130" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a</text>
          <!-- Loop path -->
          <path d="M 115 108 C 90 60, 160 60, 135 108" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>
          <text x="125" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Vanishing Boundary:</text>
          <text x="125" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">&#8706;&#10216;aa&#10217; = a - a = 0</text>
          <text x="125" y="220" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">Structural Point Collapse</text>
        </g>

        <g transform="translate(550, 20)">
          <!-- Card 3: Obstructed Edge <<ab><>> -->
          <rect x="0" y="0" width="250" height="250" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1"/>
          <text x="125" y="28" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle">&lt;&lt;ab&gt;&lt;&gt;&gt; (Obstruction)</text>
          <circle cx="55" cy="110" r="16" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
          <text x="55" y="115" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a</text>
          <circle cx="195" cy="110" r="16" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
          <text x="195" y="115" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b</text>
          <line x1="75" y1="110" x2="175" y2="110" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="2"/>
          <!-- Collision Defect Badge -->
          <rect x="95" y="96" width="60" height="26" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1" filter="url(#glowRed)"/>
          <text x="125" y="114" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">&lt;&gt;</text>
          <text x="125" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Collision: c(a) = c(b)</text>
          <text x="125" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">Violates Irreflexivity</text>
          <text x="125" y="220" fill="#f43f5e" font-size="10" font-weight="600" text-anchor="middle">Attached Defect Record</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::IncidenceValidator</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_BOUNDARY_DEFECT</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Pairwise edges cannot express 2D surface containment or loop boundary nilpotence; forced lift to MSS-3.</text>
  </g>
</svg>