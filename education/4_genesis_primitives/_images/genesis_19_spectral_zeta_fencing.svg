<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 19: Genesis 19</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Shadow: Spectral Fence</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Object: Integer Polynomial</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 19: Spectral &amp; Zeta Polynomial Fencing</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Exact Integer Characteristic Polynomials, Ihara Determinant Fences, and Anti-Leakage Safeguards</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Spectral Shadow &amp; Polynomial Containment</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">P(u) = det(I - Au + Qu^2) &#8712; &#8484;[u]</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">State &#8866; FencedSpectralShadow(P)   [ZetaQuarantine]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Polynomial Serialization:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Transfer operators and Ihara zeta inverses are serialized</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">strictly as integer polynomials &#8484;[u] without floating poles.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Epistemic Quarantine of Continuous Limits:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Discrete graph eigenvalues are fenced from continuous</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">spacetime spectrum or Riemann Hypothesis overclaims.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Finite Graph Trace Determinants:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Closed loop counts and prime orbits are verified</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">by exact matrix determinants over finite integer rings.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Spectral Shadow Quarantine Topology</text>

    <g transform="translate(30, 45)">
      <!-- Top Graph Cochain -->
      <rect x="110" y="10" width="180" height="50" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="200" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Discrete Adjacency Matrix</text>
      <text x="200" y="48" fill="#94a3b8" font-size="9" text-anchor="middle">A &#8712; M_n(&#8484;) &#183; Finite Graph</text>

      <!-- Arrow down to Bass-Ihara -->
      <line x1="200" y1="60" x2="200" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

      <!-- Bass-Ihara Operator -->
      <rect x="100" y="100" width="200" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="200" y="122" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Bass-Ihara Determinant</text>
      <text x="200" y="140" fill="#93c5fd" font-size="9.5" text-anchor="middle">Z(u)^(-1) = det(I - Au + Qu^2)</text>

      <!-- Downward Arrow -->
      <line x1="200" y1="155" x2="200" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

      <!-- Fenced Object -->
      <rect x="25" y="195" width="350" height="85" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="200" y="218" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Fenced Spectral Shadow (Integer Polynomial)</text>
      <text x="200" y="236" fill="#a7f3d0" font-size="9.5" text-anchor="middle">P(u) = c_0 + c_1 u + c_2 u^2 + ... + c_k u^k</text>
      <text x="200" y="252" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Pure Algebraic Coefficients c_i &#8712; &#8484; &#183; Zero Float Pollution</text>
      <text x="200" y="268" fill="#fbbf24" font-size="9" text-anchor="middle">Fenced: Cannot Assert Continuous Spectral Theorem</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">SPECTRAL_FENCED_DISCRETE</tspan> | Domain: <tspan fill="#e2e8f0">&#8484;[u] Characteristic</tspan> | Quarantine: <tspan fill="#38bdf8">Strict Model Boundary</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-019 Analog</tspan></text>
  </g>

</svg>
