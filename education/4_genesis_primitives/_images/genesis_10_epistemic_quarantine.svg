<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 10: Genesis 10</text>

    <rect x="140" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="222" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Gate: Epistemic Quarantine</text>

    <rect x="315" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="397" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Axioms: {propext, Quot.sound}</text>

    <rect x="490" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="560" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 10: Epistemic Quarantine &amp; Claim Discipline Fencing</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Hermetic Axiom Boundaries, Bounded-Theorem Tags, and Ledger-Pinned Claims</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Epistemic Fence &amp; Constructive Axiom Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">claim &#8712; Ledger &#8743; Axioms(p) &#8838; {propext, Quot.sound}</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">R &#8866; VerifiedWithinScope(claim)   [AxiomGate]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Constructive Purity (Zero Classical Choice):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">1,530 axiom reports in <tspan fill="#38bdf8" font-family="monospace">lean_axioms.txt</tspan>.</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">Zero <tspan fill="#f43f5e" font-family="monospace">Classical.choice</tspan>, zero <tspan fill="#f43f5e" font-family="monospace">sorryAx</tspan>.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; 140 CL-* Ledger Invariants:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Every mathematical assertion is bound to explicit</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">finite carrier bounds and typed terminal dispositions.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Continuum Firewall:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Uncertified continuous limits or heuristic spectral</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">analogies are quarantined from discrete evaluation.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Axiom Census &amp; Verification Firewall Topology</text>

    <!-- Inside Diagram -->
    <g transform="translate(30, 55)">
      <!-- Box 1: Raw Proof Object -->
      <rect x="20" y="10" width="160" height="60" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <text x="100" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Lean Proof Object</text>
      <text x="100" y="50" fill="#94a3b8" font-size="9.5" text-anchor="middle">75 Modules / 30,903 LOC</text>

      <!-- Arrow to Axiom Scanner -->
      <line x1="180" y1="40" x2="230" y2="40" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

      <!-- Box 2: Axiom Scanner -->
      <rect x="235" y="10" width="145" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="307" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Axiom Scanner</text>
      <text x="307" y="50" fill="#94a3b8" font-size="9" text-anchor="middle">Print Axioms / Gated</text>

      <!-- Downward Split -->
      <path d="M 307 70 L 307 105 L 140 105 L 140 135" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
      <path d="M 307 70 L 307 105 L 307 135" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRose)"/>

      <!-- Allowed Axiom Cell -->
      <rect x="50" y="140" width="180" height="90" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="140" y="162" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Admitted Kernel</text>
      <text x="140" y="180" fill="#a7f3d0" font-size="9.5" text-anchor="middle">pure inductive: 454</text>
      <text x="140" y="196" fill="#a7f3d0" font-size="9.5" text-anchor="middle">[propext]: 186</text>
      <text x="140" y="212" fill="#a7f3d0" font-size="9.5" text-anchor="middle">[propext, Quot.sound]: 890</text>

      <!-- Quarantined Cell -->
      <rect x="250" y="140" width="145" height="90" rx="6" fill="#4c0519" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="322" y="162" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">Quarantined / Refused</text>
      <text x="322" y="182" fill="#fca5a5" font-size="9.5" text-anchor="middle">Classical.choice: 0</text>
      <text x="322" y="198" fill="#fca5a5" font-size="9.5" text-anchor="middle">sorryAx: 0</text>
      <text x="322" y="214" fill="#fca5a5" font-size="9.5" text-anchor="middle">Continuous floats: REFUSED</text>

      <!-- Bottom Ledger Bar -->
      <rect x="20" y="250" width="375" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="207" y="268" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">CL-* Claim Ledger: 140 Verified Entries</text>
      <text x="207" y="283" fill="#94a3b8" font-size="9" text-anchor="middle">Narrowest Defensible Claims · Zero Unmechanized Continuum Leap</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">SEALED_CONSTRUCTIVE_AXIOMS</tspan> | Lean Modules: <tspan fill="#e2e8f0">75</tspan> | Axiom Reports: <tspan fill="#38bdf8">1,530 Pure</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-010 Analog</tspan></text>
  </g>

</svg>
