<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-19</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Scope</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 20</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Relative Scope</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 19: Relative Completeness for Presentations</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Finite Coverage of a Declared Query Family, Relative to an Observer Profile Π</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">complete(Q, Π) ⇔ each q ∈ Q gets one status</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH20-D01 · CH20-O01 · CH20-N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Status of a Query q Relative to Profile Π</text>
    
    <g transform="translate(20, 45)">
      <!-- Outer box: strings before parse/type check -->
      <rect x="10" y="10" width="375" height="225" rx="8" fill="#030712" stroke="#475569" stroke-width="1.5"/>
      <text x="25" y="32" fill="#94a3b8" font-size="11" font-weight="700">Strings: parse/type check comes first</text>

      <!-- Well-typed queries -->
      <rect x="35" y="45" width="325" height="175" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="50" y="68" fill="#38bdf8" font-size="11" font-weight="700">Well-typed queries q</text>

      <!-- In profile: Proved / Refuted / Undetermined -->
      <rect x="65" y="85" width="160" height="120" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <text x="80" y="110" fill="#34d399" font-size="11" font-weight="700">In profile Π</text>
      <text x="80" y="130" fill="#f8fafc" font-size="10">• Proved (verified)</text>
      <text x="80" y="148" fill="#f8fafc" font-size="10">• Refuted (verified)</text>
      <text x="80" y="166" fill="#f8fafc" font-size="10">• Undetermined</text>

      <!-- Not in profile: OutsideProfile -->
      <rect x="235" y="85" width="110" height="120" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="290" y="110" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Not in Π</text>
      <text x="290" y="145" fill="#fca5a5" font-size="12" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">OUTSIDE</text>
      <text x="290" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">OutsideProfile</text>

      <rect x="10" y="250" width="375" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="273" fill="#34d399" font-size="11" font-weight="700">• WDP-CH20-D01 (Definition, §20.2):</text>
      <text x="35" y="293" fill="#cbd5e1" font-size="10.5">Complete on finite Q: each q gets exactly one status,</text>
      <text x="35" y="311" fill="#cbd5e1" font-size="10.5">and evidence for Proved/Refuted passes its verifier.</text>
      <text x="35" y="329" fill="#fbbf24" font-size="10.5">Refused is a separate policy status, not a refutation.</text>
      <text x="35" y="347" fill="#f43f5e" font-size="10.5">Undetermined is not Refuted; OutsideProfile is not Refused.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Status Algebra, Open Claim &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Five-Valued Status Set (§20.2)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, monospace">{Proved, Refuted, Undetermined, OutsideProfile, Refused}</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Disjoint typing rules; ill-typed strings are not given a status.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Open Claim WDP-CH20-O01 (§20.3, not proved)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Exclusive: no q both Proved and Refuted under one logic.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Exhaustive: each in-profile q terminates or is Undetermined.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Profile changes move statuses only via explicit adapters.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Negative Control (relative_status.py)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Unadmitted claim: route_claim gives OUTSIDE_PROFILE,</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• never REFUTED (outside_profile_as_refuted).</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH20-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Relative completeness is not absolute omniscience, a truth-</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">decider, a Gödel escape, world creation, or cosmogenesis.</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">No theorem selects a root observer (§20.5).</text>
    </g>
  </g>
</svg>