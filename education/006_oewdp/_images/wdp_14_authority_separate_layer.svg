<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-14</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Authority</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 15</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">4 Separations</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 14: Authority is a Separate Layer</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Authority Packets, Four Separations, Bridges &amp; the Part III Schema</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Receipt × Credential → PermissionDecision</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH15-D01 · CH15-N01 · CH10-D05 · CH13-O02</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Separated Predicates &amp; the §15.10 Bridge</text>
    
    <g transform="translate(15, 45)">
      <!-- Chamber 1: Proposer -->
      <rect x="10" y="15" width="110" height="95" rx="6" fill="#030712" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="65" y="38" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Observer</text>
      <text x="65" y="58" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Accepts</text>
      <text x="65" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">E-observation</text>
      <text x="65" y="95" fill="#f43f5e" font-size="8.5" text-anchor="middle">⇏ measurement</text>

      <line x1="122" y1="62" x2="148" y2="62" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>

      <!-- Chamber 2: Evaluator -->
      <rect x="150" y="15" width="115" height="95" rx="6" fill="#030712" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="207" y="38" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Measurement</text>
      <text x="207" y="58" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Valid</text>
      <text x="207" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">Relative to profile</text>
      <text x="207" y="95" fill="#34d399" font-size="8.5" text-anchor="middle">⇏ standing</text>

      <line x1="267" y1="62" x2="293" y2="62" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrA)"/>

      <!-- Chamber 3: Authority -->
      <rect x="295" y="15" width="105" height="95" rx="6" fill="#030712" stroke="#10b981" stroke-width="1.8"/>
      <text x="347" y="38" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Authority</text>
      <text x="347" y="58" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Standing</text>
      <text x="347" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">Role, jurisdiction</text>
      <text x="347" y="95" fill="#a855f7" font-size="8.5" text-anchor="middle">⇏ claim true</text>

      <!-- Firewalls -->
      <line x1="135" y1="10" x2="135" y2="120" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="280" y1="10" x2="280" y2="120" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Append-Only Chain -->
      <g transform="translate(10, 135)">
        <rect x="0" y="0" width="390" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="15" y="22" fill="#34d399" font-size="10.5" font-weight="700">§15.10 Bridge (a declared rule):</text>
        <rect x="15" y="32" width="100" height="42" rx="4" fill="#030712" stroke="#10b981"/>
        <text x="65" y="50" fill="#f8fafc" font-size="9" text-anchor="middle">Measurement</text>
        <text x="65" y="65" fill="#38bdf8" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">value, uncert.</text>

        <line x1="117" y1="53" x2="143" y2="53" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>

        <rect x="145" y="32" width="100" height="42" rx="4" fill="#030712" stroke="#10b981"/>
        <text x="195" y="50" fill="#f8fafc" font-size="9" text-anchor="middle">Credential</text>
        <text x="195" y="65" fill="#38bdf8" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">role standing</text>

        <line x1="247" y1="53" x2="273" y2="53" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>

        <rect x="275" y="32" width="100" height="42" rx="4" fill="#030712" stroke="#10b981"/>
        <text x="325" y="50" fill="#f8fafc" font-size="9" text-anchor="middle">Permission</text>
        <text x="325" y="65" fill="#38bdf8" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">via procedure</text>
      </g>

      <rect x="10" y="240" width="390" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="262" fill="#f8fafc" font-size="10.5" font-weight="700">• Four separations without a bridge (§15.2):</text>
      <text x="35" y="280" fill="#cbd5e1" font-size="10">• witness exists ⇏ observer accepts</text>
      <text x="35" y="296" fill="#cbd5e1" font-size="10">• observer accepts ⇏ measurement valid</text>
      <text x="35" y="312" fill="#cbd5e1" font-size="10">• measurement valid ⇏ authority standing</text>
      <text x="35" y="328" fill="#fbbf24" font-size="10">• authority standing ⇏ claim true</text>
      <text x="35" y="344" fill="#f43f5e" font-size="10">• Tests, proofs, and tags confer no standing (§15.3).</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Authority Packet (WDP-CH15-D01)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">A = (R, J, Perm, Proc, Appeal)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Roles, jurisdiction, permissions, procedure, appeal: external.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (outcomes.py, WDP-CH15-N01)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• AuthorityEffect enum has a single member: NONE.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Accepted / Refused raise ValueError on any other effect.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• No authority packet or bridge is implemented in code.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusal &amp; Lean Countermodel</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Tampered authority field → CLAIM_STATUS_FIREWALL</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• acceptance_does_not_entail_authority (narrower)</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH15-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">This monograph assigns no authorization and changes no</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">jurisdiction. It carries no operational authority or</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">institutional standing. WDP-CH13-O02 is open.</text>
    </g>
  </g>
</svg>