<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-00</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Root W</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 01</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Admitted Cut</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 0: The Admitted Cut &amp; Primitive Difference</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Root W: Apartness Between Exhibition Roles, Cut Data &amp; Local Sameness</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Carrier: C = (X, E, τ, K)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH01-D01 · CH01-P01 · CH01-P02 · CH01-N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Declared Cut: Orientation Is Supplied</text>
    
    <g transform="translate(20, 50)">
      <circle cx="80" cy="80" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)"/>
      <text x="80" y="86" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">a</text>
      <text x="80" y="125" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Source (declared)</text>

      <line x1="112" y1="80" x2="260" y2="80" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
      <text x="186" y="70" fill="#fbbf24" font-size="13" font-family="ui-monospace, monospace" font-weight="700" text-anchor="middle">e: a → b</text>
      <text x="186" y="100" fill="#94a3b8" font-size="10" text-anchor="middle">R(a,b), R irreflexive</text>

      <circle cx="295" cy="80" r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#glowGreen)"/>
      <text x="295" y="86" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">b</text>
      <text x="295" y="125" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Target (declared)</text>

      <rect x="10" y="150" width="365" height="100" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="25" y="172" fill="#e2e8f0" font-size="11" font-weight="700">• Symmetry Is a Separate Choice (§1.4):</text>
      <text x="35" y="192" fill="#94a3b8" font-size="10.5">Bare pair with a ≠ b: the swap a ↔ b is an automorphism.</text>
      <text x="35" y="210" fill="#38bdf8" font-size="10.5">Oriented relation {(a,b)}: the swap is not an automorphism.</text>
      <text x="35" y="228" fill="#fbbf24" font-size="10.5">Orientation exists because the edge e was supplied.</text>

      <rect x="10" y="265" width="365" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="287" fill="#34d399" font-size="11" font-weight="700">• WDP-CH01-P02 (Lean: pointed_relation_independence_fin):</text>
      <text x="35" y="307" fill="#cbd5e1" font-size="10.5">R(a,b) ⇏ a ≠ b;  a ≠ b ⇏ R(a,b);  Irr(R) ∧ R(a,b) ⇒ a ≠ b.</text>
      <text x="35" y="325" fill="#cbd5e1" font-size="10.5">Countermodels: R = {(a,a)} on one point; ∅ on two points.</text>
      <text x="35" y="343" fill="#f43f5e" font-size="10.5">⇒ Irreflexivity is declared; relatedness alone is not apartness.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">WDP-CH01-D01: Admitted Cut Tuple</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">C = (X, E, τ, K)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">X: Tokens | E: Incidences | τ: Role typing | K: Comparison family</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable Binding (pointed_relation.py)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Exhaustive census of all 4674 pointed relations, |X| ≤ 3.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• 2337 related, 196 related+irreflexive, 3104 with a ≠ b.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Zero irreflexive related pairs with a = b; census stops at 3.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Refusals (RefusalCode)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• A pair or pole leaving the carrier → outside_carrier.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• A census request past carrier size 3 → budget_exhausted.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH01-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">No spectral, physical-vacuum, or cosmological ground</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">state is derived from an admitted cut. “Ground” here means</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">the admitted starting package, not a lowest eigenstate.</text>
    </g>
  </g>
</svg>