<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid7" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow7" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowRose7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow7)"/>
  <rect width="940" height="580" fill="url(#grid7)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#881337" fill-opacity="0.5" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="65" y="17" fill="#fecdd3" font-size="11" font-weight="700" text-anchor="middle">Level 07: Letter M</text>

    <rect x="140" y="0" width="150" height="26" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="215" y="17" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Operation: Typed Refusal</text>

    <rect x="300" y="0" width="165" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="382" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Vocabulary: 7 Closed Reasons</text>

    <rect x="475" y="0" width="165" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="557" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">State: Preserved (s' = s)</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 07 — Typed Refusal (M): Co-Equal Refusal &amp; State Preservation</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Refusal is an explicit, first-class mathematical operation; halts invalid moves without mutating state.</text>

  <!-- Left Card: Closed Refusal Vocabulary -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#881337" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#fda4af" font-size="11" font-weight="700">CLOSED REFUSAL VOCABULARY</text>

    <g transform="translate(20, 42)">
      <rect width="380" height="202" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
      
      <!-- 7 Refusal Reasons -->
      <g transform="translate(14, 18)">
        <circle cx="6" cy="6" r="3.5" fill="#f43f5e"/>
        <text x="16" y="9" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">1. REFUSED_BLIND</text>
        <text x="150" y="9" fill="#94a3b8" font-size="8.5">— Evaluating detector is inadequate</text>

        <circle cx="6" cy="32" r="3.5" fill="#f43f5e"/>
        <text x="16" y="35" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">2. REFUSED_NON_ZERO_CURL</text>
        <text x="180" y="35" fill="#94a3b8" font-size="8.5">— E attempted on d₁x ≠ 0</text>

        <circle cx="6" cy="58" r="3.5" fill="#f43f5e"/>
        <text x="16" y="61" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">3. REFUSED_UNLICENSED_LIFT</text>
        <text x="180" y="61" fill="#94a3b8" font-size="8.5">— Λ lacks valid discrete license</text>

        <circle cx="6" cy="84" r="3.5" fill="#f43f5e"/>
        <text x="16" y="87" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">4. REFUSED_SCOPE_LAUNDERING</text>
        <text x="180" y="87" fill="#94a3b8" font-size="8.5">— C attempted to lower defect</text>

        <circle cx="6" cy="110" r="3.5" fill="#f43f5e"/>
        <text x="16" y="113" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">5. REFUSED_LIFT_TRIGGER</text>
        <text x="165" y="113" fill="#94a3b8" font-size="8.5">— Λ without ClosedResidual trigger</text>

        <circle cx="6" cy="136" r="3.5" fill="#f43f5e"/>
        <text x="16" y="139" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">6. REFUSED_INVALID_STEP</text>
        <text x="165" y="139" fill="#94a3b8" font-size="8.5">— Ill-typed transition or broken fence</text>

        <circle cx="6" cy="162" r="3.5" fill="#f43f5e"/>
        <text x="16" y="165" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">7. REFUSED_MISSING_RECEIPT</text>
        <text x="180" y="165" fill="#94a3b8" font-size="8.5">— Step integration lacks valid receipt</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Law 3 Refusal Absorption & State Preservation -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#881337" fill-opacity="0.4"/>
    <text x="20" y="26" fill="#fb7185" font-size="11" font-weight="700">LAW 3: REFUSAL ABSORPTION</text>

    <!-- State Preservation Equation -->
    <g transform="translate(20, 44)">
      <rect width="396" height="74" rx="6" fill="#090d16" stroke="#e11d48" stroke-width="1.2"/>
      <text x="14" y="20" fill="#ffe4e6" font-size="10.5" font-weight="700">State Preservation Theorem (Ddc.M_preserves_state):</text>
      <text x="14" y="42" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">step(s, M(reason)) = s   (Identity on State)</text>
      <text x="14" y="62" fill="#94a3b8" font-size="9">A refusal halts execution and emits a typed receipt, but never mutates carrier or defect.</text>
    </g>

    <!-- Law 3 Absorption Allowed Next Operations -->
    <g transform="translate(20, 126)">
      <rect width="396" height="120" rx="6" fill="#1e1b4b" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2"/>
      <rect x="10" y="8" width="210" height="18" rx="3" fill="#881337"/>
      <text x="16" y="21" fill="#fff1f2" font-size="9.5" font-weight="700">ALLOWED MOVES AFTER M: {C, Λ, T}</text>

      <text x="14" y="44" fill="#cbd5e1" font-size="9">Repeating a refused action without structural modification is forbidden:</text>

      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="115" height="54" rx="5" fill="#030712" stroke="#3b82f6" stroke-width="1"/>
        <text x="57" y="20" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">C (Context)</text>
        <text x="57" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">Expose boundary</text>

        <rect x="127" y="0" width="115" height="54" rx="5" fill="#030712" stroke="#ec4899" stroke-width="1"/>
        <text x="184" y="20" fill="#f472b6" font-size="10" font-weight="700" text-anchor="middle">Λ (Lift)</text>
        <text x="184" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">Extend carrier</text>

        <rect x="254" y="0" width="115" height="54" rx="5" fill="#030712" stroke="#eab308" stroke-width="1"/>
        <text x="311" y="20" fill="#fde047" font-size="10" font-weight="700" text-anchor="middle">T (Terminal)</text>
        <text x="311" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">Close trace</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: MutationReceipt Wire Format -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="180" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">MUTATION REFUSAL RECEIPT</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#f43f5e">"M"</tspan>, "status": <tspan fill="#f43f5e">"MUTATION_REFUSED"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"refusal_reason": <tspan fill="#fca5a5">"REFUSED_NON_ZERO_CURL"</tspan>, "state_preserved": <tspan fill="#34d399">true</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"permitted_next": <tspan fill="#cbd5e1">["C", "Lambda", "T"]</tspan>, "authority_effect": <tspan fill="#f87171">"None"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanization box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#881337" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
      <text x="14" y="20" fill="#fecdd3" font-size="10.5" font-weight="700">Lean 4 Refusal Absorption Theorem:</text>
      <text x="14" y="38" fill="#ffe4e6" font-family="monospace" font-size="9">theorem Ddc.refusal_absorbing :</text>
      <text x="26" y="54" fill="#fca5a5" font-family="monospace" font-size="9">∀ op, op ∉ {C, Lambda, T} → step (refused_state s) op = refused_state s</text>
      <text x="14" y="74" fill="#94a3b8" font-size="9">Tested in: <tspan fill="#f8fafc" font-family="monospace">code/tests/test_typed_refusal.py</tspan></text>
      <text x="14" y="88" fill="#94a3b8" font-size="9">Gate test: <tspan fill="#f8fafc" font-family="monospace">test_refusal_absorption_law()</tspan></text>
    </g>
  </g>
</svg>
