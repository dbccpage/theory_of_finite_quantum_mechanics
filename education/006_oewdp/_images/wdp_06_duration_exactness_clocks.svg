<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-06</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Clock</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 07</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Exactness</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 6: Duration, Exactness, Periods &amp; Clocks</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Additive Edge Gauges, Four Exactness Statuses, Period Witnesses &amp; Clock Packets</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">D_λ(pq) = D_λ(p) + D_λ(q)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH07-D01 · P01 · P02 · D02 · O01 · N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Directed 4-Cycle: A Period Refutes Exactness</text>
    
    <g transform="translate(20, 45)">
      <!-- Circle of states for period T=4 -->
      <circle cx="190" cy="60" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="190" y="65" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">s0</text>
      <circle cx="270" cy="130" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="270" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">s1</text>
      <circle cx="190" cy="200" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="190" y="205" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">s2</text>
      <circle cx="110" cy="130" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">s3</text>

      <path d="M 206 63 A 80 80 0 0 1 267 114" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <path d="M 267 146 A 80 80 0 0 1 206 197" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <path d="M 174 197 A 80 80 0 0 1 113 146" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <path d="M 113 114 A 80 80 0 0 1 174 63" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>

      <text x="190" y="135" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">∮ λ = 4 ≠ 0</text>

      <rect x="10" y="235" width="375" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="258" fill="#34d399" font-size="11" font-weight="700">• Unit tally λ ≡ 1 (§7.4):</text>
      <text x="35" y="278" fill="#cbd5e1" font-size="10.5">Additive along paths: D(pq) = D(p) + D(q) (CH07-P01).</text>
      <text x="35" y="296" fill="#cbd5e1" font-size="10.5">Circulation 4 ≠ 0: no potential t has d₀t = λ (CH07-P02).</text>
      <text x="35" y="314" fill="#fbbf24" font-size="10.5">Step counts need a granularity convention (§7.4).</text>
      <text x="35" y="334" fill="#f43f5e" font-size="10.5">A cycle is not a clock: a clock is a packet (C,⇝,λ,r,κ,ε).</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Duration Gauge (CH07-D01, §7.1)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">λ: E → M,  D_λ(e₁⋯e_k) = Σ_j λ(e_j)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">M a commutative monoid; positivity and units are extra.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Four Statuses (§7.2): duration.py classify_duration</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Exact: a displayed t with d₀t = λ; then path independent.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Closed nonexact: d₁λ = 0, but a period shows λ ∉ im d₀.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Active closure failure: d₁λ ≠ 0 · Undetermined.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Period Witness (§7.4) &amp; Clock Refusals</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Diamond: 2+5 = 7 vs 3+6 = 9; period 2 refutes exactness.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• check_clock → OUTSIDE_CARRIER · REACCESS_FAILED</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH07-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Additive finite duration does not select a universal unit,</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">a continuum, Lorentzian structure, or a physical arrow of</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">time. Clock adequacy is open (CH07-O01).</text>
    </g>
  </g>
</svg>