<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow3" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow3)"/>
  <rect width="940" height="580" fill="url(#grid3)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="65" y="17" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">Level 03: Letter C</text>

    <rect x="140" y="0" width="160" height="26" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="220" y="17" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Operation: Context Exposure</text>

    <rect x="310" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="395" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Carrier: K ⊂ K' (Expansion)</text>

    <rect x="490" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Law 8: Monotonicity</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 03 — Context Exposure (C): Boundary Exposure &amp; Anti-Scope-Laundering</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Embeds carrier complex K into an extended environment K'; strictly partition edges into internal and boundary subsets.</text>

  <!-- Left Card: Internal vs Boundary Edge Partitioning -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="200" height="20" rx="4" fill="#1e3a8a" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#60a5fa" font-size="11" font-weight="700">CARRIER SUBDIVISION E(K')</text>

    <!-- Visual complex: Internal box and Boundary halo -->
    <g transform="translate(25, 45)">
      <!-- Outer boundary complex K' -->
      <polygon points="40,20 180,10 320,30 350,130 200,165 30,120" fill="#1e293b" fill-opacity="0.4" stroke="#f97316" stroke-width="1.8" stroke-dasharray="5 3"/>
      <text x="330" y="25" fill="#fb923c" font-size="10" font-weight="700">∂K' (Boundary)</text>

      <!-- Inner subcomplex K -->
      <polygon points="90,50 200,45 250,110 120,125" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="2" filter="url(#glowBlue)"/>
      <text x="160" y="85" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">K (Internal)</text>

      <!-- Nodes & Edges -->
      <circle cx="90" cy="50" r="5" fill="#60a5fa"/>
      <circle cx="200" cy="45" r="5" fill="#60a5fa"/>
      <circle cx="250" cy="110" r="5" fill="#60a5fa"/>
      <circle cx="120" cy="125" r="5" fill="#60a5fa"/>

      <!-- External boundary nodes -->
      <circle cx="40" cy="20" r="4" fill="#fb923c"/>
      <circle cx="320" cy="30" r="4" fill="#fb923c"/>
      <circle cx="350" cy="130" r="4" fill="#fb923c"/>
      <circle cx="200" cy="165" r="4" fill="#fb923c"/>
      <circle cx="30" cy="120" r="4" fill="#fb923c"/>

      <!-- Connecting boundary edges -->
      <line x1="90" y1="50" x2="40" y2="20" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
      <line x1="200" y1="45" x2="320" y2="30" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
      <line x1="250" y1="110" x2="350" y2="130" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    </g>

    <!-- Formula Box bottom -->
    <rect x="20" y="215" width="380" height="32" rx="5" fill="#030712" stroke="#334155" stroke-width="1"/>
    <text x="210" y="235" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">E(K') = E_int ⊔ E_bnd (Disjoint Sum)</text>
  </g>

  <!-- Right Card: Law 8 Anti-Scope-Laundering Monotonicity -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#9a3412" fill-opacity="0.4"/>
    <text x="20" y="26" fill="#fb923c" font-size="11" font-weight="700">LAW 8: ANTI-SCOPE-LAUNDERING</text>

    <!-- Principle Box -->
    <g transform="translate(20, 44)">
      <rect width="396" height="80" rx="6" fill="#090d16" stroke="#ea580c" stroke-width="1.2"/>
      <text x="14" y="22" fill="#fed7aa" font-size="11" font-weight="700">Law 8 (Carrier Restructuring Monotonicity):</text>
      <text x="14" y="42" fill="#f8fafc" font-size="10.5">A context change C strictly alters the carrier (K ≠ K') and</text>
      <text x="14" y="58" fill="#fb923c" font-size="11" font-weight="800">NEVER lowers Φ₁ or Γ₂ (no scope laundering).</text>
      <text x="14" y="72" fill="#94a3b8" font-size="9">Expanding context cannot be used to disguise or dilute an existing obstruction.</text>
    </g>

    <!-- Mathematical Invariant Equations -->
    <g transform="translate(20, 134)">
      <rect width="396" height="112" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#f8fafc" font-size="10.5" font-weight="700">Invariants Verified at Step Gate:</text>

      <circle cx="20" cy="38" r="4" fill="#f97316"/>
      <text x="32" y="42" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#fb923c">Carrier Change:</tspan> |V'| &gt; |V| ∨ |E'| &gt; |E| ∨ |F'| &gt; |F|</text>

      <circle cx="20" cy="62" r="4" fill="#f97316"/>
      <text x="32" y="66" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#fb923c">Non-Decreasing Defect:</tspan> Φ₁(K', x') ≥ Φ₁(K, x)</text>

      <circle cx="20" cy="86" r="4" fill="#f97316"/>
      <text x="32" y="90" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#fb923c">Non-Decreasing Curvature:</tspan> Γ₂(K', x') ≥ Γ₂(K, x)</text>

      <circle cx="20" cy="106" r="4" fill="#f97316"/>
      <text x="32" y="110" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#fb923c">Receipt Evidence:</tspan> Explicitly records internal vs boundary edge counts</text>
    </g>
  </g>

  <!-- Bottom Panel: ContextExposureReceipt Wire Format -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="180" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">CONTEXT EXPOSURE RECEIPT &amp; WIRE PROOF</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#60a5fa">"C"</tspan>, "status": <tspan fill="#60a5fa">"CONTEXT_EXPOSED"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"internal_edges": <tspan fill="#f59e0b">4</tspan>, "boundary_edges": <tspan fill="#fb923c">5</tspan>, "carrier_changed": <tspan fill="#34d399">true</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"phi1_pre": <tspan fill="#f59e0b">2</tspan>, "phi1_post": <tspan fill="#f59e0b">2</tspan>, "authority_effect": <tspan fill="#f87171">"None"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanization box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#1e3a8a" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="20" fill="#60a5fa" font-size="10.5" font-weight="700">Lean 4 &amp; Python Verification:</text>
      <text x="14" y="38" fill="#93c5fd" font-family="monospace" font-size="9.5">theorem Ddc.C_preserves_carrier_monotonicity :</text>
      <text x="26" y="54" fill="#e2e8f0" font-family="monospace" font-size="9">∀ (K K' : Complex) (x x'), is_extension K K' → Φ₁ K' x' ≥ Φ₁ K x</text>
      <text x="14" y="74" fill="#94a3b8" font-size="9">Verified by Python test suite: <tspan fill="#f8fafc" font-family="monospace">code/tests/test_context_exposure.py</tspan></text>
      <text x="14" y="88" fill="#94a3b8" font-size="9">Law 8 enforcement: <tspan fill="#f8fafc" font-family="monospace">test_scope_laundering_refused()</tspan></text>
    </g>
  </g>
</svg>
