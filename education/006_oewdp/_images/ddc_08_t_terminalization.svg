<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid8" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow8" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowAmber8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowAmber8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow8)"/>
  <rect width="940" height="580" fill="url(#grid8)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#78350f" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="65" y="17" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">Level 08: Letter T</text>

    <rect x="140" y="0" width="155" height="26" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="217" y="17" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Operation: Terminalization</text>

    <rect x="305" y="0" width="165" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="387" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Law 2: Terminal Absorbing</text>

    <rect x="480" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="560" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Guard: CanContinue_n</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 08 — Terminalization (T): Trace Closure &amp; Authority Firewall</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Evaluates nine continuation conjuncts to emit a typed routing verdict; absorbs all further mutations without granting authority.</text>

  <!-- Left Card: Terminal State Machine & Absorption Law 2 -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#78350f" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#fbbf24" font-size="11" font-weight="700">LAW 2: TERMINAL ABSORPTION</text>

    <!-- State Machine Diagram -->
    <g transform="translate(25, 45)">
      <!-- Open State -->
      <rect x="0" y="15" width="90" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="45" y="38" fill="#a7f3d0" font-size="9" text-anchor="middle">Active Trace</text>
      <text x="45" y="56" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">OPEN</text>

      <!-- Arrow Open -> Terminal -->
      <path d="M 98 45 L 148 45" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrowAmber8)"/>
      <text x="123" y="36" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">T</text>

      <!-- Terminal State -->
      <rect x="155" y="5" width="130" height="80" rx="8" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber8)"/>
      <text x="220" y="30" fill="#fde68a" font-size="9.5" text-anchor="middle">Terminalized State</text>
      <text x="220" y="52" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">TERMINAL</text>
      <text x="220" y="70" fill="#fef08a" font-size="8.5" text-anchor="middle">Absorption Sink</text>

      <!-- Self-loop Arrow on Terminal -->
      <path d="M 288 35 C 330 20, 330 70, 290 55" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowAmber8)"/>
      <text x="340" y="45" fill="#fde68a" font-size="9" font-weight="700">∀ op ∈ 𝒜</text>
    </g>

    <!-- Law 2 Equation Box bottom -->
    <g transform="translate(25, 150)">
      <rect width="370" height="95" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#f8fafc" font-size="10.5" font-weight="700">Theorem Ddc.terminal_absorbing:</text>
      <text x="14" y="38" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="700">∀ op ∈ 𝒜_DDC, step(Terminal(s), op) = Terminal(s)</text>
      <text x="14" y="56" fill="#94a3b8" font-size="9">• No operation may reactivate or modify a closed trace</text>
      <text x="14" y="70" fill="#94a3b8" font-size="9">• Immutable audit trail: Terminal receipt seals the tape</text>
      <text x="14" y="84" fill="#fca5a5" font-size="9">• Prevents continuation hallucination by downstream agents</text>
    </g>
  </g>

  <!-- Right Card: Continuation Guards & 4-Axis Separation -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="230" height="20" rx="4" fill="#78350f" fill-opacity="0.4"/>
    <text x="20" y="26" fill="#fde68a" font-size="11" font-weight="700">CONTINUATION GUARDS &amp; 4 AXES</text>

    <!-- Nine Continuation Conjuncts Box -->
    <g transform="translate(20, 44)">
      <rect width="396" height="88" rx="6" fill="#090d16" stroke="#b45309" stroke-width="1"/>
      <text x="14" y="20" fill="#fef3c7" font-size="10.5" font-weight="700">CanContinue_n (Halting Predicate):</text>
      <text x="14" y="38" fill="#cbd5e1" font-size="9">Evaluates 9 conjuncts: open residual, boundary edges, detector adequacy,</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="9">budget &gt; 0, unabsorbed refusal, capacity ceiling, exact non-zero mass.</text>
      <rect x="14" y="60" width="368" height="20" rx="3" fill="#030712"/>
      <text x="198" y="74" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">CanContinue_n(s) == false  ⟹  Emit Terminal(T, Verdict)</text>
    </g>

    <!-- 4-Axis Separation Firewall Box -->
    <g transform="translate(20, 140)">
      <rect width="396" height="106" rx="6" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="10" y="8" width="190" height="18" rx="3" fill="#7f1d1d"/>
      <text x="16" y="21" fill="#fca5a5" font-size="9.5" font-weight="700">FOUR-AXIS SEPARATION FIREWALL</text>

      <text x="14" y="42" fill="#cbd5e1" font-size="9">Strict ontological separation enforced across runtime:</text>
      <rect x="14" y="48" width="368" height="24" rx="4" fill="#030712" stroke="#475569" stroke-width="0.8"/>
      <text x="198" y="64" fill="#f87171" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">DiagnosticClass ≠ RoutingTerminal ≠ Extension ≠ Authority</text>

      <text x="14" y="88" fill="#fca5a5" font-size="8.5">• A terminal verdict routes workflow; it confers <tspan font-weight="800">ZERO</tspan> authority</text>
      <text x="14" y="100" fill="#fca5a5" font-size="8.5">• AuthorityEffect remains strictly <tspan font-weight="800">"None"</tspan> across all terminal paths</text>
    </g>
  </g>

  <!-- Bottom Panel: TerminalReceipt Wire Format -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="180" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">TERMINAL RECEIPT &amp; ROUTING VERDICT</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#f59e0b">"T"</tspan>, "status": <tspan fill="#f59e0b">"TRACE_TERMINALIZED"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"routing_terminal": <tspan fill="#fde68a">"ExactResolved"</tspan>, "total_steps": <tspan fill="#34d399">5</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"final_tape_hash": <tspan fill="#a5b4fc">"0x9c21...8a0f"</tspan>, "authority_effect": <tspan fill="#f87171">"None"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanization box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#78350f" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="20" fill="#fde68a" font-size="10.5" font-weight="700">Lean 4 Mechanization &amp; Gate:</text>
      <text x="14" y="38" fill="#fef3c7" font-family="monospace" font-size="9">theorem Ddc.terminal_absorbing : ∀ s op, step (term_state s) op = term_state s</text>
      <text x="14" y="56" fill="#94a3b8" font-size="9">Routing verdicts: <tspan fill="#cbd5e1" font-family="monospace">ExactResolved, IrreducibleResidual, RefusedExhausted</tspan></text>
      <text x="14" y="74" fill="#94a3b8" font-size="9">Tested in: <tspan fill="#f8fafc" font-family="monospace">code/tests/test_terminalization.py</tspan></text>
      <text x="14" y="88" fill="#94a3b8" font-size="9">Absorption test: <tspan fill="#f8fafc" font-family="monospace">test_terminal_absorption_invariant()</tspan></text>
    </g>
  </g>
</svg>
