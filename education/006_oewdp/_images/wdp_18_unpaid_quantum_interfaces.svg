<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-18</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Imports</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 19</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">O01–O04 Open</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 18: The Unpaid Quantum Interfaces</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Context, composition, phase, Born uniqueness, cancellation vs interference</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">P = B(A,A) biadditive ⇒ I_k = 0 (k ≥ 3)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH19-O01–O04 · P01 · N01–N02 · CH17-P03</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Chapter 19 Open Interfaces (O01–O04)</text>
    
    <g transform="translate(15, 45)">
      <!-- Four open interfaces CH19-O01 to CH19-O04 -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="375" height="45" rx="5" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="15" y="22" fill="#f43f5e" font-size="11" font-weight="700">1. CH19-O01 Context and empirical content</text>
        <text x="15" y="37" fill="#fca5a5" font-size="9.5">Typed map: measurement packets → empirical model on a cover</text>
      </g>

      <g transform="translate(10, 62)">
        <rect x="0" y="0" width="375" height="45" rx="5" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="15" y="22" fill="#f43f5e" font-size="11" font-weight="700">2. CH19-O02 Composition of two systems</text>
        <text x="15" y="37" fill="#fca5a5" font-size="9.5">State the rule, show consistency, name excluded countermodels</text>
      </g>

      <g transform="translate(10, 114)">
        <rect x="0" y="0" width="375" height="45" rx="5" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="15" y="22" fill="#f43f5e" font-size="11" font-weight="700">3. CH19-O03 Cochain phase to amplitude</text>
        <text x="15" y="37" fill="#fca5a5" font-size="9.5">Operational amplitude model without assuming the Born readout</text>
      </g>

      <g transform="translate(10, 166)">
        <rect x="0" y="0" width="375" height="45" rx="5" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="15" y="22" fill="#f43f5e" font-size="11" font-weight="700">4. CH19-O04 Finite quantum-instrument adapter</text>
        <text x="15" y="37" fill="#fca5a5" font-size="9.5">Probabilities, state changes, receipts match declared model</text>
      </g>

      <rect x="10" y="225" width="375" height="140" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="248" fill="#34d399" font-size="11" font-weight="700">• The eight external interfaces of §18.5:</text>
      <text x="35" y="268" fill="#cbd5e1" font-size="10.5">1 field ℂ · 2 circle group U(1) · 3 spectral theorem</text>
      <text x="35" y="286" fill="#cbd5e1" font-size="10.5">4 Gleason geometry (n ≥ 3) · 5 Hilbert tensor product</text>
      <text x="35" y="304" fill="#fbbf24" font-size="10.5">6 CPTP + Stinespring dilation · 7 Stone unitary groups</text>
      <text x="35" y="322" fill="#f43f5e" font-size="10.5">8 continuous dual cone completion (ρ PSD)</text>
      <text x="35" y="342" fill="#38bdf8" font-size="10.5">Exposed by this route; not proved independent (§18.5).</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Sorkin Sums, Bindings &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Cancellation vs interference §19.8</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">a=1, b=3/5+4i/5: P(a+b)=16/5, I₂=6/5</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Quartic readout on 1,1,1: I₃ = 36; additive: I₂ = 0.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Bindings: interference.py · Interference.lean</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• sorkin_alternating_sum: exact over ℚ(i); I_k = 0, k = 3–6</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Lean sorkin_I2_cross, sorkin_I3_biadditive: k = 2, 3 only</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• cross_term on a power readout → SCOPE_VIOLATION</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Comparison models (§19.10–§19.11)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Classical model is nonsignalling; so is the PR box.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• No-signalling is not a discriminator.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH19-N01 / N02: Nonclaim Fences</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Born-quadratic uniqueness is not proved. Complex phases,</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">contextual obstructions, or destructive cancellation separately</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">do not characterize quantum theory.</text>
    </g>
  </g>
</svg>