<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow2)"/>
  <rect width="940" height="580" fill="url(#grid2)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#312e81" fill-opacity="0.5" stroke="#6366f1" stroke-width="1.2"/>
    <text x="65" y="17" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 02: Letter R</text>

    <rect x="140" y="0" width="165" height="26" rx="6" fill="#0369a1" fill-opacity="0.4" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="222" y="17" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Operation: Residual Projection</text>

    <rect x="315" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="400" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Harmonic: ℋ¹ ≅ ker(d₁)/im(d₀)</text>

    <rect x="495" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="567" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Tie-Break: Ξ Metric</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 02 — Residual Projection (R): Hodge Splitting &amp; Cycle Retention</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Decomposes 1-cochain into exact deviation and irreducible harmonic circulation; retains topological obstructions.</text>

  <!-- Left Card: Hodge Direct Sum Splitting -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="190" height="20" rx="4" fill="#312e81" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#a5b4fc" font-size="11" font-weight="700">HODGE DIRECT SUM SPLITTING</text>

    <!-- Venn / Space diagram -->
    <rect x="25" y="48" width="370" height="95" rx="8" fill="#1e1b4b" fill-opacity="0.3" stroke="#4338ca" stroke-width="1.2"/>
    <text x="40" y="68" fill="#c7d2fe" font-size="12" font-weight="700">C¹(K; ℚ) = im(d₀) ⊕ im(d₁ᵀ) ⊕ ℋ¹</text>

    <g transform="translate(35, 78)">
      <!-- Box 1: Exact -->
      <rect x="0" y="0" width="105" height="50" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="52" y="20" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">im(d₀)</text>
      <text x="52" y="36" fill="#a7f3d0" font-size="8.5" text-anchor="middle">Exact (x_E)</text>

      <!-- Plus -->
      <text x="117" y="30" fill="#64748b" font-size="14" font-weight="700">⊕</text>

      <!-- Box 2: Co-exact -->
      <rect x="130" y="0" width="105" height="50" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="182" y="20" fill="#94a3b8" font-size="9.5" font-weight="700" text-anchor="middle">im(d₁ᵀ)</text>
      <text x="182" y="36" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Co-exact (x_C)</text>

      <!-- Plus -->
      <text x="247" y="30" fill="#64748b" font-size="14" font-weight="700">⊕</text>

      <!-- Box 3: Harmonic -->
      <rect x="260" y="0" width="85" height="50" rx="5" fill="#4338ca" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" filter="url(#glowPurple)"/>
      <text x="302" y="20" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">ℋ¹</text>
      <text x="302" y="36" fill="#c7d2fe" font-size="8.5" font-weight="600" text-anchor="middle">Residual (x_R)</text>
    </g>

    <!-- Cycle Circulation Diagram -->
    <g transform="translate(25, 155)">
      <rect width="370" height="90" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
      <circle cx="65" cy="45" r="28" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2"/>
      <path d="M 65 17 A 28 28 0 0 1 93 45" fill="none" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrowPurple2)"/>
      <text x="65" y="49" fill="#c7d2fe" font-size="10" font-weight="700" text-anchor="middle">γ₁</text>

      <text x="110" y="30" fill="#f8fafc" font-size="10" font-weight="700">Mean Circulation Formula (b₁ = 1):</text>
      <text x="110" y="48" fill="#818cf8" font-family="monospace" font-size="9.5">c_H = (1 / k) ∑_{e ∈ γ} x(e)</text>
      <text x="110" y="65" fill="#94a3b8" font-size="9">Exact deviation: <tspan fill="#34d399">x_E(e) = x(e) - c_H</tspan> (sum = 0)</text>
      <text x="110" y="78" fill="#94a3b8" font-size="9">Harmonic residual: <tspan fill="#a5b4fc">x_R(e) = c_H</tspan> (retained)</text>
    </g>
  </g>

  <!-- Right Card: Invariance & Xi Tie-Break Gate -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#0c4a6e" fill-opacity="0.4"/>
    <text x="20" y="26" fill="#38bdf8" font-size="11" font-weight="700">INVARIANCE &amp; Ξ TIE-BREAK GATE</text>

    <!-- Diagram of R operation -->
    <rect x="20" y="44" width="396" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="32" y="64" fill="#f8fafc" font-size="10.5" font-weight="700">Theorem DDC-R-02 (Diagnostic Invariance):</text>
    <text x="32" y="82" fill="#38bdf8" font-size="9.5">1. <tspan font-weight="700">Γ₂ Invariance:</tspan> Γ₂(R(x)) = Γ₂(x) — 2-curvature is strictly unaffected by R</text>
    <text x="32" y="98" fill="#38bdf8" font-size="9.5">2. <tspan font-weight="700">Diagnostic Class Preservation:</tspan> R preserves the 3-way partition state</text>
    <text x="32" y="114" fill="#38bdf8" font-size="9.5">3. <tspan font-weight="700">Defect Conservation:</tspan> x = x_E + x_R on all cycle edges</text>

    <!-- Xi Precondition Box -->
    <g transform="translate(20, 140)">
      <rect width="396" height="106" rx="6" fill="#1e1b4b" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="10" y="8" width="160" height="18" rx="3" fill="#312e81"/>
      <text x="16" y="21" fill="#c7d2fe" font-size="9.5" font-weight="700">CONTRACT XI TIE-BREAK GATE</text>

      <text x="14" y="42" fill="#cbd5e1" font-size="9">Secondary metric <tspan font-weight="700" fill="#a5b4fc">Ξ</tspan> is admissible <tspan font-weight="700" fill="#f87171">ONLY</tspan> when primary diagnostics match:</text>
      <rect x="14" y="48" width="368" height="24" rx="4" fill="#030712" stroke="#475569" stroke-width="0.8"/>
      <text x="198" y="64" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Φ₁(cand_A) == Φ₁(cand_B) ∧ Γ₂(cand_A) == Γ₂(cand_B)</text>

      <text x="14" y="88" fill="#94a3b8" font-size="8.5">• If primary diagnostics differ: <tspan fill="#fca5a5" font-weight="600">XI_TIE_PRECONDITION_FAILED</tspan> (Xi cannot override primary defect)</text>
      <text x="14" y="100" fill="#94a3b8" font-size="8.5">• If precondition holds: Candidate with smaller Ξ wins; verified by <tspan fill="#6ee7b7">XiTieBreakCertificate</tspan></text>
    </g>
  </g>

  <!-- Bottom Panel: Dual Witness Receipt & Rust Delegation -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="180" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">RESIDUAL PROJECTION RECEIPT &amp; DUAL WITNESS</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#818cf8">"R"</tspan>, "status": <tspan fill="#818cf8">"RESIDUAL_RETAINED"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"raw_norm": <tspan fill="#f59e0b">3</tspan>, "residual_norm": <tspan fill="#f59e0b">3</tspan>, "exact_norm": <tspan fill="#34d399">0</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"cycle_coordinates": <tspan fill="#cbd5e1">[1, 1, 1]</tspan>, "dual_witness": <tspan fill="#a5b4fc">"cert_phi1_flow"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanization box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#1e1b4b" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="20" fill="#a5b4fc" font-size="10.5" font-weight="700">Formal Verification &amp; Pytest Gates:</text>
      <text x="14" y="38" fill="#c7d2fe" font-family="monospace" font-size="9.5">theorem Ddc.R_preserves_gamma2 : ∀ x, Γ₂(R x) = Γ₂ x</text>
      <text x="14" y="56" fill="#94a3b8" font-size="9">Dual circulation witness: <tspan fill="#f8fafc" font-family="monospace">ddc.cochain.phi1_certificate</tspan></text>
      <text x="14" y="72" fill="#94a3b8" font-size="9">Xi tie-break tests: <tspan fill="#f8fafc" font-family="monospace">test_xi_tie_break_success_and_equality()</tspan></text>
      <text x="14" y="86" fill="#94a3b8" font-size="9">Fail-closed test: <tspan fill="#fca5a5" font-family="monospace">test_xi_tie_break_precondition_rejection()</tspan></text>
    </g>
  </g>
</svg>
