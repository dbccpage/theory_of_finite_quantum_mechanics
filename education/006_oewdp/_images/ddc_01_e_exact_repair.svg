<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow1)"/>
  <rect width="940" height="580" fill="url(#grid1)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="65" y="17" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Level 01: Letter E</text>

    <rect x="140" y="0" width="150" height="26" rx="6" fill="#0f766e" fill-opacity="0.4" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="215" y="17" fill="#5eead4" font-size="11" font-weight="700" text-anchor="middle">Operation: Exact Repair</text>

    <rect x="300" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="380" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Subspace: im(d₀) ⊂ C¹</text>

    <rect x="470" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="555" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Invariants: Φ₁ = 0, Γ₂ = 0</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 01 — Exact Repair (E): Gauge Coboundary Elimination</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Integration of 0-cochain potential φ recovers x = d₀φ; gauge transformation eliminates local tension without altering topology.</text>

  <!-- Left Card: Gauge Potential Integration Tree -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="180" height="20" rx="4" fill="#064e3b" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#34d399" font-size="11" font-weight="700">POTENTIAL INTEGRATION TREE</text>

    <!-- Graph / Tree Visualization -->
    <!-- Gauge Origin v0 -->
    <circle cx="90" cy="110" r="16" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#glowEmerald)"/>
    <text x="90" y="114" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">v₀</text>
    <text x="90" y="142" fill="#6ee7b7" font-size="9" text-anchor="middle">φ(v₀) = 0</text>
    <rect x="60" y="148" width="60" height="15" rx="3" fill="#047857" fill-opacity="0.3"/>
    <text x="90" y="159" fill="#a7f3d0" font-size="8" font-weight="600" text-anchor="middle">Gauge Root</text>

    <!-- Edge v0 -> v1 -->
    <path d="M 106 100 L 194 70" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="145" y="78" fill="#34d399" font-size="9" font-weight="600">e₁: x₁ = +2</text>

    <!-- Vertex v1 -->
    <circle cx="210" cy="65" r="15" fill="#1e293b" stroke="#14b8a6" stroke-width="1.8"/>
    <text x="210" y="69" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">v₁</text>
    <text x="210" y="44" fill="#5eead4" font-size="9" text-anchor="middle">φ(v₁) = 2</text>

    <!-- Edge v0 -> v2 -->
    <path d="M 106 120 L 194 150" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="145" y="148" fill="#34d399" font-size="9" font-weight="600">e₂: x₂ = -1</text>

    <!-- Vertex v2 -->
    <circle cx="210" cy="155" r="15" fill="#1e293b" stroke="#14b8a6" stroke-width="1.8"/>
    <text x="210" y="159" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">v₂</text>
    <text x="210" y="184" fill="#5eead4" font-size="9" text-anchor="middle">φ(v₂) = -1</text>

    <!-- Edge v1 -> v3 -->
    <path d="M 225 65 L 315 100" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="270" y="76" fill="#34d399" font-size="9" font-weight="600">e₃: x₃ = +3</text>

    <!-- Vertex v3 -->
    <circle cx="330" cy="110" r="15" fill="#1e293b" stroke="#14b8a6" stroke-width="1.8"/>
    <text x="330" y="114" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">v₃</text>
    <text x="330" y="139" fill="#5eead4" font-size="9" text-anchor="middle">φ(v₃) = 5</text>

    <!-- Formula Box bottom -->
    <rect x="20" y="200" width="380" height="46" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="30" y="218" fill="#6ee7b7" font-size="10.5" font-weight="700">Integration Law (DDC-E-01):</text>
    <text x="30" y="235" fill="#e2e8f0" font-size="10">φ(v) = φ(u) + x(u → v) along spanning tree edges T ⊂ K</text>
  </g>

  <!-- Right Card: Transition Gate & Verification Fence -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="190" height="20" rx="4" fill="#047857" fill-opacity="0.3"/>
    <text x="20" y="26" fill="#10b981" font-size="11" font-weight="700">TRANSITION FENCE &amp; LAW 7</text>

    <!-- Pre-condition -> Operation -> Post-condition -->
    <rect x="20" y="48" width="115" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="77" y="66" fill="#94a3b8" font-size="9" text-anchor="middle">PRE-STATE</text>
    <text x="77" y="82" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">ExactRepair</text>
    <text x="77" y="98" fill="#64748b" font-size="9" text-anchor="middle">Φ₁ = 0, Γ₂ = 0</text>

    <path d="M 140 78 L 175 78" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

    <rect x="180" y="44" width="76" height="68" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.8" filter="url(#glowEmerald)"/>
    <text x="218" y="74" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">E</text>
    <text x="218" y="94" fill="#a7f3d0" font-size="8" font-weight="600" text-anchor="middle">x ↦ x - d₀φ</text>

    <path d="M 261 78 L 296 78" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

    <rect x="301" y="48" width="115" height="60" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="358" y="66" fill="#34d399" font-size="9" text-anchor="middle">POST-STATE</text>
    <text x="358" y="82" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Discharged</text>
    <text x="358" y="98" fill="#a7f3d0" font-size="9" text-anchor="middle">x' = 0 (Vanished)</text>

    <!-- Fencing checks -->
    <g transform="translate(20, 126)">
      <rect width="396" height="118" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#f8fafc" font-size="10.5" font-weight="700">Canonical Invariants Enforced:</text>
      
      <circle cx="20" cy="38" r="4" fill="#10b981"/>
      <text x="32" y="42" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#34d399">Zero Curl Check:</tspan> d₁x = 0; if d₁x ≠ 0 → REFUSED_NON_ZERO_CURL</text>

      <circle cx="20" cy="62" r="4" fill="#10b981"/>
      <text x="32" y="66" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#34d399">Carrier Invariance:</tspan> K' = K (Carrier 2-complex never modified by E)</text>

      <circle cx="20" cy="86" r="4" fill="#10b981"/>
      <text x="32" y="90" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#34d399">No Class-Crossing:</tspan> Refuses non-exact defects; never jumps diagnostic classes</text>

      <circle cx="20" cy="110" r="4" fill="#10b981"/>
      <text x="32" y="114" fill="#cbd5e1" font-size="9.5"><tspan font-weight="700" fill="#34d399">Idempotence:</tspan> E(E(x)) = E(x) = 0 with zero residual mass</text>
    </g>
  </g>

  <!-- Bottom Panel: ExactRepairReceipt Wire Format -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="160" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">EXACT REPAIR RECEIPT &amp; PROOF WITNESS</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#34d399">"E"</tspan>, "status": <tspan fill="#34d399">"EXACT_REPAIR_DISCHARGED"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"defect_norm": <tspan fill="#f59e0b">0</tspan>, "potential_witness": <tspan fill="#cbd5e1">{"v0": 0, "v1": 2, "v2": -1, "v3": 5}</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"step_sha256": <tspan fill="#a5b4fc">"0x4a8f...b7e1"</tspan>, "authority_effect": <tspan fill="#f87171">"None"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanized Theorem Box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#064e3b" fill-opacity="0.2" stroke="#059669" stroke-width="1"/>
      <text x="14" y="20" fill="#34d399" font-size="10.5" font-weight="700">Lean 4 Mechanization:</text>
      <text x="14" y="38" fill="#6ee7b7" font-family="monospace" font-size="9.5">theorem Ddc.E_discharges_exact :</text>
      <text x="26" y="54" fill="#e2e8f0" font-family="monospace" font-size="9">∀ (x : C¹), is_exact x → (x - d₀ (solve_potential x)) = 0</text>
      <text x="14" y="74" fill="#94a3b8" font-size="9">Verified by Python test suite: <tspan fill="#f8fafc" font-family="monospace">code/tests/test_exact_repair.py</tspan></text>
      <text x="14" y="88" fill="#94a3b8" font-size="9">Refusal gate test: <tspan fill="#f8fafc" font-family="monospace">test_curl_defect_refused_as_non_exact()</tspan></text>
    </g>
  </g>
</svg>
