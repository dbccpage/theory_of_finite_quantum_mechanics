<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 08: Finite Descent Authority (FDA) &amp; GTLA Architecture</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Standing(E,G) := E ∧ G — Evidence alone does not imply standing</text>
  <rect x="40" y="100" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="125" y="137" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">Proposal</text>
  <text x="125" y="154" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Source & content</text>
  <rect x="230" y="100" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="315" y="137" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Packet</text>
  <text x="315" y="154" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Frozen envelope</text>
  <rect x="420" y="100" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="505" y="137" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">Verifier</text>
  <text x="505" y="154" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Deterministic check</text>
  <rect x="610" y="100" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="695" y="137" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">Decision</text>
  <text x="695" y="154" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Scoped grade</text>
  <line x1="210" y1="132" x2="230" y2="132" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="132" x2="420" y2="132" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="132" x2="610" y2="132" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="180" y="200" width="440" height="50" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="400" y="230" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f85149">CODA-11: E=True, G=False → Evidence but no standing</text>
  <rect x="40" y="290" width="720" height="50" rx="8" fill="url(#boxGrad)" stroke="#484f58" stroke-width="1.5"/>
  <text x="400" y="320" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#484f58">FDA Guards: g₁ accepted, g₂ deterministic, g₃ zero_residual, g₄ skeleton, g₅ exhaustive, g₆ no_lift, g₇ no_refusal</text>
  <rect x="180" y="370" width="440" height="55" rx="8" fill="url(#boxGrad)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="402" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#58a6ff">GTLA: Grants and Evidence Separate</text>
  <text x="400" y="419" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Evidence + separate Grant → Standing</text>
  <text x="400" y="458" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Verifier soundness and grantor standing remain assumptions</text>
  <text x="400" y="478" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
