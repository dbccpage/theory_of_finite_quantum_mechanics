<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E14: Dependent Witnesses Under Finite Quantifiers</title>
<desc id="desc">Relation: X={a,b}, Y={0,1}, R={(a,0),(b,1)}. Dependent choice: For every x there exists y: choose f(a)=0, f(b)=1. No constant choice: There is no single y related to both a and b.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E14: Dependent Witnesses Under Finite Quantifiers</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Relation</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">X={a,b}, Y={0,1},</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">R={(a,0),(b,1)}.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Dependent choice</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">For every x there exists y:</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">choose f(a)=0, f(b)=1.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">No constant choice</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">There is no single y related to</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">both a and b.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
