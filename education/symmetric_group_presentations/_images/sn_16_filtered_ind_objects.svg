<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E16: Composition of Exact Partial Descent</title>
<desc id="desc">First extension: u:A → B with exact partial inverse r̂. Second extension: v:B → C with exact partial inverse ŝ. Composition: Recover through ŝ then r̂; propagate either refusal.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E16: Composition of Exact Partial Descent</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">First extension</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">u:A → B with exact partial</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">inverse r̂.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Second extension</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">v:B → C with exact partial</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">inverse ŝ.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Composition</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Recover through ŝ then r̂;</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">propagate either refusal.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
