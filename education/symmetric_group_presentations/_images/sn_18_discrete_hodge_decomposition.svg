<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E18: One Obstruction, Two Optimization Measures</title>
<desc id="desc">Fixed class: Triangle x=(1,0,0); every residual has circulation one. ℓ¹: Minimum norm one; many minimizing residuals. ℓ²: Unique residual (1/3,1/3,1/3); squared norm 1/3.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E18: One Obstruction, Two Optimization Measures</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Fixed class</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Triangle x=(1,0,0); every</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">residual has circulation one.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">ℓ¹</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Minimum norm one; many</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">minimizing residuals.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">ℓ²</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Unique residual (1/3,1/3,1/3);</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">squared norm 1/3.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
