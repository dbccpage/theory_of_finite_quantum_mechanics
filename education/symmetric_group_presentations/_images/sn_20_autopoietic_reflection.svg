<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E20: Sharp Observer Completion</title>
<desc id="desc">Hidden quotient class: B=ker(I); Q_bad(x)=x₁ hides z=(0,1,0). Completion: Q_complete(x)=(x₁,I(x)). Sharp cost: One extra invariant coordinate detects the hidden quotient dimension.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E20: Sharp Observer Completion</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Hidden quotient class</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">B=ker(I); Q_bad(x)=x₁ hides</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">z=(0,1,0).</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Completion</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Q_complete(x)=(x₁,I(x)).</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Sharp cost</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">One extra invariant coordinate</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">detects the hidden quotient</text>
<text x="746" y="182" font-family="sans-serif" font-size="16" fill="#243b53">dimension.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
