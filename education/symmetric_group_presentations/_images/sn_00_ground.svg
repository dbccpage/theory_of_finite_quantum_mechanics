<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(0): the literal inscription and empty admitted state</title>
<desc id="desc">Inscription: &lt;&gt; is one opaque token; two ASCII bytes. Admitted regime: No admitted data, forms, instances, rules or requirements. Recorded event: Supply leaves the regime unchanged; history retains the event.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(0): the literal inscription and empty admitted state</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Inscription</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">&lt;&gt; is one opaque token; two</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">ASCII bytes.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Admitted regime</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">No admitted data, forms,</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">instances, rules or</text>
<text x="396" y="182" font-family="sans-serif" font-size="16" fill="#243b53">requirements.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Recorded event</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Supply leaves the regime</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">unchanged; history retains the</text>
<text x="746" y="182" font-family="sans-serif" font-size="16" fill="#243b53">event.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
