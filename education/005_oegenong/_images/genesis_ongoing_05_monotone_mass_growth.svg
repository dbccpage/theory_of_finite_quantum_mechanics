<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 05: Mass</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Multiplicity Commitment</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorem: Reach4.mult_le</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 5: Multiplicity &amp; Monotone Mass Growth</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Admitting Term Multiplicity Induces a Strictly Non-Decreasing Mass Invariant Across Transitions</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Monotone Mass Invariant Theorem</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Reach4 s_init s_final</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">mass(s_init) &#8804; mass(s_final)   [mult_le]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Derivation 4 Commitment:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Appended sentence admitting multiplicity of terms</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">in relation pairs, modifying the base transition step.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Non-Decreasing Carrier Mass:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Proved in Lean 4: transitions can create fresh copies</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">or preserve them, but total multiplicity never decreases.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Discrete Direction of Time:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Mass monotonicity defines an irreversible arrow</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">of derivation progress without continuous thermodynamics.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Monotone Multiplicity Evolution</text>

    <g transform="translate(30, 45)">
      <!-- Step 0: Initial Mass = 2 -->
      <rect x="15" y="10" width="100" height="70" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="65" y="32" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">s_0</text>
      <text x="65" y="50" fill="#38bdf8" font-size="10" text-anchor="middle">Mass = 2</text>
      <text x="65" y="65" fill="#94a3b8" font-size="9" text-anchor="middle">{a, b}</text>

      <!-- Arrow 1 -->
      <line x1="115" y1="45" x2="145" y2="45" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

      <!-- Step 1: Mass = 3 -->
      <rect x="150" y="10" width="100" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="200" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">s_1</text>
      <text x="200" y="50" fill="#34d399" font-size="10" text-anchor="middle">Mass = 3</text>
      <text x="200" y="65" fill="#94a3b8" font-size="9" text-anchor="middle">{a, b, b'}</text>

      <!-- Arrow 2 -->
      <line x1="250" y1="45" x2="280" y2="45" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

      <!-- Step 2: Mass = 5 -->
      <rect x="285" y="10" width="100" height="70" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="335" y="32" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">s_k</text>
      <text x="335" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Mass = 5</text>
      <text x="335" y="65" fill="#a7f3d0" font-size="9" text-anchor="middle">{a, a', b, b', c}</text>

      <!-- Monotonic Ladder Graph -->
      <path d="M 30 180 L 100 160 L 180 130 L 260 110 L 350 90" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <circle cx="30" cy="180" r="5" fill="#34d399"/>
      <circle cx="100" cy="160" r="5" fill="#34d399"/>
      <circle cx="180" cy="130" r="5" fill="#34d399"/>
      <circle cx="260" cy="110" r="5" fill="#34d399"/>
      <circle cx="350" cy="90" r="5" fill="#34d399"/>

      <line x1="20" y1="190" x2="370" y2="190" stroke="#475569" stroke-width="1"/>
      <text x="200" y="210" fill="#94a3b8" font-size="9.5" text-anchor="middle">Transition Steps &#8594;</text>

      <!-- Bottom Card -->
      <rect x="15" y="230" width="370" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="200" y="248" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">Invariant Preserved Across All Derivation 4 Transitions</text>
      <text x="200" y="263" fill="#34d399" font-size="9.5" text-anchor="middle">&#8704; s s', Step(s, s') &#8658; mass(s) &#8804; mass(s')</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">INVARIANT_LEAN_PROVED</tspan> | Campaign: <tspan fill="#e2e8f0">Derivation 4</tspan> | Theorems: <tspan fill="#38bdf8">149 Proved</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-041 Analog</tspan></text>
  </g>

</svg>
