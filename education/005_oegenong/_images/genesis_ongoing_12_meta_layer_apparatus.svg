<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 12: Meta</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Meta-Layer Apparatus</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">OEWAS Gate Detectors</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 12: Meta-Layer Apparatus &amp; Diagnostic Taxonomy</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Biological Metaphor Demarcation, 14-Tuple Status Taxonomy, and Three OEWAS Gate Detectors</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Meta-Layer Classification Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Record &#8712; MetaLayer &#8743; Scope(Meta) = Diagnostic</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">AuthorityEffect(Meta) = None   [ApparatusOnly]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Retrospective Metaphor (Immune System):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Written in biological metaphor; possesses zero</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">runtime enforcement mechanism or execution authority.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Three OEWAS Gate Detectors:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">1. Vacuous-comparison detector,</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">2. Definitional-citation detector, 3. Mutation-bite detector.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; 29 Cross-Derivation Maps:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Systematic correspondence mapping between Lean states</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">and gate defect records across all 21 blind derivations.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Diagnostic Apparatus &amp; Three OEWAS Gates</text>

    <g transform="translate(30, 45)">
      <!-- Gate 1: Vacuous-Comparison -->
      <rect x="15" y="10" width="370" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="35" y="32" fill="#a5b4fc" font-size="11" font-weight="700">1. Vacuous-Comparison Detector</text>
      <text x="35" y="50" fill="#94a3b8" font-size="9.5">Flags comparisons that evaluate to true on empty sets</text>

      <!-- Gate 2: Definitional-Citation -->
      <rect x="15" y="80" width="370" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="35" y="102" fill="#38bdf8" font-size="11" font-weight="700">2. Definitional-Citation Detector</text>
      <text x="35" y="120" fill="#94a3b8" font-size="9.5">Catches trivial 'rfl' proofs cited as emergent theorems</text>

      <!-- Gate 3: Mutation-Bite -->
      <rect x="15" y="150" width="370" height="60" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="35" y="172" fill="#34d399" font-size="11" font-weight="700">3. Mutation-Bite Detector</text>
      <text x="35" y="190" fill="#a7f3d0" font-size="9.5">Verifies that rule modifications alter reachable state space</text>

      <!-- Bottom Card -->
      <rect x="15" y="225" width="370" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="200" y="245" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Immune System Metaphor: Purely Diagnostic</text>
      <text x="200" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">Authority resides strictly in host Lean verification</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">DIAGNOSTIC_APPARATUS</tspan> | Folder: <tspan fill="#e2e8f0">H3V7N5QF meta/</tspan> | Detectors: <tspan fill="#38bdf8">3 OEWAS Active</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-012 Analog</tspan></text>
  </g>

</svg>
