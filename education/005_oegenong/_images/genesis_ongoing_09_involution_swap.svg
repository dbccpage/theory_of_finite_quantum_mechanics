<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 09: Swap</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Involution Symmetry</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorem: swap9_swap</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 9: Involution &amp; Graph Isomorphism Swap</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Fixed-Point-Free Involution on Carrier Objects and Paths: swap &#8728; swap = id (MSS-009 Analog)</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Involution Symmetry Theorem</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">&#963; : G &#8594; G &#8743; &#963; &#8800; id</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">&#963;(&#963;(x)) = x   [swap9_swap]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Derivation 9 Involution (swap9_swap):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Proved in Lean 4: swapping the symmetric relation</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">or term indices is an exact order-2 automorphism.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Path Involution Invariance:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Applying swap across an entire transition trajectory</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">preserves path cost and reachability without distortion.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-009 Dagger Shadow:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Represents the graph-isomorphism shadow of adjoint</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">dagger functoriality without continuous unitary groups.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Order-2 Exchange Topology</text>

    <g transform="translate(40, 50)">
      <!-- Left State: (a, b) -->
      <rect x="15" y="40" width="130" height="90" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="80" y="65" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">State G</text>
      <text x="80" y="85" fill="#38bdf8" font-size="11" text-anchor="middle">r(a, b)</text>
      <text x="80" y="105" fill="#94a3b8" font-size="9" text-anchor="middle">Canonical Labeling</text>

      <!-- Right State: (b, a) -->
      <rect x="235" y="40" width="130" height="90" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
      <text x="300" y="65" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">State &#963;(G)</text>
      <text x="300" y="85" fill="#c084fc" font-size="11" text-anchor="middle">r(b, a)</text>
      <text x="300" y="105" fill="#94a3b8" font-size="9" text-anchor="middle">Swapped Labeling</text>

      <!-- Forward Swap Arc -->
      <path d="M 145 65 Q 190 35 230 65" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <text x="190" y="45" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">swap</text>

      <!-- Reverse Swap Arc -->
      <path d="M 230 100 Q 190 130 150 100" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <text x="190" y="125" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">swap</text>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="175" width="350" height="70" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="190" y="198" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Exact &#8484;_2 Action on Derivation Lattice</text>
      <text x="190" y="216" fill="#a7f3d0" font-size="9.5" text-anchor="middle">swap &#8728; swap = id &#183; Path Length Isomorphism</text>
      <text x="190" y="232" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Preserves Reachability Closure and Discrete Cost</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">INVOLUTION_PROVED_LEAN</tspan> | Theorem: <tspan fill="#e2e8f0">swap9_swap</tspan> | Symmetry: <tspan fill="#38bdf8">&#8484;_2 Automorphism</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-009 Analog</tspan></text>
  </g>

</svg>
