<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 06: Embed</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Stage Embeddings</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorem: Step2.toStep3</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 6: Inter-Derivation Stage Embeddings</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Conservative Stage Transitions, Projection Failures, and Inter-Seed Morphisms</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Stage Embedding Theorem</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">s &#8594;_{Step_i} s' &#8743; Embed_{i, j}(s, s')</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Embed(s) &#8594;_{Step_j} Embed(s')   [toStep]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Conservative Inter-Seed Transitions:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Theorems <tspan fill="#38bdf8" font-family="monospace">Step2.toStep3</tspan>, <tspan fill="#38bdf8" font-family="monospace">Step3.toStep4</tspan> prove that</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">prior transitions embed faithfully into richer seeds.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Projection Failures as Witnesses:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Recoverability failure (<tspan fill="#f43f5e" font-family="monospace">proj_ofR9_false</tspan>) proves</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">that higher structures cannot collapse backwards.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-006 Structural Analog:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Provides the stage ladder and retraction verification</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">demanded by the Minimal Symbol System tower.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Inter-Derivation Embedding Chain</text>

    <g transform="translate(35, 45)">
      <!-- Derivation 2 Box -->
      <rect x="15" y="10" width="160" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="95" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Derivation 2</text>
      <text x="95" y="50" fill="#94a3b8" font-size="9.5" text-anchor="middle">Step2 Transitions</text>

      <!-- Arrow D2 to D3 -->
      <line x1="175" y1="40" x2="225" y2="40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <text x="200" y="32" fill="#38bdf8" font-size="9.5" text-anchor="middle">toStep3</text>

      <!-- Derivation 3 Box -->
      <rect x="230" y="10" width="155" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="307" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Derivation 3</text>
      <text x="307" y="50" fill="#93c5fd" font-size="9.5" text-anchor="middle">Step3 Transitions</text>

      <!-- Arrow down to D4 -->
      <path d="M 307 70 L 307 110 L 95 110 L 95 135" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
      <text x="200" y="102" fill="#34d399" font-size="9.5" text-anchor="middle">toStep4 (Mass Admitted)</text>

      <!-- Derivation 4 Box -->
      <rect x="15" y="140" width="160" height="60" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="95" y="162" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Derivation 4</text>
      <text x="95" y="180" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Multiplicity Step</text>

      <!-- Arrow D4 to D9 -->
      <line x1="175" y1="170" x2="225" y2="170" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <text x="200" y="162" fill="#fbbf24" font-size="9.5" text-anchor="middle">Universal</text>

      <!-- Derivation 9 Box -->
      <rect x="230" y="140" width="155" height="60" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="307" y="162" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Derivation 9</text>
      <text x="307" y="180" fill="#fde68a" font-size="9.5" text-anchor="middle">Reachability Fixpoint</text>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="235" width="370" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="200" y="253" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">Stage Transition Contract: Preserved Embeddings</text>
      <text x="200" y="268" fill="#94a3b8" font-size="9" text-anchor="middle">Conservative Step Commutation Across The 21 Lattices</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">STAGE_EMBEDDING_PROVED</tspan> | System: <tspan fill="#e2e8f0">H3V7N5QF Derivations 2&#8211;4</tspan> | Contract: <tspan fill="#38bdf8">Conservative Lift</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-006 Analog</tspan></text>
  </g>

</svg>
