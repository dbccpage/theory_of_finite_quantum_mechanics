<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 02: MSS-002</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Irreflexive Loop Ban</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Solid Native Anchor</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 2: Strict Loop Ban &amp; Native MSS-002 Anchor</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Irreflexivity Constraint &#8704;x, &#172;(xrx) and the Exact Classification of Identification Obstructions</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Identification Obstruction Theorem</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Obstructed (identify x y) s</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">&#8660; (s.rel x y &#8744; s.rel y x)   [obstructed_iff]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Native Anchor at MSS-002:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">H3V7N5QF natively and blind proves the exact</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">specification and negative counterexample of MSS-002.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Four Atomic Operations:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">1. Identify (a ~ b), 2. Remove relation,</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">3. Add fresh term, 4. Add new relation assertion.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Obstruction Must Be Answered:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Any operation creating a self-loop is obstructed:</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">it must be refused, cleared, or worked around.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Identification Collapse vs Irreflexivity Ban</text>

    <g transform="translate(30, 45)">
      <!-- Unidentified State -->
      <rect x="15" y="10" width="165" height="110" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="97" y="30" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Legal Distinct State</text>
      <circle cx="50" cy="70" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="50" y="74" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">x</text>
      <line x1="68" y1="70" x2="128" y2="70" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <circle cx="145" cy="70" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="145" y="74" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">y</text>
      <text x="97" y="105" fill="#a7f3d0" font-size="9.5" text-anchor="middle">s.rel(x, y) Holds (x &#8800; y)</text>

      <!-- Identification Arrow -->
      <line x1="185" y1="65" x2="215" y2="65" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>
      <text x="200" y="55" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">x ~ y</text>

      <!-- Collapsed Obstructed State -->
      <rect x="220" y="10" width="165" height="110" rx="6" fill="#4c0519" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="302" y="30" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">Banned Self-Loop!</text>
      <circle cx="302" cy="75" r="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
      <text x="302" y="79" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">[x=y]</text>
      <!-- Self-loop curve -->
      <path d="M 292 60 C 275 30, 330 30, 312 60" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>
      <text x="302" y="105" fill="#fca5a5" font-size="9.5" text-anchor="middle">xrx Violated &#8594; OBSTRUCTED</text>

      <!-- Bottom Resolution Menu -->
      <rect x="15" y="135" width="370" height="135" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="30" y="157" fill="#fbbf24" font-size="11" font-weight="700">Three Allowed Answers to Obstruction:</text>
      <text x="30" y="180" fill="#f8fafc" font-size="10">&#8226; <tspan fill="#f43f5e" font-weight="700">Refuse:</tspan> Reject the identify operation; state remains unchanged.</text>
      <text x="30" y="202" fill="#f8fafc" font-size="10">&#8226; <tspan fill="#38bdf8" font-weight="700">Clear:</tspan> Remove relation assertion prior to identification.</text>
      <text x="30" y="224" fill="#f8fafc" font-size="10">&#8226; <tspan fill="#34d399" font-weight="700">Workaround:</tspan> Adjoin fresh intermediary node (c) to route path.</text>
      <text x="30" y="250" fill="#94a3b8" font-size="9.5">Derivation 1 Lean: Full classification and constructive reachability proved.</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">MSS_002_SOLID_ANCHOR</tspan> | Proofs: <tspan fill="#e2e8f0">Lean 4 Blind Derivation 1</tspan> | Ban: <tspan fill="#f43f5e">Irreflexive</tspan> | MSS Anchor: <tspan fill="#34d399">MSS-002 Native Exact</tspan></text>
  </g>

</svg>
