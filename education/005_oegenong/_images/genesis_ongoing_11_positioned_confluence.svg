<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 11: Rewrites</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Positioned Rewriting</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Toy Confluence Peaks</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 11: Positioned Identification &amp; Peak Confluence</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Position-Keyed Term Identification and Local Critical Peak Joinability in Toy Graph Rewrites</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Position-Keyed Confluence</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">G &#8594;_{pos_1} G_1 &#8743; G &#8594;_{pos_2} G_2</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">&#8707; G*, (G_1 &#8594;* G* &#8743; G_2 &#8594;* G*)   [ToyPeakJoin]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Derivation 19 Positioned Identification:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Specifying explicit positions for term identifications</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">resolves syntactic ambiguity during graph reduction.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Joined Peaks (Derivations 3 &amp; 17):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Proved critical peak joinability in toy graph cases;</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">fenced: does not claim universal term rewriting confluence.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-011 Structural Analog:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Captures the local confluence property required</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">to avoid divergent non-deterministic branches.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Toy Graph Confluence Diamond</text>

    <g transform="translate(40, 50)">
      <!-- Apex Node -->
      <circle cx="180" cy="30" r="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="180" y="34" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">G</text>
      <text x="180" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">Initial Graph</text>

      <!-- Left Branch -->
      <circle cx="80" cy="120" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="124" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">G_1</text>
      <text x="60" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">ident(a~c)</text>

      <!-- Right Branch -->
      <circle cx="280" cy="120" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="280" y="124" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">G_2</text>
      <text x="300" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">ident(b~d)</text>

      <!-- Arrows -->
      <line x1="165" y1="42" x2="98" y2="105" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="195" y1="42" x2="262" y2="105" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

      <!-- Joined Peak -->
      <circle cx="180" cy="210" r="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="180" y="215" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">G*</text>
      <text x="180" y="245" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Joined Isomorphic Graph</text>

      <line x1="98" y1="135" x2="162" y2="195" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
      <line x1="262" y1="135" x2="198" y2="195" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">TOY_CONFLUENCE_PROVED</tspan> | Derivations: <tspan fill="#e2e8f0">D3, D17, D19</tspan> | Peaks: <tspan fill="#38bdf8">Locally Joinable</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-011 Analog</tspan></text>
  </g>

</svg>
