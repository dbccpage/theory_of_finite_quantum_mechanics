<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-10</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Descent</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 11</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Redundancy</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 10: Intersubjective Presentation &amp; Descent</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Many Observers, One Carrier: Descent Receipts, Redundancy &amp; Witness Rank</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">wrank(S) = dim span{ν(x,y,c)} over critical w</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Rows: CH11-D01 · CH11-D02 · CH11-P01 · CH11-O01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Local Satisfiability ≠ Global (§11.2)</text>
    
    <g transform="translate(20, 45)">
      <!-- Three contexts of the parity three-cycle -->
      <circle cx="140" cy="110" r="55" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="90" fill="#38bdf8" font-size="12" font-weight="700">U₁₂</text>

      <circle cx="240" cy="110" r="55" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
      <text x="270" y="90" fill="#10b981" font-size="12" font-weight="700">U₂₃</text>

      <circle cx="190" cy="190" r="55" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="2"/>
      <text x="190" y="225" fill="#a855f7" font-size="12" font-weight="700" text-anchor="middle">U₃₁</text>

      <!-- Center: summed parity contradiction -->
      <circle cx="190" cy="135" r="14" fill="#fbbf24" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="190" y="139" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">0≠1</text>

      <rect x="10" y="255" width="375" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="278" fill="#34d399" font-size="11" font-weight="700">• Three-cycle parity check:</text>
      <text x="35" y="298" fill="#cbd5e1" font-size="10.5">Constraints x₁⊕x₂ = 0, x₂⊕x₃ = 0, x₃⊕x₁ = 1 on U₁₂, U₂₃, U₃₁.</text>
      <text x="35" y="316" fill="#cbd5e1" font-size="10.5">Each constraint, and each pair of them, is satisfiable.</text>
      <text x="35" y="334" fill="#fbbf24" font-size="10.5">All three fail: left sides sum to 0 mod 2, right sides to 1.</text>
      <text x="35" y="352" fill="#f43f5e" font-size="10.5">Only the shape of an obstruction: no empirical model given.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Context Witnesses, Witness Rank &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Context Witness (CH11-D02)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">p(x) = p(y), p(ρ(c)x) ≠ p(ρ(c)y); ν ∈ Q¹</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">wrank is invariant under invertible coordinate change (CH11-P01).</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding: context_witness.py (exact ℚ)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• critical_context_witnesses: every (x, y, c) with ν ≠ 0.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• witness_rank: exact rank; fixture ν = (1,−1), (1,0) gives 2.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Rank rechecked under all invertible 2×2 changes in {−1,0,1,2}.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusals (apply_coordinate_change)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Singular coordinate change → RefusalCode.NOT_INVERTIBLE</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Non-bijective relabeling → INVALID_INPUT</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">Fence: Agreement Is Not Authority (§11.4)</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Even unanimous observer reports do not create authority.</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">Agreement can be a premise in a declared external decision</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">rule; the rule and its jurisdiction must be declared.</text>
    </g>
  </g>
</svg>