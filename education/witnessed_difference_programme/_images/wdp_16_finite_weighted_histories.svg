<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-16</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">History</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 17</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Semiring Sum</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 16: Finite Weighted Histories &amp; Semiring Sums</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Finite Path Carriers: Z_ab^(n) = ⊕ w(p) = (M^n)_ab &amp; Cancellation vs Interference</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Z_ab^(n) = ⊕_{p∈Ω} ⊗_{e∈p} w(e) = (M^n)_ab</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH17-P01 · P02 · O01 · N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">One Graph, Several Semirings (§17.3, §17.6)</text>
    
    <g transform="translate(20, 45)">
      <!-- Start Event a -->
      <circle cx="50" cy="115" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="120" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">a</text>

      <!-- Intermediate Paths -->
      <circle cx="150" cy="55" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
      <text x="150" y="59" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">u1</text>

      <circle cx="150" cy="115" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
      <text x="150" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">u2</text>

      <circle cx="150" cy="175" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
      <text x="150" y="179" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">u3</text>

      <!-- Target Event b -->
      <circle cx="260" cy="115" r="18" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="260" y="120" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">b</text>

      <!-- Connecting path arrows -->
      <line x1="68" y1="105" x2="136" y2="65" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrC)"/>
      <line x1="68" y1="115" x2="136" y2="115" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrC)"/>
      <line x1="68" y1="125" x2="136" y2="165" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrC)"/>

      <line x1="164" y1="65" x2="242" y2="105" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrG)"/>
      <line x1="164" y1="115" x2="242" y2="115" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrG)"/>
      <line x1="164" y1="165" x2="242" y2="125" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrG)"/>

      <!-- Amplitude Indicator -->
      <rect x="290" y="90" width="95" height="50" rx="5" fill="#030712" stroke="#fbbf24"/>
      <text x="337" y="110" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Z_ab^(2)</text>
      <text x="337" y="128" fill="#cbd5e1" font-size="9" text-anchor="middle">= (M²)_ab</text>

      <rect x="10" y="225" width="375" height="140" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="248" fill="#34d399" font-size="11" font-weight="700">• Finite path aggregate (WDP-CH17-P01):</text>
      <text x="35" y="268" fill="#cbd5e1" font-size="10.5">w(p) = w(e₁)⊗…⊗w(eₙ); Z_ab^(n) = ⊕_{p∈Ω_ab^(n)} w(p) = (Mⁿ)_ab.</text>
      <text x="35" y="286" fill="#cbd5e1" font-size="10.5">Boolean reach · ℕ count · min-plus cost · ℂ cancellation.</text>
      <text x="35" y="304" fill="#fbbf24" font-size="10.5">Zerosumfree: a ⊕ b = 0 ⇒ a = b = 0, so no cancellation (P02).</text>
      <text x="35" y="322" fill="#f43f5e" font-size="10.5">ℂ: 1+(−1) = 0 is cancellation, not operational interference.</text>
      <text x="35" y="342" fill="#38bdf8" font-size="10.5">Star sums: nilpotent, complete/*-continuous, or convergent.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Results, Executable Checks &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Worked example §17.6: two paths</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">ℕ: 2·3+5 = 11 | min-plus: min(2+3,5) = 5 | ℂ: 1−1 = 0</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Same graph; the aggregate’s meaning changes with the semiring.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (histories.py, exact ℚ weights only)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• enumerate_paths: every path with at most max_steps edges.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• finite_history_sum: exact Fraction sum over those paths.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• cancellation_report: aggregate zero ≠ pointwise zero.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Refusal: RefusalCode.BUDGET_REQUIRED (CH17-N01)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• No step budget: a cyclic graph has infinitely many paths.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• No unbounded star is evaluated.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH17-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">A finite semiring path sum is not a continuum path</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">integral, a measure over all trajectories, or the Feynman</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">amplitude rule. Open: CH17-O01.</text>
    </g>
  </g>
</svg>