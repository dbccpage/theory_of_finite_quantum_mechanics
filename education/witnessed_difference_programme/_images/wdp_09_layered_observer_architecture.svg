<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-09</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Observer</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 10</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Four Layers</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 9: A Layered Observer Architecture</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Presentation, Memory, Evaluator &amp; Policy as Separate Typed Layers with Adapters</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">O = (Pres, Mem, Eval, Policy) + adapters</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH10-D01–D04 · D06 · P01–P03 · O01 (D05 in Ch.15)</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Four Layers, Explicit Adapters (§10.1–§10.3)</text>
    
    <g transform="translate(20, 45)">
      <!-- Four layers, adapters, authority outside -->
      <rect x="20" y="5" width="355" height="34" rx="4" fill="#030712" stroke="#475569" stroke-width="1.2"/>
      <text x="35" y="26" fill="#94a3b8" font-size="10" font-weight="700">Authority: carried separately, not a layer</text>

      <rect x="20" y="44" width="355" height="34" rx="4" fill="#030712" stroke="#818cf8" stroke-width="1.2"/>
      <text x="35" y="65" fill="#a5b4fc" font-size="10" font-weight="700">Explicit adapters: adapt_L : L ⇀ O (partial)</text>

      <rect x="20" y="83" width="355" height="34" rx="4" fill="#030712" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="35" y="104" fill="#fbbf24" font-size="10" font-weight="700">Policy_O: store, report, refuse, act</text>

      <rect x="20" y="122" width="355" height="34" rx="4" fill="#030712" stroke="#a855f7" stroke-width="1.2"/>
      <text x="35" y="143" fill="#c084fc" font-size="10" font-weight="700">Eval_O = (D, A, d, J, Γ, T) evaluator</text>

      <rect x="20" y="161" width="355" height="34" rx="4" fill="#030712" stroke="#10b981" stroke-width="1.2"/>
      <text x="35" y="182" fill="#34d399" font-size="10" font-weight="700">Mem_O = (M, u, r, ≈) retention packet</text>

      <rect x="20" y="200" width="355" height="34" rx="4" fill="#030712" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="35" y="221" fill="#38bdf8" font-size="10" font-weight="700">Pres_O = (X, P, q : X → P, C) presentation map</text>

      <rect x="20" y="239" width="355" height="34" rx="4" fill="#030712" stroke="#64748b" stroke-width="1.2"/>
      <text x="35" y="260" fill="#cbd5e1" font-size="10" font-weight="700">Input carrier X_O read by q (not a layer)</text>

      <rect x="10" y="285" width="375" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="307" fill="#34d399" font-size="11" font-weight="700">• Passivity (CH10-P01):</text>
      <text x="35" y="327" fill="#cbd5e1" font-size="10">Φ_O(O(q)) ≤ Φ₁(q) for every class q in Q¹ (§10.5)</text>
      <text x="35" y="345" fill="#fbbf24" font-size="10">An exact class is never reported as obstructed.</text>
      <text x="35" y="360" fill="#38bdf8" font-size="9.5">States identified by the core profile stay identified.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Quotient Observer, Bounds &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Quotient Observer (CH10-D06)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">R : C¹ → F^k, R∘d₀ = 0; Φ_O(y) = inf{J(h) : Rh = y}</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">It enters only as a presentation map and evaluator cost.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (quotient_observer.py, exact LP)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• check_passivity: Φ_O ≤ Φ₁ on every cochain in {-1,0,1}⁵.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• observer_family_order: kernel preorder, equal-kernel classes.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• grammar_resolution: ≤ |G| visible classes; pigeonhole collision.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusals (quotient_observer_layers)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Request memory or policy → RefusalCode.MISSING_ADAPTER</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Request authority → SCOPE_VIOLATION</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">Policy Is Not Authority (CH10-D04)</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Policy handles evaluator outputs; it is not authority.</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">An authorization field maps into no observer layer and</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">must be carried separately (§10.3; Ch. 15).</text>
    </g>
  </g>
</svg>