<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-21</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Synthesis</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 22</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Closing Map</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 21: What the Finite Calculus Establishes</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Trunk, Observer/Measurement Waist, Branches &amp; the Four-Tier Ambition Hierarchy</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">witness → observer → observation → measurement</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">WDP-CH22-C01 · synthesis conclusion</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Curriculum Map: Parts I–V (Levels 0–21)</text>
    
    <g transform="translate(15, 45)">
      <!-- The five Parts of the monograph -->
      <g transform="translate(10, 5)">
        <rect x="0" y="0" width="375" height="42" rx="5" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="15" y="20" fill="#38bdf8" font-size="10.5" font-weight="700">Part I: Difference, Witness &amp; Obstruction (Ch 1–5)</text>
        <text x="15" y="35" fill="#94a3b8" font-size="9">Levels 0–4: cut → typed witnesses → nonselection → cochain quotients</text>
      </g>

      <g transform="translate(10, 52)">
        <rect x="0" y="0" width="375" height="42" rx="5" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
        <text x="15" y="20" fill="#10b981" font-size="10.5" font-weight="700">Part II: Order, Quantity &amp; Finite Probability (Ch 6–9)</text>
        <text x="15" y="35" fill="#94a3b8" font-size="9">Levels 5–8: succession order → duration &amp; clocks → finite probability</text>
      </g>

      <g transform="translate(10, 99)">
        <rect x="0" y="0" width="375" height="42" rx="5" fill="#030712" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="15" y="20" fill="#fbbf24" font-size="10.5" font-weight="700">Part III: Observer, Observation &amp; Measurement (Ch 10–15)</text>
        <text x="15" y="35" fill="#94a3b8" font-size="9">Levels 9–14: observer → observation → measurement; authority apart</text>
      </g>

      <g transform="translate(10, 146)">
        <rect x="0" y="0" width="375" height="42" rx="5" fill="#030712" stroke="#a855f7" stroke-width="1.5"/>
        <text x="15" y="20" fill="#a855f7" font-size="10.5" font-weight="700">Part IV: Histories &amp; The Quantum Boundary (Ch 16–19)</text>
        <text x="15" y="35" fill="#94a3b8" font-size="9">Levels 15–18: descent fork → history sums → audit → unpaid interfaces</text>
      </g>

      <g transform="translate(10, 193)">
        <rect x="0" y="0" width="375" height="42" rx="5" fill="#030712" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="15" y="20" fill="#06b6d4" font-size="10.5" font-weight="700">Part V: Relative Scope &amp; Open Programme (Ch 20–22)</text>
        <text x="15" y="35" fill="#94a3b8" font-size="9">Levels 19–21: relative completeness → open rows → synthesis</text>
      </g>

      <rect x="10" y="245" width="375" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="268" fill="#34d399" font-size="11" font-weight="700">• Trunk, Waist, Branches (§22.1–§22.3):</text>
      <text x="35" y="288" fill="#cbd5e1" font-size="10.5">Trunk: cut, residual, witness, symmetry, cochains, order.</text>
      <text x="35" y="306" fill="#cbd5e1" font-size="10.5">Waist: witness → observer → observation → measurement.</text>
      <text x="35" y="324" fill="#fbbf24" font-size="10.5">Authority stays outside the chain, a separate layer.</text>
      <text x="35" y="344" fill="#38bdf8" font-size="10.5">Branches: histories, quantum carriers, relative completeness.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Conclusion &amp; Four-Tier Ambition (§22.4–5)</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">WDP-CH22-C01: Synthesis Conclusion (§22.5)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">typed construction + visible assumption cost</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Architectural; adds no theorem; open rows stay open.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Tiers 1–2: Demonstrated (finite, constructive)</text>
      <rect x="0" y="103" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10">• T1: round-trip encodings of cuts, digraphs, cochains, packets.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10">• T2: succession, duration, finite probability, ℤ cochains.</text>

      <text x="0" y="165" fill="#fbbf24" font-size="11.5" font-weight="700">Tier 3: Reconstruction, an Audit Framework</text>
      <rect x="0" y="172" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="191" fill="#cbd5e1" font-size="10">• Contextuality covers, operator states, uncertainties: rebuilt</text>
      <text x="12" y="208" fill="#cbd5e1" font-size="10">  only by adjoining explicit operational axioms.</text>

      <text x="0" y="234" fill="#f43f5e" font-size="11.5" font-weight="700">Tier 4: Unique Selection, Explicitly Refused</text>
      <rect x="0" y="241" width="385" height="58" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="256" fill="#fca5a5" font-size="10">• Not claimed: continuum spacetime, ℂ, U(1), Gleason, Born</text>
      <text x="12" y="270" fill="#fca5a5" font-size="10">  rule forced or uniquely selected by difference alone;</text>
      <text x="12" y="284" fill="#fca5a5" font-size="10">  no theorem proves that they cannot be.</text>

      <text x="0" y="309" fill="#a855f7" font-size="11.5" font-weight="700">Closing Boundary (§22.6)</text>
      <rect x="0" y="316" width="385" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="335" fill="#cbd5e1" font-size="10">• The monograph ends where its evidence ends. A closed interface</text>
      <text x="12" y="352" fill="#38bdf8" font-size="10">  gets its proof there; nonclaims elsewhere stay intact.</text>
    </g>
  </g>
</svg>