<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-17</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Audit</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 18</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">W1–W6 Audit</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 17: Quantum Reconstruction as an Audit</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Does W1–W6 single out quantum theory? Two strengthened readings: classical</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">π(Uv)_σ(q) = π(v)_q if U*U = I over ℤ[i]</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH18-D01 · P01–P05 · O01 · N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Classical Corner of W1–W6 (§18.2)</text>
    
    <g transform="translate(20, 45)">
      <!-- Nested matrix classes: reading aid, not a polytope -->
      <!-- Outer: non-monomial unitaries over finite localizations (CH18-P05) -->
      <polygon points="190,20 310,115 190,210 70,115" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="190" y="36" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">Over ℤ[i][½]: non-monomial U exist (P05)</text>

      <!-- Middle: monomial unitaries over Z[i] (CH18-P04) -->
      <ellipse cx="190" cy="115" rx="85" ry="60" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="2" filter="url(#glowPurple)"/>
      <text x="190" y="85" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">Monomial over ℤ[i] (P04)</text>

      <!-- Inner: permutation matrices (CH18-P02) -->
      <polygon points="190,75 245,115 190,155 135,115" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <text x="190" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">P_σ (P02)</text>

      <rect x="10" y="235" width="375" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="258" fill="#34d399" font-size="11" font-weight="700">• Classical corner (CH18-P02 to P05):</text>
      <text x="35" y="278" fill="#cbd5e1" font-size="10.5">w ≥ 0 pointwise: stochastic, stochastic inverse ⇒ P_σ (P02).</text>
      <text x="35" y="296" fill="#cbd5e1" font-size="10.5">Signed [[2,1],[-1,0]] keeps mass, is not P_σ (P03).</text>
      <text x="35" y="314" fill="#fbbf24" font-size="10.5">U*U = I over ℤ[i] ⇒ monomial, ±1/±i; readout relabels (P04).</text>
      <text x="35" y="334" fill="#f43f5e" font-size="10.5">H*H = 2I; R over ℤ[1/5], M over ℤ[i][½] split fibers; M² = toggle</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Audit Table, Open Row &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Cabello 18-ray parity (§18.4)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">9 tetrads: Σ = 9 (odd) vs 2·Σ_rays v (even)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Refutes noncontextual {0,1} valuations; no Bell bound.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (quantum.py, CH18-O01)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• supports_quantum_reconstruction → SCOPE_VIOLATION</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Lean ClassicalCorner.lean: exact for CH18-P02 to P05.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• O01: (a) only for strengthened readings; still open.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Countermodel: the gbit square (CH18-P01)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Centre = ½v₁+½v₃ = ½v₂+½v₄: not a simplex.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Nonsimplicial ≠ quantum discriminator.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH18-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">The monograph does not derive a Tsirelson bound, the</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">quantum set of correlations, a Hilbert representation,</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">or quantum dynamics. Strengthened readings are classical.</text>
    </g>
  </g>
</svg>