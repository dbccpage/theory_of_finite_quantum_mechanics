<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 02: Repair Families, Exhaustion &amp; Extension</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Menu A, Predicate R(a), Exhausted(A,R) ≡ ∀a∈A ¬R(a)</text>
  <rect x="80" y="100" width="200" height="70" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="180" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">Admitted Moves A</text>
  <text x="180" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Finite repair menu</text>
  <rect x="540" y="100" width="200" height="70" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="640" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">Requirement R</text>
  <text x="640" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Protected predicate</text>
  <rect x="310" y="100" width="200" height="70" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="410" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Budget B</text>
  <text x="410" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Search depth limit</text>
  <rect x="140" y="210" width="520" height="55" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="242" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">CODA-04: Working member refutes exhaustion</text>
  <text x="400" y="292" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">B ⊆ A: Exhausted(A) ⟹ Exhausted(B), converse fails</text>
  <rect x="50" y="320" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="160" y="360" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">Repair</text>
  <text x="160" y="377" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Same-level, declared ops</text>
  <rect x="290" y="320" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Extension</text>
  <text x="400" y="377" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">New carrier / observation</text>
  <rect x="530" y="320" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="640" y="360" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f85149">Refusal</text>
  <text x="640" y="377" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Reason to stop attempting</text>
  <text x="400" y="420" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Failure of all repairs ≠ a successful extension exists</text>
  <text x="400" y="450" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Ties: c(a)=c(b) ⟹ every attained minimum property shared</text>
  <text x="400" y="478" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
