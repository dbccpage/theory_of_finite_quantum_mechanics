<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-02</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Structure</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 03</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Retention</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 2: Symmetry, Nonselection &amp; Retention</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">No Equivariant Point Selection, Injection Ledger &amp; Retention Packets</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">|X|≥2: no S_X-fixed point · R=(M,u,r,≈)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH03-P01 · D01 · O01 · O02 · N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Retention Packet R = (M, u, r, ≈)</text>
    
    <g transform="translate(15, 45)">
      <rect x="10" y="20" width="80" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="50" y="42" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Input i</text>
      <line x1="95" y1="37" x2="145" y2="37" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>

      <rect x="150" y="10" width="105" height="55" rx="6" fill="#030712" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="202" y="32" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Update Map u</text>
      <text x="202" y="50" fill="#94a3b8" font-size="9" text-anchor="middle">u: M × I → M</text>
      <line x1="260" y1="37" x2="295" y2="37" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrA)"/>

      <rect x="300" y="10" width="80" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="340" y="32" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">State m'</text>
      <text x="340" y="50" fill="#94a3b8" font-size="9" text-anchor="middle">m' ∈ M</text>

      <line x1="340" y1="70" x2="340" y2="105" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>
      <rect x="280" y="110" width="105" height="40" rx="6" fill="#030712" stroke="#a855f7" stroke-width="1.5"/>
      <text x="332" y="128" fill="#a855f7" font-size="10.5" font-weight="700" text-anchor="middle">Readout r</text>
      <text x="332" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">r(m') ∈ O</text>

      <rect x="10" y="165" width="375" height="195" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="185" fill="#f8fafc" font-size="11" font-weight="700">Retention Countermodels CM1–CM5 (§3.6):</text>
      <text x="25" y="205" fill="#38bdf8" font-size="10">• CM1: |M| = 2, injective r, but u(m, tick) = m: no recording.</text>
      <text x="25" y="223" fill="#10b981" font-size="10">• CM2: u swaps m₀ and m₁, but r is constant: blind report.</text>
      <text x="25" y="241" fill="#fbbf24" font-size="10">• CM3: 3-cycle u; r merges m₀ and m₂: ker r ⊋ equality.</text>
      <text x="25" y="259" fill="#f43f5e" font-size="10">• CM4: r = id, yet the declared ≈ identifies m₀ with m₁.</text>
      <text x="25" y="277" fill="#a855f7" font-size="10">• CM5: r = id, but reset sends every m to m₀: past lost.</text>
      <text x="25" y="302" fill="#cbd5e1" font-size="10" font-weight="600">⇒ Derivation supplement: CH03-O01, O02 resolved as finite propositions.</text>
      <text x="25" y="320" fill="#94a3b8" font-size="9.5">§3.4: a detector bit witnesses contact; a latch retains it.</text>
      <text x="25" y="338" fill="#94a3b8" font-size="9.5">Injection ledger: base point, order, measure, seed, law, …</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">CH03-P01: No Equivariant Point Selection</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">|X| ≥ 2 ⇒ no x is fixed by every σ ∈ S_X</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">A label, base point, order, or seed can select; it must be named.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (symmetry.py, observer.py)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• fixed_points(n) is empty for n = 2, 3 (CH03-P01).</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• make_cm1… make_cm5 build CM1–CM5 as RetentionPackets.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Lean: Symmetry.no_fully_invariant_point (L:exact).</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusal (observer.py, CH03-O02)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Profile-distinct, same report → REPORT_PROFILE_COLLAPSE</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• A scope test only: no independence theorem is proved.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH03-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">The symmetry obstruction does not make retention,</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">dynamics, or observers impossible. It shows that</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">their selection is not free.</text>
    </g>
  </g>
</svg>