<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-13</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Boundary</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 14</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Blind Spot</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 13: Self-Reference &amp; Awareness Boundary</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Self-Presentation, Presentation Blind Spots, Capacity Bounds &amp; Firewall</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">x ≠ y, q(x) = q(y) ⇒ F(q x) = F(q y)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH14-D01 · P01–P03 · N01 · N02 · O01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Self-Presentation &amp; Presentation Blind Spot</text>
    
    <g transform="translate(20, 45)">
      <!-- Outer Universe U -->
      <rect x="10" y="10" width="375" height="225" rx="10" fill="#030712" stroke="#475569" stroke-width="1.5"/>
      <text x="25" y="32" fill="#94a3b8" font-size="11" font-weight="700">Observer packet O</text>

      <!-- Observer O -->
      <rect x="35" y="45" width="325" height="175" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="68" fill="#38bdf8" font-size="12" font-weight="700">Self-state σ ∈ X_O</text>

      <!-- Internal Model M_O -->
      <rect x="65" y="85" width="265" height="120" rx="6" fill="#030712" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="80" y="108" fill="#fbbf24" font-size="11" font-weight="700">Presentation q_O σ ∈ P_O</text>

      <!-- Recursive sub-model M_M_O -->
      <rect x="105" y="125" width="185" height="65" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="197" y="148" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">Self-report (reflexive)</text>
      <text x="197" y="168" fill="#fca5a5" font-size="9" text-anchor="middle">x ≠ y, q_O x = q_O y</text>

      <rect x="10" y="250" width="375" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="273" fill="#34d399" font-size="11" font-weight="700">• Blind Spots &amp; Capacity (§14.3–§14.4):</text>
      <text x="35" y="293" fill="#cbd5e1" font-size="10.5">Pigeonhole: blind spots relative to the selected encoding.</text>
      <text x="35" y="311" fill="#cbd5e1" font-size="10.5">Diagonal claims need a self-naming language, an interpretation</text>
      <text x="35" y="327" fill="#cbd5e1" font-size="10.5">map, and a logic, declared first.</text>
      <text x="35" y="347" fill="#fbbf24" font-size="10.5">Awareness: a bridge the finite architecture does not supply.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Injectivity on Declared Y (WDP-CH14-P02)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">injective on Y ⇔ Y ∩ ker q = {0}; needs M ≥ dim Y</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">P03: then ‖y‖ ≤ c‖q(y)‖ on Y; coupled example gives c = √2.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (presentation_recovery.py)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• injective_on_subspace: rank test, else a verified kernel y.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• euclidean_recovery_certificate: H − tG is PSD at t = 1/2.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Lean: presentation_blind_spot is exact for WDP-CH14-P01.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusal &amp; Refuted Draft</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Fewer coordinates than dim Y → RefusalCode.NOT_INJECTIVE</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Refuted draft: O₃ ⇒ O₂ ⇒ O₁ ⇒ O₀ (§14.2)</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH14-N01 / N02: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Self-witnessing, self-modeling, evaluator closure, or report</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">integration does not establish phenomenal consciousness.</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">Injectivity on Y certifies no detection outside Y.</text>
    </g>
  </g>
</svg>