<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 07: Finite Shadows (CS), Continuum Models (Q) &amp; Bridge (CS_Q)</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Finite samples do not determine an arbitrary continuous integral</text>
  <rect x="40" y="100" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="150" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">CS: Finite Shadow</text>
  <text x="150" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">p_λ : X → P_λ family</text>
  <rect x="290" y="100" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Q: Continuum</text>
  <text x="400" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Metric/analytic data</text>
  <rect x="540" y="100" width="220" height="70" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="650" y="140" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">CS_Q: Bridge</text>
  <text x="650" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Factor through shadow?</text>
  <line x1="260" y1="135" x2="290" y2="135" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="135" x2="540" y2="135" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="100" y="210" width="600" height="50" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">CODA-09: f and f+h have identical samples, different integrals</text>
  <rect x="100" y="295" width="600" height="55" rx="8" fill="url(#boxGrad)" stroke="#484f58" stroke-width="1.5"/>
  <text x="400" y="327" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#484f58">Example: [0,10], samples {0,5,10}, h=[(x/10)(x/10−½)(x/10−1)]²</text>
  <text x="400" y="380" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">∫h = 1/84 — same samples, integrals 50 vs 4201/84</text>
  <rect x="100" y="400" width="600" height="50" rx="8" fill="url(#boxGrad)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="430" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#58a6ff">CODA-10: Affine quadrature exact; L_N + R_N / 2 = 50 = ∫₀¹⁰ x dx</text>
  <text x="400" y="478" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
