<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-12</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Measure</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 13</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Packet</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 12: Measurement as a Typed Extension</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Measurand, Indication, Result, Calibration, Uncertainty &amp; Traceability</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Result: ŷ = h_Cal(z) in Y, with Unc/Err</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH13-D01 · CH13-C01 · CH13-O01 · CH13-N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Indication, Calibration &amp; Reported Result</text>
    
    <g transform="translate(20, 45)">
      <!-- System S and Meter M -->
      <rect x="20" y="30" width="140" height="90" rx="8" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
      <text x="90" y="55" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Raw Indication</text>
      <text x="90" y="75" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Code z = 2</text>
      <text x="90" y="100" fill="#94a3b8" font-size="10" text-anchor="middle">Retained code</text>

      <rect x="220" y="30" width="150" height="90" rx="8" fill="#030712" stroke="#fbbf24" stroke-width="2"/>
      <text x="295" y="55" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Reported Value (Y)</text>
      <text x="295" y="75" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">[0.9, 1.5] V</text>
      <text x="295" y="100" fill="#94a3b8" font-size="10" text-anchor="middle">Interval result</text>

      <!-- Coupling Arrow -->
      <line x1="162" y1="75" x2="218" y2="75" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrG)"/>
      <text x="190" y="65" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">h_Cal</text>

      <!-- Pointer Gauge Diagram -->
      <g transform="translate(110, 140)">
        <rect x="0" y="0" width="160" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
        <line x1="20" y1="40" x2="140" y2="40" stroke="#64748b" stroke-width="2"/>
        <circle cx="50" cy="40" r="4" fill="#64748b"/>
        <circle cx="80" cy="40" r="4" fill="#38bdf8"/>
        <circle cx="110" cy="40" r="4" fill="#64748b"/>
        <line x1="80" y1="40" x2="95" y2="18" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrR)"/>
        <text x="80" y="55" fill="#f8fafc" font-size="9" text-anchor="middle">Z = {0, 1, 2, 3}</text>
      </g>

      <rect x="10" y="225" width="375" height="145" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="248" fill="#34d399" font-size="11" font-weight="700">• Measurement packet (WDP-CH13-D01):</text>
      <text x="35" y="268" fill="#cbd5e1" font-size="10.5">(Obs, Q, Y, h, u, S, Cal, Unc, Err, Tr_met, Prov): 11 typed fields.</text>
      <text x="35" y="286" fill="#cbd5e1" font-size="10.5">Measurand Q is not a value; indication z is not the result ŷ.</text>
      <text x="35" y="304" fill="#fbbf24" font-size="10.5">Recalibration keeps the old result readable via provenance.</text>
      <text x="35" y="322" fill="#f43f5e" font-size="10.5">Not justified: “1.2 V exactly” from code 2.</text>
      <text x="35" y="342" fill="#38bdf8" font-size="10.5">An accepted E-observation alone is not yet a measurement.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Interval Order Transport (WDP-CH13-C01)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">I ≺ J ⇒ F(I) ≺ F(J)  (F: full interval map)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Conditional result; a monotone point calibration is not enough.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (measurement.py, WDP-CH13-D01)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• measure() needs an AcceptedObservation (MISSING_OBSERVATION).</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Checks gain·z + offset = value (VALUE_MAP_MISMATCH).</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Combined uncertainty = stated + each chain link (additive).</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusals (measurement.py)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• No calibration record → RefusalCode.MISSING_CALIBRATION</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Provenance as Tr_met → TRACEABILITY_TYPE_CONFUSION</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH13-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Measurement validity does not imply authority, causal</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">explanation, physical completeness, or observer</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">independence. CH13-O01 is open.</text>
    </g>
  </g>
</svg>