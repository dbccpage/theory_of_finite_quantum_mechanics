<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-20</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Falsifier</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 21</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Open Obligations</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 20: Falsifiers, Nonclaims &amp; Obligations</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Named Falsifiers, 20 Consolidated Nonclaims &amp; the Priority Open Programme</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Ledger: 13 open claims, 6 open interfaces</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">WDP-CH04-O01 · open interface (§21.8)</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Falsifiers (§21.2–21.6) &amp; Nonclaims (§21.7)</text>
    
    <g transform="translate(15, 45)">
      <!-- Left Column: Falsifiers (21.2-21.6) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="180" height="190" rx="6" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
        <text x="12" y="22" fill="#10b981" font-size="11" font-weight="700">What Would Refute It</text>
        <text x="12" y="44" fill="#34d399" font-size="9.5">• Equivariant selector exists</text>
        <text x="12" y="62" fill="#34d399" font-size="9.5">• Unrecorded label or order</text>
        <text x="12" y="80" fill="#34d399" font-size="9.5">• Dual fails on some repair</text>
        <text x="12" y="98" fill="#34d399" font-size="9.5">• d₁d₀ ≠ 0 on the domain</text>
        <text x="12" y="116" fill="#34d399" font-size="9.5">• Directed cycle (succession)</text>
        <text x="12" y="134" fill="#34d399" font-size="9.5">• Unequal sums, same ends</text>
        <text x="12" y="152" fill="#34d399" font-size="9.5">• Acceptance implies authority</text>
        <text x="12" y="170" fill="#34d399" font-size="9.5">• Nonquantum GPT passes test</text>
      </g>

      <!-- Right Column: Nonclaims (sample of 21.7) -->
      <g transform="translate(200, 10)">
        <rect x="0" y="0" width="185" height="190" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="12" y="22" fill="#f43f5e" font-size="11" font-weight="700">Nonclaims §21.7 (8 of 20)</text>
        <text x="12" y="44" fill="#fca5a5" font-size="9">✗ Difference alone → structure</text>
        <text x="12" y="62" fill="#fca5a5" font-size="9">✗ Witness → memory or observer</text>
        <text x="12" y="80" fill="#fca5a5" font-size="9">✗ Normalization → Born rule</text>
        <text x="12" y="98" fill="#fca5a5" font-size="9">✗ Acceptance → authority</text>
        <text x="12" y="116" fill="#fca5a5" font-size="9">✗ Path sums = path integrals</text>
        <text x="12" y="134" fill="#fca5a5" font-size="9">✗ Calculus reconstructs QM</text>
        <text x="12" y="152" fill="#fca5a5" font-size="9">✗ Relative = absolute complete</text>
        <text x="12" y="170" fill="#fca5a5" font-size="9">✗ Certificate routes a repair</text>
      </g>

      <rect x="10" y="215" width="375" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="238" fill="#fbbf24" font-size="11" font-weight="700">• Why falsifiers belong (§21.1):</text>
      <text x="35" y="258" fill="#cbd5e1" font-size="10.5">Each theorem family names a countermodel that refutes it;</text>
      <text x="35" y="276" fill="#cbd5e1" font-size="10.5">each interface names the missing type that blocks it.</text>
      <text x="35" y="294" fill="#cbd5e1" font-size="10.5">Projection onto ker d₁ is not a repair: the class changes.</text>
      <text x="35" y="312" fill="#fbbf24" font-size="10.5">Open: 13 claims + 6 interfaces, each listed by ledger ID.</text>
      <text x="35" y="332" fill="#38bdf8" font-size="10">Priority order: §21.8 items 1–13; item 13 is WDP-CH04-O01.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Open Programme, Revision &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Dependency-Aware Status (§21.11)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">status(C) ≤ weakest load-bearing dependency</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">unless C carries an independent proof of its own.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Open Interface WDP-CH04-O01 (§21.8, item 13)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Typed adapter: diagnostic classes → routing layer.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Prove or refute initiality for minimal refinements.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Until then: promote_diagnostic → SCOPE_VIOLATION.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Countermodel (§21.4, Chapter 9)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Magnitudes (1,2): q=1 gives (1/3,2/3), q=2 gives (1/5,4/5).</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Normalization alone does not select the Born rule.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">Revision Discipline (§21.9–§21.10)</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Each status change records a cause: evidence, profile,</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">statement, or policy. Only evidence is an evidential update.</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">A changed statement is a new claim, not a new status.</text>
    </g>
  </g>
</svg>