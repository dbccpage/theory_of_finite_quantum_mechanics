<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 05: Representation Transport (MUR) &amp; Loss Ledgers</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">F : X → X′,  f : P → P′,  Commuting: p′ ∘ F = f ∘ p</text>
  <rect x="80" y="100" width="160" height="60" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="160" y="135" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">X</text>
  <text x="160" y="152" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Source state</text>
  <rect x="560" y="100" width="160" height="60" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="640" y="135" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">X′</text>
  <text x="640" y="152" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Target state</text>
  <rect x="80" y="260" width="160" height="60" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="160" y="295" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">P</text>
  <text x="160" y="312" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Source obs</text>
  <rect x="560" y="260" width="160" height="60" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="640" y="295" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">P′</text>
  <text x="640" y="312" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Target obs</text>
  <line x1="240" y1="130" x2="560" y2="130" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="122" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">F</text>
  <line x1="240" y1="290" x2="560" y2="290" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="282" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">f</text>
  <line x1="160" y1="160" x2="160" y2="260" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="160" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">p</text>
  <line x1="640" y1="160" x2="640" y2="260" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="640" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">p′</text>
  <rect x="280" y="180" width="240" height="45" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="207" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">CODA-07: Transport</text>
  <text x="400" y="224" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">q′∘F = q̄′∘f∘p</text>
  <rect x="100" y="370" width="600" height="55" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="400" y="402" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f85149">Loss Ledger: erased / identified / approximated / unresolved</text>
  <text x="400" y="455" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Transport is not invertible, norm-preserving, or authority-conferring</text>
  <text x="400" y="478" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
