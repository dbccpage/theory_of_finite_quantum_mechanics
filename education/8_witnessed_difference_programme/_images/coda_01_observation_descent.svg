<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 01: Observation, Image Factorization &amp; Descent</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">p : X → P   q : X → Y   Factor q̄ : I → Y where I = p(X)</text>
  <rect x="60" y="90" width="160" height="70" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="140" y="130" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">State X</text>
  <rect x="320" y="90" width="160" height="70" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="130" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Observation P</text>
  <rect x="580" y="90" width="160" height="70" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="660" y="130" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">Answer Y</text>
  <line x1="220" y1="125" x2="320" y2="125" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="117" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">p</text>
  <line x1="220" y1="135" x2="580" y2="135" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="127" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">q</text>
  <rect x="320" y="200" width="160" height="50" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="230" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Image I = p(X)</text>
  <text x="400" y="247" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Realized image</text>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="225" x2="580" y2="135" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="530" y="172" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">q̄</text>
  <rect x="100" y="290" width="600" height="55" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="322" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">CODA-02: q̄ exists iff p(x)=p(y) ⟹ q(x)=q(y)</text>
  <rect x="100" y="380" width="280" height="60" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="240" y="415" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f85149">Collision Witness</text>
  <text x="240" y="432" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">p(x)=p(y) but q(x)≠q(y)</text>
  <rect x="420" y="380" width="280" height="60" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="560" y="415" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f85149">CODA-03: Collision Persistence</text>
  <text x="560" y="432" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">No coarsening c∘p repairs it</text>
  <line x1="380" y1="410" x2="420" y2="410" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="402" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">blocks</text>
  <text x="400" y="470" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
