<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-15</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Curvature</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 16</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Descent Test</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 15: Spatial/History Diagnostics &amp; Curved Complexes</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Curvature Defects, Presentation Descent, Contractions &amp; Truncation Leakage</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">q(x)=q(y) ⇒ q(Tx)=q(Ty)  ⟺  ∃ T̄ : T̄q = qT</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH16-D01·D02 · P01–P04 · C01 · N01·N02</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Curvature Defects &amp; the Three Outcomes</text>
    
    <g transform="translate(20, 45)">
      <!-- Bidegree square: C^{p,q} with spatial map d_s and historical map d_h (§16.1) -->
      <rect x="50" y="150" width="80" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="170" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">C^(p,q)</text>
      <rect x="250" y="150" width="90" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="295" y="170" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">C^(p+1,q)</text>
      <rect x="50" y="30" width="80" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="50" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">C^(p,q+1)</text>
      <rect x="250" y="30" width="90" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="295" y="50" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">C^(p+1,q+1)</text>

      <line x1="132" y1="165" x2="246" y2="165" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrC)"/>
      <text x="189" y="158" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">d_s</text>
      <line x1="132" y1="45" x2="246" y2="45" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrC)"/>
      <text x="189" y="38" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">d_s</text>
      <line x1="90" y1="148" x2="90" y2="64" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrG)"/>
      <text x="80" y="110" fill="#10b981" font-size="10.5" font-weight="700" text-anchor="end">d_h</text>
      <line x1="295" y1="148" x2="295" y2="64" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrG)"/>
      <text x="305" y="110" fill="#10b981" font-size="10.5" font-weight="700">d_h</text>

      <text x="192" y="100" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Λ = d_s d_h + d_h d_s</text>
      <text x="192" y="118" fill="#fca5a5" font-size="9.5" text-anchor="middle">mixed defect around the square</text>
      <text x="192" y="208" fill="#94a3b8" font-size="9.5" text-anchor="middle">Double complex only if K_s = K_h = Λ = 0 is proved</text>

      <rect x="10" y="225" width="375" height="140" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="248" fill="#34d399" font-size="11" font-weight="700">• Curvature defects (WDP-CH16-D01):</text>
      <text x="35" y="268" fill="#cbd5e1" font-size="10.5">K_s = d_s², K_h = d_h², Λ = d_s d_h + d_h d_s; flat: all vanish.</text>
      <text x="35" y="286" fill="#cbd5e1" font-size="10.5">D = d_s + d_h ⇒ D² = K_s + Λ + K_h (anticommuting convention).</text>
      <text x="35" y="304" fill="#cbd5e1" font-size="10.5">Outcomes: flat · curved (typed K) · higher coherent repair.</text>
      <text x="35" y="322" fill="#fbbf24" font-size="10.5">Renaming a defect “higher structure” is not Outcome 3.</text>
      <text x="35" y="342" fill="#f43f5e" font-size="10.5">No Regge deficit angles or edge lengths: curvature is algebraic.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Results, Executable Checks &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Sign-corrected perturbation (CH16-C01)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">A = (1+δh)⁻¹δ; d_D+rAi, i−hAi, r−rAh, h−hAh</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Convention 1 − ir = dh + hd; source used (1 − δh)⁻¹.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (contraction.py, truncation.py)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• validate_contraction: exact 1 − ir = dh + hd over ℚ.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• perturb re-validates each perturbed contraction it returns.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Reduced zero genuine ⟺ ⟨ψ, L_P ψ⟩ = 0 (CH16-P04).</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Forgotten bit → RefusalCode.DOES_NOT_DESCEND</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• q(x₁,x₂) = x₁, T swaps: (0,0),(0,1) → next 0 vs 1.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Remembering x₂ repairs prediction.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH16-N01 / N02: Nonclaims</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">No cohomology or spectral sequence before its identities;</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">L_P classifies no vector and yields no Hamiltonian, energy,</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">zero-mode, probability-leak, or superspace reading.</text>
    </g>
  </g>
</svg>