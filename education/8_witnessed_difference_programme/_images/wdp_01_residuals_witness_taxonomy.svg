<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-01</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Root P</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 02</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">7 Roles</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 1: Residuals &amp; The Typed Witness Taxonomy</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Root P Evaluation Kernel: Phi_J([delta]) &amp; Seven Nominally Typed Witness Roles</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Residual: Φ_J([δ]) = inf J(δ - d α)</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH02-D01 · CH02-P01 · CH02-N01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Seven Nominally Typed Witness Roles</text>
    
    <g transform="translate(15, 45)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="10" y="18" fill="#38bdf8" font-size="10" font-weight="700">1. ResidualLocusWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Nonzero defect locus</text>
      </g>
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#10b981" stroke-width="1.2"/>
        <text x="10" y="18" fill="#10b981" font-size="10" font-weight="700">2. RetentionWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Stored memory mark</text>
      </g>
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="10" y="18" fill="#fbbf24" font-size="10" font-weight="700">3. RepairWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Admissible α s.t. d α = δ</text>
      </g>
      <g transform="translate(200, 50)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#a855f7" stroke-width="1.2"/>
        <text x="10" y="18" fill="#a855f7" font-size="10" font-weight="700">4. ContextWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Local section in context</text>
      </g>
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="10" y="18" fill="#f43f5e" font-size="10" font-weight="700">5. DualCertificateWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Separating functional ℓ</text>
      </g>
      <g transform="translate(200, 100)">
        <rect x="0" y="0" width="185" height="42" rx="5" fill="#030712" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="10" y="18" fill="#06b6d4" font-size="10" font-weight="700">6. DescentReceipt</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Gluing under a declared rule</text>
      </g>
      <g transform="translate(95, 150)">
        <rect x="0" y="0" width="195" height="42" rx="5" fill="#030712" stroke="#ec4899" stroke-width="1.2"/>
        <text x="10" y="18" fill="#ec4899" font-size="10" font-weight="700">7. CounterexampleWitness</text>
        <text x="10" y="33" fill="#94a3b8" font-size="9">Finite refuting inhabitant</text>
      </g>

      <rect x="0" y="208" width="385" height="155" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="230" fill="#f8fafc" font-size="11" font-weight="700">• Typing proposition WDP-CH02-P01 (syntactic fence):</text>
      <text x="25" y="250" fill="#94a3b8" font-size="10">• No role tag coerces to another without explicit adapter.</text>
      <text x="25" y="268" fill="#94a3b8" font-size="10">• A nonzero residual component is not automatically stored.</text>
      <text x="25" y="286" fill="#94a3b8" font-size="10">• A stored mark does not repair anything.</text>
      <text x="25" y="304" fill="#94a3b8" font-size="10">• A repair element need not define a dual certificate.</text>
      <text x="25" y="322" fill="#fbbf24" font-size="10">• Not all 42 directed non-implications are proved.</text>
      <text x="25" y="340" fill="#38bdf8" font-size="10">• Witness_k[P](x,e) is typed by proposition P and kind k.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Quotient Defect Objective (Root P)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">Φ_J([δ]) = inf_{α ∈ A} J(δ - dα)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">V: Defect space | A: Repair space | d: Linear repair map</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Triangle Example Circulation Audit</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• G: Triangle edges {01, 12, 20}, cochain δ = (1, 1, 1).</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Circulation: ∑ δ_e = 3 ≠ 0 ⇒ Not exact coboundary (im d₀).</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Dual cert functional ℓ(x) = x₀₁ + x₁₂ + x₂₀ vanishes on im d₀.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusal (observer.py adapters)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• No bridge declared → RefusalCode.MISSING_ADAPTER</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Bridge for another kind → ADAPTER_MISMATCH</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH02-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">A typed witness does not acquire epistemic, phenomenal,</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">legal, or institutional authority merely by being called</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">evidence. Authority is a separate typed relation.</text>
    </g>
  </g>
</svg>