<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow5" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="arrowCyan5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow5)"/>
  <rect width="940" height="580" fill="url(#grid5)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#831843" fill-opacity="0.5" stroke="#ec4899" stroke-width="1.2"/>
    <text x="65" y="17" fill="#fbcfe8" font-size="11" font-weight="700" text-anchor="middle">Level 05: Letter Λ</text>

    <rect x="140" y="0" width="150" height="26" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="215" y="17" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Operation: Structural Lift</text>

    <rect x="300" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="380" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Mapping: ℚⁿ ↪ ℚⁿ⁺ᵏ</text>

    <rect x="470" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="555" y="17" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Gate: FiniteLambdaLedger</text>

    <rect x="650" y="0" width="140" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="720" y="17" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
  </g>

  <!-- Title & Formula Header -->
  <text x="32" y="85" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.02em">DDC Level 05 — Structural Lift (Λ): Dimension Extension &amp; Chained Ledgers</text>
  <text x="32" y="106" fill="#94a3b8" font-size="12">Zero-padding embedding into expanded carrier representations under licensed triggers; preserves non-exactness.</text>

  <!-- Left Card: Zero-Padding Inclusion & Norm Invariance -->
  <g transform="translate(32, 126)">
    <rect width="420" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="220" height="20" rx="4" fill="#831843" fill-opacity="0.5"/>
    <text x="20" y="26" fill="#f472b6" font-size="11" font-weight="700">ZERO-PADDING INCLUSION (ℚⁿ ↪ ℚⁿ⁺ᵏ)</text>

    <!-- Vector expansion illustration -->
    <g transform="translate(25, 48)">
      <!-- Original Vector v -->
      <rect x="0" y="0" width="130" height="90" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <rect x="6" y="6" width="118" height="18" rx="3" fill="#312e81"/>
      <text x="65" y="19" fill="#c7d2fe" font-size="9.5" font-weight="700" text-anchor="middle">Base Vector v ∈ ℚⁿ</text>
      <text x="14" y="42" fill="#cbd5e1" font-family="monospace" font-size="9">v[0] = +1</text>
      <text x="14" y="58" fill="#cbd5e1" font-family="monospace" font-size="9">v[1] = +2</text>
      <text x="14" y="78" fill="#a5b4fc" font-size="8.5">dim(v) = n</text>

      <!-- Lift operator arrow -->
      <path d="M 142 45 L 182 45" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrowPink)"/>
      <text x="162" y="38" fill="#f472b6" font-size="10" font-weight="800" text-anchor="middle">Λ</text>

      <!-- Lifted Vector Λ(v) -->
      <g transform="translate(195, 0)">
        <rect width="175" height="90" rx="6" fill="#831843" fill-opacity="0.3" stroke="#ec4899" stroke-width="1.5" filter="url(#glowPink)"/>
        <rect x="6" y="6" width="163" height="18" rx="3" fill="#9d174d"/>
        <text x="87" y="19" fill="#fce7f3" font-size="9.5" font-weight="700" text-anchor="middle">Lifted Vector Λ(v) ∈ ℚⁿ⁺ᵏ</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="monospace" font-size="9">v[0..n-1] = [1, 2]</text>
        <text x="14" y="58" fill="#34d399" font-family="monospace" font-size="9">v[n..n+k-1] = [0, 0, 0]</text>
        <text x="14" y="78" fill="#f472b6" font-size="8.5">dim = n + k (Zero-Padded)</text>
      </g>
    </g>

    <!-- Formula Box bottom -->
    <g transform="translate(25, 155)">
      <rect width="370" height="90" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#f8fafc" font-size="10.5" font-weight="700">Theorem 5.5 (Non-Exactness Persistence):</text>
      <text x="14" y="38" fill="#f472b6" font-size="9.5">• <tspan font-weight="700">Norm Invariance:</tspan> ‖Λ(v)‖₁ = ‖v‖₁ (Zero padding adds zero mass)</text>
      <text x="14" y="54" fill="#f472b6" font-size="9.5">• <tspan font-weight="700">Persistence:</tspan> If v ∉ im(d₀), then Λ(v) ∉ im(d₀') in extended K'</text>
      <text x="14" y="72" fill="#94a3b8" font-size="9">Obstructions cannot be dissolved by mere coordinate zero-extension.</text>
    </g>
  </g>

  <!-- Right Card: Law 4 Trigger & FiniteLambdaLedger Gate -->
  <g transform="translate(472, 126)">
    <rect width="436" height="260" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="12" width="230" height="20" rx="4" fill="#701a75" fill-opacity="0.4"/>
    <text x="20" y="26" fill="#f0abfc" font-size="11" font-weight="700">LAW 4 &amp; FINITE LAMBDA LEDGER</text>

    <!-- Law 4 Trigger Box -->
    <g transform="translate(20, 44)">
      <rect width="396" height="74" rx="6" fill="#090d16" stroke="#c026d3" stroke-width="1"/>
      <text x="14" y="20" fill="#f5d0fe" font-size="10.5" font-weight="700">Law 4 (Trigger Law for Structural Lift):</text>
      <text x="14" y="38" fill="#cbd5e1" font-size="9.5">Lift Λ is permitted ONLY under explicit discrete triggers:</text>
      <text x="14" y="54" fill="#34d399" font-family="monospace" font-size="9.5">ClosedResidual (Φ₁ &gt; 0, Γ₂ = 0) ∨ DetectorInadequate</text>
      <text x="14" y="68" fill="#94a3b8" font-size="8.5">Any unlicensed lift is refused immediately: <tspan fill="#fca5a5">REFUSED_UNLICENSED_LIFT</tspan></text>
    </g>

    <!-- Chained Ledger Box -->
    <g transform="translate(20, 126)">
      <rect width="396" height="120" rx="6" fill="#831843" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2"/>
      <rect x="10" y="8" width="190" height="18" rx="3" fill="#9d174d"/>
      <text x="16" y="21" fill="#fce7f3" font-size="9.5" font-weight="700">FINITE LAMBDA LEDGER GATE</text>

      <text x="14" y="42" fill="#cbd5e1" font-size="9">Enforces sequence chaining invariants <tspan fill="#f472b6" font-weight="700">L-DDA-44 / L-DDA-45</tspan>:</text>
      
      <circle cx="20" cy="58" r="3.5" fill="#ec4899"/>
      <text x="30" y="62" fill="#cbd5e1" font-size="8.5">Empty Ledger: Requires initial == terminal == (0, 0) [Resolved]</text>

      <circle cx="20" cy="76" r="3.5" fill="#ec4899"/>
      <text x="30" y="80" fill="#cbd5e1" font-size="8.5">Step Adjacency: step[i].after == step[i+1].before across entire sequence</text>

      <circle cx="20" cy="94" r="3.5" fill="#ec4899"/>
      <text x="30" y="98" fill="#cbd5e1" font-size="8.5">Descent Requirement: Every intermediate step must be a strict descent</text>

      <circle cx="20" cy="112" r="3.5" fill="#ec4899"/>
      <text x="30" y="116" fill="#cbd5e1" font-size="8.5">Terminal Validity: The final step must pass validity check</text>
    </g>
  </g>

  <!-- Bottom Panel: Code & LiftReceipt Wire Format -->
  <g transform="translate(32, 404)">
    <rect width="876" height="144" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="10" width="180" height="18" rx="3" fill="#1e293b"/>
    <text x="18" y="23" fill="#94a3b8" font-size="10" font-weight="700">LIFT RECEIPT &amp; LEDGER VALIDATION</text>

    <!-- Receipt JSON snippet left -->
    <rect x="16" y="36" width="460" height="96" rx="5" fill="#030712" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#a5b4fc" font-family="monospace" font-size="9.5">{</text>
    <text x="40" y="68" fill="#93c5fd" font-family="monospace" font-size="9.5">"operation": <tspan fill="#f472b6">"Lambda"</tspan>, "success": <tspan fill="#34d399">true</tspan>, "license_id": <tspan fill="#fbcfe8">"LCE-001"</tspan>,</text>
    <text x="40" y="84" fill="#93c5fd" font-family="monospace" font-size="9.5">"initial_dim": <tspan fill="#f59e0b">2</tspan>, "extended_dim": <tspan fill="#f59e0b">4</tspan>, "trigger": <tspan fill="#34d399">"ClosedResidual"</tspan>,</text>
    <text x="40" y="100" fill="#93c5fd" font-family="monospace" font-size="9.5">"lifted_vector": <tspan fill="#cbd5e1">[1, 2, 0, 0]</tspan>, "authority_effect": <tspan fill="#f87171">"None"</tspan></text>
    <text x="26" y="116" fill="#a5b4fc" font-family="monospace" font-size="9.5">}</text>

    <!-- Mechanization box right -->
    <g transform="translate(490, 36)">
      <rect width="370" height="96" rx="5" fill="#831843" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
      <text x="14" y="20" fill="#fbcfe8" font-size="10.5" font-weight="700">Python Ledger Invariants:</text>
      <text x="14" y="38" fill="#fce7f3" font-family="monospace" font-size="9">ledger = FiniteLambdaLedger.new(init, steps, term)</text>
      <text x="14" y="54" fill="#f472b6" font-family="monospace" font-size="9">assert ledger.require_chained() is True</text>
      <text x="14" y="74" fill="#94a3b8" font-size="9">Tested in: <tspan fill="#f8fafc" font-family="monospace">code/tests/test_structural_lift.py</tspan></text>
      <text x="14" y="88" fill="#94a3b8" font-size="9">Chaining gate test: <tspan fill="#f8fafc" font-family="monospace">test_finite_lambda_ledger_valid_chain()</tspan></text>
    </g>
  </g>
</svg>
