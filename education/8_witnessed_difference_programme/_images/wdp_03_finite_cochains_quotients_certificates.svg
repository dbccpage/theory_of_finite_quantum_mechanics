<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-03</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Root P</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 04</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Exact L1</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 3: Finite Cochains, Quotients &amp; Certificates</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Degree-1 Window C^0 -&gt; C^1 -&gt; C^2, Signature (Φ₁, Γ₂, R_cl) &amp; Dual Certificates</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Φ₁ = inf ||h - d₀f||_J · Γ₂ = ||d₁h||₁</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH04 D01-02·P01-09·C01·N01-02</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Hollow Triangle (§4.5) &amp; Dual Circulation</text>
    
    <g transform="translate(20, 50)">
      <circle cx="80" cy="80" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="85" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">v0</text>
      <circle cx="200" cy="80" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="200" y="85" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">v1</text>
      <circle cx="140" cy="180" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="140" y="185" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">v2</text>

      <line x1="96" y1="80" x2="184" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <text x="140" y="72" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">e01: δ₀₁ = 1</text>

      <line x1="192" y1="94" x2="150" y2="166" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <text x="195" y="140" fill="#fbbf24" font-size="11" font-weight="700">e12: δ₁₂ = 1</text>

      <line x1="130" y1="168" x2="88" y2="94" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <text x="75" y="140" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">e20: δ₂₀ = 1</text>

      <rect x="250" y="60" width="135" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="317" y="82" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">Circulation ≠ 0</text>
      <text x="317" y="102" fill="#fca5a5" font-size="10" text-anchor="middle">∑ δ_e = 3 ⇒ not exact</text>

      <rect x="10" y="215" width="375" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="238" fill="#34d399" font-size="11" font-weight="700">• Dual certificate (CH04-P07 pattern):</text>
      <text x="35" y="258" fill="#cbd5e1" font-size="10.5">y = (1,1,1) is a circulation with |y_e| ≤ 1.</text>
      <text x="35" y="276" fill="#cbd5e1" font-size="10.5">For every f: ⟨y, d₀f⟩ = (f₁-f₀) + (f₂-f₁) + (f₀-f₂) = 0.</text>
      <text x="35" y="294" fill="#fbbf24" font-size="10.5">⟨y, δ⟩ = 3 ≤ Φ₁; f = 0 leaves mass 3, so Φ₁ = 3.</text>
      <text x="35" y="314" fill="#10b981" font-size="10.5">Hollow: Γ₂ = 0, ClosedResidual; filled: Γ₂ = 3.</text>
      <text x="35" y="334" fill="#94a3b8" font-size="9.5">Filled (01,12,02), δ = (1,1,0): Φ₁ = Γ₂ = 2, R_cl = 1 = ||d₁||.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Degree-1 Exact Sequence</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, monospace">0 → H¹ → Q¹ —κ¹→ im d₁ → 0 (CH04-P03)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Γ₂ ≤ ||d₁||_{J→1} Φ₁; splitting is not canonical</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (obstruction.py)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• exact_quotient_l1: exact two-phase simplex over ℚ, Bland.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• verify_quotient_certificate re-checks every field.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Lean, exact at row scope: CH04-P07 and CH04-P08.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Typed Refusals (obstruction.py)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Closure data undeclared → RefusalCode.NO_RULE, no class.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Class offered as ExactRepair → SCOPE_VIOLATION.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">CH04-N01 / N02: Nonclaims</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">ExactClass is not ExactRepair; ClosedResidual is not</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">StabilizedSurvivor. Growth of the complex never lowers</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">Φ₁: a change of carrier, not a repair.</text>
    </g>
  </g>
</svg>