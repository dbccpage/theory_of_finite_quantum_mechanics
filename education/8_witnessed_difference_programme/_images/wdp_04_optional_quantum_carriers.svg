<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-04</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Branch</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 05</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">U(1) Gauge</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 4: Optional Quantum-Capable Carriers</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Declared U(1)/U(N) Transport, Loop Holonomy &amp; Connection Laplacians</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">L_U = ∇_U* W ∇_U | Hermitian, PSD</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH05 D01 P01–P07 C01 O01 N01–N03 · CH03-P02</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">U(1) Gauge Connection &amp; Fiber Transport</text>
    
    <g transform="translate(20, 45)">
      <circle cx="80" cy="90" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="80" y="95" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">v0</text>
      <circle cx="220" cy="90" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="220" y="95" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">v1</text>
      <circle cx="150" cy="200" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="150" y="205" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">v2</text>

      <line x1="100" y1="90" x2="200" y2="90" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
      <text x="150" y="80" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">U₀₁ = e^{iθ}</text>

      <line x1="210" y1="105" x2="160" y2="185" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
      <text x="210" y="155" fill="#38bdf8" font-size="11" font-weight="700">U₁₂ = e^{iθ}</text>

      <line x1="140" y1="185" x2="90" y2="105" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
      <text x="85" y="155" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="end">U₂₀ = e^{iθ}</text>

      <circle cx="150" cy="125" r="22" fill="#030712" stroke="#a855f7" stroke-width="1.5" filter="url(#glowPurple)"/>
      <text x="150" y="128" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">e^{3iθ}</text>

      <rect x="10" y="235" width="375" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="258" fill="#34d399" font-size="11" font-weight="700">• Gauge covariance (WDP-CH05-P01) &amp; holonomy:</text>
      <text x="35" y="278" fill="#cbd5e1" font-size="10.5">Gauge g: V → U(1) acts by ψ(u) → g(u) ψ(u) on vertices.</text>
      <text x="35" y="296" fill="#cbd5e1" font-size="10.5">Transport: U_uv → g(v) U_uv g(u)⁻¹; ∇ covariant at v.</text>
      <text x="35" y="314" fill="#fbbf24" font-size="10.5">Hol = U_ek⋯U_e1: invariant in U(1), conjugated in U(N).</text>
      <text x="35" y="334" fill="#f43f5e" font-size="10.5">Branch, not trunk: every import is declared (CH05-D01).</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Declared Calculus, Bindings &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Connection Laplacian (WDP-CH05-P02)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">L_U = ∇_U* W ∇_U | ⟨ψ,L_Uψ⟩ = ⟨∇ψ,W∇ψ⟩ ≥ 0</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Kernel = covariantly constant fields when W ≻ 0 (P07).</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (quantum.py, CH05-D01/N01)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Non-unit phase → RefusalCode.NON_UNIT_PHASE</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• holonomy on an unclosed path → RefusalCode.OPEN_PATH</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Reconstruction request → RefusalCode.SCOPE_VIOLATION</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Refuted source draft (§5.13, WDP-CH05-P05)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• Source: σ_x σ_z = −U(xz). Correct: σ_x σ_z = −i σ_y.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• ω(x,z)/ω(z,x) = −1 survives every rephasing: [ω] ≠ 0.</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH05-N01: Nonclaim Fence</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">This chapter does not derive Hilbert space, unitarity as</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">dynamics, tensor composition, entanglement, observables,</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">the Born rule, collapse, or measurement.</text>
    </g>
  </g>
</svg>