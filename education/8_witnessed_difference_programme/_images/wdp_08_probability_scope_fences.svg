<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-08</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Fence</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 09</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Nonselection</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 8: Probability Scope Fences</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Five Notions, Born Nonselection, Finite Additivity, Orbit Weights &amp; Frequencies</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">p_i^(q) = |z_i|^q / Σ_j |z_j|^q</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH09-P01/N01/N02 CH06-D02 CH07-P03 CH08-P02</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Normalization Nonselection (CH09-P01, §9.2)</text>
    
    <g transform="translate(20, 45)">
      <!-- Dutch-Book Fence Graphic -->
      <rect x="15" y="20" width="160" height="90" rx="6" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
      <text x="95" y="45" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">q = 1 on |z| = (1, 2)</text>
      <text x="95" y="65" fill="#cbd5e1" font-size="10" text-anchor="middle">p = (1/3, 2/3)</text>
      <text x="95" y="85" fill="#34d399" font-size="9.5" text-anchor="middle">a probability vector</text>

      <rect x="215" y="20" width="160" height="90" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="295" y="45" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">q = 2 (Born exponent)</text>
      <text x="295" y="65" fill="#fca5a5" font-size="10" text-anchor="middle">p = (1/5, 4/5)</text>
      <text x="295" y="85" fill="#fbbf24" font-size="9.5" text-anchor="middle">not forced by normalizing</text>

      <line x1="190" y1="20" x2="190" y2="120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>

      <rect x="10" y="145" width="375" height="215" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="170" fill="#f8fafc" font-size="11" font-weight="700">• Five notions not to be collapsed (§9.1):</text>
      <text x="35" y="192" fill="#38bdf8" font-size="10.5">1. A finite normalized valuation on an exhibited partition;</text>
      <text x="35" y="210" fill="#cbd5e1" font-size="10.5">2. A limiting frequency in a repeatable trial model;</text>
      <text x="35" y="226" fill="#cbd5e1" font-size="10.5">3. A propensity or physical chance;</text>
      <text x="35" y="246" fill="#fbbf24" font-size="10.5">4. A Bayesian degree of belief;</text>
      <text x="35" y="262" fill="#fbbf24" font-size="10.5">5. A countably additive measure on a sigma-algebra.</text>
      <text x="35" y="282" fill="#f43f5e" font-size="10.5">Chapter 8 builds only the first; embeddings into the others</text>
      <text x="35" y="298" fill="#f43f5e" font-size="10.5">need extra data and are not unique in general.</text>
      <text x="35" y="322" fill="#34d399" font-size="10">⇒ §9.3: finite additivity supplies no infinite sigma-algebra.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Orbit Weights (CH08-P02, §9.7)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">H-invariant m: W → ℝ≥0  ⟷  functions W/H → ℝ≥0</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Symmetry fixes weights within an orbit, not across orbits.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Interval Accumulation (CH07-P03, §9.6)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Independent edges: path sum ∈ [Σ ℓ_e, Σ u_e] (Minkowski).</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Disjoint intervals on two a→b paths refute exactness.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Overlapping intervals: inconclusive at that resolution.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Countermodel: Order Kept, Duration Changed (§9.5)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• a≺b≺c ↦ u, v, v keeps u≺v but erases the second step.</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Tallies 1, 2 both map to u→v: not duration respecting (CH06-D02).</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH09-N01 · N02: Nonclaim Fences</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">A finite witness valuation is not chance, frequency</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">convergence, exchangeability, a continuum measure, or the</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">Born rule. Symmetric equal weights ≠ universal indifference.</text>
    </g>
  </g>
</svg>