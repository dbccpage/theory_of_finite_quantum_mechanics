<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30363d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#58a6ff" filter="url(#glow)">Level 00: Witnessed Difference &amp; Primitive Distinction</text>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>
  <text x="400" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">W = (X, D, a, b, w)   D ⊆ X × X   ¬D(x,x)   w : D(a,b)</text>
  <rect x="80" y="100" width="180" height="80" rx="8" fill="url(#boxGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="170" y="145" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#79c0ff">Carrier X</text>
  <text x="170" y="162" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">State space</text>
  <rect x="540" y="100" width="180" height="80" rx="8" fill="url(#boxGrad)" stroke="#7ee787" stroke-width="1.5"/>
  <text x="630" y="145" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7ee787">Witness w</text>
  <text x="630" y="162" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">w : D(a,b)</text>
  <rect x="310" y="100" width="180" height="80" rx="8" fill="url(#boxGrad)" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">Relation D</text>
  <text x="400" y="162" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Irreflexive: ¬D(x,x)</text>
  <line x1="260" y1="140" x2="310" y2="140" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="285" y="132" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">D ⊆ X×X</text>
  <line x1="490" y1="140" x2="540" y2="140" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="515" y="132" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">exhibits</text>
  <rect x="200" y="250" width="400" height="60" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="285" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0883e">CODA-01: a ≠ b (Inhabited Distinction)</text>
  <text x="400" y="340" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">Substituting a=b into D(a,b) gives D(a,a), contradicting irreflexivity.</text>
  <rect x="80" y="380" width="280" height="60" rx="8" fill="url(#boxGrad)" stroke="#484f58" stroke-width="1.5"/>
  <text x="220" y="415" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#484f58">Detector δ : X × X → V</text>
  <text x="220" y="432" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">δ(x,x) = 0ᵥ and δ(a,b) ≠ 0ᵥ</text>
  <rect x="440" y="380" width="280" height="60" rx="8" fill="url(#boxGrad)" stroke="#484f58" stroke-width="1.5"/>
  <text x="580" y="415" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#484f58">Derived Relation D_δ</text>
  <text x="580" y="432" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">D_δ(x,y) iff δ(x,y) ≠ 0ᵥ</text>
  <line x1="360" y1="410" x2="440" y2="410" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="402" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">defines</text>
  <text x="400" y="470" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e">AuthorityEffect: None</text>
</svg>
