<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-11</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Ladder</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 12</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">5 Levels</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 11: The Observation Ladder</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Interaction -&gt; Registration -&gt; Typed Witness -&gt; Re-comparison -&gt; Evaluator Acceptance</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">Obs=(i,g,w,m,e) · accepted: 1–4 verify, e=Accept</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Rows: CH12-D01 · CH12-P01 (typing)</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Five Levels of Observation (§12.1)</text>
    
    <g transform="translate(20, 45)">
      <!-- Levels 1-5, top to bottom -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="365" height="42" rx="5" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
        <text x="15" y="25" fill="#10b981" font-size="11" font-weight="700">1. Interaction: a declared coupling occurs</text>
        <text x="345" y="25" fill="#34d399" font-size="10" font-weight="600" text-anchor="end">field i</text>
      </g>
      <line x1="190" y1="52" x2="190" y2="70" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <g transform="translate(10, 72)">
        <rect x="0" y="0" width="365" height="42" rx="5" fill="#030712" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="15" y="25" fill="#fbbf24" font-size="11" font-weight="700">2. Registration: a record carrier changes</text>
        <text x="345" y="25" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="end">field g</text>
      </g>
      <line x1="190" y1="114" x2="190" y2="132" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrA)"/>

      <g transform="translate(10, 134)">
        <rect x="0" y="0" width="365" height="42" rx="5" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="700">3. Typed witness · 4. Re-comparison</text>
        <text x="345" y="25" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="end">fields w, m</text>
      </g>
      <line x1="190" y1="176" x2="190" y2="194" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>

      <g transform="translate(10, 196)">
        <rect x="0" y="0" width="365" height="42" rx="5" fill="#030712" stroke="#64748b" stroke-width="1.5"/>
        <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="700">5. Evaluator acceptance: status Accept</text>
        <text x="345" y="25" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">field e</text>
      </g>

      <rect x="10" y="255" width="365" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="278" fill="#34d399" font-size="11" font-weight="700">• Failure is localizable (§12.2):</text>
      <text x="35" y="298" fill="#cbd5e1" font-size="10.5">No coupling, no registration, misregistration,</text>
      <text x="35" y="316" fill="#cbd5e1" font-size="10.5">no retention, profile drift, evaluator refusal, rejection,</text>
      <text x="35" y="334" fill="#fbbf24" font-size="10.5">or undetermined. Keep them apart: a single Boolean loses</text>
      <text x="35" y="352" fill="#f43f5e" font-size="10.5">information unless the loss is deliberate (§12.2).</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Receipts, Refusals &amp; the Authority Fence</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Receipt and Accepted E-Observation</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">Receipt: e ∈ {Accept, Reject, Refuse, Undetermined}</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">Accepted E-observation: levels 1–4 verify and e = Accept.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Executable binding (observation.py, notebook 040)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• classify_observation: levels in order; first failure refuses.</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">• Re-access re-hashes the retained mark (verify_witness).</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Accept needs accepting standing and the same evaluator id.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusals (RefusalCode, observation.py)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• NO_INTERACTION · NO_REGISTRATION · COUPLING_MISMATCH</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• NO_WITNESS · NO_ACCEPTING_EVALUATOR</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">Observation ≠ Authorization (CH12-P01)</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">ObservationAccept implies neither AuthStanding nor Promote:</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">those belong to a separate authority object, and no</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">coercion between these types is defined.</text>
    </g>
  </g>
</svg>