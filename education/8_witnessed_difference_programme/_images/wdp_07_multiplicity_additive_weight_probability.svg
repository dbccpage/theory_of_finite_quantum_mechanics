<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/></marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.2"/>
    <text x="35" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">WDP-07</text>

    <rect x="78" y="0" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="113" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Valuation</text>

    <rect x="156" y="0" width="60" height="24" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1.2"/>
    <text x="186" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Ch. 08</text>

    <rect x="224" y="0" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="276" y="16" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Witness Mass</text>

    <rect x="337" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="405" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 7: Multiplicity, Additive Weight &amp; Probability</text>
    <text x="0" y="71" fill="#94a3b8" font-size="11.5" font-weight="400">Matching Before Number, Witness Mass, Finite Normalization &amp; Conditional L¹</text>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="336" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Ledger Rows &amp; Signature (v0.4.0)</text>
      <text x="12" y="38" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">p(A_i) = μ(A_i) / μ(W),  μ(W) &gt; 0</text>
      <text x="12" y="58" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">CH08-D01 · CH08-P01 · O01 · C01</text>
    </g>
  </g>

  <!-- Left Main Card -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Declared Partition: Masses (1, 1, 2, 4) (§8.6)</text>
    
    <g transform="translate(20, 45)">
      <!-- Root state -->
      <circle cx="60" cy="130" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="60" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">W</text>

      <!-- Branches -->
      <line x1="76" y1="125" x2="164" y2="75" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <text x="115" y="88" fill="#fbbf24" font-size="11" font-weight="700">μ(A) = 2</text>

      <line x1="76" y1="135" x2="164" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrC)"/>
      <text x="115" y="180" fill="#fbbf24" font-size="11" font-weight="700">μ(B) = 6</text>

      <circle cx="180" cy="70" r="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="180" y="75" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">A</text>
      <circle cx="180" cy="190" r="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="180" y="195" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">B</text>

      <!-- Normalization Box -->
      <rect x="230" y="105" width="155" height="55" rx="6" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
      <text x="307" y="127" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">μ(W) = 8 &gt; 0</text>
      <text x="307" y="145" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">p: 1/4 + 3/4 = 1</text>

      <rect x="10" y="240" width="375" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="263" fill="#34d399" font-size="11" font-weight="700">• What the example shows (§8.2–§8.4):</text>
      <text x="35" y="283" fill="#cbd5e1" font-size="10.5">μ(A ⊔ B) = μ(A) + μ(B) for disjoint A, B: additive by construction.</text>
      <text x="35" y="301" fill="#cbd5e1" font-size="10.5">Refine B: p(w₃) + p(w₄) = 1/4 + 1/2 = 3/4 = p(B).</text>
      <text x="35" y="319" fill="#fbbf24" font-size="10.5">Refinement needs a transport rule that preserves total mass.</text>
      <text x="35" y="339" fill="#f43f5e" font-size="10.5">No random-trial or frequency reading without a sampling model.</text>
    </g>
  </g>

  <!-- Right Main Card -->
  <g transform="translate(483, 115)">
    <rect x="0" y="0" width="425" height="430" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="425" height="34" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="700">Formal Calculus, Obligations &amp; Fences</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">Normalized Valuation (CH08-P01, §8.3)</text>
      <rect x="0" y="22" width="385" height="52" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="42" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">p(A_i) ≥ 0,  Σ_i p(A_i) = 1  (μ(W) &gt; 0)</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10">On a declared finite partition; physical reading open.</text>

      <text x="0" y="96" fill="#10b981" font-size="11.5" font-weight="700">Conditional L¹ Aggregation (CH08-C01, §8.5)</text>
      <rect x="0" y="103" width="385" height="74" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="122" fill="#f8fafc" font-size="10.5">• Decomposable, homogeneous, relabeling-invariant, faithful,</text>
      <text x="12" y="139" fill="#f8fafc" font-size="10.5">  replica extensive; Aczél + density imports ⇒ 𝒜 = c Σ_e a_e, c &gt; 0.</text>
      <text x="12" y="156" fill="#f8fafc" font-size="10.5">• Max, mean, capped sum, L^p (p &gt; 1) fail replica extensivity.</text>

      <text x="0" y="198" fill="#f43f5e" font-size="11.5" font-weight="700">Executable Refusal (probability.py)</text>
      <rect x="0" y="205" width="385" height="60" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="225" fill="#fca5a5" font-size="10.5">• No occurrences → RefusalCode.EMPTY_SPACE (μ(W) = 0)</text>
      <text x="12" y="243" fill="#fca5a5" font-size="10.5">• Event outside support → EVENT_OUTSIDE_SPACE</text>

      <text x="0" y="285" fill="#a855f7" font-size="11.5" font-weight="700">WDP-CH08-O01: Open Claim (Atomicity)</text>
      <rect x="0" y="292" width="385" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="312" fill="#cbd5e1" font-size="10.5">Which finite additive witness valuations come from stable</text>
      <text x="12" y="329" fill="#cbd5e1" font-size="10.5">atomic masses? Open. A claim that L¹ is forced, not chosen,</text>
      <text x="12" y="346" fill="#38bdf8" font-size="10.5">rests on it. Squared L² stays additive on orthogonal parts.</text>
    </g>
  </g>
</svg>