  protected_skeleton:
    - refusal_reason
    - unmutated_state_digest
    - permitted_next_set
    - receipt_signature
  erased_structure:
    - failed_execution_scratchpad
  non_claims:
    - does not claim refusal fixes the underlying obstruction
