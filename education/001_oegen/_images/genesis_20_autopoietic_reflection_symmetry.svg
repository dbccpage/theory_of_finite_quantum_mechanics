<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 20: Genesis 20</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Autopoiesis: Cycle Breaker</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorem: symmetry_floor</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 20: Autopoietic Reflection &amp; Symmetry Floor</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">State Reflection, Autonomous Loop Breaking, and the Invariance of Renaming-Respecting Symmetry</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Autopoietic Loop Breaking &amp; Symmetry Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">s_t &#8773; s_{t+k} &#8743; progress(s_t, s_{t+k}) = 0</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Action &#8594; ForceBreakAction(Loop)   [cycle_detected]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Breaking Autopoietic Loops (Breaking.cycle_detected):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Detects identical machine state digests across execution</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">distances, terminating runaway self-referential expansion.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; The Symmetry Floor Theorem (symmetry_floor):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">A deterministic, renaming-respecting lift cannot</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">break initial carrier symmetry without exogenous bias.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Demand Generation Capacity (generation_never_dries):</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Structural potential never completely vanishes,</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">establishing endless ascent under external challenge intake.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Autopoietic Reflection Loop &amp; Cycle Interrupter</text>

    <g transform="translate(40, 45)">
      <!-- Loop Node 1: State S_t -->
      <circle cx="80" cy="70" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="80" y="75" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">S_t</text>

      <!-- Loop Node 2: State S_{t+1} -->
      <circle cx="280" cy="70" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="280" y="75" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">S_{t+1}</text>

      <!-- Forward Arc -->
      <path d="M 108 55 Q 180 20 252 55" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <text x="180" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">step(op)</text>

      <!-- Return Arc (Recurrence) -->
      <path d="M 252 85 Q 180 120 108 85" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrowAmber)"/>
      <text x="180" y="115" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">s_t &#8773; s_{t+k} (Cycle)</text>

      <!-- Detector Box -->
      <rect x="100" y="145" width="160" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <text x="180" y="167" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Cycle Detector</text>
      <text x="180" y="184" fill="#94a3b8" font-size="9" text-anchor="middle">Zero Residual Delta Witness</text>

      <!-- Break Line to Out -->
      <line x1="180" y1="200" x2="180" y2="235" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

      <!-- Break Action Box -->
      <rect x="80" y="240" width="200" height="50" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="180" y="260" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Forced Interruption / Lift</text>
      <text x="180" y="277" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Terminates Infinite Loop</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">CYCLE_BREAK_LEAN_PROVED</tspan> | Module: <tspan fill="#e2e8f0">Breaking.lean</tspan> | Invariant: <tspan fill="#38bdf8">symmetry_floor</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-020 Analog</tspan></text>
  </g>

</svg>
