<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="65" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Level 21: Genesis 21</text>

    <rect x="140" y="0" width="170" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="225" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Ceiling: 4D Combinatorial</text>

    <rect x="320" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="402" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Demo: LadderGeneral.d4</text>

    <rect x="495" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="565" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 21: Combinatorial 4-Simplex &amp; Bianchi Holonomy Ceiling</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Terminal Combinatorial Boundary, 4D Simplex Boundaries, and the Zero-Metric Horizon</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Combinatorial 4D Simplex Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">&#963;^4 &#8712; K_5 &#8743; &#8706;&#8706;&#963;^4 = 0 &#8743; metric(&#963;) = Undefined</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Carrier &#8866; CombinatorialBoundary(&#963;^4)   [d4_demo]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Terminal Base-Tower Frontier (Level 21):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">MSS-021 marks the boundary of the classical discrete base.</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">Subsequent levels (N &#8805; 22) enter the trans-base operadic regime.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Combinatorial Without Metric:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">The 19L57G1 core proves combinatorial 4-simplex properties</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">but cleanly refuses metric lengths, Gram matrices, and curvature.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Holonomy Loop Residual:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Combinatorial loops around hinges are tracked,</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">confirming topological closure without Riemannian geometry.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (4-Simplex Graph) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Combinatorial 4-Simplex (K_5) Skeleton</text>

    <g transform="translate(40, 45)">
      <!-- Pentagram / Complete Graph K_5 vertices -->
      <!-- Center (190, 130), Radius 85 -->
      <!-- V0: top (190, 45) -->
      <!-- V1: right-top (270, 103) -->
      <!-- V2: right-bottom (240, 198) -->
      <!-- V3: left-bottom (140, 198) -->
      <!-- V4: left-top (110, 103) -->

      <!-- Edges between all 5 vertices (10 edges) -->
      <line x1="190" y1="45" x2="270" y2="103" stroke="#334155" stroke-width="1.5"/>
      <line x1="270" y1="103" x2="240" y2="198" stroke="#334155" stroke-width="1.5"/>
      <line x1="240" y1="198" x2="140" y2="198" stroke="#334155" stroke-width="1.5"/>
      <line x1="140" y1="198" x2="110" y2="103" stroke="#334155" stroke-width="1.5"/>
      <line x1="110" y1="103" x2="190" y2="45" stroke="#334155" stroke-width="1.5"/>

      <!-- Inner Chords -->
      <line x1="190" y1="45" x2="240" y2="198" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="190" y1="45" x2="140" y2="198" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="270" y1="103" x2="140" y2="198" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="270" y1="103" x2="110" y2="103" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="240" y1="198" x2="110" y2="103" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,2"/>

      <!-- Nodes -->
      <circle cx="190" cy="45" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="190" y="49" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">v_0</text>

      <circle cx="270" cy="103" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="270" y="107" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">v_1</text>

      <circle cx="240" cy="198" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="240" y="202" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">v_2</text>

      <circle cx="140" cy="198" r="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <text x="140" y="202" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">v_3</text>

      <circle cx="110" cy="103" r="16" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="110" y="107" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">v_4</text>

      <!-- Central Badge -->
      <rect x="115" y="235" width="150" height="28" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="190" y="253" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">10 Edges &#183; 5 Tetrahedra</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">TERMINAL_BASE_CEILING</tspan> | Module: <tspan fill="#e2e8f0">LadderGeneral.lean</tspan> | Geometry: <tspan fill="#fbbf24">Zero Continuous Metric</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-021 Analog</tspan></text>
  </g>

</svg>
