<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 03: Cost</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Discrete Cost Formula</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Factor of 2 Invariant</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 3: Discrete Cost Formula &amp; The Factor of 2</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Exact Asymmetric Discrete Path Lower Bound Matched by Explicit Construction</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Cost Function Theorem (fewest_changes)</text>

    <!-- Rule Fraction -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="370" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="185" y="28" fill="#93c5fd" font-size="11.5" font-weight="600" text-anchor="middle" font-family="monospace">Cost(s_0 &#8594; s_res) = |V_res| + |E_res| - (|V_0| + |E_0|)</text>
      <text x="185" y="48" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">+ 2 &#183; D_destroyed</text>
      <line x1="20" y1="58" x2="350" y2="58" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="185" y="78" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle" font-family="monospace">LowerBound &#8804; PathCost   [fewest_changes_cost]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Discrete Path Cost:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Proved as a discrete lower bound in Lean 4,</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">matched by an explicit graph transition trajectory.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; The Factor of 2:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Removing an existing distinction costs 2 steps</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">(remove + identify). Reappears blind in Derivation 16.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; No LP Duality:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Represents an asymmetric discrete step cost from a fixed</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">seed, not continuous metric or Linear Programming duality.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Cost Balance Decomposition</text>

    <g transform="translate(30, 45)">
      <!-- Box 1: Vertices Growth -->
      <rect x="15" y="10" width="370" height="55" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="35" y="32" fill="#a5b4fc" font-size="11" font-weight="700">&#916;V = |V_res| - |V_0|</text>
      <text x="35" y="48" fill="#94a3b8" font-size="9.5">Net added terms (cost = +1 per term adjoined)</text>

      <!-- Box 2: Edges Growth -->
      <rect x="15" y="75" width="370" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="35" y="97" fill="#38bdf8" font-size="11" font-weight="700">&#916;E = |E_res| - |E_0|</text>
      <text x="35" y="113" fill="#94a3b8" font-size="9.5">Net added relations (cost = +1 per asserted relation)</text>

      <!-- Box 3: Destroyed Distinctions (Factor 2) -->
      <rect x="15" y="140" width="370" height="65" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="35" y="162" fill="#fbbf24" font-size="11" font-weight="700">+ 2 &#183; D_destroyed</text>
      <text x="35" y="180" fill="#fde68a" font-size="9.5">Penalty for collapsing active distinctions &#183; Non-linear cost barrier</text>
      <text x="35" y="195" fill="#fde68a" font-size="9">Blind stability: reappears in Derivation 16 as Cost = Size + 2 &#183; Record</text>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="225" width="370" height="45" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="200" y="245" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Primal Lower Bound = Minimal Path Witness</text>
      <text x="200" y="260" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Derivations 1, 9, 16: Discrete Minimality Without Floats</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">COST_LOWER_BOUND_LEAN</tspan> | Factor: <tspan fill="#fbbf24">2 &#183; D_destroyed</tspan> | Metric: <tspan fill="#38bdf8">Discrete Integer Cost</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-003 Analog</tspan></text>
  </g>

</svg>
