<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <defs>
    <!-- Background & Grid -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1.0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stroke-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stroke-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="940" height="580" fill="#0b0f19"/>
  <rect width="940" height="580" fill="url(#bg-glow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>

  <!-- Top Header / Navigation -->
  <g id="header" transform="translate(40, 30)">
    <rect x="0" y="0" width="860" height="60" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="8" height="60" rx="4" fill="url(#amber-glow)"/>
    
    <text x="25" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="1.5">LEVEL 17 • HERMETIC PACKAGING</text>
    <text x="25" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Per-Derivation Packaging &amp; Prompt Sandbox Isolation</text>
    
    <rect x="680" y="15" width="160" height="30" rx="15" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="695" cy="30" r="4" fill="#f59e0b" filter="url(#glow-amber)"/>
    <text x="708" y="35" font-family="monospace" font-size="11" font-weight="600" fill="#fde68a">HERMETIC CELL</text>
  </g>

  <!-- Left Column: Formal Specification -->
  <g id="left-col" transform="translate(40, 105)">
    <rect x="0" y="0" width="370" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 350 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">FORMAL SPECIFICATION (LEAN 4)</text>

    <!-- Code Block -->
    <rect x="15" y="48" width="340" height="150" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="70" font-family="monospace" font-size="11" fill="#64748b">-- Hermetic Packaging &amp; Sandboxing</text>
    <text x="25" y="90" font-family="monospace" font-size="11" fill="#f43f5e">structure <tspan fill="#38bdf8">HermeticDerivation</tspan> where</text>
    <text x="35" y="108" font-family="monospace" font-size="11" fill="#e2e8f0">  prompt_hash : SHA256Digest</text>
    <text x="35" y="126" font-family="monospace" font-size="11" fill="#e2e8f0">  env_quarantine : QuarantineInvariant</text>
    <text x="35" y="144" font-family="monospace" font-size="11" fill="#e2e8f0">  pure_receipt : JSONReplayTrace</text>
    <text x="25" y="165" font-family="monospace" font-size="11" fill="#10b981">theorem <tspan fill="#e2e8f0">hermetic_reproducibility</tspan> :</text>
    <text x="35" y="183" font-family="monospace" font-size="11" fill="#a855f7">  ZeroCrossPollution (deriv i) (deriv j)</text>

    <!-- Axiomatic Invariants -->
    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">ESTATE ARCHITECTURE / INVARIANTS</text>
    
    <g transform="translate(20, 235)">
      <circle cx="5" cy="10" r="3" fill="#f59e0b"/>
      <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Blind Seed Enclosure:</tspan> 21 isolated packages</text>
      <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Each run starts from pristine primordial prompt</text>

      <circle cx="5" cy="45" r="3" fill="#06b6d4"/>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Deterministic Digest:</tspan> SHA-256 state tracking</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Exact JSON traces commit each state transition</text>

      <circle cx="5" cy="80" r="3" fill="#10b981"/>
      <text x="18" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Toolchain Sandbox:</tspan> No global state leakage</text>
      <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Windows pytest basetemp and Lean hermetic build</text>

      <circle cx="5" cy="115" r="3" fill="#8b5cf6"/>
      <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">MSS-017 Parity:</tspan> Canonical packaging format</text>
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Uniform packaging metadata across all blind runs</text>
    </g>
  </g>

  <!-- Right Column: Operational Diagram -->
  <g id="right-col" transform="translate(430, 105)">
    <rect x="0" y="0" width="470" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 450 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">HERMETIC CELL SANDBOX ARCHITECTURE</text>

    <!-- Visual Sandboxes -->
    <g transform="translate(25, 55)">
      
      <!-- Derivation Cell 1 -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="195" height="125" rx="6" fill="#030712" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="12" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">SANDBOX CELL: DERIV_01</text>
        
        <rect x="15" y="35" width="165" height="30" rx="4" fill="#1e293b"/>
        <text x="25" y="54" font-family="monospace" font-size="10" fill="#38bdf8">Seed: H3V7N5QF_01</text>
        
        <rect x="15" y="75" width="165" height="36" rx="4" fill="#0f172a"/>
        <text x="25" y="90" font-family="monospace" font-size="9" fill="#94a3b8">Trace: 32 steps</text>
        <text x="25" y="103" font-family="monospace" font-size="9" fill="#10b981">Status: Proved (MSS-002)</text>
      </g>

      <!-- Derivation Cell 2 -->
      <g transform="translate(225, 10)">
        <rect x="0" y="0" width="195" height="125" rx="6" fill="#030712" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="12" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">SANDBOX CELL: DERIV_02</text>
        
        <rect x="15" y="35" width="165" height="30" rx="4" fill="#1e293b"/>
        <text x="25" y="54" font-family="monospace" font-size="10" fill="#38bdf8">Seed: H3V7N5QF_02</text>
        
        <rect x="15" y="75" width="165" height="36" rx="4" fill="#0f172a"/>
        <text x="25" y="90" font-family="monospace" font-size="9" fill="#94a3b8">Trace: 48 steps</text>
        <text x="25" y="103" font-family="monospace" font-size="9" fill="#10b981">Status: Proved (MSS-002)</text>
      </g>

      <!-- Firewall Barrier Between Cells -->
      <line x1="210" y1="10" x2="210" y2="135" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      <circle cx="210" cy="72" r="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="210" y="76" font-family="monospace" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">✕</text>

      <!-- Sealed Packaging Engine -->
      <g transform="translate(60, 175)">
        <rect x="0" y="0" width="300" height="135" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <text x="15" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">HERMETIC PACKAGING ARCHIVE</text>
        
        <g transform="translate(15, 38)">
          <rect x="0" y="0" width="270" height="24" rx="4" fill="#030712"/>
          <text x="10" y="16" font-family="monospace" font-size="10" fill="#a7f3d0">📦 SHA256SUMS Manifest &amp; Tape</text>
          
          <rect x="0" y="30" width="270" height="24" rx="4" fill="#030712"/>
          <text x="10" y="46" font-family="monospace" font-size="10" fill="#a7f3d0">🔒 Lakefile Hermetic Dependencies</text>

          <rect x="0" y="60" width="270" height="24" rx="4" fill="#030712"/>
          <text x="10" y="76" font-family="monospace" font-size="10" fill="#a7f3d0">📜 Clean JSON Replay Artifact</text>
        </g>
      </g>

      <!-- Downward commitment arrows -->
      <line x1="97" y1="135" x2="150" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <line x1="322" y1="135" x2="270" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    </g>
  </g>

  <!-- Bottom Operational Status Bar -->
  <g id="status-bar" transform="translate(40, 520)">
    <rect x="0" y="0" width="860" height="35" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="22" font-family="monospace" font-size="11" fill="#64748b">INVARIANT:</text>
    <text x="95" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">Hermetic Prompt &amp; Sandbox Quarantine</text>

    <text x="370" y="22" font-family="monospace" font-size="11" fill="#64748b">PARITY ANCHOR:</text>
    <text x="470" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#10b981">MSS-017 (Packaging Isolation)</text>

    <rect x="730" y="8" width="115" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="740" y="22" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">SEALED ENVELOPE</text>
  </g>
</svg>
