<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 14: Bounds</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Bounded Search</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Finite Step Limits</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 14: Bounded Search &amp; Step Horizon Ceilings</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Explicit Step Budgets, Frontier Resource Fences, and Finite Search Guarantees</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Search Horizon Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Depth(P) &#8804; B_steps &#8743; |Terms(s)| &#8804; B_terms</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">EvaluateBounded(P, B)   [StepHorizon]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Declared Step Bounds:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Every automated derivation in H3V7N5QF is bounded</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">by an explicit search depth ceiling (typically 3–15 steps).</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Frontier Enumeration:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Enumerates neighbors up to the declared budget bound;</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">avoids unbounded general complexity traps.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-014 Structural Alignment:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Aligns with MSS-014's bounded quantifier and step horizon,</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">verifying resource bounds before declaring termination.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Bounded Search Horizon Envelope</text>

    <g transform="translate(30, 45)">
      <!-- Horizon Fence Box -->
      <rect x="15" y="15" width="370" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="35" y="38" fill="#38bdf8" font-size="11.5" font-weight="700">Search Horizon Envelope (Depth &#8804; B)</text>

      <!-- Inside Search Tree -->
      <circle cx="200" cy="65" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="200" y="69" fill="#c7d2fe" font-size="10" font-weight="700" text-anchor="middle">s_0</text>

      <line x1="190" y1="78" x2="140" y2="115" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="210" y1="78" x2="260" y2="115" stroke="#38bdf8" stroke-width="1.5"/>

      <circle cx="140" cy="125" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="140" y="129" fill="#38bdf8" font-size="9" text-anchor="middle">s_1</text>
      <circle cx="260" cy="125" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="260" y="129" fill="#38bdf8" font-size="9" text-anchor="middle">s_2</text>

      <line x1="130" y1="137" x2="90" y2="165" stroke="#34d399" stroke-width="1.5"/>
      <line x1="150" y1="137" x2="175" y2="165" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="90" cy="172" r="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="175" cy="172" r="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>

      <!-- Fence Boundary Label -->
      <text x="200" y="185" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Horizon Boundary Fence</text>

      <!-- Bottom Card -->
      <rect x="15" y="215" width="370" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="200" y="235" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">Budget Exhaustion &#8800; Proved Impossibility</text>
      <text x="200" y="250" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Search terminates cleanly with exported frontier</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">BOUNDED_HORIZON_ACTIVE</tspan> | Limits: <tspan fill="#e2e8f0">Depth &#8804; B</tspan> | Export: <tspan fill="#38bdf8">Frontier Recorded</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-014 Analog</tspan></text>
  </g>

</svg>
