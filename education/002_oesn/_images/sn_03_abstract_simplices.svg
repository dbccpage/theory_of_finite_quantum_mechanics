<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(3): separating data under a stated cost</title>
<desc id="desc">Challenge: Require two admitted data to be observationally separated. Item cost: One new form plus one instance attains cost two. Arity refinement: Lexicographic cost (2,1) selects a unary mark up to isomorphism.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(3): separating data under a stated cost</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Challenge</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Require two admitted data to be</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">observationally separated.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Item cost</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">One new form plus one instance</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">attains cost two.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Arity refinement</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Lexicographic cost (2,1) selects</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">a unary mark up to isomorphism.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
