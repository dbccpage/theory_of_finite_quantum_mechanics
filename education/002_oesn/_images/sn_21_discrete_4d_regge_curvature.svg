<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E21: Independent Composition of Repairs</title>
<desc id="desc">Graph cycles: Four vertices, five edges; cycle space dimension two. Independent boundaries: Two independent degree-two boundaries give H₁=0. Duplicate boundaries: Two equal boundary columns have rank one; dim H₁=1.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E21: Independent Composition of Repairs</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Graph cycles</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Four vertices, five edges; cycle</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">space dimension two.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Independent boundaries</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Two independent degree-two</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">boundaries give H₁=0.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Duplicate boundaries</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Two equal boundary columns have</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">rank one; dim H₁=1.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
