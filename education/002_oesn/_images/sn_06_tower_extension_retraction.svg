<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(6): extension with exact partial recovery</title>
<desc id="desc">Section: u(x) = (x,0) Old image: r̂(x,0) = accepted(x) Novel coordinate: r̂(x,y) = NON_DESCENT when y is nonzero.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(6): extension with exact partial recovery</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Section</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">u(x) = (x,0)</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Old image</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">r̂(x,0) = accepted(x)</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Novel coordinate</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">r̂(x,y) = NON_DESCENT when y is</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">nonzero.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
