<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E09: a formal arrow involution</title>
<desc id="desc">Formal arrow: (source, target, opaque label, reversal bit) Reverse: Swap endpoints and toggle the reversal bit. Repeat: Reversing twice returns the entire original record.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E09: a formal arrow involution</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Formal arrow</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">(source, target, opaque label,</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">reversal bit)</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Reverse</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Swap endpoints and toggle the</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">reversal bit.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Repeat</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Reversing twice returns the</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">entire original record.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
