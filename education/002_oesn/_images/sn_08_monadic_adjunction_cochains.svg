<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E08: cochain optimization and categorical adjunctions</title>
<desc id="desc">Primal: Minimize sum ω_e |c_e − (d₀g)_e|. Dual: Maximize cᵀy with d₀ᵀy=0 and |y_e|≤ω_e. Certificate: Primal and dual feasibility plus equal values proves optimality.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E08: cochain optimization and categorical adjunctions</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Primal</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Minimize sum ω_e |c_e −</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">(d₀g)_e|.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Dual</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Maximize cᵀy with d₀ᵀy=0 and</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">|y_e|≤ω_e.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Certificate</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Primal and dual feasibility plus</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">equal values proves optimality.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
