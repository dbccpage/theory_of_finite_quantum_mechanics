<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E17: Lossless Dialect Transport</title>
<desc id="desc">Distinct constructors: Pair(a,b) and Edge(a,b) are different source values. Tagged encoding: Keep a constructor tag and ordered arguments. Recovery: decode(encode(x))=x; a checksum cannot repair a lost tag.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E17: Lossless Dialect Transport</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Distinct constructors</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Pair(a,b) and Edge(a,b) are</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">different source values.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Tagged encoding</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Keep a constructor tag and</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">ordered arguments.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Recovery</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">decode(encode(x))=x; a checksum</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">cannot repair a lost tag.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
