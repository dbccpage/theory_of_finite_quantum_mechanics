<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(4): closure under a specified policy</title>
<desc id="desc">Policy: Issue remaining pair demands using the declared closure policy. Closed target: All targeted pairs separated: active separation demands are empty. History: Retain response receipts. No universal carrier size follows.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(4): closure under a specified policy</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Policy</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Issue remaining pair demands</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">using the declared closure</text>
<text x="46" y="182" font-family="sans-serif" font-size="16" fill="#243b53">policy.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Closed target</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">All targeted pairs separated:</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">active separation demands are</text>
<text x="396" y="182" font-family="sans-serif" font-size="16" fill="#243b53">empty.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">History</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Retain response receipts. No</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">universal carrier size follows.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
