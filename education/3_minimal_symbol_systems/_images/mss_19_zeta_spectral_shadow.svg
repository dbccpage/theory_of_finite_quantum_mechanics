<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-19</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(19)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 19: Zeta Spectral Shadow Quarantine (MSS-19)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Bass-Ihara determinant Z_G(u)^-1 = det(I - Au + Qu^2), integer characteristic polynomials, and spectral fences</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;zeta type dim &lt;traces&gt; &lt;poly &lt;deg c&gt;&gt; &lt;fence&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Bass-Ihara Polynomial Display -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="420" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="210" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Bass-Ihara Characteristic Polynomial</text>

          <!-- Curve visualization -->
          <path d="M 40 180 C 120 40, 200 240, 380 70" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)"/>
          <circle cx="165" cy="155" r="5" fill="#f43f5e"/>
          <text x="165" y="140" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">Pole (Fenced)</text>

          <line x1="30" y1="160" x2="390" y2="160" stroke="#334155" stroke-width="1.5"/>
          <line x1="210" y1="40" x2="210" y2="210" stroke="#334155" stroke-width="1.5"/>

          <text x="210" y="232" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">Z_G(u)&#8315;&#185; = det(I - A u + Q u&#178;)</text>
        </g>

        <!-- Integer Polynomial Coeffs &amp; Quarantine -->
        <g transform="translate(480, 20)">
          <rect x="0" y="0" width="300" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="150" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Exact Integer Vector &#8484;[u]</text>

          <g transform="translate(15, 50)">
            <rect x="0" y="0" width="270" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="135" y="24" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Certified Integer Invariant</text>
            <text x="135" y="46" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">P(u) = 1 - c&#8321;u + c&#8322;u&#178; - ...</text>
          </g>

          <g transform="translate(15, 125)">
            <rect x="0" y="0" width="270" height="95" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
            <text x="135" y="24" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">POLE POLLUTION FIREWALL</text>
            <text x="135" y="44" fill="#fca5a5" font-size="10" text-anchor="middle">Forbids floating-point root rounding.</text>
            <text x="135" y="62" fill="#fca5a5" font-size="10" text-anchor="middle">An Ihara pole rounded to a float is</text>
            <text x="135" y="80" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">HARD REJECTED</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::ZetaQuarantine</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_ZETA_POLE_POLLUTION</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Zeta functions evaluate static invariants but lack autopoietic loop detection; forced lift to MSS-20.</text>
  </g>
</svg>