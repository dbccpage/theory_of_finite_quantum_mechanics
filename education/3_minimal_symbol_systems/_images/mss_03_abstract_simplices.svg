<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-03</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(3)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 3: Abstract Simplices (MSS-3)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Oriented k-simplices, face operators, and exact boundary nilpotency d^2 = 0</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;2 a b c&gt; | &lt;3 a b c d&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- 4 Simplex Display Panels -->
        <!-- 0-Simplex (Vertex) -->
        <g transform="translate(20, 20)">
          <rect x="0" y="0" width="160" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="80" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">0-Simplex &lt;0 a&gt;</text>
          <circle cx="80" cy="90" r="14" fill="#38bdf8"/>
          <text x="80" y="95" fill="#000" font-size="11" font-weight="700" text-anchor="middle">a</text>
          <text x="80" y="145" fill="#64748b" font-size="10" text-anchor="middle">Dim = 0</text>
          <text x="80" y="165" fill="#64748b" font-size="10" text-anchor="middle">Single Point</text>
        </g>

        <!-- 1-Simplex (Segment) -->
        <g transform="translate(195, 20)">
          <rect x="0" y="0" width="180" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="90" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">1-Simplex &lt;1 a b&gt;</text>
          <circle cx="35" cy="90" r="10" fill="#38bdf8"/>
          <text x="35" y="94" fill="#000" font-size="10" font-weight="700" text-anchor="middle">a</text>
          <circle cx="145" cy="90" r="10" fill="#38bdf8"/>
          <text x="145" y="94" fill="#000" font-size="10" font-weight="700" text-anchor="middle">b</text>
          <line x1="45" y1="90" x2="135" y2="90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <text x="90" y="145" fill="#64748b" font-size="10" text-anchor="middle">&#8706;&#963; = b - a</text>
          <text x="90" y="165" fill="#64748b" font-size="10" text-anchor="middle">Dim = 1</text>
        </g>

        <!-- 2-Simplex (Triangle) -->
        <g transform="translate(390, 20)">
          <rect x="0" y="0" width="200" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="100" y="24" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2-Simplex &lt;2 a b c&gt;</text>
          <!-- Triangle fill and boundary -->
          <polygon points="100,50 35,120 165,120" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="100" cy="50" r="8" fill="#38bdf8"/>
          <circle cx="35" cy="120" r="8" fill="#38bdf8"/>
          <circle cx="165" cy="120" r="8" fill="#38bdf8"/>
          <text x="100" y="44" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">a</text>
          <text x="25" y="125" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">b</text>
          <text x="175" y="125" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">c</text>
          <text x="100" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">&#8706;&#10216;abc&#10217; = [bc]-[ac]+[ab]</text>
          <text x="100" y="175" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Oriented 2-Face</text>
        </g>

        <!-- 3-Simplex (Tetrahedron) -->
        <g transform="translate(605, 20)">
          <rect x="0" y="0" width="195" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="97" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">3-Simplex &lt;3 a b c d&gt;</text>
          <!-- Tetrahedron lines -->
          <polygon points="97,45 35,115 160,115" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
          <line x1="97" y1="45" x2="97" y2="135" stroke="#818cf8" stroke-width="1.5"/>
          <line x1="35" y1="115" x2="97" y2="135" stroke="#818cf8" stroke-width="1.5"/>
          <line x1="160" y1="115" x2="97" y2="135" stroke="#818cf8" stroke-width="1.5"/>
          <circle cx="97" cy="45" r="7" fill="#818cf8"/>
          <circle cx="35" cy="115" r="7" fill="#818cf8"/>
          <circle cx="160" cy="115" r="7" fill="#818cf8"/>
          <circle cx="97" cy="135" r="7" fill="#818cf8"/>
          <text x="97" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">Dim = 3 (Solid Cell)</text>
          <text x="97" y="185" fill="#64748b" font-size="10" text-anchor="middle">4 Triangular Faces</text>
        </g>

        <!-- Nilpotence Banner -->
        <g transform="translate(20, 235)">
          <rect x="0" y="0" width="780" height="45" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
          <text x="390" y="27" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">BOUNDARY NILPOTENCE THEOREM: &#8706;&#8347; &#8728; &#8706;&#8347;&#8314;&#185; = 0 (The boundary of a boundary is zero)</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::SimplexSolver</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_UNBOUNDED_MASS</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Abstract simplices lack explicit combinatorial boundary traversal graphs (1-skeletons); forced lift to MSS-4.</text>
  </g>
</svg>