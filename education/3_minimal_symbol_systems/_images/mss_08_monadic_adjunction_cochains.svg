<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-08</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(8)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 8: Monadic Adjunction &amp; Exact l^1 Harmonic Cochains (MSS-8)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Categorical adjunctions, primal potential cuts Phi_1(c), dual circulation y*, and zero duality gap</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;adj &lt;src tgt&gt;&gt; &lt;dual_receipt&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Duality Balance Scale Diagram -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="440" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="220" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Primal-Dual Duality Gap Balance Scale</text>

          <!-- Scale Fulcrum &amp; Beam -->
          <line x1="80" y1="100" x2="360" y2="100" stroke="#f8fafc" stroke-width="3"/>
          <polygon points="220,100 205,140 235,140" fill="#64748b"/>
          <line x1="200" y1="140" x2="240" y2="140" stroke="#64748b" stroke-width="2"/>

          <!-- Left Pan: Primal -->
          <line x1="80" y1="100" x2="80" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
          <rect x="20" y="135" width="120" height="60" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="80" y="155" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Primal Cut &#934;&#8321;(c)</text>
          <text x="80" y="175" fill="#f8fafc" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">min ||c - d&#8320;g||&#8321;</text>

          <!-- Right Pan: Dual -->
          <line x1="360" y1="100" x2="360" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
          <rect x="300" y="135" width="120" height="60" rx="6" fill="#059669" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
          <text x="360" y="155" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Dual Circulation y*</text>
          <text x="360" y="175" fill="#f8fafc" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">d&#8320;&#7488; y* = 0</text>

          <!-- Zero Gap Balance Receipt -->
          <g transform="translate(140, 160)">
            <rect x="0" y="0" width="160" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)"/>
            <text x="80" y="22" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">GAP = 0 (Certified)</text>
          </g>

          <text x="220" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">Primal Mass = Dual Mass &#8658; Zero Rational Duality Gap</text>
        </g>

        <!-- Monadic Adjunction Invariant -->
        <g transform="translate(510, 20)">
          <rect x="0" y="0" width="270" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="135" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Adjunction (F &#8867; G)</text>

          <g transform="translate(15, 50)">
            <text x="120" y="20" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Unit &amp; Counit Equalities</text>
            <text x="120" y="45" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">&#951; : id &#8658; G &#8728; F</text>
            <text x="120" y="70" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">&#949; : F &#8728; G &#8658; id</text>
          </g>

          <line x1="15" y1="140" x2="255" y2="140" stroke="#334155" stroke-width="1"/>
          <text x="135" y="165" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Concentric Dispatcher</text>
          <text x="135" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">16 typed cochain families</text>
          <text x="135" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">within 4 concentric zones</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::ConcentricDispatcher</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_ZONE_VIOLATION</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Directed processes are asymmetric; time reversal and adjoint duality require involution; forced lift to MSS-9.</text>
  </g>
</svg>