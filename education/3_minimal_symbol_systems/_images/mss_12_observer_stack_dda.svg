<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-12</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(12)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 12: Observer Stack &amp; DDA Event Records (MSS-12)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">14-tuple deterministic event cassette, Kleene 3-valued truth logic, and fuel budget consumption</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;dda budget c_in s_in op cost ...&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- DDA 14-Tuple Cassette -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="440" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="220" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">DDA 14-Tuple Deterministic Event Record</text>

          <!-- Cassette Grid -->
          <g transform="translate(20, 45)">
            <rect x="0" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="45" y="18" fill="#64748b" font-size="9" text-anchor="middle">c_in</text>
            <text x="45" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">&#10216;c_0&#10217;</text>

            <rect x="100" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="145" y="18" fill="#64748b" font-size="9" text-anchor="middle">s_in</text>
            <text x="145" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">&#10216;s_0&#10217;</text>

            <rect x="200" y="0" width="100" height="40" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
            <text x="250" y="18" fill="#fbbf24" font-size="9" text-anchor="middle">op (Operator)</text>
            <text x="250" y="32" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">REDUCE_L1</text>

            <rect x="310" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="355" y="18" fill="#f43f5e" font-size="9" text-anchor="middle">cost (Fuel)</text>
            <text x="355" y="32" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">&#916;F = 4</text>
          </g>

          <g transform="translate(20, 100)">
            <rect x="0" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="45" y="18" fill="#64748b" font-size="9" text-anchor="middle">c_out</text>
            <text x="45" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">&#10216;c_1&#10217;</text>

            <rect x="100" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="145" y="18" fill="#64748b" font-size="9" text-anchor="middle">s_out</text>
            <text x="145" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">&#10216;s_1&#10217;</text>

            <rect x="200" y="0" width="100" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="250" y="18" fill="#64748b" font-size="9" text-anchor="middle">obs_out</text>
            <text x="250" y="32" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">&#10216;0&#10217; (Clear)</text>

            <rect x="310" y="0" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="355" y="18" fill="#64748b" font-size="9" text-anchor="middle">&#916;progress</text>
            <text x="355" y="32" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">+1</text>
          </g>

          <!-- Fuel Meter -->
          <g transform="translate(20, 160)">
            <text x="0" y="18" fill="#94a3b8" font-size="11">Fuel Consumption:</text>
            <rect x="120" y="6" width="280" height="14" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <rect x="122" y="8" width="180" height="10" rx="3" fill="#38bdf8"/>
            <text x="260" y="34" fill="#64748b" font-size="10" text-anchor="middle">Remaining: 65 / 100</text>
          </g>
        </g>

        <!-- Kleene 3-Valued Logic -->
        <g transform="translate(510, 20)">
          <rect x="0" y="0" width="270" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="135" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Kleene 3-Valued Logic</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="230" height="40" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <circle cx="25" cy="20" r="10" fill="#f43f5e"/>
            <text x="25" y="24" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">0</text>
            <text x="50" y="24" fill="#fca5a5" font-size="11" font-weight="600">False / Refuted</text>
          </g>

          <g transform="translate(20, 100)">
            <rect x="0" y="0" width="230" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <circle cx="25" cy="20" r="10" fill="#10b981"/>
            <text x="25" y="24" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">1</text>
            <text x="50" y="24" fill="#6ee7b7" font-size="11" font-weight="600">True / Certified</text>
          </g>

          <g transform="translate(20, 150)">
            <rect x="0" y="0" width="230" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
            <circle cx="25" cy="20" r="10" fill="#fbbf24"/>
            <text x="25" y="24" fill="#000" font-size="10" font-weight="700" text-anchor="middle">2</text>
            <text x="50" y="24" fill="#fde68a" font-size="11" font-weight="600">Unknown / Horizon</text>
          </g>

          <text x="135" y="222" fill="#64748b" font-size="10" text-anchor="middle">Uncertainty is typed, not guessed</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::ObserverStack</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_OBSERVER_INADEQUATE</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Single-event logs lack unbounded expansion loop detection and alternation hierarchies; forced lift to MSS-13.</text>
  </g>
</svg>