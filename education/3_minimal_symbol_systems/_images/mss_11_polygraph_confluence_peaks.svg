<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-11</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(11)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 11: Polygraph Rewrites &amp; Confluence Peaks (MSS-11)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">2-Polygraph term rewriting, Church-Rosser diamond property, and critical peak joins</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;polygraph digest&gt; &lt;steps ...&gt; &lt;peak&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Church-Rosser Confluence Diamond -->
        <g transform="translate(60, 20)">
          <rect x="0" y="0" width="420" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="210" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Church-Rosser Confluence Diamond</text>

          <!-- Apex Term s -->
          <circle cx="210" cy="60" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="210" y="65" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">s</text>

          <!-- Left Branch Term t -->
          <circle cx="110" cy="130" r="18" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
          <text x="110" y="135" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">t</text>

          <!-- Right Branch Term u -->
          <circle cx="310" cy="130" r="18" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
          <text x="310" y="135" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">u</text>

          <!-- Confluent Join Term j -->
          <circle cx="210" cy="200" r="18" fill="#059669" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
          <text x="210" y="205" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">j</text>

          <!-- Arrows -->
          <line x1="195" y1="72" x2="125" y2="118" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <text x="145" y="85" fill="#38bdf8" font-size="10" font-weight="600">Rule &#945;</text>

          <line x1="225" y1="72" x2="295" y2="118" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <text x="275" y="85" fill="#38bdf8" font-size="10" font-weight="600">Rule &#946;</text>

          <line x1="125" y1="142" x2="195" y2="188" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
          <line x1="295" y1="142" x2="225" y2="188" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
          <text x="210" y="235" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Confluent Normal Form Join</text>
        </g>

        <!-- 2-Polygraph Digest Card -->
        <g transform="translate(500, 20)">
          <rect x="0" y="0" width="280" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="140" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Polygraph Digest</text>

          <g transform="translate(15, 50)">
            <text x="125" y="20" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Position-Keyed Redexes</text>
            <text x="125" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Explicit AST node path addressing</text>
            <text x="125" y="60" fill="#94a3b8" font-size="10" text-anchor="middle">Replays each substitution rule</text>
          </g>

          <line x1="15" y1="130" x2="265" y2="130" stroke="#334155" stroke-width="1"/>
          <g transform="translate(15, 145)">
            <rect x="0" y="0" width="250" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="125" y="26" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Peak Replay Receipt</text>
            <text x="125" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Both arms converge cleanly</text>
            <text x="125" y="62" fill="#38bdf8" font-size="10" text-anchor="middle">Zero critical non-joinable forks</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::PolygraphRewriter</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_CONFLUENCE_FAILED</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Deterministic term rewriting lacks an explicit observer model, fuel budget, and 3-valued logic; forced lift to MSS-12.</text>
  </g>
</svg>