<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-01</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(1)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 1: Symbol Genesis (MSS-1)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Single mark introduction against the ground, 1 degree of freedom, cut boundary</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;a&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Background void line -->
        <line x1="60" y1="150" x2="420" y2="150" stroke="#334155" stroke-dasharray="4 4" stroke-width="2"/>
        <text x="70" y="135" fill="#64748b" font-size="11">Void Substrate &lt;&gt;</text>

        <!-- Cut and Generator Mark -->
        <circle cx="240" cy="150" r="32" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)"/>
        <circle cx="240" cy="150" r="10" fill="#38bdf8"/>
        <text x="240" y="210" fill="#f8fafc" font-size="16" font-family="ui-monospace, monospace" font-weight="700" text-anchor="middle">&lt;a&gt;</text>
        <text x="240" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">Generator Mark (1 DOF)</text>

        <!-- Cut Boundary Equation -->
        <g transform="translate(60, 40)">
          <rect x="0" y="0" width="360" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="180" y="28" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">&#8706;&#10216;a&#10217; = &#10216;&#10217; (Cut boundary resolves to void)</text>
          <text x="180" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Distinction is grounded: &#10216;a&#10217; &#8800; &#10216;&#10217;</text>
        </g>

        <!-- Presentation Gauge Note -->
        <g transform="translate(460, 40)">
          <rect x="0" y="0" width="320" height="230" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
          <text x="16" y="28" fill="#a5b4fc" font-size="12" font-weight="700">Presentation Gauge Invariant</text>
          <text x="16" y="54" fill="#94a3b8" font-size="11">In isolation, &lt;a&gt; and &lt;b&gt; share identical</text>
          <text x="16" y="72" fill="#94a3b8" font-size="11">boundary: &#8706;&#10216;a&#10217; = &#8706;&#10216;b&#10217; = &#10216;&#10217;.</text>
          <text x="16" y="96" fill="#94a3b8" font-size="11">Aut({*}) acts transitively on singletons.</text>
          <text x="16" y="114" fill="#94a3b8" font-size="11">Label choice is pure presentation gauge.</text>

          <line x1="16" y1="135" x2="304" y2="135" stroke="#334155" stroke-width="1"/>
          <text x="16" y="158" fill="#fbbf24" font-size="11" font-weight="600">Defect: Relational Void</text>
          <text x="16" y="178" fill="#94a3b8" font-size="11">Cannot express directed transition a &#8594; b</text>
          <text x="16" y="196" fill="#94a3b8" font-size="11">or self-loop. Forced lift to MSS-2.</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::BinaryParser</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_BINARY_CUT_MALFORMED</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Rule 2 commands directed relations; isolated mark &lt;a&gt; has zero relational capacity; forced lift to MSS-2.</text>
  </g>
</svg>