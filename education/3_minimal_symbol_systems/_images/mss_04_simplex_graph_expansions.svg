<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-04</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(4)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 4: Simplex Graph Expansions (MSS-4)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Explicit 1-skeleton graph projections X^(1) = (V,E), complete cliques, and context congruence</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;v a b c&gt; &lt;e &lt;ab&gt; &lt;bc&gt; &lt;ca&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Graph 1: K3 Triangle Graph -->
        <g transform="translate(50, 20)">
          <rect x="0" y="0" width="330" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="165" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">1-Skeleton Projection: K_3</text>
          
          <circle cx="165" cy="70" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="165" y="75" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">v0</text>
          <circle cx="85" cy="170" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="85" y="175" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">v1</text>
          <circle cx="245" cy="170" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
          <text x="245" y="175" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">v2</text>

          <!-- Directed Edges -->
          <line x1="150" y1="84" x2="100" y2="156" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="105" y1="170" x2="225" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="230" y1="156" x2="180" y2="84" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

          <text x="165" y="215" fill="#94a3b8" font-size="11" text-anchor="middle">V = {v0, v1, v2} | E = {e01, e12, e20}</text>
        </g>

        <!-- Incidence Matrix &amp; Congruence -->
        <g transform="translate(420, 20)">
          <rect x="0" y="0" width="360" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="180" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Incidence Boundary Operator B_1</text>
          
          <!-- Matrix Display -->
          <g transform="translate(60, 50)">
            <text x="50" y="20" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">e01  e12  e20</text>
            <text x="10" y="45" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace">v0 [ -1    0   +1 ]</text>
            <text x="10" y="70" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace">v1 [ +1   -1    0 ]</text>
            <text x="10" y="95" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace">v2 [  0   +1   -1 ]</text>
          </g>

          <line x1="20" y1="160" x2="340" y2="160" stroke="#334155" stroke-width="1"/>
          <text x="180" y="185" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Context Congruence: Pass</text>
          <text x="180" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">All 1-faces match declared orientation</text>
          <text x="180" y="222" fill="#fbbf24" font-size="10" text-anchor="middle">Defect: No edge length or metric data</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::ContextCongruence</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_CONTEXT_INCONGRUENT</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Combinatorial 1-skeletons have topology but zero metric data (no lengths or angles); forced lift to MSS-5.</text>
  </g>
</svg>