<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-09</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(9)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 9: Dagger Monads &amp; Profunctor Reversal (MSS-9)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Involutive categories (M^dagger)^dagger = M, trace-invariant time reversal, and adjoint arrows</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;dagger id&gt; &lt;rev &lt;e e_rev&gt;...&gt; &lt;trace&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- Dagger Reversal Symmetry Plane -->
        <g transform="translate(50, 20)">
          <rect x="0" y="0" width="420" height="240" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
          <text x="210" y="26" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">Time Reversal &amp; Adjoint Dagger Invariant</text>

          <!-- Central Mirror Axis -->
          <line x1="210" y1="45" x2="210" y2="210" stroke="#c084fc" stroke-dasharray="4 4" stroke-width="2"/>
          <text x="210" y="226" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Involution Axis (&amp;dagger;)</text>

          <!-- Left Side: Forward Morphism -->
          <circle cx="80" cy="80" r="16" fill="#0284c7"/>
          <text x="80" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">a</text>
          <circle cx="160" cy="80" r="16" fill="#0284c7"/>
          <text x="160" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">b</text>
          <line x1="98" y1="80" x2="140" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
          <text x="120" y="70" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">r(a,b)</text>

          <!-- Right Side: Reversed Adjoint Morphism -->
          <circle cx="260" cy="80" r="16" fill="#6366f1"/>
          <text x="260" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">b</text>
          <circle cx="340" cy="80" r="16" fill="#6366f1"/>
          <text x="340" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">a</text>
          <line x1="278" y1="80" x2="320" y2="80" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
          <text x="300" y="70" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">r&#8224;(b,a)</text>

          <!-- Second Involution -->
          <g transform="translate(60, 130)">
            <rect x="0" y="0" width="300" height="50" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
            <text x="150" y="30" fill="#f8fafc" font-size="13" font-family="ui-monospace, monospace" font-weight="700" text-anchor="middle">(M&#8224;)&#8224; = M (Dagger Involution)</text>
          </g>
        </g>

        <!-- Dagger Auditor Specs -->
        <g transform="translate(500, 20)">
          <rect x="0" y="0" width="280" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="140" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Dagger Auditor Gate</text>

          <g transform="translate(15, 50)">
            <text x="125" y="20" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Trace Invariance Audit</text>
            <text x="125" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">Tr(M&#8224; M) = Tr(M M&#8224;)</text>
            <text x="125" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">Reversal retains all edge obstructions</text>
          </g>

          <line x1="15" y1="140" x2="265" y2="140" stroke="#334155" stroke-width="1"/>
          <text x="140" y="165" fill="#f43f5e" font-size="11" font-weight="600" text-anchor="middle">Rejection Case</text>
          <text x="140" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">Reversing endpoints while</text>
          <text x="140" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">dropping obstruction is rejected</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::DaggerAuditor</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_DAGGER_ASYMMETRY</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Operational processes can generate unverified continuous or heuristic spectral claims; forced lift to MSS-10.</text>
  </g>
</svg>