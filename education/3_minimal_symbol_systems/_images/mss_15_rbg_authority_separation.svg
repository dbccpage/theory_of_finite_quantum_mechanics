<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="url(#bgGlow)"/>
  <rect width="880" height="540" fill="url(#grid)"/>
  <rect x="16" y="16" width="848" height="508" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Header -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="86" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MSS-15</text>

    <rect x="94" y="0" width="56" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="122" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">S(15)</text>

    <rect x="158" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="226" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.2">Level 15: R-B-G Master Horizon &amp; Authority Separation (MSS-15)</text>
    <text x="0" y="71" fill="#94a3b8" font-size="12" font-weight="400">Red-Blue-Green tripartite security boundaries and one-way verifiable promotion gates</text>

    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="286" height="74" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Wire Grammar Packet</text>
      <text x="12" y="44" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace" font-weight="600">&lt;&lt;horizon &lt;red prop&gt; &lt;blue audit&gt; &lt;green tok&gt;&gt;&gt;</text>
    </g>
  </g>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Visualization Canvas -->
  <g transform="translate(32, 132)">
    
        <!-- 3 Color Cards: RED, BLUE, GREEN -->
        <!-- RED Card -->
        <g transform="translate(20, 25)">
          <rect x="0" y="0" width="230" height="230" rx="8" fill="#450a0a" fill-opacity="0.5" stroke="#f43f5e" stroke-width="2"/>
          <rect x="15" y="15" width="60" height="24" rx="4" fill="#f43f5e"/>
          <text x="45" y="31" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">RED</text>
          <text x="15" y="65" fill="#fca5a5" font-size="13" font-weight="700">Untrusted Proposal</text>
          <text x="15" y="90" fill="#94a3b8" font-size="11">Generative LLM proposal</text>
          <text x="15" y="110" fill="#94a3b8" font-size="11">Candidate rewrite steps</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">External agent hypotheses</text>
          <rect x="15" y="170" width="200" height="35" rx="6" fill="#1f1d2b" stroke="#f43f5e" stroke-width="1"/>
          <text x="115" y="192" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>
        </g>

        <!-- Arrow 1 with Check Gate -->
        <g transform="translate(255, 125)">
          <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
        </g>

        <!-- BLUE Card -->
        <g transform="translate(295, 25)">
          <rect x="0" y="0" width="230" height="230" rx="8" fill="#0c4a6e" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
          <rect x="15" y="15" width="60" height="24" rx="4" fill="#0284c7"/>
          <text x="45" y="31" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">BLUE</text>
          <text x="15" y="65" fill="#7dd3fc" font-size="13" font-weight="700">Host Verification Gate</text>
          <text x="15" y="90" fill="#94a3b8" font-size="11">Deterministic Pytest oracle</text>
          <text x="15" y="110" fill="#94a3b8" font-size="11">Lean 4 Lake kernel check</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">Exact rational arithmetic</text>
          <rect x="15" y="170" width="200" height="35" rx="6" fill="#1f1d2b" stroke="#38bdf8" stroke-width="1"/>
          <text x="115" y="192" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Audit Receipt Minting</text>
        </g>

        <!-- Arrow 2 with Gate -->
        <g transform="translate(530, 125)">
          <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
        </g>

        <!-- GREEN Card -->
        <g transform="translate(570, 25)">
          <rect x="0" y="0" width="230" height="230" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="2"/>
          <rect x="15" y="15" width="65" height="24" rx="4" fill="#059669"/>
          <text x="47" y="31" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">GREEN</text>
          <text x="15" y="65" fill="#6ee7b7" font-size="13" font-weight="700">Terminal Authority</text>
          <text x="15" y="90" fill="#94a3b8" font-size="11">Verified proof token</text>
          <text x="15" y="110" fill="#94a3b8" font-size="11">Canonical registry entry</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">Certified state admission</text>
          <rect x="15" y="170" width="200" height="35" rx="6" fill="#1f1d2b" stroke="#10b981" stroke-width="1"/>
          <text x="115" y="192" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Certified Admission</text>
        </g>
        
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(32, 468)">
    <line x1="0" y1="0" x2="816" y2="0" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="0" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Pipeline Evaluator:</text>
    <text x="120" y="22" fill="#38bdf8" font-size="11" font-family="ui-monospace, monospace" font-weight="600">Evaluator::AuthorityGovernor</text>

    <text x="380" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary Error:</text>
    <text x="470" y="22" fill="#f43f5e" font-size="11" font-family="ui-monospace, monospace" font-weight="600">ERR_UNVERIFIED_PROMOTION</text>

    <text x="0" y="44" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Forcing Invariant:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Tripartite authority records govern single-system transitions, not infinite filtered colimits; forced lift to MSS-16.</text>
  </g>
</svg>