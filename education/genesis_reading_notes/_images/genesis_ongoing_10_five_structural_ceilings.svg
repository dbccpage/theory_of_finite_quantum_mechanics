<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 10: Ceilings</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Structural Limits</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Five Hard Ceilings</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 10: Structural Capacity Fences &amp; The Five Ceilings</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Formal Architectural Boundaries Demarcating Native Derivation from Supplied Structure</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Structural Capacity Boundary Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">P &#8834; BaseCalculus &#8743; Law &#8713; {LoopBan}</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">&#172;DerivableInternally(Law)   [SuppliedRequired]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Native vs Supplied Demarcation:</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Higher structures in MSS-022+ (sheaves, topos, fibers)</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">cannot emerge autonomously from the base seed.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Declared Laws Are Exogenous Inputs:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Equational laws, transitivity, and metric geometries</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">must be admitted as explicit supplied constraints.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-010 Claim Hygiene Alignment:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Refuses overclaims of emergent spacetime physics;</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">fences the relational carrier to its exact capabilities.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Five Ceilings) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">The Five Hard Structural Ceilings</text>

    <g transform="translate(25, 45)">
      <!-- Ceiling 1 -->
      <rect x="15" y="5" width="380" height="42" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
      <text x="25" y="24" fill="#a5b4fc" font-size="10.5" font-weight="700">1. Only Binary Relations:</text>
      <text x="25" y="38" fill="#94a3b8" font-size="9">Pairs only &#183; No hyperedges or 3-way interactions natively</text>

      <!-- Ceiling 2 -->
      <rect x="15" y="53" width="380" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="25" y="72" fill="#38bdf8" font-size="10.5" font-weight="700">2. Only One Sort:</text>
      <text x="25" y="86" fill="#94a3b8" font-size="9">Single type of terms &#183; No multi-sorted typing or dependent fibers</text>

      <!-- Ceiling 3 -->
      <rect x="15" y="101" width="380" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="25" y="120" fill="#fbbf24" font-size="10.5" font-weight="700">3. No Laws Beyond Loop Ban:</text>
      <text x="25" y="134" fill="#94a3b8" font-size="9">No transitivity, no symmetry, no equational rewrites</text>

      <!-- Ceiling 4 -->
      <rect x="15" y="149" width="380" height="42" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
      <text x="25" y="168" fill="#34d399" font-size="10.5" font-weight="700">4. Whole Numbers Only:</text>
      <text x="25" y="182" fill="#94a3b8" font-size="9">Cardinals only &#183; No continuous real numbers or metrics</text>

      <!-- Ceiling 5 -->
      <rect x="15" y="197" width="380" height="42" rx="4" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
      <text x="25" y="216" fill="#f43f5e" font-size="10.5" font-weight="700">5. No Computing Changes:</text>
      <text x="25" y="230" fill="#fca5a5" font-size="9">Transitions add/remove &#183; They do not evaluate functions</text>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="247" width="380" height="32" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="205" y="268" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Higher Levels Require Declared Law Imports</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">CEILING_FENCED</tspan> | Classification: <tspan fill="#e2e8f0">Report W1-G10</tspan> | Scope: <tspan fill="#38bdf8">Loop-Free Relational</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-010 Analog</tspan></text>
  </g>

</svg>
