<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <defs>
    <!-- Background & Grid -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1.0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="940" height="580" fill="#0b0f19"/>
  <rect width="940" height="580" fill="url(#bg-glow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>

  <!-- Top Header / Navigation -->
  <g id="header" transform="translate(40, 30)">
    <rect x="0" y="0" width="860" height="60" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="8" height="60" rx="4" fill="url(#violet-glow)"/>
    
    <text x="25" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8b5cf6" letter-spacing="1.5">LEVEL 16 • DERIVATION LATTICE</text>
    <text x="25" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Inter-Derivation Commuting Lattice &amp; Poset Confluence</text>
    
    <rect x="690" y="15" width="150" height="30" rx="15" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="705" cy="30" r="4" fill="#8b5cf6" filter="url(#glow-violet)"/>
    <text x="718" y="35" font-family="monospace" font-size="11" font-weight="600" fill="#c4b5fd">POSET: 21-SEEDS</text>
  </g>

  <!-- Left Column: Formal Specification -->
  <g id="left-col" transform="translate(40, 105)">
    <rect x="0" y="0" width="370" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 350 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">FORMAL SPECIFICATION (LEAN 4)</text>

    <!-- Code Block -->
    <rect x="15" y="48" width="340" height="150" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="70" font-family="monospace" font-size="11" fill="#64748b">-- 21 Blind Derivations Lattice</text>
    <text x="25" y="90" font-family="monospace" font-size="11" fill="#f43f5e">structure <tspan fill="#38bdf8">DerivPoset</tspan> where</text>
    <text x="35" y="108" font-family="monospace" font-size="11" fill="#e2e8f0">  seeds : Fin 21 → Derivation</text>
    <text x="35" y="126" font-family="monospace" font-size="11" fill="#e2e8f0">  embed : ∀ i j, i ≤ j → seeds i ↪ seeds j</text>
    <text x="35" y="144" font-family="monospace" font-size="11" fill="#e2e8f0">  confluent : CommutingSquare seeds</text>
    <text x="25" y="165" font-family="monospace" font-size="11" fill="#10b981">theorem <tspan fill="#e2e8f0">lattice_join_unique</tspan> :</text>
    <text x="35" y="183" font-family="monospace" font-size="11" fill="#a855f7">  ∀ d1 d2, JoinBound d1 d2 ∧ MSS016</text>

    <!-- Axiomatic Invariants -->
    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">ESTATE ARCHITECTURE / INVARIANTS</text>
    
    <g transform="translate(20, 235)">
      <circle cx="5" cy="10" r="3" fill="#8b5cf6"/>
      <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">21-Derivation Forest:</tspan> Independent blind seeds</text>
      <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Derivations 1 to 21 run in 30-100 min clean sessions</text>

      <circle cx="5" cy="45" r="3" fill="#06b6d4"/>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Commuting Diamond:</tspan> Step2.toStep3 embeddings</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Morphisms commute across derivation boundary</text>

      <circle cx="5" cy="80" r="3" fill="#10b981"/>
      <text x="18" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Retract Preservation:</tspan> MSS-016 lattice coherence</text>
      <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Universal join state bounds carrier expansion</text>

      <circle cx="5" cy="115" r="3" fill="#f59e0b"/>
      <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Zero Cross-Leakage:</tspan> Sealed prompt environment</text>
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Derivations do not observe sibling proof state</text>
    </g>
  </g>

  <!-- Right Column: Operational Diagram -->
  <g id="right-col" transform="translate(430, 105)">
    <rect x="0" y="0" width="470" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 450 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">COMMUTING DERIVATION POSET &amp; JOIN LATTICE</text>

    <!-- Lattice Nodes and Diamonds -->
    <g transform="translate(30, 60)">
      
      <!-- Derivation 1 Root -->
      <g transform="translate(180, 20)">
        <rect x="-45" y="-18" width="90" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="0" y="4" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Seed Deriv 1</text>
      </g>

      <!-- Level 2 Branching Seeds -->
      <g transform="translate(80, 90)">
        <rect x="-45" y="-18" width="90" height="36" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="0" y="4" font-family="monospace" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">Seed Deriv 2</text>
      </g>

      <g transform="translate(280, 90)">
        <rect x="-45" y="-18" width="90" height="36" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="0" y="4" font-family="monospace" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">Seed Deriv 3</text>
      </g>

      <!-- Connecting arrows from root -->
      <line x1="150" y1="38" x2="105" y2="72" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
      <line x1="210" y1="38" x2="255" y2="72" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

      <!-- Level 3 Intermediate Confluence -->
      <g transform="translate(180, 160)">
        <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
        <text x="0" y="4" font-family="monospace" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">Commute Join (2,3)</text>
      </g>

      <!-- Confluence arrows -->
      <line x1="105" y1="108" x2="150" y2="142" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
      <line x1="255" y1="108" x2="210" y2="142" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

      <!-- Lower Poset Forest (Seeds 4..21) -->
      <g transform="translate(70, 230)">
        <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
        <text x="0" y="4" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Derivs 4..9</text>
      </g>

      <g transform="translate(180, 230)">
        <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
        <text x="0" y="4" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Derivs 10..15</text>
      </g>

      <g transform="translate(290, 230)">
        <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
        <text x="0" y="4" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Derivs 16..21</text>
      </g>

      <!-- Lines to lower forest -->
      <line x1="150" y1="178" x2="85" y2="215" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="180" y1="178" x2="180" y2="215" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="210" y1="178" x2="275" y2="215" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Universal Poset Sup -->
      <g transform="translate(180, 300)">
        <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
        <text x="0" y="4" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">LATTICE SUPREMUM</text>
        <text x="0" y="18" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">21-Seed Complete Poset</text>
      </g>

      <line x1="70" y1="245" x2="135" y2="285" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <line x1="180" y1="245" x2="180" y2="280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <line x1="290" y1="245" x2="225" y2="285" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    </g>
  </g>

  <!-- Bottom Operational Status Bar -->
  <g id="status-bar" transform="translate(40, 520)">
    <rect x="0" y="0" width="860" height="35" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="22" font-family="monospace" font-size="11" fill="#64748b">INVARIANT:</text>
    <text x="95" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">21-Derivation Poset Commutation</text>

    <text x="350" y="22" font-family="monospace" font-size="11" fill="#64748b">PARITY ANCHOR:</text>
    <text x="450" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#8b5cf6">MSS-016 (Lattice Commutation)</text>

    <rect x="730" y="8" width="115" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="740" y="22" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">CONFLUENT POS</text>
  </g>
</svg>
