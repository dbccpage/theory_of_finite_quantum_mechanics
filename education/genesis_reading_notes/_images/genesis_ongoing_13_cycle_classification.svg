<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 13: Cycles</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle Frontiers</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorems: Reach*.cycles</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 13: Cycle Classification &amp; Halting Frontiers</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Detection of Graph Cycles, Progress Frontier Bounds, and Primitive Recursive Halting</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Cycle Detection &amp; Halting Rule</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">Reach s_0 s_k &#8743; Cycle(s_k) &#8743; frontier_exhausted</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Halt(s_k) &#8743; OutputFrontier   [ReachCycles]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Finite Cycle Classification (Reach*.cycles):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Detects repeating configurations along reachable</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">trajectories, bounding recursive expansions.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Exact Progress Frontiers:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Every run maintains an explicit frontier of unvisited</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">candidate neighbors, preventing unbounded expansion traps.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; MSS-013 Structural Alignment:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Provides the finite cycle and halting guarantee</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">required by Level 13 alternation ladders.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Trajectory Frontier &amp; Cycle Recognition</text>

    <g transform="translate(40, 50)">
      <!-- Node sequence -->
      <circle cx="50" cy="50" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="50" y="54" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">s_0</text>

      <line x1="68" y1="50" x2="132" y2="50" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

      <circle cx="150" cy="50" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="150" y="54" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">s_1</text>

      <line x1="168" y1="50" x2="232" y2="50" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

      <circle cx="250" cy="50" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="250" y="54" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">s_2</text>

      <!-- Cycle Arc back to s_1 -->
      <path d="M 250 32 Q 200 5 155 32" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowCyan)"/>
      <text x="200" y="18" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">Cycle Witness</text>

      <!-- Frontier Box -->
      <rect x="20" y="110" width="340" height="75" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="35" y="132" fill="#34d399" font-size="11.5" font-weight="700">Active Frontier Tracker</text>
      <text x="35" y="150" fill="#a7f3d0" font-size="9.5">&#8226; Frontier set: F_k = {s' | s &#8594; s' &#8743; s' &#8713; Visited}</text>
      <text x="35" y="167" fill="#a7f3d0" font-size="9.5">&#8226; F_k = &#8709; &#8658; Trajectory Exhausted &#183; Halting Declared</text>

      <!-- Bottom Card -->
      <rect x="20" y="205" width="340" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="190" y="223" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle">Reach*.cycles Classified Across All Runs</text>
      <text x="190" y="238" fill="#34d399" font-size="9.5" text-anchor="middle">Provable Cycle Elimination in Finite Relational Graphs</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">CYCLE_FRONTIER_PROVED</tspan> | Engine: <tspan fill="#e2e8f0">H3V7N5QF Reach</tspan> | Halting: <tspan fill="#38bdf8">Exact Bounds</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-013 Analog</tspan></text>
  </g>

</svg>
