<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <defs>
    <!-- Background & Grid -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1.0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stroke-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stroke-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="940" height="580" fill="#0b0f19"/>
  <rect width="940" height="580" fill="url(#bg-glow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>

  <!-- Top Header / Navigation -->
  <g id="header" transform="translate(40, 30)">
    <rect x="0" y="0" width="860" height="60" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="8" height="60" rx="4" fill="url(#emerald-glow)"/>
    
    <text x="25" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1.5">LEVEL 19 • ROUND R1 CANCELLATION</text>
    <text x="25" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Single-Sentence Demand Injection &amp; Signed Token Annihilation</text>
    
    <rect x="670" y="15" width="170" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="685" cy="30" r="4" fill="#10b981" filter="url(#glow-emerald)"/>
    <text x="698" y="35" font-family="monospace" font-size="11" font-weight="600" fill="#a7f3d0">CANCELLATION R1</text>
  </g>

  <!-- Left Column: Formal Specification -->
  <g id="left-col" transform="translate(40, 105)">
    <rect x="0" y="0" width="370" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 350 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">FORMAL SPECIFICATION (LEAN 4)</text>

    <!-- Code Block -->
    <rect x="15" y="48" width="340" height="150" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="70" font-family="monospace" font-size="11" fill="#64748b">-- Round R1 Signed Cancellation</text>
    <text x="25" y="90" font-family="monospace" font-size="11" fill="#f43f5e">inductive <tspan fill="#38bdf8">SignedToken</tspan> where</text>
    <text x="35" y="108" font-family="monospace" font-size="11" fill="#e2e8f0">  | pos : CarrierNode → SignedToken</text>
    <text x="35" y="126" font-family="monospace" font-size="11" fill="#e2e8f0">  | neg : CarrierNode → SignedToken</text>
    <text x="25" y="148" font-family="monospace" font-size="11" fill="#10b981">theorem <tspan fill="#e2e8f0">annihilation_preserves_reach</tspan> :</text>
    <text x="35" y="166" font-family="monospace" font-size="11" fill="#a855f7">  pos u + neg u = 0 ∧ ReachR1 (s \ {u})</text>
    <text x="35" y="184" font-family="monospace" font-size="11" fill="#a855f7">  ∧ bounded_mass (clean s)</text>

    <!-- Axiomatic Invariants -->
    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">ESTATE ARCHITECTURE / INVARIANTS</text>
    
    <g transform="translate(20, 235)">
      <circle cx="5" cy="10" r="3" fill="#10b981"/>
      <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Single-Sentence Injection:</tspan> One demand sentence</text>
      <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">"Introduce signed cancellation to suppress leftover mass"</text>

      <circle cx="5" cy="45" r="3" fill="#06b6d4"/>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Signed Carrier:</tspan> Positive and negative tokens</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Pairwise annihilation: pos(x) + neg(x) ↦ ∅</text>

      <circle cx="5" cy="80" r="3" fill="#8b5cf6"/>
      <text x="18" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">Mass Suppression:</tspan> Stops unbounded growth</text>
      <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Leftovers are eliminated, restoring finite diameter</text>

      <circle cx="5" cy="115" r="3" fill="#f59e0b"/>
      <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-weight="600" fill="#f8fafc">MSS-066 Parity:</tspan> Discrete deformation calculus</text>
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Involution-based inverse operation in operational trace</text>
    </g>
  </g>

  <!-- Right Column: Operational Diagram -->
  <g id="right-col" transform="translate(430, 105)">
    <rect x="0" y="0" width="470" height="400" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    
    <path d="M 20 35 L 450 35" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">PAIRWISE TOKEN ANNIHILATION ENGINE</text>

    <!-- Operational Annihilation Graphic -->
    <g transform="translate(30, 60)">
      
      <!-- Left: Positive Token -->
      <g transform="translate(60, 50)">
        <circle cx="35" cy="35" r="30" fill="#0c4a6e" stroke="#06b6d4" stroke-width="2"/>
        <text x="35" y="42" font-family="monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">+t</text>
        <text x="35" y="80" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">pos(token)</text>
      </g>

      <!-- Collision / Reaction Zone -->
      <g transform="translate(170, 70)">
        <circle cx="20" cy="15" r="22" fill="#064e3b" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="20" y="20" font-family="monospace" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">⨂</text>
        <text x="20" y="50" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">Annihilate</text>
      </g>

      <!-- Right: Negative Token -->
      <g transform="translate(245, 50)">
        <circle cx="35" cy="35" r="30" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
        <text x="35" y="42" font-family="monospace" font-size="20" font-weight="700" fill="#fb7185" text-anchor="middle">-t</text>
        <text x="35" y="80" font-family="monospace" font-size="10" fill="#fda4af" text-anchor="middle">neg(token)</text>
      </g>

      <line x1="125" y1="85" x2="165" y2="85" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
      <line x1="245" y1="85" x2="215" y2="85" stroke="#f43f5e" stroke-width="2"/>

      <!-- Downward Arrow to Empty Token -->
      <line x1="190" y1="110" x2="190" y2="155" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

      <!-- Clean Resulting State -->
      <g transform="translate(70, 170)">
        <rect x="0" y="0" width="240" height="90" rx="8" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
        <text x="12" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">RESULT: VACUUM GROUND STATE</text>
        <text x="12" y="45" font-family="monospace" font-size="10" fill="#e2e8f0">pos(t) + neg(t) ↦ ∅ (Zero Leftover)</text>
        <text x="12" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Graph Mass Reduced: Δ = -2</text>
        <text x="12" y="80" font-family="monospace" font-size="9" fill="#6ee7b7">Reachability preserved on cleaned core</text>
      </g>

    </g>
  </g>

  <!-- Bottom Operational Status Bar -->
  <g id="status-bar" transform="translate(40, 520)">
    <rect x="0" y="0" width="860" height="35" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="22" font-family="monospace" font-size="11" fill="#64748b">INVARIANT:</text>
    <text x="95" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">Single-Sentence Demand Injection (Signed Cancellation)</text>

    <text x="490" y="22" font-family="monospace" font-size="11" fill="#64748b">PARITY ANCHOR:</text>
    <text x="590" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#10b981">MSS-066 (Deformation Inverse)</text>

    <rect x="730" y="8" width="115" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="740" y="22" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">MASS PURGED</text>
  </g>
</svg>
