<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 01: Embed</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Embedding: Second Relation</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorem: proj_ofR9_false</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 1: Single Relation Assertion &amp; Embedding</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Embedding the Initial Relation and Definitional Projection Recovery</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Relation Embedding Theorem</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">R_base &#8834; R_ext &#8743; proj(R_ext, r_1) = R_base</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">proj_ofR9_false = rfl   [Definitional]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Definitional Recovery (rfl):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">The second relation embeds simply into state;</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">projection back to base relation is definitional reflexivity.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Absence of Complex Quotients:</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Unlike 19L57G1's elaborate canonical isomorphism,</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">H3V7N5QF uses bare relational projection at Level 1.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Empty Never Returned:</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Theorem <tspan fill="#38bdf8" font-family="monospace">empty_never_returned</tspan>: state evolution</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">never collapses the carrier back to the empty set.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Relational Sub-carrier Projection</text>

    <g transform="translate(30, 50)">
      <!-- Outer Extended State Box -->
      <rect x="20" y="10" width="370" height="130" rx="8" fill="#1e1b4b" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
      <text x="40" y="32" fill="#a5b4fc" font-size="11.5" font-weight="700">Extended State (Two Relations: r_1, r_2)</text>

      <circle cx="100" cy="80" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="100" y="84" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">a</text>
      <line x1="120" y1="75" x2="260" y2="75" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <text x="190" y="70" fill="#38bdf8" font-size="10" text-anchor="middle">r_1</text>
      <line x1="120" y1="90" x2="260" y2="90" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowCyan)"/>
      <text x="190" y="105" fill="#c084fc" font-size="10" text-anchor="middle">r_2</text>
      <circle cx="280" cy="80" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="280" y="84" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">b</text>

      <!-- Projection Arrow Down -->
      <line x1="200" y1="145" x2="200" y2="185" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <text x="260" y="168" fill="#34d399" font-size="10" font-weight="600">proj(r_1)</text>

      <!-- Projected Base Box -->
      <rect x="20" y="190" width="370" height="80" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="40" y="212" fill="#34d399" font-size="11.5" font-weight="700">Projected Base State (r_1 Only)</text>
      <circle cx="100" cy="240" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="100" y="244" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">a</text>
      <line x1="118" y1="240" x2="262" y2="240" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCyan)"/>
      <circle cx="280" cy="240" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="280" y="244" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">b</text>
      <text x="325" y="244" fill="#a7f3d0" font-size="9.5">Exact Match</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">PROJECTION_LEAN_PROVED</tspan> | Proof: <tspan fill="#e2e8f0">Definitional (rfl)</tspan> | Terms: <tspan fill="#38bdf8">Bare Identifiers</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-001 Analog</tspan></text>
  </g>

</svg>
