<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="url(#bgGlow)"/>
  <rect width="940" height="580" fill="url(#grid)"/>
  <rect x="16" y="16" width="908" height="548" rx="12" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Banner / Badges -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82" y="16" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Ongoing Level 07: Graphs</text>

    <rect x="175" y="0" width="165" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="257" y="16" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Universal Graph Closure</text>

    <rect x="350" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <text x="432" y="16" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Theorems: D9 &amp; N5</text>

    <rect x="525" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="595" y="16" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">AuthorityEffect: None</text>

    <text x="0" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.2">Level 7: Universal Loop-Free Graph Reachability</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" font-weight="400">Theorem D9 Proves Every Finite Loop-Free Directed Graph is Reachable from the Seed</text>
  </g>

  <!-- Left Box: Inference and Formal Rules -->
  <g transform="translate(32, 115)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Universal Reachability &amp; Negative Closure</text>

    <!-- Rule Fraction -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="350" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="175" y="30" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle" font-family="monospace">G &#8712; FiniteDirectedGraphs &#8743; LoopFree(G)</text>
      <line x1="25" y1="44" x2="325" y2="44" stroke="#e2e8f0" stroke-width="1.8"/>
      <text x="175" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">Reachable(s_0, G)   [Theorem_D9]</text>
    </g>

    <!-- Detailed Notes -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Theorem D9 (Universal Generation):</text>
      <text x="16" y="34" fill="#94a3b8" font-size="11">Derivation 9 proves that ANY finite loop-free directed</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">graph can be generated by a sequence of the four atomic changes.</text>

      <text x="0" y="78" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Theorem N5 (Negative Closure Ceiling):</text>
      <text x="16" y="96" fill="#94a3b8" font-size="11">Nothing beyond loop-free graphs follows;</text>
      <text x="16" y="112" fill="#94a3b8" font-size="11">hyperedges, continuous metrics, and loops are barred.</text>

      <text x="0" y="140" fill="#e2e8f0" font-size="12" font-weight="600">&#8226; Theorem D10 (Obstruction Soundness):</text>
      <text x="16" y="158" fill="#94a3b8" font-size="11">Answering an obstruction reaches no state outside</text>
      <text x="16" y="174" fill="#94a3b8" font-size="11">the closure of D9; obstructions do not leak invalid topology.</text>
    </g>
  </g>

  <!-- Right Box: Operational Diagram (Arbitrary Graph Reachable) -->
  <g transform="translate(460, 115)">
    <rect x="0" y="0" width="448" height="380" rx="8" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="448" height="36" rx="8" fill="#1e293b" fill-opacity="0.8"/>
    <text x="16" y="23" fill="#f8fafc" font-size="12" font-weight="700">Arbitrary Loop-Free Directed Graph Construction</text>

    <g transform="translate(40, 45)">
      <!-- Target Arbitrary Graph Nodes -->
      <circle cx="80" cy="40" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="44" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">v_1</text>

      <circle cx="240" cy="40" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="240" y="44" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">v_2</text>

      <circle cx="330" cy="130" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="330" y="134" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">v_3</text>

      <circle cx="160" cy="160" r="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <text x="160" y="164" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">v_4</text>

      <circle cx="50" cy="140" r="16" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="50" y="144" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">v_5</text>

      <!-- Directed Arcs -->
      <line x1="98" y1="40" x2="220" y2="40" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="250" y1="52" x2="315" y2="118" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="315" y1="135" x2="180" y2="155" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="145" y1="155" x2="68" y2="142" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="60" y1="125" x2="75" y2="58" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <line x1="85" y1="55" x2="150" y2="145" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowCyan)"/>

      <!-- Bottom Invariant Summary -->
      <rect x="15" y="210" width="350" height="65" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
      <text x="190" y="232" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Universal Graph Closure Proved in Lean 4</text>
      <text x="190" y="248" fill="#a7f3d0" font-size="9.5" text-anchor="middle">All Finite Digraphs | Strict Irreflexivity Preserved</text>
      <text x="190" y="262" fill="#fde68a" font-size="9" text-anchor="middle">N5 Closure: Expressive Ceiling Firmly Fenced</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(32, 510)">
    <rect x="0" y="0" width="876" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-size="11">Formal Status: <tspan fill="#34d399" font-weight="700">D9_REACHABILITY_PROVED</tspan> | Engine: <tspan fill="#e2e8f0">H3V7N5QF Derivation 9</tspan> | Coverage: <tspan fill="#38bdf8">All Loop-Free Graphs</tspan> | MSS Anchor: <tspan fill="#fbbf24">MSS-007 Analog</tspan></text>
  </g>

</svg>
