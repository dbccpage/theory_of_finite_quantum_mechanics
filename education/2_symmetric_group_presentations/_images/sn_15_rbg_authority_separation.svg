<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E15: Scoped Evidence and Licensed Change</title>
<desc id="desc">Proposal: State a claim together with its domain and assumptions. Evaluation: Check its witness within that exact scope. Authorization: A separate policy decision permits a requested change.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E15: Scoped Evidence and Licensed Change</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Proposal</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">State a claim together with its</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">domain and assumptions.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Evaluation</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Check its witness within that</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">exact scope.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Authorization</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">A separate policy decision</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">permits a requested change.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
