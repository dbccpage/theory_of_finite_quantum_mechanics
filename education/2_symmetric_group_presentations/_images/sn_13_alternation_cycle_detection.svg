<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E13: Fuel, Repetition, and Termination</title>
<desc id="desc">Budget stop: One step on u → v → accept returns UNKNOWN at v. Full-state loop: u → v → u with neither terminal proves periodicity. Missing state: Repeating an observation alone does not prove a machine loop.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E13: Fuel, Repetition, and Termination</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Budget stop</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">One step on u → v → accept</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">returns UNKNOWN at v.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Full-state loop</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">u → v → u with neither terminal</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">proves periodicity.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Missing state</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Repeating an observation alone</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">does not prove a machine loop.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
