<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E10: Minimum Observation Refinement</title>
<desc id="desc">Collapsed data: q(a)=q(b)=q(c); require all three pairs separated. Refinement: q′(x)=(q(x),t(x)); first projection recovers q. Minimum: Three tag values, or two binary coordinates, are necessary.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E10: Minimum Observation Refinement</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Collapsed data</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">q(a)=q(b)=q(c); require all</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">three pairs separated.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Refinement</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">q′(x)=(q(x),t(x)); first</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">projection recovers q.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Minimum</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Three tag values, or two binary</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">coordinates, are necessary.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
