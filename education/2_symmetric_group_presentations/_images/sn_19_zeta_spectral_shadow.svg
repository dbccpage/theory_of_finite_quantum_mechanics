<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Integer complex</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Z --2→ Z --0→ Z; H₁=Z/2Z.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
