<title id="title">Example E19: Coefficient Changes That Erase an Obstruction</title>
<desc id="desc">Integer complex: Z --2→ Z --0→ Z; H₁=Z/2Z. Rational coefficients: Over Q, ∂₂(1/2)=1 and H₁=0. Integral question: The rational witness is not an integer repair.</desc>
