<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E07: finite symbolic dynamics</title>
<desc id="desc">Finite graph: B(k,m): words of length m; edges bw → wa. Transfer: (Lf)(v) = sum over u → v of f(u); spectral radius k. Orbit: Primitive means least positive rotation period equals word length.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E07: finite symbolic dynamics</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Finite graph</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">B(k,m): words of length m; edges</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">bw → wa.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Transfer</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">(Lf)(v) = sum over u → v of</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">f(u); spectral radius k.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Orbit</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Primitive means least positive</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">rotation period equals word</text>
<text x="746" y="182" font-family="sans-serif" font-size="16" fill="#243b53">length.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
