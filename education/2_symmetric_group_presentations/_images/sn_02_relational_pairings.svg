<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(2): opaque retention and observational collapse</title>
<desc id="desc">Opaque source data: Reading L retains &lt;a&gt; and &lt;ab&gt; as two whole tokens. Observation: With no instances, their profiles collapse. Later interpretation: The local pair parser gives &lt;ab&gt; structure; the source does not.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(2): opaque retention and observational collapse</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Opaque source data</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Reading L retains &lt;a&gt; and &lt;ab&gt;</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">as two whole tokens.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Observation</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">With no instances, their</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">profiles collapse.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Later interpretation</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">The local pair parser gives &lt;ab&gt;</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">structure; the source does not.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
