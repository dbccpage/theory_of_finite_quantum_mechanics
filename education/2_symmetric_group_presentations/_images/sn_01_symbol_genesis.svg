<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">S(1): supply and admission are different events</title>
<desc id="desc">Supply: Supply(&lt;a&gt;) leaves the admitted regime unchanged. Explicit admission: AdmitDatum(&lt;a&gt;) can create one datum under the selected reading. Demand: A context or separation request is a separate recorded input.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">S(1): supply and admission are different events</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Supply</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Supply(&lt;a&gt;) leaves the admitted</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">regime unchanged.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Explicit admission</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">AdmitDatum(&lt;a&gt;) can create one</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">datum under the selected</text>
<text x="396" y="182" font-family="sans-serif" font-size="16" fill="#243b53">reading.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Demand</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">A context or separation request</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">is a separate recorded input.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
