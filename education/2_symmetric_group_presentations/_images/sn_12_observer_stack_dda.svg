<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E12: Local Potentials &amp; Global Obstruction</title>
<desc id="desc">Local witness: Edges (ab,bc,ca); x=(1,0,0); g=(0,1,1) fits the path. Invariant: I(x)=x_ab+x_bc+x_ca; I(d₀g)=0. Obstruction: I(x)=1, so no global integer or rational potential exists.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E12: Local Potentials &amp; Global Obstruction</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Local witness</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Edges (ab,bc,ca); x=(1,0,0);</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">g=(0,1,1) fits the path.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Invariant</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">I(x)=x_ab+x_bc+x_ca; I(d₀g)=0.</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Obstruction</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">I(x)=1, so no global integer or</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">rational potential exists.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
