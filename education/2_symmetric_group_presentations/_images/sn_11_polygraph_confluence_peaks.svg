<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Example E11: Priced Joins of Divergent Reductions</title>
<desc id="desc">Fork: u → v and u → w; v and w initially terminal. One-rule response: Add v → w (or symmetrically w → v). Different response class: A fresh join costs one term and two rules.</desc>
<rect width="1080" height="310" fill="#f8fafc"/>
<text x="30" y="42" font-family="sans-serif" font-size="22" fill="#102b46">Example E11: Priced Joins of Divergent Reductions</text>
<rect x="30" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="46" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Fork</text>
<text x="46" y="136" font-family="sans-serif" font-size="16" fill="#243b53">u → v and u → w; v and w</text>
<text x="46" y="159" font-family="sans-serif" font-size="16" fill="#243b53">initially terminal.</text>
<rect x="380" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="396" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">One-rule response</text>
<text x="396" y="136" font-family="sans-serif" font-size="16" fill="#243b53">Add v → w (or symmetrically w →</text>
<text x="396" y="159" font-family="sans-serif" font-size="16" fill="#243b53">v).</text>
<rect x="730" y="75" width="320" height="173" rx="8" fill="#ffffff" stroke="#8398ae"/>
<text x="746" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#102b46">Different response class</text>
<text x="746" y="136" font-family="sans-serif" font-size="16" fill="#243b53">A fresh join costs one term and</text>
<text x="746" y="159" font-family="sans-serif" font-size="16" fill="#243b53">two rules.</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#465b70">Declared construction; source and verification scope are stated in the linked lesson.</text>
</svg>
